[[dialogue]]
speaker = "unk"
original = "第１話,もじもじセッシー,P"
translation = "제1화, 머뭇머뭇 세씨,"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「いや～、それにしてもその衣装はセッシーにぴったりだね☆\u3000妖精さん味が増してるっていうか、よりファンシーってゆーか♪」"
translation = "「이야~, 그나저나 그 의상은 세씨한테 딱이네☆ 요정 느낌이 더 늘어났다고 해야 하나, 더 팬시하다고 해야 하나♪」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ふふっ、ありがとう。紅明ママ♪\u3000紅明ママに褒めてもらえると心が浮ついてしまうわ♪」"
translation = "「후훗, 고마워. 코메이 엄마♪ 코메이 엄마한테 칭찬받으니까 마음이 둥둥 떠버려♪」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「こっちに来てよ、セッシー♪\u3000この可愛さ、たまらないね～！\u3000無限に撫でてあげたくなっちゃうぜ！」"
translation = "「이쪽으로 와, 세씨♪ 이 귀여움, 참을 수가 없네~! 무한으로 쓰다듬어 주고 싶어진다고!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ふふふ、ママ～♪\u3000セシアも紅明ママにずーっと甘えたいの～♪\u3000たくさん甘えさせて～<emoji=heart04>」"
translation = "「후후후, 엄마~♪ 세시아도 코메이 엄마한테 느~읏하게 어리광 부리고 싶어~♪ 마음껏 어리광 부리게 해줘~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "紅明とセシアはいつものようにじゃれ合っていた。"
translation = "코메이와 세시아는 평소처럼 장난치고 있었다."

[[dialogue]]
speaker = "unk"
original = "そんなやり取りもしばらくして……"
translation = "그런 주고받음도 잠시 후……"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「どうしたのセッシー？\u3000もしかしてアタシの撫で方、激しすぎたかい？」"
translation = "「왜 그래 세씨? 혹시 내가 쓰다듬는 게 너무 격했나?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「あ、いいえ！\u3000紅明ママのせいではないのよ。ママに甘えることはわたくしにとって至高の喜び……それは変わらないのだけど……」"
translation = "「아, 아니에요! 코메이 엄마 탓이 아니에요. 엄마한테 어리광 부리는 것은 저에게 있어 최고의 기쁨…… 그건 변함없지만……」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「セッシーらしくない浮かない表情しちゃって……何があったの？」"
translation = "「세씨답지 않게 침울한 표정을 지어가지고…… 무슨 일 있었어?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「実は、その……会長のことで……」"
translation = "「실은, 그게…… 회장님 일로……」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ダーリンのこと？\u3000ラブラブだって思ってたけど何かあったのかい？」"
translation = "「달링 일? 꽁냥꽁냥하다고 생각했는데 무슨 일이라도 있었어?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「何かあったというわけではないのだけど……この衣装を、会長にまだ見せられていないのよ」"
translation = "「딱히 무슨 일이 있었던 건 아닌데…… 이 의상을 회장에게 아직 보여주지 못했어」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「えっ、まだ見せてなかったのかい？\u3000ああ、そっかあ……星徒会、最近ずっと忙しそうだったもんな～」"
translation = "「앗, 아직 안 보여준 거야? 아아, 그렇구나…… 성도회, 최근 계속 바빠 보였지~」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そうなの。本当ならルヴィネさまと契約して、この姿になったその日に見せに行きたかったのだけど……なかなかタイミングが合わなくて」"
translation = "「그래. 원래대로라면 루비네 님과 계약해서, 이 모습이 된 그날 보여주러 가고 싶었지만…… 좀처럼 타이밍이 맞지 않아서」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「まだ会えてないんだ」"
translation = "「아직 못 만났구나」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「でも、それならすぐ見せにいっちゃえば？\u3000今なら星徒会室にいると思うよ。ダーリン優しいし、絶対喜んでくれるって！」"
translation = "「하지만, 그렇다면 지금 바로 보여주러 가면 되잖아? 지금이라면 성도회실에 있을 거라고 생각해. 달링은 다정하니까, 틀림없이 기뻐해 줄 거야!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ありゃ？\u3000そうでもない感じ？」"
translation = "「어라? 그런 느낌이 아닌가?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「言葉にするのが難しいわ。紅明ママの言う通り、確かにこのまま訪ねればいいだけなのだけど」"
translation = "「말 표현하기가 어렵네. 코메이 엄마가 말한 대로, 확실히 이대로 찾아가기만 하면 되는 것이긴 한데」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「せっかく新しい姿のわたくしだもの。どうせなら会長に喜んでもらえるようなお披露目の仕方ができないかしら、と思って……」"
translation = "「모처럼 새로운 모습의 나인걸. 이왕이면 회장이 기뻐할 만한 방식으로 피로할 수 없을까, 싶어서……」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「なるほど～。普通に会うんじゃ味気ないってことか」"
translation = "「과연~. 평범하게 만나는 건 심심하다는 뜻인가」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そうなのよ。そのためのちょうどいい機会があればいいのだけれど……なかなか来なくって……」"
translation = "「그렇단다. 그러기 위한 딱 좋은 기회가 있으면 좋겠지만…… 좀처럼 오질 않아서……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「以前までのわたくしなら、そのまま会長を訪ねるだけで済んだはずなのに」"
translation = "「이전까지의 나라면, 그대로 회장을 찾아가는 것으로 끝났을 텐데」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「なぜかしら。力の一部を取り戻して……知識は前よりも蓄積されているはずなのに……及び腰になってしまうのは」"
translation = "「왜일까. 힘의 일부를 되찾아서…… 지식은 전보다 축적되어 있을 터인데…… 머뭇거리게 되어버리는 것은」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「わかるよ、その気持ち！\u3000せっかくのおめかしだったらとっておきの披露をしたい──女の子たるものそう思っちゃうよな！」"
translation = "「알아, 그 기분! 모처럼 앤틱하게 차려입었으면 특별하게 선보이고 싶다── 여자아이라면 그렇게 생각해 버리지!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "（ん？\u3000でも、これってセッシーにそういう『女の子』な感情がちゃんと芽生えてるってこと……？）"
translation = "(응? 하지만, 이건 세시에게 그런 『여자아이』 같은 감정이 제대로 싹텄다는 뜻 아닌가……?)"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「わかってくれるのね、紅明ママ！」"
translation = "「알아주는구나, 코메이 엄마!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ふむふむ……なるほど……」"
translation = "「흠흠…… 과연……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「どうかしら、紅明ママ」"
translation = "「어떠니, 코메이 엄마」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「事態は把握したぜい☆\u3000でもねセッシー、アタシはやっぱりセッシーらしく、素直にぶつかっていくべきだと思うんだ」"
translation = "「사태는 파악했다구☆ 하지만 말야 세시, 아타시는 역시 세시다운 모습으로, 솔직하게 부딪쳐야 한다고 생각해」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「あら……そう？」"
translation = "「어머…… 그래?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「うん！\u3000だってセッシーは、いつだって素直に行動してきたっしょ。だからダーリンも、素直なセッシーを期待してるんじゃないかなって♪」"
translation = "「응! 그야 세시는 언제나 솔직하게 행동해 왔잖아. 그러니까 달링도, 솔직한 세시를 기대하고 있지 않을까 해서♪」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「！\u3000そう……そうかもしれないわ。紅明ママに言われたら、なんだかそんな気がしてきたわ」"
translation = "「! 그래…… 그럴지도 모르겠네. 코메이 엄마가 그렇게 말하니, 왠지 그런 생각이 들기 시작했어」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ありのままのわたくしを会長に見てもらう。それが１番なのかも。紅明ママのおかげで決心が固まったわ」"
translation = "「있는 그대로의 나를 회장에게 보여준다. 그게 1번일지도. 코메이 엄마 덕분에 결심이 섰어」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「うんうん、いつだってセッシーらしく、な♪\u3000きっとダーリンもそのままのセッシーが好きなはずだからさ♪」"
translation = "「응응, 언제나 세시다운 모습으로, 말이지♪ 틀림없이 달링도 그대로의 세시를 좋아할 테니까♪」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ん～、ありがとう紅明ママ！\u3000わたくし、思わずバブみが溢れちゃうわ～♪」"
translation = "「응~, 고마워 코메이 엄마! 나, 모르게 모성애가 넘쳐버려~♪」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「もう、こーら。今、甘えるのはアタシじゃなくてダーリンでしょー？」"
translation = "「이리노, 어라라. 지금 어리광 부릴 상대는 아타시가 아니라 달링이잖아~?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「はっ、それもそうね！」"
translation = "「앗, 그것도 그렇네!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「じゃあ、さっそく会長のもとへ行ってくるわ。じゃあね紅明ママ、また後で会いましょう♪」"
translation = "「그럼, 곧바로 회장에게 다녀올게. 그럼 안녕 코메이 엄마, 나중에 또 봐♪」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ん！\u3000いってこいセッシー！」"
translation = "「응! 다녀와 세시!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「せっかくの新衣装……恋人のために特別な披露をしたい……か……」"
translation = "「모처럼의 새 의상…… 연인을 위해 특별한 선보임을 하고 싶다…… 라……」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ん～♪\u3000これはなんともまた──いい傾向だねえ♪」"
translation = "「응~♪ 이건 정말이지 또── 좋은 경향이네♪」"

[[dialogue]]
speaker = "unk"
original = "しみじみと漏らす紅明の様子は、まさしく娘を持つ<ruby>母<rt>ママ</rt></ruby>のようだったとか……。"
translation = "절절히 읊조리는 코메이의 모습은, 그야말로 딸을 둔 <ruby>어머니<rt>엄마</rt></ruby> 같았다고 한다……."

