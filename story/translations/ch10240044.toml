[[dialogue]]
speaker = "unk"
original = "第４話,もう１度素直に,P"
translation = "제4화, 다시 한번 솔직하게, P"

[[dialogue]]
speaker = "unk"
original = "『花嫁修業』をした後、俺はヨミと自室へと移動していた。"
translation = "『신부 수업』을 마친 후, 나는 요미와 함께 내 방으로 이동해 있었다."

[[dialogue]]
speaker = "unk"
original = "すると、ヨミはエクスノヴァフォームへ変身をしてみせる。"
translation = "그러자, 요미는 엑스노바 폼으로 변신해 보인다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――会長。その……今日は、エクスノヴァフォームの訓練をお願いしたくて……<emoji=heart04>」"
translation = "「――회장님. 그…… 오늘은, 엑스노바 폼 훈련을 부탁드리고 싶어서……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「アルケインコードを受けて覚醒したフォームは、『絆の力』によって性能が向上するんですよね？」"
translation = "「아르케인 코드를 받고 각성한 폼은, 『인연의 힘』에 의해 성능이 향상되는 거죠?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ですので、その……<emoji=heart04>」"
translation = "「그러니까, 그……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "もじもじと指先を擦り合わせながら、ヨミは恥ずかしそうに言葉に詰まる。"
translation = "머뭇머뭇 손가락 끝을 부비면서, 요미는 부끄러운 듯 말을 잇지 못한다."

[[dialogue]]
speaker = "unk"
original = "絆を深める為の訓練ってことかな？"
translation = "인연을 깊게 다지기 위한 훈련이라는 뜻일까?"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「は、はい……<emoji=heart04>」"
translation = "「네, 네……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――え？\u3000ウェディングフォームの時はもっと積極的だったのに……ですか？」"
translation = "「――네? 웨딩 폼일 때는 좀 더 적극적이었는데…… 인가요?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そ、それはですね……あの時は精神が高揚していたというか……<emoji=heart04>」"
translation = "「그, 그건 말이죠…… 그때는 정신이 고양되어 있었다고 해야 할까……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「アニマ先輩によると、ウェディングフォームには、ジューンブライドの季節になると普段より大胆になってしまう副次効果があるらしくて……<emoji=heart04>」"
translation = "「아니마 선배에 따르면, 웨딩 폼에는 6월의 신부 계절이 되면 평소보다 대담해져 버리는 부작용이 있는 것 같아서……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「だから今は、その……あの時みたいに振る舞おうとすると、つい恥ずかしくなってしまって……<emoji=heart04>」"
translation = "「그래서 지금은, 그…… 그때처럼 행동하려고 하면, 그만 부끄러워져 버려서……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "その時だった。"
translation = "바로 그때였다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「えっ！？\u3000『破邪の鈴』が……！？」"
translation = "「앗!? 『파사의 방울』이……!?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ど、どうして勝手に……！？」"
translation = "「어, 어째서 제멋대로……!?」"

[[dialogue]]
speaker = "unk"
original = "突然現れた破邪の鈴が、音色を響かせる――すると。"
translation = "갑자기 나타난 파사의 방울이 아름다운 소리를 울린다―― 그러자."

[[dialogue]]
speaker_original = "心の声"
speaker_translation = "心の声"
original = "（本当はもっと、会長にくっ付いていたいです……<emoji=heart04>）"
translation = "(사실은 좀 더, 회장님에게 붙어있고 싶어요……<emoji=heart04>)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？」"
translation = "「코얏!?」"

[[dialogue]]
speaker_original = "心の声"
speaker_translation = "心の声"
original = "（近くでいっぱい匂いを嗅ぎたいです……<emoji=heart04>）"
translation = "(가까이서 냄새를 많이 맡고 싶어요……<emoji=heart04>)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こややっ！？」"
translation = "「코야앗!?」"

[[dialogue]]
speaker = "unk"
original = "ヨミの心の声が聞こえてくる……？"
translation = "요미의 속마음이 들어온다……?"

[[dialogue]]
speaker = "unk"
original = "これは……"
translation = "이건……"

[[dialogue]]
speaker = "unk"
original = "ヨミが口を開いていないのに、鈴の音と共に感情が頭の中へと響いてきていた。"
translation = "요미가 입을 열지 않았는데도, 방울 소리와 함께 감정이 머릿속으로 울려 퍼지고 있었다."

[[dialogue]]
speaker_original = "心の声"
speaker_translation = "心の声"
original = "（それで、いっぱい尻尾や耳を撫でて、褒めて欲しいです……<emoji=heart04>）"
translation = "(그리고, 꼬리랑 귀를 많이 쓸어넘겨 주며, 칭찬해 줬으면 좋겠어요……<emoji=heart04>)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「う……うぅぅ～～っ！\u3000ば、爆裂恥ずかしいです……！」"
translation = "「우…… 우으으～～읏! 폭, 폭렬 부끄러워요……!」"

[[dialogue]]
speaker = "unk"
original = "顔を真っ赤にしてうずくまるヨミ。けれど俺は笑わなかった。"
translation = "얼굴을 새빨갛게 물들이며 웅크리는 요미. 하지만 나는 웃지 않았다."

[[dialogue]]
speaker = "unk"
original = "ヨミの素直な気持ちが聞けて、俺は嬉しい"
translation = "요미의 솔직한 마음을 들을 수 있어서, 나는 기쁘다"

[[dialogue]]
speaker = "unk"
original = "大丈夫だよ"
translation = "괜찮아"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000か、会長……<emoji=heart04>」"
translation = "「코얏!? 회, 회장님……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺はそっとヨミを抱き寄せ、頭や尻尾を優しく撫でる。"
translation = "나는 살며시 요미를 끌어안고, 머리와 꼬리를 다정하게 다듬어 준다."

[[dialogue]]
speaker = "unk"
original = "そして、耳元で囁いた。"
translation = "그리고, 귓가에 속삭였다."

[[dialogue]]
speaker = "unk"
original = "いっぱい匂いを嗅いでいいよ"
translation = "냄새는 마음껏 맡아도 돼"

[[dialogue]]
speaker = "unk"
original = "遠慮せず、ヨミのしたいように"
translation = "부담 갖지 말고, 요미가 하고 싶은 대로 해"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こややっ……<emoji=heart04>\u3000はうぅ……<emoji=heart04>」"
translation = "「코야앗……<emoji=heart04> 하아으……<emoji=heart04>」"

[[dialogue]]
speaker_original = "心の声"
speaker_translation = "心の声"
original = "（は、恥ずかしいけど、でも……<emoji=heart04>）"
translation = "(부, 부끄럽지만, 하지만……<emoji=heart04>)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長……<emoji=heart04>\u3000くんくん……<emoji=heart04>」"
translation = "「회장님……<emoji=heart04> 킁킁……<emoji=heart04>」"

[[dialogue]]
speaker_original = "心の声"
speaker_translation = "心の声"
original = "（はあぁ……<emoji=heart04>\u3000会長に抱きしめられながら匂いを嗅ぐの……幸せぇ……<emoji=heart04>）"
translation = "(하아아……<emoji=heart04> 회장님에게 안긴 채로 냄새를 맡는 거…… 행복해……<emoji=heart04>)"

[[dialogue]]
speaker = "unk"
original = "その他にもして欲しいこと、ある？"
translation = "그 외에도 해줬으면 하는 거, 있어?"

[[dialogue]]
speaker_original = "心の声"
speaker_translation = "心の声"
original = "（会長にも……私の匂いを嗅いで欲しいです……<emoji=heart04>）"
translation = "(회장님도…… 제 냄새를 맡아주셨으면 좋겠어요……<emoji=heart04>)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――ハッ！？\u3000い、今のは、その……！」"
translation = "「――앗!? 방, 방금 건, 그……!」"

[[dialogue]]
speaker = "unk"
original = "俺は慌てるヨミを見て、微笑む。"
translation = "나는 당황하는 요미를 보며 미소 짓는다."

[[dialogue]]
speaker = "unk"
original = "ヨミ……俺の大好きないい匂いがする"
translation = "요미…… 내가 정말 좋아하는 좋은 냄새가 나"

[[dialogue]]
speaker = "unk"
original = "……くんくん"
translation = "……킁킁"

[[dialogue]]
speaker = "unk"
original = "俺は抱き締めた彼女の体に鼻を寄せて、望み通りにする。"
translation = "나는 껴안은 그녀의 몸에 코를 가져가, 바라는 대로 해준다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こ――こやややぁ……っ<emoji=heart04>」"
translation = "「코――코야야야……읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミの心臓がドキドキしているのが、密着している体から伝わって来る。"
translation = "요미의 심장이 두근두근거리는 것이, 밀착된 몸을 통해 전해져 온다."

[[dialogue]]
speaker_original = "心の声"
speaker_translation = "心の声"
original = "（会長に、いっぱいキスして欲しいです<emoji=heart04>）"
translation = "(회장님에게, 키스 많이 받았으면 좋겠어요<emoji=heart04>)"

[[dialogue]]
speaker = "unk"
original = "俺はヨミの正面に向き直って、顔を寄せる。"
translation = "나는 요미의 정면을 향해, 얼굴을 가까이 가져간다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あ……会長……<emoji=heart04>」"
translation = "「아…… 회장님……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ん……<emoji=heart04>\u3000ちゅっ……<emoji=heart04>」"
translation = "「응……<emoji=heart04> 쪽……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミの唇にそっと、キスをする。"
translation = "요미의 입술에 살며시, 키스를 한다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「んむ……ちゅっ<emoji=heart04>\u3000んちゅっ……<emoji=heart04>\u3000――はあぁ……<emoji=heart04>」"
translation = "「음…… 쪽<emoji=heart04> 쪽에……<emoji=heart04> ――하아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "心の声"
speaker_translation = "心の声"
original = "（会長に好きって、いっぱい愛の言葉を言って欲しいです<emoji=heart04>）"
translation = "(회장님이 좋아한다고, 사랑한다는 말을 많이 해줬으면 좋겠어요<emoji=heart04>)"

[[dialogue]]
speaker = "unk"
original = "世界で１番愛してる"
translation = "세상에서 제일 사랑해"

[[dialogue]]
speaker = "unk"
original = "――好きだよ、ヨミ"
translation = "――좋아해, 요미"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「～～～っ<emoji=heart04>」"
translation = "「～～～읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「か、会長……<emoji=heart04>」"
translation = "「회, 회장님……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「その……私も……<emoji=heart04>」"
translation = "「그…… 저도……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長のこと、大好きです<emoji=heart04>」"
translation = "「회장님을, 정말 좋아해요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長の匂いを嗅ぐと安心しますし……<emoji=heart04>」"
translation = "「회장님의 냄새를 맡으면 안심이 되고요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「これからもずっと……一緒にいたいです<emoji=heart04>」"
translation = "「앞으로도 계속…… 함께 있고 싶어요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私も世界で１番――愛しています<emoji=heart04>」"
translation = "「저도 세상에서 제일―― 사랑해요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "恥ずかしさに震えながらも、ヨミは最後まで自分の言葉で伝えてくれた。"
translation = "부끄러움에 떨면서도, 요미는 끝까지 자신의 말로 전해 주었다."

[[dialogue]]
speaker = "unk"
original = "ずっと一緒にいよう"
translation = "영원히 함께 있자"

[[dialogue]]
speaker = "unk"
original = "ヨミ、今日は離れたくない"
translation = "요미, 오늘은 떨어지고 싶지 않아"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「っ……！\u3000そ、その言葉……！」"
translation = "「읏……! 그, 그 말……!」"

[[dialogue]]
speaker = "unk"
original = "俺は前に、安倍野神社で破邪の鈴が発動した時のことを、実は覚えていた。"
translation = "나는 전에, 아베노 신사에서 파사의 방울이 발동했을 때의 일을, 사실 기억하고 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「わ、私も……<emoji=heart04>」"
translation = "「저, 저도……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "緊張したように声を上ずらせながら、ヨミはこくりと頷く。"
translation = "긴장한 듯 목소리를 가다듬으며, 요미는 끄덕이고 고개를 끄덕인다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長と一緒に、いたいです……<emoji=heart04>」"
translation = "「회장님과 함께, 있고 싶어요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ん……ちゅっ……<emoji=heart04>」"
translation = "「응…… 쪽……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そうして俺たちは再び、甘いキスを交わすのだった。"
translation = "그렇게 우리들은 다시, 달콤한 키스를 나누는 것이었다."

[[dialogue]]
speaker = "unk"
original = "――翌朝。"
translation = "――다음 날 아침."

[[dialogue]]
speaker = "unk"
original = "俺が目を覚ますと、隣には添い寝しているヨミの姿があった。"
translation = "내가 눈을 떴을 때, 옆에는 곁에 누워 자고 있는 요미의 모습이 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……ん」"
translation = "「……응」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あ……、おはようございます……会長<emoji=heart04>」"
translation = "「아……, 좋은 아침이에요…… 회장님<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "おはよう、ヨミ"
translation = "좋은 아침, 요미"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ん……えへへ……<emoji=heart04>\u3000くんくん……<emoji=heart04>」"
translation = "「응…… 에헤헤……<emoji=heart04> 킁킁……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はあぁ……<emoji=heart04>\u3000幸せな匂いがします……<emoji=heart04>」"
translation = "「하아아……<emoji=heart04> 행복한 냄새가 나요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミは安心したように、俺に体を寄せる。"
translation = "요미는 안심했다는 듯, 나에게 몸을 밀착시킨다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長……これからも――」"
translation = "「회장님…… 앞으로도――」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「たくさん絆を深めていきましょうね♪」"
translation = "「많이 인연을 깊게 다져나가요♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「だって私たちは、ずっと一緒なんですから<emoji=heart04>」"
translation = "「왜냐하면 저희는, 계속 함께니까요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……ちゅっ<emoji=heart04>」"
translation = "「……쪽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "手の指を絡め合って、寝起きのキスを交わしながら、俺はヨミに誓うように、頷くのだった。"
translation = "손가락을 서로 맞잡고, 잠깨는 키스를 나누며, 나는 요미에게 맹세하듯 고개를 끄덕이는 것이었다."

