[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「キャ～～～～～～っ！！？」"
translation = "「캬～～～～～～악!!?」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「つ、強い……！」"
translation = "「강, 강해……！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「そのハイレグの海パン、一体どうなってるのよ！？」"
translation = "「그 하이레그 사각 수영복, 대체 어떻게 되어 있는 거야！？」"

[[dialogue]]
speaker = "unk"
original = "更に出力が１．５倍になっているのだ！"
translation = "더욱 출력이 1.5배가 되어 있는 것이다！"

[[dialogue]]
speaker = "unk"
original = "この海パンは、通常の海パンから"
translation = "이 사각 수영복은, 통상의 사각 수영복에서"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「つまり、通常フォームから２倍×１．５倍で、『３倍』の出力ってこと！？」"
translation = "「즉, 통상 폼에서 2배×1.5배로, 『3배』의 출력이라는 뜻！？」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「くっ……なんてハイレグなの……！」"
translation = "「큭…… 지독한 하이레그잖아……！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「私の水着とは、着用の練度が違う……！」"
translation = "「내 수영복과는, 착용의 숙련도가 달라……！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker = "unk"
original = "もう諦めてしまうのか？"
translation = "벌써 포기해 버리는 건가？"

[[dialogue]]
speaker = "unk"
original = "聖沙は……その水着では勝てないと"
translation = "세이샤는…… 그 수영복으로는 이길 수 없다고"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「……！」"
translation = "「……！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「いいえ。そんなことないわ……」"
translation = "「아니야. 그렇지 않아……」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「この水着は、リア先輩が――お姉様が、すっごく可愛くて素敵だって、褒めてくれたのよ！」"
translation = "「이 수영복은, 리아 선배가―― 언니가, 엄청 귀엽고 멋지다고, 칭찬해 줬단 말야！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「だから、そう簡単に諦めることなんてできない！」"
translation = "「그러니까, 그렇게 쉽게 포기할 수는 없어！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「会長――もう１度勝負よ！」"
translation = "「회장―― 다시 한 번 승부야！」"

