[[dialogue]]
speaker = "unk"
original = "第２話,ハロウィンな守護天使,P"
translation = "제2화, 할로윈 수호천사, P"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「じゃーん♪\u3000見て見て、どうかなこの衣装？」"
translation = "「짜잔♪ 이것 봐, 어때 이 의상?」"

[[dialogue]]
speaker = "unk"
original = "すごい、似合ってる！"
translation = "진짜 잘 어울린다!"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、いいリアクションありがとー♪」"
translation = "「아하하, 좋은 반응 고마워ー♪」"

[[dialogue]]
speaker = "unk"
original = "呼び出されて大聖堂に向かうと、そこには見たことのない衣装に身を包んだ環が待っていた。"
translation = "불려 나와 대성당으로 향하자, 거기에는 본 적 없는 의상을 입은 타마키가 기다리고 있었다."

[[dialogue]]
speaker = "unk"
original = "その服はどうしたのか、と訊ねると……"
translation = "그 옷은 어떻게 된 거냐고 묻자……"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「実は<ruby>守護天使<rt>みんな</rt></ruby>との間で、次の女神のルヴィネさまと再契約しようって話になってるんだけどね」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「その契約をするとボクたちの力にちょっとした影響があるみたいなんだよ」"
translation = "「그 계약을 하면 우리 힘에 약간의 영향이 있는 모양이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「でさ、ボクもルヴィネさまと再契約して新しい力が発現したんだけど、こんな感じの衣装をゲットしちゃったんだ♪」"
translation = "「그래서 말이지, 나도 루비네 님과 재계약해서 새로운 힘이 발현됐는데, 이런 느낌의 의상을 획득해 버렸지 뭐야♪」"

[[dialogue]]
speaker = "unk"
original = "ハロウィン風？"
translation = "할로윈 풍?"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そう♪\u3000今ちょうど、ルヴィネさまがアルタイルに通ってハロウィンのことを勉強中なんだよね」"
translation = "「응♪ 지금 딱 루비네 님이 알타일에 다니면서 할로윈에 대해 공부 중이거든」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「たぶんその影響が出ちゃったんだと思うよ。申し訳なさそうにしてたけど、ボク的にはすっごい気に入ってるんだー♪」"
translation = "「아마 그 영향이 나온 거라고 생각해. 미안해하시긴 했는데, 내 입장에서는 완전 마음에 들거든ー♪」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「そうか。忙しい身の魔王をわざわざ呼び出したのは、ルヴィネ様との契約のことを伝えるためだったか」"
translation = "「그런가. 바쁜 몸인 마왕을 일부러 불러낸 건, 루비네 님과의 계약에 대해 전달하기 위해서였나」"

[[dialogue]]
speaker = "unk"
original = "俺と環のやり取りを黙って見守っていたヒメ、こと守護天使のオオヒメが得心いったという風に頷いた。"
translation = "나와 타마키의 주고받음을 가만히 지켜보던 히메, 즉 수호천사 오오히메가 납득했다는 듯 고개를 끄덕였다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「え……違うよ？\u3000ボクのこのカッコかわいい姿を会長に見てもらいたかっただけだよ？」"
translation = "「에…… 아닌데? 나의 이 멋지고 귀여운 모습을 회장에게 보여주고 싶었을 뿐이야」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「なっ、それだけ！？\u3000それだけのためにわざわざ呼び出したというのか？」"
translation = "「뭣, 그것뿐인가!? 그것만을 위해 일부러 불러냈단 말인가?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん、そうだけど？」"
translation = "「응, 그런데?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「まったく……あなたと魔王がお付き合いしているという話は聞いていたが、恋人同士といえど少しは気を遣うべきなのではないか？」"
translation = "「참 나…… 너와 마왕이 사귀고 있다는 이야기는 들었다만, 연인 사이라 해도 어느 정도는 신경을 써야 하는 것 아닌가?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ん～、そうなのかな？\u3000ボク、会長のこと困らせちゃった？」"
translation = "「음～, 그런가? 나, 회장을 난처하게 만들었어?」"

[[dialogue]]
speaker = "unk"
original = "カッコ可愛い環が見れて嬉しい"
translation = "멋지고 귀여운 타마키를 볼 수 있어서 기뻐"

[[dialogue]]
speaker = "unk"
original = "いや、全然"
translation = "아니, 전혀"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはっ、優しい～っ♪\u3000そんな会長のことも大好きだよっ♪」"
translation = "「아핫, 다정해라～♪ 그런 회장도 정말 좋아해♪」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「くっ！\u3000犬も食わぬとはこの事か……」"
translation = "「큭! 개도 안 먹는다더니 이 꼴을 두고 하는 말인가……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「というか、ワザとやっているだろう、ラクシャ！」"
translation = "「그보다, 일부러 그러는 것이지, 락샤!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いやいや、ワザとなんかじゃないよ。これがボクと会長の自然体だもんねー<emoji=heart04>」"
translation = "「아니아니, 일부러 그러는 거 아니야. 이게 나와 회장의 자연스러운 모습이거든ー<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そう言うと、環は思いっきり抱きついてくる。"
translation = "그렇게 말하며, 타마키는 마음껏 안겨 온다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「むむ……確かにラクシャと魔王は、以前よりそのような距離感で接していた、ような気もするが……」"
translation = "「음…… 확실히 락샤와 마왕은 이전부터 그런 거리감으로 대했던 기분도 들지만……」"

[[dialogue]]
speaker = "unk"
original = "考え込んでしまうヒメ。"
translation = "생각에 잠겨 버리는 히메."

[[dialogue]]
speaker = "unk"
original = "環が挑発するような行動をしているのは、それだけ彼女がからかい甲斐のある相手だからだろう。"
translation = "타마키가 도발적인 행동을 하는 건, 그만큼 그녀가 놀리는 보람이 있는 상대이기 때문이리라."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「時にラクシャよ、ルヴィネ様との契約によって、摂理の維持に支障は出ていないか？」"
translation = "「그건 그렇고 락샤여, 루비네 님와의 계약으로 인해 섭리 유지에 지장이 생기진 않았는가?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ううん、今のところ問題は起きてないよ。オオヒメはどうなの？」"
translation = "「응, 지금까지는 문제 안 일어났어. 오오히메는 어때?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「私の方も問題ない。これならルヴィネ様と他の守護天使たちとの契約を進めても良いかもしれないな」"
translation = "「내 쪽도 문제없다. 이 정도라면 루비네 님과 다른 수호천사들과의 계약을 진행해도 좋을지도 모르겠군」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだね。今はハロウィンパーティーに向けて忙しそうだから難しいかもしれないけど」"
translation = "「그렇네. 지금은 할로윈 파티 준비로 바빠 보여서 힘들지도 모르겠지만」"

[[dialogue]]
speaker = "unk"
original = "ハロウィンパーティー？"
translation = "할로윈 파티?"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ああうん、アルタイルのハロウィン有識者にいろいろ教えてもらって、デネブでもパーティーを開こうとしてるんだ」"
translation = "「아, 응. 알타일의 할로윈 전문가한테 이것저것 배워서 데네브에서도 파티를 열려고 하고 있거든」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それでそのハロウィンパーティーでは、ボクたち守護天使がバンドを組んで演奏することになったんだよ」"
translation = "「그래서 그 할로윈 파티에서는 우리 수호천사들이 밴드를 결성해서 연주하기로 했어」"

[[dialogue]]
speaker = "unk"
original = "面白そうだ！"
translation = "재미있겠네!"

[[dialogue]]
speaker = "unk"
original = "守護天使バンド！？"
translation = "수호천사 밴드!?"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「でしょ～？\u3000会長にもぜひ見に来て欲しいんだけど……会場がデネブだからちょっと厳しいんだよね～」"
translation = "「그렇지～? 회장도 꼭 보러 와 줬으면 좋겠는데…… 회장이 데네브라 좀 힘들겠네～」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「アルタイルでもハロウィンパーティーは開かれる。それに向けて魔王は魔王で忙しいだろうからな」"
translation = "「알타일에서도 할로윈 파티는 열린다. 그걸 위해 마왕은 마왕대로 바쁠 테니까」"

[[dialogue]]
speaker = "unk"
original = "せめて会場がアルタイルであるならば何とかなったかもしれないが、デネブとなると難しい。"
translation = "적어도 회장이 알타일이라면 어떻게든 됐을지도 모르지만, 데네브라면 힘들다."

[[dialogue]]
speaker = "unk"
original = "ヒメの言う通り、俺は俺でいろいろ仕事を抱えているからだ。"
translation = "히메의 말대로, 나는 나대로 여러 가지 일을 떠안고 있기 때문이다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボクもライブに向けてギターの練習をしなくちゃいけないし、会長も忙しいってなると……」"
translation = "「나도 라이브를 향해 기타 연습을 해야 하고, 회장도 바쁘다고 하면……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ハロウィンが終わるまであんまり会えなくなっちゃうかも？\u3000ううぅ～、超寂しいんだけどーっ！」"
translation = "「할로윈이 끝날 때까지 자주 못 만날지도? 우우으～, 엄청 쓸쓸한데ー!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「でもボク、頑張るからね！\u3000ライブを成功させて帰ってきたら、思いっきり褒めて甘えさせてよねっ？\u3000約束だよ！」"
translation = "「하지만 나, 힘낼 테니까! 라이브 성공시키고 돌아오면, 마음껏 칭찬하고 어리광 받아줘야 해? 약속이야!」"

[[dialogue]]
speaker = "unk"
original = "頑張れ！"
translation = "힘내!"

[[dialogue]]
speaker = "unk"
original = "約束するよ"
translation = "약속할게"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うんっ、ありがとーっ<emoji=heart04>」"
translation = "「응, 고마워ー<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「また始まった……」"
translation = "「또 시작이군……」"

[[dialogue]]
speaker = "unk"
original = "俺たちの様子を見て、ヒメがげんなりした顔になっていた。"
translation = "우리들의 모습을 보고, 히메가 질렸다는 표정을 지었다."

[[dialogue]]
speaker = "unk"
original = "せめて動画を撮っておいてくれないか？"
translation = "적어도 동영상이라도 찍어 두지 않을래?"

[[dialogue]]
speaker = "unk"
original = "あ、そうだ……"
translation = "아, 맞다……"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あっ、そうだね！\u3000だったら会長にも見てもらえる！」"
translation = "「앗, 그렇네! 그러면 회장도 볼 수 있어!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「任せといて！\u3000会長が惚れ直しちゃうようなカッコいい雄姿を見せてあげるから、楽しみにしててよ♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "自信たっぷりに親指を立ててみせる環。"
translation = "자신만만하게 엄지를 세워 보이는 타마키."

[[dialogue]]
speaker = "unk"
original = "ライブで声援を送れないのは残念だけど、これでハロウィンの楽しみが１つ増えたのだった。"
translation = "라이브에서 응원을 보낼 수 없는 건 아쉽지만, 이걸로 할로윈의 즐거움이 하나 늘어난 것이었다."

