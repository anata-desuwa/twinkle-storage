[[dialogue]]
speaker_original = "新星の風紀委員１"
speaker_translation = "新星の風紀委員１"
original = "「今日も異常なしですね、先輩」"
translation = "「오늘도 이상 없네요, 선배」"

[[dialogue]]
speaker_original = "新星の風紀委員２"
speaker_translation = "新星の風紀委員２"
original = "「ええ。交代の時間まであと少し。気を抜かずにいきましょう」"
translation = "「네. 교대 시간까지 앞으로 조금. 방심하지 말고 갑시다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フフフフフ。甘いですねぇ？\u3000すぐそばに私がいるというのに！」"
translation = "「후후후후후. 무르네요? 바로 옆에 제가 있는데도!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「『欲望』の力によって、何人にも気づかれぬよう望んでいる今の私は無敵！\u3000どれだけ探知に優れた星騎士でも捕捉することは不可能なのですッ！」"
translation = "「『욕망』의 힘에 의해 누구에게도 감지되지 않기를 바라는 지금의 저는 무적! 아무리 탐지 능력이 뛰어난 성기사라도 포착하는 것은 불가능한 것입니다!」"

[[dialogue]]
speaker = "unk"
original = "この異形の紳士は、『欲望』のロストアイテム・ダッチ。"
translation = "이 이형의 신사는, 『욕망』의 로스트 아이템·다치."

[[dialogue]]
speaker = "unk"
original = "本来はただの物でしかなかったが、リクリエをも超える永き時を存在し続けた結果、自我を獲得するに至った怪人。"
translation = "본래는 그저 물건에 불과했지만, 리크리에조차 뛰어넘는 오랜 시간을 존재해 온 결과, 자아를 획득하기에 이른 괴인."

[[dialogue]]
speaker = "unk"
original = "かつて女体化バニーの緋宮クロトを入手するべく、誘拐騒動を起こした変態紳士である──"
translation = "일찍이 여체화 바니의 히노미야 쿠로토를 입수하기 위해, 납치 소동을 일으킨 변태 신사이다──"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「さて、時は待ってくれません。早急に緋宮クロト様を<b>救出</b>しなくては！」"
translation = "「자, 시간은 기다려 주지 않습니다. 조속히 히노미야 쿠로토 님을 <b>구출</b>해야만!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「──ンンン！？\u3000あ、あそこにいるのはっ！？」"
translation = "「──응응!? 저, 저기 있는 것은!?」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「ぴょ、ぴょんぴょんっ<emoji=heart04>\u3000ぴょーんっ……<emoji=heart04>」"
translation = "「깡, 깡충깡충<emoji=heart04> 깡~충……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ぴょ、ぴょんぴょんっ……ですわ～っ<emoji=heart04>」"
translation = "「깡, 깡충깡충……이에요~<emoji=heart04>」"

[[dialogue]]
speaker_original = "ユウリ"
speaker_translation = "유우리"
original = "「ぴょ、ぴょん、ぴょん……いっそ殺せ……殺してくれっ！」"
translation = "「깡, 깡충, 깡충……차라리 죽여라……죽여줘！」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "（フ──フォオォォォオオ！？！？！？）"
translation = "(후── 포오오오오오어어어!?!?!?)"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "（バニーだ！\u3000バニーがいるッ！！\u3000しかも３匹もッ！！！）"
translation = "（바니다! 바니가 있다!! 그것도 3마리나!!!）"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「今すぐにでも捕まえて──いやダメです！\u3000抑えなくては！」"
translation = "「지금 당장이라도 붙잡아서── 아니 안 됩니다! 억눌러야만!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「これは明らかな罠！\u3000そうに決まって──」"
translation = "「이것은 명백한 함정! 그렇기에 틀림없는──」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "（────フォッ！？！？）"
translation = "(────폽!?!?)"

[[dialogue]]
speaker_original = "セーラ"
speaker_translation = "세라"
original = "「ぴょんぴょんっ♪\u3000ご奉仕したいぴょーんっ♪\u3000でもでも、ご主人様とはぐれちゃったぴょーんっ♪」"
translation = "「깡충깡충♪ 봉사하고 싶당♪ 그렇지만 그렇지만, 주인님을 놓쳐버렸당♪」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「ご主人様～、どこぴょーん？\u3000ウサギは寂しいと死んじゃうんだぴょーんっ♪」"
translation = "「주인님~, 어디 계신가요~? 토끼는 외로우면 죽어버린단 말이에용♪」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "（こ、子ウサギたちが寂しがっているッ！！！）"
translation = "（아, 어린 토끼들이 외로워하고 있다！！！）"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "（私がご主人様だッ────はぁぁっ！？\u3000い、いけません、あれは罠！\u3000罠なのですッ！）"
translation = "（내가 주인님이다────하아앗!? 안, 안 됩니다, 저건 함정! 함정인 것입니다!）"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「姿を出しては敵の思う壺！\u3000その手は食いませんよッ！」"
translation = "「모습을 드러내면 적의 뜻대로 되는 것! 그 수작에는 안 속습니다!」"

[[dialogue]]
speaker = "unk"
original = "ダッチは強靭な意思で、己の内側で暴れ狂う欲を抑える──理想のバニーカジノの為ならば、血の涙を流してでも姿をさらすわけにはいかない。"
translation = "다치는 강인한 의지로, 자신의 안쪽에서 날뛰는 욕망을 억누른다── 이상적인 바니 카지노를 위해서라면, 피눈물을 흘려서라도 모습을 드러낼 수는 없다."

[[dialogue]]
speaker = "unk"
original = "──しかし。"
translation = "──그러나."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴょ、ぴょんぴょん、ぴょーんっ<emoji=heart04>」"
translation = "「깡, 깡충깡충, 깡~충<emoji=heart04>」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「──────フォ」"
translation = "「──────포」"

[[dialogue]]
speaker = "unk"
original = "ウサギ耳のカチューシャではない、本物のウサギ耳。"
translation = "토끼 귀 머리띠가 아닌, 진짜 토끼 귀."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ダ、ダッチ様～♪\u3000あ、会いたい、ぴょーんっ<emoji=heart04>」"
translation = "「더, 더치 님~♪ 만, 보고 싶어요, 뼝~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ラパン地方出身の者でなくては再現できない、ネイティブスピーカーの『ぴょん』。"
translation = "라판 지방 출신자가 아니면 재현할 수 없는, 네이티브 스피커의 『깡충』."

[[dialogue]]
speaker = "unk"
original = "こんなものを見て、ダッチが我慢できるはずもなく──"
translation = "이런 것을 보고, 다치가 참을 수 있을 리가 만무하여──"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「──フォォオォォォォオッ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「──포오오오오오오오읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「敵影、出現！！\u3000トリュファイナさん、今です！」"
translation = "「적의 그림자, 출현!! 트리파이나 씨, 지금입니다!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はい、シュティレ様──魔力、充填っ！」"
translation = "「네, 슈틸레 님──마력, 충전!」"

[[dialogue]]
speaker = "unk"
original = "機械いじりの得意なシュティレが製造していた、携行型の新型ドリルナックルを構える購買部の２人──"
translation = "기계 만지기가 특기인 슈틸레가 제조하고 있던, 휴대형 신형 드릴 너클을 겨누는 매점부의 2명──"

[[dialogue]]
speaker_original = "２人"
speaker_translation = "2명"
original = "「──ギガンドリル・プレッシャー！！」"
translation = "「──기간 드릴·프레셔!!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「おごごごごごごおぉおぉぉお──！？！？」"
translation = "「어고고고고고고오오오오──!?!?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ボディがお留守でしたね、ロストアイテム。連行しましょう」"
translation = "「바디가 비어 있었네요, 로스트 아이템. 연행하겠습니다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フフフ……見事でしたよ、星騎士の皆様……」"
translation = "「후후후…… 훌륭했습니다, 성기사 여러분……」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「まさかラパン地方産のネイティブバニーで私を釣りだすとは……うぐぅっ……！」"
translation = "「설마 라판 지방산 네이티브 바니로 나를 낚아채다니…… 우그윽……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「作戦成功だな。蘭美よ、手柄であった！！」"
translation = "「작전 성공이군. 라비여, 공적이로다!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「……お褒めにあずかり光栄です、当主様。けれど──」"
translation = "「……칭찬해 주셔서 영광입니다, 당주님. 그렇지만──」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フゥゥウ～！\u3000何という奇跡のマリアージュバニー！\u3000素晴らしいですねぇ～！」"
translation = "「후우우우~! 이 무슨 기적의 마리아주 바니! 훌륭하네요~!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「こいつの視線だけはどうにかならないんですか！？\u3000ず～っとねっちょり見てくるんだけどっ！？」"
translation = "「이 녀석의 시선만큼은 어떻게 안 되는 거야!? 계속 끈적하게 바라보는데!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「蘭美様というのですね、フゥ～！\u3000ですが……はて？\u3000ほかの麗しいバニーの方々はいずこへ？」"
translation = "「라비 님이라고 하시는군요, 후우~! 그렇지만…… 어라? 다른 아름다운 바니 분들은 어디로?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「貴方はバニーガールを見るとパワーアップするそうなので。お引き取りいただきました」"
translation = "「당신은 바니걸을 보면 파워업한다고 하길래. 물러가게 했습니다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「オーゥ！\u3000なんとご無体な！\u3000ではでは、蘭美様を引き続き、目で愛でるしかありませんねぇ～！」"
translation = "「오우! 이 무슨 무자비한! 그렇다면 그렇다면, 라비 님을 계속해서, 눈으로 애지중지할 수밖에 없겠네요~!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「いい加減にしなさい！！\u3000あと、ラパン地方ではこんな衣装は着ないから！\u3000誤解してたら承知しないわよ！！」"
translation = "「적당히 좀 해!! 그리고, 라판 지방에서는 이런 의상은 안 입으니까! 오해하고 있다면 가만 안 둘 테야!!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「？\u3000当然でしょう、存じておりますとも」"
translation = "「? 당연하죠, 알고 마고요」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「えっ！？\u3000そ、そうなの！？」"
translation = "「엣!? 그, 그래!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「私もバニーを愛する者のはしくれ。一般教養ですねぇ」"
translation = "「나도 바니를 사랑하는 자의 한 사람. 교양이지요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「まあ。ダッチ様は物知りなのですね。皆さん、誤解しておられたのに……」"
translation = "「어머나. 다치 님은 박학하시네요. 여러분, 오해하고 계셨는데……」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふ、複雑だわ……誤解がないのは嬉しいけれど、なんでこんなヤツだけが正しい知識を持ってるのよ！！」"
translation = "「복, 복잡해…… 오해가 없는 건 기쁘지만, 왜 이런 녀석만 올바른 지식을 갖고 있는 거야!!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「で・す・が！\u3000私が世界をバニーガールで掌握した暁には──ヌフフフ！\u3000ラパン地方の文化も『そうなるように』、欲望で書き換えますがね！」"
translation = "「하·지·만! 내가 세계를 바니걸로 장악한 아침에는── 누후후후! 라판 지방의 문화도 『그렇게 되도록』, 욕망으로 고쳐 쓰겠지만요!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふざけるんじゃないぴょんっ！？！？」"
translation = "「장난치는 거냐 뼝!?!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フォオォ♪\u3000ネイティブのぴょんっ……染みるぅ～！！」"
translation = "「포오♪ 네이티브의 뼝…… 가슴에 사무치네~!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ヘンタイすぎるわ！！\u3000何なのコイツ！？」"
translation = "「너무 변태잖아!! 뭐야 이 녀석!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ヘンタイ……嗚呼、タイヘン良い響きですねぇ……！！」"
translation = "「변태…… 아아, 대단히 좋은 울림이네요……!!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「彼奴のペースに乗っていては話が進まん。本題に入るぞ」"
translation = "「저 녀석의 페이스에 말려들어서는 이야기가 진행되지 않는다. 본론으로 들어가지」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ええ。『欲望』のダッチ。正直に答えてください。会長とマスターは今どこに？」"
translation = "「예. 『욕망』의 다치. 솔직히 답해 주세요. 회장과 마스터는 지금 어디에?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「誘拐騒ぎを起こすなど、感心いたしません。私、怒っておりますよ！」"
translation = "「납치 소동을 일으키다니, 칭찬받을 일이 아닙니다. 저, 화내고 있어요!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フゥ～……まあ、疑われるのも無理はありませんねぇ」"
translation = "「후우~…… 뭐, 의심받는 것도 무리는 아니지요」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「しかし、此度の騒動、犯人は私ではないのですよ」"
translation = "「하지만, 이번 소동, 범인은 제가 아닌 것입니다」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「なんと……どういうことですか？」"
translation = "「이수가…… 무슨 뜻인가요?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「確かに私は、潜伏中の間に力を蓄えました」"
translation = "「확실히 저는, 잠복하고 있는 동안 힘을 축적했습니다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「理想のバニーカジノを創り出すための欲望パワーも溜まってきたので、そろそろ会長様を再びお招きしようと思っていたのは事実……」"
translation = "「이상적인 바니 카지노를 만들어 내기 위한 욕망 파워도 모여들었으므로, 슬슬 회장님을 다시 초대하려고 생각했던 것은 사실……」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ですが、その矢先に此度のトラブルが起きました。会長様とアニマ様を<ruby>拐かした<rt>かどわかした</rt></ruby>のは、私ではありません」"
translation = "「하지만, 그 직전에 이번 트러블이 일어났습니다. 회장님과 아니마 님을 현혹하여 끌고 간 것은, 제가 아닙니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「む……嘘を言っているようには、見えないですね」"
translation = "「음…… 거짓말을 하고 있는 것처럼은, 보이지 않네요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「しかし、そうなると……真犯人は別にいる、ということですか？」"
translation = "「하지만, 그렇게 되면…… 진범은 따로 있다, 라는 뜻인가요?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ええ。実は私、すでに犯人の目星もついております」"
translation = "「예. 사실 저는, 이미 범인의 짐작도 가 있습니다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「いかがでしょう、星騎士の皆様？\u3000星徒会長様たちを取り戻すという目的は同じ……」"
translation = "「어떠신가요, 성기사 여러분? 성도회장님들을 되찾는다는 목적은 같음……」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「私めと協力して、共に此度の事件を解決する、というのは！？」"
translation = "「저와 협력하여, 함께 이번 사건을 해결한다는 것은!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「怪しいわ！\u3000『欲望』のダッチ。貴方はとてつもない力を秘めている、そう聞いているもの」"
translation = "「수상해! 『욕망』의 다치. 당신은 엄청난 힘을 숨기고 있다, 그렇게 들었는걸」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「犯人の目星がついているのなら、なぜ自分で向かわないのかしら！？」"
translation = "「범인의 짐작이 가 있다면, 왜 직접 향하지 않는 건가요!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「はじめはそうするつもりだったのですがね。今はこの通り、私は万全ではありません。ボディに深刻なダメージを負ってしまいました」"
translation = "「처음에는 그렇게 할 작정이었습니다만. 지금은 보시다시피, 저는 만전이 아닙니다. 바디에 심각한 데미지를 입고 말았습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ドリルは無敵ですから。ぶい」"
translation = "「드릴은 무적이니깐요. 브이」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「まぁ、もし仮にこの傷がなかったとしても……そもそも、手をこまねいていたのですよ」"
translation = "「뭐, 만약 이 상처가 없었다고 해도…… 애초에, 손을 놓고 있었던 것입니다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「なにせ『あの子』は、私よりも強い力を持っておりますので」"
translation = "「어쨌든 『그 아이』는, 저보다 강력한 힘을 갖고 있으므로」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「…………あの子？」"
translation = "「…………그 아이?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ええ。此度の会長失踪事件の犯人は、私と同じ──自我を持ったロストアイテム」"
translation = "「예. 이번 회장 실종 사건의 범인은, 나와 같은── 자아를 가진 로스트 아이템」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「七彩の魔女・ラルクが造りしロストアイテムがひとつ……その７番目に生み出された存在です」"
translation = "「칠채의 마녀·랄크가 만든 로스트 아이템 중 하나…… 그 7번째로 태어난 존재입니다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「『支配』のロストアイテム──その名を、シエスタ」"
translation = "「『지배』의 로스트 아이템── 그 이름을, 시에스타」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「私の……妹なのです！！」"
translation = "「나의…… 여동생인 것입니다!!」"

