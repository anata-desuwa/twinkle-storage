[[dialogue]]
speaker = "unk"
original = "第２話,エルデリーゼとゴールデングース,P"
translation = "제2화, 엘데리제와 골든 구스, P"

[[dialogue]]
speaker = "unk"
original = "ある日のランチタイム。"
translation = "어느 날의 점심시간."

[[dialogue]]
speaker = "unk"
original = "ゴールデングースのヒマワリとミウ、そして、俺とエルゼの４人でカフェテリアのテーブルを囲っていた。"
translation = "골든 구스의 히마와리와 미우, 그리고 나와 엘제의 4명이서 카페테리아의 테이블에 둘러앉아 있었다."

[[dialogue]]
speaker = "unk"
original = "この前のお仕事で知り合ったんだっけ？"
translation = "얼마 전 일로 알게 된 거였나?"

[[dialogue]]
speaker = "unk"
original = "珍しい組み合わせだけど"
translation = "희귀한 조합이지만"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヒマワリ様もミウ様も同じ流星学園附属校生なのですけど、学年とクラスが違いましたので今まで交流はありませんでしたの」"
translation = "「히마와리 님도 미우 님도 같은 유성학원 부속교 학생이지만, 학년과 반이 달랐기 때문에 지금까지 교류는 없었어요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「けれど、先日の事件を機にすっかり仲良くなりましたわ♪」"
translation = "「하지만, 지난번 사건을 계기로 완전히 친해졌답니다♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「その節はご迷惑をおかけしてしまい、申し訳ありませんでした」"
translation = "「그때는 폐를 끼쳐 드려, 죄송했습니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「お気になさらないでくださいな。私の方こそ事情も知らないのに首を突っ込んでしまいましたわ」"
translation = "「신경 쓰지 마셔요. 저야말로 사정도 모르면서 참견을 해버렸는걸요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「結果オーライってことで！\u3000いろいろあったけど、エルゼ先輩と仲良くなれて良かったー！」"
translation = "「결과 오케이라는 걸로! 여러 일이 있었지만, 엘제 선배랑 친해져서 다행이다―!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「今後もより一層、交流を深めて参りましょうね」"
translation = "「앞으로도 더욱더, 교류를 깊게 다져나가기로 해요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「できましたら、私も一友人として接していただければと思いますの」"
translation = "「가능하다면, 저도 한 사람의 친구로서 대해 주셨으면 해요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「それは、つまり……お嬢様扱いはしないで欲しいってこと？」"
translation = "「그건, 즉…… 아가씨 취급은 하지 말아 달라는 뜻?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「その通りですわ。私は桜十路の血筋に生まれたというだけ。私自身は偉くもなんともありませんの」"
translation = "「말씀하신 대로예요. 저는 사쿠라쥬지의 혈통으로 태어났을 뿐. 저 자신은 위대하지도 아무것도 아니에요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「五名門のお嬢様相手となると、どうしても恐縮してしまいますけど、エルデリーゼ先輩がそうおっしゃるのでしたら」"
translation = "「5명문 아가씨 상대라고 하면, 아무래도 황송해집니다만, 엘데리제 선배가 그렇게 말씀하신다면」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふふっ、ありがとうございます♪」"
translation = "「후후, 감사합니다♪」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「では早速なのですが、友人としてお伺いしてもよろしいかしら？\u3000ヒマワリ様とミウ様はあの事務所でお仕事をされてるのですわよね？」"
translation = "「그럼 당장입니다만, 친구로서 여쭤봐도 될까요? 히마와리 님과 미우 님은 그 사무소에서 일을 하고 계신 거죠?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ふっふっふー、その通りです。あたしたちこそ泣く子も黙る秘密結社ゴールデングース！」"
translation = "「후후후-, 맞아요. 우리야말로 우는 아이도 그치는 비밀결사 골든 구스!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「本当はあまり名乗らないように社長から言われてるんですけどね」"
translation = "「사실은 별로 이름을 밝히지 말라고 사장님한테 들었지만요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「先日の九浄家での一件もなのですけど……とても危険なお仕事なのでしょう？」"
translation = "「지난번 쿠죠가에서의 일도 그렇습니다만…… 매우 위험한 일인 거지요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「そうだね。ゴールデングースのお仕事はいつだって危険と背中合わせ、なんたってアウトローだからね！」"
translation = "「그렇지. 골든 구스의 일은 언제나 위험과 인접해 있거든, 뭐니 뭐니 해도 아웃로니까!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「私たちのアウトローぶりは、エルデリーゼ先輩にはちょっと刺激が強すぎるかもしれません」"
translation = "「저희의 아웃로다운 모습은, 엘데리제 선배에게는 조금 자극이 너무 강할지도 몰라요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あー、確かにねー。ミウのアレとかは、ちょっとアレかもしれないねー」"
translation = "「아─, 확실히 그렇네─. 미우의 그거라든가, 조금 그럴지도 모르겠네─」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「アレとはなんですの？\u3000とても気になりますわ！」"
translation = "「그거라니 무엇인가요? 매우 궁금해요!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「品行方正なエルデリーゼ先輩にお教えするのはちょっと──」"
translation = "「품행방정한 엘데리제 선배에게 가르쳐 드리는 건 조금──」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふふ、期待を裏切ってしまうようで申し訳ないのですけど、私、皆様が思われているほど良い子でもありませんのよ」"
translation = "「후후, 기대에 부응하지 못하는 것 같아 죄송합니다만, 저, 여러분이 생각하시는 것만큼 착한 아이도 아니랍니다」"

[[dialogue]]
speaker = "unk"
original = "実はちょっぴり悪い子なんだ"
translation = "사실은 살짝 나쁜 아이야"

[[dialogue]]
speaker = "unk"
original = "こう見えてエルゼはね"
translation = "이렇게 보여도 엘제는 말이지"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「え、そうなの！？」"
translation = "「에, 정말이야!?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「夜中にお家を抜け出して、お散歩を楽しんでますの。ね、会長様」"
translation = "「한밤중에 집을 빠져나가서, 산책을 즐기고 있답니다. 그쵸, 회장님」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ちょっぴり意外でしたね。てっきりエルデリーゼ先輩は箱入りのお嬢様で、門限も厳守しているんだとばかり」"
translation = "「살짝 뜻밖이네요. 틀림없이 엘데리제 선배는 세상물정 모르는 온실 속 영애라, 귀가 시간도 엄수하고 계실 줄로만」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「私だって多感なお年頃の女の子ですわ。ちょっぴり悪いことだってしたくなりますのよ」"
translation = "「저도 다감한 나이대의 여자아이라구요. 살짝 나쁜 짓도 하고 싶어지는 법이랍니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えー、それじゃーさ。今度あたしたちの任務にこっそりついてきてみますー？」"
translation = "「에─, 그럼 말이야. 이번에 우리 임무에 몰래 따라와 볼래─?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いいんですの！？」"
translation = "「괜찮은 건가요!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃん、それはさすがにセナリィ社長に話を通してからにしようよ。この前叱られたばかりでしょ？」"
translation = "「히마와리짱, 그거는 아무래도 세나리 사장님께 말씀드린 다음에 하자. 요전에 혼난 지 얼마 안 됐잖아?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あ、そっか。いきなり連れてくのは危ないしね。でも、セナリィ社長ってなんだかんだ優しいとこあるし、話せばわかってくれそう」"
translation = "「아, 그렇네. 갑자기 데리고 가는 건 위험하기도 하고. 하지만, 세나리 사장님은 이러니저러니 해도 상정한 구석이 있으니까, 말하면 이해해 줄 것 같아」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ええと……セナリィ様というのは、少しだけお見かけしましたけども、おふたりの上役なのですわよね？」"
translation = "「저기…… 세나리님이라는 분은, 아주 조금 뵙기는 했습니다만, 두 분의 상사이신 거지요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ええ、そうです。裏の世界で名を馳せているバンデッド・セナリィ、その人です」"
translation = "「네, 맞아요. 뒷세계에서 이름을 날리고 있는 밴디트 세나리, 바로 그분입니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「セナリィ社長もヘレナさんから特別な戦闘服を譲り受けた、選ばれし者の１人なんですよ」"
translation = "「세나리 사장님도 헬레나님한테 특별한 전투복을 양도받은, 선택받은 자 중 한 명이라고요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ！\u3000つまり、私とも戦闘服仲間ですのね」"
translation = "「어머! 즉, 저와도 전투복 동료인 거군요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そういうことになりますね。セナリィ社長の素晴らしさ、そして、偉大さを語り始めたら、昼休みでは全然足りないんですけども……」"
translation = "「그렇게 되는 셈이네요. 세나리 사장님의 훌륭함, 그리고, 위대함을 이야기하기 시작하면, 점심시간으로는 전혀 부족하지만요……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「セナリィ社長は優しくって、格好良くって、ナイスバディで最強で無敵なオトナの女性なんですよー！\u3000あたしの理想！\u3000目指すべき終着駅なんです！」"
translation = "「세나리 사장님은 상정하고, 멋있고, 나이스 바디에 최강이고 무적인 어른 여자라구요─! 나의 이상! 지향해야 할 종착역이에요!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そうなんですのね！\u3000あの御方がそんなに素晴らしい人物だったなんて、大変興味深いですわ」"
translation = "「그러신 거군요! 그분이 그렇게나 훌륭한 인물이었다니, 매우 흥미롭네요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「よろしければお時間の許す限り、お話を伺ってもよろしいでしょうか？」"
translation = "「괜찮으시다면 시간이 허락하는 한, 이야기를 들어도 될까요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「もちろんですよ。では、私とヒマワリちゃんがセナリィ社長に出会った時の話なんですけど──」"
translation = "「물론이죠. 그럼, 저와 히마와리짱이 세나리 사장님을 만났을 때의 이야기입니다만──」"

[[dialogue]]
speaker = "unk"
original = "（セナリィも大変だなぁ……）"
translation = "(세나리도 고생이네……)"

[[dialogue]]
speaker = "unk"
original = "２人の愛が重い……"
translation = "두 사람의 애정이 무거워……"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「ふぁ……ふぇ……ふぃ……ふぇーっくしゅんっっっ！！！」"
translation = "「후아……후에……후이……후에에에엣취!!!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「イヤですわね……変なくしゃみ。ヒマワリとミウにはとても見せられない変顔になってましたわ」"
translation = "「싫다 참…… 이상한 재채기. 히마와리와 미우에게는 도저히 보여줄 수 없는 굴욕적인 얼굴이 되어 버렸어요」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「あの子たち、また何処かで私の噂でもしてるのかしら。悪い気はしないけど……重すぎる期待に応えるのも大変ですわね」"
translation = "「그 아이들, 또 어딘가에서 내 소문이라도 하고 있는 걸까. 기분이 나쁜 건 아니지만…… 너무 무거운 기대에 부응하는 것도 고생이네요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「月の光に照らされて、颯爽と現れたセナリィ社長っ！\u3000狙いを定めた銃弾は、モンスターを射貫いて──！」"
translation = "「달빛에 비쳐, 씩씩하게 나타난 세나리 사장님! 겨냥을 정한 총알은, 몬스터를 꿰뚫고──!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ！\u3000それでそれで？\u3000それからどうなりましたの！？」"
translation = "「어머! 그래서 그래서요? 그 뒤에 어떻게 되었나요!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あ、ヒマワリちゃん、エルデリーゼ先輩、そろそろ時間だよ。語り足りないだろうけど、ここでストップ」"
translation = "「아, 히마와리짱, 엘데리제 선배, 슬슬 시간이야. 이야기가 모자라겠지만, 여기서 스톱」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えー、ここからがいいところだったのにー。ざんねーん」"
translation = "「에─, 이제부터가 좋은 부분이었는데─. 아쉬워─」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「次はセナリィ様も交えて、ティーパーティーを致しましょう」"
translation = "「다음에는 세나리님도 함께, 티 파티를 열기로 해요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ぜひぜひ。セナリィ社長にも伝えておきますね」"
translation = "「꼭이요. 세나리 사장님한테도 전해 둘게요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふふ、楽しみですわ♪」"
translation = "「후후, 기대되네요♪」"

[[dialogue]]
speaker = "unk"
original = "附属校生たちの仲は深まり、エルゼはまた少し悪い子の道を歩んでしまうのだった。"
translation = "부속교생들의 사이는 깊어지고, 엘제는 또 다시 조금 나쁜 아이의 길을 걷게 되는 것이었다."

