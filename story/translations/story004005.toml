[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「『支配』のロストアイテム……！？」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ダッチの……妹！？」"
translation = ""

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「そしてダッチ様よりも、強い！？」"
translation = ""

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ええ。あの子は我ら『七彩のアイテムズ』の中でも、最強と言って差し支えありません」"
translation = ""

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「兄として不甲斐ない限りですが、事実です。『獅子舞』の兄上でも、こてんぱんにされてしまうでしょうねぇ」"
translation = ""

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「──ほう。そこまでの相手か」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長とマスターを<ruby>拐かす<rt>かどわかす</rt></ruby>ほどの相手です。説得力はありますが……どうします、ヘレナ理事長？」"
translation = ""

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「このヘンタイ紳士と共に協力して、解決にあたる。それも一考ではあるが──」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「危険すぎます！\u3000こいつが信用に足る相手ですか！？」"
translation = ""

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フゥ～～～♪」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「見るからに頭がおかしいです！\u3000私たちを騙そうとしているのかも！」"
translation = ""

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ヌフフフ。では私の行動で、信頼を得ていくとしましょうか？」"
translation = ""

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「まず第一にシエスタの居場所──これは当たりがついています。ロストアイテム同士、マイナスエネルギーの感知はお手の物ですので」"
translation = ""

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「貴方がたは、敵がどこにいるのかすら不明瞭のはず。違いますか？」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「む、むむむ……！」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ドリルで口を割らせますか？\u3000ぎゅいんぎゅいん」"
translation = ""

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「オゥフ！\u3000あれは痛かったですからねぇ、ご遠慮願いたい！\u3000協力し合えるのならば、すぐにでもお教えいたしますよ？」"
translation = "「우후! 방금 건 아팠으니까요, 사양하고 싶네요! 서로 협력할 수 있다면, 당장이라도 가르쳐 드릴 텐데요?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「さらに続いて、シエスタの能力のネタバラシもいたしましょう！」"
translation = "「게다가 이어서, 시에스타의 능력에 대한 스포일러도 해드리죠!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「……どうやら、協力して事に当たりたいというのは、本心のようですね。ヘレナ様」"
translation = "「……아무래도, 협력해서 일을 해결하고 싶다는 건 본심인 것 같군요. 헤레나 님」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむ。申してみよ、ダッチ」"
translation = "「음. 말해보아라, 다치」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「シエスタの司る能力は『支配』。簡単に言うと、あの子はあらゆる事象やエネルギーに対して、支配権を持つのです」"
translation = "「시에스타가 관장하는 능력은 『지배』. 간단히 말해, 그 아이는 모든 현상과 에너지에 대해 지배권을 가집니다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「故に敵対する星騎士から、星力を奪い取ることなど朝飯前。さらに、その奪った力を自身に取り込むことも可能！」"
translation = "「그렇기에 적대하는 성기사에게서 성력을 빼앗는 것쯤은 식은 죽 먹기. 게다가 그 빼앗은 힘을 자신에게 흡수하는 것도 가능!」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「そんなっ！？\u3000それじゃあ本当に最強だよ！？」"
translation = "「그런!? 그렇다면 정말로 최강이잖아!?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「なるほど。うちの会長がなぜ遅れをとっているのか不思議でしたが……」"
translation = "「과연. 우리 회장님이 어째서 고전하고 계신 건지 의문이었습니다만……」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「シエスタは理論上『相手が強ければ強いほど、強敵となるロストアイテム』なのですよ。ご理解いただけましたか？」"
translation = "「시에스타는 이론상 『상대가 강하면 강할수록 강적이 되는 로스트 아이템』인 것입니다. 이해가 되셨습니까?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「信じられません……そんなの、無敵ではないですか！？」"
translation = "「믿기지 않습니다…… 그렇다면 무적이지 않습니까!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ええ。だから言ったでしょう、私も手をこまねいていたと」"
translation = "「예. 그러니까 말했잖아요, 저도 손을 놓고 있었다고」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「……ふむ。相分かった、協力しなければ解決できぬ。そのことは確かなようだな」"
translation = "「……흠. 잘 알았다, 협력하지 않으면 해결할 수 없겠군. 그 사실만은 확실한 것 같구나」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「一時的な共闘──了承しようではないか、ダッチよ！」"
translation = "「일시적인 공동 투쟁── 수락하도록 하지, 다치여!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フゥ！\u3000ご理解いただき感謝いたしますよ、九浄ヘレナ様！」"
translation = "「후! 이해해 주셔서 감사드립니다, 쿠죠 헤레나 님!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ですが話を聞いていると、ダッチと協力したところで何とかなる相手にも思えませんが？」"
translation = "「하지만 이야기를 듣고 있자니, 다치와 협력한다고 해서 어떻게든 될 상대로는 보이지 않습니다만?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「そんなことはありません。私も『七彩のアイテムズ』です！\u3000実力差こそあれど、抵抗することはできるのですよッ！」"
translation = "「그렇지 않습니다. 저도 『칠채의 아이템즈』라고요! 실력 차이야 있겠지만, 저항하는 것은 가능합니다!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「私の能力は欲望の実現──この力でシールドを張り、シエスタの『支配』の干渉を拒めばよいのです！」"
translation = "「제 능력은 욕망의 실현── 이 힘으로 실드를 쳐서, 시에스타의 『지배』의 간섭을 거부하면 되는 것입니다!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「……まぁそれでも、味方が大勢いては効果も目減りします」"
translation = "「……뭐, 그렇다 해도 아군이 많아서는 효과도 줄어듭니다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「緋宮クロト様、並びにアニマ様奪還のための救出チームは、私を除いて３名。このくらいが限界でしょう」"
translation = "「히노미야 쿠로토 님 및 아니마 님 탈환을 위한 구출 팀은 저를 제외하고 3명. 이 정도가 한계겠지요」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふむ……ならば、ノヴァフォーム持ちのアナたちは留守番だな」"
translation = "「흠…… 그렇다면 노바 폼을 가진 아나 일행은 집을 지키는 거군」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「賢明な判断ですね。さらに救出チームの３名は全員、バニーガールにしていただきたい！！！」"
translation = "「현명한 판단이시네요. 게다가 구출 팀 3명은 전원, 바니걸로 해주셨으면 합니다!!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「それ、本当に必要なことなの！？\u3000バニーガールを侍らせたいだけじゃない！」"
translation = "「거, 정말로 필요한 거야!? 바니걸을 거느리고 싶을 뿐이잖아!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「何を仰いますか！\u3000私の力は欲望ですよ！？」"
translation = "「무슨 말씀을 하시는 겁니까! 제 힘은 욕망이라고요!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「奪われてなるものかッ！\u3000渡してなるものかッ！\u3000心の底から想える相手でなければ、強く願えない！\u3000これは譲れません！！」"
translation = "「빼앗길 수야 있나! 넘겨줄 수야 있나! 마음 속 깊은 곳에서 생각할 수 있는 상대가 아니면 강하게 바랄 수 없어! 이것만큼은 양보할 수 없습니다!!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ダッチの<ruby>欲望<rt>ヘンタイ</rt></ruby>シールドを十全に発揮するためには、バニーガールでなければダメ、か……」"
translation = "「다치의 <ruby>욕망<rt>변태</rt></ruby> 실드를 충분히 발휘하기 위해서는 바니걸이 아니면 안 된다, 인가……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「──蘭美。救出チームの１名はお前だ！\u3000任せたぞ！！」"
translation = "「──라비. 구출 팀의 1명은 너다! 맡기겠다!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そんな、当主様っ！？」"
translation = "「그런, 당주님!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ヌッフフフフ！\u3000事件解決まで一心同体ということですねぇ、蘭美様！\u3000フゥゥ～～～！！」"
translation = "「누후후후후! 사건 해결까지 일심동체라는 거군요, 라비 님! 후우우～～～!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「帰りたいぴょん……」"
translation = "「돌아가고 싶어용……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「残り２名の人選はどうする。先ほどのバニーたちを招集するか？」"
translation = "「남은 2명의 인선은 어떻게 하지? 아까의 바니들을 소집할까?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「それもアリですが────フゥッ！！」"
translation = "「그것도 좋지만──── 후!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「む。シュティレとトリュファイナさんに、いやらしい視線を感じます」"
translation = "「음. 슈틸레와 트리파이나 씨에게 야한 시선이 느껴집니다」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「わ、私たちですか……！？」"
translation = "「저, 저희인가요……!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「セナリィ様たちのバニー姿は、すでに拝見しましたからねぇ……こういう機会とあらば、新たなバニーを望むのが筋でしょうッ！」"
translation = "「세나리 님 일행의 바니 모습은 이미 뵙기도 했으니까요…… 이런 기회가 있다면 새로운 바니를 바라는 것이 도리겠지요!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「やりたい放題ですね。流石はヘンタイ紳士」"
translation = "「하고 싶은 대로 다 하시네요. 역시나 변태 신사」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「褒め言葉として受け取りましょう。ではお２人とも、自己紹介をお願いします」"
translation = "「칭찬으로 받아들이지요. 그럼 두 분 모두 자기소개를 부탁드립니다」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「チームを組むのですから、人となりを把握することは大切です。ヌフフ、貴女たちのことをよく知った上で、最も似合うバニーを贈りましょう！」"
translation = "「팀을 짜는 것이니만큼 인품을 파악하는 것은 중요합니다. 누후후, 당신들에 대해 잘 안 다음에 가장 잘 어울리는 바니를 선물해 드리지요!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「じ、自己紹介と言われましても……私は先代・光の魔女。トリュファイナと申します……」"
translation = "「자, 자기소개라고 하셔도…… 저는 선대 빛의 마녀. 트리파이나라고 합니다……」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ほう！\u3000光の魔女！\u3000いいですねぇ。私、魔女様にバニーを着せたことはまだありません。滾ってまいりましたよぉ～！！」"
translation = "「호오! 빛의 마녀! 좋네요. 저, 마녀님에게 바니를 입혀본 적은 아직 없습니다. 피가 끓어오르기 시작했군요오～!!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "（ちょ、ちょっと……気持ち悪いです……）"
translation = "（잠, 잠시만요…… 기분 나빠요……）"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「どうも。天才錬金術師アニマ先輩の一番弟子にして、購買部の美少女看板娘２号──」"
translation = "「안녕하세요. 천재 연금술사 아니마 선배의 수제자이자 매점의 미소녀 간판딸 2호──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「さらに煌炎の超天使アナちゃんと姉妹の契りを交わし、第７代・光の魔女様ともズッ友の間柄──」"
translation = "「게다가 황염의 초천사 아나짱과 자매의 의리를 맺고, 제7대 빛의 마녀님과도 둘도 없는 친구 사이──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「超機動武神ギガンドムをこよなく愛する精錬の機甲天使──その名も！」"
translation = "「초기동무신 기간돔을 더없이 사랑하는 정련의 기갑 천사── 그 이름도!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「流星附属校の『<ruby>紫電一閃<rt>ライトニング・モーメント</rt></ruby>』──閃光のシュティレと申します。ぶい」"
translation = "「유성 부속교의 『<ruby>자전일섬<rt>라이트닝 모먼트</rt></ruby>』── 번개의 슈틸레라고 합니다. 브이」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「シュティレさん。自己紹介のよくばりセットに磨きがかかってきましたね」"
translation = "「슈틸레 씨. 자기소개의 욕심쟁이 세트에 다듬어짐이 더해졌네요」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フフフ、素晴らしい！！！\u3000私、欲望の強い御方にはシンパシーを覚えてしまうタチでして……随分と愉快な少女のご様子！！」"
translation = "「후후후, 훌륭합니다!!! 저, 욕망이 강한 분에게는 동질감을 느껴버리는 체질이라…… 상당한 유쾌한 소녀이신 모양!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。常におもしれー女を目指しています。ぶいぶい」"
translation = "「네. 항상 재미있는 여자를 목표로 하고 있습니다. 브이브이」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フゥ～！\u3000よろしくお願いいたしますよぉシュティレ様！\u3000ぶいぶいっ！」"
translation = "「후～! 잘 부탁드립니다 슈틸레 님! 브이브이!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「では──チェンジ、バニーフォームッ！！！」"
translation = "「그럼── 체인지, 바니 폼!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……おや。てっきり蘭美先輩と同じような、ザ・バニーな感じの衣装になるとばかり思っていたのですが」"
translation = "「……어라. 틀림없이 라비 선배와 같은, 그야말로 바니 같은 느낌의 의상이 될 거라고만 생각했는데요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「は、はい。ウサギの耳はついておりますが、何だか趣が異なりますね……？」"
translation = "「네, 네. 토끼 귀는 달려있습니다만, 어쩐지 정취가 다르네요……?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ほう──和風バニー！\u3000敵ながらあっぱれ。見事な意匠ではないか！！」"
translation = "「호오── 일본풍 바니! 적이지만 장하구나. 멋진 의장이지 않은가!!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「何を仰いますか、ヘレナ様。貴女様が仕立てた蘭美様のバニー服もまた素晴らしい！\u3000あのクオリティに負けぬよう気合いをいれたのです！」"
translation = "「무슨 말씀을 하십니까, 헤레나 님. 당신께서 지어주신 라비 님의 바니복 역시 훌륭합니다! 그 퀄리티에 지지 않도록 기합을 넣은 것입니다!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「見る目があるではないか。蘭美の衣装は、夜も寝ないで昼寝して作った一品なのだ♪」"
translation = "「보는 눈이 있구나. 라비의 의상은 밤에도 자지 않고 낮잠 자며 만든 일품이다♪」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「な、なんか意気投合しちゃってるんだけど……」"
translation = "「뭔, 뭔가 의기투합해버렸는데……」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「出会ってはならない２人が出会ってしまった可能性がありますね」"
translation = "「만나서는 안 될 두 사람이 만나버렸을 가능성이 있네요」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「さぁ、お２人とも。準備はよろしいですか？」"
translation = "「자, 두 분 다. 준비는 되셨습니까?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。着心地は良好。問題ありません」"
translation = "「네. 착용감은 양호. 문제없습니다」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「私も、いつもと変わらず魔力を行使できそうです。この衣装でついていけばよろしいのですね、ダッチ様？」"
translation = "「저도 평소와 다름없이 마력을 행사할 수 있을 것 같아요. 이 의상으로 따라가면 되는 것이겠지요, 다치 님?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ンン～……ダメですねぇ。バニーガールに最も必要なアレを忘れているではありませんか！」"
translation = "「음음…… 안 되겠네요. 바니걸에게 가장 필요한 그것을 잊고 계시지 않습니까!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「アレ……ですか？」"
translation = "「그것…… 인가요?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふむ。ダッチにやる気を出してもらわなければ、マスターたちの救援は望めない……となれば、徹底しなくてはいけませんね」"
translation = "「흠. 다치에게 의욕을 내게 만들지 않으면 마스터 일행의 구원도 바랄 수 없다…… 그렇게 된다면 철저히 해야겠네요」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「和風バニー天使、シュティレ。救援チームとして奮闘いたします。ぴょんぴょん、ぴょーん」"
translation = "「일본풍 바니 천사, 슈틸레. 구원 팀으로서 분발하겠습니다. 깡충깡충, 깡충」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フゥゥウ！！\u3000シュティレ様はノリがいいですねぇ！\u3000素晴らしいッ！！」"
translation = "「후우우!! 슈틸레 님은 흥이 좋으시네요! 훌륭합니다!!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「え、えっと……語尾に、ぴょんを付けなくてはいけない、ということですか？」"
translation = "「에, 어또…… 말끝에 뿅을 붙여야만 한다는 뜻인가요?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「当然でしょう！\u3000貴女たちは今、私の可愛い子ウサギたちっ！\u3000ウサギになりきらなければバニーになったとは言えません！」"
translation = "「당연하죠! 당신들은 지금 제 귀여운 아기 토끼들! 토끼에 몰입하지 않으면 바니가 되었다고 할 수 없습니다!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ほえぇ～……勉強になりますっ。では──私も！」"
translation = "「호에에～…… 공부가 되네요. 그럼── 저도!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ダッチ様！\u3000よろしくお願いいたします！\u3000癒しの魔法ならばお任せくださいませ！\u3000ぴょん、ぴょんっ♪」"
translation = "「다치 님! 잘 부탁드립니다! 치유의 마법이라면 맡겨주세요! 뿅, 뿅♪」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ンンン～～～♪\u3000光の魔女様の、ぴょん！\u3000最高ですねぇ、気合いがノってきましたよぉ～！」"
translation = "「음음음～～～♪ 빛의 마녀님의, 뿅! 최고네요, 기합이 들어가기 시작했어요오～!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「うう……ふざけてる感じなのに、本当に戦闘力が跳ね上がってるわ……何なのコイツ……」"
translation = "「우우…… 장난치는 느낌인데 정말로 전투력이 뛰어오르고 있어…… 뭐야 이 녀석……」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「では皆さん、シエスタのところに乗り込むとしましょう！」"
translation = "「그럼 여러분, 시에스타가 있는 곳으로 들이닥치기로 하죠!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「可憐な子ウサギたちの安全は──私が守るッ！！！」"
translation = "「가련한 아기 토끼들의 안전은── 내가 지킨다!!!」"

[[dialogue]]
speaker = "unk"
original = "──流星市国内、某所にある遊園地。"
translation = "──유성시 국내, 모처에 있는 놀이공원."

[[dialogue]]
speaker = "unk"
original = "偶然発生したアステラの内部はすでに『支配』のシエスタにより改造され、星騎士たちのアラートシステムにも感知できない、天然の城となっていた。"
translation = "우연히 발생한 아스테라의 내부에서는 이미 『지배』의 시에스타에 의해 개조되어, 성기사들의 경보 시스템에도 감지되지 않는 자연의 성이 되어 있었다."

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「ふふふふふっ<emoji=heart04>\u3000お兄ちゃん、次はあれ！\u3000シス、あのジェットコースターに乗りたいの～<emoji=heart04>」"
translation = "「후후후후후<emoji=heart04> 오빠, 다음은 저거! 시스, 저 제트코스터에 타고 싶어～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "よーし、行こう！"
translation = "좋았어, 가자!"

[[dialogue]]
speaker = "unk"
original = "すでに緋宮クロトは『支配』の能力によって記憶を改竄されていた。"
translation = "이미 히노미야 쿠로토는 『지배』의 능력에 의해 기억이 조작되어 있었다."

[[dialogue]]
speaker = "unk"
original = "目の前のシエスタを『愛しい妹』と思い込んでいる──手を繋ぎながら、クロトは遊園地の中をむつまじく歩く。"
translation = "눈앞의 시에스타를 『사랑스러운 여동생』이라고 착각하고 있다── 손을 잡은 채, 쿠로토는 놀이공원 안을 사이좋게 걷는다."

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「イ～～～～♪」"
translation = "「이～～～～♪」"

[[dialogue]]
speaker = "unk"
original = "シエスタの周囲には『支配』の能力によって無力化されたモンスターたちの姿もあった。全員が、ペットのように後をついていく。"
translation = "시에스타의 주변에는 『지배』의 능력에 의해 무력화된 몬스터들의 모습도 있었다. 모두가 애완동물처럼 뒤를 따라간다."

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「嬉しいの、嬉しいのっ♪\u3000シス、ずっとずっと優しいお兄ちゃんが欲しかったの♪」"
translation = "「기뻐, 기뻐어♪ 시스, 계속 계속 다정한 오빠를 갖고 싶었어♪」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「お兄ちゃん、もう安心なの。ずーっとこの世界で遊んで暮らしていいの♪」"
translation = "「오빠, 이제 안심이야. 레에속 이 세계에서 놀면서 살아도 돼♪」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「危ないことはしなくていいし、大変なお仕事も全部ほっぽり出しちゃっていいの……！」"
translation = "「위험한 일은 안 해도 되고, 힘들 일도 전부 팽개쳐버려도 돼……!」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「何があっても……お兄ちゃんのこと。シスが絶対、守ってみせるの～♪」"
translation = "「무슨 일이 있어도…… 오빠를. 시스가 절대, 지켜낼 거야～♪」"

