[[dialogue]]
speaker = "unk"
original = "第３話,１番になりたい,P"
translation = "제3화, 1등이 되고 싶어, P"

[[dialogue]]
speaker = "unk"
original = "アポロにおねだりされて、休日の秋葉原にやってきた。"
translation = "아폴로가 졸라대서, 휴일의 아키하바라에 왔다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「よーし、これから敵情視察だ！」"
translation = "「좋아-, 지금부터 적정 시찰이다!」"

[[dialogue]]
speaker = "unk"
original = "どういうこと？"
translation = "무슨 뜻이야?"

[[dialogue]]
speaker = "unk"
original = "敵情視察！？"
translation = "적정 시찰!?"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしはうちのメイドしか知らないから、よそのも知っておいた方がいいと思ったんだ」"
translation = "「난 우리 집 메이드밖에 모르니까, 다른 곳도 알아두는 편이 좋겠다고 생각했거든」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「最初は九浄家にお願いしようとしたんだけど、あっちは本当のライバルだしな。みんなも全力でやめとけって言ってた」"
translation = "「처음에는 구죠 가문에 부탁하려고 했는데, 그쪽은 진짜 라이벌이잖아. 다들 전력으로 말리기도 했고」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「だから、しょうがなく他のメイドを見てこようと思って。ここならいろんなメイドがいるんだろ？」"
translation = "「그래서 어쩔 수 없이 다른 메이드를 보고 오려고. 여기라면 여러 메이드가 있지?」"

[[dialogue]]
speaker = "unk"
original = "確かにいっぱいいるね"
translation = "확실히 많이 있네"

[[dialogue]]
speaker = "unk"
original = "メイド喫茶かな？"
translation = "메이드 카페이려나?"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「それそれ！\u3000メイド喫茶！\u3000あたしは実際に行ったことないけど、話は聞いてたからな」"
translation = "「거기 거기! 메이드 카페! 나는 실제로 가본 적은 없지만, 얘기는 들었으니까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「キリカはあんまいい顔しなかったけど、フェニエルは参考に見ておくのもいいかもって」"
translation = "「키리카는 그다지 좋은 표정을 짓지 않았지만, 페니엘은 참고 삼아 보는 것도 괜찮겠다고 해서」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「どっちがいいかは見てみないとわかんないし、とにかく行ってみようぜ！」"
translation = "「어느 쪽이 좋을지는 직접 가봐야 아는 거니까, 어쨌든 가보자고!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あ、もしかしてデートだと思ってたか？\u3000だったらごめん、次はちゃんとデートにするからさ」"
translation = "「아, 혹시 데이트라고 생각했어? 그렇다면 미안, 다음에는 제대로 데이트로 할 테니까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「それに、おまえと一緒ならどこに行ってもデートだし……だから、ほら」"
translation = "「게다가, 너랑 함께라면 어디에 가도 데이트고…… 그러니까, 자」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「手、握ってよ。あたしとおまえが、ちゃんとカップルだってわかるように」"
translation = "「손, 잡아줘. 나랑 네가 제대로 커플이라는 걸 알 수 있게」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「えへへ～、手をつなぐっていいな。あたしは好きだ」"
translation = "「에헤헤~, 손을 잡는 건 좋네. 나는 좋아해」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「っと、いちゃつきすぎてメイド喫茶の視察も忘れちゃダメだ。これもあたしのメイド修行の一部なんだから」"
translation = "「앗, 너무 꽁냥거리다가 메이드 카페 시찰을 잊어버리면 안 돼. 이것도 내 메이드 수행의 일부니까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ってことで、行くぞ魔王！\u3000おまえの知ってるメイド喫茶に案内してくれ！」"
translation = "「그런 고로, 가자 마왕! 네가 알고 있는 메이드 카페로 안내해 줘!」"

[[dialogue]]
speaker = "unk"
original = "こうして、俺はアポロを連れてメイド喫茶めぐりをするのだった。"
translation = "이렇게 나는 아폴로를 데리고 메이드 카페 순회를 하게 되었다."

[[dialogue]]
speaker = "unk"
original = "メイド喫茶を数軒はしごし、ドリンクでおなかがちゃぷちゃぷになったので、そろそろ終わりの時間だ。"
translation = "메이드 카페를 몇 군데나 돌며 음료로 배가 찰랑거리게 되었으므로, 마침내 끝낼 시간이다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「……………………」"
translation = "「……………………」"

[[dialogue]]
speaker = "unk"
original = "どうかしたのか？"
translation = "무슨 일 있어?"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「この浮気者……あたしとデート中なのに、他のメイドさんばっか見てただろ」"
translation = "「이 바람둥이…… 나랑 데이트 중인데 다른 메이드들만 쳐다보고 있었지」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「メイドを見るのはあたしの修行だから、おまえは見る必要ないのに」"
translation = "「메이드를 보는 건 내 수행이니까, 너는 볼 필요 없는데」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「メイドさんが近くを通るたび、視線がついーっと引き寄せられてただろ。あたしが気付かないとでも思ったのか？」"
translation = "「메이드가 근처를 지나갈 때마다 시선이 힐끔 끌려가고 있었잖아. 내가 모를 줄 알았어?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「おまえはあたしのことだけ見てればいいんだ。うん……無茶なこと言ってるのはわかってるけど」"
translation = "「너는 나만 보고 있으면 돼. 응…… 떼쓰는 말을 하고 있다는 건 알고 있지만」"

[[dialogue]]
speaker = "unk"
original = "俺の１番はアポロだから"
translation = "내 1순위는 아폴로니까"

[[dialogue]]
speaker = "unk"
original = "ごめんなさい"
translation = "미안해"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「……知ってる。でも、あたしは傷ついたんだぞ」"
translation = "「……알아. 하지만, 나는 상처받았단 말이야」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「でも、魔王の気持ちもわかるよ。どのメイドさんもかわいかったもんな。つい見ちゃうのも当然だよな」"
translation = "「그래도 마왕의 마음도 이해해. 어느 메이드나 다 귀여웠으니까. 나도 모르게 보게 되는 것도 당연하지」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしよりずっと大人で……おっぱいも大きくて……可愛くて……ぜんぜん敵わないなぁって……」"
translation = "「나보다 훨씬 어른이고…… 가슴도 크고…… 귀엽고…… 도저히 상대가 안 된다고나 할까……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「うちでメイド修行をしてても思うんだ。みんなすごいメイドだなって。あたしがちょっと頑張ったくらいじゃ、ああなれないって」"
translation = "「우리 집에서 메이드 수행을 하면서도 생각하거든. 다들 대단한 메이드라고. 내가 조금 노력하는 정도로는 저렇게 될 수 없다고」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あんなすごいメイドになるには、たぶん何年もかかっちゃいそうだ」"
translation = "「저렇게 대단한 메이드가 되려면, 아마 몇 년이나 걸릴 것 같아」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王も……そんなに待てないよな？」"
translation = "「마왕도…… 그렇게 오래 기다릴 수 없지?」"

[[dialogue]]
speaker = "unk"
original = "いつまでも待つよ"
translation = "언제까지나 기다릴게"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「えへへ～、やっぱし魔王は魔王だな」"
translation = "「에헤헤~, 역시 마왕은 마왕이네」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしにやさしくて……いつも欲しい言葉をくれるんだ」"
translation = "「나한테 상냥하고…… 항상 듣고 싶은 말을 해줘」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「メイドさんを見てたのも、理由があるんだろ？\u3000あたしのメイド修行の参考にするとか」"
translation = "「메이드를 보고 있었던 것도 이유가 있어서지? 내 메이드 수행의 참고로 삼는다든가」"

[[dialogue]]
speaker = "unk"
original = "その時の感覚で見ちゃったんだ"
translation = "그때의 기분으로 봐버렸어"

[[dialogue]]
speaker = "unk"
original = "メイド喫茶でバイトしたことあるから"
translation = "메이드 카페에서 알바해 본 적 있으니까"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「おまえもメイドさんやってたのか！\u3000それは初耳だな」"
translation = "「너도 메이드 일 했던 거야!? 그거 초문인데」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ていうかメイドさん！？\u3000メイド服着たのか？」"
translation = "「그나저나 메이드!? 메이드복 입었던 거야?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「う、うん、詳しくは聞かないであげる。おまえもいろいろ大変だよな……」"
translation = "「으, 응, 자세히는 묻지 않아 줄게. 너도 여러모로 힘들었겠구나……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「でも、魔王も昔メイドさんやってたの聞いておいてよかったぞ。つまりプロの目であたしをジャッジできるってことだもんな」"
translation = "「하지만, 마왕도 예전에 메이드 일 했던 걸 들어둬서 다행이다. 즉 프로의 눈으로 나를 심사할 수 있다는 뜻이니까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そもそも、既に魔王のまわりにはすごいメイドさんがいっぱいいるし。ただ、可愛いメイドさんってだけじゃ、おまえを満足させられない」"
translation = "「애초에 이미 마왕 주변에는 대단한 메이드가 잔뜩 있고. 그냥 귀여운 메이드 정도로만은 너를 만족시킬 수 없어」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「一気に難易度あがったな～！\u3000でも、やる気出てきた！」"
translation = "「단숨에 난이도가 올라갔네~! 그래도 의욕이 솟구치기 시작했어!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「これからめちゃくちゃ頑張って、おまえが心からあたしを１番のメイドさんだって思えるようになるからな！」"
translation = "「앞으로 엄청 노력해서, 네가 진심으로 나를 1순위 메이드라고 생각할 수 있도록 만들 테니까!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「どんなことでも、おまえの１番でいたいんだ、あたしは」"
translation = "「어떤 일에서든, 네 1순위로 있고 싶단 말이야, 나는」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「どうだ？\u3000これがおまえの恋人だぞ。惚れ直しちゃっただろ」"
translation = "「어때? 이게 바로 네 연인이라고. 다시 반했지?」"

[[dialogue]]
speaker = "unk"
original = "もっと好きになっちゃった"
translation = "더 좋아하게 됐어"

[[dialogue]]
speaker = "unk"
original = "俺の恋人は最高だ"
translation = "내 연인은 최고야"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「えへへ～、そっか」"
translation = "「에헤헤~, 그렇구나」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしも大好きだぞ<emoji=heart04>\u3000おまえが１番大好きだ<emoji=heart04>」"
translation = "「나도 정말 좋아해<emoji=heart04> 네가 제일 좋아<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「だから……おまえの１番になりたい。それがあたしの目標だ」"
translation = "「그러니까…… 네 1순위가 되고 싶어. 그게 나의 목표야」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「どんなときでも、あたしがおまえの目を奪う。あたしに夢中にさせる。他のものなんて目に入らないくらいに」"
translation = "「어느 때든 내가 네 눈길을 사로잡을 거야. 나한테 열중하게 만들 거야. 다른 건 눈에 들어오지 않을 정도로」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「今はまだ全然だけど……頑張って修行すれば、きっといつか……」"
translation = "「지금은 아직 한참 멀었지만…… 열심히 수행하면 분명 언젠가……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「可愛いメイドさんになったら確認して。今度こそ、その目をあたしに釘付けにしちゃうからな<emoji=heart04>」"
translation = "「귀여운 메이드가 되면 확인해 줘. 이번에야말로 그 눈을 나한테 못 박아버릴 테니까<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "こうしてアポロの魅力をストレートにぶつけられて、俺はもっと好きになってしまうのだった。"
translation = "이렇게 아폴로의 매력을 직구로 받아버려서, 나는 더욱 좋아하게 되고 마는 것이었다."

