[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「流石は新星学園最速の星騎士……凄まじいスピードでした、蘭美先輩」"
translation = "「역시 신성학원 최속의 성기사…… 무시무시한 스피드였습니다, 라비 선배」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ええ。蘭美様がいなかったら、どうなっていたことか……！」"
translation = "「네. 라비 님이 없었다면, 어떻게 되었을지……!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「全員で勝ち取った勝利よ！\u3000２人ともお疲れ様……いいえ。ダッチ、貴方も。作戦自体は褒められたものではなかったけれど、うまくいったわね！！」"
translation = "「전원이서 쟁취한 승리야! 두 사람 다 수고했어…… 아니지. 다치, 너도. 작전 자체는 칭찬할 만한 게 아니었지만, 잘 되었네!!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ヌフフ！\u3000蘭美様のスピードありきの作戦でしたが、上手くいきましたねぇ！！」"
translation = "「누후후! 라비 님의 스피드가 있기에 가능한 작전이었습니다만, 잘 되었네요!!」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「う……うぅう……！」"
translation = "「우…… 우으으……!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「『支配』のシエスタ。もう抵抗は無駄よ。諦めてお縄につきなさい！」"
translation = "「『지배』의 시에스타. 이제 저항은 소용없어. 포기하고 포박당해라!」"

[[dialogue]]
speaker = "unk"
original = "みんな──待ってくれ！！"
translation = "얘들아── 기다려 줘!!"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴょんっ！？\u3000会長っ……どうして止めるのよ！？\u3000こいつは貴方を──いいえ、あ、貴女？\u3000を誘拐したのよ！」"
translation = "「깡충!? 회장…… 어째서 말리는 거야!? 이 녀석은 당신을── 아니, 당, 당신을? 유괴했다고!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「女体化していると何だか調子が狂いますね。ぴょんぴょん。まだ操られているのでしょうか」"
translation = "「여체화되어 있으니 왠지 컨디션이 난조를 겪네요. 깡충깡충. 아직 조종당하고 있는 걸까요」"

[[dialogue]]
speaker = "unk"
original = "話を聞いて欲しいんだ！！"
translation = "이야기를 들어줬으면 좋겠어!!"

[[dialogue]]
speaker = "unk"
original = "蘭美、シュティレ、トリュファイナさん！"
translation = "라비, 슈틸레, 트리파이나 씨!"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「私たちの名を……！？」"
translation = "「저희들의 이름을……!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ふむ。シスの『支配』の力が弱まったからでしょう。ようやく正気を取り戻してくれたみたいですねぇ！」"
translation = "「흠. 시스의 『지배』의 힘이 약해졌기 때문이겠지요. 겨우 제정신을 차려준 모양이네요!」"

[[dialogue]]
speaker = "unk"
original = "彼女は俺のために、この誘拐騒ぎを……！"
translation = "그녀는 나를 위해서, 이 유괴 소동을……!"

[[dialogue]]
speaker = "unk"
original = "シエスタを許してやってくれ！"
translation = "시에스타를 용서해 줘!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……いったい、どういうことなのです？」"
translation = "「……대체, 무슨 말씀이신가요?」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「…………お兄ちゃん」"
translation = "「…………오빠」"

[[dialogue]]
speaker = "unk"
original = "シス、みんなに説明するんだ"
translation = "시스, 모두에게 설명해 줘"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ここまで来たからには、話を聞かせなさい！\u3000私たちは、それを聞く権利があるわ！」"
translation = "「여기까지 온 이상, 이야기를 들려줘! 우리들은, 그것을 들을 권리가 있어!」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「…………わかった、の」"
translation = "「…………알겠어」"

[[dialogue]]
speaker = "unk"
original = "『支配』のロストアイテム──シエスタ。"
translation = "『지배』의 로스트 아이템── 시에스타."

[[dialogue]]
speaker = "unk"
original = "彼女はリクリエすらも超える永き時を生き続け、他の兄弟たちと同じく自我を持つに至った。"
translation = "그녀는 리크리에조차 넘어서는 오랜 세월을 살아왔으며, 다른 형제들과 마찬가지로 자아를 갖게 되었다."

[[dialogue]]
speaker = "unk"
original = "『七彩のアイテムズ』は、自身の他に６つ。全員が自我を持っており、末娘であるシエスタの自我の芽生えを祝福してくれた。"
translation = "『칠채의 아이템즈』는, 자신 외에 6개. 전원이 자아를 가지고 있었으며, 막내 딸인 시에스타의 자아의 싹틔움을 축복해 주었다."

[[dialogue]]
speaker = "unk"
original = "だがシエスタ本人は、己の境遇を呪った……なぜか？"
translation = "하지만 시에스타 본인은, 자신의 처지를 저주했다…… 어째서인가?"

[[dialogue]]
speaker = "unk"
original = "それは実に単純明快で、救いのない事実──彼女の兄弟は、頭のおかしいやつしかいなかったからだ。"
translation = "그것은 참으로 단순명쾌하고, 구원 없는 사실── 그녀의 형제는, 머리가 이상한 녀석들밖에 없었기 때문이다."

[[dialogue]]
speaker = "unk"
original = "長兄の獅子舞は、堅物そうに見えてその実、女性に晴れ着を与えて喜ぶ性癖を持つ変なやつ。"
translation = "장남인 사자춤은, 고지식해 보이지만 사실, 여성에게 명절 옷을 주고 기뻐하는 성벽을 가진 이상한 녀석."

[[dialogue]]
speaker = "unk"
original = "次兄のダッチは、シエスタにとって汚点でしかなかった──ウサギ狂いが高じて、妹に着脱不可能なうさ耳カチューシャまで贈りつけるような輩。"
translation = "차남인 다치는, 시에스타에게 있어서 오점에 불과했다── 토끼 광증이 심해져, 여동생에게 탈착 불가능한 토끼 귀 머리띠까지 선물로 강요하는 무리."

[[dialogue]]
speaker = "unk"
original = "──長兄と次兄で、これなのだ。三男以降の連中もまともなわけがない。"
translation = "──장남과 차남이, 이 지경이다. 삼남 이하의 녀석들도 제정신일 리가 없었다."

[[dialogue]]
speaker = "unk"
original = "シエスタは自我を獲得してから『優しくてかっこいい素敵なお兄ちゃん』が欲しいと思い続けた……"
translation = "시에스타는 자아를 획득하고 나서부터 『다정하고 멋진 멋쟁이 오빠』를 갖고 싶다고 계속 생각했다……"

[[dialogue]]
speaker = "unk"
original = "それから永き時が過ぎ──森羅歴３００２年。"
translation = "그리고 오랜 세월이 지나── 신라력 3002년."

[[dialogue]]
speaker = "unk"
original = "シエスタは人間界で運命の相手に出会った。"
translation = "시에스타는 인간계에서 운명의 상대를 만났다."

[[dialogue]]
speaker = "unk"
original = "学園中の女の子から『お兄ちゃん』と慕われる存在──"
translation = "학원 안의 여자아이들로부터 『오빠』라며 사모받는 존재──"

[[dialogue]]
speaker = "unk"
original = "──緋宮クロト。"
translation = "──히노미야 쿠로토."

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "（…………！！）"
translation = "(…………!!)"

[[dialogue]]
speaker = "unk"
original = "血が繋がっていなくても、彼は自分に甘えてくる女生徒たちを『妹』として扱い、優しく接していた。"
translation = "피가 이어져 있지 않더라도, 그는 자신에게 응석부려 오는 여학생들을 『여동생』으로 대하며, 다정하게 접하고 있었다."

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "（シスの……理想のお兄ちゃんなのっ！！）"
translation = "(시스의…… 이상적인 오빠야!!)"

[[dialogue]]
speaker = "unk"
original = "自分もあの輪に入りたい。そう幾度、願ったか。"
translation = "자신도 저 고리 안에 들어가고 싶다. 그렇게 몇 번이고, 바랐던가."

[[dialogue]]
speaker = "unk"
original = "しかしそのたびに、シエスタは自分の身体を見て──諦めた。"
translation = "하지만 그때마다, 시에스타는 자신의 몸을 보고── 포기했다."

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "（……シスは人間じゃないの。天使でもない。魔族でもない。言葉が喋れるだけの、モンスターと変わらないの……）"
translation = "(……시스는 인간이 아니야. 천사도 아니야. 마족도 아니야. 말을 할 수 있을 뿐인, 몬스터와 다름없어……)"

[[dialogue]]
speaker = "unk"
original = "こんな異形が近づいたらびっくりさせてしまう。"
translation = "이런 이형이 접근하면 놀라게 하고 만다."

[[dialogue]]
speaker = "unk"
original = "『お兄ちゃん』なんて呼んだところで──気味悪がられるに決まっている。"
translation = "『오빠』라고 불러봤자── 기분 나빠할 게 뻔하다."

[[dialogue]]
speaker = "unk"
original = "だからシエスタは『理想のお兄ちゃん』を、影から見るだけで満足しようと心に決めた──"
translation = "그래서 시에스타는 『이상적인 오빠』를, 그림자에서 보는 것만으로 만족하자고 마음속으로 결정했다──"

[[dialogue]]
speaker = "unk"
original = "しかし、クロトの日々を観察していくうちに、シエスタはどんどん不安になっていった。"
translation = "하지만, 쿠로토의 나날을 관찰해 가는 동안, 시에스타는 점점 불안해져 갔다."

[[dialogue]]
speaker = "unk"
original = "彼は学園中の生徒から頼られ、寝る間もなく活動していた。"
translation = "그는 학원 안의 학생들로부터 의지받아, 잘 시간도 없이 활동하고 있었다."

[[dialogue]]
speaker = "unk"
original = "朝も昼も夜もなく、みんなのために忙しく働き続けて……いつか倒れるんじゃないか、とシエスタは心配と不安を抱くようになった。"
translation = "아침도 낮도 밤도 없이, 모두를 위해 바쁘게 일하고 있어…… 언젠가 쓰러지는 게 아닐까, 하고 시에스타는 걱정과 불안을 안게 되었다."

[[dialogue]]
speaker = "unk"
original = "特にシエスタが目の敵にしたのは、錬金術同好会の存在だった。あの優しいお兄ちゃんを実験台にして、アヤシイ薬を日夜飲ませて、苦しめていた。"
translation = "특히 시에스타가 눈엣가시로 여긴 것은, 연금술 동호회의 존재였다. 저 다정한 오빠를 실험대로 삼아, 수상한 약을 밤낮으로 먹여, 괴롭히고 있었다."

[[dialogue]]
speaker = "unk"
original = "アニマの薬を飲んだクロトは、女の子になったり、翼が生えたり……"
translation = "아니마의 약을 먹은 쿠로토는, 여자아이가 되거나, 날개가 돋아나거나……"

[[dialogue]]
speaker = "unk"
original = "ある日、新薬を飲んだクロトが、四足歩行をしながら山奥に消え、一晩中遠吠えをしているのを見た時に、シエスタの我慢は限界を迎えた。"
translation = "어느 날, 신약을 먹은 쿠로토가, 네 발 보행을 하며 산속으로 사라져, 밤새도록 울부짖고 있는 것을 보았을 때, 시에스타의 참을성은 한계에 달했다."

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「もう見てられないの……お兄ちゃん、このままじゃ死んじゃうの！！」"
translation = "「이제 보고 있을 수 없어…… 오빠, 이대로라면 죽어버려!!」"

[[dialogue]]
speaker = "unk"
original = "その時、生まれて初めて、シスは己の能力を我欲のために使うことを決意し──"
translation = "그때, 태어나서 처음으로, 시스는 자신의 능력을 사욕을 위해 쓰기로 결의하고──"

[[dialogue]]
speaker = "unk"
original = "今回の誘拐騒ぎを、引き起こしたのだった。"
translation = "이번 유괴 소동을, 일으킨 것이었다."

