[[dialogue]]
speaker = "unk"
original = "第１話,風評被害だぴょん！！,P"
translation = "제1화, 풍평 피해다 뿅!!"

[[dialogue]]
speaker = "unk"
original = "『支配』のロストアイテム・シエスタとの騒動──事件解決の折、恋人であり婚約者でもある蘭美には、たくさん迷惑をかけてしまった。"
translation = "『지배』의 로스트 아이템 시에스타와의 소동──사건이 해결될 즈음, 연인이자 약혼자인 라비에게는 많은 피해를 주고 말았다."

[[dialogue]]
speaker = "unk"
original = "だから今日は、獅子奮迅の働きをしてくれた蘭美にお礼を言うため、星徒会室に招くことにした──"
translation = "그래서 오늘은 사자후의 활약을 해준 라비에게 감사를 표하기 위해, 성태회실로 초대하기로 했다──"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「蘭美先輩。先日の一件、大変お世話になりました。こちら、私の目利きでチョイスした和菓子になります」"
translation = "「라비 선배. 지난번 일은 정말 감사했습니다. 여기, 제 안목으로 엄선한 화과자입니다.」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「お礼を言われるほどのことではないわ！\u3000それにシュティレやトリュファイナ様の協力があったからこそ勝てたのだし……」"
translation = "「감사를 받을 정도의 일은 아니야! 게다가 슈틸레나 트리파이나 님의 협력이 있었기에 이길 수 있었던 거고……」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「購買部の２人はお店番で忙しいみたいで。そっちは改めて時間を作るから、今日は蘭美先輩だけでもゆっくりしていってください」"
translation = "「매점의 두 사람은 가게를 보느라 바쁜 것 같아서. 그쪽은 나중에 따로 시간을 낼 테니, 오늘은 라비 선배만이라도 쉬다 가세요.」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そういうことなら、ありがたく受け取るわ！\u3000ん……流石はアナが選んだお茶請けね。とても上品な味……」"
translation = "「그런 거라면, 감사히 받을게! 음…… 역시 아나가 고른 차과자네. 아주 고급스러운 맛……」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「九浄家メイド隊のメイド長をおもてなしするのですから、奮発しました。むふー」"
translation = "「쿠죠가 메이드대의 메이드장을 대접하는 거니까, 거금을 들였습니다. 무후-」"

[[dialogue]]
speaker = "unk"
original = "まさかダッチと協力するとは思わなかった"
translation = "설마 더치와 협력할 줄은 몰랐다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「もう、本当に大変だったわ……」"
translation = "「아휴, 정말 힘들었어……」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「いちいちラパン地方の方言を出せってしつこいし、隙あらば舐めるようにバニーガール衣装を眺めてくるし……」"
translation = "「일일이 라팡 지방 사투리를 쓰라고 끈질기게 굴고, 틈만 나면 핥듯이 바니걸 의상을 바라보고……」"

[[dialogue]]
speaker = "unk"
original = "……ちょっとダッチが羨ましい"
translation = "……조금 더치가 부럽다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「どういうことよ！？」"
translation = "「무슨 소리야!?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「蘭美先輩は先日の騒動以降、まったくと言っていいほどバニーガール衣装にならないですからね」"
translation = "「라비 선배는 지난 소동 이후로, 거의 바니걸 의상을 입지 않으시니까요.」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「恋人の立場の会長からすると、蘭美先輩の可愛い衣装を見たいって思ってるんじゃないかな？」"
translation = "「연인 입장인 회장님으로서는, 라비 선배의 귀여운 의상을 보고 싶다고 생각하는 거 아닐까?」"

[[dialogue]]
speaker = "unk"
original = "蘭美のバニーガール衣装、見たい！"
translation = "라비의 바니걸 의상, 보고 싶어!"

[[dialogue]]
speaker = "unk"
original = "その通り！！"
translation = "바로 그거야!!"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そう。会長の頼みなら、仕方ないわね──」"
translation = "「그래. 회장의 부탁이라면 어쩔 수 없네──」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「なんて言うと思った！？\u3000お断りよ！！」"
translation = "「라고 말할 줄 알았어!? 거절하겠어!!」"

[[dialogue]]
speaker = "unk"
original = "そんな──！？"
translation = "그런──!?"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「バニー衣装なんて、必要がなかったら二度と着ないわ！\u3000これはラパン出身のウサギの魔族としてのプライドよ！！」"
translation = "「바니 의상 같은 건, 필요하지 않다면 두 번 다시 안 입을 거야! 이건 라팡 출신 토끼 마족으로서의 자존심이라고!!」"

[[dialogue]]
speaker = "unk"
original = "でもラパン地方の伝統衣装じゃあ……"
translation = "하지만 라팡 지방의 전통 의상 아니었나……"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あぁあぁああっ！？\u3000やっぱり会長も間違った情報を信じちゃってるじゃない！\u3000この機会にちゃんと覚えなさいっ！」"
translation = "「아아아아앗!? 역시 회장도 잘못된 정보를 믿고 있잖아! 이번 기회에 똑똑히 기억해 둬!」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「我々も勘違いしていましたが、事実のようです。驚くべきことに、ラパン地方ではバニーガール衣装は着られないようです」"
translation = "「저희도 착각하고 있었습니다만, 사실인 것 같습니다. 놀랍게도, 라팡 지방에서는 바니걸 의상을 입지 않는 모양입니다」"

[[dialogue]]
speaker = "unk"
original = "そ、そうなのか……！？"
translation = "그, 그런 건가……!?"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そうよ！\u3000人間界で生まれた文化が、勝手に我が物顔で真実を塗りつぶしてるの！\u3000風評被害なんだから！」"
translation = "「그래! 인간계에서 태어난 문화가 제멋대로 당당하게 진실을 덧칠하고 있는 거라고! 풍평피해란 말이야!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「わかりやすく例えてあげるわ。日本にも、お寿司って文化があるでしょう？」"
translation = "「알기 쉽게 예시를 들어줄게. 일본에도 초밥이라는 문화가 있잖아?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「海外でわけのわからないアレンジがされてるお寿司を『これが日本の伝統料理だ』って勘違いしているヒトがいたら、どう思うかしら！？」"
translation = "「해외에서 터무니없는 어렌지가 된 초밥을 『이것이 일본의 전통 요리다』라고 착각하는 사람이 있다면, 어떻게 생각하겠어!?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「た、確かに訂正したくなるかも……！」"
translation = "「하, 확실히 정정하고 싶어질지도……!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そうでしょう！\u3000つまり私にバニーガールになれって言うのは、老舗の寿司屋にカリフォルニアロールを作れというのと同じことなのよ！！」"
translation = "「그렇지! 즉 나한테 바니걸이 되라고 하는 건, 전통 있는 초밥집에 캘리포니아 롤을 만들라고 하는 것과 마찬가지란 말이야!!」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「な、なるほど。異文化交流は難しいですね……」"
translation = "「그, 그렇군요. 이문화 교류는 어렵네요……」"

[[dialogue]]
speaker = "unk"
original = "そ、そんな…………"
translation = "그, 그런…………"

[[dialogue]]
speaker = "unk"
original = "蘭美のバニーガール、めちゃくちゃ可愛かったのに……それを求めるのは、蘭美からすると複雑なのか。"
translation = "라비의 바니걸, 엄청나게 귀여웠는데…… 그걸 요구하는 건 라비 입장에서 복잡한 건가."

[[dialogue]]
speaker = "unk"
original = "ちょっぴり……いや。かなり残念だ──"
translation = "조금…… 아니. 상당히 아쉽다──"

[[dialogue]]
speaker = "unk"
original = "──後日。"
translation = "──며칠 뒤."

[[dialogue]]
speaker = "unk"
original = "はあぁあ……"
translation = "하아아……"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「おや。まるで魂がこぼれ出そうな深いため息であるな、魔王よ？」"
translation = "「이런. 마치 영혼이 쏟아져 나올 듯한 깊은 한숨이로군, 마왕이여?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「よいよい、みなまで言うな。魔王の背筋がぐんにゃり曲がっている理由、承知しているとも」"
translation = "「좋다 좋아, 다 말하지 않아도 된다. 마왕의 등뼈가 팍 굽어 있는 이유, 알고 있고말고」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「良い情報を教えてやろう。本日、九浄家のカジノで急な欠員が発生した」"
translation = "「좋은 정보를 알려주지. 오늘, 쿠죠 가의 카지노에서 갑작스러운 결원이 발생했다」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「流星市国のＶＩＰを招く故、優秀な人員で補充せねばならぬ。私は蘭美を指名したぞ？」"
translation = "「유성시국의 VIP를 모시는 만큼, 우수한 인원으로 보충해야만 하지. 나는 라비를 지명했다네?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「当然カジノとあらば、ドレスコードは守らなくてはならん──ふふふ♪」"
translation = "「당연히 카지노인 이상, 드레스 코드는 지켜야만 하지──후후후♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「今日だけは見られるぞ、蘭美の可憐な例の衣装をな！！」"
translation = "「오늘만큼은 볼 수 있다네, 라비의 가련한 그 의상을 말이지!!」"

[[dialogue]]
speaker = "unk"
original = "ヘレナちゃん──ありがとう！！！"
translation = "헬레나 양── 고마워!!!"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「おや。あっという間に見えなくなってしまった。魔王め、よほど見たかったのだな。可愛いやつめ」"
translation = "「이런. 눈 깜짝할 사이에 안 보이게 되었군. 마왕 녀석, 어지간히도 보고 싶었던 모양이다. 귀여운 녀석 같으니」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「九浄家のカジノへ、ようこそいらっしゃいました！\u3000どうぞごゆるりとお寛ぎくださいませ♪」"
translation = "「쿠죠 가의 카지노에 오신 것을 환영합니다! 부디 느긋하게 쉬다 가십시오♪」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「──はぁっ。当主様の無茶振りにも困ったものだわ！\u3000まあ、市国の要人の接客となれば、私が出るのも道理ではあるけれど……」"
translation = "「──하아. 당주님의 억지에도 난감하다니까! 뭐, 시국의 요인을 접객하는 거라면 내가 나서는 것도 당연하지만……」"

[[dialogue]]
speaker = "unk"
original = "蘭美！！！"
translation = "라비!!!"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴょんっ！？\u3000かかかっ、会長！？\u3000どうしてここにいるぴょんっ！？」"
translation = "「뿅!? 회, 회장!? 어떻게 여기에 있는 뿅!?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「──っ！\u3000当主様ね！\u3000当主様が告げ口したんでしょうっ！\u3000あぁもうっ……会長にだけは見られたくなかったのに！！」"
translation = "「──읏! 당주님이구나! 당주님이 일러바친 거지! 아아 정말…… 회장한테만큼은 보여주고 싶지 않았는데!!」"

[[dialogue]]
speaker = "unk"
original = "か、可愛い……可愛すぎる！！"
translation = "귀, 귀여워…… 너무 귀여워!!"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そ、そんなに目をキラキラさせて、可愛いって言われても……別に嬉しくも何ともないんだからねっ！！」"
translation = "「그, 그렇게 눈을 반짝이면서 귀엽다고 해도…… 딱히 기쁘지도 않거든!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「も、もういいでしょう！？\u3000私はお仕事中だから、会長はさっさと帰りなさい！」"
translation = "「이, 이제 됐잖아!? 나는 일하는 중이니까 회장은 얼른 돌아가!」"

[[dialogue]]
speaker = "unk"
original = "自分、写真いいっすか！？"
translation = "저기, 사진 찍어도 됩니까!?"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「だだだ、ダメに決まってるぴょんっ！\u3000こんな格好してるところを保存されるだなんて……！」"
translation = "「안, 안 되는 게 당연하잖아 뿅! 이런 모습인 채로 저장된다니……!」"

[[dialogue]]
speaker = "unk"
original = "可愛いお嫁さんの写真が欲しいんだ！"
translation = "귀여운 아내의 사진을 갖고 싶단 말이야!"

[[dialogue]]
speaker = "unk"
original = "お願い、１枚だけ……！"
translation = "부탁이야, 한 장만……!"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「う、うぅうっ……！」"
translation = "「우, 으으읏……!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「も、もう……今日だけよ！？\u3000今日だけなんだから！！」"
translation = "「정, 정말…… 오늘뿐이야!? 오늘뿐이니까!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ちょ、ちょっと！\u3000１枚だけって言ったじゃない！？\u3000どうして連写してるの！」"
translation = "「잠, 잠깐만! 한 장만이라고 했잖아!? 왜 연속 촬영을 하고 있는 거야!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「会長っ！\u3000こら、もう～～～っ……！」"
translation = "「회장! 이봐, 정말이지～～……!」"

[[dialogue]]
speaker = "unk"
original = "恥じらいつつも、写真撮影に応じてくれた蘭美に甘えて、しっかり撮り貯めをした俺。"
translation = "부끄러워하면서도 사진 촬영에 응해 준 라비에게 응리해, 확실하게 팍팍 찍어 둔 나."

[[dialogue]]
speaker = "unk"
original = "その日から、俺のＤＩＳＣの待ち受け画面はバニーガールの蘭美になるのだった──"
translation = "그날부터 내 DISC의 대기 화면은 바니걸 라비가 되는 것이었다──"

