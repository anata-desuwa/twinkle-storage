[[dialogue]]
speaker = "unk"
original = "第４話,ご主人様の求めなら,P"
translation = "제4화, 주인님이 원하신다면, P"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「今日の家デートのテーマは──癒しよ！！」"
translation = "「오늘 집 데이트의 테마는── 힐링이야!!」"

[[dialogue]]
speaker = "unk"
original = "また急だなぁ……"
translation = "또 갑작스럽네……"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そんなことないわ！\u3000私、以前から思っていたのよ。会長の日常は、あまりに忙しすぎるって！」"
translation = "「그렇지 않아! 나, 이전부터 생각하고 있었어. 회장의 일상은 너무 바쁘다고!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「シエスタが誘拐事件を起こしたのだって、星徒会長である貴方の激務を心配したからでしょう？」"
translation = "「시에스타가 납치 사건을 일으킨 것도, 성도회장인 당신의 격무를 걱정해서잖아?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「貴方の恋人として、婚約者として、専属メイドとして！\u3000もう二度と、あんな事件は起こさせないわ！」"
translation = "「당신의 연인으로서, 약혼자로서, 전속 메이드로서! 또 다시 그런 사건은 일어나게 두지 않을 거야!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「これからは、今まで以上に尽くして、尽くして、尽くしぬいて！\u3000貴方を支えてあげるんだから！」"
translation = "「앞으로는 지금까지 이상으로 헌신하고, 헌신하고, 끝까지 헌신해서! 당신을 받쳐줄 거니까!」"

[[dialogue]]
speaker = "unk"
original = "じゃあ今日１日、蘭美は……"
translation = "그럼 오늘 하루, 라비는……"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ええ。貴方を全力で癒やしてあげる。リクエストだって何でも聞いてあげるわよ！」"
translation = "「그래. 당신을 전력으로 힐링해 줄게. 리퀘스트도 뭐든 들어줄 테니까!」"

[[dialogue]]
speaker = "unk"
original = "だったら──"
translation = "그렇다면──"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「……私を膝上に乗せて、スキンシップがしたい？\u3000ふふ、ずいぶんと控えめなおねだりなのね？」"
translation = "「……나를 무릎 위에 앉히고 스킨십이 하고 싶어? 후후, 제법 소박한 응석이네?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「いいわ！\u3000それじゃあ、ベッドに座りなさいっ♪」"
translation = "「좋아! 그럼 침대에 앉으렴♪」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ん──しょっ。ふふ、貴方の太もも、すっかり私の特等席ね。でもいいのかしら？」"
translation = "「으─차. 후후, 당신의 허벅지, 완전히 나의 특등석이네. 하지만 괜찮을까?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「これ、疲れちゃわないかしら？\u3000私が膝枕でもしてあげた方が、癒やされるような気がするのだけれど……」"
translation = "「이거, 피곤해지지 않을까? 내가 무릎베개라도 해주는 편이 더 힐링이 될 것 같은 기분이 드는데……」"

[[dialogue]]
speaker = "unk"
original = "膝枕だと、蘭美をぎゅってできないから"
translation = "무릎베개면 라비를 꽉 안아줄 수 없으니까"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴゃっ！？\u3000ん、んぅ……<emoji=heart04>\u3000会長ったら、遠慮なく私のこと、ぎゅーってして……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「──ううん。痛くなんてないわ。あったかくて、安心する感じ……貴方も同じ気持ちなの？」"
translation = "「──으응. 아프거나 하지 않아. 따뜻하고 안심되는 느낌…… 당신도 같은 마음이야?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふふ、私をハグして癒やされるんだったら、好きなだけさせてあげるわ。もっと強くぎゅーってしていいわよ♪」"
translation = "「후후, 나를 안아서 힐링된다면 원하는 만큼 하게 해줄게. 더 세게 꽉 안아도 돼♪」"

[[dialogue]]
speaker = "unk"
original = "このすっぽり収まる感じが最高だ"
translation = "이 쏙 들어오는 느낌이 최고다"

[[dialogue]]
speaker = "unk"
original = "蘭美は小さくて可愛いなぁ"
translation = "라비는 작고 귀엽네"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「だ、誰が小さいぴょんっ！？\u3000こ、これでも会長とお付き合い始めてから、ちょっとは成長──し、してるぴょんっ！！\u3000……たぶん」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「もう。貴方ってば、いつも私をからかうんだから……あっ<emoji=heart04>\u3000う、うさ耳に吐息、当たってる……くすぐったいってばぁ<emoji=heart04>」"
translation = "「정말이지. 당신도 참, 항상 나를 놀리기만 하고…… 앗<emoji=heart04> 토, 토끼 귀에 숨결이 닿고 있어…… 간지럽다니까<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "癒されるー……"
translation = "힐링된다─……"

[[dialogue]]
speaker = "unk"
original = "ぎゅー……"
translation = "꼬옥─……"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「んんっ<emoji=heart04>\u3000日々の疲れが取れてるなら、よかったわ。でも会長、遠慮は無用よ？」"
translation = "「응읏<emoji=heart04> 매일의 피로가 풀린다면 다행이야. 하지만 회장, 사양할 필요는 없어?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「今日はとことん会長の言うこと、聞いてあげちゃうんだから<emoji=heart04>\u3000私にしてほしいこと、何でもリクエストしなさい♪」"
translation = "「오늘은 철저하게 회장이 하는 말 들어줄 테니까<emoji=heart04> 나한테 바라는 게 있다면 뭐든 리퀘스트해♪」"

[[dialogue]]
speaker = "unk"
original = "……本音を言えば、蘭美のバニーガール姿を見てみたい。"
translation = "……본심을 말하자면, 라비의 바니걸 모습을 보고 싶다."

[[dialogue]]
speaker = "unk"
original = "けれど彼女はあまりあの衣装を好いていない。だからおねだりが難しい──"
translation = "하지만 그녀는 저 의상을 그다지 좋아하지 않는다. 그래서 부탁하기가 어려운데──"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「……い、言っておくけれど。何でもリクエストを聞いてあげるって言ったの、言葉どおりに取ってくれていいのよ？」"
translation = "「……말, 말해두겠는데. 뭐든 리퀘스트를 들어주겠다고 한 거, 말 그대로 받아들여도 돼?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「私、貴方のメイドだもの。ご主人様の求めにノーを言うような不忠者に見えるかしら……？」"
translation = "「나, 당신의 메이드인걸. 주인님의 요구에 노라고 말하는 불충한 자로 보여……?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「め、命令されたら、どんなことだって──き、聞いちゃう、ぴょんっ<emoji=heart04>」"
translation = "「명, 명령하신다면 어떤 일이라도──드, 들을 거다, 뿅<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "……じゃあ、ご主人様として命令しよう"
translation = "……그럼, 주인님으로서 명령하지"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「────っ<emoji=heart04>\u3000な、何でしょうか？」"
translation = "「────읏<emoji=heart04> 무, 무엇인가요?」"

[[dialogue]]
speaker = "unk"
original = "蘭美、バニーガールに変身して"
translation = "라비, 바니걸로 변신해 줘"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「……かしこまりました、ご主人様ぁ<emoji=heart04>」"
translation = "「……알겠습니다, 주인님<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ど、どうかしら……？」"
translation = "「어, 어떠니……?」"

[[dialogue]]
speaker = "unk"
original = "ぎゅー……！！"
translation = "꼬옥─……!!"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴゃあっ<emoji=heart04>\u3000さ、さっきより、強いぎゅー、されてるっ……ふ、ふふっ<emoji=heart04>\u3000そんなに喜んでくれるだなんて……」"
translation = "「뺘앗<emoji=heart04> 아, 아까보다 세게 안아주고 있어…… 후, 후훗<emoji=heart04> 그렇게나 기뻐해 주다니……」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「──私が嫌がってるから、リクエスト、しづらかったの？」"
translation = "「──내가 싫어하고 있어서, 리퀘스트하기 힘들었어?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「……確かに、あんまり積極的には着たくないわね。ラパン地方への誤解や偏見が広まっちゃうもの、この衣装」"
translation = "「……확실히, 그다지 적극적으로 입고 싶지는 않네. 라팡 지방에 대한 오해나 편견이 넓어져 버리는걸, 이 의상」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「でも、あくまで……不特定多数の人から見られる場所では、着たくないってだけよ？」"
translation = "「하지만, 어디까지나…… 불특정 다수의 사람이 보는 장소에서는 입고 싶지 않을 뿐이야?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「……ご主人様と２人きりなら、私だってやぶさかじゃないぴょん<emoji=heart04>\u3000貴方も──すっごく喜んでくれるし」"
translation = "「……주인님과 단둘이라면 나도 마다하지 않는다 뿅<emoji=heart04> 당신도── 엄청 기뻐해 주고」"

[[dialogue]]
speaker = "unk"
original = "ありがとう、蘭美。大好きだ"
translation = "고마워, 라비. 정말 좋아해"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「うん……私も<emoji=heart04>\u3000あっ……ちょ、ちょっとっ<emoji=heart04>\u3000お顔、そんなに近づけちゃ──んんんっ<emoji=heart04>」"
translation = "「응…… 나도<emoji=heart04> 앗…… 잠, 잠깐만<emoji=heart04> 얼굴을 그렇게 가까이 가져다 대면── 읍읍읍<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「んちゅ、ぷぁ<emoji=heart04>\u3000はぅう……こんな恥ずかしい格好で、キスしちゃったぴょん……<emoji=heart04>」"
translation = "「쪽, 푸하<emoji=heart04> 하으으…… 이런 부끄러운 차림으로 키스해 버렸다 뿅……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "尻尾も可愛いなぁ……"
translation = "꼬리도 귀엽네……"

[[dialogue]]
speaker = "unk"
original = "うさ耳、なでなで……"
translation = "토끼 귀, 쓰담쓰담……"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴゃっ<emoji=heart04>\u3000お耳、そんな優しく撫でちゃだめぇ……んんっ<emoji=heart04>\u3000尻尾も、さわさわ……触り方、ちょっとえっちっ……<emoji=heart04>」"
translation = "「뺘앗<emoji=heart04> 귀를 그렇게 부드럽게 쓰다듬으면 안 돼…… 으응<emoji=heart04> 꼬리도 만질만질…… 만지는 방식이 조금 야해……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "──だめ？"
translation = "──안 돼?"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「だ、ダメじゃない……ぴょん<emoji=heart04>\u3000もう──あんまり、言わせないで欲しいぴょん……んぅ<emoji=heart04>」"
translation = "「아, 안 되는 건 아니야…… 뿅<emoji=heart04> 정말이지── 너무 말하게 하지 말았으면 좋겠다 뿅…… 으응<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺の腕の中で、もじもじと身じろぎするウサギの恋人が可愛すぎて……その日は１日中、蘭美とくっついて過ごすのだった──"
translation = "내 품 안에서 쭈뼛쭈뼛 몸을 움직이는 토끼 연인이 너무 귀여워서…… 그날은 하루 종일 라비와 안겨서 지내는 것이었다──"

