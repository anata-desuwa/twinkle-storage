[[dialogue]]
speaker = "unk"
original = "第４話,遊園地デート再び,P"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ハロウィンも終わり、今度こそ俺にも環にも時間の余裕が出来た。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そこで休日に環を誘って、久しぶりにがっつり遊ぶことにした。"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「デート！？\u3000うん、行く！\u3000行こう行こう！」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「会長と遊びに行くのずーっとおあずけにしてたし……いつにする？\u3000ボクはいつでもいいよ？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「やりたいこと、いっぱいたまってるんだよね～。映画も見たいし、ゲーセンにも行きたいし、ショッピングもしたいし、それから……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "デートに誘われた環は、待ってましたとばかりにテンションが上がる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そして──"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺たちがデートの場所として選んだのは遊園地だった。"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふーっ、なかなかヤバいフリーフォールだったねー」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ちょっと甘く見てた"
translation = ""

[[dialogue]]
speaker = "unk"
original = "すごい速さだったな"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「だね～。空中とか高速の移動には慣れてるはずなのに、思わずヒェッてなっちゃったよ。会長もちょっと悲鳴出ちゃってたよね？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、そうだ、『魔王も悲鳴をあげるフリーフォール』って売り文句にしたら箔がつかないかな？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "それは俺が恥ずかしいよ……"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、そっかー。けど、さすがはこの遊園地の新しい目玉アトラクションって謳ってるだけあるなー。怖かったけど面白かった！」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それじゃ次は何に乗る？\u3000絶叫系が続いちゃうけどジェットコースター行っとく？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「もちろん遊園地に来たからには目指すよね、全アトラクション制覇♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そう言って環は俺の手を掴むと、次の目当てのアトラクションに引っ張っていく。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "無邪気にはしゃぐ環はキラキラと輝くような笑顔を浮かべていて……"
translation = "천진난만하게 까불거리는 타마키는 반짝반짝 빛나는 듯한 미소를 짓고 있어서……"

[[dialogue]]
speaker = "unk"
original = "そんな彼女が世界の摂理を司る守護天使の１人だと言っても、俄かには信じてもらえないだろうと思ってしまう。"
translation = "그런 그녀가 세계의 섭리를 관장하는 수호천사 중 한 명이라고 말을 해도, 선뜻 믿어주지 않을 거라는 생각이 들어버린다."

[[dialogue]]
speaker = "unk"
original = "（環の笑顔、やっぱりいいな……）"
translation = "(타마키의 미소, 역시 좋네……)"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ん、何かな？\u3000ニコニコしながらボクのことを見つめちゃってー♪」"
translation = "「응, 무슨 일이야? 싱글벙글 웃으면서 나를 빤히 쳐다보고ー♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ひょっとしてボクの可愛さに見とれちゃってたりしたのかな？」"
translation = "「혹시 나의 귀여움에 넋을 잃고 보고 있었던 걸까나?」"

[[dialogue]]
speaker = "unk"
original = "ああ、目が離せなかった"
translation = "아아, 눈을 뗄 수가 없었어"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ぅ……もうっ、どうしてそういう恥ずかしいことを、真顔で言うかなぁ……」"
translation = "「으…… 정말이지, 어째서 그런 부끄러운 말을 진지한 얼굴로 하는 걸까나……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「会長のそういうド直球な言葉に弱いんだよねー。ほら、ボクってこう見えて結構乙女なところがあるからさ」"
translation = "「회장의 그런 돌직구 같은 말에 약하단 말이지ー. 보라구, 나도 이렇게 보여도 제법 소녀 같은 구석이 있으니까 말이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「結構ドキドキさせられてるんだよ？\u3000それを自覚させたのも会長なんだからね？」"
translation = "「제법 두근거리게 만들고 있다구? 그걸 자각하게 만든 것도 회장이니까 말이야?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「告白してくれた時も、ボクの正体なんて関係ないって言って、『環は環だろ』って……ボクの１番欲しかった言葉をくれたりさ」"
translation = "「고백해 줬을 때도, 나의 정체 같은 건 상관없다고 말하면서 『타마키는 타마키잖아』라며…… 내가 가장 원했던 말을 해주기도 하고 말이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ほら、例の事件の時の、『いつか迎えに来るよ、環』って言葉もかなりの破壊力だったし……」"
translation = "「보라구, 그 사건 때의 『언젠가 마중하러 올게, 타마키』라는 말도 상당한 파괴력이었고……」"

[[dialogue]]
speaker = "unk"
original = "あの時は、とんだ失礼を……"
translation = "그때는 정말 결례를……"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、前も言ったけど、あの時のことはもういいってば」"
translation = "「아하하, 전에도 말했지만 그때 일은 이제 됐다니까」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「会長がボクのところに来れる状況じゃなかったってことはちゃんと分かってるし、埋め合わせもちゃんとしてくれたし♪」"
translation = "「회장이 나한테 올 수 있는 상황이 아니었다는 건 잘 알고 있고, 보상도 제대로 해줬고♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そう言えば、その埋め合わせで遊びに来たのもこの遊園地だったよね～」"
translation = "「그러고 보니, 그 보상으로 놀러 온 것도 이 놀이공원이었지～」"

[[dialogue]]
speaker = "unk"
original = "ああ、そうだな"
translation = "아아, 그랬지"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「何だかもうずいぶん前のことみたいに感じちゃうよ。会長がボクに改めて告白してくれたのも、ここだったんだよね……」"
translation = "「어쩐지 이제 제법 오래전 일처럼 느껴져버리네. 회장이 나한테 다시 한번 고백해 준 것도 여기였었지……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「『真実を知っても俺の気持ちは変わらない』って言ってくれて……それでボクは、ボクの気持ちを……」"
translation = "「『진실을 알아도 내 마음은 변하지 않아』라고 말해줘서…… 그래서 나는, 나의 마음을……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あーもうっ、思い返してたら顔が熱くなってきちゃったよ！」"
translation = "「아ー 정말, 되돌아보고 있으니까 얼굴이 화끈거려오기 시작했잖아!」"

[[dialogue]]
speaker = "unk"
original = "環は手でパタパタと顔をあおぐ。"
translation = "타마키는 손으로 부채질하며 얼굴을 식힌다."

[[dialogue]]
speaker = "unk"
original = "珍しく恥ずかしがっている環のことも可愛いと思うし、俺の言葉がそんな風に響いてくれていることも嬉しい。"
translation = "드물게 부끄러워하고 있는 타마키의 모습도 귀엽다고 생각하고, 내 말이 그렇게 가슴에 와닿아 주고 있다는 것도 기쁘다."

[[dialogue]]
speaker = "unk"
original = "──と思ったことをそのまま口に出して言ってしまうと、「またそんなコト言うんだ！」と叱られてしまいそうな気がする。"
translation = "──라고 생각한 것을 그대로 입 밖에 내어 말해버리면, 「또 그런 소릴 한다!」라며 혼나버릴 것 같은 기분이 든다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あー、やだやだ。こんな赤面しちゃってるところ、知り合いに見られたくないよ」"
translation = "「아ー, 싫다 싫어. 이렇게 얼굴을 붉히고 있는 모습, 아는 사람한테 보이고 싶지 않다구」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「っていうか、この遊園地にもしっかり知り合いがいるんだよね？」"
translation = "「그나저나, 이 놀이공원에도 확실히 아는 사람이 있는 거지?」"

[[dialogue]]
speaker = "unk"
original = "この遊園地も俺たちの元バイト先であり、そしてその時の元バイト仲間が今は正社員として働いていることは前回のデートで分かっていた。"
translation = "이 놀이공원도 우리들의 예전 알바 자리가 있고, 그리고 그때의 알바 동료가 지금은 정직원으로 일하고 있다는 것은 지난번 데이트에서 알고 있었다."

[[dialogue]]
speaker = "unk"
original = "すぐ知り合いに出くわす"
translation = "금방 아는 사람과 마주친다"

[[dialogue]]
speaker = "unk"
original = "環は顔が広いからな"
translation = "타마키는 마당발이니까 말이야"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それを言うなら会長だって同じじゃない？」"
translation = "「그 말을 하자면 회장도 마찬가지 아니야?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そもそもデート先が元バイト先ってことが多いんだからさ、知り合いに遭遇する確率も高くなるに決まってるよね！」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボクたちってデート中に知り合いに出くわすことが妙に多いかもって思ってたけど、よく考えたらそれって当たり前のことだったんだ」"
translation = "「우리들 데이트 중에 아는 사람과 마주치는 일이 묘하게 많을 지도라고 생각했는데, 잘 생각해 보니까 그건 당연한 거였어」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「まあ、別に嫌なわけじゃないけど……ボクらのプライバシーはもうこの世のどこにもないんだーって思っちゃうよ……」"
translation = "「뭐, 딱히 싫은 건 아니지만…… 우리들의 사생활은 이제 이 세상 어디에도 없구나ー 하고 생각해버린다구……」"

[[dialogue]]
speaker = "unk"
original = "周りに気を付けないとね"
translation = "주변을 조심해야겠네"

[[dialogue]]
speaker = "unk"
original = "いい雰囲気になった時は"
translation = "좋은 분위기가 되었을 때는"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん、そうだね……それは注意が必要かも……」"
translation = "「응, 그렇네…… 그건 주의가 필요할지도……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「会長も、不意打ちでボクをときめかせるよーなことは出来るだけ言わないよーに！」"
translation = "「회장도, 기습으로 나를 설레게 만드는 것 같은 말은 가능한 한 하지 않도록ー!」"

[[dialogue]]
speaker = "unk"
original = "自重します……"
translation = "자중하겠습니다……"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あははっ、ウソウソ！\u3000自重はしなくていいよ、むしろもっと聞かせて欲しいくらいなんだから！」"
translation = "「아하핫, 거짓말 거짓말! 자중은 안 해도 돼, 오히려 좀 더 들려줬으면 좋겠을 정도니까!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いろいろ言ったけど……結局、嬉しいんだよ。だからこれからも、ボクの喜ぶ言葉、いっぱいちょーだい♪」"
translation = "「이래저래 말했지만…… 결국, 기쁜 거라구. 그러니까 앞으로도 내가 기뻐할 만한 말, 잔뜩 줘♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「期待してるからね、会長っ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "なんだかハードルを上げられてしまった気もするが……。"
translation = "어쩐지 문턱이 높아져버린 기분도 듭니다만……."

[[dialogue]]
speaker = "unk"
original = "そのまま腕を組んで、悪戯っぽい笑みを浮かべる環は、間違いなく世界一可愛いなと心の中で呟く俺なのだった。"
translation = "그대로 팔짱을 끼고, 장난기 어린 미소를 짓는 타마키는 틀림없이 세상에서 가장 귀엽다고 마음속으로 중얼거리는 나였다."

