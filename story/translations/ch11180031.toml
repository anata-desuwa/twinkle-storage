[[dialogue]]
speaker = "unk"
original = "第１話,両手に花と蜘蛛,P"
translation = "제1화, 양손에 꽃과 거미, P"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ナターシャちゃんに絶対に似合うお洋服見つけたんだっ。今日こそはお買い物に付き合ってよーっ」"
translation = "「나타샤짱한테 절대 어울리는 옷을 찾았어. 오늘이야말로 쇼핑 같이 가줘─」"

[[dialogue]]
speaker = "unk"
original = "ナターシャとメルエルは幼なじみ……だと思っていたが、実はナターシャは護衛としてメルエルのそばにいた。"
translation = "나타샤와 멜엘은 소꿉친구……라고 생각했지만, 사실 나타샤는 호위로서 멜엘의 곁에 있었다."

[[dialogue]]
speaker = "unk"
original = "ナターシャはメルエルに複雑な想いを抱いていたようだが、先日の天界行きの際に、関係は改善したらしい。"
translation = "나타샤는 멜엘에게 복잡한 감정을 품고 있었던 모양이지만, 요전 날 천계에 갔을 때 관계가 개선된 듯하다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「え～、なんで私がメルエルと……じゃ、そのお店、教えて。１人で行ってくるから」"
translation = "「에~, 왜 내가 멜엘이랑…… 그럼, 그 가게 알려줘. 혼자 다녀올 테니까」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「それじゃダメなのっ！\u3000ナターシャちゃんと一緒に行きたいのっ！」"
translation = "「그러면 안 돼! 나타샤짱이랑 같이 가고 싶단 말이야!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「っていうか、私の胸、ちゃんと収まるの？\u3000この前の試着の時みたいにボタン弾け飛ばない？」"
translation = "「그나저나, 내 가슴 제대로 들어가긴 해? 지난번 가착 때처럼 단추 튕겨 나가는 거 아니야?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「………………たぶん！」"
translation = "「………………아마도!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「随分溜めたね。ま～、この前バスト測ったら、また少し成長してたみたいだし」"
translation = "「엄청 뜸 들이네. 뭐~ 지난번에 바스트 쟀을 때 또 조금 자란 것 같긴 하지만」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「まだ成長してるのっ！？\u3000ナターシャちゃん、どこまでセクシーになっちゃうのっ！？」"
translation = "「아직도 자라고 있어!? 나타샤짱, 어디까지 섹시해지는 거야!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いや、メルエルには言われたくないから」"
translation = "「아니, 멜엘한테는 그런 말 듣고 싶지 않은데」"

[[dialogue]]
speaker = "unk"
original = "……何の話してるの"
translation = "……무슨 이야기하고 있어?"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あ、会長さん。おっぱいの話だよ」"
translation = "「아, 회장님. 가슴 이야기야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ナターシャちゃん！？\u3000間違ってないといえば間違ってないけど、言い方ぁ～！？」"
translation = "「나타샤짱!? 틀린 말은 아니지만, 표현 방식이이~!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「こんなの重くてしょうがないだけなのに、メルエルってばまだおっぱい大きくなりたいんだって。充分立派なのがあるのにね」"
translation = "「이런 거 무거워서 어쩔 수 없는데, 멜엘은 아직도 가슴이 커지고 싶대. 충분히 훌륭한 게 있으면서 말이야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「そんな話してたかなっ！？\u3000確かに、おっぱ──胸の話はしてたけど、ナターシャちゃんこそ立派すぎるよっ！」"
translation = "「그런 이야기했었나!? 확실히 젖── 가슴 이야기는 했지만, 나타샤짱이야말로 너무 훌륭하다고!」"

[[dialogue]]
speaker = "unk"
original = "メルエルをからかうナターシャだが、その言動に悪意は感じない。"
translation = "멜엘을 놀리는 나타샤지만, 그 언동에 악의는 느껴지지 않는다."

[[dialogue]]
speaker = "unk"
original = "誰もが想像するわかりやすい仲良しではないものの、これが２人なりの良好な関係なんだと思う。"
translation = "누구나 상상하는 알기 쉬운 사이좋음은 아니지만, 이것이 두 사람 나름의 양호한 관계라고 생각한다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうだ、会長さんも一緒にお出かけしない？\u3000両手に花の放課後デートだよ」"
translation = "「맞다, 회장님도 같이 외출 안 할래? 양손에 꽃인 방과 후 데이트야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「私とお買い物に行くのは渋ったのに、会長くんが一緒ならＯＫなの？」"
translation = "「나랑 쇼핑하러 가는 건 떵떵거렸으면서, 회장군이 함께라면 OK인 거야?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ケンカになりがちだから、仲裁してくれる人が必要でしょ。その点、会長さんなら公平な目線で止めてくれそうだしね」"
translation = "「싸움이 나기 십상이니까, 중재해 줄 사람이 필요하잖아. 그런 점에서 회장님이라면 공평한 시선으로 말려줄 것 같고」"

[[dialogue]]
speaker = "unk"
original = "いざという時のケンカの仲裁役として、俺は２人に挟まれ、腕を引かれながら街へと繰り出すことになった。"
translation = "비상시의 싸움 중재역으로서, 나는 두 사람 사이에 끼어 팔을 이끌리며 거리로 나서게 되었다."

[[dialogue]]
speaker = "unk"
original = "ケンカにならないことを祈るばかりだ。"
translation = "싸움이 나지 않기만을 빌 따름이다."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ほら、この服！\u3000絶対ナターシャちゃんに似合うと思ったんだっ」"
translation = "「자, 이 옷! 절대 나타샤짱한테 어울릴 거라고 생각했어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふ～ん……ゆったりしてるから私の胸でも入るし、ベルトで締めれば太ってるようにも見えないね」"
translation = "「흠~…… 넉넉해서 내 가슴으로도 들어가고, 벨트로 매면 뚱뚱해 보이지도 않겠네」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「でしょ！\u3000前にナターシャちゃん、こういう服ならいいのにって言ってたもんね。お買い上げしちゃう？」"
translation = "「그렇지! 전에 나타샤짱, 이런 옷이면 좋을 텐데 하고 말했었잖아. 구매해 버릴까?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「まあ……検討しとくよ。探してくれて、ありがと」"
translation = "「뭐…… 검토해 볼게. 찾아줘서 고마워」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「にしても……このお店、ハロウィンだらけだね。ハロウィンってもうすぐなんだっけ」"
translation = "「그나저나…… 이 가게, 할로윈투성이네. 할로윈이 이제 곧이었던가」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「うんっ！\u3000テンション上がっちゃうよねっ」"
translation = "「응! 신나지 않아?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ん～……私は別にそんなことないけど。あ、仮装用のコスチュームとか、頭飾りなんかも置いてある……これ、ネコミミ？」"
translation = "「음~…… 나는 딱히 그렇지 않지만. 아, 가장용 코스튬이나 머리장식 같은 것도 놓여 있네…… 이거, 고양이 귀?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「かわいいっ！\u3000ナターシャちゃんつけてみて！」"
translation = "「귀여워! 나타샤짱 착용해 봐!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「絶対ヤ」"
translation = "「절대 싫어」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「秒で拒否されたっ！？」"
translation = "「초 단위로 거절당했어!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「で、このヒモみたいなのは……サキュバスのコスチューム？\u3000エッチだね、メルエル着てみて？」"
translation = "「그래서, 이 끈 같은 건…… 서큐버스 코스튬? 야하네, 멜엘 입어봐」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「絶対着ないよっ！？\u3000これで表に出たら通報されちゃうよっ！？」"
translation = "「절대 안 입어!? 이러고 밖으로 나가면 신고당한다고!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「秒で拒否された」"
translation = "「초 단위로 거절당했다」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「会長くんの前で、こんなの着れないよ～っ！\u3000お尻なんてほとんど丸出しだし……」"
translation = "「회장군 앞에서 이런 거 못 입는다고~! 엉덩이 같은 건 거의 훤히 드러나고……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「逆でしょ。これを着て会長さんを誘惑すれば、メルエルにメロメロだよ」"
translation = "「반대지. 이걸 입고 회장님을 유혹하면 멜엘한테 푹 빠질 텐데」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「そんなの無理っ！\u3000無理無理無理だよーっ！」"
translation = "「그런 거 무리! 무리무리 무리야─!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「せっかくのチャンスなのに。そんな調子じゃ、メルエルが会長さんを落とすなんて夢のまた夢──ひぃっ！？」"
translation = "「모처럼의 기회인데. 그런 태도로는 멜엘이 회장님을 꼬시는 건 꿈의 또 꿈── 히익!?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「え？\u3000今の可愛い悲鳴、ナターシャちゃん？」"
translation = "「어? 방금 그 귀여운 비명, 나타샤짱?」"

[[dialogue]]
speaker = "unk"
original = "蜘蛛の巣のステッカー？"
translation = "거미줄 스티커?"

[[dialogue]]
speaker = "unk"
original = "何かあった？"
translation = "무슨 일 있었어?"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「べ、別に？\u3000不意に出てきたから、ちょっと驚いただけだよ」"
translation = "「딱, 딱히? 갑자기 나와서 조금 놀랐을 뿐이야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ナターシャちゃんの虫嫌いは知ってたけど、こんなのでもダメなんだ？\u3000あ、こっちには蜘蛛のステッカーもある」"
translation = "「나타샤짱이 벌레 싫어하는 건 알고 있었지만, 이런 것도 안 돼? 아, 이쪽에는 거미 스티커도 있어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ぅひっ！？\u3000や、ステッカーくらい平気だって……」"
translation = "「으힉!? 아, 스티커 정도는 괜찮다고……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ほんとに？\u3000ナターシャちゃん、腰が引けてるよ？」"
translation = "「정말? 나타샤짱, 엉거주춤해하고 있어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あまり調子に乗ってるとメルエルの恥ずかしい秘密、会長さんの前でバラしちゃうよ」"
translation = "「너무 까불면 멜엘의 부끄러운 비밀, 회장님 앞에서 폭로해 버린다」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「それはズルいよっ！\u3000私だってナターシャちゃんの恥ずかしい秘密のひとつやふたつあるもんっ！」"
translation = "「그건 치사해! 나도 나타샤짱의 부끄러운 비밀 한두 개쯤은 있단 말이야!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いい度胸だね、メルエル。暴露をしていいのは、暴露される覚悟があるやつだけだよ？」"
translation = "「배짱 좋은데, 멜엘. 폭로를 해도 되는 건 폭로당할 각오가 있는 녀석뿐이야」"

[[dialogue]]
speaker = "unk"
original = "ビークール、ビークール！"
translation = "비 쿨, 비 쿨!"

[[dialogue]]
speaker = "unk"
original = "どうどうどうどう！"
translation = "진정해 진정해!"

[[dialogue]]
speaker = "unk"
original = "こうして俺は暴露合戦を止め、２人の仲裁役の仕事を果たした。"
translation = "이렇게 나는 폭로전성을 말리고, 두 사람의 중재역 역할을 다했다."

[[dialogue]]
speaker = "unk"
original = "今後も仲裁役の出番が増える……かもしれない。"
translation = "앞으로도 중재역의 차례가 늘어날……지도 모른다."

