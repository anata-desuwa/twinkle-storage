[[dialogue]]
speaker = "unk"
original = "第９話,『長くて短い時間の終わり』,B"
translation = ""

[[dialogue]]
speaker = "unk"
original = "オオヒメとルヴィネが流星学園附属校に通い始めて、早くも２週間が過ぎた。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "それはルヴィネが予定していた視察の期間の終わりも意味していた。"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「実りの多い２週間だったわ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "オオヒメたちがルヴィネに視察の感想を訊ねると、ルヴィネは朗らかな笑顔を浮かべてそう答えた。"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「<ruby>流星学園附属校<rt>ここ</rt></ruby>で学んだ知見と経験は、きっと極星学園の附属校設立の際に活かされるわ」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「けれど、様々な問題点も見えてきた。もっと慎重に、十分な時間をかけて取り組まなければならない事だということも見えてきたわ」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「開校にこぎつけるまで、１０年以上の歳月がかかってしまうかもしれないわね……」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「けれど、それでもいつか必ず実現させてみせるわ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "熱を帯びた口調で、ルヴィネは決意を語ったのだった。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そして一方、オオヒメは──"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「毎週の地域清掃の分担を巡って１班と２班の空気がギスギスしているのだな？」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「わかった。それぞれの班長に私のところへ来るよう伝えてくれ。一度、３人で話をしよう」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「放課後の戦闘訓練に参加したかったが、家庭の事情で難しくなってしまった？」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「それは残念だな。どれだけ力になれるかわからないが、私でよければ相手になるぞ」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「なになに？\u3000隣の家に住んでいる幼なじみの男の子に告白されたのだけど、どうすればいいかだと？」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ななな……わ、私にそんなことを聞かれても困る！\u3000分かるわけがないだろう！\u3000何でも相談に乗るとは言ったが、恋愛相談だけは勘弁してくれ！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "……と、生来の委員長気質を発揮し、クラスでもすっかり頼られる存在になっていた。"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ヒメさんがここまで頼られる存在になるとは思いませんでした」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「む……何やら含みのある物言いのように聞こえるが？」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「いえ、最初の印象が大転倒でしたから。よくここまで回復できたものだなと」"
translation = "「아뇨, 첫인상이 크게 넘어졌으니까요. 잘도 여기까지 회복했구나 싶어서요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ううっ……！！」"
translation = "「우우……!!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「誉め言葉ですよ。ヒメさんはいつも真面目で、一生懸命で、何事に対しても全力です」"
translation = "「칭찬이에요. 히메 씨는 항상 진지하고, 열심히며, 무슨 일이든 전력을 다하니까요」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「だからこそクラスの皆もヒメさんに心を開き、ここまで頼られる存在になったのだと思います」"
translation = "「그렇기에 반 모두도 히메 씨에게 마음을 열고, 여기까지 의지하는 존재가 되었다고 생각해요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そ、そうだろうか？\u3000ふふ、認められるというのは嬉しいものだな……」"
translation = "「그, 그런가? 후후, 인정받는다는 건 기쁜 일이구나……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「同時にそのチョロすぎる性格も知れ渡ってしまいましたが……」"
translation = "「동시에 그 너무 호구 같은 성격도 널리 알려져 버렸지만요……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「私は別に、チョロいわけでは……！」"
translation = "「저는 딱히, 호구 같은 게……!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「しかも天然ですし……立派に愛されキャラクターの座を獲得していますよ」"
translation = "「게다가 천연이고요…… 훌륭하게 사랑받는 캐릭터의 자리를 획득하고 있어요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「うぅぅ……私は守護天使なのにあんまりな評価だ。いっそ掃除道具入れの中に閉じこもってしまおうか……」"
translation = "「우으으…… 나는 수호천사인데 너무한 평가다. 차라리 청소도구함 속에 틀어박혀 버릴까……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「こんなやり取りも、今日で最後かもしれないのですね……」"
translation = "「이런 주고받음도, 오늘로 마지막일지도 모르겠네요……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ナミエル殿……」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「こんな愛され守護天使に毎日会えなくなると思うと、きっと寂しがるでしょう……みんなも、私も……」"
translation = "「이런 사랑받는 수호천사를 매일 만날 수 없게 된다고 생각하면, 분명 외로워하겠죠…… 모두도, 저도……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ふふ……らしくありませんね。少し感傷的な気持ちになっていたかもしれません」"
translation = "「후후…… 저답지 않네요. 조금 감상적인 기분이 되었을지도 몰라요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そうだな。感傷的になる必要は無い。二度と会えなくなるわけではないのだから！」"
translation = "「그래. 감상적이 될 필요는 없다. 두 번 다시 못 만나게 되는 건 아니니까!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「毎日とはいかないが、時間が出来たらまた登校する。必ず、約束しよう」"
translation = "「매일은 힘들겠지만, 시간이 나면 또 등교하겠다. 반드시, 약속하지」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ええ、お願いします……」"
translation = "「네, 부탁드릴게요……」"

[[dialogue]]
speaker = "unk"
original = "こうして守護天使たちの、集中登校週間は終わりを告げた。"
translation = "이렇게 수호천사들의, 집중 등교 주간은 끝을 고했다."

[[dialogue]]
speaker = "unk"
original = "守護天使たちにとっては一瞬とも言える短い時間。"
translation = "수호천사들에게 있어서는 일순간이라고도 할 수 있는 짧은 시간."

[[dialogue]]
speaker = "unk"
original = "だが、きっと──今、ここで得たこの経験は、何ものにも代えがたい天恵である。"
translation = "하지만, 분명── 지금, 여기서 얻은 이 경험은, 그 무엇과도 바꿀 수 없는 천혜이다."

[[dialogue]]
speaker = "unk"
original = "陽の差し陰る流星学園附属の校舎を背にしながら、オオヒメは強く感じていたのだった。"
translation = "볕이 비스듬히 지는 유성학원 부속 교사를 뒤로하면서, 오오히메는 강하게 느끼고 있던 것이었다."

