[[dialogue]]
speaker = "unk"
original = "第３話,エルデリーゼの恋人感謝祭,P"
translation = "제3화, 엘데리제의 연인 감사제, P"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁぁ……今日もアイドル様は尊みに溢れていましたわ……心が幸せに満ちていますわ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "エルゼの推している地下アイドルのライブを一緒に見に行ったその帰り、俺たちはスイーツ店で今日のライブの感想を語り合っていた。"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ファンの気持ちを１００％理解っているセットリストでしたの。欲しいタイミングで欲しい曲が来るのは、たまりませんですわ♪」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「今日はいつも以上にファンサが多くて、絶対に視線も合ってましたし、指ハートまで作ってもらっちゃいましたわ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "いつもより目立ってたのかも"
translation = ""

[[dialogue]]
speaker = "unk"
original = "エルゼもメイド服だったしね"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ、なるほどですわ！\u3000嬉しすぎて、昂りがまるで治まりませんの。次のライブも絶対に足を運ばなくては──」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ……申し訳ありません、会長様。せっかくのデートですのに、私ばかり盛り上がってしまって……」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「退屈ではありませんでしたか……？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "君の喜んでる姿が一番の幸せだから"
translation = ""

[[dialogue]]
speaker = "unk"
original = "同じくらい、俺も楽しんだよ"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ……会長様はお優しすぎます。こうやって終わった後に感想を言える相手がいるだけでも、私は嬉しすぎてたまりませんのに……」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ですが、施されてばかりでは桜十路家の名が廃ってしまいますの」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ギブ・アンド・テイクですわ。私が会長様にして差し上げられることは何かありませんの？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "じゃあ俺にもファンサしてくれる？"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ファンサ、ですの？」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「私はアイドルではありませんし、会長様は私のファンではなく……大切な……かけがえのない恋人ですわ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺にとって一番のアイドルはエルゼだから"
translation = ""

[[dialogue]]
speaker = "unk"
original = "それでもお願い"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぅんっ<emoji=heart04>\u3000もう、会長様が私を胸キュンさせたらアベコベではありませんの……」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そんなあなた様だからこそ、私は好きになってしまったのですけど……♪」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「わ、わかりましたわ。本職のアイドル様のような胸キュンファンサはできませんけど……」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「私が浴びてきたファンサを、会長様にお返ししますわ。受け止めてくださいませ」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「恥ずかしいですけど……んぅー……ちゅっ<emoji=heart04>\u3000い、いかがでしょう？\u3000投げキッスですわ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "すごく良いけどもう一声！"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「な、投げキッスでは足りませんの？\u3000会長様は欲張りさんですわ。これ以上、何をすれば──」"
translation = ""

[[dialogue]]
speaker_original = "ウェイトレス"
speaker_translation = "웨이트리스"
original = "「お待たせしましたー。生ホイップもりもりパンケーキとウルトラギガジャンボパフェになりまーす」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ちょうど頼んでいたメニューが届きましたわ。せっかくですから先にいただきましょう」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "スイーツでファンサしてもらおうかな"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「えっ……では、お写真を──申し訳ありません、ウェイトレス様。私と会長様を一緒に撮っていただけますか？」"
translation = ""

[[dialogue]]
speaker_original = "ウェイトレス"
speaker_translation = "웨이트리스"
original = "「いいですよー。それじゃ、もっと近づいて、肩を寄せてくださいねー」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「会長様、右手をこう……ハートの半分にできますか？\u3000私もこう、手を添えて──」"
translation = ""

[[dialogue]]
speaker_original = "ウェイトレス"
speaker_translation = "웨이트리스"
original = "「あー、いいですねー。上手にハートが作れてますよー。はい、チーズ！」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふふ、いかがですか、会長様。ラブラブ手ハートですわ♪\u3000こちらの画像は後ほどお送りしますわね」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「え？\u3000会長様からもファンサを？\u3000何をしてくださるのでしょう？」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「食べさせてくださいますの……？\u3000周りの皆様がこちらを見てます……少し恥ずかしいですわ……」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「では、そちらのパンケーキをいただきますわ……あーん……か、会長様、ちょっと大きくないですの……？\u3000ぱくっ」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「むぐむぐ……はぅうん……クリームたっぷり……ふわふわのしゅわしゅわでお口の中で溶けるパンケーキですわ」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いつもより美味しく感じるのは、きっと会長様の『あーん』のおかげですわね<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「では、今度は私から……会長様、お口を開けてくださいませ♪」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ、大きなお口。私の指まで食べられてしまいそうですわ。はい、あーん♪」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ぱくっ♪\u3000ふふ、お上手お上手……あら？\u3000お鼻にクリームがついてしまいましたわね」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「会長様、クリームを取りますので、動かないでくださいませ」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ちょいちょいっと……はい、綺麗になりましたわ。お鼻についてたクリームは……舐め取ってしまいますわね」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ぺろっ、ちゅ、ちゅぱっ……ふふ、会長様のクリーム、甘ぁくて美味しいですわ♪\u3000もっとぺろぺろしたくなってしまいますの♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "このくらいにしておこうか！"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ストップストーップ！"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あら、私、まだ会長様へのファンサし足りませんわ。やっと乗ってきたところですのに」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "すっかり注目の的だ。これ以上はふたりきりの場所じゃないとマズい。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ますますエスカレートしてしまいそうなエルゼのファンサに『待った』をかけたのだった。"
translation = ""

