[[dialogue]]
speaker = "unk"
original = "第３話,エルデリーゼの恋人感謝祭,P"
translation = "제3화, 엘데리제의 연인 감사제, P"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁぁ……今日もアイドル様は尊みに溢れていましたわ……心が幸せに満ちていますわ……<emoji=heart04>」"
translation = "「하아아…… 오늘 도 아이돌 님은 존엄함이 넘쳐흐르셨어요…… 마음이 행복으로 가득 차 있어요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "エルゼの推している地下アイドルのライブを一緒に見に行ったその帰り、俺たちはスイーツ店で今日のライブの感想を語り合っていた。"
translation = "엘제가 응원하는 지하 아이돌의 라이브를 함께 보러 갔던 길, 우리들은 디저트 가게에서 오늘 라이브의 감상을 서로 나누고 있었다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ファンの気持ちを１００％理解っているセットリストでしたの。欲しいタイミングで欲しい曲が来るのは、たまりませんですわ♪」"
translation = "「팬의 마음을 100% 이해하고 있는 세트리스트였어요. 원하는 타이밍에 원하는 곡이 나오는 건, 참을 수 없어요♪」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「今日はいつも以上にファンサが多くて、絶対に視線も合ってましたし、指ハートまで作ってもらっちゃいましたわ……<emoji=heart04>」"
translation = "「오늘은 평소보다 팬서비스가 많아서, 분명히 시선도 마주쳤고, 손가락 하트까지 만들어줬어요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "いつもより目立ってたのかも"
translation = "평소보다 눈에 띄었을지도"

[[dialogue]]
speaker = "unk"
original = "エルゼもメイド服だったしね"
translation = "엘제도 메이드복이었고 말이지"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ、なるほどですわ！\u3000嬉しすぎて、昂りがまるで治まりませんの。次のライブも絶対に足を運ばなくては──」"
translation = "「아, 과연 그렇군요! 너무 기뻐서, 들뜬 마음이 전혀 가라앉질 않아요. 다음 라이브도 반드시 찾아가지 않으면──」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ……申し訳ありません、会長様。せっかくのデートですのに、私ばかり盛り上がってしまって……」"
translation = "「아…… 죄송합니다, 회장님. 모처럼의 데이트인데, 저만 신나버려서는……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「退屈ではありませんでしたか……？」"
translation = "「지루하지는 않으셨나요……?」"

[[dialogue]]
speaker = "unk"
original = "君の喜んでる姿が一番の幸せだから"
translation = "네가 기뻐하는 모습이 가장 큰 행복이니까"

[[dialogue]]
speaker = "unk"
original = "同じくらい、俺も楽しんだよ"
translation = "그만큼, 나도 즐거웠어"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ……会長様はお優しすぎます。こうやって終わった後に感想を言える相手がいるだけでも、私は嬉しすぎてたまりませんのに……」"
translation = "「뭐…… 회장님은 너무 다정하세요. 이렇게 끝난 후에 감상을 말할 수 있는 상대가 있는 것만으로도, 저는 너무 기뻐서 참을 수 없는데……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ですが、施されてばかりでは桜十路家の名が廃ってしまいますの」"
translation = "「하지만, 받기만 해서는 사쿠라토지 가문의 이름이 무색해져버려요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ギブ・アンド・テイクですわ。私が会長様にして差し上げられることは何かありませんの？」"
translation = "「기브 앤 테이크예요. 제가 회장님께 해드릴 수 있는 일은 뭐 없을까요?」"

[[dialogue]]
speaker = "unk"
original = "じゃあ俺にもファンサしてくれる？"
translation = "그럼 나한테도 팬서비스 해줄래?"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ファンサ、ですの？」"
translation = "「팬서비스, 말인가요?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「私はアイドルではありませんし、会長様は私のファンではなく……大切な……かけがえのない恋人ですわ」"
translation = "「저는 아이돌이 아니고, 회장님은 제 팬이 아니라…… 소중한…… 둘도 없는 연인이잖아요」"

[[dialogue]]
speaker = "unk"
original = "俺にとって一番のアイドルはエルゼだから"
translation = "나한테 있어서 제일가는 아이돌은 엘제니까"

[[dialogue]]
speaker = "unk"
original = "それでもお願い"
translation = "그래도 부탁해"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぅんっ<emoji=heart04>\u3000もう、会長様が私を胸キュンさせたらアベコベではありませんの……」"
translation = "「하앙<emoji=heart04> 정말, 회장님이 저를 심쿵하게 만들면 거꾸로잖아요……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そんなあなた様だからこそ、私は好きになってしまったのですけど……♪」"
translation = "「그런 당신이기에, 저는 좋아하게 되어버린 거지만요……♪」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「わ、わかりましたわ。本職のアイドル様のような胸キュンファンサはできませんけど……」"
translation = "「아, 알겠어요. 본업 아이돌 님 같은 심쿵 팬서비스는 못 하지만……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「私が浴びてきたファンサを、会長様にお返ししますわ。受け止めてくださいませ」"
translation = "「제가 받았던 팬서비스를, 회장님께 돌려드릴게요. 받아주세요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「恥ずかしいですけど……んぅー……ちゅっ<emoji=heart04>\u3000い、いかがでしょう？\u3000投げキッスですわ<emoji=heart04>」"
translation = "「부끄럽지만…… 응─…… 쪽<emoji=heart04> 어, 어떠신가요? 손키스예요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "すごく良いけどもう一声！"
translation = "엄청 좋지만 한 번 더!"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「な、投げキッスでは足りませんの？\u3000会長様は欲張りさんですわ。これ以上、何をすれば──」"
translation = "「손, 손키스로는 부족한가요? 회장님은 욕심쟁이시네요. 이 이상, 뭘 하면──」"

[[dialogue]]
speaker_original = "ウェイトレス"
speaker_translation = "웨이트리스"
original = "「お待たせしましたー。生ホイップもりもりパンケーキとウルトラギガジャンボパフェになりまーす」"
translation = "「기다리셨습니다─. 생휘핑크림 듬뿍 팬케이크와 울트라 기가 장보 파페 나왔습니다─」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ちょうど頼んでいたメニューが届きましたわ。せっかくですから先にいただきましょう」"
translation = "「마침 주문했던 메뉴가 도착했네요. 모처럼이니 먼저 먹도록 해요」"

[[dialogue]]
speaker = "unk"
original = "スイーツでファンサしてもらおうかな"
translation = "디저트로 팬서비스 받아볼까"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「えっ……では、お写真を──申し訳ありません、ウェイトレス様。私と会長様を一緒に撮っていただけますか？」"
translation = "「에…… 그럼, 사진을── 죄송합니다, 웨이트리스 님. 저와 회장님을 함께 찍어주실 수 있나요?」"

[[dialogue]]
speaker_original = "ウェイトレス"
speaker_translation = "웨이트리스"
original = "「いいですよー。それじゃ、もっと近づいて、肩を寄せてくださいねー」"
translation = "「좋아요─. 그럼, 좀 더 가까이, 어깨를 붙여주세요─」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「会長様、右手をこう……ハートの半分にできますか？\u3000私もこう、手を添えて──」"
translation = "「회장님, 오른손을 이렇게…… 하트의 반쪽으로 해주실 수 있나요? 저도 이렇게, 손을 대서──」"

[[dialogue]]
speaker_original = "ウェイトレス"
speaker_translation = "웨이트리스"
original = "「あー、いいですねー。上手にハートが作れてますよー。はい、チーズ！」"
translation = "「아─, 좋네요─. 예쁘게 하트가 만들어졌어요─. 자, 김치─!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふふ、いかがですか、会長様。ラブラブ手ハートですわ♪\u3000こちらの画像は後ほどお送りしますわね」"
translation = "「후후, 어떠신가요, 회장님. 꽁냥꽁냥 손하트예요♪ 이 이미지 사진은 나중에 보내드릴게요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「え？\u3000会長様からもファンサを？\u3000何をしてくださるのでしょう？」"
translation = "「네? 회장님도 팬서비스를? 뭘 해주시는 건가요?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「食べさせてくださいますの……？\u3000周りの皆様がこちらを見てます……少し恥ずかしいですわ……」"
translation = "「먹여주시는 건가요……? 주변의 분들이 이쪽을 보고 있어요…… 조금 부끄럽네요……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「では、そちらのパンケーキをいただきますわ……あーん……か、会長様、ちょっと大きくないですの……？\u3000ぱくっ」"
translation = "「그럼, 저쪽의 팬케이크를 먹을게요…… 아─앙…… 회, 회장님, 조금 크지 않나요……? 냠」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「むぐむぐ……はぅうん……クリームたっぷり……ふわふわのしゅわしゅわでお口の中で溶けるパンケーキですわ」"
translation = "「우물우물…… 하아응…… 크림 듬뿍…… 폭신폭신 사르르 입안에서 녹는 팬케이크예요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いつもより美味しく感じるのは、きっと会長様の『あーん』のおかげですわね<emoji=heart04>」"
translation = "「평소보다 맛있게 느껴지는 건, 분명 회장님의 『아─앙』 덕분이겠네요<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「では、今度は私から……会長様、お口を開けてくださいませ♪」"
translation = "「그럼, 이번엔 제가…… 회장님, 입을 벌려주세요♪」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ、大きなお口。私の指まで食べられてしまいそうですわ。はい、あーん♪」"
translation = "「어머, 입을 크게 벌리셨네요. 제 손가락까지 먹혀버릴 것 같아요. 자, 아─앙♪」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ぱくっ♪\u3000ふふ、お上手お上手……あら？\u3000お鼻にクリームがついてしまいましたわね」"
translation = "「냠♪ 후후, 잘 먹네요 잘 먹어…… 어라? 코에 크림이 묻어버렸네요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「会長様、クリームを取りますので、動かないでくださいませ」"
translation = "「회장님, 크림을 닦아드릴 테니, 움직이지 말아주세요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ちょいちょいっと……はい、綺麗になりましたわ。お鼻についてたクリームは……舐め取ってしまいますわね」"
translation = "「쓱쓱…… 자, 깨끗해졌어요. 코에 묻어있던 크림은…… 핥아먹어버려야겠어요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ぺろっ、ちゅ、ちゅぱっ……ふふ、会長様のクリーム、甘ぁくて美味しいですわ♪\u3000もっとぺろぺろしたくなってしまいますの♪」"
translation = "「할짝, 쪽, 쪼옥…… 후후, 회장님의 크림, 달콤하고 맛있어요♪ 더욱 할짝할짝하고 싶어져버려요♪」"

[[dialogue]]
speaker = "unk"
original = "このくらいにしておこうか！"
translation = "이쯤 해둘까!"

[[dialogue]]
speaker = "unk"
original = "ストップストーップ！"
translation = "스톱 스토옵!"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あら、私、まだ会長様へのファンサし足りませんわ。やっと乗ってきたところですのに」"
translation = "「어라, 저, 아직 회장님께 팬서비스가 부족한데요. 겨우 필이 오기 시작한 참인데」"

[[dialogue]]
speaker = "unk"
original = "すっかり注目の的だ。これ以上はふたりきりの場所じゃないとマズい。"
translation = "그야말로 주목의 대상이다. 이 이상은 둘만의 장소가 아니면 곤란하다."

[[dialogue]]
speaker = "unk"
original = "ますますエスカレートしてしまいそうなエルゼのファンサに『待った』をかけたのだった。"
translation = "갈수록 에스컬레이트할 것 같은 엘제의 팬서비스에 『잠깐』을 걸었던 것이었다."

