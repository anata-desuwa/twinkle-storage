[[dialogue]]
speaker = "unk"
original = "魔王の力が復活し、流星クルセイダースはザタナーンとの最終決戦へ突入していた。"
translation = "마왕의 힘이 부활하고, 류세이 크루세이더스는 자타난과의 최종 결전으로 돌입해 있었다."

[[dialogue]]
speaker = "unk"
original = "アビスブレイカー！"
translation = "아비스 브레이커!"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「ぐっ……！\u3000やはりリ・クリエの力に匹敵するか、魔王の力……！」"
translation = "「큭……! 역시 리 크리에의 힘에 필적하는가, 마왕의 힘……!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「魔王の力に共鳴して、私たちの霊力もパワーアップしている今なら！」"
translation = "「마왕의 힘에 공명해서, 우리들의 영력도 파워업한 지금이라면!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「リ・クリエの強大な力にも、負けたりしないわ！」"
translation = "「리 크리에의 강대한 힘에도, 지지 않을 거야!」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「ぬうぅっ！\u3000クルセイダース……邪魔だ！」"
translation = "「누우앗! 크루세이더스…… 방해된다!」"

[[dialogue]]
speaker = "unk"
original = "ザタナーンは衝撃波を放つが、バリアーが展開されて、それを防ぐ。"
translation = "자타난은 충격파를 내뿜지만, 배리어가 전개되어, 그것을 막아낸다."

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「会長さんパワーで無敵になった、カチカチバリアーなのです♪」"
translation = "「회장님 파워로 무적이 된, 딱딱 배리어인 것입니다♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「あたしも全力でぶちかますよ！\u3000ヴォルケインマリンシュトローム！」"
translation = "「나도 전력으로 들이부을게! 볼케인 마린 슈스트롬!」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「――ぐおおぉっ！？\u3000ならば……！」"
translation = "「――그오오앗!? 그렇다면……!」"

[[dialogue]]
speaker_original = "複製魔族"
speaker_translation = "복제 마족"
original = "「イ～～～！！！」"
translation = "「이~~~!!!」"

[[dialogue]]
speaker = "unk"
original = "ザタナーンは自身の足元から影を広げ、魔族の大群を作り出す。"
translation = "자타난은 자신의 발밑에서 그림자를 넓혀, 마족 대군을 만들어 낸다."

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「げっ！\u3000野郎、堪らず数に訴えてきやがった！」"
translation = "「게엑! 이 녀석, 견디지 못하고 숫자로 밀어붙이려 들잖아!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「一対多数なら、私たちの方が適任でしょ！」"
translation = "「일대다수라면, 우리 쪽이 더 적임이잖아!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「いいだろう。付き合うぞ、もう１人の私よ」"
translation = "「좋겠지. 어울려주마, 또 한 명의 나여」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ここは私たちに任せて、先に行けってね♪」"
translation = "「여기는 우리에게 맡기고, 먼저 가라구♪」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「なら、私も一緒にやります！」"
translation = "「그럼, 저도 함께 하겠어요!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ヒュー♪\u3000マトイちゃんも二刀流とはおあつらえ向きね～、だったら！」"
translation = "「휘유♪ 마토이짱도 이도류라니 딱 안성맞춤이네~ 그렇다면!」"

[[dialogue]]
speaker_original = "３人"
speaker_translation = "3명"
original = "「――ユニゾン！！」"
translation = "「――유니존!!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「お姉ちゃんたちが魔族を止めてくれている間に、私たちも！」"
translation = "「언니들이 마족을 멈춰주고 있는 동안에, 우리들도!」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「私の霊力も全て、あなたたちに託すわ！\u3000だから、お願い！」"
translation = "「내 영력도 전부, 너희에게 맡길게! 그러니까, 부탁해!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「はいなのです！」"
translation = "「네인 것입니다!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「これで勝負を決めるわよ！」"
translation = "「이걸로 승부를 내겠어!」"

[[dialogue]]
speaker = "unk"
original = "行くよ、みんな！"
translation = "가자, 모두들!"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「それじゃあ――せ～のっ！！！」"
translation = "「그러면―― 하나~ 둘!!」"

[[dialogue]]
speaker = "unk"
original = "声を合わせて、叫ぶ。"
translation = "목소리를 맞춰, 외친다."

[[dialogue]]
speaker_original = "５人"
speaker_translation = "5명"
original = "「――フルユニゾン！！！」"
translation = "「――풀 유니존!!!」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「ぐううぅーーーっ！？」"
translation = "「구우우우―――앗!?」"

[[dialogue]]
speaker = "unk"
original = "ザタナーンに５人で連携攻撃を叩き込んで行く――そして。"
translation = "자타난에게 5명이서 연계 공격을 두들겨 박아 간다―― 그리고."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「トドメは譲ってあげるわ！\u3000決めなさい！」"
translation = "「마무리는 양보해 줄게! 결정지어!」"

[[dialogue]]
speaker = "unk"
original = "みんなとルネアの霊力を束ね、魔王の力と合わせて、解き放つ。"
translation = "모두와 루네아의 영력을 묶어, 마왕의 힘과 합쳐서, 해방한다."

[[dialogue]]
speaker = "unk"
original = "アルケインメテオストリーム！！！"
translation = "아케인 메테오 스트림!!!"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「ぐっ……ぬおおおぉぉぉーーーーーーーーーッ！！？」"
translation = "「큭…… 누오오오오오―――――――――앗!!?」"

[[dialogue]]
speaker = "unk"
original = "全力の一撃がザタナーンに直撃し、パキン、と砕けたような音が響く。"
translation = "전력의 일격이 자타난에게 직격하고, 쨍그랑, 하고 깨지는 듯한 소리가 울려 퍼진다."

[[dialogue]]
speaker = "unk"
original = "ザタナーンの体から砕けたリ・クリエ玉が抜け出て、砂浜に転がり落ちた。"
translation = "자타난의 몸에서 깨진 리 크리에 구슬이 빠져나와, 모래사장에 떨어졌다."

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「おのれ……魔王……クルセイダース……またしても……」"
translation = "「이놈…… 마왕…… 크루세이더스…… 또다시……」"

[[dialogue]]
speaker = "unk"
original = "その姿が次第に黒い影へと戻り、崩壊していく。"
translation = "그 모습이 점차 검은 그림자로 돌아가며, 붕괴되어 간다."

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「だが……今回の目的は果たした……」"
translation = "「하지만…… 이번 목적은 완수했다……」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「目的……？」"
translation = "「목적……?」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「我はここで消滅するが……リ・クリエ玉はこの１つだけではない」"
translation = "「나는 여기서 소멸하지만…… 리 크리에 구슬은 이 하나만이 아니다」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「……！」"
translation = "「……!」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「堕天使――グリゴリは、我１人だけではないからだ……」"
translation = "「타천사―― 그리고리는, 나 한 사람만이 아니기 때문이다……」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「世界には……必ず対となる力が現れる。リ・クリエの抑止力として、魔王が現れるように……」"
translation = "「세계에는…… 반드시 짝을 이루는 힘이 나타난다. 리 크리에의 억지력으로서, 마왕이 나타나듯이……」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「完璧でない神が存在し続ける限り、必ずそれに反逆する者が現れる。それが我々……『グリゴリ』だ」"
translation = "「완벽하지 않은 신이 계속 존재하는 한, 반드시 그것에 반역하는 자가 나타난다. 그것이 우리들…… 『그리고리』다」"

[[dialogue]]
speaker = "unk"
original = "何度だって現れるはずだよ"
translation = "몇 번이고 나타날 게 틀림없어"

[[dialogue]]
speaker = "unk"
original = "だとしても、それを止めようとする人たちが"
translation = " 그렇다 해도, 그것을 멈추려 하는 사람들이"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「そう。それが私たち――」"
translation = "「그래. 그것이 우리들――」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「クルセイダースよ！」"
translation = "「크루세이더스야!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「完璧でなくたって、あたしたちはここに生きているんだから！」"
translation = "「완벽하지 않다고 해도, 우리들은 여기에 살아가고 있으니까!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「みなさんが生きるキラキラな毎日を、あなたたちの自分勝手な考えで奪わせたりしません！」"
translation = "「여러분들이 살아가는 반짝반짝한 매일을, 당신들의 이기적인 생각으로 빼앗기게 두지 않겠어요!」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「だとしても……『再生』こそが世界の摂理――」"
translation = "「그렇다 해도…… 『재생』이야말로 세계의 섭리――」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「忘れるな……完璧な世界が存在しない限り……リ・クリエは必ず存在し続ける……」"
translation = "「잊지 마라…… 완벽한 세계가 존재하지 않는 한…… 리 크리에는 반드시 계속 존재한다……」"

[[dialogue]]
speaker = "unk"
original = "ザタナーンはそこまで言って――完全に消滅するのだった。"
translation = "자타난은 거기까지 말하고―― 완전히 소멸하는 것이었다."

