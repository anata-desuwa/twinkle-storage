[[dialogue]]
speaker = "unk"
original = "第５話,ラスト・ナンバー,B"
translation = "제5화, 라스트 넘버, B"

[[dialogue]]
speaker = "unk"
original = "かつてナターシャがデネブの世界で相対した、テルルに代わる女神の幼体。"
translation = "과거 나타샤가 데네브의 세계에서 상대했던 테루루를 대신하는 여신의 유체."

[[dialogue]]
speaker = "unk"
original = "それに瓜二つの少女が、そこにいた。"
translation = "그것과 판박이인 소녀가 그곳에 있었다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ルヴィネ……？」"
translation = "「루비네……?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「──！\u3000あの子が、極星学園星徒会のリーダー！？」"
translation = "「──! 저 아이가 극성학원 학생회의 리더!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……いや、違う。デネブで会った時と、雰囲気が……全然違う！！」"
translation = "「……아니, 아니야. 데네브에서 만났을 때랑 분위기가…… 완전히 달라!!」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「混乱しているようね、散乃ナターシャ。無理もないことだわ」"
translation = "「혼란스러운 모양이네, 치루노 나타샤. 무리도 아니야」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「……どうせ貴女たちは、緋宮クロトに私の存在を伝えることは叶わない。だから、冥土の土産に教えてあげましょう」"
translation = "「……어차피 너희는 히노미야 쿠로토에게 내 존재를 전할 수 없을 테니 저승길 선물로 알려주지」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「私はお父様の手によって製造された、新たなる女神──その、最後のルヴィネ」"
translation = "「나는 아버님의 손에 의해 제조된 새로운 여신── 그 마지막 루비네」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「そうね……『<ruby>最終個体<rt>ラストナンバー</rt></ruby>』とでも称するのが適切かしら？」"
translation = "「그래…… 『<ruby>최종 개체<rt>라스트 넘버</rt></ruby>』라고 부르는 게 적절하려나?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ラスト、ナンバー？\u3000どういうこと……？」"
translation = "「라스트 넘버? 그게 무슨……?」"

[[dialogue]]
speaker = "unk"
original = "ルヴィネに代わる存在として、新たに製造された女神。それについての疑問ではない。"
translation = "루비네를 대신하는 존재로서 새롭게 제조된 여신. 그것에 대한 의문이 아니었다."

[[dialogue]]
speaker = "unk"
original = "なぜこのルヴィネは、<b>わざわざ最後の個体である</b>、と名乗るのか──？"
translation = "왜 이 루비네는 **굳이 마지막 개체이다**라고 자처하는 것인가──?"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「姫咲メルエル。そして散乃ナターシャ。お前たちの戦いぶりは本当に見事だったわ」"
translation = "「히메사키 메르엘. 그리고 치루노 나타샤. 너희의 싸움은 정말 훌륭했어」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「──『<ruby>星の再会<rt>スター・リユニオン</rt></ruby>』。あの作戦さえ成立しなければ、お父様は敗れなかった」"
translation = "「──『<ruby>별의 재회<rt>스타 리유니온</rt></ruby>』. 그 작전만 성립하지 않았어도 아버님은 패배하지 않았을 텐데」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「……っ！？\u3000な、何を、言っているの！？」"
translation = "「……윽!? 무, 무슨 말을 하는 거야!?」"

[[dialogue]]
speaker = "unk"
original = "天界から招致した増援を一堂に会する作戦のことを、メルエルたちは緋宮クロトから聞いていた。"
translation = "천계에서 초치한 증원을 한데 모으는 작전에 대해서 메르엘 일행은 히노미야 쿠로토에게 들어서 알고 있었다."

[[dialogue]]
speaker = "unk"
original = "しかしそれはまだ──実現していない。"
translation = "하지만 그것은 아직── 실현되지 않았다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「まだ起こってもいない作戦を、体験してきたように語るんだね？」"
translation = "「아직 일어나지도 않은 작전을 마치 겪어본 것처럼 말하네?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「お前……いったい、どこから来たの？」"
translation = "「너…… 대체 어디서 온 거야?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「私は遠くない未来で生まれた。緋宮クロトに追い詰められ、絶命を逃れられないお父様が遺した、最後の希望」"
translation = "「나는 머지않은 미래에서 태어났어. 히노미야 쿠로토에게 몰려 절명을 피할 수 없게 된 아버님이 남긴 마지막 희망」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「世界の再創生のため。創造神であるお父様が消滅する未来を書き換えるため──過去へ飛ばされた最終個体」"
translation = "「세계의 재창조를 위해. 창조신이신 아버님이 소멸하는 미래를 다시 쓰기 위해── 과거로 보내진 최종 개체」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……やることなすこと滅茶苦茶になってきたね。いくらなんでも往生際が悪すぎない？」"
translation = "「……하는 짓마다 엉망진창이네. 아무리 그래도 끝까지 너무 추한 거 아냐?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「本当はもっと昔……魔王が<ruby>封理再誕<rt>レナトゥス</rt></ruby>から目覚めたあたりに飛べれば話は単純だった」"
translation = "「사실은 좀 더 옛날…… 마왕이 <ruby>봉리재탄<rt>레나투스</rt></ruby>에서 깨어났을 즈음으로 갈 수 있었다면 이야기는 단순했겠지」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「けれど仕方がない。次元転送装置を用いずに平行世界に干渉すれば、時間の概念が曖昧になってしまう」"
translation = "「하지만 어쩔 수 없어. 차원 전송 장치를 쓰지 않고 평행 세계에 간섭하면 시간의 개념이 모호해지거든」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「過去、あるいは未来へ方向を決め、到着地点もわからない時の旅を行うしか方法がなかった……」"
translation = "「과거 혹은 미래로 방향만 정하고 도착 지점도 모르는 시간 여행을 할 수밖에 없었어……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「会長くんは……『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』に勝利する。その未来を変えるために、貴女はやってきた……？」"
translation = "「회장님은…… 『<ruby>ＸＥＬＯＳ<rt>제로스</rt></ruby>』에게 승리해. 그 미래를 바꾸기 위해 네가 왔다는 거야……?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「ええ。その通りよ。緋宮クロトは、お父様を弑するだけの力を備えた、最強の魔王だった」"
translation = "「그래. 맞아. 히노미야 쿠로토는 아버님을 시해할 정도의 힘을 갖춘 최강의 마왕이었지」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「けれど、この時間からなら巻き返せる。敗北のきっかけとなったのは『星の再会』……」"
translation = "「하지만 이 시점에서라면 다시 뒤집을 수 있어. 패배의 계기가 된 것은 『별의 재회』……」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「それによってネビュラの魔女が、デネブの土を踏んだことよ」"
translation = "「그걸로 인해 네뷸라의 마녀가 데네브의 땅을 밟은 거야」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「リノという魔女が、ディザスターハンドと邂逅さえしなければ……お父様の勝ちは不動のものだった」"
translation = "「리노라는 마녀가 디재스터 핸드와 조우하지만 않았어도…… 아버님의 승리는 확고했을 텐데」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「だから全てを覆す。魔王の描いた決戦の絵図を、書き換えてみせましょう」"
translation = "「그러니 모든 것을 뒤엎겠어. 마왕이 그려낸 결전의 도식을 다시 써 내려가 주지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ネビュラだとか、ディザスターハンドがどうとか……そもそも未来から飛んできたとかさ、よくわかんないことばっかりだけど──」"
translation = "「네뷸라니 디재스터 핸드니…… 애초에 미래에서 왔다느니, 이해 안 가는 것투성이지만──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「メルエル。やることは１つだよ」"
translation = "「메르엘. 할 일은 하나야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「うん！\u3000私たちの行動を邪魔するために、あの子はここに来た……ということは！」"
translation = "「응! 우리 행동을 방해하기 위해 저 아이가 여기 왔다……는 건!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ここで負けることは、『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』に勝利する未来が否定されちゃうってこと……絶対に勝たなくちゃ！」"
translation = "「여기서 지는 건 『<ruby>ＸＥＬＯＳ<rt>제로스</rt></ruby>』에게 승리하는 미래가 부정된다는 뜻이야…… 절대로 이겨야 해!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「試すことそのものが不合理と判断するわ。最終個体である私は、ルヴィネシリーズの中でも最強の能力を持っている──」"
translation = "「시험하는 것 자체가 불합리하다고 판단되네. 최종 개체인 나는 루비네 시리즈 중에서도 최강의 능력을 갖추고 있어──」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「──ディヴォーテッド・スラスト！！」"
translation = "「──디보티드 스러스트!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「体験しなければわからないかしら？」"
translation = "「겪어보지 않으면 모르는 걸까?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「きゃああぁああっ！？」"
translation = "「꺄아아아악!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「今ッ──！！」"
translation = "「지금이다!!」"

[[dialogue]]
speaker = "unk"
original = "本来、従者であるナターシャは、吹き飛ばされるメルエルをサポートするのが普通だ。"
translation = "본래 종자인 나타샤는 튕겨 나가는 메르엘을 서포트하는 것이 일반적이다."

[[dialogue]]
speaker = "unk"
original = "だからこその奇襲だった。極限までメルエルの影に隠れ、一息にラストナンバーの首を取る──はずだった。"
translation = "그렇기에 노린 기습이었다. 극한까지 메르엘의 그림자에 숨어 단숨에 라스트 넘버의 목을 칠── 생각이었다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──っ！？」"
translation = "「──윽!?」"

[[dialogue]]
speaker = "unk"
original = "いつの間にか肉薄していたラストナンバーが、振りぬこうとしていたナターシャの得物の柄を掴んでいる。"
translation = "어느샌가 육박해온 라스트 넘버가 휘두르려던 나타샤의 무기 자루를 움켜쥐고 있다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（技が起こる前に──止められた！？）"
translation = "（기술이 나오기도 전에── 막혔어!?）"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「とても楽ね──この『眼』があると」"
translation = "「참 편하네── 이 『눈』이 있으니」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「『天機の星眼』っ！？」"
translation = "「『천기의 성안』!?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「あの『影』が持っていたような劣化品ではない。オリジナルと同等、いえそれ以上の性能を持つ眼を創ってもらったわ」"
translation = "「저 『그림자』가 가졌던 열화판이 아니야. 오리지널과 동등, 아니 그 이상의 성능을 가진 눈을 만들어 주셨거든」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「これでもう、アクシデントは起こらない。私はこの星眼を使って、お父様の消滅する未来を回避してみせる──」"
translation = "「이걸로 이제 액시던트는 일어나지 않아. 나는 이 성안을 사용해 아버님이 소멸하는 미래를 회피해 보이겠어──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──つ、ぅ。ふざけないでよっ……無理ゲーにもほどがあるんだけど！」"
translation = "「──츠, 윽. 웃기지 마…… 억지 게임도 정도가 있지!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「抵抗は無意味──その意味はわかったでしょう？\u3000頼みの綱の魔王は、人間界にいる……天界の惨事には気付いていない」"
translation = "「저항은 무의미── 그 의미는 알았겠지? 믿고 있는 마왕은 인간계에 있어…… 천계의 참극은 눈치채지 못했지」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「お前たちは全滅する。天界からの増援は失敗し、『星の再会』は瓦解する。そうなればもう星騎士陣営の勝ちはあり得ない」"
translation = "「너희는 전멸한다. 천계의 증원은 실패하고 『별의 재회』는 와해되겠지. 그렇게 되면 이제 성기사 진영의 승리는 있을 수 없어」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「<ruby>白いルヴィネ<rt>私の出来損ない</rt></ruby>がアルタイルに侵攻する……そのタイミングで人間界を急襲し、すり潰す。未来はもう視えているわ」"
translation = "「<ruby>하얀 루비네<rt>나의 불량품</rt></ruby>가 알타이르를 침공한다…… 그 타이밍에 인간계를 급습해 짓눌러버리지. 미래는 이미 보여」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「絶対にやらせないよ、そんなこと！\u3000世界の未来のためにも、会長くんのためにも……！！」"
translation = "「절대로 그렇게 안 둬! 세계의 미래를 위해서도, 회장님을 위해서도……!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「従者からよく呑気だと言われているようだけれど、本当にその通りね。貴女、不思議に思わなかったの？」"
translation = "「종자로부터 태평하다는 말을 자주 듣는 모양인데 정말 그대로네. 너, 이상하다고 생각 안 했어?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「やろうと思えばすぐに葬ることができる。私はそれだけの力を持っている」"
translation = "「마음만 먹으면 당장이라도 없앨 수 있어. 나는 그만한 힘을 가지고 있거든」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「それなのにどうして……神殿最奥まで、侵入を許したと思う？」"
translation = "「그런데 왜…… 신전 가장 깊은 곳까지 침입을 허용했다고 생각해?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「な、何を言ってるの……！？」"
translation = "「무, 무슨 말을 하는 거야……!?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「姫咲メルエル。お前の先祖は２０００年前に、この過ちに満ちた世界を刷新しようとした」"
translation = "「히메사키 메르엘. 네 선조는 2000년 전에 이 잘못으로 가득 찬 세계를 쇄신하려 했지」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「『太陽の壁画』に遺されるほどの働きを為した──それを私は評価しているのよ」"
translation = "「『태양의 벽화』에 남겨질 정도의 업적을 세웠어── 그걸 나는 높게 평가하고 있는 거야」"

[[dialogue]]
speaker = "unk"
original = "ラストナンバーの掌の中に、暗黒色の瘴気が形成され──渦巻き始める。"
translation = "라스트 넘버의 손바닥 안에 암흑색의 장기가 형성되며── 소용돌이치기 시작한다."

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「さあ──もう一度。目覚めなさい」"
translation = "「자── 다시 한번. 눈을 뜨렴」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──メルエルっ！\u3000避けて！！」"
translation = "「──메르엘! 피해!!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「────きゃぁあぁあっ！？」"
translation = "「────꺄아아앗!?」"

[[dialogue]]
speaker = "unk"
original = "まるで意思を持っているかのように瘴気がメルエルに殺到し、包み込んでゆく──"
translation = "마치 의지를 가진 것처럼 장기가 메르엘에게 쇄도하여 감싸기 시작한다──"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「未来を変えるために、手駒はいくらあってもいい」"
translation = "「미래를 바꾸기 위해 말은 많으면 많을수록 좋지」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「姫咲メルエル。お前をリクリエの使徒として──再創生の手伝いをさせてあげましょう」"
translation = "「히메사키 메르엘. 너를 리크리에의 사도로서── 재창조를 돕게 해주지」"

