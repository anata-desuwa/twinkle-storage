[[dialogue]]
speaker = "unk"
original = "その日、俺は聖沙からリゾート結界に呼び出されていた。"
translation = "그날, 나는 세이샤에게서 리조트 결계로 호출당해 있었다."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ついに、この時がやって来たわ……」"
translation = "「마침내, 이 때가 찾아왔어……」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「再び異世界に来て、会長へのリベンジを果たす時が！」"
translation = "「다시 이세계에 와서, 회장에게 리벤지를 완수할 때가！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「今回は新しい力、水着フォームもあるから負けないわよ！」"
translation = "「이번엔 새로운 힘, 수영복 폼도 있으니까 지지 않을 거야！」"

[[dialogue]]
speaker = "unk"
original = "ならば、俺も同じ力で受けて立とう！"
translation = " 그렇다면, 나도 같은 힘으로 맞서 주마！"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「いいわ！\u3000正々堂々――」"
translation = "「좋아！ 정정당당하게――」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「って、えっ！？\u3000同じ力……！？」"
translation = "「랄까, 엣！？ 같은 힘……！？」"

[[dialogue]]
speaker = "unk"
original = "この『海パン』が、俺の水着フォームだ！！"
translation = "이 『사각 수영복』이, 나의 수영복 폼이다！！"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「なっ……！？\u3000会長も水着フォームに変身できたの！？」"
translation = "「뭣……！？ 회장도 수영복 폼으로 변신할 수 있었던 거야！？」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「くっ……やるわね……！」"
translation = "「큭…… 제법이네……！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「けれど、同じ力を持っているなら、なおさら負けるわけにはいかないわ！」"
translation = "「하지만, 같은 힘을 가지고 있다면, 더더욱 질 수는 없지！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「同じ水着フォーム同士――いざ尋常に勝負よ！」"
translation = "「같은 수영복 폼끼리―― 자, 정당하게 승부야！」"

