[[dialogue]]
speaker = "unk"
original = "飾りを作り終えたベアトリスとナターシャは、パーティーのためのお菓子と料理を用意するため、カフェテリアへと向かう。"
translation = "장식 만들기를 마친 베아트리스와 나타샤는 파티를 위한 과자와 요리를 준비하기 위해 카페테리아로 향한다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「おー、お化け、いなくなってるね。梨緒たち、いい仕事してる」"
translation = "「오~ 유령들, 사라졌네. 리오 녀석들 일 잘했어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あと……メルエルさんとはどうなったか、聞いてもいい？」"
translation = "「그리고…… 멜엘 씨와는 어떻게 됐는지 물어봐도 되냐?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ん～……別にどうもなってないよ。好きになったりとかもしてないし」"
translation = "「음~…… 딱히 어떻게 되지도 않았어. 좋아하게 됐다거나 한 것도 아니고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「嫌いって言っても、まるで気にしてないんだよね。あのお気楽さは誰に似たんだろ」"
translation = "「싫다고 말해도 전혀 개의치 않는단 말이지. 그 속 편함은 누구를 닮은 건지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「メルエルと付き合ってると、呆れることばかりでさ。開いた口が塞がらないよ」"
translation = "「멜엘이랑 어울리고 있으면 어처구니없는 일뿐이라서 말이야. 기가 차서 말이 안 나와」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふ～ん？」"
translation = "「흐~응?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「なに、ふ～んって。何か言いたそうだね」"
translation = "「뭐야, 흐~응이라니. 무슨 말이라도 하고 싶은가 보네」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん、嫌いな人のことを話す時って、苦虫を噛み潰したみたいにもっと嫌～な顔をするものだよ？」"
translation = "「나타샤짱, 싫어하는 사람 이야기를 할 때는 쓴벌레를 씹은 것처럼 더 싫~은 표정을 짓는 법이라구?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……してるでしょ。あと、しれっと気色悪いたとえを絡めてこないで」"
translation = "「……짓고 있거든. 그리고 슬그머니 기분 나쁜 비유 섞지 마」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ごめんごめん、えへへ」"
translation = "「미안 미안, 에헤헤」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ま、メルエルの護衛の任は解かれたから、せいせいしたよ」"
translation = "「뭐, 멜엘 호위 임무는 풀렸으니까 시원섭섭하네」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「任務がなくなったっていうことは……ナターシャちゃん、天界に帰っちゃうのかニャ？」"
translation = "「임무가 끝났다는 건…… 나타샤짱, 천계로 돌아가 버리는 거냐?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ううん。今後のことは保留で未定。もうしばらくはこっちにいる感じ」"
translation = "「으응. 향후 일은 보류라 미정. 당분간은 이쪽에 있을 느낌」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「せっかく平和になったんだし、ナターシャちゃんも任務とか忘れてゆっくりすればいいよっ」"
translation = "「모처럼 평화로워졌으니 나타샤짱도 임무 같은 건 잊고 편히 쉬면 된다구!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だといいんだけど。平和になったらなったでいろいろ起きるんだよね。リガルタが死んだ影響で、天界で政争が起こるかもだし」"
translation = "「그러면 좋겠는데. 평화로워지면 평화로워진 대로 이것저것 터지거든. 리갈타가 죽은 영향으로 천계에서 정쟁이 일어날지도 모르고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そういう時は、私たちエージェントの出番かな」"
translation = "「그럴 때는 우리 에이전트들이 나설 차례인가」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そういうお仕事、嫌じゃないの？\u3000怖くないのかニャ？」"
translation = "「그런 일, 싫지 않아? 무섭지 않은 거냐?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「怖くはないけど、楽しくもないね。でもやらなきゃいけない。仕事だから」"
translation = "「무섭지는 않은데 즐겁지도 않네. 하지만 해야 해. 일이니까」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「もし……もしもの話なんだけどっ！」"
translation = "「만약…… 만약에 하는 말인데!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うん？」"
translation = "「응?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃんが聖庭園の任務が嫌になって、逃げたくても行く場所がなかったら……デネブに来るっていうのはどうかニャ？」"
translation = "「나타샤짱이 성정원의 임무가 싫어져서 도망치고 싶어도 갈 곳이 없다면…… 데네브로 오는 건 어떠냐?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……ベアトの世界に？」"
translation = "「……베아트의 세계로?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そうっ！\u3000こういう組織を抜ける時って、簡単にはいかニャいでしょ？\u3000組織の追手につきまとわれたりするんじゃニャいの？」"
translation = "「응! 이런 조직을 탈퇴할 때란 게 그리 간단히는 안 되잖아? 조직의 추격자에게 쫓기거나 하지 않냐?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ま、そういうのを専門にしてるチームもいるね」"
translation = "「뭐, 그런 걸 전문으로 하는 팀도 있긴 하지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもさすがに、世界を超えてまではなかなか追ってこれニャいでしょ」"
translation = "「하지만 아무리 그래도 세계를 넘어오면서까지는 쉽게 못 쫓아오잖아」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「無理にとは言わニャいけどっ、ナターシャちゃんがデネブに来るなら歓迎するよ」"
translation = "「억지로 하라는 건 아니지만!, 나타샤짱이 데네브로 온다면 환영할게」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃんが選管のみんなを守ってくれてたみたいに、何かあっても私と極星のみんなでナターシャちゃんを守るから。ねっ！」"
translation = "「나타샤짱이 선관 모두를 지켜주었던 것처럼, 무슨 일이 있어도 나와 극성의 모두가 나타샤짱을 지켜줄 테니까. 응!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん？」"
translation = "「나타샤짱?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いや、ベアトは人<ruby>誑<rt>たら</rt></ruby>しだな～と思って。私が女だったら好きになっちゃってるよ」"
translation = ""

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん、女の子だよねっ！？\u3000え、っていうことは、つまり……！？」"
translation = "「나타샤짱, 여자아이 맞지!? 에, 그렇다는 건, 즉……!?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナ、ナターシャちゃんのことは好きだけどっ！\u3000そ、そういう好きとはちょっと違うかもだよ～っ！」"
translation = "「나, 나타샤짱은 좋아하지만! 그, 그런 의미의 좋아하는 거랑은 약간 다를지도라구~!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「なに顔真っ赤にしてんの。ふふ、ベアトはホント見てて退屈しないよね」"
translation = "「왜 얼굴이 새빨개지는 건데. 후후, 베아트는 정말 보고 있으면 지루하질 않네」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「またからかったのっ！？\u3000冗談ばかり言ってたら、いつか信用してもらえなくニャっちゃうよっ！」"
translation = "「또 놀린 거냐!? 농담만 하고 있으면 언젠가 신용 못 받게 되어버린다구!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「それでも、ベアトは私を信じてくれるでしょ」"
translation = "「그래도 베아트는 나를 믿어줄 거잖아」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、それは……うん」"
translation = "「그, 그건…… 응」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「世界を超えての逃避行、ね。そんな方法もあるんだ」"
translation = "「세계를 넘나드는 도피행이라. 그런 방법도 있구나」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトの気持ちはありがたく受け取っておく。いざという時の手段として考えとくね」"
translation = "「베아트의 마음은 고맙게 받을게. 만약의 경우를 위한 수단으로 생각해 둘게」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「……うんっ！\u3000いつでも言ってねっ！」"
translation = "「……응! 언제든 말해줘!」"

