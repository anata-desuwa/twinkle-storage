[[dialogue]]
speaker = "unk"
original = "第３話,『ありのママに』,B"
translation = "제4화, 『있는 그대로의 엄마로』, B"

[[dialogue]]
speaker = "unk"
original = "その後、星徒会室を後にした一行は、シノの案内で広々とした会議室へやってくる。"
translation = "그 후, 성도회실을 나온 일행은, 시노의 안내로 널찍한 회의실로 찾아온다."

[[dialogue]]
speaker = "unk"
original = "そこには聖庭園よりやってきた使節団の他に、警護役としてケイティ、ナターシャが随行していた。"
translation = "그곳에는 성정원으로부터 온 사절단 외에, 경호역으로서 케이티, 나타샤가 수행하고 있었다."

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ほえー、聖庭園から来た議員さんってあの人たちかあ。めちゃめちゃ大人っぽい☆\u3000綺麗だし華やかだし、いかにも天使って感じ～！」"
translation = "「호에-, 성정원에서 온 의원님이라는 게 저 사람들이구나. 엄청 어른스러워☆ 예쁘고 화려하고, 그야말로 천사라는 느낌~!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「みんな和やかね。あの雰囲気なら、会談もうまくいきそうだわ」"
translation = "「다들 화기애애하네요. 저 분위기라면, 회담도 잘 진행될 것 같아요」"

[[dialogue]]
speaker = "unk"
original = "やがて会談が始まると紅明、セシアは会議室を退室する。"
translation = "이윽고 회담이 시작되자 코메이, 세시아는 회의실을 퇴실한다."

[[dialogue]]
speaker = "unk"
original = "するとケイティ、ナターシャら、先方の警護を担当していた者たちも一緒に廊下へと出てきた。"
translation = "그러자 케이티, 나타샤 등, 상대 측의 경호를 담당하고 있던 자들도 함께 복도로 나왔다."

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「あ、そうだセッシー☆\u3000あの人たちはどうどう？\u3000おしとやかで大人っぽいし、おっぱいも大きいし！」"
translation = "「아, 맞다 세시☆ 저 사람들은 어때 어때? 얌전하고 어른스럽고, 가슴도 크고!」"

[[dialogue]]
speaker = "unk"
original = "紅明が指し示したのはケイティだった。"
translation = "코메이가 가리킨 것은 케이티였다."

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「……ここからじゃ少し遠いけれど、とても魅力的な人物に見えるわ」"
translation = "「……여기서는 조금 멀지만, 매우 매력적인 인물로 보이네요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「うっしっし♪\u3000セッシーのママにもなってくれるんじゃない？」"
translation = "「우씨씨♪ 세시의 엄마도 되어주지 않겠어?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「それはわからないわ。とっても立派なお胸をしているけれど、大きいことが必ずしもバブみに繋がるとは限らないのよ。もちろん紅明ママのお胸は素晴らしいけれど」"
translation = "「그건 모르겠어요. 매우 훌륭한 가슴을 가지고 있지만, 크다는 것이 반드시 응애스러움으로 연결된다고 볼 수는 없어요. 물론 코메이 엄마의 가슴은 훌륭하지만요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ま、セッシーのママ判定はあくまで話しかけるとっかかりってだけで、アタシ的には聖庭園の人たちとも友達になってみたいなってだけなんだけど☆」"
translation = "「뭐, 세시의 엄마 판정은 어디까지나 말 걸 계기일 뿐이고, 나로서는 성정원 사람들이랑도 친구가 되어보고 싶을 뿐이지만☆」"

[[dialogue]]
speaker = "unk"
original = "２人が話しているところへ、輪から外れたケイティが歩み寄る。"
translation = "두 사람이 이야기하고 있는 곳으로, 무리에서 벗어난 케이티가 다가온다."

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「お、セッシー！\u3000こっちに来てくれたよ♪」"
translation = "「오, 세시! 이쪽으로 와줬어♪」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「聖庭園の天使さん！\u3000初めまして、アタシ牛紅明☆\u3000新星学園の２年生だぜ！」"
translation = "「성정원의 천사님! 처음 뵙겠습니다, 나는 규 코메이☆ 신세이 학원 2학년이라구!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ご丁寧にありがとうございます。はじめまして。聖庭園より参りました、ケイティと申します。どうぞよろしくお願いしますね～」"
translation = "「정중하게 감사드립니다. 처음 뵙겠습니다. 성정원에서 온 케이티라고 합니다. 잘 부탁드립니다~」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ケイティさん！\u3000──じゃ、ケイちーさんですね☆」"
translation = "「케이티 씨! ──그럼, 케이치 씨네요☆」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ふふっ。ニックネームということでしょうか……親愛の情を深めるという意味であれば、大歓迎です～♪」"
translation = "「후훗. 별명이라는 것일까요…… 친애의 정을 깊게 한다는 의미라면, 대환영입니다~♪」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ありがとうございま～す☆\u3000んで、こっちがアタシが仲良くしてる、守護天使のセッシー♪」"
translation = "「감사합니다~☆ 그래서, 이쪽이 내가 친하게 지내는, 수호천사인 세시♪」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「守護天使のセシアよ。よろしくお願いするわ」"
translation = "「수호천사 세시아예요. 잘 부탁드려요」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ええ、よろしくお願いします、セシア様。先だってのデネブでの戦いでは、ご挨拶もできず申し訳ございませんでした」"
translation = "「네, 잘 부탁드립니다, 세시아 님. 지난번 데네브에서의 싸움에서는 인사도 드리지 못해 죄송했습니다」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「じー……」"
translation = "「빤-……」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「？」"
translation = "「?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「じーーーーーっ……」"
translation = "「빤────────……」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「あの、私がどうかしましたか？」"
translation = "「저기, 제가 무슨 문제라도 있나요?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「いえ……なんでもないわ」"
translation = "「아니요…… 아무것도 아니에요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ありゃ、思ったより普通！？\u3000おっとり優しそうな雰囲気に胸も大きい……てっきりママ判定待ったなしかと思ったのに」"
translation = "「어라, 생각보다 평범한데!? 차분하고 상냥해 보이는 분위기에 가슴도 크고…… 틀림없이 엄마 판정 직행일 줄 알았는데」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「確かにケイティからは器の大きさを感じるわ。でも、そこに無条件の肯定を感じないの。わかるかしら」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「彼女の器は、他者を受け入れるのではなく、あくまで正しき道へ導くような……」"
translation = "「그녀의 도량은, 타인을 받아들이는 것이 아니라, 어디까지나 올바른 길로 이끄는 듯한……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「それは母性というより、<ruby>姉性<rt>しせい</rt></ruby>というべき素質よ。もちろん、それもまた類まれなる天性の資質なのだけれど」"
translation = "「그것은 모성이라기보다, <ruby>누이성<rt>시세이</rt></ruby>이라 불러야 할 자질이에요. 물론, 그것 또한 보기 드문 천성의 자질이지만요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ウーン？\u3000つまりはバブみオギャみより、お姉ちゃん属性が勝っているってこと？」"
translation = "「으음~? 즉 응애응애보다, 언니 속성이 앞서고 있다는 뜻?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「さすが紅明ママね！\u3000まさにそういうことよ！」"
translation = "「역시 코메이 엄마네요! 그야말로 그런 뜻이에요!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「確かに私はナターシャちゃん達からお姉ちゃんと呼ばれていますけれど……会ったばかりでそれを見抜くなんて！」"
translation = "「확실히 저는 나타샤 양 일행에게 언니라고 불리고 있습니다만…… 만난 지 얼마 안 됐는데 그걸 간파하시다니!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「今日はお仕事ですから、そんな雰囲気は出していなかったはずなのに……」"
translation = "「오늘은 일 때문이니, 그런 분위기는 내지 않았을 텐데……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ふふふ。わたくしの眼には真実の姿が見えてしまうのよ」"
translation = "「후후후. 저의 눈에는 진실된 모습이 보여버리거든요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ただ、今でこそケイティはお姉さんの属性が強いけれど、将来性は大したものよ。そこは誇っていいわ♪」"
translation = "「다만, 지금이야 케이티는 언니 속성이 강하지만, 장래성은 대단해요. 그 점은 자랑스러워해도 좋아요♪」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「え、え～っと……？」"
translation = "「에, 에~~또……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「紅明、さっきから何をわいわいやってるの？」"
translation = "「코메이, 아까부터 뭘 왁자지껄하고 있는 거야?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「おっ。ナタりん！\u3000チャオっす☆」"
translation = ""

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ナタりんって……まぁいいけど」"
translation = "「나타링이라니…… 뭐 상관없지만」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ルヴィっち達の話し合いが終わるまで暇だからさ。友好を深めようかな～って☆」"
translation = "「루비치 일행의 이야기가 끝날 때까지 심심하니까 말야. 우호를 다져볼까 해서~☆」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そして、新しいママも探しているの。よろしくお願いするわね」"
translation = "「그리고, 새로운 엄마도 찾고 있어요. 잘 부탁드려요」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「またおかしなことをしてるね……で、ケイティ姉さんはお眼鏡に叶わなかったと」"
translation = "「또 이상한 짓을 하고 있네…… 그래서, 케이티 언니는 안경에 차지 않았다고」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「今はまだ、というだけよ。ママの将来性は十二分に感じられたわ♪\u3000これからに期待ね」"
translation = "「지금은 아직, 일 뿐이에요. 엄마의 장래성은 충분히 느껴졌어요♪ 앞으로가 기대되네요」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ふふ。守護天使様のお墨付きですか。よくわかりませんが、ありがとうございます～♪」"
translation = "「후후. 수호천사 님의 보증인가요. 잘은 모르겠지만, 감사합니다~♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「本当にそうなのかなー？」"
translation = "「정말로 그런 걸까-?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「まあ。どういうことかしら？」"
translation = "「어머. 무슨 뜻인가요?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「姉さんって、おっとりしててすごく優しそうに見えるけど……見た目に騙されない方がいいよ？\u3000この人ほど怒らせたら怖い人はいないからさ」"
translation = "「언니는 차분하고 엄청 상냥해 보이지만…… 겉모습에 속지 않는 게 좋아? 이 사람만큼 화나게 했을 때 무서운 사람은 없으니까」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「そんなことありませんよ～。この世で１番大切なものは平和ですから。だからみんなで平和に仲良くしましょうね」"
translation = "「그런 일 없어요~. 이 세상에서 가장 중요한 것은 평화니까요. 그러니까 다 같이 평화롭게 사이좋게 지내도록 해요」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「まあ、姉さんが平和主義なのはその通りなんだけどね、ひとたびその平和を乱そうものならもう大変なことになるんだから」"
translation = "「뭐, 언니가 평화주의자인 건 맞지만 말야, 한 번 그 평화를 어지럽히려 들면 이제 난리가 나니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「単身で敵に突っ込んでいって、容赦なく壊滅させてくるんだ。それで、ついたあだ名が『制圧天使』」"
translation = "「단신으로 적에게 돌진해 들어가서, 사정없이 괴멸시키고 온다고. 그래서 붙은 별명이 『제압천사』」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「制圧天使！！\u3000かっこいいぜ☆」"
translation = "「제압천사!! 멋지잖아☆」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「もう、ナターシャちゃんったら……いつもそうやってお姉ちゃんのことをからかうんですから。お恥ずかしいです」"
translation = "「참 나, 나타샤 양도 참…… 항상 그렇게 언니를 놀리니까요. 부끄럽습니다」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「なるほど。ケイティの内に秘めた闘志が、ママに不釣り合いかもと言いたいのね？」"
translation = "「그렇군요. 케이티의 내면에 숨겨진 투지가, 엄마에 어울리지 않을지도라고 말하고 싶은 거군요?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「けれどそれは杞憂というものよ。ママというのは魂の形。大きな愛で包み込む包容力こそが肝要なの」"
translation = "「하지만 그것은 기우라는 거예요. 엄마라는 것은 영혼의 형태. 큰 사랑으로 감싸 안는 포용력이야말로 긴요한 것이에요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ケイティの大きな慈愛の心は、ママを構成するうえで必要不可欠なもの。わたくしのママセンサーは誤らないわ♪」"
translation = "「케이티의 커다란 자애의 마음은, 엄마를 구성하는 데 있어 필요불가결한 것. 저의 엄마 센서는 틀리지 않아요♪」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「それはそれとして……わたくし、あなたの方も気になるわね」"
translation = "「그건 그렇고…… 저, 당신 쪽도 신경 쓰이네요」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……私？」"
translation = "「……나?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「わたくしの背丈に合わせて、少しかがんで握手を求める気配り……ふふ、いいわね」"
translation = "「저의 키에 맞추어, 살짝 굽혀서 악수를 청하는 배려…… 후후, 좋네요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「およ？\u3000もしかしてセッシー、むしろナタりんのほうにバブみを感じてる？」"
translation = "「어라? 혹시 세시, 오히려 나타링 쪽에서 응애스러움을 느끼고 있어?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「同級生の紅明ママと、お姉ちゃん的存在であるケイティと、小さなわたくし……それぞれに柔軟に対応を変えられる細やかな気遣いの精神……」"
translation = "「동급생인 코메이 엄마와, 언니 같은 존재인 케이티와, 작은 저…… 각각에 유연하게 대응을 바꿀 수 있는 세심한 배려의 정신……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「まだ立場が伴っていない感じはあるけれど、これはプラス１ポイントね♪」"
translation = "「아직 입장이 따르지 않은 느낌은 있지만, 이것은 플러스 1포인트네요♪」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「すごい！\u3000いきなりのポイントゲットだぜ☆」"
translation = "「대단해! 갑작스러운 포인트 겟이라구☆」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「何が？」"
translation = "「뭐가?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ママポイントだぜ☆」"
translation = "「엄마 포인트라구☆」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「もっと何が、なんだけど……」"
translation = "「더더욱 뭐가, 인데……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「あなたのうちに宿る潜在ママ力のことよ。残念ながら即ママ判定とはならなかったけれど、ケイティと同じく、あなたからもポテンシャルを感じるわ！」"
translation = "「당신의 안에 깃든 잠재 엄마력 말이에요. 아쉽게도 즉시 엄마 판정으로는 되지 않았지만, 케이티와 마찬가지로, 당신에게서도 포텐셜이 느껴져요!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「潜在ママ力……一度も聞いたことのない単語が……」"
translation = "「잠재 엄마력…… 한 번도 들어본 적 없는 단어가……」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「言われてみればナターシャちゃんはとっても面倒見がいいし、年下の女の子に好かれることが多かったわね」"
translation = "「그러고 보니 나타샤 양은 돌보는 걸 너무 잘하고, 어린 여학생들에게 인기가 많았었죠」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そ、そうだったっけ？」"
translation = "「그, 그랬던가?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「隠そうとしても無駄だぜ！\u3000セッシーはヒトの母性をすぐに見抜いちゃうからな☆」"
translation = "「숨기려 해도 소용없다구! 세시는 사람의 모성을 바로 간파해 버리니까☆」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「セッシーが反応したってことは、ナタりんは十分ママの素質ありってことだ」"
translation = "「세시가 반응했다는 건, 나타링은 충분히 엄마 소질이 있다는 뜻이다」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「う～ん……自分じゃ全然ピンとは来ないけど」"
translation = "「으~음…… 나로서는 전혀 감이 오지 않지만」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ママというのは理屈ではないわ。いつか時がくれば、きっとあなたも解るはずよ」"
translation = "「엄마라는 것은 이치가 아니에요. 언젠가 때가 오면, 분명 당신도 알게 될 터예요」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（守護天使じゃなかったら、完全に不審者だね。いや、守護天使であったとしても不審者であることには変わりないんだけど）"
translation = "(수호천사가 아니었다면, 완전히 수상한 사람이네. 아니, 수호천사라 해도 수상한 사람이라는 것에는 변함없지만)"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「そだ、ナタりん☆\u3000他にママっぽい人知らない？\u3000セッシー、今日はたくさんママを探すぞって意気込んでるんだよ」"
translation = "「맞다, 나타링☆ 다른 엄마 같은 사람 알아? 세시, 오늘은 엄마를 잔뜩 찾겠다고 의욕이 넘쳐 있거든」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ママっぽい人ねぇ……先輩とか先生が思い浮かんじゃうけど、そういうことじゃないんでしょ？」"
translation = "「엄마 같은 사람이라…… 선배라든가 선생님이 떠오르지만, 그런 뜻은 아니지?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「だねえ。セッシー曰く、重要なのはその人の本質らしいから」"
translation = "「그렇지. 세시 말로는, 중요한 건 그 사람의 본질이라니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……あ。そう言われたら、ちょっと思い当たる人がいるかも」"
translation = "「……아. 그렇게 들으니, 짚이는 사람이 좀 있을지도」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「本当！？」"
translation = "「정말!?」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「聖庭園の子かしら？」"
translation = "「성정원 아이일까?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ううん、違うよ。ほら、選挙管理委員会の──」"
translation = "「으응, 아니야. 봐, 선거관리위원회의──」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ああ！\u3000あの子ね～♪」"
translation = "「아아! 그 아이 말이지~♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「こっちが甘えちゃいたくなる母性？\u3000みたいなのは持ってる気がするなぁ。別に私は甘えたりしないけど」"
translation = "「이쪽이 응석 부리고 싶어지는 모성? 같은 건 가지고 있는 느낌이 드네. 딱히 내가 응석 부리거나 하진 않지만」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「話を聞いているだけでも口元が緩んでしまうわ！\u3000ぜひその子を紹介してほしいのだけれど……！」"
translation = "「이야기를 듣는 것만으로도 입꼬리가 풀려버리네요! 꼭 그 아이를 소개해 주었으면 합니다만……!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「んー、紹介してあげたいのはやまやまなんだけど、デネブの子だからね。つい最近まで新星学園に通ってたけど、今はこっちにいないんだ」"
translation = "「음-, 소개해 주고 싶은 마음은 굴뚝같지만, 데네브 아이니까 말야. 얼마 전까지 신세이 학원에 다녔지만, 지금은 이쪽에 없어」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「んー、残念☆」"
translation = "「음-, 아쉽네☆」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ふ～む。ルヴィネさまがデネブに戻るのはいつ頃なのかしら？\u3000向こうに戻る時も、案内と護衛の仕事を継続できないかしら？」"
translation = "「후~음. 루비네 님이 데네브로 돌아가는 건 언제쯤일까요? 그쪽에 돌아갈 때도, 안내와 호위 일을 계속할 수는 없을까요?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（職権乱用では？\u3000……今のデネブの守護天使は休眠中だから、一応移動の問題は解決してるんだっけ？）"
translation = "(직권남용 아닌가? ……지금 데네브의 수호천사는 휴면 중이니까, 일단 이동 문제는 해결되어 있던가?)"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「もっと詳しい話を聞きたいわ。その子はいったい──」"
translation = "「더 자세한 이야기를 듣고 싶어요. 그 아이는 대체──」"

[[dialogue]]
speaker = "unk"
original = "目を輝かせるセシアだったが──会議室での会談が終わったのか、天界の使節団の人たちと、ルヴィネ、シノが出てくる。"
translation = "눈을 빛내는 세시아였지만── 회의실에서의 회담이 끝났는지, 천계의 사절단 사람들과, 루비네, 시노가 나온다."

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「あ──お話はここまでのようですね。短い時間でしたが楽しかったです」"
translation = "「아── 이야기는 여기까지인 모양이네요. 짧은 시간이었지만 즐거웠습니다」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「アタシらも楽しかったぜ☆\u3000ありがとな、２人とも♪」"
translation = "「우리도 즐거웠다구☆ 고마워, 두 사람 모두♪」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「私もしばらくは人間界に留まることになります。また会ってお話ができるといいですね～」"
translation = "「저도 당분간은 인간계에 머물게 됩니다. 또 만나서 이야기할 수 있으면 좋겠네요~」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そうね。また会いましょう」"
translation = "「그래요. 또 만나요」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「じゃあね、２人とも」"
translation = "「그럼 안녕, 두 사람 모두」"

[[dialogue]]
speaker = "unk"
original = "ケイティとナターシャは使節団の所に向かう。"
translation = "케이티와 나타샤는 사절단이 있는 곳으로 향한다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「さて、次は九浄家に向かうわ」"
translation = "「자, 다음은 쿠죠 가문으로 향하겠어」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「学園を離れるのね。了解よ、ルヴィネさま」"
translation = "「학원을 떠나는군요. 알겠어요, 루비네 님」"

