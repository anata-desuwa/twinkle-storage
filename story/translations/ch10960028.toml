[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「どこに隠れた、魔王！\u3000諦めて出てこい！」"
translation = "「어디 숨었나, 마왕! 포기하고 나와라!」"

[[dialogue]]
speaker = "unk"
original = "リゾート結界でイングリットと鉢合わせして、とりあえず人気のない小島まで逃げ込んだはいいが、追い付かれてしまったようだ。"
translation = "리조트 결계에서 잉그리드와 맞닥뜨려, 일단 인기 없는 작은 섬까지 도망쳐 온 것까진 좋았는데 결국 따라잡힌 모양이다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「逃げるなー！\u3000それでも男かー！」"
translation = "「도망치지 마─! 그러고도 남자냐─!」"

[[dialogue]]
speaker = "unk"
original = "今日は戦うつもりがなかったので逃げていたら、この言い草である。"
translation = "오늘은 싸울 생각이 없어서 도망쳤더니 이런 말을 내뱉는다."

[[dialogue]]
speaker = "unk"
original = "さすがイングリット、自分勝手が過ぎる。"
translation = "역시 잉그리드다, 제멋대로가 지나치다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「この短小！\u3000早漏魔王ー！\u3000ザコち○ぽー！」"
translation = "「이 단소! 조루 마왕─! 자코 자지─!」"

[[dialogue]]
speaker = "unk"
original = "…………。"
translation = "…………."

[[dialogue]]
speaker = "unk"
original = "隠れてやり過ごそうと思ったが、気が変わった。今日こそ俺が勝つ。"
translation = "숨어서 그냥 보내려고 했지만 마음이 바뀌었다. 오늘이야말로 내가 이긴다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「出てこいまお──ッ！？」"
translation = "「나와라 마오──윽!?」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「魔王！？\u3000貴様、何のつもりだ！？」"
translation = "「마왕!? 네놈, 무슨 생각이냐!?」"

[[dialogue]]
speaker = "unk"
original = "隙を突き、後ろからイングリットの腕を掴んだ。"
translation = "허를 찔러 뒤에서 잉그리드의 팔을 붙잡았다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「お望み通り、戦ってやる。──セックスでな」"
translation = "「원하는 대로 싸워주지. ──섹스로 말이야」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「さっきまで逃げ回っていた男とは思えん威勢のよさだ。フン、今日も無様に射精させてやる」"
translation = "「방금 전까지 도망치던 남자라고는 생각되지 않는 기세군. 흥, 오늘도 꼴사납게 사정하게 만들어 주마」"

[[dialogue]]
speaker = "unk"
original = "これまでも俺たちは体を重ねてきた。"
translation = "지금까지도 우리들은 몸을 섞어 왔다."

[[dialogue]]
speaker = "unk"
original = "イングリットはセックスを戦いの一種だと思い込んでおり、一方的に挑まれ続けていたのである。"
translation = "잉그리드는 섹스를 싸움의 일종이라 믿고 있어서, 일방적으로 도전을 받아왔던 것이다."

[[dialogue]]
speaker = "unk"
original = "だが今日は違う。俺は俺の意思でイングリットと戦い、勝ってみせる。"
translation = "하지만 오늘은 다르다. 나는 내 의지로 잉그리드와 싸워, 이겨 보이겠다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「さぁ、腕を放して横になれ。私のおま○こに屈するがいい」"
translation = "「자, 팔을 놓고 누워라. 나의 보지에 굴복하도록 해」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いいや、今日はこのままだ。俺がイングリットを責める。いつも君が上だったからな」"
translation = "「아니, 오늘은 이대로다. 내가 잉그리드를 몰아붙이겠어. 항상 네가 위였으니까 말이야」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「なに……？」"
translation = "「뭐라고……?」"

[[dialogue]]
speaker = "unk"
original = "イングリットは自分が跨る、いわゆる騎乗位しか知らない。そこに付け入る隙がある……はずだ。"
translation = "잉그리드는 자신이 올라타는 소위 기승위밖에 모른다. 그곳에 파고들 빈틈이…… 있을 터다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「イングリットが本当に強いなら、後ろから責められても平気だろ。それとも、ザコち○ぽがそんなに怖いか？」"
translation = "「잉그리드가 정말 강하다면 뒤에서 공격받아도 괜찮겠지. 아니면 자코 자지가 그렇게 무섭나?」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「クク、クハハハハハ！\u3000安い挑発だ。だが、貴様の意気に免じて乗ってやろう。そぅら」"
translation = "「크크, 크하하하하하! 뻔한 도발이군. 하지만 네놈의 기개를 봐서 넘어가 주지. 자아」"

[[dialogue]]
speaker = "unk"
original = "お尻をふりふりと突き出すイングリット。"
translation = "엉덩이를 흔들흔들 내미는 잉그리드."

[[dialogue]]
speaker = "unk"
original = "中身はこんななのに、身体は相変わらず極上で、否応なく興奮してしまう。"
translation = "알맹이는 이런데도 몸매는 여전히 극상이라 어쩔 수 없이 흥분하고 만다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「さぁ、私のおま○こに挿れてみろ。逆に貴様の精液を搾り取ってやる！」"
translation = "「자, 나의 보지에 삽입해 봐라. 반대로 네놈의 정액을 짜내 주마!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐ、うぅぅぅ～～～～～っ」"
translation = "「구, 우으으으~~~~~윽」"

[[dialogue]]
speaker = "unk"
original = "イングリットの膣はすでに濡れていて、容易くペニスを飲み込んだ。体を鍛えているからなのか、締まりがよくてすでに気持ちいい。"
translation = "잉그리드의 질은 이미 젖어 있어서 손쉽게 페니스를 집어삼켰다. 몸을 단련해서 그런지 조임이 좋아서 벌써 기분이 좋다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「なんだ、これは……？\u3000いつもと違うところに当たっているのか……？\u3000うぅっ、くっ」"
translation = "「뭐지, 이건……? 평소와 다른 곳에 닿고 있는 건가……? 윽, 큭」"

[[dialogue]]
speaker = "unk"
original = "慣れない体位のせいか、イングリットの声に戸惑いが浮かぶ。"
translation = "익숙지 않은 체위 탓인지 잉그리드의 목소리에 당혹감이 서린다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「苦しくないか？」"
translation = "「괴롭지 않아?」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「苦しくはないが……なんだ、この感覚は……まるで初めてセックスした時のようだ……」"
translation = "「괴롭지는 않다만…… 뭐냐, 이 감각은…… 마치 처음 섹스했을 때 같구나……」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「私の中の、まだ知らない部分を触られているような……んんっ……ふぅ、はっ……得体の知れない感じだな……っ」"
translation = "「내 안의, 아직 모르는 부분을 건드려지고 있는 듯한…… 으응…… 후우, 하앗…… 정체 모를 느낌이군……윽」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ふぅ……それにしても敵を気遣うとは余裕だな、魔王っ」"
translation = "「후우…… 그나저나 적을 걱정하다니 여유롭구나, 마왕」"

[[dialogue]]
speaker = "unk"
original = "セックスしておいて敵も何もないと思うが、イングリットは違うらしい。"
translation = "섹스하면서 적이고 뭐고 없다고 생각하지만 잉그리드는 다른 모양이다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「だがその余裕、いつまで持つかな……んんっ」"
translation = "「하지만 그 여유, 언제까지 갈까…… 응윽」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くっ……」"
translation = "「큭……」"

[[dialogue]]
speaker = "unk"
original = "イングリットの膣がきゅっと締まり、ペニスを絞る。"
translation = "잉그리드의 질이 꽉 조이며 페니스를 쥐어짠다."

[[dialogue]]
speaker = "unk"
original = "彼女の言う通り、気遣っている場合ではないらしい。"
translation = "그녀의 말대로 걱정하고 있을 때가 아닌 모양이다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「じゃあ動くぞ」"
translation = "「그럼 움직인다」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ふぅっ……へこへこ腰を振って、私をイかせてみせろっ……んっ……できる、ものなら、なっ……」"
translation = "「후우…… 헉헉 허리를 흔들어서 나를 가버리게 만들어 봐라…… 응…… 할 수, 있다면, 말이다……」"

[[dialogue]]
speaker = "unk"
original = "そう言われて、止まる理由もない。揺らすように腰を動かし始める。"
translation = "그런 소릴 듣고 멈출 이유도 없다. 흔들듯이 허리를 움직이기 시작한다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「んぐぅ～～～～～～～～っ<emoji=heart04>」"
translation = "「응구우우우우우우우웃<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ん、ふぅ、はぁ……んんっ……<emoji=heart04>\u3000はぁ、はっ……あ……はぁっ……<emoji=heart04>」"
translation = "「응, 후우, 하아…… 응으윽……<emoji=heart04> 하아, 하앗…… 아…… 하앗……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "腕を捕まえているから、イングリットは動きようがない。逆に俺は自由に動ける。"
translation = "팔을 붙잡고 있으니 잉그리드는 움직일 방도가 없다. 반대로 나는 자유롭게 움직일 수 있다."

[[dialogue]]
speaker = "unk"
original = "俺の動きに合わせて、背中越しに大きな胸が揺れているのが見えて気分がいい。"
translation = "내 움직임에 맞춰 등 너머로 커다란 가슴이 흔들리는 게 보여서 기분이 좋다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ち○ぽが、私の中を走っているっ……くっ、ん～～～～っ<emoji=heart04>」"
translation = "「자지가, 내 안을 달리고 있어…… 윽, 으응~~~~~웃<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「さっきから……何なんだ、これは……うぅん、ゾクゾクする……<emoji=heart04>」"
translation = "「아까부터…… 도대체 뭐냐, 이건…… 으으음, 소름 끼쳐……<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「知らない、ゾクゾクが、来て……あ、ん、ふぁ……<emoji=heart04>\u3000あ、ぐっ、ん、んんっ<emoji=heart04>」"
translation = "「모르는 전율이 찾아와서…… 아, 응, 후아……<emoji=heart04> 아, 윽, 응, 으응<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「認めろイングリット。それは気持ちいいってことだ」"
translation = "「인정해 잉그리드. 그건 기분 좋다는 뜻이야」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「気持ちいい？\u3000んんっ……私が感じているだと……？」"
translation = "「기분 좋아? 응으윽…… 내가 느끼고 있다고……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そうだ。普段とは違う角度でち○ぽが当たってるだろ？\u3000ほら！」"
translation = "「그래. 평소랑은 다른 각도로 자지가 닿고 있잖아? 자!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「んひぃっ<emoji=heart04>」"
translation = "「응히익<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「……なんだ、今の声は…………本当に私の声なのか……？」"
translation = "「……뭐냐, 방금 그 목소리는………… 정말로 내 목소리인 거냐……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「イングリットはそこが好きなんだな」"
translation = "「잉그리드는 거길 좋아하는구나」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「は？\u3000何を──」"
translation = "「하? 무슨──」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「んぎぃっ<emoji=heart04>\u3000んぁ、あ、ああぁっ<emoji=heart04>\u3000んんぁっ、はっ、ああっ<emoji=heart04>」"
translation = "「응기익<emoji=heart04> 응아, 아, 아아앗<emoji=heart04> 으응아앗, 하앗, 아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "今度は連続で同じところを穿つ。今まで触れることのできなかった弱点。イングリットの秘所の、さらにその深部を。"
translation = "이번엔 연속으로 같은 곳을 찌른다. 지금까지 닿을 수 없었던 약점. 잉그리드의 비소의, 더 깊은 그곳을."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「おのれ、調子に、ん、乗りおって！\u3000ん、んんっ……！」"
translation = "「이놈이, 기어오르, 응, 기어오르기는! 응, 응으윽……!」"

[[dialogue]]
speaker = "unk"
original = "反撃のつもりだろう、膣を締めようと体に力を入れたのを見て、今度はイングリットの腕を引っ張った。"
translation = "반격의 생각인지 질을 조이려고 몸에 힘을 주는 걸 보고, 이번엔 잉그리드의 팔을 끌어당겼다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐうぅ～～～っ<emoji=heart04>\u3000貴様、卑怯だぞっ」"
translation = "「구우우우우~~~웃<emoji=heart04> 네놈, 비겁하다앗」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「卑怯？\u3000これは戦いなんだろう？\u3000なら卑怯も何もないだろ」"
translation = "「비겁? 이건 싸움이라며? 그럼 비겁하고 뭐고 없잖아」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「くっ……」"
translation = "「큭……」"

[[dialogue]]
speaker = "unk"
original = "顔は見えないけど、悔しそうなイングリットがありありと想像できた。それだけでもペニスが余計に滾る。"
translation = "얼굴은 보이지 않지만 억울해하는 잉그리드가 눈에 선하다. 그것만으로도 페니스가 더욱 달아오른다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「嬉しそうに、ち○ぽをビクビクさせて……んっ、くっ……ふあ、あ、ああっ<emoji=heart04>」"
translation = "「기쁜 듯이 자지를 움찔거리면서…… 응, 윽…… 후아, 아, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ん、ん、んんっ<emoji=heart04>\u3000ぐぅ、う、ああ……あ、ああっ<emoji=heart04>\u3000私の知らない、私の声が、出る……ああぁっ<emoji=heart04>」"
translation = "「응, 응, 응으윽<emoji=heart04> 구우, 우, 아아…… 아, 아앗<emoji=heart04> 내가 모르는 나의 목소리가 나와…… 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「おのれっ……あ、んん、ぐぅっ……<emoji=heart04>\u3000あ、あ、ふあぁっ<emoji=heart04>」"
translation = "「이놈이…… 아, 응응, 구웃……<emoji=heart04> 아, 아, 후아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "あの身勝手なイングリットが、俺の腕の中で、俺のペニスで、なす術もなく喘いでいる。"
translation = "그 제멋대로인 잉그리드가 내 품 안에서, 내 페니스에 속수무책으로 헐떡이고 있다."

[[dialogue]]
speaker = "unk"
original = "強い雌を犯す快楽に、理性は吹き飛んだ。"
translation = "강한 암컷을 범하는 쾌락에 이성은 날아갔다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「短小だとか早漏だとか、さっきは好き勝手言ってくれてな。今でも同じことが言えるか？」"
translation = "「단소라느니 조루라느니, 아까는 마음대로 지껄여줬지. 지금도 똑같은 말을 할 수 있을까?」"

[[dialogue]]
speaker = "unk"
original = "鏡で見たら、今の俺は悪役みたい笑みを浮かべていると思う。でも止まらない。"
translation = "거울로 보면 지금의 나는 악역 같은 미소를 짓고 있을 거라 생각한다. 하지만 멈추지 않는다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐっ、うぅっ……フン、そんなに、言って欲しいなら……言ってやる……んんっ<emoji=heart04>」"
translation = "「윽, 으윽…… 흥, 그렇게 말해주길 원한다면…… 말해주지…… 응으윽<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「このっ……短小ち○ぽの、早漏魔王め……あ、くっ<emoji=heart04>\u3000さっさと、惨めに、イって、せーえき……は、あぁっ<emoji=heart04>\u3000ぶちまけろ……っ」"
translation = "「이…… 단소 자지의 조루 마왕 녀석…… 아, 윽<emoji=heart04> 얼른 비참하게 가버려서 정액…… 하, 아앗<emoji=heart04> 쏟아내 버려……!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「まだ余裕そうだな。なら、遠慮なく行くぞ」"
translation = "「아직 여유로운 모양이네. 그럼 사양 않고 간다」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「なに……！？」"
translation = "「뭐라고……!?」"

[[dialogue]]
speaker = "unk"
original = "腕を引きながら腰を突き出し、イングリットの子宮めがけてペニスで貫く。"
translation = "팔을 당기며 허리를 내질러 잉그리드의 자궁을 향해 페니스로 꿰뚫는다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ひぎぃ～～～～～～～～～っ<emoji=heart04><emoji=heart04>」"
translation = "「히기이이이이이이이이잇<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「んあ、あ、あがぁっ<emoji=heart04>\u3000ぐっ、あ、んぐぅっ<emoji=heart04>\u3000あぐっ、ぅっ、くぅぅっ<emoji=heart04>」"
translation = "「응아, 아, 아가앗<emoji=heart04> 윽, 아, 응구웃<emoji=heart04> 아긋, 윽, 쿠우우웃<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "奥へ、奥へ、奥へ──イングリットの一番奥、子宮口を突いて、さらに突く。"
translation = "안으로, 안으로, 안으로── 잉그리드의 가장 안쪽, 자궁구를 찌르고 다시 찌른다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐ、あ、ああっ、ああぁ～～～～～～～っ<emoji=heart04>」"
translation = "「구, 아, 아앗, 아아아~~~~~~~~앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「子宮が……ち○ぽに、叩かれているっ……ぐぅっ……はぁ、あぁっ<emoji=heart04>」"
translation = "「자궁이…… 자지에 얻어맞고 있어…… 윽…… 하아, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐっ、がぁっ……はぁ、あ、あ、あ、い、んっ<emoji=heart04>\u3000大きくて、硬いので、突かれて……んんっ……ぐぅっ、あぁ～～～っ<emoji=heart04>」"
translation = "「윽, 가앗…… 하아, 아, 아, 아, 이, 응<emoji=heart04> 크고 딱딱한 걸로 찔려버려서…… 응으윽…… 구웃, 아아아~~~앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "腕を引きながら突けば、衝撃は２倍。単純な理屈だ。"
translation = "팔을 당기면서 찌르면 충격은 두 배. 단순한 이치다."

[[dialogue]]
speaker = "unk"
original = "でも、その単純さこそが一番の威力になる。"
translation = "하지만 그 단순함이야말로 최고의 위력이 된다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ひぎぃっ<emoji=heart04>\u3000腹の奥に、響いて……んぁあっ<emoji=heart04>\u3000い、あ、んんっ<emoji=heart04>\u3000ぐぅ、あ、あ、ああっ<emoji=heart04>」"
translation = "「히기잇<emoji=heart04> 배 속 깊이 울려서…… 응아아앗<emoji=heart04> 이, 아, 응으윽<emoji=heart04> 구우, 아, 아, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「どうだイングリット、負けを認めるか？」"
translation = "「어때 잉그리드, 패배를 인정하겠어?」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「んぐぅっ……抜かせっ……貴様こそ、ぐっ、イきそうだろうがっ」"
translation = "「응구웃…… 헛소리 마라…… 너야말로, 윽, 가버릴 것 같으면서……」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ち○ぽが……ビクビク震えて、いるぞ……貴様が、何度、私の中で射精したと、思っている……っ」"
translation = "「자지가…… 비쿠비쿠 떨고 있다고…… 네놈이 몇 번이나 내 안에서 사정했다고 생각하는 거냐……!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くっ……」"
translation = "「큭……」"

[[dialogue]]
speaker = "unk"
original = "それは彼女の言う通りだ。俺は今まで何度もイングリットに襲われて、搾り取られてきた。"
translation = "그건 그녀의 말대로다. 나는 지금까지 수없이 잉그리드에게 습격당해 짜여왔다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「貴様のが、私の中で、脈打って……あ、はぁっ<emoji=heart04>\u3000知っているぞ、出す時の合図だ……<emoji=heart04>」"
translation = "「네놈의 것이 내 안에서 맥동하며…… 아, 하앗<emoji=heart04> 알고 있다, 내보낼 때의 신호다……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イングリットの膣中は、奥を突くたびにきゅうきゅうと吸い付いてきて、本当は今にも射精してしまいたい。"
translation = "잉그리드의 질 안은 안쪽을 찌를 때마다 뀨뀨거리며 빨아들여서, 사실 지금 당장이라도 사정해 버리고 싶다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「どうした、魔王っ……はぁ、あぁっ<emoji=heart04>\u3000その程度、かっ<emoji=heart04>\u3000ククッ<emoji=heart04>」"
translation = "「왜 그러나, 마왕…… 하아, 아앗<emoji=heart04> 그 정도뿐이냐<emoji=heart04> 크큭<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "一瞬の迷いを見抜いたのか、イングリットが不敵に笑う。"
translation = "찰나의 망설임을 간파했는지 잉그리드가 대담하게 웃는다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「貴様がっ、大好きなようだからっ……あ、はぁ<emoji=heart04>\u3000何度でも、言って、やる……このザコち○ぽっ<emoji=heart04>」"
translation = "「네가! 아주 좋아하는 것 같으니까…… 아, 하아<emoji=heart04> 몇 번이고, 말해, 줄게…… 이 잡어 자지<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「無様に、イきちらかせっ……はぅあ、あぁっ<emoji=heart04>\u3000そうろうっ、まおうっ<emoji=heart04>\u3000はぁ、あうっ<emoji=heart04>」"
translation = "「추하게, 마구 가버려…… 하우아, 아앗<emoji=heart04> 조루, 마왕<emoji=heart04> 하아, 아우윽<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「このぉっ！」"
translation = "「이게 진짜!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「がぁ、あ、あ、あ、あ、あああぁぁ～～～～～～～っ<emoji=heart04>」"
translation = "「가아, 아, 아, 아, 아, 아아아아～～～～～～～앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "力任せに腰を振る。もう何も考えられなくて、イク前にイカせる。それだけだ。"
translation = "힘껏 허리를 흔든다. 이제 아무것도 생각할 수 없어서, 가기 전에 가게 만든다. 그뿐이다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐっ、がっ、はぁあっ<emoji=heart04>\u3000あ、あ、あ、あ、ああっ<emoji=heart04>\u3000ふあぁ、あ、あ、あ、ああぁっ<emoji=heart04>」"
translation = "「구윽, 가악, 하아앗<emoji=heart04> 아, 아, 아, 아, 아앗<emoji=heart04> 후아아, 아, 아, 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ち○ぽ、ち○ぽが腹にひびくぅ……んぎぃ、あ、あ、ぐぅ、ああっ<emoji=heart04>」"
translation = "「자지, 자지가 배 속까지 울려어…… 응기이, 아, 아, 구우, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「まだだぁっ……負けるものかぁっ！\u3000ぬううぅぅっ！」"
translation = "「아직이다아…… 질 것 같으냐아! 느우우우우욱!」"

[[dialogue]]
speaker = "unk"
original = "イングリットが下半身に力を込め、きつく締めてくる。射精しそうになるが、歯を食いしばって耐える。"
translation = "잉그리드가 하반신에 힘을 주어, 꽉 조여온다. 사정할 것 같아지지만, 이를 악물고 버틴다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぐぅっ……俺だって！」"
translation = "「구윽…… 나라고!」"

[[dialogue]]
speaker = "unk"
original = "最後の力を振り絞って、子宮口を突く。理性なんかとっくに焼き切れて、本能のままに腰を振る。"
translation = "마지막 힘을 쥐어짜서, 자궁구를 찌른다. 이성 같은 건 진작에 타버리고, 본능대로 허리를 흔든다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「いぎぃ、ん、あ、あ、あ、がぁっ<emoji=heart04>\u3000はぁ～～～、あ、あ、ふあ、あああ、あああっっ<emoji=heart04>」"
translation = "「이기이, 응, 아, 아, 아, 가앗<emoji=heart04> 하아～～～, 아, 아, 후아, 아아아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「くっ、うぅっ……子宮が、潰れるっ<emoji=heart04>\u3000ち○ぽに潰されるぅっ<emoji=heart04>\u3000……はぅあっ<emoji=heart04>\u3000あ、あ、あ、ふあぁっ<emoji=heart04>」"
translation = "「큭, 우으윽…… 자궁이, 으깨져어<emoji=heart04> 자지에 으깨져버려어<emoji=heart04> ……하우앗<emoji=heart04> 아, 아, 아, 후아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐぅ、くぁ、あ、あぁっ<emoji=heart04>\u3000だめだ、あっ<emoji=heart04>\u3000ま○こが、ひくついて──イク、イクイクっ<emoji=heart04>」"
translation = "「구우, 쿠아, 아, 아앗<emoji=heart04> 안 돼, 앗<emoji=heart04> 보지가, 파르르 떨려서── 가, 가버려엇<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ん──あぁ、んぁっ<emoji=heart04>\u3000あ──あ、あ、ああ、ふぅああぁっ<emoji=heart04>\u3000イク、イクイクイク────あ、あ、あ、あぁ<emoji=heart04>\u3000イッくううぅ～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응── 아아, 응앗<emoji=heart04> 아── 아, 아, 아아, 후아아아앗<emoji=heart04> 가, 가버려 가버려 가버려──── 아, 아, 아, 아아<emoji=heart04> 가버렷어어어어～～～～～～앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐあぁ────あぁっ～～～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「구아아──── 아앗～～～～～～～～～앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「あぁっ<emoji=heart04>\u3000うぅっ<emoji=heart04>\u3000あついぃ、腹が、あついぃ……びゅくびゅくって、せーえき出てるぅ……<emoji=heart04>」"
translation = "「아앗<emoji=heart04> 우으윽<emoji=heart04> 뜨거워어, 배 속이, 뜨거워어…… 뷰릇뷰릇하고, 정액 나오고 있어어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「イングリット、孕め……っ！」"
translation = "「잉그리드, 배라……!」"

[[dialogue]]
speaker = "unk"
original = "亀頭を子宮口に押し付けて、最後の一滴まで絞り出す。"
translation = "귀두를 자궁구에 밀어붙이고, 마지막 한 방울까지 짜낸다."

[[dialogue]]
speaker = "unk"
original = "イングリットを俺で満たす──その気持ちが俺を動かしていた。"
translation = "잉그리드를 나로 채운다── 그 기분이 나를 움직이고 있었다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「はぅあぁ……あ、あぁっ<emoji=heart04>\u3000魔王のち○ぽ、私の中で、暴れて……<emoji=heart04>\u3000子宮、ぐりぐりされてるぅ……<emoji=heart04>」"
translation = "「하우아아…… 아, 아앗<emoji=heart04> 마왕의 자지, 내 안에서, 날뛰어서……<emoji=heart04> 자궁, 고물고물 당하고 있어어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ふうぅ～……はぁ……んん、んっ<emoji=heart04>\u3000はぁ～、あぁ～～～っ<emoji=heart04>」"
translation = "「후우우～…… 하아…… 응으, 응윽<emoji=heart04> 하아～, 아아～～～앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "絶頂によって膣中がぎりぎりと締まる。呼吸さえ覚束ないくらい、俺たちは深く交わっていた。"
translation = "절정에 의해 질 안이 꽉 조여진다. 호흡조차 가쁠 정도로, 우리들은 깊게 섞여 있었다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「はうぅ……あっ、抜け……」"
translation = "「하우우…… 앗, 빠져……」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「んんっ……<emoji=heart04>\u3000はぁ……はあぁ……<emoji=heart04>」"
translation = "「응윽……<emoji=heart04> 하아…… 하아아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "射精に力尽きたペニスが萎え、イングリットから抜け落ちた。"
translation = "사정에 힘이 다한 페니스가 시들며, 잉그리드에게서 빠져나왔다."

[[dialogue]]
speaker = "unk"
original = "すると膣口から、ごぼっと精液が溢れる。"
translation = "그러자 질구에서, 울컥 정액이 흘러넘친다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「はぁー……はぁー……はぁー……」"
translation = "「하아─…… 하아─…… 하아─……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はぁ、はぁ……はぁ……」"
translation = "「하아, 하아…… 하아……」"

[[dialogue]]
speaker = "unk"
original = "荒い息を繰り返し、肺にめいっぱい空気を送り込む。"
translation = "거친 숨을 몰아쉬며, 폐에 힘껏 공기를 불어넣는다."

[[dialogue]]
speaker = "unk"
original = "次第に脳に酸素が巡って、ようやく理性らしきものが戻ってきた。"
translation = "점차 뇌에 산소가 돌며, 겨우 이성 비슷한 것이 돌아왔다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「貴様、どれだけ射精したのだ……おま○こから、精液がこぼれ落ちてくるぞ……んっ」"
translation = "「네놈, 대체 얼마나 사정한 거냐…… 보지에서, 정액이 쏟아져 내린다고…… 응」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それは自分でもそう思う……」"
translation = "「그건 나도 그렇게 생각해……」"

[[dialogue]]
speaker = "unk"
original = "イングリットの足元には白い雫が落ちていて、言い逃れなんてできない。"
translation = "잉그리드의 발치에는 하얀 물방울이 떨어져 있어, 변명 따윈 할 수 없다."

[[dialogue]]
speaker = "unk"
original = "俺がイングリットと自ら交わった証だ。"
translation = "내가 잉그리드와 스스로 교제했다는 증거다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「フン、今回も私の勝ちだったな。早漏魔王め」"
translation = "「흥, 이번에도 나의 승리였군. 조루 마왕 녀석」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それはない。イングリットがイったのが早かった」"
translation = "「그렇지 않아. 잉그리드가 간 게 더 빨랐어」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「なんだと？\u3000ならもう一戦──」"
translation = "「뭐라고? 그렇다면 한 판 더──」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それは流石に無理だって」"
translation = "「그건 역시 무리라니까」"

[[dialogue]]
speaker = "unk"
original = "今のをもう一回やったら死ぬと思う。誇張抜きで。"
translation = "방금 같은 걸 한 번 더 했다간 죽을 것 같다. 과장 없이."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「クク、軟弱なことだ。では、こうしよう」"
translation = "「크크, 연약하긴. 그럼, 이렇게 하지」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「私が貴様の子を孕んだら、貴様の勝ち。孕まなかったら私の勝ちだ」"
translation = "「내가 네 아이를 배면, 너의 승리. 배지 않으면 나의 승리다」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「は？」"
translation = "「하?」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「今、私の<ruby>胎<rt>はら</rt></ruby>の中では、貴様の精子と私の卵子が戦っているのだ。貴様の精子が強いか、私の卵子が強いか、勝負だ」"
translation = "「지금, 나의 <ruby>태<rt>배</rt></ruby> 안에서는, 너의 정자와 나의 난자가 싸우고 있다. 너의 정자가 강할지, 나의 난자가 강할지, 승부다」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「貴様が勝てば、私は貴様の妻となり、貴様の子を産んでやろう」"
translation = "「네가 이기면, 나는 네 아내가 되어, 네 아이를 낳아 주지」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「私たちの子はきっと……いや、必ず強い子になるぞ。クク、クハハハハ！」"
translation = "「우리들의 아이는 분명…… 아니, 반드시 강한 아이가 될 거다. 크크, 크하하하하!」"

[[dialogue]]
speaker = "unk"
original = "笑い声をあげるイングリット。この勝負の結果が分かるのはいつになるだろうか──"
translation = "웃음소리를 내는 잉그리드. 이 승부의 결과를 알게 되는 것은 언제쯤일까──"

