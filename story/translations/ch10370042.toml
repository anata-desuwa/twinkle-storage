[[dialogue]]
speaker = "unk"
original = "第２話,魔界スイーツ研究,P"
translation = "제2화, 마계 디저트 연구"

[[dialogue]]
speaker = "unk"
original = "放課後、カフェテリアに行くと、サランとリィベルが何やら話していた。"
translation = "방과 후, 카페테리아에 가니, 사란과 리벨이 무슨 이야기인가를 하고 있었다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「こっちはどお～？\u3000美味しくできたと思うんだけど～」"
translation = "「이쪽은 어때～? 맛있게 만들어졌다고 생각하는데～」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「ちょっと待って。そんなにたくさん食べられないわよ」"
translation = "「잠깐 기다려. 그렇게 많이는 못 먹는다고」"

[[dialogue]]
speaker = "unk"
original = "珍しい組み合わせだね？"
translation = "특이한 조합이네?"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「そ～お？\u3000サランたち仲良しだよね～？」"
translation = "「그래～? 사란 일행은 사이좋은데～?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「……別に仲良くなった覚えはないけど。まぁ、サランが魔将になった以上、ある程度の付き合いはあるわ」"
translation = "「……딱히 사이좋아진 기억은 없지만. 뭐, 사란이 마장이 된 이상, 어느 정도의 교류는 있는 편이지」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「えへへ、そうだね～♪\u3000今日はね～、リィベルちゃんに新作スイーツの試食に付き合ってもらってるんだ～」"
translation = "「에헤헤, 그렇네～♪ 오늘은 말이지～, 리벨짱한테 신작 디저트 시식에 함께해달라고 하고 있어～」"

[[dialogue]]
speaker = "unk"
original = "テーブルにはケーキやクッキー、いろんなお菓子が所狭しと並べられている。"
translation = "테이블에는 케이크나 쿠키, 여러 과자가 빼곡하게 늘어서 있다."

[[dialogue]]
speaker = "unk"
original = "その見た目は、目玉みたいなものが乗ったパフェ、ガイコツ型のクッキー、クリーチャーチックなケーキなどかなり独特だ。"
translation = "그 모습은 눈알 같은 것이 올려진 파페, 해골 모양의 쿠키, 크리처다운 케이크 등 매우 독특하다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「魔本に書いてあったお菓子をサランなりに再現してみたんだ～。可愛いでしょ～？」"
translation = "「마도서에 적혀 있던 과자를 사란 나름대로 재현해 본 거야～. 귀엽지～?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「付き合ってるからって忖度しなくていいのよ。魔族って大昔から露悪的だから、不気味なのも多いし」"
translation = "「사귀고 있다고 해서 봐줄 필요는 없어. 마족이란 먼 옛날부터 악취미적이라, 기괴한 것도 많으니까」"

[[dialogue]]
speaker = "unk"
original = "ハロウィンっぽくて可愛い"
translation = "할로윈 같아서 귀여워"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふふっ、ありがと～♪\u3000美味しさも自信ありだから、会長ちゃんも食べて食べて～」"
translation = "「후후, 고마워～♪ 맛도 자신 있으니까, 회장짱도 먹어봐 먹어봐～」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「あっ、そうだ。サランが食べさせてあげる～♪\u3000あ～～ん」"
translation = "「앗, 그렇다. 사란이 먹여줄게～♪ 아～～앙」"

[[dialogue]]
speaker = "unk"
original = "サランがプリンらしきものをスプーンですくって、口に運んでくれるが──"
translation = "사란이 푸딩 같은 것을 스푼으로 떠서, 입으로 날라다 주는데──"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「じーーー」"
translation = "「뚫어져라──」"

[[dialogue]]
speaker = "unk"
original = "横からリィベルの視線がナイフのように突き刺さってくる。"
translation = "옆에서 리벨의 시선이 칼날처럼 꽂혀온다."

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「なに？\u3000私のことは気にしないでいいから、早く食べなさいよ。サランに恥をかかせる気？」"
translation = "「뭐야? 나는 신경 쓰지 말고 어서 먹어. 사란한테 창피라도 줄 셈이야?」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「あ～～～ん<emoji=heart04>」"
translation = "「아～～～앙<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "サランが目を輝かせながら、俺を見ている。嬉しいけどちょっと恥ずかしい。"
translation = "사란이 눈을 빛내며, 나를 바라보고 있다. 기쁘지만 조금 부끄럽다."

[[dialogue]]
speaker = "unk"
original = "あ～～ん"
translation = "아～～앙"

[[dialogue]]
speaker = "unk"
original = "気まずさを感じながらも、サランのあーんを受け止める。"
translation = "어색함을 느끼면서도, 사란의 아앙을 받아들인다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ど～お？\u3000美味しい？」"
translation = "「어때～? 맛있어?」"

[[dialogue]]
speaker = "unk"
original = "甘辛くて美味しい！"
translation = "단짠단짠해서 맛있어!"

[[dialogue]]
speaker = "unk"
original = "甘さとしょっぱさ、ほのかな辛みが見事に調和している。強いて例えるなら、辛みのあるみたらしのような感じ。"
translation = "달콤함과 짭조름함, 은은한 매콤함이 훌륭하게 조화를 이루고 있다. 굳이 비유하자면, 매콤한 미타라시 당고 같은 느낌."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふふ～、よかった～♪\u3000会長ちゃんの美味しいがいちばん嬉しい～♪」"
translation = "「후후～, 다행이다～♪ 회장짱의 맛있다는 말이 제일 기뻐～♪」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「ふぅん。バカップルって実在するのね」"
translation = "「흠. 닭살 커플이란 실존하는 거였구나」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「リィベルちゃんも食べてね～。感想を教えてくれたら嬉しいな～」"
translation = "「리벨짱도 먹어봐～. 감상을 알려주면 기쁘겠어～」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「私、甘いものはいまいちだって言ってるでしょ」"
translation = "「나, 단 건 별로라고 말했잖아」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「まぁまぁ、そう言わずに食べて～。きっと気に入ると思うな～」"
translation = "「자자, 그러지 말고 먹어봐～. 분명 마음에 들 거라고 생각해～」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「そこまで言うなら、ひと口だけ…………ん！」"
translation = "「거기까지 말한다면, 한 입만…… 읍!」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「香ばしい苦みの中に、わずかに甘みが隠れている。美味しいわ。確かに私の好みよ」"
translation = "「고소한 씁쓸함 속에, 미세하게 달콤함이 숨어 있어. 맛있어. 확실히 내 취향이야」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「……さすがね、サラン。正直、見くびっていたわ」"
translation = "「……역시나네, 사란. 솔직히, 깔보고 있었어」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「えへへ～。そんなに褒められると照れちゃう～♪\u3000たくさんあるから、いっぱい食べてね～」"
translation = "「에헤헤～. 그렇게 칭찬받으니 부끄럽네～♪ 잔뜩 있으니까, 많이 먹어～」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「……いただくわ」"
translation = "「……잘 먹을게」"

[[dialogue]]
speaker = "unk"
original = "つれないことを言っていたくせに、リィベルは黙々とお菓子を口に運ぶ。サランのお菓子には抗えなかったようだ。"
translation = "쌀쌀맞은 소리를 해댔던 주제에, 리벨은 묵묵히 과자를 입으로 나른다. 사란의 과자에는 거역할 수 없었던 모양이다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふんふふ～ん♪」"
translation = "「흠흥흠～응♪」"

[[dialogue]]
speaker = "unk"
original = "お菓子を頬張るリィベルを、サランが上機嫌で眺めるのだった。"
translation = "과자를 입안 가득 넣는 리벨을, 사란이 신이 나서 바라보는 것이었다."

[[dialogue]]
speaker = "unk"
original = "一週間後、サランとリィベルをまたカフェテリアで見かけた。"
translation = "일주일 후, 사란과 리벨을 또 카페테리아에서 발견했다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「会長ちゃ～ん。今日も魔界スイーツ研究やってるよ～」"
translation = "「회장짱～. 오늘도 마계 디저트 연구 하고 있어～」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「うぐぐぐ……」"
translation = "「으구구구……」"

[[dialogue]]
speaker = "unk"
original = "何やら呻きながら、リィベルがお菓子を食べ続けている。しかも前に見た時より心なしかふっくらしているような……"
translation = "무어라 신음하면서, 리벨이 과자를 계속 먹고 있다. 게다가 전에 봤을 때보다 기분 탓인지 통통해진 것 같은……"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「美味しい……どのお菓子も美味しい……食べるのが止まらない…………うぅっ」"
translation = "「맛있어…… 어떤 과자도 맛있어…… 먹는 걸 멈출 수 없어………… 으윽」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「リィベルちゃん、たくさん食べてくれて嬉しいな～。張り切っていっぱい作っちゃった～♪」"
translation = "「리벨짱, 많이 먹어줘서 기쁘네～. 신나서 잔뜩 만들어 버렸어～♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「会長ちゃんもたくさん食べてね～。オススメはこの魔獣のケーキかな～。お腹を割ると、ベリーソースが溢れてくるの～」"
translation = "「회장짱도 많이 먹어～. 추천은 이 마수의 케이크일까나～. 배를 가르면, 베리 소스가 흘러나와～」"

[[dialogue]]
speaker = "unk"
original = "ケーキの魔獣の腹から、はらわたのように赤いソースがこぼれ出す。サランらしからぬグロテスクさだが、魔族センスなのだろう。"
translation = "케이크의 마수 배에서, 내장처럼 붉은 소스가 흘러나온다. 사란답지 않은 기괴함이지만, 마족 취향인 거겠지."

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「もう止まらなきゃいけないのに、止まれない……誰か、私を止めて…………」"
translation = "「이제 멈춰야 하는데, 멈출 수가 없어…… 누군가, 나를 좀 말려줘…………」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふふふ～♪\u3000お口に合ったみたいでよかった～♪」"
translation = "「후후후～♪ 입에 맞은 것 같아서 다행이다～♪」"

[[dialogue]]
speaker = "unk"
original = "サラン自身もたくさん食べるけど、人にも暴食させてしまうのは、無自覚な大罪なのかもしれない。"
translation = "사란 자신도 많이 먹지만, 남에게도 폭식하게 만드는 것은, 자각 없는 대죄일지도 모른다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「会長ちゃん、あ～～ん<emoji=heart04>」"
translation = "「회장짱, 아～～앙<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "サランもあ～～ん"
translation = "사란도 아～～앙"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「あ～～ん<emoji=heart04>\u3000ん～～っ、会長ちゃんに食べさせてもらうと、もっと美味し～♪」"
translation = "「아～～앙<emoji=heart04> 응～～읏, 회장짱한테 먹여달라고 하니까, 더 맛있어～♪」"

[[dialogue]]
speaker = "unk"
original = "嘆くリィベルの横で、お菓子を食べさせ合う俺たち。傍から見れば確かにバカップルだ。"
translation = "탄식하는 리벨 옆에서, 과자를 서로 먹여주는 우리들. 제삼자가 보기엔 확실히 닭살 커플이다."

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "（何あれ、怖……やっぱり魔将には近づかないでおこうっと……）"
translation = "(뭐야 저거, 무서워…… 역시 마장한테는 접근하지 말아야지……)"

