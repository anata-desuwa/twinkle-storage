[[dialogue]]
speaker = "unk"
original = "トラブルの報せを受け、俺はリゾート結界に急行した。そこにいたのは……"
translation = "트러블 소식을 듣고 나는 리조트 결계로 급히 향했다. 그곳에 있던 것은……"

[[dialogue]]
speaker_original = "チキン？"
speaker_translation = "치킨?"
original = "「チキチキチー！」"
translation = "「치키치키치!」"

[[dialogue]]
speaker = "unk"
original = "大量のフライドチキンモンスター（？）と──"
translation = "대량의 프라이드치킨 몬스터(?)와──"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「チキン食べ放題だー！」"
translation = "「치킨 무한 리필이다!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「もうなんなのこれー！？」"
translation = "「정말 대체 뭐야 이거어!!」"

[[dialogue]]
speaker = "unk"
original = "水着姿の先輩たちだった。"
translation = "수영복 차림의 선배들이었다."

[[dialogue]]
speaker = "unk"
original = "状況がよく分からないが、チキンから確かにモンスターの気配を感じる。"
translation = "상황은 잘 모르겠지만 치킨에게서 확실히 몬스터의 기운이 느껴진다."

[[dialogue]]
speaker = "unk"
original = "──ならやることはひとつ！"
translation = "──그렇다면 할 일은 하나!"

[[dialogue]]
speaker = "unk"
original = "サタニックグレイス！"
translation = "사타닉 그레이스!"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、会長くん！」"
translation = "「아, 회장 군!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「大変大変！\u3000リゾート結界に来た途端、フライドチキン食べ放題が始まっちゃってさ！」"
translation = "「큰일이야, 큰일! 리조트 결계에 오자마자 프라이드치킨 무한 리필이 시작되어 버려서 말야!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「シルヴィ、説明になってないから！」"
translation = "「실비, 설명이 안 되잖아!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「泳ぐれん……こほん、水着戦闘服の試運転で来てたんだけど、フライドチキンのモンスターに囲まれちゃって戦闘になったの」"
translation = "「수영 연…… 아니, 수영복 전투복 시운전하러 왔었는데 프라이드치킨 몬스터에게 포위돼서 전투가 벌어졌어」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「しかもこのチキンモンスター、倒すと普通のフライドチキンになるみたい。自分でも何言ってるか分からないけど……」"
translation = "「게다가 이 치킨 몬스터, 쓰러뜨리면 평범한 프라이드치킨이 되는 모양이야. 나도 내가 무슨 말을 하는지 모르겠지만……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「購買のチキンと同じ味だったよ！\u3000美味しかったです！」"
translation = "「매점 치킨이랑 똑같은 맛이었어! 맛있었습니다!」"

[[dialogue]]
speaker = "unk"
original = "うん、まったく分からない。"
translation = "음, 전혀 모르겠다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「とにかく敵を無力化しよう。２人は前衛へ、私は後ろからサポート！\u3000オペレート開始します！」"
translation = "「일단 적을 무력화하자. 두 사람은 전방으로, 나는 뒤에서 서포트! 오퍼레이트 개시합니다!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「会長さんは正面から敵を引き付けてください。シルヴィはその間に側面から……いや、水中から攻撃して！」"
translation = "「회장 씨는 정면에서 적을 유인해 주세요. 실비는 그사이에 측면에서…… 아니, 수중에서 공격해!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「水中から？\u3000なるほど、水着戦闘服ならではの戦い方だね！」"
translation = "「수중에서? 과연, 수영복 전투복 특유의 싸움 방식이네!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「じゃあドボン！」"
translation = "「그럼 풍덩!」"

[[dialogue]]
speaker = "unk"
original = "作戦通り、俺は真っ向から仕掛ける。"
translation = "작전대로 나는 정면으로 나선다."

[[dialogue]]
speaker = "unk"
original = "ディマイズブレイカー！"
translation = "디마이즈 브레이커!"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「チキチー！！」"
translation = "「치키치!!」"

[[dialogue]]
speaker = "unk"
original = "チキンモンスターがアツアツの油で反撃してくる。咄嗟に回避するが、香ばしい匂いが鼻をかすめた。"
translation = "치킨 몬스터가 뜨끈뜨끈한 기름으로 반격해 온다. 재빨리 회피하지만 고소한 냄새가 코끝을 스쳤다."

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「チキチッチー！」"
translation = "「치키치치!」"

[[dialogue]]
speaker = "unk"
original = "作戦通り、モンスターは俺に狙いを定めたようだ。"
translation = "작전대로 몬스터는 나에게 타겟을 정한 모양이다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「うおありゃあぁっ！\u3000ストームスピアフィッシャーっ！！」"
translation = "「우오오랴앗! 스톰 스피어 피셔!!」"

[[dialogue]]
speaker = "unk"
original = "チキンの群れの真下から、竜巻をまとった銛が飛び出し、敵を一掃。その数だけチキンが降ってくる。"
translation = "치킨 무리의 바로 밑에서 회오리를 두른 작살이 튀어나와 적을 소탕. 그 수만큼 치킨이 쏟아져 내린다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「獲ったどー！」"
translation = "「잡았다!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「すごい！\u3000銛をたくさん出して、落ちてくるフライドチキンを全部くし刺しにしちゃった……。シルヴィにこんな器用なこと出来たんだね」"
translation = "「대단해! 작살을 잔뜩 내보내서 떨어지는 프라이드치킨을 전부 꼬챙이로 꿰버렸어……. 실비에게 이런 정교한 일이 가능했구나」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ふふっ、チキンのためなら不可能はないよ！」"
translation = "「후후, 치킨을 위해서라면 불가능은 없어!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「その器用さを普段から発揮してほしかったなー。まぁ、これでとりあえずは収まったかな。会長さんも怪我はない？」"
translation = "「그 능숙함을 평소에도 발휘해 줬으면 좋겠는데. 뭐, 이걸로 일단락된 걸까. 회장 씨도 다친 데는 없어?」"

[[dialogue]]
speaker = "unk"
original = "周囲を見渡しながら頷く。まだ現実に理解が追い付いていないけど。"
translation = "주위를 둘러보며 고개를 끄덕인다. 아직 현실을 이해하기가 벅차지만."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ならよかった。いったい、あれはなんだったんだろう……シルヴィはどう思う？」"
translation = "「그럼 다행이야. 대체 저건 뭐였을까…… 실비는 어떻게 생각해?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「もぐもぐもぐもぐもぐ……え、美味しいよ？」"
translation = "「우걱우걱우걱우걱…… 에, 맛있는데?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「また食べてる！？\u3000この状況で、よく食べる気になれるね……」"
translation = "「또 먹고 있어!? 이 상황에서 용케 먹을 기분이 드네……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「フライドチキンはいつどこで食べても美味しいからね！\u3000……あ、誰か来る」"
translation = "「프라이드치킨은 언제 어디서 먹어도 맛있으니까! ……아, 누가 온다」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「やあ、諸君。迷惑をかけてしまったようダナ。特に会長は呼び出しに応じてくれて感謝ダ」"
translation = "「여어, 여러분. 폐를 끼친 것 같구아. 특히 회장은 부름에 응해줘서 고맙다아」"

[[dialogue]]
speaker = "unk"
original = "リゾート結界に俺を呼んだのはアニマ先輩だった。トラブルとは、やはりチキンのことだろう。"
translation = "리조트 결계로 나를 부른 것은 아니마 선배였다. 트러블이란 역시 치킨에 관한 것이리라."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「アニマっちだ。やっほー」"
translation = "「아니마치다. 안녕」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「さっき、フライドチキンのモンスターと戦ったんだけど、アニマさんは何か知ってる？」"
translation = "「방금 프라이드치킨 몬스터와 싸웠는데, 아니마 씨는 뭔가 알고 있어?」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「ウム。アニマが来たのも、まさしくそれに関することダ。では話そう。チキンの真実を──」"
translation = "「으음. 아니마가 온 것도 바로 그에 관한 일이다아. 그럼 이야기하마. 치킨의 진실을──」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「そもそも、この事態はフライドチキンの需要拡大に端を発するのダ」"
translation = "「애초에 이 사태는 프라이드치킨의 수요 확대에서 비롯되었다아」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「フライドチキンとピリ辛チキンと旨塩チキンください！」"
translation = "「프라이드치킨이랑 매콤 치킨이랑 짭짤 치킨 주세요!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はーい、ただいま！」"
translation = "「네에, 금방 나갑니다!」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「すみません。栄養マシマシチキン、ひとついただけますか？」"
translation = "「죄송합니다. 영양 듬뿍 치킨 하나 받을 수 있을까요?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はい、ありがとうございます！」"
translation = "「네, 감사합니다!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「黒ごまガーリックチキンお願いします！」"
translation = "「흑임자 갈릭 치킨 부탁해요!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「かしこまりました」"
translation = "「알겠습니다」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「フライドチキンとブラックペッパーチキンと竜田揚げ、１ダースずつください」"
translation = "「프라이드치킨이랑 블랙 페퍼 치킨이랑 타츠타아게, 1다스씩 주세요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はい、フライドチキンとブラックペッパーと、竜田揚げ、お１つずつ……えぇ！？\u3000１ダースずつですか！？」"
translation = "「네, 프라이드치킨이랑 블랙 페퍼랑 타츠타아게 한 개씩…… 에엣!? 1다스씩인가요!?」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「このように、チキン系の商品は日に日に需要が高まっていてナ。トリュファイナも手伝ってくれているが、手が回っていないのダ」"
translation = "「이렇듯 치킨 계열 상품은 나날이 수요가 높아지고 있어서어. 트리파이나도 돕고 있지만 손이 모자란 상태다아」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「レイラは出禁にしてくれていいよ」"
translation = "「레이라는 출입 금지 시켜도 돼」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「そこで、アニマはフライドチキンマシンを開発しタ。星力や魔力で稼動し、今までのフライヤーより高速でチキンを揚げられる優れものダ」"
translation = "「그래서 아니마는 프라이드치킨 머신을 개발했다아. 성력이나 마력으로 가동하며 지금까지의 튀김기보다 고속으로 치킨을 튀길 수 있는 뛰어난 물건이다아」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「さすが天才アニマっち！\u3000でも、なんとなく流れが分かったよ！」"
translation = "「역시 천재 아니마치! 하지만 왠지 흐름을 알 것 같아!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「これがフライドチキンマシンなのですね、アニマ様」"
translation = "「이게 프라이드치킨 머신이군요, 아니마 님」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「ウム。今まですまなかったナ。これで少しは楽になるはずダ」"
translation = "「으음. 지금까지 미안했구아. 이걸로 조금은 편해질 거다아」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「いえ、謝らないでください。私もこのお店が好きでお手伝いしているのですから。でも、お客様をお待たせしなくて済むのはいいことです」"
translation = "「아뇨, 사과하지 마세요. 저도 이 가게가 좋아서 돕고 있는 거니까요. 그래도 손님들을 기다리게 하지 않아도 되는 건 좋은 일이네요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「では、チキンの種をセットして、魔力を込めて……スイッチオン！」"
translation = "「그럼 치킨 재료를 세팅하고 마력을 담아서…… 스위치 온!」"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「チキチキー！！」"
translation = "「치키치키!!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「出てきたチキンがモンスターに！？」"
translation = "「나온 치킨이 몬스터로!?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ディアイルミナーレ！」"
translation = "「디아 일루미나레!」"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「チキチキチー！！」"
translation = "「치키치키치!!」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「くっ、モンスターを壁にしてマシンが逃げてしまっタ。追うゾ、トリュファイナ」"
translation = "「큭, 몬스터를 벽으로 삼아 머신이 도망쳐 버렸다아. 쫓자, 트리파이나」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はい！」"
translation = "「네!」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「セットしたチキンの数には限りがアル。このまま追い続ければいつかは捕まえられるハズ…………ム、しまっタ」"
translation = "「세팅한 치킨의 수에는 한계가 있다아. 이대로 계속 쫓으면 언젠가는 잡을 수 있을 터………… 음, 이런」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「無尽蔵にチキンを補給できる場所がこの学園にはアル」"
translation = "「무궁무진하게 치킨을 보급할 수 있는 장소가 이 학원에는 있다아」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「アニマ様、それは……」"
translation = "「아니마 님, 설마 그건……」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「リゾート結界ダ！」"
translation = "「리조트 결계다아!」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「というワケで、フライドチキンマシンはリゾート結界に侵入してしまっタ」"
translation = "「그리하여 프라이드치킨 머신은 리조트 결계에 침입하고 말았다아」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「みんなも知ってイルとは思うガ、リゾートの結界のリソースは、夏を楽しむ心から生まれる夏パワー。結界で提供される料理も夏パワーによって生み出されている」"
translation = "「여러분도 알고 있겠지만 리조트 결계의 리소스는 여름을 즐기는 마음에서 생겨나는 여름 파워. 결계에서 제공되는 요리도 여름 파워에 의해 만들어지고 있다아」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「マシンは原料となるチキンと、動力となるエネルギーの両方をリゾート結界から得ているようダ。このままでは、リゾート結界にチキンモンスターが溢れてしまウ」"
translation = "「머신은 원료가 되는 치킨과 동력이 되는 에너지 양쪽을 리조트 결계로부터 얻고 있는 모양이다아. 이대로라면 리조트 결계에 치킨 몬스터가 넘쳐나고 말 거다아」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「そして夏パワーが尽きれば、結界は消え、チキンモンスターは外に解き放たれるだろウ」"
translation = "「그리고 여름 파워가 다하면 결계는 사라지고 치킨 몬스터는 밖으로 풀려나겠지이」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「その前に、マシンを発見して破壊しないとね」"
translation = "「그전에 머신을 발견해서 파괴해야겠네」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「よし、あたしたちに任せて！\u3000水着戦闘服の出番だよ！」"
translation = "「좋아, 우리에게 맡겨줘! 수영복 전투복이 활약할 차례야!」"

[[dialogue]]
speaker = "unk"
original = "こうして、俺と先輩たちでフライドチキンマシンを捜索することになった。"
translation = "이렇게 해서 나와 선배들은 프라이드치킨 머신을 수색하게 되었다."

