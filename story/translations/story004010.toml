[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「……そういうことだったのね」"
translation = "「……그런 거였구나」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「合点がいきました。シュティレが特別恨まれていたのは……」"
translation = "「납득이 갔습니다. 슈틸레가 특별히 원망받았던 것은……」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「あの悪の親玉、アニマの弟子だから……！」"
translation = "「저 악의 두목, 아니마의 제자니까……！」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「私と蘭美様を、無事に帰してやると言ったのも……」"
translation = "「나와 라비 님을 무사히 돌려보내 주겠다고 한 것도……」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「メイドのウサギは、お兄ちゃんをお世話してたの。光の魔女も、疲れたお兄ちゃんを魔法で癒やしてたの。だから、敵じゃないの……」"
translation = "「메이드 토끼는 오빠를 돌봐주고 있었던 거야. 빛의 마녀도 지친 오빠를 마법으로 치유해 주고 있었던 거야. 그러니까 적이 아닌 거야……」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「……ごめんなさい、お兄ちゃん。シスは、本当は……お兄ちゃんの妹じゃないの……」"
translation = "「……미안해요, 오빠. 시스는 사실은…… 오빠의 여동생이 아닌 거야……」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「それどころか、ヒトでもないの。『支配』の力で、悪いこともしたの……」"
translation = "「그뿐만 아니라 사람도 아닌 거야. 『지배』의 힘으로 나쁜 짓도 한 거야……」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「ごめんなさいなの……も、もう──クロトさんの、前には、現れないから……」"
translation = "「미안한 거야…… 이, 이제──쿠로토 씨의 앞에는 나타나지 않을 테니까……」"

[[dialogue]]
speaker = "unk"
original = "いつでもおいで、シス"
translation = "언제든 오렴, 시스."

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「──────えっ？」"
translation = "「──────에?」"

[[dialogue]]
speaker = "unk"
original = "妹のやったことだ、許してあげないとね"
translation = "여동생이 한 짓인걸, 용서해 줘야지."

[[dialogue]]
speaker = "unk"
original = "誘拐は確かに悪いことだけど……"
translation = "유괴는 분명 나쁜 짓이지만……"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「い、いい……の……？」"
translation = "「괜, 괜찮은…… 거야……？」"

[[dialogue]]
speaker = "unk"
original = "確かにシエスタの取った行動は、間違っていた。"
translation = "분명 시에스타가 취한 행동은 잘못되어 있었다."

[[dialogue]]
speaker = "unk"
original = "けれど──この遊園地に囚われている間、俺が星徒会長の激務から解放されていたのも事実。"
translation = "하지만──이 유원지에 갇혀 있는 동안 내가 성도회장의 격무에서 해방되어 있었던 것도 사실."

[[dialogue]]
speaker = "unk"
original = "そのドタバタな感じも、嫌じゃないんだ"
translation = "그 우왕좌왕한 느낌도 싫지는 않거든."

[[dialogue]]
speaker = "unk"
original = "確かに大変な日々だけど……"
translation = "확실히 힘든 나날이었지만……"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「…………うん」"
translation = "「…………응」"

[[dialogue]]
speaker = "unk"
original = "今度は普通に会いに来なよ。歓迎するから"
translation = "다음엔 평범하게 놀러 오렴. 환영할 테니까."

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「……お、お兄ちゃん」"
translation = "「……오, 오빠」"

[[dialogue]]
speaker = "unk"
original = "お兄ちゃん、嬉しいよ"
translation = "오빠는 기뻐."

[[dialogue]]
speaker = "unk"
original = "心配してくれてありがとう、シス"
translation = "걱정해 줘서 고마워, 시스."

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「う……うぅぅうう……！！」"
translation = "「우…… 우으으으……！！」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「ありがとうなの……お兄ちゃん……」"
translation = "「고마운 거야…… 오빠……」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フフフフ！\u3000これにて一件落着ですねぇ！！」"
translation = "「후후후후! 이걸로 사건 해결이네요!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……大変な借りができてしまいましたね、ダッチに」"
translation = "「……지독한 빚을 지고 말았군요, 더치에게」"

[[dialogue]]
speaker = "unk"
original = "何てことだ……"
translation = "이 무슨 일인가……"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ヌフフ！\u3000無事に緋宮クロト様は救出でき、シスも無力化できた……！\u3000私の邪魔立てをする相手はもはやいない！！」"
translation = "「누후후! 무사히 히노미야 쿠로토 님을 구출할 수 있었고, 시스도 무력화했다……! 내 방해를 할 상대는 이제 없다!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ま、まさかっ！？」"
translation = "「설, 설마!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「欲を言えば今すぐにでも、女体化バニークロト様をお持ち帰り。といきたいですが……流石に今は消耗も激しい。またの機会といたしましょう！」"
translation = "「욕심을 부리자면 지금 당장에라도 여체화 바니 쿠로토 님을 테이크아웃, 하고 싶습니다만…… 역시 지금은 소모가 심하군요. 다음 기회로 미루지요!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ほっ……」"
translation = "「후우……」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「それでは皆様！\u3000また会う日までッ！！」"
translation = "「그럼 여러분! 다시 만날 날까지!!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「おっと──忘れておりました。お別れの前に、今回の功労者である私を労ってはいただけませんか、緋宮クロト様？」"
translation = "「앗차──잊고 있었군요. 헤어지기 전에 이번 공로자인 저를 위로해 주지 않으시겠습니까, 히노미야 쿠로토 님?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「『ダッチ様、ありがとうぴょん♪』なぁんて言っていただけると嬉しいのですが！？」"
translation = "「『더치 님, 고마워용♪』 같은 소리를 해주시면 기쁘겠습니다만!?」"

[[dialogue]]
speaker = "unk"
original = "言うわけないだろ！\u3000この野郎！！"
translation = "할 리가 없잖아! 이 새끼가!!"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フハハハハ！！\u3000では、次の楽しみに取っておくとしましょうッ！」"
translation = "「하하하하!! 그럼 다음 즐거움으로 남겨두기로 하지요!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「さらばです、子ウサギの皆様！\u3000そしてシス！！\u3000また会う日まで────！！」"
translation = "「작별입니다, 새끼 토끼 여러분! 그리고 시스!! 다시 만날 날까지────!!」"

[[dialogue]]
speaker = "unk"
original = "そうしてダッチは、姿を消して──"
translation = "그렇게 더치는 모습을 감추고──"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……！\u3000シエスタの改造アステラが、解除された？」"
translation = "「……! 시에스타의 개조 아스테라가 해제되었다?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「そのようですね。ああ、平和な日常の光景です！」"
translation = "「그런 것 같네요. 아아, 평화로운 일상의 풍경입니다!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴょんっ！？\u3000は、はやく変身を解かなきゃ！\u3000遊園地のお客に見られちゃうぴょんっ！！」"
translation = "「뿅!? 으, 얼른 변신을 풀어야 해! 유원지 손님들한테 걸릴라 뿅!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「む──会長の姿が……！！」"
translation = "「음──회장님의 모습이……!!」"

[[dialogue]]
speaker = "unk"
original = "あれ──俺、男に戻ってる！？"
translation = "어라──나, 남자로 돌아왔어!?"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「……ダッチの好きにはさせないの。元の姿に戻しておいてあげたの、お兄ちゃん」"
translation = "「……더치 마음대로 하게 두지 않는 거야. 원래 모습으로 돌아오게 해둔 거야, 오빠」"

[[dialogue]]
speaker = "unk"
original = "シス！？\u3000あれ、どこに……！？"
translation = "시스!? 어라, 어디에……!?"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「お兄ちゃんが許してくれたのは嬉しいの。でも……悪いことしたのは、事実なの」"
translation = "「오빠가 용서해 준 것은 기쁜 거야. 하지만…… 나쁜 짓을 한 것은 사실인 거야」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「しばらく、ちゃんと反省するの。だから……」"
translation = "「당분간 제대로 반성하는 거야. 그러니까……」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「……ばいばいなの、お兄ちゃん」"
translation = "「……바이바이인 거야, 오빠」"

