[[dialogue]]
speaker = "unk"
original = "第１話,朝比奈コハルコは泳げない,P"
translation = "제1화, 아사히나 코하루코는 헤엄치지 못해, P"

[[dialogue]]
speaker = "unk"
original = "コハルコは泳げない……というより、運動全般が苦手だ。"
translation = "코하루코는 헤엄치지 못한다……라기보다, 운동 전반에 서투르다."

[[dialogue]]
speaker = "unk"
original = "それでも泳げないのだけでもなんとかしようと、今日はリゾート結界のプライベートビーチを借りて練習中だ。"
translation = "그래도 맥주병인 것만이라도 어떻게든 고쳐보려고, 오늘은 리조트 결계의 프라이빗 비치를 빌려 연습 중이다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「会長さん、手を放さないでね。絶対だよ！」"
translation = "「회장님, 손 놓으면 안 돼. 절대야!」"

[[dialogue]]
speaker = "unk"
original = "コハルコが足を力いっぱい動かすと、水しぶきが派手に上がる。"
translation = "코하루코가 발을 힘껏 움직이자, 물보라가 화려하게 튀어 오른다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「んぷっ……もっと手を引いて……体、沈んじゃ……」"
translation = "「음푸…… 좀 더 손을 끌어줘…… 몸이, 가라앉아……」"

[[dialogue]]
speaker = "unk"
original = "だけどコハルコのバタ足は全く推進力を生んでおらず、俺が手を引いているから進んでいるだけだ。"
translation = "하지만 코하루코의 발차기는 전혀 추진력을 만들어내지 못하고 있고, 내가 손을 끌어주고 있기 때문에 나아가고 있을 뿐이다."

[[dialogue]]
speaker = "unk"
original = "そうこうしているうちにコハルコの体は沈んでいく──といっても、足がつく浅瀬だから問題ないのだが。"
translation = "그러는 사이에 코하루코의 몸은 가라앉아 간다──라고 해도, 발이 닿는 얕은 곳이라 문제는 없지만."

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「じー……」"
translation = "「지이……」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「なんでレイラがいるの？\u3000会長さんと２人で練習のつもりだったんだけど」"
translation = "「왜 레이라가 있는 거야? 회장님이랑 둘이서 연습할 생각이었는데」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「……え、会長さんがここに来る途中で出くわしちゃった？\u3000だからってついてこなくていいのに……」"
translation = "「……에, 회장님이 여기 오는 길에 마주쳐 버렸다고? 그렇다고 따라오지 않아도 되는데……」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「２人っきりだとイチャイチャして練習にならないでしょう？」"
translation = "「둘이서만 있으면 꽁냥거리느라 연습이 안 되잖아요?」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「泳ぐ練習を名目にイチャつくなんて、コハルコさんがやってるゲームでも定番のシチュエーションじゃないですか」"
translation = "「수영 연습을 명목으로 염장 지르는 건, 코하루코 씨가 하는 게임에서도 정석적인 시츄에이션 아니냐고요」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ぐぬぬ……いろんなシーンが脳内を駆け巡って反論できない……」"
translation = "「구누누…… 여러 장면이 뇌내를 스쳐 지나가서 반론할 수 없어……」"

[[dialogue]]
speaker = "unk"
original = "水着のコハルコとイチャイチャしたかったのは確かだ。コハルコも同じ気持ちだったようで、２人そろって図星を突かれてしまった。"
translation = "수영복 차림의 코하루코와 꽁냥거리고 싶었던 건 확실하다. 코하루코도 같은 마음이었던 모양인지, 둘이 나란히 정곡을 찔리고 말았다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「そういうレイラは泳げるの？\u3000あんまり体を動かしてるイメージないけど」"
translation = "「그나저나 레이라는 헤엄칠 줄 알아? 별로 몸을 움직이는 이미지는 없는데」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「あのー、自分が運動不足ハッカーだからって、他のハッカーもそうだと思わない方がいいですよ？」"
translation = "「저기요ー, 자기가 운동 부족 해커라고 해서, 다른 해커도 그럴 거라고 생각하지 않는 게 좋아요?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「運動不足は余計だよ！」"
translation = "「운동 부족은 사족이야!」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「……コハルコさん、少しムチりました？\u3000心なしか肉感的に見える気が……」"
translation = "「……코하루코 씨, 조금 통통해졌나요? 기분 탓인지 육감적으로 보이는 느낌이……」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「っ！\u3000この！」"
translation = "「윽! 이익!」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「ふんっ」"
translation = "「흥」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「サーシャ直伝のアームロックが効かないなんて！？」"
translation = "「사샤 직전의 암록이 듣지 않다니!?」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「関節の極めがなってないんですよ。ナマクラもいいところです」"
translation = "「관절 꺾기가 제대로 안 됐거든요. 무디기 짝이 없네요」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「コハルコさん、万年運動不足のもやしっ子なんですから。肉体言語はコンパイルエラーです」"
translation = "「코하루코 씨, 만년 운동 부족인 약골이니까요. 육체 언어는 컴파일 에러입니다」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「あ、もやしはもやしでも太い方のもやしですが」"
translation = "「아, 콩나물은 콩나물인데 굵은 쪽 콩나물이지만요」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「誰が大豆もやしだ、誰が！\u3000ていうか太くないって！」"
translation = "「누가 콩나물 대가리라는 거야, 누가! 그보다 안 굵거든!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「水着で露出が多いからちょっとそう見えるだけ！」"
translation = "「수영복이라 노출이 많으니까 조금 그렇게 보일 뿐이야!」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「魔王さんはどう思います？」"
translation = "「마왕님은 어떻게 생각하세요?」"

[[dialogue]]
speaker = "unk"
original = "ノーコメントで……"
translation = "노 코멘트로……"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ちょっと！\u3000そこはしっかり否定してよ！」"
translation = "「잠깐! 거기선 제대로 부정해달라고!」"

[[dialogue]]
speaker = "unk"
original = "元からコハルコは脱いだらすごい……かはともかく、水着のコハルコの姿が肉感的なのは否定できない。むしろ全力で肯定したい。"
translation = "원래부터 코하루코는 벗으면 굉장한……지는 어찌 됐든, 수영복 차림의 코하루코의 모습이 육감적인 것은 부정할 수 없다. 오히려 전력으로 긍정하고 싶다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「え？\u3000ムチムチした女の子も魅力的……？\u3000会長さん、上手いこと言って誤魔化そうとしてない？」"
translation = "「에? 포동포동한 여자애도 매력적……? 회장님, 말을 잘 지어내서 얼버무리려는 거 아니야?」"

[[dialogue]]
speaker = "unk"
original = "俺は今のコハルコが好きだから"
translation = "나는 지금의 코하루코가 좋으니까"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ふ、ふぅん。ならいいんだけど……」"
translation = "「흐, 흐응. 그렇다면 다행이지만……」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「ヒューヒュー、お熱いですね！」"
translation = "「휘익 휘익, 뜨거우시네요!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ドルフィンドローン、ハイドロジェット逆噴射！」"
translation = "「돌핀 드론, 하이드로 제트 역분사!」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「あばばばばばば！！」"
translation = "「아바바바바바바!!」"

[[dialogue]]
speaker = "unk"
original = "水を吸い込んで加速するドルフィンドローンは、逆噴射すれば水の大砲になる。"
translation = "물을 빨아들여 가속하는 돌핀 드론은, 역분사하면 물대포가 된다."

[[dialogue]]
speaker = "unk"
original = "星力のこもっていないただの水なのでダメージはないはずだが、それでも勢いは凄まじい。"
translation = "성력이 담기지 않은 그냥 물이라 데미지는 없을 테지만, 그래도 기세는 무시무시하다."

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「ぷひゃー、びっくりした。私の顔、ちゃんついてます？」"
translation = "「푸햐ー, 깜짝이야. 제 얼굴, 제대로 붙어있나요?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「可愛いお目めもお鼻もちゃんとついてるよ。ブラックホールの星力で守られてるレイラにただの水流なんか効かないでしょ」"
translation = "「귀여운 눈이랑 코도 제대로 붙어있어. 블랙홀의 성력으로 보호받는 레이라에게 그냥 수류 따위 통하지 않잖아」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「どうしたの、私のドルフィンドローンじっと見て」"
translation = "「왜 그래, 내 돌핀 드론을 빤히 보고」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「イルカ\u3000消す方法\u3000検索」"
translation = "「돌고래 지우는 법 검색」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「こらー！\u3000私のイルカちゃん消そうとすなー！」"
translation = "「코라ー! 내 돌고래짱 지우려고 하지 마ー!」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「いや、だって……宙に浮くイルカを消そうとするのは人類のサガじゃないですか。イルカを消そうとしなかった人だけが私に石を投げてください」"
translation = "「아니, 그게…… 공중에 뜬 돌고래를 지우려고 하는 건 인류의 사가잖아요. 돌고래를 지우려고 하지 않은 사람만 저에게 돌을 던지세요」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「じゃあ遠慮なく。ドルフィンドローン、採集サンプル発射！」"
translation = "「그럼 사양 않고. 돌핀 드론, 채집 샘플 발사!」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「本当に石が飛んできたー！？\u3000ぐはっ！」"
translation = "「진짜로 돌이 날아왔어ー!? 구학!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ドルフィンドローンは水中で拾ったものをサンプルとして保管できるからね。逆噴射と合わせればこれくらいできるよ」"
translation = "「돌핀 드론은 수중에서 주운 것을 샘플로서 보관할 수 있으니까. 역분사와 합치면 이 정도는 할 수 있다고」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「うぅ……前が見えない…………」"
translation = "「우으…… 앞이 안 보여…………」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「さて、と。レイラはほっといて練習しよ」"
translation = "「자, 그럼. 레이라는 내버려 두고 연습하자」"

[[dialogue]]
speaker = "unk"
original = "砂浜にめり込むレイラを横目に、俺たちは練習を再開した──"
translation = "모래사장에 처박힌 레이라를 곁눈질하며, 우리들은 연습을 재개했다──"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ヤダ～！\u3000水に顔つけたくない！\u3000知ってる？\u3000水の中って息できないんだよ！\u3000息できないなんて怖い！」"
translation = "「싫어～! 물에 얼굴 담그기 싫어! 알고 있어? 물속에선 숨을 못 쉰다고! 숨을 못 쉬다니 무서워!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「息ができないと溺れちゃうよ～！！」"
translation = "「숨을 못 쉬면 빠져 죽는단 말이야～!!」"

[[dialogue]]
speaker = "unk"
original = "いくら時間をかけても、頑なに水を拒否するコハルコであった。"
translation = "아무리 시간을 들여도, 완고하게 물을 거부하는 코하루코였다."

[[dialogue]]
speaker = "unk"
original = "おかげで顔を出す泳ぎ方しか練習できない。それすら１ミリも上達していないけど。"
translation = "덕분에 얼굴을 내밀고 하는 수영법밖에 연습할 수 없다. 그것조차 1밀리도 나아지지 않았지만."

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「ＺＺＺ…………」"
translation = "「쿨쿨…………」"

[[dialogue]]
speaker = "unk"
original = "ちなみにレイラは飽きて寝ている。"
translation = "참고로 레이라는 질려서 자고 있다."

[[dialogue]]
speaker = "unk"
original = "コハルコ、一緒に潜ってみない？"
translation = "코하루코, 같이 잠겨보지 않을래?"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「でも水の中、怖いし……」"
translation = "「하지만 물속, 무섭고……」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「……一緒なら大丈夫？\u3000絶対に手を離したりしない？」"
translation = "「……함께라면 괜찮아? 절대로 손 놓지 않을 거야?」"

[[dialogue]]
speaker = "unk"
original = "強くうなずく。コハルコは絶対に俺が守る。"
translation = "강하게 고개를 끄덕인다. 코하루코는 절대로 내가 지킨다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うん、じゃあ…………少しだけ、少しだけだよ？」"
translation = "「응, 그럼………… 아주 조금, 아주 조금뿐이야?」"

[[dialogue]]
speaker = "unk"
original = "コハルコがぎゅっと強く手を握る。幼い子どもみたいで可愛い。"
translation = "코하루코가 꽉 강하게 손을 잡는다. 어린아이 같아서 귀엽다."

[[dialogue]]
speaker = "unk"
original = "せぇの！"
translation = "하나, 둘!"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「きゃっ──」"
translation = "「꺄앗──」"

[[dialogue]]
speaker = "unk"
original = "数秒だけその場に潜って──"
translation = "수 초 동안만 그 자리에 잠겼다가──"

[[dialogue]]
speaker = "unk"
original = "すぐに立ち上がる。その間もコハルコの手は握ったままだ。"
translation = "곧바로 일어선다. 그동안에도 코하루코의 손은 잡은 채다."

[[dialogue]]
speaker = "unk"
original = "海の中、どうだった？"
translation = "바다 속, 어땠어?"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「目をつむってたから、何も見えなかったけど……私、海に潜れたんだね……」"
translation = "「눈을 감고 있어서 아무것도 안 보였지만…… 나, 바다에 잠길 수 있었네……」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「君の言ったとおりだったよ。一緒だから怖くなかった！」"
translation = "「네 말대로였어. 함께라서 무섭지 않았어!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ふふ、ふふふ……海、潜っちゃった……ふふふ」"
translation = "「후후, 후후후…… 바다, 잠겨버렸어…… 후후후」"

[[dialogue]]
speaker = "unk"
original = "嬉しそうに微笑むコハルコ。どんなに小さい一歩でも、確かな前進には違いなかった。"
translation = "기쁜 듯이 미소 짓는 코하루코. 아무리 작은 한 걸음이라도, 확실한 전진임에는 틀림없었다."

