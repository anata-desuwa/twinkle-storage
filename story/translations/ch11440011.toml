[[dialogue]]
speaker = "unk"
original = "第１話,新人メイドＶＳ魔王のしもべ,P"
translation = "제1화, 신입 메이드 VS 마왕의 하수인, P"

[[dialogue]]
speaker = "unk"
original = "九浄家メイド隊に『新人』が加わってから、しばらく経ったある日のこと。"
translation = "쿠죠가 메이드대에 『신입』이 들어오고 나서, 얼마간 지난 어느 날의 일."

[[dialogue]]
speaker = "unk"
original = "俺はこの前出現した狼型モンスターの記録を確認しようと、大聖堂カフェテリアにある『任務管轄係』を訪ねていた。"
translation = "나는 얼마 전에 출현한 늑대형 몬스터의 기록을 확인하고자, 대성당 카페테리아에 있는 『임무관할계』를 방문하고 있었다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「あっ、魔王様～～っ！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ♪\u3000こんにちはであります！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "メイドの仕事中か？"
translation = "메이드 일하는 중이야?"

[[dialogue]]
speaker = "unk"
original = "狛里、こんにちは"
translation = "코마리, 안녕"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ♪\u3000ヨミ先輩と一緒に『任務管轄係』のお仕事中なのです！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ぴしっと敬礼してみせる彼女こそ、先日、九浄家メイド隊へ加わった新人メイドの『<ruby>狛里<rt>こまり</rt></ruby>』。"
translation = "절도 있게 경례를 해 보이는 그녀야말로, 얼마 전, 쿠죠가 메이드대에 들어온 신입 메이드 『<ruby>코마리<rt>코마리</rt></ruby>』."

[[dialogue]]
speaker = "unk"
original = "流星学園附属校へ転入してきた３年生で、現在はヨミの部下として働いている。"
translation = "유성학원 부속교로 전학 온 3학년으로, 현재는 요미의 부하로서 일하고 있다."

[[dialogue]]
speaker = "unk"
original = "仕事にはもう慣れた？"
translation = "일에 이제 익숙해졌어?"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ♪\u3000ヨミ先輩がすっごく親身に教えてくれるので、とっても感謝なのです♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ふと、その時。"
translation = "문득, 그때."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「じ～っ……」"
translation = "「빤~~히……」"

[[dialogue]]
speaker = "unk"
original = "カフェテリアのテーブルの影に隠れて、こちらの様子を伺っている視線に気づく。"
translation = "카페테리아 테이블 그늘에 숨어, 이쪽을 살피는 시선을 눈치채다."

[[dialogue]]
speaker = "unk"
original = "カティア、どうしたんだ？"
translation = "카티아, 무슨 일이야?"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「……私と同じ犬系獣人の魔族で、魔王様と仲良くしている転入生のことを観察していたんですワン！」"
translation = "「……나와 같은 개과 수인 마족이면서, 마왕님과 사이좋게 지내는 전학생을 관찰하고 있었던 거다 멍!」"

[[dialogue]]
speaker = "unk"
original = "そう言って、ひょこっと顔を出したのは、新星学園１年生の『カティア・セルベラス』であった。"
translation = "그렇게 말하며, 힐끔 얼굴을 내민 것은, 신성학원 1학년 『카티아 세르베라스』였다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「最近、みんな狛里って子の話ばっかりしてるワン！」"
translation = "「요즘, 다들 코마리라는 애 이야기만 하는 거다 멍!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「だから、どんな子なのか気になったんだガオ！」"
translation = "「그래서, 어떤 애인지 궁금했던 거다 크아앙!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「初めましてなのです！\u3000九浄家メイド所属、附属校３年生の狛里なのです！」"
translation = "「처음 뵙는 것입니다! 쿠죠가 메이드 소속, 부속교 3학년 코마리인 것입니다!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私は魔王様の第一のしもべ、新星学園１年生のカティアだワン！」"
translation = "「나는 마왕님의 첫 번째 하수인, 신성학원 1학년 카티아다 멍!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「カティア先輩！！」"
translation = "「카티아 선배!!」"

[[dialogue]]
speaker = "unk"
original = "狛里の耳がぴんと立つ。"
translation = "코마리의 귀가 쫑긋 선다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「なるほどなのです！」"
translation = "「그렇군요인 것입니다!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「な、何だガオ？」"
translation = "「므, 뭐야 크아앙?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「同じ犬系獣人の魔族さんなのですね！」"
translation = "「같은 개과 수인 마족분이시군요!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「そ、そうだけど……？」"
translation = "「그, 그렇지만……?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「実は狛里、同じ獣人さんの匂いって気になっちゃうのです！」"
translation = "「사실 코마리, 같은 수인분의 냄새는 신경 쓰여 버리는 것입니다!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふぇ？？」"
translation = "「훠어??」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「失礼するであります！」"
translation = "「실례하는 말입니다!」"

[[dialogue]]
speaker = "unk"
original = "狛里はずいっと顔を近づける。"
translation = "코마리는 쑥 얼굴을 다가온다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「わわっ！？\u3000近い近い近い！？」"
translation = "「와와!? 가까워 가까워 가까워!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「くんくん♪」"
translation = "「킁킁♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「――カティア先輩、お花みたいにいい匂いがするのです！」"
translation = "「――카티아 선배, 꽃처럼 좋은 냄새가 나는 것입니다!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ひゃぁあぁ～！？\u3000本当にどこの匂いを嗅いでるの！？」"
translation = "「히야아아~!? 진짜 어디 냄새를 맡고 있는 거야!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「同じ獣人さんだったので、つい気になっちゃったのです♪」"
translation = "「같은 수인분이셔서, 그만 신경 쓰여 버린 것입니다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ちなみに、狛里は魔王様の匂いも好きなのです♪」"
translation = "「참고로, 코마리는 마왕님의 냄새도 좋아하는 것입니다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「くんくん、くんくんくん♪」"
translation = "「킁킁, 킁킁킁♪」"

[[dialogue]]
speaker = "unk"
original = "匂い嗅がれるのは恥ずかしいって！"
translation = "냄새 맡아대는 건 부끄럽다니까!"

[[dialogue]]
speaker = "unk"
original = "こ、狛里……人前で全身密着して"
translation = "코, 코마리…… 남들 앞에서 전신 밀착해서"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ままま、魔王様相手に何やってるんですかぁ！？\u3000そんなことして恥ずかしくないワン！？」"
translation = "「마마마, 마왕님 상대로 무슨 짓을 하는 건가요!? 그런 짓을 하고 안 부끄러운 거다 멍!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里は匂いを嗅ぐのが大好きなので、ついなのです♪\u3000えへへっ♪」"
translation = ""

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「理由になってないガオ！？」"
translation = "「이유가 안 되잖아 크아앙!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「カティア先輩！」"
translation = "「카티아 선배!」"

[[dialogue]]
speaker = "unk"
original = "そう言うなり、狛里はカティアの両手をぎゅっと握る。"
translation = "그렇게 말하자마자, 코마리는 카티아의 양손을 꽉 쥔다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里、同じ獣人の魔族として、先輩と仲良くなりたいであります！」"
translation = "「코마리, 같은 수인 마족으로서, 선배와 사이좋아지고 싶은 말입니다!」"

[[dialogue]]
speaker = "unk"
original = "そう言って、狛里は繋いだ手をぶんぶんと上下に振る。"
translation = "그렇게 말하고, 코마리는 맞잡은 손을 세차게 위아래로 흔든다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ちょっ。この子の距離感どうなってるんですか、魔王様ぁ！？」"
translation = "「잠깐. 이 아이 거리감 어떻게 된 건가요, 마왕님아!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「くぅ～ん、ダメでありますか……？」"
translation = "「킁~응, 안 되는 말입니까……?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「うぐっ……！\u3000あまりにも純粋な瞳！」"
translation = "「으윽……! 너무나도 순수한 눈동자!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「でも！\u3000そう簡単に仲良くなるわけにはいかないワン！\u3000何故なら――」"
translation = "「하지만! 그렇게 쉽게 사이좋아질 수는 없는 거다 멍! 왜냐하면――」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私と『キャラ被り』しているからっ！！」"
translation = "「나와 『캐릭터 겹침』이 되어있으니까!!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「キャラ被り……？」"
translation = "「캐릭터 겹침……?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「しかも、私はまだプリマステラになれていないのに、附属生で、転入したばかりですぐになってるし！」"
translation = "「게다가, 나는 아직 프리마스텔라가 되지 못했는데, 부속생이면서, 전학 오자마자 바로 되었고!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様ともあっという間に仲良くなってるし！」"
translation = "「마왕님하고도 눈 깜짝할 사이에 사이좋아졌고!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様の第一のしもべとしてはズバリ、強敵と書いて『ライバル』なんだガオ！」"
translation = "「마왕님의 첫 번째 하수인으로서는 그야말로, 강적이라 쓰고 『라이벌』인 거다 크아앙!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ライバル……！」"
translation = "「라이벌……!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「なるほどなのです！\u3000つまり――」"
translation = "「그렇군요인 것입니다! 즉――」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「一緒に頑張る、特別なお友達ということなのですね！」"
translation = "「함께 노력하는, 특별한 친구라는 뜻이군요!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「なんでそうなるワン！？」"
translation = "「어째서 그렇게 되냐 멍!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「カティア先輩と狛里は、同じ目標を追いかける者同士なのです♪」"
translation = "「카티아 선배와 코마리는, 같은 목표를 쫓아가는 동료인 것입니다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「それなら、絶対に仲良しになれるということであります♪」"
translation = "「그러면, 절대로 친해질 수 있다는 뜻인 말입니다♪」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「解釈がポジティブすぎるっ！！！」"
translation = "「해석이 너무 긍정적이야!!!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「と、とにかく！\u3000私だって必ずプリマステラになってみせるんだから、覚えてろよ～～！！」"
translation = "「아, 아무튼! 나도 반드시 프리마스텔라가 되어 보일 테니까, 두고 보라고~~!!」"

[[dialogue]]
speaker = "unk"
original = "数日後。"
translation = "며칠 후."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「カティア先輩～っ♪」"
translation = ""

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「わわっ、狛里！？\u3000ちょっ……！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "カフェテリアへ昼食しに来たカティアの姿を見つけ、嬉々として駆け寄って来る狛里。"
translation = "카페테리아에 점심을 먹으러 온 카티아의 모습을 발견하고, 신이나서 달려오는 코마리."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ♪\u3000――くんくん、くんくん♪」"
translation = ""

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「きゃうっ！？\u3000こ、こらっ！\u3000勝手にくっ付いて、匂い嗅がないでよ！？」"
translation = "「캬우!? 이, 이봐! 마음대로 달라붙어서, 냄새 맡지 마!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへへっ♪\u3000狛里はカティア先輩のライバルでありますから♪」"
translation = ""

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「本当にライバルの意味、わかってる！？」"
translation = "「진짜 라이벌의 의미, 알고 있는 거야!?」"

[[dialogue]]
speaker = "unk"
original = "こうして狛里は、持ち前の人懐っこさでカティアとあっという間に仲良く（？）なってしまうのであった。"
translation = "이렇게 해서 코마리는, 특유의 붙임성으로 카티아와 눈 깜짝할 사이에 사이좋게(?) 되어버리는 것이었다."

