[[dialogue]]
speaker = "unk"
original = "第６話,『我がママボディ』,B"
translation = "제6화, 『내 마마 바디』, B"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふふ。ずばり──あの子さ」"
translation = "「후후. 바로── 저 아이라구」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「おお！\u3000環っちも唸らせるなんてどれほどのママ──」"
translation = "「오오! 타마키치도 탄식하게 만들다니 얼마나 굉장한 마마──」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「──ほえ？」"
translation = "「──호에?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「──って、アポロっちじゃんか」"
translation = "「──라니, 아폴로치잖아」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボクに紹介できる最高峰のママ候補だね」"
translation = "「내가 소개할 수 있는 최고봉의 마마 후보라구」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「いやいや、アポロっちはママどころかむしろお子ちゃまじゃん！」"
translation = "「아니아니, 아폴로치는 마마는커녕 오히려 꼬맹이잖아!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「誰がお子ちゃまだ！」"
translation = "「누가 꼬맹이라는 거냐!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「あ、ごめんごめん」"
translation = "「아, 미안 미안」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「なんなんださっきから。っていうか、客人が来てるって聞いたけどおまえたちか？」"
translation = "「무슨 소릴 하는 거냐 아까부터. 그보다, 손님이 와있다고 들었는데 너희들이냐?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ルヴィっちに同行してきてるんだ。環っちと会ったのは偶然だったんだけど……」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いやあ、セシアにママになりそうな存在を知らないかって訊かれちゃってさ。アポロのことを紹介しようと思ってたわけ」"
translation = "「이야아, 세시아에게 마마가 될 것 같은 존재를 모르냐고 질문받아버려서 말이지. 아폴로를 소개하려고 생각하던 차였어」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「で、セシア的にはどうかな？\u3000ボクのイチ推しのママは──」"
translation = "「그래서, 세시아적으로는 어떨까? 나의 첫 번째 추천 마마는──」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「──ママ～～！！！」"
translation = "「──마마~~!!!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「おわあ、びっくりした！？」"
translation = "「어와아, 놀라라!?」"

[[dialogue]]
speaker = "unk"
original = "セシアはアポロに抱きついた。"
translation = "세시아는 아폴로에게 껴안겼다."

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ああいけない、わたくしったらはしたない。でも許してほしいの。これもあなたがバブみに溢れているからいけないのよ？」"
translation = "「아아 안 돼요, 저도 참 조신하지 못하게. 하지만 용서해 줬으면 해요. 이것도 당신이 응아미로 넘쳐흐르고 있으니까 안 되는 거라구요?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「な、なんだとー！？」"
translation = "「뭣, 뭐라고ー!?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ていうか、あたしと同じくらいのちんちくりんじゃないか！\u3000それなのにあたしのことをママ呼ばわりってどういうことだ！？」"
translation = "「그보다, 나랑 비슷한 정도의 땅꼬마잖아! 그런데도 나를 마마라고 부른다니 무슨 소리냐!?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「あら……？\u3000確かに。よく見ればまだ小さいわ。包み込むようなママみに惑わされて、わからなかったけれど」"
translation = "「어라……? 확실히. 잘 보면 아직 작네요. 감싸 안는 듯한 마마미에 현혹되어, 알지 못했었지만」"

[[dialogue]]
speaker = "unk"
original = "セシアはアポロから離れると、首を傾げた。"
translation = "세시아는 아폴로에게서 떨어지더니, 고개를 갸웃거렸다."

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「そーそー。アポロっちは同じ附属生なんだしさ。さすがにママってことはないんじゃない？」"
translation = "「그래그래. 아폴로치는 같은 부속생이기도 하고 말이야. 역시 마마라는 건 아니지 않아?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そう……そうね。常識的に考えればそうなのだけど」"
translation = "「그렇…… 그렇네요. 상식적으로 생각하면 그렇습니다만」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「うーん……なぜかしら？\u3000それでもこの子からは隠しきれないバブみを感じるのよ」"
translation = "「으-음…… 어째서일까요? 그래도 이 아이에게서는 숨길 수 없는 응아미를 느껴요」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふふふ。だーから言ったでしょ。アポロは才能の原石──まさに未来のママってわけさ！」"
translation = "「후후후. 그~러니까 말했잖아. 아폴로는 재능의 원석── 그야말로 미래의 마마라는 거라구!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしが一番の置いてけぼりだぞ！\u3000紅明、まずママってなんなのか説明してくれ！」"
translation = "「내가 제일 떼어놓아진 거라구! 코메이, 우선 마마라는 게 뭔지 설명해 줘!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「セッシーは世界中のママを探してるんだ。心から甘えられるような、包み込む優しさと愛情を持った相手をね☆」"
translation = "「세시는 전 세계의 마마를 찾고 있어. 진심으로 어리광 부릴 수 있는 듯한, 감싸 안는 상냥함과 애정을 가진 상대를 말이야☆」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「それがあたし？\u3000ってことか？」"
translation = "「그게 나? 라는 건가?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「つってもあたし、ママっぽいことなんて全然してないぞ。料理もできないし、他の家事だって……」"
translation = "「그렇다고 해도 나, 마마 같은 짓 따위 전혀 하지 않고 있다고. 요리도 못 하고, 다른 집안일도……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふふ……実はね。ボクは見てきてるんだよ。平行世界デネブの、１０年後のアポロをね！」"
translation = "「후후…… 사실은 말이지. 나는 보고 왔다구. 평행세계 데네브의, 10년 후의 아폴로를 말이야!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「まあ！」"
translation = "「어머나!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「平行世界のアポロっち……！\u3000それがもしかしてバブみに溢れてたってこと！？」"
translation = "「평행세계의 아폴로치……! 그게 혹시 응아미로 넘쳐흐르고 있었다는 거!?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「その通り。向こうのアポロは、このちんちくりんが嘘のような我がままボディに成長して、それこそ包み込む優しさに満ち満ちていたんだ」"
translation = "「그 말대로. 저쪽의 아폴로는, 이 땅꼬마가 거짓말 같은 내 마마 바디로 성장해서, 그야말로 감싸 안는 상냥함으로 가득 차있었다구」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ちんちくりんは余計だ！」"
translation = "「땅꼬마는 쓸데없다!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「自分でも言ってたけどね☆」"
translation = "「자기도 말했었지만 말이야☆」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「なるほど……そういうことだったのね。わたくしはアポロに眠る潜在ママ力を察知してしまったのね」"
translation = "「과연…… 그런 거였군요. 저는 아폴로에게 잠들어있는 잠재 마마력을 감지해 버린 거군요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「よくわかんねーけど……あたしが将来、ママっぽい立派な女になるってことか？」"
translation = "「잘 모르겠지만…… 내가 장래에, 마마 같은 훌륭한 여자가 된다는 건가?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうそう」"
translation = "「그래그래」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「びっくりだなー。今のアポロっちからはあんまりイメージつかないかも！」"
translation = "「놀라운걸-. 지금의 아폴로치한테서는 별로 이미지 안 떠오를 지도!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしもだ！\u3000数年後の自分がそんなになるなんて、これっぽっちも想像できないぞ！」"
translation = "「나도다! 몇 년 후의 내가 그렇게 된다니, 이만큼도 상상할 수 없다구!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「まあ、アルタイルとデネブではこの先１０年で起こることが全然違っていくだろうから。こっちのアポロが同じようになるとは決まってないけどね♪」"
translation = "「뭐, 알타이르와 데네브에서는 앞으로 10년 동안 일어날 일이 전혀 달라질 테니까. 이쪽의 아폴로가 똑같이 된다고 정해진 건 아니지만 말이야♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「とはいえ、アポロのママポテンシャルが無限大なことは保証済みさ♪」"
translation = "「그렇다 하더라도, 아폴로의 마마 포텐셜이 무한대한 것은 보증 완료라구♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「どう、セシア？\u3000キミのご要望通りじゃない？」"
translation = "「어때, 세시아? 너의 요망대로잖아?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「うーん……そう言われると確かにそうなのだけれど……」"
translation = "「으-음…… 그렇게 들으면 확실히 그렇습니다만……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「今のアポロはまだママではないのよね。これは判定が難しいところだわ」"
translation = "「지금의 아폴로는 아직 마마가 아닌 거네요. 이것은 판정이 어려운 부분이네요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そうだわ！\u3000あなたから感じるママの波動が本物かどうか、きっとわたくしを抱っこしてもらえればわかるわ」"
translation = "「그렇네요! 당신에게서 느껴지는 마마의 파동이 진짜인지 어떤지, 분명 저를 안아주시면 알 수 있어요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「えええっ！？\u3000なんであたしがおまえを抱っこしなくちゃならないんだ！」"
translation = "「에에엣!? 어째서 내가 너를 안아주지 않으면 안 되는 거냐!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「まあまあ。いいからいいから」"
translation = "「자자. 괜찮으니까 괜찮으니까」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ごめんアポロっち☆\u3000付き合ってあげてよ？\u3000セッシーもこれで真剣なんだ」"
translation = "「미안 아폴로치☆ 어울려 주라구? 세시도 이걸로 진지하니까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「でも別に、あたしはママになりたいわけじゃないしな……」"
translation = "「하지만 딱히, 나는 마마가 되고 싶은 건 아니고 말이지……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうそう。ほら、えーっと──女の子を抱きかかえてる姿ってヒーローっぽいじゃん？\u3000いつかそういうシチュエーションだって来るかもしれないよ？」"
translation = "「그래그래. 봐봐, 어── 여자아이를 안아 들고 있는 모습이란 히어로 같잖아? 언젠가 그런 시츄에이션이라도 올지도 모른다구?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「む！\u3000確かに……爆発の中からヒロインを助け出すってのは、まさにヒーローの定番──その練習くらいにはなるか！」"
translation = "「몸! 확실히…… 폭발 속에서 히로인을 구해낸다는 건, 그야말로 히어로의 정석── 그 연습 정도는 되려나!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ったく、しょうがないなあ」"
translation = "「나 참, 어쩔 수 없구만」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「どきどき。わくわく♪」"
translation = "「두근두근. 신난다♪」"

[[dialogue]]
speaker = "unk"
original = "セシアはアポロの前に立った。"
translation = "세시아는 아폴로의 앞에 섰다."

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「同じくらいの体格だけど、平気そう？」"
translation = "「비슷한 정도의 체격인데, 괜찮겠어?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あんな大剣担げるくらいだから、大丈夫っしょ」"
translation = "「그런 대검을 짊어질 수 있을 정도니까, 괜찮겠지」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「確かに」"
translation = "「확실히」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「よい……しょっと。これでいいのかー？」"
translation = "「영…… 차. 이걸로 된 건가ー?」"

[[dialogue]]
speaker = "unk"
original = "アポロはしぶしぶセシアを抱っこした。"
translation = "아폴로는 마지못해 세시아를 안아 들었다."

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「──！！！！！」"
translation = "「──!!!!!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「かつてないほどの強いリアクション！」"
translation = "「일찍이 없던 정도의 강한 리액션!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「これは……なんてこと！\u3000抱っこされているだけで、思わず頬が緩んでしまうわ！」"
translation = "「이건…… 이럴 수가! 안겨있는 것만으로, 나도 모르게 뺨이 풀려버려요!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「わ、わあっ！？\u3000ま、待て待て、暴れるなって！」"
translation = "「와, 와앗!? 기, 기다려 기다려, 날뛰지 말라구!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「アポロママ～♪\u3000セシア、ママのお胸に抱かれて揺られて眠りたいの～♪」"
translation = "「아폴로 마마~♪ 세시아, 마마의 가슴에 안겨서 흔들리며 자고 싶어요~♪」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ど、どうすりゃいいんだ、これ……えっと。おー、よしよし。いい子だ、ねんねしな～──こ、こんな感じか！？」"
translation = "「어, 어떻게 해야 하는 거냐, 이거…… 어저구. 오ー, 착하지 착해. 좋은 아이지, 자장자장~── 이, 이런 느낌인가!?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「うーん、まだぎこちないわね。もっと眠れるバブみを解放するのよ。ほら、わたくしが甘えるから──ママ～♪」"
translation = "「으-음, 아직 서투르네요. 좀 더 잘 수 있는 응아미를 해방하는 거예요. 자, 제가 어리광 부릴 테니까── 마마~♪」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「わ……わから～～～～ん！！」"
translation = "「모…… 모르겠어~~~~!!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「セシア、一旦ストーーップ！」"
translation = "「세시아, 일단 스스스톱!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「はっ──つい我を失ってしまったわ。恐るべきはアポロママに眠る潜在ママ力ね」"
translation = "「핫── 그만 이성을 잃어버렸네요. 두려운 것은 아폴로 마마에게 잠들어있는 잠재 마마력이네요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ふう、ふう……助かったぜ」"
translation = "「후우, 후우…… 살았다구」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「どうなってんだこりゃ。あたしが抱っこした途端、まるであたしを本当のママみたいに扱って……」"
translation = "「어떻게 된 거냐 이거. 내가 안아 들자마자, 마치 나를 진짜 마마처럼 취급하고……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「あなたの魅力がわたくしをそうさせたのよ、アポロママ」"
translation = "「당신의 매력이 저를 그렇게 만든 거라구요, 아폴로 마마」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「まさに可能性の塊だわ！\u3000ラクシャの言う通り、アポロママはママになるべくしてなる存在よ！」"
translation = "「그야말로 가능성의 덩어리예요! 락샤가 말하는 대로, 아폴로 마마는 마마가 될 수밖에 없는 존재예요!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「おお～！\u3000やったねセッシー☆\u3000新しいママ発見♪\u3000紅明ママとしても負けてらんないな～」"
translation = "「오오~! 해냈네 세시☆ 새로운 마마 발견♪ 코메이 마마로서도 지고 있을 수는 없겠네~」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「う、うーむ。嬉しいような、全然マッタクこれっぽっちも嬉しくないような？」"
translation = "「으, 으-음. 기쁜 듯하면서도, 전혀 정~말 이만큼도 기쁘지 않은 듯한?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ぜひわたくしのママになってほしいわ。アポロママ」"
translation = "「부디 저의 마마가 되어주셨으면 해요. 아폴로 마마」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「って、なんであたしがセシアのママにならなきゃいけないんだっつーの！\u3000あたしがなりたいのはヒーローだ！」"
translation = "「라니, 어째서 내가 세시아의 마마가 되지 않으면 안 되냐는 거냐! 내가 되고 싶은 건 히어로다!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「潜在能力は本物よ」"
translation = "「잠재능력은 진짜예요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「だいたいママなんて、そういうのは好きな男子と結婚してからの話で……」"
translation = "「대체로 마마라니, 그런 건 좋아하는 남자애랑 결혼하고 나서의 이야기고……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「って、だからそういう話でもなくてだな！\u3000というか、ママとかママじゃないとかの話の前に、まずは友達だろ！？」"
translation = "「라니, 그러니까 그런 이야기도 아니라고 말이지! 라고 할까, 마마라느니 마마가 아니라느니의 이야기 전에, 우선은 친구잖아!?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「なるほど。友達として接していたはずが、いつのまにかママとして意識し始めてしまう……そんなルートもあるものね？」"
translation = "「과연. 친구로서 대하고 있었을 터인데, 어느샌가 마마로서 의식하기 시작해 버린다…… 그런 루트도 있는 법이군요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あるかなぁ？」"
translation = "「있으려나-?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ぜひお友達になりましょう、アポロママ！\u3000これもまた楽しみだわ」"
translation = "「부디 친구가 되기로 해요, 아폴로 마마! 이것 또한 기대되네요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「おうよ！\u3000へへ、友達が増えるってんならあたしも大歓迎だぜ！」"
translation = "「오냐! 헤헤, 친구가 늘어난다고 한다면 나도 대환영이라구!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「……ちなみに、その『アポロママ』っていうのは止められるか？」"
translation = "「……참고로, 그 『아폴로 마마』라는 건 그만두게 할 수 있나?」"

[[dialogue]]
speaker = "unk"
original = "その後、セシアはだいぶ粘ったが──結局『アポロママ』の許諾は得られなかったのだった。"
translation = "그 후, 세시아는 bastante 끈질기게 굴었지만── 결국 『아폴로 마마』의 허락은 얻지 못했던 것이었다."

