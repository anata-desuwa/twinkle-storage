[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「――パッションサマーストリーム！！！」"
translation = "「――패션 서머 스트림！！！」"

[[dialogue]]
speaker = "unk"
original = "…………"
translation = "…………"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あ……会長くんの体が、仰向けに倒れて……！」"
translation = "「아…… 회장군의 몸이, 위를 향해 쓰러져서……！」"

[[dialogue]]
speaker = "unk"
original = "見事……！"
translation = "훌륭하다……！"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「か……勝った……！\u3000会長のハイレグに……！」"
translation = "「이…… 이겼다……！ 회장의 하이레그를……！」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「聖沙ちゃんの水着の勝ちだよ～～～っ！！\u3000やったぁ～～～っ♪」"
translation = "「미사짱의 수영복이 이겼어~~~! 해냈다~~~♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「は、はいっ♪\u3000数え切れないくらい負けた内の１勝ですけど、勝ちました……！」"
translation = "「네, 네에♪ 셀 수 없을 정도로 패배한 것 중 1승입니다만, 이겼습니다……!」"

[[dialogue]]
speaker = "unk"
original = "俺のハイレグの弱点を"
translation = "내 하이레그의 약점을"

[[dialogue]]
speaker = "unk"
original = "よくぞ見抜いたな"
translation = "잘도 간파했구나"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ええ。会長のハイレグは、３倍もの大出力を発揮できる代わりに、星力の消耗が激しい――そうよね？」"
translation = "「네. 회장의 하이레그는, 3배나 되는 대출력을 발휘할 수 있는 대신에, 성력의 소모가 심해―― 그렇죠？」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「だから、諦めずに勝負を挑み続ければ、私の水着フォームよりも先にエネルギー切れを起こしてしまう」"
translation = "「그러니까, 포기하지 않고 승부를 계속 건다면, 내 수영복 폼보다 먼저 에너지 고갈이 일어나버려」"

[[dialogue]]
speaker = "unk"
original = "聖沙の粘り勝ちだ"
translation = "세이샤의 끈기 승리다"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ええ。でも、たったの１勝よ」"
translation = "「네. 하지만, 단 1승이에요」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「だから、認めるわ。会長の海パンの強さを」"
translation = "「그러니까, 인정할게요. 회장의 사각 수영복의 강함을」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「――ナイスハイレグだったわ！」"
translation = "「――나이스 하이레그였어요！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「会長の海パンが回復したら、また勝負よ！」"
translation = "「회장의 사각 수영복이 회복되면, 또 승부예요！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「私の水着も、もっと鍛えて強くなってみせるんだから♪」"
translation = "「내 수영복도, 더욱 단련해서 강해져 보일 테니까요♪」"

[[dialogue]]
speaker = "unk"
original = "こうして、俺たちはお互いに強くなる為、それからも水着で勝負をし続けるのだった。"
translation = "이렇게 해서, 우리들은 서로 강해지기 위해, 그 후로도 수영복으로 승부를 계속하는 것이었다."

