[[dialogue]]
speaker = "unk"
original = "九浄家メイド隊の新人メイドである狛里を指導することになったヨミ。"
translation = "쿠죠가 메이드대의 신입 메이드인 코마리를 지도하게 된 요미."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「それでは本日から、九浄家でのメイドの仕事を教えていきますね」"
translation = "「그러면 오늘부터, 쿠죠가에서의 메이드 일을 가르쳐 드릴게요」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ♪\u3000ヨミ先輩、よろしくお願いするであります！」"
translation = "「바우와후♪ 요미 선배, 잘 부탁드리는 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい、一緒に頑張りましょう！」"
translation = "「네, 함께 힘내요!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ではまず、お屋敷の掃除から始めますね」"
translation = "「그럼 우선, 저택 청소부터 시작할게요」"

[[dialogue]]
speaker = "unk"
original = "掃除する場所や手順をひと通り教えてから、しばらくして。"
translation = "청소할 장소나 순서를 대강 가르쳐 주고 나서, 잠시 후."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ヨミ先輩！\u3000中庭のお掃除、終わったのです！」"
translation = "「요미 선배! 안뜰 청소, 끝난 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「えっ、もうですか！？」"
translation = "「엣, 벌써요!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ♪\u3000それと、ついでに縁側もお掃除しておいたのです！」"
translation = "「네♪ 그리고, 하는 김에 툇마루도 청소해 둔 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「え？」"
translation = "「예?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あの……私がお願いしたのは中庭だけでしたよね？」"
translation = "「저기…… 제가 부탁드린 건 안뜰뿐이었죠?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ！\u3000でも早く終わったので、たくさんお掃除した方がいいと思ったのです♪」"
translation = "「네! 하지만 일찍 끝났으니까, 많이 청소하는 게 좋다고 생각한 것입니다♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そ、そうですか」"
translation = "「그, 그런가요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（やる気があるのはいいことだけど、報告なしに勝手に進めてしまうのはマズいような……）"
translation = "(의욕이 있는 건 좋은 일이지만, 보고 없이 마음대로 진행해 버리는 건 좀 그런데……)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（それに、少し作業スピードが早過ぎる気も……）"
translation = "(게다가, 조금 작업 속도가 너무 빠른 느낌도……)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里さん、一応この辺りをもう少し掃いておきましょうか」"
translation = "「코마리 씨, 일단 이 근처를 조금 더 쓸어 둘까요」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ！\u3000了解であります！」"
translation = "「네! 알겠는 것입니다!」"

[[dialogue]]
speaker = "unk"
original = "続いて、洗濯の指導に移る。"
translation = "이어서, 빨래 지도에 들어간다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「教えてもらった通りに、お洗濯をして、干し終わったのであります！」"
translation = "「가르쳐 주신 대로, 빨래를 해서, 다 널은 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「て、手早いですね……！」"
translation = "「손, 손이 빠르시네요……!」"

[[dialogue]]
speaker = "unk"
original = "ヨミは洗濯物の状態を確認する。"
translation = "요미는 빨래의 상태를 확인한다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（うん、干し方は問題ないみたい）"
translation = "(응, 너는 방식은 문제없는 것 같아)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「いい感じですね。取り込む時間は覚えていますか？」"
translation = "「좋은 느낌이네요. 걷는 시간은 기억하고 있나요?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ、大丈夫なのです！\u3000気合いで覚えておくのです！」"
translation = "「네, 괜찮은 것입니다! 기합으로 기억해 두는 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「き、気合いというよりは、ちゃんとメモを……」"
translation = "「기, 기합이라기보다는, 제대로 메모를……」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「あっ、それもそうなのです！\u3000えへへっ♪」"
translation = "「앗, 그것도 맞는 것입니다! 에헤헤♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（す、少し心配かも……）"
translation = "(조, 조금 걱정될지도……)"

[[dialogue]]
speaker = "unk"
original = "その日の夜。"
translation = "그날 밤."

[[dialogue]]
speaker = "unk"
original = "仕事を終えたヨミは、狛里と夕食を共にしていた。"
translation = "일을 마친 요미는, 코마리와 저녁 식사를 함께하고 있었다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ♪\u3000やっぱり人間界のご飯はどれも美味しいのです～♪」"
translation = "「바우와후♪ 역시 인간계의 음식은 전부 맛있는 것입니다~♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふふっ、狛里さんは本当に美味しそうに食べますね」"
translation = "「후후, 코마리 씨는 정말 맛있게 드시네요」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ。狛里、昔から食べるのが大好きなのです♪\u3000そのお陰で、同い年の子よりも大きくなれたのであります！」"
translation = "「네. 코마리, 옛날부터 먹는 걸 정말 좋아한 것입니다♪ 그 덕분에, 동갑내기 아이보다 커질 수 있었던 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「確かに狛里さんは私より１つ年下なのに、その……スタイルもいいですよね」"
translation = "「확실히 코마리 씨는 저보다 한 살 어린데, 그…… 스타일도 좋으시네요」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへっ♪\u3000附属校に初めて登校した日も、クラスのみんなにびっくりされたのです！」"
translation = "「에헤헤♪ 부속 학교에 처음 등교한 날도, 반 모두가 놀란 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（確かに附属校３年生だって聞いた時は、私も驚いたなぁ……ご当主様は９６センチって言ってたっけ。ごくりっ）"
translation = "(확실히 부속 학교 3학년이라고 들었을 때는, 나도 놀랐었지…… 당주님은 96센티라고 하셨던가. 꿀꺽)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里さんは、魔界ではどんな暮らしをしていたんですか？」"
translation = "「코마리 씨는, 마계에서는 어떤 생활을 하고 계셨나요?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「故郷は辺境の小さな村だったので、けっこう大変だったのです！」"
translation = "「고향은 변방의 작은 마을이었어서, 제법 힘들었던 것입니다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「畑仕事も、狩りも、見張りも、みんなで手分けしてやっていたのです！」"
translation = "「밭일도, 사냥도, 감시도, 다 같이 나누어서 했던 것입니다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里は体が丈夫だったので、昔から色んなお仕事を任されることが多かったのであります！」"
translation = "「코마리는 몸이 튼튼했기 때문에, 옛날부터 여러 가지 일을 맡는 경우가 많았던 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そうだったんですね」"
translation = "「그러셨군요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（だから、こんなに働き者なんだ。狛里さん、すごいなぁ……）"
translation = "(그래서, 이렇게 일꾼이구나. 코마리 씨, 대단해……)"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「そうだ！\u3000ヨミ先輩、聞いてもいいでありますか？」"
translation = "「맞다! 요미 선배, 물어봐도 되는 것입니다?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい、なんでしょう？」"
translation = "「네, 어떤 건가요?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ご当主様から、ヨミ先輩も狛里と同じで、魔界でスカウトされて人間界に来たって聞いたのですけど――」"
translation = "「당주님한테, 요미 선배도 코마리랑 마찬가지로, 마계에서 스카우트되어서 인간계에 왔다고 들은 것입니다만──」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「どうしてメイドのお仕事をしているのかなって、気になったのであります！」"
translation = "「어째서 메이드 일을 하고 있는 걸까 하고, 궁금해진 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そう、ですね……」"
translation = "「그, 러게요……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私は、魔界にある『天ヶ崎神宮』という神社を守る一族の者なんです」"
translation = "「저는, 마계에 있는 『아마가사키 신궁』이라는 신사를 지키는 일족의 사람이에요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そして、天ヶ崎の一族は、３０００年前にリクリエから世界を守った『クルセイダース』の子孫でもあります」"
translation = "「그리고, 아마가사키 일족은, 3000년 전에 리크리에로부터 세계를 구한 『크루세이더즈』의 후손이기도 하답니다」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私はその中でも、ご先祖様が使っていた『破邪の鈴』に選ばれたということで、九浄家にスカウトして頂いたんです」"
translation = "「저는 그중에서도, 조상님이 사용하시던 『파사의 방울』에 선택받았다고 해서, 쿠죠가에 스카우트된 거예요」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「！\u3000クルセイダース……知ってるのです！」"
translation = "「! 크루세이더즈…… 알고 있는 것입니다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「大昔、魔界で暴れていた魔獣『白虎』を封印した英雄たちなのです！」"
translation = "「아주 옛날, 마계에서 날뛰던 마수 『백호』를 봉인했던 영웅들인 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そうですね……白虎以外にも、クルセイダースの伝説は三界各地にたくさんあります」"
translation = "「그렇네요…… 백호 이외에도 크루세이더스의 전설은 삼계 곳곳에 많이 있습니다」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私は、そんなクルセイダースのひとりが使っていた、伝説の武器を受け継いでいるんです」"
translation = "「저는, 그런 성기사 중 한 사람이 사용했던 전설의 무기를 물려받은 거랍니다」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……ご当主様は最初、私を九浄家の『食客』として迎え入れたいと言ってくれました」"
translation = "「……당주님은 처음에, 저를 쿠죠 가문의 『식객』으로 맞아들이고 싶다고 말씀해 주셨어요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「でも、私はそれをお断りしたんです」"
translation = "「하지만, 저는 그걸 거절했답니다」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「破邪の鈴に選ばれたとは言え、私はまだまだ未熟でしたし……」"
translation = "「파사의 방울에 선택받았다고는 해도, 저는 아직 미숙하기도 했고……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「何より、働きもしないままお世話になるのは嫌だったので」"
translation = "「무엇보다, 일도 하지 않은 채 신세를 지는 건 싫었으니까요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「だから九浄家メイド隊の一員として働きながら、学園に通わせてもらうことにしたんです」"
translation = "「그래서 쿠죠가 메이드대의 일원으로서 일하면서, 학원에 다니기로 한 거랍니다」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「そうだったのですね！\u3000実は狛里もおんなじなのです♪」"
translation = "「그러셨던 거군요! 사실 코마리도 똑같답니다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「人間界でお世話になるなら、その分ちゃんと働きたいって思ったのです！」"
translation = "「인간계에서 신세를 진다면, 그만큼 제대로 일하고 싶다고 생각했던 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そうだったんですね」"
translation = "「그러셨군요」"

[[dialogue]]
speaker = "unk"
original = "ヨミは思わず笑みを浮かべる。"
translation = "요미는 나도 모르게 미소를 띤다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「じゃあ一緒にメイドの仕事、頑張りましょう♪」"
translation = "「그럼 함께 메이드 일, 힘내요♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ♪\u3000明日からも、よろしくお願いするであります！」"
translation = "「네♪ 내일부터도 잘 부탁드리는 바입니다!」"

[[dialogue]]
speaker = "unk"
original = "数日後。"
translation = "며칠 뒤."

[[dialogue]]
speaker = "unk"
original = "ヨミは狛里に、『任務管轄係』の仕事を教えていた。"
translation = "요미는 코마리에게, 『임무관할계』의 일을 가르쳐 주고 있었다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ヨミ先輩、頼まれた書類、ひと通り書き終わったのです！」"
translation = "「요미 선배, 부탁받은 서류, 전부 다 썼습니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ありがとうございます。確認しますね」"
translation = "「감사합니다. 확인해 볼게요」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「よろしくお願いするであります！\u3000その間に狛里は、別のお仕事を進めておくのです！」"
translation = "「잘 부탁드리는 바입니다! 그 사이에 코마리는, 다른 일을 진행해 두는 것입니다!」"

[[dialogue]]
speaker = "unk"
original = "ちなみに『任務管轄係』とは、モンスターやアステラが出現した際、星騎士たちへの情報伝達や任務発注を行う部署である。"
translation = "참고로 『임무관할계』란, 몬스터나 아스테라가 출현했을 때, 성기사들에게 정보 전달이나 임무 발주를 실시하는 부서다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（う～ん……）"
translation = "(으~음……)"

[[dialogue]]
speaker = "unk"
original = "今日まで仕事を教えて来て、ヨミは狛里の『小さな問題点』に気づき始めていた。"
translation = "오늘까지 일을 가르쳐 오면서, 요미는 코마리의 『작은 문제점』을 눈치채기 시작하고 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（仕事の覚えは早いし、作業もテキパキしてる）"
translation = "(일을 배우는 건 빠르고, 작업도 척척 해내네)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（でも、その反面……少し先を急ぎ過ぎている気がするなぁ）"
translation = "(하지만, 그 반면에…… 조금 너무 서두르고 있다는 느낌이 드네)"

[[dialogue]]
speaker = "unk"
original = "それは洗濯物を取り込む時間を忘れてしまうことだったり……掃除の後に確認すると、掃き忘れた区画が残っていることだったり。"
translation = "그건 빨래를 거둬들이는 시간을 잊어버린다거나…… 청소 후에 확인하면, 쓸지 않고 넘어간 구역이 남아있다거나."

[[dialogue]]
speaker = "unk"
original = "いずれも大きな失敗ではない。"
translation = "어느 쪽이든 큰 실수는 아니다."

[[dialogue]]
speaker = "unk"
original = "しかし、そのどれもが『もう少し確認していれば防げたミス』だった。"
translation = "하지만, 그 모든 것이 『조금만 더 확인했더라면 막을 수 있었던 실수』였다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（新人なんだから、ミスをするのは当たり前）"
translation = "(신인이니까, 실수하는 건 당연해)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（むしろ狛里さんはよく頑張っていると思う。でも……）"
translation = "(오히려 코마리 씨는 잘 열심히 하고 있다고 생각해. 하지만……)"

[[dialogue]]
speaker = "unk"
original = "ヨミは書類へ目を落とす。"
translation = "요미는 서류로 눈길을 떨군다."

[[dialogue]]
speaker = "unk"
original = "そこにもまた、小さな書き間違いが１つ見つかった。"
translation = "거기에도 또, 작은 오기가 하나 발견되었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（狛里さんの場合、ミスに気づかないまま『ただ多くの仕事をこなすこと』が目的化しちゃってるように見える）"
translation = "(코마리 씨의 경우, 실수를 깨닫지 못한 채 『그저 많은 일을 해내는 것』이 목적화되어 있는 것처럼 보여)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（仕事は『こなした数』が多いほど偉いわけじゃない。ミスがないこと、終わらせることに責任を持つことも重要だ）"
translation = "(일은 『해낸 수』가 많을수록 훌륭한 게 아니야. 실수가 없는 것, 끝내는 것에 책임감을 갖는 것도 중요해)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（今の狛里さんは、もっと早く、もっと沢山って頑張っているけど……）"
translation = "(지금의 코마리 씨는, 더 빠르게, 더 많이라며 열심히 하고 있지만……)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（このままで、本当に大丈夫なのかな……？）"
translation = "(이대로 정말 괜찮은 걸까……?)"

[[dialogue]]
speaker = "unk"
original = "もちろん、その都度注意はしている。"
translation = "물론, 그때마다 주의는 주고 있다."

[[dialogue]]
speaker = "unk"
original = "だが、それだけでは根本的な解決になっていない気がした。"
translation = "하지만, 그것만으로는 근본적인 해결이 되지 않는 느낌이 들었다."

[[dialogue]]
speaker = "unk"
original = "ヨミは書類を手にしたまま、少しだけ考え込むのだった。"
translation = "요미는 서류를 손에 쥔 채, 조금 생각에 잠기는 것이었다."

