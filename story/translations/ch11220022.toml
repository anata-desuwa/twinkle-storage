[[dialogue]]
speaker = "unk"
original = "第２話,大人ゲージ上昇中,P"
translation = "제2화, 어른 게이지 상승 중"

[[dialogue]]
speaker = "unk"
original = "クーシェン達は模擬戦を終え、カフェテリアにやってきた。"
translation = "쿠셴 일행은 모의전을 마치고, 카페테리아로 왔다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「へっへーん！\u3000ボクたちメイドの大勝利～♪」"
translation = "「헤헤응！ 우리 메이드들의 대승리～♪」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「やったな、クーシェン！\u3000つらいメイド修行を乗り越えてパワーアップしたんだ」"
translation = "「해냈구나, 쿠셴！ 힘든 메이드 수련을 이겨내고 파워업했어」"

[[dialogue]]
speaker = "unk"
original = "メイド服を人工戦闘服にするなんて"
translation = "메이드복을 인공 전투복으로 만들다니"

[[dialogue]]
speaker = "unk"
original = "２人とも凄かった"
translation = "둘 다 대단했어"

[[dialogue]]
speaker = "unk"
original = "元々はただのメイド服だったが、クーシェンとアポロのたっての願いで戦闘可能なものに改造された。"
translation = "원래는 그냥 메이드복이었지만, 쿠셴과 아폴로의 간곡한 부탁으로 전투 가능한 것으로 개조되었다."

[[dialogue]]
speaker = "unk"
original = "今日はそのテストを兼ねた模擬戦だったが、最高の結果を見せてくれた。"
translation = "오늘은 그 테스트를 겸한 모의전이었지만, 최고의 결과를 보여주었다."

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「模擬戦じゃからな、我は全然本気を出していなかったのじゃ！」"
translation = "「모의전이니까 말이다, 짐은 전혀 본 실력을 내지 않았던 것이니라！」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ウキキ！\u3000それでも勝ちは勝ちだよ～♪」"
translation = "「우키키！ 그래도 이긴 건 이긴 거라구～♪」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「リベンジじゃ！\u3000次は油断せぬからな！\u3000覚悟しておくが良いぞ！」"
translation = "「리벤지다！ 다음엔 방심하지 않을 테니 말이다！ 각오해 두는 것이 좋을 것이다！」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「望むところさ、いつでも相手になってあげるよ♪」"
translation = "「바라던 바야, 언제든 상대해 줄게♪」"

[[dialogue]]
speaker = "unk"
original = "模擬戦に付き合ってくれてありがとう"
translation = "모의전에 응해줘서 고마워"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「他ならぬ眷属の頼みじゃからな。それにこやつらの相手をまともに出来るのは我くらいしかおるまいて」"
translation = "「다름 아닌 권속의 부탁이니까 말이다. 게다가 이 녀석들의 상대를 제대로 할 수 있는 건 짐 정도밖에 없을 테지」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「クーシェンとプリムラがよく手合わせをしてるのは知ってたからな。模擬戦の相手としてちょうどいいと思ったんだ」"
translation = "「쿠셴이랑 프리무라가 자주 겨루는 건 알고 있었으니까. 모의전 상대로 딱이라고 생각했거든」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「プリムラが相手ならボクも全力が出せるしね♪」"
translation = "「프리무라가 상대라면 나도 전력을 다할 수 있고 말이지♪」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「でも、ただでさえ強かったボクがメイド道を極めちゃったからね～、もうプリムラじゃ勝てないかもだよ？」"
translation = "「하지만, 가뜩이나 강했던 내가 메이드도를 극복해 버렸으니까 말이야～, 이제 프리무라로는 못 이길지도 모른다구？」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「ぐぬぬ、調子に乗りおって！\u3000何がメイド道じゃ！\u3000そんなものを極めたからといって、何だと言うのじゃ！」"
translation = "「구누누, 우쭐대기는！ 뭐가 메이드도냐！ 그런 것을 극복했다고 해서, 어쨌단 말이냐！」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「分かってないなー。星見家でメイド修行を積んだボクは、身体的な強さだけじゃなくて精神的な強さも身につけたんだ」"
translation = "「모르는구나─. 호시미가에서 메이드 수련을 쌓은 나는, 신체적인 강함뿐만 아니라 정신적인 강함도 단련했다구」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「その心の成長が、ボクを以前より何倍も強くしてくれたのさ！」"
translation = "「그 마음의 성장이, 나를 이전보다 몇 배나 강하게 만들어 준 거지！」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「実際そうだぞ？\u3000あたしの目から見てもクーシェンは、メイド修行をする前と後じゃ比べものにならないくらい強くなってる」"
translation = "「실제로 그렇다구？ 내가 보기에도 쿠셴은, 메이드 수련을 하기 전과 후가 비교도 안 될 정도로 강해졌어」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「そうじゃな……そればかりは認めぬわけにはいかぬじゃろうな……」"
translation = "「그렇긴 하구나…… 그것만은 인정하지 않을 수 없겠지……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「強く！\u3000可愛く！\u3000働き者！\u3000星見家メイド隊見習い、クーシェンとはボクのことだ～っ♪」"
translation = "「강하게！ 귀엽게！ 일꾼！ 호시미가 메이드대 견습, 쿠셴이란 나를 말하는 거다～앗♪」"

[[dialogue]]
speaker = "unk"
original = "上機嫌でスカートを翻すクーシェン。"
translation = "신이 나서 치맛자락을 펄럭이는 쿠셴."

[[dialogue]]
speaker = "unk"
original = "その動きにもメイド修行の成果か、以前にはなかった優雅さを見て取ることが出来る。"
translation = "그 움직임에도 메이드 수련의 성과인지, 이전에는 없었던 우아함을 찾아볼 수 있다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにー、どうしたの？\u3000さっきからボクのこと見つめちゃって」"
translation = "「오빠, 왜 그래？ 아까부터 나를 지그시 쳐다보고」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「もしかしてボクの可愛さに見とれちゃってたのかな？\u3000メイド修行のおかげで女の子としての魅力にも磨きがかかったもんね～♪」"
translation = "「혹시 내 귀여움에 넋을 잃어버린 걸까나？ 메이드 수련 덕분에 여자아이로서의 매력도 더 가다듬어졌으니까 말이야～♪」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ほらほら、このステップどうかな？\u3000ひらひら～ん<emoji=heart04>」"
translation = "「자자, 이 스텝 어때？ 하늘하늘～람<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "クーシェンは可愛い"
translation = "쿠셴은 귀여워"

[[dialogue]]
speaker = "unk"
original = "う、うん"
translation = "으, 응"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「むむ、あたしだって負けてないぞ！\u3000クーシェンと同じメイド修行を積んだんだからな」"
translation = "「무무, 나도 지지 않는다구！ 쿠셴과 같은 메이드 수련을 쌓았으니까 말이지」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「えー、どうかな～？\u3000ボクみたいな大人の魅力は、アポロにはまだ早いんじゃないかな～？」"
translation = "「에─, 글쎄나～？ 나 같은 어른의 매력은, 아폴로에게는 아직 이르지 않을까나～？」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そんなことないぞ！」"
translation = "「그렇지 않다구！」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「なら、勝負しちゃう？」"
translation = "「그럼, 승부해 버릴까？」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「よし！\u3000勝負だ！」"
translation = "「좋아！ 승부다！」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「それは流石に勝ち目のない勝負なのじゃ。こやつと魔王は恋人同士なんじゃし」"
translation = "「그건 아무래도 승산이 없는 승부인 것이니라. 이 녀석과 마왕은 연인 사이인 것이고」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「……あ、そうだな。魔王は自分のカノジョにあまあまだから……」"
translation = "「……아, 그렇구나. 마왕은 자기 여자친구에게 아주 무르니까……」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「うむ。我らの前でもこうなのじゃ、見えないところではいったいどんなデレを見せておるものか……」"
translation = "「음. 우리들 앞에서도 이러하니라, 보이지 않는 곳에서는 대체 어떤 칠칠치 못한 모습을 보여주고 있을지……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「聞きたいぞ！\u3000クーシェンと魔王はどんな風に……そう、イチャイチャしてるんだ？」"
translation = "「듣고 싶다구！ 쿠셴과 마왕은 어떤 식으로…… 그래, 알콩달콩 지내는 거야？」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「え～？\u3000それを聞いちゃう？\u3000ボクに聞いちゃうかな～？」"
translation = "「에～？ 그걸 물어보는 거야？ 나한테 물어보는 걸까나～？」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「恋人同士のヒメゴトだし、他人に教えることじゃないんだけど……２人がどーしてもって言うなら、教えちゃおうかな♪」"
translation = "「연인 사이의 비밀이고, 남에게 가르쳐 줄 만한 게 아니지만…… 둘이 어떻게 해서든이라고 말한다면, 가르쳐 줄까나♪」"

[[dialogue]]
speaker = "unk"
original = "程々にね？"
translation = "적당히 해？"

[[dialogue]]
speaker = "unk"
original = "く、クーシェン？"
translation = "쿠, 쿠셴？"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「さ～て、それはどうかな～♪\u3000ウキキ♪\u3000でもカレシを困らせたくないし、ちょこっとだけね」"
translation = "「글쎄─, 그건 어떨까나～♪ 우키키♪ 하지만 남자친구를 곤란하게 만들고 싶진 않고, 아주 조금만 말이지」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「いいから早く話すのじゃ」"
translation = "「됐으니까 어서 말하는 것이니라」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「まずはね～、これ！\u3000にーにーに抱きついて、ぎゅ～～って<emoji=heart04>」"
translation = "「우선은 말이지～, 이거！ 오빠한테 안겨서, 꽉～～ 하고<emoji=heart04>」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「おお……本当に抱きついてる……コアラみたいじゃ」"
translation = "「오오…… 진짜로 안겨 있구나…… 코알라 같으니라」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「コアラじゃなくて、おさるだな」"
translation = "「코알라가 아니라, 원숭이네」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「おさる言うな～～！！」"
translation = "「원숭이라고 하지 마～～！！」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ぎゅってするだけなら、あたしだってしてるぞ。魔王～♪」"
translation = "「꽉 안는 것 뿐이라면, 나도 하고 있다구. 마왕～♪」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「こら！\u3000人のカレシに勝手に抱きつくな～！」"
translation = "「이봐！ 남의 남자친구한테 멋대로 안기지 마～！」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーもにーにーだよ、カノジョの前であっさり浮気しちゃってさぁ」"
translation = "「오빠도 오빠라구, 여자친구 앞에서 덜컥 바람을 피워버리고 말이야」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「すりすりすり～♪」"
translation = "「부비부비부비～♪」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「アポロも負けず嫌いじゃな」"
translation = "「아폴로도 지기 싫어하는구나」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「プリムラもしていーぞ」"
translation = "「프리무라도 해도 된다구」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「勝手に許可するな～！\u3000プリムラも、変な誘いに乗らないでよね」"
translation = "「멋대로 허락하지 마～！ 프리무라도, 이상한 유혹에 넘어가지 말라구」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「わかっておる。ほら、アポロもふざけるのはそのくらいにして、離れるのじゃ」"
translation = "「알고 있느니라. 자, 아폴로도 장난치는 건 그쯤 하고, 떨어지는 것이니라」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「はぁーい」"
translation = "「네에─이」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「……ほっ。やっとボクだけのにーにーに戻った」"
translation = "「……휴. 겨우 나만의 오빠로 돌아왔어」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「それで？\u3000恋人同士なのに、抱きつくだけでおしまいか？」"
translation = "「그래서？ 연인 사이인데, 안는 것 정도로 끝인 것이냐？」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「違うもん！\u3000もっと色々してるもんね～！」"
translation = "「아니라구！ 더 여러 가지 하고 있다구～！」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「えっと、たとえば……ねぇ、にーにー、他にどんなことしてたっけ？」"
translation = "「으음, 예를 들면…… 저기, 오빠, 다른 건 어떤 걸 했었지？」"

[[dialogue]]
speaker = "unk"
original = "膝枕とか？"
translation = "무릎베개라든가？"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そう！\u3000膝枕しちゃったもんね～」"
translation = "「맞아！ 무릎베개 해버렸었지～」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「それは恋人っぽいのじゃ」"
translation = "「그건 연인다운 것이니라」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「膝枕って楽しいのか？」"
translation = "「무릎베개는 즐거운 건가？」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「楽しいよ～！\u3000にーにーの頭をふとももに乗っけてね～、やさしーくなでなでしてあげるの」"
translation = "「즐겁다구～！ 오빠의 머리를 허벅지에 얹어놓고 말이지～, 상~냥하게 쓰다듬어 주는 거야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーの髪ってさらさらなんだよ。ボクが撫でるとね、すごくやさしい顔になって……それが好きだなって……てへへ♪」"
translation = "「오빠 머리카락은 부드럽단 말이지. 내가 쓰다듬으면 말이야, 굉장히 상냥한 얼굴이 되어서…… 그게 좋다랄까…… 데헤헤♪」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「本当に恋愛してるのじゃ……」"
translation = "「진짜로 연애를 하고 있구나……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「クーシェンが見たことない顔してたぞ……恋をすると、そんな顔をするようになるんだな」"
translation = "「쿠셴이 본 적 없는 얼굴을 하고 있었어…… 사랑을 하면, 그런 얼굴을 하게 되는 거구나」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「メイド修行のおかげかもね。前は考えなかったけど、他の人がボクをどう見るのか意識するようになったし」"
translation = "「메이드 수련 덕분일지도. 전에는 생각지도 않았지만, 다른 사람이 나를 어떻게 볼지 의식하게 되었고」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーも……メイド姿のボクだと、エッチな目で見てくれるってわかったしね<emoji=heart04>」"
translation = "「오빠도…… 메이드 차림의 나라면, 야한 눈으로 봐준다는 걸 알았으니까 말이야<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王のえっちー」"
translation = "「마왕 야해─」"

[[dialogue]]
speaker_original = "プリムラ"
speaker_translation = "프리뮬러"
original = "「エッチなのじゃ」"
translation = "「야한 것이니라」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「エッチでいいの！\u3000にーにーはボクのカレシなんだから！」"
translation = "「야해도 돼！ 오빠는 내 남자친구니까！」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーも遠慮しないでいいからね。ほら、いつもみたいにボクにムラムラしていいよ<emoji=heart04>」"
translation = "「오빠도 사리지 않아도 되니까 말이야. 자, 평소처럼 나한테 야한 마음 가져도 돼<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ムラムラは……してない"
translation = "야한 마음은…… 안 가졌어"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「え～、そんな恥ずかしがらなくてもいいのに。でも、照れ屋さんなにーにーも、可愛くて好きだよ<emoji=heart04>」"
translation = "「에～, 그렇게 부끄러워하지 않아도 되는데. 하지만, 수줍어하는 오빠도, 귀여워서 좋아해<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「なーんちゃって。２人がボクのことどう思ってるかしらないけど、大人っぽいことだってしてるんだから」"
translation = "「장~난이지만. 둘이 나를 어떻게 생각하는지 모르겠지만, 어른스러운 것 정도는 하고 있으니까」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーも……いつものように、ボクのこと好きって言っていいんだよ」"
translation = "「오빠도…… 평소처럼, 나를 좋아한다고 말해도 된다구」"

[[dialogue]]
speaker = "unk"
original = "す、好きだよ、クーシェン"
translation = "좋, 좋아해, 쿠셴"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「うきゃあああ～～～<emoji=heart04>\u3000ボクもボクも！\u3000ボクもにーにーのことだーいすきっ<emoji=heart04>」"
translation = "「우꺄아아아～～～<emoji=heart04> 나도 나도！ 나도 오빠가 아~주 좋아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "こうしてクーシェンは結局、周りの目を気にせずのろけまくるのだった。"
translation = "이렇게 해서 쿠셴은 결국, 주변의 시선을 신경 쓰지 않고 자화자찬하며 닭살을 떨었던 것이었다."

