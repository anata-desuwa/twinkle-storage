[[dialogue]]
speaker = "unk"
original = "第４話,深く暗い洞の中でも,P"
translation = "제4화, 깊고 어두운 동굴 속에서도"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「こんばんは、会長さんっ。おひとりで居残り作業ですか？」"
translation = "「안녕하세요, 회장님. 혼자서 잔업 중이신가요?」"

[[dialogue]]
speaker = "unk"
original = "仕上げに悩んでいた書類に着手していると、どこからともなく、ハロウィン衣裳に身を包んだベアトリスが現れた。"
translation = "마무리에 고민하던 서류 작업에 착수하고 있자, 어디선가 할로윈 의상을 입은 베아트리스가 나타났다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふふ、吸血鬼は神出鬼没ですから。そして、今の私は吸血鬼でありながら、使い魔猫ちゃんなのです」"
translation = "「후후, 흡혈귀는 신출귀몰하니까요. 그리고, 지금의 나는 흡혈귀이면서, 사역마 고양이짱인 것입니다」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ほら、アニマルセラピーってあるじゃないですか？」"
translation = "「봐요, 애니멀 테라피라는 게 있지 않나요?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ペットをナデナデしたり、モフモフしたり、匂いを吸うと癒されるって言いますし……頑張ってる会長さんを癒してあげちゃいますニャンっ♪」"
translation = "「반려동물을 쓰다듬거나, 푹신푹신 만지거나, 냄새를 맡으면 힐링이 된다고 하고…… 열심히 일하는 회장님을 힐링해 줄게요 냥♪」"

[[dialogue]]
speaker = "unk"
original = "くんかくんかしていいのっ？"
translation = "킁킁 맡아도 돼?"

[[dialogue]]
speaker = "unk"
original = "なでたり、もふったりっ！"
translation = "쓰다듬거나, 푹신푹신 만지거나!"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「思ってたより限界だったニャンっ！？」"
translation = "「생각했던 것보다 한계였냥!?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えっと……あまり激しくしなければ、ＯＫです。優しくしてくださいニャン♪」"
translation = "「저기…… 너무 격하게 하지만 않으면, OK예요. 상냥하게 해주세요 냥♪」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ニャフン♪\u3000会長さんのナデナデ気持ちいいです……もう少し強めでも大丈夫ですよ」"
translation = "「냐흣♪ 회장님의 쓰다듬기 기분 좋아요…… 조금 더 세게 하셔도 괜찮아요」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぅ、んんっ……にゃふぅ……<emoji=heart04>\u3000私の髪、どうです……さらさら、ですか……？\u3000ありがとうございます、えへへ……<emoji=heart04>」"
translation = "「하아, 으응…… 냐후우……<emoji=heart04> 내 머리카락, 어때요…… 부드러운가요……? 감사합니다, 에헤헤……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んっ、ふぁぁ……つけ耳につけ尻尾なのに、触られてるとなんだかゾクゾクしちゃいますね……<emoji=heart04>」"
translation = "「응, 화아…… 가짜 귀랑 가짜 꼬리인데, 만져지고 있으니 어쩐지 오싹오싹해져 버리네요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あれ……？\u3000会長さん、もうナデナデは満足しちゃったんですか……？」"
translation = "「어라……? 회장님, 이제 쓰다듬는 건 만족해 버리신 건가요……?」"

[[dialogue]]
speaker = "unk"
original = "残りを一気に片づけるね！"
translation = "남은 걸 한꺼번에 해치울게!"

[[dialogue]]
speaker = "unk"
original = "充分癒されたから！"
translation = "충분히 힐링 받았으니까!"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、そうですよね。お仕事の邪魔しちゃったら、本末転倒ですもんねっ」"
translation = "「그, 그렇겠네요. 일에 방해가 되어버리면, 본말전도니까요」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもでも、私はイタズラ猫ちゃんなので～……会長さんのお膝に乗っちゃいますニャン♪」"
translation = "「하지만 하지만, 나는 장난꾸러기 고양이짱이니까~…… 회장님의 무릎에 앉아버릴 거예요 냥♪」"

[[dialogue]]
speaker = "unk"
original = "俺が座っている更にその上にベアトのお尻が乗っかり、幸せな重みがかかる。"
translation = "내가 앉아 있는 그 위에 베아트의 엉덩이가 올려져, 행복한 무게감이 실린다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「会長さんとくっつくの嬉しいニャン♪\u3000でもお仕事の邪魔になっちゃいますかニャ？」"
translation = "「회장님과 붙어있어서 기뻐요 냥♪ 하지만 일에 방해가 되어버릴까요 냥?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「……大丈夫？\u3000じゃあ、お膝の上から応援してあげますね。がんばれがんばれ、会長さんっ♪\u3000ニャンニャンニャンっ♪」"
translation = "「……괜찮아요? 그럼, 무릎 위에서 응원해 줄게요. 힘내라 힘내라, 회장님♪ 냥냥냥♪」"

[[dialogue]]
speaker = "unk"
original = "ベアトリスからの応援バフを受けながら、書類の残りを片づけ、ようやく仕事がひと段落した。"
translation = "베아트리스로부터 응원 버프를 받으면서, 남은 서류를 해치우고, 마침내 일이 일단락되었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「お疲れさまでした～。ところで会長さん、どんなお仕事をされて──あっ、もしかして、作ってた書類って私が見ちゃマズいヤツでした……？」"
translation = "「수고하셨습니다~. 그나저나 회장님, 무슨 일을 하고 계셨── 아, 혹시, 만들던 서류라는 거 제가 보면 안 되는 거였나요……?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「……え、これ、デネブに関する報告書？\u3000むしろ見てほしい？」"
translation = "「……에, 이거, 데네브에 관한 보고서? 오히려 봐주었으면 좋겠다고요?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そうですか、それじゃちょっとだけ拝見して～……ふむふむ、ふむふむ」"
translation = "「그런가요, 그럼 잠시만 봐서~…… 음음, 음음」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「──って、これ、デネブの良いところしか書いてないじゃないですか！」"
translation = "「──라니, 이거, 데네브의 좋은 점밖에 안 써있잖아요!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ちょっと贔屓しすぎかも……？\u3000だけど私のいる世界を褒めてもらえて、とっても嬉しいですっ」"
translation = "「조금 편애하는 걸지도……? 그렇지만 내가 있는 세계를 칭찬받아서, 너무너무 기뻐요」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「これからも交流して、お互いの世界を分かり合って、好きになれるといいですよねっ」"
translation = "「앞으로도 교류해서, 서로의 세계를 이해하고, 좋아할 수 있게 되면 좋겠네요」"

[[dialogue]]
speaker = "unk"
original = "俺はベアトともっと分かり合いたい"
translation = "나는 베아트와 더 깊이 이해하고 싶어"

[[dialogue]]
speaker = "unk"
original = "もちろん、世界同士もだけれど"
translation = "물론, 세계끼리도 그렇지만"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「え……？\u3000それって──」"
translation = "「에……? 그건──」"

[[dialogue]]
speaker = "unk"
original = "ベアト、俺の恋人になってくれないか"
translation = "베아트, 나의 연인이 되어주지 않을래"

[[dialogue]]
speaker = "unk"
original = "戦いが終わった後だから、やっと言えるよ"
translation = "싸움이 끝난 후니까, 겨우 말할 수 있어"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「え、え、ええっ……！？」"
translation = "「에, 에, 에엣……!?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「か、会長さんの気持ちは、とっても嬉しいですっ。私にはもったいないくらい、ありがたいです」"
translation = "「회, 회장님의 마음은, 너무너무 기뻐요. 저한테는 아까울 정도로, 감사해요」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でも、私はいつまでも光の当たる世界にはいられないんです」"
translation = "「하지만, 나는 언제까지고 빛이 드는 세계에 있을 수는 없어요」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「いずれは暗い洞窟に帰らないといけないから……」"
translation = "「언젠가는 어두운 동굴로 돌아가지 않으면 안 되니까……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「本当に、本当に嬉しいですけど、会長さんの告白を受けるわけにはいかないんです。ごめんなさ──」"
translation = "「정말로, 정말로 기쁘지만, 회장님의 고백을 받을 수는 없어요. 죄송해──」"

[[dialogue]]
speaker = "unk"
original = "洞窟でも２人一緒なら寂しくないよ？"
translation = "동굴이라도 둘이 함께라면 외롭지 않아"

[[dialogue]]
speaker = "unk"
original = "俺もついていくよ"
translation = "나도 따라갈게"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でも、それでも、私、長生きなんですよ？\u3000会長さんがお爺ちゃんになっても、私はずっとこの姿のままなんですよ？」"
translation = "「하지만, 그래도, 나, 장수한다고요? 회장님이 할아버지가 되어도, 나는 계속 이 모습 그대로라고요?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「それにずっとデネブとアルタイルが行き来できるとは限りません。もしかしたら会長さんが、アルタイルに帰れなくなるかも……」"
translation = "「게다가 계속 데네브와 알타일을 오갈 수 있다고는 장담할 수 없어요. 어쩌면 회장님이, 알타일로 돌아가지 못하게 될지도……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「それでも……いいんですか？」"
translation = "「그래도…… 괜찮은가요?」"

[[dialogue]]
speaker = "unk"
original = "一生、君の傍にいさせてください"
translation = "평생, 네 곁에 있게 해주세요"

[[dialogue]]
speaker = "unk"
original = "それでも──"
translation = "그래도──"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「……！」"
translation = "「……!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えへへ……そこまで言われたら、もう断れませんね」"
translation = "「에헤헤…… 거기까지 들으면, 더는 거절할 수 없겠네요」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私からもお願いします。これからも、ずっとずっと、私と一緒にいてくださいね！」"
translation = "「저로서도 부탁드릴게요. 앞으로도, 영원히 영원히, 나와 함께 있어주세요!」"

[[dialogue]]
speaker = "unk"
original = "俺はこの愛おしい吸血鬼に、この身が朽ちるまで愛を捧げることを誓った──"
translation = "나는 이 사랑스러운 흡혈귀에게, 이 몸이 썩어 문드러질 때까지 사랑을 바칠 것을 맹세했다──"

