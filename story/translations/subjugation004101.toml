[[dialogue]]
speaker = "unk"
original = "――とある平日の昼下がり。"
translation = "――어느 평일의 오후."

[[dialogue]]
speaker = "unk"
original = "大小様々な厄介事が押し寄せる新星学園星徒会だが、その日は珍しく平穏だった。"
translation = "크고 작은 온갖 성가신 일들이 밀려드는 신성 학원 학생회지만, 그날은 희한하게도 평화로웠다."

[[dialogue]]
speaker = "unk"
original = "平和だなぁ"
translation = "평화롭네"

[[dialogue]]
speaker = "unk"
original = "平和すぎてすることがないから、マトイ達には先に帰ってもらった。"
translation = "너무 평화로워서 할 일이 없었기에, 마토이 일행은 먼저 집으로 보냈다."

[[dialogue]]
speaker = "unk"
original = "たまにはこんな日があってもいい、などと考えていると……"
translation = "가끔은 이런 날이 있어도 좋겠지, 하고 생각하던 중……"

[[dialogue]]
speaker_original = "女生徒"
speaker_translation = "여학생"
original = "「た、大変です緋宮会長！\u3000アリーナに来て下さい！」"
translation = "「큰, 큰일이에요 히미야 회장님! 아레나로 와 주세요!」"

[[dialogue]]
speaker = "unk"
original = "……はい、平和終了。"
translation = "……네, 평화 끝."

[[dialogue]]
speaker = "unk"
original = "こうして、何事もない日常はあっけなく、いつもの刺激的な日常に戻るのだった。"
translation = "이렇게, 아무 일도 없던 일상은 허망하게, 평소처럼 자극적인 일상으로 돌아가는 것이었다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「あっ、にーにーだ！」"
translation = "「앗, 오빠다!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王！\u3000おまえも来たのか！」"
translation = "「마왕! 너도 온 거냐!」"

[[dialogue]]
speaker = "unk"
original = "アリーナに駆けつけると、当事者と思しき２名が拘束されていた。"
translation = "아레나로 달려가자, 당사자로 보이는 2명이 구속되어 있었다."

[[dialogue]]
speaker = "unk"
original = "クーシェンは孫悟空の生まれ変わりで、マリオンさんの案内で人間界にやって来た。現在は流星学園附属に通っている。"
translation = "쿠셴은 손오공의 환생으로, 마리온 씨의 안내로 인간계에 왔다. 현재는 유성 학원 부속에 다니고 있다."

[[dialogue]]
speaker = "unk"
original = "一方のアポロも戦闘好きで、２人は仲良く模擬戦をしていたということだが……"
translation = "한편 아폴로도 전투를 좋아해서, 두 사람은 사이좋게 모의전을 하고 있었다는 것 같지만……"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクは何も悪くないよ！\u3000アポロと戦ってただけだし」"
translation = "「난 아무것도 잘못 안 했어! 아폴로랑 싸웠을 뿐이라고」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そうだそうだー！\u3000ここを使う予約だってしてるしなっ」"
translation = "「맞아 맞아! 여길 쓰겠다고 예약도 해 뒀다고」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「なのにマリオンがボク達をグルグル巻きにしてさぁ」"
translation = "「그런데 마리온이 우리를 꽁꽁 묶어 버려서 말이지」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「ごきげんよう、会長様♪\u3000本日はお騒がせして申し訳ありません」"
translation = "「안녕하신가요, 회장님♪ 오늘 소란을 피워 죄송합니다」"

[[dialogue]]
speaker = "unk"
original = "２人を拘束したのは星見家メイド隊のマリオン・ネイマールさんだ。凄腕の人形遣いで、１０００体以上を同時に操ることが出来る。"
translation = "두 사람을 구속한 것은 호시미 가문 메이드대의 마리온 네이마르 씨다. 뛰어난 인형사로, 1000체 이상을 동시에 조종할 수 있다."

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「マリオンさんがいてくれて助かったわ。私１人じゃ姉さんとクーシェンさんの戦闘を止めきれなかったもの」"
translation = "「마리온 씨가 있어 줘서 다행이었어. 나 혼자서는 언니랑 쿠셴 씨의 전투를 다 막을 수 없었거든」"

[[dialogue]]
speaker = "unk"
original = "いったい何があったの？"
translation = "대체 무슨 일이 있었던 거야?"

[[dialogue]]
speaker = "unk"
original = "ただの模擬戦じゃないの？"
translation = "그냥 모의전 아니었어?"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「模擬戦自体は問題ないんですが、アリーナの利用時間を大幅にオーバーしていたので、他の利用者が使えずに困っていたんです」"
translation = "「모의전 자체는 문제없습니다만, 아레나 이용 시간을 대폭 초과했기에, 다른 이용자가 쓰지 못해 애를 먹고 있었어요」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「速やかに終了するようにフィオナお嬢様が再三警告しましたが、聞く耳持たずでしたので、強制的に拘束させて頂きました」"
translation = "「신속하게 종료하도록 피오나 아가씨께서 재삼 경고했습니다만, 듣는 척도 안 하셨기에, 강제적으로 구속했습니다」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「くっそー！\u3000こいつをほどけ～！\u3000バトルの決着がまだついてないんだからさぁ！」"
translation = "「젠장! 이것 좀 풀라고~! 배틀 결판이 아직 안 났단 말야!」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「うふふっ、駄目です♪」"
translation = "「우후후, 안 됩니다♪」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「……そっか、あたしはいけないことしちゃったのか……」"
translation = "「……그렇구나, 내가 나쁜 짓을 해 버린 건가……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「アポロ、なに反省しちゃってるのさ！\u3000ボクとのバトル、すっごく楽しかったでしょ？」"
translation = "「아폴로, 왜 반성하고 있는 거야! 나와 한 배틀, 엄청 즐거웠잖아?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「楽しかったけど、ルールは守んなきゃダメだ。悪役の怪人みたいなこと、あたしは絶対イヤだからな」"
translation = "「즐거웠지만, 룰은 지켜야만 해. 악당 괴인 같은 짓, 나는 절대 싫으니까」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「さすが姉さん……まさに正義のヒーローです」"
translation = "「역시 언니…… 그야말로 정의의 히어로예요」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「それに比べてクーシェン様は反省の色なしですね。そもそも悪いことをしたという認識がなさそうですけれど」"
translation = "「그에 비해 쿠셴 님은 반성의 기색이 없네요. 애초에 나쁜 짓을 했다는 인식 자체가 없어 보입니다만」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「彼女をこちらに連れてきたのは私ですから、責任を感じてしまいますね……」"
translation = "「그녀를 이쪽으로 데려온 것은 저니까, 책임감을 느껴 버리네요……」"

[[dialogue]]
speaker = "unk"
original = "指導してあげるのはどうかな？"
translation = "지도해 주는 건 어떨까?"

[[dialogue]]
speaker = "unk"
original = "マリオンさんが責任を持って"
translation = "마리온 씨가 책임을 지고"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「指導？\u3000それはつまり、星見家メイド隊として？」"
translation = "「지도? 그건 즉, 호시미 가문 메이드대로서?」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「うふふふふっ、会長様、ナイスアイデアです。これを機にクーシェン様にはお淑やかさを学んで頂きましょう」"
translation = "「우후후후후, 회장님, 나이스 아이디어입니다. 이번 기회에 쿠셴 님께는 얌전함을 배우게 하도록 하죠」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「大丈夫なの？\u3000うちのメイド隊の指導はかなりハードだって聞いてるんだけど」"
translation = "「괜찮은 거야? 우리 메이드대의 지도는 상당히 하드하다고 들었는데」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「問題ありません♪\u3000ハードでなければ星見家の名に恥じぬメイドにはなれませんから」"
translation = "「문제없습니다♪ 하드하지 않으면 호시미 가문의 이름에 부끄럽지 않은 메이드가 될 수 없으니까요」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「マリオンの顔が恐いってば！\u3000ほんとにボクをメイドにするつもり？\u3000そんなの絶対お断りだって！」"
translation = "「마리온 얼굴이 무섭다고! 진짜로 날 메이드로 만들 셈이야? 그런 건 절대 사절이라고!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「……あきらめるんだ、クーシェン。あたしは学んだんだ。うちのメイドがこうなったら、もう誰にも止められない」"
translation = "「……포기해라, 쿠셴. 나는 배웠어. 우리 메이드가 이렇게 되면, 이제 아무도 말릴 수 없어」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「アポロ？\u3000あっさり諦めちゃうのか？\u3000アポロ～～～～っ！」"
translation = "「아폴로? 그렇게 쉽게 포기해 버리는 거야? 아폴로~~~~!」"

[[dialogue]]
speaker = "unk"
original = "こうしてクーシェンは星見家メイド隊のハードな修行を受けることになるのだった。"
translation = "이렇게 쿠셴은 호시미 가문 메이드대의 하드한 수행을 받게 되는 것이었다."

[[dialogue]]
speaker = "unk"
original = "――数日後、星見家にて。"
translation = "――며칠 뒤, 호시미 가문에서."

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「来てくれてありがとうございます。発案者の緋宮会長には是非とも見届けて欲しかったので」"
translation = "「와 주셔서 감사합니다. 제안자이신 히미야 회장님께는 꼭 지켜봐 주셨으면 해서요」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「急ごしらえにしては、なかなかよく出来たと言えるでしょう」"
translation = "「급하게 준비한 것치고는, 제법 잘 되었다고 할 수 있겠네요」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「うふふふっ、出てきなさい、見習いメイドとしてのお披露目ですよ」"
translation = "「우후후후, 나오세요, 견습 메이드로서 선보일 시간이에요」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ま、待ってって。こんな格好で人前に出るの、恥ずかしいってば」"
translation = "「기, 기다리라니까. 이런 모습으로 남 앞에 나가는 거, 부끄럽다니까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「恥ずかしくないって！\u3000めちゃくちゃ似合ってるぞ！」"
translation = "「부끄럽지 않아! 엄청 잘 어울린다고!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「こら、押すなっ」"
translation = "「이봐, 밀지 마」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「な、なんだよー、変なもの見たって顔しちゃってさ～」"
translation = "「뭐, 뭐야~, 이상한 걸 봤다는 얼굴을 하고 말이야~」"

[[dialogue]]
speaker = "unk"
original = "すごく可愛い"
translation = "엄청 귀여워"

[[dialogue]]
speaker = "unk"
original = "クーシェンがメイドになってる"
translation = "쿠셴이 메이드가 되어 있어"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ちょっ、にーにー……もう、なに言ってんのさ」"
translation = "「잠깐, 오빠…… 정말, 무슨 말을 하는 거야」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「胸を張りなさい。臨時の見習いとはいえ、あなたも星見家メイド隊の一員ですよ」"
translation = "「가슴을 피세요. 임시 견습이라고는 하나, 당신도 호시미 가문 메이드대의 일원이에요」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「背筋が曲がっていると、余計にみっともなく見えるものです」"
translation = "「등이 구부정하면, 더욱 꼴사납게 보이는 법입니다」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ほら！\u3000こんな感じにすればいいんだぞ！」"
translation = "「자! 이런 느낌으로 하면 되는 거라고!」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「っっ！！！？\u3000ね、姉さん……」"
translation = "「읏!!!? 어, 언니……」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「あぁああっ<emoji=heart04>\u3000メイド姿の姉さん、とってもとっても可愛すぎますっ<emoji=heart04>」"
translation = "「아아아앗<emoji=heart04> 메이드 모습의 언니, 너무너무 귀여워요<emoji=heart04>」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「フィオナお嬢様、出てはいけないものが漏れてらっしゃいますよ？」"
translation = "「피오나 아가씨, 새어나오면 안 되는 것이 새어나오고 계시는데요?」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「……はっ、ご、ごめんなさい、姉さんのメイド服姿が可愛すぎて、つい我を忘れてしまったわ」"
translation = "「……앗, 미, 미안해, 언니의 메이드복 모습이 너무 귀여워서, 그만 제정신을 잃었네」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「こほん！\u3000改めて、クーシェンさんと姉さんには、これから星見家メイド隊の見習いとして、厳しい修行を受けて頂きます」"
translation = "「크흠! 새삼스럽지만, 쿠셴 씨와 언니에게는, 지금부터 호시미 가문 메이드대의 견습으로서 엄격한 수행을 받아 주시겠습니다」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「２人とも、しっかり励んで下さいね」"
translation = "「두 분 다, 열심히 힘써 주세요」"

[[dialogue]]
speaker = "unk"
original = "アポロもメイド修行するんだ？"
translation = "아폴로도 메이드 수행하는 거야?"

[[dialogue]]
speaker = "unk"
original = "クーシェンだけだと思ってたけど"
translation = "쿠셴뿐이라고 생각했는데"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そうだぞ！」"
translation = "「그렇다고!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「てっきりボクだけに与えられた罰だと思ってたんだけどね～」"
translation = "「틀림없이 나한테만 주어진 벌이라고 생각했는데 말이지~」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「それじゃふこーへーだろ？\u3000アリーナの時間を守んなかったのはあたしも同じだしな」"
translation = "「그러면 불공평하잖아? 아레나 시간을 안 지킨 건 나도 마찬가지고 말이야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そうかもしんないけど、嫌じゃないの？」"
translation = "「그럴지도 모르지만, 싫지 않아?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あはは、ちょびっと嫌だぞ。でも、修行は楽しみにしてる！」"
translation = "「아하하, 조금은 싫다고. 하지만, 수행은 기대하고 있어!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ふうん……ボクはそこまで割り切れないや。メイド修行なんて、つまんなそうだしね」"
translation = "「흐응…… 나는 거기까지 단념이 안 되네. 메이드 수행 같은 건 재미없어 보이고 말이야」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「やってみなきゃわかんないぞ！\u3000それに、つらい修行も２人でやれば頑張れそうだろ？」"
translation = "「해 보지 않으면 모른다고! 거기다 힘든 수행도 둘이서 하면 힘낼 수 있을 것 같잖아?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「それは……うん、そうかも。だから助かるよ。ありがと、アポロ」"
translation = "「그건…… 응, 그럴지도. 그러니까 고마워. 고마워, 아폴로」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「おう！\u3000一緒に頑張ろうな！」"
translation = "「오냐! 같이 힘내자고!」"

