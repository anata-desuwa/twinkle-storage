[[dialogue]]
speaker_original = "ゴースト"
speaker_translation = "ゴースト"
original = "「キャッキャッ！\u3000キャッキャッ！」"
translation = "「꺄하하! 꺄하하!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「この教室だけじゃないね。隣も、廊下も……学園中にお化けがたくさん。捕まえても捕まえてもキリがないや」"
translation = "「이 교실뿐만이 아니야. 옆반도, 복도도…… 학원 전체에 유령이 잔뜩. 잡고 잡아도 끝이 없네」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ミャーッ！？\u3000チョークで壁に落書きしてる！\u3000そんなところに書いたら怒られちゃうよー！」"
translation = "「먕!? 분필로 벽에 낙서하고 있어! 그런 데에 쓰면 혼난단 말이야ー!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んー？\u3000いろいろ描いてるけど、アレって何だろ？\u3000大きなカボチャ？」"
translation = "「음ー? 이것저것 그리고 있는데, 저건 뭘까? 커다란 호박?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ていうかジャクリーヌじゃない？\u3000彼女、ゴーストに変身するらしいし」"
translation = "「그보다 자클린 아니야? 그녀, 고스트로 변신한다고 들었고」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あ、ホントだ。よく見るとかわいい──ってそうじゃない！」"
translation = "「아, 진짜다. 자세히 보니 귀여워──가 아니라 그게 아니지!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「とりあえず、やめさせなきゃ！\u3000フニャーッ！\u3000イタズラはやめニャさーい！」"
translation = "「우선, 그만두게 해야 해! 냐아앗! 장난은 그만두라냥ー!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「その格好のベアトが怒っても迫力ないなー」"
translation = "「그 차림의 베아토가 화내도 박력 없네─」"

[[dialogue]]
speaker_original = "ゴースト"
speaker_translation = "ゴースト"
original = "「キャッキャッキャーーーッ！」"
translation = "「꺄하하하하앗!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「わぷっ！\u3000チョークの粉がー！\u3000げほげほっ！」"
translation = "「와펏! 분필 가루가ー! 쿨럭쿨럭!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「煙幕みたいに真っ白だね。聞き分けの良くない子は嫌いだよ」"
translation = "「연막처럼 새하얗네. 말 안 듣는 아이는 싫어해」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「説得しようにも止めようにも数が多すぎてキリがないし……片っ端から消す？」"
translation = "「설득하려고 해도 말리려고 해도 수가 너무 많아서 끝이 없고…… 하나부터 열까지 전부 지워버릴까?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ジャクリーヌさんのお友達だから、それはダメ～～～ッ！？」"
translation = "「자클린 씨의 친구들이니까, 그건 안 돼~~~!?」"

[[dialogue]]
speaker_original = "ゴースト"
speaker_translation = "ゴースト"
original = "「キャッキャッキャッ！\u3000キヒヒヒヒッ！」"
translation = "「꺄하하하! 키히히히히!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あ、また増えてる。こうなったら、元凶を先に捕まえるしかないかな」"
translation = "「아, 또 늘어났다. 이렇게 된 이상, 원흉을 먼저 잡는 수밖에 없으려나」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「元凶ってジャクリーヌさんのこと？」"
translation = "「원흉이라니 자클린 씨 말이야?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうそう。あのお化けの扱いは、ジャクリーヌの専売特許だろうし」"
translation = "「응응. 저 유령들을 다루는 건, 자클린의 전매특허일 테고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「学園中が落書きだらけになる前に、もう一度ジャクリーヌを見つけて、問いただした方がよさそうだね」"
translation = "「학원 전체가 낙서투성이가 되기 전에, 다시 한번 자클린을 찾아서 추궁해 보는 게 좋겠어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あ、見つけた」"
translation = "「아, 찾았다」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「ゆゆゆっ！？\u3000ハレンチな格好の女たちが余に迫ってくるのっ！？」"
translation = "「유유유!? 파렴치한 차림의 여자들이 짐에게 다가오는 거냐!?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「誰のせいでいやらしい格好になったと思ってるんですかニャンッ！？」"
translation = "「누구 때문에 야한 차림이 됐다고 생각하는 거냐냥!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「このゴーストたちを操ってるのは、あなたなんでしょ？\u3000大事になる前に引っ込めてよ」"
translation = "「이 고스트들을 조종하고 있는 건, 너지? 커지기 전에 거두어들여」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「このままじゃお掃除が大変になっちゃうよ～」"
translation = "「이대로라면 청소가 힘들어진다고요~」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「ち、違うの！\u3000ゴーストたちがヤンチャしてるのは、余のせいじゃないゆ！」"
translation = "「아, 아니야! 고스트들이 장난치고 있는 건, 짐 때문이 아니유!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「じゃ、誰のせい？」"
translation = "「그럼, 누구 때문인데?」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「あえて誰のせいかと問われたら、そこの猫娘のせいなの」"
translation = "「굳이 누구 때문이냐고 묻는다면, 거기 있는 고양이 소녀 때문인 거유」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ウニャーッ！？\u3000私、何もしてないですよーっ！」"
translation = "「우냐앗!? 나, 아무것도 안 했다고요ー!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトなわけないでしょ。ワケのわからないデタラメ言ってると──」"
translation = "「베아토일 리가 없잖아. 말도 안 되는 헛소리를 하면──」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「デタラメではないの！\u3000さっき猫娘からもらったミラクルＳＳＲお菓子によって、ハロウィンパワーがめいっぱいまで高まったゆ！」"
translation = "「헛소리가 아닌 거유! 아까 고양이 소녀에게 받은 미라클 SSR 과자로 인해, 할로윈 파워가 끝까지 높아진 거유!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ああ、あの虹色立方体？\u3000そんなに凄いパワーがあったんだ」"
translation = "「아아, 그 무지개색 정육면체? 그렇게 대단한 파워가 있었구나」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ええっ、あれただのお菓子だよ！？」"
translation = "「에엣, 그거 그냥 과자라고요!?」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「別世界のブツはそれだけで凄いパワーを秘めてるゆ」"
translation = "「다른 세계의 물건은 그것만으로도 엄청난 파워를 숨기고 있는 거유」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「あまりに強烈なパワーのおかげで魔界の門がデッカく繋がり、ゴーストたちがたっぷり現れてしまったゆ」"
translation = "「너무나 강력한 파워 덕분에 마계의 문이 커다랗게 연결되어, 고스트들이 잔뜩 나타나 버린 거유」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ニャるほど～……そう言われちゃったら、私のせいなのかもしれないです……」"
translation = "「냐아렇군~…… 그렇게 말해버리면, 내 탓일지도 모르겠네요……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトが責任感じることはないよ。悪いのは門を通ってきたお化けたちなんだから」"
translation = "「베아토가 책임감을 느낄 필요는 없어. 나쁜 건 문을 통해 온 유령들이니까」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「まーまー、慌てることはないゆ。このくらいのハプニング、ハロウィンではよくあることなの。日常チャメシ事ゆ」"
translation = "「자자, 당황할 필요는 없는 거유. 이 정도 해프닝은 할로윈에서 흔히 있는 일인 거유. 일상 다반사인 거유」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ハプニングのベテランですね……慌てなくても平気ニャんですか？」"
translation = "「해프닝의 베테랑이시네요…… 당황하지 않아도 괜찮은 거냐냥?」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「んゆ。今回は『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』が倒されて、リクリエが終わって、初めてのハロウィンゆ」"
translation = "「응유. 이번엔 『<ruby>XELOS<rt>제로스</rt></ruby>』가 퇴치되고, 리크리에가 끝나고, 첫 번째 할로윈인 거유」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「だからゴーストたちも嬉しすぎてはしゃいでるだけなの。仕方ないことゆ。満足すればイタズラもやめるゆ」"
translation = "「그래서 고스트들도 너무 기뻐서 들떠있을 뿐인 거유. 어쩔 수 없는 일인 거유. 만족하면 장난도 그만두는 거유」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「う～ん、気持ちはわかるかな……私もテンション上がっちゃってますしっ」"
translation = "「으~음, 기분은 알 것 같기도 하고…… 저도 텐션이 올라가 버렸고요!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「それならゴーストさんたちも一緒に楽しめるハロウィンパーティーにするっていうのはどうですか？」"
translation = "「그렇다면 고스트 씨들도 함께 즐길 수 있는 할로윈 파티로 만든다는 건 어떨까요?」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「どーゆーことゆ？」"
translation = "「무슨 소리인 거유?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あー……イタズラより楽しいイベントがあれば、お化けたちも早めに満足してくれるかもってこと？」"
translation = "「아─…… 장난보다 즐거운 이벤트가 있으면, 유령들도 일찍 만족해 줄지도 모른다는 뜻?」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「それはナイスアイデアなの♪\u3000み～んな、楽しいことに飢えてるゆ。もちろん余も含めてゆ」"
translation = "「그건 나이스 아이디어인 거유♪ 모~두, 즐거운 것에 굶주려 있는 거유. 물론 짐을 포함해서 거유」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「参加する人……霊？\u3000が増えれば、盛り上がること間違いなしだよ。ねっ♪」"
translation = "「참가하는 사람…… 영혼? 이 늘어나면, 흥겨워질 게 틀림없어요. 그죠♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「まあ……そうかな。そうかも。ベアトが言うなら、やらざるを得ないかな」"
translation = "「뭐…… 그렇히려나. 그럴지도. 베아토가 말한다면, 안 할 수가 없으려나」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「選管だけでパーティーするつもりだったけど……ま、パーティーってそういうものか」"
translation = "「선관끼리만 파티를 할 생각이었지만…… 뭐, 파티라는 건 그런 건가」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「トラブルとハプニングとアクシデントはイベントにはつきものだよ。仕方ないよねっ」"
translation = "「트러블과 해프닝과 악시던트는 이벤트에 빠질 수 없는 법이에요. 어쩔 수 없죠!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトも騒動に巻き込まれるのに慣れてるよね。すっかりベテランだ」"
translation = "「베아토도 소동에 휘말리는 데 익숙해졌네. 완전히 베테랑이야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふふっ、伊達に世界を超えてないニャ♪」"
translation = "「후후, 괜히 세계를 넘어온 게 아니라냥♪」"

