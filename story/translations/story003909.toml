[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「は～～っ、着いた～～っ！」"
translation = "「하~~앗, 도착했다~~앗!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ここまで来れば、もう大丈夫だね……セナリィ社長、危ないところを助けに来てくださって……本当にありがとうございます」"
translation = "「여기까지 오면, 이제 괜찮겠네요…… 세나리 사장님, 위험한 순간에 구하러 와 주셔서…… 정말 감사합니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ありがとうございます！\u3000あたしたちの絶体絶命ピンチに颯爽と駆けつけてくれるだなんて……」"
translation = "「감사합니다! 저희의 절체절명 위기에 늠름하게 달려와 주시다니……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「セナリィ社長がヒーローに見えました！\u3000ううん、いつもヒーローなんですけど！\u3000今日は特に、スーパーヒーローでした！」"
translation = "「세나리 사장님이 히어로로 보였어요! 아니, 항상 히어로지만요! 오늘은 특히, 슈퍼 히어로였어요!」"

[[dialogue]]
speaker_original = "セナリィ（覚醒）"
speaker_translation = "세나리(각성)"
original = "「そ、そうですの？\u3000ふふふ……♪」"
translation = "「그, 그렇습니까? 후후후……♪」"

[[dialogue]]
speaker_original = "セナリィ（覚醒）"
speaker_translation = "세나리(각성)"
original = "「──ではなく！\u3000社員の窮地を助けるのは、社長として当然の役目ですわ！」"
translation = "「──가 아니라! 사원의 궁지를 구하는 건, 사장으로서 당연한 의무입니다!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「でも、どうして私たちが九浄家にいることをご存じで──あっ、まさか……！」"
translation = "「하지만, 어떻게 저희가 쿠죠가에 있다는 걸 알고 계셨──앗, 설마……!」"

[[dialogue]]
speaker_original = "セナリィ（覚醒）"
speaker_translation = "세나리(각성)"
original = "「ふふふ、そのまさかですわ。でも、真相解明まで、もう少しお芝居に付き合ってくださいな」"
translation = "「후후후, 그 설마입니다. 하지만, 진상 해명까지, 조금만 더 연극에 맞춰주시지요」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「まさか……本当に新型の人工戦闘服の資料を入手するとは……」"
translation = "「설마…… 정말로 신형 인공 전투복 자료를 입수할 줄이야……」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「あら、まるで我々を信用していなかったかのような物言いですわね？」"
translation = "「어머, 마치 저희를 믿지 않았던 것 같은 말투네요?」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「と、とんでもない。いやいや、さすがは依頼達成率１００％！\u3000聞きしに勝るゴールデングースだな！」"
translation = "「당, 당치도 않소. 아니아니, 과연 의뢰 달성률 100%! 소문으로 듣던 것 이상이군, 골든 구스!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「ええ、ウチの可愛い社員たちが見事にやってのけましたわ。ですが──」"
translation = "「예, 우리 귀여운 사원들이 멋지게 해내 주었습니다. 하지만──」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「今回のご依頼、想定以上に経費がかさんでしまいましたの」"
translation = "「이번 의뢰, 상이상으로 경비가 많이 들어버렸거든요」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「はは、多少足が出るくらい構わん、構わん」"
translation = "「하하, 약간 초과하는 정도는 상관없소, 상관없어」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「まあ、景気がよろしくて羨ましい限りですわ。では、こちらが潜入調査に用いた諸経費の請求書です」"
translation = "「뭐, 경기가 좋으셔서 부러울 따름이네요. 그럼, 이쪽이 잠입 조사에 쓰인 경비 청구서입니다」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「なに……ん、んん？\u3000いち、じゅー、ひゃく、せん、まん、お──こ、これは何の冗談だね！？」"
translation = "「뭐라…… 음, 음음? 일, 십, 백, 천, 만, 억──이, 이건 무슨 장난인가!?」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「ジョークなど書かれてませんわよ。そこの数字が、当社からの請求額」"
translation = "「농담 같은 건 적혀있지 않아요. 거기 있는 숫자가, 당사로부터의 청구액」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「また、そちらの情報不足により、ウチの可愛い社員が危険な目に遭わされた手当コミコミのお値段となっていますわ」"
translation = "「또한, 그쪽의 정보 부족으로 인해, 우리 귀여운 사원이 위험한 꼴을 당한 수당이 싹 다 포함된 가격으로 되어 있답니다」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「待て待て待て！\u3000最初に見積もった報酬の１０００倍だぞ！？」"
translation = "「기다려 기다려 기다려! 처음에 견적 낸 보수의 1000배라고!?」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「それだけの価値がある情報ではありませんの？\u3000五名門・九浄家の門外不出の機密情報、これでもお安くしたつもりなのですけど」"
translation = "「그만한 가치가 있는 정보가 아니던가요? 오명가·쿠죠가의 문외불출 기밀 정보, 이래 봬도 싸게 해드린 작정입니다만」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「ふ、ふ、ふざけるのもいい加減にしろ！\u3000こんな馬鹿げた金額なんて払えるものか！」"
translation = "「장, 장, 장난치는 것도 적당히 해라! 이런 터무니없는 금액 따위를 줄 수 있을 것 같으냐!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「あら、それは残念。では、今回のお話はなかったということで。無駄足を踏まされたおかげで、大赤字ですわね。困ってしまいます」"
translation = "「어머, 그건 아쉽네요. 그럼, 이번 이야기는 없었던 걸로. 헛걸음을 한 덕분에, 대적자네요. 난감해라」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「き、貴様……我々を馬鹿にしているのか？」"
translation = "「네, 네놈…… 우리를 놀리는 거냐?」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「私たちを馬鹿にしていたのはそちらでしょう？\u3000ウチの可愛い社員を<ruby>囮<rt>デコイ</rt></ruby>に使おうだなんて小癪な真似を」"
translation = "「우리를 놀린 건 그쪽이잖아요? 우리 귀여운 사원을 <ruby>미끼<rt>디코이</rt></ruby>로 쓰려고 하다니 건방진 짓을」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「そもそも九浄家のお屋敷に、危険をはらんだ新たな人工戦闘服など存在していない──ですわよね？」"
translation = "「애초에 쿠죠가의 저택에, 위험을 품은 새로운 인공 전투복 따위 존재하지 않는다──죠?」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「なっ……い、いや、そんなこと、は──」"
translation = "「뭣…… 아니, 그런 건──」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「あなた方の組織が目論んでいたのは、第三者に騒ぎを起こさせ、その隙に本命の人工戦闘服の情報の保管場所へ潜入部隊を派遣する作戦」"
translation = "「당신네 조직이 노린 건, 제3자에게 소란을 일으키게 하고, 그 사이에 진짜 목표인 인공 전투복 정보 보관 장소로 침투 부대를 파견하는 작전」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「つまり、ウチのヒマワリとミウを捨て石として利用した──ホンット舐められたものですわ」"
translation = "「즉, 우리 히마와리와 미우를 버림수로 이용했다──진~짜 얕보인 모양이네요」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「ふ、ふふ、ははは！\u3000そこまで見通しているならば、お前たちは既に用済みだということも分かっているな？」"
translation = "「후, 후후, 하하하! 거기까지 간파하고 있다면, 너희는 이미 쓸모가 없어졌다는 것도 알고 있겠지?」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「今頃、我々の組織の潜入部隊が作戦を完遂している頃だ。そうなれば、お前たちも──」"
translation = "「지금쯤, 우리 조직의 잠입 부대가 작전을 완수했을 때다. 그렇게 되면, 너희도──」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「にひひ♪\u3000それはどうかな～？」"
translation = "「니히히♪ 과연 그럴까나~?」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「ここまでバレバレなのに、まだ潜入作戦が成功すると思ってるなんてさ。おじさんたちの頭、お花畑すぎな～い？」"
translation = "「여기까지 다 들통났는데, 아직도 잠입 작전이 성공할 거라 생각하다니. 아저씨들 머릿속, 너무 꽃밭 아니~야?」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「潜入工作や暗殺に長けた精鋭中の精鋭だぞ！\u3000お前ら如き小娘に──」"
translation = "「잠입 공작이나 암살에 능한 정예 중의 정예다! 너희 따위 계집애들에게──」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「九浄家ナメすぎ～。あそこを守ってるのって軍隊並みの戦力だからね？」"
translation = "「쿠죠가 너무 얕보네~. 거기 지키고 있는 건 군대급 전력이라고?」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「あ、シアン先輩からの報告～。潜入部隊は全滅。アジトも別部隊に制圧されて、全員捕縛だって～」"
translation = "「아, 시안 선배한테 온 보고~. 잠입 부대는 전멸. 아지트도 다른 부대에게 제압되어서, 전부 포획이래~」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「バ、バカな……！？」"
translation = "「바, 바보 같은……!?」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「ほら、おじさん見てよ、この縛られてる人、情けなくて傑作でしょ～？\u3000この顔に見覚えな～い？」"
translation = "「봐봐, 아저씨 이것 좀 봐, 이 묶여있는 사람, 한심해서 걸작이지~? 이 얼굴 본 적 없어~?」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「あっ、ああ……！\u3000全てお見通しだったというわけか……貴様ら、いつから……！」"
translation = "「앗, 아아……! 전부 꿰뚫어 보고 있었다는 뜻인가…… 네놈들, 언제부터……!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「最初も最初。あなたがヒマワリとミウに依頼をするよりも前から筒抜けでしたわよ？」"
translation = "「처음 중의 처음. 당신이 히마와리와 미우에게 의뢰를 하기 전부터 훤히 새어 나가고 있었답니다?」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「そもそもの大失敗は、私たちを小娘と侮ったこと。覚悟はよろしくて？」"
translation = "「애초에 대실패는, 우리를 꼬맹이라고 얕본 것. 각오는 되셨겠죠?」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「セナリィ、ちょい待ち☆」"
translation = "「세나리, 잠깐 대기☆」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「なんですの、マイン。いいところなのに水を差さないでくださいな」"
translation = "「무슨 일인가요, 마인. 좋은 타이밍인데 찬물 끼얹지 말아 주세요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いいえ、ここはあえて水を差させていただきますわ」"
translation = "「아니요, 여기는 감히 찬물을 끼얹도록 하겠어요」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「エルデリーゼ様！？」"
translation = "「엘데리제 님!?」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「エルデ──ということは……あんたは、桜十路の御令嬢っ……！？」"
translation = "「엘데──라니 그 말은…… 당신, 사쿠라쥬지의 영애……!?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヒマワリ様とミウ様を捕まえようと追いかけていたら、ここに辿り着いてしまったのですけど……」"
translation = "「히마와리 님과 미우 님을 잡으려고 쫓어가다 보니, 여기에 다다르고 말았습니다만……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ここがゴールデングースの本拠地でお間違いありませんの？」"
translation = "「여기가 골든 구스의 본거지가 틀림없으신가요?」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「そ、そうです、間違いありません！\u3000こ奴らが九浄家から盗みを働き──」"
translation = "「그, 그렇습니다, 틀림없습니다! 이 자들이 쿠죠가에서 도둑질을 저질러──」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いいえ、お話は全て聞かせてもらいましたわ」"
translation = "「아니요, 이야기는 전부 들었습니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「つまり、こちらの方々が諸悪の根源ということですわね？」"
translation = "「즉, 이쪽 분들이 만악의 근원이라는 말씀이시군요?」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「ひっ！？」"
translation = "「힉!?」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「そうそう、こいつらが悪い奴ら～☆\u3000プスッとヤッちゃって♪」"
translation = "「그래그래, 이 녀석들이 나쁜 녀석들~☆ 푹 하고 해치워버려♪」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いたいけなヒマワリ様とミウ様はこの人たちに騙されて……何も悪くなかったのですわね……！」"
translation = "「애처로운 히마와리 님과 미우 님은 이 사람들에게 속아서…… 아무런 잘못도 없었던 것이군요……!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「それなのに私……私……！\u3000怒りマックスですわーっ！」"
translation = "「그런데도 저는…… 저는……! 분노가 맥스입니다─!」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「くっ……ふざけた格好しやがって……！」"
translation = "「큭…… 장난치는 듯한 차림새나 하고선……!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「これっぽっちもふざけてなどいませんですわ！\u3000メイドをバカにする者は、メイドに泣くがいいですわー！」"
translation = "「조금도 장난치고 있지 않습니다! 메이드를 바보 취급하는 자는, 메이드에게 눈물 흘리는 게 좋을 거예요─!」"

[[dialogue]]
speaker_original = "依頼人Ａ・Ｂ"
speaker_translation = "依頼人Ａ・Ｂ"
original = "「う、わあぁあぁぁぁぁっ！」"
translation = "「으, 와아아아아아앗!」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「わ～ぉ、１人でやっつけちゃったね～」"
translation = "「와~우, 혼자서 해치워버렸네~」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「人工戦闘服を完璧に使いこなしていましたわね……メイドに対しての理解を深めたから……かしら？」"
translation = "「인공 전투복을 완벽하게 습득해서 사용하고 있었군요…… 메이드에 대한 이해를 깊게 했기 때문……일까요?」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「ボロ雑巾のこいつらはウチで片づけるんで、セナリィ、まったね～☆」"
translation = "「걸레짝이 된 이 녀석들은 우리 쪽에서 치울 테니까, 세나리, 또 봐~☆」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「まったく、マインはいつも美味しいとこだけ掻っ攫っていきますわね……」"
translation = "「정말이지, 마인은 항상 맛있는 부분만 쏙 가로채 간다니까요……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あの……社長、これで終わったんですか？」"
translation = "「저기…… 사장님, 이걸로 끝난 건가요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「今回の件、全てご存じだったんですね」"
translation = "「이번 건, 전부 알고 계셨던 거군요」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「ええ、そもそも今回の件は、最初に九浄家から依頼がありましたの」"
translation = "「네, 애초에 이번 건은 처음에 쿠죠가로부터 의뢰가 있었습니다」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「人工戦闘服の秘密を狙う犯罪組織があり、その撲滅を計画しているので協力してほしい、と」"
translation = "「인공 전투복의 비밀을 노리는 범죄 조직이 있어, 그 박멸을 계획하고 있으니 협력해 달라고요」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「意図的に偽の情報を漏らすことで、近い内にゴールデングースに九浄家への潜入調査の依頼が来るはず」"
translation = "「의도적으로 가짜 정보를 흘림으로써, 조만간 골든 구스에 쿠죠가로의 잠입 조사 의뢰가 올 터」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「なので、何も知らない体でそれを受けて欲しい、と」"
translation = "「그러니 아무것도 모르는 척 그것을 받아주었으면 한다고요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「私たちが九浄家に潜入捜査しているように見せかけつつ、裏では依頼主の組織について調査を行っていた……と」"
translation = "「우리가 쿠죠가에 잠입 수사를 하고 있는 것처럼 보이게 하면서, 뒤에서는 의뢰인 조직에 대해 조사를 진행하고 있었다……는 거군요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「それでセキュリティがチョロくて、簡単に忍びこめたんだー！\u3000おかしいとは思ったんだよねー」"
translation = "「그래서 보안이 허술해서 쉽게 들어갈 수 있었던 거구나─! 이상하다고 생각했단 말이지─」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「九浄家のセキュリティレベルは世界でも最高峰ですわ。本気になったら猫の子一匹、壁を越えることすらできませんわよ？」"
translation = "「쿠죠가의 보안 수준은 세계에서도 최고봉이에요. 마음만 먹으면 고양이 새끼 한 마리, 담을 넘는 것조차 못 한다고요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「変だとは思っていたんです……もっと早く気付くべきでした……」"
translation = "「이상하다고는 생각했어요…… 더 일찍 눈치챘어야 했는데……」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「あなたたちが九浄家で働いている間に、敵方の作戦の詳細を把握し──」"
translation = "「당신들이 쿠죠가에서 일하는 동안, 적 측의 작전 상세를 파악하고──」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「アジトの在り処を突き止めたところで、あなたたちが騒ぎを起こすように誘導」"
translation = "「아지트의 위치를 밝혀낸 시점에서 당신들이 소동을 일으키도록 유도」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ヘレナさんの部屋に簡単に入れたのもそういう事だったんですね……ってことは、あの時取ったデータも……」"
translation = "「헬레나 씨의 방에 쉽게 들어갈 수 있었던 것도 그런 이유 때문이었군요…… 그렇다는 건, 그때 빼돌린 데이터도……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ダミーってことだよね……はぁぁ……どんどん自信がなくなっていきます……」"
translation = "「더미라는 거네…… 하아아…… 점점 자신감이 없어집니다……」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「あなたたちが期待通りに動いてくれたおかげで、犯罪組織も行動を起こした。それを待ち構えて、組織もろとも一網打尽にする、という作戦──」"
translation = "「당신들이 기대대로 움직여준 덕분에 범죄 조직도 행동을 개시했다. 그것을 기다렸다가 조직째 일망타진한다, 라는 작전──」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「見事、大成功！\u3000九浄家からの報酬もガッポガッポですわー！」"
translation = "「멋지게 대성공! 쿠죠가로부터 받은 보수도 짭짤하다고요─!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「とまぁ、結果オーライでしたけど、勇み足で勝手に依頼を受けたのはマイナス査定ですわね」"
translation = "「뭐, 결과 오라이였지만, 조급하게 마음대로 의뢰를 수락한 건 감점 대상이에요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「う……ごめんなさい……」"
translation = "「으…… 죄송해요……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「申し訳ありません……でも、何も知らない私たちが上手くやれていなかったら、途中でプランが崩壊していたのでは……？」"
translation = "「죄송합니다…… 하지만 아무것도 모르는 저희가 잘 해내지 못했다면 중간에 플랜이 붕괴하지 않았을까요……?」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「その時はその時でフレキシブルに対応しましたわ。実際、プランの変更は何度もおこなわれていましたの。あなたたちが想定していたよりも優秀だったお陰でね」"
translation = "「그땐 그때대로 유연하게 대응했어요. 실제로 플랜 변경은 몇 번이고 이루어졌는걸요. 당신들이 예상했던 것보다 우수했던 덕분에 말이죠」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「まったく……黙って依頼を受けたりせず、ちゃんと私に相談していれば満点でしたのに。会社組織では報・連・相が大事と教えてきましたわよね？」"
translation = "「정말이지…… 얌전히 의뢰를 받지 않고, 나한테 제대로 상담했다면 만점이었을 텐데. 회사 조직에서는 보고·연락·상담이 중요하다고 가르쳐왔죠?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はい……次からは気をつけます」"
translation = "「네…… 다음부터는 조심할게요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「反省です……」"
translation = "「반성하겠습니다……」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「でも、あなたたちはちゃんと仕事をしてくれた。私の元でちゃんと成長してくれてるのを実感しました。とても嬉しく思いますわ」"
translation = "「하지만 당신들은 제대로 일을 해주었어요. 내 밑에서 제대로 성장해주고 있다는 걸 실감했습니다. 아주 기쁘게 생각해요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「し、社長～～っ！\u3000ありがとうございます！」"
translation = "「사, 사장님~~! 감사합니다!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「やっぱり私たちにはセナリィ社長が必要不可欠です！」"
translation = "「역시 저희에게는 세나리 사장님이 없어서는 안 돼요!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "（ヒマワリとミウの勇み足も、ヘレナ様の計算の内だったそうですけど……）"
translation = "（히마와리와 미우의 조급한 행동도 헬레나 님의 계산 안이었던 모양이지만……）"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "（あの方の掌の上で踊らされているようではまだまだ未熟ですわね。もっと成長していただきませんと）"
translation = "（그분의 손바닥 위에서 놀아나고 있는 걸 보면 아직 한참 미숙하네요. 더 성장해 주셔야겠어요）"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あのー……ご指導は終わりましたですの？」"
translation = "「저기─…… 지도는 끝나셨나요?」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「ええ。エルデリーゼ様、協力してくださってありがとうございます」"
translation = "「네. 엘데리제 님, 협력해 주셔서 감사합니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「私、事情を全然知りませんでしたの！\u3000でも、とってもドキドキしましたの」"
translation = "「저는 사정을 전혀 몰랐답니다! 그렇지만 아주 두근두근했어요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヒマワリ様にミウ様、事情も知らず、思いっきり攻撃を仕掛けてしまい申し訳ありませんでしたわ」"
translation = "「히마와리 님, 미우 님, 사정도 모르고 마음껏 공격을 가해버려서 죄송했습니다」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それはお互いさまです。私たちも何も知らなかったですし」"
translation = "「그건 서로 마찬가지예요. 저희도 아무것도 몰랐고요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「こっちこそごめんなさいっ！\u3000へへ……なんか今回のあたしたち、謝ってばっかだね」"
translation = "「이쪽이야말로 미안해! 헤헤…… 어쩐지 이번의 우리, 사과만 하고 있네」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「では、仲直りの印として……私とお友達になっていただけませんか？」"
translation = "「그럼 화해의 화해의 표시로…… 저와 친구가 되어주지 않으시겠어요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はいっ！\u3000もちろん、喜んでですっ♪」"
translation = "「응! 물론, 기꺼이♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「これからもよろしくお願いします、エルデリーゼ先輩」"
translation = "「앞으로 잘 부탁드립니다, 엘데리제 선배」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「ふう……これにて一件落着、ですわね」"
translation = "「후우…… 이걸로 사건 해결, 이네요」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「さすがにゴールデングースを抜けて、九浄家で働く、という流れになった時は驚きましたけど」"
translation = "「역시나 골든 구스를 나가서 쿠죠가에서 일한다, 라는 흐름이 되었을 때는 놀랐지만요」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「ずいぶん心配してたもんね～、２人が本当に九浄家に引き抜かれるんじゃないかって」"
translation = "「엄청 걱정했었잖아~, 둘이 진짜로 쿠죠가에 스카우트되는 거 아닌가 하고」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「マイン！？\u3000帰ったんじゃなかったんですの！？\u3000余計なことは言わなくて結構ですわ！」"
translation = "「마인!? 돌아간 게 아니었나요!? 쓸데없는 말은 안 하셔도 돼요!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「まさか私たちが社長を裏切るわけないじゃないですか」"
translation = "「설마 저희가 사장님을 배신할 리가 없잖아요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「これからもずっと社長についていきます！」"
translation = "「앞으로도 계속 사장님을 따라가겠습니다!」"

[[dialogue]]
speaker = "unk"
original = "社員同士の結束が、より強固なものとなった秘密結社ゴールデングース。"
translation = "사원들 사이의 결속이 더욱 강고해진 비밀결사 골든 구스."

[[dialogue]]
speaker = "unk"
original = "発展途上な金の卵を抱えるゴールデングースの未来は、希望の光で輝いている。"
translation = "발전 도상인 황금 알을 품은 골든 구스의 미래는 희망의 빛으로 반짝이고 있다."

