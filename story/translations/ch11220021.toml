[[dialogue]]
speaker = "unk"
original = "第１話,２つのゲージ,P"
translation = "제1화, 2개의 게이지"

[[dialogue]]
speaker = "unk"
original = "――それは、クーシェンがメイド修行を始めるより前のこと。"
translation = "──그것은, 쿠셴이 메이드 수련을 시작하기 전의 일."

[[dialogue]]
speaker = "unk"
original = "遊園地デートを楽しんだ俺たちは、もっと仲良くなる……そのはずだった。"
translation = "놀이공원 데이트를 즐긴 우리들은, 더욱 사이가 좋아질…… 예정이었다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「この前から、なんかムズムズする……もう、なんなの、これぇ」"
translation = "「얼마 전부터, 왠지 간질간질해…… 정말, 뭐야, 이거어」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「いつもなら、バトルしたらスカッとするのに、全然スカッとしないし……」"
translation = "「평소라면, 배틀하고 나면 뻥 뚫리는데, 전혀 뻥 뚫리지도 않고……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「………………にーにー……」"
translation = "「………………오빠……」"

[[dialogue]]
speaker = "unk"
original = "呼んだ？"
translation = "부 불렀어？"

[[dialogue]]
speaker = "unk"
original = "クーシェン？"
translation = "쿠셴？"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ぴゃあっ！！？」"
translation = "「꺄악！！？」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにー！？\u3000い、い、いきなりなんなの！\u3000ビックリしたでしょ！」"
translation = "「오빠！？ 갑, 갑, 갑자기 뭐야！ 놀랐잖아！」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「不意打ちするなんてヒキョーだぞ！\u3000ボクと勝負したいなら、正面から来てよね！」"
translation = "「기습하다니 치사하다구！ 나와 승부하고 싶다면, 정면에서 오라구！」"

[[dialogue]]
speaker = "unk"
original = "模擬戦でもしようか"
translation = "모의전이라도 할까"

[[dialogue]]
speaker = "unk"
original = "じゃあせっかくだし"
translation = "그럼 모처럼이니까"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「え！？\u3000ボクとバトルしてくれるの？\u3000にーにーってば、いつも忙しいから誘ってもあんま乗ってくれなかったのに」"
translation = "「에！？ 나랑 배틀해 주는 거야？ 오빠는 매일 바쁘니까 청해도 잘 응해주지 않았는데」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「あ、でも……やっぱ今日はなしで。この前からボク、なんか調子悪いんだよね」"
translation = "「아, 하지만…… 역시 오늘은 안 할래. 얼마 전부터 나, 왠지 컨디션이 안 좋단 말이지」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ケガとか病気じゃないから、心配しないでよ。ていうか、今ボクのおでこ触ろうとしたでしょ？\u3000熱なんてないからね」"
translation = "「다치거나 병에 걸린 건 아니니까, 걱정하지 마. 그보다, 지금 내 이마에 손대려고 했지？ 열 같은 건 없으니까 말이야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「もう、にーにーってば心配性だなぁ。そんなにボクのことが気になるの？」"
translation = "「정말, 오빠는 걱정이 너무 많다니까. 그렇게 내가 신경 쓰여？」"

[[dialogue]]
speaker = "unk"
original = "当たり前だろ"
translation = "당연하잖아"

[[dialogue]]
speaker = "unk"
original = "気になるよ"
translation = "신경 쓰여"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そ、そーなんだ……もう、相変わらずやさしいんだから。でも……ありがと。気にしてくれて、うれしかった」"
translation = "「그, 그렇구나…… 정말, 여전히 상냥하다니까. 하지만…… 고마워. 신경 써줘서, 기뻤어」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ううっ、またおっぱいのとこがムズムズしてきた……なんなの、これ……ほんと迷惑なんだけど」"
translation = "「으으, 또 가슴 쪽이 간질간질해졌어…… 뭐야, 이거…… 진짜 민폐라구」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「……はっ！\u3000もしかして、おっぱいが進化しかかってるとか？\u3000ボクの『大人ゲージ』が貯まってきた証拠なのかも」"
translation = "「……앗！ 혹시, 가슴이 진화하려는 건가？ 내 『어른 게이지』가 쌓여간다는 증거일지도」"

[[dialogue]]
speaker = "unk"
original = "『大人ゲージ』とはクーシェンが提唱する『謎ゲージ理論』である。"
translation = "『어른 게이지』란 쿠셴이 제창하는 『수수께끼의 게이지 이론』이다."

[[dialogue]]
speaker = "unk"
original = "大人ゲージが貯まっていくことによって身体の成長──おっぱいが大きくなると信じているらしい。"
translation = "어른 게이지가 쌓여감에 따라 신체의 성장──가슴이 커진다고 믿고 있는 모양이다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「せーちょーつう、ってやつ？\u3000そういうの聞いたことある」"
translation = "「성장통, 이라는 거？ 그런 거 들어본 적 있어」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「やった！\u3000これでボクもボンキュッボンになっちゃうぞ～！」"
translation = "「나이스! 이걸로 나도 빵빵해져 버린다구～！」"

[[dialogue]]
speaker = "unk"
original = "この時のクーシェンは、いつもの元気を取り戻したように見えた。"
translation = "이때의 쿠셴은, 평소의 활기를 되찾은 것처럼 보였다."

[[dialogue]]
speaker = "unk"
original = "しかし、それは１日も経たずに覆されることになる。"
translation = "하지만, 그것은 하루도 지나지 않아 뒤엎어지게 된다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにー、助けて！」"
translation = "「오빠, 도와줘！」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「夜なのに来ちゃってごめん。でもボク、あれからもっとおかしくなって……」"
translation = "「밤인데 찾아와서 미안해. 하지만 나, 그때부터 더 이상해져서……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「大人に進化するのかなってウキウキしてたけど、全然進化しないし、それどころかおっぱいのところがもっとギュ～～ってなって……」"
translation = "「어른으로 진화하려나 하고 신나 있었는데, 전혀 진화하지 않고, 도리어 가슴 쪽이 더 꽉～～ 죄어와서……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクを助けてくれるのはにーにーしかいないって……来ちゃったけど……」"
translation = "「나를 도와줄 사람은 오빠밖에 없다고…… 와버렸지만……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ううっ、走ってきたせいかなぁ、またおっぱいがバクハツしそうになってきた……ボク、このままハレツして死んじゃうのかなぁ」"
translation = "「으으, 뛰어온 탓인가, 또 가슴이 폭발할 것처럼 됐어…… 나, 이대로 터져서 죽는 걸까나」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「普通にしてたらおっぱいもギュッてならないんだよ。でもね……この前の遊園地デートのこと、思い出すと苦しくなってきて……」"
translation = "「가만히 있으면 가슴도 꽉 죄이지 않는다구. 하지만 말이지…… 얼마 전 놀이공원 데이트했던 거, 떠올리면 괴로워져서……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「今も、にーにーの顔を見てると、おんなじ風になっちゃって……ボクどうすればいいかわかんないよ……」"
translation = "「지금도, 오빠 얼굴을 보고 있으면, 똑같이 되어버려서…… 나 어떻게 해야 할지 모르겠어……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「きっとこれは大人ゲージを貯める前に、『好きゲージ』を貯めなきゃいけないっていうルールを破ったボクへの罰なんだ……」"
translation = "「분명 이건 어른 게이지를 모으기 전에, 『좋아 게이지』를 모아야 한다는 룰을 어긴 나한테 주는 벌인 거야……」"

[[dialogue]]
speaker = "unk"
original = "クーシェンによると、本来は大人ゲージが貯まった後に、好きゲージが貯まっていくものらしい。"
translation = "쿠셴에 따르면, 본래는 어른 게이지가 쌓인 후에, 좋아 게이지가 쌓여가는 모양이다."

[[dialogue]]
speaker = "unk"
original = "けれどクーシェンは大人ゲージを貯めきっていないのに、俺のことを意識してしまったため、好きゲージがどんどん貯まり始めてしまっている。"
translation = "하지만 쿠셴은 어른 게이지를 다 채우지 않았는데, 나를 의식해 버렸기 때문에, 좋아 게이지가 점점 쌓이기 시작해 버리고 있다."

[[dialogue]]
speaker = "unk"
original = "だからこんなにも胸が苦しくなってしまうのだ──と、そう思っているようだ。けれど……"
translation = "그래서 이렇게나 가슴이 괴로워져 버리는 것이다──라고, 그렇게 생각하는 것 같다. 하지만……"

[[dialogue]]
speaker = "unk"
original = "恋をすると誰しもが経験するものだよ"
translation = "사랑을 하면 누구나 경험하는 거야"

[[dialogue]]
speaker = "unk"
original = "その苦しさは罰じゃない"
translation = "그 괴로움은 벌이 아니야"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そうなの？\u3000みんな、こんな苦しい思いをしてるの？」"
translation = "「그래？ 다들, 이런 괴로운 생각을 하고 있는 거야？」"

[[dialogue]]
speaker = "unk"
original = "俺もクーシェンを想うと胸が苦しい"
translation = "나도 쿠셴을 생각하면 가슴이 괴로워"

[[dialogue]]
speaker = "unk"
original = "そうだよ"
translation = "그래"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「え？\u3000にーにーも？」"
translation = "「에？ 오빠도？」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そっか、おんなじなんだ……にーにーも進化する前にボクへの好きゲージが貯まり始めちゃったんだね」"
translation = "「그렇구나, 똑같았구나…… 오빠도 진화하기 전에 나에 대한 좋아 게이지가 쌓이기 시작했던 거구나」"

[[dialogue]]
speaker = "unk"
original = "俺の好きゲージはもうＭＡＸだけどね"
translation = "내 좋아 게이지는 이미 MAX지만 말이야"

[[dialogue]]
speaker = "unk"
original = "貯まり始めちゃったどころか……"
translation = "쌓이기 시작한 정도가 아니라……"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ええっ！？\u3000もういっぱいまで貯まっちゃってたの！？」"
translation = "「에에읏！？ 벌써 가득 찰 때까지 쌓였던 거야！？」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「それじゃボクなんかより、ずっと苦しい思いをしてきたんじゃ……ねえ、大丈夫なの？」"
translation = "「그러면 나 따위보다, 훨씬 괴로운 생각을 해왔던 게…… 저기, 괜찮은 거야？」"

[[dialogue]]
speaker = "unk"
original = "本気で心配そうな表情を浮かべるクーシェンを安心させるように笑顔を見せる。"
translation = "진심으로 걱정스러운 표정을 짓는 쿠셴을 안심시키듯 미소를 띤다."

[[dialogue]]
speaker = "unk"
original = "好きだよ、クーシェン"
translation = "좋아해, 쿠셴"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ぁ……」"
translation = "「아……」"

[[dialogue]]
speaker = "unk"
original = "どんなに苦しくても、この気持ちは抑えられない──そう、クーシェンに伝えた。"
translation = "아무리 괴로워도, 이 마음은 억누를 수 없어──그렇게, 쿠셴에게 전달했다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ぅぅ……そんなこと言われたら……ボクの好きゲージも、どんどん上がっちゃう……」"
translation = "「으으…… 그런 말을 들으면…… 나의 좋아 게이지도, 점점 올라가버려……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「だけど、だけど……何でだろ……さっきまであんなに苦しかったのに……嬉しい気持ちでいっぱいで……」"
translation = "「하지만, 하지만…… 왜일까…… 방금 전까지 그렇게 괴로웠는데…… 기쁜 마음으로 가득 차서……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ねえ、にーにー、どうして？\u3000どうしてだと思う？」"
translation = "「저기, 오빠, 어째서？ 어째서라고 생각해？」"

[[dialogue]]
speaker = "unk"
original = "クーシェンが自分の気持ちに気付いたから"
translation = "쿠셴이 자신의 마음을 깨달았으니까"

[[dialogue]]
speaker = "unk"
original = "きっと大人ゲージも一緒に貯まったからだよ"
translation = "분명 어른 게이지도 함께 쌓였기 때문이야"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクの、気持ち……」"
translation = "「나의, 마음……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクも……にーにーのことが好き……」"
translation = "「나도…… 오빠가 좋아……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーに好きって告白してもらって……ボクもそうだって気が付いて……」"
translation = "「오빠한테 좋아한다고 고백받고…… 나도 그렇다는 걸 깨달아서……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そっか……だからボクの大人ゲージが上がったんだ……」"
translation = "「그렇구나…… 그래서 나의 어른 게이지가 올라간 거구나……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ありがと、にーにー……ボクに好きって言ってくれて……それから、ボクに好きって気付かせてくれて……」"
translation = "「고마워, 오빠…… 나한테 좋아한다고 말해줘서…… 그리고, 나한테 좋아하는 걸 깨닫게 해줘서……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「えへへ、今までで１番、大人ゲージが上がった気がするよ……相変わらず、おっぱいは小さいままだけど」"
translation = "「에헤헤, 지금까지 중에 1번, 어른 게이지가 올라간 기분이야…… 여전히, 가슴은 작은 채지만」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「でも、にーにーとこうやって気持ちを伝え合えば、大人ゲージもいっぱい上がっていくのかな？」"
translation = "「하지만, 오빠랑 이렇게 마음을 서로 전달하면, 어른 게이지도 잔뜩 올라가는 걸까나？」"

[[dialogue]]
speaker = "unk"
original = "そうかもな"
translation = "그럴지도 모르겠네"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「だったらさ……これからも手伝ってよ」"
translation = "「그러면 말이지…… 앞으로도 도와줘」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーも大人ゲージを貯めなくちゃでしょ？\u3000だから、それと一緒にボクの大人ゲージを貯めるの、手伝って欲しいな……」"
translation = "「오빠도 어른 게이지를 모아야 하잖아？ 그러니까, 그것과 함께 내 어른 게이지를 모으는 거, 도와줬으면 좋겠어……」"

[[dialogue]]
speaker = "unk"
original = "一緒に貯めよう！"
translation = "함께 모으자！"

[[dialogue]]
speaker = "unk"
original = "ああ"
translation = "그래"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「うん、よろしくねっ！\u3000大好きだよ、にーにー<emoji=heart04>」"
translation = "「응, 잘 부탁해읏！ 너무 좋아해, 오빠<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "しっかりと抱き合いながら、互いのゲージを貯め合う約束をする。"
translation = "꽉 껴안으면서, 서로의 게이지를 모아갈 약속을 한다."

[[dialogue]]
speaker = "unk"
original = "それが俺とクーシェンの恋愛関係のスタートになったのだった。"
translation = "그것이 나와 쿠셴의 연애 관계의 스타트가 된 것이었다."

