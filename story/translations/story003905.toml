[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「──というわけで！\u3000首尾よく九浄家に潜入することができたんですよ」"
translation = "「──그렇게 해서! 순조롭게 쿠죠가에 잠입할 수 있었던 거라구요」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「なんと、あの難攻不落の九浄家に？」"
translation = "「무려, 그 난공불락의 쿠죠가에?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はい。問題の人工戦闘服も確認しましたし、次回はより詳細な情報を報告することが出来ると思います」"
translation = "「네. 문제의 인공 전투복도 확인했고, 다음에는 더 자세한 정보를 보고할 수 있을 것 같아요」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「ふむ、それは有難い」"
translation = "「흠, 그거 고맙군」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「ところで……キミらのその服は？」"
translation = "「그건 그렇고…… 너희의 그 옷은?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「へへ～、可愛いでしょ？\u3000今回の任務のためにお揃いで用意した服なんですよ♪」"
translation = "「헤헤~, 귀엽죠? 이번 임무를 위해 커플룩으로 준비한 옷이라구요♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「実は私たちの衣装を九浄家当主のヘレナさんが気に入ったようで、この衣装を元に新たな人工戦闘服を作ってもらえることになりました」"
translation = "「사실 저희 의상을 쿠죠가 당주인 헬레나 씨가 마음에 들어 하셔서, 이 의상을 바탕으로 새로운 인공 전투복을 만들어 주시기로 했어요」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「ほう！\u3000ならば、君たちのその人工戦闘服を分析すれば──」"
translation = "「호오! 그렇다면, 너희의 그 인공 전투복을 분석하면──」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「残念ながら私たちの人工戦闘服がいつ完成するか、という話は聞かされていないんです」"
translation = "「안타깝게도 저희 인공 전투복이 언제 완성될지, 하는 이야기는 듣지 못했습니다」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それに私たちの人工戦闘服に、件の危険な新技術が使用されるとは限りませんから」"
translation = "「게다가 저희 인공 전투복에, 그 위험한 신기술이 사용된다는 보장도 없으니까요」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「う、うむ……その通り、だな……」"
translation = "「으, 음…… 그 말대로, 로군……」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「しかし、九浄家のみならず、桜十路家まで絡んでいるとは……ますますもってきな臭いではないか」"
translation = "「하지만, 쿠죠가뿐만 아니라, 사쿠라쥬지가까지 얽혀 있다니…… 더욱더 수상하군」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしたちもまさかエルゼ先輩がいて、戦うことになるとは思わなかったですよ」"
translation = "「우리도 설마 엘제 선배가 있어서, 싸우게 될 줄은 몰랐다구요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「いきなり攻撃を仕掛けられましたからね。しかもその一撃が超強力で……」"
translation = "「갑자기 공격을 퍼부어 왔으니까요. 게다가 그 일격이 엄청 강력해서……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「エルデリーゼ先輩の実力もさることながら、あの人工戦闘服に強い力が備わっていることは間違いなさそうです」"
translation = "「엘데리제 선배의 실력도 실력이지만, 그 인공 전투복에 강력한 힘이 갖춰져 있는 건 틀림없는 것 같아요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「詳細な性能については引き続き探ってゆきますので、もう少しお時間をください」"
translation = "「상세한 성능에 대해서는 계속해서 탐색해 나갈 테니, 조금만 더 시간을 주세요」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「わかった。では引き続き、よろしくお願いしますよ。……では、我々はこれで」"
translation = "「알았다. 그럼 계속해서, 잘 부탁하네. ……그럼, 우리는 이만」"

[[dialogue]]
speaker = "unk"
original = "依頼人たちは小さく頭を下げ、ゴールデングースのアジトから去っていった。"
translation = "의뢰인들은 가볍게 고개를 숙이고, 골든 구스의 아지트에서 떠나갔다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「一時はどうなるかと思ったけど上手くいってるね。依頼人さんもあたしたちのこと見直してくれたみたいだし」"
translation = "「한때는 어떻게 되나 싶었지만 잘 진행되고 있네. 의뢰인분들도 우리를 다시 봐준 것 같고」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「上手くいったらセナリィ社長も喜んでくれるだろうなー……ってどうしたの、ミウ。ちょっと怖い顔になってるよ？」"
translation = "「잘되면 세나리 사장님도 기뻐해 주겠지~…… 그런데 왜 그래, 미우. 좀 무서운 얼굴을 하고 있어?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ううん、なんでもないよ。あっ、そろそろ九浄家にお勤めに行く時間だね。ヒマワリちゃん、準備しよう」"
translation = "「으응, 아무것도 아니야. 앗, 이제 쿠죠가로 출근할 시간이네. 히마와리짱, 준비하자」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「九浄家での初仕事、ドキワクだね！」"
translation = "「쿠죠가에서의 첫 일, 두근두근 와쿠와쿠네!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、楽しみにするのもいいけど、本来の目的を忘れないようにしないとね」"
translation = "「후후, 기대하는 것도 좋지만, 본래 목적을 잊지 않도록 해야지」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「そうだったー。任務、任務」"
translation = "「그랬었지─. 임무, 임무」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「てっきり、早々に泣き言を漏らすと思っていたのだがな。小娘と思っていたが、なかなかどうして上手くやってくれている」"
translation = "「틀림없이, 진작에 약한 소리를 내뱉을 줄 알았는데 말이지. 어린 계집이라고 생각했건만, 제법 잘 해내고 있군」"

[[dialogue]]
speaker_original = "依頼人Ｂ"
speaker_translation = "依頼人Ｂ"
original = "「本当に機密情報を入手してくれれば、それもよし。失敗したとしても、我々の作戦の体のいいカムフラージュになってくれることでしょう」"
translation = "「정말로 기밀 정보를 입수해 준다면, 그것도 좋지. 실패한다 하더라도, 우리 작전의 그럴듯한 위장이 되어줄 것입니다」"

[[dialogue]]
speaker_original = "依頼人Ａ"
speaker_translation = "依頼人Ａ"
original = "「──ああ、私だ。例の件についてだが──」"
translation = "「──아아, 나다. 그건 건에 대해서다만──」"

