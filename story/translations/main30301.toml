[[dialogue]]
speaker = "unk"
original = "第１話,『ルヴィネのお仕事』,B"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「セシア、あなたに聞きたいことがあるのだけれど……女神として最も大切なものは何だと思う？」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「あら、突然どうしたのかしら？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "次代の女神であるルヴィネから突然投げかけられた質問に、『蓄積』を司る守護天使のセシアは考える。"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「──もしかして、不安になってしまっているの？」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「あなたはよくやっているわ。どうしても不安が拭えないなら、わたくしがよしよししてあげるわよ」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「いえ、そういうわけではないのだけれど……」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ふと気になってしまったのよ。女神というものに対して、皆が何を求めているのか」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「セシア、あなたはどう思うかしら？」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「そうね……女神に求められるもの、それは色々あると思うわ。けれどわたくしの考えはたった１つ──」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「それは『愛』よ！」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あ、あい……！！」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そうね……。世界を見守る女神にとって、それは１番大切なことかもしれないわ」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「創造神との戦いを通じて、私も……『愛』というもののかけがえのなさを知ることができた」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「けれど、生きとし生ける命の数だけ、愛という言葉の定義もまた存在する気がしているわ。私の『愛』の解釈と、セシアの『愛』の解釈も違うかもしれない」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ええ。そう思うわ。ルヴィネさまの抱く『愛』の形によって、これから先の世界は形を変えていくはずよ」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……だったら、私は女神として知る必要があるわね。様々な形の『愛』について──」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そんな言葉を交わした数日後のこと、再びルヴィネはアルタイルへやってきた。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "デネブとアルタイル間の行き来ができるようになり、ルヴィネは精力的にアルタイルを訪れては様々な仕事を行っていた。"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「では魔王、さっそくだけれど、あなたの話を聞かせてもらうわ。まずは──」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "今回の目的は、アルタイルの要人と会合を持ち、今後の世界について話し合うこと。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "アルタイルを訪れたルヴィネは、まず新星学園星徒会長にして魔王である緋宮クロトとの会合を持った。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "彼こそ星騎士たちの先頭に立ってリクリエや『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』といった脅威に立ち向かい、それを退けた立役者である。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そんな彼とルヴィネは、今後の世界について大いに語り合っている。そこから少し離れた星徒会室の隅で──"
translation = ""

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「あのちっちゃくて可愛い星徒会長さんが、次の女神様になる予定の女の子だなんて驚きだぜ☆」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「紅明ママ、ルヴィネさまが次代の女神ということは、くれぐれも秘密でお願いよ？」"
translation = ""

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ああ、分かってるって。無用な混乱を生まないように、ルヴィっちの正体については出来るだけ秘密ってね」"
translation = ""

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「でも、アルタイルでも限られた人しか知らないんしょ？\u3000そんな大変な秘密をアタシが知っちゃってもよかったのかね～？」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「紅明ママなら問題ないわ。といっても、わたくしの独断というわけじゃなくて、会長が決めたのだけれど」"
translation = ""

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「つまりアタシのこと、セッシーとダーリンは信頼してくれてるってことね？\u3000ありがとうだぜ☆」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「お礼を言うのはわたくしの方だわ。ルヴィネさまの案内とヒトの手配、紅明ママが一緒に手伝ってくれて、本当に助かったわ！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ここ数日、ルヴィネの要望を叶えるため、セシアを通じて紅明が色々な人にかけあってくれたのだった。"
translation = ""

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「うしし♪\u3000いいってことよ！！\u3000それにしてもルヴィっち、最近よくアルタイルに来て、いろいろやってるみたいだね～」"
translation = ""

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「附属校に編入してみたり、ハロウィンのことについて学んでみたりしてたって聞いてたけど」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「それは『この世界に生きる天使として、いろいろなことに主観的に関わるため』よ」"
translation = ""

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ん、どゆこと？」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ルヴィネさまが今、天使として生きているこの時間は、先代の女神様であるテルルさまが与えた『修行』の時間なの」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「修行といっても女神の力を高めるために厳しい修練を積ませよう、といったことではなくて──」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「女神となる前に、ひとりの天使として生きる時間を楽しんでもらいたい、というテルルさまの温情ね」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「けれど、ルヴィネさまは真面目な方だから……この時間に何か目標や目的が欲しいと考えたの」"
translation = ""

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「なぁるほど☆\u3000それで、いろんなことを積極的に経験しようとしてるってワケなんだな♪」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ええ。だから紅明ママも、ルヴィネさまがいろいろな経験をできるように、手伝ってあげてほしいわ」"
translation = "「네. 그러니까 코메이 엄마도, 루비네 님이 여러 가지 경험을 할 수 있도록, 도와줬으면 좋겠어요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「わかったぜ☆\u3000いい機会だし、ルヴィっちとも仲良くなりたいからな！\u3000この牛紅明の元気、おすそ分けしてやるってもんよ！」"
translation = "「알았다고☆ 좋은 기회기도 하고, 루비치랑도 친해지고 싶으니까 말야! 이 규 코메이의 에너지, 나눠 주겠단 말씀이지!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ふふっ、紅明ママのことはルヴィネさまに紹介したかったの♪\u3000わたくしの大好きなママよって♪」"
translation = "「후훗, 코메이 엄마에 대해서는 루비네 님에게 소개하고 싶었어요♪ 제가 너무 좋아하는 엄마라면서♪」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「あはは、いきなりそんなこと言ったらルヴィっちが混乱しちまわないかい？」"
translation = "「아하하, 갑자기 그런 말을 하면 루비치가 혼란스러워하지 않겠어?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そんなこと言っても、紅明ママはわたくしのママなんだから。ママ～っ<emoji=heart04>」"
translation = "「그런 말을 해도, 코메이 엄마는 저의 엄마인걸요. 엄마~<emoji=heart04>」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「お～、よしよし。まったくセッシーは甘えん坊だな～♪」"
translation = "「오~, 그래 그래. 참 나 세시는 응석받이라니까~♪」"

[[dialogue]]
speaker = "unk"
original = "セシアは紅明のことを『ママ』と呼んで慕っているが、当然、本当のママではない。"
translation = "세시아는 코메이를 『엄마』라고 부르며 따르고 있지만, 당연히 진짜 엄마는 아니다."

[[dialogue]]
speaker = "unk"
original = "あふれんばかりの紅明の母性に、セシアが一方的にママ判定しているだけだ。"
translation = "넘쳐흐르는 코메이의 모성에, 세시아가 일방적으로 엄마 판정을 내렸을 뿐이다."

[[dialogue]]
speaker = "unk"
original = "セシアは他にも、そこかしこで『ママ判定』を行い、甘えられる相手を作っていっている。"
translation = "세시아는 이외에도, 이곳저곳에서 『엄마 판정』을 실시하여, 응석 부릴 상대를 만들어 가고 있다."

[[dialogue]]
speaker = "unk"
original = "そんなセシアを紅明も受け入れて、こうして甘えてくるセシアを存分に可愛がっているのだった。"
translation = "그런 세시아를 코메이도 받아들여, 이렇게 응석 부려 오는 세시아를 마음껏 귀여워하고 있는 것이었다."

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ちなみにだけど、ルヴィっちはセッシー的にママだったりする感じ？」"
translation = "「참고로 말하는 건데, 루비치는 세시 기준으로 엄마라든가 하는 느낌이야?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ルヴィネさまのママ成分……そうね……」"
translation = "「루비네 님의 엄마 성분…… 그렇네요……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「器の広さ、包容力は感じるけれど……母性とは少し違うように感じるわね」"
translation = "「도량의 넓이, 포용력은 느껴지지만…… 모성과는 약간 다른 것처럼 느껴지네요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「もう少しバブみがあって、オギャりたくなって、あと、紅明ママほどでなくとも、お胸がふくよかなら……」"
translation = "「조금 더 응애스러움이 있고, 응애 하고 어리광 부리고 싶어지고, 그리고, 코메이 엄마 정도는 아니더라도, 가슴이 풍만하다면……」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「残念☆\u3000新しいママにはならなかったか～」"
translation = "「아쉽네☆ 새로운 엄마는 되지 못한 건가~」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「って、セッシー。おっぱいの大きさとママか否かは関係ないって、前に言ってなかったっけ～？」"
translation = "「가만, 세시. 가슴 크기랑 엄마인지 아닌지는 관계없다고, 전에 말하지 않았던가~?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「お胸の大きさが、ママか否かのすべてを決めるわけではない、というだけよ。紅明ママのようなお胸が、大きな包容力を生み出すことは間違いないわ」"
translation = "「가슴 크기가, 엄마인지 아닌지의 모든 것을 결정짓는 것은 아니다, 라는 것뿐이에요. 코메이 엄마 같은 가슴이, 큰 포용력을 낳는다는 것은 틀림없어요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「つまり、なかなか紅明ママのような、素敵なママには出会えないってことね」"
translation = "「즉, 좀처럼 코메이 엄마 같은, 멋진 엄마와는 만날 수 없다는 뜻이에요」"

[[dialogue]]
speaker = "unk"
original = "そんな話をしているうちに、ルヴィネと緋宮クロトの会談は終わりを迎える。"
translation = "그런 이야기를 나누는 사이에, 루비네와 히노미야 쿠로토의 회담은 끝을 맞이한다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「──ありがとう、魔王。有意義な意見交換をすることができたわ」"
translation = "「──고마워, 마왕. 유의미한 의견 교환을 할 수 있었어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「デネブとアルタイル、今後も積極的に協力し合って、１日も早い世界の復興を目指していきましょう」"
translation = "「데네브와 알타이르, 앞으로도 적극적으로 협력하여, 하루라도 빠른 세계의 복구를 Aim해가도록 해요」"

[[dialogue]]
speaker = "unk"
original = "満足そうな笑顔を浮かべながら、ルヴィネはクロトと握手を交わし、セシアたちの方へ振り返った。"
translation = "만족스러운 미소를 지으며, 루비네는 쿠로토와 악수를 나누고, 세시아 일행 쪽을 돌아보았다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「さて、この後は新星学園の学園長である十六夜シノと合流して、聖庭園から人間界を訪問している使節団と会う予定になっているけれど……」"
translation = "「자, 이 다음은 신세이 학원의 학원장인 이자요이 시노와 합류해서, 성정원에서 인간계를 방문해 있는 사절단과 만날 예정이지만……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「エスコート役はお任せよ。今日１日、わたくしたちがルヴィネさまのお供をするわ」"
translation = "「에스코트 역할은 맡겨 두세요. 오늘 하루, 저희가 루비네 님을 모실게요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「初めまして！\u3000アタシは<ruby>牛紅明<rt>ぎゅうこうめい</rt></ruby>だぜ、よろしくなっ☆」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「セシアに紅明、２人ともよろしくお願いするわ」"
translation = "「세시아에 코메이, 두 사람 모두 잘 부탁해」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「おっ、そーだ。お近づきの印に、はいこれっ☆」"
translation = "「앗, 그렇다. 안면을 튼 기념으로, 자 이거☆」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「！\u3000えっと、これは……？」"
translation = "「! 저기, 이건……?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「元気みなぎる、ホルスタミン！\u3000我が<ruby>善哉乳業<rt>ぜんざいにゅうぎょう</rt></ruby>の製造する、流星市国ナンバーワンのエナジードリンクさ☆」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あ、ありがとう……でも、今日は仕事で来たのに、いいのかしら」"
translation = "「고, 고마워…… 하지만, 오늘은 일로 왔는데, 괜찮을까」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「もちろんよ。むしろ、ホルスタミンの味は積極的に体験すべきだわ」"
translation = "「당연하죠. 오히려, 홀스타민의 맛은 적극적으로 체험해 봐야 해요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「そーそー、遠慮せずにグイッといきな☆」"
translation = "「그래 그래, 사양 말고 꿀꺽 마셔버려☆」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そうね……なら、いただくことにするわ」"
translation = "「그렇네…… 그렇다면, 받도록 할게」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……おいしいわ。それに、何だか元気が出てきたような……」"
translation = "「……맛있네. 게다가, 어쩐지 기운이 나는 것 같은……」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「気のせいじゃなくて、ホルスタミンは体力回復に効果抜群だからな！\u3000疲れた時にはホルスタミンってね♪」"
translation = "「기분 탓이 아니라, 홀스타민은 체력 회복에 효과가 만점이거든! 피곤할 때는 홀스타민이라니까♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ありがとう、紅明」"
translation = "「고마워, 코메이」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「へへへっ、どういたしまして☆」"
translation = "「헤헤헷, 천만에☆」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ホルスタミンはいくらでもストックがあるからな☆\u3000飲みたくなったらいつでも言ってくれよ、ルヴィっち！」"
translation = "「홀스타민은 얼마든지 재고가 있으니까☆ 마시고 싶어지면 언제든 말해줘, 루비치!」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ル、ルヴィっち……？」"
translation = "「루, 루비치……?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「親愛の情を込めて、あだ名ってやつだぜ☆\u3000どうどう！？」"
translation = "「친애의 정을 담아서, 별명이라는 거라구☆ 어때 어때!?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ええ、まあ、構わないけれど……」"
translation = "「응, 뭐, 상관없지만……」"

[[dialogue]]
speaker = "unk"
original = "底抜けに陽気な紅明のテンションに気圧され気味のルヴィネなのだった。"
translation = "끝없이 쾌활한 코메이의 기세에 눌린 듯한 루비네였다."

