[[dialogue]]
speaker = "unk"
original = "俺たちがバーベキューをしていたところへ突如出現した、謎の魔族たち。"
translation = "우리들이 바비큐를 하고 있던 곳에 갑자기 출현한, 의문의 마족들."

[[dialogue]]
speaker = "unk"
original = "流星クルセイダースの４人が新たな『水着フォーム』で次々とダウンさせていく――が、しかし。"
translation = "유성 크루세이더즈 4명이 새로운 『수영복 폼』으로 차례차례 쓰러뜨려 간다―― 하지만."

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「水着フォームの方は絶好調って感じだけど……これ、いくらなんでも数が多すぎない！？」"
translation = "「수영복 폼 쪽은 절정이라는 느낌이지만…… 이거, 아무리 그래도 수가 너무 많은 거 아니야!?」"

[[dialogue]]
speaker_original = "魔族たち"
speaker_translation = "마족들"
original = "「イ～～～！！」"
translation = "「이~~~!!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「しかも、どんどん増え続けているのですよ～！」"
translation = "「게다가, 계속해서 늘어나고 있는 것이에요~!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「だからって、諦めて手を止めたら、そこで負けよ！」"
translation = "「그렇다고 해서, 포기하고 손을 놓으면, 거기서 끝이야!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ルネアちゃん、大丈夫！？」"
translation = "「루네아짱, 괜찮아!?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「くっ……エグザエルを置いてきたのは失敗だったわ……！」"
translation = "「큭…… 엑자엘을 두고 온 건 실수였어……!」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「魔族たちが襲撃してきた瞬間から、私の女神の力を抑え込む為の妨害術式が発動しているのを感じる……！」"
translation = ""

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「それってやっぱり、誰かが私たちを狙ってるってこと……！？」"
translation = "「그건 역시, 누군가가 우리를 노리고 있다는 뜻……!?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「マトイ、この場はクルセイダースとお前に任せていいか？」"
translation = "「마토이, 이 자리는 크루세이더즈와 너에게 맡겨도 되겠나?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「私は魔王たちを守りに行く！」"
translation = "「나는 마왕 일행을 지키러 가겠다!」"

[[dialogue]]
speaker = "unk"
original = "俺とヘレナさんとパッキーは、力が使えない為、後退しつつ戦っていた。"
translation = "나와 헬레나 씨와 패키는, 힘을 쓸 수 없기 때문에, 후퇴하면서 싸우고 있었다."

[[dialogue]]
speaker_original = "魔族たち"
speaker_translation = "마족들"
original = "「イ～～～！！」"
translation = "「이~~~!!」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「こいつら、次から次へと、キリがねぇぜ……！」"
translation = "「이 녀석들, 끝도 없이 계속 나오는구만……!」"

[[dialogue]]
speaker = "unk"
original = "しかし、魔族は足元の影から次々と湧いて来て、俺たちのことも狙ってくる。"
translation = "하지만, 마족은 발밑의 그림자에서 차례차례 솟아나와, 우리들도 노려온다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「魔王ちゃん、さすが鍛えてるわね！」"
translation = "「마왕짱, 역시 단련하고 있네!」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさん、後ろです！"
translation = "헬레나 씨, 뒤예요!"

[[dialogue]]
speaker_original = "魔族"
speaker_translation = "마족"
original = "「イ～！」"
translation = "「이~!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「おっと、危ない！」"
translation = "「쿠웅, 위험해!」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんは素早く身を交わして、『手刀』で魔族にカウンターをくらわせる。"
translation = "헬레나 씨는 재빠르게 몸을 피하며, 『수도』로 마족에게 카운터를 날린다."

[[dialogue]]
speaker_original = "魔族"
speaker_translation = "마족"
original = "「イ～～！？」"
translation = "「이~~!?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「う～ん、やっぱり霊力なしじゃ、大したダメージにはならないわね……」"
translation = "「으~음, 역시 영력 없이는, 큰 데미지는 되지 않네……」"

[[dialogue]]
speaker = "unk"
original = "でも、すごい身のこなしですよ"
translation = "하지만, 대단한 몸놀림이에요"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ありがと♪\u3000これでも私、元クルセイダースだからね」"
translation = "「고마워♪ 이래 뵈도 나, 전 크루세이더즈니까 말이지」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「リアにルミエルのロザリオを引き継ぐまでは、私が魔族と戦ってたのよ」"
translation = "「리아에게 루미엘의 로자리오를 물려줄 때까지는, 내가 마족과 싸웠었어」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「だけど、こういうリア達もピンチな状況になると、やっぱりもどかしく感じちゃうわよね……」"
translation = "「하지만, 이런 리아 일행도 위기인 상황이 되면, 역시 안달이 나버리네……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「力を望むならば、方法はあるぞ。もう１人の私よ」"
translation = "「힘을 바란다면, 방법은 있다. 또 다른 나여」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ヘレナちゃん！」"
translation = "「헬레나짱!」"

[[dialogue]]
speaker = "unk"
original = "近くの魔族たちを、二刀流の斬撃で蹴散らしながら駆け付けたヘレナちゃんが言う。"
translation = "근처의 마족들을, 이도류의 참격으로 차버리며 달려온 헬레나짱이 말한다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「私はそなたの鏡映し。ならば、私にできて、そなたが力を使えないはずがない」"
translation = "「나는 너의 거울. 그렇다면, 내가 할 수 있고, 네가 힘을 쓰지 못할 리가 없다」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「！\u3000それって、まさか……」"
translation = "「! 그건, 설마……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ヘレナよ、お前が望むのなら――」"
translation = "「헬레나여, 네가 바란다면――」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「私と同じ『守護星』が、きっと加護を与えるはずだ」"
translation = "「나와 같은 『수호성』이, 분명 가호를 내릴 것이다」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「守護星が、私に……？」"
translation = "「수호성이, 나에게……?」"

[[dialogue]]
speaker = "unk"
original = "と、その時だった。"
translation = "바로 그 때였다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「これは……空から――星の力が、私の中に流れ込んで来るのを感じる……！」"
translation = "「이건…… 하늘에서―― 별의 힘이, 내 안으로 흘러 들어오는 게 느껴져……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「さあ、もう１人の私よ。己が魂の囁くままに！」"
translation = "「자, 또 다른 나여. 자신의 영혼이 속삭이는 대로!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「すぅ……」"
translation = "「후우……」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんは目を瞑り……そして。"
translation = "헬레나 씨는 눈을 감고…… 그리고."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――主を照らすは、十字架の鏡に映りし九浄の守護星、デネブ・アルゲディ！」"
translation = "「――주를 비추는 것은, 십자가의 거울에 비친 쿠죠의 수호성, 데네브 알게디!」"

[[dialogue]]
speaker = "unk"
original = "次の瞬間、桜吹雪のように、疾風がビーチを駆け抜けた。"
translation = "다음 순간, 벚꽃보라처럼, 질풍이 비치를 달려나갔다."

[[dialogue]]
speaker_original = "魔族たち"
speaker_translation = "마족들"
original = "「イ～～！？」"
translation = "「이~~!?」"

[[dialogue]]
speaker = "unk"
original = "クルセイダースの近くにいた魔族たちが、一瞬で吹き飛ばされてノックアウトされてしまう。"
translation = "크루세이더즈 근처에 있던 마족들이, 일순간에 날아가 버려 노크아웃되어 버린다."

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「えっ……何が……！？」"
translation = "「에…… 무슨 일이……!?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "『ハッハー！\u3000待たせたな、生徒会諸君！』"
translation = "『핫하~! 기다리게 했구나, 학생회 여러 군!』"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「お姉ちゃん……！？」"
translation = "「언니……!?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――リア、私も参戦しに来たわよ♪」"
translation = "「――리아, 나도 참전하러 왔단다♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「流星学園理事長、九浄ヘレナ！\u3000守護星の力を得て、流星クルセイダースに復帰するわ！」"
translation = "「유성학원 이사장, 쿠죠 헬레나! 수호성의 힘을 얻어, 유성 크루세이더즈에 복귀하겠어!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「守護星ってことは、まさかヘレナさんが星騎士に……！？」"
translation = "「수호성이라는 건, 설마 헬레나 씨가 별기사에……!?」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「マジか……！」"
translation = "「진짜냐……!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「ビックリもも引きなのです！」"
translation = "「깜짝 내복 바지인 것입니다!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「さ～て、久しぶりに大暴れするわよ～！」"
translation = "「자~ 그럼, 오랜만에 날뛰어 볼까~!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――はああぁっ！」"
translation = "「――하아앗!」"

[[dialogue]]
speaker = "unk"
original = "再びヘレナさんが疾風のように駆け抜け、二刀流で魔族たちを蹴散らしていく。"
translation = "다시 헬레나 씨가 질풍처럼 달려나가, 이도류로 마족들을 헤치며 나아간다."

[[dialogue]]
speaker = "unk"
original = "その動きのキレは、魔族はもちろん、俺たちの目も追い切れないほど。"
translation = "그 움직임의 날카로움은, 마족은 물론, 우리들의 눈으로도 쫓아가지 못할 정도."

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「す、すご……！」"
translation = "「대, 대단해……!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「これだけの数をものともしないなんて……！」"
translation = "「이 정도의 수를 당해내지 못한다니……!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「ほぇ～」"
translation = "「호에~」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「あの剣捌き、普通じゃない……！」"
translation = "「저 검술, 보통이 아니야……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「もう１人の私よ。手伝うぞ」"
translation = "「또 다른 나여. 거들겠다」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「おっ、いいわね～♪\u3000なら、ヘレナちゃん、合わせて行きましょうか！」"
translation = "「앗, 좋은데~♪ 그럼, 헬레나짱, 맞춰서 가볼까!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ああ。２つの魂を共鳴させよう――」"
translation = "「아아. 두 영혼을 공명시키자――」"

[[dialogue]]
speaker = "unk"
original = "そして、２人は同時に告げる。"
translation = "그리고, 두 사람은 동시에 고한다."

[[dialogue]]
speaker_original = "ダブルヘレナ"
speaker_translation = "더블 헬레나"
original = "「――ユニゾン！！」"
translation = "「――유니존!!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「九浄ヘレナ、奥義！」"
translation = "「쿠죠 헬레나, 오의!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「サムラ～イ！」"
translation = "「사무라~이!」"

[[dialogue]]
speaker_original = "ダブルヘレナ"
speaker_translation = "더블 헬레나"
original = "「――二千本桜！！！」"
translation = "「――이천본앵!!!」"

[[dialogue]]
speaker = "unk"
original = "――果たして、星騎士へと覚醒したヘレナさんの力も加わり、俺たちは魔族の大群を倒し切ることができた。"
translation = "――마침내, 별기사로 각성한 헬레나 씨의 힘도 더해져, 우리들은 마족 대군을 완전히 물리칠 수 있었다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふぅ……スッキリ♪\u3000ひとまず、なんとかなったみたいね」"
translation = "「후우…… 시원해♪ 우선, 어떻게든 된 모양이네」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「倒した魔族、影みたいに消えちゃったけど……何だったんだろう」"
translation = "「쓰러뜨린 마족, 그림자처럼 사라져 버렸는데…… 뭐였을까」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「どうやら、本物の魔族ではなかったみたいね」"
translation = "「아무래도, 진짜 마족은 아니었던 모양이야」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「作られた偽物ってことですか？」"
translation = "「만들어진 가짜라는 뜻인가요?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「ええ。戦いながら分析していたけど……おそらく、あの魔族たちは――」"
translation = "「그래. 싸우면서 분석해 봤는데…… 아마, 저 마족들은――」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「『リ・クリエ』の力で作り出されたものよ」"
translation = "「『리 크리에』의 힘으로 만들어진 거야」"

[[dialogue]]
speaker = "unk"
original = "なっ……！？"
translation = "뭐라……!?"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「リ・クリエですって……！？」"
translation = "「리 크리에라니……!?」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「どういうこと……！？」"
translation = "「무슨 소리야……!?」"

[[dialogue]]
speaker = "unk"
original = "『リ・クリエ』という言葉が突然飛び出してきて、俺たちは思わず驚いてしまうのだった。"
translation = "『리 크리에』라는 단어가 갑자기 튀어나와서, 우리들은 나도 모르게 놀라고 마는 것이었다."

