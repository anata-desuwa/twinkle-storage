[[dialogue]]
speaker = "unk"
original = "その日、俺はアニマ先輩と共に、夜の流星市国をパトロールしていた。"
translation = "그날 나는 아니마 선배와 함께 밤의 유성시국을 순찰하고 있었다."

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「悪いネ会長。『ロストレーダー』の有効範囲はあまり広くなイ。今夜はたっぷり歩かせることになりそうだヨ」"
translation = "「미안하네 회장. 『로스트 레이더』의 유효 범위는 그리 넓지 않다네. 오늘 밤은 듬뿍 걷게 만들 것 같구먼」"

[[dialogue]]
speaker = "unk"
original = "問題ありません。付き合いますよ"
translation = "문제없습니다. 함께하죠"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「そう言ってくれるならありがたイ！\u3000フヒヒ、それじゃあのんびり夜の散歩を楽しむとしようカ？」"
translation = "「그렇게 말해주니 고맙네! 후히히, 그렇다면 느긋하게 밤산책을 즐겨볼까나？」"

[[dialogue]]
speaker = "unk"
original = "通常、モンスターの探知には、流星市国と両学園が共同開発したアラートシステムが用いられる。"
translation = "통상적으로 몬스터 탐지에는 유성시국과 두 학원이 공동 개발한 알람 시스템이 사용된다."

[[dialogue]]
speaker = "unk"
original = "しかし俺とアニマ先輩が探している相手は、普通のモンスターではない──"
translation = "하지만 나와 아니마 선배가 찾고 있는 상대는 일반 몬스터가 아니다──"

[[dialogue]]
speaker = "unk"
original = "探しているのは……自我を持って行動する、悪意のあるロストアイテム。"
translation = "찾고 있는 것은…… 자아를 가지고 행동하는 악의를 가진 로스트 아이템."

[[dialogue]]
speaker = "unk"
original = "例のアステラカジノで、『欲望』のダッチを取り逃してから、しばらくの月日が流れてしまった。"
translation = "그 아스테라 카지노에서 『욕망』의 더치를 놓치고 나서 얼마간의 세월이 흘렀다."

[[dialogue]]
speaker = "unk"
original = "創造神『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』がいなくなり、リクリエの活動が沈静化に向かい始めた今、自我を持ったロストアイテムへの対策は<ruby>喫緊<rt>きっきん</rt></ruby>の課題と言えた──"
translation = ""

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「会長から例の変態紳士の情報を聞いた時は驚いたヨ」"
translation = "「회장에게 그 변태 신사의 정보를 들었을 때는 놀랐다네」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「抱いた欲望を具現化し、周囲を意のままに操る力なド、滅茶苦茶にもほどがあル！」"
translation = "「품은 욕망을 구현화하여 주변을 뜻대로 조종하는 힘이라니, 엉망진창에도 정도가 있지!」"

[[dialogue]]
speaker = "unk"
original = "ええ。野放しにするわけにはいきません"
translation = "네. 방치해 둘 수는 없습니다"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「うム。そのために開発したのが、この『ロストレーダー』ダ！」"
translation = "「음. 그걸 위해 개발한 것이 바로 이 『로스트 레이더』다!」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「潜水艦のソナーのようニ、周囲で発生するマイナスエネルギーの波動を検知できる仕組みダ。期待してくれたまエ？」"
translation = "「잠수함의 소나처럼 주변에서 발생하는 마이너스 에너지의 파동을 감지할 수 있는 구조라네. 기대해 주겠나?」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「……それにしても会長。今回の件、いつになく張り切っているネ？」"
translation = "「……그건 그렇고 회장. 이번 건은 평소와 다르게 의욕이 넘치네?」"

[[dialogue]]
speaker = "unk"
original = "ダッチは俺を狙っていますからね"
translation = "더치는 나를 노리고 있으니까요"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「惜しいことをしたヨ。なんでも九浄家のカジノで、会長のとんでもない格好がお披露目されて大混乱だったそうじゃないカ♪」"
translation = "「아까운 짓을 했구먼. 들리는 바로는 쿠죠 가의 카지노에서 회장의 엄청난 차림이 피로되어 대혼란이었다지 않은가♪」"

[[dialogue]]
speaker = "unk"
original = "その件は緘口令を敷いていたはず！？"
translation = "그건 함구령을 내려두었을 텐데요!?"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「ヒトの口に戸は立てられないヨ、フヒヒヒ♪\u3000まあ気にしなくてもいいだろウ、よくあることダ♪」"
translation = "「사람 입에 자물쇠를 채울 수는 없지, 후히히히♪ 뭐 신경 쓰지 않아도 되잖아, 흔히 있는 일이다♪」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「そうダ、今夜の調査が終わったら、また新薬の実験に付き合ってくれるかナ？」"
translation = "「맞다, 오늘 밤 조사가 끝나면 또 신약 실험에 함께해 주겠나?」"

[[dialogue]]
speaker = "unk"
original = "もしかしてダッチを討伐しても意味がない？"
translation = "혹시 더치를 토벌해도 의미가 없나요?"

[[dialogue]]
speaker = "unk"
original = "また女の子になるんですか、俺……"
translation = "또 여자가 되는 건가요, 나……"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「まぁまァ、どんな副作用が出るかはお楽しミ──ムム！？」"
translation = "「자자, 어떤 부작용이 나올지는 기대하시라── 음음!?」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「レーダーが反応したゾ！\u3000この近くに、ロストアイテムがいル！！」"
translation = "「레이더가 반응했다네! 이 근처에 로스트 아이템이 있다!!」"

[[dialogue]]
speaker = "unk"
original = "ダッチ──今日こそケリをつけてやる！！"
translation = "더치── 오늘이야말로 결판을 내주겠다!!"

[[dialogue]]
speaker_original = "アニマ（覚醒）"
speaker_translation = "아니마(각성)"
original = "「来るゾ会長、前方からダ……！」"
translation = "「온다네 회장, 전방이다……!」"

[[dialogue]]
speaker = "unk"
original = "前回の騒動での辱めは忘れていない。何としても今夜、ヤツを倒す。"
translation = "지난 소동 때의 수치심은 잊지 않았다. 무슨 일이 있어도 오늘 밤 녀석을 쓰러뜨린다."

[[dialogue]]
speaker = "unk"
original = "そう思っていたのに──"
translation = "그렇게 생각하고 있었는데──"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「……もう見ていられないの」"
translation = "「……더는 보고 있을 수 없어」"

[[dialogue]]
speaker = "unk"
original = "俺たちの前に現れたのは──ダッチでは、なかった。"
translation = "우리 앞에 나타난 것은── 더치가 아니었다."

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「だから……助けに来たの♪」"
translation = "「그러니까…… 구하러 왔어♪」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「シスの────お兄ちゃん<emoji=heart04>」"
translation = "「시스의──── 오빠<emoji=heart04>」"

