[[dialogue]]
speaker = "unk"
original = "第６話,リクリエの瘴気,B"
translation = "제6화, 리크리에의 장기, B"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ぅ、あ、ああぁあああっ──！！！？？？」"
translation = "「우, 아, 아아아아앗──!!!???」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「メルエルっ！？」"
translation = "「멜엘!?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「拒む必要はないわ。その瘴気は、２０００年前も貴女の先祖を導いたもの。身をゆだねて、私と共に来なさい」"
translation = "「거부할 필요 없어. 그 장기는 2000년 전에도 네 선조를 인도했던 것. 몸을 맡기고 나와 함께 가자」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふざけるな──！！」"
translation = "「웃기지 마──!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「暗殺者如きの刃が届くわけがないわ」"
translation = "「암살자 따위의 칼날이 닿을 리 없잖아」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「特別に慈悲を与えてあげましょう。姫咲メルエルが使徒と成った暁には、貴女も連れて行ってあげてもいい」"
translation = "「특별히 자비를 베풀어 주지. 히메사키 멜엘이 사도가 된 뒤에는 너도 데려가 줄 수 있어」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「使徒となって世界を刷新する姫咲メルエルにも、手足となる従者はあって困らないでしょうし」"
translation = "「사도가 되어 세계를 쇄신할 히메사키 멜엘에게도 수족이 될 종자는 있는 게 좋겠지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「寝言は寝ていいなよ……正気を失ってからも、あの子に尽くせって！？\u3000そんなの、願い下げ！！」"
translation = "「잠꼬대는 자면서나 해…… 제정신을 잃고 나서도 저 아이를 받들라고!? 그딴 거, 사양이야!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「そう。ならばここで死ぬしかないわね。可哀そうに」"
translation = "「그래. 그렇다면 여기서 죽을 수밖에 없겠네. 가엽게도」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「舐めるなっ──！！」"
translation = "「얕보지 마──!!」"

[[dialogue]]
speaker = "unk"
original = "望まぬ暗殺者稼業ではあった。しかし聖庭園のエージェントとして、誰よりもナターシャは優秀だった。"
translation = "원치 않는 암살자 일이었지만, 성정원의 요원으로서 나타샤는 누구보다 우수했다."

[[dialogue]]
speaker = "unk"
original = "だからこそ、姫の側近という地位を確立していたのに。"
translation = "그랬기에 공주의 측근이라는 지위를 확립하고 있었던 것인데."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（強すぎるっ……私がやろうとしていることは全部筒抜け。フェイントも通じない、無理に攻めれば隙を突かれるっ──！）"
translation = "（너무 강해…… 내가 하려는 짓이 전부 읽히고 있어. 페인트도 안 통하고 억지로 공격하면 빈틈을 찔려──!）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（早くこいつを倒さないといけないのに！\u3000急がないと──）"
translation = "（빨리 이 녀석을 쓰러뜨려야 하는데! 서두르지 않으면──）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（メルエルが──帰ってこられなくなる！！）"
translation = "（멜엘이── 돌아올 수 없게 돼!!）"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「スピードだけは自信があるみたいね。でも──」"
translation = "「스피드만큼은 자신 있는 모양이네. 하지만──」"

[[dialogue]]
speaker = "unk"
original = "霊力で形成された光の羽が、礫の嵐となってナターシャを襲う。"
translation = "영력으로 형성된 빛의 날개가 자갈 폭풍이 되어 나타샤를 덮친다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ぐっ──ぁあぁあっ──！！」"
translation = "「구윽── 아아앗──!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「暗殺者の足は止めた──次の相手は、少し本腰を入れないとね」"
translation = "「암살자의 발은 묶었군── 다음 상대는 조금 본격적으로 상대해야겠어」"

[[dialogue]]
speaker = "unk"
original = "ラストナンバーが呟いた、次の瞬間──"
translation = "라스트 넘버가 중얼거린 다음 순간──"

[[dialogue]]
speaker = "unk"
original = "サンクチュアリの壁の一画が吹き飛び──"
translation = "생츄어리의 벽 한쪽이 날아가며──"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「はぁああぁあああっ──！！！」"
translation = "「하아아아아앗──!!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──ケイティ姉さんっ！？」"
translation = "「──케이티 언니!?」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「くっ……！\u3000これも──受け止めますか！」"
translation = "「큭……! 이것도── 막아내는 건가요!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「事前に星眼で予習しておかなければ、危ないところだったわね」"
translation = "「미리 성안으로 예습해두지 않았으면 위험할 뻔했네」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「貴女、虫も殺せないような顔をして、随分と荒っぽい。いいえ……戦闘の才能があるのね。流石は衛兵隊の隊長だわ」"
translation = "「너, 벌레 한 마리 못 죽일 것 같은 얼굴을 하고 꽤나 거칠군. 아니…… 전투 재능이 있는 거겠지. 과연 위병대 대장이야」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「敵に褒められても嬉しくなんてありませんっ！」"
translation = "「적에게 칭찬받아도 기쁘지 않습니다!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ごめんなさいナターシャちゃん。遅くなって……あぁ。ひどいケガ……」"
translation = "「미안해요 나타샤 짱. 늦어서…… 아아. 심한 상처가……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「それ、ひとに言ってる場合？\u3000姉さんだって……」"
translation = "「그거 남 걱정할 때야? 언니도……」"

[[dialogue]]
speaker = "unk"
original = "使徒アポロを下して、ここまでたどり着いたのだろう。すでにケイティも満身創痍だった。"
translation = "사도 아폴로를 꺾고 이곳까지 온 것이리라. 이미 케이티도 만신창이였다."

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「──っ！？\u3000メルエルちゃんを包む、あれは……！？」"
translation = "「──!? 멜엘 짱을 감싸고 있는 저건……!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「リクリエの瘴気っ……ヒトを狂わせて、使徒にしてしまう瘴気だよ──！」"
translation = "「리크리에의 장기야…… 사람을 미치게 해서 사도로 만들어버리는 장기라고──!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「早くあいつを倒さないと、メルエルが！！」"
translation = "「빨리 저 녀석을 쓰러뜨리지 않으면 멜엘이!!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「……ええ！\u3000ナターシャちゃんは援護をお願い！！」"
translation = "「……네! 나타샤 짱은 엄호를 부탁해요!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「未来を選択する。ビジョンを確認し、最良の未来をつかみ取る──貴女たちの勝利は、万が一にもありえないわ」"
translation = "「미래를 선택한다. 비전을 확인하고 최선의 미래를 붙잡는다── 너희의 승리는 만에 하나라도 있을 수 없어」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（これがっ……会長くんも苦しんでいたっていう、リクリエの、瘴気……！？）"
translation = "（이게…… 회장님도 괴로워했다는 리크리에의 장기……!?）"

[[dialogue]]
speaker = "unk"
original = "壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ──"
translation = "부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라──"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（気味の悪い声が、鳴り響いて止まらない……！\u3000苦しい……やめてっ！！）"
translation = "（기분 나쁜 목소리가 울려 퍼지며 멈추지 않아……! 괴로워…… 그만둬!!）"

[[dialogue]]
speaker = "unk"
original = "滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ──"
translation = "멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라──"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（私の意思が塗りつぶされていく……破滅を望んで、世界を壊さなきゃって……使命感みたいなものまで、芽生えてきてるっ！？）"
translation = "（내 의지가 지워져 가…… 파멸을 원하고 세계를 부숴야 한다는…… 사명감 같은 것까지 싹트고 있어!?）"

[[dialogue]]
speaker = "unk"
original = "この光景を、現実のものに──"
translation = "이 광경을 현실로──"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（だめっ……そんなこと、しちゃいけない！\u3000望んでなんかいない……出ていってっ！！）"
translation = "（안 돼…… 그런 짓 하면 안 돼! 바라고 있지 않아…… 나가버려!!）"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（ここで私が堕ちてしまったら、未来が闇に包まれる……！\u3000会長くんが描いた勝利の未来まで、なくなっちゃう……！！）"
translation = "（여기서 내가 타락해버리면 미래가 어둠에 휩싸여……! 회장님이 그려낸 승리의 미래까지 사라져버린단 말이야……!!）"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（私は、絶対に負けないっ……負けないんだからっ！！）"
translation = "（나는, 절대로 지지 않아…… 지지 않을 거니까!!）"

[[dialogue]]
speaker = "unk"
original = "まだ──抗うのか。"
translation = "아직── 저항하는 건가."

[[dialogue]]
speaker = "unk"
original = "ならば──思い出させてやろう。"
translation = "렇다면── 떠올리게 해주마."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（い、嫌……やめて──）"
translation = "（시, 싫어…… 그만둬──）"

[[dialogue]]
speaker = "unk"
original = "２０００年前の、お前の先祖の、尊き行いを見せてやろう。"
translation = "2000년 전, 네 선조의 고귀한 행위를 보여주지."

[[dialogue]]
speaker = "unk"
original = "かつて天界の魔王が成しえなかった再創生を、今こそ。"
translation = "과거 천계의 마왕이 이루지 못했던 재창생을, 지금이야말로."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（来ないで──！！）"
translation = "（오지 마──!!）"

[[dialogue]]
speaker = "unk"
original = "お前が為すのだ──"
translation = "네가 이루는 것이다──"

[[dialogue]]
speaker = "unk"
original = "瘴気がさらに濃度を増し、メルエルの全身を包み、汚染していった──"
translation = "장기가 더욱 농도를 더해가며, 멜엘의 온몸을 감싸고 오염시켜 갔다──"

