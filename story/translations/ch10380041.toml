[[dialogue]]
speaker = "unk"
original = "第１話,新たなる剣,P"
translation = ""

[[dialogue]]
speaker = "unk"
original = "魔将になった件の一部始終を、イクシーから聞かせてもらった。"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あんなに可愛らしい方なのに、小さな体に見合わない強欲さには感服しました」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「そして、人目を気にして本性を解き放てない自分を顧みた時、気付いたのです」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「この流れなら、エッチなこと大好きって明かしちゃってもいいのでは……明かしちゃいたい、明かしちゃえ、と！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "明かしちゃったかぁ……"
translation = ""

[[dialogue]]
speaker = "unk"
original = "イクシーの本性は俺含め、ごく一部しか知らない（はず）。基本的には品行方正な優等生で通っている。"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ともあれ私は色欲の魔本に認められ、魔将として覚醒できたのです。私だけでは辿りつけなかった境地でした」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ああ……あの時の、全身に電流が迸るような、炎が血管を流れるような感覚……思い出しただけでうっとりしてしまいますぅ～<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "恍惚としながら体をくねらせるイクシー。イクシーらしいけど目に毒だ。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "感想を一言で表現すると？"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「気持ちよかったです！\u3000とても！！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「煩悩まみれの自分をさらけ出して、蔑みの視線を受けた時、お腹の奥がきゅんとして……<emoji=heart04>\u3000こんな興奮もあるんだって目覚めてしまいそうでしたぁ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "すでに目覚めているとは思うけど、もはや言うまい。これがイクシーだ。"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ですが、シャルレーヌさんやリィベルさん、魔将のみなさんに私の本性が知れ渡ってしまいました。望み通りのこととはいえ、恥ずかしくって……私、もうお嫁にいけません」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "大丈夫、俺がいるから"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「会長……」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「こんな、こんな……むっつりドスケベでもいいんですか？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そんなイクシーも大好きだ"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はわわっ！\u3000ありがとうございます！\u3000私も会長が大好きです～！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "エッチなことに興味津々なのもイクシーの一面だ。むしろその一面があるからこそ、イクシーは可愛いと思う。"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「大好きな会長にお願いがあります」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「星騎士の力は破滅を退け、世界を守るためのものです。扱いの上達を喜ぶことはあっても、力を振るうことそのものを楽しむことはありませんでした」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ですが魔将の力は違います。魔将の力は私の心身を昂らせ、直接的に快楽を与えるのです。ただでさえ強力な力ですから、暴走しないように自分を律しないといけません」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「会長には、時間がある時に訓練に付き合っていただきたいのです。快楽の力を、正しく使うことができるように」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "もちろん。いくらでも付き合うよ"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ありがとうございます。会長にそう言っていただけたら百人力です」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "イクシーは人を守ることにもエッチにも真面目だ。やっぱり星騎士としてのイクシーはどこに出しても恥ずかしくないと思う。"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「──！\u3000モンスターです！\u3000会長、行きましょう！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「機械型モンスター……こんな市街地に現れるとは。速攻で仕留めます！\u3000会長は一般の方の保護をお願いします！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「魔本よ、私に力を！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「はあぁ<emoji=heart04>\u3000『色欲』の魔将イクシリオン、参ります！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ラストクレイモア！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「やった？\u3000──いえ」"
translation = ""

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「グラァアア！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「不届きな輩はまだいるようですね」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「どれだけいようと全て切り伏せるのみです。魔将の力なら──それができます！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "イクシリオンの下腹部で文様が妖しく輝く。有機的な、まるで生物の器官のような模様が鼓動するように明滅する。"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「星力と魔力が、あっ、交わって……はぁ、はぁ……あっ、んんっ！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「あぁ、感じます……私のお腹の奥で、大きな力が生まれるのを……あ、はぁっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「グオォッ！！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "モンスターが吐いた爆炎がイクシリオンに迫るが──"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ふふふ……<emoji=heart04>\u3000メガリビドーディヴァイダー！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "禍々しい呪いを帯びた大剣が爆炎ごと全て切り裂いた。斬撃の波動が雲を散らし、一面の青空をもたらす。"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「会長、見ていただけましたか？\u3000私の新しい剣を」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "かっこよかった！"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ふふっ、ありがとうございますっ」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「あの、ところで…………このフォームに変身すると、身体が熱くなってしまって……汗を流したいんですけど、今から会長のお宅にお邪魔してもよろしいでしょうか？」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「……え？\u3000今日はお母様はご不在？」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「じゃあ、早く……私、もう我慢できませんっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "事後処理は駆け付けた美化委員に任せ、俺たちは足早に帰路に就いたのだった。"
translation = "사후 처리는 달려온 미화위원에게 맡기고, 우리들은 발걸음을 서둘러 귀갓길에 오른 것이었다."

