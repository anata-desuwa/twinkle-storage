[[dialogue]]
speaker = "unk"
original = "第１話,新たなる剣,P"
translation = "제1화, 새로운 검"

[[dialogue]]
speaker = "unk"
original = "魔将になった件の一部始終を、イクシーから聞かせてもらった。"
translation = "마장이 된 전말을, 익시에게 들었다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あんなに可愛らしい方なのに、小さな体に見合わない強欲さには感服しました」"
translation = "「그렇게 귀여우신 분인데, 작은 몸에 어울리지 않는 탐욕스러움에는 감복했습니다」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「そして、人目を気にして本性を解き放てない自分を顧みた時、気付いたのです」"
translation = "「그리고, 남의 눈을 신경 쓰느라 본성을 해방하지 못하는 자신을 돌아보았을 때, 깨달은 것입니다」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「この流れなら、エッチなこと大好きって明かしちゃってもいいのでは……明かしちゃいたい、明かしちゃえ、と！」"
translation = "「이 흐름이라면, 야한 거 진짜 좋아한다고 밝혀버려도 되지 않을까…… 밝히고 싶어, 밝혀버려, 라면서!」"

[[dialogue]]
speaker = "unk"
original = "明かしちゃったかぁ……"
translation = "밝혀버린 건가……"

[[dialogue]]
speaker = "unk"
original = "イクシーの本性は俺含め、ごく一部しか知らない（はず）。基本的には品行方正な優等生で通っている。"
translation = "익시의 본성은 나를 포함해, 극히 일부밖에 모른다(그럴 터). 기본적으로는 품행방정한 우등생으로 통하고 있다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ともあれ私は色欲の魔本に認められ、魔将として覚醒できたのです。私だけでは辿りつけなかった境地でした」"
translation = "「어찌 됐든 저는 색욕의 마본에게 인정받아, 마장으로서 각성할 수 있었습니다. 저 혼자서는 도달할 수 없었던 경지였어요」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ああ……あの時の、全身に電流が迸るような、炎が血管を流れるような感覚……思い出しただけでうっとりしてしまいますぅ～<emoji=heart04>」"
translation = "「아아…… 그때의, 전신에 전류가 번개 치듯 흐르는 듯한, 화염이 혈관을 흐르는 듯한 감각…… 생각한 것만으로도 황홀해져 버려요~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "恍惚としながら体をくねらせるイクシー。イクシーらしいけど目に毒だ。"
translation = "황홀해하며 몸을 꼬는 익시. 익시답지만 눈에 해롭다."

[[dialogue]]
speaker = "unk"
original = "感想を一言で表現すると？"
translation = "감상을 한 마디로 표현하자면?"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「気持ちよかったです！\u3000とても！！」"
translation = "「기분 좋았습니다! 엄청요!!」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「煩悩まみれの自分をさらけ出して、蔑みの視線を受けた時、お腹の奥がきゅんとして……<emoji=heart04>\u3000こんな興奮もあるんだって目覚めてしまいそうでしたぁ……<emoji=heart04>」"
translation = "「번뇌투성이인 자신을 드러내고, 경멸하는 시선을 받았을 때, 배 속 깊은 곳이 쿵쾅거려서……<emoji=heart04> 이런 흥분도 있구나 하고 눈을 떠버릴 것만 같았어요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "すでに目覚めているとは思うけど、もはや言うまい。これがイクシーだ。"
translation = "이미 눈을 떴다고는 생각하지만, 더는 말하지 않겠다. 이것이 익시다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ですが、シャルレーヌさんやリィベルさん、魔将のみなさんに私の本性が知れ渡ってしまいました。望み通りのこととはいえ、恥ずかしくって……私、もうお嫁にいけません」"
translation = "「하지만, 샬레느 씨나 리벨 씨, 마장 여러분에게 제 본성이 널리 알려지고 말았습니다. 원하던 바라고는 해도, 창피해서…… 저, 이제 시집 못 가요」"

[[dialogue]]
speaker = "unk"
original = "大丈夫、俺がいるから"
translation = "괜찮아, 내가 있으니까"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「会長……」"
translation = "「회장님……」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「こんな、こんな……むっつりドスケベでもいいんですか？」"
translation = "「이런, 이런…… 음란 변태라도 괜찮은 건가요?」"

[[dialogue]]
speaker = "unk"
original = "そんなイクシーも大好きだ"
translation = "그런 익시도 정말 좋아해"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はわわっ！\u3000ありがとうございます！\u3000私も会長が大好きです～！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "エッチなことに興味津々なのもイクシーの一面だ。むしろその一面があるからこそ、イクシーは可愛いと思う。"
translation = "야한 것에 관심이 많은 것도 익시의 한 면이다. 오히려 그 면이 있기에, 익시는 귀엽다고 생각한다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「大好きな会長にお願いがあります」"
translation = "「정말 좋아하는 회장님께 부탁이 있습니다」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「星騎士の力は破滅を退け、世界を守るためのものです。扱いの上達を喜ぶことはあっても、力を振るうことそのものを楽しむことはありませんでした」"
translation = "「성기사의 힘은 파멸을 물리치고, 세계를 지키기 위한 것입니다. 숙련도가 올라가는 것을 기뻐한 적은 있어도, 힘을 휘두르는 것 자체를 즐긴 적은 없었습니다」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ですが魔将の力は違います。魔将の力は私の心身を昂らせ、直接的に快楽を与えるのです。ただでさえ強力な力ですから、暴走しないように自分を律しないといけません」"
translation = "「하지만 마장의 힘은 다릅니다. 마장의 힘은 제 심신을 고양시키고, 직접적으로 쾌락을 주는 것입니다. 그렇지 않아도 강력한 힘이니까, 폭주하지 않도록 자신을 자제해야만 합니다」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「会長には、時間がある時に訓練に付き合っていただきたいのです。快楽の力を、正しく使うことができるように」"
translation = "「회장님께는, 시간이 있을 때 훈련에 함께해 주셨으면 합니다. 쾌락의 힘을, 바르게 사용할 수 있도록」"

[[dialogue]]
speaker = "unk"
original = "もちろん。いくらでも付き合うよ"
translation = "당연하지. 얼마든지 함께해 줄게"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ありがとうございます。会長にそう言っていただけたら百人力です」"
translation = "「감사합니다. 회장님께서 그렇게 말씀해 주시니 백인력입니다」"

[[dialogue]]
speaker = "unk"
original = "イクシーは人を守ることにもエッチにも真面目だ。やっぱり星騎士としてのイクシーはどこに出しても恥ずかしくないと思う。"
translation = "익시는 사람을 지키는 것에도 야한 것에도 진지하다. 역시 성기사로서의 익시는 어디에 내놓아도 부끄럽지 않다고 생각한다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「──！\u3000モンスターです！\u3000会長、行きましょう！」"
translation = "「──! 몬스터입니다! 회장님, 가죠!」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「機械型モンスター……こんな市街地に現れるとは。速攻で仕留めます！\u3000会長は一般の方の保護をお願いします！」"
translation = "「기계형 몬스터…… 이런 시가지에 나타나다니. 속전속결로 쓰러뜨리겠습니다! 회장님은 일반인 분들의 보호를 부탁드립니다!」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「魔本よ、私に力を！」"
translation = "「마본이여, 내게 힘을!」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「はあぁ<emoji=heart04>\u3000『色欲』の魔将イクシリオン、参ります！」"
translation = "「하아아<emoji=heart04> 『색욕』의 마장 익실리온, 가겠습니다!」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ラストクレイモア！」"
translation = "「라스트 클레이모어!」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「やった？\u3000──いえ」"
translation = "「해냈나? ──아뇨」"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「グラァアア！」"
translation = "「그르아아아!」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「不届きな輩はまだいるようですね」"
translation = "「버릇없는 무리가 아직 있는 모양이네요」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「どれだけいようと全て切り伏せるのみです。魔将の力なら──それができます！」"
translation = "「얼마나 있든 전부 베어 넘길 뿐입니다. 마장의 힘이라면── 그게 가능합니다!」"

[[dialogue]]
speaker = "unk"
original = "イクシリオンの下腹部で文様が妖しく輝く。有機的な、まるで生物の器官のような模様が鼓動するように明滅する。"
translation = "익실리온의 하복부에서 문양이 요란하게 빛난다. 유기적인, 마치 생물의 기관과도 같은 문양이 맥박치듯 점멸한다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「星力と魔力が、あっ、交わって……はぁ、はぁ……あっ、んんっ！」"
translation = "「성력과 마력이, 아쏭, 교차하며…… 하아, 하아…… 아, 응읏!」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「あぁ、感じます……私のお腹の奥で、大きな力が生まれるのを……あ、はぁっ……<emoji=heart04>」"
translation = "「아아, 느껴져요…… 제 배 속 깊은 곳에서, 커다란 힘이 태어나는 것이…… 아, 하앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「グオォッ！！」"
translation = "「그오옷!!」"

[[dialogue]]
speaker = "unk"
original = "モンスターが吐いた爆炎がイクシリオンに迫るが──"
translation = "몬스터가 내뿜은 폭염이 익실리온에게 다가가지만──"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ふふふ……<emoji=heart04>\u3000メガリビドーディヴァイダー！」"
translation = "「후후후……<emoji=heart04> 메가 리비도 디바이더!」"

[[dialogue]]
speaker = "unk"
original = "禍々しい呪いを帯びた大剣が爆炎ごと全て切り裂いた。斬撃の波動が雲を散らし、一面の青空をもたらす。"
translation = "불길한 저주를 띤 대검이 폭염째로 전부 베어 갈랐다. 참격의 파동이 구름을 흩뿌리고, 일대의 청명한 하늘을 가져온다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「会長、見ていただけましたか？\u3000私の新しい剣を」"
translation = "「회장님, 봐주셨나요? 제 새로운 검을」"

[[dialogue]]
speaker = "unk"
original = "かっこよかった！"
translation = "멋졌어!"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ふふっ、ありがとうございますっ」"
translation = "「후후, 감사합니다」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「あの、ところで…………このフォームに変身すると、身体が熱くなってしまって……汗を流したいんですけど、今から会長のお宅にお邪魔してもよろしいでしょうか？」"
translation = "「저기, 그나저나………… 이 폼으로 변신하면, 몸이 뜨거워져 버려서…… 땀을 흘리고 싶은데요, 지금부터 회장님 댁에 방해해도 괜찮을까요?」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「……え？\u3000今日はお母様はご不在？」"
translation = "「……에? 오늘은 어머님이 부재중?」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「じゃあ、早く……私、もう我慢できませんっ<emoji=heart04>」"
translation = "「그럼, 빨리…… 나, 더는 참을 수 없어요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "事後処理は駆け付けた美化委員に任せ、俺たちは足早に帰路に就いたのだった。"
translation = "사후 처리는 달려온 미화위원에게 맡기고, 우리들은 빠른 걸음으로 귀갓길에 올랐던 것이었다."

