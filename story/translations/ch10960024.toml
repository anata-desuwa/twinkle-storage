[[dialogue]]
speaker = "unk"
original = "第４話,君とふたりで,P"
translation = "제4화, 너와 둘이서, P"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ようやく、２人きりになれたな……」"
translation = "「겨우 둘만 남게 되었군……」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「私と戦え、魔王。私たちが最後の２人だ」"
translation = "「나와 싸워라, 마왕. 우리가 마지막 두 사람이다」"

[[dialogue]]
speaker = "unk"
original = "一瞬ドギマギしてしまったが、イングリット相手にそう感じてしまった自分を殴りたくなる。"
translation = "순간 두근거리고 말았지만, 잉그리드를 상대로 그렇게 느껴버린 자신을 때려주고 싶어진다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「フッ、ようやくやる気になったようだな」"
translation = "「훗, 이제야 의욕이 생긴 모양이군」"

[[dialogue]]
speaker = "unk"
original = "だがイングリットの熱い戦いぶりを見て、俺も火が点いてしまった。彼女と戦って、そして勝ちたい。"
translation = "하지만 잉그리드의 뜨거운 전투 방식을 보고 나도 불이 붙어버렸다. 그녀와 싸워서, 그리고 이기고 싶다."

[[dialogue]]
speaker = "unk"
original = "行くぞ、イングリット！"
translation = "간다, 잉그리드!"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ああ、来い！」"
translation = "「아아, 와라!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「いい踏み込みだ！\u3000だが、甘い！」"
translation = "「좋은 파고들기다! 하지만 무르다!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ツインリッパー！」"
translation = "「트윈 리퍼!」"

[[dialogue]]
speaker = "unk"
original = "俺の拳を１本の剣で受け流した次の瞬間、もう１本が閃く。"
translation = "내 주먹을 한 자루의 검으로 흘려보낸 다음 순간, 나머지 한 자루가 번뜩인다."

[[dialogue]]
speaker = "unk"
original = "それをかわせば、さらに防御を終えた最初の１本が襲ってくる。"
translation = "그것을 피하면 다시 방어를 마친 첫 번째 검이 습격해 온다."

[[dialogue]]
speaker = "unk"
original = "まさに攻防一体。見惚れるような技の冴えだ。"
translation = "그야말로 공방일체. 넋을 잃을 정도로 빼어난 기술이다."

[[dialogue]]
speaker = "unk"
original = "強いな、君は"
translation = "강하구나, 너는"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「当然だ。私は強い。そしてまだまだ強くなるぞ！」"
translation = "「당연하다. 나는 강하다. 그리고 점점 더 강해질 거다!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「そのために貴様も強くなれ、魔王！\u3000私は強くなった貴様も越えてさらに強くなる！」"
translation = "「그러기 위해 네놈도 강해져라, 마왕! 나는 강해진 네놈마저 뛰어넘어 더욱 강해질 것이다!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「さぁ、避けられるものなら避けてみろ！\u3000ブレイドクロスシザー！」"
translation = "「자, 피할 수 있다면 피해보아라! 블레이드 크로스 시저!」"

[[dialogue]]
speaker = "unk"
original = "剣を交差させて突進するイングリットに対し、俺はあえて回避せず、拳に星力を溜めて防御の姿勢を取る。"
translation = "검을 교차하며 돌진하는 잉그리드에 대해 나는 굳이 회피하지 않고, 주먹에 성력을 모아 방어 태세를 취한다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「っ！\u3000受け止めただと！？」"
translation = "「윽! 받아냈다고!?」"

[[dialogue]]
speaker = "unk"
original = "イングリットが力を込めた瞬間、剣の下をくぐり、前のめりになった上半身にアッパーを叩き込む。"
translation = "잉그리드가 힘을 준 순간 검 아래로 파고들어, 앞으로 쏠린 상체에 어퍼를 날린다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐっ、があぁっ！」"
translation = "「윽, 가아앗!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「調子になるなよ！\u3000ふん！」"
translation = "「우쭐대지 마라! 흡!」"

[[dialogue]]
speaker = "unk"
original = "剣を手放したイングリットが俺の腕を掴み、気が付けば俺は砂浜に投げられていた。"
translation = "검을 놓은 잉그리드가 내 팔을 붙잡더니, 정신을 차려보니 나는 모래사장에 던져져 있었다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「クハハ、無様だな魔王！\u3000全身砂まみれでお似合いだぞ！」"
translation = "「크하하, 꼴사납구나 마왕! 온몸이 모래투성이인 게 아주 잘 어울리는군!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「私は体術も修めている。懐に潜り込めば勝てると思ったのなら、迂闊だったな」"
translation = "「나는 체술도 익혔다. 품 안으로 파고들면 이길 수 있을 거라 생각했다면 경솔했구나」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「今度はこちらの番だ！\u3000そらそらそら！」"
translation = "「이번엔 내 차례다! 받아라 받아라 받아라!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「隙ありだ、ツインリッパー！」"
translation = "「빈틈 발견이다, 트윈 리퍼!」"

[[dialogue]]
speaker = "unk"
original = "アビスインパクト！"
translation = "어비스 임팩트!"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「クク、楽しいな、魔王！\u3000いつまでもこうしていたいくらいだ！」"
translation = "「크크, 즐겁구나 마왕! 언제까지고 이러고 싶을 정도다!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「なぁ、貴様もそう思うだろう？」"
translation = "「너도 그렇게 생각하지 않나?」"

[[dialogue]]
speaker = "unk"
original = "これは世界を救ったり何かを守ったりする戦いじゃない。"
translation = "이건 세계를 구하거나 무언가를 지키기 위한 싸움이 아니다."

[[dialogue]]
speaker = "unk"
original = "もう世界は救った後で、つまるところ意味のない戦いだ。それでも、いや、だからこそ──"
translation = "이미 세계를 구한 후의 일이고, 요컨대 의미 없는 싸움이다. 그래도, 아니, 그렇기에──"

[[dialogue]]
speaker = "unk"
original = "ああ、楽しい"
translation = "아아, 즐거워"

[[dialogue]]
speaker = "unk"
original = "イングリットは世界のことも、これからのことも、何も考えちゃいない。でも時にはそれくらい馬鹿になってもいい。"
translation = "잉그리드는 세계에 대해서도, 앞으로에 대해서도 아무것도 생각하지 않는다. 하지만 때로는 그만큼 바보가 되어도 좋다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「だが、貴様もそろそろ限界のようだな。では、決着といこうか」"
translation = "「하지만 네놈도 슬슬 한계인 모양이군. 그럼 결판을 내볼까」"

[[dialogue]]
speaker = "unk"
original = "どんなに苦しい時も、楽しい時も、永遠には続かない。"
translation = "아무리 괴로운 때도, 즐거운 때도 영원히 계속되지는 않는다."

[[dialogue]]
speaker = "unk"
original = "だから今を全力で戦う。それが生きるってことだと彼女は言う。"
translation = "그래서 지금을 전력으로 싸운다. 그것이 산다는 것이라고 그녀는 말한다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「我が必殺の太刀を受けてみろ、魔王！\u3000──ザンブレイクセイバー！！」"
translation = "「나의 필살의 태도를 받아라, 마왕! ──잔 브레이크 세이버!!」"

[[dialogue]]
speaker = "unk"
original = "ディマイズブレイカー！"
translation = "디마이즈 브레이커!"

[[dialogue]]
speaker = "unk"
original = "イングリットの戦いから受けた熱い気持ちを拳に込めて、今、解き放つ！"
translation = "잉그리드의 싸움에서 받은 뜨거운 감정을 주먹에 담아, 지금 해방한다!"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ふぅ、さすがに疲れたな……体が動かん」"
translation = "「후우, 역시 지치는군…… 몸이 움직이질 않아」"

[[dialogue]]
speaker = "unk"
original = "俺たちは最後の激突でともに意識を失い、勝負は引き分けとなった。２人して夜の砂浜に転がっている。"
translation = "우리들은 마지막 격돌에서 함께 의식을 잃었고, 승부는 무승부가 되었다. 둘이서 밤의 모래사장에 나란히 누워 있다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「次は私が勝つからな。覚えていろ」"
translation = "「다음엔 내가 이길 테니까 말이다. 기억해 둬라」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「やはりお前と戦うのは楽しいな。……よし、休憩したらもう一戦やるか」"
translation = "「역시 너와 싸우는 건 즐겁군. ……좋아, 휴식하고 나면 한 판 더 할까」"

[[dialogue]]
speaker = "unk"
original = "やらない"
translation = "안 해"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「チッ、ケチケチ魔王め。さっきはあんなにイキイキと戦っていたではないか」"
translation = "「칫, 구두쇠 마왕 같으니. 방금 전까지만 해도 그렇게 생생하게 싸웠지 않느냐」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「……だが、まあいい。今日は気分がいいから許してやろう」"
translation = "「……뭐, 됐다. 오늘은 기분이 좋으니 용서해 주지」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「人はいつまでも戦士でいることはできない。子どもは大人になり、大人は老人になり、そして死ぬ」"
translation = "「사람은 언제까지나 전사로 남을 수 없다. 아이는 어른이 되고, 어른은 노인이 되고, 그리고 죽지」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「だから、私たち戦士は子どもを産み、技を伝えてきた。いずれ私もそうするだろう」"
translation = "「그래서 우리 전사들은 아이를 낳고, 기술을 전수해 왔다. 조만간 나도 그렇게 하겠지」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「戦士であるうちに、私は最強へと至る。そのために貴様には何度でも付き合ってもらうからな」"
translation = "「전사로 있는 동안 나는 최강에 도달하겠다. 그러기 위해 네놈은 몇 번이고 어울려줘야 할 테니 말이다」"

[[dialogue]]
speaker = "unk"
original = "いつも通りの身勝手さが、今はちょっとだけ気持ちいい。俺も焼きが回ったかもしれない。"
translation = "평소와 다름없는 제멋대로임이 지금은 조금 기분 좋다. 나도 맛이 간 걸지도 모르겠다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ああ、そうだ。私とともにウリルに来る約束、忘れるなよ。貴様には責任を取ってもらうからな」"
translation = "「아아, 맞다. 나와 함께 우릴에 가기로 한 약속, 잊지 마라. 네놈은 책임을 져야 하니까 말이다!」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「えぇ～っ！？\u3000魔王さんとイングリット、そういうご関係だったんですか！？」"
translation = "「에에~!? 마왕 씨랑 잉그리드, 그런 관계였나요!?」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「実家にご挨拶！？\u3000しかも責任って！？」"
translation = "「본가에 인사!? 게다가 책임이라니!?」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「言葉通りの意味だが。何か文句でもあるのか？」"
translation = "「말 그대로의 의미다만. 무슨 불만이라도 있나?」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「文句なんてとんでもない！\u3000おめでとう、イングリット！\u3000魔王さんはこれからイングリットの事よろしくお願いしますね！\u3000うぅ～！」"
translation = "「불만이라니 당치도 않죠! 축하해, 잉그리드! 마왕 씨, 앞으로 잉그리드를 잘 부탁드려요! 으으~!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「なんだ？\u3000急に泣き出して気持ちの悪い奴だ」"
translation = "「뭐냐? 갑자기 울기 시작하다니 기분 나쁜 녀석이군」"

[[dialogue]]
speaker = "unk"
original = "ひどく誤解されてる気がする……"
translation = "지독하게 오해받고 있는 기분이 들어……"

[[dialogue]]
speaker = "unk"
original = "この日以降、イングリットと付き合っていると周囲に思われ、トラブルの尻拭いに駆り出されるようになってしまったのだった──"
translation = "이날 이후, 잉그리드와 사귀고 있다고 주위에 소문이 났고, 트러블의 뒤처리에 불려 다니게 된 것이었다──"

