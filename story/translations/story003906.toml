[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヒマワリ様、ミウ様、先日は大変失礼しましたわ」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「エルゼ先輩が謝ることないですよ！\u3000お屋敷に忍び込んだあたしたちが悪いんですから」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そうですよ。むしろ私たちこそ申し訳ありませんでした」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ところでエルデリーゼ先輩は今日もこちらのお屋敷にいらっしゃるんですね？」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はい。他の場所では人の目を気にしなければなりませんが、ここなら思う存分メイド服を着られますの♪」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヘレナ様からも好きに遊びに来てよいという許可を頂きましたし、本日はおふたりが立派にお役目を果たすところを見学させてもらいますわ！」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えへへ、あんまり見られてると恥ずかしいですけどね……」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（でも、エルデリーゼ先輩が近くにいてくれるのは好都合……人工戦闘服の能力を見るチャンスがあるかもしれない）"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「指導係の閃です。よろしくお願いします」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「同じくせつなでござる。よろしくお願いするでござる！」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「よろしくお願いしまーす♪」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「よろしくお願いします」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「では、さっそく指導を始めさせて頂きます」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「まずは家人の心得について……家人の仕事とは、主が望み、喜ぶこと全てにお応えする……それに尽きます」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「主の健康のため、チリひとつない空間を提供する掃除。清潔なお召し物を身に着けていただく洗濯。美味なのは当然、完璧な栄養バランスをも兼ね備えた料理」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「常に安全に気を配り、危険があれば速やかに排除し、陰ながら主の行動をサポートする……」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「絶対的な奉仕の心を胸に忠誠を尽くす、それが九浄家にお仕えする者の心得なのです！」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「あ～、閃殿のお嬢様に対する忠誠心は、私情が入っててちょっと極端なのでござる」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ええと、要するに何でもやる、ってことですかね？」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「であればゴールデングースでやっていることとおよそ同じですね」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「メイド隊メンバーはお屋敷で働きつつも、当主様からの勅命を受け、隠密・戦闘要員として外部での活動も多くおこなっているでござる」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「お仕事は多岐にわたるでござるよ。まさに『何でもやらなきゃいけない』でござる」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「新星学園のスポンサーである九浄家は、新星学園・流星学園を始めとして、様々な現場に人材を派遣しています」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「五名門のひとつである九浄家は、流星市国の『人材』を司ってますものね」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「よくご存じで。その人材派遣の中には、ボディガードや用心棒といった仕事もありまして」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「現場でモノになるか、まずは実力の程を見せていただきたいでござるよ。手合わせ、お願いいたしまする！」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わかりました！\u3000あたしたち、どっちかって言うと家事よりそっちの方が得意ですから！」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「こう見えて結構な数の修羅場、潜っているんですよ？」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「それは楽しみです。せつな、迎え撃ちますよ」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「では、皆様、準備はよろしいですの？\u3000ドキドキのタッグバトル、スタートですわーっ！」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「やぁああああっ！！！」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「ミウさんの武器……ふふ、可愛い顔にそぐわず、物騒な武器をお持ちですね？」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヘレナさんにもらったこの人工戦闘服の武器ですよ」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「ですが……あまり慣れていないようですね。大きさに振り回されているように見えますが？」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「今日が初めてですから。それに私は、そもそも近接戦は得意ではないんです」"
translation = ""

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そういえば……私と戦った時はヒマワリ様が前衛でしたわ」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「どうして役目を交換したのでござる？」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それはヘレナさんに聞いてください。人工戦闘服の武器を決めたのはヘレナさんなんですから」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ですが──新しい発見です。このフォーメーションも悪くないかもしれません」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「シュートっ！」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「させないでござるよっ！」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「大ぶりで目立つ武器で注意を集めつつ、本命の一撃はヒマワリ殿の弓でござる」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「さすれば、その弓を防ぎかく乱するのが、忍であるせつなのお役目！\u3000ヒマワリ殿、せつなに当てられるでござるか？」"
translation = "「그렇다면, 그 활을 막고 교란하는 것이, 닌자인 세츠나의 임무! 히마와리 도노, 세츠나에게 맞출 수 있겠소?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わっ、せつなさん速すぎっ！\u3000狙いが定まんないよー！\u3000ズルいなー忍者ズルいっ！」"
translation = "「와, 세츠나 씨 너무 빨라! 겨냥을 못 잡겠잖아─! 치사해─ 닌자 치사해!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ズルくないでござる！\u3000勝負の世界は、非情なのでござるよ！」"
translation = "「치사하지 않소! 승부의 세계는, 비정한 법이라오!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「でも、ヒマワリちゃんにばかり気を取られていると──私もいるんですよ？」"
translation = "「하지만, 히마와리 양에게만 신경을 쓰다 보면── 저도 있거든요?」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「っ！\u3000ミウ殿、いつの間に接近を！？」"
translation = "「윽! 미우 도노, 어느 사이에 접근을!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「せつなさん、これで１本です！」"
translation = "「세츠나 씨, 이걸로 1점이에요!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ふっふっふ、それはどうでござるかな？」"
translation = "「후후후, 과연 그럴까나?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「手応えがないっ！？」"
translation = "「손응답이 없어!?」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ふっふっふ、残念でござったな、そっちのせつなは影分身っ！\u3000ミウ殿、その首、いただきでござる！」"
translation = "「후후후, 아쉽게 됐소, 그쪽의 세츠나는 분신! 미우 도노, 그 목, 잘 가져가겠소!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「──なーんて。わかってますよ。ヒマワリちゃん、８時方向！」"
translation = "「──라~든가. 알고 있어요. 히마와리 양, 8시 방향!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「なっ！？」"
translation = "「뭣!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「せつなさんはミウが抑えて、その隙にあたしが閃さんを撃ーつ！」"
translation = "「세츠나 씨는 미우가 막고, 그 틈에 내가 센 씨를 쏜─다!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「くっ……！」"
translation = "「큭……!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「さすがですね、見事なコンビネーションでした……」"
translation = "「역시군요, 훌륭한 콤비네이션이었어요……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うーん、さすが……ごめんミウ、奇襲失敗だよ。しっかり防がれちゃった」"
translation = "「으음, 역시…… 미안 미우, 기습 실패야. 확실하게 막혀버렸어」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いつからこんな作戦を考えていたのですか？」"
translation = "「언제부터 이런 작전을 생각하고 계셨던 건가요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えーと、作戦っていうか……その場のノリ、みたいな感じですよ？」"
translation = "「에─또, 작전이라기보다는…… 그 자리의 분위기, 같은 느낌이에요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしはミウの動きに合わせて動いただけっていうか……」"
translation = "「난 미우의 움직임에 맞춰서 움직였을 뿐이랄까……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃんなら私の狙いをすぐに汲み取ってくれると信頼していますから」"
translation = "「히마와리 양이라면 제 의도를 바로 알아채줄 거라고 신뢰하고 있으니까요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ、完全に即興のコンビネーションでしたの！？」"
translation = "「어머, 완전히 즉흥 콤비네이션이었나요!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃんとお揃いの戦闘服だからでしょうか。お互いの体が繋がっているみたいで、自然と動きがリンクしていたんです」"
translation = "「히마와리 양과 커플룩 전투복이라서 그럴까요. 서로의 몸이 연결되어 있는 것 같아서, 자연스럽게 움직임이 링크되었어요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「せつなさんのスピードに追いつけたのも、この戦闘服のおかげかな？\u3000いつもより体が軽くて、飛んでるみたいだったよ」"
translation = "「세츠나 씨의 스피드를 따라잡을 수 있었던 것도, 이 전투복 덕분일까나? 평소보다 몸이 가벼워서, 날아다니는 것 같았어」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「九浄家の誇る人工戦闘服……使ってみて実感しました。本当にすごいです」"
translation = "「쿠조 가문이 자랑하는 인공 전투복…… 써보고 실감했습니다. 정말 대단해요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「しからばその戦闘服の力、今一度、使ってもらうでござるよ」"
translation = "「그러하면 그 전투복의 힘, 다시 한번, 써주셔야겠소」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ふぇ？」"
translation = "「후에?」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「ここからが本番です。私たちと一緒に来てください」"
translation = "「이제부터가 본방입니다. 저희와 함께 와주세요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それで私たちは何をすればいいですか？」"
translation = "「그래서 저희는 뭘 하면 되나요?」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「他でもござらん。犯罪グループの調査でござる」"
translation = "「다른 게 아니라오. 범죄 그룹의 조사라오」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「犯罪グループ！\u3000それだけで危険な香りがしますの……」"
translation = "「범죄 그룹! 그것만으로 위험한 향기가 풍기네요……」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「ここ最近、複数人で家に押し入り、金品を強奪するという事件が頻発しているんです」"
translation = "「요 근래, 여러 명이 집에 침입하여, 금품을 강탈하는 사건이 빈발하고 있어요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ひっどいなー！\u3000そんなの絶対許せないよー！」"
translation = "「너무하다─! 그런 거 절대 용서 못 해─!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「だよね……犯人を見つけ次第、全身のありとあらゆる穴という穴にアッツ～～いお灸を据えようね」"
translation = "「그렇지…… 범인을 발견하는 대로, 전신의 온갖 구멍이란 구멍에 뜨~~거운 뜸을 놓아줘야지」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「うひぃ！？\u3000ミウ殿の言い回し、想像しただけでおっかないでござるな！？」"
translation = "「으히익!? 미우 도노의 말투, 상상만 해도 무섭구려!?」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「この近隣が過去の犯行現場です。なかなか尻尾を見せないので、地道にパトロールをしているのですが……」"
translation = "「이 근처가 과거의 범행 현장입니다. 좀처럼 꼬리를 드러내지 않아서, 꾸준히 순찰을 돌고 있습니다만……」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「前回は未然に防げたのでござるが、取り逃がしてしまい……イタチごっこなのでござる」"
translation = "「지난번에는 미연에 방지했으나, 놓쳐버려서…… 람쥐 쳇바퀴 돌기라오」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「敵の居場所を突き止めるよい手段があれば良いのですが……」"
translation = "「적의 거처를 알아낼 좋은 수단이 있으면 좋겠습니다만……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「うーん……遠く離れた地方で類似の事件はなく、同様の犯行が流星市国内で繰り返し起きているのでしたら、犯人は流星市国内の個人情報を大量に入手している……」"
translation = "「으음…… 멀리 떨어진 지방에서 유사한 사건은 없고, 동종의 범행이 유성시 국내에서 반복해서 일어나고 있다면, 범인은 유성시 국내의 개인정보를 대량으로 입수했다……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「犯罪グループは流星市国内に潜伏しているのは間違いないと思います」"
translation = "「범죄 그룹은 유성시 국내에 잠복해 있는 게 틀림없다고 생각해요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「狙われるのは、<b>それなりに</b>お金を持っている層ですね。警察や配送業者を装い、貯蓄額や金目の物の有無を事前に調査しているのでしょう」"
translation = "「표적이 되는 건, <b>그나마</b> 돈을 가지고 있는 계층이네요. 경찰이나 배송 업자를 가장해, 저축액이나 돈이 될 만한 물건의 유무를 사전 조사하고 있는 거겠죠」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「『それなりに』？\u3000この辺は大きいお屋敷も多いし、お金持ちがいっぱい住んでるよ」"
translation = "「'그나마'? 이 근처는 큰 저택도 많고, 부자가 많이 살고 있잖아」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そうですわ！\u3000どうせ襲うならお金持ちを狙った方が良いのではありませんか？」"
translation = "「맞아요! 어차피 습격할 거라면 부자를 노리는 편이 좋지 않나요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「エルゼ先輩の実家のお屋敷みたいな？」"
translation = "「엘제 선배의 본가 저택 같은?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ええ。……まあ我が家はセキュリティが厳しいですから、お薦めは致しませんが」"
translation = "「네. ……뭐 저희 집은 보안이 철저하니, 추천하지는 않습니다만」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「まさにそれが、<b>それなりに</b>、な理由ですよ」"
translation = "「바로 그게, <b>그나마</b>, 인 이유예요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「大きなお屋敷は監視カメラやセキュリティがしっかりしてて防犯意識が高いですからね、潜入に５分以上かかるような家は最初からターゲットにしないんです」"
translation = "「큰 저택은 감시 카메라나 보안이 철저해서 방범 의식이 높으니까요, 침입에 5분 이상 걸릴 것 같은 집은 처음부터 타깃으로 삼지 않는 거예요」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「被害者宅の１軒目はここ、２軒目はここです。位置情報から、ある程度の法則性を見出せないでしょうか」"
translation = "「피해자 자택의 1번째는 여기, 2번째는 여기입니다. 위치 정보에서 어느 정도의 법칙성을 찾아낼 수 없을까요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃん、何か気づかない？\u3000私は次に狙われるのはこの付近だと思うんだけど──」"
translation = "「히마와리 양, 뭐 알아챈 거 없어? 나는 다음에 노려질 곳이 이 부근이라고 생각하는데──」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「何回も繰り返しているなら、そろそろ足が付きそうだと警戒するよね。犯人は『予想されるような家』は避けるんじゃないかな」"
translation = "「몇 번이나 반복하고 있다면, 이제 덜미가 잡힐까 봐 경계하겠지. 범인은 '예상할 만한 집'은 피하지 않을까」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「じゃ、今回は逆張りだね。どこだと思う？」"
translation = "「그럼, 이번에는 청개구리 전략이네. 어디라고 생각해?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あー……お金の消える気配がするのは、この家かな？\u3000なんとなく、イヤ～な臭いがするんだよね」"
translation = "「아─…… 돈이 사라질 기운이 나는 건, 이 집일까나? 왠지, 불길~~한 냄새가 난단 말이지」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ここは……被害にあった１軒目の隣ではありませんの？\u3000まさか、そんな大胆に──」"
translation = "「여기는…… 피해를 입은 1번째 집의 옆집 아닌가요? 설마, 그렇게 대담하게──」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「同じ価格帯の家ですから、同レベルの資産を抱えているでしょう。ほとぼりが冷めた頃、ウチには来ないだろうという『まさか』の盲点を突く可能性はあります」"
translation = "「같은 가격대의 집이니, 비슷한 수준의 자산을 가지고 있겠죠. 소문이 가라앉을 무렵, 우리 집에는 안 오겠지라는 '설마'의 맹점을 찌를 가능성은 있어요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「なんだか、すごい説得力があるでござる……！」"
translation = "「어쩐지, 엄청난 설득력이 있소……!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「いいですね。ミウさんの判断と、ヒマワリさんの嗅覚を信じましょう」"
translation = "「좋네요. 미우 씨의 판단과, 히마와리 씨의 감을 믿어보죠」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「スモークガラスに、真っ黒なナンバープレートのワゴン……如何にも怪しい車が来たでござる……！」"
translation = "「스모크 글라스에, 새까만 번호판의 승합차…… 딱 봐도 수상한 차가 왔소……!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「間違いないでしょう……あっ、家の前に停まりました」"
translation = "「틀림없겠군요…… 아, 집 앞에 멈췄습니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いよいよ悪党を成敗ですわね！\u3000腕が鳴りますわ！」"
translation = "「드디어 악당을 응징할 때군요! 근질근질하네요!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「あ……エルデリーゼ様はここまでで。ここからは桜十路家のお嬢様にはお見せできない世界ですので」"
translation = "「아…… 엘데리제 님은 여기까지입니다. 여기서부터는 사쿠라쥬지 가문의 영애에게는 보여드릴 수 없는 세계니까요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「えーーーっ！\u3000そんな事言わずに、私も連れて行って欲しいですの……」"
translation = ""

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「もうしわけありません……」"
translation = "「죄송합니다……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「仕方ありませんの……ミウ様、ヒマワリ様！\u3000どうぞお気をつけて！」"
translation = "「어쩔 수 없네요…… 미우 님, 히마와리 님! 부디 조심하세요!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ありがとうございます」"
translation = "「감사합니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「頑張ってきますねっ！」"
translation = "「힘내서 다녀올게요!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「では、制圧します！」"
translation = "「그럼, 제압하겠습니다!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「不埒な輩は、まとめて成敗でござるっ！」"
translation = "「불순한 무리는, 모조리 응징하겠소!」"

[[dialogue]]
speaker_original = "強盗"
speaker_translation = "強盗"
original = "「な、なんだ、てめぇら！？」"
translation = "「머, 뭐야, 네놈들은!?」"

[[dialogue]]
speaker = "unk"
original = "こうして４人の活躍により、強盗事件は未然に防ぐことができたのだった。"
translation = "이렇게 4인의 활약으로, 강도 사건은 미연에 방지할 수 있었던 것이었다."

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「おふたりとも、お手柄でした。ですが、彼らは犯罪グループの末端の構成員でしかないようですね」"
translation = "「두 분 모두, 공을 세우셨어요. 하지만, 그들은 범죄 그룹의 말단 구성원에 불과한 것 같네요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ボスをやっつけない限り、雑魚モンスターがわらわら出てきちゃうみたいなー？」"
translation = "「보스를 처치하지 않는 한, 잔챙이 몬스터가 우글우글 나와버리는 느낌─?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「焦げ臭いならば、火元から断たないと、ですね」"
translation = "「탄내를 풍긴다면, 불씨부터 끊어내야,겠죠」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「せつなさん、捕まえた犯人に聞いてみましょう。１人、連れてきてください」"
translation = "「세츠나 씨, 붙잡은 범인에게 물어보죠. 1명, 데리고 와주세요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「そんな簡単に口を割るとも思えないでござるが」"
translation = "「그렇게 쉽게 입을 열 것 같지는 않소만」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はい、私も簡単に割ってくれるとは思ってませんよ。なので、簡単ではない方法で尋ねてみましょう♪」"
translation = "「네, 저도 쉽게 열어줄 거라곤 생각하지 않아요. 그러니, 쉽지 않은 방법으로 물어보죠♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「全部なくなっちゃう前に、話してくれるといいんですけどね」"
translation = "「전부 없어지기 전에, 말해주면 좋겠는데요」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「『全部なくなっちゃう前』……？\u3000あの、ミウさん？\u3000その大きな剃刀で、何をするつもりなんです……？」"
translation = "「'전부 없어지기 전'……? 저기, 미우 씨? 그 큰 면도칼로, 뭘 할 셈인가요……?」"

[[dialogue]]
speaker_original = "強盗"
speaker_translation = "強盗"
original = "「んぎゃああああぁぁぁぁっ！！？\u3000わかった話す！\u3000知ってること全部話すからもうやめ、やめてくれぇえええぇえぇっ！」"
translation = "「으갸아아아아아아악!!? 알았어 말할게! 알고 있는 거 전부 말할 테니까 이제 그, 그만해줘어어어어어어억!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ん……この野太い悲鳴は何の悲鳴ですの？」"
translation = "「음…… 이 굵직한 비명은 무슨 비명인가요?」"

[[dialogue]]
speaker = "unk"
original = "最初は強情だった構成員の絶叫が響く。"
translation = "처음에는 완강했던 구성원의 절규가 울려 퍼진다."

[[dialogue]]
speaker = "unk"
original = "ミウの尋問が始まってから約１０分ほどで、犯罪グループの指示役の潜入するアジトが明らかになった。"
translation = "미우의 심문이 시작되고 약 10분 정도 만에, 범죄 그룹 지휘책이 잠복해 있는 아지트가 밝혀졌다."

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ガクガクブルブル……ミウ殿、恐ろしい子でござる……！」"
translation = "「덜덜덜덜…… 미우 도노, 무서운 아이구려……!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「お、お手柄です、ミウさん」"
translation = "「공, 공을 세우셨어요, 미우 씨」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ありがとうございます♪\u3000ゴールデングースで培った技術が活かせました」"
translation = "「감사합니다♪ 골든 구스에서 배운 기술을 살릴 수 있었어요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うんうん、あたしたちを育ててくれたセナリィ社長のおかげ！\u3000感謝感謝だね！」"
translation = "「응응, 우리를 키워준 세나리 사장님 덕분! 감사감사해야겠네!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「……おや？\u3000せつなの記憶が確かならば、ヒマワリ殿はセナリィ殿に嫌気が差していたのではござらぬか？\u3000主殿との面接の時──」"
translation = "「……어라? 세츠나의 기억이 확실하다면, 히마와리 도노는 세나리 도노에게 정이 떨어졌던 게 아니오? 주군과의 면접 때──」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「そ、そうだった、そうでした！\u3000セナリィ社長に感謝なんて、これっぽっちもしてないよーだ！」"
translation = "「그, 그랬지, 그랬었죠! 세나리 사장님한테 감사 같은 거, 눈곱만큼도 안 하거든─!」"

[[dialogue]]
speaker = "unk"
original = "その数日後、続けざまに強盗事件を起こしていた犯罪グループは壊滅。"
translation = "그 며칠 뒤, 연달아 강도 사건을 일으키던 범죄 그룹은 괴멸."

[[dialogue]]
speaker = "unk"
original = "首謀者は海外に逃亡する前に捕縛され、法の裁きを受けることとなった。"
translation = "주모자는 해외로 도망치기 전에 체포되어, 법의 심판을 받게 되었다."

