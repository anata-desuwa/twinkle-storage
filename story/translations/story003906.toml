[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヒマワリ様、ミウ様、先日は大変失礼しましたわ」"
translation = "「히마와리 님, 미우 님, 요 전날은 정말 실례했습니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「エルゼ先輩が謝ることないですよ！\u3000お屋敷に忍び込んだあたしたちが悪いんですから」"
translation = "「엘제 선배가 사과할 필요 없어요! 저택에 몰래 들어간 우리가 나쁜 거니까요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そうですよ。むしろ私たちこそ申し訳ありませんでした」"
translation = "「맞아요. 오히려 저희야말로 죄송했습니다」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ところでエルデリーゼ先輩は今日もこちらのお屋敷にいらっしゃるんですね？」"
translation = "「그나저나 엘데리제 선배는 오늘도 이 저택에 계시는군요?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はい。他の場所では人の目を気にしなければなりませんが、ここなら思う存分メイド服を着られますの♪」"
translation = "「네. 다른 장소에서는 남의 눈을 신경 써야 하지만, 여기라면 마음껏 메이드복을 입을 수 있거든요♪」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヘレナ様からも好きに遊びに来てよいという許可を頂きましたし、本日はおふたりが立派にお役目を果たすところを見学させてもらいますわ！」"
translation = "「헬레나 님으로부터도 마음껏 놀러 와도 좋다는 허락을 받았고, 오늘은 두 분이 훌륭하게 맡은 바 임무를 다하는 모습을 견학하도록 하겠어요!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えへへ、あんまり見られてると恥ずかしいですけどね……」"
translation = "「에헤헤, 너무 보고 계시면 부끄럽지만요……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（でも、エルデリーゼ先輩が近くにいてくれるのは好都合……人工戦闘服の能力を見るチャンスがあるかもしれない）"
translation = "（하지만, 엘데리제 선배가 가까이 있어주는 건 다행이야…… 인공 전투복의 능력을 볼 기회가 있을지도 몰라）"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「指導係の閃です。よろしくお願いします」"
translation = "「지도 담당인 센입니다. 잘 부탁드립니다」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「同じくせつなでござる。よろしくお願いするでござる！」"
translation = "「마찬가지로 세츠나라 소인. 잘 부탁드리는 바이라 소인!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「よろしくお願いしまーす♪」"
translation = "「잘 부탁드려요~♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「よろしくお願いします」"
translation = "「잘 부탁드립니다」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「では、さっそく指導を始めさせて頂きます」"
translation = "「그럼, 곧바로 지도를 시작하도록 하겠습니다」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「まずは家人の心得について……家人の仕事とは、主が望み、喜ぶこと全てにお応えする……それに尽きます」"
translation = "「우선 고용인의 마음가짐에 대해…… 고용인의 일이란, 주인이 바라고, 기뻐하는 모든 것에 응하는 것…… 그것뿐입니다」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「主の健康のため、チリひとつない空間を提供する掃除。清潔なお召し物を身に着けていただく洗濯。美味なのは当然、完璧な栄養バランスをも兼ね備えた料理」"
translation = "「주인의 건강을 위해, 먼지 하나 없는 공간을 제공하는 청소. 청결한 옷을 입으실 수 있도록 하는 빨래. 맛있는 것은 당연, 완벽한 영양 밸런스까지 겸비한 요리」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「常に安全に気を配り、危険があれば速やかに排除し、陰ながら主の行動をサポートする……」"
translation = "「항상 안전에 신경 쓰고, 위험이 있다면 즉시 배제하며, 그림자로서 주인의 행동을 서포트한다……」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「絶対的な奉仕の心を胸に忠誠を尽くす、それが九浄家にお仕えする者の心得なのです！」"
translation = "「절대적인 봉사의 마음을 가슴에 품고 충성을 다하는 것, 그것이 쿠죠가를 섬기는 자의 마음가짐입니다!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「あ～、閃殿のお嬢様に対する忠誠心は、私情が入っててちょっと極端なのでござる」"
translation = "「아~, 센 전하의 아가씨에 대한 충성심은, 사정이 들어가서 약간 극단적인 거라 소인」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ええと、要するに何でもやる、ってことですかね？」"
translation = "「에또, 요컨대 뭐든지 한다, 라는 뜻인가요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「であればゴールデングースでやっていることとおよそ同じですね」"
translation = "「그렇다면 골든 구스에서 하고 있는 일과 거의 같네요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「メイド隊メンバーはお屋敷で働きつつも、当主様からの勅命を受け、隠密・戦闘要員として外部での活動も多くおこなっているでござる」"
translation = "「메이드대 멤버는 저택에서 일하면서도, 당주님으로부터 칙명을 받아, 은밀·전투 요원으로서 외부 활동도 많이 실시하고 있다 소인」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「お仕事は多岐にわたるでござるよ。まさに『何でもやらなきゃいけない』でござる」"
translation = "「일은 다방면에 걸쳐 있다 소인. 그야말로 『뭐든지 해야만 한다』라 소인」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「新星学園のスポンサーである九浄家は、新星学園・流星学園を始めとして、様々な現場に人材を派遣しています」"
translation = "「신성학원의 스폰서인 쿠죠가는, 신성학원·유성학원을 시작으로, 다양한 현장에 인재를 파견하고 있습니다」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「五名門のひとつである九浄家は、流星市国の『人材』を司ってますものね」"
translation = "「명문 가문 중 하나인 쿠죠가는, 류세이 시국의 『인재』를 관장하고 있으니까요」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「よくご存じで。その人材派遣の中には、ボディガードや用心棒といった仕事もありまして」"
translation = "「잘 알고 계시군요. 그 인재 파견 중에는, 보디가드나 경호원 같은 일도 있어서」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「現場でモノになるか、まずは実力の程を見せていただきたいでござるよ。手合わせ、お願いいたしまする！」"
translation = "「현장에서 쓸 만한지, 우선 실력 정도를 보여주셨으면 한다 소인. 겨루기, 부탁드리는 바이라 소인!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わかりました！\u3000あたしたち、どっちかって言うと家事よりそっちの方が得意ですから！」"
translation = "「알겠습니다! 우리들, 어느 쪽인가 하면 가사보다 그쪽이 더 특기니까요!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「こう見えて結構な数の修羅場、潜っているんですよ？」"
translation = "「이래 보여도 제법 많은 수라장을, 넘나들었다구요?」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「それは楽しみです。せつな、迎え撃ちますよ」"
translation = "「그것참 기대되네요. 세츠나, 맞서 싸우죠」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「では、皆様、準備はよろしいですの？\u3000ドキドキのタッグバトル、スタートですわーっ！」"
translation = "「그럼, 여러분, 준비는 되셨나요? 두근두근 태그 배틀, 스타트예요─!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「やぁああああっ！！！」"
translation = "「야아아아앗!!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「ミウさんの武器……ふふ、可愛い顔にそぐわず、物騒な武器をお持ちですね？」"
translation = "「미우 씨의 무기…… 후후, 귀여운 얼굴에 어울리지 않게, 험악한 무기를 가지고 계시네요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヘレナさんにもらったこの人工戦闘服の武器ですよ」"
translation = "「헬레나 씨에게 받은 이 인공 전투복의 무기예요」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「ですが……あまり慣れていないようですね。大きさに振り回されているように見えますが？」"
translation = "「하지만…… 그다지 익숙지 않은 것 같네요. 크기에 휘둘리고 있는 것처럼 보입니다만?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「今日が初めてですから。それに私は、そもそも近接戦は得意ではないんです」"
translation = "「오늘이 처음이니까요. 게다가 저는, 애초에 근접전은 특기가 아니에요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そういえば……私と戦った時はヒマワリ様が前衛でしたわ」"
translation = "「그러고 보니…… 저와 싸웠을 때는 히마와리 님이 전위였어요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「どうして役目を交換したのでござる？」"
translation = "「어째서 역할을 교대했냐 소인?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それはヘレナさんに聞いてください。人工戦闘服の武器を決めたのはヘレナさんなんですから」"
translation = "「그건 헬레나 씨에게 물어보세요. 인공 전투복의 무기를 정한 건 헬레나 씨니까요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ですが──新しい発見です。このフォーメーションも悪くないかもしれません」"
translation = "「하지만── 새로운 발견이에요. 이 포메이션도 나쁘지 않을지도 몰라요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「シュートっ！」"
translation = "「슛─!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「させないでござるよっ！」"
translation = "「못 하게 한다 소인!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「大ぶりで目立つ武器で注意を集めつつ、本命の一撃はヒマワリ殿の弓でござる」"
translation = "「큼직하고 눈에 띄는 무기로 주의를 끌면서, 본명의 일격은 히마와리 전하의 활이라 소인」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「さすれば、その弓を防ぎかく乱するのが、忍であるせつなのお役目！\u3000ヒマワリ殿、せつなに当てられるでござるか？」"
translation = "「그렇다면, 그 활을 막고 교란하는 것이, 닌자인 세츠나의 역할! 히마와리 전하, 세츠나에게 맞출 수 있겠냐 소인?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わっ、せつなさん速すぎっ！\u3000狙いが定まんないよー！\u3000ズルいなー忍者ズルいっ！」"
translation = "「와, 세츠나 씨 너무 빨라! 겨냥을 못 잡겠잖아─! 치사해─ 닌자 치사해!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ズルくないでござる！\u3000勝負の世界は、非情なのでござるよ！」"
translation = "「치사하지 않다 소인! 승부의 세계는, 비정한 거라 소인!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「でも、ヒマワリちゃんにばかり気を取られていると──私もいるんですよ？」"
translation = "「하지만, 히마와리짱에게만 정신을 팔리고 있으면── 저도 있다구요?」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「っ！\u3000ミウ殿、いつの間に接近を！？」"
translation = "「윽! 미우 전하, 어느 사이에 접근을!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「せつなさん、これで１本です！」"
translation = "「세츠나 씨, 이걸로 1본입니다!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ふっふっふ、それはどうでござるかな？」"
translation = "「훗훗훗, 과연 그럴까 소인?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「手応えがないっ！？」"
translation = "「손맛이 없어!?」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ふっふっふ、残念でござったな、そっちのせつなは影分身っ！\u3000ミウ殿、その首、いただきでござる！」"
translation = "「훗훗훗, 안됐게 됐다 소인, 그쪽 세츠나는 그림자 분신! 미우 전하, 그 목, 거두어가겠다 소인!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「──なーんて。わかってますよ。ヒマワリちゃん、８時方向！」"
translation = "「──라는 건. 알고 있어요. 히마와리짱, 8시 방향!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「なっ！？」"
translation = "「나앗!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「せつなさんはミウが抑えて、その隙にあたしが閃さんを撃ーつ！」"
translation = "「세츠나 씨는 미우가 억제하고, 그 틈에 내가 센 씨를 쏜─다!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「くっ……！」"
translation = "「큭……!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「さすがですね、見事なコンビネーションでした……」"
translation = "「과연 대단하네요, 훌륭한 콤비네이션이었습니다……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うーん、さすが……ごめんミウ、奇襲失敗だよ。しっかり防がれちゃった」"
translation = "「으─음, 역시…… 미안 미우, 기습 실패야. 확실하게 막혀버렸어」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いつからこんな作戦を考えていたのですか？」"
translation = "「언제부터 이런 작전을 생각하고 있었던 건가요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えーと、作戦っていうか……その場のノリ、みたいな感じですよ？」"
translation = "「에─또, 작전이라기보다는…… 그 자리의 흥, 같은 느낌인데요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしはミウの動きに合わせて動いただけっていうか……」"
translation = "「나 행동은 미우의 움직임에 맞춰서 움직였을 뿐이랄까……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃんなら私の狙いをすぐに汲み取ってくれると信頼していますから」"
translation = "「히마와리짱이라면 내 노림수를 바로 알아채줄 거라고 신뢰하고 있으니까요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ、完全に即興のコンビネーションでしたの！？」"
translation = "「어머, 완전히 즉흥 콤비네이션이었나요!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃんとお揃いの戦闘服だからでしょうか。お互いの体が繋がっているみたいで、自然と動きがリンクしていたんです」"
translation = "「히마와리짱과 커플룩 전투복이라서 그럴까요. 서로의 몸이 연결되어 있는 것 같아서, 자연스럽게 움직임이 링크되었어요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「せつなさんのスピードに追いつけたのも、この戦闘服のおかげかな？\u3000いつもより体が軽くて、飛んでるみたいだったよ」"
translation = "「세츠나 씨의 스피드를 따라잡을 수 있었던 것도, 이 전투복 덕분일까? 평소보다 몸이 가벼워서, 날아다니는 것 같았어」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「九浄家の誇る人工戦闘服……使ってみて実感しました。本当にすごいです」"
translation = "「쿠죠가가 자랑하는 인공 전투복…… 사용해 보고 실감했어요. 정말로 대단해요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「しからばその戦闘服の力、今一度、使ってもらうでござるよ」"
translation = "「그렇다면 그 전투복의 힘, 다시 한번, 써주셔야겠다 소인」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ふぇ？」"
translation = "「휑?」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「ここからが本番です。私たちと一緒に来てください」"
translation = "「지금부터가 본방입니다. 저희와 함께 와주시죠」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それで私たちは何をすればいいですか？」"
translation = "「그래서 저희는 뭘 하면 되나요?」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「他でもござらん。犯罪グループの調査でござる」"
translation = "「다름이 아니라 소인. 범죄 그룹의 조사라 소인」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「犯罪グループ！\u3000それだけで危険な香りがしますの……」"
translation = "「범죄 그룹! 그것만으로도 위험한 향기가 나네요……」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「ここ最近、複数人で家に押し入り、金品を強奪するという事件が頻発しているんです」"
translation = "「요 최근, 여러 명이 집에 침입하여, 금품을 강탈하는 사건이 빈발하고 있습니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ひっどいなー！\u3000そんなの絶対許せないよー！」"
translation = "「너무해─! 그런 건 절대 용서할 수 없어─!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「だよね……犯人を見つけ次第、全身のありとあらゆる穴という穴にアッツ～～いお灸を据えようね」"
translation = "「그렇지…… 범인을 발견하는 즉시, 전신의 온갖 구멍이란 구멍에 뜨~~거운 뜸을 놓아주자」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「うひぃ！？\u3000ミウ殿の言い回し、想像しただけでおっかないでござるな！？」"
translation = "「우히익!? 미우 전하의 돌려 말하기, 상상하는 것만으로도 무섭다 소인!?」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「この近隣が過去の犯行現場です。なかなか尻尾を見せないので、地道にパトロールをしているのですが……」"
translation = "「이 근처가 과거 범행 현장입니다. 좀처럼 꼬리를 드러내지 않아서, 꾸준히 순찰을 하고 있습니다만……」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「前回は未然に防げたのでござるが、取り逃がしてしまい……イタチごっこなのでござる」"
translation = "「지난번에는 미연에 방지했다 소인만, 놓쳐버려서…… 람쥐 쳇바퀴 돌기라 소인」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「敵の居場所を突き止めるよい手段があれば良いのですが……」"
translation = "「적의 거처를 밝혀낼 좋은 수단이 있으면 좋겠습니다만……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「うーん……遠く離れた地方で類似の事件はなく、同様の犯行が流星市国内で繰り返し起きているのでしたら、犯人は流星市国内の個人情報を大量に入手している……」"
translation = "「으─음…… 멀리 떨어진 지방에서 유사한 사건은 없고, 동종의 범행이 류세이 시국 내에서 반복해서 일어나고 있다면, 범인은 류세이 시국 내의 개인정보를 대량으로 입수하고 있다……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「犯罪グループは流星市国内に潜伏しているのは間違いないと思います」"
translation = "「범죄 그룹은 류세이 시국 내에 잠복해 있는 게 틀림없다고 생각해요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「狙われるのは、<b>それなりに</b>お金を持っている層ですね。警察や配送業者を装い、貯蓄額や金目の物の有無を事前に調査しているのでしょう」"
translation = "「노려지는 건, <b>그나마</b> 돈을 가지고 있는 계층이겠네요. 경찰이나 배송업자로 위장해, 저축액이나 돈이 될 만한 물건의 유무를 사전에 조사하고 있는 거겠죠」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「『それなりに』？\u3000この辺は大きいお屋敷も多いし、お金持ちがいっぱい住んでるよ」"
translation = "「『그나마』? 이 근처는 큰 저택도 많고, 부자가 엄청 많이 살고 있어」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そうですわ！\u3000どうせ襲うならお金持ちを狙った方が良いのではありませんか？」"
translation = "「맞아요! 어차피 들이칠 거라면 부자를 노리는 편이 좋지 않겠어요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「エルゼ先輩の実家のお屋敷みたいな？」"
translation = "「엘제 선배 본가의 저택 같은 곳?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ええ。……まあ我が家はセキュリティが厳しいですから、お薦めは致しませんが」"
translation = "「네. ……뭐 우리 집은 보안이 철저하니까, 추천하지는 않습니다만」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「まさにそれが、<b>それなりに</b>、な理由ですよ」"
translation = "「바로 그 점이, <b>그나마</b>, 라는 이유예요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「大きなお屋敷は監視カメラやセキュリティがしっかりしてて防犯意識が高いですからね、潜入に５分以上かかるような家は最初からターゲットにしないんです」"
translation = "「큰 저택은 감시 카메라나 보안이 확실해서 방범 의식이 높으니까요, 잠입에 5분 이상 걸릴 것 같은 집은 처음부터 타겟으로 삼지 않는 거예요」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「被害者宅の１軒目はここ、２軒目はここです。位置情報から、ある程度の法則性を見出せないでしょうか」"
translation = "「피해자 자택 1번째는 여기, 2번째는 여기입니다. 위치 정보에서, 어느 정도의 법칙성을 찾아낼 수 없을까요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃん、何か気づかない？\u3000私は次に狙われるのはこの付近だと思うんだけど──」"
translation = "「히마와리짱, 뭐 알아챈 거 없어? 나는 다음에 노려질 곳이 이 근처라고 생각하는데──」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「何回も繰り返しているなら、そろそろ足が付きそうだと警戒するよね。犯人は『予想されるような家』は避けるんじゃないかな」"
translation = "「몇 번이나 반복하고 있다면, 슬슬 꼬리가 잡힐까 봐 경계하겠지. 범인은 『예상할 만한 집』은 피하지 않을까」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「じゃ、今回は逆張りだね。どこだと思う？」"
translation = "「그럼, 이번에는 역발상이네. 어디라고 생각해?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あー……お金の消える気配がするのは、この家かな？\u3000なんとなく、イヤ～な臭いがするんだよね」"
translation = "「아─…… 돈이 사라질 기새가 나는 건, 이 집일까? 왠지, 불쾌~한 냄새가 난단 말이지」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ここは……被害にあった１軒目の隣ではありませんの？\u3000まさか、そんな大胆に──」"
translation = "「이곳은…… 피해를 입은 1번째 집 옆이 아니인가요? 설마, 그렇게 대담하게──」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「同じ価格帯の家ですから、同レベルの資産を抱えているでしょう。ほとぼりが冷めた頃、ウチには来ないだろうという『まさか』の盲点を突く可能性はあります」"
translation = "「같은 가격대의 집이니까, 비슷한 수준의 자산을 가지고 있겠죠. 소문이 잠잠해질 무렵, 우리 집엔 안 오겠지라는 『설마』의 허점을 찌를 가능성은 있어요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「なんだか、すごい説得力があるでござる……！」"
translation = "「왠지, 엄청 설득력이 있다 소인……!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「いいですね。ミウさんの判断と、ヒマワリさんの嗅覚を信じましょう」"
translation = "「좋네요. 미우 씨의 판단과, 히마와리 씨의 후각을 믿어보죠」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「スモークガラスに、真っ黒なナンバープレートのワゴン……如何にも怪しい車が来たでござる……！」"
translation = "「스모크 글라스에, 새까만 번호판의 승합차…… 딱 봐도 수상한 차가 왔다 소인……!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「間違いないでしょう……あっ、家の前に停まりました」"
translation = "「틀림없겠네요…… 앗, 집 앞에 멈춰 섰습니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いよいよ悪党を成敗ですわね！\u3000腕が鳴りますわ！」"
translation = "「드디어 악당을 처단할 때군요! 근질근질하네요!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「あ……エルデリーゼ様はここまでで。ここからは桜十路家のお嬢様にはお見せできない世界ですので」"
translation = "「아…… 엘데리제 님은 여기까지. 지금부터는 사쿠라쥬지가의 아가씨에게는 보여드릴 수 없는 세계니까요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「えーーーっ！\u3000そんな事言わずに、私も連れて行って欲しいですの……」"
translation = "「에───잇! 그런 말 하지 마시고, 저도 데려가 주셨으면 해요……」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「もうしわけありません……」"
translation = "「죄송합니다……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「仕方ありませんの……ミウ様、ヒマワリ様！\u3000どうぞお気をつけて！」"
translation = "「어쩔 수 없네요…… 미우 님, 히마와리 님! 부디 조심하세요!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ありがとうございます」"
translation = "「감사합니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「頑張ってきますねっ！」"
translation = "「힘내고 올게요!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「では、制圧します！」"
translation = "「그럼, 제압하겠습니다!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「不埒な輩は、まとめて成敗でござるっ！」"
translation = "「불순한 무리는, 모조리 응징하겠소!」"

[[dialogue]]
speaker_original = "強盗"
speaker_translation = "強盗"
original = "「な、なんだ、てめぇら！？」"
translation = "「뭐, 뭐야, 너희들은!?」"

[[dialogue]]
speaker = "unk"
original = "こうして４人の活躍により、強盗事件は未然に防ぐことができたのだった。"
translation = "이렇게 4인의 활약으로 인해, 강도 사건은 미연에 방지할 수 있었던 것이었다."

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「おふたりとも、お手柄でした。ですが、彼らは犯罪グループの末端の構成員でしかないようですね」"
translation = "「두 분 모두, 큰 공을 세우셨습니다. 그렇지만, 그들은 범죄 그룹의 말단 조직원에 불과한 것 같네요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ボスをやっつけない限り、雑魚モンスターがわらわら出てきちゃうみたいなー？」"
translation = "「보스를 해치우지 않는 한, 조무래기 몬스터가 바글바글 나와버리는 느낌─?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「焦げ臭いならば、火元から断たないと、ですね」"
translation = "「탄내가 난다면, 불씨부터 끊어야, 겠죠」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「せつなさん、捕まえた犯人に聞いてみましょう。１人、連れてきてください」"
translation = "「세츠나 씨, 잡은 범인에게 물어보죠. 1명, 데리고 와주세요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「そんな簡単に口を割るとも思えないでござるが」"
translation = "「그렇게 쉽게 입을 열 것 같지도 않다 소인만」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はい、私も簡単に割ってくれるとは思ってませんよ。なので、簡単ではない方法で尋ねてみましょう♪」"
translation = "「네, 저도 쉽게 불어줄 거라고 생각하진 않아요. 그러니까, 쉽지 않은 방법으로 물어보죠♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「全部なくなっちゃう前に、話してくれるといいんですけどね」"
translation = "「전부 없어지기 전에, 이야기해 주면 좋겠지만요」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「『全部なくなっちゃう前』……？\u3000あの、ミウさん？\u3000その大きな剃刀で、何をするつもりなんです……？」"
translation = "「『전부 없어지기 전』……? 저기, 미우 씨? 그 큰 면도칼로, 뭘 할 셈인가요……?」"

[[dialogue]]
speaker_original = "強盗"
speaker_translation = "強盗"
original = "「んぎゃああああぁぁぁぁっ！！？\u3000わかった話す！\u3000知ってること全部話すからもうやめ、やめてくれぇえええぇえぇっ！」"
translation = "「으갸아아아아아아앗!!? 알았어 말할게! 아는 거 전부 말할 테니까 이제 그, 그만해줘어어어어억!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ん……この野太い悲鳴は何の悲鳴ですの？」"
translation = "「응…… 이 굵직한 비명은 무슨 비명인가요?」"

[[dialogue]]
speaker = "unk"
original = "最初は強情だった構成員の絶叫が響く。"
translation = "처음에는 완강했던 조직원의 비명이 울려 퍼진다."

[[dialogue]]
speaker = "unk"
original = "ミウの尋問が始まってから約１０分ほどで、犯罪グループの指示役の潜入するアジトが明らかになった。"
translation = "미우의 심문이 시작되고 약 10분 정도 만에, 범죄 그룹의 지시역이 잠입해 있는 아지트가 밝혀졌다."

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ガクガクブルブル……ミウ殿、恐ろしい子でござる……！」"
translation = "「덜덜덜덜…… 미우 전하, 무서운 아이라 소인……!」"

[[dialogue]]
speaker_original = "閃"
speaker_translation = "센"
original = "「お、お手柄です、ミウさん」"
translation = "「큰, 공을 세우셨어요, 미우 씨」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ありがとうございます♪\u3000ゴールデングースで培った技術が活かせました」"
translation = "「감사합니다♪ 골든 구스에서 다진 기술을 살릴 수 있었어요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うんうん、あたしたちを育ててくれたセナリィ社長のおかげ！\u3000感謝感謝だね！」"
translation = "「응응, 우리를 키워준 세나리 사장님 덕분! 감사감사네!」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「……おや？\u3000せつなの記憶が確かならば、ヒマワリ殿はセナリィ殿に嫌気が差していたのではござらぬか？\u3000主殿との面接の時──」"
translation = "「……어라? 세츠나의 기억이 확실하다면, 히마와리 전하는 세나리 전하에게 정나미가 떨어졌던 게 아니었던가 소인? 주인 전하와의 면접 때──」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「そ、そうだった、そうでした！\u3000セナリィ社長に感謝なんて、これっぽっちもしてないよーだ！」"
translation = "「그, 그랬지, 그랬었습니다! 세나리 사장님에게 감사 따위, 눈곱만큼도 안 한다고─!」"

[[dialogue]]
speaker = "unk"
original = "その数日後、続けざまに強盗事件を起こしていた犯罪グループは壊滅。"
translation = "그로부터 며칠 후, 잇따라 강도 사건을 일으키던 범죄 그룹은 궤멸."

[[dialogue]]
speaker = "unk"
original = "首謀者は海外に逃亡する前に捕縛され、法の裁きを受けることとなった。"
translation = "주모자는 해외로 도망치기 전에 체포되어, 법의 심판을 받게 되었다."

