[[dialogue]]
speaker = "unk"
original = "休日の深夜──蘭美は今日、俺の家にお泊まりに来ている。"
translation = "휴일의 한밤중──라비는 오늘, 우리 집에 자러 와 있다."

[[dialogue]]
speaker = "unk"
original = "前もって母さんは留守であること。２人きりで何の気兼ねもないことを伝えていた。"
translation = "미리 어머니가 부재중이라는 것. 둘이서만 아무 거리낌이 없다는 것을 전달해 두었다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁっ、はぁあっ……<emoji=heart04>\u3000か、会長っ……私、もう我慢、できないのぉ……<emoji=heart04>」"
translation = "「하아읏, 하아아앗……<emoji=heart04> 회, 회장…… 나, 이제 참을 수, 없어어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "寝室に入るなり、とろんとした瞳でそう告げてくる蘭美。"
translation = "침실에 들어서자마자, 풀린 눈동자로 그렇게 고해 오는 라비."

[[dialogue]]
speaker = "unk"
original = "メイド服のミニスカートから覗く真っ白な太ももを伝うのは、汗と愛液。すでに、相当に出来上がっている。"
translation = "메이드복의 미니스커트 사이로 보이는 새하얀 허벅지를 타고 흐르는 것은, 땀과 애액. 이미, 상당할 정도로 달아올라 있다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「んぅっ<emoji=heart04>\u3000ちゅ、んちゅぅ、ぷぁ、あっ<emoji=heart04>\u3000あ、あぁあっ……らめぇっ<emoji=heart04>\u3000会長とキス、すると、もっと、キちゃうぅ……んんぅ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "膝を震わせて、ぽたぽたと垂れる愛液がさらに増す。"
translation = "무릎을 떨며, 방울방울 떨어지는 애액이 더욱 늘어난다."

[[dialogue]]
speaker = "unk"
original = "蘭美は種族的な特性として『万年発情期』の体質だ。普段は抑制剤を飲んで性欲を抑えているのだが──"
translation = "라비는 종족적인 특성으로 『만년 발정기』 체질이다. 평소에는 억제제를 마셔 성욕을 누르고 있지만──"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……また発情抑制剤、飲まなかったのか？」"
translation = "「……또 발정 억제제, 안 마신 거야?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「だ、だってぇ<emoji=heart04>\u3000か、会長と……エッチできる日、だからぁっ<emoji=heart04>\u3000気持ちいいエッチ、したかった、からぁっ<emoji=heart04>」"
translation = "「그, 그치만<emoji=heart04> 회, 회장이랑…… 섹스할 수 있는 날, 이니까앗<emoji=heart04> 기분 좋은 섹스, 하고 싶었, 으니까앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そっと下着越しに女性器を触ると、電気でも走ったみたいに蘭美が跳ねる。"
translation = "살며시 속옷 위로 여성기를 만지자, 전기라도 통한 것처럼 라비가 튀어 오른다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふゃぁぁああっ<emoji=heart04>\u3000はぁ、はぁあっ<emoji=heart04>\u3000あ、あぅっ……んんんぅっ……<emoji=heart04>」"
translation = "「후탸아아아앗<emoji=heart04> 하아, 하아앗<emoji=heart04> 아, 아우읏…… 응응응으읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "蘭美のパンツは、指を埋めるとそれだけで、ぐじゅぐじゅと愛液が染み出るほどに濡れそぼっていた。"
translation = "라비의 팬티는, 손가락을 묻으면 그것만으로, 질척질척 애액이 배어 나올 정도로 흠뻑 젖어 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……いつもよりずっと濡れてないか？」"
translation = "「……평소보다 훨씬 더 젖어 있지 않아?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「う、うんっ<emoji=heart04>\u3000はぁ、はぁあっ……<emoji=heart04>\u3000きょ、今日は、そのっ<emoji=heart04>\u3000お、お薬……排卵誘発剤っ<emoji=heart04>\u3000飲んで、きちゃった、のぉ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「だ、大好きな貴方の赤ちゃんっ<emoji=heart04>\u3000会長の赤ちゃん、欲しいなってぇ<emoji=heart04>\u3000その気持ちが、抑えきれなく、なっちゃってぇっ……<emoji=heart04>\u3000はぁああんっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「それに、おま○こっ<emoji=heart04>\u3000びちょびちょに濡れてた方が……ご主人様のおち○ぽっ<emoji=heart04>\u3000もっと気持ちよく、できる、からぁっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "……そんなことを聞いたら、もう我慢できない。"
translation = "……그런 소리를 들으면, 이제 참을 수 없다."

[[dialogue]]
speaker = "unk"
original = "本当に赤ちゃんができてしまうかもしれないが……別に何も困らない。俺たちは将来を約束してるんだから。"
translation = "정말로 아기가 생겨버릴지도 모르지만…… 딱히 난감할 건 없다. 우리들은 장래를 약속했으니까."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「赤ちゃんを孕む準備、ばっちりのおま○こでっ<emoji=heart04>\u3000あぁんっ<emoji=heart04>\u3000ご奉仕っ……ご奉仕させて、ご主人様ぁ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……！！」"
translation = "「……!!」"

[[dialogue]]
speaker = "unk"
original = "蘭美のいやらしい誘いに、俺も完全に『ご主人様』のスイッチが入った。"
translation = "라비의 야한 유혹에, 나도 완전히 『주인님』 스위치가 켜졌다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「──本当にスケベなウサギだな。じゃあ、ウサギらしい格好でご奉仕するんだ、蘭美」"
translation = "「──정말 음란한 토끼로군. 그럼, 토끼다운 모습으로 봉사하는 거다, 라비」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「は──はいっ……<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「네──네엣……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ご奉仕、させていただきますぴょんっ……ご主人様ぁ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「봉사, 하겠습니다푱…… 주인님아<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁあっ<emoji=heart04>\u3000はあぁあっ<emoji=heart04>\u3000おち○ぽすごぉい……<emoji=heart04>\u3000見たことないくらい、がっちがちぃ……<emoji=heart04>」"
translation = "「하아앗<emoji=heart04> 하아아앗<emoji=heart04> 자지 엄청나아……<emoji=heart04> 본 적 없을 정도로, 딱딱해에……<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ご主人様のおち○ぽ<emoji=heart04>\u3000大好きなご主人様の、ばきばきおち○ぽぉ……<emoji=heart04>\u3000い、いっぱい、気持ちよくさせてぇっ<emoji=heart04>」"
translation = "「주인님의 자지<emoji=heart04> 정말 좋아하는 주인님의, 우람한 자지이……<emoji=heart04> 마, 많이, 기분 좋게 해줘어<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「両手は、こぉやってぇ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000頭のところで、ぴょん、ぴょんって……はぁあっ<emoji=heart04>\u3000エッチなウサギの真似、い、いっぱい、するからぁっ<emoji=heart04><emoji=heart04>」"
translation = "「양손은, 요렇게해서어<emoji=heart04> 앙읏<emoji=heart04> 머리 쪽에서, 깡충, 깡충 하고…… 하아앗<emoji=heart04> 야한 토끼 흉내, 마, 많이, 할 테니까아<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "まだ挿入していないのに、ペニスに擦り付けられる蘭美の女性器はトロトロだ。"
translation = "아직 삽입하지도 않았는데, 페니스에 비벼지는 라비의 여성기는 걸쭉하다."

[[dialogue]]
speaker = "unk"
original = "おまけに排卵誘発剤の効果なのか、蘭美の発情した身体からは、頭がくらくらするような甘い香りまで漂ってくる。"
translation = "게다가 배란 유발제의 효과 때문인지, 라비의 발정한 몸에서는, 머리가 어지러울 정도의 달콤한 향기까지 감돌아 온다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふわぁぁあ……<emoji=heart04>\u3000ここまで、おち○ぽの香り、するぅ<emoji=heart04>\u3000はぁああんっ<emoji=heart04>\u3000いい匂いだよぉ<emoji=heart04>\u3000私のこと、孕ませたいって思ってくれてるんだぁ<emoji=heart04>」"
translation = "「후와아아아……<emoji=heart04> 여기까지, 자지 향기가, 나아<emoji=heart04> 하아아앙읏<emoji=heart04> 좋은 냄새야아<emoji=heart04> 나를, 임신시키고 싶다고 생각해 주는 거구나아<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「い、入れていいっ？\u3000ご主人様のおち○ぽ、私のおま○こにっ……入れていいっ？」"
translation = "「느, 넣어도 돼? 주인님의 자지, 내 보지에…… 넣어도 돼?」"

[[dialogue]]
speaker = "unk"
original = "頷くと、蘭美はとろけた瞳を細めて、笑った。"
translation = "고개를 끄덕이자, 라비는 녹아내린 눈동자를 찌푸리며, 웃었다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ありがとぉっ、ご、ご主人様ぁ<emoji=heart04>\u3000んん、んんんうう～っ<emoji=heart04>」"
translation = "「고마워어, 주, 주인님아<emoji=heart04> 응응, 응응응우우～읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁぁあああ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000うぅう、んぁぁ、あぁあぁっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「하아아아아아～～～읏<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아아앗<emoji=heart04> 으으우, 응아아, 아아아앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺のペニスを飲み込んだ途端、蘭美の全身ががくがくと震えた。"
translation = "내 페니스를 삼키자마자, 라비의 전신이 덜덜 떨렸다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あ、あうっ<emoji=heart04>\u3000はあぁ、あ、あぁっ<emoji=heart04>\u3000イ、イっちゃ──たぁっ<emoji=heart04>\u3000な、なにこれぇっ<emoji=heart04>\u3000すごぉいっ<emoji=heart04>\u3000おま○こ、とけちゃうぅっ<emoji=heart04>」"
translation = "「아, 아웃<emoji=heart04> 하아아, 아, 아앗<emoji=heart04> 가, 가버렸──어어<emoji=heart04> 뭐, 뭐야 이거어<emoji=heart04> 엄청나아<emoji=heart04> 보지, 녹아버려어<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「すごい、すごいのぉっ<emoji=heart04>\u3000今まで、いっぱいっ<emoji=heart04>\u3000子作りえっち<emoji=heart04>\u3000してきたけどぉっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000おま○こ、こんなに気持ちいいの、初めてぇっ<emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "小柄な蘭美の女性器は当然小さくて、柔らかいのに締め付けはすさまじい。気を抜いたらあっという間に射精してしまいそうなほどの快感だ。"
translation = "아담한 라비의 여성기는 당연히 작고, 말랑한데다 쥐어짜는 조임은 엄청나다. 방심하면 눈 깜짝할 사이에 사정해 버릴 것만 같은 쾌감이다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……っ。蘭美、自分ばっかり気持ちよくなってないで、ちゃんとご奉仕してくれないとな？」"
translation = "「……읏. 라비, 자기 혼자만 기분 좋아지지 말고, 제대로 봉사해 주어야지?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あ、あぁああっ<emoji=heart04>\u3000ごめんなさい、ごめんなさいっ<emoji=heart04><emoji=heart04>\u3000ご主人様のおち○ぽ気持ちよすぎてっ<emoji=heart04>\u3000勝手にイってごめんなさいっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「いっぱいお尻、動かすからぁっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000私のご奉仕、楽しんで、くださいっ──ご主人様、ぁっ<emoji=heart04><emoji=heart04>\u3000んんんっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ひぁ、あぁあっ<emoji=heart04>\u3000ふあぁ、あ、あぁあっ<emoji=heart04>\u3000んん、んんっ<emoji=heart04>\u3000ふぁああ、んん、んんぅう～っ<emoji=heart04><emoji=heart04>」"
translation = "「히아, 아아앗<emoji=heart04> 후아아, 아, 아아앗<emoji=heart04> 응응, 응응읏<emoji=heart04> 후아아아, 응응, 응응우우～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「き、気持ちいっ<emoji=heart04>\u3000気持ちいい、気持ちいいっ……<emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000おち○ぽ、ガチガチっ<emoji=heart04>\u3000中、ずりずり～～ってぇ、擦れるのぉっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ご、ご主人様ぁっ<emoji=heart04>\u3000恋人ウサギの、おま○こご奉仕っ<emoji=heart04><emoji=heart04>\u3000気持ちいい、ですかぁっ<emoji=heart04>\u3000ぴょ、ぴょん、ぴょんっ<emoji=heart04>」"
translation = "「주, 주인님아앗<emoji=heart04> 애인 토끼의, 보지 봉사앗<emoji=heart04><emoji=heart04> 기분, 좋은가요오<emoji=heart04> 깡, 깡충, 깡충<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴょん、ぴょん、んぅぅ<emoji=heart04>\u3000ぴょん、ぴょんっ<emoji=heart04>\u3000ふぁ、あぁああっ<emoji=heart04><emoji=heart04>\u3000おち○ぽ呑み込みながら、ウサギ飛びっ<emoji=heart04>\u3000気持ちいい、ぴょぉおんっ<emoji=heart04>」"
translation = "「깡충, 깡충, 으응<emoji=heart04> 깡충, 깡충<emoji=heart04> 화, 아아아앗<emoji=heart04><emoji=heart04> 자지 삼키면서, 토끼 뛰기잇<emoji=heart04> 기분 좋아, 깡초옹<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "繋がっているところがよく見えるように、がばっと足を開いて、全力のご奉仕を見せてくれる蘭美。"
translation = "이어져 있는 곳이 잘 보이도록, 쩍 벌려 다리를 벌리고, 전력의 봉사를 보여주는 라비."

[[dialogue]]
speaker = "unk"
original = "ウサギ魔族の彼女と何度もエッチしてきたけれど、『ぴょんぴょん』なんて言わせながらのエッチは初めて……"
translation = "토끼 마족인 그녀와 몇 번이고 섹스해 왔지만, 『깡충깡충』 같은 소리를 내게 하면서 하는 섹스는 처음……"

[[dialogue]]
speaker = "unk"
original = "ヒトとしての尊厳よりも、ご主人様に媚びを売って可愛がってもらいたい──そんな欲望に濡れた声を漏らす蘭美の姿に、背筋がゾクゾクした。"
translation = "인간으로서의 존엄보다는, 주인님에게 아양을 떨며 귀여움받고 싶다──그런 욕망에 젖은 목소리를 흘리는 라비의 모습에, 등골이 오싹했다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「おち○ぽ気持ちいいぴょんっ<emoji=heart04><emoji=heart04>\u3000おま○こ、隙間なく埋まって、ぐいぐい奥突かれちゃってる、ぴょんっ<emoji=heart04><emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>」"
translation = "「자지 기분 좋다푱<emoji=heart04><emoji=heart04> 보지, 틈없이 채워져서, 푹푹 안쪽 찔려버리고 있어, 푱<emoji=heart04><emoji=heart04> 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「こ、こんな気持ちいいエッチしっちゃったらっ<emoji=heart04><emoji=heart04>\u3000もう、戻れないぴょんっ<emoji=heart04><emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000蘭美、またおバカになっちゃう、ぴょんっ<emoji=heart04><emoji=heart04>」"
translation = "「이, 이런 기분 좋은 섹스 해버리면요앗<emoji=heart04><emoji=heart04> 이제, 돌아갈 수 없다 깡충<emoji=heart04><emoji=heart04> 아, 아아앗<emoji=heart04> 라비, 또 바보가 되어버려, 깡충<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふあぁああっ<emoji=heart04>\u3000あ、あぁっ<emoji=heart04>\u3000や、ああ、ぁあっ──イっちゃうっ<emoji=heart04>\u3000イっちゃうイっちゃうっ──あ、あぁあっ<emoji=heart04>」"
translation = "「후아아아앗<emoji=heart04> 아, 아아잇<emoji=heart04> 싫, 아아, 아앗── 가버려랏<emoji=heart04> 가버려 가버려잇──아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「んん、んんぅぅぅうう～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응응, 응응우우우우우～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あんっ<emoji=heart04>\u3000あ、あぁああっ<emoji=heart04>\u3000イってるのにお尻止まらないぴょんっ<emoji=heart04><emoji=heart04>\u3000ご主人様のおち○ぽ大好きすぎてっ<emoji=heart04>\u3000ぱんぱん、ぴょんぴょん、止まらないぴょんっ<emoji=heart04><emoji=heart04>」"
translation = "「앙<emoji=heart04> 아, 아아아앗<emoji=heart04> 가고 있는데 엉덩이가 안 멈춘다 깡충<emoji=heart04><emoji=heart04> 주인님 자지 너무 좋아서앗<emoji=heart04> 팡팡, 깡충깡충, 안 멈춘다 깡충<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「好き、好きぃっ<emoji=heart04>\u3000んんんぅっ<emoji=heart04><emoji=heart04>\u3000ご主人様ぁっ、好きぃっ<emoji=heart04>\u3000ご主人様のおち○ぽっ、らいしゅきっ──あ、あぁぁあっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「좋아, 좋아아앗<emoji=heart04> 응응응읏<emoji=heart04><emoji=heart04> 주인님아앗, 좋아아앗<emoji=heart04> 주인님 자지, 진짜 좋아잇──아, 아아아앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "愛液のしぶきが跳ねるほどにばちゅんばちゅんとお尻を打ち付ける蘭美。"
translation = "애액의 방울이 튈 정도로 딱딱 소리를 내며 엉덩이를 부딪치는 라비."

[[dialogue]]
speaker = "unk"
original = "目の前で揺れている、小ぶりなおっぱいが可愛くて──俺は手を伸ばす。"
translation = "눈앞에서 흔들리고 있는, 자그마한 가슴이 귀여워서──나는 손을 뻗는다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「──ぁぁぁあああっ<emoji=heart04><emoji=heart04>\u3000ご主人、しゃまぁっ<emoji=heart04>\u3000おっぱいダメぴょんっ<emoji=heart04>\u3000そんな、乳首こりこりしたらっ、あ、あぁあぁっ<emoji=heart04><emoji=heart04>」"
translation = "「──아아아아아앗<emoji=heart04><emoji=heart04> 주인, 님아앗<emoji=heart04> 가슴은 안 된다 깡충<emoji=heart04> 그렇게, 젖꼭지 조물조물하면, 아, 아아아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ダメじゃないだろ。このおっぱいは誰のものだ？」"
translation = "「안 될 것 없잖아. 이 가슴은 누구 거지?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000ご主人様のものっ<emoji=heart04><emoji=heart04>\u3000私のおっぱいっ、ご主人様のものぴょんっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、あぁあ、んんぅう、ふぅう～っ<emoji=heart04><emoji=heart04>」"
translation = "「～～～～읏<emoji=heart04><emoji=heart04><emoji=heart04> 주인님 거앗<emoji=heart04><emoji=heart04> 내 가슴, 주인님 거다 깡충<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아아아, 응응으, 후우우~읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「す、好きなだけ触っていいれしゅっ<emoji=heart04>\u3000いっぱいいじって、下さっ──あ、あぁっ<emoji=heart04>\u3000ひぁぁあ、あぁあっ<emoji=heart04>」"
translation = "「좋, 좋을 대로 만져도 돼요잇<emoji=heart04> 마음껏 주물러, 주세──아, 아앗<emoji=heart04> 히아아아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「や、やあぁぁっ<emoji=heart04>\u3000おっぱいいじられてイっちゃうっ<emoji=heart04>\u3000またイっちゃうぴょんっ<emoji=heart04>\u3000あ、あ、あぁぁああ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「싫, 싫어어어잇<emoji=heart04> 가슴 만져져서 가버려잇<emoji=heart04> 또 가버린다 깡충<emoji=heart04> 아, 아, 아아아아아~~~읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふぅうっ、んんぅぅうぅう～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「후우우읏, 응응우우우우우～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふあ、あぁあっ<emoji=heart04>\u3000ひぁ、あぁああっ<emoji=heart04>\u3000らめらめ、らめぇっ<emoji=heart04>\u3000お尻止まらないぴょんっ<emoji=heart04>\u3000ぱんぱん止められないぴょんっ<emoji=heart04>」"
translation = "「후아, 아아앗<emoji=heart04> 히아, 아아아앗<emoji=heart04> 안돼안돼, 안돼에잇<emoji=heart04> 엉덩이가 안 멈춘다 깡충<emoji=heart04> 팡팡 못 멈춘다 깡충<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「お、お薬っ<emoji=heart04>\u3000すごすぎっ<emoji=heart04>\u3000ひぁ、あぁっ<emoji=heart04>\u3000からだ、じぶんのものじゃ、な、ないみたいっ<emoji=heart04><emoji=heart04>\u3000あっあっあっ、あぁ、あぁっ<emoji=heart04>」"
translation = "「약, 약이<emoji=heart04> 너무 대단해잇<emoji=heart04> 히아, 아앗<emoji=heart04> 몸이, 제 것이, 아, 아닌 것 같아잇<emoji=heart04><emoji=heart04> 아, 아, 아, 아아, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「蘭美、もっと激しくお尻を動かして」"
translation = "「라비, 더 격렬하게 엉덩이를 움직여줘」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふぇえ、ぇっ？\u3000そ、そそ、そんなっ──そんなあぁっ<emoji=heart04><emoji=heart04>」"
translation = "「후에, 에? 그, 그그, 그런── 그런아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「孕みたいんだろ？\u3000だったらもっと一生懸命、ご奉仕するんだ」"
translation = "「임신하고 싶잖아? 그렇다면 더 열심히, 봉사해야지」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「は、はっ──はいぃいっ<emoji=heart04>\u3000ご主人様ぁっ<emoji=heart04>\u3000おち○ぽご奉仕、がんばるぴょんっ──んん、んんんっ<emoji=heart04><emoji=heart04>」"
translation = "「네, 네잇── 네에잇<emoji=heart04> 주인님아앗<emoji=heart04> 자지 봉사, 열심히 할게요 깡충──음음, 음음읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「気持ちよすぎて、あ、頭おバカになっちゃうけどっ<emoji=heart04>\u3000精一杯っ、がんばるぴょんっ<emoji=heart04>\u3000ぴょん、ぴょ～んっ<emoji=heart04>\u3000んん、んんぅう～～っ<emoji=heart04><emoji=heart04>」"
translation = "「너무 기분 좋아서, 머, 머리가 바보가 되어버리지만요잇<emoji=heart04> 열심히, 할게요 깡충<emoji=heart04> 깡충, 깡초옹<emoji=heart04> 음음, 음응으~~읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ひぁあっ<emoji=heart04>\u3000あっあっあっ、あぁっあっあっ、ああぁあっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000ふわぁぁああっ<emoji=heart04><emoji=heart04>」"
translation = "「히아앗<emoji=heart04> 앗앗앗, 아앗앗앗, 아아아앗<emoji=heart04><emoji=heart04><emoji=heart04> 후와아아아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「これらめえぇええっ<emoji=heart04>\u3000大好きなご主人様のおち○ぽに激しいぱんぱんっ<emoji=heart04>\u3000おま○こまでバカになりゅっ<emoji=heart04>\u3000バカになりゅぅううっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「이거 안돼에에엣<emoji=heart04> 너무 좋아하는 주인님 자지에 격렬한 팡팡잇<emoji=heart04> 보지까지 바보가 되어버려잇<emoji=heart04> 바보가 되어버려어어앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「奥のところまで、ごりごりくりゅぴょんっ<emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000お、ぉおっ<emoji=heart04>\u3000おおぉおっ<emoji=heart04>\u3000赤ちゃんできりゅ前にこわれちゃうぴょんっ<emoji=heart04>」"
translation = "「깊은 곳까지, 꾸욱꾸욱 들어온다 깡충<emoji=heart04> 아, 아아앗<emoji=heart04> 아, 아앗<emoji=heart04> 아아앗<emoji=heart04> 아기 생기기 전에 부서져 버린다 깡충<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「で、でもっ<emoji=heart04>\u3000でもでもっ<emoji=heart04>\u3000蘭美はご主人様の、ものだからぁっ<emoji=heart04>\u3000全力で、おま○こご奉仕、がんばるぴょんっ<emoji=heart04>」"
translation = "「하, 하지만요잇<emoji=heart04> 하지만 하지만요잇<emoji=heart04> 라비는 주인님의, 거니까아잇<emoji=heart04> 전력으로, 보지 봉사, 열심히 할게요 깡충<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「えらいぞ、蘭美っ……！\u3000ご褒美だ！」"
translation = "「장하다, 라비……! 상이다!」"

[[dialogue]]
speaker = "unk"
original = "蘭美のちっぱいの先端を、強めにぎゅうっとつまみ上げる。"
translation = "라비의 납작한 가슴 끝을, 세게 꽉 꼬집어 올린다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ひぅぅうぅううぅううっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、あ、あぁ、あぁああ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「히우우우우우우우우우읏<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아, 아아, 아아아아～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺が何かするたびに、容易く絶頂する蘭美。けれどむさぼるようなピストンは止まらない。"
translation = "내가 무언가를 할 때마다, 손쉽게 절정하는 라비. 하지만 탐하는 듯한 피스톤은 멈추지 않는다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「おま○こ、あ、あぁあっ<emoji=heart04>\u3000あ、あちゅいのぉっ<emoji=heart04>\u3000赤ちゃんのもと欲しいってっ<emoji=heart04>\u3000止まらない、のぉおっ<emoji=heart04>」"
translation = "「보지가, 아, 아아앗<emoji=heart04> 뜨, 뜨거워요오잇<emoji=heart04> 아기 씨를 원한다고잇<emoji=heart04> 안 멈춰, 요오앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「好きぃっ<emoji=heart04>\u3000ご主人様、好き<emoji=heart04>\u3000好き、好き、だい好きぃ<emoji=heart04>\u3000孕ませてぇ<emoji=heart04>\u3000ママにして欲しいぴょんっ<emoji=heart04><emoji=heart04>」"
translation = "「좋아해잇<emoji=heart04> 주인님, 좋아<emoji=heart04> 좋아, 좋아, 진짜 좋아아<emoji=heart04> 임신시켜줘어<emoji=heart04> 엄마로 만들어줬으면 좋겠다 깡충<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「もう準備、できてるからぁっ<emoji=heart04>\u3000ご主人様の精液、ごくごく飲んでっ<emoji=heart04>\u3000妊娠する準備、ばっちりだからぁっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「이제 준비, 되었으니까아잇<emoji=heart04> 주인님의 정액, 꿀꺽꿀꺽 마시고잇<emoji=heart04> 임신할 준비, 완벽하니까아잇<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「お願いっ、お願いぃっ<emoji=heart04>\u3000ご主人様の赤ちゃん、ちょうだいぴょんっ<emoji=heart04>\u3000産ませてくださいっ、ぴょんぴょん、ぴょ～んっ<emoji=heart04><emoji=heart04>」"
translation = "「부탁이에요잇, 부탁이에요오잇<emoji=heart04> 주인님 아기, 주세요 깡충<emoji=heart04> 낳게 해주세요잇, 깡충깡충, 깡초옹<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「私はっ<emoji=heart04>\u3000羽宮蘭美はぁ、きっとこのために生まれてきたんだぴょんっ<emoji=heart04><emoji=heart04>」"
translation = "「저는요잇<emoji=heart04> 하네미야 라비는요오, 분명 이걸 위해 태어난 거다 깡충<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あっあっ<emoji=heart04>\u3000ご主人様の赤ちゃん、身ごもるために生まれてきたんだぴょんっ<emoji=heart04>\u3000そのお役目っ<emoji=heart04>\u3000果たさせてぇえっ<emoji=heart04>\u3000あ、あぁああっ<emoji=heart04><emoji=heart04>」"
translation = "「아앗아앗<emoji=heart04> 주인님 아기를, 잉태하기 위해 태어난 거다 깡충<emoji=heart04> 그 임무앗<emoji=heart04> 다하게 해주세요오앗<emoji=heart04> 아, 아아아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "完全に上気した、熱っぽい視線で可愛いことを言ってくれる蘭美に、俺も限界が近づいてくる──"
translation = "완전히 상기된, 열띤 시선으로 귀여운 말을 해주는 라비에게, 나도 한계가 가까워져 온다──"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あ──あぁああ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000おち○ぽぴくぴくっ<emoji=heart04>\u3000してるぴょんっ<emoji=heart04>\u3000これ知ってるっ<emoji=heart04>\u3000ご主人様、イキそうぴょんっ<emoji=heart04>」"
translation = "「아──아아아아<emoji=heart04><emoji=heart04><emoji=heart04> 자지가 꿈틀꿈틀<emoji=heart04> 하고 있다 깡충<emoji=heart04> 이거 알아잇<emoji=heart04> 주인님, 싸버릴 것 같다 깡충<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「嬉しいぴょんっ<emoji=heart04>\u3000出してっ、出して出して出してっ<emoji=heart04>\u3000お腹の奥で、せーしいっぱい<emoji=heart04><emoji=heart04><emoji=heart04>\u3000びゅうびゅうしてっ<emoji=heart04>\u3000してしてしてぇっ<emoji=heart04>」"
translation = "「기뻐요 깡충<emoji=heart04> 뿜어줘요, 뿜어줘 뿜어줘 뿜어줘잇<emoji=heart04> 배 속 깊은 곳에, 정자 가득<emoji=heart04><emoji=heart04><emoji=heart04> 콸콸 해줘요잇<emoji=heart04> 해줘 해줘 해줘어잇<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴょんぴょんっ<emoji=heart04>\u3000せーしくださいぴょんっ<emoji=heart04>\u3000可愛い赤ちゃん、エッチな恋人ウサギに仕込んでくださいっ<emoji=heart04>\u3000ぴょんぴょん、ぴょおんっ<emoji=heart04><emoji=heart04>」"
translation = "「깡충깡충<emoji=heart04> 정자 주세요 깡충<emoji=heart04> 귀여운 아기, 야한 애인 토끼에게 만들어 주세요잇<emoji=heart04> 깡충깡충, 깡초옹<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "蘭美の熱烈なくい打ちピストンに、俺は──"
translation = "라비의 열렬한 박차 가하기 피스톤에, 나는──"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「蘭美っ、妊娠──しろっ！！！」"
translation = "「라비, 임신──해라!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁあいっ<emoji=heart04>\u3000しますします絶対しますっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、あ、あ、ぁぁああっ──イクっ<emoji=heart04>\u3000イクイクイクイクイクイクっ──<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「네에읏<emoji=heart04> 해요 절대 할게요오<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아, 아, 아아아읏──간다아<emoji=heart04> 갈게 갈게 간다구우──<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あ、ああぁあぁあぁあああ～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아, 아아아아아아아아아～～～～～읏<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ひあぁぁぁああぁあっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、ああぁっ<emoji=heart04><emoji=heart04>\u3000ああぁぁぁああ～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「히아아아아아아아앗<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아아앗<emoji=heart04><emoji=heart04> 아아아아아아～～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "我慢に我慢を重ねた末に撃ち放つ射精の快感に、目まいさえ覚える。"
translation = "참고 참은 끝에 쏘아 보내는 사정의 쾌감에, 어지러움마저 느낀다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「んん、んんんうう～～っ<emoji=heart04><emoji=heart04>\u3000あったか、ぁいっ<emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000ふぅう、んんんっ……ご主人、様ぁ……<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응응, 응응응우우~~읏<emoji=heart04><emoji=heart04> 따뜻, 해에<emoji=heart04> 아, 아아앗<emoji=heart04> 후우우, 응응응…… 주인, 님아……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「もっと、もっと奥ぅっ……おち○ぽ、ぐりぐりしてぇっ<emoji=heart04>\u3000せーし、奥のところに、ぬりぬり<emoji=heart04>\u3000してぇぇっ……<emoji=heart04><emoji=heart04>」"
translation = "「더, 더 깊이이…… 자지, 비벼줘어<emoji=heart04> 정액, 제일 안쪽에, 듬뿍<emoji=heart04> 발라줘어어……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "射精中にもお尻をもじもじさせて、射精を煽ってくる蘭美。"
translation = "사정 중에도 엉덩이를 바르작거리며, 사정을 부추겨 오는 라비."

[[dialogue]]
speaker = "unk"
original = "可愛いバニーガールの膣内に、最後の一滴まで注ぎ込んで──"
translation = "귀여운 바니걸의 질 내에, 마지막 한 방울까지 쏟아붓고──"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁぁああ……<emoji=heart04><emoji=heart04>\u3000ふうぅうう～……<emoji=heart04><emoji=heart04>\u3000止まっちゃったぁ……ご主人様の、しゃせー……<emoji=heart04><emoji=heart04>」"
translation = "「하아아아아……<emoji=heart04><emoji=heart04> 후우우우우～……<emoji=heart04><emoji=heart04> 멈춰버렸다아…… 주인님의, 사정──……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ま、満足……できました、かぁ……？\u3000ご主人様ぁ……<emoji=heart04>」"
translation = "「만, 만족…… 하셨나, 요……? 주인님아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……最高だった。気持ちよかったよ、蘭美」"
translation = "「……최고였어. 기분 좋았어, 라비」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「えへへへへへぇ<emoji=heart04>\u3000嬉しい……嬉しいぴょんっ<emoji=heart04>\u3000大好きなご主人様に、褒めてもらえた、ぴょーん……<emoji=heart04>」"
translation = "「에헤헤헤헤헤<emoji=heart04> 기뻐…… 기뻐용<emoji=heart04> 정말 좋아하는 주인님한테, 칭찬받았다, 용……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "普段の凛々しい蘭美の瞳は、今はもう交尾と妊娠のことしか頭にないような、蕩けたまなざしになっていた。"
translation = "평소의 늠름한 라비의 눈동자는, 지금은 이제 교미와 임신에 대한 생각밖에 없는 듯한, 녹아내린 눈빛이 되어 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「どうする？\u3000少し休むか……？」"
translation = "「어떻게 할까? 조금 쉴까……?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「や、やだぴょんっ<emoji=heart04>\u3000もっと、もっと中にっ<emoji=heart04>\u3000ビューって、してほしいぴょん<emoji=heart04>\u3000ご主人様ぁ<emoji=heart04><emoji=heart04>」"
translation = "「싫, 싫어용<emoji=heart04> 더, 더 안에<emoji=heart04> 뷰웅 하고, 해주면 좋겠어용<emoji=heart04> 주인님아<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "どうやら、排卵誘発剤による興奮は、一回中出ししてあげたくらいじゃ収まらないみたいだ。"
translation = "아무래도, 배란 유발제에 의한 흥분은, 한 번 안에 싸주는 것 정도로는 가라앉지 않는 모양이다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「安心してぴょん……<emoji=heart04>\u3000エッチな恋人ウサギのご奉仕、まだまだこんなものじゃないぴょんっ……<emoji=heart04>」"
translation = "「안심해용……<emoji=heart04> 야한 연인 토끼의 봉사, 아직 이 정도가 아니에용……<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ご主人様のせーし……空っぽになるまで止めないぴょん<emoji=heart04>\u3000ぴょん、ぴょん、ぴょーん……<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「주인님의 정자…… 텅 빌 때까지 안 멈춘다푱<emoji=heart04> 깡충, 깡충, 깡ー충……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そうして俺と蘭美は、夜通し交わり続けるのだった──"
translation = "그렇게 나와 라비는, 밤새도록 계속 성교를 나누는 것이었다──"

