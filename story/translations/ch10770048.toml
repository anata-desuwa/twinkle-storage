[[dialogue]]
speaker = "unk"
original = "休日の深夜──蘭美は今日、俺の家にお泊まりに来ている。"
translation = "휴일 심야──라비는 오늘, 우리 집에 자러 와 있다."

[[dialogue]]
speaker = "unk"
original = "前もって母さんは留守であること。２人きりで何の気兼ねもないことを伝えていた。"
translation = "미리 어머니가 부재중이라는 것. 둘만의 공간이라 아무런 거리낌도 없다는 것을 전해두었다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁっ、はぁあっ……<emoji=heart04>\u3000か、会長っ……私、もう我慢、できないのぉ……<emoji=heart04>」"
translation = "「하아, 하아……<emoji=heart04> 회, 회장님…… 나, 이제 참을 수 없어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "寝室に入るなり、とろんとした瞳でそう告げてくる蘭美。"
translation = "침실에 들어서자마자, 풀린 눈동자로 그렇게 고해오는 라비."

[[dialogue]]
speaker = "unk"
original = "メイド服のミニスカートから覗く真っ白な太ももを伝うのは、汗と愛液。すでに、相当に出来上がっている。"
translation = "메이드복 미니스커트 사이로 엿보이는 하얀 허벅지를 타고 흐르는 것은, 땀과 애액. 이미 상당한 상태가 되어 있다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「んぅっ<emoji=heart04>\u3000ちゅ、んちゅぅ、ぷぁ、あっ<emoji=heart04>\u3000あ、あぁあっ……らめぇっ<emoji=heart04>\u3000会長とキス、すると、もっと、キちゃうぅ……んんぅ<emoji=heart04>」"
translation = "「응……<emoji=heart04> 쪽, 쪼옥, 푸하, 아……<emoji=heart04> 아, 아아…… 안 돼……<emoji=heart04> 회장님이랑 키스하면, 더, 와 버려…… 응응……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "膝を震わせて、ぽたぽたと垂れる愛液がさらに増す。"
translation = "무릎을 떨며, 똑똑 떨어지는 애액이 더욱 늘어난다."

[[dialogue]]
speaker = "unk"
original = "蘭美は種族的な特性として『万年発情期』の体質だ。普段は抑制剤を飲んで性欲を抑えているのだが──"
translation = "라비는 종족적 특성으로 『만년 발정기』 체질이다. 평소에는 억제제를 마셔 성욕을 누르고 있지만──"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……また発情抑制剤、飲まなかったのか？」"
translation = "「……또 발정 억제제, 안 마신 거야?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「だ、だってぇ<emoji=heart04>\u3000か、会長と……エッチできる日、だからぁっ<emoji=heart04>\u3000気持ちいいエッチ、したかった、からぁっ<emoji=heart04>」"
translation = "「그, 그치만<emoji=heart04> 회, 회장님이랑…… 섹스할 수 있는 날이니까<emoji=heart04> 기분 좋은 섹스, 하고 싶었으니까<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そっと下着越しに女性器を触ると、電気でも走ったみたいに蘭美が跳ねる。"
translation = "살포시 속옷 위로 여성기를 만지자, 전기가 통하는 것처럼 라비가 튀어 오른다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふゃぁぁああっ<emoji=heart04>\u3000はぁ、はぁあっ<emoji=heart04>\u3000あ、あぅっ……んんんぅっ……<emoji=heart04>」"
translation = "「훠아아아앗<emoji=heart04> 하아, 하아……<emoji=heart04> 아, 아응…… 응응응……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "蘭美のパンツは、指を埋めるとそれだけで、ぐじゅぐじゅと愛液が染み出るほどに濡れそぼっていた。"
translation = "라비의 팬티는, 손가락을 묻기만 해도 축축하게 애액이 배어 나올 정도로 젖어 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……いつもよりずっと濡れてないか？」"
translation = "「……평소보다 훨씬 더 젖어 있지 않아?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「う、うんっ<emoji=heart04>\u3000はぁ、はぁあっ……<emoji=heart04>\u3000きょ、今日は、そのっ<emoji=heart04>\u3000お、お薬……排卵誘発剤っ<emoji=heart04>\u3000飲んで、きちゃった、のぉ<emoji=heart04>」"
translation = "「응, 응……<emoji=heart04> 하아, 하아……<emoji=heart04> 오, 오늘은, 그게<emoji=heart04> 약, 약을…… 배란유발제……<emoji=heart04> 먹고, 와 버렸거든……<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「だ、大好きな貴方の赤ちゃんっ<emoji=heart04>\u3000会長の赤ちゃん、欲しいなってぇ<emoji=heart04>\u3000その気持ちが、抑えきれなく、なっちゃってぇっ……<emoji=heart04>\u3000はぁああんっ<emoji=heart04>」"
translation = "「정, 정말 좋아하는 당신의 아기<emoji=heart04> 회장님의 아기, 갖고 싶어져서<emoji=heart04> 그 마음을, 억누를 수 없게 돼 버려서……<emoji=heart04> 하앙<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「それに、おま○こっ<emoji=heart04>\u3000びちょびちょに濡れてた方が……ご主人様のおち○ぽっ<emoji=heart04>\u3000もっと気持ちよく、できる、からぁっ<emoji=heart04>」"
translation = "「게다가, 보지……<emoji=heart04> 흠뻑 젖어있는 편이…… 주인님의 자지<emoji=heart04> 더 기분 좋게, 해줄 수 있으니까……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "……そんなことを聞いたら、もう我慢できない。"
translation = "……그런 소리를 들으면, 더 이상 참을 수 없다."

[[dialogue]]
speaker = "unk"
original = "本当に赤ちゃんができてしまうかもしれないが……別に何も困らない。俺たちは将来を約束してるんだから。"
translation = "정말로 아기가 생겨버릴지도 모르지만…… 딱히 상관없다. 우리들은 미래를 약속한 사이니까."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「赤ちゃんを孕む準備、ばっちりのおま○こでっ<emoji=heart04>\u3000あぁんっ<emoji=heart04>\u3000ご奉仕っ……ご奉仕させて、ご主人様ぁ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아기를 임신할 준비, 완벽하게 마친 보지로<emoji=heart04> 아앙<emoji=heart04> 봉사…… 봉사하게 해주세요, 주인님<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……！！」"
translation = "「……!!」"

[[dialogue]]
speaker = "unk"
original = "蘭美のいやらしい誘いに、俺も完全に『ご主人様』のスイッチが入った。"
translation = "라비의 야한 유혹에, 나도 완전히 『주인님』 스위치가 켜졌다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「──本当にスケベなウサギだな。じゃあ、ウサギらしい格好でご奉仕するんだ、蘭美」"
translation = "「──정말 야한 토끼네. 그럼, 토끼다운 모습으로 봉사해라, 라비.」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「は──はいっ……<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「네──네……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ご奉仕、させていただきますぴょんっ……ご主人様ぁ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「봉사, 하겠습니다뼝…… 주인님<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁあっ<emoji=heart04>\u3000はあぁあっ<emoji=heart04>\u3000おち○ぽすごぉい……<emoji=heart04>\u3000見たことないくらい、がっちがちぃ……<emoji=heart04>」"
translation = "「하아앗<emoji=heart04> 하아앗<emoji=heart04> 자지 대단해……<emoji=heart04> 본 적 없을 정도로, 딱딱해……<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ご主人様のおち○ぽ<emoji=heart04>\u3000大好きなご主人様の、ばきばきおち○ぽぉ……<emoji=heart04>\u3000い、いっぱい、気持ちよくさせてぇっ<emoji=heart04>」"
translation = "「주인님의 자지<emoji=heart04> 정말 좋아하는 주인님의, 우람한 자지……<emoji=heart04> 매, 많이, 기분 좋게 해줘……<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「両手は、こぉやってぇ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000頭のところで、ぴょん、ぴょんって……はぁあっ<emoji=heart04>\u3000エッチなウサギの真似、い、いっぱい、するからぁっ<emoji=heart04><emoji=heart04>」"
translation = "「양손은, 요렇게……<emoji=heart04> 앙<emoji=heart04> 머리 옆에서, 깡총, 깡총…… 하아앗<emoji=heart04> 야한 토끼 흉내, 많이, 많이 할 테니까……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "まだ挿入していないのに、ペニスに擦り付けられる蘭美の女性器はトロトロだ。"
translation = "아직 삽입하지 않았는데도, 자지에 비벼지는 라비의 여성기는 걸쭉하다."

[[dialogue]]
speaker = "unk"
original = "おまけに排卵誘発剤の効果なのか、蘭美の発情した身体からは、頭がくらくらするような甘い香りまで漂ってくる。"
translation = "게다가 배란유발제의 효과인지, 라비의 발정한 몸에서는 머리가 어지러울 정도로 달콤한 향기까지 감돌고 있다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふわぁぁあ……<emoji=heart04>\u3000ここまで、おち○ぽの香り、するぅ<emoji=heart04>\u3000はぁああんっ<emoji=heart04>\u3000いい匂いだよぉ<emoji=heart04>\u3000私のこと、孕ませたいって思ってくれてるんだぁ<emoji=heart04>」"
translation = "「후와아아……<emoji=heart04> 여기까지, 자지 향기가, 나……<emoji=heart04> 하아앙<emoji=heart04> 좋은 냄새야……<emoji=heart04> 나를, 임신시키고 싶다고 생각해 주는구나……<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「い、入れていいっ？\u3000ご主人様のおち○ぽ、私のおま○こにっ……入れていいっ？」"
translation = "「넣, 넣어도 돼? 주인님의 자지, 내 보지에…… 넣어도 돼?」"

[[dialogue]]
speaker = "unk"
original = "頷くと、蘭美はとろけた瞳を細めて、笑った。"
translation = "고개를 끄덕이자, 라비는 풀린 눈동자를 좁히며 웃었다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ありがとぉっ、ご、ご主人様ぁ<emoji=heart04>\u3000んん、んんんうう～っ<emoji=heart04>」"
translation = "「고마워, 주, 주인님<emoji=heart04> 응응, 응응응~<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁぁあああ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000うぅう、んぁぁ、あぁあぁっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「하아아아아~~~<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아아<emoji=heart04> 우우, 응아아, 아아아<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺のペニスを飲み込んだ途端、蘭美の全身ががくがくと震えた。"
translation = "내 자지를 삼키자마자, 라비의 온몸이 덜덜 떨렸다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あ、あうっ<emoji=heart04>\u3000はあぁ、あ、あぁっ<emoji=heart04>\u3000イ、イっちゃ──たぁっ<emoji=heart04>\u3000な、なにこれぇっ<emoji=heart04>\u3000すごぉいっ<emoji=heart04>\u3000おま○こ、とけちゃうぅっ<emoji=heart04>」"
translation = "「아, 아응<emoji=heart04> 하아아, 아, 아아<emoji=heart04> 가, 가 버려──어<emoji=heart04> 무, 뭐야 이거<emoji=heart04> 대단해<emoji=heart04> 보지, 녹아버려……<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「すごい、すごいのぉっ<emoji=heart04>\u3000今まで、いっぱいっ<emoji=heart04>\u3000子作りえっち<emoji=heart04>\u3000してきたけどぉっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000おま○こ、こんなに気持ちいいの、初めてぇっ<emoji=heart04><emoji=heart04>」"
translation = "「대단해, 대단해……<emoji=heart04> 지금까지, 많이<emoji=heart04> 아이 만들기 섹스<emoji=heart04> 해왔지만<emoji=heart04><emoji=heart04><emoji=heart04> 보지, 이렇게 기분 좋은 거, 처음이야<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "小柄な蘭美の女性器は当然小さくて、柔らかいのに締め付けはすさまじい。気を抜いたらあっという間に射精してしまいそうなほどの快感だ。"
translation = "아담한 라비의 여성기는 당연히 작고, 조임은 엄청나다. 방심하면 순식간에 사정해 버릴 것 같은 쾌감이다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……っ。蘭美、自分ばっかり気持ちよくなってないで、ちゃんとご奉仕してくれないとな？」"
translation = "「……쯧. 라비, 혼자서만 기분 좋아지지 말고, 제대로 봉사해 줘야지?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あ、あぁああっ<emoji=heart04>\u3000ごめんなさい、ごめんなさいっ<emoji=heart04><emoji=heart04>\u3000ご主人様のおち○ぽ気持ちよすぎてっ<emoji=heart04>\u3000勝手にイってごめんなさいっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아, 아아아<emoji=heart04> 죄송해요, 죄송해요<emoji=heart04><emoji=heart04> 주인님 자지 너무 기분 좋아서<emoji=heart04> 제멋대로 가버려서 죄송해요<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「いっぱいお尻、動かすからぁっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000私のご奉仕、楽しんで、くださいっ──ご主人様、ぁっ<emoji=heart04><emoji=heart04>\u3000んんんっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「엉덩이, 많이 움직일 테니까<emoji=heart04> 앙<emoji=heart04> 제 봉사, 즐겨주세요──주인님<emoji=heart04><emoji=heart04> 응응응<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ひぁ、あぁあっ<emoji=heart04>\u3000ふあぁ、あ、あぁあっ<emoji=heart04>\u3000んん、んんっ<emoji=heart04>\u3000ふぁああ、んん、んんぅう～っ<emoji=heart04><emoji=heart04>」"
translation = "「히아, 아아앗<emoji=heart04> 후아아, 아, 아아앗<emoji=heart04> 응응, 응응<emoji=heart04> 후아아, 응응, 응응으~응<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「き、気持ちいっ<emoji=heart04>\u3000気持ちいい、気持ちいいっ……<emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000おち○ぽ、ガチガチっ<emoji=heart04>\u3000中、ずりずり～～ってぇ、擦れるのぉっ<emoji=heart04>」"
translation = "「기, 기분 좋아<emoji=heart04> 기분 좋아, 기분 좋아……<emoji=heart04> 아, 아아앗<emoji=heart04> 자지, 딱딱해<emoji=heart04> 안쪽, 문질문질~~ 하면서, 문질러져……<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ご、ご主人様ぁっ<emoji=heart04>\u3000恋人ウサギの、おま○こご奉仕っ<emoji=heart04><emoji=heart04>\u3000気持ちいい、ですかぁっ<emoji=heart04>\u3000ぴょ、ぴょん、ぴょんっ<emoji=heart04>」"
translation = "「주, 주인님<emoji=heart04> 연인 토끼의, 보지 봉사<emoji=heart04><emoji=heart04> 기분 좋은가요<emoji=heart04> 깡, 깡총, 깡총<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴょん、ぴょん、んぅぅ<emoji=heart04>\u3000ぴょん、ぴょんっ<emoji=heart04>\u3000ふぁ、あぁああっ<emoji=heart04><emoji=heart04>\u3000おち○ぽ呑み込みながら、ウサギ飛びっ<emoji=heart04>\u3000気持ちいい、ぴょぉおんっ<emoji=heart04>」"
translation = "「깡총, 깡총, 응응<emoji=heart04> 깡총, 깡총<emoji=heart04> 후아, 아아앗<emoji=heart04><emoji=heart04> 자지 삼키면서, 토끼 뛰기<emoji=heart04> 기분 좋다뼝<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "繋がっているところがよく見えるように、がばっと足を開いて、全力のご奉仕を見せてくれる蘭美。"
translation = "연결되어 있는 곳이 잘 보이도록, 다리를 쩍 벌리고, 전력의 봉사를 보여주는 라비."

[[dialogue]]
speaker = "unk"
original = "ウサギ魔族の彼女と何度もエッチしてきたけれど、『ぴょんぴょん』なんて言わせながらのエッチは初めて……"
translation = "토끼 마족인 그녀와 몇 번이나 섹스해 왔지만, 『깡총깡총』 거 리게 하면서 하는 섹스는 처음……"

[[dialogue]]
speaker = "unk"
original = "ヒトとしての尊厳よりも、ご主人様に媚びを売って可愛がってもらいたい──そんな欲望に濡れた声を漏らす蘭美の姿に、背筋がゾクゾクした。"
translation = "인간으로서의 존엄보다는, 주인님에게 아양을 떨고 귀염받고 싶다──그런 욕망에 젖은 목소리를 내는 라비의 모습에, 등골이 오싹했다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「おち○ぽ気持ちいいぴょんっ<emoji=heart04><emoji=heart04>\u3000おま○こ、隙間なく埋まって、ぐいぐい奥突かれちゃってる、ぴょんっ<emoji=heart04><emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>」"
translation = "「자지 기분 좋다뼝<emoji=heart04><emoji=heart04> 보지, 틈새 없이 채워져서, 찌르르 안쪽까지 찔려 버린다뼝<emoji=heart04><emoji=heart04> 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「こ、こんな気持ちいいエッチしっちゃったらっ<emoji=heart04><emoji=heart04>\u3000もう、戻れないぴょんっ<emoji=heart04><emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000蘭美、またおバカになっちゃう、ぴょんっ<emoji=heart04><emoji=heart04>」"
translation = "「이, 이렇게 기분 좋은 섹스 해버리면<emoji=heart04><emoji=heart04> 이제, 돌아갈 수 없다뼝<emoji=heart04><emoji=heart04> 아, 아아앗<emoji=heart04> 라비, 또 바보가 되어버린다뼝<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふあぁああっ<emoji=heart04>\u3000あ、あぁっ<emoji=heart04>\u3000や、ああ、ぁあっ──イっちゃうっ<emoji=heart04>\u3000イっちゃうイっちゃうっ──あ、あぁあっ<emoji=heart04>」"
translation = "「후아아앗<emoji=heart04> 아, 아아<emoji=heart04> 싫, 아아, 아앗──가 버려<emoji=heart04> 가 버려 가 버려──아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「んん、んんぅぅぅうう～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응응, 응응으으으~~~쯧<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あんっ<emoji=heart04>\u3000あ、あぁああっ<emoji=heart04>\u3000イってるのにお尻止まらないぴょんっ<emoji=heart04><emoji=heart04>\u3000ご主人様のおち○ぽ大好きすぎてっ<emoji=heart04>\u3000ぱんぱん、ぴょんぴょん、止まらないぴょんっ<emoji=heart04><emoji=heart04>」"
translation = "「앙<emoji=heart04> 아, 아아앗<emoji=heart04> 가버리는데도 엉덩이가 안 멈춘다뼝<emoji=heart04><emoji=heart04> 주인님 자지 너무 좋아서<emoji=heart04> 팡팡, 깡총깡총, 안 멈춘다뼝<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「好き、好きぃっ<emoji=heart04>\u3000んんんぅっ<emoji=heart04><emoji=heart04>\u3000ご主人様ぁっ、好きぃっ<emoji=heart04>\u3000ご主人様のおち○ぽっ、らいしゅきっ──あ、あぁぁあっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「좋아해, 좋아해<emoji=heart04> 응응응<emoji=heart04><emoji=heart04> 주인님, 좋아해<emoji=heart04> 주인님 자지, 정말 좋아해──아, 아아아앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "愛液のしぶきが跳ねるほどにばちゅんばちゅんとお尻を打ち付ける蘭美。"
translation = "애액의 물보라가 튈 정도로 철썩철썩 엉덩이를 부딪치는 라비."

[[dialogue]]
speaker = "unk"
original = "目の前で揺れている、小ぶりなおっぱいが可愛くて──俺は手を伸ばす。"
translation = "눈앞에서 흔들리고 있는, 작은 가슴이 귀여워서──나는 손을 뻗는다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「──ぁぁぁあああっ<emoji=heart04><emoji=heart04>\u3000ご主人、しゃまぁっ<emoji=heart04>\u3000おっぱいダメぴょんっ<emoji=heart04>\u3000そんな、乳首こりこりしたらっ、あ、あぁあぁっ<emoji=heart04><emoji=heart04>」"
translation = "「──아아아아앗<emoji=heart04><emoji=heart04> 주인, 님<emoji=heart04> 가슴은 안 된다뼝<emoji=heart04> 그렇게, 젖꼭지 조물조물하면, 아, 아아아<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ダメじゃないだろ。このおっぱいは誰のものだ？」"
translation = "「안 될 거 없잖아. 이 가슴은 누구 거지?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000ご主人様のものっ<emoji=heart04><emoji=heart04>\u3000私のおっぱいっ、ご主人様のものぴょんっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、あぁあ、んんぅう、ふぅう～っ<emoji=heart04><emoji=heart04>」"
translation = "「~~~~쯧<emoji=heart04><emoji=heart04><emoji=heart04> 주인님 거<emoji=heart04><emoji=heart04> 내 가슴, 주인님 거다뼝<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아아, 응응으, 후우~쯧<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「す、好きなだけ触っていいれしゅっ<emoji=heart04>\u3000いっぱいいじって、下さっ──あ、あぁっ<emoji=heart04>\u3000ひぁぁあ、あぁあっ<emoji=heart04>」"
translation = "「마, 마음껏 만져도 돼요<emoji=heart04> 많이 괴롭혀, 주세요──아, 아앗<emoji=heart04> 히아아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「や、やあぁぁっ<emoji=heart04>\u3000おっぱいいじられてイっちゃうっ<emoji=heart04>\u3000またイっちゃうぴょんっ<emoji=heart04>\u3000あ、あ、あぁぁああ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「시, 싫어어<emoji=heart04> 가슴 괴롭혀져서 가버려<emoji=heart04> 또 가버린다뼝<emoji=heart04> 아, 아, 아아아아~~~쯧<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふぅうっ、んんぅぅうぅう～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「후우쯧, 응응으으으~~~쯧<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふあ、あぁあっ<emoji=heart04>\u3000ひぁ、あぁああっ<emoji=heart04>\u3000らめらめ、らめぇっ<emoji=heart04>\u3000お尻止まらないぴょんっ<emoji=heart04>\u3000ぱんぱん止められないぴょんっ<emoji=heart04>」"
translation = "「후아, 아아앗<emoji=heart04> 히아, 아아아앗<emoji=heart04> 안 돼 안 돼, 안 돼<emoji=heart04> 엉덩이가 안 멈춘다뼝<emoji=heart04> 팡팡을 멈출 수 없다뼝<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「お、お薬っ<emoji=heart04>\u3000すごすぎっ<emoji=heart04>\u3000ひぁ、あぁっ<emoji=heart04>\u3000からだ、じぶんのものじゃ、な、ないみたいっ<emoji=heart04><emoji=heart04>\u3000あっあっあっ、あぁ、あぁっ<emoji=heart04>」"
translation = "「약, 약이<emoji=heart04> 너무 대단해<emoji=heart04> 히아, 아앗<emoji=heart04> 몸이, 내 것이, 아, 아닌 것 같아<emoji=heart04><emoji=heart04> 앗앗앗, 아아, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「蘭美、もっと激しくお尻を動かして」"
translation = "「라비, 더 격렬하게 엉덩이를 움직여.」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふぇえ、ぇっ？\u3000そ、そそ、そんなっ──そんなあぁっ<emoji=heart04><emoji=heart04>」"
translation = "「후에, 에? 그, 그그, 그런──그런 아아<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「孕みたいんだろ？\u3000だったらもっと一生懸命、ご奉仕するんだ」"
translation = "「임신하고 싶잖아? 그렇다면 더 열심히, 봉사해야지.」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「は、はっ──はいぃいっ<emoji=heart04>\u3000ご主人様ぁっ<emoji=heart04>\u3000おち○ぽご奉仕、がんばるぴょんっ──んん、んんんっ<emoji=heart04><emoji=heart04>」"
translation = "「네, 네──네에<emoji=heart04> 주인님<emoji=heart04> 자지 봉사, 열심히 할 거뼝──응응, 응응응<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「気持ちよすぎて、あ、頭おバカになっちゃうけどっ<emoji=heart04>\u3000精一杯っ、がんばるぴょんっ<emoji=heart04>\u3000ぴょん、ぴょ～んっ<emoji=heart04>\u3000んん、んんぅう～～っ<emoji=heart04><emoji=heart04>」"
translation = "「너무 기분 좋아서, 머, 머리가 바보가 되어버리지만<emoji=heart04> 열심히, 노력할 거뼝<emoji=heart04> 깡총, 깡~총<emoji=heart04> 응응, 응응으~~쯧<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ひぁあっ<emoji=heart04>\u3000あっあっあっ、あぁっあっあっ、ああぁあっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000ふわぁぁああっ<emoji=heart04><emoji=heart04>」"
translation = "「히아앗<emoji=heart04> 앗앗앗, 아앗앗앗, 아아아앗<emoji=heart04><emoji=heart04><emoji=heart04> 후와아아아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「これらめえぇええっ<emoji=heart04>\u3000大好きなご主人様のおち○ぽに激しいぱんぱんっ<emoji=heart04>\u3000おま○こまでバカになりゅっ<emoji=heart04>\u3000バカになりゅぅううっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「이거 안 돼에에<emoji=heart04> 정말 좋아하는 주인님 자지에 격렬하게 팡팡<emoji=heart04> 보지까지 바보가 되어버려<emoji=heart04> 바보가 되어버려어어<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「奥のところまで、ごりごりくりゅぴょんっ<emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000お、ぉおっ<emoji=heart04>\u3000おおぉおっ<emoji=heart04>\u3000赤ちゃんできりゅ前にこわれちゃうぴょんっ<emoji=heart04>」"
translation = "「안쪽까지, 꾹꾹 자극이 온다뼝<emoji=heart04> 아, 아아앗<emoji=heart04> 오, 오오<emoji=heart04> 오오오<emoji=heart04> 아기 생기기 전에 망가져 버린다뼝<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「で、でもっ<emoji=heart04>\u3000でもでもっ<emoji=heart04>\u3000蘭美はご主人様の、ものだからぁっ<emoji=heart04>\u3000全力で、おま○こご奉仕、がんばるぴょんっ<emoji=heart04>」"
translation = "「하, 하지만<emoji=heart04> 하지만 하지만<emoji=heart04> 라비는 주인님의 것이니까<emoji=heart04> 전력으로, 보지 봉사, 노력할 거뼝<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「えらいぞ、蘭美っ……！\u3000ご褒美だ！」"
translation = "「기특하네, 라비……! 상이다!」"

[[dialogue]]
speaker = "unk"
original = "蘭美のちっぱいの先端を、強めにぎゅうっとつまみ上げる。"
translation = "라비의 작은 가슴 끝을, 강하게 꾹 쥐어짜듯 집어 올린다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ひぅぅうぅううぅううっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、あ、あぁ、あぁああ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「히우우우우우우우쯧<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아, 아아, 아아아아~~~쯧<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺が何かするたびに、容易く絶頂する蘭美。けれどむさぼるようなピストンは止まらない。"
translation = "내가 무언가를 할 때마다, 손쉽게 절정에 달하는 라비.하지만 탐하는 듯한 피스톤은 멈추지 않는다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「おま○こ、あ、あぁあっ<emoji=heart04>\u3000あ、あちゅいのぉっ<emoji=heart04>\u3000赤ちゃんのもと欲しいってっ<emoji=heart04>\u3000止まらない、のぉおっ<emoji=heart04>」"
translation = "「보지, 아, 아아앗<emoji=heart04> 뜨, 뜨거워<emoji=heart04> 아기 씨앗을 원한다고<emoji=heart04> 안 멈춰<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「好きぃっ<emoji=heart04>\u3000ご主人様、好き<emoji=heart04>\u3000好き、好き、だい好きぃ<emoji=heart04>\u3000孕ませてぇ<emoji=heart04>\u3000ママにして欲しいぴょんっ<emoji=heart04><emoji=heart04>」"
translation = "「좋아해<emoji=heart04> 주인님, 좋아해<emoji=heart04> 좋아해, 좋아해, 정말 좋아해<emoji=heart04> 임신시켜줘<emoji=heart04> 엄마로 만들어 줬으면 좋겠다뼝<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「もう準備、できてるからぁっ<emoji=heart04>\u3000ご主人様の精液、ごくごく飲んでっ<emoji=heart04>\u3000妊娠する準備、ばっちりだからぁっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「이제 준비, 되었으니까<emoji=heart04> 주인님의 정액, 꿀꺽꿀꺽 마시고<emoji=heart04> 임신할 준비, 완벽하니까<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「お願いっ、お願いぃっ<emoji=heart04>\u3000ご主人様の赤ちゃん、ちょうだいぴょんっ<emoji=heart04>\u3000産ませてくださいっ、ぴょんぴょん、ぴょ～んっ<emoji=heart04><emoji=heart04>」"
translation = "「부탁이야, 부탁이야<emoji=heart04> 주인님 아기, 주세요뼝<emoji=heart04> 낳게 해주세요, 깡총깡총, 깡~총<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「私はっ<emoji=heart04>\u3000羽宮蘭美はぁ、きっとこのために生まれてきたんだぴょんっ<emoji=heart04><emoji=heart04>」"
translation = "「나는<emoji=heart04> 하네미야 라비는, 분명 이걸 위해 태어난 거다뼝<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あっあっ<emoji=heart04>\u3000ご主人様の赤ちゃん、身ごもるために生まれてきたんだぴょんっ<emoji=heart04>\u3000そのお役目っ<emoji=heart04>\u3000果たさせてぇえっ<emoji=heart04>\u3000あ、あぁああっ<emoji=heart04><emoji=heart04>」"
translation = "「앗앗<emoji=heart04> 주인님 아기, 잉태하기 위해 태어난 거다뼝<emoji=heart04> 그 사명<emoji=heart04> 완수하게 해줘어<emoji=heart04> 아, 아아아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "完全に上気した、熱っぽい視線で可愛いことを言ってくれる蘭美に、俺も限界が近づいてくる──"
translation = "완전히 열이 오른, 뜨거운 시선으로 귀여운 말을 해주는 라비에게, 나도 한계가 가까워져 온다──"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あ──あぁああ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000おち○ぽぴくぴくっ<emoji=heart04>\u3000してるぴょんっ<emoji=heart04>\u3000これ知ってるっ<emoji=heart04>\u3000ご主人様、イキそうぴょんっ<emoji=heart04>」"
translation = "「아──아아아<emoji=heart04><emoji=heart04><emoji=heart04> 자지 꿈틀꿈틀<emoji=heart04> 하고 있다뼝<emoji=heart04> 이거 알아<emoji=heart04> 주인님, 싸버릴 것 같다뼝<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「嬉しいぴょんっ<emoji=heart04>\u3000出してっ、出して出して出してっ<emoji=heart04>\u3000お腹の奥で、せーしいっぱい<emoji=heart04><emoji=heart04><emoji=heart04>\u3000びゅうびゅうしてっ<emoji=heart04>\u3000してしてしてぇっ<emoji=heart04>」"
translation = "「기쁘다뼝<emoji=heart04> 뿜어줘, 뿜어줘 뿜어줘<emoji=heart04> 배 안쪽에, 정자 듬뿍<emoji=heart04><emoji=heart04><emoji=heart04> 콸콸 내뿜어줘<emoji=heart04> 해줘 해줘 해줘어<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴょんぴょんっ<emoji=heart04>\u3000せーしくださいぴょんっ<emoji=heart04>\u3000可愛い赤ちゃん、エッチな恋人ウサギに仕込んでくださいっ<emoji=heart04>\u3000ぴょんぴょん、ぴょおんっ<emoji=heart04><emoji=heart04>」"
translation = "「깡총깡총<emoji=heart04> 정자 주세요뼝<emoji=heart04> 귀여운 아기, 야한 연인 토끼에게 배게 해주세요<emoji=heart04> 깡총깡총, 깡총<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "蘭美の熱烈なくい打ちピストンに、俺は──"
translation = "라비의 열렬한 박아대는 피스톤에, 나는──"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「蘭美っ、妊娠──しろっ！！！」"
translation = "「라비, 임신──해라!!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁあいっ<emoji=heart04>\u3000しますします絶対しますっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、あ、あ、ぁぁああっ──イクっ<emoji=heart04>\u3000イクイクイクイクイクイクっ──<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「네에<emoji=heart04> 할게요 할게요 무조건 할게요<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아, 아, 아아앗──간다<emoji=heart04> 간다 간다 간다 간다 간다──<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あ、ああぁあぁあぁあああ～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아, 아아아아아아아아~~~~~쯧<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ひあぁぁぁああぁあっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、ああぁっ<emoji=heart04><emoji=heart04>\u3000ああぁぁぁああ～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「히아아아아아아앗<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아아앗<emoji=heart04><emoji=heart04> 아아아아아아~~~~쯧<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "我慢に我慢を重ねた末に撃ち放つ射精の快感に、目まいさえ覚える。"
translation = "참고 참은 끝에 쏘아 보내는 사정의 쾌감에, 현기증마저 느낀다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「んん、んんんうう～～っ<emoji=heart04><emoji=heart04>\u3000あったか、ぁいっ<emoji=heart04>\u3000あ、あぁあっ<emoji=heart04>\u3000ふぅう、んんんっ……ご主人、様ぁ……<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응응, 응응응우우~~쯧<emoji=heart04><emoji=heart04> 따뜻, 해<emoji=heart04> 아, 아아앗<emoji=heart04> 후우, 응응응…… 주인, 님……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「もっと、もっと奥ぅっ……おち○ぽ、ぐりぐりしてぇっ<emoji=heart04>\u3000せーし、奥のところに、ぬりぬり<emoji=heart04>\u3000してぇぇっ……<emoji=heart04><emoji=heart04>」"
translation = "「더, 더 안쪽으로…… 자지, 비벼줘<emoji=heart04> 정자, 안쪽에, 칠해줘<emoji=heart04> 해줘어……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "射精中にもお尻をもじもじさせて、射精を煽ってくる蘭美。"
translation = "사정 중에도 엉덩이를 옴싹거리며, 사정을 부추기는 라비."

[[dialogue]]
speaker = "unk"
original = "可愛いバニーガールの膣内に、最後の一滴まで注ぎ込んで──"
translation = "귀여운 바니걸의 질내에, 마지막 한 방울까지 쏟아붓고──"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁぁああ……<emoji=heart04><emoji=heart04>\u3000ふうぅうう～……<emoji=heart04><emoji=heart04>\u3000止まっちゃったぁ……ご主人様の、しゃせー……<emoji=heart04><emoji=heart04>」"
translation = "「하아아아……<emoji=heart04><emoji=heart04> 후우우우~……<emoji=heart04><emoji=heart04> 멈춰 버렸다…… 주인님의, 사정……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ま、満足……できました、かぁ……？\u3000ご主人様ぁ……<emoji=heart04>」"
translation = "「만, 만족…… 하셨나요……? 주인님……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……最高だった。気持ちよかったよ、蘭美」"
translation = "「……최고였어. 기분 좋았어, 라비.」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「えへへへへへぇ<emoji=heart04>\u3000嬉しい……嬉しいぴょんっ<emoji=heart04>\u3000大好きなご主人様に、褒めてもらえた、ぴょーん……<emoji=heart04>」"
translation = "「에헤헤헤헤헤<emoji=heart04> 기뻐…… 기쁘다뼝<emoji=heart04> 정말 좋아하는 주인님에게, 칭찬받았다, 깡총……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "普段の凛々しい蘭美の瞳は、今はもう交尾と妊娠のことしか頭にないような、蕩けたまなざしになっていた。"
translation = "평소의 늠름한 라비의 눈동자는, 지금은 이제 교미와 임신 생각밖에 없는 듯한, 녹아내린 눈빛이 되어 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「どうする？\u3000少し休むか……？」"
translation = "「어떡할래? 조금 쉴까……?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「や、やだぴょんっ<emoji=heart04>\u3000もっと、もっと中にっ<emoji=heart04>\u3000ビューって、してほしいぴょん<emoji=heart04>\u3000ご主人様ぁ<emoji=heart04><emoji=heart04>」"
translation = "「시, 싫다뼝<emoji=heart04> 더, 더 안에<emoji=heart04> 콸콸, 해줬으면 좋겠다뼝<emoji=heart04> 주인님<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "どうやら、排卵誘発剤による興奮は、一回中出ししてあげたくらいじゃ収まらないみたいだ。"
translation = "아무래도, 배란유발제로 인한 흥분은, 한 번 안에 싸준 정도로 가라앉지 않는 모양이다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「安心してぴょん……<emoji=heart04>\u3000エッチな恋人ウサギのご奉仕、まだまだこんなものじゃないぴょんっ……<emoji=heart04>」"
translation = "「안심해뼝……<emoji=heart04> 야한 연인 토끼의 봉사, 아직 이 정도가 아니다뼝……<emoji=heart04>」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ご主人様のせーし……空っぽになるまで止めないぴょん<emoji=heart04>\u3000ぴょん、ぴょん、ぴょーん……<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「주인님의 정자…… 텅 빌 때까지 안 멈춘다뼝<emoji=heart04> 깡총, 깡총, 깡총……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そうして俺と蘭美は、夜通し交わり続けるのだった──"
translation = "그렇게 나랑 라비는, 밤새도록 엉켜붙는 것이었다──"

