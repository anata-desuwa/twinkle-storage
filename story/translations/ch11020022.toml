[[dialogue]]
speaker = "unk"
original = "第２話,合体しましょう、ぶい,P"
translation = "제2화, 합체합시다, 브이, P"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「購買部へようこそ、アナお姉ちゃん。今日の昼食はこちらでお求めですか？」"
translation = "「매점에 오신 것을 환영해요, 아나 언니. 오늘 점심은 여기서 찾으시나요?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「ええ。何か軽食でもと思いまして」"
translation = "「네. 무슨 가벼운 식사라도 할까 해서요」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「ところでシュティレさん。今日もその衣装で店番をしているのですね？」"
translation = "「그나저나 슈틸레 양. 오늘도 그 의상으로 가게를 보고 있네요?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「イエス。ダッチから受け取ったバニーフォーム、これは客引きに最適なのです。おかげさまで購買部の売上も過去最高を記録中です。ぶい」"
translation = "「예스. 대치에게 받은 바니 폼, 이것은 호객에 최적이랍니다. 덕분에 매점의 매출도 과거 최고를 기록 중이에요. 브이」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「それに彼ピの会長も、シュティレのこの衣装をいたく気に入っているご様子──」"
translation = "「게다가 남친인 회장도, 슈틸레의 이 의상을 매우 마음에 들어 하는 모습──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あわよくば今日も見せつけて、可愛いと言ってもらいたい算段ですが……」"
translation = "「운이 좋으면 오늘도 자랑하고, 귀엽다는 말을 듣고 싶은 셈입니다만……」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「会長は今、星徒会室で大忙しです。会長のぶんのお昼も、私が買いに来たという感じで……」"
translation = "「회장은 지금, 학생회실에서 몹시 바쁩니다. 회장 몫의 점심도, 제가 사러 온 느낌이라……」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「なるほど。ではバニーのお披露目は放課後まで持ち越しですね」"
translation = "「과연. 그럼 바니 피로는 방과 후까지 이월이군요」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「フヒヒ！\u3000だったらアナ、この薬もついでに会長の元へ届けてくれたまエ！」"
translation = "「후히히! 그렇다면 아나, 이 약도 겸사겸사 회장에게 전달해 주게나!」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「アニマ先輩、また新しいお薬ですか。そうやって会長を実験台にばかりしていると、またシエスタが騒ぎを起こすかもしれませんよ？」"
translation = "「아니마 선배, 또 새로운 약인가요. 그렇게 회장을 실험용 쥐 취급만 하다간, 또 시에스타가 소동을 일으킬지도 몰라요?」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「そうは言うがネ。やはり新薬は実験せねばデータが取れなイ。錬金術の発展のためにモ、付き合ってほしいんだヨ」"
translation = "「그렇게 말하지만 말이다. 역시 신약은 실험하지 않으면 데이터를 얻을 수 없다네. 연금술의 발전을 위해서도, 함께해 줬으면 좋겠구만」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「一応マスターは、これでも少しだけ遠慮というものを覚えたのです。会長への投薬量も、以前に比べて３割ほどは減少しました」"
translation = "「일단 마스터는, 이래 봬도 아주 조금은 사리는 법을 배운 것입니다. 회장에 대한 투약량도, 이전과 비교해 3할 정도는 감소했습니다」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「……そうでしたか。その理屈で、シエスタが納得してくれると良いのですが」"
translation = "「……그러셨군요. 그 논리로, 시에스타가 납득해 주면 좋겠습니다만」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長も『ドタバタする日常は嫌いではない』とシエスタに伝えておりました」"
translation = "「회장도 『시끌벅적한 일상은 싫어하지 않는다』고 시에스타에게 전달했었습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ですから、そこまで神経質にならなくても大丈夫でしょう」"
translation = "「그러니까, 거기까지 신경질적이 되지 않아도 괜찮겠죠」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「フヒヒヒ♪\u3000それじゃあ頼んだヨ。このラブラブポーションボム２を会長に飲ませてくレ！」"
translation = "「후히히히♪ 그럼 부탁하네. 이 러블러브 포션 봄 2를 회장에게 먹여 주게나!」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「これを飲めばあら不思議、深層心理で一番愛している者へ、熱烈なスキンシップをしたくてしたくてたまらなくなるという一品ダ♪」"
translation = "「이것을 마시면 어라 신기해라, 심층심리에서 가장 사랑하는 자에게, 열렬한 스킨십을 하고 싶어서 견딜 수 없게 된다는 일품이라네♪」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「これはまた、やばそうな惚れ薬を作りましたね」"
translation = "「이건 또, 위험해 보이는 반할 약을 만들셨네요」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「フヒ。お得意様からの依頼でネ。依頼料もたっぷり貰っているから早く結果を出したいんだヨ」"
translation = "「후히. 단골손님의 의뢰라서 말이지. 의뢰료도 듬뿍 받았으니까 빨리 결과를 내고 싶다네」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「…………惚れ薬」"
translation = "「…………반할 약」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「マスター、提案なのですが。そのお薬の実験台。シュティレが立候補してはダメでしょうか？」"
translation = "「마스터, 제안입니다만. 그 약의 실험용 쥐. 슈틸레가 입후보해서는 안 될까요?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「……大丈夫なのですか、そんな安請け合いをして」"
translation = "「……괜찮은 건가요, 그런 섣부른 승낙을 하고서」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ノープロブレムです。会長もお忙しいでしょうし、代わりを勤めるのもカノジョの役割というものです。ぶい」"
translation = "「노 프로블럼입니다. 회장도 바쁘실 테고, 대리를 맡는 것도 그녀로서의 역할이라는 것입니다. 브이」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「さっきと言ってることが逆だゾ、シュティレ？\u3000ははーン、もしかしテ……」"
translation = "「방금 한 말과 말이 앞뒤가 안 맞다구, 슈틸레? 하하앙, 혹시……」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「ええ。深層心理で一番好きな相手……会長が、もしも自分でない相手にアプローチをかけてしまったら嫌だと。そういうことでしょうか？」"
translation = "「네. 심층심리에서 가장 좋아하는 상대…… 회장이, 만약 자신이 아닌 상대에게 접근해 버리면 싫다고. 그런 뜻일까요?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「む──鋭いですね、お２人とも。その通りです。実はシュティレ、ちょっぴり不安なのです」"
translation = "「음── 날카로우시네요, 두 분 다. 그렇습니다. 사실 슈틸레, 조금 불안한 것입니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「シュティレはこの通り不愛想なバニー天使なので。もしも会長が別の女の子にアプローチしてしまったら、ショックで寝込んでしまいます」"
translation = "「슈틸레는 보시다시피 붙싹성 없는 바니 천사라서. 만약 회장이 다른 여자아이에게 접근해 버린다면, 쇼크로 누워 버리고 맙니다」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「杞憂だと思いますが……うちの会長はシュティレさん一筋ですよ？」"
translation = "「기우라고 생각합니다만…… 우리 회장님은 슈틸레 씨 해바라기라고요?」"

[[dialogue]]
speaker_original = "アニマ"
speaker_translation = "아니마"
original = "「フヒ。まぁデータが取れればアニマは誰でも構わないヨ。じゃあシュティレ、グビっと一発、キメてみたまエ！」"
translation = "「후히. 뭐 데이터만 얻을 수 있다면 아니마는 누구든 상관없다네. 그럼 슈틸레, 꿀꺽하고 한 발, 정해 보게나!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ラジャーです。では──」"
translation = "「라져입니다. 그럼──」"

[[dialogue]]
speaker = "unk"
original = "アニマから渡されたドドメ色のドリンクを、シュティレは一気に飲み干した──"
translation = "아니마에게서 전달받은 탁한 보랏빛 드링크를, 슈틸레는 일숨에 마셔 버렸다──"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「アナってば、遅いね？」"
translation = "「아나도 참, 늦네?」"

[[dialogue]]
speaker = "unk"
original = "購買部が混んでるのかな"
translation = "매점이 붐비는 걸까"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「ふふ。最近、シュティレちゃんバニー衣装で接客してるからかな。いつも大賑わいなんだって」"
translation = "「후후. 요즘, 슈틸레 찬 바니 의상으로 접객하고 있으니까 그럴까. 항상 엄청 대성황이래」"

[[dialogue]]
speaker = "unk"
original = "むむむ……複雑だ"
translation = "음음음…… 복잡하네"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「あはは。会長でも嫉妬ってするんだ。ちょっと新鮮かも」"
translation = "「아하하. 회장도 질투라는 걸 하는구나. 조금 신선할지도」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「────会長」"
translation = "「────회장」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「あれ、シュティレちゃん？\u3000星徒会室に何か用事でも──」"
translation = "「어라, 슈틸레 찬? 성도회실에 무슨 일이라도──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「────シンメトリー・ドッキング！！！」"
translation = "「────시메트리 도킹!!!」"

[[dialogue]]
speaker = "unk"
original = "うわぁぁぁああぁ！？"
translation = "우와아아아아아아!?"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「──シュティレちゃんがいきなり会長に抱き着いたあぁー！？」"
translation = "「──슈틸레 찬이 갑자기 회장에게 안겨붙었다아ー!?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「はぁ、はぁっ……お、遅かったようです。まさかこんなに急に効果が出るとは……」"
translation = "「하아, 하아…… 늦, 늦은 모양입니다. 설마 이렇게 급격히 효과가 나타날 줄은……」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長。愛しています。熱いシンメトリー・ドッキング完了しました。もう何があっても離しません。ぶいぶいぶいのぶいっ」"
translation = "「회장. 사랑합니다. 뜨거운 시메트리 도킹 완료했습니다. 이제 무슨 일이 있어도 놓지 않겠습니다. 브이브이브이의 브잇」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「おお。コアラのように会長に抱き着いていますね。両足を背中に回して……あれではとても振りほどけません」"
translation = "「오오. 코알라처럼 회장에게 안겨붙어 있네요. 양다리를 세중에 돌리고…… 저래서는 도저히 떼어낼 수 없습니다」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「アナ、こ、これは一体どういう……！？」"
translation = "「아나, 이, 이건 대체 어떻게 된……!?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「実は、かくかくしかじか、な感じで……」"
translation = "「사실은, 이러저러해서, 그런 느낌으로……」"

[[dialogue]]
speaker = "unk"
original = "またアニマ先輩か！？"
translation = "또 아니마 선배인가!?"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「──会長。今そのお口から、シュティレ以外のオンナの名前を出しましたね？\u3000いけませんよ。彼ピの自覚がありません」"
translation = "「──회장. 방금 그 입으로, 슈틸레 이외의 여자의 이름을 꺼냈지요? 안 돼요. 남자친구로서의 자각이 없습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふさがせていただきます。ズキュゥゥゥゥン」"
translation = "「막아버리겠습니다. 즈큥─────」"

[[dialogue]]
speaker = "unk"
original = "んむむむむーっ！？"
translation = "음무무무무ー윽!?"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「うわぁぁあ！？\u3000あ、あんなえぐりこむようにチューを──！？」"
translation = "「우와아아!? 아, 아연히 파고드는 것 같은 키스를──!?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「流石はドリルを愛するシュティレさんですね」"
translation = "「역시 드릴을 사랑하는 슈틸레 씨답네요」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「冷静に言ってる場合！？\u3000まずいよアレ！！」"
translation = "「냉정하게 말할 때야!? 위험하다고 저거!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「──ぷは。熱いベーゼをいたしました。ぶいぶいっ。ぶいぶいぶいっ。ぴょんぴょん、ぴょーんっ<emoji=heart04>」"
translation = "「──푸하. 뜨거운 베제(키스)를 했습니다. 브이브이. 브이브이브이. 깡충깡충, 깡ー충<emoji=heart04>」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「大変だよ！\u3000シュティレちゃんが壊れちゃった！？」"
translation = "「큰일이야! 슈틸레 찬이 고장 나 버렸어!?」"

[[dialogue]]
speaker = "unk"
original = "アナ、マトイ！\u3000助けてくれ──！"
translation = "아나, 마토이! 구해줘──!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「またシュティレ以外のギャルの名前を出しましたね。悪いのはこのお口ですか。ズキュゥゥウゥン」"
translation = "「또 슈틸레 이외의 갸루의 이름을 꺼냈군요. 나쁜 건 이 입인가요. 즈큥─────」"

[[dialogue]]
speaker = "unk"
original = "んむむむむ～～～～っ！？"
translation = "음무무무무～～～～윽!?"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「こ、これどうやったら治るの！？」"
translation = "「이, 이거 어떻게 해야 나아지는 거야!?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「……薬の効果がいつ切れるかは不明だそうです」"
translation = "「……약의 효과가 언제 끝날지는 불명이라고 합니다」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「そんな！？\u3000もう昼休み終わるよ！？\u3000授業始まっちゃうって！！」"
translation = "「거짓말!? 벌써 점심시간 끝난다고!? 수업 시작해 버린다고!!」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「…………このまま出るしかないでしょう。星徒会長がさぼりだなんて示しがつきません……！」"
translation = "「…………이대로 나갈 수밖에 없겠지요. 성도회장이 땡땡이라니 모범이 되지 않습니다……!」"

[[dialogue]]
speaker = "unk"
original = "そ、そんな……！？！？"
translation = "그, 그런……!?!?"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「はーい、授業を始めま～す！」"
translation = "「자아, 수업을 시작할게요~!」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「ってぇ！？\u3000会長くんと──シュティレちゃん！？\u3000な、何をして……！？」"
translation = "「뭣!? 회장 군이랑── 슈틸레 찬!? 무, 뭘 하고……!?」"

[[dialogue]]
speaker = "unk"
original = "すみません、トワ先生。実は……！"
translation = "죄송해요, 토와 선생님. 사실은……!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「反省が足りませんね、このお口は。熱いベーゼの刑です。ズッキュゥウウゥン」"
translation = "「반성이 부족하군요, 이 입은. 뜨거운 베제의 형입니다. 즈큥─────」"

[[dialogue]]
speaker = "unk"
original = "むむむむぅう～～！？"
translation = "무무무무으~~~~!?"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「ぎゃー！？\u3000待って待って！\u3000神聖な学び舎でそんな熱いキスを──ななな、なんでぇ～～～っ！？」"
translation = ""

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「すみません、すみませんっ……！\u3000授業、始めてください……！」"
translation = "「죄송합니다, 죄송합니다……! 수업, 시작해 주세요……!」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「無理だよぉ！？\u3000こんな状況で～～～っ！？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "それから日が暮れるまで、俺はバニー姿のシュティレに抱き着かれながら過ごすことになるのだった……"
translation = "그 후 해가 질 때까지, 나는 바니 차림의 슈틸레에게 안겨붙은 채 보내게 되는 것이었다……"

[[dialogue]]
speaker = "unk"
original = "アニマ先輩……覚えていてくださいよ……！！"
translation = "아니마 선배…… 기억해 두세요……!!"

