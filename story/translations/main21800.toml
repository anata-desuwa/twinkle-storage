[[dialogue]]
speaker = "unk"
original = "第０話,使徒の跳躍,B"
translation = "제0화, 사도의 도약, B"

[[dialogue]]
speaker = "unk"
original = "──カンリ、シナケレバ。"
translation = "──관리, 해야만 한다."

[[dialogue]]
speaker = "unk"
original = "──セカイヲ、トワニ。セイチョウ、サセナケレバ。"
translation = "──세계를, 영원히. 성장, 시켜야만 한다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「インフィニット・ディザスター────！！！！」"
translation = "「인피니트 디저스터────!!!!」"

[[dialogue]]
speaker = "unk"
original = "「ガ────ギャ──────ギギギギイィィィィ！？」"
translation = "「가────갸──────기기기기이이이이!?」"

[[dialogue]]
speaker = "unk"
original = "──キンシ、ヒテイ、フカノウ──！！"
translation = "──금지, 부정, 불가능──!!"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「砕けろぉぉぉおぉぉおおおおッ────！！！！」"
translation = "「부서져라아아아아아아아아아앗────!!!!」"

[[dialogue]]
speaker = "unk"
original = "──カンゼン、フメツ、チョウエツ\u3000コソ\u3000ガ\u3000カミ──！！！"
translation = "──완전, 불멸, 초월 이야말로 신──!!!"

[[dialogue]]
speaker = "unk"
original = "終焉世界ベガで、『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』は散った。"
translation = "종언 세계 베가에서, 『<ruby>XELOS<rt>제로스</rt></ruby>』는 흩어졌다."

[[dialogue]]
speaker = "unk"
original = "だが──"
translation = "하지만──"

[[dialogue]]
speaker = "unk"
original = "（……カミ\u3000ハ\u3000ケツマツ\u3000ヲ\u3000ヒテイスル）"
translation = "（……신은 결말을 부정한다）"

[[dialogue]]
speaker = "unk"
original = "（────ソウ、ダ。アノ、ゲンショウヲ、リヨウ──スレバ────）"
translation = "（────그래. 그, 현상을, 이용──하면────）"

[[dialogue]]
speaker = "unk"
original = "平行世界に干渉するラクシス固有の権能を、『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』は最期まで己のモノとすることは叶わなかった。"
translation = "평행세계에 간섭하는 락시스 고유의 권능을, 『<ruby>XELOS<rt>제로스</rt></ruby>』는 마지막까지 자신의 것으로 만들지 못했다."

[[dialogue]]
speaker = "unk"
original = "ラクシスの権能を元に作り出した、次元転送装置を用いずに平行世界へ干渉すると、意図せず時の流れが捻じ曲がってしまう。"
translation = "락시스의 권능을 토대로 만들어낸, 차원 전송 장치를 이용하지 않고 평행세계에 간섭하면, 의도치 않게 시간의 흐름이 뒤틀려 버린다."

[[dialogue]]
speaker = "unk"
original = "そのことは、使徒であったアポロ、そしてジグを跳躍させた際にも確認していた事実。"
translation = "그것은, 사도였던 아폴로, 그리고 지그를 도약시켰을 때도 확인했던 사실."

[[dialogue]]
speaker = "unk"
original = "意のままに操れない力ゆえに、今の今まで選択肢にすら入っていなかった、その現象。"
translation = "마음대로 다룰 수 없는 힘이기에, 지금까지 선택지조차 들어있지 않았던, 그 현상."

[[dialogue]]
speaker = "unk"
original = "しかしもうそれに縋るしかない。不完全であっても、過去に干渉できる唯一の方法なのだから──"
translation = "하지만 이제 그것에 매달릴 수밖에 없다. 불완전하더라도, 과거에 간섭할 수 있는 유일한 방법이니까──"

[[dialogue]]
speaker = "unk"
original = "（サイゴノ──シトヲ────アルタイル、ヘ──）"
translation = "（마지막── 사도를──── 알타이르로──）"

[[dialogue]]
speaker = "unk"
original = "（チョウエツ、マキモドシ、クリカエス────）"
translation = "（초월, 되감기, 반복한다────）"

[[dialogue]]
speaker = "unk"
original = "<ruby>彼<rt>か</rt></ruby>の神は最期の力を振り絞り──１人の使徒を創造し、平行世界アルタイルへと飛ばした。"
translation = "그 신은 마지막 힘을 쥐어짜── 한 명의 사도를 창조하여, 평행세계 알타이르로 날려 보냈다."

[[dialogue]]
speaker = "unk"
original = "宇宙規模のプログラムであった『神』が、初めて己以外の何者かに祈ったのだ。"
translation = "우주 규모의 프로그램이었던 『신』이, 처음으로 자신 이외의 누군가에게 기도했다."

[[dialogue]]
speaker = "unk"
original = "──遡れるだけ、過去へ。"
translation = "──거스를 수 있는 만큼, 과거로."

[[dialogue]]
speaker = "unk"
original = "──『神』の消滅の未来を覆せる地点まで、飛んでゆけ、と。"
translation = "──『신』의 소멸이라는 미래를 뒤집을 수 있는 지점까지, 날아가라고."

[[dialogue]]
speaker_original = "ホロウ・ルヴィネ"
speaker_translation = "할로우・루비네"
original = "「…………承知いたしました、お父様」"
translation = "「…………알겠습니다, 아버님」"

[[dialogue]]
speaker_original = "ホロウ・ルヴィネL"
speaker_translation = "할로우 루비네 L"
original = "「お父様の消滅する、忌むべき未来を否定するため──動きましょう」"
translation = "「아버님이 소멸하는, 꺼림칙한 미래를 부정하기 위해── 움직이겠습니다」"

[[dialogue]]
speaker = "unk"
original = "──同刻。"
translation = "──동각."

[[dialogue]]
speaker = "unk"
original = "新星学園の星徒会室にて──"
translation = "신성학원의 학생회실에서──"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「会長さんのオーダーは了解。ドタバタしてる天界から、強～い星騎士を引っ張って来ればＯＫだね？」"
translation = "「회장님의 오더는 확인. 소란스러운 천계에서, 강～한 성기사를 끌고 오면 OK지?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああ。メルエル、ナターシャ。頼んだ」"
translation = "「아아. 메르엘, 나타샤. 부탁한다」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「任せて！」"
translation = "「맡겨줘!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「できうる範囲で、頑張らせてもらうよ」"
translation = "「할 수 있는 범위 내에서, 노력해 볼게」"

[[dialogue]]
speaker_original = "ホロウ・ルヴィネ"
speaker_translation = "할로우・루비네"
original = "（…………そう。今はまだ、緋宮クロトたちはデネブへ乗り込んではいない。けれど──）"
translation = "（…………그래. 지금은 아직, 히노미야 쿠로토 일행이 데네브로 쳐들어오지는 않았어. 하지만──）"

[[dialogue]]
speaker = "unk"
original = "創造神による強引な過去跳躍は、この地点が最長だった。"
translation = "창조신에 의한 억지스러운 과거 도약은, 이 지점이 최장량이었다."

[[dialogue]]
speaker_original = "ホロウ・ルヴィネ"
speaker_translation = "할로우・루비네"
original = "（……まだ間に合う。全てを覆す。過去を改変し、星騎士の勝利という未来を否定する──）"
translation = "（……아직 늦지 않았어. 모든 것을 뒤집는다. 과거를 개변하여, 성기사의 승리라는 미래를 부정한다──）"

[[dialogue]]
speaker_original = "ホロウ・ルヴィネ"
speaker_translation = "할로우・루비네"
original = "（お父様を堕落させるセイファートの剣。『<ruby>星の再会<rt>スター・リユニオン</rt></ruby>』。ディザスターハンドとの同化──全て、なかったことにしてみせる）"
translation = "（아버님을 타락시키는 세이파트의 검. 『<ruby>별의 재회<rt>스타 리유니온</rt></ruby>』. 디저스터 핸드와의 동화── 전부, 없었던 일로 해주지）"

[[dialogue]]
speaker_original = "ホロウ・ルヴィネ"
speaker_translation = "할로우・루비네"
original = "（そのためには、まず──）"
translation = "（그러기 위해서는, 우선──）"

[[dialogue]]
speaker_original = "ホロウ・ルヴィネ"
speaker_translation = "할로우・루비네"
original = "（魔王メルエルを、新しいリクリエの使徒に仕立てましょう）"
translation = "（마왕 메르엘을, 새로운 리크리에의 사도로 만들어 보죠）"

