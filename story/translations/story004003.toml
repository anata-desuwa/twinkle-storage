[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「当主様……言われた通り、人工戦闘服を着てきましたけれど！\u3000こ、これは一体どういうことですかっ！？」"
translation = "「당주님…… 말씀하신 대로 인공 전투복을 입고 왔습니다만! 이, 이것은 대체 어떻게 된 일입니까!?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむうむ♪\u3000実にプリティーだ♪\u3000この姿で街を練り歩けば、件のヘンタイをあぶりだせよう！」"
translation = "「음음♪ 참으로 프리티하구나♪ 이 모습으로 거리를 활보하면, 그 변태를 밖으로 유인해 낼 수 있겠지!」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「なるほど。魚を釣り上げるにはエサが必要。相手がヘンタイならば、ヘンタイ用のエサを用意すればいいということですね」"
translation = "「과연. 물고기를 낚으려면 미끼가 필요한 법. 상대가 변태라면 변태용 미끼를 준비하면 된다는 뜻이군요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「まあ……不思議ないでたちですね。あの衣装はいったい……？」"
translation = "「어머…… 희한한 차림이네요. 저 의상은 대체……?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あれはバニーガールというコスチュームです」"
translation = "「저것은 바니걸이라고 하는 코스튬입니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「カジノの女性店員の王道スタイルであり、またアニメや漫画といったサブカルチャーでも大人気の服装……」"
translation = "「카지노 여성 점원의 왕도 스타일이며, 또한 애니메이션이나 만화 같은 서브컬처에서도 대인기인 복장……」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「一説によれば、ウサギの獣人が多く住む、魔界のラパン地方における伝統衣装なのだとか」"
translation = "「일설에 따르면, 토끼 수인이 많이 사는 마계의 라팡 지방의 전통 의상이라던가」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ほぇ～っ……そうなのですね。勉強になりますっ」"
translation = "「호에~…… 그렇군요. 공부가 되었어요」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「待つぴょん！？\u3000聞き捨てならないぴょん！！」"
translation = "「잠깐 뿅!? 듣고 넘어갈 수 없다 뿅!!」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「ら、蘭美先輩。ラパン地方の方言が出ちゃってますよ！？」"
translation = "「라, 라비 선배. 라팡 지방의 사투리가 나오고 있어요!?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「地元の方言が出るのも無理ないぴょん！\u3000言っておくけど、ラパン地方の伝統衣装はこんなハレンチ衣装じゃないぴょん！！」"
translation = "「고향 사투리가 나오는 것도 무리가 아니다 뿅! 말해 두겠는데, 라팡 지방의 전통 의상은 이런 파렴치한 의상이 아니다 뿅!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「なんと。そうだったのですか？」"
translation = "「무려. 그러했던 것입니까?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「人間界に誤って伝わってる偏見だぴょん！\u3000ウサギの獣人がいっぱいいるからって、それだけの理由で勘違いされてるんだぴょんっ！！」"
translation = "「인간계에 잘못 전해진 편견이다 뿅! 토끼 수인이 가득하다고 해서, 그것뿐인 이유로 오해받고 있는 거다 뿅!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「大変失礼いたしました。情報をアップデートしておきます。トリュファイナさんも、誤った情報を渡してしまい申し訳ありません」"
translation = "「대단히 실례하였습니다. 정보를 업데이트해 두겠습니다. 트리파이나 님도, 잘못된 정보를 전해드려 죄송합니다」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「いえいえ。文化が積み重なれば、様々な解釈や行き違いが生まれるのも道理ですので」"
translation = "「아니에요. 문화가 쌓이다 보면 여러 해석이나 오해가 생기는 것도 이치이니까요」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「……知っていましたか、マトイ先輩。ラパン地方では、バニーガールは伝統衣装ではないそうです」"
translation = "「……알고 계셨습니까, 마토이 선배. 라팡 지방에서는 바니걸이 전통 의상이 아니라고 합니다」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「し、知らなかった……私、ラパンの人たちは、みんなバニー服を着てるとばかり……！！」"
translation = "「몰, 몰랐어…… 나, 라팡 사람들은 모두 바니 의상을 입고 있다고만……!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あんまりだぴょん！！\u3000いっつもこれぴょんっ！！\u3000誤解されるたびに訂正してばっかり──！！」"
translation = "「너무하다 뿅!! 항상 이렇다 뿅!! 오해받을 때마다 정정하기만 하고──!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「当主様っ！\u3000このような衣装を着なくとも、私はウサギの魔族です！」"
translation = "「당주님! 이러한 의상을 입지 않더라도 저는 토끼 마족입니다!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「敵がウサギに並々ならぬ執着を見せるのであれば、わざわざバニーガールにならなくても……！！」"
translation = "「적들이 토끼에 남다른 집착을 보인다면, 일부러 바니걸이 되지 않더라도……!!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「何を言う。敵はバニーガールフェチが高じるあまり、誘拐騒ぎを起こすほどのヘンタイであるぞ？」"
translation = "「무슨 소리를 하는 거냐. 적은 바니걸 페티시가 도를 넘어 유괴 소동까지 일으킬 정도의 변태란 말이다?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「お着替えは許可できん。ダッチをいぶりだすまで、その格好でいるのだ。これは九浄家当主の決定である！」"
translation = "「갈아입는 것은 허가할 수 없다. 놈을 끌어낼 때까지 그 차림으로 있어라. 이것은 쿠죠가 당주의 결정이다!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そんなっ……！！\u3000ひどい辱めです！！\u3000耐えられません！！」"
translation = "「그런……!! 지독한 수치입니다!! 견딜 수 없습니다!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「人間界に来てからずっと、ラパン地方の偏見をなくそうと努力してたのにっ……！！」"
translation = "「인간계에 오고 나서 줄곧 라팡 지방의 편견을 없애려고 노력했는데……!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「私がこんな格好で外を出歩いたら『あ、やっぱり』って言われるに決まってるわ……今までの苦労が水の泡じゃない！！」"
translation = "「내가 이런 차림으로 밖을 돌아다니면 『아, 역시』라고 들을 게 분명해…… 지금까지의 고생이 물품품이잖아!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「今は緊急事態です。会長のためにも、こらえてください」"
translation = "「지금은 비상사태입니다. 회장님을 위해서라도 참아 주십시오」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふぁ、ふぁいとです蘭美様っ。魔王様のためにも！」"
translation = "「파, 화이팅이에요 라비 님. 마왕님을 위해서라도!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「う、うぅっ──！\u3000これは会長のため……会長のため……！」"
translation = "「우, 으윽──! 이것은 회장님을 위해…… 회장님을 위해……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そう落ち込むでない、蘭美よ。任務を任せるのはお前１人ではない」"
translation = "「그리 낙담하지 마라, 라비야. 임무를 맡기는 것은 너 혼자가 아니다」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「…………え？」"
translation = "「…………네?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「また来客っ！？\u3000ダ、ダメよ！\u3000こんな格好、見られるわけには──！！」"
translation = "「또 손님!? 안, 안 돼! 이런 차림, 들킬 수는──!!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「待っていたぞ──入ってくるがよい！」"
translation = "「기다리고 있었다── 들어오도록 해라!」"

[[dialogue]]
speaker_original = "ユウリ"
speaker_translation = "유우리"
original = "「失礼します。なんでもあたしらの協力が必要だって……」"
translation = "「실례하겠습니다. 뭐든 저희의 협력이 필요하다고 해서……」"

[[dialogue]]
speaker_original = "セーラ"
speaker_translation = "세라"
original = "「会長さんの捜索に人手がいるんだよね？\u3000まっかせて～！」"
translation = "「회장님의 수색에 손이 필요한 거지? 맡겨만 줘~!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「トラブルはゴールデングースにお任せですわ！」"
translation = "「트러블은 골든 구스에게 맡겨 주시지요!」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「はろはろ～♪\u3000公安もお手伝いするよ～♪」"
translation = "「하로하로~♪ 공안도 도와줄게~♪」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「随分と変わった人選ですわね？\u3000いったい何をすれば──」"
translation = "「제법 특이한 인선이군요? 대체 뭘 하면──」"

[[dialogue]]
speaker_original = "ユウリ"
speaker_translation = "유우리"
original = "「……は？」"
translation = "「……하?」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「……えっ？」"
translation = "「……에?」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ま、まさか──」"
translation = "「설, 설마──」"

[[dialogue]]
speaker_original = "セーラ"
speaker_translation = "세라"
original = "「あ～。そーゆーこと♪」"
translation = "「아~. 그런 거♪」"

[[dialogue]]
speaker_original = "ネーゼマイン"
speaker_translation = "네제마인"
original = "「なんでこの５人が呼ばれたのか、わかっちゃったかも♪」"
translation = "「어째서 이 5명이 불렸는지, 알 것 같을지도♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「よく来てくれた。これで<b>バニーガールが全員</b>──集まったな♪」"
translation = "「잘 와 주었다. 이것으로 <b>바니걸이 전원</b>── 모였구나♪」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「じょっ、冗談じゃねぇですわ～っ！？」"
translation = "「농, 농담이 아니옵니다~!?」"

