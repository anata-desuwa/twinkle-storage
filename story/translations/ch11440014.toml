[[dialogue]]
speaker = "unk"
original = "第４話,恋人とペット,P"
translation = ""

[[dialogue]]
speaker = "unk"
original = "狛里が『魔王様のペットになりたい』と言い出した翌日。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "九浄家では、俺と蘭美とヴィーナスの３人で話し合いが行われていた。"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「――というわけで、狛里の件について、少し話をしておきましょう」"
translation = ""

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「まさか告白の次が『ペットになりたい』だなんて、面白いわね！\u3000狛里らしいわ♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "笑いごとじゃないぞ……"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「狛里らしいで済ませられる問題でもないわよ、ヴィーナスお嬢様」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「学園の風紀だけじゃなく、九浄家のメイドとしても、色々と問題があるわ！」"
translation = ""

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「でもこれって、学園とか九浄家とかじゃなくて、クロトと狛里の２人の話でしょう？」"
translation = ""

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「クロトは結局、狛里のことをどう思ってるのかしら？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "問いかけられ、俺は少し考える。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "今まで、誰かを恋愛対象として意識したことはなかった。けれど――"
translation = ""

[[dialogue]]
speaker = "unk"
original = "狛里のストレートな告白には、胸を打たれた。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "あの告白で、狛里を意識するようになった"
translation = "그 고백으로 코마리를 의식하게 되었다."

[[dialogue]]
speaker = "unk"
original = "チョロいと言われるかもしれないが……"
translation = "쉬운 놈이라고 할지도 모르겠지만……."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「いいんじゃないかしら？\u3000誰かを好きになるのは、理屈じゃないもの♪」"
translation = "「괜찮지 않아? 누군가를 좋아하게 되는 건 이성이 아니니까♪」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「会長がそう思っているなら、ちゃんと本人へ伝えるべきよ！」"
translation = "「회장이 그렇게 생각하고 있다면, 제대로 본인에게 전달해야지!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ペットではなく――恋人になりましょう、ってね！」"
translation = "「애완동물이 아니라――연인이 됩시다, 라고 말이야!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「クロト、頑張ってきなさい！」"
translation = "「쿠로토, 힘내고 오렴!」"

[[dialogue]]
speaker = "unk"
original = "俺は２人に頷いてみせた。"
translation = "나는 두 사람에게 고개를 끄덕여 보였다."

[[dialogue]]
speaker = "unk"
original = "その日の放課後。"
translation = "그날 방과 후."

[[dialogue]]
speaker = "unk"
original = "俺は狛里と話す為に、空き教室へ呼び出していた。"
translation = "나는 코마리와 이야기하기 위해 빈 교실로 불러냈다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様～っ♪」"
translation = "「마왕님～♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「呼び出しなんて珍しいのです！」"
translation = "「부르시다니 별일인 것입니다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「もしかして、狛里をペットにするって決めてくれたのです！？」"
translation = "「혹시, 코마리를 애완동물로 삼기로 결정해주신 것입니까!?」"

[[dialogue]]
speaker = "unk"
original = "聞いてくれ"
translation = "들어줘"

[[dialogue]]
speaker = "unk"
original = "いや、そうじゃない。"
translation = "아니, 그게 아니야."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいなのです！」"
translation = "「네인 것입니다!」"

[[dialogue]]
speaker = "unk"
original = "狛里はぴしっと背筋を伸ばす。しかし尻尾は、期待でぶんぶん揺れていた。"
translation = "코마리는 척하고 등평을 편다. 하지만 꼬리는 기대감으로 붕붕 흔들리고 있었다."

[[dialogue]]
speaker = "unk"
original = "俺も狛里のことが好きだ"
translation = "나도 코마리를 좋아해"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ♪」"
translation = "「네엣♪」"

[[dialogue]]
speaker = "unk"
original = "だから――俺と恋人になってほしい"
translation = "그러니까――나와 연인이 되어줬으면 좋겠어"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「……！\u3000狛里も魔王様のこと、大好きなのですっ♪」"
translation = "「……! 코마리도 마왕님, 정말 좋아하는 것입니다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「だから、とっても嬉しいのであります！」"
translation = "「그러니까, 너무나 기쁜 것이올니다!」"

[[dialogue]]
speaker = "unk"
original = "そう言って満面の笑みを浮かべる。"
translation = "그렇게 말하며 만면에 미소를 띤다."

[[dialogue]]
speaker = "unk"
original = "その笑顔を見ているだけで、告白して良かったと思えた。"
translation = "그 웃는 얼굴을 보고 있는 것만으로, 고백하길 잘했다고 생각할 수 있었다."

[[dialogue]]
speaker = "unk"
original = "しかし――"
translation = "하지만――"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「つまり……狛里は魔王様のペットにしてもらえるのでありますねっ♪」"
translation = "「즉…… 코마리는 마왕님의 애완동물이 될 수 있는 것이군요♪」"

[[dialogue]]
speaker = "unk"
original = "いや、なんでっ！？"
translation = "아니, 왜!?"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「だって、好き好き同士だから、ずっと一緒にいるのですよね？」"
translation = "「그야, 서로 좋아하는 사이니까 계속 함께 있는 것이죠?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ということは、ご主人様とペットみたいなものなのです♪」"
translation = "「 그렇다는 건, 주인님과 애완동물 같은 것인 것입니다♪」"

[[dialogue]]
speaker = "unk"
original = "ち、ちょっと違うかな……"
translation = "조, 조금 다른가……."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「そうなのですか？\u3000ふぅ～む……」"
translation = "「그런 것입니까? 흐~음……」"

[[dialogue]]
speaker = "unk"
original = "狛里は真剣な顔で悩み始める。そして――"
translation = "코마리는 진지한 얼굴로 고민하기 시작한다. 그리고――"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「つまり恋人とは……」"
translation = "「즉 연인이란……」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「少し偉いペット……ってことなのです？」"
translation = "「조금 높은 애완동물……이라는 것입니까?」"

[[dialogue]]
speaker = "unk"
original = "全然違うよ！？"
translation = "전혀 달라!?"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「難しいであります～～っ！」"
translation = "「어렵사옵니다~~!」"

[[dialogue]]
speaker = "unk"
original = "しばらく説明を続けた結果。"
translation = "한참 동안 설명을 계속한 결과."

[[dialogue]]
speaker = "unk"
original = "理解したかどうかは怪しいが、とりあえず……。"
translation = "이해했는지는 의문이지만, 우선은……."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「わかったのです！」"
translation = "「알아들은 것입니다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様と一緒に遊びに行くのが『でーと』！」"
translation = "「마왕님과 함께 놀러 가는 것이 『데-트』!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「でーとをする人たちが恋人！\u3000ということでありますね！」"
translation = "「데-트를 하는 사람들이 연인! 이라는 것이군요!」"

[[dialogue]]
speaker = "unk"
original = "だ、だいたいそんな感じかな……"
translation = "대, 대충 그런 느낌일까……."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「なるほどなのです！」"
translation = "「역시나인 것입니다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「それで――」"
translation = "「그래서――」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「恋人というのは、どういう主従関係なのです？」"
translation = "「연인이라는 건, 어떤 주종 관계인 것입니까?」"

[[dialogue]]
speaker = "unk"
original = "またそこに戻るの！？"
translation = "다시 거기로 돌아가는 거야!?"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふ？」"
translation = "「바우와후?」"

[[dialogue]]
speaker = "unk"
original = "首を傾げる狛里。"
translation = "고개를 기웃거리는 코마리."

[[dialogue]]
speaker = "unk"
original = "それでも――そんな狛里を見ていると、可愛いと思ってしまう自分がいる。"
translation = "그래도――그런 코마리를 보고 있으면 귀엽다고 생각해 버리는 내가 있다."

[[dialogue]]
speaker = "unk"
original = "とりあえず、今度一緒にデートに行こう"
translation = "우선, 다음에 함께 데이트하러 가자"

[[dialogue]]
speaker = "unk"
original = "……まあ、少しずつでいいか"
translation = "……뭐, 조금씩이라도 상관없나"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「！\u3000はいっ♪」"
translation = "「! 네엣♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様と２人でお出かけ、とっても楽しみなのです♪」"
translation = "「마왕님과 둘이서 외출, 정말 기대되는 것입니다♪」"

[[dialogue]]
speaker = "unk"
original = "そう言って、狛里は俺の腕にぎゅっと抱きついてくる。"
translation = "그렇게 말하며, 코마리는 내 팔에 꽉 안겨 온다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへへっ♪」"
translation = "「에헤헤헷♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様、あったかくていい匂いがするのです♪\u3000くんくん♪」"
translation = "「마왕님, 따뜻하고 좋은 냄새가 나는 것입니다♪ 킁킁♪」"

[[dialogue]]
speaker = "unk"
original = "恋人とは何か。多分まだ、狛里はよく理解していない。"
translation = "연인이란 무엇인가. 아마 아직, 코마리는 잘 이해하지 못하고 있다."

[[dialogue]]
speaker = "unk"
original = "けれど――これから一緒に過ごしていけば、少しずつ分かっていくだろう。"
translation = "하지만――앞으로 함께 보내다 보면 조금씩 알아갈 것이다."

[[dialogue]]
speaker = "unk"
original = "そんな期待を胸に抱きながら、俺たちは今度のデートの予定について話し合うのだった。"
translation = "그런 기대를 가슴에 품으며, 우리들은 이번 데이트 일정에 대해 이야기하는 것이었다."

