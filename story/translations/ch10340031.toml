[[dialogue]]
speaker = "unk"
original = "第１話,魔王としもべのご関係,P"
translation = "제1화, 마왕과 하인의 관계, P"

[[dialogue]]
speaker = "unk"
original = "昼時のカフェテリアはいつも込み合っている。空いている席を探していると──"
translation = "점심시간의 카페테리아는 항상 붐비고 있다. 빈 자리를 찾고 있자니──"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様～、こっちこっちー！」"
translation = "「마왕님~, 이쪽 이쪽ー!」"

[[dialogue]]
speaker = "unk"
original = "カティアに声をかけられた。イクシリオンとサランも一緒だ。"
translation = "카티아가 불러 세웠다. 익실리온과 사란도 함께다."

[[dialogue]]
speaker = "unk"
original = "相席いいかな？"
translation = "합석해도 될까?"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はい、会長なら大歓迎ですよ」"
translation = "「네, 회장님이시라면 대환영이에요」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ど～ぞど～ぞ～」"
translation = "「어서 오세요 어서 오세요~」"

[[dialogue]]
speaker = "unk"
original = "２人のお許しも得たところで、カティアの隣に座る。"
translation = "두 사람의 허락도 받았으니, 카티아의 옆에 앉는다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「新たに魔将になった３人でごはんしてたんですよ。いわゆる同期？\u3000ってやつですワン」"
translation = "「새롭게 마장이 된 3명이서 밥 먹고 있었어요. 이른바 동기? 라는 거랍니다 멍」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「カティアさんとは以前からお友達でしたけど、魔将になってサランさんとお話する機会が増えて、とても嬉しいです」"
translation = "「카티아 씨와는 이전부터 친구였지만, 마장이 되고 사란 씨와 이야기할 기회가 늘어나서 정말 기뻐요」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「えへへ～、そう言ってくれるとサランも嬉しいな～。２人ともたくさん食べてくれるから大好き～♪」"
translation = "「에헤헤~, 그렇게 말해주니 사란이도 기쁜걸~. 둘 다 많이 먹어주니까 너무 좋아~♪」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「サラン先輩、最近は昔の魔界料理の研究に凝ってて、何度か試作品を食べさせてもらったんですけど、それがもう本当に美味しいんです」"
translation = "「사란 선배, 요즘은 옛날 마계 요리 연구에 푹 빠져 계셔서, 몇 번인가 시제품을 얻어먹었는데, 그게 정말로 맛있거든요」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「この前食べさせていただいたケーキも絶品でしたね。不思議な香りで、食欲をそそるんですよ。あれは初めての衝撃でした」"
translation = "「요전에 먹었던 케이크도 일품이었죠. 희한한 향기로, 식욕을 돋우더라고요. 그건 처음 맛본 충격이었어요」"

[[dialogue]]
speaker = "unk"
original = "（そんなに美味しいなら食べてみたかった……）"
translation = "(그렇게 맛있다면 먹어보고 싶었다……)"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「完成したら、カフェテリアのメニューにも追加されるよ～。いつでも食べられるようになるから安心してね～」"
translation = "「완성되면 카페테리아 메뉴에도 추가될 거야~. 언제든 먹을 수 있게 되니까 안심해~」"

[[dialogue]]
speaker = "unk"
original = "どうやら顔に出ていたようだ。ちょっと恥ずかしい。"
translation = "아무래도 얼굴에 드러났던 모양이다. 조금 부끄럽다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ところで、会長とカティアさんのおふたりが揃ったので聞いてみたいことがあるんですが、よろしいでしょうか？」"
translation = "「그건 그렇고, 회장님과 카티아 씨 두 분이 모였으니 물어보고 싶은 게 있습니다만, 괜찮을까요?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「うん。いいけど、なに？」"
translation = "「응. 괜찮은데, 뭔데?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「カティアさんは魔王……つまり会長の配下だそうですが」"
translation = "「카티아 씨는 마왕…… 즉 회장님의 부하라고 들었습니다만」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「そうだよ。それがどうかした？」"
translation = "「응. 그런데 왜?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「実際、男女としてはどこまでいっていらっしゃるんでしょうか？」"
translation = "「실제로, 남녀로서는 어디까지 진도를 나가셨나요?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ぶはっ！？\u3000なに言ってるのイクシー！？」"
translation = "「푸학!? 무슨 소리를 하는 거야 익시!?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「え、違うんですか？\u3000てっきりそういうご関係かと……」"
translation = "「에, 아닌가요? 틀림없이 그런 관계일 거라……」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「サランもそう思ってた～。会長ちゃんとカティアちゃん、お付き合いしてるんじゃないの～？」"
translation = "「사란이도 그렇게 생각했어~. 회장이랑 카티아 양, 사귀고 있는 거 아니었어~?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「サラン先輩まで！？\u3000そういうのじゃないですよ！」"
translation = "「사란 선배까지!? 그런 거 아니에요!」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「でもでも～、カティアちゃんは会長ちゃんが大好きなんだよね～？」"
translation = "「하지만 하지만~, 카티아 양은 회장을 아주 좋아하잖아~?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「それはもちろん……大好きですけど……でも、私が魔王様とお付き合いなんて畏れ多いですワン……」"
translation = "「그이야 당연히…… 좋아하지만…… 그렇지만, 제가 마왕님과 사귄다니 과분하답니다 멍……」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「そうなの～？\u3000じゃあ会長ちゃんは～？\u3000カティアちゃんのこと大好き～？」"
translation = "「그래~? 그럼 회장은~? 카티아 양 좋아해~?」"

[[dialogue]]
speaker = "unk"
original = "うん、大好き"
translation = "응, 너무 좋아해"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふええぇっ！？\u3000そうなんですか！？」"
translation = "「후에에앍!? 그렇습니까!?」"

[[dialogue]]
speaker = "unk"
original = "当たり前だ。そうでなければこんなに傍にいない。"
translation = "당연하다. 그렇지 않다면 이렇게 곁에 있지 않는다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「だって～、カティアちゃん？」"
translation = "「그도 그럴 게~, 카티아 양?」"

[[dialogue]]
speaker = "unk"
original = "カティアとははっきり恋人とは言ってないけど、なんだかんだずっと一緒にいる。気持ちは伝わっていると思ったけど、そうじゃなかったみたいだ。"
translation = "카티아와는 명확히 연인이라고 말하진 않았지만, 이러니저러니 해도 줄곧 함께 있다. 마음은 전해졌을 거라 생각했는데, 그렇지 않았던 모양이다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「えっと、えっと……私たち、両想いなんですよね……？」"
translation = "「저기, 저기…… 우리들, 서로 좋아하는 거 맞죠……?」"

[[dialogue]]
speaker = "unk"
original = "そうみたい"
translation = "그런 것 같아"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「じゃ、じゃあ……これからは、恋人兼配下として、今後ともよろしくお願いします…………ワン」"
translation = "「그, 그럼…… 앞으로는, 연인 겸 부하로서, 앞으로도 잘 부탁드립니다………… 멍」"

[[dialogue]]
speaker = "unk"
original = "こちらこそ、よろしく"
translation = "나야말로 잘 부탁해"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「カティアさん、おめでとうございます！」"
translation = "「카티아 씨, 축하드려요!」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ウェディングケーキは任せてね～。腕によりをかけて作るから～」"
translation = "「웨딩케이크는 맡겨줘~. 팔을 걷어붙이고 만들 테니까~」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「サラン先輩、気が早いですよ！？」"
translation = "「사란 선배, 성급해요!?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ハッ……恋人兼配下ということは、逆らえないのをいいことにエッチな命令をされたり、逆に身も心も屈服してエッチなおねだりしたり……っ！」"
translation = "「핫…… 연인 겸 부하라는 건, 거역할 수 없는 걸 빌미로 야한 명령을 받거나, 반대로 몸도 마음도 굴복해서 야하게 떼를 쓰거나……!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「……イクシー、キモい」"
translation = "「……익시, 기분 나빠」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「すみません、大変失礼しましたぁ！」"
translation = "「죄송합니다, 대단히 실례했습니다아!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「失礼どころじゃないって！\u3000まったく……イクシーって本当にむっつりドスケベなんだって実感したよ……」"
translation = "「실례 정도가 아니라니까! 정말…… 익시라는 녀석은 진짜 숨은 꽁한 변태라는 걸 실감했어……」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はい。それはもう」"
translation = "「네. 그건 이미」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「なんでドヤ顔！？」"
translation = "「왜 당당한 표정인데!?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「嘘偽りない自分自身を晒すことでしか得られないものがあると、他でもないカティアさんから学びましたから！」"
translation = "「거짓 없는 자기 자신을 드러내는 것으로만 얻을 수 있는 것이 있다고, 다름 아닌 카티아 씨한테 배웠으니까요!」"

[[dialogue]]
speaker = "unk"
original = "何かあったの……？"
translation = "무슨 일이라도 있었던 거야……?"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私まで変態に誤解されるから、その言い方やめて！\u3000違うんですよ魔王様～！！」"
translation = "「나까지 변태로 오해받으니까, 그 말투 그만둬! 아니거든요 마왕님~!!」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「カティアちゃんとイクシーちゃんはとっても仲良しだね～♪」"
translation = "「카티아 양하고 익시 양은 사이가 정말 좋네~♪」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「違わないけど違うんです～！\u3000こんな変態と一緒にしないでくださ～い！」"
translation = "「아니지 않지만 아니에요~! 이런 변태랑 같이 취급하지 말아 주세요~!」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はぁ、はぁ……もっと言ってくださいぃ……」"
translation = "「하아, 하아…… 더 말해 주세요오……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「もぉ～！\u3000イクシーのバカ～！！」"
translation = "「정말~! 익시 바보~!!」"

[[dialogue]]
speaker = "unk"
original = "放課後、カティアと時間を合わせて下校する。前は寮に送ると理由を付けていたけど、今はただの習慣になっていた。"
translation = "방과 후, 카티아와 시간을 맞춰 하교한다. 전에는 기숙사에 데려다준다는 핑계를 댔지만, 지금은 그냥 습관이 되어 있었다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様、えっと、その……」"
translation = "「마왕님, 저기, 그……」"

[[dialogue]]
speaker = "unk"
original = "カティア、好きだよ"
translation = "카티아, 좋아해"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「っ！」"
translation = "「읏!」"

[[dialogue]]
speaker = "unk"
original = "さっきは話の流れで少し適当になってしまったから、改めて口にする。"
translation = "아까는 대화 흐름상 조금 얼렁뚱땅 넘어갔으니, 다시 한번 입 밖으로 낸다."

[[dialogue]]
speaker = "unk"
original = "逆に、あんな流れでもないと気持ちを表せなかったかもしれないけど。"
translation = "반대로, 그런 흐름이라도 없었다면 마음을 표현하지 못했을 지도 모르지만."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「えへへ、私も好きですっ！」"
translation = "「에헤헤, 저도 좋아해요!」"

[[dialogue]]
speaker = "unk"
original = "そう言って、俺の差し出した手を握るカティア。この温かい手を、一生忘れないと思う。"
translation = "그렇게 말하며, 내가 내민 손을 잡는 카티아. 이 따뜻한 손을, 평생 잊지 못할 것 같다."

