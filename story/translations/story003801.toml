[[dialogue]]
speaker = "unk"
original = "――女神『ルネア』が管理する『ティンクル☆くるせいだーす』の世界。"
translation = "――여신 『루네아』가 관리하는 『팅클☆크루세이더스』의 세계."

[[dialogue]]
speaker = "unk"
original = "今、『流星クルセイダース』こと『流星生徒会』の４人の前には、ルネアが新たに作り出した空間が広がっていた。"
translation = "지금, 『유성 크루세이더스』 겸 『유성 학생회』의 4명 앞에는, 루네아가 새롭게 만들어낸 공간이 넓게 펼쳐져 있었다."

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「コホン――それでは宣言するわよ」"
translation = "「크흠―― 그럼 선언하겠어」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「『ルネアリゾート結界』、海開きよ～♪」"
translation = "「『루네아 리조트 결계』, 개장이야～♪」"

[[dialogue]]
speaker_original = "４人"
speaker_translation = "4명"
original = "「イェ～イっ♪」"
translation = "「예～이♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「いや～、でもまさか、まだ２月なのに夏の海を楽しめるなんてね～」"
translation = "「이야～, 하지만 설마, 아직 2월인데 여름 바다를 즐길 수 있다니 말이지～」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「私にとっては、夏の海は初めてなので、ワクワクなのです～♪」"
translation = "「저에게는, 여름 바다는 처음이라, 두근두근한 거예요～♪」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「ふふん♪\u3000すごいでしょ～♪」"
translation = "「후훗♪ 대단하지～♪」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「この前、異世界へ行ってきた時に『リゾート結界』を見て気に入っちゃって♪\u3000それを元に、こっちの世界で再現してみたのよ！」"
translation = "「얼마 전에, 이세계에 갔을 때 『리조트 결계』를 보고 마음에 들어버려서♪ 그걸 바탕으로, 이쪽 세계에서 재현해 본 거야!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あはは……さすが女神様、とんでもない力だね～」"
translation = "「아하하…… 역시 여신님, 터무니없는 힘이네～」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「それに、向こうの世界では、リゾート結界を作ったのがたった１人の天使だって聞いたから、女神として負けられないと思ったのよ！」"
translation = "「게다가, 저쪽 세계에서는, 리조트 결계를 만든 게 단 1명의 천사라고 들었으니까, 여신으로서 질 수 없다고 생각한 거야!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ルネアさん、その勝負心わかるわ！」"
translation = "「루네아 씨, 그 승부욕 이해해요!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「それにしても、リアお姉様の水着姿、とっても素敵です<emoji=heart04>」"
translation = "「그나저나, 리아 언니의 수영복 차림, 너무 멋져요<emoji=heart04>」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「えへへ<emoji=heart04>\u3000聖沙ちゃん、ありがと～♪\u3000聖沙ちゃんの水着もすっごく可愛くて素敵だよ<emoji=heart04>」"
translation = "「에헤헤<emoji=heart04> 미사짱, 고마워～♪ 미사짱의 수영복도 엄청 귀엽고 멋져<emoji=heart04>」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「あんっ<emoji=heart04>\u3000お姉様に褒められて、熱さでダウンしちゃいそう<emoji=heart04>」"
translation = "「앙<emoji=heart04> 언니한테 칭찬받아서, 열기 때문에 쓰러질 것 같아요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「早い早い！\u3000まだ海にも入ってないのに！」"
translation = "「빠르다 빨라! 아직 바다에 들어가지도 않았는데!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「それより、早く海に入って遊びたいのです～♪」"
translation = "「그보다, 얼른 바다에 들어가서 놀고 싶은 거예요～♪」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「まだダメよ、ロロット。シンが来るまで待ちなさい！」"
translation = "「아직 안 돼, 로롯. 신이 올 때까지 기다리렴!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「へぇ～、これが『リゾート結界』！\u3000本当に夏の海みたいで、すごいじゃな～い♪」"
translation = "「헤에～, 이게 『리조트 결계』! 정말로 여름 바다 같아서, 대단한걸～♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あっ、お姉ちゃん！」"
translation = "「앗, 언니!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「おはよう、生徒会の諸君！\u3000流星学園の理事長として、視察に来たわよ～♪」"
translation = "「안녕, 학생회 여러분! 유성학원의 이사장으로서, 시찰하러 왔단다～♪」"

[[dialogue]]
speaker = "unk"
original = "彼女は、私立流星学園の理事長『九浄ヘレナ』。"
translation = "그녀는 사립 유성학원의 이사장 『쿠죠 헬레나』."

[[dialogue]]
speaker = "unk"
original = "学園を管理している『九浄家』の現当主で、九浄リアの実の姉でもある。"
translation = "학원을 관리하는 『쿠죠가』의 현 당주이자, 쿠죠 리아의 친언니이기도 하다."

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「と言いつつ、理事長さんも海で遊びたいだけなのでは？」"
translation = "「그렇게 말씀하시지만, 이사장님도 바다에서 놀고 싶으실 뿐 아닌가요?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ♪\u3000ロロットちゃん、仕事を楽しめるように工夫するのが、賢い大人というものよ<emoji=heart04>」"
translation = "「후후♪ 로롯 양, 일을 즐길 수 있도록 연출하는 것이, 영리한 어른이라는 거란다<emoji=heart04>」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「なるほど、これが『<ruby>小魚<rt>こざかな</rt></ruby>が美味しい』ってやつですね～♪」"
translation = "「과연, 이게 『잔물고기가 맛있다』라는 그거군요~♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「えっと……『<ruby>小賢<rt>こざか</rt></ruby>しい』、かな……？」"
translation = "「으음…… 『잔머리가 좋다』, 가 아닐까……?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「あら？\u3000そういえば、シンちゃんは？」"
translation = "「어라? 그러고 보니, 신짱은?」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「あっ、シンなら家に忘れ物をしたらしくて、パッキーと一緒に、ちょっと遅れて来るって言ってました」"
translation = "「아, 신이라면 집에 물건을 두고 온 모양이라, 패키랑 같이 조금 늦게 온다고 했어요」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「でも、もうそろそろ来るとは思いますよ」"
translation = "「하지만, 이제 곧 올 거라고 생각해요」"

[[dialogue]]
speaker = "unk"
original = "ちなみに『シン』こと『咲良シン』は、流星生徒会の生徒会長であり、この世界において『魔王』の力を持つ少年である。"
translation = "참고로 『신』이자 『사쿠라 신』은 유성 학생회의 학생회장이며, 이 세계에서 『마왕』의 힘을 가진 소년이다."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「そういえば、エグザエルさんも見当たらないような……？」"
translation = "「그러고 보니, 엑자엘 씨도 보이지 않는 것 같은데……?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「ああ、エグザエルなら、今日はキャリーケースごと、寮の部屋に放置してきたわ！」"
translation = "「아아, 엑자엘이라면 오늘은 캐리어째로 기숙사 방에 방치해 두고 왔어!」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「あの天使長ったら、隠れて色んな水着を用意して、私たちを勝手に着せ替えようと企んでいたんだもの！」"
translation = "「그 천사장 녀석이 몰래 여러 가지 수영복을 준비해서, 우리한테 숨겨서 입히려고 꾸미고 있었지 뭐야!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「あ～、なるほど……」"
translation = "「아~ 과연……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あはは……ちょっと可哀想な気もするけど……」"
translation = "「아하하…… 조금 불쌍한 기분도 들지만……」"

[[dialogue]]
speaker = "unk"
original = "――と、その時だった。"
translation = "――하고, 바로 그때였다."

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「おや？\u3000これはなんでしょう？」"
translation = "「어라? 이건 뭘까요?」"

[[dialogue]]
speaker = "unk"
original = "ロロットがあるものに気づいて、ルネアの背後を指差した。"
translation = "로롯이 무언가를 알아차리고, 루네아의 배후를 손가락으로 가리켰다."

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「なんかそこに、小さな『穴』みたいなものが空いてませんか？」"
translation = "「어쩐지 저기에 작은 『구멍』 같은 게 뚫려 있지 않나요?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「え？\u3000穴……？」"
translation = "「어? 구멍……?」"

[[dialogue]]
speaker = "unk"
original = "ルネアの背後の空間に、小さい穴が空いていた。"
translation = "루네아의 배후 공간에 작은 구멍이 뚫려 있었다."

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「本当だ。生徒会室からリゾート結界に入る時にくぐった穴の、小さい版みたいな……」"
translation = "「정말이다. 학생회실에서 리조트 결계로 들어올 때 지나온 구멍의 작은 버전 같은……」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「おかしいわね。ついさっきまで、そんなものなかったはずだけど……」"
translation = "「이상하네. 방금 전까지 그런 건 없었을 텐데……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「穴の向こうにも、同じ海が見えているみたい……？」"
translation = "「구멍 건너편에도 같은 바다가 보이는 것 같은데……?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「……嫌な予感がするわ。みんな、少し離れて――」"
translation = "「……불길한 예감이 드는걸. 모두, 조금 떨어져――」"

[[dialogue]]
speaker = "unk"
original = "ヘレナが言いかけた、次の瞬間。"
translation = "헬레나가 말을 마치려던 다음 순간."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「きゃっ！？\u3000急に穴が広がって、吸い込まれ――きゃあぁぁっ！？」"
translation = "「캐앗!? 갑자기 구멍이 넓어져서, 빨려 들――꺄아아아앗!?」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「わわっ！？\u3000何が起こってるのですか！？\u3000何も見えませ～ん！」"
translation = "「와와!? 무슨 일이 일어나고 있는 것인가요!? 아무것도 보이지 않는 것이에요~!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「……あれ？\u3000収まった？」"
translation = "「……어라? 잦아들었나?」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「う、うん……みんな、大丈夫……？」"
translation = "「으, 응…… 모두, 괜찮아……?」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「はい。トントロも特に割れたりはしてませんよ～」"
translation = "「네. 돈토로도 딱히 깨지거나 하진 않았어요~」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ここ、さっきと同じ場所よね……？\u3000一体何が起きたの？」"
translation = "「여기, 아까랑 같은 장소지……? 대체 무슨 일이 일어난 거야?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「私にもわからないわ……リゾート結界は、ちゃんと問題なく再現できてたはずなのに……」"
translation = "「나도 모르겠어…… 리조트 결계는 분명 문제없이 재현되어 있었을 텐데……」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「さっきまであった空間の穴は消えているわね……。その他に、変わった様子はなさそうだけど……」"
translation = "「아까까지 있던 공간의 구멍은 사라졌네……. 그 외에 별다른 이상은 없어 보이지만……」"

[[dialogue]]
speaker = "unk"
original = "と、そこへ小さな影が駆け寄ってくる。"
translation = "그러자, 그곳으로 작은 그림자가 달려온다."

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「――お～いっ！\u3000お前ら、大変だ～～っ！！」"
translation = "「――이~봐! 너희들, 큰일이다~~읏!!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「あっ！\u3000パンダさんなのです！」"
translation = "「앗! 판다 씨인 것입니다!」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「シン様が……！」"
translation = "「신 님이……!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「えっ……！？」"
translation = "「엗……!?」"

[[dialogue]]
speaker = "unk"
original = "――目を覚ますと、そこには見知った４人の姿があった。"
translation = "――눈을 뜨자, 그곳에는 낯익은 4명의 모습이 있었다."

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「あっ、起きた！」"
translation = "「앗, 깨어났다!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「大丈夫？\u3000気分はどう？」"
translation = "「괜찮아? 기분은 어때?」"

[[dialogue]]
speaker = "unk"
original = "それに、リア先輩……？"
translation = "거기다, 리아 선배……?"

[[dialogue]]
speaker = "unk"
original = "あれ……ナナカ？"
translation = "어라…… 나나카?"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「私とトントロもいますよ～」"
translation = "「저랑 돈토로도 있어요~」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「パッキーさんから聞いて、驚いたわ」"
translation = "「패키 씨한테 듣고 놀랐어」"

[[dialogue]]
speaker = "unk"
original = "ロロットに、聖沙も……？"
translation = "로롯에, 미사도……?"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「はぁい♪\u3000それじゃあ、私のことはわかるかしら？」"
translation = "「네에♪ 그럼, 나는 누구인지 알아보겠니?」"

[[dialogue]]
speaker = "unk"
original = "えっと……あなたは？"
translation = "에 그러니까…… 당신은?"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「私は、リアの姉の『九浄ヘレナ』よ♪」"
translation = "「나는 리아의 언니인 『쿠죠 헬레나』란다♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「初めまして――<b>異世界の魔王</b>ちゃん♪」"
translation = "「처음 뵙겠습니다――<b>이세계의 마왕</b>님♪」"

[[dialogue]]
speaker = "unk"
original = "そこで俺――緋宮クロトは、ハッと体を起こした。"
translation = "거기서 나――히노미야 쿠로토는 번뜩 몸을 일으켰다."

[[dialogue]]
speaker = "unk"
original = "どうしてここに……！？"
translation = "어째서 여기에……!?"

[[dialogue]]
speaker = "unk"
original = "流星クルセイダースのみんなが"
translation = "유성 크루세이더즈의 모두가"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「それはこっちの台詞よ！\u3000会長」"
translation = "「그건 내가 할 소리야! 회장」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「そうそう。パッキーが慌てて呼びに来てさ」"
translation = "「맞아 맞아. 패키가 허둥지둥 부르러 와서 말이야」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「突然空間に穴が開いて吸い込まれたと思ったら、一緒にいたはずのシンくんが居なくなってて――」"
translation = "「갑자기 공간에 구멍이 뚫려서 빨려 들어갔다고 생각했더니, 같이 있었을 터인 신 군이 사라져 있어서――」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「その代わりに、会長<b>くん</b>が倒れてたって」"
translation = "「그 대신에, 회장<b>군</b>이 쓰러져 있었다고」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「シン様だと思って起こそうとしたら、異世界の魔王様でビックリしたぜ！」"
translation = "「신 님인 줄 알고 깨우려고 했더니, 이세계의 마왕님이라 깜짝 놀랐다고!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「異世会長さんが、どうしてここにいるのですか？」"
translation = "「이세 회장님이 어째서 여기에 계신 건가요?」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「一体何があったのか、私たちに教えてくれないかな？」"
translation = "「대체 무슨 일이 있었던 건지, 우리에게 가르쳐 주지 않을래?」"

[[dialogue]]
speaker = "unk"
original = "それが、俺にもよくわからなくて……"
translation = "그게, 나도 잘 몰라서……"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「――あっ、会長～！」"
translation = "「――앗, 회장~!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「あっ！\u3000あれは……マトイさんなのです！\u3000お～い♪」"
translation = "「앗! 저건…… 마토이 씨인 것입니다! 어~이♪」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「えっ、ロロットちゃん！？\u3000それに……流星クルセイダースのみんなも！？」"
translation = "「에, 로롯짱!? 게다가…… 유성 쿠루세이더스 모두도!?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「マトイも来ていたのね」"
translation = "「마토이도 와 있었구나」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「ルネアさん！？\u3000どうして異世界のみんながここに……！？」"
translation = "「루네아 씨!? 어째서 이세계의 모두가 여기에……!?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「私にもわからないわ。でも、何かの事故が起こって――」"
translation = "「나도 모르겠어. 하지만, 무슨 사고가 일어나서――」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「どうやら、あなたたちの世界と私たちの世界が、また繋がってしまったみたいね」"
translation = "「아무래도 너희들의 세계와 우리의 세계가 다시 이어져 버린 모양이네」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「マトイの他にも、誰か来ているのかしら？」"
translation = "「마토이 말고도, 누군가 와 있는 걸까?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「はい。私ともう１人――」"
translation = "「네. 저랑 또 한 명――」"

[[dialogue]]
speaker = "unk"
original = "マトイはそう言って、後ろを振り返る。"
translation = "마토이는 그렇게 말하며, 뒤를 돌아본다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「――マトイよ。他の者たちは見つかったのか？」"
translation = "「――마토이여. 다른 자들은 찾았느냐?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「おや？\u3000これは――」"
translation = "「어라? 이건――」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ん？\u3000あなたは――」"
translation = "「응? 당신은――」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そなた……もしかして、異世界の『九浄ヘレナ』か？」"
translation = "「그대…… 혹시, 이세계의 『쿠죠 헬레나』인가?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そういうあなたも……『九浄ヘレナ』だったりする？」"
translation = "「그렇게 말하는 당신도…… 『쿠죠 헬레나』라든가?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「……なるほど。そういうことか――」"
translation = "「……과연. 그런 건가――」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「初めましてであるな、異世界の私よ」"
translation = "「처음 뵙겠네, 이세계의 나여」"

[[dialogue]]
speaker = "unk"
original = "こうして、２つの世界は再び、リゾート結界で交わることになるのだった。"
translation = "이렇게 해서, 두 세계는 다시 리조트 결계에서 교차하게 되는 것이었다."

