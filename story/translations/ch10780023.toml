[[dialogue]]
speaker = "unk"
original = "第３話,癒し系カノジョ,P"
translation = "제3화, 치유계 여친, P"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あっ、魔王様！\u3000ようやく見つけました♪\u3000よかったら午後のお茶でも、一緒に──」"
translation = "「앗, 마왕님! 드디어 찾았습니다♪ 괜찮으시다면 오후 차라도, 함께──」"

[[dialogue]]
speaker = "unk"
original = "すみません、星徒会の仕事中でして！"
translation = "죄송해요, 성도회 일 중이라서요!"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あ……そ、そうでしたか。申し訳ございません、お忙しいところを呼び止めてしまって……」"
translation = "「아…… 그러, 그러셨나요. 죄송합니다, 바쁘신 와중에 불러세워 버려서……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふむふむ……？\u3000薙刀部とスポーツチャンバラ部が、練習場所を取り合って大騒ぎ……？」"
translation = "「흠흠……? 치도부와 스포츠 찬바라부가, 연습 장소를 두고 다투느라 대소동……?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「た、大変なのですね。星徒会はそのような場合の仲裁にもお出かけするのですか」"
translation = "「크, 큰일이군요. 성도회는 그럴 때 중재하러 나가기도 하나요?」"

[[dialogue]]
speaker = "unk"
original = "お茶はまたの機会に！"
translation = "차는 다음에 마셔요!"

[[dialogue]]
speaker = "unk"
original = "早く止めないと学園の施設が……！"
translation = "빨리 말리지 않으면 학원 시설이……!"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ああ……魔王様。あっという間に見えなくなってしまいました……」"
translation = "「아아…… 마왕님. 순식간에 보이지 않게 되어버렸습니다……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「珍しい茶葉が手に入ったから、味わっていただきたかったのですが……またの機会ですね──」"
translation = "「희귀한 찻잎을 구해서, 맛 보여드리고 싶었습니다만…… 다음 기회네요──」"

[[dialogue]]
speaker = "unk"
original = "──数日後。"
translation = "──며칠 후."

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「魔王様、お疲れ様です♪\u3000本日のご予定はいかがでしょう？\u3000よろしければ──」"
translation = "「마왕님, 수고하셨습니다♪ 오늘 일정은 어떠신가요? 괜찮으시다면──」"

[[dialogue]]
speaker = "unk"
original = "すみません。今日も仕事が……！"
translation = "죄송해요. 오늘도 일이……!"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あ──またタイミングが悪かったようですね……」"
translation = "「아──또 타이밍이 나빴던 모양이네요……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふむふむ……？\u3000騎馬戦部と人間ピラミッド部が、どちらがより高くヒトを積み上げられるかで競っている……？」"
translation = "「흠흠……? 기마전부와 인간 피라미드부가, 어느 쪽이 더 높게 사람을 쌓을 수 있는지 겨루고 있다……?」"

[[dialogue]]
speaker = "unk"
original = "急いで止めに行かないと……！！"
translation = "서둘러 말리러 가지 않으면……!!"

[[dialogue]]
speaker = "unk"
original = "すでに校舎より高いらしくて……！"
translation = "벌써 교사보다 높다던데요……!"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ご、ご苦労様です。いってらっしゃいませ……」"
translation = "「수, 수고가 많으십니다. 다녀오세요……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「……しょんぼりです。魔王様とまた予定が合いませんでした……」"
translation = "「……시무룩입니다. 마왕님과 또 일정이 맞지 않았어요……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「知ってはいましたが、やはり星徒会長は激務なのですね……魔王様、お身体を壊さなければよいのですが……」"
translation = "「알고는 있었지만, 역시 성도회장은 격무군요…… 마왕님, 몸을 상하지 않으셔야 할 텐데……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「それにせっかくお付き合いしているというのに、恋人の時間もなかなか作れていません……」"
translation = "「게다가 어렵게 사귀고 있는데도, 연인과의 시간도 좀처럼 내지 못하고 있습니다……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「い、いえ！\u3000落ち込んでいる場合ではありませんっ。こんな時だからこそ、彼女の私が！\u3000お癒やししなくては──！！」"
translation = "「아, 아니요! 낙담하고 있을 때가 아닙니다. 이럴 때일수록, 여자친구인 제가! 치유해 드려야──!!」"

[[dialogue]]
speaker = "unk"
original = "……今日もトリュファイナさんとの時間が取れなかった。そして、目の前には書類の山。どうして人生とは、こうもままならないのか。"
translation = "……오늘도 트리파이나 씨와의 시간을 내지 못했다. 그리고, 눈앞에는 서류 산 더미. 어째서 인생이란, 이렇게 마음대로 되지 않는 걸까."

[[dialogue]]
speaker = "unk"
original = "お腹も減った……"
translation = "배도 고프다……"

[[dialogue]]
speaker = "unk"
original = "クタクタだ……"
translation = "녹초가 됐다……"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「──貴方の苦労をずっと見ていましたよ。本当によく頑張りましたね？」"
translation = "「──당신의 고생을 계속 보고 있었답니다. 정말 고생 많으셨어요?」"

[[dialogue]]
speaker = "unk"
original = "頭の中に声が直接……！？"
translation = "머릿속에 목소리가 직접……!?"

[[dialogue]]
speaker = "unk"
original = "──なんだ！？"
translation = "──뭐지!?"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「遂にその我慢は報われ、莫大な癒やしを得ます──♪」"
translation = "「드디어 그 인내는 보상받고, 막대한 치유를 얻습니다──♪」"

[[dialogue]]
speaker = "unk"
original = "トリュファイナさん、どうして……！？"
translation = "트리파이나 씨, 어째서……!?"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふふ、お仕事で大忙しの魔王様を労うために。お癒やしに参ったのです♪」"
translation = "「후후, 일로 너무 바쁘신 마왕님을 위로해 드리기 위해. 치유해 드리러 왔답니다♪」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「いかがでしたか、今の登場の仕方は♪\u3000先日、動画サイトで拝見した、黄金のライオン様のものを参考にしてみたのですが！」"
translation = "「어떠셨나요, 방금 전 등장 방식은♪ 요전에, 동영상 사이트에서 본, 황금 사자님의 것을 참고해 본 것입니다만!」"

[[dialogue]]
speaker = "unk"
original = "か、回復魔法、ありがとうございます！"
translation = "회, 회복 마법, 감사합니다!"

[[dialogue]]
speaker = "unk"
original = "（悪いインターネッツに毒されてる……！）"
translation = "(나쁜 인터넷에 물들었어……!)"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふふ、お癒やしは魔法だけにあらず。お夜食のケーキに、淹れたての紅茶もポットで持参しております♪」"
translation = "「후후, 치유는 마법뿐만이 아니죠. 야식으로 먹을 케이크에, 갓 우려낸 홍차도 포트에 챙겨 왔답니다♪」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「お仕事の励みになればと思いまして、あの、和風バニーの衣装も着てまいりました。以前、可愛いと仰っていただけたので……」"
translation = "「일하시는 데 힘이 되었으면 해서, 저기, 일본풍 바니 의상도 입고 왔어요. 예전에, 귀엽다고 말씀해 주셨어서……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ここのところ大変かと存じますが、ふぁいとですよ魔王様！\u3000ぴょーん、ぴょんっ<emoji=heart04>」"
translation = "「요즘 힘들어서 걱정입니다만, 파이팅이에요 마왕님! 깡~총, 깡총<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "疲れが吹っ飛びました！"
translation = "피로가 날아갔습니다!"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふふ、喜んでいただけて何よりです♪」"
translation = "「후후, 기뻐해 주시니 무엇보다 다행이에요♪」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ですが、あまり根を詰めても捗らないのでは？\u3000このあたりで小休止、いかがでしょう？」"
translation = "「하지만, 너무 몰두해도 진척이 없지 않을까요? 이쯤에서 잠시 휴식, 어떠신가요?」"

[[dialogue]]
speaker = "unk"
original = "そうですね。ちょっと休憩します"
translation = "그렇네요. 잠시 쉴게요."

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はい♪\u3000ではでは、まず紅茶からどうぞ！」"
translation = "「네♪ 그럼 그럼, 우선 홍차부터 드세요!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「お疲れでしょうから、少し甘めの味付けにしております。リラックスできると思いますよ」"
translation = "「피곤하실 테니, 조금 달콤하게 맛을 냈답니다. 리프레시할 수 있을 거예요.」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あ、お好みで木苺のジャムもどうぞ。ふふふ、私が手作りした自信作です♪」"
translation = "「아, 취향에 따라 산딸기 잼도 넣으세요. 후후후, 제가 직접 만든 자신작이랍니다♪」"

[[dialogue]]
speaker = "unk"
original = "恋人の手作りと思うと格別です"
translation = "연인이 직접 만든 거라 생각하니 특별하네요."

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あ……<emoji=heart04>\u3000そ、そう言っていただけると、頑張った甲斐があります……<emoji=heart04>」"
translation = "「아……<emoji=heart04> 그렇게 말씀해 주시니, 노력한 보람이 있네요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「そうです、こちらのケーキも！\u3000給食委員会の方々に習ったので、味は確かですよ！」"
translation = "「맞다, 이쪽 케이크도요! 급식위원회 분들에게 배웠으니, 맛은 확실해요!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「お菓子作りは奥が深く、なかなか大変でした……ちょっと手順を誤るだけで、出来栄えがすごく変わってしまって……」"
translation = "「과자 만들기는 심오해서, 자못 힘들었답니다…… 조금 순서를 틀리는 것만으로도, 완성도가 굉장히 달라져 버려서……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ですが、ようやく納得できるものができました。お試しくださいませ<emoji=heart04>」"
translation = "「하지만, 드디어 납득할 수 있는 것이 완성되었습니다. 맛보아 주세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "わざわざ時間を作って会いに来てくれて、心を尽くした差し入れをしてくれるトリュファイナさん。"
translation = "일부러 시간을 내서 만나러 와주고, 정성을 다한 간식을 챙겨주는 트리파이나 씨."

[[dialogue]]
speaker = "unk"
original = "俺なんかにはもったいない恋人への感謝を抱くとともに、近いうちに必ずデートの時間を取ろうと心に決めるのだった──"
translation = "나 따위에겐 과분한 연인에게 감사함을 느끼는 동시에, 조만간 반드시 데이트 시간을 내겠다고 마음속으로 다짐하는 것이었다──"

