[[dialogue]]
speaker = "unk"
original = "第３話,光速ラビットイーツ,P"
translation = "제3화, 광속 라빗 이츠, P"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「購買部のお手伝い……ですか？\u3000当主様」"
translation = "「매점 일을 돕는 것…… 인가요? 당주님」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむ。何やらキャンペーンを銘打っており、それが大当たりしているらしいのだ」"
translation = "「음. 무언가 캠페인을 내걸었는데, 그게 대박이 난 모양이다」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「盛況なのは結構だが、人手が足りず困っているとの報せが入ってな」"
translation = "「성황인 것은 좋지만, 일손이 부족해 난처하다는 소식이 들어와서 말이지」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「なるほど！\u3000購買部の方々には、会長救出作戦の折、多大な助力をいただきました……その恩返しということですね！」"
translation = "「그렇군요! 매점 분들에게는, 회장 구출 작전 때 커다란 도움을 받았습니다…… 그 은혜를 갚는다는 거군요!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむ。行ってもらえるか、蘭美よ？」"
translation = "「음. 가주겠나, 라비여?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「問題ありません！\u3000人手不足であれば、スピードに自信のある私が向かうのが適任でしょう。光速で向かいます！」"
translation = "「문제없습니다! 일손 부족이라면, 스피드에 자신 있는 제가 가는 것이 적임이겠지요. 광속으로 가겠습니다!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむうむ♪\u3000励むのだぞ、蘭美！」"
translation = "「음음♪ 힘내도록 해라, 라비!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「九浄家メイド隊、メイド長の羽宮蘭美、現場に到着よ！」"
translation = "「쿠죠가 메이드대, 메이드장의 하네미야 라비, 현장에 도착이야!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「シュティレ！\u3000トリュファイナ様！\u3000なんでも人手が足りないとか──」"
translation = "「슈틸레! 트리파이나 님! 아무래도 일손이 부족하다던가──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「頼りになる応援の到着、感謝の極み」"
translation = "「든든한 지원의 도착, 감사하기 그지없음」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ああっ、蘭美様！\u3000お待ちしておりました！！」"
translation = "「아앗, 라비 님! 기다리고 있었습니다!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「…………帰っていいかしら？」"
translation = "「…………돌아가도 될까?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「そ、そんなご無体な……！\u3000私たちではとても回しきれないのです、お手伝いください！」"
translation = "「그, 그런 너무한 말씀을……! 저희로서는 도저히 감당할 수 없습니다, 도와주세요!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「嫌な予感しかしないわ！！\u3000でも、とりあえず詳しく話を聞かせなさい？」"
translation = "「싫은 예감밖에 안 들어!! 하지만, 일단 자세한 이야기를 들려줄래?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。現在購買部では、光の魔女様の揚げたてフライドチキン、激安セールを実施中です」"
translation = "「네. 현재 매점에서는, 빛의 마녀 님의 갓 튀긴 프라이드치킨, 초특가 세일을 실시 중입니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「さらに学園内であれば、どこでもすぐに熱々チキンをデリバリーすると約束しておりまして……」"
translation = "「게다가 학원 내라면, 어디든 즉시 따끈따끈한 치킨을 배달해 드린다고 약속해서……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「予想をはるかに超える注文が来てしまい、デリバリーが間に合わないのです！」"
translation = "「예상을 훨씬 뛰어넘는 주문이 들어와, 배달이 늦어지고 있습니다!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「それでスピード自慢の私に、ということなのね……まあ、配達するだけなら問題なさそうね！」"
translation = "「그래서 스피드가 장기인 나에게, 라는 거구나…… 뭐, 배달만 하는 거라면 문제없겠네!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "（そもそも当主様からの命令だし、断ることはできないわ……！）"
translation = "（애초에 당주님의 명령이고, 거절할 수는 없어……!）"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「承知したわ！\u3000光速で配達してあげるから、チキンを渡しなさい！」"
translation = "「알았어! 광속으로 배달해 줄 테니, 치킨을 넘기렴!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……その格好のまま配達するおつもりですか？」"
translation = "「……그 복장 그대로 배달할 셈입니까?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「申し訳ございませんが、お着替えをお願いしてもいいでしょうか？\u3000バニーガールが配達する、というのがセールの主旨でして……」"
translation = "「죄송합니다만, 옷을 갈아입어 주실 수 있으신가요? 바니걸이 배달한다, 라는 것이 세일의 취지라서……」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「なんでそんなおかしなこだわりを付けてるぴょん！？」"
translation = "「왜 그런 이상한 고집을 붙인 거용!?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「マスターのアイデアです。せっかく人目を惹くバニー衣装を手に入れたのだから、それをしっかり取り入れて大稼ぎだ、と」"
translation = "「마스터의 아이디어입니다. 모처럼 눈길을 끄는 바니 의상을 얻었으니, 그걸 제대로 활용해서 크게 한천 벌자고」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「…………何てひどいセールなの」"
translation = "「…………얼마나 지독한 세일이야」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「配達する際は、語尾に『ぴょん♪』を付けるご挨拶も、必ずお願いいたします……！」"
translation = "「배달할 때는, 어미에 『용♪』을 붙이는 인사도, 반드시 부탁드립니다……!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「くぅうう……！\u3000いいわ、やるわ！\u3000一度請け負った以上は、やり遂げてみせるんだからっ！！」"
translation = "「크으으……! 좋아, 하겠어! 한 번 맡은 이상은, 완수해 보일 테니까!!」"

[[dialogue]]
speaker = "unk"
original = "そうして、蘭美は学園中を駆け回る──"
translation = "그렇게, 라비는 학원 안을 뛰어다닌다──"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「お待たせいたしましたっ♪\u3000購買部からチキンのデリバリーだぴょんっ♪\u3000ぴょーん、ぴょんっ♪」"
translation = "「기다리셨습니다♪ 매점에서 치킨 배달이다용♪ 용, 용♪」"

[[dialogue]]
speaker_original = "新星学園の生徒１"
speaker_translation = "新星学園の生徒１"
original = "「ほ、本当に来たっ！\u3000美少女バニーが宅配してくれた……！\u3000購買部、すげぇ！！」"
translation = "「진, 진짜로 왔다! 미소녀 바니가 배달해 줬어……! 매점, 대박이다!!」"

[[dialogue]]
speaker_original = "新星学園の生徒２"
speaker_translation = "新星学園の生徒２"
original = "「あ、あの！\u3000セールっていつまでっすか！？」"
translation = "「저, 저기! 세일은 언제까지임까!?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「今週末までの限定セールだぴょんっ♪\u3000ご贔屓くださいぴょんっ♪」"
translation = "「이번 주말까지 한정 세일이다용♪ 자주 찾아주세용♪」"

[[dialogue]]
speaker_original = "新星学園の生徒１"
speaker_translation = "新星学園の生徒１"
original = "「俺、今日から毎日チキン食うわ」"
translation = "「나, 오늘부터 매일 치킨 먹을래」"

[[dialogue]]
speaker_original = "新星学園の生徒２"
speaker_translation = "新星学園の生徒２"
original = "「お、俺も！！\u3000小遣い全部使う！！」"
translation = "「나, 나도!! 용돈 전부 쓸 거야!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "（うぅうぅぅう！！！\u3000つ、次よ、次っ……！！）"
translation = "（으으으으!!! 다음, 다음이야……!!）"

[[dialogue]]
speaker = "unk"
original = "そうして蘭美は、新星学園だけでなく、流星学園の方にも迅速に宅配を行い、行く先々でしっかりぴょんぴょんし──"
translation = "그렇게 라비는, 신성학원뿐만 아니라, 유성학원 쪽에도 신속하게 배달을 실시하여, 가는 곳마다 확실하게 깡총거리고──"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「流石は光速メイドスター……高機動試験型ギガンドムにも勝るスピード。感服いたしました」"
translation = "「역시나 광속 메이드 스타…… 고기동 시험형 기간돔도 능가하는 스피드. 감복했습니다」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぜぇ、ぜぇ……！」"
translation = "「하아, 하아……!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「流石にお疲れが見えているようですね……」"
translation = "「역시 지친 기색이 보이는군요……」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ロストアイテムとの戦闘の方がはるかに楽だわ……つ、次の配達は？」"
translation = "「로스트 아이템과의 전투가 훨씬 편해…… 다음, 다음 배달은?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「次が本日のラストです。お願いいたします」"
translation = "「다음이 오늘의 마지막입니다. 부탁드립니다」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「…………え、ここって──」"
translation = "「…………어, 여기는──」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「なんでも今、購買部でフライドチキンのセールをしておるようだぞ、魔王♪」"
translation = "「아무래도 지금, 매점에서 프라이드치킨 세일을 하고 있는 모양이다, 마왕♪」"

[[dialogue]]
speaker = "unk"
original = "お買い得なのはありがたいですね"
translation = "싸게 사는 건 감사한 일이죠"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむうむ♪\u3000ＤＩＳＣからタップ１つでデリバリーしてくれるらしい。どうだ、１つ頼んでみぬか？\u3000ご馳走してやろう」"
translation = "「음음♪ DISC에서 터치 한 번으로 배달해 준다는구나. 어떠냐, 하나 시켜보지 않겠느냐? 쏘도록 하지」"

[[dialogue]]
speaker = "unk"
original = "いいんですか！\u3000ありがとうございます"
translation = "그래도 돼요! 감사합니다"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむ。では──注文、と」"
translation = "「음. 그럼── 주문, 완료」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「さて、後は待つだけ……」"
translation = "「자, 이제 기다리기만……」"

[[dialogue]]
speaker = "unk"
original = "──はっや！？！？！？"
translation = "──빠르읏!?!?!? Component"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「凄まじいスピードであるな、流石だ！」"
translation = "「무시무시한 스피드로군, 역시다!」"

[[dialogue]]
speaker = "unk"
original = "どうぞ～"
translation = "여기요~"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ぴょ、ぴょーんぴょんっ<emoji=heart04>\u3000お仕事がんばってる会長に、フライドチキンのデリバリーだぴょーんっ<emoji=heart04>」"
translation = "「용, 용용<emoji=heart04> 열심히 일하는 회장에게, 프라이드치킨 배달이다용<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "蘭美！？\u3000えっ、なんでバニー！？！？"
translation = "라비!? 어, 왜 바니!?!?"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はぁ！？\u3000言うに事欠いて、何よそのリアクション！？\u3000貴方が頼んだんでしょう！\u3000えっち！！！！」"
translation = "「하아!? 할 말이 없어서, 뭐야 그 리액션은!? 당신이 시켰잖아! 야해!!!!」"

[[dialogue]]
speaker = "unk"
original = "ええぇぇええ！？"
translation = "에에에에에!? "

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あのね会長！\u3000いくら私のバニー衣装が見たいからって、こういう無駄遣いはやめなさい！」"
translation = "「저기 말야 회장! 아무리 내 바니 의상이 보고 싶다고 해도, 이런 낭비는 하지 마!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そ、そもそもお金なんて払わなくても、会長の頼みだったらやってあげるのに……！！」"
translation = "「애, 애초에 돈 같은 거 안 내도, 회장의 부탁이라면 해줄 텐데……!!」"

[[dialogue]]
speaker = "unk"
original = "あれ──いない！？！？"
translation = "어라── 없어!?!?"

[[dialogue]]
speaker = "unk"
original = "いや、これはヘレナちゃんが──"
translation = "아니, 이건 헬레나 찬이──"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「どうして当主様が出てくるのよ……！\u3000そこに直りなさい、お説教よ！！」"
translation = "「어째서 당주님이 나오는 거야……! 거기 똑바로 서, 설교야!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「将来のお嫁さんとして──夫の無駄遣いは見過ごせないぴょんっ！！」"
translation = "「장래의 색시로서── 남편의 낭비는 눈감아줄 수 없다용!!」"

[[dialogue]]
speaker = "unk"
original = "その後、なんとか蘭美の誤解は解けた（当主様ならそういうイタズラをしそうだ、と納得してもらえた）。"
translation = "그 후, 어떻게든 라비의 오해는 풀렸다 (당주님이라면 그런 장난을 칠 법하다며 납득해 주었다)."

[[dialogue]]
speaker = "unk"
original = "しかし……そうか。蘭美がバニーガールでデリバリーしてくれるのか。明日も頼んじゃおうかな──"
translation = "하지만…… 그렇구나. 라비가 바니걸로 배달을 해주는 건가. 내일도 시켜볼까──"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「……まだお説教が足りないかしら？」"
translation = "「……아직 설교가 부족한 걸까?」"

[[dialogue]]
speaker = "unk"
original = "ちらと浮かんだだけの思考すら見透かされる──俺のお嫁さんの観察眼はすごいなあと思うのだった……"
translation = "스쳐 지나갔을 뿐인 생각조차 꿰뚫어 본다── 내 색시의 관찰력은 대단하구나 하고 생각하는 것이었다……"

