[[dialogue]]
speaker = "unk"
original = "第８話,『友達の作り方』,B"
translation = "제8화, 『친구를 만드는 방법』"

[[dialogue]]
speaker = "unk"
original = "学園生活が始まって数日が経過した。"
translation = "학원 생활이 시작되고 며칠이 지났다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「セシア、ルヴィネ様の様子はどうだろうか？」"
translation = "「세시아, 루비네 님의 상태는 어떨까?」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「クラスのみんなとも打ち解けて、とても上手くやっているわ」"
translation = "「반 아이들과도 친해져서 아주 잘해 나가고 있어」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「そうか。少々心配していたのだが、杞憂であったようだな」"
translation = "「그런가. 조금 걱정했었는데 기우였던 모양이군」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ああ見えて彼女、バイト経験が豊富だからさー。なんだかんだ、上手くはやるよ」"
translation = "「보아하니 그녀, 알바 경험이 풍부하니까 말이지~. 이러니저러니 해도 잘해 낼 거야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボク的にはどっちかっていうと、オオヒメの方が心配なんだけど？」"
translation = "「내 입장에서는 어느 쪽인가 하면, 오오히메 쪽이 더 걱정인데?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「私も問題ない。ナミエルという友人も出来たからな」"
translation = "「나도 문제없다. 나미엘이라는 친구도 생겼으니까」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「胸を張れる状態なのか？\u3000友人が出来たといってもナミエルだけであろう？」"
translation = "「가슴을 펼 만한 상태인가? 친구가 생겼다고 해도 나미엘뿐이지 않은가?」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ナミエルさま以外のヒトとは、まだ交流らしい交流が出来ていませんものね……」"
translation = "「나미엘 님 이외의 사람과는 아직 교류다운 교류를 하지 못하셨으니까요……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ぅ……じ、実はそうなのだ……」"
translation = "「으…… 시, 실은 그렇다……」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「何をやっているのかしら。あなただって別に、ヒトとの交流が苦手だということはないでしょう？」"
translation = "「무얼 하고 있는 거니. 너도 딱히 사람과의 교류가 서툰 것은 아니잖아?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「そうなのだが、実は──」"
translation = "「그렇기는 하다만, 실은──」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、初手で大失敗しちゃったんだー」"
translation = "「아하하, 첫 단추부터 대실패해 버렸거든~」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「うむ……。そういった事情もあって、なかなか自分から声をかけに行けなくなってしまったのだ」"
translation = "「음…… 그런 사정도 있어서, 좀처럼 먼저 말을 걸러 가지 못하게 되어 버렸다」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「一度の失敗が何だというの？\u3000気にしないで話しかけてみればいいのよ！」"
translation = "「한 번의 실패가 어쨌다는 거니? 신경 쓰지 말고 말을 걸어 보면 되잖아!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうそう。でないとせっかく学園生活を送ってる意味がないでしょ？」"
translation = "「그래그래. 안 그러면 어렵사리 학원 생활을 보내고 있는 의미가 없잖아?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「そんなことは自分でもわかっている！\u3000わかっているのだが、時間が経てば経つほどハードルが高くなってしまって……」"
translation = "「그런 건 나도 알고 있다! 알고는 있지만, 시간이 지나면 지날수록 장벽이 높아져 버려서……」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「だったら猶更、急がなければいけないわ！」"
translation = "「그러면 더욱더 서둘러야만 해!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「うむ、そうだな！\u3000やはりこのままではいけない、気持ちを入れ替えて明日こそは頑張ってみよう！」"
translation = "「음, 그렇군! 역시 이대로는 안 된다, 마음을 고쳐먹고 내일이야말로 힘내 보마!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「頑張ってね、オオヒメ♪」"
translation = "「힘내, 오오히메♪」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ありがとう。ラクシャ、セシア！！」"
translation = "「고맙다. 락샤, 세시아!!」"

[[dialogue]]
speaker = "unk"
original = "翌朝──"
translation = "다음 날 아침──"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「よし、行くとしよう！」"
translation = "「좋아, 가도록 할까!」"

[[dialogue]]
speaker = "unk"
original = "心の中で決意を固めて、オオヒメは１歩を踏み出した。"
translation = "마음속으로 결의를 다지며, 오오히메는 한 걸음을 내딛었다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「コホン。ああ、そこの……あなた」"
translation = "「크흠. 아아, 거기…… 당신」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「えっ、私？\u3000どうしたんですか、オオヒメさん？」"
translation = "「에, 저요? 무슨 일이세요, 오오히메 씨?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「あなたは今日、日直であったな。私に手伝えることがあれば、何でも言って欲しいのだが」"
translation = "「당신은 오늘 당번이었지. 내가 도와줄 수 있는 일이 있다면 뭐든 말해 주었으면 하는데」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「え？\u3000えっと……大丈夫ですよ。ありがとうございます」"
translation = "「네? 어…… 괜찮아요. 감사합니다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そ、そうか……」"
translation = "「그, 그렇가……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「もしや私が守護天使だから遠慮しているのだろうか？\u3000もしそうなのであれば気遣いは必要ないぞ？」"
translation = "「혹시 내가 수호천사라서 사리고 있는 것일까? 만약 그렇다면 신경 쓸 필요는 없다만?」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「あ～……ええと……」"
translation = "「아～…… 저기……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ヒメさん……それは……」"
translation = "「히메 씨…… 그건……」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「ナミエル、気持ちは分かりますが、ここは我慢しましょう」"
translation = "「나미엘, 마음은 알겠지만 여긴 참기로 해요」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「はい……」"
translation = "「네……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「黒板は私が綺麗にしておこう。その間、あなたは休んでいるといい」"
translation = "「칠판은 내가 깨끗하게 해 두지. 그동안 당신은 쉬고 있으면 된다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「なに、学園生活の浅い私だが、その程度のことなら出来る。だから──」"
translation = "「무얼, 학원 생활이 일천한 나지만, 그 정도 일이라면 할 수 있다. 그러니까──」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「あの、本当に大丈夫ですから」"
translation = "「저기, 정말로 괜찮으니까요」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「オオヒメさんが守護天使だから遠慮してるとかじゃなくて、日直の仕事は日直の仕事なんで。それって私がやらなきゃ意味がないですよね？」"
translation = "「오오히메 씨가 수호천사라서 사리는 게 아니라, 당번 일은 당번 일이니까요. 그건 제가 하지 않으면 의미가 없잖아요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ぅ……至極もっともだ……すまなかった……」"
translation = "「윽…… 지극히 지당하다…… 미안했구나……」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「えー、そんなに落ち込まなくても」"
translation = "「에-, 그렇게 침울해하지 않아도」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「……あの、守護天使様にこんなこと言うの、すごく失礼だって思うんですけど」"
translation = "「……저기, 수호천사님한테 이런 말 하는 거 엄청 실례라고 생각하는데요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ん？\u3000なんだろうか……」"
translation = "「응? 무얼까……」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「オオヒメさんって……もしかして、天然なんですか？」"
translation = "「오오히메 씨는…… 혹시, 천연이신가요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「な……！？」"
translation = "「뭣……!?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「あ、あなたにもそのように映るのだろうか？\u3000昨日もそう言われてしまったのだが……」"
translation = "「아, 당신에게도 그렇게 비치는 것인가? 어제도 그런 말을 들어 버렸다만……」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「だって、ふふっ♪」"
translation = "「그야, 후후♪」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「ママダレナやアルモたんもだけど、守護天使って面白い方ばかりなんですね」"
translation = "「막달레나나 알모탄도 그렇고, 수호천사는 재미있는 분들뿐이네요」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「皆さんにお会いするまでは、守護天使様って雲の上の存在だって思ってたんだけど、そんなことないんだな～って」"
translation = "「여러분과 만나기 전까지는, 수호천사님이란 구름 위의 존재라고 생각했는데, 그렇지도 않네～ 싶어서요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「う、む……複雑な気持ちではあるが……親しみを持ってもらえるのは嬉しい事だな……」"
translation = "「으, 음…… 복잡한 기분이기는 하다만…… 친근감을 가져 주는 것은 기쁜 일이구나……」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「ナミエルちゃんはオオヒメさんのことを『ヒメさん』って呼んでますよね？\u3000私もこれからそう呼んでいいですか？」"
translation = "「나미엘짱은 오오히메 씨를 『히메 씨』라고 부르고 있죠? 저도 앞으로 그렇게 불러도 될까요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「あ……ああ、ああ！\u3000もちろん、構わないとも！！」"
translation = "「아…… 아아, 아아! 물론, 상관없고말고!!」"

[[dialogue]]
speaker_original = "クラスメイト女子"
speaker_translation = "클래스메이트 여학생"
original = "「それじゃこれからもよろしくね、ヒメちゃん♪」"
translation = "「그럼 앞으로도 잘 부탁해, 히메짱♪」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「どうやら上手くいったみたいなのだ！」"
translation = "「어아무래도 잘된 모양인 것이다!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ええ、そのようですね……」"
translation = "「네, 그런 것 같네요……」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「安心しましたか？」"
translation = "「안심했나요?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「はい。とはいえ、一挙手一投足が危なっかしくて、見ていられないのですが……」"
translation = "「네. 그렇다곤 해도, 일거수일투족이 위태위태해서 차마 보고 있을 수가 없지만요……」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「おかえりなのだ！」"
translation = "「어서 오는 것이다!」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「よく頑張りましたね♪」"
translation = "「정말 수고했어요♪」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ふぅ……あれで、良かったのだろうか？\u3000何だか全く上手くいった感が無いのだが……」"
translation = "「후우…… 그걸로 괜찮았던 것일까? 어쩐지 전혀 잘되었다는 느낌이 없다만……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「成功か失敗かで言えば成功ということでいいのではないでしょうか？」"
translation = "「성공인지 실패인지로 치자면 성공이라고 해도 되지 않을까요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そ、そうか？\u3000ナミエル殿に太鼓判を押してもらえるなら私も安心できるのだが」"
translation = "「그, 그런가? 나미엘 공이 보증을 서 준다면 나도 안심할 수 있겠다만」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「いえ、太鼓判なんて押してませんけど？」"
translation = "「아뇨, 보증 같은 거 안 섰는데요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「な……！？」"
translation = "「뭣……!?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「いろいろ間違いすぎてて、見ていて心配しかありませんでした」"
translation = "「이것저것 너무 틀려서, 보고 있자니 걱정밖에 안 됐습니다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そ、そんなに駄目だっただろうか……」"
translation = "「그, 그렇게 안 좋았던 것일까……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「赤点は確実かと思われます」"
translation = "「낙제점은 확실하다고 생각됩니다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「き、厳しい……ナミエル殿、今日は何だかいつもより辛口ではないか？」"
translation = "「엄, 엄격하구나…… 나미엘 공, 오늘은 어째서인지 평소보다 매섭지 않은가?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「点数がつけられない、と言わないだけ甘口と思って欲しいです」"
translation = "「점수를 매길 수 없다, 고 말하지 않는 것만으로도 봐주고 있다고 생각해 주셨으면 해요」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「その評価にはアルモたんも同意なのだ」"
translation = "「그 평가에는 알모탄도 동의하는 것이다」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「ずっとハラハラしながら見ていましたものね」"
translation = "「내내 조마조마해하면서 보고 있었으니까요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「うぅう……そうだな。自分でも空回ってしまったという自覚はある」"
translation = "「으으응…… 그렇구나. 스스로도 헛돌아 버렸다는 자각은 있다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「もっと気負わず、自然体で言葉を交わせるようになればよいのだと、わかってはいるのだが……」"
translation = "「너무 부담 가지지 않고, 자연스럽게 대화를 나눌 수 있게 되면 좋은 것이라고 알고는 있다만……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ヒメさんはもう、このままでいい気がしてきました」"
translation = "「히메 씨는 이제, 이대로도 괜찮다는 생각이 들기 시작했어요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そんな！\u3000匙を投げないでくれ！\u3000ナミエル殿に見限られたら、私の学園生活は真っ暗だ！」"
translation = "「그런! 포기하지 말아 다오! 나미엘 공에게 버림받는다면 내 학원 생활은 캄캄하다!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「しませんよ、見捨てるなんて」"
translation = "「안 해요, 저버린다니」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「本当だろうか？\u3000あまりにも不器用な私に愛想が尽きてしまったりしないか？」"
translation = "「진짜일까? 너무나도 서투른 나에게 정이 떨어져 버리거나 하지는 않겠는가?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「しないです」"
translation = "「안 해요」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「必要以上に気負い過ぎて空回ってしまう、それでも真面目に一生懸命友達を作ろうと頑張る──」"
translation = "「필요 이상으로 너무 부담을 가져서 헛돌아 버린다, 그래도 진지하게 열심히 친구를 만들려고 노력한다──」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「そういう不器用さが、むしろヒメさんの自然体なのではないかと思えてきたというだけですから」"
translation = "「그런 서투름이야말로 오히려 히메 씨의 자연스러운 모습이 아닐까 하는 생각이 들었을 뿐이니까요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「今の私が、自然な私……」"
translation = "「지금의 내가, 자연스러운 나……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「だがそれは結局、私の友達作りは絶望的であるということにならないだろうか？」"
translation = "「하지만 그건 결국, 나의 친구 만들기는 절망적이라는 말이 되지 않겠는가?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「私は、そうは思わないです……そういうヒメさんだからこそ、好きになってもらえるという面はあるのではないかと」"
translation = "「저는 그렇게 생각하지 않아요…… 그런 히메 씨이기에 좋아해 줄 수 있는 면도 있지 않을까 해서요」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「その証拠に彼女も、いろいろありながら最後には笑って友達になってくれたではありませんか」"
translation = "「그 증거로 그녀도 이런저런 일이 있었지만 결국엔 웃으며 친구가 되어 주지 않았나요」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「きっと、ちゃんと……ヒメさんのいい所が伝わったからだと思います」"
translation = "「분명, 제대로…… 히메 씨의 좋은 점이 전달되었기 때문이라고 생각해요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そうか……」"
translation = "「그런가……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「私もヒメさんに偉そうなことを言えるほど、友達作りが得意というわけではありませんが……」"
translation = "「저도 히메 씨에게 잘난 듯이 말할 수 있을 정도로 친구 만들기에 능숙한 편은 아니지만……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「それでも……私はヒメさんのそういうところ、良いなと思っています……」"
translation = "「그래도…… 저는 히메 씨의 그런 점, 좋다고 생각해요……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「あ、ありがとう、ナミエル殿！\u3000やはりあなたは私の１番の友達だーっ！」"
translation = "「아, 고맙다, 나미엘 도령! 역시 당신은 나의 첫 번째 친구다~!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「わ、私のことはいいですから！\u3000一度の成功で満足していないで、友達を増やしていくことに注力してください！」"
translation = "「저, 저는 됐으니까요! 한 번의 성공으로 만족하지 말고 친구를 늘려가는 것에 집중해 주세요!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「うむ、わかった！\u3000心強い言葉ももらったことだし、この調子でどんどん声をかけていくとしよう！」"
translation = "「음, 알았다! 든든한 말도 들었으니, 이 기세로 점점 말을 걸어보기로 하지!」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「ふふっ。吹っ切れたみたいですね～」"
translation = "「후후. 훌훌털어 버린 모양이네요～」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「思ったことをそのまま伝えてしまったのですが……本当に良かったのでしょうか？」"
translation = "「생각한 것을 그대로 전해 버렸습니다만…… 정말로 괜찮았던 걸까요?」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「最高の助言だったと思いますよ～♪」"
translation = "「최고의 조언이었다고 생각해요～♪」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「アルモたんもそう思うのだ！\u3000あとはオオヒメ次第、我らに出来ることは見守ることだけなのだ！」"
translation = "「알모탄도 그렇게 생각하는 것이다! 나머지는 오오히메 하기 나름, 우리에게 할 수 있는 건 지켜보는 것뿐인 것이다!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「はい……」"
translation = "「네……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「よし、決めたぞ！\u3000次はあの者に声をかけてくる！」"
translation = "「좋아, 결정했다! 다음은 저 자에게 말을 걸고 오겠다!」"

[[dialogue]]
speaker = "unk"
original = "友達を作りたい、その意欲を漲らせながらオオヒメが突撃していく。"
translation = "친구를 만들고 싶다, 그 의욕을 불태우며 오오히메가 돌격해 간다."

[[dialogue]]
speaker = "unk"
original = "そんなオオヒメの背中に、後方見守り勢の生暖かい視線が注がれるのだった。"
translation = "그런 오오히메의 등 뒤로, 후방 관전파의 따뜻한 시선이 쏟아지는 것이었다."

