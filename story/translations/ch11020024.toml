[[dialogue]]
speaker = "unk"
original = "第４話,完璧で究極のギガンドム,P"
translation = "제4화, 완벽하고 궁극적인 기간돔, P"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「──祝。サイコギガンドムのプラモデル、入手いたしました！」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「惜しむらくは、私の予約した１点しか手に入らなかったことですが……」"
translation = "「아쉬운 점은, 제가 예약한 1점밖에 구하지 못했다는 것이지만……」"

[[dialogue]]
speaker = "unk"
original = "シュティレの愛が届いたな"
translation = "슈틸레의 사랑이 전해졌구나"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ええ。予約抽選は、１０倍以上の倍率だったそうです。今後、どこかで再販もされるとは思います」"
translation = "「네. 예약 추첨은 10배 이상의 배율이었다고 해요. 앞으로 어디선가 재판도 될 거라고 생각합니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ですが最新型ギガンドムを入手できたのは、会長がアルバイトを紹介してくれたおかげでもあります」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「いかがでしょう。このプラモデル、２人で一緒に組み立てませんか？」"
translation = "「어떠신가요. 이 프라모델, 둘이서 함께 조립하지 않겠습니까?」"

[[dialogue]]
speaker = "unk"
original = "いいのか？\u3000楽しみにしてたんじゃ……"
translation = "괜찮아? 기대하고 있었잖아……"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「喜びと幸せは、分かち合ってこそ。それが不動家の教えです」"
translation = "「기쁨과 행복은 나누어야 비로소 의미가 있는 법. 그것이 후도 가문의 가르침입니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「それにファーストギガンドム第２４話でも、似たような教訓があるでしょう。ここで独り占めしては、ギガンドムに叱られてしまいます」"
translation = "「게다가 퍼스트 기간돔 제24화에서도 비슷한 교훈이 있지요. 여기서 독점했다간 기간돔에게 꾸중을 들을 것입니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ニッパーやヤスリなど、工具はすべて２人分用意してあります。遠慮はいりませんよ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そういうことなら！"
translation = "그런 거라면!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふふふ。彼ピと初の共同作業ですね。楽しみです」"
translation = "「후후후. 남친과 첫 공동 작업이네요. 기대됩니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「そうです、各パーツは少し離れたところを切り落として……驚きです。会長、かなり手馴れていますね」"
translation = "「맞습니다, 각 부품은 조금 떨어진 곳을 자르고…… 놀랍네요. 회장, 상당한 숙련자군요」"

[[dialogue]]
speaker = "unk"
original = "模型店でアルバイトしてたから"
translation = "모형점에서 아르바이트를 했었으니까"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「流石です。腕に覚えのある者が２人。きっと素晴らしいギガンドムが完成することでしょう」"
translation = "「역시나입니다. 실력 있는 자가 2명. 분명 훌륭한 기간돔이 완성될 것입니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「シュティレはまず、脚部から組み立てます。会長は腕の方をお願いできますか？」"
translation = "「슈틸레는 우선 다리부터 조립하겠습니다. 회장은 팔 쪽을 부탁드려도 될까요?」"

[[dialogue]]
speaker = "unk"
original = "了解だ！"
translation = "라져다!"

[[dialogue]]
speaker = "unk"
original = "プラモデルを作るだなんて、いつ以来だろう──それこそ模型店のアルバイトをやめてからご無沙汰だった。"
translation = "프라모델을 만드는 건 얼마 만일까── 그야말로 모형점 아르바이트를 그만둔 이후로는 오랜만이었다."

[[dialogue]]
speaker = "unk"
original = "パーツを丁寧に切り取り、シュティレとお互いに進捗を見せあいながら、作業を進めていく。"
translation = "부품을 정성스럽게 잘라내고, 슈틸레와 서로 진행 상황을 보여주며 작업을 진행해 나간다."

[[dialogue]]
speaker = "unk"
original = "それはまるで、ジグソーパズルを少しずつ埋めていくような──とても穏やかで楽しいひと時だった。"
translation = "그것은 마치 직소 퍼즐을 조금씩 채워나가는 듯한── 매우 온화하고 즐거운 한때였다."

[[dialogue]]
speaker = "unk"
original = "そうして、陽が傾き始めた頃──"
translation = "그렇게 해가 기울기 시작할 무렵──"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「よし……最後のサブアーム、装着完了……！」"
translation = "「좋아…… 마지막 서브 암, 장착 완료……!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「完成しました、会長！\u3000ぶいっ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "か、かっこよすぎる……！！"
translation = "너무 멋지잖아……!!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ええ。アニメで見たサイコギガンドム……惚れ惚れするディテールです……夕陽を反射して、実に映える機体となりました……！」"
translation = "「네. 애니메이션에서 본 사이코 기간돔…… 반할 만한 디테일입니다…… 석양을 반사하여 참으로 돋보이는 기체가 되었습니다……!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「さっそく撮影しなくては──」"
translation = "「어서 촬영해야겠어요──」"

[[dialogue]]
speaker = "unk"
original = "シュティレはぴょんぴょんはしゃぎながら、あらゆる角度でサイコギガンドムを撮影していく。"
translation = "슈틸레는 신나서 펄쩍펄쩍 뛰며 다양한 각도에서 사이코 기간돔을 촬영해 나간다."

[[dialogue]]
speaker = "unk"
original = "自撮りが趣味なだけあって、シュティレの切り取るギガンドムは、写真に収めることでさらにかっこよさを増しているように見えた。"
translation = "셀카가 취미인 만큼, 슈틸레가 담아내는 기간돔은 사진으로 담음으로써 더욱 멋짐을 더하는 것처럼 보였다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……会長、今日は本当にありがとうございました」"
translation = "「……회장, 오늘은 정말 감사했습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「その、すごく……すごくすごく、楽しかったです」"
translation = "「그, 정말…… 정말로 정말로, 즐거웠습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ロボットアニメや模型製作……同好の士が周りにいないので、シュティレはいつも１人で遊んでいました」"
translation = "「로봇 애니메이션이나 모형 제작…… 취미가 같은 동호인이 주변에 없어서, 슈틸레는 항상 혼자 놀고 있었습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「もちろん楽しんではいました。疑問を持ったこともありませんでした。でも──」"
translation = "「물론 즐겁기는 했습니다. 의문을 가진 적도 없었습니다. 하지만──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「誰かと一緒に趣味の時間を過ごすことが、こんなにも素敵だなんて。今日は、本当に最高でした」"
translation = "「누군가와 함께 취미 시간을 보내는 것이 이렇게나 멋지다니. 오늘은 정말 최고였습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「好きな人と趣味の時間を共に過ごせて、ハッピーです」"
translation = "「좋아하는 사람과 취미 시간을 함께 보낼 수 있어서, 해피해요」"

[[dialogue]]
speaker = "unk"
original = "また、やろう"
translation = "또 하자"

[[dialogue]]
speaker = "unk"
original = "俺も最高に楽しかったよ"
translation = "나도 최고로 즐거웠어"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい……！\u3000あ、そうです。機体の撮影だけでは、片手落ちというもの──」"
translation = "「네……! 아, 맞다. 기체 촬영만으로는 한 쪽에 치우쳤다는 것──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「シュティレと並んで、ＤＩＳＣへ目線をお願いします。背景にギガンドムを収めて……」"
translation = "「슈틸레와 함께, DISC로 시선을 부탁드립니다. 배경에 기간덤을 담아서……」"

[[dialogue]]
speaker = "unk"
original = "ポーズは、いつものアレだな"
translation = "포즈는 평소의 그거겠지"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ええ。準備は良いですか？」"
translation = "「네. 준비는 되셨나요?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「では──２人の合作。完璧で究極のギガンドムと、大好きな会長と一緒に──」"
translation = "「그럼── 두 사람의 합작. 완벽하고 궁극인 기간덤과, 정말 좋아하는 회장님과 함께──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……ぶいっ♪」"
translation = "「……브이♪」"

[[dialogue]]
speaker = "unk"
original = "こうして撮影された１枚は、その日以降、俺とシュティレのＤＩＳＣの待ち受け画面になるのだった──"
translation = "이렇게 촬영된 한 장은, 그날 이후 나와 슈틸레의 DISC 대기 화면이 되는 것이었다──"

