[[dialogue]]
speaker = "unk"
original = "第２話,類は友を呼ぶ？,P"
translation = ""

[[dialogue]]
speaker = "unk"
original = "イクシリオンとフロレンシアが保健委員会の活動日誌をつけていると、保健室にノックの音が響いた。"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はい、どうぞ。お入りください」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「たのもー」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「お邪魔しますー」"
translation = ""

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「え？\u3000え？\u3000どなたですか……？」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うちは流星学園２年生の安倍野ミヤハルといいます。こう見えて、『陰陽師』の『選星者』やってます～。よろしゅう～」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「紫桜の里から参りました、せつなの師で鵜飼シズルと申します。いつもせつながお世話になってます」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「これはどうも。私は保健委員のイクシリオン・グレゴールです」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「おふたりともお怪我や体調不良ではなさそうですが、保健室にどういったご用事でしょうか？」"
translation = ""

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "（多分ろくなことじゃないんだろうな……）"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ふっふっふ～。うちらはな、保健室やのうて、イクシリオンはんに用があるんや」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「この『淫』の気……間違いありません。ずばり、あなたが『色欲』の魔将ですね？」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「えぇ！？\u3000どちらでそのことを！？」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うちはこの前、街中で戦ってるんを見かけたで～」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「私はヘレナさんからお聞きしました。ヘレナさんは新星学園の理事長ですし、深淵書庫のことも重要課題として心配されておられます」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「な、なるほど……？\u3000それで、おふたりは『色欲』の魔将である私に何のご用でしょうか？」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「それはな～……イクシリオンはんを応援しに来たんや！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「へ？」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「イクシリオンはん、うちのあだ名は知ってる？」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ミヤハルさんのあだ名、ですか？\u3000あ、待ってください……聞いたことがあります。流星学園にはそれはそれはスケベェな星騎士がいると」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「人呼んで『歩く１８禁』！\u3000流星新星両校の風紀委員から危険視される変態だと！\u3000それがあなたなのですね、安倍野ミヤハルさん！」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ご名答～！\u3000もっと言うて～！」"
translation = ""

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "（変態さんが保健室に来ちゃった……）"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「シズルさんはせつなさんの忍術の師匠と伺っています。そして……房中術の師匠でもあるとか！」"
translation = ""

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "（防虫術？\u3000虫を寄せ付けないのかな……。感染症予防には効果ありそう）"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「あ、ちなみに房中術というのは、簡単に言うと、男女の営みの技術のことですね～。棒とちゅっちゅする房中術と覚えてください」"
translation = ""

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "（このひとも変態さんだった……）"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「魔将と呼ばれる強力な星騎士の噂は聞いてたんや。魔将には冠する『大罪』があることも。なら『色欲』の魔将も存在するはずやって思うてたんよ」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うち、密かに『色欲』の魔将の座を狙うてたんや。そしたら、いつの間にか決まってもうてて……」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「そ、それはすみません……」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ええんよ、謝らんといて。戦ってるイクシリオンはんを見て、うちはもう納得したんや」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「気持ちよさそうに戦うイクシリオンはん、えろうスケベぇやったで。イキイキしてて、お尻もスベスベで、お腹もビカビカやし、言うことなしや」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「この『歩く１８禁』も太鼓判を押すで。今日はそれを伝えたかったんや」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ミヤハルさん……ありがとうございます！」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「実は私もヘレナさんから『色欲』の魔将を試してみないかと打診されていたんです。学生さんに『色欲』の二文字は恥ずかしいでしょうから」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「ですが、杞憂だったようですね。イクシリオンさんなら、立派な『色欲』の魔将になれると思います」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「もし、私の房中術が必要になったら言ってください。いつでも伝授しに来ますからね」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「シズルさんも、ありがとうございます！\u3000そのときは頼りにさせていただきます！」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あの……私、仲のいい人からはイクシーと呼ばれているんです。よかったらおふたりもそう呼んでください」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「もちろんや、イクシーはん♪」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「はい、わかりました。イクシーさん」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あ、ところで、さっきシズルさんが仰っていた『淫』の気とは……？」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「いわゆる『溜まってる』というやつですね～。普通の人なら１日１回で済むのが、１日に３回とかしちゃいませんか？\u3000房中術を極めれば分かるようになりますよ～」"
translation = ""

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「なるほど～！\u3000じゃあ、確かに私、『淫』強めです！」"
translation = ""

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「１日１回が１日３回……？\u3000どういうこと……？」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「分からへんかったら分からへんでええんやで……そのままでいてや～」"
translation = ""

[[dialogue]]
speaker_original = "エリス"
speaker_translation = "에리스"
original = "「失礼します。人を探しているのですが──」"
translation = ""

[[dialogue]]
speaker_original = "エリス"
speaker_translation = "에리스"
original = "「ここにいたんですか、ミヤハルさん」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「あちゃ～、見付かってもうた。エリスはんはうちのこと大好きやねぇ」"
translation = ""

[[dialogue]]
speaker_original = "エリス"
speaker_translation = "에리스"
original = "「ええ、片時も目を離したくないくらいです。今日こそ学園内で猥談を繰り広げたことに対する反省文を書いてもらいますからね」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「エリスはんのいけず～」"
translation = ""

[[dialogue]]
speaker_original = "エリス"
speaker_translation = "에리스"
original = "「はいはい。では行きますよ。保健室までお邪魔してすみませんでした。この人で何かあったら私を呼んでください」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ほなさいなら～」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ミヤハルはエリスに引きずられ、手を振りながら去っていった。"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「師匠、ようやく見付けたでござる～！」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「おや、私もお迎えが来たようですね」"
translation = ""

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「こっちにいる間は勝手にいなくならないでと何度言ったら分かってもらえるでござるか～。心配するこっちの身にもなって欲しいでござる」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「ごめんなさい、せつな。でも気が付くと知らないところにいるんですよ～。不思議ですねぇ」"
translation = "「죄송해요, 세츠나. 하지만 정신을 차리고 보니 모르는 곳에 있었어요~. 희한하네요 control」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「なんでのほほんとしてるでござる！？\u3000とにかく帰るでござるよ。イクシー殿、フロレンシア殿、失礼するでござる」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「さようなら～」"
translation = "「안녕히 계세요~」"

[[dialogue]]
speaker = "unk"
original = "シズルもまた手を振りながら去っていった。せつなの小脇に抱えられながら。"
translation = "시즐 역시 손을 흔들며 떠나갔다. 세츠나의 겨드랑이에 끼워진 채로."

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「行っちゃいましたね。なんだったんでしょう……」"
translation = "「가버렸네요. 뭐였을까요……」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「…………あ、１日１回とか３回ってそういう……？\u3000え？\u3000え？」"
translation = "「…………아, 1일 1회라든가 3회라는 건 그런……? 어? 어?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あぁ、そんなにじっと見ないでください。照れてしまいます……。えっと、ちなみに、多い日だともっとする日もあります……」"
translation = "「아아, 그렇게 빤히 보지 말아 주세요. 부끄러워지잖아요……. 저기, 참고로 양이 많은 날에는 더 많이 하는 날도 있어요……」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「え？\u3000えぇ～～～～～～～！？」"
translation = "「어? 어어~~~~~~~~!?」"

[[dialogue]]
speaker = "unk"
original = "ひたすら騒がしい保健室の一日。利用者がいないのはせめてもの幸いだった。"
translation = "그저 소란스러운 보건실의 하루. 이용자가 없는 것이 그나마 다행이었다."

