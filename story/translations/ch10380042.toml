[[dialogue]]
speaker = "unk"
original = "第２話,類は友を呼ぶ？,P"
translation = "제2화, 유유상종?"

[[dialogue]]
speaker = "unk"
original = "イクシリオンとフロレンシアが保健委員会の活動日誌をつけていると、保健室にノックの音が響いた。"
translation = "익실리온과 플로렌시아가 보건위원회의 활동 일지를 쓰고 있자, 보건실에 노크 소리가 울렸다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はい、どうぞ。お入りください」"
translation = "「네, 들어오세요. 들어오십시오」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「たのもー」"
translation = "「이보시오~」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「お邪魔しますー」"
translation = "「실례합니다~」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「え？\u3000え？\u3000どなたですか……？」"
translation = "「에? 에? 누구신가요……?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うちは流星学園２年生の安倍野ミヤハルといいます。こう見えて、『陰陽師』の『選星者』やってます～。よろしゅう～」"
translation = "「내 성은 유성학원 2학년인 아베노 미야하루라고 합니더. 이래 보여도, 『음양사』의 『선성자』를 하고 있습지요~. 잘 부탁합니더~」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「紫桜の里から参りました、せつなの師で鵜飼シズルと申します。いつもせつながお世話になってます」"
translation = "「자앵 마을에서 왔습니다, 세츠나의 스승인 우카이 시즈루라고 합니다. 늘 세츠나가 신세를 지고 있습니다」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「これはどうも。私は保健委員のイクシリオン・グレゴールです」"
translation = "「이거 안녕하세요. 저는 보건위원인 익실리온 그레고르입니다」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「おふたりともお怪我や体調不良ではなさそうですが、保健室にどういったご用事でしょうか？」"
translation = "「두 분 모두 부상이나 컨디션 난조는 아닌 것 같은데, 보건실에는 어떤 볼일이신가요?」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "（多分ろくなことじゃないんだろうな……）"
translation = "（아마 제대로 된 일이 아니겠지……）"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ふっふっふ～。うちらはな、保健室やのうて、イクシリオンはんに用があるんや」"
translation = "「후후후~. 내들은 말이지, 보건실이 아니라, 익실리온 님한테 볼일이 있어서 왔당게」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「この『淫』の気……間違いありません。ずばり、あなたが『色欲』の魔将ですね？」"
translation = "「이 『음』의 기운…… 틀림없군요. 단언컨대, 당신이 『색욕』의 마장이군요?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「えぇ！？\u3000どちらでそのことを！？」"
translation = "「에엣!? 어디서 그것을!?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うちはこの前、街中で戦ってるんを見かけたで～」"
translation = "「내 얼마 전에, 거리에서 싸우고 있는 걸 지나가다 봤거든~」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「私はヘレナさんからお聞きしました。ヘレナさんは新星学園の理事長ですし、深淵書庫のことも重要課題として心配されておられます」"
translation = "「저는 헬레나 씨에게 들었습니다. 헬레나 씨는 신성 학원의 이사장이시기도 하고, 심연서고의 일도 중요 과제로 걱정하고 계시니까요」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「な、なるほど……？\u3000それで、おふたりは『色欲』の魔将である私に何のご用でしょうか？」"
translation = "「그, 그렇군요……? 그래서, 두 분은 『색욕』의 마장인 저에게 무슨 볼일이신가요?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「それはな～……イクシリオンはんを応援しに来たんや！」"
translation = "「그건 말이지~…… 익실리온 님을 응원하러 온 거당게!」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「へ？」"
translation = "「헤?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「イクシリオンはん、うちのあだ名は知ってる？」"
translation = "「익실리온 님, 내 별명 알고 있나?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ミヤハルさんのあだ名、ですか？\u3000あ、待ってください……聞いたことがあります。流星学園にはそれはそれはスケベェな星騎士がいると」"
translation = "「미야하루 씨의 별명, 말인가요? 아, 잠시만요…… 들은 적이 있습니다. 유성 학원에는 매우 엄청나게 야한 성기사가 있다고」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「人呼んで『歩く１８禁』！\u3000流星新星両校の風紀委員から危険視される変態だと！\u3000それがあなたなのですね、安倍野ミヤハルさん！」"
translation = "「일명 『걸어 다니는 18금』! 유성, 신성 양교의 풍기위원으로부터 위험시되는 변태라고! 그게 당신이었군요, 아베노 미야하루 씨!」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ご名答～！\u3000もっと言うて～！」"
translation = "「정답~! 더 말해 봐라~!」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "（変態さんが保健室に来ちゃった……）"
translation = "（변태분이 보건실에 와버렸다……）"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「シズルさんはせつなさんの忍術の師匠と伺っています。そして……房中術の師匠でもあるとか！」"
translation = "「시즈루 씨는 세츠나 씨의 인술 스승이라고 들었습니다. 그리고…… 방중술의 스승이기도 하다고!」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "（防虫術？\u3000虫を寄せ付けないのかな……。感染症予防には効果ありそう）"
translation = "（방충술? 벌레를 쫓아내는 걸까나……. 감염증 예방에는 효과가 있을지도）"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「あ、ちなみに房中術というのは、簡単に言うと、男女の営みの技術のことですね～。棒とちゅっちゅする房中術と覚えてください」"
translation = "「아, 참고로 방중술이라는 것은, 간단히 말해 남녀 간의 잠자리 기술을 말하는 것이지요~. 봉과 츄츄하는 방중술이라고 기억해 주세요」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "（このひとも変態さんだった……）"
translation = "（이 사람도 변태분이었다……）"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「魔将と呼ばれる強力な星騎士の噂は聞いてたんや。魔将には冠する『大罪』があることも。なら『色欲』の魔将も存在するはずやって思うてたんよ」"
translation = "「마장이라 불리는 강력한 성기사의 소문은 들었거든. 마장에게는 관장하는 『대죄』가 있다는 것도. 그렇다면 『색욕』의 마장도 존재할 거라 생각했제」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うち、密かに『色欲』の魔将の座を狙うてたんや。そしたら、いつの間にか決まってもうてて……」"
translation = "「내, 몰래 『색욕』의 마장 자리를 노리고 있었거든. 그랬더니, 어느새 정해져 버려서……」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「そ、それはすみません……」"
translation = "「그, 그것 참 죄송합니다……」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ええんよ、謝らんといて。戦ってるイクシリオンはんを見て、うちはもう納得したんや」"
translation = "「됐단게, 사과하지 마라. 싸우고 있는 익실리온 님을 보고, 내는 이미 납득했으니까」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「気持ちよさそうに戦うイクシリオンはん、えろうスケベぇやったで。イキイキしてて、お尻もスベスベで、お腹もビカビカやし、言うことなしや」"
translation = "「기분 좋게 싸우는 익실리온 님, 억수로 야했단게. 싱싱하니, 엉덩이도 매끈매끈하고, 배도 반짝반짝하고, 흠잡을 데가 없당게」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「この『歩く１８禁』も太鼓判を押すで。今日はそれを伝えたかったんや」"
translation = "「이 『걸어 다니는 18금』도 보증한당게. 오늘은 그걸 전하고 싶었어」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ミヤハルさん……ありがとうございます！」"
translation = "「미야하루 씨…… 감사합니다!」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「実は私もヘレナさんから『色欲』の魔将を試してみないかと打診されていたんです。学生さんに『色欲』の二文字は恥ずかしいでしょうから」"
translation = "「사실 저도 헬레나 씨로부터 『색욕』의 마장을 한번 해보지 않겠냐고 타진받았었습니다. 학생분에게 『색욕』이라는 두 글자는 창피할 테니까요」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「ですが、杞憂だったようですね。イクシリオンさんなら、立派な『色欲』の魔将になれると思います」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「もし、私の房中術が必要になったら言ってください。いつでも伝授しに来ますからね」"
translation = "「혹시, 제 방중술이 필요해지면 말씀해 주세요. 언제든 전수하러 올 테니까요」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「シズルさんも、ありがとうございます！\u3000そのときは頼りにさせていただきます！」"
translation = "「시즈루 씨도, 감사합니다! 그때는 신세 좀 지겠습니다!」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あの……私、仲のいい人からはイクシーと呼ばれているんです。よかったらおふたりもそう呼んでください」"
translation = "「저…… 저, 사이가 좋은 분한테는 익시라고 불리고 있어요. 괜찮으시다면 두 분도 그렇게 불러 주세요」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「もちろんや、イクシーはん♪」"
translation = "「당연하지, 익시 님♪」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「はい、わかりました。イクシーさん」"
translation = "「네, 알겠습니다. 익시 씨」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あ、ところで、さっきシズルさんが仰っていた『淫』の気とは……？」"
translation = "「아, 그나저나, 아까 시즈루 씨가 말씀하신 『음』의 기운이란……?」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「いわゆる『溜まってる』というやつですね～。普通の人なら１日１回で済むのが、１日に３回とかしちゃいませんか？\u3000房中術を極めれば分かるようになりますよ～」"
translation = "「이른바 『쌓여 있다』는 것이지요~. 일반적인 사람이라면 하루에 1번으로 끝날 것을, 하루에 3번씩 하고 그러지 않나요? 방중술을 극진히 연마하면 알 수 있게 된답니다~」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「なるほど～！\u3000じゃあ、確かに私、『淫』強めです！」"
translation = "「그렇군요~! 그럼, 확실히 저, 『음』이 강합니다!」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「１日１回が１日３回……？\u3000どういうこと……？」"
translation = "「하루에 1번이 하루에 3번……? 무슨 소리야……?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「分からへんかったら分からへんでええんやで……そのままでいてや～」"
translation = "「모르면 모르는 대로 괜찮당게…… 그대로 있어 다오~」"

[[dialogue]]
speaker_original = "エリス"
speaker_translation = "에리스"
original = "「失礼します。人を探しているのですが──」"
translation = "「실례합니다. 사람을 찾고 있습니다만──」"

[[dialogue]]
speaker_original = "エリス"
speaker_translation = "에리스"
original = "「ここにいたんですか、ミヤハルさん」"
translation = "「여기 있었나요, 미야하루 씨」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「あちゃ～、見付かってもうた。エリスはんはうちのこと大好きやねぇ」"
translation = "「아차~, 들켜 버렸네. 에리스 님은 날 너무 좋아한다니까」"

[[dialogue]]
speaker_original = "エリス"
speaker_translation = "에리스"
original = "「ええ、片時も目を離したくないくらいです。今日こそ学園内で猥談を繰り広げたことに対する反省文を書いてもらいますからね」"
translation = "「네, 잠시도 눈을 떼고 싶지 않을 정도입니다. 오늘이야말로 학원 내에서 음담패설을 늘어놓은 것에 대한 반성문을 쓰게 만들 테니까요」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「エリスはんのいけず～」"
translation = "「에리스 님 짓궂어~」"

[[dialogue]]
speaker_original = "エリス"
speaker_translation = "에리스"
original = "「はいはい。では行きますよ。保健室までお邪魔してすみませんでした。この人で何かあったら私を呼んでください」"
translation = "「네네. 그럼 가죠. 보건실까지 방해해서 죄송했습니다. 이 사람 때문에 무슨 일 생기면 저를 불러 주세요」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ほなさいなら～」"
translation = "「그럼 이만 안녕히~」"

[[dialogue]]
speaker = "unk"
original = "ミヤハルはエリスに引きずられ、手を振りながら去っていった。"
translation = "미야하루는 에리스에게 끌려가며, 손을 흔들며 떠나갔다."

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「師匠、ようやく見付けたでござる～！」"
translation = "「스승님, 드디어 찾은 것이오~!」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「おや、私もお迎えが来たようですね」"
translation = "「어라, 저도 마중이 온 모양이네요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「こっちにいる間は勝手にいなくならないでと何度言ったら分かってもらえるでござるか～。心配するこっちの身にもなって欲しいでござる」"
translation = "「이쪽에 있는 동안에는 마음대로 사라지지 말라고 몇 번을 말해야 알아듣는 것이오~. 걱정하는 이쪽 입장도 되어주길 바라는 것이오」"

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「ごめんなさい、せつな。でも気が付くと知らないところにいるんですよ～。不思議ですねぇ」"
translation = "「미안해요, 세츠나. 하지만 정신을 차려보면 모르는 곳에 있는걸요~. 희한하네요」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「なんでのほほんとしてるでござる！？\u3000とにかく帰るでござるよ。イクシー殿、フロレンシア殿、失礼するでござる」"
translation = ""

[[dialogue]]
speaker_original = "シズル"
speaker_translation = "시즈루"
original = "「さようなら～」"
translation = "「안녕히 계세요~」"

[[dialogue]]
speaker = "unk"
original = "シズルもまた手を振りながら去っていった。せつなの小脇に抱えられながら。"
translation = "시즈루 역시 손을 흔들며 떠나갔다. 세츠나의 옆구리에 끼워진 채로."

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「行っちゃいましたね。なんだったんでしょう……」"
translation = "「가버렸네요. 뭐였을까요……」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「…………あ、１日１回とか３回ってそういう……？\u3000え？\u3000え？」"
translation = "「…………아, 1일에 1회라든가 3회라는 게 그런……? 어? 어?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あぁ、そんなにじっと見ないでください。照れてしまいます……。えっと、ちなみに、多い日だともっとする日もあります……」"
translation = "「아아, 그렇게 빤히 보지 말아 주세요. 부끄러워지잖아요……. 저기, 참고로 횟수가 많은 날에는 더 많이 하는 날도 있어요……」"

[[dialogue]]
speaker_original = "フロレンシア"
speaker_translation = "플로렌시아"
original = "「え？\u3000えぇ～～～～～～～！？」"
translation = "「어? 어어～～～～～～～!?」"

[[dialogue]]
speaker = "unk"
original = "ひたすら騒がしい保健室の一日。利用者がいないのはせめてもの幸いだった。"
translation = "한없이 시끌벅적한 보건실의 하루. 이용자가 없는 것이 그나마 다행이었다."

