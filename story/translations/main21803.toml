[[dialogue]]
speaker = "unk"
original = "第３話,使徒の目的,B"
translation = "제3화, 사도의 목적, B"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──ストリクス・エッジ！！」"
translation = "「──스트릭스 에지!!」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「踏み込みが甘いね。君、暗殺者だろう？\u3000不意打ち、奇襲が本領のはずだ。下がっていた方がいいんじゃないかな？」"
translation = "「파고드는 게 무르군. 너, 암살자지? 기습, 기습이 본령일 터. 물러나 있는 게 좋지 않겠나?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「本音を言うならそうしたいけどね──」"
translation = "「본심을 말하자면 그러고 싶지만 말야──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（……使徒ジグのシャドウ、本物よりずっと動きは鈍い。けれど……！）"
translation = "（……사도 지그의 섀도, 본체보다 훨씬 움직임이 둔해. 하지만……!）"

[[dialogue]]
speaker = "unk"
original = "前回の戦いで傍にいた、緋宮クロト率いる新星星徒会や、選挙管理委員会の仲間がいない。"
translation = "이전 전투에서 곁에 있었던, 히노미야 쿠로토가 이끄는 신성 학생회나 선거관리위원회의 동료가 없다."

[[dialogue]]
speaker = "unk"
original = "大規模な天界襲撃の直後の、人員の足りない天使たちだけで、この手練れが倒せるのか──"
translation = "대규모 천계 습격 직후라 인원이 부족한 천사들만으로, 이 숙련자를 쓰러뜨릴 수 있을 것인가──"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「メルエルちゃん！\u3000タイミングを合わせて！」"
translation = "「메르엘 짱! 타이밍을 맞춰!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「うんっ──ケイティお姉ちゃん！\u3000はぁぁあああっ！！」"
translation = "「응── 케이티 언니! 하아아아앗!!」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「魔王の血統も、血が薄い──リクリエの力を制御した緋宮クロトの足元にも及ばない。けれど……」"
translation = "「마왕의 혈통도 피가 옅군── 리크리에의 힘을 제어한 히노미야 쿠로토의 발끝에도 미치지 못해. 하지만……」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「砕けなさい──双鉄塊！！」"
translation = "「부서지세요── 쌍철괴!!」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「……君は賞賛に値するね。流石は聖庭園が擁する衛兵隊長だ」"
translation = "「……너는 찬사받을 만하군. 과연 성정원이 보유한 위병대장답다」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「受けた剣ごと、腕まで折れてしまいそうだったよ──はははっ！」"
translation = "「받아낸 검과 함께 팔까지 부러질 뻔했어── 하하핫!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "（只者ではありませんね、この『影』……！\u3000武器ごと本体を叩き潰すつもりだったのに……いなされた！！）"
translation = "（보통이 아니군요, 이 『그림자』……! 무기째로 본체를 쳐부술 생각이었는데…… 흘려보냈어!!）"

[[dialogue]]
speaker = "unk"
original = "ナターシャから伝え聞いた、使徒ジグの能力──『天機の星眼』。"
translation = "나타샤에게 전해 들은 사도 지그의 능력── 『천기의 성안』."

[[dialogue]]
speaker = "unk"
original = "対象の持つ可能性を明らかにする未来視。いかなる剛力を持った一撃も、太刀筋が全て筒抜けであれば、致命の一撃を奪うことは困難だ。"
translation = "대상이 가진 가능성을 밝혀내는 미래시. 아무리 강력한 힘을 실은 일격이라도, 칼의 궤적이 전부 읽힌다면 치명타를 입히기는 어렵다."

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「あまり遊んでばかりもいられないのでね──行け、極星従騎！」"
translation = "「너무 놀고만 있을 수는 없으니── 가라, 극성종기!」"

[[dialogue]]
speaker_original = "スレイプニル"
speaker_translation = "슬레이프니르"
original = "「──ヒヒィィインンッ！！」"
translation = "「──히히이이잉!!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「くっ……衛兵隊！\u3000各個撃破します！\u3000続きなさい！！」"
translation = "「큭…… 위병대! 각개격파합니다! 따르세요!!」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「さてと。馬鹿力の天使はこれでしばらくおとなしくなるだろう」"
translation = "「자, 그럼. 무식하게 힘만 센 천사는 이걸로 당분간 조용해지겠지」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「脅威が少ないとはいえ、魔王の血統は不確定要素が多すぎる──変身できなくなるくらいに、痛めつけさせてもらおうかな？」"
translation = "「위협은 적다지만 마왕의 혈통은 불확정 요소가 너무 많아── 변신할 수 없게 될 정도로 망가뜨려 줄까?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「くぅううっ……！！」"
translation = "「크으윽……!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──させるかっ！！」"
translation = "「──하게 둘까 보냐!!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ナターシャちゃん……あ、ありがとうっ！！」"
translation = "「나타샤 짱…… 고, 고마워!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「お喋りは後！\u3000集中して、メルエル！！」"
translation = "「수다는 나중에! 집중해, 메르엘!!」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「お姫様を守る影──ふふ。私も『真なる神』に仕える騎士だ。どちらの忠義がより上か、試してみるかな──！？」"
translation = "「공주님을 지키는 그림자── 후후. 나도 『진정한 신』을 섬기는 기사다. 어느 쪽의 충의가 더 위인지 시험해 볼까──!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（……忠義？\u3000そんなもの、あるわけないでしょ）"
translation = "（……충의? 그딴 거 있을 리 없잖아）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（これは仕事。好きでやってるわけじゃない──！）"
translation = "（이건 일이야. 좋아서 하는 게 아니라고──!）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（──って。誰に言い訳してるんだろ、私……！）"
translation = "（──랄까. 누구한테 변명하고 있는 거야, 나……!）"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「影に生きる暗殺者の家系……ということか」"
translation = "「그림자 속에 사는 암살자 가계……라는 건가」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「……私は君のことをよく知っているわけではない。あまり感情を見せない君のことだから、なんとも思っていないのかもしれない」"
translation = "「……나는 너를 잘 아는 건 아니야. 감정을 잘 드러내지 않는 너니까, 아무렇지도 않게 생각하고 있을지도 모르지」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「だが……不愉快だ」"
translation = "「하지만…… 불쾌해」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「だって、自分の意志で命を懸けるのと、人に命を捨てさせられるのは違うだろう……！」"
translation = "「그게, 자신의 의지로 목숨을 거는 것과 타인에 의해 목숨을 버리게 되는 건 다르잖아……!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「だから……不愉快だ。たとえ君がそれを良しとしていても」"
translation = "「그러니까…… 불쾌해. 설령 네가 그것을 좋다고 여기더라도」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（確かにムカつくよ、梨緒）"
translation = "（확실히 짜증 나네, 리오）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（でも──だからって無視するわけにもいかないんだよね）"
translation = "（그렇지만── 그렇다고 무시할 수도 없단 말이지）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（これが私に定められた生き方だから。これ以外の生き方を、私は知らない──）"
translation = "（이게 나에게 정해진 삶의 방식이니까. 이것 이외의 삶의 방식을 나는 몰라──）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（今さら変えられない……それだけ！\u3000メルエルに忠義の心なんて、持ってない──！！）"
translation = "（새삼스럽게 바꿀 순 없어…… 그뿐이야! 메르엘에게 충의 같은 거, 안 가지고 있어──!!）"

[[dialogue]]
speaker = "unk"
original = "執拗にメルエルを付け狙う使徒の斬撃を、ナターシャは弾き続ける。"
translation = "집요하게 메르엘을 노리는 사도의 참격을 나타샤는 계속해서 쳐낸다."

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「おや。面白い未来だね──試してみようか！！」"
translation = "「오호. 재밌는 미래군── 시도해 볼까!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……ぐぅっ！？」"
translation = "「……구윽!?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ナターシャちゃんっ！！」"
translation = "「나타샤 짱!!」"

[[dialogue]]
speaker = "unk"
original = "ジグが突如、標的をナターシャの方へ絞ってきた──"
translation = "지그가 돌연 표적을 나타샤 쪽으로 좁혀왔다──"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（まずいっ……何か、都合の良い未来を視たの！？）"
translation = "（위험해…… 뭔가 유리한 미래를 본 거야!?）"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「ひとつ、ふたつ、みっつ──さあ、もうすぐだ！」"
translation = "「하나, 둘, 셋── 자, 이제 곧이다!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（防御が破られるっ──！！）"
translation = "（방어가 뚫려──!!）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あっ──」"
translation = "「앗──」"

[[dialogue]]
speaker = "unk"
original = "両の手に持つ得物を弾かれ、がら空きとなるナターシャの胴体に向かって、大剣を奔らせるジグ──"
translation = "양손에 든 무기가 튕겨 나가 무방비해진 나타샤의 몸통을 향해 대검을 휘두르는 지그──"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「危ない！！\u3000ナターシャちゃん！！」"
translation = "「위험해!! 나타샤 짱!!」"

[[dialogue]]
speaker = "unk"
original = "メルエルがナターシャを庇うために、その必殺の間合いに自ら飛び込んできた。"
translation = "메르엘이 나타샤를 감싸기 위해 그 필살의 거리 안으로 스스로 뛰어들었다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──馬鹿っ！？？」"
translation = "「──바보 아냐!??」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「ははっ！\u3000星眼で視た通りのビジョンだ──！！」"
translation = "「하하! 성안으로 본 그대로의 비전이다──!!」"

[[dialogue]]
speaker = "unk"
original = "ぞっとするほどにナターシャの心臓が冷え込む──自分をエサに、メルエルを釣りだされた。"
translation = "소름이 끼칠 정도로 나타샤의 심장이 싸늘하게 식는다── 자신을 미끼로 메르엘을 낚아낸 것이다."

[[dialogue]]
speaker = "unk"
original = "この未来をなぞると使徒が決めた。それはすなわち、メルエルに刃が食い込むことも織り込み済みの行動に他ならない──"
translation = "사도가 이 미래를 따라가기로 결정했다. 그것은 즉 메르엘에게 칼날이 박히는 것까지 계산에 넣은 행동에 다름없다──"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「やめろ────！！！！」"
translation = "「그만둬────!!!!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「そのような戦い方──とても騎士のものとは思えません！！」"
translation = "「그런 싸움 방식── 도저히 기사의 것이라고는 생각되지 않습니다!!」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「なっ……！？」"
translation = "「나앗……!?」"

[[dialogue]]
speaker = "unk"
original = "ケイティの鉄塊のごとき双剣が、逆にジグの得物を弾き、体勢を崩していた。"
translation = "케이티의 철괴 같은 쌍검이 거꾸로 지그의 무기를 튕겨내며 자세를 무너뜨리고 있었다."

[[dialogue]]
speaker = "unk"
original = "そしてこの状況は、聖域の制圧天使の、絶対の間合い──"
translation = "그리고 이 상황은 성역의 제압 천사에게 있어 절대적인 거리──"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「爆ぜなさい！\u3000断雲の剛撃ッ──！！！」"
translation = "「터지세요! 단운의 강격──!!!」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「ぐっ──あぁあぁあああっ！！」"
translation = "「구윽── 아아아아앗!!」"

[[dialogue]]
speaker = "unk"
original = "目にも止まらない鉄塊の斬撃が、使徒のシャドウに深く食い込む。"
translation = "눈에 보이지 않을 정도의 철괴 참격이 사도의 섀도에 깊숙이 박힌다."

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「はは……この未来は、視えていなかった……お姫様に深手を負わせられる、はずだったんだけどね……」"
translation = "「하하…… 이 미래는 보이지 않았군…… 공주님에게 깊은 상처를 입힐 수 있었을 텐데……」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「やはり模造品の私では、完全な星眼は使えない、か──」"
translation = "「역시 모조품인 나로서는 완전한 성안을 쓸 수 없는 건가──」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「……殲滅完了。２人とも、怪我はない？」"
translation = "「……섬멸 완료. 둘 다 다친 데는 없나요?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「う、うんっ……ありがとう、ケイティお姉ちゃん。ナターシャちゃんも──」"
translation = "「으, 응…… 고마워, 케이티 언니. 나타샤 짱도──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「どういうつもり、メルエル！？」"
translation = "「무슨 생각이야, 메르엘!?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「えっ……」"
translation = "「엣……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「どうしてあんな危ないことをしたの！？」"
translation = "「왜 그런 위험한 짓을 한 거야!?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「で、でもっ……あのままじゃ、ナターシャちゃんが──」"
translation = "「하, 하지만…… 그대로 있으면 나타샤 짱이──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「誰も頼んでないでしょ！？\u3000自分が魔王の血統だって自覚はないわけ！？」"
translation = "「누가 부탁이라도 했어!? 자기가 마왕의 혈통이라는 자각은 없는 거야!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「自分の出自を知って、それを受け止めるんだって偉そうに言うのなら──」"
translation = "「자기 출생을 알고 그걸 받아들이겠다고 잘난 듯이 말할 거라면──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「二度とあんなこと、しないで！！」"
translation = "「다시는 그런 짓 하지 마!!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ご……ごめん、なさい……」"
translation = "「미…… 미안해……」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「──２人とも。喧嘩をしている場合じゃないでしょう？」"
translation = "「──둘 다. 싸우고 있을 때가 아니잖아요?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「姉さん、でも──！」"
translation = "「언니, 하지만──!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「それにナターシャちゃん。危ないところを庇ってもらったのだから、ちゃんとお礼は言わないとダメよ。──ね？」"
translation = "「그리고 나타샤 짱. 위험한 상황에서 도움을 받았으니 제대로 고맙다는 말은 해야지.──그렇죠?」"

[[dialogue]]
speaker = "unk"
original = "嗜めるように促され、ナターシャは大きく息を吐く。"
translation = "타이르듯 재촉하자 나타샤는 크게 숨을 내뱉는다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「…………ごめん、メルエル」"
translation = "「…………미안, 메르엘」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「う、ううん。私の方こそ……」"
translation = "「으, 응. 나야말로……」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ひとまずの脅威は退けました。早急に人間界にいらっしゃる、会長さんに連絡を取らなくてはなりませんね」"
translation = "「일단 위협은 물리쳤습니다. 조속히 인간계에 계신 회장님께 연락을 취해야겠네요」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「人間界も攻撃を受けているかもしれませんし……魔女様の容態は？」"
translation = "「인간계도 공격을 받고 있을지 모르고…… 마녀님의 상태는요?」"

[[dialogue]]
speaker_original = "衛兵隊の天使"
speaker_translation = "위병대의 천사"
original = "「一命はとりとめていますが、意識が戻られないご様子です……！」"
translation = "「목숨은 건졌습니다만, 의식이 돌아오지 않는 모양입니다……!」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「そうですか──わかりました。至急、聖庭園に魔女様を運んで治療をお願いします」"
translation = "「그렇습니까── 알겠습니다. 지체 없이 성정원으로 마녀님을 옮겨 치료를 부탁드립니다」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ひとまず私たちも帰りましょう。今後の事態に備えなければ──」"
translation = "「우선 우리도 돌아가죠. 향후 사태에 대비해야 하니까요──」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「また──緊急連絡！？」"
translation = "「또── 긴급 연락!?」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「……私です。何が起きました？」"
translation = "「……저입니다. 무슨 일이죠?」"

[[dialogue]]
speaker_original = "衛兵隊の天使"
speaker_translation = "위병대의 천사"
original = "『ケイティ隊長！\u3000女神の神殿が……仮面を被った星騎士の攻撃を受けています！！』"
translation = "『케이티 대장님! 여신의 신전이…… 가면을 쓴 성기사의 공격을 받고 있습니다!!』"

[[dialogue]]
speaker_original = "衛兵隊の天使"
speaker_translation = "위병대의 천사"
original = "『すでに神殿内部への侵入も許してしまっていますっ！\u3000至急、応援を──きゃぁぁああっ！？』"
translation = "『이미 신전 내부 침입까지 허용하고 말았습니다! 조속히 응원을── 꺄아아앗!?』"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「……ゆっくりお茶会をする暇はなさそうですね！」"
translation = "「……한가하게 차 마실 틈은 없을 것 같네요!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（また、女神の神殿に攻撃を……？\u3000敵の目的は一体──）"
translation = "（또 여신의 신전을 공격해……? 적의 목적은 대체──）"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「女神の神殿を落とされては、天界は壊滅します！\u3000行きますよ、みなさん！！」"
translation = "「여신의 신전이 함락되면 천계는 괴멸합니다! 갑시다, 여러분!!」"

