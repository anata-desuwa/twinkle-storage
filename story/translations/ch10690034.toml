[[dialogue]]
speaker = "unk"
original = "第４話,まったり黄昏,P"
translation = "제4화, 느긋한 황혼, P"

[[dialogue]]
speaker = "unk"
original = "それは、とある休日のこと──"
translation = "그것은 어느 휴일의 일──"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「～♪\u3000ねえ会長、あなたの近況をゆっくり聞かせてもらえないかしら？」"
translation = "「~♪ 저기 회장님, 당신의 근황을 천천히 들려주지 않겠어요?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「別に深い意味はないわ。純粋にあなたの近況が訊きたかっただけ。あなたは忙しい人だから、週末にはあなた成分を補給したいわ」"
translation = "「딱히 깊은 의미는 없어요. 순수하게 당신의 근황을 듣고 싶었을 뿐. 당신은 바쁜 사람이니까 주말에는 당신 성분을 보충하고 싶어요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ねえ、あなたのお膝の上に乗ってもいい？」"
translation = "「저기, 당신 무릎 위에 앉아도 될까요?」"

[[dialogue]]
speaker = "unk"
original = "もちろん"
translation = "당연하지"

[[dialogue]]
speaker = "unk"
original = "いいよ"
translation = "좋아"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ふふっ、ありがとう♪\u3000ん～……落ち着くわ。こうしてみると……あなたの体って、意外としっかりしているのよね」"
translation = "「후후, 고마워요♪ 음~…… 안심되네요. 이렇게 보니…… 당신의 몸은 뜻밖에 듬직하네요」"

[[dialogue]]
speaker = "unk"
original = "セシアが乗っかってくると、ふわりと花のような甘い香りが漂った。"
translation = "세시아가 올라타자 붕 하고 꽃과 같은 달콤한 향기가 감돌았다."

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「こうしてのどかな時間が送れるのも、わたくしたちの努力が実を結んだ成果と言えるわね……」"
translation = "「이렇게 평화로운 시간을 보낼 수 있는 것도 우리들의 노력이 결실을 맺은 성과라고 할 수 있겠네요……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「遊園地のような目まぐるしい楽しさもいいけれど、こうして２人きりでまったりできる時間も必要だわ」"
translation = "「놀이공원처럼 어지러운 즐거움도 좋지만 이렇게 둘이서만 느긋하게 있을 수 있는 시간도 필요해요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「会長～、まだまだ甘えたりないの。今度は後ろから抱きしめてくれない？」"
translation = "「회장님~, 아직 어리광이 부족해요. 이번엔 뒤에서 안아주지 않겠어요?」"

[[dialogue]]
speaker = "unk"
original = "望みとあらば"
translation = "바란다면야"

[[dialogue]]
speaker = "unk"
original = "遠慮なく"
translation = "사양 않고"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「んっ……ふふ。ママに抱っこされている時とは違う感覚……あなたのことが頼りに思えて安心するわ」"
translation = "「응…… 후후. 엄마에게 안겨 있을 때와는 다른 느낌…… 당신을 의지할 수 있는 것 같아 안심돼요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「じゃあ、じゃあ……今度は、あなたのほっぺにチューしてもいい？」"
translation = "「그럼, 그럼…… 이번엔 당신 뺨에 뽀뽀해도 될까요?」"

[[dialogue]]
speaker = "unk"
original = "許可も要らない"
translation = "허락도 필요 없어"

[[dialogue]]
speaker = "unk"
original = "もちろん"
translation = "당연하지"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「なら、お言葉に甘えて──んっ」"
translation = "「그럼 호의에 맡겨서── 응」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ふふっ。してしまったわ。いけない、癖になりそう。あなたの顔を見ていたら、何度だってキスしたくなってしまうわ」"
translation = "「후후. 해버렸네요. 안 돼, 버릇이 될 것 같아. 당신 얼굴을 보고 있으면 몇 번이고 키스하고 싶어져요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「んー……ふぅ……んー……あら……んーっ……ふぅ。えい、えい……ほいっ……んーっ……」"
translation = "「음─…… 후우…… 음─…… 어라…… 음─…… 후우. 얍, 얍…… 이억…… 음─……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「え？\u3000何をしてるのかって？\u3000あなたの袖をつまんだり、あなたの匂いを嗅いだりしているだけよ」"
translation = "「에? 뭘 하고 있냐고요? 당신의 소매를 잡거나 당신의 냄새를 맡고 있을 뿐이에요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「理由なんて……特にないわ。ただ、なんとなくあなたに触れていたくて」"
translation = "「이유 같은 건…… 딱히 없어요. 그저 왠지 당신에게 닿아있고 싶어서」"

[[dialogue]]
speaker = "unk"
original = "今日は積極的だね"
translation = "오늘은 적극적이네"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「あら？\u3000そうかしら。わたくしとしては、ただ素直に甘えているだけのつもりだったのだけど」"
translation = "「어머? 그런가요. 저로서는 그저 솔직하게 어리광을 부리고 있을 뿐이었지만요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ママ相手に甘えている時もわたくしはこうでしょう？\u3000抱っこしてもらったり、頭を撫でてもらったり……」"
translation = "「엄마를 상대로 어리광을 부릴 때도 저는 이러잖아요? 안아달라고 하거나 머리를 다듬어달라고 하거나……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「でも──そうね。あなたに求めるスキンシップは、それとも違う感じがしているわ。キスなんかは、あなたじゃなきゃ求めようとも思わないもの」"
translation = "「하지만── 그래요. 당신에게 요구하는 스킨십은 그것과도 다른 느낌이 들어요. 키스 같은 건 당신이 아니면 바랄 생각조차 안 하는걸요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「わたくし、不思議だわ。ママ相手には目一杯素直な気持ちで接しているけれど、あなたといるとそれ以上の感情が湧き出してくるの」"
translation = "「저, 신기해요. 엄마에게는 한껏 솔직한 마음으로 접하고 있지만, 당신과 있으면 그 이상의 감정이 솟구쳐 나와요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「頭を撫でてほしいという気持ちも、まるで別のものに思えるわ」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「なんなら、何もしなくたっていいのよ。こうして一緒に、同じ空間にいるだけで、心が満たされたような気分になるの」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「わたくし、変わっているかしら？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "いい変化だ"
translation = ""

[[dialogue]]
speaker = "unk"
original = "変なことはない"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そう。ふふ、ならよかったわ。このまましばらく、甘えさせてもらおうかしら」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「……。最近ね、ふと思うの。わたくし、今の姿になれてよかったなって」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「もちろん、蓄積された記憶が失われてしまったことは惜しいけれど……おかげであなたと、こんな、なんでもない休日を、愛おしく過ごすことができる」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「それはきっと──知識を膨らませきってしまったわたくしじゃ、感じられなかった気持ちだと思うの」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「２人でくっついているだけで、とびっきりに幸せだと感じるのよ。ふふ、おかしくないかしら？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺も同じように感じるから"
translation = ""

[[dialogue]]
speaker = "unk"
original = "おかしくないよ"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ありがとう。ふふ、あなたと同じ気持ちでいられることも、何より嬉しいわ」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ほら、もっとひっついて？\u3000わたくしあなたの温もりを常に感じていたいの。あなただってそうでしょ？」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「こうして指を絡めて……体重を預けて……ふふ。こんなこと、どのママにも頼めないんだから」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「これからもずーっと一緒にいましょうね──会長♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そうして俺たちは、心ゆくまで休日のまったりを楽しんだ……"
translation = ""

