[[dialogue]]
speaker = "unk"
original = "第３話,ミウの放課後デートプラン,P"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「教室に迎えに来るなら、来るって連絡してくれれば、途中で抜けてきましたのに……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "メールしたと思うんだけど？"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「えっ……？\u3000あ、本当だ……見逃しちゃってました。話に夢中になってて、気づかなかったんですね。ごめんなさい」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺に関する話だったみたいだけど"
translation = ""

[[dialogue]]
speaker = "unk"
original = "どんな話してたの？"
translation = "무슨 이야기 하고 있었어?"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そ、それはー……ガールズトークを聞き出そうだなんて、会長さんはデリカシーが足りてません！」"
translation = "「그, 그건~…… 걸즈 토크를 캐내려고 하시다니, 회장님은 배려심이 부족해요!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あ、私、ちょっと着替えてきますね」"
translation = "「아, 저, 잠시 옷 좀 갈아입고 올게요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「せっかくの放課後デートですし、いつもと違う私も見てほしいですからね」"
translation = "「모처럼의 방과후 데이트이고, 평소와 다른 제 모습도 보여드리고 싶으니까요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「じゃーん♪\u3000チーパオフォームに変身してきました♪」"
translation = "「짜잔~♪ 치파오 폼으로 변신하고 왔습니다♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「どうですか、会長さん。この衣装、ヒマワリちゃんとお揃いなんですよ？\u3000似合ってますか？」"
translation = "「어떠신가요, 회장님. 이 의상, 히마와리 양이랑 커플룩이라구요? 잘 어울리나요?」"

[[dialogue]]
speaker = "unk"
original = "とっても似合ってるよ"
translation = "엄청 잘 어울려"

[[dialogue]]
speaker = "unk"
original = "すっごく可愛いね"
translation = "정말 너무 귀엽다"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、聞きたい言葉が聞けたので満足です。さ、会長さん、浅草デートを楽しみましょう♪」"
translation = "「후후, 듣고 싶었던 말을 들어서 만족했어요. 자, 회장님, 아사쿠사 데이트를 즐겨봐요♪」"

[[dialogue]]
speaker = "unk"
original = "絡みつくように腕を組み、浅草の町を練り歩く。"
translation = "착 휘감기듯 팔짱을 끼고 아사쿠사 거리를 걸어간다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「わっ、ジャンボ黒豚肉まんだそうですよ！\u3000この格好なら肉まんは食べなきゃですよね」"
translation = "「와아, 점보 흑돼지 고기만두라고 해요! 이 차림이라면 고기만두는 먹어줘야겠죠」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「蒸かしたてでアッツアツです。いただきまーす。はむっ」"
translation = "「갓 쪄내서 완전 따끈따끈해요. 잘 먹겠습니다. 냠」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ん～～～～っ<emoji=heart04>\u3000ジューシーな肉汁がじゅわぁって溢れてきます<emoji=heart04>\u3000美味しいです～～っ<emoji=heart04>」"
translation = "「음~~~~잇<emoji=heart04> 쥬시한 육즙이 쫙 하고 넘쳐흐려요<emoji=heart04> 맛있어요~~잇<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さんも食べてください。わけっこしましょう。こんなに大きなの、私ひとりじゃ食べきれませんから。晩ご飯、食べられなくなっちゃいます」"
translation = "「회장님도 드셔보세요. 나눠 먹어요. 이렇게 큰 건 저 혼자서는 다 못 먹으니까요. 저녁을 못 먹게 되어버려요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「参考までにー、私がかじったのは……ここですよ<emoji=heart04>\u3000間接キスになっちゃいますけど<emoji=heart04>」"
translation = "「참고로~ 제가 한 입 베어 문 건…… 여기랍니다<emoji=heart04> 간접키스가 되어버리지만요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「──って、躊躇なく食べちゃうんですか！？」"
translation = "「──라니, 망설임도 없이 드시는 건가요!?」"

[[dialogue]]
speaker = "unk"
original = "ちょっとミウの味がする"
translation = "약간 미우의 맛이 나"

[[dialogue]]
speaker = "unk"
original = "肉汁がジューシーで美味い！"
translation = "육즙이 쥬시해서 맛있다!"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「へ、変なこと言わないでくださいっ！\u3000うぅ、やりこめるつもりが、私の方がやられちゃいました……」"
translation = "「이, 이상한 소리 하지 마세요! 으으, 골탕 먹이려다가 제가 당해버렸네요……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「きゃ～～～っ<emoji=heart04>\u3000あのパンダちゃんのぬいぐるみ大きすぎないですか！？\u3000私と同じくらいありますよ」"
translation = "「캐~~~앗<emoji=heart04> 저 판다 인형 너무 크지 않나요!? 저만해요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あれを抱いて寝たら、幸せな夢が見られそうです……いいなぁ……♪」"
translation = "「저걸 안고 자면 행복한 꿈을 꿀 수 있을 것 같아요…… 부럽다……♪」"

[[dialogue]]
speaker = "unk"
original = "プレゼントしようか？"
translation = "선물로 줄까?"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ええっ！？\u3000い、いいです、いいですよ！\u3000あんなに大きいぬいぐるみ、お小遣いで買えるレベルじゃないですよ」"
translation = "「에엑!? 됐, 됐어요, 됐어요! 저렇게 큰 인형은 용돈으로 살 수 있는 수준이 아니에요」"

[[dialogue]]
speaker = "unk"
original = "思ってたより１桁高かった……"
translation = "생각했던 것보다 한 자릿수 높았어……"

[[dialogue]]
speaker = "unk"
original = "確かに……"
translation = "하긴……"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あはは、ですよね。ヒマワリちゃんに言ったら、あっさり買ってくれちゃいそうなのが怖いんですけどね」"
translation = "「아하하, 그렇죠. 히마와리 양한테 말하면 덥석 사줄 것 같아서 무섭지만요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「デートって楽しいですね。友達と教室で話すのとも、ヒマワリちゃんと遊ぶのとも、任務を解決するのともまた違った楽しさで……」"
translation = "「데이트는 즐겁네요. 친구와 교실에서 이야기하는 것하고도, 히마와리 양과 놀거나 임무를 해결하는 것과도 또 다른 즐거움이라……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ドキドキしっぱなしなのに、気持ちはすごく楽なんです。いつもと違う自分になれている気がします」"
translation = "「두근두근거리기만 하는데도 마음은 너무 편해요. 평소와 다른 내가 되어있는 느낌이 들어요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、今の私を知ってるのは、会長さんだけなんですよ」"
translation = "「후후, 지금의 나를 아는 건 회장님뿐이에요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「親友のヒマワリちゃんにも見せたことのない……自分でも知らなかった私です」"
translation = "「절친인 히마와리 양에게도 보여준 적 없는…… 나조차도 몰랐던 나예요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃんは私のこと、なんでもできる完璧な子って思ってたみたいなんですよね」"
translation = "「히마와리 양은 나에 대해 뭐든지 할 수 있는 완벽한 아이라고 생각했던 것 같지만요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えー！？\u3000ミウもパニクっちゃうことってあるんだー！？」"
translation = "「에~!? 미우도 당황해서 패닉에 빠질 때가 있구나~!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「でも、なんか可愛いー！\u3000やっぱりミウも恋する女の子なんだねー！」"
translation = "「하지만 왠지 귀여워~! 역시 미우도 사랑하는 소녀네~!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「こんなことを言えるのは、会長さんだけ。いつもと違う私でいられるのは、会長さんの前でだけ」"
translation = "「이런 말을 할 수 있는 건 회장님뿐. 평소와 다른 나로 있을 수 있는 건 회장님 앞뿐」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「だから、これからもずっと……私の特別な人でいてくださいね」"
translation = "「그러니까 앞으로도 계속…… 나의 특별한 사람으로 있어주세요」"

[[dialogue]]
speaker = "unk"
original = "喜んで"
translation = "기꺼이"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あ……そろそろ暗くなってきちゃいましたね。会長さんとのデートの時間が、いつまでも続けばいいのに……」"
translation = "「아…… 슬슬 어두워지기 시작했네요. 회장님과의 데이트 시간이 언제까지고 계속되면 좋을 텐데……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「どうしても終わりって訪れちゃうんですよね。残念です」"
translation = "「어떻게 해도 끝은 찾아오고 마네요. 아쉬워요」"

[[dialogue]]
speaker = "unk"
original = "放課後デートの時間は終わりを告げようとしていた。"
translation = "방과후 데이트 시간은 끝을 알리려 하고 있었다."

