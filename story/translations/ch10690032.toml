[[dialogue]]
speaker = "unk"
original = "第２話,欲しかった言葉,P"
translation = "제2화, 원했던 말,P"

[[dialogue]]
speaker = "unk"
original = "最近の新星星徒会は、いつもに増して多忙を極めていた。"
translation = "최근의 신성성도회는, 평소보다 더욱더 바쁜 나날을 보내고 있었다."

[[dialogue]]
speaker = "unk"
original = "セシアともなかなか会えずじまいの日々が続いている……"
translation = "세시아와도 좀처럼 만나지 못하는 나날이 계속되고 있다……"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「お、お邪魔するわ」"
translation = "「실, 실례할게」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「あら、会長。今は１人なの？\u3000ふふ、ちょうどよかった。最近は会えてなかったから、どうしているものかと思って」"
translation = "「어머, 회장. 지금은 혼자인가요? 후후, 마침 잘됐네요. 최근에는 만나지 못했으니까, 어떻게 지내나 싶어서」"

[[dialogue]]
speaker = "unk"
original = "俺もセシアに会いたかった"
translation = "나도 세시아를 만나고 싶었어"

[[dialogue]]
speaker = "unk"
original = "久しぶりに会えて嬉しい"
translation = "오랜만에 만나서 기뻐"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「……！\u3000そ、そう。わたくしもなのよ。なにせわたくし達は今や『恋人関係』だもの。お互いを欲するのは自然なことだわ」"
translation = "「……! 그, 그래요. 나도랍니다. 어쨌든 우리들은 이제 『연인 관계』인걸요. 서로를 바라는 것은 자연스러운 일이에요」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「もちろん忙しければ、わたくしもすぐに出ていくのだけど……」"
translation = "「물론 바쁘다면, 나도 바로 나가겠지만……」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「問題ない？\u3000そう。良かったわ。うん。じゃあ、もう少しここに居させてもらうとして……」"
translation = "「문제없다고요? 그래요. 다행이네요. 응. 그럼, 조금 더 여기에 있게 해달라고 하고……」"

[[dialogue]]
speaker = "unk"
original = "セシアの様子は、どことなくぎこちないように感じられた。"
translation = "세시아의 모습은 어딘가 어색하게 느껴졌다."

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「どうかしたかって？\u3000べ、別になんでもないのよ。ただ、その……久しぶりだから？\u3000だわ、きっと」"
translation = "「무슨 일 있냐고요? 별, 별로 아무것도 아니에요. 단지, 그…… 오랜만이라서? 일 거예요, 분명」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「それにしても……今日はいい天気ね！\u3000今にも羽ばたきたくなるような、絶好の飛翔日和よ！」"
translation = "「그건 그렇고…… 오늘은 날씨가 좋네요! 당장이라도 날아오르고 싶어지는, 절호의 비상 날씨예요!」"

[[dialogue]]
speaker = "unk"
original = "あんまりよくない……"
translation = "그다지 좋지 않은데……"

[[dialogue]]
speaker = "unk"
original = "曇りだけど……"
translation = "흐린데……"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「………………雨の日に比べればいい天気という意味よ！\u3000雲の向こうから陽が差し込んでいるもの」"
translation = "「………………비 오는 날에 비하면 좋은 날씨라는 뜻이에요! 구름 저편에서 햇살이 비쳐들고 있으니까요」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「後は……そうそう。えっと。今日は会長に見てほしいものがあって来たのよ。それというのはね……」"
translation = "「그 다음은…… 그래그래. 저기. 오늘은 회장이 봐주었으면 하는 것이 있어서 왔어요. 그게 뭐냐 하면 말이죠……」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「……えっと……ほら、これよ。わたくし、ジャンプから３回転できるようになったの。すごいでしょう？」"
translation = "「……저기…… 봐요, 이거예요. 나, 점프해서 3회전을 할 수 있게 되었어요. 대단하죠?」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ふふふ、そんなに褒めなくてもいいわ。妖精の羽がなせる技かしら？」"
translation = "「후후후, 그렇게 칭찬하지 않아도 돼요. 요정의 날개가 해낸 기술일까요?」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "（さ……さっきから何をしているのかしら、わたくし。紅明ママに送り出されて、会長に新しい姿を見せるはずだったのに……）"
translation = "(아…… 아까부터 무엇을 하고 있는 걸까, 나. 코메이 엄마가 보내주어서, 회장에게 새로운 모습을 보여주기로 되어 있었는데……)"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "（会長の顔を見たら……なんだか体が強張ってしまって……本題を切り出せないわ）"
translation = "(회장의 얼굴을 보니…… 왠지 몸이 굳어버려서…… 본론을 꺼낼 수 없어)"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "（こんな関係ない話を続けている場合ではないというのに……）"
translation = "(이런 상관없는 이야기를 계속할 때가 아닌데도……)"

[[dialogue]]
speaker = "unk"
original = "……セシア？"
translation = "……세시아?"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「──はっ。いけない。わたくしとしたことが、こんなことではいけないわ」"
translation = "「──앗. 안 돼. 나다운 답지 않게, 이러면 안 돼요」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「実はね、会長。あなたに見てもらいたいものがあるの。あなたは何もしなくていいわ。そのままでいて」"
translation = "「사실은 말이죠, 회장. 당신에게 보여주고 싶은 것이 있어요. 당신은 아무것도 안 해도 돼요. 그대로 있어요」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ふぅ……せーの……変身！」"
translation = "「후우…… 하나 둘…… 변신!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「──じゃーん！\u3000どうかしら？\u3000これがわたくしの新たなフォルムよ！」"
translation = "「──짜잔! 어떨까요? 이것이 나의 새로운 폼이에요!」"

[[dialogue]]
speaker = "unk"
original = "セシアは、衣装を隅々まで披露するように、その場でくるりと回った。"
translation = "세시아는 의상을 구석구석 피로하듯, 그 자리에서 빙글 돌았다."

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「わたくし達守護天使が１対１で、ルヴィネさまと新たに<ruby>経路<rt>パス</rt></ruby>を結び直しているということは知っているかしら？」"
translation = "「우리들 수호천사가 1대 1로, 루비네 님과 새로이 <ruby>경로<rt>패스</rt></ruby>를 다시 맺고 있다는 것은 알고 있나요?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「わたくしもその契約を結び直したのですけど──その結果、わたくしは元の姿、《万成》のアウクセシアの力を一部だけど取り戻したの」"
translation = "「나도 그 계약을 다시 맺었습니다만── 그 결과, 나는 원래의 모습, 《만성》의 아욱세시아의 힘을 일부지만 되찾았어요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そうして芽生えたのがこの姿よ！\u3000この姿を会長にもひと目見てほしかったの！」"
translation = "「그렇게 해서 싹튼 것이 이 모습이에요! 이 모습을 회장에게도 한눈 보여주고 싶었어요!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「えと……その……どうかしら！？」"
translation = "「저기…… 그…… 어떨까요!?」"

[[dialogue]]
speaker = "unk"
original = "すごく似合ってる"
translation = "엄청 잘 어울려"

[[dialogue]]
speaker = "unk"
original = "可愛いよ"
translation = "귀여워"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「……！\u3000可愛い──ほ、本当かしら！？」"
translation = "「……! 귀엽다──정, 정말인가요!?」"

[[dialogue]]
speaker = "unk"
original = "セシアは勢いよくこちらに抱きついてきた。"
translation = "세시아는 세차게 이쪽에 안겨왔다."

[[dialogue]]
speaker = "unk"
original = "彼女を撫でつつ、何度も何度も可愛いと言ってやる。"
translation = "그녀를 쓰다듬어 주면서, 몇 번이고 몇 번이고 귀엽다고 말해준다."

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「あ、あう……わたくしが……可愛い……そ、そう。ええ、会長がそう思ってくれていることは知っているけど……知っているはずなのに……」"
translation = "「아, 아우…… 내가…… 귀엽다…… 그, 그래요. 예, 회장이 그렇게 생각해 주고 있다는 것은 알고 있지만…… 알고 있을 텐데……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「不思議だわ……今までたくさんのママに、可愛い可愛いと褒められてきたわたくしが……会長のたったひと言だけで、ここまで<ruby>昂<rt>たか</rt></ruby>ぶってしまうなんて……」"
translation = "「희한한 일이네요…… 지금까지 수많은 엄마에게, 귀엽다 귀엽다 하고 칭찬받아 온 내가…… 회장의 단 한마디에, 여기까지 고양되어 버리다니……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ふふっ！\u3000今は素直に喜ぶことにするわ！\u3000素直なわたくしが１番だって、紅明ママも言ってくれていたものね！」"
translation = "「후후! 지금은 솔직하게 기뻐하기로 하겠어요! 솔직한 내가 1번이라고, 코메이 엄마도 말해 주었으니까요!」"

[[dialogue]]
speaker = "unk"
original = "様子が変だったの？"
translation = "상태가 이상했던 거야?"

[[dialogue]]
speaker = "unk"
original = "にしてもどうして……"
translation = "그렇다 쳐도 어째서……"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「それについては、わたくしにもわからないのよ」"
translation = "「그것에 대해서는, 나도 잘 모르겠어요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「この衣装に芽生えてから連日、会長のことを考えていたわ。そうしたら……なかなか会うに会えなくて」"
translation = "「이 의상으로 싹트고 나서 연일, 회장을 생각하고 있었어요. 그랬더니…… 좀처럼 만나려 해도 만날 수 없어서」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「おかしいでしょう？\u3000アウクセシアの力が戻るにつれて……蓄積されていた知識も増えたはずなのに……うまく踏み出せなくなるなんて」"
translation = "「이상하죠? 아욱세시아의 힘이 돌아옴에 따라…… 축적되어 있던 지식도 늘었을 텐데…… 잘 내딛지 못하게 되다니」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「わたくしらしくないと、自分でも思っていたのよ。でも、なぜか、胸がずっとトクントクンしていたの」"
translation = "「나답지 않다고, 스스로도 생각하고 있었어요. 하지만, 어째서인지, 가슴이 계속 두근두근거리며 요동치고 있었어요」"

[[dialogue]]
speaker = "unk"
original = "ドキドキしてるセシアも可愛いよ"
translation = "두근거려 하는 세시아도 귀여워"

[[dialogue]]
speaker = "unk"
original = "そんな風に思ってもらえて嬉しい"
translation = "그런 식으로 생각해 주다니 기뻐"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「～～～～っ……！\u3000会長ってば……もう、ふふっ！\u3000なんだか、さっきまでの悩みがちっぽけに思えてきたわ」"
translation = ""

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「あなたの『可愛い』をもらうために……セシア、またデートに行きたいわ！」"
translation = "「당신의 『귀여워』를 받기 위해…… 세시아, 또 데이트에 가고 싶어요!」"

[[dialogue]]
speaker = "unk"
original = "何かから解き放たれたかのように無邪気に喜ぶセシアの姿に、こちらの心まで弾んでしまうのだった。"
translation = "무언가로부터 해방된 것처럼 무사히 기뻐하는 세시아의 모습에, 이쪽의 마음까지 들떠버리는 것이었다."

