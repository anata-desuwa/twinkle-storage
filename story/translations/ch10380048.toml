[[dialogue]]
speaker = "unk"
original = "今日はイクシリオンから『魔将フォームの力を試したい』と言われ、深淵書庫を訪れていた。"
translation = "오늘은 익실리온으로부터 『마장 폼의 힘을 시험해 보고 싶다』는 말을 듣고, 심연서고를 방문했다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「今日は来ていただきありがとうございます、会長」"
translation = "「오늘은 와주셔서 감사합니다, 회장님」"

[[dialogue]]
speaker = "unk"
original = "イクシリオンがどこか陶酔した様子で笑みを深める。"
translation = "익실리온이 어딘가 도취된 듯한 모습으로 미소를 띤다."

[[dialogue]]
speaker = "unk"
original = "普段の真面目な彼女とも、妄想に耽っている時とも違う、サディスティックな笑顔。"
translation = "평소의 진지한 그녀와도, 망상에 잠겨 있을 때와도 다른 새디스틱한 미소."

[[dialogue]]
speaker = "unk"
original = "魔将になってから時折見せる、妖艶で蠱惑的な笑みだ。"
translation = "마장이 되고 나서 때때로 보이는, 요염하고 유혹적인 미소다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「前置きはいいでしょう。私、会長を犯したくてたまらないんです……<emoji=heart04>」"
translation = "「서론은 필요 없겠죠. 저, 회장님을 범하고 싶어서 견딜 수 없어요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「イクシーのことだから、そうだと思ったよ」"
translation = "「익시다운 반응이라, 그럴 줄 알았어」"

[[dialogue]]
speaker = "unk"
original = "色欲の魔将の力を試すと言えば、それくらい想像がつく。"
translation = "색욕의 마장의 힘을 시험한다고 하면, 그 정도는 상상이 간다."

[[dialogue]]
speaker = "unk"
original = "むっつりドスケベなイクシーのことだから猶更だ。"
translation = "음흉한 음란마귀인 익시다운 짓이라 더욱더 그렇다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「さすが会長、私のことを理解してくれていて嬉しいです」"
translation = "「역시 회장님, 저에 대해 잘 이해해 주고 계셔서 기뻐요」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「でも……普通に犯されるだけだと思わないでくださいね？」"
translation = "「하지만…… 그냥 평범하게 범해질 뿐이라고 생각하지는 말아 주세요?」"

[[dialogue]]
speaker = "unk"
original = "イクシリオンがそう言って不敵に笑うと、下腹部の文様が妖しく光る。"
translation = "익실리온이 그렇게 말하며 불적하게 웃자, 하복부의 문양이 요염하게 빛난다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「──！？」"
translation = "「──!?」"

[[dialogue]]
speaker = "unk"
original = "目の前がまばゆい光に包まれて……"
translation = "눈앞이 눈부신 빛에 싸이고……"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ふふふ……色欲の魔将の領域にようこそ」"
translation = "「후후후…… 색욕의 마장의 영역에 오신 것을 환영해요」"

[[dialogue]]
speaker = "unk"
original = "気付けば俺は裸に剥かれ、イクシーに組み敷かれていた。"
translation = "정신을 차려보니 나는 알몸으로 벗겨져, 익시에게 짓눌려 있었다."

[[dialogue]]
speaker = "unk"
original = "だけど驚いたのはそれだけではない。"
translation = "하지만 놀란 것은 그뿐만이 아니었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「イクシリオンが２人……！？」"
translation = "「익실리온이 2명……!?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「魔将ともなれば、分身を生み出すなど容易いことです。深淵書庫の中であれば特に」"
translation = "「마장쯤 되면, 분신을 만들어내는 것 정도는 쉬운 일이에요. 심연서고 안이라면 특히나 더요」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ふふふ……会長も一度は想像したことがあるんじゃないですか？\u3000裸の女に囲まれて、肉欲に溺れたい……なんて」"
translation = "「후후후…… 회장님도 한 번쯤은 상상해 본 적 있지 않나요? 알몸의 여자에게 둘러싸여, 육욕에 빠지고 싶다…… 같은 거」"

[[dialogue]]
speaker = "unk"
original = "２人のイクシーが交互に喋る。"
translation = "2명의 익시가 번갈아 가며 말한다."

[[dialogue]]
speaker = "unk"
original = "俺に跨ったイクシーは獲物を狙う捕食者の表情を浮かべ、胸を押し付けるイクシーは誘うように微笑む。"
translation = "나를 올라탄 익시는 먹잇감을 노리는 포식자의 표정을 지었고, 가슴을 밀어붙이는 익시는 유혹하듯 미소 짓는다."

[[dialogue]]
speaker = "unk"
original = "確かにイクシーはかわいくて、胸も大きくて、魅力的な女の子だ。"
translation = "확실히 익시는 귀엽고, 가슴도 크고, 매력적인 여자아이다."

[[dialogue]]
speaker = "unk"
original = "そんな彼女が２人で迫ってきて、圧倒的な肉感に否応なしに興奮が高まってしまう。"
translation = "그런 그녀가 2명이나 다가오니, 압도적인 육감에 어쩔 수 없이 흥분이 고조되어 버린다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ほぉら、会長の大好きなおっぱいですよ♪」"
translation = "「자아, 회장님이 정말 좋아하는 가슴이에요♪」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「んぶっ……」"
translation = "「읍……」"

[[dialogue]]
speaker = "unk"
original = "イクシーが自分の乳首を、俺の口に含ませてくる。"
translation = "익시가 자신의 젖꼭지를, 내 입에 물려온다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あぁん<emoji=heart04>\u3000おっぱいちゅうちゅう吸って、かわいい<emoji=heart04>\u3000赤ちゃんみたいですね<emoji=heart04>」"
translation = "「아앙<emoji=heart04> 가슴 쪽에쪽 빨고, 귀여워<emoji=heart04> 아기 같네요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "誘惑されているとわかっているのに、抗えずに胸を吸ってしまう。"
translation = "유혹당하고 있다는 것을 알면서도, 거부하지 못하고 가슴을 빨고 만다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「おっぱい吸って、会長のおち○ぽガチガチになってますね<emoji=heart04>\u3000ふふ、とっても美味しそう<emoji=heart04>」"
translation = "「가슴을 빨아서, 회장님의 자지가 딱딱하게 되었네요<emoji=heart04> 후후, 정말 맛있어 보여요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「それじゃあ……会長のおち○ぽ、いただきます<emoji=heart04>」"
translation = "「그러면…… 회장님의 자지, 잘 먹겠습니다<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシリオンはペロリと唇を舐めると、一気に腰を落として──"
translation = "익실리온은 낼름 입술을 핥더니, 한 번에 허리를 내리씻어──"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ふぁああ～～～っ<emoji=heart04><emoji=heart04>\u3000会長のおち○ぽで、おま○こ広がってます……っ<emoji=heart04>」"
translation = "「하아아아～～～읏<emoji=heart04><emoji=heart04> 회장님의 자지로, 보지가 넓어지고 있어요……읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーの性器がペニスを呑み込み、愛液でトロトロの粘膜が絡みついてくる。"
translation = "익시의 성기가 페니스를 삼키고, 애액으로 걸쭉해진 점막이 얽혀온다."

[[dialogue]]
speaker = "unk"
original = "それと同時に、口内に何か液体が広がるのを感じた。"
translation = "그와 동시에, 입안에 무언가 액체가 퍼지는 것을 느꼈다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「んんっ……！？\u3000何だ……？\u3000少し甘いような……」"
translation = "「응읏……!? 뭐야……? 약간 단 것 같은……」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ふふ、魔将の力で母乳も出せるようになったんですよ<emoji=heart04>\u3000お味はいかがです？」"
translation = "「후후, 마장의 힘으로 모유도 나올 수 있게 되었어요<emoji=heart04> 맛은 어떠신가요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「──っ！？」"
translation = "「──읏!?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はあぁんっ<emoji=heart04>\u3000母乳を飲んで、おち○ぽ大きくなってますね<emoji=heart04>\u3000ドクンドクンって脈打って気持ちいいです<emoji=heart04>」"
translation = "「하아앙읏<emoji=heart04> 모유를 마시고, 자지가 커지고 있네요<emoji=heart04> 쿵쾅쿵쾅 맥박쳐서 기분 좋아요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "体が熱くなり、心臓も速く鼓動を打つ。イクシーの母乳は媚薬だ。"
translation = "몸이 뜨거워지고, 심장도 빠르게 뛰기 시작한다. 익시의 모유는 미약이다."

[[dialogue]]
speaker = "unk"
original = "ペニスが敏感になり、膣肉に包まれているだけで射精しそうになる。"
translation = "페니스가 민감해져, 질살에 싸여 있는 것만으로 사정할 것 같아진다."

[[dialogue]]
speaker = "unk"
original = "なのにこのまま動かれたら……"
translation = "그런데 이대로 움직인다면……"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「それじゃあ……動きますね<emoji=heart04>」"
translation = "「그러면…… 움직일게요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あはぁっ<emoji=heart04>\u3000はぁ、ああぁんっ<emoji=heart04>\u3000さぁ、たくさん感じてください、会長<emoji=heart04>」"
translation = "「아하앗<emoji=heart04> 하아, 아아앙읏<emoji=heart04> 자, 듬뿍 느껴주세요, 회장님<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くああぁっ！\u3000待っ──ううぅっ……！」"
translation = "「크아아앗! 잠까──으으읏……!」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「うふふ、いいお顔ですよ<emoji=heart04>\u3000快感と苦悶が混じった表情、素敵です<emoji=heart04>\u3000はあぁ、はっ……ふあぁっ、あんっ<emoji=heart04>」"
translation = "「우후후, 좋은 표정이에요<emoji=heart04> 쾌감과 번민이 섞인 표정, 멋져요<emoji=heart04> 하아아, 하앗……후아앗, 아앙<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーの膣内は極上の柔らかさと熱さで、さらに膣内の肉ひだが不規則な刺激を与えてくる。"
translation = "익시의 질내는 극상의 부드러움과 뜨거움으로, 거기에 질내의 주름이 불규칙한 자극을 준다."

[[dialogue]]
speaker = "unk"
original = "色欲の魔将の力のせいか、イクシーの膣は男に快楽を与えることに特化した器官と化しており、敏感になったペニスと摩擦して意識がショートしそうだ。"
translation = "색욕의 마장의 힘 때문인지, 익시의 질은 남자에게 쾌락을 주는 것에 특화된 기관으로 변해 있어, 민감해진 페니스와 마찰하며 의식이 쇼트될 것 같다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はぁっ、はっ……はああぁっ<emoji=heart04>\u3000会長のおち○ぽ大きい<emoji=heart04>\u3000おち○ぽ太くて、硬くて、気持ちいいですぅ<emoji=heart04>」"
translation = "「하앗, 하앗……하아아앗<emoji=heart04> 회장님의 자지 커요<emoji=heart04> 자지가 굵고, 굵고, 기분 좋아요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あっ<emoji=heart04>\u3000あぁっ<emoji=heart04>\u3000ああぁんっ<emoji=heart04>\u3000おま○こ気持ちいい<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000深いところ当たってます<emoji=heart04>\u3000あぁんっ<emoji=heart04>」"
translation = "「앗<emoji=heart04> 아앗<emoji=heart04> 아아앙읏<emoji=heart04> 보지 기분 좋아<emoji=heart04> 하아앗<emoji=heart04> 깊은 곳 닿고 있어요<emoji=heart04> 아앙읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "あえて卑猥な言葉を使い、大きな胸を揺らしながら腰を振るイクシー。"
translation = "일부러 외설적인 말을 사용하며, 큰 가슴을 흔들면서 허리를 흔드는 익시."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あぁん、私も相手してください<emoji=heart04>\u3000寂しいですよ～<emoji=heart04>」"
translation = "「아앙, 저도 상대해 주세요<emoji=heart04> 외롭다고요～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "もう１人のイクシーは、甘く媚びた声を出しながらまた胸を押し付けてくる。"
translation = "또 다른 익시는, 달콤하게 아양 떨며 다시 가슴을 밀어붙인다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「私のおっぱい、たくさん飲んでくださいね～<emoji=heart04>」"
translation = "「제 가슴, 듬뿍 마셔주세요～<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「むぐっ……」"
translation = "「으귯……」"

[[dialogue]]
speaker = "unk"
original = "乳首から母乳がぴゅっと噴き出て、ほのかに甘い味が口の中に広がる。"
translation = "젖꼭지에서 모유가 뿜어져 나와, 은은하게 단맛이 입안에 퍼진다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「会長がおっぱいちゅうちゅう吸って……はあぁ～～<emoji=heart04>\u3000おっぱい飲んでもらうの好きぃ<emoji=heart04>\u3000気持ちいい<emoji=heart04>」"
translation = "「회장님이 가슴 쪽에쪽 빨아서……하아아～～<emoji=heart04> 가슴 마셔주는 거 좋아<emoji=heart04> 기분 좋아<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あんんっ<emoji=heart04>\u3000会長のおっぱいですから、好きなだけ飲んでいいんですよ<emoji=heart04>\u3000ふふふ<emoji=heart04>」"
translation = "「아앙읏<emoji=heart04> 회장님의 가슴이니까, 원하는 만큼 마셔도 돼요<emoji=heart04> 후후후<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "これ以上飲んではいけないとわかっているのに、体が勝手に動いて母乳を飲む。"
translation = "이 이상 마시면 안 된다는 것을 알면서도, 몸이 제멋대로 움직여 모유를 마신다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「私のおっぱい、美味しいですか～？」"
translation = "「제 가슴, 맛있나요～？」"

[[dialogue]]
speaker = "unk"
original = "見えない糸で操られるようにこくこくと頷く。俺の体なのに、もう自由にならない。"
translation = "보이지 않는 실에 조종당하듯 끄덕끄덕 고개를 끄덕인다. 내 몸인데도, 더 이상 마음대로 되지 않는다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ふふ、嬉しい<emoji=heart04>\u3000一生懸命お乳飲んでかわいいですね～<emoji=heart04>\u3000いい子いい子<emoji=heart04>」"
translation = "「후후, 기뻐요<emoji=heart04> 열심히 젖 마셔서 귀엽네요～<emoji=heart04> 착하다 착해<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーが授乳しながら、甘い声で俺を嘲笑する。"
translation = "익시가 수유하면서, 달콤한 목소리로 나를 비웃는다."

[[dialogue]]
speaker = "unk"
original = "屈辱的なはずなのに、余計に体の熱が増していく。"
translation = "굴욕적이어야 정상인데, 도리어 몸의 열기가 더해져 간다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ひぃああぁっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000おっぱい飲みながら、おち○ぽビクビクさせて、会長は変態さんですね<emoji=heart04>」"
translation = "「히아아앗<emoji=heart04> 앗<emoji=heart04> 가슴 마시면서, 자지 쿵쾅거리게 하고, 회장님은 변태씨네요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ふふふっ<emoji=heart04>\u3000魔王様ともあろう方が、なす術なくいいようにされて、かわいらしいです<emoji=heart04>」"
translation = "「후후후<emoji=heart04> 마왕님이신 분이, 어쩔 도리 없이 이리저리 휘둘려서, 귀여우시네요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はぁ、はっ<emoji=heart04>\u3000もっともっと、気持ち良くしてあげますね<emoji=heart04>\u3000──えいっ<emoji=heart04>」"
translation = "「하아, 하앗<emoji=heart04> 더욱더, 기분 좋게 해드릴게요<emoji=heart04> ──얍<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーの下腹部に刻まれた文様が光り、膣壁が急激にペニスを締め付ける。"
translation = "익시의 하복부에 새겨진 문양이 빛나고, 질벽이 급격하게 페니스를 조여온다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くあああっ……！」"
translation = "「쿠아아앗……!」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はあぁ～～～<emoji=heart04>\u3000どうです？\u3000私のおま○こ、最高に気持ちいいでしょう？\u3000色欲の魔将の力で、とっても具合がよくなってますからっ<emoji=heart04>」"
translation = "「하아아~~~<emoji=heart04> 어때요? 제 보지, 최고로 기분 좋죠? 색욕의 마장의 힘으로 아주 착착 감기게 되었으니까요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「色欲おま○こ、た～っぷり味わわせてあげます<emoji=heart04>\u3000えいっ<emoji=heart04>\u3000えいっ<emoji=heart04>」"
translation = "「색욕 보지, 듬~뿍 맛보게 해드릴게요<emoji=heart04> 에잇<emoji=heart04> 에잇<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーが下腹に力を込める度、熱々に蕩けた粘膜がペニスを絞る。"
translation = "익시가 하복부에 힘을 줄 때마다, 뜨겁게 녹아내린 점막이 페니스를 쥐어짜낸다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「まだまだお乳出ますよ～<emoji=heart04>\u3000イクシーミルク、お腹いっぱい飲んでください<emoji=heart04>」"
translation = "「아직 젖 더 나와요~<emoji=heart04> 익시 밀크, 배부르게 마셔주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「んん……むぐっ……」"
translation = "「응응…… 읍……」"

[[dialogue]]
speaker = "unk"
original = "母乳の量が増し、口の中がミルクの味でいっぱいになる。"
translation = "모유의 양이 늘어나, 입안이 우유 맛으로 가득 찬다."

[[dialogue]]
speaker = "unk"
original = "限界が近づいてくるが、イクシーが責めを緩めることはない。"
translation = "한계가 다가오지만, 익시가 공세를 줄이는 일은 없다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あんっ<emoji=heart04>\u3000おち○ぽビクビクして爆発しそう<emoji=heart04>\u3000んんっ<emoji=heart04>\u3000いいですよ<emoji=heart04>\u3000おま○こに中出ししてください<emoji=heart04>」"
translation = "「앙<emoji=heart04> 자지 파르르 떨려서 폭발할 것 같아요<emoji=heart04> 응응<emoji=heart04> 좋아요<emoji=heart04> 보지에 안에 싸주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「色欲の魔将の、極上おま○こで受け止めてあげますから<emoji=heart04>\u3000あっ<emoji=heart04>\u3000ああぁんっ<emoji=heart04>\u3000出してください<emoji=heart04>\u3000ふぁあっ──あ──ああ──」"
translation = "「색욕의 마장의 극상 보지로 받아내 줄 테니까요<emoji=heart04> 아<emoji=heart04> 아아앙<emoji=heart04> 싸주세요<emoji=heart04> 후아앗──아──아아──」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はああぁあああ<emoji=heart04><emoji=heart04>\u3000精液ドクドク出てますぅ～～<emoji=heart04><emoji=heart04>」"
translation = "「하아아아아아<emoji=heart04><emoji=heart04> 정액 꿀렁꿀렁 나오고 있어요~~<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぐぅうううううっ……！！」"
translation = "「구우우우우우욱……!!」"

[[dialogue]]
speaker = "unk"
original = "俺が達すると同時に、膣がぎゅっと締まり、<ruby>蠕動<rt>ぜんどう</rt></ruby>して精液を搾り取る。"
translation = "내가 사정함과 동시에 질이 꽉 조여지며, <ruby>꿈틀거려<rt>연동하여</rt></ruby> 정액을 쥐어짜 낸다."

[[dialogue]]
speaker = "unk"
original = "頭が壊れるかと思うほどの快楽が俺の脳天を焼いた。"
translation = "머리가 부서질 것 같은 쾌락이 나의 정수리를 태웠다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はああぁ<emoji=heart04>\u3000た～っぷりお射精できましたね<emoji=heart04>\u3000はぁ<emoji=heart04>\u3000会長の精液で、子宮が熱いです<emoji=heart04>」"
translation = "「하아아<emoji=heart04> 듬~뿍 사정하셨네요<emoji=heart04> 하아<emoji=heart04> 회장님의 정액으로 자궁이 뜨거워요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「おっぱい飲みながら射精するの、気持ち良かったですか？\u3000ふふ、とっても幸せそうなお顔でしたよ<emoji=heart04>」"
translation = "「가슴 마시면서 사정하는 거, 기분 좋았나요? 후후, 엄청 행복해 보이는 얼굴이었어요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "しかし俺が一度達したにもかかわらず、イクシーは止まることなく、むしろ激しくなるばかりで──"
translation = "하지만 내가 한 번 사정했음에도 불구하고, 익시는 멈추지 않고 오히려 격렬해질 뿐이라──"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はっ、ああぁっ<emoji=heart04>\u3000これからが気持ちいいところですからね<emoji=heart04>\u3000うふふ、ふふふ<emoji=heart04>\u3000もっと気持ちよくなりましょう？」"
translation = "「하, 아아앗<emoji=heart04> 지금부터가 기분 좋을 때니까요<emoji=heart04> 우후후, 후후후<emoji=heart04> 더욱 기분 좋아져 볼까요?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はあぁあ～～～っ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000はぁっ<emoji=heart04>\u3000んん～～～っ<emoji=heart04>」"
translation = "「하아아~~~앗<emoji=heart04> 아<emoji=heart04> 아<emoji=heart04> 아<emoji=heart04> 하앗<emoji=heart04> 응응~~~앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はぁっ<emoji=heart04>\u3000はっ<emoji=heart04>\u3000おち○ぽ太いっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んんんっ<emoji=heart04>\u3000おま○こ気持ちいいっ<emoji=heart04>\u3000おち○ぽ好きぃ<emoji=heart04>」"
translation = "「하앗<emoji=heart04> 하<emoji=heart04> 자지 두꺼워<emoji=heart04> 앙<emoji=heart04> 응응앗<emoji=heart04> 보지 기분 좋아<emoji=heart04> 자지 좋아아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーが叩きつけるように腰を上下させ、射精したばかりのペニスを嬲る。"
translation = "익시가 내리치듯 허리를 위아래로 움직이며, 방금 사정한 페니스를 농락한다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ま、待って……ぁぐっ、壊れる、壊れるから……！」"
translation = "「기, 기다려…… 윽, 망가져, 망가지니까……!」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はぁ<emoji=heart04>\u3000それは、気持ちいい時に言うセリフじゃ、ないですかぁ<emoji=heart04>\u3000はっ<emoji=heart04>\u3000んんぁっ<emoji=heart04>\u3000もっとしてほしいって、ことですよね<emoji=heart04>」"
translation = "「하아<emoji=heart04> 그거, 기분 좋을 때 하는 대사가 아닌가요~<emoji=heart04> 하<emoji=heart04> 응응앗<emoji=heart04> 더 해달라는 뜻이죠<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ち、ちが──」"
translation = "「아, 아니──」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「違いません<emoji=heart04>」"
translation = "「아니지 않아요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "また膣壁が収縮し、きゅっとペニスを締め付けた。"
translation = "다시 질벽이 수축하며, 꽉 페니스를 조여왔다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あぁああっ！？」"
translation = "「아아아앗!?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ああ<emoji=heart04>\u3000いい声<emoji=heart04>\u3000んんはぁ、あっ<emoji=heart04>\u3000その声、もっと聞かせてください<emoji=heart04>\u3000気持ちいい顔、もっと見せてください<emoji=heart04>」"
translation = "「아아<emoji=heart04> 좋은 목소리<emoji=heart04> 응응하, 아<emoji=heart04> 그 목소리, 더 들려주세요<emoji=heart04> 기분 좋은 얼굴, 더 보여주세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そうだ。気持ちいい。これ以上ないくらい気持ちいい。"
translation = "그렇다. 기분 좋다. 이 이상 없을 정도로 기분 좋다."

[[dialogue]]
speaker = "unk"
original = "だけどダメだ。このままでは快楽に壊される。そんな恐怖が迫る。"
translation = "하지만 안 돼. 이대로는 쾌락에 망가져 버린다. 그런 공포가 덮쳐온다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はあぁ<emoji=heart04>\u3000私のミルク、いっぱい飲んでください<emoji=heart04>」"
translation = "「하아아<emoji=heart04> 제 우유, 많이 마셔주세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "顔いっぱいに胸を押し付けられ、柔らかいおっぱいに埋もれながら、母乳を飲まされる。"
translation = "얼굴 가득 가슴이 밀착되고, 부드러운 젖가슴에 파묻힌 채 모유를 마시게 된다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「んんはあぁ<emoji=heart04>\u3000ミルク飲んでもらうの、気持ちいい<emoji=heart04>\u3000おっぱいジンジンして、熱いぃ<emoji=heart04>」"
translation = "「응응하아<emoji=heart04> 우유 마셔주는 거, 기분 좋아<emoji=heart04> 가슴 찌릿찌릿해서, 뜨거워어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "もう１人のイクシーは母乳を飲ませながら、ぶるりと身を震わせ、恍惚とした表情を浮かべる。"
translation = "또 한 명의 익시는 모유를 먹이면서, 덜컥 몸을 떨며 황홀한 표정을 짓는다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ん、んん……はあぁ<emoji=heart04>\u3000ちゅうちゅうって、強く吸ってください<emoji=heart04>\u3000ふああぁっ<emoji=heart04>」"
translation = "「응, 응응…… 하아아<emoji=heart04> 쪽쪽 하고, 강하게 빠아주세요<emoji=heart04> 후아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "吸う度にミルクが甘くなり、量も増して、飲めば飲むほどもっと欲しくなる。"
translation = "빨 때마다 우유가 달콤해지고 양도 늘어나, 마시면 마실수록 더 원하게 된다."

[[dialogue]]
speaker = "unk"
original = "口の中にイクシーのミルクが溢れ、また情欲が破裂しそうに膨らんでいく。"
translation = "입안에 익시의 우유가 넘쳐흐르고, 다시 정욕이 터질 듯이 부풀어 오른다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はああぁっ<emoji=heart04>\u3000お腹の奥<emoji=heart04>\u3000キュンキュンしてっ<emoji=heart04>\u3000子宮、疼いてます<emoji=heart04>\u3000ふわぁあっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000はあぁんっ<emoji=heart04>」"
translation = "「하아아앗<emoji=heart04> 배 속 깊은 곳<emoji=heart04> 쿵쾅거려서<emoji=heart04> 자궁, 욱신거리고 있어요<emoji=heart04> 후와아앗<emoji=heart04> 아<emoji=heart04> 하아앙앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーがぐっと腰を落とし、子宮口と亀頭がぶつかる。"
translation = "익시가 푹 허리를 낮추자, 자궁구와 귀두가 부딪친다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ひぁああ～～～～っ<emoji=heart04><emoji=heart04>」"
translation = "「히아아아~~~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うぅあぁあっ！？」"
translation = "「으아아앗!?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「んんぁあっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000おち○ぽに子宮が当たってるの、わかります？\u3000わかりますよね<emoji=heart04>」"
translation = "「응응아앗<emoji=heart04> 아<emoji=heart04> 앙<emoji=heart04> 자지에 자궁이 닿는 거, 알겠나요? 알겠죠<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ひぃああぁっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000おち○ぽドクドク脈打ってます<emoji=heart04>\u3000んはぁ<emoji=heart04>\u3000あぁっ<emoji=heart04>\u3000私を、孕ませたいんですよね？」"
translation = "「히아아아앗<emoji=heart04> 앙<emoji=heart04> 자지 맥박치고 있어요<emoji=heart04> 응하<emoji=heart04> 아앗<emoji=heart04> 저를, 임신시키고 싶은 거죠?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はああぁっ<emoji=heart04>\u3000ぁっ<emoji=heart04>\u3000想像してみてくださいっ<emoji=heart04>\u3000私が、お腹大きくしてるの<emoji=heart04>\u3000受精して、ボテ腹になってるところ<emoji=heart04>」"
translation = "「하아아앗<emoji=heart04> 앗<emoji=heart04> 상상해 보세요<emoji=heart04> 제가 배 불러있는 모습을<emoji=heart04> 수정돼서 만삭 배가 되어있는 모습을<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「っ…………！！」"
translation = "「읏…………!!」"

[[dialogue]]
speaker = "unk"
original = "思い描いてしまった。イクシーが俺の子を宿した姿を。"
translation = "마음에 떠올리고 말았다. 익시가 내 아이를 밴 모습을."

[[dialogue]]
speaker = "unk"
original = "想像の中だというのに、その美しさと淫靡さに興奮が高まって──"
translation = "상상 속인데도, 그 아름다움과 음란함에 흥분이 고조되어──"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「んん～～っ<emoji=heart04>\u3000おち○ぽ跳ねて、孕ませようとしてるっ<emoji=heart04>\u3000あぁっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>」"
translation = "「응응~~읏<emoji=heart04> 자지 튀어 오르면서, 임신시키려고 하고 있어<emoji=heart04> 아앗<emoji=heart04> 하아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「いいですよ<emoji=heart04>\u3000出してください<emoji=heart04>\u3000はぁ──あっ──ああぁんっ<emoji=heart04>\u3000会長の精液で<emoji=heart04>\u3000私の子宮、いっぱいに、してください<emoji=heart04>」"
translation = "「좋아요<emoji=heart04> 싸주세요<emoji=heart04> 하아──앗──아아앙앗<emoji=heart04> 회장님의 정액으로<emoji=heart04> 제 자궁, 가득, 채워주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ひぁあああっ<emoji=heart04>\u3000おち○ぽ、子宮にゴリゴリ当たって<emoji=heart04>\u3000イク<emoji=heart04>\u3000イッちゃいますぅっ<emoji=heart04>」"
translation = "「히아아아앗<emoji=heart04> 자지, 자궁에 고리고리 닿아서<emoji=heart04> 가버려<emoji=heart04> 가버려요오앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はあぁんっ<emoji=heart04>\u3000ミルク出すの気持ちいい<emoji=heart04>\u3000あっ<emoji=heart04>\u3000おっぱいでイクっ<emoji=heart04>\u3000イクイクっ<emoji=heart04>」"
translation = "「하아앙앗<emoji=heart04> 우유 내는 거 기분 좋아<emoji=heart04> 아<emoji=heart04> 가슴으로 가버려<emoji=heart04> 가버려 가버려<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "腰を振るイクシーだけでなく、授乳しているイクシーも絶頂が近づいていって──"
translation = "허리를 흔드는 익시뿐만 아니라, 수유하고 있는 익시도 절정이 다가와서──"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「んん～～っ<emoji=heart04>\u3000おっぱい熱いぃ<emoji=heart04>\u3000あ<emoji=heart04>\u3000あ<emoji=heart04>\u3000イク<emoji=heart04>\u3000イキますぅ<emoji=heart04>」"
translation = "「응응~~읏<emoji=heart04> 가슴 뜨거워어<emoji=heart04> 아<emoji=heart04> 아<emoji=heart04> 가버려<emoji=heart04> 갑니다아<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はっ──あ──あ──ひあぁあ～～っ<emoji=heart04>\u3000出してっ<emoji=heart04>\u3000出してくださいっ<emoji=heart04>\u3000おま○こに、注いでっ<emoji=heart04>」"
translation = "「하──아──아──히아아아~~앗<emoji=heart04> 싸줘<emoji=heart04> 싸주세요<emoji=heart04> 보지에, 쏟아줘<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000会長の、精液で、孕ませて<emoji=heart04>\u3000あん<emoji=heart04>\u3000イク<emoji=heart04>\u3000イクイクぅ<emoji=heart04>\u3000イッちゃうぅっ<emoji=heart04>」"
translation = "「아<emoji=heart04> 앙<emoji=heart04> 하아앗<emoji=heart04> 회장님의, 정액으로, 임신시켜줘<emoji=heart04> 앙<emoji=heart04> 가버려<emoji=heart04> 가버려 가버려어<emoji=heart04> 가버려어앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ひぁっ──ああぁんっ<emoji=heart04>\u3000イクイクイクイクぅっ<emoji=heart04>\u3000イッくぅぅぅ～～～～～っ<emoji=heart04><emoji=heart04>」"
translation = "「히앗──아아앙앗<emoji=heart04> 가버려 가버려 가버려 가버려어앗<emoji=heart04> 가아아아버어어어어~~~려<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ふぁああ──あ──ひぁあああ～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「후아아아──아──히아아아아~~~~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「んん～～っ<emoji=heart04>\u3000お乳出しながら、イッて──はああぁんっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응응~~읏<emoji=heart04> 젖 내면서, 가버려서──하아아앙앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺が射精するのと同時に、２人のイクシーが絶頂に達した。"
translation = "내가 사정함과 동시에, 두 명의 익시가 절정에 달했다."

[[dialogue]]
speaker = "unk"
original = "１人は子宮で射精を受け止めながら震え、もう１人はぴゅるぴゅると大量に母乳を噴き出す。"
translation = "한 명은 자궁으로 사정을 받아내며 떨고, 다른 한 명은 퓨르륵퓨르륵 대량의 모유를 뿜어낸다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あああぁ<emoji=heart04>\u3000熱いの、子宮に、流れ込んで……ふああっ<emoji=heart04>\u3000んっ、会長の熱を、感じますっ……<emoji=heart04>」"
translation = "「아아아아<emoji=heart04> 뜨거운 게, 자궁으로, 흘러 들어와서…… 후아앗<emoji=heart04> 응, 회장님의 열기를, 느껴요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ひやぁ、あっ、あっ……おっぱい、止まらないぃ<emoji=heart04>\u3000ミルク出すの、いい……ん～～～っ<emoji=heart04>」"
translation = "「히야, 아, 아…… 가슴, 멈추지 않아아<emoji=heart04> 우유 내는 거, 좋아…… 응~~~읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「んっ……んくっ……ぐぅぅっ……！」"
translation = "「응…… 윽…… 구윽……!」"

[[dialogue]]
speaker = "unk"
original = "イクシーの母乳を飲みながら、イクシーの中に精を注ぐ。"
translation = "익시의 모유를 마시면서, 익시의 안에 정액을 쏟아붓는다."

[[dialogue]]
speaker = "unk"
original = "強すぎる快感が、俺を内側から焼いていく。"
translation = "너무나 강렬한 쾌감이, 나를 안쪽에서부터 태워 간다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はああぁ<emoji=heart04>\u3000全部、注いでください<emoji=heart04>\u3000私の子宮に、全部……<emoji=heart04>\u3000んんっ<emoji=heart04>」"
translation = "「하아아아<emoji=heart04> 전부, 쏟아주세요<emoji=heart04> 제 자궁에, 전부……<emoji=heart04> 응응읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーの膣が別の生き物のように蠢き、蕩けた粘膜がぎゅっとペニスに食らいついて搾る。"
translation = "익시의 질이 다른 생물처럼 꿈틀거리고, 녹아내린 점막이 페니스를 꽉 물고 쥐어짠다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぐぁっ……」"
translation = "「구악……」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はああぁ……<emoji=heart04>\u3000おち○ぽドクドクして……ああ、子宮に精液注がれるの、気持ちいい……<emoji=heart04>」"
translation = "「하아아아……<emoji=heart04> 자지 꿀렁꿀렁해서…… 아아, 자궁에 정액 쏟아지는 거, 기분 좋아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "射精が終わってもペニスを締め付けられ続け、最後の一滴まで搾り取られた。"
translation = "사정이 끝났음에도 페니스를 계속 조여대어, 마지막 한 방울까지 쥐어짜였다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ははあぁ……会長の熱で、お腹いっぱい……<emoji=heart04>\u3000子宮熱いです<emoji=heart04>」"
translation = "「하하아…… 회장님의 열기로, 배 가득……<emoji=heart04> 자궁 뜨거워요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ふふ、魔将の力はいかがでしたか？」"
translation = "「후후, 마장의 힘은 어떠셨나요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぅ……うぅ……」"
translation = "「으…… 으으……」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あら、言葉も出ないようですね。ちょっとやりすぎたかもしれません<emoji=heart04>」"
translation = "「어머, 말도 안 나오시는 모양이네요. 조금 지나쳤을지도 모르겠네요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "色欲の魔将の力は身を以て味わった通りで、俺は息も絶え絶えだ。恐るべき力と言う他ない。"
translation = "색욕의 마장의 힘은 몸소 맛본 그대로여서, 나는 숨도 턱턱 막힌다. 두려운 힘이라고밖에 할 수 없다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「本当は魔将の力で排卵することもできたのですが……それはまだ早いですからね。本当の孕ませエッチは楽しみにとっておきます<emoji=heart04>」"
translation = "「사실은 마장의 힘으로 배란할 수도 있었지만…… 그건 아직 이르니까요. 진짜 임신시키기 에치는 즐거움으로 남겨둘게요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ふふふ……このお腹に命を宿す時が待ち遠しいです<emoji=heart04>」"
translation = "「후후후…… 이 배에 생명을 깃들게 할 때가 기다려지네요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "下腹部の文様を光らせながら、イクシーが妖艶に笑む。"
translation = "하복부의 문양을 빛내며, 익시가 요염하게 미소 짓는다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「でもこれで終わりじゃないんですよ？」"
translation = "「하지만 이걸로 끝이 아니라고요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「え……？」"
translation = "「에……?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「力をもっと使いこなせるようになれば、分身も３人、４人……いえもっと増やせるようになると思います」"
translation = "「힘을 더 다룰 수 있게 되면, 분신도 3명, 4명…… 아니, 더 늘릴 수 있게 될 거라고 생각해요」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「その時は、もっとたくさんの私と色欲に溺れましょうね<emoji=heart04>」"
translation = "「그때는, 더 많은 저와 색욕에 빠져들기로 해요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーは純粋に楽しんでいるんだろうけど、俺の身が持つ気がしない。"
translation = "익시는 순수하게 즐기는 거겠지만, 내 몸이 버텨낼 것 같지가 않다."

[[dialogue]]
speaker = "unk"
original = "その未来を想像して、魔将の力を心底恐ろしく思うのだった──"
translation = "그 미래를 상상하고, 마장의 힘을 진심으로 두렵게 생각하는 것이었다──"

