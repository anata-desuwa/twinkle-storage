[[dialogue]]
speaker = "unk"
original = "第４話,霊体らぶちゅっちゅ,P"
translation = "제4화, 영체 러브 쪽쪽, P"

[[dialogue]]
speaker = "unk"
original = "トリュファイナさんと交際を始めてから、俺は彼女の意外な一面を知ることになった──"
translation = "트리파이나 씨와 교제를 시작하고 나서, 나는 그녀의 의외의 일면을 알게 되었다──"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「魔王様。おはようございます」"
translation = "「마왕님. 좋은 아침입니다」"

[[dialogue]]
speaker = "unk"
original = "おはようございます、トリュファイナさん"
translation = "좋은 아침이에요, 트리파이나 씨"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はい♪\u3000今日も１日、世界の平和のため。張り切ってまいりましょう！」"
translation = "「네♪ 오늘 하루도 세계 평화를 위해 힘내서 나아가죠!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「え～っと……今は、誰もいません……よね？」"
translation = "「으~음…… 지금은 아무도…… 안 계시죠?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ん──ちゅっ<emoji=heart04>」"
translation = "「음── 쪽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "っ……！！"
translation = "읏……!!"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふふ～<emoji=heart04>\u3000今日も、魔王様にキスをしてしまいました<emoji=heart04>」"
translation = "「후후~<emoji=heart04> 오늘도 마왕님께 키스를 해버렸네요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そう──トリュファイナさん、キスが大好きなのだ。２人きりだとしょっちゅう、こんな感じに可愛いアプローチをしてくれる。"
translation = "그렇다── 트리파이나 씨는 키스를 정말 좋아한다. 둘만 있게 되면 자주 이런 식으로 귀여운 어프로치를 해 온다."

[[dialogue]]
speaker = "unk"
original = "トリュファイナさん──"
translation = "트리파이나 씨──"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あ……魔王様。んん──<emoji=heart04>」"
translation = "「아…… 마왕님. 음음──<emoji=heart04>」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「お疲れ様です」"
translation = "「수고하셨습니다」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「──ふわあぁああっ！？」"
translation = "「──후와아아앗!?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「おや、トリュファイナさん。おはようございます」"
translation = "「어라, 트리파이나 씨. 좋은 아침입니다」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あ、は、はいっ。アナ様、本日も大変、お日柄が良く……！！」"
translation = "「아, 하, 네! 아나 님, 오늘도 참 날씨가 좋네요……!!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "（あ、危なかったです……何とか見咎められる前に、離れることができました……！）"
translation = "（위, 위험했습니다…… 어떻게든 들키기 전에 떨어질 수 있었어요……!）"

[[dialogue]]
speaker = "unk"
original = "（続きはまた今度ですね）"
translation = "（다음은 또 나중에네요）"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "（そ、そうですね……！\u3000はい、またの機会に……！）"
translation = "（그, 그렇네요……! 네, 다음 기회에……!）"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はあぁ。いけません、いけません……最近、魔王様をお慕いするあまり、気持ちの制御が出来ていません……」"
translation = "「하아아. 안 돼요, 안 돼…… 요즘 마왕님을 너무 사모한 나머지 마음을 제어하지 못하고 있어요……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「神聖な星徒会室でいきなりキスしてしまうだなんて……」"
translation = "「신성한 성도회실에서 갑자기 키스해 버리다니……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「で、でもでも。魔王様を前にすると気持ちが抑えきれないのです……うう。もっとたくさん、キスしたかったです……」"
translation = "「하, 하지만 하지만. 마왕님을 앞에 두면 마음을 억누를 수가 없는걸요…… 으으. 더 많이 키스하고 싶었어요……」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「トリュファイナさん、今よろしいでしょうか？」"
translation = "「트리파이나 씨, 지금 잠시 괜찮으신가요?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ほぇ！？\u3000しゅ、シュティレ様っ。は、はい！\u3000何でしょうかっ」"
translation = "「호에!? 슈, 슈틸레 님. 네, 네! 무슨 일이신가요」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「今お使いになられている義体の件なのですが、マスターが定期メンテナンスを行いたいと仰っています」"
translation = "「지금 사용하고 계신 의체 건인데요, 마스터께서 정기 점검을 진행하고 싶다고 하십니다」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あ……もうそんな時期でしたか」"
translation = "「아…… 벌써 그런 시기인가요」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。なのでご不便かとは思いますが、今日１日は霊体でお過ごしいただいてもよろしいでしょうか？」"
translation = "「네. 그래서 불편하시겠지만, 오늘 하루는 영체로 지내주실 수 있으신가요?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はい。それはもちろん。いつもありがとうございます」"
translation = "「네. 그야 당연히죠. 항상 감사드립니다」"

[[dialogue]]
speaker = "unk"
original = "そうしてトリュファイナは、義体から外に出て、霊体の身となった──"
translation = "그렇게 트리파이나는 의체에서 나와 영체의 몸이 되었다──"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「……ふう。霊体で過ごすのは久しぶりですね」"
translation = "「……후우. 영체로 지내는 건 오랜만이네요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「この状態ですと、物には触れられない……だから読書も、ＤＩＳＣの操作もできません」"
translation = "「이 상태라면 물건을 만질 수 없어요…… 그러니까 독서도, DISC 조작도 못 하고요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「お腹が空かないのは利点ですが……むむむ。どうやって時間を潰しましょうか」"
translation = "「배가 고프지 않은 건 장점입니다만…… 흠흠흠. 어떻게 시간을 때워야 할까요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「……あれ？\u3000そういえば、霊体の私は、例外的に魔王様には触れられる──そして、ほとんどの御方に、私の姿は見えない……」"
translation = "「……어라? 그러고 보니 영체인 저는 예외적으로 마왕님은 만질 수 있고── 그리고 대부분의 분들에게 제 모습이 보이지 않죠……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「──そ、そうですっ！\u3000閃きました！！」"
translation = "「──그, 그래요! 좋은 생각이 떠올랐어요!!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「魔王様。お時間を取っていただき、ありがとうございます♪\u3000久しぶりのデートですね！」"
translation = "「마왕님. 시간 내어 주셔서 감사합니다♪ 오랜만의 데이트네요!」"

[[dialogue]]
speaker = "unk"
original = "ええ。楽しみです！"
translation = "네. 기대돼요!"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「魔王様っ<emoji=heart04>\u3000お近づきのしるしに……」"
translation = "「마왕님<emoji=heart04> 친해진 기념으로……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「──ちゅっ<emoji=heart04>」"
translation = "「──쪽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "誰かに見られたら……あれ？"
translation = "누군가한테 보이면…… 어라?"

[[dialogue]]
speaker = "unk"
original = "──！？"
translation = "──!?"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふふふ♪\u3000実は私、今は霊体なのです！\u3000義体のメンテナンスが必要と言われまして……」"
translation = "「후후후♪ 사실 저, 지금은 영체랍니다! 의체 점검이 필요하다고 하셔서……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「それで、思ったのです。この状態ならば、このような往来でも誰にも見られない！\u3000魔王様にもキスをし放題であると！」"
translation = "「그래서 생각했어요. 이 상태라면 이런 길거리라도 아무에게도 보이지 않아요! 마왕님께 키스도 마음껏 할 수 있다고요!」"

[[dialogue]]
speaker = "unk"
original = "（なんてキラキラした笑顔なんだ……！！）"
translation = "（어쩜 이렇게 반짝이는 미소인 거지……!!）"

[[dialogue]]
speaker = "unk"
original = "な、なんと……！！"
translation = "이, 세상에……!!"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「昔は霊体であることを、不便で悲しいことだと思っておりましたが……今はもう違います」"
translation = "「예전에는 영체인 것을 불편하고 슬픈 일이라고 생각했었습니다만…… 지금은 달라요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「魔王様と存分にイチャイチャできる……これを僥倖と言わずして、何と言いましょう！」"
translation = "「마왕님과 마음껏 꽁냥거릴 수 있다니…… 이것이야말로 행운이라 하지 않고 무엇이라 하겠어요!」"

[[dialogue]]
speaker = "unk"
original = "ちょっぴり変わったデートになりそうですね"
translation = "조금 색다른 데이트가 될 것 같네요"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「はい♪\u3000街をお散歩しながら、いっぱい『いちゃいちゃ』いたしましょう<emoji=heart04>」"
translation = "「네♪ 거리 산책을 하면서 듬뿍 『꽁냥꽁냥』해요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "トリュファイナさんは光の魔女ということもあり、生前は自由な外出もほとんどできなかったと聞く。"
translation = "트리파이나 씨는 빛의 마녀이기도 해서, 생전에는 자유롭게 외출조차 거의 못 했다고 들었다."

[[dialogue]]
speaker = "unk"
original = "だから俺は、彼女がしたいと思うことは、できる限り付き合いたいと思っている──"
translation = "그래서 나는 그녀가 하고 싶어 하는 일이라면 가능한 한 함께해 주고 싶다고 생각한다──"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「魔王様～<emoji=heart04>\u3000ふふふ、ぎゅー<emoji=heart04>」"
translation = "「마왕님～<emoji=heart04> 후후후, 꼬옥<emoji=heart04>」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「夢のようです♪\u3000誰かに見られることも気にせず、腕を組んで歩けるだなんて……<emoji=heart04>」"
translation = "「꿈만 같아요♪ 누군가에게 들키는 것도 신경 쓰지 않고, 팔짱을 끼고 걸을 수 있다니……<emoji=heart04>」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「魔王様も嬉しい……ですか？\u3000私とのデート、楽しんでいただけているのですね。嬉しいです<emoji=heart04>」"
translation = "「마왕님도 기쁘……신가요? 저와의 데이트, 즐겨주시는 거군요. 기뻐요<emoji=heart04>」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「えへ……ほっぺに、ちゅー<emoji=heart04>」"
translation = "「에헤…… 볼에, 쪽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ほっぺにちゅー……！"
translation = "볼에 쪽……!"

[[dialogue]]
speaker = "unk"
original = "……俺もお返ししますよ"
translation = "……저도 답례할게요"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「きゃあ<emoji=heart04>\u3000ふふふ♪\u3000魔王様、魔王様っ<emoji=heart04>」"
translation = "「캐앗<emoji=heart04> 후후후♪ 마왕님, 마왕님<emoji=heart04>」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「私──今、とっても幸せです♪」"
translation = "「저── 지금, 너무나도 행복해요♪」"

[[dialogue]]
speaker = "unk"
original = "そのままトリュファイナさんと、繁華街の色々なところを巡った。"
translation = "그대로 트리파이나 씨와 번화가의 여러 곳을 둘러보았다."

[[dialogue]]
speaker = "unk"
original = "雑貨店をひやかしたり、公園でまったりしたり。"
translation = "잡화점을 구경하기도 하고, 공원에서 한가롭게 쉬기도 하면서."

[[dialogue]]
speaker = "unk"
original = "もちろんトリュファイナさんは、事あるごとに俺にキスをねだってきて……"
translation = "물론 트리파이나 씨는 기회가 될 때마다 내게 키스를 졸라대고……"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふふ～、堪能いたしました♪\u3000とっても素敵なデートでした、魔王様<emoji=heart04>」"
translation = "「후후～, 실껏 만끽했답니다♪ 매우 멋진 데이트였어요, 마왕님<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "一生分、キスした気がしますね"
translation = "평생 치를 키스를 다 한 기분이네요"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「霊体デート、これは可能性を感じます。これからも折に触れて、してみたいですね♪」"
translation = "「영체 데이트, 이거 가능성이 느껴지네요. 앞으로도 틈나는 대로 해보고 싶어요♪」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「魔王様、最後にあと１回だけ……んー<emoji=heart04>」"
translation = "「마왕님, 마지막으로 딱 한 번만 더…… 음─<emoji=heart04>」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「──ちゅ～<emoji=heart04>」"
translation = "「──쪽～<emoji=heart04>」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「……………………はあ」"
translation = "「……………………하아」"

[[dialogue]]
speaker = "unk"
original = "──アナ！？"
translation = "──아나!?"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「…………ほぇ！？\u3000あ、ああ、アナ様！？」"
translation = "「…………호에!? 아, 아아, 아나 님!?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「どうも。奇遇ですね」"
translation = "「안녕하세요. 우연이네요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「え、ええっと……今の。見られて、ましたか……？」"
translation = "「에, 에또…… 방금 거. 보셨, 나요……?」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「はい。見てしまいました。人目をはばからないいちゃつきっぷりでしたね、お２人とも」"
translation = "「네. 보고 말았습니다. 남들 시선은 아랑곳하지 않고 꽁냥거리셨네요, 두 분 다」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あ、あの、えっと──！」"
translation = "「아, 저기, 그게──!」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「いくら霊体だからといってハメを外しすぎでは……？\u3000義体を脱いでも、トリュファイナさんを知覚できる者は僅かとはいえ、いるのですから……」"
translation = "「아무리 영체라고 해도 너무 고삐를 푸신 건 아닌지……? 의체를 벗어도 트리파이나 씨를 지각할 수 있는 자는 근소하게나마 있으니까요……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「そ、そそ──そう、です──ね……」"
translation = "「그, 그래── 그렇, 네요……」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「はい。度を越えたいちゃつきは、せめて星徒会室の中だけにしていただけると助かります」"
translation = "「네. 정도를 넘어선 꽁냥거림은 적어도 성도회실 안에서만 해주시면 감사하겠습니다」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「そっちもバレてたんですかぁ！？\u3000そそそっ、そんなぁ～～～っ！？」"
translation = "「그쪽도 들킨 건가요!? 그그그, 그런~~!?」"

[[dialogue]]
speaker = "unk"
original = "トリュファイナさんは、キスが大好き。けれど同時に、常識人な魔女でもある──"
translation = "트리파이나 씨는 키스를 매우 좋아한다. 하지만 동시에, 상식적인 마녀이기도 하다──"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「わ、わわ、私っ……なんてことを～……！？」"
translation = "「아, 아아, 나…… 무슨 짓을～……!?」"

[[dialogue]]
speaker = "unk"
original = "それからしばらくの間、トリュファイナさんは俺を見るたびに駆けだすようになってしまうのだった──"
translation = "그 후 한동안 트리파이나 씨는 나를 볼 때마다 도망쳐 버리게 되는 것이었다──"

