[[dialogue]]
speaker = "unk"
original = "星徒会長として夜の学園のパトロールをしていると──"
translation = "성도회장으로서 밤의 학원을 순찰하고 있자니──"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「会長さん、ちょっと」"
translation = "「회장님, 잠깐」"

[[dialogue]]
speaker = "unk"
original = "ナターシャに腕を引かれ、連れていかれた先は閉店後のカフェテリアだった。"
translation = "나타샤에게 팔을 끌려, 이끌려간 곳은 문을 닫은 카페테리아였다."

[[dialogue]]
speaker = "unk"
original = "閉店後の店内には誰もおらず、俺とナターシャのふたりきり。"
translation = "영업이 끝난 가게 안에는 아무도 없었고, 나와 나타샤 단둘뿐."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「こんなところで何を……？」"
translation = "「이런 곳에서 뭘……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「場所はどこでもいいんだよ。手っ取り早く、ふたりきりになれるのがここだったってだけ」"
translation = "「장소는 어디든 상관없어. 재빨리, 단둘이 될 수 있는 곳이 여기였을 뿐이야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「何か言われたら、会長の権限で揉み消しておいて。私が消そうとすると、荒事になりかねないからね」"
translation = "「무슨 소리를 들으면, 회장의 권한으로 무마해 줘. 내가 없애려고 하면, 거친 일이 될지도 모르니까」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ナターシャが言うと物騒だなぁ……」"
translation = "「나타샤가 말하니까 험악하네……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「最近、会長さんの熱視線がずーっと気になってるんだ。特に胸元」"
translation = "「요즘, 회장님의 뜨거운 시선이 계속 신경 쓰였단 말이지. 특히 가슴께」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ギクッ」"
translation = "「찔끔」"

[[dialogue]]
speaker = "unk"
original = "ついナターシャのおっぱいに目が吸い寄せられてしまう。ヴァンパイアに扮したハロウィンフォームのせいなのもあってか、魅了の術でもかかっているみたいに。"
translation = "나도 모르게 나타샤의 가슴으로 눈길이 끌려가 버린다. 뱀파이어로 분장한 할로윈 폼 때문이기도 한 탓인지, 매료 술법이라도 걸려 있는 것처럼."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「どうしよっかな～……？\u3000正直に言えば、このおっぱいで気持ち良くしてあげてもいいんだけどな～」"
translation = "「어떡할까나～……? 솔직하게 말하면, 이 가슴으로 기분 좋게 해줄 수도 있는데 말이지～」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ごめんなさいナターシャのおっぱいが気になってチラチラ見てました。あとガン見してた時もありました」"
translation = "「죄송합니다 나타샤의 가슴이 신경 쓰여서 힐끔힐끔 보고 있었습니다. 그리고 뚫어지게 쳐다보고 있었을 때도 있었습니다」"

[[dialogue]]
speaker = "unk"
original = "ナターシャの誘惑の前に、秒で陥落していた。"
translation = "나타샤의 유혹 앞에, 순식간에 함락당해 있었다."

[[dialogue]]
speaker = "unk"
original = "いや、秒もかからなかった。それだけナターシャのおっぱいは魅力的だ。"
translation = "아니, 몇 초도 걸리지 않았다. 그만큼 나타샤의 가슴은 매력적이다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうなんだ～。何度も抱いてるんだし、私の体なんてそろそろ見飽きてもいい頃なのにね？」"
translation = "「그렇구나～. 몇 번이고 안았는데, 내 몸 같은 건 이제 질릴 때도 됐을 텐데 말이야?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「見飽きるなんてありえないよ。むしろますます目が離せなくなる」"
translation = "「질린다니 말도 안 돼. 오히려 점점 눈을 뗄 수 없게 된다고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「へぇ、嬉しいこと言ってくれるじゃん」"
translation = "「헤에, 기쁜 소리를 해주잖아」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「それじゃ約束通り、私のおっぱいで気持ち良くしてあげる<emoji=heart04>」"
translation = "「그럼 약속대로, 내 가슴으로 기분 좋게 해줄게<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はぁ。なんで私、あなたみたいな男に体を許しちゃったのかなー」"
translation = "「하아. 어째서 나, 너 같은 남자한테 몸을 허락해 버린 걸까나-」"

[[dialogue]]
speaker = "unk"
original = "ナターシャは言葉とは裏腹にいたずらっぽい笑みを浮かべながら、俺の脚の間に潜り込む。"
translation = "나타샤는 말과는 달리 장난스러운 미소를 지으며, 내 다리 사이로 파고든다."

[[dialogue]]
speaker = "unk"
original = "そのあまりに大きなおっぱいを見ただけで──いや、とっくの前に俺のペニスは激しく怒張していた。"
translation = "그 너무나도 큰 가슴을 본 것만으로──아니, 진작부터 내 자지는 격렬하게 발기해 있었다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「見かけによらず、会長さんのおち○ちん、すっごく大きいよね。何回見ても慣れないな」"
translation = "「겉보기와는 다르게, 회장님 자지, 엄청 크네. 몇 번을 봐도 익숙해지지 않아」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺だって同じだよ。ナターシャのおっぱい、すっごく大きいし、何回見たって飽きない」"
translation = "「나도 마찬가지야. 나타샤 가슴, 엄청 크고, 몇 번을 봐도 질리지 않아」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふーん。それで会長さんは、私のおっぱいに、おち○ちんを挟んでほしかったってわけ？」"
translation = "「흐음. 그래서 회장님은, 내 가슴에, 자지를 끼워주길 바랐다는 소리?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「これ、パイズリっていうんだよね？\u3000おち○ちん気持ちよくなりたいなら、セックスの方がいいんじゃないの？」"
translation = "「이거, 파이즈리라고 하는 거지? 자지 기분 좋아지고 싶다면, 섹스가 더 낫지 않아?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「セックスはセックスで良いものだし、パイズリはパイズリで良いものなんだ。いつも同じ物ばかり食べてると、たまには違う物が食べたくなるだろ？」"
translation = "「섹스는 섹스대로 좋은 거고, 파이즈리는 파이즈리대로 좋은 거야. 항상 같은 것만 먹다 보면, 가끔은 다른 게 먹고 싶어지잖아?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「え、私は別に飲むゼリーでいいし」"
translation = "「에, 나는 딱히 마시는 젤리로도 충분한데」"

[[dialogue]]
speaker = "unk"
original = "食にこだわりのないナターシャへのたとえ話としては不適切だった。"
translation = "음식에 집착이 없는 나타샤에게 비유를 든 것은 적절하지 않았다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「こんなので本当に気持ちよくできるのかな。パイズリなんて初めてするから、上手くできなくても怒らないでよ？」"
translation = "「이런 걸로 정말 기분 좋게 할 수 있으려나. 파이즈리 같은 건 처음 해보니까, 잘 못해도 화내지 마?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いいから、早く！\u3000早くお願い！」"
translation = "「됐으니까, 얼른! 얼른 부탁해!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふ、会長さんっていつもは落ち着いてるのに、エッチなことになると余裕なくなりがちだよね。ふーっ<emoji=heart04>」"
translation = "「후후, 회장님은 평소엔 진정되어 있는데, 야한 일이 되면 여유가 없어지기 일쑤지. 후ー<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ナターシャに涼やかな息を吹きかけられ、ペニスがビクッと跳ねる。"
translation = "나타샤가 시원한 숨을 불어넣자, 자지가 흠칫 하고 튄다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふ、いい反応。おち○ちん、精液出したくって出したくって、プルプル震えちゃってる。このまま生殺しじゃ可哀想」"
translation = "「후후, 좋은 반응. 자지, 정액 내뿜고 싶어서 내뿜고 싶어서, 떨리고 있어. 이대로 감질나게 두면 불쌍하네」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「しょうがないから、お待ちかねのー……おっぱいで包んで、ムニュムニュ扱いてあげる。えいっ<emoji=heart04>」"
translation = "「어쩔 수 없으니까, 기다리고 기다리던-…… 가슴으로 감싸서, 주물주물 문질러 줄게. 얍<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ん、はっ……うわー、おち○ちんの先っぽから、とろとろのおつゆあふれちゃってる……<emoji=heart04>」"
translation = "「응, 하앗…… 우와-, 자지 끝부분에서, 걸쭉한 즙이 넘쳐나오고 있어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はぁ、あっ……ほらほら、おち○ちん、きもちよくな～れ、きもちよくな～れ<emoji=heart04>\u3000んあっ、はぁっ……<emoji=heart04>」"
translation = "「하아, 아…… 봐봐, 자지야, 기분 좋아져~라, 기분 좋아져~라<emoji=heart04> 응아, 하아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ペニスに押し付けられて形を変え、柔らかく弾む爆乳を拝んでいるだけで、うっかり出てしまいそうだ。"
translation = "자지에 눌려 형태를 바꾸며, 말랑하게 튀는 폭유를 감상하는 것만으로도, 그만 나와버릴 것만 같다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ん、うまく滑ってくれないね……おち○ちん、汗ばんでてベトベトだからかな？」"
translation = "「응, 잘 미끄러져 주지 않네…… 자지가, 땀에 젖어 미끈거리니까 그런가?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そっか、ツバをかければ……もご、もご、もご……ちゅぷぁ……こうやっへ垂らしへぇ……んぷぁあぁ……<emoji=heart04>」"
translation = "「그렇구나, 침을 뱉으면…… 꿀꺽, 꿀꺽, 꿀꺽…… 츄릅…… 이렇게 흘려보내서…… 응푸하아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ナターシャが口の中に溜めた、温くてぬるぬるのローションのような唾液が、亀頭に降りかかる。"
translation = "나타샤가 입안에 모은, 따뜻하고 미끈거리는 로션 같은 침이 귀두에 떨어진다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「トロットロのヌルッヌルになったでしょ。これで、も～っときもちよくなれるんじゃない？\u3000ほらほらほら」"
translation = "「걸쭉걸쭉 미끈미끈하게 되었지. 이걸로, 더~욱 기분 좋아질 수 있지 않아? 자 자 자」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「っく！？\u3000ぅあ、あっ、それ、ヤバッ……！」"
translation = "「큭!? 으아, 아, 그거, 위험해……!」"

[[dialogue]]
speaker = "unk"
original = "ナターシャの爆乳の間で、汗と唾液と我慢汁がねちゃねちゃと音を立てて混ざり合い、温かなぬめりと甘い摩擦を送り付けてくる。"
translation = "나타샤의 폭유 사이에서, 땀과 침과 쿠퍼액이 찰싹찰싹 소리를 내며 섞여, 따뜻한 미끈거림과 달콤한 마찰을 보내온다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「会長さんのおち○ちんアツアツだね。熱を感じてたら、私もちょっと気持ちよくなってきちゃった」"
translation = "「회장님 자지 뜨끈뜨끈하네. 열기를 느끼고 있으니까, 나도 조금 기분 좋아지기 시작했어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふぅ、んっ……はぁ、はっ……イキたくなったら、我慢しないでいいからね……精液ビュービュー出しちゃえ」"
translation = "「후우, 응…… 하아, 하…… 싸고 싶어지면, 참지 않아도 되니까 말이야…… 정액 콸콸 내뿜어 버려」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くっ……すぐに出すのは、もったいないって……ナターシャのパイズリ、ずっと味わってたい……！」"
translation = "「큭…… 바로 내뿜는 건, 아깝다고…… 나타샤의 파이즈리, 계속 맛보고 싶어……!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふーん。最後までしてあげるけど、イキたがりなおち○ちんは、どれだけ我慢できるかな？」"
translation = "「흐음. 끝까지 해주겠지만, 싸고 싶어 하는 자지는, 얼마나 참을 수 있으려나?」"

[[dialogue]]
speaker = "unk"
original = "俺の目を射貫くようにジッと見つめ、あまりに大きな胸をぽよんぽよんと揺らす。"
translation = "내 눈을 꿰뚫어 보듯 지그시 바라보며, 너무나도 큰 가슴을 출렁출렁 흔든다."

[[dialogue]]
speaker = "unk"
original = "吸血鬼のごとく、見る者を魅了するその瞳から逃れられない。捕食者と、搾り取られる獲物の関係だ。"
translation = "흡혈귀처럼 보는 이를 매료하는 그 눈동자에서 벗어날 수 없다. 포식자와, 쥐어짜이는 먹잇감의 관계다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「んっ……ふぁ……あはっ、おち○ちん、きもちよさそ。すぐにでもイッちゃいそうだね」"
translation = "「응…… 하아…… 아하, 자지, 기분 좋아 보여. 당장이라도 가버릴 것 같네」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「今の会長さん、だらしない顔で、隙だらけだもん。情けな～い♪\u3000はっ……私じゃなきゃ、百年の恋だって、冷めちゃうよ」"
translation = "「지금의 회장님, 볼품없는 얼굴로, 허점 투성이인걸. 한심해~♪ 하아…… 내가 아니었으면, 백년 동안의 사랑도 식어버릴 거야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふっ、んっ……今の会長さんに襲い掛かったら、簡単に殺せちゃうね。おち○ちん丸出しで死んだら……っ……かっこ悪いよ」"
translation = "「후, 흠…… 지금 회장님한테 덤벼들면, 간단하게 죽일 수 있겠네. 고추 다 드러내고 죽으면……<emoji=heart04> 볼품없다고」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くっ……気持ちいいまま死ねるなら、それはそれで幸せかも……」"
translation = "「큭…… 기분 좋은 채로 죽을 수 있다면, 그건 그것대로 행복할지도……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふ、余裕ぶっちゃって。私がいきなり斬りかかったりしないって、わかってるからでしょ」"
translation = "「후후, 여유만만이네. 내가 갑자기 베어 가르지 않을 거라는 걸, 알고 있으니까 그렇지?」"

[[dialogue]]
speaker = "unk"
original = "ナターシャにその気があるならば、俺を殺せる機会なんて両手両指でも数えきれないほどあった。"
translation = "나타샤에게 그럴 생각이 있다면, 나를 죽일 수 있는 기회 따위는 양손 손가락으로도 다 셀 수 없을 정도로 많았다."

[[dialogue]]
speaker = "unk"
original = "最初の頃はハニートラップなのかもと警戒していたけれど、今では安心して愛し合っているし、彼女を信じている。"
translation = "초기에는 미인계일지도 모른다고 경계했었지만, 지금은 안심하고 사랑을 나누고 있고, 그녀를 믿고 있다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はぁ、んっ……信じてくれてるなら、もっと気持ちよくしてあげたくなっちゃうな。ふっ……会長さんはさ、おち○ちんの先っぽら辺のー、ここがいいんでしょ～？」"
translation = "「하아, 응…… 믿어주고 있다면, 더 기분 좋게 해주고 싶어져 버리네. 후…… 회장님은 말이야, 자지 끝부분 즈음의-, 여기가 좋은 거지~?」"

[[dialogue]]
speaker = "unk"
original = "ナターシャが器用に両胸を使い、出っ張ったカリ首をくすぐる。"
translation = "나타샤가 능숙하게 양 가슴을 사용해, 튀어나온 귀두 테두리를 간질인다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……っ！？\u3000本当にパイズリ初めてなのか……？」"
translation = "「……!? 진짜로 파이즈리 처음인 거 맞아……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「当たり前でしょ。会長さん以外の男に、体を許してないんだからさ」"
translation = "「당연하잖아. 회장님 이외의 남자한테, 몸을 허락하지 않았으니까 말이야」"

[[dialogue]]
speaker = "unk"
original = "指で扱くよりも繊細な動きで、ナターシャのおっぱいは的確に裏筋やカリ裏を擦り上げる。"
translation = "손가락으로 문지르는 것보다 섬세한 움직임으로, 나타샤의 가슴은 정확하게 귀두 밑 주름과 귀두 뒤쪽을 문질러 올린다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はぁ、んっ……私、器用だからねー。自分の体すら上手く使えないようじゃ、暗殺者失格だし……会長さんの弱点なんて、すっかりお見通し<emoji=heart04>」"
translation = "「하아, 응…… 나, 손재주가 좋으니까-. 자기 몸조차 잘 쓰지 못하면, 암살자 실격이고…… 회장님의 약점 따위, 완전히 다 꿰뚫어 보고 있어<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そろそろ激しくした方がいいよね？\u3000んっ、はぁ……おち○ちんってだんだん激しくしてかないと、最後までイケないんだもんね？」"
translation = "「이제 슬슬 격렬하게 하는 편이 좋겠지? 응, 하아…… 자지는 점점 격렬하게 하지 않으면, 끝까지 갈 수 없으니까 말이야?」"

[[dialogue]]
speaker = "unk"
original = "何度も体を重ねて弱点を知り尽くしているナターシャは、おっぱいの動きに緩急をつけ、左右の動きをズラしたりしつつ、激しく上下に揺らす。"
translation = "몇 번이고 몸을 겹쳐 약점을 잘 알고 있는 나타샤는, 가슴의 움직임에 완급을 주고, 좌우 움직임을 어긋나게 하기도 하면서, 격렬하게 위아래로 흔든다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「んぅ、ふっ……はぁ、はふぅ……おち○ちん、おっぱいの間でびくんびくんしてるぅ……ねちょねちょって、エッチな音ぉ……」"
translation = "「응, 후…… 하아, 하후…… 자지, 가슴 사이에서 꿈틀꿈틀거리고 있어…… 철벅철벅 하고, 야한 소리……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はぁ、はぁっ……こんな音聞かされてたら、私もきもちよくなっちゃう……ほら、乳首も擦れて、ビンビンになってるでしょ……？」"
translation = "「하아, 하아…… 이런 소리를 들려주고 있으면, 나도 기분 좋아져 버려…… 봐봐, 젖꼭지도 문질러져서, 팽팽해졌지……?」"

[[dialogue]]
speaker = "unk"
original = "おっぱいは激しく上下に跳ねまわり、ぱんっぱんっと肉を打ち付ける音が響く。"
translation = "가슴은 격렬하게 위아래로 튀어 오르고, 팍팍 살이 맞부딪치는 소리가 울려 퍼진다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はあぁ……おち○ちんから、エッチでクッサぁい匂いが、ぷんぷんしてるしぃ……はっ、はふっ、はっ、はっ、はぅぅんっ……<emoji=heart04>」"
translation = "「하아…… 자지에서, 야하고 지독~한 냄새가, 펄펄 풍기고 말이야…… 하, 하후, 하, 하, 하으응……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "長く愉しもうと耐えていたのに、ナターシャの快感に溶ける顔があまりにいやらしくて、急速に射精感が昇ってくる。"
translation = "오래 즐기려고 견디고 있었는데, 나타샤의 쾌감에 녹아내리는 얼굴이 너무나 꼴려서, 급속도로 사정감이 치밀어 오른다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はぁ、はっ……うぅっ……イキそうだから、少し緩めてっ……！」"
translation = "「하아, 하…… 으윽…… 갈 것 같으니까, 조금 천천히 해줘……!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふーん、このまま、おっぱいま○こでにゅるにゅるしてるだけで、イッちゃいそうなんだぁ？\u3000本物のおま○こに入れなくても充分なんだぁ？」"
translation = "「흐음, 이대로, 가슴보지로 미끈미끈거리는 것만으로, 가버릴 것 같은 거야? 진짜 보지에 넣지 않아도 충분한 거야?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「んっ、はっ……はぁっ……ふふっ、このままおっぱいま○こでしか射精できないように、躾けてあげようかなぁ……？」"
translation = "「응, 하…… 하아…… 후후, 이대로 가슴보지로밖에 사정할 수 없도록, 길들여 줄까나……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あ゛っ！？\u3000だから、緩めてって──」"
translation = "「아윽!? 그러니까, 천천히 해달라고──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「会長さんってば、おバカだねー<emoji=heart04>\u3000ふっ、はっ……『緩めて』なんて言われたら、もっと激しくするに決まってるでしょ<emoji=heart04>」"
translation = "「회장님도 참, 바보네-<emoji=heart04> 후, 하…… 『천천히 해줘』라는 말을 들으면, 더 격렬하게 하기 마련이잖아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "おっぱいの谷間に溜まった温かな粘液が混ざり合い、間断なくペニスに刺激が送りつけられる。"
translation = "가슴 골짜기에 고인 따뜻한 점액이 섞이며, 쉬지 않고 자지에 자극이 가해진다."

[[dialogue]]
speaker = "unk"
original = "ナターシャで童貞を捨てていなかったら、とっくに暴発しててもおかしくない気持ちよさだ。"
translation = "나타샤에게 동정을 바치지 않았더라면, 진작 폭발했어도 이상하지 않을 기분 좋음이다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふ、おち○ちんから精液出せれば、おっぱいでもおま○こでもいいなんて……男ってチョロすぎ<emoji=heart04>」"
translation = "「후후, 자지에서 정액을 뿜어낼 수 있다면, 가슴이든 보지든 상관없다니…… 남자란 건 너무 쉽네<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はぁ、んっ、はぁっ、ガマンしないでいいよ？\u3000いつでも、好きな時に出しちゃえ、出しちゃえ<emoji=heart04>」"
translation = "「하아, 응, 하아, 참지 않아도 돼? 언제든, 원할 때 내뿜어 버려, 내뿜어 버려<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ひゃっ！？\u3000おち○ちん動いてるんだけど……っ」"
translation = "「히약!? 고추가 움직이고 있는데……」"

[[dialogue]]
speaker = "unk"
original = "絶頂が差し迫り、ただされているだけでは我慢できず、ナターシャのおっぱいま○こを突き抜けるように腰を突き上げる。"
translation = "절정이 다가와, 쥐어짜이기만 해서는 참을 수 없어, 나타샤의 가슴보지를 뚫어버릴 기세로 허리를 밀어 올린다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「セックスみたいに腰ヘコへコさせて、おっぱいパンパン打ちつけちゃってさ。我慢はやめちゃったの？」"
translation = "「섹스처럼 허리를 까딱거리면서, 가슴을 팍팍 부딪쳐 대고 말이야. 참는 건 그만둔 거야?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「もうイキたくてイキたくて、頭の中、射精することでいっぱいなんだねー。会長さんってば必死すぎて、かぁわいい<emoji=heart04>」"
translation = "「이제 가고 싶어서 가고 싶어서, 머릿속이, 사정하는 걸로 가득 차 있나 보네-. 회장님도 참 필사적이라서, 귀~여워<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はぁっ、はっ……あっ、んんっ……んふっ、バッキバキで格好いいおち○ちん……好きぃ<emoji=heart04>」"
translation = "「하앗, 하…… 아, 응응…… 응후, 아주 솟구쳐서 멋진 자지…… 좋아해<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「私をきもちよくしてくれるおち○ちん好きっ……好きだよ……はっ、はぁ……<emoji=heart04>」"
translation = "「나를 기분 좋게 해주는 자지 좋아…… 좋아해…… 하, 하아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あはっ<emoji=heart04>\u3000おち○ちん、すっごくビクビクしてるぅ<emoji=heart04>\u3000このまま出しちゃうんだ、おっぱいに中出しするんだぁ<emoji=heart04>」"
translation = "「아핫<emoji=heart04> 자지, 엄청 펄떡거리고 있어<emoji=heart04> 이대로 싸버리는 거야, 가슴에 가슴싸 하는 거야<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あっ、はぁっ……も、もうイクっ、イキそうっ……！」"
translation = "「아, 하아…… 도, 이제 가, 갈 것 같아……!」"

[[dialogue]]
speaker = "unk"
original = "ナターシャのパイズリに追い込まれ、とっくに限界は超えている。後はどこに、どのタイミングで出すかだけ。"
translation = "나타샤의 파이즈리에 몰려서, 한계는 진작에 넘어섰다. 남은 건 어디에, 어느 타이밍에 뿜어내느냐 뿐."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「おち○ちんが……はっ、ふっ……精液出したいって言ってる……<emoji=heart04>\u3000んっ……かわいい<emoji=heart04>」"
translation = "「자지가…… 하, 후…… 정액 내뿜고 싶다고 말하고 있어……<emoji=heart04> 응…… 귀여워<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「でもここで、おっぱい動かすのやめて、寸止めしたら最高にイジワルだよね♪」"
translation = "「하지만 여기서, 가슴 멈추고, 애태우면 최악으로 짓궂겠지♪」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「なっ……！？\u3000それだけはやめっ……イカせて、最後までイカせて、出させてっ……！」"
translation = "「뭣……!? 그것만은 하지 마…… 싸게 해줘, 끝까지 싸게 해줘, 나오게 해줘……!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふ、ウソ、ウソ<emoji=heart04>\u3000会長さんの情けない顔、す～っごくカワイイね<emoji=heart04>\u3000いいよ、パイズリでイッちゃっていいよ……<emoji=heart04><emoji=heart04>」"
translation = "「후후, 거짓말, 거짓말<emoji=heart04> 회장님의 한심한 얼굴, 누~우런게 너무 귀엽네<emoji=heart04> 좋아, 파이즈리로 가버려도 돼……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「んはぁっ……おっぱいま○こに、中出ししようね<emoji=heart04>\u3000はっ、んっ、はぁっ……せっかくの精子、どぴゅどぴゅ無駄打ちしちゃおうね<emoji=heart04><emoji=heart04>」"
translation = "「응하아…… 가슴보지에, 가슴싸 하자<emoji=heart04> 하, 응, 하아…… 어렵사리 모은 정자, 뷰르르르 낭비해 버이자<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ほらほらほら<emoji=heart04>\u3000出せ<emoji=heart04>\u3000出しちゃえ<emoji=heart04>\u3000おっぱいま○こで射精するの、きっと気持ちいいよ？」"
translation = "「자 자 자<emoji=heart04> 내뿜어<emoji=heart04> 내뿜어 버려<emoji=heart04> 가슴보지에서 사정하는 거, 분명 기분 좋을 거야?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あぐっ……も、もう限界っ……！\u3000イッ……クぅぅっ……！」"
translation = "「아윽…… 더, 이제 한계……! 갸…… 앗……!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふぁ<emoji=heart04>\u3000あっ、あっ、ああっ<emoji=heart04>\u3000おち○ちんの中、ギューンって精液昇ってきてるぅ……<emoji=heart04><emoji=heart04>」"
translation = "「탸<emoji=heart04> 아, 아, 아아<emoji=heart04> 자지 안에서, 찌이인 하고 정액이 치밀어 오르고 있어……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「精液っ、すぐ、ここまで……<emoji=heart04>\u3000ほらほら、キンタマ絞れっ<emoji=heart04>\u3000出せっ出せっ出ーせっ<emoji=heart04>」"
translation = "「정액, 금방, 여기까지……<emoji=heart04> 자 자, 불알 쥐어짜라<emoji=heart04> 내뿜어라 내뿜어라 내-뿜어라<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いいよっ、おっぱいま○こにっ<emoji=heart04>\u3000イけっ、イけイけイけイけイッちゃえぇ<emoji=heart04><emoji=heart04>」"
translation = "「좋아, 가슴보지에<emoji=heart04> 가라, 가라 가라 가라 가버려어<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ひゃふっ！？\u3000ふぁ、あっ、あぁ……<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「햣후!? 하, 아, 아아……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "深い爆乳の谷間に挟まれながら、白濁をたっぷりと吐き出す。"
translation = "깊은 폭유의 골짜기에 끼인 채, 백탁액을 듬뿍 내뿜는다."

[[dialogue]]
speaker = "unk"
original = "その勢いは自分でも想像していた以上で、暴れるペニスを抑えられない。"
translation = "그 기세는 스스로 상상했던 이상이라, 날뛰는 자지를 주체할 수 없다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「わ……出しすぎ<emoji=heart04><emoji=heart04>\u3000元気すぎてちょっと引くんだけど<emoji=heart04>」"
translation = "「와…… 너무 많이 내뿜잖아<emoji=heart04><emoji=heart04> 너무 활발해서 조금 정 떨어지는데<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ナターシャに煽られて作られた大量の精液は、彼女に仕返しするかのように降りかかり、胸や顔を汚す。"
translation = "나타샤에게 부추겨져 만들어진 대량의 정액은, 그녀에게 보복이라도 하듯 쏟아져 내려, 가슴과 얼굴을 더럽힌다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「どれだけ溜まって、んんっ<emoji=heart04>\u3000や、精液、アッツぅい……<emoji=heart04>\u3000顔、ドロッドロにされちゃってるぅ……<emoji=heart04>」"
translation = "「얼마나 쌓여 있었길래, 응응<emoji=heart04> 야, 정액, 뜨거워……<emoji=heart04> 얼굴, 칠갑이 되어 버렸잖아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "何度も脈打って精を吐き出し、ナターシャの端正な顔に白濁を塗りたくって、ようやく射精が止まった。"
translation = "몇 번이나 맥박 치며 정액을 내뿜어, 나타샤의 단정한 얼굴에 백탁액을 칠하고 나서야, 겨우 사정이 멈췄다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ぷぁ、はっ……ぁぷっ……まだピクピクしてるけど……治まった……？」"
translation = "「푸하, 하…… 아푸…… 아직 꿈틀거리고 있는데…… 잠잠해졌어……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いくらなんでも、出しすぎじゃない……？\u3000いつも膣内に出されてるから、よくわかんないけど……」"
translation = "「아무리 그래도, 너무 많이 내뿜는 거 아니야……? 항상 질내에 내뿜어지고 있으니까, 잘은 모르겠지만……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「口にも鼻にも精液かかっちゃってるし……精子で溺れちゃいそ……<emoji=heart04>」"
translation = "「입에도 코에도 정액이 튀어 버렸고…… 정자에 파묻혀 버릴 것 같아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はぁ、はぁ……んぅぅ、青くっさぁい……<emoji=heart04>\u3000会長さんの精液、濃っゆぅ……へぇろ……<emoji=heart04>」"
translation = "「하아, 하아…… 응으으, 비린내 심해……<emoji=heart04> 회장님 정액, 진~하네…… 할짝……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ナターシャは胸の谷間に溜まった精液を指ですくうと、そのまま口に運んだ。"
translation = "나타샤는 가슴 골짜기에 고인 정액을 손가락으로 떠내더니, 그대로 입으로 가져갔다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「えっ、ちょ、ナターシャ……？」"
translation = "「에, 잠, 나타샤……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「こうしてあげると男は喜ぶんでしょ？\u3000でもねっとり濃くて、喉に絡むんだけど……んぷ、ちゅる……<emoji=heart04>」"
translation = "「이렇게 해주면 남자는 기뻐하잖아? 그렇지만 끈적하고 진해서, 목에 얽히는데…… 응훕, 꿀꺽……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ていうか、セックスの時より出してない？\u3000念願の私のパイズリ、どうだった？」"
translation = "「그나저나, 섹스할 때보다 더 내뿜지 않았어? 염원하던 내 파이즈리, 어땠어?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「最高でした……」"
translation = "「최고였습니다……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふっ、正直でよろしい<emoji=heart04>\u3000でも……会長さんのここはまだ満足してないみたい<emoji=heart04>」"
translation = "「후훗, 솔직해서 좋네<emoji=heart04> 그렇지만…… 회장님의 여기는 아직 만족하지 못한 모양이야<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "一度射精したにも関わらず、ペニスはまだ固さを保っている。"
translation = "한 번 사정했음에도 불구하고, 자지는 여전히 단단함을 유지하고 있다."

[[dialogue]]
speaker = "unk"
original = "ナターシャのパイズリが忘れられないと言わんばかりに。"
translation = "나타샤의 파이즈리를 잊지 못하겠다는 듯이."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「じゃあ……１滴残らず吸い尽くしてあげる<emoji=heart04>\u3000吸血鬼らしく、ね<emoji=heart04>」"
translation = "「그럼…… 한 방울도 남김없이 빨아내 줄게<emoji=heart04> 흡혈귀답게, 말이야<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あ、ちょっと待っ──」"
translation = "「아, 잠깐 기다──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いっただきまぁす<emoji=heart04>」"
translation = "「잘 먹겠습니다<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ナターシャの胸でこれでもかと搾り取られ、俺の精魂は淫靡なる吸血鬼ナターシャに捧げられたのだった。"
translation = "나타샤의 가슴에서 마음껏 쥐어짜여, 나의 정혼은 음란한 흡혈귀 나타샤에게 바쳐진 것이었다."

