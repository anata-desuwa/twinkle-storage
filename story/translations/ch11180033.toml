[[dialogue]]
speaker = "unk"
original = "第３話,選管グルメバトル！,P"
translation = "제3화, 선관 미식 배틀!, P"

[[dialogue]]
speaker = "unk"
original = "漫画を探しに秋葉原に立ち寄ると、新星学園の選挙管理委員会──通称選管の面々も秋葉原にやってきていた。"
translation = "만화를 찾으러 아키하바라에 들르자, 신성 학원의 선거관리위원회──통칭 선관 식구들도 아키하바라에 와 있었다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んー、やっぱりアキバはいいなっ！\u3000流星ライダーのレアグッズもいっぱい置いてるし！\u3000プレミア付きのベルトもあるんだぞ！」"
translation = "「음-, 역시 아키바는 좋단 말이지! 유성 라이더의 희귀 굿즈도 잔뜩 있고! 프리미엄 붙은 벨트도 있다고!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「おー、賑やかな街だ」"
translation = "「오-, 활기찬 거리네」"

[[dialogue]]
speaker = "unk"
original = "選管のみんなは何をしてるところ？"
translation = "선관 여러분은 여기서 뭐 하고 있었어?"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「ああ、君か。無論、星徒会長である君の監視……と言いたいところだが、そうではない」"
translation = "「아아, 너인가. 무론, 성도회장인 너의 감시……라고 말하고 싶지만, 그렇지는 않다」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「梨緒ちゃんとアポロちゃんと私で、ナターシャちゃんにアキバグルメをプレゼンするんですっ！」"
translation = "「리오짱이랑 아폴로짱이랑 제가, 나타샤짱한테 아키바 미식을 프리젠테이션하는 거예요!」"

[[dialogue]]
speaker = "unk"
original = "プレゼン？"
translation = "프리젠테이션?"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うん。食に興味のない私に、みんなのオススメを紹介してくれるんだって」"
translation = "「응. 음식에 흥미가 없는 나한테, 다 같이 추천하는 걸 소개해 준대」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「アキバにはいろんなお店があるからな。美味しいものたくさんあるんだぞ！」"
translation = "「아키바에는 다양한 가게가 있으니까 말이야. 맛있는 게 엄청 많다고!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「いい加減、私のサンドイッチを奪うのはやめてもらわないとな。そのためにナターシャに好きなものを見つけてもらう」"
translation = "「이제 슬슬, 내 샌드위치를 빼앗아 먹는 건 그만두게 해야 하니까 말이지. 그러기 위해 나타샤에게 좋아하는 걸 찾게 해주는 거다」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ついでに、私に美味しいって言わせた人が勝ちなんだって」"
translation = "「덤으로, 나한테 맛있다고 말하게 만든 사람이 이기는 거라네」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「今日は私が勝つ！」"
translation = "「오늘은 내가 이긴다!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「梨緒ってすぐにバトルしたがるよね。弱いのに」"
translation = "「리오는 금방 승부를 겨루고 싶어 하네. 약하면서」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「弱い！？」"
translation = "「약하다고!?」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「くっ……私なんて、シラスに混入した小エビのようにちっぽけな存在なんだ……」"
translation = "「큭…… 나 따위는, 뱅어에 섞여 들어간 꼬마새우처럼 보잘것없는 존재다……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「梨緒ちゃーんっ！？\u3000気を確かに！\u3000あとたとえが細かすぎるよ！」"
translation = "「리오짱-!? 정신 차려! 그리고 비유가 너무 세세하잖아!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ま、そういうわけなんだ。これは選管内の勝負だから、会長さんは手出し無用だよ」"
translation = "「뭐, 그런 까닭이야. 이건 선관 내부의 승부니까, 회장님은 참견 금지야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「勝負がどうなるのか、楽しみに見ててね。面白いグルメが飛びだしてくるかもよ？」"
translation = "「승부가 어떻게 될지, 기대하며 지켜봐 줘. 재미있는 음식이 튀어나올지도 모른다고?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「まずは順番決めだ！\u3000公平にじゃんけんで決めるぞ！\u3000さーいしょはグーッ！\u3000じゃーんけん！」"
translation = "「우선 순서를 정하자! 공정하게 가위바위보로 정하는 거다! 가-위-바위-보-!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ぽんっ！」"
translation = "「보-!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……お、珍しい展開だね」"
translation = "「……오, 보기 드문 전개네」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「くそー、あたしが２番かー」"
translation = "「젠장-, 내가 2번인가-」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私が最後だねっ」"
translation = "「제가 마지막이네요」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「勝った……！\u3000私がナンバーワンだ……！」"
translation = "「이겼다……! 내가 넘버원이다……!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「や、嬉しそうだけど、順番決めのじゃんけんに勝っただけだから。本戦に勝ったわけじゃないからね」"
translation = "「아니, 기뻐 보이긴 하는데, 순서를 정하는 가위바위보에서 이겼을 뿐이니까. 본선에서 이긴 게 아니니까 말이야」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「しかしじゃんけんの勝利はグルメバトルの勝利に直結する。この勝負、私がもらった！」"
translation = "「하지만 가위바위보의 승리는 미식 배틀의 승리로 직결된다. 이 승부, 내가 가져가겠다!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「もう勝利宣言？\u3000随分と自信あるんだね」"
translation = "「벌써 승리 선언? 제법 자신 있나 보네.」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「ああ、それには根拠がある」"
translation = "「아아, 거기에는 근거가 있다」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「最高の調味料……それは空腹。ならば一番手の私に有利だ」"
translation = "「최고의 조미료…… 그것은 공복. 그렇다면 첫 번째인 내가 유리하지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あー……一理あるかも。満腹の時に豪華な料理を出されても食べられないもんね」"
translation = "「아-…… 일리는 있을지도. 배가 부를 때 호화로운 요리를 내놓아 봤자 먹을 수 없으니까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「でも、料理漫画って最初に出した方が負ける法則があるぞ」"
translation = "「하지만, 요리 만화에서는 먼저 낸 쪽이 패배하는 법칙이 있다고」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「なっ……！？\u3000いや、漫画はあくまでフィクションだ。今回こそは私が勝つ！」"
translation = "「뭣……!? 아니, 만화는 어디까지나 픽션이다. 이번에야말로 내가 이긴다!」"

[[dialogue]]
speaker = "unk"
original = "梨緒、アポロ、ベアトリスの３人は、秋葉原で見つけたグルメを持ち寄る。"
translation = "리오, 아폴로, 베아트리스 3명은 아키하바라에서 찾아낸 음식을 들고 모인다."

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「というわけで、私がプレゼンするのは、出身のイギリスにちなんで──ローストビーフ丼だ！」"
translation = "「그런 까닭으로, 내가 프리젠테이션하는 것은, 출신지인 영국에 연유하여──로스트비프 덮밥이다!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「おー、まさに肉、って感じだねー」"
translation = "「오-, 그야말로 고기, 라는 느낌이네-」"

[[dialogue]]
speaker = "unk"
original = "肉々しくて見るからに美味しそう"
translation = "고기도톰하니 보기만 해도 맛있어 보인다"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「味は保証する。正直、故郷のローストビーフを凌駕するほどだ」"
translation = "「맛은 보장한다. 솔직히, 고향의 로스트비프를 능가할 정도다」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「いただきまーす……はむっ……！\u3000わ、美味しいっ！\u3000トッピングのローストガーリックがお肉のおいしさを何倍にも高めてるよっ！」"
translation = "「잘 먹겠습니다…… 냠……! 와, 맛있어! 토핑으로 올라간 로스트 가릭이 고기의 맛을 몇 배나 더 끌어올려 주고 있어!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ベアトはとことんブレないな～……」"
translation = "「베아토는 끝까지 흔들리지 않는구만～……」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「どうだ、ナターシャ」"
translation = "「어떠냐, 나타샤」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うん、まぁ、こういうのが美味しいんだ──って感じかな。ソースも胡椒が効いててパンチがあったし」"
translation = "「응, 뭐, 이런 게 맛있는 거구나──라는 느낌일까. 소스도 후추 맛이 강해서 임팩트가 있었고」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「よし、なかなかの好感触だ。この勝負、もらった！」"
translation = "「좋아, 상당한 호감도다. 이 승부, 가져가겠다!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「まだ勝負は始まったばかりだぜ！\u3000次はあたしの番っ！\u3000あたしのオススメは──鯛焼きだ！」"
translation = "「아직 승부는 이제 막 시작됐다고! 다음은 내 차례! 내가 추천하는 건──도미빵이다!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「鯛焼き？」"
translation = "「도미빵?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ただの鯛焼きじゃないぞ！\u3000クロワッサン鯛焼きだ！\u3000しょっぱいやつの後だし、甘いのが欲しくなったろ？」"
translation = "「그냥 도미빵이 아니라고! 크루아상 도미빵이다! 짠 것을 먹은 뒤니까, 단 게 당기기 시작했지?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「定番のあんこもいいし、カスタードもいい。期間限定のカボチャあんもあるぜ！」"
translation = "「스테디셀러인 팥앙금도 좋고, 커스터드도 좋아. 기간 한정 호박 앙금도 있다고!」"

[[dialogue]]
speaker = "unk"
original = "周りが餃子の羽みたいになってて美味しそう"
translation = "테두리가 만두 날개처럼 되어 있어서 맛있어 보인다"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「私はカボチャにしようかな。いただきまーす。あむっ」"
translation = "「나는 호박으로 할까나. 잘 먹겠습니다. 냠」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「んっ……！\u3000パリっとしていて濃厚なバターの香りが……！\u3000普通の鯛焼きとはまた別物だな」"
translation = "「응……! 바삭하면서 진한 버터 향이……! 일반적인 도미빵과는 또 다른 물건이군」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「う～～ん、カスタードもトロトロのアツアツでおいひぃ～♪」"
translation = "「으~~음, 커스터드도 걸쭉하고 따끈따끈해서 맛있어~♪」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「だろー！\u3000立派なスイーツだよな！」"
translation = "「그렇지-! 훌륭한 디저트라니까!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふんふん、なるほど……このカリカリサクサクが人気なのかな。好きになる人の気持ちもわかるかも」"
translation = "「흠흠, 그렇군…… 이 바삭바삭 사각사각한 점이 인기가 있는 걸까. 좋아하는 사람의 기분을 알 것 같기도 해」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「くっ、アポロのクロワッサン鯛焼きも好印象か……だがまだ勝負はわからない……！」"
translation = "「큭, 아폴로의 크루아상 도미빵도 좋은 인상인가…… 하지만 아직 승부는 알 수 없다……!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私は……ニンニク爆盛りペペロンチーノだよっ！」"
translation = "「저는…… 마늘 폭탄 페페론치노예요!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「そうだと思っていた！\u3000離れていても漂ってくるすごい匂いだな……」"
translation = "「그럴 줄 알았다! 떨어져 있어도 풍겨 오는 엄청난 냄새로군……」"

[[dialogue]]
speaker = "unk"
original = "食欲をそそる匂いで美味しそう"
translation = "식욕을 돋우는 냄새라 맛있어 보인다"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王、さっきから『美味しそう』しか言ってないんじゃないか……？」"
translation = "「마왕, 아까부터 『맛있어 보인다』밖에 안 말하는 거 아니냐……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふ、ベアトならこうじゃなきゃ嘘だよね」"
translation = "「후후, 베아토라면 이래야 거짓말이 아니지」"

[[dialogue]]
speaker = "unk"
original = "ナターシャってニンニクはダメなんじゃ？"
translation = "나타샤는 마늘을 못 먹는 거 아니었나?"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あ～むっ」"
translation = "「아~앙」"

[[dialogue]]
speaker = "unk"
original = "ナターシャがニンニクを食べた！？"
translation = "나타샤가 마늘을 먹었다!?"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「エージェントとしての大きな仕事は終わったから、解禁してみようと思ってね」"
translation = "「요원으로서의 큰일은 끝났으니까, 해금해 볼까 싶어서 말이야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「さ、みんなも食べて食べて～♪」"
translation = "「자, 여러분도 드세요 드세요~♪」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「これは……人に会えなくなるニンニクの量だな……」"
translation = "「이건…… 사람을 만날 수 없게 되는 마늘 양이로군……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしは食べるぞ！\u3000こんな匂い嗅がされて我慢できるか！」"
translation = "「나야 먹지! 이런 냄새를 풍기게 하는데 참을 수 있겠냐!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あはは、ニンニクの匂いヤバ。ま、どうせならみんなでニンニクくさくなろっか」"
translation = "「아하하, 마늘 냄새 대박. 뭐, 어차피 이렇게 된 거 다 같이 마늘 냄새 풍겨 볼까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ぷふー、食べた食べた！\u3000お腹ポンポンだな！」"
translation = "「푸하-, 잘 먹었다 잘 먹었어! 배가 빵빵하다고!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「結局私もペペロンチーノを食べてしまった……刺激は強かったが、味は素晴らしかった」"
translation = "「결국 나도 페페론치노를 먹고 말았군…… 자극은 강했지만, 맛은 훌륭했다」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃんの一番のお気に入りはどれだった？」"
translation = "「나타샤짱이 가장 마음에 들어 한 건 어떤 거였어?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうだね。私が一番気に入ったのは──」"
translation = "「글쎄. 내가 가장 마음에 들었던 건──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトのかな」"
translation = "「베아토 거일까」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「なにっ！？\u3000以前はガリハラとまで言っていたのに！？」"
translation = "「뭐라고!? 이전에는 마늘 괴롭힘이라고까지 말했으면서!?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ははっ、ナターシャもニンニクに染まっちゃったのか！」"
translation = "「하하!, 나타샤도 마늘에 물들어 버린 거냐!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ニンニクは悪くないよっ！\u3000でも、ナターシャちゃんが選んでくれて嬉しいなっ！」"
translation = "「마늘은 나쁘지 않아요! 하지만, 나타샤짱이 선택해 줘서 기뻐요!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアト基準だと刺激がヤバいけど、まぁ一周回ってそれもありかなって」"
translation = "「베아토 기준이라면 자극이 장난 아니지만, 뭐 한 바퀴 돌아보면 그것도 괜찮으려나 해서」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「私、味よりも刺激とかの方が興味を持てるのかもね」"
translation = "「나, 맛보다는 자극 같은 쪽에 흥미를 더 느낄 수 있는지도 모르겠네」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「くっ……またもや私は……！\u3000ベアトに、ニンニクにまで負けてしまったというのか……！」"
translation = "「큭…… 또다시 나는……! 베아토에게, 마늘에게까지 패배하고 말았다는 말인가……!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「だが……ナターシャにも食べ物の好みができたのは前進だな」"
translation = "「하지만…… 나타샤에게도 음식 취향이 생긴 것은 전진이군」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うん！\u3000これからももっと、美味しいものや好きなものを見つけようね！」"
translation = "「응! 앞으로도 더욱더, 맛있는 거나 좋아하는 걸 찾아내자!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアト、梨緒、アポロ。私のためにいろいろ考えてくれてありがと。いい休日になったよ」"
translation = "「베아토, 리오, 아폴로. 나를 위해 이것저것 생각해 줘서 고마워. 좋은 휴일이 되었어」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ああ、美味しくて楽しかった！\u3000またやろーな！」"
translation = "「아아, 맛있고 즐거웠다! 다음에 또 하자고!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「そう言ってくれるならよかった。ただ、今日、明日は人に会うのは控えておいた方がいいかもしれないな」"
translation = "「그렇게 말해 준다면 다행이다. 다만, 오늘, 내일은 사람을 만나는 것은 자제해 두는 편이 좋을지도 모르겠군」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だね。ジグの呆れ顔が目に浮かぶよ」"
translation = "「그러게. 지그의 기가 막혀 하는 얼굴이 눈에 선해」"

[[dialogue]]
speaker = "unk"
original = "秋葉原グルメバトルはベアトリスが勝利を飾ったが、同じ皿のニンニクを食った者の絆は、より一層深まるのだった。"
translation = "아키하바라 미식 배틀은 베아트리스가 승리를 장식했지만, 같은 접시의 마늘을 먹은 자들의 유대는 더욱더 깊어지는 것이었다."

