[[dialogue]]
speaker = "unk"
original = "クーシェンが俺の専属メイドになってから、俺の生活はじわじわと侵食されていた。"
translation = "쿠셴이 나의 전속 메이드가 된 이후, 나의 생활은 야금야금 침식당하고 있었다."

[[dialogue]]
speaker = "unk"
original = "今日もわざわざ家まで来て、甲斐甲斐しくお世話してくれている。"
translation = "오늘도 일부러 집까지 찾아와 살뜰하게 수발을 들어주고 있다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「かゆいところはありませんか～、にーにー？」"
translation = "「가려운 곳은 없으신가요~, 오빠?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あー、そこそこ。肩甲骨のちょっと下あたりを頼む」"
translation = "「아-, 거기 거기. 날개뼈 약간 아래쪽 부탁해」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「はーい。こしょこしょこしょ～」"
translation = "「네~. 간질간질간질~」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ははっ、くすぐったいって。今、明らかにくすぐりにいってただろ？」"
translation = "「하하, 간지럽다니까. 방금 명백하게 간지럽히려고 한 거지?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ウキキ～♪\u3000そんなことないよ～」"
translation = "「우키키~♪ 그렇지 않다구~」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「まあいいけど……そもそもクーシェンはメイドだろ？\u3000料理とか掃除とか、他にやることがあるんじゃないか？」"
translation = "「뭐 상관없지만…… 애초에 쿠셴은 메이드잖아? 요리나 청소라든가, 따로 할 일이 있지 않아?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「むー、にーにーがそれ言う？\u3000ボクがお世話するようになって気付いたけどさ～、お料理もお掃除も、ボクよりずっと上手だよね」"
translation = "「무ー, 오빠가 그런 말을 해? 내가 수발들게 되면서 깨달은 건데 말야~, 요리도 청소도 나보다 훨씬 잘하잖아」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーより未熟なボクができることなんて、背中をかいてあげるくらいだもん」"
translation = "「오빠보다 미숙한 내가 할 수 있는 건, 등 긁어주는 것 정도인걸」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そ、そんなことはないと思うけど」"
translation = "「그, 그렇지는 않다고 생각하는데」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「あ、１つだけあった！」"
translation = "「아, 하나 있다!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「エッチなご奉仕……これはボクにしか出来ないことだよね？」"
translation = "「야한 봉사…… 이건 나밖에 할 수 없는 거지?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーのエッチ<emoji=heart04>\u3000今、想像したでしょ？\u3000おち○ちんのとこ、ふっくらしてきたよ？」"
translation = "「오빠 야해<emoji=heart04> 방금 상상했지? 자지 있는 곳, 부풀어 올랐다구?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーのお部屋行こっか。いつものエッチ部屋<emoji=heart04>\u3000ボクのメイドおま○こで気持ちよ～くしてあげるね<emoji=heart04>」"
translation = "「오빠 방으로 갈까. 평소의 야한 방<emoji=heart04> 내 메이드 보지로 기분 좋~게 해줄게<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ほら見て～、にーにーの大好きなメイドおま○こだよ<emoji=heart04>」"
translation = "「자 봐봐~, 오빠가 좋아하는 메이드 보지야<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んふふ～、見てる見てる……んんっ……相変わらずエッチな視線だなぁ。こんな割れ目でここまで興奮できるなんて驚いちゃうよ<emoji=heart04>」"
translation = "「응후후~, 보고 있어 보고 있어…… 응응…… 여전히 야한 시선이네. 이런 갈라진 틈으로 이렇게까지 흥분할 수 있다니 놀라워<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だってメイドさんだし……しかもちっちゃい穴から愛液垂れてるんだぞ……今すぐハメて下さいって感じのおま○こじゃないか」"
translation = "「그야 메이드고…… 게다가 작은 구멍에서 애액이 흘러나오고 있잖아…… 당장 박아달라는 느낌의 보지 아니냐고」"

[[dialogue]]
speaker = "unk"
original = "クーシェンの体格に相応しいちび穴は、物欲しそうに透明な蜜を滴らせている。"
translation = "쿠셴의 체구에 어울리는 작은 구멍은, 애원하듯 투명한 꿀을 떨어뜨리고 있다."

[[dialogue]]
speaker = "unk"
original = "生意気にメスの臭いを漂わせて、早くも肉棒をいきり立たせにきた。"
translation = "건방지게 암컷의 냄새를 풍기며, 벌써부터 자지를 발기시키러 왔다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにー専用のエッチ穴だから……はぁ、んっ……いつでもおち○ちんハメていいからね<emoji=heart04>」"
translation = "「오빠 전용의 야한 구멍이니까…… 하아, 응…… 언제든 자지 박아도 되니까<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「まだ触ってもいないのにま○こを濡らして……もしかして発情してるのか？」"
translation = "「아직 만지지도 않았는데 보지를 적시고…… 혹시 발정한 거야?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んーん……発情はしてない……発情したらメイドさん出来なくなっちゃうから、おクスリ飲んだほうがいいよって言われて……」"
translation = "「으응…… 발정은 안 했어…… 발정하면 메이드 일 못 하게 되니까, 약 먹는 게 좋겠다고 들어서……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「だから、これはボクがエッチなだけ。にーにーのことが大好きで……んっ……ただセックスしたくなってるだけなの<emoji=heart04>」"
translation = "「그러니까, 이건 내가 야할 뿐. 오빠가 너무 좋아서…… 윽…… 그냥 섹스하고 싶어진 것뿐이야<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ほらほら～、にーにーも素直になっちゃおうよ♪\u3000ボクもエッチだけど、にーにーはもっとドスケベだって知ってるんだからね……」"
translation = "「자자~, 오빠도 솔직해지자♪ 나도 야하지만, 오빠는 훨씬 더 왕변태라는 거 알고 있으니까 말야……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「何回そのきょーあくなデカち○でおしおきされたか……回数覚えてないくらい、たくさんいじめられてるもん」"
translation = "「몇 번이나 그 흉악하고 커다란 자지로 벌받았는지…… 횟수를 기억하지 못할 정도로, 많이 괴롭힘당했는걸」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「見せてよ、にーにーのおち○ちん……<emoji=heart04>\u3000どーせボクに挿れたくてバキバキにボッキしてるんでしょ？」"
translation = "「보여줘, 오빠 자지……<emoji=heart04> 어차피 나한테 넣고 싶어서 발딱발딱 발기해 있잖아?」"

[[dialogue]]
speaker = "unk"
original = "クーシェンに言われるがままにペニスを取り出し、赤黒く張り詰めたモノを見せつけてやる。"
translation = "쿠셴이 말하는 대로 페니스를 꺼내, 붉고 검게 팽팽해진 물건을 보여준다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「うわ～、ほんとにボッキしてる～<emoji=heart04>\u3000にーにーのスケベち○ちんにまた犯されちゃうんだ～<emoji=heart04>」"
translation = "「우와~, 진짜로 발기해 있어~<emoji=heart04> 오빠의 변태 자지에 또 범해져 버리는구나~<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ならお望み通り、またこいつで躾けてやるよ！」"
translation = "「그럼 바라는 대로, 또 이 녀석으로 버르장머리를 고쳐주지!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んぐぅっ！\u3000ううっ……一気に挿れられちゃったぁ……」"
translation = "「응구읏! 우우읏…… 한 번에 넣어버렸어어……」"

[[dialogue]]
speaker = "unk"
original = "既に準備万端の割れ目に亀頭を押し当て、ずっぷりと押し込んでいく。"
translation = "이미 준비가 완료된 갈라진 틈에 가두를 밀어붙이고, 푹하고 밀어 넣는다."

[[dialogue]]
speaker = "unk"
original = "相変わらのキツま○こは、サイズの合わない肉棒をぬるりと飲み込んでしまった。"
translation = "변함없이 조이는 보지는, 사이즈가 맞지 않는 고기봉을 미끄러지듯 삼켜버렸다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ふあっ……はぁんっ……やっぱりにーにーのおち○ちん好きぃ<emoji=heart04>\u3000これ気持ちよすぎてボクおかしくなっちゃうよぉ……<emoji=heart04>」"
translation = "「후아…… 하앙…… 역시 오빠 자지 좋아아<emoji=heart04> 이거 너무 기분 좋아서 나 이상해져 버려어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「えへへ……こんなに気持ちよくなっちゃうんだから……んんっ……そろそろ大人ゲージもＭＡＸかなぁ……？」"
translation = "「에헤헤…… 이렇게 기분 좋아져 버리니까…… 응읏…… 슬슬 어른 게이지도 MAX이려나……?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そしたらもっと……あっ、んぅ……はぁ……激しいエッチも、出来るから……楽しみだね……♪」"
translation = "「그러면 더…… 아, 응…… 하아…… 격렬한 섹스도, 할 수 있으니까…… 기대되네……♪」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「今でも十分すぎるほど激しいセックスしてると思うけどな」"
translation = "「지금도 충분하다 못해 차고 넘칠 정도로 격렬한 섹스를 하고 있다고 생각하는데」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「それは否定しない……にーにーってば、エッチの時はけっこー鬼畜になるから<emoji=heart04>\u3000はぁ……んっ……そーゆーとこも……好きなんだけど<emoji=heart04>」"
translation = "「그건 부정 안 해…… 오빠는 말야, 섹스할 때는 제법 귀축이 되니까<emoji=heart04> 하아…… 응…… 그런 점도…… 좋아하지만<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「クーシェンがいつも煽るから悪いんだぞ。俺としては、健全なラブラブセックスしたいのに」"
translation = "「쿠셴이 항상 도발하니까 나쁜 거라고. 나는 건전하고 러브러브한 섹스를 하고 싶은데」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そんなぬる～いエッチじゃ、にーにーの性欲……満足しないでしょ？\u3000ズコバコハメて、ボクのおなかをせーしでパンパンにするまでヤるくせに……<emoji=heart04>」"
translation = "「그런 미지근~한 섹스로는, 오빠의 성욕…… 만족 못 하지? 푹푹 박아서, 내 배를 정액으로 빵빵하게 만들 때까지 할 거면서……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だから、それはクーシェンが煽るせいだって……」"
translation = "「그러니까, 그건 쿠셴이 도발한 탓이라고……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「おち○ちん挿れてるから……説得力、ゼロだぞ……<emoji=heart04>」"
translation = "「자지 넣고 있으니까…… 설득력, 제로야……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "クーシェンが喋るたびに、膣内のペニスはグッと膨らみ、未成熟な膣道を押し広げる。"
translation = "쿠셴이 말할 때마다, 질 내의 페니스는 쑥 부풀어 올라, 미성숙한 질도를 넓혀간다."

[[dialogue]]
speaker = "unk"
original = "おなかに肉竿の形が浮き出るくらいに興奮しているんだから、確かに説得力の欠片もない。"
translation = "배에 고기봉의 형태가 드러날 정도로 흥분해 있으니, 확실히 설득력의 조각도 없다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「はぁ、ぁ……ねぇ、にーにー？\u3000そのままじっとしてるなんてボクせつないよ……かっこいいおち○ちんでボクを躾けてくれるんでしょ……？」"
translation = "「하아, 아…… 저기, 오빠? 그대로 가만히 있는다니 나 애달파…… 멋진 자지로 나를 길들여 줄 거잖아……?」"

[[dialogue]]
speaker = "unk"
original = "甘ったるい声で誘いながら、おしりを振る。そんな動きだけでプリプリの膣襞が亀頭を刺激し、責め立ててきた。"
translation = "달콤한 목소리로 유혹하면서, 엉덩이를 흔든다. 그런 움직임만으로 탱탱한 질 주름이 가두를 자극하며, 몰아붙여 왔다."

[[dialogue]]
speaker = "unk"
original = "めいっぱい広がった膣口の隙間からは、泡立ち始めた愛液が溢れ、音を立てる。"
translation = "한껏 벌어진 질구 틈새에서는, 거품이 일기 시작한 애액이 넘쳐흘러, 소리를 낸다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ったく……スケベな腰振りして。こんなのどこで覚えたんだよ」"
translation = "「나 참…… 야한 허리짓을 하고. 이런 건 어디서 배운 거야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーが教えてくれたのに……忘れちゃった？」"
translation = "「오빠가 가르쳐 줬으면서…… 잊어버렸어?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「忘れたなら、また教えてよ<emoji=heart04>\u3000んはぁ、ん……ほらほらぁ……生意気なボクのおま○こ、わからせちゃえ<emoji=heart04>」"
translation = "「잊었다면, 다시 가르쳐 줘<emoji=heart04> 응하아, 응…… 자자아…… 건방진 내 보지, 정신 차리게 해줘<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ふぁっ！\u3000あぁぁっ……にーにーのおち○ちん、ズプズプしてきたぁ<emoji=heart04>」"
translation = "「후아! 아아앗…… 오빠 자지, 푹푹 들어오기 시작했어어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "わからせるつもりだったが、動きはあくまで慎重に。"
translation = "정신 차리게 해줄 셈이었지만, 움직임은 어디까지나 신중하게."

[[dialogue]]
speaker = "unk"
original = "クーシェンの体を気遣いながら、腰を前後に動かしていく。"
translation = "쿠셴의 몸을 배려하면서, 허리를 전후로 움직여 간다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んふ……んっ、あっ、ああ……ゆっくり、出し入れするのもぉ……好きぃ……<emoji=heart04>」"
translation = "「응후…… 응, 아, 아아…… 천천히, 넣었다 빼는 것도오…… 좋아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「知ってるよ」"
translation = "「알고 있어」"

[[dialogue]]
speaker = "unk"
original = "生意気なこと言ってるクーシェンだけど、やはり本気の抽送は負荷が大きい。"
translation = "건방진 소리를 하고 있는 쿠셴이지만, 역시 본격적인 추송은 부하가 크다."

[[dialogue]]
speaker = "unk"
original = "いきなりトップスピードで突きまくったら苦しくなるだけなのは、既に学習していた。"
translation = "갑자기 톱스피드로 계속 찌르면 괴로워질 뿐이라는 것은, 이미 학습했다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んんっ、あっ、ううぅ……やっぱりにーにーってば鬼畜だぁ……<emoji=heart04>」"
translation = "「응응, 아, 우우우…… 역시 오빠는 귀축이야아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「自分が気持ちいい動きだけじゃなくて……んっ、はぁ、あっ……あぁあ……ボクの、好きなリズムで……出し入れしてるしぃ<emoji=heart04>」"
translation = "「자기가 기분 좋은 움직임뿐만 아니라…… 응, 하아, 아…… 아아아…… 내가, 좋아하는 리듬으로…… 넣었다 뺐다 하고 있고오<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "責めるようなクーシェンの言葉を無視して、ねっとりした腰使いで突いてあげる。"
translation = "나무라는 듯한 쿠셴의 말을 무시하고, 끈적한 허리놀림으로 찔러 준다."

[[dialogue]]
speaker = "unk"
original = "甘やかすようなセックスが好物なのはバレバレなのだ。"
translation = "어리응석을 받아주는 듯한 섹스를 좋아하는 것은 훤히 들통나 있는 것이다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「くやしいけど……んんっ……気持ちよくなっちゃう……<emoji=heart04>」"
translation = "「분하지만…… 응응…… 기분 좋아져 버려……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ぬっちぬっちと湿った音が響き、クーシェンが浴びている快楽の強さを伝えてくれる。"
translation = "질척질척 축축한 소리가 울려 퍼지고, 쿠셴이 느끼고 있는 쾌락의 강도를 전해준다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「おっぱいもツンツンになってるぞ」"
translation = "「가슴도 뾰족해져 있다고」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ひゃん！\u3000ど、同時は反側だってばぁ<emoji=heart04>」"
translation = "「히앙! 동, 동시에 하는 건 반칙이라니까아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ペニスを出し入れしながら、空いていた手で可愛いおっぱいを揉み始める。"
translation = "페니스를 넣었다 빼면서, 놀고 있던 손으로 귀여운 가슴을 주무르기 시작한다."

[[dialogue]]
speaker = "unk"
original = "ツンと尖った感触が掌に伝わり、こっちでも感じてくれていることを教えてくれた。"
translation = "콕 하고 뾰족해진 감촉이 손바닥에 전해져, 이쪽으로도 느껴주고 있다는 것을 가르쳐 주었다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んあっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000はぁんっ<emoji=heart04>\u3000にーにー<emoji=heart04>\u3000これ好きぃ<emoji=heart04>\u3000好きぃぃ<emoji=heart04>」"
translation = "「응아<emoji=heart04> 아<emoji=heart04> 하앙<emoji=heart04> 오빠<emoji=heart04> 이거 좋아아<emoji=heart04> 좋아아아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "蕩けた声で繰り返し訴えるクーシェン。"
translation = "녹아내린 목소리로 되풀이해 호소하는 쿠셴."

[[dialogue]]
speaker = "unk"
original = "不本意そうにしているが体は正直で、更なる快楽を欲して無意識に腰をくねらせ、好みの角度に調整している。"
translation = "탐탁지 않아 하고 있지만 몸은 솔직해서, 더한 쾌락을 원하며 무의식적으로 허리를 뒤틀어, 마음에 드는 각도로 조정하고 있다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「腰使いエッチだぞ」"
translation = "「허리놀림이 야하다고」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「だってぇ～、だってぇ～<emoji=heart04>\u3000あっ、あぁあ、あっ<emoji=heart04>\u3000にーにーのおち○ちんっ、気持ちいいんだもんっ……あっ、あああっ<emoji=heart04>」"
translation = "「그치만~, 그치만~<emoji=heart04> 아, 아아아, 아<emoji=heart04> 오빠 자지잇, 기분 좋은걸읏…… 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "雑魚ち○ちんっていつもからかってくるけど、雑魚なのはどっちだと言いたいくらいだ。"
translation = "잡어 자지라며 항상 놀려대지만, 잡어인 건 어느 쪽이냐고 말하고 싶을 정도다."

[[dialogue]]
speaker = "unk"
original = "でも、セックスにのめり込むクーシェンに水を注したくなくて、無言でペニスを押し込み、最奥の子宮口をグリグリしてあげる。"
translation = "하지만, 섹스에 몰두한 쿠셰인에게 초를 치고 싶지 않아서, 무언으로 페니스를 밀어 넣고, 가장 깊은 곳의 자궁구를 슥슥 비벼준다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ふぁん<emoji=heart04>\u3000あぁん<emoji=heart04>\u3000あっ<emoji=heart04>\u3000そこ<emoji=heart04>\u3000そこ気持ちいいの<emoji=heart04>\u3000んっ、あっ、あああっ<emoji=heart04>」"
translation = "「후앙<emoji=heart04> 아앙<emoji=heart04> 앗<emoji=heart04> 거기<emoji=heart04> 거기 기분 좋아<emoji=heart04> 응, 앗, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「まだ大人ゲージ貯まりきってないくせに、子宮口で感じるなんてドスケベだな」"
translation = "「아직 어른 게이지 다 차지도 않았으면서, 자궁구로 느끼다니 엄청 야하네」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「はぁ、うっ……んっ……ううっ、言わないでよぉ～<emoji=heart04>」"
translation = "「하아, 윽…… 응…… 우우윽, 말하지 마아~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "否定しないってことは、子宮口で感じてる自覚はあるらしい。"
translation = "부정하지 않는다는 건, 자궁구로 느끼고 있다는 자각은 있는 모양이다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「はぁ、あ……んんっ……にーにー……大人ゲージ貯まったら……ボンキュッボンになって……」"
translation = "「하아, 아…… 응윽…… 오빠…… 어른 게이지 다 차면…… 나이스 바디가 돼서……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そしたらっ、あっ、ああ……にーにーの赤ちゃん……んっ、あっ……はぁ、あ……産んであげるねっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「な、なに言い出すんだよ」"
translation = "「무, 무슨 말을 꺼내는 거야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「だって……ボクが進化したら……こういうこと、すると……んんっ……ニンシンしちゃうんでしょ<emoji=heart04>」"
translation = "「그치만…… 내가 진화하면…… 이런 거, 하면…… 응윽…… 임신해 버리잖아<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「えへへ……<emoji=heart04>\u3000やっと……にーにーに反撃できたね<emoji=heart04>」"
translation = "「에헤헤……<emoji=heart04> 드디어…… 오빠한테 반격했네<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「いいよ……んんっ……<emoji=heart04>\u3000大人ゲージが、いっぱいになる前の……今だけだから……あっ、んうぅうっ……このボクを……めいっぱい楽しんでね<emoji=heart04>」"
translation = "「괜찮아…… 응윽……<emoji=heart04> 어른 게이지가, 가득 차기 전의…… 지금뿐이니까…… 앗, 응으으윽…… 이 나를…… 마음껏 즐겨줘<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「今なら、可愛いメイドさんに……はぁ、あっ、あ、んんっ……中出し、し放題……だよっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "最大火力の誘惑をして、プリッとしたおしりを一振り。たったそれだけで、射精しそうなほどの快感が直撃した。"
translation = "최대 화력의 유혹을 하고, 탱탱한 엉덩이를 한번 흔들었다. 단지 그것만으로, 사정할 것 같은 쾌감이 직격했다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んあ<emoji=heart04>\u3000あぁっ<emoji=heart04>\u3000あぁぁんっ<emoji=heart04>\u3000やったぁ<emoji=heart04>\u3000にーにーの、スイッチぃ……入ったぁっ<emoji=heart04>」"
translation = "「응아<emoji=heart04> 아아앗<emoji=heart04> 아아앙윽<emoji=heart04> 해냈다아<emoji=heart04> 오빠의, 스위치이…… 들어갔다아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "煽られてるのはわかっていても、腰を動かさずにはいられない。"
translation = "도발당하고 있다는 걸 알면서도, 허리를 움직이지 않을 수 없다."

[[dialogue]]
speaker = "unk"
original = "クーシェンの体を気遣う余裕も失い、自分本位の激しい腰使いで短い膣道を貪っていく。"
translation = "쿠셰인의 몸을 신경 쓸 여유도 잃고, 자기위주의 격렬한 허리놀림으로 짧은 질도를 탐해 간다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んぅっ<emoji=heart04>\u3000は、はげしっ<emoji=heart04>\u3000にーにーの本気ち○ちんだぁっ<emoji=heart04>\u3000あっ、あ、あああっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「このまま、んんっ<emoji=heart04>\u3000ボクのおま○こ、使って、あ、あぁうっ、んんっ<emoji=heart04>\u3000せーし出すまで、気持ちよくなっちゃうんだよねっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「本気でボクのこと、欲しがってる気持ちっ……んんっ……伝わってくるよぉ<emoji=heart04>\u3000にーにー<emoji=heart04>\u3000あぁぁっ<emoji=heart04>\u3000にーにー好きぃ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "性的に蹂躙されてるくせに、幸せそうに悦んでいる。"
translation = "성적으로 유린당하고 있으면서, 행복하다는 듯이 기뻐하고 있다."

[[dialogue]]
speaker = "unk"
original = "きゃんきゃん鳴くようなクーシェンの喘ぎ声は、ただでさえ暴走状態の俺を更に興奮させ、肉竿をパンパンに膨らませた。"
translation = "끙끙 울부짖는 듯한 쿠셰인의 교성은, 가뜩이나 폭주 상태인 나를 더욱 흥분시켜, 육봉을 빵빵하게 부풀렸다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んぐっ<emoji=heart04>\u3000ふっとぉ<emoji=heart04>\u3000にーにーのおち○ちん、限界までおっきくなってるよぉ<emoji=heart04>」"
translation = "「응귿<emoji=heart04> 두꺼워어<emoji=heart04> 오빠 자지, 한계까지 커졌어어<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「デカすぎて苦しくないか？」"
translation = "「너무 커서 괴롭지 않아?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ちょっとつらいけど、あっ、あああっ<emoji=heart04>\u3000は、ああっ<emoji=heart04>\u3000でも、すっごく気持ちいいから……へーきぃ<emoji=heart04>」"
translation = "「조금 힘들지만, 앗, 아아앗<emoji=heart04> 하, 아앗<emoji=heart04> 그래도, 엄청 기분 좋으니까…… 괜찮아아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "恋人になってから何度もセックスしたせいで、すっかりこういうので感じるようになってしまった。"
translation = "연인이 되고 나서 몇 번이나 섹스한 탓에, 완전히 이런 것으로 느끼게 되어 버렸다."

[[dialogue]]
speaker = "unk"
original = "苦しさ２割、残り全部気持ちいいだけ。激しくされることがむしろスパイスになっている。"
translation = "괴로움 2할, 나머지 전부 기분 좋을 뿐. 격렬하게 해주는 것이 오히려 스파이스가 되고 있다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「うあぁぁっっ<emoji=heart04>\u3000あぁんっ<emoji=heart04>\u3000すごいっ<emoji=heart04>\u3000おち○ちんズンズンって<emoji=heart04>\u3000もっと<emoji=heart04>\u3000もっとボクをムチャクチャにしてぇぇっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「おっぱいもっ<emoji=heart04>\u3000おしりも<emoji=heart04>\u3000にーにーが好きなとこ全部使っていいから<emoji=heart04>\u3000あっ、ああっ<emoji=heart04>\u3000ボクの全部っ、にーにーのものにしてっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んああぁぁあっ<emoji=heart04>\u3000あぁっ<emoji=heart04>\u3000うあぁっ<emoji=heart04>\u3000しゅごいっ<emoji=heart04>\u3000しゅごいよぉぉおっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "クーシェンのリクエストに応えるようにひたすら激しく愛していく。"
translation = "쿠셰인의 리퀘스트에 응하듯 오로지 격렬하게 사랑해 간다."

[[dialogue]]
speaker = "unk"
original = "どのくらいしたら大丈夫かは、何度もしたからわかってる。でも、わかっていてもコントロール出来ないことだってあるから。"
translation = "어느 정도 해야 괜찮을지는, 몇 번이나 했으니까 알고 있다. 하지만, 알고 있어도 컨트롤할 수 없는 것도 있으니까."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ひうっ<emoji=heart04>\u3000んんん～～～っ<emoji=heart04>\u3000んふっ<emoji=heart04>\u3000うぐっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「悪い、強くしすぎた！」"
translation = "「미안, 너무 세게 했다!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んっ、ううんっ、へーき、だからっ<emoji=heart04>\u3000あっ、ああ……あ、も、もっと、もっとぉ、ズンズンしてぇぇっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "お詫びのつもりで、クーシェンの性感帯すべてを狙い撃ちだ。"
translation = "사과의 의미로, 쿠셰인의 성감대 전부를 조준 사격이다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ふあぁんっ<emoji=heart04>\u3000そこいい<emoji=heart04>\u3000クリぃ<emoji=heart04>\u3000グリグリ～って<emoji=heart04>\u3000感じすぎちゃうよぉぉ<emoji=heart04>」"
translation = "「후아앙잇<emoji=heart04> 거기 좋아<emoji=heart04> 클리이<emoji=heart04> 슥슥~ 하고<emoji=heart04> 너무 느껴버려어어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "クリトリスを指で押し込むと、可愛い乳首をパンパンに膨らませながら、切ない声で喘ぎまくる。"
translation = "클리토리스를 손가락으로 누르자, 귀여운 유두를 빵빵하게 부풀리면서, 안타까운 목소리로 쉴 새 없이 애원한다."

[[dialogue]]
speaker = "unk"
original = "腰を突き出すリズムに合わせて小振りなおっぱいが揺れて、まるでおねだりしてるみたいだ。"
translation = "허리를 들이미는 리듬에 맞춰 아담한 가슴이 흔들려서, 마치 조르는 것만 같다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んあぁっ<emoji=heart04>\u3000おっぱいっ<emoji=heart04>\u3000ぎゅうううって<emoji=heart04>\u3000ダメぇっ<emoji=heart04>\u3000引っ張ったら取れちゃうからぁ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でもこうするとめちゃくちゃま○こ締まるぞ」"
translation = "「하지만 이렇게 하면 엄청나게 보지 죄어든다고」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「や、あぁあ、んんっ<emoji=heart04>\u3000そんなこと、ないもんっ<emoji=heart04>\u3000んっ、あっ、あ、あ、ああっ、あ、あああっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ただでさえきつい締め付けが強まり、何度も小さい絶頂を迎えているのがわかる。"
translation = "가뜩이나 조이는 압박이 강해져, 몇 번이나 작은 절정을 맞이하고 있는 것을 알 수 있다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「イく<emoji=heart04>\u3000イっちゃうからぁぁっ<emoji=heart04>\u3000ねえっ、にーにーも<emoji=heart04>\u3000まだなの？\u3000せーしびゅってしないのぉ？」"
translation = ""

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクはいつでもいいからっ<emoji=heart04>\u3000んんうっ<emoji=heart04>\u3000来て<emoji=heart04>\u3000にーにーのエッチなの、全部ボクに出してっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにー専用のメイドおま○こにっ<emoji=heart04>\u3000せーし<emoji=heart04>\u3000せーし出してっ<emoji=heart04>\u3000ボクのおなか、ぽっこりしちゃうくらいっ<emoji=heart04>\u3000ドプドブ出してぇぇぇっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "中出しし放題な俺専用ま○こが、ザーメンを飲みたがってる。"
translation = "질내사정을 마음껏 할 수 있는 나 전용 보지가, 자지를 마시고 싶어 한다."

[[dialogue]]
speaker = "unk"
original = "言葉だけじゃなく、膣内の収縮でも強く訴えてきて、限界寸前のペニスにしゃぶりついてきた。"
translation = "말뿐만 아니라, 질 내의 수축으로도 강하게 호소해 와서, 한계 직전의 페니스를 매달려 왔다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにー<emoji=heart04>\u3000好き<emoji=heart04>\u3000好きぃぃっ<emoji=heart04>\u3000ボクもう無理だからっ<emoji=heart04>\u3000イく<emoji=heart04>\u3000んあぁぁっ<emoji=heart04>\u3000イぐぅぅぅっ<emoji=heart04>\u3000ごめん、先、イっちゃっうぅぅ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んうぅっ<emoji=heart04>\u3000イく<emoji=heart04>\u3000イくイくイくぅぅっ<emoji=heart04>\u3000イっっくぅぅ～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응우읏<emoji=heart04> 가<emoji=heart04> 가가갈게에에읏<emoji=heart04> 가아아악～～～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "耐えきれなくなって、クーシェンが達してしまう。"
translation = "견딜 수 없게 되어서, 쿠셰인이 도달해 버린다."

[[dialogue]]
speaker = "unk"
original = "全身を打ち震わせながらの絶頂は、可愛いと同時に淫靡で、俺にとって最後の一押しとなった。"
translation = "전신을 경련시키면서의 절정은, 귀여움과 동시에 음란해서, 나에게 있어서 마지막 밀어붙이기가 되었다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ふあぁっ<emoji=heart04>\u3000ふぅっ<emoji=heart04>\u3000んんんぅ～～～～<emoji=heart04>\u3000せーし来たぁ<emoji=heart04>\u3000にーにーのえっちザーメン<emoji=heart04>\u3000どぷっ、どぷって<emoji=heart04>」"
translation = "「후아앗<emoji=heart04> 후윽<emoji=heart04> 응응응으~~~~<emoji=heart04> 정자 왔다아<emoji=heart04> 오빠의 야한 정액<emoji=heart04> 꿀컥, 꿀컥하고<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "子宮口に先端をぴったり押し当てての大量放出。"
translation = "자궁구에 선단을 딱 밀어붙이고의 대량 방출."

[[dialogue]]
speaker = "unk"
original = "クーシェンの大好きな膣内射精を見事達成して、薄いおなかが膨らむくらいに注ぎ込んでいく。"
translation = "쿠셰인이 너무 좋아하는 질내사정을 훌륭히 달성해서, 얇은 배가 부풀어 오를 정도로 쏟아부어 간다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ううっ、いつもだけどすごい量だよぉぉ<emoji=heart04>\u3000いくら魔王だからって出しすぎぃ<emoji=heart04>」"
translation = "「우우윽, 항상 그렇지만 엄청난 양이야아아<emoji=heart04> 아무리 마왕이라고 해도 너무 냈어어<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「クーシェンが可愛すぎるせいだぞ」"
translation = "「쿠셰인이 너무 귀여운 탓이다」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そ、それなら……しょーがないかぁ……えへへ、たっぷりのせーしは愛情の証だね<emoji=heart04>」"
translation = "「그, 그렇다면…… 어쩔 수 없나아…… 에헤헤, 가득 찬 정자는 애정의 증표네<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "クーシェンも慣れたもので、自ら亀頭と子宮口をぴったりくっつけて、俺の分身を余さず受け入れようとしている。"
translation = "쿠셰인도 익숙해진 것으로, 스스로 귀두와 자궁구를 딱 밀착시켜서, 나의 분신을 빠짐없이 받아들이려고 하고 있다."

[[dialogue]]
speaker = "unk"
original = "魔族の本能か、それとも女の子だけが持つスキルなのか。クーシェンはおま○こでもごっくん上手だ。"
translation = "마족의 본능인가, 아니면 여자아이만이 가진 스킬인가. 쿠셰인은 보지로도 꿀꺽 잘한다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いつもありがとうな」"
translation = "「항상 고마워」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「えへへ……どういたしまして、だよ、にーにー<emoji=heart04>\u3000ボクのほうこそ、いっぱい気持ちよくしてくれてありがとね<emoji=heart04>」"
translation = "「에헤헤…… 별말씀을, 이야, 오빠<emoji=heart04> 나야말로, 가득 기분 좋게 해줘서 고마워<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ふにゃっと笑ってくれるのが可愛い。"
translation = "흐물흐물 웃어주는 것이 귀엽다."

[[dialogue]]
speaker = "unk"
original = "けど、俺の欲望は底なしで、脈動を繰り返しては、こってり濃厚な白濁液をクーシェンに注ぎ続けている。"
translation = "하지만, 나의 욕망은 끝이 없어서, 맥동을 되풀이하고는, 걸쭉하고 농후한 백탁액을 쿠셰인에게 계속 쏟아붓고 있다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んぅ～<emoji=heart04>\u3000もー、ボクが可愛いからって、何回ドクドクするのぉ？」"
translation = "「응으~<emoji=heart04> 정말이지, 내가 귀엽다고 해서, 몇 번이나 꿈틀꿈틀하는 거야아?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「にーにーのせーしでおなかずっしり重いし……まあ、いつもこうだから、別にいいけどね<emoji=heart04>」"
translation = "「오빠의 정자로 배가 묵직하게 묵직하고…… 뭐, 항상 이러니까, 딱히 상관없지만 말야<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「何度もこんなエッチされちゃってるから、ボクも癖になっちゃった。にーにーのせーし、気持ちいいよ<emoji=heart04>」"
translation = "「몇 번이나 이런 야한 걸 당해버려서, 나도 버릇이 되어버렸어. 오빠의 정자, 기분 좋아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "クーシェンは嬉しそうに俺の射精を最後まで受け止めてくれた。"
translation = "쿠셰인은 기쁜 듯이 나의 사정을 끝까지 받아들여 주었다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「んうっ……どろぉ～～って出ちゃう……<emoji=heart04>」"
translation = "「응윽…… 주르륵~~하고 나와버려……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "射精を終えたペニスを抜き取ると、腹圧で押し出されたザーメンが大量に溢れ出た。"
translation = "사정을 마친 페니스를 뽑아내자, 복압으로 밀려 나온 정액이 대량으로 흘러넘쳤다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「またこぼしちゃった<emoji=heart04>\u3000せっかくにーにーがいっぱい出してくれたのにごめんなさい」"
translation = "「또 쏟아버렸네<emoji=heart04> 모처럼 오빠가 가득 내주었는데 죄송해요」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクが進化したら、これ全部受け止められるのかなぁ？」"
translation = "「내가 진화하면, 이거 전부 받아낼 수 있으려나아?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うん、きっとね」"
translation = "「응, 틀림없이」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「あ、でも……そのときはニンシンしちゃうね<emoji=heart04>\u3000ねぇ、にーにー、どうする？」"
translation = "「아, 하지만…… 그때는 임신해 버리네<emoji=heart04> 있잖아, 오빠, 어떻게 할 거야?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクはね……にーにーのこと、好きだなって思うようになってから、そのこと考えてるよ」"
translation = "「나는 말야…… 오빠를, 좋아한다고 생각하게 되고 나서부터, 그 생각 하고 있어」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「えへへへ<emoji=heart04>」"
translation = "「에헤헤헤<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「いつかにーにーの赤ちゃん産んであげるね<emoji=heart04>」"
translation = "「언젠가 오빠의 아기 낳아 줄게<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そんなことを言われたら、射精直後だっていきり立つ。"
translation = "그런 소리를 들으면, 사정 직후라도 솟구친다."

[[dialogue]]
speaker = "unk"
original = "ザーメンまみれの肉棒はムクムクと膨らみ、上を向いてしまう。"
translation = "정액 범벅이 된 육봉은 뭉게뭉게 부풀어 올라, 위를 향해 버린다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「あれ？\u3000にーにー？\u3000もしかしてボク余計なこと言っちゃった？\u3000おち○ちんこわいよ？」"
translation = "「어라? 오빠? 혹시 내가 쓸데없는 말 해버렸어? 자지 무서운데?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「大丈夫、１回じゃ終わらないのはいつものことだろ」"
translation = "「괜찮아, 1번으로 끝나지 않는 건 평소 있던 일이잖아」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そ、そうだけど……ボク、まだニンシンしないよ？」"
translation = "「그,렇지만…… 나, 아직 임신 안 한다고?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だから、今から予行演習だ」"
translation = "「그러니까, 지금부터 예행연습이다」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そ、そっか……にーにーがしたいなら……いいよ<emoji=heart04>\u3000ボクもさっきせーし漏らしちゃったから、注いでもらう余裕できたし<emoji=heart04>」"
translation = "「그, 그렇구나…… 오빠가 하고 싶다면…… 좋아<emoji=heart04> 나도 아까 정자 흘려버렸으니까, 쏟아부어 받을 여유 생겼고<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「だから、好きなだけボクに出してね<emoji=heart04>\u3000にーにーのせーしは全部ボクのものだから<emoji=heart04>」"
translation = "「그러니까, 원하는 만큼 나한테 내줘<emoji=heart04> 오빠의 정자는 전부 내 거니까<emoji=heart04>」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクはにーにー専用のメイドさんだよ<emoji=heart04>\u3000おま○こだけじゃなく全身で頑張るから、いっぱい気持ちよくなって満足してね<emoji=heart04>」"
translation = "「나는 오빠 전용 메이드씨야<emoji=heart04> 보지뿐만 아니라 전신으로 힘낼 테니까, 가득 기분 좋아져서 만족해줘<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "いつもの挑発的な言動とも違う、甘さ１００％の誘惑をぶつけられて、もう止まらない。"
translation = "평소의 도발적인 언동과도 다른, 달콤함 100%의 유혹을 부딪쳐와서, 이제 멈출 수 없다."

[[dialogue]]
speaker = "unk"
original = "こうして俺はまんまとクーシェンの思惑に乗っかり、時間を忘れて何度も愛し合うのだった。"
translation = "이렇게 나는 보기 좋게 쿠셰인의 의도에 놀아나, 시간을 잊고 몇 번이고 계속 사랑을 나누는 것이었다."

