[[dialogue]]
speaker = "unk"
original = "第８話,真相,B"
translation = "제8화, 진상, B"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（…………ここ、は？）"
translation = "（…………여기, 는?）"

[[dialogue]]
speaker = "unk"
original = "──深い、深い暗闇。"
translation = "──깊고 깊은 어둠."

[[dialogue]]
speaker = "unk"
original = "どこまでも沈んでいく錯覚を覚えるような、底なしの深淵の中で、ナターシャはもがく。"
translation = "끝없이 가라앉는 착각을 느낄 법한 바닥 없는 심연 속에서 나타샤는 허우적거린다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（メルエルは……いる……）"
translation = "（멜엘은…… 있어……）"

[[dialogue]]
speaker = "unk"
original = "先ほど繋いだ掌の感触だけは、どうにか感じられる──けれど、姿は見えない。"
translation = "조금 전 맞잡은 손바닥의 감촉만은 어떻게든 느껴진다── 하지만 모습은 보이지 않는다."

[[dialogue]]
speaker = "unk"
original = "壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ──"
translation = "부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라 부숴라──"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（……うるっさ）"
translation = "（……시끄러워）"

[[dialogue]]
speaker = "unk"
original = "滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ──"
translation = "멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라 멸해라──"

[[dialogue]]
speaker = "unk"
original = "頭の中でこだまする声と共に、ここではない、今でもない記憶が雪崩れ込んでくる──"
translation = "머릿속에서 메아리치는 목소리와 함께, 이곳이 아닌, 지금도 아닌 기억이 해일처럼 밀려온다──"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（……鏡界の湖？）"
translation = "（……경계의 호수?）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（現代の……森羅歴３００２年の、じゃない──）"
translation = "（현대의…… 신라력 3002년의 것이 아냐──）"

[[dialogue]]
speaker = "unk"
original = "湖のほとりに佇んでいる、２人の天使の少女──彼女たちの服装が、現代のものではなかった。"
translation = "호숫가에 서 있는 두 천사 소녀── 그녀들의 복장이 현대의 것이 아니었다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（……何これ。悪い冗談？\u3000だって、あの２人……）"
translation = "（……뭐야 이거. 질 나쁜 농담? 그야, 저 두 사람……）"

[[dialogue]]
speaker = "unk"
original = "彼女たちは、あまりにも──ナターシャとメルエルに似ていた。"
translation = "그녀들은 너무나도── 나타샤와 멜엘을 닮아 있었다."

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「姫様……もう、おやめ下さい。綺麗だった羽が、こんなにも黒く染まって……」"
translation = "「공주님…… 이제 그만두세요. 아름답던 날개가 이렇게나 검게 물들어서……」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「でも誰かがやらないと、世界が滅んじゃうもの──それにこれは、魔王の血を受け継ぐ私にしかできないことだから！」"
translation = "「하지만 누군가가 하지 않으면 세계가 멸망해 버리는걸── 게다가 이건 마왕의 피를 이어받은 나밖에 할 수 없는 일이니까!」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「……例の『霧』が、また魔界で生まれちゃったみたい。ついてきてくれる？」"
translation = "「……그 『안개』가 또 마계에서 태어난 모양이야. 같이 와 줄래?」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「…………仰せのままに。姫様」"
translation = "「…………명령대로. 공주님」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「うん、ありがとう。その……」"
translation = "「응, 고마워. 그……」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「いつも心配かけて、ごめんね──？」"
translation = "「언제나 걱정 끼쳐서 미안해──?」"

[[dialogue]]
speaker = "unk"
original = "それは約２０００年前の出来事──"
translation = "그것은 약 2000년 전의 일──"

[[dialogue]]
speaker = "unk"
original = "魔王ラクシスがいなくなり、世界から霊力が跡形もなく消え失せ、人々が新しく星の力を継承した、黎明の時。"
translation = "마왕 락시스가 사라지고 세계에서 영력이 흔적도 없이 사라져 사람들이 새롭게 별의 힘을 계승한 여명의 시기."

[[dialogue]]
speaker = "unk"
original = "ナターシャは途切れ途切れに映される光景を見て、情報を得ていく──"
translation = "나타샤는 띄엄띄엄 비치는 광경을 보며 정보를 얻어간다──"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「はぁっ……はぁっ……！\u3000これで、おわ、り……っ」"
translation = "「하아…… 하아……! 이걸로, 끝……」"

[[dialogue]]
speaker = "unk"
original = "この時代のリクリエの脅威は、森羅歴３００２年のものとは大きく異なっていた。"
translation = "이 시대의 리크리에의 위협은 신라력 3002년의 것과는 크게 달랐다."

[[dialogue]]
speaker = "unk"
original = "アステラも、モンスターも、リクリエの使徒もいない。"
translation = "아스텔라도, 몬스터도, 리크리에의 사도도 없다."

[[dialogue]]
speaker = "unk"
original = "あるのは、世界を作り替える『リクリエの霧』。散発的に発生する霧の内部からは、異形の怪物が現れる。"
translation = "있는 것은 세계를 다시 만드는 『리크리에의 안개』. 산발적으로 발생하는 안개 내부에서는 이형의 괴물이 나타난다."

[[dialogue]]
speaker = "unk"
original = "霧から生まれた怪物を倒すと、リクリエの瘴気が飛散し、近くにいる者を汚染していくのだ──"
translation = "안개에서 태어난 괴물을 쓰러뜨리면 리크리에의 장기가 비산하여 근처에 있는 자를 오염시키는 것이다──"

[[dialogue]]
speaker = "unk"
original = "それはきっと『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』が試していた、再創生のためのプログラムの１つ。"
translation = "그것은 분명 『<ruby>XELOS<rt>제로스</rt></ruby>』가 시험하고 있던 재창생을 위한 프로그램 중 하나."

[[dialogue]]
speaker = "unk"
original = "リクリエの使徒やアステラモンスターを作り上げる前の、いわば実験段階だったのかもしれない。"
translation = "리크리에의 사도나 아스텔라 몬스터를 만들어내기 전의, 말하자면 실험 단계였을지도 모른다."

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「姫様っ……しっかり──」"
translation = "「공주님…… 정신 차리세요──」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「う、うん……大丈夫……大丈夫、だから……」"
translation = "「으, 응…… 괜찮아…… 괜찮으니까……」"

[[dialogue]]
speaker = "unk"
original = "リクリエの瘴気は、捉えたものを再構築する。"
translation = "리크리에의 장기는 포착한 것을 재구축한다."

[[dialogue]]
speaker = "unk"
original = "星騎士たちは、星力で編んだ戦闘服によってそれを弾くが──"
translation = "성기사들은 성력으로 짠 전투복으로 그것을 튕겨내지만──"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "（２０００年前は、星力の研究も不十分。鍛錬するための専門機関もなかった……）"
translation = "（2000년 전에는 성력 연구도 불충분. 단련하기 위한 전문 기관도 없었어……）"

[[dialogue]]
speaker = "unk"
original = "魔王の血を引く天界の姫は、人々を守るために戦い、そのたびに瘴気に汚染されていく。"
translation = "마왕의 피를 이어받은 천계의 공주는 사람들을 지키기 위해 싸웠고, 그때마다 장기에 오염되어 갔다."

[[dialogue]]
speaker = "unk"
original = "天界の姫は、誰よりも多くの怪物を斃した。"
translation = "천계의 공주는 누구보다도 많은 괴물을 처단했다."

[[dialogue]]
speaker = "unk"
original = "三界を渡り歩き、霧から生まれる異形を切り捨て……日を追うごとに姫の羽はどす黒く染まっていく。"
translation = "삼계를 넘나들며 안개에서 태어나는 이형을 베어 넘겼고…… 날이 갈수록 공주의 날개는 거무죽죽하게 물들어 갔다."

[[dialogue]]
speaker = "unk"
original = "しかし彼女は止まらなかった。魔王ラクシスの守ったこの世界を、後世に遺すために戦い続けた。"
translation = "하지만 그녀는 멈추지 않았다. 마왕 락시스가 지킨 이 세계를 후세에 남기기 위해 계속 싸웠다."

[[dialogue]]
speaker = "unk"
original = "そして──"
translation = "그리고──"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「…………世界を、ほろ、ぼす──」"
translation = "「…………세계를, 멸, 한다──」"

[[dialogue]]
speaker = "unk"
original = "羽が完全に黒く染まったその時、彼女の人格は乗っ取られた。"
translation = "날개가 완전히 검게 물든 그때, 그녀의 인격은 탈취당했다."

[[dialogue]]
speaker = "unk"
original = "従者が何よりも好きだった姫の外見は、変貌していた。"
translation = "종자가 무엇보다 좋아했던 공주의 외형은 변모해 있었다."

[[dialogue]]
speaker = "unk"
original = "亜麻色の髪は白く染まり、慈しみに満ちた瞳は紅く輝き、誰もが見とれた純白の羽は、見る影もない墨色へ。"
translation = "아마색 머리카락은 하얗게 물들고, 자애로 가득 찼던 눈동자는 붉게 빛나며, 모두가 넋을 잃고 보던 순백의 날개는 흔적도 없는 먹색으로."

[[dialogue]]
speaker = "unk"
original = "誰よりも平和を願い、誰よりも優しくまっすぐだった少女は、世界の再創生を願う殺戮の天使となってしまった。"
translation = "누구보다 평화를 바라고 누구보다 다정하고 곧았던 소녀는, 세계의 재창생을 바라는 살육의 천사가 되어버렸다."

[[dialogue]]
speaker = "unk"
original = "人間界で、魔界で、天界で──堕天使の少女は暴虐の限りを尽くした。"
translation = "인간계에서, 마계에서, 천계에서── 타락한 천사 소녀는 폭거를 일삼았다."

[[dialogue]]
speaker = "unk"
original = "のちの時代に『太陽の壁画』として遺されるほどの恐怖を、振りまき続けた……"
translation = "후세에 『태양의 벽화』로 남겨질 정도의 공포를 계속 뿌리고 다녔다……"

[[dialogue]]
speaker = "unk"
original = "そして──殺戮の魔王は、天界の神殿内で最期を遂げた。"
translation = "그리고── 살육의 마왕은 천계의 신전 내에서 최후를 맞이했다."

[[dialogue]]
speaker = "unk"
original = "人間と天使と魔族が手を取った連合軍が、とうとう仕留めたのだ。"
translation = "인간과 천사와 마족이 손을 잡은 연합군이 드디어 처단한 것이다."

[[dialogue]]
speaker = "unk"
original = "魔女の助力を得て完成させた、魔王因子を削り取る宝玉を用いて、弱体化させ──"
translation = "마녀의 조력을 얻어 완성시킨, 마왕 인자를 깎아내는 보옥을 사용하여 약화시키고──"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「だから……言ったのに……」"
translation = "「그러니까…… 말했는데……」"

[[dialogue]]
speaker = "unk"
original = "悪に堕ちた天使の心臓を貫いたのは、従者の剣だった。"
translation = "악으로 타락한 천사의 심장을 꿰뚫은 것은 종자의 검이었다."

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「魔王の血統だなんて、意識しないでって……」"
translation = "「마왕의 혈통 같은 거 의식하지 말라고……」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「自分のこと、もっと大事にしてって……」"
translation = "「자신을 좀 더 소중히 여기라고……」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「姫様の……まっすぐで、ひたむきなところ……」"
translation = "「공주님의…… 곧고 한결같은 점……」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「だいっきらい…………」"
translation = "「정말 싫어…………」"

[[dialogue]]
speaker = "unk"
original = "忌むべき魔王が息を引き取った神殿は、天界でも場所を秘匿され。"
translation = "기피해야 할 마왕이 숨을 거둔 신전은 천계에서도 장소가 은폐되었고."

[[dialogue]]
speaker = "unk"
original = "魔王因子に働きかける宝玉は、その最奥に安置され、神殿の機能そのものを担った──"
translation = "마왕 인자에 작용하는 보옥은 그 최심부에 안치되어 신전의 기능 자체를 담당하게 되었다──"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「……ナターシャちゃんにも、見えた？」"
translation = "「……나타샤 짱에게도 보였어?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うん。どうやら２０００年前からの腐れ縁だったみたいだね、私たち」"
translation = "「응. 아무래도 2000년 전부터 이어진 악연이었나 보네, 우리」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「それにしても、ここまで似てるだなんてね。そりゃあ私が、メルエルのことを嫌いになるわけだよ」"
translation = "「그건 그렇고 이렇게까지 닮았다니 말이야. 그러니 내가 멜엘을 싫어하게 될 법도 하지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「メルエルは、自分が魔王の血を引く天使だなんて、知らないはずなのに……高貴なる者の精神ってやつ？\u3000あるいは王の器ってやつなのかな？」"
translation = "「멜엘은 자신이 마왕의 피를 이어받은 천사라는 걸 모를 텐데…… 고귀한 자의 정신이라는 건가? 아니면 왕의 그릇이라는 걸까?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「誰かのためなら、世界のためなら……自分の命だってあっさり<ruby>懸<rt>か</rt></ruby>けちゃいそうな、そんな危うさがあった……」"
translation = "「누군가를 위해서라면, 세계를 위해서라면…… 자기 목숨 정도는 가볍게 걸어버릴 것 같은 그런 위태로움이 있었어……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「まさか、私のご先祖様まで同じ悩みを持ってただなんてね」"
translation = "「설마 내 조상님까지 같은 고민을 하고 있었을 줄이야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「メルエルの『強いところ』が、私は嫌い……」"
translation = "「멜엘의 『강한 점』이 나는 싫어……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「その『強さ』は、いつかメルエル自身を殺してしまう。ずっとそう思ってた……」"
translation = "「그 『강함』은 언젠가 멜엘 자신을 죽여버릴 거야. 계속 그렇게 생각했어……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「で──やっぱり、そうなってたわけじゃん。２０００年も前にさ」"
translation = "「그런데── 역시 그렇게 되어 있었잖아. 2000년 전에도 말이지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……最悪だよ。世界のために戦ってたのに。世界中から恨まれる悪の魔王になって、壁画にまで残されて……」"
translation = "「……최악이야. 세계를 위해 싸웠는데. 온 세상에서 원망받는 악의 마왕이 되어 벽화에까지 남겨지고……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「じゃ、じゃあ、ナターシャちゃんが私を『嫌い』って言ってたのは、私のためを思って……！？」"
translation = "「그, 그럼 나타샤 짱이 나를 『싫어』한다고 했던 건 나를 생각해서……!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ううん。『何も知らない小娘』を護衛をさせられてることも、シンプルにムカついてたよ？」"
translation = "「아니. 『아무것도 모르는 꼬맹이』를 호위하게 된 것도 단순하게 짜증 났거든?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「えぇえええっ……！？」"
translation = "「에에에에엑……!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そりゃ、いい気持ちするわけないじゃん。同い年の女の子を四六時中、年中無休で護衛するんだよ？」"
translation = "「그야 기분이 좋을 리 없잖아. 동갑내기 여자애를 24시간 연중무휴로 호위해야 한다고?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「しかも、守られてることにも気づいてもいないし。仕事中なのに呑気に話しかけて来るし」"
translation = "「게다가 보호받고 있다는 사실도 눈치 못 채고, 업무 중인데도 태평하게 말을 걸어오고」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「で、でも……！\u3000ナターシャちゃんは、私が無自覚に天界の姫のように振舞うのが『嫌い』、だったんだよね？」"
translation = "「하, 하지만……! 나타샤 짱은 내가 무자각하게 천계의 공주처럼 구는 게 『싫다』고 했던 거지?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「『天界の姫のように振舞うメルエル』のことが嫌いだし、『何も知らない小娘のメルエル』にもイラついてたよ」"
translation = "「『천계의 공주처럼 구는 멜엘』도 싫고, 『아무것도 모르는 꼬맹이 멜엘』에게도 짜증 났어」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「そ、それは矛盾って言うんじゃないかなぁ！？」"
translation = "「그, 그건 모순이라고 하지 않아!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そう矛盾だよ。私はメルエルに対して、矛盾した気持ちを持ってる」"
translation = "「그래 모순이야. 나는 멜엘에 대해 모순된 감정을 가지고 있어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「『何も知らない小娘のメルエル』のことも、『天界の姫のように振舞うメルエル』のことも、どっちも嫌い」"
translation = "「『아무것도 모르는 꼬맹이 멜엘』도, 『천계의 공주처럼 구는 멜엘』도 둘 다 싫어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「どっちに寄せても大嫌いなわけで、こんなの、メルエル側でどうこうできないでしょ？\u3000だから言ったじゃん。私たちは仲直りなんてできないよ」"
translation = "「어느 쪽이든 정말 싫은 건 마찬가지라 이런 건 멜엘 쪽에서 어떻게 할 수 있는 게 아니잖아? 그러니까 말했잖아. 우리는 화해 같은 거 못 한다고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「これは私の中にある矛盾で、全部、私が自分勝手な感情でメルエルにイライラしてるだけなんだから」"
translation = "「이건 내 안에 있는 모순이고, 전부 내가 제멋대로인 감정으로 멜엘에게 짜증 내고 있는 것뿐이니까」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（ナターシャちゃんは冗談めかして言ってくれるけど……これはきっと、ナターシャちゃんの本音）"
translation = "（나타샤 짱은 농담조로 말해주지만…… 이건 분명 나타샤 짱의 본심이야）"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（今まで誰にも言えず、かと言って逃げることもできないで……そんなナターシャちゃんに、私が付けてきた傷なんだ……）"
translation = "（지금까지 누구에게도 말하지 못하고, 그렇다고 도망칠 수도 없어서…… 그런 나타샤 짱에게 내가 입혀온 상처구나……）"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ナターシャちゃん……」"
translation = "「나타샤 짱……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──あは。そういう顔は、好き。本当に大好きだったなぁ」"
translation = "「──아하. 그런 표정은 좋아. 정말로 정말 좋아했었지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「メルエルが泣いてるとさ、『ああ、この子にも弱いところがあるんだな』って、安心できた……」"
translation = "「멜엘이 울고 있으면 말이야, 『아아, 이 아이에게도 약한 면이 있구나』 하고 안심할 수 있었어……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ずっとこのまま泣いててくれたら、いっそ心なんて折れちゃえば。危ない目になんて遭わないのにって──」"
translation = "「계속 이대로 울어준다면, 차라리 마음이 꺾여버린다면. 위험한 일 따위 겪지 않을 텐데 하고──」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「私の泣いてるところが好き……そ、そういう意味、だったんだ……？」"
translation = "「내가 우는 모습이 좋다니…… 그, 그런 의미였어……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ま、単純な嗜好の面でも好きだけどね？」"
translation = "「뭐, 단순한 취향 면에서도 좋아하지만 말이야?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「えっ」"
translation = "「엣」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「私……メルエルの『顔』、好きなんだよねぇ」"
translation = "「나…… 멜엘의 『얼굴』, 좋아하거든」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ほんと──顔と体だけは最高だよ、メルエル」"
translation = "「정말── 얼굴이랑 몸만큼은 최고야, 멜엘」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ええっ！？」"
translation = "「에엣!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「でさ、好みの顔の女が泣いてるのって──凄く興奮するんだよね。ゾクゾクするっていうかさ」"
translation = "「그리고 말이야, 취향인 얼굴의 여자가 울고 있는 건── 굉장히 흥분되거든. 전율이 돋는달까」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ど、どういうことぉ！？」"
translation = "「무, 무슨 소리야!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──ふふっ。冗談だよ、じょーだん」"
translation = "「──후훗. 농담이야, 농담」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あ～あ。こんなこと、一生喋るつもりなかったのになぁ……」"
translation = "「아~아. 이런 거 평생 말 안 할 생각이었는데……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「でも、もういいよね？\u3000だって私たち、ここで仲良く揃って死んじゃうみたいだし」"
translation = "「하지만 이제 됐겠지? 어차피 우리 여기서 사이좋게 세트로 죽을 것 같으니까」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ううん！\u3000まだだよ。ナターシャちゃんも私も、絶対に無事で、生きて戻るんだから！！」"
translation = "「아니! 아직이야. 나타샤 짱도 나도 절대로 무사히 살아서 돌아갈 거니까!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だからさ……メルエルのそういうところが、嫌いだって言ってるんだけど？」"
translation = "「그러니까…… 멜엘의 그런 점이 싫다고 하는 건데?」"

[[dialogue]]
speaker = "unk"
original = "──人々は、お前の献身を忘れた。"
translation = "──사람들은 네 헌신을 잊었다."

[[dialogue]]
speaker = "unk"
original = "──２０００年前のお前は、自らが守った者たちに、滅ぼされた。"
translation = "──2000년 전의 너는 스스로 지켰던 자들에게 멸망당했다."

[[dialogue]]
speaker = "unk"
original = "──我が身可愛さのあまり、恩を仇で返す。ヒトは不完全な生き物だ。"
translation = "──제 몸이 귀한 나머지 은혜를 원수로 갚는다. 인간은 불완전한 생물이다."

[[dialogue]]
speaker = "unk"
original = "──不完全を、完全なものへ近づける。"
translation = "──불완전을 완전한 것에 가깝게 만든다."

[[dialogue]]
speaker = "unk"
original = "──そのためにこそ、滅びからの再創生は必要なのだ。"
translation = "──그것을 위해서야말로 멸망으로부터의 재창생은 필요한 것이다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「マジでうるさいね、これ。ずっと聞こえてる……これを何とかしないと、私たちも消えちゃうよ」"
translation = "「진짜 시끄럽네 이거. 계속 들려…… 이걸 어떻게든 하지 않으면 우리도 사라질 거야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「……うん。でも、さっきと今じゃ、状況が違うから」"
translation = "「……응. 하지만 아까랑 지금은 상황이 다르니까」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「１人だけじゃ、とても耐えきれなかった。自我を塗りつぶされて、立ち上がる余裕もなかったけど……今は違うよ」"
translation = "「혼자서는 도저히 버틸 수 없었어. 자아를 잠식당해서 일어설 여유도 없었지만…… 지금은 달라」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ナターシャちゃんが、手をつないでくれてる──だから、これを起動することができる！」"
translation = "「나타샤 짱이 손을 잡아주고 있어── 그러니까 이걸 기동할 수 있어!」"

[[dialogue]]
speaker = "unk"
original = "メルエルが取り出したのは、先日緋宮クロトも触れた『アルケインカオスクエーサー』の刻まれた宝玉。"
translation = "멜엘이 꺼낸 것은 요전날 히노미야 쿠로토도 만졌던 『아케인 카오스 퀘이사』가 새겨진 보옥."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ご先祖様の過去も、私たちの前世も。太陽の壁画の真相も、全てを知ることができた……」"
translation = "「조상님의 과거도, 우리의 전생도. 태양의 벽화의 진상도 전부 알 수 있었어……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「過去の過ちは繰り返さない。きっと跳ねのけてみせる──だからナターシャちゃん」"
translation = "「과거의 실수는 반복하지 않아. 반드시 떨쳐내 보이겠어── 그러니까 나타샤 짱」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「アルケインコードを唱える私を……支えてくれる？」"
translation = "「아케인 코드를 영창하는 나를…… 지탱해 줄래?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「…………仕方ないね。ま、前世からのよしみってことで」"
translation = "「…………어쩔 수 없네. 뭐, 전생부터 이어진 인연이라는 걸로」"

[[dialogue]]
speaker = "unk"
original = "ナターシャは、メルエルの持つ宝玉にその手を重ねた。"
translation = "나타샤는 멜엘이 쥔 보옥에 그 손을 겹쳤다."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ありがとう、ナターシャちゃん。いくよ──」"
translation = "「고마워, 나타샤 짱. 간다──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（リクリエの瘴気……本当に不愉快だから。とっとと出てってよ）"
translation = "（리크리에의 장기…… 정말 불쾌하니까. 빨리 꺼져버려）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（私のメルエルに──これ以上、入ってくるな！！！）"
translation = "（나의 멜엘에게── 더 이상 들어오지 마!!!）"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「アルケイン──カオスクエーサー！！」"
translation = "「아케인── 카오스 퀘이사!!」"

