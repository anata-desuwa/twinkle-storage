[[dialogue]]
speaker = "unk"
original = "第２話,オオヒメの悩み,P"
translation = "제2화, 오오히메의 고민"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「魔王……実は最近、悩んでいることがあるのだが……聞いてもらえるだろうか？」"
translation = "「마왕…… 사실 최근, 고민하고 있는 것이 있다만…… 들어줄 수 있겠느냐?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「その悩みというのは他でもない、今のこの私の姿についてなのだが……」"
translation = "「그 고민이라는 것은 다름 아닌, 지금 이 나의 모습에 대해서다만……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「知っての通り、この姿はアニマ殿からいただいた義体が、ルヴィネ様と契約することで変化したものだ」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「新たな女神と深く繋がることで、我々守護天使にも何らかの変化が起こる可能性はあると予想はしていたものの……」"
translation = "「새로운 여신과 깊이 연결됨으로써, 우리 수호천사에게도 무언가 변화가 일어날 가능성이 있다고 예상은 했지만……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「まさかこんな姿になってしまうとは……」"
translation = "「설마 이런 모습이 되어 버릴 줄이야……」"

[[dialogue]]
speaker = "unk"
original = "でも、元の姿にも戻れるんだよね？"
translation = "그래도, 원래 모습으로 돌아갈 수 있는 거지?"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ああ、自分の意思で元の姿と、この新しい姿を切り替えることが出来る」"
translation = "「아아, 내 의지로 원래 모습과 이 새로운 모습을 전환할 수 있다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「小さくなってしまったが、守護天使としての役目に支障はない」"
translation = "「작아져 버렸지만, 수호천사로서의 역할에는 지장이 없다」"

[[dialogue]]
speaker = "unk"
original = "だったら何も問題ないのでは？"
translation = "그러면 아무 문제 없는 거 아니야?"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ん……そうなの、だが……」"
translation = "「음…… 그렇긴 하다만……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「魔王よ。あなたはそれでいいのか？」"
translation = "「마왕이여. 너는 그걸로 괜찮은 건가?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「私たちはつい先日、男女としてのお付き合いを始めたばかりではないか」"
translation = "「우리는 바로 며칠 전, 남녀로서의 교제를 막 시작한 참이 아닌가」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そんな折、恋人がこんな姿になってしまったら……」"
translation = "「그런 차원에, 연인이 이런 모습이 되어 버린다면……」"

[[dialogue]]
speaker = "unk"
original = "小さいヒメも可愛いよ"
translation = "작은 히메도 귀여워"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そうか、そうなのだろうな……そう思ってくれていることはわかってはいた……」"
translation = "「그런가, 그렇겠지…… 그렇게 생각해 주고 있다는 건 알고 있었다……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「何しろこの姿の私と２人きりになると、決まってこうやってお膝の上に乗せようとする」"
translation = "「어쨌든 이 모습인 나와 단둘이 있으면, 꼭 이렇게 무릎 위에 앉히려고 한다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「口調も心なしか柔らかくなり、常に私の頭や羽を優しく撫でてくれている」"
translation = "「말투도 기분 탓인지 상냥해져서, 항상 나의 머리나 날개를 부드럽게 쓰다듬어 주고 있다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「この姿の私のことを可愛いと思ってくれているから、そのようにしているのだとわかっている……」"
translation = "「이 모습인 나를 귀엽다고 생각해 주고 있으니까, 그렇게 하는 것이라고 알고 있다……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「だからこそ心配なのだ！」"
translation = "「그렇기 때문에 걱정되는 것이다!」"

[[dialogue]]
speaker = "unk"
original = "……？\u3000何が？"
translation = "……? 뭐가?"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「もしかしたら私は、魔王の性癖を歪めてしまったのではないか、と……」"
translation = "「어쩌면 내가, 마왕의 성벽을 왜곡해 버린 것이 아닐까, 하고……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「魔王だって最初は私が小さくなってしまった事に多少なりとも戸惑っていた。しかし、今は一切そんな気配がない」"
translation = "「마왕도 처음에는 내가 작아져 버린 것에 어느 정도 당황해했다. 하지만, 지금은 전혀 그런 기색이 없다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「それどころか私がこの姿で現れた瞬間、両手を広げて満面の笑顔で迎え、抱っこしてくれるようになった！」"
translation = "「그는커녕 내가 이 모습으로 나타난 순간, 양팔을 벌리고 만면에 미소를 지으며 맞이하고, 안아주게 되었다!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「このままでは魔王は小さい子にしか反応しない、そっちの趣味の持ち主になってしまうのではないか！？」"
translation = "「이대로라면 마왕은 어린아이에게만 반응하는, 그쪽 취향의 소유자가 되어버리는 것이 아닌가!?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「しかも……しかもだ……」"
translation = "「게다가…… 게다가 말이다……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「私もどんどん慣れ始めている。魔王が両手を広げている姿を見ると、当たり前のようにお膝の上に乗ってしまっているのだ」"
translation = "「나도 점점 익숙해지기 시작하고 있다. 마왕이 양팔을 벌리고 있는 모습을 보면, 당연하다는 듯이 무릎 위에 올라타버리고 만다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そして頭をよしよしされていると、もっともっとして欲しくて……魔王に甘えたくなってしまう……」"
translation = "「그리고 머리를 쓰다듬받고 있으면, 더욱더 받고 싶어져서…… 마왕에게 어리광을 부리고 싶어져버린다……」"

[[dialogue]]
speaker = "unk"
original = "こんな風に？"
translation = "이런 식으로?"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「うん……えへへ……<emoji=heart04>」"
translation = "「응…… 에헤헤……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「って違う！\u3000撫でて欲しくて言ったわけではない！」"
translation = "「앗, 아니야! 쓰다듬어달라고 말한 게 아니다!」"

[[dialogue]]
speaker = "unk"
original = "違うの？"
translation = "아니야?"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「う……いや……撫でて欲しい、のは……いつだって撫でて欲しいのだが……」"
translation = "「우…… 아니…… 쓰다듬어주었으면 하는, 것은…… 언제든 쓰다듬어주었으면 하지만……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「とにかく私もこの姿でいると魔王に甘えてしまうのだ！\u3000大人の姿でいる時は、自分から甘えることが出来ないというのに！」"
translation = "「어쨌든 나도 이 모습으로 있으면 마왕에게 어리광을 부리게 된단 말이다! 어른 모습으로 있을 때는, 스스로 어리광을 부리지 못하는데도!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「このままではいけない！\u3000とてもではないが健全な関係とは言えない！」"
translation = "「이대로는 안 된다! 아무리 그래도 건전한 관계라곤 할 수 없다!」"

[[dialogue]]
speaker = "unk"
original = "それがヒメの悩みか"
translation = "그게 히메의 고민인가"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そうなのだ。私もどうにかこの循環を断ち切ろうと努力してみた……」"
translation = "「그렇다. 나도 어떻게든 이 순환을 끊어내려고 노력해 보았다……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「魔王に甘えたくなっても懸命に我慢した。だが愛する者の姿が目に入れば、甘えたい気持ちが湧き出てきてしまう」"
translation = "「마왕에게 어리광을 부리고 싶어져도 필사적으로 참았다. 하지만 사랑하는 사람의 모습이 눈에 들어오면, 어리광 부리고 싶은 마음이 샘솟아버린다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「けれど、大人の私では甘えることができない。でも甘えたい。心が揺れる──」"
translation = "「하지만, 어른인 나는 어리광을 부릴 수 없다. 그래도 어리광 부리고 싶다. 마음이 흔들린다──」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そして気付けばこの姿になって、魔王の胸に飛び込んでしまっているのだ！\u3000ああ魔王、守護天使でありながら私は何と弱いのだろう！」"
translation = "「그리고 정신을 차려보면 이 모습이 되어서, 마왕의 품에 뛰어들어버리는 것이다! 아아 마왕, 수호천사이면서 나는 어쩜 이리도 약하단 말인가!」"

[[dialogue]]
speaker = "unk"
original = "大人のヒメだって抱っこするよ？"
translation = "어른인 히메라도 안아줄 건데?"

[[dialogue]]
speaker = "unk"
original = "我慢しなくてもいいと思うけど"
translation = "참지 않아도 된다고 생각하지만"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「っ……！！」"
translation = "「씃……!!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そ、それは……嬉しいが……少々はしたない行為ではないだろうか……？」"
translation = "「그, 그거야…… 기쁘지만…… 약간 점잖지 못한 행위가 아닐까……?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「だが、そうだな……。魔王を特殊な趣味に堕としてしまうわけにはいかない……」"
translation = "「하지만, 그렇군……. 마왕을 특수한 취향에 빠뜨릴 수는 없는 노릇이다……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「わかった。今度甘えたくなった時には、この姿に頼らず甘えさせてもらうことにしよう」"
translation = "「알았다. 다음번에 어리광 부리고 싶어졌을 때는, 이 모습에 의존하지 않고 어리광을 부리기로 하지」"

[[dialogue]]
speaker = "unk"
original = "決意を固めるヒメだった。"
translation = "결의를 다지는 히메였다."

[[dialogue]]
speaker = "unk"
original = "しかし──"
translation = "하지만──"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ま……魔王……」"
translation = "「마…… 마왕……」"

[[dialogue]]
speaker = "unk"
original = "勇気が出なかったか～"
translation = "용기가 안 났나~"

[[dialogue]]
speaker = "unk"
original = "顔を真っ赤にしたヒメは、小さい姿のままだった。"
translation = "얼굴이 새빨개진 히메는, 작은 모습 그대로였다."

[[dialogue]]
speaker = "unk"
original = "おいで、と両手を広げると、ヒメはベソをかきながら俺の胸に飛び込んできたのだった。"
translation = "일로 오렴, 하고 양팔을 벌리자, 히메는 울상을 지으며 내 품으로 뛰어들어온 것이었다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「魔王ーーーっ！\u3000不甲斐ない私を許してくれーーーっ！！」"
translation = "「마왕ーーー씃! 한심한 나를 용서해다오ーーー씃!!」"

