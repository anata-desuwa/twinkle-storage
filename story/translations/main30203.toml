[[dialogue]]
speaker = "unk"
original = "第３話,『イカれたメンバーを勧誘するぜ！』,B"
translation = "제3화, 『미친 멤버들을 권유하겠다구!』, B"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「さあ、イカれたメンバー集めを始めようぜっ！」"
translation = "「자, 미친 멤버 모으기를 시작해 보자고!」"

[[dialogue]]
speaker = "unk"
original = "アルタイルに戻って来たラクシャとマグダレナは、真っ直ぐに新星学園へとやってきた。"
translation = "알타이르로 돌아온 락샤와 막달레나는, 곧장 신성학원으로 찾아왔다."

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「本当に守護天使だけでバンドを組むつもりなのですか？」"
translation = "「정말로 수호천사만으로 밴드를 결성할 셈인가요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「１からメンバーを集めるとなったら、やっぱ大変でしょ？」"
translation = "「1부터 멤버를 모으게 된다면, 역시 힘들잖아?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ハロウィンまで時間もないし、手っ取り早くちゃちゃーっと集めるならやっぱ身内を誘うのが１番かなって」"
translation = "「할로윈까지 시간도 없고, 손쉽게 후딱 모으려면 역시 지인을 권유하는 게 1순위일까 해서」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「良いのでしょうか。そんな手近なところで集めました、といったノリで……」"
translation = "「괜찮은 걸까요. 그렇게 가까운 곳에서 모았다, 같은 분위기여서……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いいのいいの♪\u3000守護天使たちが集まってバンドを始めちゃいましたーってのが面白いんじゃない♪」"
translation = "「괜찮아 괜찮아♪ 수호천사들이 모여서 밴드를 시작했습니다─ 라는 편이 재미있잖아♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それにメンバー集めよりも練習に時間をかけた方がいいと思うしね」"
translation = "「게다가 멤버 모으기보다 연습에 시간을 들이는 편이 좋기도 하고 말이야」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「そういうものでしょうか……」"
translation = "「그런 것일까요……」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ではまず、誰から誘いに行きましょう？」"
translation = "「그럼 우선, 누구부터 권유하러 갈까요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「とりあえずボーカルが欲しいなって思うんだよね。というわけでセシアを確保しに行こう！」"
translation = "「우선 보컬을 얻고 싶단 말이지. 그런 이유로 세시아를 확보하러 가자!」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「そうですね。あの子の美しい声なら、ボーカルはぴったりです」"
translation = "「그렇네요. 그 아이의 아름다운 목소리라면, 보컬로 딱입니다」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「今の時間なら──セシアがいるのはおそらくあそこでしょうね」"
translation = "「지금 시간이라면── 세시아가 있는 곳은 아마 그곳이겠네요」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「こんにちは、モネさま」"
translation = "「안녕하세요, 모네 님」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「やっほー、モネ、元気にしてたー？」"
translation = "「야호─, 모네, 잘 지냈어─?」"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「こんにちは、マグダレナさん。市倉さんも、図書館にいらっしゃるのは久しぶりじゃありませんか？」"
translation = "「안녕하세요, 막달레나 씨. 이치쿠라 씨도, 도서관에 오신 건 오랜만이 아닌가요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだねー、ちょーっとご無沙汰しちゃってたかなー」"
translation = "「그렇네─, 요오즘 좀 뜸했으려나─」"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「あっ、そうです。ちょうど市倉さんにオススメしたい本があったんですよ。ちょっと待っていてくださいね、すぐに取ってきますから」"
translation = "「아, 맞다. 마침 이치쿠라 씨에게 추천해 드리고 싶은 책이 있었어요. 잠시만 기다려 주세요, 금방 가져올 테니까요」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、待って待って！\u3000ごめんね、今日はちょっと別な用事でここに来たんだ。キミの膝の上で気持ちよさそーにしてる守護天使にね」"
translation = "「아, 잠깐만 잠깐만! 미안해, 오늘은 좀 다른 볼일로 여기에 왔거든. 네 무릎 위에서 기분 좋─게 있는 수호천사에게 말이지」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「あら、ラクシャ。わたくしに用事なのかしら？」"
translation = "「어머, 락샤. 저에게 볼일인 걸까요?」"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「ラクシャ？」"
translation = "「락샤?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、うん。市倉環っていうのは偽名なんだ。人間界に溶け込んで生活するためのね。ラクシャっていうのは守護天使としての本当の名前だよ」"
translation = "「아, 응. 이치쿠라 타마키라는 건 가명이야. 인간계에 녹아들어서 생활하기 위한 말이지. 락샤라는 건 수호천사로서의 진짜 이름이야」"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「ああ、そうなんですね。守護天使としての──」"
translation = "「아아, 그렇군요. 수호천사로서의──」"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「しゅごてんしさまぁあああああああっ！！？？！？！？」"
translation = "「수호천사니이임님어어어어어억!!??!?!？」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「モネ、図書館では静かにしなきゃだよ？」"
translation = "「모네, 도서관에서는 조용히 해야 한다구?」"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「そ、そうでした、しーっ……。というか、市倉さんって守護天使様だったんですか？」"
translation = "「그, 그랬죠, 쉿…… 그나저나, 이치쿠라 씨가 수호천사님이셨나요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そんなに驚くようなことでもないと思うんだけどね」"
translation = "「그렇게 놀랄 만한 일도 아니라고 생각하는데 말이지」"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「いや驚きますよ。そんな事もなげにするようなカミングアウトじゃありませんから」"
translation = "「아니, 놀라죠. 그렇게 아무렇지도 않게 할 만한 커밍아웃이 아니니까요」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、そうかも。まあいいや、とりあえず市倉環あらため『《円環》のラクシャ』だよ、今後ともヨロシクっ♪」"
translation = "「아하하, 그럴지도. 뭐 아무렴 어때, 아무튼 이치쿠라 타마키에서 새로이 『《원환》의 락샤』야, 앞으로도 잘 부탁해♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あー、でも、畏まらずに今まで通りに接してくれていいからね。呼び方も『市倉環』のままでいいから」"
translation = "「아―, 그래도, 격식 차리지 말고 지금까지처럼 대해 줘도 되니까 말이지. 부르는 것도 『이치쿠라 타마키』 그대로도 괜찮으니까」"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「はあ……わ、わかりました……」"
translation = "「하아…… 알, 알겠습니다……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それじゃ本題に入るけど、セシアって今、ヒマだったりする？」"
translation = "「그럼 본론으로 들어가겠는데, 세시아는 지금 한가하다거나 해?」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「わたくしは今、モネママの深い愛に包まれながら、ご本を読んでもらう作業に忙しいのよ」"
translation = "「저는 지금, 모네 마마의 깊은 사랑에 감싸이면서, 책을 읽어달라고 하는 작업으로 바쁘답니다」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そっかー、実はセシアに手伝って欲しいことがあるんだー♪」"
translation = "「그렇구나―, 실은 세시아에게 도와줬으면 하는 일이 있거든―♪」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「摂理の守護を始め、守護天使としてのお仕事はちゃんとやっているわ。余暇の時間をどう使うかは、わたくしの自由のはずでしょう？」"
translation = "「섭리의 수호를 비롯해, 수호천사로서의 일은 제대로 하고 있다구요. 여가 시간을 어떻게 쓸지는 제 자유일 터잖아요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ゴリ押ししようと思ったけどダメだったか……これは選手交代だね」"
translation = "「억지로 밀어붙이려고 했는데 안 됐나…… 이건 선수 교체네」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「セシア、私からも協力をお願いしたいのです」"
translation = "「세시아, 저도 협력을 부탁드리고 싶습니다」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ママダレナ～～<emoji=heart04><emoji=heart04>\u3000ママの言うことなら、セシア何でもするわ<emoji=heart04>\u3000何でも言ってね<emoji=heart04>」"
translation = "「마마다레나～～<emoji=heart04><emoji=heart04> 마마가 하는 말이라면, 세시아 뭐든지 할게요<emoji=heart04> 뭐든지 말씀해 주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ちょ！？\u3000反応違い過ぎじゃない？」"
translation = "「잠깐!? 반응이 너무 다르지 않아?」"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「あはは……」"
translation = "「아하하……」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ママダレナのお願いだもの。聞かないわけにはいかないわ！」"
translation = "「마마다레나의 부탁인걸요. 듣지 않을 수가 없죠!」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「それでわたくしに、何を協力して欲しいのかしら？」"
translation = "「그래서 저에게, 무엇을 협력해 주었으면 하는 건가요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん。実はボクたち守護天使でバンドを結成して、ハロウィンでライブをしようと思うんだ」"
translation = "「응. 실은 우리 수호천사끼리 밴드를 결성해서, 할로윈에 라이브를 하려고 해」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ライブ──歌をうたうということ？」"
translation = "「라이브── 노래를 부른다는 것?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「平たく言えばそういうこと」"
translation = "「쉬운 말로 하자면 그런 것」"

[[dialogue]]
speaker = "unk"
original = "ラクシャはセシアに、これまでの経緯を説明する。"
translation = "락샤는 세시아에게, 지금까지의 경위를 설명한다."

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「いいんじゃないかしら？\u3000歌にみんなを元気づける力があるということは、わたくしもよく知っているわ」"
translation = "「괜찮지 않나요? 노래에 모두를 북돋아 주는 힘이 있다는 것은 저도 잘 알고 있답니다」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「わたくしたちがそのパーティーでライブをすれば、きっとデネブの人たちも元気になってくれるわね！」"
translation = "「우리들이 그 파티에서 라이브를 하면, 분명 데네브의 사람들도 기운을 차려 줄 테지요!」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ラクシャ、あなたはママではないけれど、デネブの復興を応援して歌を届けようという姿勢はプラス１ポイントよ♪」"
translation = "「락샤, 당신은 마마가 아니지만, 데네브의 부흥을 응원해서 노래를 전하자는 자세는 플러스 1포인트예요♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それじゃ協力してくれるっていうことでいいかな？」"
translation = "「그럼 협력해 주는 걸로 해도 될까?」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ええ、任せて♪」"
translation = "「네, 맡겨주세요♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「よし、ボーカル確保っ♪」"
translation = "「좋아, 보컬 확보♪」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ふふっ、順調ですね」"
translation = "「후후, 순조롭네요」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「この調子で次、行ってみよーっ！」"
translation = "「이 기세로 다음, 가보자고―!」"

[[dialogue]]
speaker = "unk"
original = "カフェテリアに場所を移すと、そこにはアルモタヘルとオオヒメが居た。"
translation = "카페테리아로 장소를 옮기자, 거기에는 알모타헬과 오오히메가 있었다."

[[dialogue]]
speaker = "unk"
original = "さっそく２人に声をかけ、事情を説明する。"
translation = "곧바로 두 사람에게 말을 걸어, 사정을 설명한다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「楽器の演奏はいずれ学んでみたいと思っていたからな。ぜひ参加したいところだが……問題がある」"
translation = "「악기 연주는 언젠가 배워보고 싶다고 생각했었으니까 말이다. 부디 참가하고 싶은 참이다만…… 문제가 있다」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ハロウィンまで然程の猶予もないということか？」"
translation = "「할로윈까지 그리 유예가 없다는 것인가?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「祭と歌は切っても切れぬ関係にあり、歌によって人々が元気づけられるということはその通りだろう」"
translation = "「축제와 노래는 떼려야 뗄 수 없는 관계에 있으며, 노래에 의해 사람들이 기운을 얻는다는 것은 그 말대로겠지」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「しかし、それ故に我々の未熟な演奏で、折角の祭典を汚してはならぬのではないか？」"
translation = "「하지만, 그렇기에 우리들의 미숙한 연주로, 모처럼의 축전을 더럽혀서는 안 되는 것 아닌가?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「予想はしてたけどオオヒメは堅物だな～」"
translation = "「예상은 했지만 오오히메는 고지식하네～」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「当然の懸念だ。未経験者だらけのメンバーを寄せ集めて、皆に満足してもらえる演奏が出来るとは思えぬ」"
translation = "「당연한 우려다. 미경험자투성이인 멤버를 끌어모아, 모두에게 만족을 줄 수 있는 연주를 할 수 있으리라곤 생각되지 않는다」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「良いか、ラクシャよ。芸事の道はそれほど甘くはないのだ！」"
translation = "「잘 들어라, 락샤여. 예능의 길은 그리 호락호락하지 않은 법이다!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「何だかプロミュージシャンを目指すみたいなイメージになってきてるけど、今回のはちょっと違うからね」"
translation = "「어쩐지 프로 뮤지션을 지향하는 듯한 이미지로 되어가고 있지만, 이번 건 좀 다르니까 말이지」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そりゃ上手に演奏できるに越したことは無いけどさ、でも今回の場合、一番大切なのはそこじゃないんだ」"
translation = "「이야 능숙하게 연주할 수 있다면 더할 나위야 없겠지만 말이야, 하지만 이번 경우, 가장 중요한 건 거기가 아니야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「大事なのは守護天使のみんなでハロウィンを体験すること。それからデネブのみんなに楽しんでもらうことでしょ？」"
translation = "「중요한 건 수호천사 모두가 함께 할로윈을 체험하는 것. 그리고 데네브의 모두에게 즐거움을 주는 거잖아?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「う、ぐ……それは正論だ……」"
translation = "「으, 윽…… 그것은 정론이다……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それにボクたちが頑張って練習して成長するからこそ、復興に尽力するデネブの人たちの心に刺さるんだと思うなー」"
translation = "「게다가 우리들이 열심히 연습해서 성장하기에 비로소, 부흥에 진력하는 데네브 사람들의 마음을 찌르는 거라고 생각하는데―」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「うむむ……そうだな、我々の努力する姿が、皆の勇気になるやもしれぬ……」"
translation = "「으음…… 그렇군, 우리들의 노력하는 모습이, 모두의 용기가 될지도 모르겠군……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「よし、ラクシャ。あなたの計画に乗ることにしよう！」"
translation = "「좋다, 락샤. 당신의 계획에 타기로 하지!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うんうん、オオヒメなら分かってくれると思ってたよ♪」"
translation = "「응응, 오오히메라면 이해해 줄 거라고 생각했어♪」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「但し、やるならば全力で挑むべきだ！\u3000今日からハロウィンまでみっちり練習して、力の限りを尽くした演奏をデネブの人々に届けよう！」"
translation = "「단, 한다면 전력으로 임해야 한다! 오늘부터 할로윈까지 빡세게 연습해서, 힘이 닿는 한 최선을 다한 연주를 데네브 사람들에게 전달하자!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あれ？\u3000火を入れすぎたかな……ちょっと面倒くさいかも」"
translation = "「어라? 불을 너무 지폈나…… 좀 귀찮아질지도」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ん？\u3000何か言ったか？」"
translation = "「음? 무슨 말이라도 했나?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いーや、何も言ってないよ～」"
translation = "「아―니, 아무것도 안 말했어～」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あなたはどうするのだ、アルモタヘル？」"
translation = "「당신은 어떻게 할 테냐, 알모타헬?」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「我か？\u3000うむ……その『らいぶ』とやらは、要は祭の余興なのだろうが、今一つどのようなものか想像がつかぬ」"
translation = "「나 말인가? 음…… 그 『라이브』라는 것은, 요는 축제의 여흥이겠지다만, 도무지 어떤 것인지 상상이 가질 않는군」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ステージの上で、ギターとかベースとかの楽器を生演奏したり、歌ったりするんだよ」"
translation = "「스테이지 위에서, 기타라든가 베이스 같은 악기를 라이브 연주하거나, 노래하거나 하는 거야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それで、見に来てるお客さんも一緒になって、叫んだり飛び跳ねたりして盛り上がるんだ」"
translation = "「그래서, 보러 온 손님들도 하나가 되어서, 외치거나 뛰어오르거나 하면서 분위기를 띄우는 거지」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「むむ……」"
translation = "「으음……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「う～ん、実際にどういうものか見せてみないと、イメージ出来ないかもだね……」"
translation = "「으~음, 실제로 어떤 건지 보여주지 않으면, 이미지할 수 없을지도겠네……」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「アルモタヘル、ライブの打ち上げの定番といえば焼肉だそうですよ？」"
translation = "「알모타헬, 라이브 뒤풀이의 뒤풀이 정석이라 하면 불고기라고 하던데요?」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「やろう。我に任せておけ」"
translation = "「하지. 나에게 맡겨두어라」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「マグダレナ、ナイス！」"
translation = "「막달레나, 나이스!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「良いのか、それで……」"
translation = "「괜찮은 거냐, 그걸로……」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「さすがはママダレナなのだわ♪」"
translation = "「역시 마마다레나인 거예요♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「さて、これで六柱のうちの五柱が揃ったわけだけど……」"
translation = "「자, 이걸로 육주 중 다섯 주가 모인 셈인데……」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「最後の１人が最大の難関ね」"
translation = "「마지막 1명이 최대의 난관이네」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「《試練》のパテル。彼女は私たちの前にも滅多に姿を現しませんから、そもそも彼女を見つけること自体が大変です」"
translation = "「《시련》의 파텔. 그녀는 우리 앞에도 좀처럼 모습을 드러내지 않으니까, 애초에 그녀를 찾는 것 자체가 일입니다」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「<ruby>縦<rt>よし</rt></ruby>んば奴を見つけることが出来たとしても、説得には骨が折れるであろうな」"
translation = "「<ruby>비록<rt>설령</rt></ruby> 놈을 찾을 수 있다 하더라도, 설득에는 애를 먹겠지」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「飄々としているようでいて、気難しい奴だからな……先日の会議の時も、捕まえるのにどれだけ苦労したことか」"
translation = "「표표한 듯하면서도, 까다로운 녀석이니까 말이지…… 얼마 전 회의 때도, 붙잡는 데 얼마나 고생했었는지」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだね。でも大丈夫だよ。彼女の居場所にはちょっと心当たりがあるし、ボクからのお願いなら聞いてもらえそうなんだよね」"
translation = "「그렇네. 하지만 괜찮아. 그녀가 있는 곳에는 약간 짐작 가는 데가 있고, 내가 부탁하는 거라면 들어줄 것 같거든」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「どういうことだ？」"
translation = "「무슨 소리냐?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「まあまあ、とりあえず彼女に会いに行こうよ。そこからは当たって砕けろって感じで♪」"
translation = "「자자, 일단 그녀를 만나러 가자고. 거기서부터는 부딪쳐 보자는 느낌으로♪」"

[[dialogue]]
speaker = "unk"
original = "自信たっぷりのラクシャに一抹の不安を感じながらも、守護天使たちは最後の１人であるパテルの元へと向かったのだった。"
translation = "자신만만한 락샤에게 일망의 불안을 느끼면서도, 수호천사들은 마지막 1명인 파텔이 있는 곳으로 향했던 것이었다."

