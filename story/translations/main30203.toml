[[dialogue]]
speaker = "unk"
original = "第３話,『イカれたメンバーを勧誘するぜ！』,B"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「さあ、イカれたメンバー集めを始めようぜっ！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "アルタイルに戻って来たラクシャとマグダレナは、真っ直ぐに新星学園へとやってきた。"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「本当に守護天使だけでバンドを組むつもりなのですか？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「１からメンバーを集めるとなったら、やっぱ大変でしょ？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ハロウィンまで時間もないし、手っ取り早くちゃちゃーっと集めるならやっぱ身内を誘うのが１番かなって」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「良いのでしょうか。そんな手近なところで集めました、といったノリで……」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いいのいいの♪\u3000守護天使たちが集まってバンドを始めちゃいましたーってのが面白いんじゃない♪」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それにメンバー集めよりも練習に時間をかけた方がいいと思うしね」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「そういうものでしょうか……」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ではまず、誰から誘いに行きましょう？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「とりあえずボーカルが欲しいなって思うんだよね。というわけでセシアを確保しに行こう！」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「そうですね。あの子の美しい声なら、ボーカルはぴったりです」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「今の時間なら──セシアがいるのはおそらくあそこでしょうね」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「こんにちは、モネさま」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「やっほー、モネ、元気にしてたー？」"
translation = ""

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「こんにちは、マグダレナさん。市倉さんも、図書館にいらっしゃるのは久しぶりじゃありませんか？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだねー、ちょーっとご無沙汰しちゃってたかなー」"
translation = ""

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「あっ、そうです。ちょうど市倉さんにオススメしたい本があったんですよ。ちょっと待っていてくださいね、すぐに取ってきますから」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、待って待って！\u3000ごめんね、今日はちょっと別な用事でここに来たんだ。キミの膝の上で気持ちよさそーにしてる守護天使にね」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「あら、ラクシャ。わたくしに用事なのかしら？」"
translation = ""

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「ラクシャ？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、うん。市倉環っていうのは偽名なんだ。人間界に溶け込んで生活するためのね。ラクシャっていうのは守護天使としての本当の名前だよ」"
translation = ""

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「ああ、そうなんですね。守護天使としての──」"
translation = ""

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「しゅごてんしさまぁあああああああっ！！？？！？！？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「モネ、図書館では静かにしなきゃだよ？」"
translation = ""

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「そ、そうでした、しーっ……。というか、市倉さんって守護天使様だったんですか？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そんなに驚くようなことでもないと思うんだけどね」"
translation = ""

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「いや驚きますよ。そんな事もなげにするようなカミングアウトじゃありませんから」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、そうかも。まあいいや、とりあえず市倉環あらため『《円環》のラクシャ』だよ、今後ともヨロシクっ♪」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あー、でも、畏まらずに今まで通りに接してくれていいからね。呼び方も『市倉環』のままでいいから」"
translation = ""

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「はあ……わ、わかりました……」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それじゃ本題に入るけど、セシアって今、ヒマだったりする？」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「わたくしは今、モネママの深い愛に包まれながら、ご本を読んでもらう作業に忙しいのよ」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そっかー、実はセシアに手伝って欲しいことがあるんだー♪」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「摂理の守護を始め、守護天使としてのお仕事はちゃんとやっているわ。余暇の時間をどう使うかは、わたくしの自由のはずでしょう？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ゴリ押ししようと思ったけどダメだったか……これは選手交代だね」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「セシア、私からも協力をお願いしたいのです」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ママダレナ～～<emoji=heart04><emoji=heart04>\u3000ママの言うことなら、セシア何でもするわ<emoji=heart04>\u3000何でも言ってね<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ちょ！？\u3000反応違い過ぎじゃない？」"
translation = ""

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「あはは……」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ママダレナのお願いだもの。聞かないわけにはいかないわ！」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「それでわたくしに、何を協力して欲しいのかしら？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん。実はボクたち守護天使でバンドを結成して、ハロウィンでライブをしようと思うんだ」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ライブ──歌をうたうということ？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「平たく言えばそういうこと」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ラクシャはセシアに、これまでの経緯を説明する。"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「いいんじゃないかしら？\u3000歌にみんなを元気づける力があるということは、わたくしもよく知っているわ」"
translation = "「괜찮지 않을까? 노래에 사람들에게 기운을 북돋아 주는 힘이 있다는 건, 저도 잘 알고 있어요」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「わたくしたちがそのパーティーでライブをすれば、きっとデネブの人たちも元気になってくれるわね！」"
translation = "「저희가 그 파티에서 라이브를 한다면, 분명 데네브의 사람들도 기운을 차릴 수 있을 거예요!」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ラクシャ、あなたはママではないけれど、デネブの復興を応援して歌を届けようという姿勢はプラス１ポイントよ♪」"
translation = "「락샤, 당신은 엄마는 아니지만, 데네브의 복구를 응원하며 노래를 전달하려는 자세는 플러스 1점이에요♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それじゃ協力してくれるっていうことでいいかな？」"
translation = "「그럼 협력해 주는 걸로 알아도 될까?」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ええ、任せて♪」"
translation = "「네, 맡겨 주세요♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「よし、ボーカル確保っ♪」"
translation = "「좋아, 보컬 확보♪」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ふふっ、順調ですね」"
translation = "「후후, 순조롭네요」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「この調子で次、行ってみよーっ！」"
translation = "「이 기세로 다음으로 가 보자ー!」"

[[dialogue]]
speaker = "unk"
original = "カフェテリアに場所を移すと、そこにはアルモタヘルとオオヒメが居た。"
translation = "카페테리아로 장소를 옮기자, 그곳에는 알모타헬과 오오히메가 있었다."

[[dialogue]]
speaker = "unk"
original = "さっそく２人に声をかけ、事情を説明する。"
translation = "즉시 두 사람에게 말을 걸어, 사정을 설명한다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「楽器の演奏はいずれ学んでみたいと思っていたからな。ぜひ参加したいところだが……問題がある」"
translation = "「악기 연주는 언젠가 배워보고 싶다고 생각했거든. 꼭 참가하고 싶다만…… 문제가 있다」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ハロウィンまで然程の猶予もないということか？」"
translation = "「할로윈까지 그리 시간적 여유가 없다는 뜻인가?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「祭と歌は切っても切れぬ関係にあり、歌によって人々が元気づけられるということはその通りだろう」"
translation = "「축제와 노래는 떼려야 뗠 수 없는 관계이며, 노래로 인해 사람들이 기운을 얻는다는 것은 맞는 말이다」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「しかし、それ故に我々の未熟な演奏で、折角の祭典を汚してはならぬのではないか？」"
translation = "「하지만 그렇기에 우리의 미숙한 연주로, 모처럼의 축제를 더럽혀서는 안 되는 것 아니겠나?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「予想はしてたけどオオヒメは堅物だな～」"
translation = "「예상은 했지만 오오히메는 융통성이 없네～」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「当然の懸念だ。未経験者だらけのメンバーを寄せ集めて、皆に満足してもらえる演奏が出来るとは思えぬ」"
translation = "「당연한 우려다. 미경험자투성이인 멤버를 긁어모아, 모두를 만족시킬 수 있는 연주를 할 수 있으리라곤 생각되지 않는다」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「良いか、ラクシャよ。芸事の道はそれほど甘くはないのだ！」"
translation = "「알겠느냐, 락샤여. 예능의 길은 그리 호락호락하지 않은 법이다!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「何だかプロミュージシャンを目指すみたいなイメージになってきてるけど、今回のはちょっと違うからね」"
translation = "「어쩐지 프로 뮤지션을 지향하는 것 같은 이미지로 가고 있는데, 이번 건 조금 다르다구」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そりゃ上手に演奏できるに越したことは無いけどさ、でも今回の場合、一番大切なのはそこじゃないんだ」"
translation = "「이야 잘 연주할 수 있다면 더할 나위야 없겠지만 말야, 하지만 이번 경우, 가장 중요한 건 그게 아니야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「大事なのは守護天使のみんなでハロウィンを体験すること。それからデネブのみんなに楽しんでもらうことでしょ？」"
translation = "「소중한 건 수호천사 모두가 할로윈을 체험하는 것. 그리고 데네브의 모두가 즐겁게 지내도록 하는 거잖아?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「う、ぐ……それは正論だ……」"
translation = "「으, 윽…… 그것은 정론이다……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それにボクたちが頑張って練習して成長するからこそ、復興に尽力するデネブの人たちの心に刺さるんだと思うなー」"
translation = "「게다가 우리가 열심히 연습해서 성장하기에, 복구에 힘쓰는 데네브 사람들의 마음에 와닿는 거라고 생각하는데ー」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「うむむ……そうだな、我々の努力する姿が、皆の勇気になるやもしれぬ……」"
translation = "「우무무…… 그렇군, 우리가 노력하는 모습이, 모두에게 용기가 될지도 모르겠구나……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「よし、ラクシャ。あなたの計画に乗ることにしよう！」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うんうん、オオヒメなら分かってくれると思ってたよ♪」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「但し、やるならば全力で挑むべきだ！\u3000今日からハロウィンまでみっちり練習して、力の限りを尽くした演奏をデネブの人々に届けよう！」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あれ？\u3000火を入れすぎたかな……ちょっと面倒くさいかも」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ん？\u3000何か言ったか？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いーや、何も言ってないよ～」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あなたはどうするのだ、アルモタヘル？」"
translation = ""

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「我か？\u3000うむ……その『らいぶ』とやらは、要は祭の余興なのだろうが、今一つどのようなものか想像がつかぬ」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ステージの上で、ギターとかベースとかの楽器を生演奏したり、歌ったりするんだよ」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それで、見に来てるお客さんも一緒になって、叫んだり飛び跳ねたりして盛り上がるんだ」"
translation = ""

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「むむ……」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「う～ん、実際にどういうものか見せてみないと、イメージ出来ないかもだね……」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「アルモタヘル、ライブの打ち上げの定番といえば焼肉だそうですよ？」"
translation = ""

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「やろう。我に任せておけ」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「マグダレナ、ナイス！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「良いのか、それで……」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「さすがはママダレナなのだわ♪」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「さて、これで六柱のうちの五柱が揃ったわけだけど……」"
translation = ""

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「最後の１人が最大の難関ね」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「《試練》のパテル。彼女は私たちの前にも滅多に姿を現しませんから、そもそも彼女を見つけること自体が大変です」"
translation = ""

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「<ruby>縦<rt>よし</rt></ruby>んば奴を見つけることが出来たとしても、説得には骨が折れるであろうな」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「飄々としているようでいて、気難しい奴だからな……先日の会議の時も、捕まえるのにどれだけ苦労したことか」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだね。でも大丈夫だよ。彼女の居場所にはちょっと心当たりがあるし、ボクからのお願いなら聞いてもらえそうなんだよね」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「どういうことだ？」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「まあまあ、とりあえず彼女に会いに行こうよ。そこからは当たって砕けろって感じで♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "自信たっぷりのラクシャに一抹の不安を感じながらも、守護天使たちは最後の１人であるパテルの元へと向かったのだった。"
translation = ""

