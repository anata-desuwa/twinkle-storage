[[dialogue]]
speaker = "unk"
original = "第３話,最新型ギガンドムをゲットせよ,P"
translation = "제3화, 최신형 기간덤을 획득하라, P"

[[dialogue]]
speaker_original = "パイロット１"
speaker_translation = "パイロット１"
original = "「よぉ。てめぇがこのギガンドム部隊のエースらしいが、音楽の趣味は平凡だな？\u3000ガッカリだぜ！」"
translation = "「여어. 네놈이 이 기간덤 부대의 에이스라던데, 음악 취향은 평범하구만? 실망이라고!」"

[[dialogue]]
speaker_original = "パイロット２"
speaker_translation = "パイロット２"
original = "「今度会った時はこうはいかない……次は必ず俺が勝つ！！」"
translation = "「다음에 만났을 땐 이렇지 않을 거다…… 다음엔 반드시 내가 이긴다!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……これは見事な引きの１話ですね。続きが気になります、わくわく」"
translation = "「……이거 훌륭한 클리프행어의 1화네요. 다음 편이 궁금해집니다, 두근두근」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「今季からスタートした、新しいギガンドムシリーズ……いかがでしたか会長？」"
translation = "「이번 분기부터 스타트한, 새로운 기간덤 시리즈…… 어떠셨나요 회장님?」"

[[dialogue]]
speaker = "unk"
original = "めちゃくちゃ面白い……！"
translation = "엄청나게 재미있어……!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ええ。主人公の機体も、ライバルの機体も見事なデザインです。これは是非とも組み立てたいところ……！」"
translation = "「네. 주인공의 기체도, 라이벌의 기체도 멋진 디자인입니다. 이건 꼭 조립해보고 싶은데요……!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「──む。見てください会長。ＳＮＳで急報です。新型ギガンドムのプラモデルが、予約の抽選を開始したと……！」"
translation = "「──음. 보세요 회장님. SNS에서 속보입니다. 신형 기간덤의 프라모델이, 예약 추첨을 시작했다고……!」"

[[dialogue]]
speaker = "unk"
original = "さっそく申し込もう！"
translation = "당장 신청하자!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ええ……しかし、むむむ。ずいぶんとお高いですね……」"
translation = "「네…… 하지만, 음음음. 제법 가격이 비싸네요……」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「主人公機のサイコギガンドム……武装が多岐にわたるため、ある程度の高値は予測していましたが──」"
translation = "「주인공 기체인 사이코 기간덤…… 무장이 다채롭기 때문에, 어느 정도 고가일 거라 예측은 했습니다만──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「がーん。シュティレのお小遣い、完全に予算オーバーです。このままでは抽選に勝ち抜いても購入できません」"
translation = "「콰광. 슈틸레의 용돈, 완전히 예산 초과입니다. 이대로는 추첨에서 이겨도 구매할 수 없습니다」"

[[dialogue]]
speaker = "unk"
original = "俺も少し厳しいかもしれない……"
translation = "나도 살짝 힘들지도 몰라……"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「そういえば会長は、かつてアルバイト戦士であったとか。いかがでしょう、短期のバイトで資金を稼ぐというのは」"
translation = "「그러고 보니 회장님은, 예전에 알바 전사였다고 하셨죠. 어떠신가요, 단기 알바로 자금을 버는 것은」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……古いツテを使っていただける？\u3000感謝いたします」"
translation = "「……전 인맥을 활용해주시는 건가요? 감사드립니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「最新型ギガンドムのためならば、粉骨砕身。励ませていただきます。ぶい」"
translation = "「최신형 기간덤을 위해서라면, 분골쇄신. 힘쓰겠습니다. 브이」"

[[dialogue]]
speaker = "unk"
original = "自慢ではないが、俺は数多のアルバイトを経験してきた。だからこそ短期で集中して稼げる仕事先にもツテはたくさんある。"
translation = "자랑은 아니지만, 나는 수많은 알바를 경험해왔다. 그렇기에 단기로 집중해서 벌 수 있는 일자리 인맥도 많다."

[[dialogue]]
speaker = "unk"
original = "しかし、いきなり短期の増員を２名も認めてくれるところとなると……"
translation = "하지만 갑자기 단기 인원 증원을 2명이나 허락해줄 곳이라면……"

[[dialogue]]
speaker_original = "メイドさん"
speaker_translation = "메이드 씨"
original = "「にゃ～ん♪\u3000今日はよろしくにゃん、２人とも！」"
translation = "「야옹~♪ 오늘은 잘 부탁해 야옹, 두 사람 모두!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「なんと、意外な場所ですね。猫耳メイド喫茶とは……」"
translation = "「무려, 뜻밖의 장소네요. 고양이 귀 메이드 카페라니……」"

[[dialogue]]
speaker = "unk"
original = "ここしか選択肢がなかった……"
translation = "여기밖에 선택지가 없었어……"

[[dialogue]]
speaker_original = "メイドさん"
speaker_translation = "메이드 씨"
original = "「短期のアルバイトってスタッフの調整が難しいから、普通はお断りにゃんだけど～」"
translation = "「단기 알바는 스태프 조율이 어려워서, 보통은 거절하지만 말야~」"

[[dialogue]]
speaker_original = "メイドさん"
speaker_translation = "메이드 씨"
original = "「かつてのナンバーワン、クロトくんたってのお願いなら！\u3000店長、聞いてあげちゃうにゃん♪」"
translation = "「과거 넘버원, 쿠로토 군이 간곡히 부탁한다면! 점장님이 들어줘 버리지 야옹~♪」"

[[dialogue]]
speaker = "unk"
original = "すみません、お世話になります"
translation = "죄송합니다, 잘 부탁드립니다"

[[dialogue]]
speaker_original = "メイドさん"
speaker_translation = "메이드 씨"
original = "「気にしないで～。それよりそれよりっ。彼女さん、めーっちゃ可愛いね～♪」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「どうも。『閃光』のプリティー天使、不動シュティレです。しかしよろしいのでしょうか、このウサギの衣装のままで」"
translation = "「처음 뵙겠습니다. 『섬광』의 프리티 천사, 후도 슈틸레입니다. 하지만 괜찮은 걸까요, 이 토끼 의상 그대로도」"

[[dialogue]]
speaker_original = "メイドさん"
speaker_translation = "메이드 씨"
original = "「いいにゃん、いいにゃん♪\u3000新しい動物メイドさんが期間限定で入りました～ってことにしてるから！」"
translation = "「괜찮아 야옹, 괜찮아 야옹♪ 새로운 동물 메이드 씨가 기간 한정으로 들어왔습니다~라고 해둘 거니까!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「承知いたしました。ではお客様──いいえ。ご主人様を全力でおもてなしいたします。ぴょんぴょん」"
translation = "「알겠습니다. 그럼 손님── 아니요. 주인님을 전력으로 대접하겠습니다. 깡충깡충」"

[[dialogue]]
speaker_original = "メイドさん"
speaker_translation = "메이드 씨"
original = "「うんうん、いい感じ～♪\u3000けっこう大変だと思うけど、クロにゃんにサポートは任せてるから。安心して欲しいにゃん♪」"
translation = "「응응, 좋은 느낌~♪ 제법 힘들 거라 생각하지만, 쿠로 야옹이에게 서포트는 맡겨뒀으니까. 안심하길 바라 야옹♪」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「それは超安心ですね。にゃんにゃん」"
translation = "「그건 초안심이네요. 야옹야옹」"

[[dialogue]]
speaker = "unk"
original = "もうウサギか猫かわからなくなってる……！"
translation = "이제 토끼인지 고양이인지 모르게 됐어……!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふふ、今日は面白いです。会長の新たな一面を知ることが出来ました。まさか猫耳メイド喫茶でも働いていただなんて」"
translation = "「후후, 오늘은 재미있네요. 회장님의 새로운 일면을 알 수 있었습니다. 설마 고양이 귀 메이드 카페에서도 일하셨을 줄이야」"

[[dialogue]]
speaker = "unk"
original = "恋人に女装姿も見せたくなかった……"
translation = "연인에게 여장한 모습까지 보이고 싶진 않았는데……"

[[dialogue]]
speaker = "unk"
original = "……本当は、内緒にしたかった"
translation = "……사실은, 비밀로 하고 싶었어"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「急なアルバイトのお願いをねじこめる、そんな我儘を言える職場がここしかなかったのでしょう？」"
translation = "「갑작스러운 알바 부탁을 억지로 밀어 넣을 수 있는, 그런 억지를 부릴 수 있는 직장이 여기뿐이었던 거겠죠?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「シュティレのために恥を忍んでいただき、感謝します。さぁ会長、シュティレを立派なメイドに教育してください。ぴょんぴょん」"
translation = "「슈틸레를 위해 부끄러움을 무릅써주셔서, 감사합니다. 자 회장님, 슈틸레를 훌륭한 메이드로 교육해 주세요. 깡충깡충」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あ──早速の来客ですね。お帰りなさいませ、ご主人様。ぴょーんぴょん」"
translation = "「아── 바로 손님이네요. 어서 오세요, 주인님. 깡~충깡충」"

[[dialogue]]
speaker_original = "若い男"
speaker_translation = "젊은 남자"
original = "「お、今日は変わったメイドさんがいるな……って。あれ、キミは！？」"
translation = "「오, 오늘은 특이한 메이드 씨가 있네…… 어라, 너는!?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あ──貴方は！\u3000以前、限定版ギガンドムのプラモデルを譲っていただいた、倉庫バイトの御方……！」"
translation = "「아── 당신은! 이전에 한정판 기간덤 프라모델을 양도해주셨던, 창고 알바 때의 분……!」"

[[dialogue]]
speaker_original = "若い男"
speaker_translation = "젊은 남자"
original = "「世間は狭いなあ。ここで働いてるんだ？」"
translation = "「세상 참 좁네. 여기서 일하고 있어?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。最新型ギガンドムのためのお小遣い稼ぎです。ぶい」"
translation = "「네. 최신형 기간덤을 위한 용돈 벌이입니다. 브이」"

[[dialogue]]
speaker_original = "若い男"
speaker_translation = "젊은 남자"
original = "「ははは。気持ちはわかるよ、あれは絶対に手に入れたいよな！\u3000頑張ってくれよ──ってぇ！？」"
translation = "「하하하. 기분 이해해, 그건 무조건 구하고 싶지! 힘내라구── 어라!?」"

[[dialogue]]
speaker = "unk"
original = "お、お帰りなさいませにゃんっ♪"
translation = "어, 어서 오세요 야옹~♪"

[[dialogue]]
speaker_original = "若い男"
speaker_translation = "젊은 남자"
original = "「え、何だこの子……めっちゃ可愛い……トゥンク……」"
translation = "「에, 뭐야 이 애…… 엄청 귀여워…… 두근……」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "（おや……内緒にしているのですか、ご友人には）"
translation = "(어라…… 비밀로 하고 계신 건가요, 친구분에겐)"

[[dialogue]]
speaker = "unk"
original = "（言えるわけないだろ……！？）"
translation = "(말할 수 있을 리가 없잖아……!?)"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "（承知いたしました。ではシュティレが接客いたしましょう。何かありましたらサポートお願いします、クロにゃん先輩）"
translation = "(알겠습니다. 그럼 슈틸레가 접객하지요. 무슨 일 있으시면 서포트 부탁드려요, 쿠로 야옹 선배)"

[[dialogue]]
speaker = "unk"
original = "こうして俺とシュティレは、猫耳メイド喫茶で短期のアルバイトを行った。"
translation = "이렇게 나와 슈틸레는, 고양이 귀 메이드 카페에서 단기 알바를 했다."

[[dialogue]]
speaker = "unk"
original = "シュティレは笑顔こそ少し苦手だけれど、気配り上手で物覚えも早い。あっという間に立派なメイドとして立ち回るのだった──"
translation = "슈틸레는 미소 짓는 건 조금 서툴지만, 배려심 깊고 눈치도 빠르다. 눈 깜짝할 사이에 훌륭한 메이드로서 처신하는 것이었다──"

