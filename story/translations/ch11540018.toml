[[dialogue]]
speaker = "unk"
original = "リゾート結界の事件が解決してから、しばらく経ったある休日。"
translation = "리조트 결계 사건이 해결되고 나서, 얼마 지나지 않은 어느 휴일."

[[dialogue]]
speaker = "unk"
original = "僕――『<ruby>咲良<rt>さくら</rt></ruby>シン』は、ヘレナさんから呼び出されて、流星学園の生徒会室から繋がるリゾート結界へと再びやって来ていた。"
translation = "나―― 『사쿠라 신』은 헬레나 씨에게 호출되어, 유성학원의 학생회실에서 이어지는 리조트 결계로 다시 찾아와 있었다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――シンちゃん。お姉さんのデートに付き合ってくれてありがと<emoji=heart04>」"
translation = "「――신짱. 누나의 데이트에 함께해 줘서 고마워<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「いえ……でも、ヘレナさんから誘ってくれるなんて、今日はどうしたんですか？」"
translation = "「아뇨…… 하지만, 헬레나 씨가 먼저 불러주시다니, 오늘은 무슨 일이세요?」"

[[dialogue]]
speaker = "unk"
original = "２人きりのデートだと言って誘われた為、男としてはやはりどうしてもドキドキしてしまう。"
translation = "둘만의 데이트라고 하며 초대받았기 때문에, 남자로서 역시 아무래도 두근거리고 만다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ、まだ何もしてないのに、もう顔が赤くなってるわよ？」"
translation = "「후후, 아직 아무것도 안 했는데 벌써 얼굴이 붉어졌네?」"

[[dialogue]]
speaker = "unk"
original = "そう言って、ヘレナさんはそっと僕に顔を近づけて――耳元で吐息を吹きかけるように囁く。"
translation = "그렇게 말하며 헬레나 씨는 살며시 내게 얼굴을 가까이 대고── 귀가에 숨결을 불어넣듯 속삭인다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「シンちゃんが期待している通り――」"
translation = "「신짱이 기대하는 대로――」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「今日はお姉さんが、海で特別な『ご褒美』をあげるわ<emoji=heart04>」"
translation = "「오늘은 누나가, 바다에서 특별한 『포상』을 줄게<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そうして、ヘレナさんに手を引かれて移動した場所は、海辺の桟橋の先にある、開放的な『水上コテージ』だった。"
translation = "그렇게 해서, 헬레나 씨에게 손이 이끌려 이동한 장소는, 해변의 선착장 끝에 있는, 개방적인 『수상 코티지』였다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「よいしょっと……<emoji=heart04>\u3000ん……ふうぅ……<emoji=heart04>」"
translation = "「영차……<emoji=heart04> 응…… 후우……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんに言われるままベッドに仰向けになると、ヘレナさんがそのまま僕の上に跨ってくる。"
translation = "헬레나 씨가 말하는 대로 침대에 위를 보고 누우니, 헬레나 씨가 그대로 내 위에 올라탄다."

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「へ、ヘレナさん……！？\u3000この体勢って……」"
translation = "「헤, 헬레나 씨……!? 이 자세는……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「……シンちゃんには前から、頑張るたびにトロフィーをあげてたでしょ？\u3000それで集めたら、ご褒美でエッチなことをしてあげていたけど――」"
translation = "「……신짱에게는 전부터, 열심히 할 때마다 트로피를 줬었잖아? 그걸로 모으면, 포상으로 야한 짓을 해줬었지만――」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「でも、本番はずっとお預けだったわよね。シンちゃんは世界を救うくらい頑張ってくれてたのに……さすがにいい加減、私も悪いなって思ったのよ」"
translation = "「하지만, 진짜는 계속 보류였었지. 신짱은 세계를 구할 정도로 열심히 해줬는데…… 역시 이제 와서, 나도 너무하다는 생각이 들었어」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「だから今日は――シンちゃんに私の初めてをあげるわ<emoji=heart04>」"
translation = "「그러니까 오늘은――신짱에게 내 처음을 줄게<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「えぇっ……！？\u3000そ、それって……」"
translation = "「에엑……!? 그, 그거……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「それとも、年上のお姉さんの『処女』なんて、面倒でイヤかしら……？」"
translation = "「아니면, 연상 누나의 『처녀』 따위, 귀찮아서 싫으려나……?」"

[[dialogue]]
speaker = "unk"
original = "ちょっと不安げな視線を向けるヘレナさんに、僕は慌てて首を振る。"
translation = "조금 불안한 듯한 시선을 보내는 헬레나 씨에게, 나는 서둘러 고개를 저었다."

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「いやいやいや！\u3000そんなわけないじゃないですか！」"
translation = "「아니아니아니! 그럴 리가 없잖아요!」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「ただ……ヘレナさんは『年上のオジサマ』が好みのタイプだから、これまで初めてを取っておいたんじゃ……」"
translation = "「그저…… 헬레나 씨는 『연상의 아저씨』가 취향 타입이니까, 지금까지 처음을 아껴둔 게 아니었는지……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そうね。確かに私は、年下の男の子がタイプってわけじゃなかったわ。でも――」"
translation = "「그렇네. 확실히 나는, 연하 남동생이 취향인 건 아니었어. 하지만――」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「一生懸命頑張ってるシンちゃんの姿を見ていたら……少しずつ気持ちが変わって、ちゃんとエッチしてあげたいなって思ったのよ」"
translation = "「열심히 노력하는 신짱의 모습을 보고 있었더니…… 조금씩 마음이 바뀌어서, 제대로 섹스해주고 싶다고 생각하게 됐어」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「ヘレナさん……」"
translation = "「헬레나 씨……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「だから嫌じゃなかったら、ご褒美として受け取って欲しいわ<emoji=heart04>\u3000んっ……<emoji=heart04>」"
translation = "「그러니까 싫지 않다면, 포상으로 받아주었으면 좋겠어<emoji=heart04> 앙……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんはゆっくりと腰を動かし、熱を帯びた秘部をペニスに擦りつけてくる。"
translation = "헬레나 씨는 천천히 허리를 움직여, 열을 띤 비부를 자지에 문질러 온다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あんっ……<emoji=heart04>\u3000シンちゃんのおち○ぽ、もうこんなに固くなってるわ……<emoji=heart04>」"
translation = "「앙……<emoji=heart04> 신짱의 자지, 벌써 이렇게 딱딱해졌네……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「お姉さんのおま○こも、これから本番エッチしちゃうと思ったら、すごく熱くなってきて……<emoji=heart04>\u3000んうぅ……ふうぅ……<emoji=heart04>」"
translation = "「누나의 보지도, 이제부터 진짜 섹스한다고 생각하니까, 엄청 뜨거워져서……<emoji=heart04> 응우…… 후우……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「愛液溢れてきちゃう……<emoji=heart04>\u3000あっ……んんっ……<emoji=heart04>」"
translation = "「애액이 넘쳐버려……<emoji=heart04> 아…… 응응……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「シンちゃんのおち○ぽも、もうぬるぬるになってるから、そろそろ挿れちゃうわね……<emoji=heart04>\u3000はあぁ……ふうぅ……<emoji=heart04>」"
translation = "「신짱의 자지도, 벌써 미끈미끈해졌으니까, 슬슬 넣어버릴게……<emoji=heart04> 하아…… 후우……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんは僕のペニスをそっと膣穴に当てると、１度深呼吸をする。"
translation = "헬레나 씨는 내 자지를 살며시 질구멍에 대고는, 한 번 깊게 숨을 쉰다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「じゃあ……行くわよ？\u3000んっ……<emoji=heart04>」"
translation = "「그럼…… 들어갈게? 응……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そのまま覚悟を決めたように、腰をぐっと下ろして――"
translation = "그대로 각오를 다진 듯이, 허리를 꾹 내리며――"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ――ふあああぁ～っ……<emoji=heart04>」"
translation = "「아―― 후아아아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "僕のペニスはヘレナさんの熱く柔らかな感触に包み込まれた。"
translation = "내 자지는 헬레나 씨의 뜨겁고 부드러운 감촉에 감싸였다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ……はああぁっ……<emoji=heart04>\u3000シンちゃんのおち○ぽで、初めてを奪われちゃったぁ……<emoji=heart04>」"
translation = "「응…… 하아아……<emoji=heart04> 신짱의 자지로 처음을 빼앗겨버렸어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「ヘレナさん、大丈夫ですか……？」"
translation = "「헬레나 씨, 괜찮으세요……?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ええ……処女膜が破れる瞬間はちょっと痛かったけど、大丈夫よ<emoji=heart04>」"
translation = "「응…… 처녀막이 찢어지는 순간은 조금 아팠지만, 괜찮아<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「それより……想像してたよりずっと……<emoji=heart04>\u3000んっ……ふうぅ……<emoji=heart04>」"
translation = "「그보다…… 상상했던 것보다 훨씬……<emoji=heart04> 응…… 후우……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「これ……幸せな気分で……気持ちいいかも<emoji=heart04>\u3000んん――っ<emoji=heart04>」"
translation = "「이거…… 행복한 기분이라…… 기분 좋을지도<emoji=heart04> 응응――<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ――んああぁんっ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000ふあぁっ<emoji=heart04>\u3000はああぁんっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んあぁっ<emoji=heart04>\u3000はあぁっ……ふああぁんっ<emoji=heart04>」"
translation = "「아―― 응아아앙<emoji=heart04> 응<emoji=heart04> 아<emoji=heart04> 후아<emoji=heart04> 하아아앙<emoji=heart04> 아<emoji=heart04> 앙<emoji=heart04> 응아<emoji=heart04> 하아…… 후아아앙<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんは僕の手をぎゅっと握りながら、ゆっくりと腰を動かし始めた。"
translation = "헬레나 씨는 내 손을 꽉 쥐면서, 천천히 허리를 움직이기 시작했다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んんぅっ……！\u3000すごいっ……<emoji=heart04>\u3000初めてなのに、おま○こもう気持ちいいっ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000ふああぁんっ<emoji=heart04>」"
translation = "「응응으……! 엄청나……<emoji=heart04> 처음인데도, 보지가 벌써 기분 좋아<emoji=heart04> 응<emoji=heart04> 하아<emoji=heart04> 후아아앙<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "なんでもこなせるヘレナさんは、初めてとは思えないほど、セックスの快感もすぐに掴んでいるようだった。"
translation = "뭐든지 해내는 헬레나 씨는, 처음이라고는 믿기지 않을 정도로, 섹스의 쾌감도 금방 요령을 잡은 것 같았다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ<emoji=heart04>\u3000シンちゃん……今、私のこと、エッチだって考えてたでしょ<emoji=heart04>」"
translation = "「응<emoji=heart04> 신짱…… 지금, 나 보고 야하다고 생각했지<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「っ……！\u3000ば、バレました……？」"
translation = "「읏……! 들, 들켰나요……?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふふっ<emoji=heart04>\u3000シンちゃんは素直だから、考えてることすぐわかっちゃうんだからっ……<emoji=heart04>」"
translation = "「후후<emoji=heart04> 신짱은 솔직하니까, 무슨 생각 하는지 금방 알아차린다니까……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「シンちゃんも私のおま○こで気持ちよく感じてくれてるって<emoji=heart04>\u3000んっ……あっ<emoji=heart04>\u3000あんっ<emoji=heart04>」"
translation = "「신짱도 내 보지 때문에 기분 좋게 느껴주고 있다고 생각하니<emoji=heart04> 응…… 아<emoji=heart04> 앙<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「シンちゃんの気持ち良さそうな顔見ると、おま○こもっと熱くなってきちゃう<emoji=heart04>\u3000はあぁっ……<emoji=heart04>」"
translation = "「신짱의 기분 좋은 듯한 얼굴을 보면, 보지가 더 뜨거워져 버려<emoji=heart04> 하아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そう言いながら、ヘレナさんは腰の動きを変える。"
translation = "그렇게 말하면서, 헬레나 씨는 허리 움직임을 바꾼다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ<emoji=heart04>\u3000見ていて<emoji=heart04>\u3000シンちゃんのおち○ぽ、お姉さんがこうして……気持ちよくしてあげる<emoji=heart04>」"
translation = "「응<emoji=heart04> 보고 있어줘<emoji=heart04> 신짱의 자지, 언니가 이렇게…… 기분 좋게 해줄게<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんは上下の動きに加えて、円を描くようにゆっくりと膣壁をペニスに擦りつけてくる。"
translation = "헬레나 씨는 상하 움직임에 더해, 원을 그리듯이 천천히 질벽을 자지에 문질러 온다."

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「くぅっ……ヘレナさん、これ、すごいですっ……！」"
translation = "「쿠윽…… 헬레나 씨, 이거 대단해요……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「これ、思ったより……私も気持ちいいわっ……<emoji=heart04>」"
translation = "「이거, 생각했던 것보다…… 나도 기분 좋은걸……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ……ふうぅっ<emoji=heart04>\u3000んうぅっ……あっ<emoji=heart04>\u3000あんっ……<emoji=heart04>」"
translation = "「응…… 후우<emoji=heart04> 응우…… 아<emoji=heart04> 앙……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「膣内が擦れるたびに……変な感じがしてぇ……<emoji=heart04>\u3000んうぅ<emoji=heart04>\u3000あっ……はあぁんっ<emoji=heart04>」"
translation = "「질 안이 문질러질 때마다…… 이상한 기분이 들어서……<emoji=heart04> 응우<emoji=heart04> 아…… 하아앙<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「ヘレナさん、すごく気持ち良さそうで、エッチな顔してますよ」"
translation = "「헬레나 씨, 엄청 기분 좋아 보여서, 야한 얼굴을 하고 있어요」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「やぁん<emoji=heart04>\u3000こんな顔……シンちゃんに見られちゃうなんて……<emoji=heart04>\u3000恥ずかしいわ……<emoji=heart04>」"
translation = "「야앙<emoji=heart04> 이런 얼굴…… 신짱에게 들켜버리다니……<emoji=heart04> 창피해……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「でも……気持ち良くて、腰が止められないの……<emoji=heart04>\u3000あっ……んっ<emoji=heart04>\u3000んふぅっ……<emoji=heart04>」"
translation = "「하지만…… 기분 좋아서 허리를 멈출 수가 없어……<emoji=heart04> 아…… 응<emoji=heart04> 응후……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「大丈夫です。感じてるヘレナさん……すごく可愛いです」"
translation = "「괜찮아요. 느끼고 있는 헬레나 씨…… 엄청 귀여워요」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ<emoji=heart04>\u3000お姉さんに可愛いだなんて……そんなこと言っちゃダメよ<emoji=heart04>」"
translation = "「응<emoji=heart04> 언니한테 귀엽다니…… 그런 말 하면 안 돼<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「胸がドキドキして……おま○こキュンってなっちゃうからぁ……<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んうぅっ……<emoji=heart04>」"
translation = "「가슴이 두근거려서…… 보지가 쿵 해버리니까……<emoji=heart04> 아<emoji=heart04> 앙<emoji=heart04> 응우……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「でも……これが本当のエッチなのね……<emoji=heart04>\u3000はあぁっ……んっ<emoji=heart04>\u3000あっ……はぁんっ……<emoji=heart04>」"
translation = "「하지만…… 이게 진짜 섹스인 거네……<emoji=heart04> 하아…… 응<emoji=heart04> 아…… 하앙……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「ヘレナさん、あの……」"
translation = "「헬레나 씨, 저기……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うん？\u3000どうしたの？」"
translation = "「응? 왜 그래?」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「僕……今まで言えなかったけど――ヘレナさんのこと、好きです……！」"
translation = "「저…… 지금까지 말 못 했지만――헬레나 씨를, 좋아해요……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「……！」"
translation = "「……!」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「ヘレナさんの好みが、年上の男性だっていうのはわかってます。でも――」"
translation = "「헬레나 씨의 취향이, 연상 남성이라는 건 알고 있어요. 하지만――」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「今はダメでも、将来ヘレナさんの好みに合うオジサマになれるように、僕……頑張りますから！」"
translation = "「지금은 안 되어도, 장래에 헬레나 씨의 취향에 맞는 아저씨가 될 수 있도록, 저…… 노력할 테니까요!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「シンちゃん……<emoji=heart04>」"
translation = "「신짱……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "告白に驚いた様子のヘレナさんだったが、柔らかく微笑む。"
translation = "고백에 놀란 듯한 모습의 헬레나 씨였지만, 부드럽게 미소 짓는다."

[[dialogue]]
speaker = "unk"
original = "そして、僕のペニスにより強くおま○こを絡みつかせてきた。"
translation = "그리고, 내 자지에 더욱 강하게 보지를 얽어매어 왔다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ<emoji=heart04>\u3000そんなこと言われたら……余計にドキドキして、おま○こ興奮してきちゃう<emoji=heart04>\u3000あっ<emoji=heart04>\u3000んっ……はぁんっ<emoji=heart04>」"
translation = "「응<emoji=heart04> 그런 말을 들으면…… 더욱 두근거려서 보지가 흥분해버려<emoji=heart04> 아<emoji=heart04> 응…… 하앙<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「僕も……男としてヘレナさんのこと、もっと気持ちよくしたいです……！」"
translation = "「저도…… 남자로서 헬레나 씨를, 더욱 기분 좋게 해주고 싶어요……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「じゃあ……ここからは一緒に<emoji=heart04>」"
translation = "「그럼…… 여기서부터는 함께<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「私ももっと動くから……シンちゃんも、感じて<emoji=heart04>」"
translation = "「나도 더욱 움직일 테니까…… 신짱도, 느껴줘<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んんっ――<emoji=heart04><emoji=heart04>」"
translation = "「응응――<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ――んああああぁぁぁ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아―― 응아아아아아~~~<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そのまま、ヘレナさんは腰をさらに大きく、速く動かし始めた。"
translation = "그대로, 헬레나 씨는 허리를 더욱 크게, 빠르게 움직이기 시작했다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ、あっ、あっ、あんっ<emoji=heart04>\u3000んっ、あっ、あっ、あっ<emoji=heart04>\u3000はああぁ～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あっ、あっ、あっ、あっ<emoji=heart04>\u3000ふああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「아, 아, 아, 앙<emoji=heart04> 응, 아, 아, 아<emoji=heart04> 하아아……<emoji=heart04><emoji=heart04><emoji=heart04> 아, 아, 아, 아<emoji=heart04> 후아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "互いの体がぶつかるたびに、湿った音が重なり、コテージの中は次第に熱気と甘い空気に満たされていく。"
translation = "서로의 몸이 부딪칠 때마다, 젖은 소리가 겹쳐지고, 코티지 안은 점점 열기와 달콤한 공기로 채워져 간다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んんっ<emoji=heart04><emoji=heart04>\u3000シンちゃんのおち○ぽ、いちばん奥に当たってすごいわっ<emoji=heart04>\u3000子宮に響いて、すごく感じちゃうっ<emoji=heart04>\u3000あっ、あっ、あっ、ふああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「응응<emoji=heart04><emoji=heart04> 신짱의 자지, 가장 안쪽에 닿아서 대단해<emoji=heart04> 자궁에 울려서 엄청 느껴버려<emoji=heart04> 아, 아, 아, 후아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「初めてのエッチなのに……おま○こ信じられないくらい気持ちいいっ<emoji=heart04>\u3000あっ、あっ、あっ、あんっ<emoji=heart04>\u3000んああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「처음 하는 섹스인데…… 보지가 믿기지 않을 정도로 기분 좋아<emoji=heart04> 아, 아, 아, 앙<emoji=heart04> 응아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「僕もすごく気持ちいいです……！\u3000ヘレナさんも、もっと気持ち良くなって下さいっ……！」"
translation = "「저도 엄청 기분 좋아요……! 헬레나 씨도 더 기분 좋아져 주세요……!」"

[[dialogue]]
speaker = "unk"
original = "彼女の動きに合わせるように、僕も下から腰を突き上げる。"
translation = "그녀의 움직임에 맞추듯이, 나도 아래에서 허리를 올려 찌른다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ、シンちゃんっ<emoji=heart04>\u3000おち○ぽ来てるっ<emoji=heart04><emoji=heart04>\u3000んっ、あっ、あっ、あっ<emoji=heart04>\u3000ふあああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「아, 신짱<emoji=heart04> 자지 들어오고 있어<emoji=heart04><emoji=heart04> 응, 아, 아, 아<emoji=heart04> 후아아아……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「すごいっ<emoji=heart04>\u3000おま○こ気持ちいいわっ<emoji=heart04>\u3000あっ、あっ、あっ、あっ<emoji=heart04>\u3000はああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「대단해<emoji=heart04> 보지 기분 좋아<emoji=heart04> 아, 아, 아, 아<emoji=heart04> 하아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「気持ち良くて、もっと欲しくなっちゃうっ<emoji=heart04>\u3000あっ、あっ、あっ、あっ<emoji=heart04>\u3000はああぁ～っ<emoji=heart04><emoji=heart04>」"
translation = "「기분 좋아서 더 원하게 돼버려<emoji=heart04> 아, 아, 아, 아<emoji=heart04> 하아아……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ<emoji=heart04>\u3000もっと<emoji=heart04>\u3000シンちゃん、もっとおち○ぽいっぱい突いてっ<emoji=heart04>\u3000あっ、あっ、あっ、あんっ<emoji=heart04>\u3000奥、すごくいいのっ<emoji=heart04>」"
translation = "「응<emoji=heart04> 더<emoji=heart04> 신짱, 더 자지 많이 찔러줘<emoji=heart04> 아, 아, 아, 앙<emoji=heart04> 안쪽, 엄청 좋아<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「へレナさんっ……好きですっ！」"
translation = "「헬레나 씨…… 좋아해요……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「シンちゃん、私もっ<emoji=heart04>\u3000私も好きよっ<emoji=heart04>\u3000あっ、あっ、あっ、あっ、はああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「신짱, 나도<emoji=heart04> 나도 좋아해<emoji=heart04> 아, 아, 아, 아, 하아아……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「だから、もっと動いてっ<emoji=heart04>\u3000私のおま○こで、もっと気持ち良くなってぇ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「그러니까 더 움직여줘<emoji=heart04> 내 보지로 더 기분 좋아져줘~~~~<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「ヘレナさんっ！」"
translation = "「헬레나 씨!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ<emoji=heart04><emoji=heart04>\u3000はあああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「아<emoji=heart04><emoji=heart04> 하아아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "僕は応えるように、さらに強く身体を重ねていく。"
translation = "나는 응하듯이, 더욱 강하게 몸을 포개어 간다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「シンちゃん、おち○ぽ突き上げすごぉいっ<emoji=heart04><emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000あっ、あっ、あっ、んっ<emoji=heart04>\u3000はああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「신짱, 자지 올려 찌르는 거 굉장해예<emoji=heart04><emoji=heart04> 하아<emoji=heart04> 아, 아, 아, 응<emoji=heart04> 하아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「気持ちいいっ<emoji=heart04>\u3000おま○こすごく気持ちよくて、私、もうイっちゃいそうっ<emoji=heart04>\u3000あっ、あっ、あっ、あっ、んああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「기분 좋아<emoji=heart04> 보지 엄청 기분 좋아서, 나, 이제 가버릴 것 같아<emoji=heart04> 아, 아, 아, 아, 응아아아~~읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「僕もです……！」"
translation = "「저도요……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「なら一緒にっ<emoji=heart04>\u3000一緒にイきましょっ<emoji=heart04>\u3000あっ、あっ、あっ、あっ、はああぁ～っ<emoji=heart04>」"
translation = "「그럼 함께<emoji=heart04> 함께 가자<emoji=heart04> 아, 아, 아, 아, 하아아아~읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「今日までいっぱい我慢させちゃったからっ<emoji=heart04>\u3000だから、私の中に――」"
translation = "「오늘까지 잔뜩 참게 했으니까<emoji=heart04> 그러니까, 내 안에――」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「シンちゃんの精液、いっぱいどっぴゅんしてぇっ<emoji=heart04><emoji=heart04>」"
translation = "「신짱의 정액, 잔뜩 뷰릇뷰릇해줘<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「っ……！\u3000ヘレナさんっ！！」"
translation = "「읏……! 헬레나 씨!!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ――んああぁんっ<emoji=heart04><emoji=heart04>\u3000シンちゃんっ<emoji=heart04>\u3000んっ、ふうぅっ<emoji=heart04>\u3000んっ、ふぅっ、ふんっ、ふんっ<emoji=heart04>\u3000んんうぅんっ<emoji=heart04><emoji=heart04>」"
translation = "「아――응아아앙<emoji=heart04><emoji=heart04> 신짱<emoji=heart04> 응, 후우<emoji=heart04> 응, 후우, 흠, 흠<emoji=heart04> 응응응<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "お互いの手を強く握り合いながら、ひたすらに腰を振って、快楽の絶頂へと登っていく。"
translation = "서로의 손을 강하게 맞잡으면서, 한사코 허리를 흔들어, 쾌락의 절정으로 올라간다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ<emoji=heart04>\u3000ふあああぁっ<emoji=heart04><emoji=heart04>\u3000おま○こ、すごく気持ちいいのきてるっ<emoji=heart04>\u3000私もうイっちゃうっ<emoji=heart04><emoji=heart04>\u3000あっあっあっあっ、んあああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「응<emoji=heart04> 후아아아<emoji=heart04><emoji=heart04> 보지, 엄청 기분 좋은 거 오고 있어<emoji=heart04> 나 이제 가버려<emoji=heart04><emoji=heart04> 아아아아, 응아아아~~읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「来るっ<emoji=heart04>\u3000きちゃうっ<emoji=heart04><emoji=heart04>\u3000あっあっあっあ、ふああああああ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「온다<emoji=heart04> 와버려<emoji=heart04><emoji=heart04> 아아아아, 후아아아아아~~~읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ、イクっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000イクイクイクイクっ<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아, 가<emoji=heart04><emoji=heart04><emoji=heart04> 가자가자가자<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「ヘレナさん、もう出るっ！！！」"
translation = "「헬레나 씨, 이제 나와요!!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ―――<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아―――<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふあああああああああぁ～～～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>\u3000イっクううううううぅぅぅ～～～～～～～～～んっ<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「후아아아아아아아아아아~~~~~~~~~읏<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04> 하앙, 가아아아아아아아앗~~~~~~~~~앙<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "僕はヘレナさんのいちばん奥にペニスを密着させながら、今日まで溜め込んだ想いと共に精液を思いっきり解き放った。"
translation = "나는 헬레나 씨의 가장 깊은 곳에 자지를 밀착시키면서, 오늘까지 모아둔 마음과 함께 정액을 마음껏 해방했다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あっ――ふあああぁんっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000シンちゃんの熱いの、子宮にいっぱいどくどくって注がれてるぅ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아――후아아앙<emoji=heart04><emoji=heart04><emoji=heart04> 신짱의 뜨거운 거, 자궁에 잔뜩 꿀럭꿀럭 부어지고 있어~~~읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ<emoji=heart04>\u3000ふううぅ～～っ<emoji=heart04><emoji=heart04>\u3000すごい……<emoji=heart04>\u3000おち○ぽ、射精するたびに力強く脈打って……<emoji=heart04>\u3000とっても逞しいわ……<emoji=heart04>」"
translation = "「응<emoji=heart04> 후우우~~읏<emoji=heart04><emoji=heart04> 대단해……<emoji=heart04> 자지, 사정할 때마다 힘차게 맥박쳐서……<emoji=heart04> 엄청 씩씩해……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「あんっ……<emoji=heart04>\u3000シンちゃんの射精、まだ続いてる……<emoji=heart04>\u3000男らしくて、子宮がキュンキュンしちゃう……<emoji=heart04>」"
translation = "「앙……<emoji=heart04> 신짱의 사정, 아직 계속되고 있어……<emoji=heart04> 남자다워서, 자궁이 쿵쾅쿵쾅해버려……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "おそらく今まででいちばん出たであろう射精も、ようやく落ち着いてきて……お互いにしばらく余韻を味わった後、ヘレナさんがゆっくりと腰を上げる。"
translation = "아마도 지금까지 중 가장 많이 나왔을 사정도, 겨우 진정되어 가고…… 서로 한동안 여운을 맛본 후, 헬레나 씨가 천천히 허리를 올린다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ……ふうぅ……<emoji=heart04>\u3000すごい……<emoji=heart04>\u3000シンちゃんの、入りきらなくていっぱい溢れてきちゃってるわ……<emoji=heart04>」"
translation = "「응……후우……<emoji=heart04> 대단해……<emoji=heart04> 신짱 거, 다 들어가지 않아서 잔뜩 넘쳐흘러버리고 있어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんは呼吸を少しずつ整えながら、言う。"
translation = "헬레나 씨는 호흡을 조금씩 가다듬으면서, 말한다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「はあぁ……<emoji=heart04>\u3000初めての本番エッチ……気持ちよかった？」"
translation = "「하아……<emoji=heart04> 첫 진짜 섹스…… 기분 좋았어?」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「はい……すごく」"
translation = "「네…… 엄청요」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「よかった……<emoji=heart04>\u3000私も、する前は初めてだから痛いかもって思ってたけど……」"
translation = "「다행이다……<emoji=heart04> 나도, 하기 전에는 처음이라 아플지도 모른다고 생각했지만……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「気づいたら、すごく気持ち良くて……我を忘れちゃうくらい乱れちゃってたわ<emoji=heart04>」"
translation = "「정신을 차려보니, 엄청 기분 좋아서…… 이성을 잃을 정도로 흐트러져버렸어<emoji=heart04>」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「ヘレナさんとこうしてエッチできて……僕、幸せです」"
translation = "「헬레나 씨와 이렇게 섹스할 수 있어서…… 저, 행복해요」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ん……<emoji=heart04>\u3000ありがと……<emoji=heart04>\u3000そう言ってくれて、嬉しいわ」"
translation = "「응……<emoji=heart04> 고마워……<emoji=heart04> 그렇게 말해줘서, 기뻐」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「今日までずっと……待たせちゃってごめんね？\u3000シンちゃん」"
translation = "「오늘까지 계속…… 기다리게 해서 미안해? 신짱」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「いえ、いいんです。ヘレナさん、僕――」"
translation = "「아뇨, 괜찮아요. 헬레나 씨, 저――」"

[[dialogue]]
speaker_original = "シン"
speaker_translation = "신"
original = "「言った通り、ヘレナさんの好みのオジサマになれるように頑張りますから」"
translation = "「말씀하신 대로, 헬레나 씨의 취향인 아저씨가 될 수 있도록 노력할 테니까요」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ええ、期待しているわ。でも……」"
translation = "「그래, 기대하고 있을게. 하지만……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「シンちゃんは、今のままでも十分に素敵よ。だって――」"
translation = "「신짱은, 지금 그대로도 충분히 멋져. 왜냐하면――」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「今こうして一緒にいて、私……すごく幸せな気分なんだから<emoji=heart04>」"
translation = "「지금 이렇게 함께 있어서, 나…… 엄청 행복한 기분인걸<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんはそう言って微笑むと、ゆっくりと顔を近づけてきて――"
translation = "헬레나 씨는 그렇게 말하며 미소 짓고는, 천천히 얼굴을 가까이 가져와서――"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「んっ……<emoji=heart04>\u3000ちゅっ……<emoji=heart04>」"
translation = "「응……<emoji=heart04> 쪽……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "柔らかな唇が、そっと重なる。"
translation = "부드러운 입술이, 살며시 포개어진다."

[[dialogue]]
speaker = "unk"
original = "すると、僕の体は男として、勝手に反応を示してしまって。"
translation = "그러자, 내 몸은 남자로서, 제멋대로 반응을 보여버려서."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「<emoji=heart04>\u3000ねぇ、シンちゃん……」"
translation = "「<emoji=heart04> 저기, 신짱……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「もう１回、しちゃう？\u3000ふふっ……<emoji=heart04>」"
translation = "「한 번 더, 해버릴까? 후후……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "それからも、僕はヘレナさんと、蜜のように甘い初体験を何度も繰り返し反芻し続けてしまうのだった。"
translation = "그 후로도, 나는 헬레나 씨와, 꿀처럼 달콤한 첫 경험을 몇 번이고 되풀이하여 되새겨버리고 마는 것이었다."

