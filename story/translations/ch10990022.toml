[[dialogue]]
speaker = "unk"
original = "第２話,ミウの放課後クラストーク,P"
translation = ""

[[dialogue]]
speaker_original = "女学生"
speaker_translation = "女学生"
original = "「ミウって会長さんとお付き合いしてるんでしょー？\u3000どっちから告白したのー？」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さんからですよ。デートに誘ってくれた日の帰り際に告白してくれたんです」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「映画を見終わった後で、夜の公園で抱きしめながら『好きだよ、付き合ってください』って言ってくれました」"
translation = ""

[[dialogue]]
speaker_original = "女学生"
speaker_translation = "女学生"
original = "「ロマンチックー！\u3000さすがは会長さんだねー。憧れてる人いっぱいいるモテモテ会長さんを惚れさせちゃうなんて、ミウちゃんってやっぱスゴーい！」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そ、そうかな？\u3000えへへ、彼氏を褒められると悪い気はしないですね」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（事前に計画していたプランがちょっと崩れて、グダグダにはなっちゃったけどね……）"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（涙でべしょべしょだったし、会長さんにフォローしてもらったみたいな告白だったけど……嘘は言ってないよね？）"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ニヨニヨ<emoji=heart04>」"
translation = "「싱글벙글<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「……ヒマワリちゃん、何か言いたそうだね？」"
translation = "「……히마와리짱, 무슨 하고 싶은 말이라도 있어?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んーんー？\u3000べっつにー、なーんにもー？」"
translation = "「응-응-? 별-로-, 아무것도-?」"

[[dialogue]]
speaker_original = "女学生"
speaker_translation = "女学生"
original = "「ヒマワリちゃんはなんか知ってるの？\u3000ミウちゃんと仲良いもんねー」"
translation = "「히마와리짱은 뭔가 알고 있는 거야? 미우짱이랑 친하잖아-」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ミウとは大親友だもん。いろいろ聞いたからね♪」"
translation = "「미우랑은 절친인걸. 이것저것 들었거든♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃん、絶対に言っちゃダメだからね！？」"
translation = "「히마와리짱, 절대로 말하면 안 돼!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「言わないってばー。他の人には絶対秘密って約束したもんね」"
translation = "「안 말한다니까-. 다른 사람한테는 절대 비밀이라고 약속했잖아」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（前々から私の気持ちを知っていて、恋愛相談にも乗ってくれていた親友のヒマワリちゃんには、告白の時の話をしちゃったんだよね……）"
translation = "（전부터 내 마음을 알고 있어서, 연애 상담도 해 주던 절친인 히마와리짱한테는, 고백했을 때의 이야기를 해 버렸단 말이지……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（だって、ヒマワリちゃんが激詰めしてくるし、話してくれないなら会長さんに直接聞きに行くなんて言うから渋々……）"
translation = "（그야, 히마와리짱이 엄청 추궁해 오고, 안 말해주면 회장님한테 직접 물으러 가겠다고 하니까 어쩔 수 없이……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「──って感じになっちゃったの……」"
translation = "「──라는 느낌이 돼 버렸어……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えー！？\u3000ミウもパニクっちゃうことってあるんだ！？」"
translation = "「에-!? 미우도 당황해서 패닉에 빠질 때가 있구나!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「でも、なんか可愛いー！\u3000やっぱりミウも恋する女の子なんだねー！」"
translation = "「하지만, 왠지 귀여워-! 역시 미우도 사랑하는 여자아이구나-!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「もう、私のことなんだと思ってたの？\u3000そうやって冷やかされるから言いたくなかったのに」"
translation = "「정말, 나를 뭐라고 생각했던 거야? 그렇게 놀려대니까 말하기 싫었던 건데」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「冷やかしてなんかないよー。ミウの可愛いとこを新しく見つけたってだけ！」"
translation = "「놀리는 거 아니야-. 미우의 귀여운 점을 새로 발견했을 뿐!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「いろいろあったかもだけど、会長さんとお付き合いできて、良かったじゃん」"
translation = "「이래저래 일이 있긴 했지만, 회장님이랑 사귀게 돼서 잘됐잖아」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「……うん、ありがと」"
translation = "「……응, 고마워」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さんとラブラブなのはいいけど、遊んでくれなくなっちゃうと困るなー。これからもあたしたちは親友だからね！」"
translation = "「회장님이랑 러브러브한 건 좋은데, 나랑 안 놀아주게 되면 난처한데-. 앞으로도 우리들은 절친이니까!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「もちろん、ヒマワリちゃんはずっと親友だよ！\u3000あっ、告白の話は絶対誰にも言っちゃダメだからね！」"
translation = "「물론, 히마와리짱은 계속 절친이야! 아, 고백 이야기는 절대 아무한테도 말하면 안 돼!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わかってるってばー。ミウの恥ずかしい秘密は、あたしとミウだけのものー♪」"
translation = "「알고 있다니까-. 미우의 부끄러운 비밀은, 나랑 미우만의 것-♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「もうっ、ヒマワリちゃんっ！」"
translation = "「정말이지, 히마와리짱!」"

[[dialogue]]
speaker = "unk"
original = "ミウを迎えに附属教室に向かったのだが、何やら同級生たちと話が盛り上がっている様子だった。"
translation = "미우를 데리러 부속 교실로 향했으나, 무슨 이유에선지 동급생들과 이야깃꽃을 피우고 있는 모습이었다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あ！\u3000噂をすればなんとやらの会長さんだー。どしたのー？」"
translation = "「아! 호랑이도 제 말 하면 온다더니 회장님이네-. 무슨 일이야-?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あっ……！\u3000校門の前で待っててくださいって言ってたのに……！」"
translation = "「앗……! 교문 앞에서 기다려 달라고 했었는데……!」"

[[dialogue]]
speaker = "unk"
original = "ミウとの放課後デートの約束してたからさ"
translation = "「미우랑 방과후 데이트 약속을 했거든」"

[[dialogue]]
speaker = "unk"
original = "星徒会の仕事が早く終わったからさ"
translation = "「성도회 일이 일찍 끝나서 말이지」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ミウとデートなんだー！\u3000待ちきれなくて迎えに来ちゃったんですね」"
translation = "「미우랑 데이트구나-! 기다리지 못해서 마중 나온 거군요」"

[[dialogue]]
speaker_original = "女学生"
speaker_translation = "女学生"
original = "「やっぱり会長さん、ミウちゃんにラブラブなんだー。いいなー、私も素敵な彼氏欲しいよー」"
translation = "「역시 회장님, 미우짱한테 러브러브네-. 좋겠다-, 나도 멋진 남자친구 갖고 싶어-」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さんは、ミウのどんなところが好きなんですー？」"
translation = "「회장님은, 미우의 어떤 점이 좋은가요-?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「し、失礼だよ、ヒマワリちゃん！\u3000か、会長さん、別に答えなくても──」"
translation = "「실, 실례야, 히마와리짱! 회, 회장님, 딱히 대답하지 않아도──」"

[[dialogue]]
speaker = "unk"
original = "俺のことが大好きなとこ、かな"
translation = "「나를 엄청 좋아하는 점, 이려나」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んにゃっ……！？」"
translation = "「응냐앗……!?」"

[[dialogue]]
speaker_original = "女学生"
speaker_translation = "女学生"
original = "「きゃー、両想いだーっ♪」"
translation = "「캐-, 서로 좋아하는 사이다-♪」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「たまに意地っ張りなとこもあるけど、可愛い所もあるから、会長さん、ミウと仲良くしてあげてね！」"
translation = "「가끔 고집 부릴 때도 있지만, 귀여운 구석도 있으니까, 회장님, 미우랑 사이좋게 지내줘!」"

[[dialogue]]
speaker = "unk"
original = "ミウの可愛い所は俺が１番知ってるからね"
translation = "「미우의 귀여운 점은 내가 제일 잘 알고 있으니까」"

[[dialogue]]
speaker = "unk"
original = "言われなくても！"
translation = "「말하지 않아도!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「なにをーっ！\u3000ミウのことなら、あたしだっていっぱい知ってるしー！」"
translation = "「뭐라는 거야-! 미우에 대해서라면, 나도 엄청 잘 알고 있다고-!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んー、でも、女のあたしじゃ見られないところも、会長さんは見ちゃってるのかな……？」"
translation = "「음-, 그래도, 여자인 나로선 볼 수 없는 모습도, 회장님은 보고 있는 걸까나……?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「もう、ヒマワリちゃんっ！\u3000会長さん、早く行かないとお店閉まっちゃいますよ！\u3000みんなまた明日ね！」"
translation = "「정말, 히마와리짱! 회장님, 빨리 안 가면 가게 문 닫아버려요! 다들 내일 봐!」"

[[dialogue]]
speaker_original = "女学生"
speaker_translation = "女学生"
original = "「うん、また明日ねー」"
translation = "「응, 내일 봐-」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「末永くお幸せにー♪」"
translation = "「오래오래 행복해라-♪」"

[[dialogue]]
speaker = "unk"
original = "ヒマワリに冷やかされながらも、ミウは俺の手を引いて教室を離れるのだった。"
translation = "히마와리에게 놀림을 받으면서도, 미우는 내 손을 이끌고 교실을 벗어나는 것이었다."

