[[dialogue]]
speaker = "unk"
original = "その日の夜。"
translation = "그날 밤."

[[dialogue]]
speaker = "unk"
original = "九浄家の屋敷に戻った後、ヨミは蘭美の元を訪ねていた。"
translation = "쿠죠 가의 저택으로 돌아온 후, 요미는 라비의 있는 곳을 찾아가 있었다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ヨミ、今日はどうしたのかしら！\u3000浮かない顔をしているみたいだけれど」"
translation = "「요미, 오늘은 무슨 일이니! 안 좋은 표정을 하고 있는 것 같다만」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「メイド長……」"
translation = "「메이드장님……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私……教育係になるのは早かったかもしれません」"
translation = "「저…… 교육 담당이 되는 건 빨랐을지도 몰라요」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あら、それはどうして？」"
translation = "「어머, 그건 어째서니?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里さんの問題に気づいていたのに、指摘できなくて。今日あったモンスターとの戦闘で、怪我をさせてしまいました……」"
translation = "「코마리 씨의 문제를 알고 있었는데 지적하지 못해서. 오늘 있었던 몬스터와의 전투에서 다치게 만들어 버렸어요……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「先輩失格です……。それで、どうしたらいいか、私１人ではわからなくて」"
translation = "「선배 실격이에요……. 그래서 어떻게 해야 좋을지 저 혼자서는 몰라서」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「なるほどね……」"
translation = "「그렇군……」"

[[dialogue]]
speaker = "unk"
original = "蘭美は少しだけ考え込む。"
translation = "라비는 잠시 생각에 잠긴다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「なら、そうね――会長に話を聞いてもらいなさい！」"
translation = "「그러면 그렇네――회장에게 이야기를 들어달라고 하렴!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「え？\u3000会長……ですか？」"
translation = "「네? 회장…… 말인가요?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ええ。私からも話を聞いてもらえるように頼んでおくわ！」"
translation = "「그래. 나도 이야기를 들어주도록 부탁해 둘 테니까!」"

[[dialogue]]
speaker = "unk"
original = "翌日の昼休み。"
translation = "다음 날 점심시간."

[[dialogue]]
speaker = "unk"
original = "ヨミは蘭美に言われた通り、会長――クロトに事情を打ち明けた。"
translation = "요미는 라비가 말한 대로 회장――쿠로토에게 사정을 털어놓았다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「――なるほど」"
translation = "「――그렇군」"

[[dialogue]]
speaker = "unk"
original = "会長は最後まで口を挟まず、真剣な表情で話を聞いてくれた。"
translation = "회장은 끝까지 말참견하지 않고 진지한 표정으로 이야기를 들어주었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私……狛里さんにちゃんと指摘できなかったんです」"
translation = "「저…… 코마리 씨에게 제대로 지적하지 못했어요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「もし私が間違っていたらって、自信を持てなくて……」"
translation = "「혹시 내가 틀렸다면 어쩌지 하고, 자신을 가질 수 없어서……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミは真面目だもんな。だからこそ、間違えないように慎重になる」"
translation = "「요미는 성실하니까. 그렇기에 틀리지 않도록 신중해지는 거겠지」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でも、自信がなくても、ヨミが『先輩』になったって事実は変わらないと思うんだ」"
translation = "「하지만 자신이 없어도, 요미가 『선배』가 되었다는 사실은 바뀌지 않는다고 생각해」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私が、『先輩』になった事実……」"
translation = "「내가 『선배』가 되었다는 사실……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「狛里が来るまで、ヨミはメイド隊の中でも『後輩』、新人寄りだっただろ？」"
translation = "「코마리가 오기 전까지 요미는 메이드대 중에서도 『후배』, 신입에 가까웠잖아?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だから、謙虚であれば誰からも叱られることはなかった。でも、ヒトの上に立つとなったら、謙虚ってだけじゃダメだと思うんだ」"
translation = "「그러니까 겸손하게 있으면 누구한테도 꾸중 들을 일은 없었어. 하지만 남의 위에 서게 된다면, 겸손하기만 해서는 안 된다고 생각해」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヒトは誰だって、いつかヒトの上に立つことを求められる。先輩であったり、上司であったり、親であったり、さ」"
translation = "「사람은 누구나 언젠가 남의 위에 서는 것을 요구받아. 선배이거나, 상사이거나, 부모이거나 말이지」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そうなった時、上に立つ側には、ついてきてくれるヒトに対しての責任が発生すると思うんだ」"
translation = "「그렇게 되었을 때, 위에 서는 쪽에는 따라와 주는 사람에 대한 책임이 발생한다고 생각해」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「責任……はい。確かにそう、だと思います」"
translation = "「책임…… 네. 확실히 그렇다고 생각해요」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……俺もさ、最初から会長になろうと思ってなったわけじゃない」"
translation = "「……나도 말이야, 처음부터 회장이 되려고 해서 된 게 아니야」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヴィーナスに突然指名されて、その流れで会長になった」"
translation = "「비너스에게 갑자기 지명돼서, 그 흐름으로 회장이 됐지」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でも、会長になった以上は、やるしかない。これは『覚悟』の問題なんだ」"
translation = "「하지만 회장이 된 이상은 할 수밖에 없어. 이건 『각오』의 문제야」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「！」"
translation = "「!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「失敗は必ずある。失望されるのも怖い」"
translation = "「실패는 반드시 있어. 실망당하는 것도 두렵지」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だけど、それで周りの顔色ばっかりうかがっている『不安』だらけのリーダーには、誰もついていきたくないだろ？」"
translation = "「하지만 그렇다고 주변 눈치만 보고 있는 『불안』으로 가득 찬 리더를 누구도 따르고 싶지 않잖아?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「不安があったとしても、不安を感じさせない。自信がなくても、自信のなさを感じさせない」"
translation = "「불안이 있다고 해도 불안을 느끼게 하지 않는다. 자신이 없어도 자신 없음을 느끼게 하지 않는다」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そういう、『ついてきてくれる人のための腹のくくり方』を覚悟って呼ぶんじゃないかな」"
translation = "「그런 『따라와 주는 사람을 위해 마음을 다잡는 법』을 각오라고 부르는 게 아닐까」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……そしてそれは『リーダー』だけじゃなくて、『先輩』も同じだ」"
translation = "「……그리고 그건 『리더』뿐만 아니라 『선배』도 마찬가지야」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「自信があるから、先輩になるわけじゃない」"
translation = "「자신이 있으니까 선배가 되는 게 아니야」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「後輩ができたから『後輩のために腹をくくる』。その覚悟が、その人を先輩たらしめるんだ」"
translation = "「후배가 생겼으니까 『후배를 위해 마음을 다잡는다』. 그 각오가 그 사람을 선배답게 만드는 거야」"

[[dialogue]]
speaker = "unk"
original = "その言葉に、ヨミは思わず目を見開いた。"
translation = "그 말에 요미는 나도 모르게 눈을 크게 떴다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里さんのために、私が腹をくくる覚悟……」"
translation = "(코마리 씨를 위해, 내가 마음을 다잡을 각오……)"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だからヨミも、自信がついてから教育係になるんじゃなくて」"
translation = "「그러니까 요미도 자신이 붙고 나서 교육 담당이 되는 게 아니라」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「狛里のために、狛里の先輩になるって……自分が心に決めるんだ」"
translation = "「코마리를 위해, 코마리의 선배가 되겠다고…… 스스로 마음에 정하는 거야」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「自分が、心に決める……」"
translation = "「스스로, 마음에 정한다……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うん。教育係だって、初めて後輩を指導する時は初心者だ。だから、間違うこともあるかもしれない」"
translation = "「응. 교육 담당도 처음 후배를 지도할 때는 초보자야. 그러니까 틀릴 수도 있어」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でも、その時は俺や、蘭美や、ヘレナちゃんが『それは違うんじゃないか？』って、ちゃんと指摘する」"
translation = "「하지만 그럴 때는 나나, 라비나, 헬레나짱이 『그건 아니지 않나?』 하고 제대로 지적해 줄 거야」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だからヨミも、狛里のやっていることがよくないって思ったら、ちゃんと伝えてあげてほしい」"
translation = "「그러니까 요미도 코마리가 하고 있는 행동이 좋지 않다고 생각하면 제대로 전달해 주었으면 좋겠어」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それが『先輩』の役目だから」"
translation = "「그게 『선배』의 역할이니까」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker = "unk"
original = "ヨミは静かに俯く。"
translation = "요미는 조용히 고개를 숙인다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（そうだ……）"
translation = "(그래……)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（私も周りの人たちに、こうして教えてもらってきた）"
translation = "(나도 주변 사람들에게 이렇게 가르침을 받아왔어)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（だったら今度は……）"
translation = "（그러면 이번에는……）"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（私が、狛里さんに教える番なんだ！）"
translation = "（내가, 코마사토 씨에게 가르쳐 줄 차례야!）"

[[dialogue]]
speaker = "unk"
original = "ヨミは顔を上げる。"
translation = "요미는 고개를 든다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長、私――」"
translation = "「회장님, 저――」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「もう１度、ちゃんと狛里さんに伝えてみます」"
translation = "「다시 한번, 제대로 코마사토 씨에게 전달해 볼게요」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うん、その意気だ」"
translation = "「응, 바로 그 기세야」"

[[dialogue]]
speaker = "unk"
original = "会長は微笑みながら、サムズアップをしてみせる。"
translation = "회장은 미소 지으며, 엄지를 세워 보인다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「頑張れ、ヨミ<b>先輩</b>！」"
translation = "「힘내라, 요미 <b>선배</b>!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「！\u3000……はいっ！」"
translation = "「! ……네!」"

[[dialogue]]
speaker = "unk"
original = "ヨミも力強く頷いてみせるのだった。"
translation = "요미도 힘차게 고개를 끄덕이는 것이었다."

