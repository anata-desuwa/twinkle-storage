[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んひっ、いいにゃっ<emoji=heart04>\u3000おち○ちん、もっとごしごし、ずぶずぶしてっ<emoji=heart04>\u3000もっと、もっと……いっぱい、おま○こしてくらひゃぁいっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はっ、おち○ちんでいっぱい、おち○ちんのことしかっ、きもちいいことしか考えらんニャいよぉっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
