[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……ベアト？\u3000まだスイッチ入りっぱなしなの？」"
translation = ""

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「甘ぁい夜が明けるまでが、吸血鬼の時間で、ハロウィンなんです<emoji=heart04>\u3000このまま朝日が昇るまで、愛し合いましょうニャ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ペロッと物欲しそうに舌なめずりをするその仕草は、まさに獲物を狙う猫のそれだった。"
translation = ""

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私を発情期にさせたのは会長さんなんですから……責任取って満足するまでお付き合いしてくださいニャ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ハロウィンの夜は、永遠に続くと思える程に長くて深い。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "際限なく俺を求めてくるベアトに魅せられ、煽られ、促され──限界を超えるまで搾り取られたのだった。"
translation = ""

