[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「いいれすよっ<emoji=heart04>\u3000発情期の猫ちゃんおま○こにっ、精子っ、精子っ<emoji=heart04>\u3000たっぷり出してっ<emoji=heart04>\u3000種付けっ、孕ませてっ、私をママにしてくださいニャンっ<emoji=heart04>」"
