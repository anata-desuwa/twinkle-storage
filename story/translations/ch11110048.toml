[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぃ、んみゃ、ひゃうぅっ<emoji=heart04>\u3000おっぱいっ<emoji=heart04>\u3000先っぽっ<emoji=heart04>\u3000シーツに擦れるの、きもぢいっ<emoji=heart04>\u3000にゃ、んにゃ、乳首ぃ、乳首もきもぢいいニャンっ<emoji=heart04>」"
