[[dialogue]]
speaker = "unk"
original = "草木も眠る丑三つ時。"
translation = "초목도 잠든 축시 삼경."

[[dialogue]]
speaker = "unk"
original = "世界の大半が寝静まった時間だが、むしろ夜に潜む吸血鬼にとっては活動のコアタイム。"
translation = "세계의 대반이 잠든 시간이지만, 오히려 밤에 숨는 흡혈귀에게는 활동의 피크 타임."

[[dialogue]]
speaker = "unk"
original = "そして、この日はハロウィンだった。"
translation = "그리고, 이 날은 핼러윈이었다."

[[dialogue]]
speaker = "unk"
original = "窓から差し込む月明かりは、寝室をまるで水底のような幻想的な青に染めている。"
translation = "창문으로 들어오는 달빛은 침실을 마치 물속 같은 환상적인 푸른빛으로 물들이고 있다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「吸血鬼らしく、夜中にお邪魔しま～す……ニャン♪」"
translation = "「흡혈귀답게, 밤중에 실례하겠습니~다…… 냥♪」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふふ、会長さん、ぐっすり寝てますニャ～……起こさないように、抜き足、差し足、忍び足～……」"
translation = "「후후, 회장님, 푹 자고 있냥~…… 깨우지 않도록, 발걸음도 조심조심~……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「朝になるまでは、まだハロウィンだからね。会長さん、トリック・オア・トリート～……」"
translation = "「아침이 되기 전까지는 아직 핼러윈이니까. 회장님, 트릭 오어 트리트~……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぐぅ……すやぁ……すぴぃ……」"
translation = "「쿨…… 콜…… 스피……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふふ、可愛い寝息。でもお返事はなし、と」"
translation = "「후후, 귀여운 숨소리. 하지만 대답은 없음, 이라」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「お菓子をくれないってことは～……イタズラしちゃっていいんだよね♪」"
translation = "「과자를 안 준다는 건~…… 장난쳐도 된다는 거지♪」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うわわ～、寝てる人にイタズラするなんて、私、いけないことしちゃってる～」"
translation = "「우와와~, 자는 사람한테 장난치다니, 나, 나쁜 짓 하고 있어~」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもイタズラって……夜這いって何からすればいいんだろ……と、とりあえず、キ、キスしちゃう……！？」"
translation = "「하지만 장난이라니…… 밤중에 몰래 찾아와서 뭐부터 해야 하지…… 우, 일단, 키, 키스해 버린다……!?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「首筋にチューチュー吸いついちゃったりして……ひゃー、それはいくらなんでもえっちすぎるよね……！」"
translation = "「목덜미에 쪽쪽 빨아버리거나 하고…… 히야-, 그건 아무리 그래도 너무 야하잖아……!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「よ、よーし！\u3000寝てるとこに、チューしちゃお……いっただきま──あ、あれっ！？\u3000会長さんが消えちゃった！？\u3000どこに行ったの？」"
translation = "「좋, 좋아-! 자는 동안에 쪽해 버리자…… 잘 먹겠습── 어, 어라!? 회장님이 사라졌어!? 어디로 간 거야?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ベアト、後ろ後ろ」"
translation = "「베아트, 뒤야 뒤」"

[[dialogue]]
speaker = "unk"
original = "ベアトがイタズラ妄想で我を失っている内に、俺はベッドからこっそり抜け出し、ベアトの背後に回っていた。"
translation = "베아트가 장난 망상으로 제정신을 잃고 있는 사이, 나는 침대에서 슬그머니 빠져나와 베아트의 뒤로 돌아가 있었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「う、後ろ！？\u3000いつから起きてたんですっ！？」"
translation = "「뒤, 뒤!? 언제부터 깨어 있었던 거예요!?」"

[[dialogue]]
speaker = "unk"
original = "もちろん最初からだ。寝ていようが、怪しい気配を漂わせている侵入者に気づけないようじゃ会長職は務まらない。"
translation = "당연히 처음부터다. 자고 있든 말든, 수상한 기척을 풍기는 침입자를 눈치채지 못하면 회장 직을 맡을 수 없다."

[[dialogue]]
speaker = "unk"
original = "侵入者が人畜無害なベアトだったので、むしろ何をしでかすつもりなのか、反応を見ていた。"
translation = "침입자가 해가 없는 베아트였기에, 오히려 무슨 짓을 저지를 작정인지 반응을 보고 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ていっ！」"
translation = "「얍!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ぅにゃぁんっ！？」"
translation = "「우냐앙!?」"

[[dialogue]]
speaker = "unk"
original = "ベアトの背中をポンと押して、ベッドにうつ伏せに転がす。"
translation = "베아트의 등을 톡 밀어서, 침대에 엎드리게 굴린다."

[[dialogue]]
speaker = "unk"
original = "侵入の目的が俺の寝込みを襲おうとする悪い子ならば、こっちも容赦なしだ。"
translation = "침입의 목적이 내가 잠든 사이에 습격하려는 나쁜 아이라면, 이쪽도 용서 없다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふみゃーっ？\u3000私からイタズラを仕掛けるはずだったのに、どうして逆転しちゃってるんですー！？」"
translation = "「후먀-? 내가 장난을 걸 예정이었는데, 어째서 역전되어 있는 건가요-!?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「夜這いを仕掛けてきたんだから、端からエッチするつもりだったんだろ？」"
translation = "「밤에 몰래 찾아왔으니, 처음부터 야한 짓 할 생각이었잖아?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、それは、まぁ……そうですけどぉ……」"
translation = "「그, 그건, 뭐…… 그렇지만요……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だから触ってないのにおま○こがびちゃびちゃなんだね」"
translation = "「그러니까 만지지도 않았는데 보지가 흠뻑 젖어 있네」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うぅぅ、自分でもわかってますから、言わないでくださいっ……」"
translation = "「우우우, 저도 알고 있으니까 말하지 말아 주세요……」"

[[dialogue]]
speaker = "unk"
original = "下着をずらして剥き出しになった女性器はヒクヒクとうごめき、開きかけている割れ目からはシーツに滴るほどの愛液が漏れ出ていた。"
translation = "속옷을 비켜서 드러난 여성기는 꿈틀꿈틀 움직이고, 벌어지기 시작한 갈라진 틈에서는 시트에 떨어질 정도의 애액이 새어나오고 있었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ハロウィンパワーが強まってるせいなんですかね……会長さんが欲しくて、体疼いちゃってるんです……」"
translation = "「핼러윈 파워가 강해진 탓일까요…… 회장님을 원해서, 몸이 쑤셔버려요……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いや、それはベアトがエッチなだけだと思うけど」"
translation = "「아니, 그건 베아트가 야할 뿐이라고 생각하는데」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ええっ！？\u3000仮に、私がエッ、エ、エッチなんだとしても！\u3000言い方ってものがあるじゃないですか～！」"
translation = "「에엣!? 만약 내가 야, 야, 야한 거라고 해도! 말하는 방식이라는 게 있잖아요~!」"

[[dialogue]]
speaker = "unk"
original = "愛液でぐちょぐちょに濡らした女性器から、男を誘う桃のような甘い香りを漂わせていたら、どうオブラートに包もうともエッチと言う他なかった。"
translation = "애액으로 젖어 있는 여성기에서 남성을 유혹하는 복숭아 같은 달콤한 향기를 풍기고 있다면, 어떻게 돌려 말하든 야하다고 할 수밖에 없었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「それを言うなら、会長さんだってエ、エッチじゃないですか……おち○ちん、大きくなりすぎですよ……」"
translation = "「그렇게 말하면, 회장님도 야, 야하잖아요…… 자지, 너무 커졌어요……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うん、エッチな俺はもう我慢できないんで、このまま入れるね」"
translation = "「응, 야한 나는 이제 못 참겠으니까, 이대로 넣을게」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えっ、えっ？\u3000後ろからっ！？\u3000四つん這いなんて、恥ずかしすぎますっ……この格好、恥ずかしいところまで全部見えちゃってませんかっ……！」"
translation = "「엣, 엣? 뒤에서!? 엎드린 자세라니, 너무 부끄러워요…… 이 자세, 부끄러운 곳까지 전부 보이지 않나요……!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うんうん、かわいいお尻の穴まで丸見えだ」"
translation = "「응응, 귀여운 엉덩이 구멍까지 훤히 보여」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふみゃーっ！？\u3000い、言わないでくださ──んぁっ<emoji=heart04>\u3000おま○こに、おち○ちん当たって……こんな格好で入れたら、エッチっていうか動物の交尾っ──」"
translation = "「후먀-!? 말, 말하지 말아 주── 응아<emoji=heart04> 보지에, 자지 닿아서…… 이런 자세로 넣으면, 야하다기보다 동물의 교미──」"

[[dialogue]]
speaker = "unk"
original = "ベアトリスのむちむちの尻肉を鷲掴みにし、膣口に添えていたペニスを一気に突き入れた。"
translation = "베아트리스의 큼직한 엉덩이살을 꽉 움켜쥐고, 질구에 대고 있던 페니스를 한 번에 꿰뚫었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぅにゃぁああぁああぁぁぁっ！？！<emoji=heart04>」"
translation = "「응우냐아아아아아아앗!?<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「すごい喘ぎ声だな。本当に発情期の猫みたいだ」"
translation = "「엄청난 신음 소리네. 정말 발정기 고양이 같다」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふみゃ、んぁ、んにゃっ……気持ちが、衣装に引っ張られちゃってるんですよぉっ……<emoji=heart04>」"
translation = "「후먀, 응아, 응냐…… 기분이, 의상에 끌려가 버리고 있어요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んみゃ、あっ、あっ<emoji=heart04>\u3000ぶぢゅぶぢゅって、おま○こからおつゆ溢れちゃって……うぅ、恥ずかしいっ、恥ずかしいのにぃっ……んぅにゃあぁぁっ<emoji=heart04>」"
translation = "「응먀, 아, 아<emoji=heart04> 철벅철벅 하고, 보지에서 즙이 넘쳐흘러서…… 우으, 부끄러워, 부끄러운데에…… 응우냐아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んみゃっ<emoji=heart04>\u3000はぁ、まだ入れたばっか、なのにっ<emoji=heart04>\u3000パンパンするの、いつもより、激しいっ<emoji=heart04>」"
translation = "「응먀<emoji=heart04> 하아, 아직 넣은 지 얼마 안 됐는데<emoji=heart04> 탁탁 치는 거, 평소보다, 격렬해<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ねっとりとした膣内のぬめりに加え、突く度にベアトリスが可愛く反応するせいで、ピストンの勢いが止まらない。"
translation = "끈적한 질내의 미끈거림에 더해, 찌를 때마다 베아트리스가 귀엽게 반응하는 바람에 피스톤질의 기세가 멈추지 않는다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぁ、はぁっ、あっ、んにゃっ<emoji=heart04>\u3000らめっ、らめれひゅっ<emoji=heart04>\u3000わらし、わらしっ、もう、イキュ、おま○こおま○こイッちゃいますぅっ<emoji=heart04>」"
translation = "「응아, 하아, 아, 응냐<emoji=heart04> 안 댸, 안 댸요<emoji=heart04> 나, 나, 벌써, 가, 보지 보지 가버려요오<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「もう？\u3000さすがに早すぎじゃない？」"
translation = "「벌써? 역시 너무 빠른 거 아니야?」"

[[dialogue]]
speaker = "unk"
original = "ベッドのシーツをギュッと掴み、迫る絶頂を堪えるベアトだったが、薄氷のような我慢はあっという間に限界を迎えた。"
translation = "침대 시트를 꽉 잡고, 다가오는 절정을 참는 베아트였지만, 살얼음 같은 참을성은 순식간에 한계에 다다랐다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「にゃふっ<emoji=heart04>\u3000ごめんニャひゃいっ、イキまひゅっ、おま○こっイクイクイクッイッッックぅうぅぅっ……<emoji=heart04><emoji=heart04>」"
translation = "「냐후<emoji=heart04> 죄송해뇨, 가요, 보지 가 가 가 가버려어어어……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぅっ、んにゃうううぅうぅぅぅっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응우, 응냐우우우우우우우<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ベアトリスの背がのけぞると、ぎゅっとペニスを握りしめるように膣肉が収縮し、絶頂を訴える。"
translation = "베아트리스의 허리가 젖혀지자, 자지를 꼭 쥐어짜듯 질 근육이 수축하며 절정을 고한다."

[[dialogue]]
speaker = "unk"
original = "とろみの強い愛液が膣奥から溢れ、膣内の温度と湿度が一層高まった。"
translation = "점성이 강한 애액이 질 깊은 곳에서 흘러나와 질 내의 온도와 습도가 한층 더 높아졌다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はっ、はぁ、はひっ、んみゃあぁっ……<emoji=heart04>\u3000イッ、イキまひたっ、イッちゃいまひたからぁ、ぅみゃあっ<emoji=heart04>」"
translation = "「하아, 하아, 하힉, 으먕아앗……<emoji=heart04> 가, 가버렸어여, 가버렸으니까아, 으먕앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「おち○ちん１回止まってっ、止まってくらひゃぁいっ<emoji=heart04>\u3000おま○こっ、おま○こイキすぎてっ<emoji=heart04>\u3000おかちくなっちゃいまふからぁ……<emoji=heart04>」"
translation = "「자지 잠깐만 멈춰줘여, 멈춰주세여어<emoji=heart04> 보지, 보지 너무 많이 가서어<emoji=heart04> 이상해져 버려요오……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "掴んでいる尻肉にはじっとりとした汗の粒が浮かび、お尻の穴もヒクヒクと震える。"
translation = "움켜쥔 엉덩이 살에는 눅눅한 땀방울이 맺히고, 항문도 실룩실룩 떨린다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「トリック・オア・トリート？」"
translation = "「트릭 오어 트리트?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、はっ……んふぇぇぇ……？」"
translation = "「하아, 하아…… 응훼에에……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「返事なし、と。お菓子くれないなら、このままイタズラするね」"
translation = "「대답 없음, 인가. 과자 안 주면 이대로 장난칠게」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えっ、えぇ……今は持ってないれすよぉ……それズルい、ズルいですってばぁっ……！」"
translation = "「에, 에에…… 지금은 안 가지고 있어요오…… 그거 치사해, 치사하다고요 정말……!」"

[[dialogue]]
speaker = "unk"
original = "ベアトも俺が寝ている（と思い込んでいた）隙に同じことをしてたというのに、自分は棚に上げる。"
translation = "베아트도 내가 자고 있는(줄 알고 있었던) 사이에 똑같은 짓을 했으면서, 자기는 모른 척한다."

[[dialogue]]
speaker = "unk"
original = "イタズラ猫ちゃんにはキツめのお仕置きが必要だな。"
translation = "장난꾸러기 고양이 양에게는 매서운 벌이 필요하겠군."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺がイクまで膣奥をゴンゴン突きまくって、ベアトのおま○こが壊れちゃうまでイタズラしてあげるね」"
translation = "「내가 싸기 전까지 질 깊은 곳을 쿵쿵 찌르고 찔러서, 베아트의 보지가 망가질 때까지 장난쳐 줄게」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、そんなのもうイタズラじゃニャいですよぅっ<emoji=heart04>\u3000んぁ、あっ、おち○ちんおっきぃ、んぅ、んみぃいぃっ！？！！？<emoji=heart04>」"
translation = "「그, 그런 건 이제 장난이 아니잖아요오<emoji=heart04> 응아, 아쏯, 자지 너무 커, 응으, 응먕아아앗!?!?!!?<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぁ、あっあぁっ<emoji=heart04>\u3000あっ、あっあっあっ、あぁあぁあぁーっ<emoji=heart04>\u3000はっ、ふみゃ、やっ、おま○こっ、ぱんぱんっ、激しっ<emoji=heart04>\u3000ふぅ、ううぅんっ<emoji=heart04>」"
translation = "「응아, 아아앗<emoji=heart04> 아, 아아아, 아아아아─앗<emoji=heart04> 하아, 후먕, 야앗, 보지, 팡팡, 격해훳<emoji=heart04> 후으, 으으응<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「またおま○こイク時は、ちゃんとイクって言おうね」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "激しく前後に腰を振り乱し、ベアトリスの膣肉を何度も擦る。"
translation = ""

