[[dialogue]]
speaker = "unk"
original = "草木も眠る丑三つ時。"
translation = "초목도 잠든 축시 삼경."

[[dialogue]]
speaker = "unk"
original = "世界の大半が寝静まった時間だが、むしろ夜に潜む吸血鬼にとっては活動のコアタイム。"
translation = "세계의 대반이 잠든 시간이지만, 오히려 밤에 숨는 흡혈귀에게는 활동의 피크 타임."

[[dialogue]]
speaker = "unk"
original = "そして、この日はハロウィンだった。"
translation = "그리고, 이날은 할로윈이었다."

[[dialogue]]
speaker = "unk"
original = "窓から差し込む月明かりは、寝室をまるで水底のような幻想的な青に染めている。"
translation = "창문으로 들어오는 월광은, 침실을 마치 물속 같은 환상적인 푸른빛으로 물들이고 있다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「吸血鬼らしく、夜中にお邪魔しま～す……ニャン♪」"
translation = "「흡혈귀답게, 한밤중에 실례합니~다……냥♪」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふふ、会長さん、ぐっすり寝てますニャ～……起こさないように、抜き足、差し足、忍び足～……」"
translation = "「후후, 회장님, 푹 자고 있냥~……깨우지 않게, 발소리를 줄이고, 사뿐사뿐~……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「朝になるまでは、まだハロウィンだからね。会長さん、トリック・オア・トリート～……」"
translation = "「아침이 되기 전까지는, 아직 할로윈이니까. 회장님, 트릭 오어 트리트~……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぐぅ……すやぁ……すぴぃ……」"
translation = "「쿨……쿨쿨……스피……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふふ、可愛い寝息。でもお返事はなし、と」"
translation = "「후후, 귀여운 숨소리. 하지만 대답은 없음, 이네」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「お菓子をくれないってことは～……イタズラしちゃっていいんだよね♪」"
translation = "「과자를 안 준다는 건~……장난쳐도 된다는 거지♪」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うわわ～、寝てる人にイタズラするなんて、私、いけないことしちゃってる～」"
translation = "「우와와~, 자는 사람한테 장난치다니, 나, 나쁜 짓을 하고 있어~」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもイタズラって……夜這いって何からすればいいんだろ……と、とりあえず、キ、キスしちゃう……！？」"
translation = "「하지만 장난이라니……야바이(밤손님)는 뭐부터 해야 하는 거지……우, 우선, 키, 키스해 버려……!?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「首筋にチューチュー吸いついちゃったりして……ひゃー、それはいくらなんでもえっちすぎるよね……！」"
translation = "「목덜미에 쪽에쪽쪽 빨아들이거나 하고……히야-, 그건 아무리 그래도 너무 야하잖아……!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「よ、よーし！\u3000寝てるとこに、チューしちゃお……いっただきま──あ、あれっ！？\u3000会長さんが消えちゃった！？\u3000どこに行ったの？」"
translation = "「좋, 좋아-! 자는 동안에, 쪽~ 해버려야……잘 먹겠습──아, 어라!? 회장님이 사라졌어!? 어디로 간 거야?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ベアト、後ろ後ろ」"
translation = "「베아토, 뒤야 뒤」"

[[dialogue]]
speaker = "unk"
original = "ベアトがイタズラ妄想で我を失っている内に、俺はベッドからこっそり抜け出し、ベアトの背後に回っていた。"
translation = "베아토가 장난 망상으로 정신을 잃고 있는 사이에, 나는 침대에서 몰래 빠져나와, 베아토의 배후로 돌아가 있었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「う、後ろ！？\u3000いつから起きてたんですっ！？」"
translation = "「뒤, 뒤!? 언제부터 깨어 있었던 거예요!?」"

[[dialogue]]
speaker = "unk"
original = "もちろん最初からだ。寝ていようが、怪しい気配を漂わせている侵入者に気づけないようじゃ会長職は務まらない。"
translation = "당연히 처음부터다. 자고 있든, 수상한 기척을 풍기는 침입자를 눈치채지 못한다면 회장직을 수행할 수 없다."

[[dialogue]]
speaker = "unk"
original = "侵入者が人畜無害なベアトだったので、むしろ何をしでかすつもりなのか、反応を見ていた。"
translation = "침입자가 해가 없는 베아토였기에, 오히려 무슨 짓을 할 작정인지, 반응을 보고 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ていっ！」"
translation = "「얍!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ぅにゃぁんっ！？」"
translation = "「으냥읏!?」"

[[dialogue]]
speaker = "unk"
original = "ベアトの背中をポンと押して、ベッドにうつ伏せに転がす。"
translation = "베아토의 등 뒤를 톡 밀어서, 침대에 엎드리게 넘어뜨린다."

[[dialogue]]
speaker = "unk"
original = "侵入の目的が俺の寝込みを襲おうとする悪い子ならば、こっちも容赦なしだ。"
translation = "침입의 목적이 내 잠자리를 습격하려는 나쁜 아이라면, 이쪽도 용서 없다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふみゃーっ？\u3000私からイタズラを仕掛けるはずだったのに、どうして逆転しちゃってるんですー！？」"
translation = "「후먀-읏? 내가 먼저 장난을 치려고 했는데, 어째서 역전되어 있는 거예요-!?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「夜這いを仕掛けてきたんだから、端からエッチするつもりだったんだろ？」"
translation = "「야바이(밤손님)를 하러 온 거니까, 처음부터 섹스할 생각이었잖아?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、それは、まぁ……そうですけどぉ……」"
translation = "「그, 그건, 뭐…… 그렇지만요오……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だから触ってないのにおま○こがびちゃびちゃなんだね」"
translation = "「그러니까 만지지 않았는데도 보지가 흠뻑 젖어 있네」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うぅぅ、自分でもわかってますから、言わないでくださいっ……」"
translation = "「우우우, 저도 알고 있으니까 말하지 말아 주세요……」"

[[dialogue]]
speaker = "unk"
original = "下着をずらして剥き出しになった女性器はヒクヒクとうごめき、開きかけている割れ目からはシーツに滴るほどの愛液が漏れ出ていた。"
translation = "속옷을 비켜서 드러난 여성기는 흠칫흠칫 꿈틀거리고, 열리기 시작하는 갈라진 틈에서는 시트에 떨어질 정도의 애액이 새어나오고 있었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ハロウィンパワーが強まってるせいなんですかね……会長さんが欲しくて、体疼いちゃってるんです……」"
translation = "「할로윈 파워가 강해진 탓인 걸까요…… 회장님이 갖고 싶어서, 몸이 쑤시고 있어요……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いや、それはベアトがエッチなだけだと思うけど」"
translation = "「아니, 그건 베아토가 야할 뿐이라고 생각하는데」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ええっ！？\u3000仮に、私がエッ、エ、エッチなんだとしても！\u3000言い方ってものがあるじゃないですか～！」"
translation = "「에에읏!? 만약, 내가 야, 야, 야한 거라고 해도! 말하는 방식이라는 게 있잖아요~!」"

[[dialogue]]
speaker = "unk"
original = "愛液でぐちょぐちょに濡らした女性器から、男を誘う桃のような甘い香りを漂わせていたら、どうオブラートに包もうともエッチと言う他なかった。"
translation = "애액으로 흠뻑 젖은 여성기에서, 남자를 유혹하는 복숭아 같은 달콤한 향기를 풍기고 있다면, 어떻게 돌려 말하든 야하다고 할 수밖에 없었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「それを言うなら、会長さんだってエ、エッチじゃないですか……おち○ちん、大きくなりすぎですよ……」"
translation = "「그렇게 따지면, 회장님이야말로 야, 야하잖아요…… 고추, 너무 커졌다고요……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うん、エッチな俺はもう我慢できないんで、このまま入れるね」"
translation = "「응, 야한 나는 이제 못 참겠으니까, 이대로 넣을게」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えっ、えっ？\u3000後ろからっ！？\u3000四つん這いなんて、恥ずかしすぎますっ……この格好、恥ずかしいところまで全部見えちゃってませんかっ……！」"
translation = "「엣, 엣? 뒤에서!? 엎드린 자세라니, 너무 부끄러워요…… 이 자세, 부끄러운 곳까지 전부 보이지 않나요……!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うんうん、かわいいお尻の穴まで丸見えだ」"
translation = "「응응, 귀여운 똥꼬까지 훤히 보인다」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふみゃーっ！？\u3000い、言わないでくださ──んぁっ<emoji=heart04>\u3000おま○こに、おち○ちん当たって……こんな格好で入れたら、エッチっていうか動物の交尾っ──」"
translation = "「후먀-!? 말, 말하지 말아 주── 응아<emoji=heart04> 보지에, 자지 닿아서…… 이런 자세로 넣으면, 야하다기보다 동물의 교미──」"

[[dialogue]]
speaker = "unk"
original = "ベアトリスのむちむちの尻肉を鷲掴みにし、膣口に添えていたペニスを一気に突き入れた。"
translation = "베아트리스의 튼실한 엉덩이살을 움켜쥐고, 질구에 대고 있던 페니스를 단숨에 찔러 넣었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぅにゃぁああぁああぁぁぁっ！？！<emoji=heart04>」"
translation = "「응우냥아아아아아아아읏!?!<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「すごい喘ぎ声だな。本当に発情期の猫みたいだ」"
translation = "「엄청난 교성이네. 정말 발정기 고양이 같다」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふみゃ、んぁ、んにゃっ……気持ちが、衣装に引っ張られちゃってるんですよぉっ……<emoji=heart04>」"
translation = "「후먀, 응아, 응냐…… 기분이, 의상에 끌려가 버리고 있어요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んみゃ、あっ、あっ<emoji=heart04>\u3000ぶぢゅぶぢゅって、おま○こからおつゆ溢れちゃって……うぅ、恥ずかしいっ、恥ずかしいのにぃっ……んぅにゃあぁぁっ<emoji=heart04>」"
translation = "「응먀, 아, 아<emoji=heart04> 철벅철벅 하고, 보지에서 즙이 넘쳐흘러서…… 우으, 부끄러워, 부끄러운데에…… 응우냐아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んみゃっ<emoji=heart04>\u3000はぁ、まだ入れたばっか、なのにっ<emoji=heart04>\u3000パンパンするの、いつもより、激しいっ<emoji=heart04>」"
translation = "「응먀<emoji=heart04> 하아, 아직 넣은 지 얼마 안 됐는데<emoji=heart04> 탁탁 치는 거, 평소보다, 격렬해<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ねっとりとした膣内のぬめりに加え、突く度にベアトリスが可愛く反応するせいで、ピストンの勢いが止まらない。"
translation = "걸쭉한 질내의 미끈거림에 더해, 찌를 때마다 베아트리스가 귀엽게 반응하는 탓에, 피스톤의 기세가 멈추지 않는다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぁ、はぁっ、あっ、んにゃっ<emoji=heart04>\u3000らめっ、らめれひゅっ<emoji=heart04>\u3000わらし、わらしっ、もう、イキュ、おま○こおま○こイッちゃいますぅっ<emoji=heart04>」"
translation = "「응아, 하아, 아, 응냐<emoji=heart04> 안 댸, 안 댸요<emoji=heart04> 나, 나, 벌써, 가, 보지 보지 가버려요오<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「もう？\u3000さすがに早すぎじゃない？」"
translation = "「벌써? 역시 너무 빠른 거 아니야?」"

[[dialogue]]
speaker = "unk"
original = "ベッドのシーツをギュッと掴み、迫る絶頂を堪えるベアトだったが、薄氷のような我慢はあっという間に限界を迎えた。"
translation = "침대 시트를 꽉 잡고, 닥쳐오는 절정을 참는 베아토였지만, 살얼음판 같은 참을성은 순식간에 한계에 다다랐다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「にゃふっ<emoji=heart04>\u3000ごめんニャひゃいっ、イキまひゅっ、おま○こっイクイクイクッイッッックぅうぅぅっ……<emoji=heart04><emoji=heart04>」"
translation = "「냐후<emoji=heart04> 죄송해뇨, 가요, 보지 가 가 가 가버려어어어……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぅっ、んにゃうううぅうぅぅぅっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응으읏, 으냐우우우우우읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ベアトリスの背がのけぞると、ぎゅっとペニスを握りしめるように膣肉が収縮し、絶頂を訴える。"
translation = "베아트리스의 뒤가 젖혀지자, 꽉 페니스를 쥐어짜듯 질육이 수축하며 절정을 고한다."

[[dialogue]]
speaker = "unk"
original = "とろみの強い愛液が膣奥から溢れ、膣内の温度と湿度が一層高まった。"
translation = "점도가 높은 애액이 질 깊은 곳에서 흘러나와, 질 내의 온도와 습도가 한층 더 높아졌다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はっ、はぁ、はひっ、んみゃあぁっ……<emoji=heart04>\u3000イッ、イキまひたっ、イッちゃいまひたからぁ、ぅみゃあっ<emoji=heart04>」"
translation = "「하아, 하아, 하히잇, 응먋앗……<emoji=heart04> 가, 갔습니다아, 가버렸으니까아, 으먋앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「おち○ちん１回止まってっ、止まってくらひゃぁいっ<emoji=heart04>\u3000おま○こっ、おま○こイキすぎてっ<emoji=heart04>\u3000おかちくなっちゃいまふからぁ……<emoji=heart04>」"
translation = "「자지 한 번만 멈춰서, 멈춰주셰요오잇<emoji=heart04> 보지이, 보지 너무 많이 가서어<emoji=heart04> 이상해져버리니까아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "掴んでいる尻肉にはじっとりとした汗の粒が浮かび、お尻の穴もヒクヒクと震える。"
translation = "잡고 있는 엉덩이 살에는 땀방울이 송골송골 맺히고, 엉덩이 구멍도 찌릿찌릿 떨린다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「トリック・オア・トリート？」"
translation = "「트릭 오어 트릿?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、はっ……んふぇぇぇ……？」"
translation = "「하아, 하아…… 응훼에에……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「返事なし、と。お菓子くれないなら、このままイタズラするね」"
translation = "「대답 없음, 인가. 과자 안 주면 이대로 장난칠게」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えっ、えぇ……今は持ってないれすよぉ……それズルい、ズルいですってばぁっ……！」"
translation = "「에, 에에…… 지금은 안 가지고 있어요오…… 그거 치사해, 치사해요 정말지이……!」"

[[dialogue]]
speaker = "unk"
original = "ベアトも俺が寝ている（と思い込んでいた）隙に同じことをしてたというのに、自分は棚に上げる。"
translation = "베아트도 내가 자고 있는(것으로 믿고 있던) 사이에 똑같은 짓을 했으면서, 자기 탓은 쏙 뺀다."

[[dialogue]]
speaker = "unk"
original = "イタズラ猫ちゃんにはキツめのお仕置きが必要だな。"
translation = "장난꾸러기 고양이 양에게는 매서운 벌이 필요하겠군."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺がイクまで膣奥をゴンゴン突きまくって、ベアトのおま○こが壊れちゃうまでイタズラしてあげるね」"
translation = "「내가 사정할 때까지 질 깊은 곳을 쿵쿵 찌르고 찔러서, 베아트의 보지가 부서질 때까지 장난쳐 줄게」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、そんなのもうイタズラじゃニャいですよぅっ<emoji=heart04>\u3000んぁ、あっ、おち○ちんおっきぃ、んぅ、んみぃいぃっ！？！！？<emoji=heart04>」"
translation = "「그, 그런 건 더 이상 장난이 아니잖아요옷<emoji=heart04> 응아, 아읏, 자지 커어, 응으, 응미이이잇!?!!?<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぁ、あっあぁっ<emoji=heart04>\u3000あっ、あっあっあっ、あぁあぁあぁーっ<emoji=heart04>\u3000はっ、ふみゃ、やっ、おま○こっ、ぱんぱんっ、激しっ<emoji=heart04>\u3000ふぅ、ううぅんっ<emoji=heart04>」"
translation = "「응아, 아아앗<emoji=heart04> 아, 아아아, 아아아아아ー읏<emoji=heart04> 하아, 후먋, 야앗, 보지이, 팡팡, 격해랫<emoji=heart04> 후으, 우우응읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「またおま○こイク時は、ちゃんとイクって言おうね」"
translation = "「다시 보지로 갈 때는 제대로 간다고 말해야지」"

[[dialogue]]
speaker = "unk"
original = "激しく前後に腰を振り乱し、ベアトリスの膣肉を何度も擦る。"
translation = "격렬하게 앞뒤로 허리를 흔들며, 베아트리스의 질 벽을 몇 번이고 문지른다."

[[dialogue]]
speaker = "unk"
original = "その勢いでベアトリスの巨乳がぶるんぶるんと揺れているのが、背後からでもわかった。"
translation = "그 기세로 베아트리스의 거유가 출렁출렁 흔들리고 있는 것이 뒤에서도 보였다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぃ、んみゃ、ひゃうぅっ<emoji=heart04>\u3000おっぱいっ<emoji=heart04>\u3000先っぽっ<emoji=heart04>\u3000シーツに擦れるの、きもぢいっ<emoji=heart04>\u3000にゃ、んにゃ、乳首ぃ、乳首もきもぢいいニャンっ<emoji=heart04>」"
translation = "「응읏, 응먐, 히야웃<emoji=heart04> 가슴이잇<emoji=heart04> 끝부분이잇<emoji=heart04> 시트에 문질러지는 거, 기모찌이<emoji=heart04> 냥, 응냥, 젖꼭지이, 젖꼭지도 기모찌이한 냥<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "お尻を掴みながら、親指で肛門のすぼまりのシワを優しくなぞる。"
translation = "엉덩이를 잡으면서, 엄지손가락으로 항문 오므라진 주름을 부드럽게 쓸어내린다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んひゃ、んんっ<emoji=heart04>\u3000そこ、お尻、お尻は汚いれすからっ<emoji=heart04>\u3000なでなでしちゃ、らめれすっ<emoji=heart04>\u3000くしゅぐったいれすよぅっ<emoji=heart04>」"
translation = "「응히야, 응응읏<emoji=heart04> 거기, 엉덩이, 엉덩이는 더럽단 말이에여<emoji=heart04> 쓰다듬으면, 안 돼여어<emoji=heart04> 간지럽단 말이에여어<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「お尻弄ったら、もっとおま○こ締まったよ。気持ちいいんじゃないの？」"
translation = "「엉덩이 건드렸더니 보지가 더 조여졌어. 기분 좋은 거 아니야?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、そんなことニャいっ<emoji=heart04>\u3000んぅうぅぅっ<emoji=heart04>\u3000今日の会長さん、いつもよりイジワルぅっ<emoji=heart04>\u3000はっ、はひっ、んみゃ、みゃおぅん<emoji=heart04>」"
translation = "「그, 그런 거 아니냥<emoji=heart04> 응으으으읏<emoji=heart04> 오늘 회장님, 평소보다 짓궃어어<emoji=heart04> 하, 하히, 응먐, 먀옹<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ハロウィンだからね。可愛い子にはいっぱいイタズラしないと」"
translation = "「할로윈이니까 말이지. 귀여운 아이한테는 장난을 많이 쳐야지.」"

[[dialogue]]
speaker = "unk"
original = "膣奥深くまでペニスを打ち込み、下腹部でお尻をべちんべちんと叩く度、ベアトのむちむちの尻肉が波打つ。"
translation = "질 깊은 곳까지 페니스를 처박고, 하복부로 엉덩이를 철썩철썩 칠 때마다 베아트의 찰진 엉덩이 살이 물결친다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、んぃっ<emoji=heart04>\u3000からだっ、ぜんぶっ、ぜんぶきもちいっ<emoji=heart04>\u3000はっ、はふっ、頭、おかひく、なっちゃいまふっ<emoji=heart04>\u3000ふぁ、ふぅーっ、ふぅ、ふみゃぁおっ<emoji=heart04>」"
translation = "「하아, 응잇<emoji=heart04> 몸, 전부, 전부 기분 좋아아<emoji=heart04> 하, 하후, 머리, 이상해져, 버려요오<emoji=heart04> 후아, 후우, 후, 후먀아옷<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、はっ、はひっ<emoji=heart04>\u3000お腹の中、おち○ちん突かれてっ、のーみそまで、衝撃っ、伝わってきへっ……<emoji=heart04>」"
translation = "「하아, 하, 하히<emoji=heart04> 배 속, 자지 찔려서어, 뇌까지, 충격, 전달돼서어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、はっ、またっ、またイク、イック、イッちゃいそっ、ごめんなひゃい、イキまひゅ<emoji=heart04>\u3000メス猫、イッちゃいまひゅぅっ<emoji=heart04>」"
translation = "「하아, 하, 또, 또 가, 가앗, 가버릴 것 같, 죄송해요오, 가버려요오<emoji=heart04> 암컷 고양이, 가버려요오<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「にゃっ、ひっ、イク、イクイックぅうぅぅっ……<emoji=heart04>\u3000んみゃっ、んみゃあぁぁぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「냥, 히, 가, 가앗 가아아앗……<emoji=heart04> 응먁, 응먐아아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はひっ、はっ、はぁんっ<emoji=heart04>\u3000ふっ、うぅうぅんっ<emoji=heart04>\u3000またっ、またおま○こイキまちたっ<emoji=heart04>\u3000んみゃ、はっ、はふぅん<emoji=heart04>」"
translation = "「하히, 하, 하앙<emoji=heart04> 후, 우으으응<emoji=heart04> 또, 또 보지 가버렸어여<emoji=heart04> 응먐, 하, 하후웅<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ベアトはまたもビクビクと痙攣を繰り返し、再び絶頂を迎え入れる。"
translation = "베아트는 또다시 파르르 경련을 되풀이하며, 다시 절정을 맞이한다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、おかしい、おかしいれすっ<emoji=heart04>\u3000からだっ、エッチなままで、おち○ちん、ずっとずっともっともっと欲しいんれすっ<emoji=heart04>」"
translation = "「하아, 이상해, 이상해여<emoji=heart04> 몸, 야한 채로, 자지, 계속 계속 더 더 갖고 싶어여<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "どうやら発情期スイッチが完全にＯＮになってしまったらしい。"
translation = "아무래도 발정기 스위치가 완전히 ON이 되어 버린 모양이다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、はっ、んにゃっ<emoji=heart04>\u3000おま○こっ、おっぱいっ、クリっ、おちりっ<emoji=heart04>\u3000ぜんぶっ、ぜーんぶっきもちいいれすニャッ<emoji=heart04>」"
translation = "「하아, 하앗, 냐아앗<emoji=heart04> 보지잇, 가슴잇, 클리잇, 엉덩이잇<emoji=heart04> 전부읏, 전~부 기분 좋아여 냥<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イキ癖がついたベアトは全身が性感帯。どこに触れても可愛くていやらしい反応を示す。"
translation = "절정에 버릇이 들린 베아토는 전신이 성감대. 어디를 터치해도 귀엽고 야한 반응을 보인다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んっ<emoji=heart04>\u3000んぁ、にゃ、あっ、にゃんっ<emoji=heart04>\u3000はっ、はぁっ……勝手に、声、出ちゃう……えっちな、おねだり声っ……んにゃはぁ……<emoji=heart04>」"
translation = "「응읏<emoji=heart04> 응아, 냐, 아, 냥읏<emoji=heart04> 하아, 하아…… 제멋대로, 목소리, 나와버려…… 야한, 조르는 목소리잇…… 냐하아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ベアトリスは自分からお尻を押し付けて、腰振りおねだりでペニスをせがむ。"
translation = "베아트리스는 스스로 엉덩이를 밀어붙이고, 허리를 흔들며 조르는 것으로 페니스를 애원한다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、はーっ<emoji=heart04>\u3000生エッチ気持ちいいですっ<emoji=heart04>\u3000これは交尾っ、猫ちゃんの交尾ですからぁっ<emoji=heart04>」"
translation = "「하아, 하아─읏<emoji=heart04> 생에치 기분 좋아요읏<emoji=heart04> 이건 교미읏, 고양이의 교미이니까요오읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ひふっ、はっ、はひぃ、んにゃぁぅ<emoji=heart04>\u3000動物みたいな交尾ぃ……<emoji=heart04>\u3000おっきいおち○ちん、深ぁく刺さってるぅ……深ぁいところに、ごりごり当たるぅ……<emoji=heart04>」"
translation = "「히후읏, 하앗, 하히이, 냐아우<emoji=heart04> 동물 같은 교미이……<emoji=heart04> 커다란 자지, 깊~숙이 찔러들어와아…… 깊~은 곳에, 고리고리 닿아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「膣奥ぅっ、おち○ちんの先っぽで、ぐりぐりされて、んにゃあぁぁっ<emoji=heart04>」"
translation = "「질 깊은 곳에읏, 자지 끝으로, 구리구리 당해서, 냐아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「会長さんにエッチな声っ、聞かれちゃうの、んんっ<emoji=heart04>\u3000恥ずかしぃ、恥ずかしいのにっ、勝手に出てきちゃいますっ<emoji=heart04>\u3000こーふん、しちゃいますっ<emoji=heart04>」"
translation = "「회장님한테 야한 목소리읏, 들려버리는 거, 응응읏<emoji=heart04> 부끄러워어, 부끄러운데도읏, 제멋대로 나와버려요읏<emoji=heart04> 흥분, 해버려요읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぅきゅぅうぅんっ<emoji=heart04>\u3000はぁ、ぅん、ぅにゃあぅっ、会長さんのおち○ちん、私のおま○ことぴったり」"
translation = "「응우큐우우웅읏<emoji=heart04> 하아, 응, 우냐아우읏, 회장님의 자지, 내 보지랑 딱 맞아」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぅっ<emoji=heart04>\u3000んにゃ、にゃぁあぁっ<emoji=heart04>\u3000はぁ、はひっ、おち○ちん、ずんずん、きもちいいニャ<emoji=heart04>」"
translation = "「응우읏<emoji=heart04> 냐, 냐아아앗<emoji=heart04> 하아, 하히읏, 자지, 쿵쾅쿵쾅, 기분 좋아 냥<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んひっ、いいにゃっ<emoji=heart04>\u3000おち○ちん、もっとごしごし、ずぶずぶしてっ<emoji=heart04>\u3000もっと、もっと……いっぱい、おま○こしてくらひゃぁいっ<emoji=heart04>」"
translation = "「응히읏, 좋아 냥<emoji=heart04> 자지, 더 쓱싹쓱싹, 푹푹 해줘어<emoji=heart04> 더, 더…… 듬뿍, 보지 해주세혀어읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はっ、おち○ちんでいっぱい、おち○ちんのことしかっ、きもちいいことしか考えらんニャいよぉっ<emoji=heart04>」"
translation = "「하앗, 자지로 가득, 자지 생각밖엔읏, 기분 좋은 생각밖에 안 된다냥어어읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "気持ちよすぎるベアトの膣内でよく耐えていたけれど、それももう限界だ。"
translation = "기분 너무 좋은 베아토의 질내에서 잘 참아왔지만, 그것도 이제 한계다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁっ、んにゃうっ<emoji=heart04>\u3000あっ、おち○ちん出そうですよねっ？\u3000おち○ちんムクムクドクドクしてまふっ<emoji=heart04>\u3000精液、出ちゃうんですねっ<emoji=heart04><emoji=heart04>」"
translation = "「하앗, 냐우읏<emoji=heart04> 아, 자지 나올 것 같죠오？ 자지 꿀렁꿀렁 꿈틀꿈틀하고 이써여<emoji=heart04> 정액, 나와버리는 거네요읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あ、ああっ……出すぞ、ベアトの中にっ……！」"
translation = "「아, 아앗…… 싼다, 베아토의 안에……!」"

[[dialogue]]
speaker = "unk"
original = "陰嚢がキュッと持ち上がるような感覚を覚え、ぐつぐつと煮えたぎった射精がこみ上げてくる。"
translation = "음낭이 큐 하고 들어올려지는 듯한 감각을 느끼며, 부글부글 끓어오르는 사정이 밀려온다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「いいれすよっ<emoji=heart04>\u3000発情期の猫ちゃんおま○こにっ、精子っ、精子っ<emoji=heart04>\u3000たっぷり出してっ<emoji=heart04>\u3000種付けっ、孕ませてっ、私をママにしてくださいニャンっ<emoji=heart04>」"
translation = "「좋아여읏<emoji=heart04> 발정기 고양이 양 보지에읏, 정자읏, 정자읏<emoji=heart04> 듬뿍 내줘어<emoji=heart04> 씨뿌리기읏, 임신시켜줘어, 나를 엄마로 만들어주세요 냥읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「おち○ちん、いいっ<emoji=heart04>\u3000しゅき、しゅきっ、だぁいしゅきっ<emoji=heart04>\u3000このまま、おち○ちんイッてくだひゃいッ<emoji=heart04>\u3000ぜったいぜーったい、抜いちゃダメですニャっ<emoji=heart04>」"
translation = "「자지, 좋아읏<emoji=heart04> 죠아, 죠아읏, 차암 죠아읏<emoji=heart04> 이대로, 자지 가버리셰요오읏<emoji=heart04> 절대로 절~대로, 빼면 안 돼요 냥읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「最後までっ、おま○こにいてくだしゃいねっ<emoji=heart04>\u3000ぜんぶぜ～んぶ子宮に出してっ<emoji=heart04>\u3000外に出しちゃったら、交尾にニャらニャいですもんねっ<emoji=heart04>」"
translation = "「끝까지읏, 보지에 있어주세효오읏<emoji=heart04> 전부 전~부 자궁에 내줘어<emoji=heart04> 밖에 내버리면, 교미가 안 되잖아여읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぅっ<emoji=heart04>\u3000おち○ちんどくんどくんしてるっ<emoji=heart04>\u3000はっ、はぁ、はぁんっ<emoji=heart04>\u3000使い魔の私を、孕ませてくださいニャンっ<emoji=heart04>」"
translation = "「응우읏<emoji=heart04> 자지 꿀렁꿀렁하고 있어어<emoji=heart04> 하앗, 하아, 하앙읏<emoji=heart04> 사역마인 나를, 임신시켜주세요 냥읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぅ、んっ、みゃぉぅん<emoji=heart04>\u3000会長さんしゅきっ<emoji=heart04>\u3000しゅきしゅきしゅきっだぁいしゅきっ<emoji=heart04>」"
translation = "「하우, 응읏, 미야옹<emoji=heart04> 회장님 죠아읏<emoji=heart04> 죠아죠아죠아읏 차암 죠아읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んっ<emoji=heart04>\u3000んぅ、んぁ、あっ、あっあっあっ<emoji=heart04>\u3000おま○こ、おま○こイクっ、イキまひゅ、んみゃっ、ふみゃあぁぁぁんっ<emoji=heart04>」"
translation = "「응읏<emoji=heart04> 응우, 응아, 아, 아아아<emoji=heart04> 보지, 보지 가아, 갑니댜, 응먀읏, 후먀아아아앙읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぁっ<emoji=heart04>\u3000イクッ、イクイクイクイッッッッ～～～～～～～～……<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응아읏<emoji=heart04> 가아, 간다간다간다가가읏～～～～～～～～……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぅみゃあぁああぁぁあぁぁぁぁぁぁんっっっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응우먀아아아아아아아아아앙읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ひぎゅ、んっ、んぅぅっ<emoji=heart04>\u3000ふぁっ、あっ、イッ、イッてぅ、イッてまひゅっ<emoji=heart04>\u3000おま○こ痺れっ、んみゃっ<emoji=heart04>」"
translation = "「히규, 응읏, 응우우읏<emoji=heart04> 화앗, 아, 가, 가아, 가고 이써요읏<emoji=heart04> 보지 마비돼서, 응먀읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "膣の強烈な締め付けを感じながら、猛烈な勢いで膣内に精を吐きだす。"
translation = "질의 강렬한 조임을 느끼면서, 맹렬한 기세로 질내에 정을 토해낸다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「どぴゅどぴゅっ、おち○ちん暴れへ……っ<emoji=heart04>\u3000精子でいっぱいに、んぁぅっ<emoji=heart04>\u3000はぁ、たっぷたぷに、なってまふ……にゃぅうぅっ<emoji=heart04>」"
translation = "「철벅철벅, 자지 날뛰어어……읏<emoji=heart04> 정자로 가득, 응아우읏<emoji=heart04> 하아, 찰랑찰랑하게, 되어있어여…… 냥우우읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ベアトは子種を受け止めながら、愛液とイキ潮をシーツに散らし、今日一番の激しい絶頂へと至った。"
translation = "베아토는 씨앗을 받아들이며, 애액과 절정수를 시트에 뿌리고, 오늘 최고의 격렬한 절정에 이르렀다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぅ、おち○ちん、まだどくんどくんしてまふぅ……アッツぅいの……い～っぱい出てるぅ……おなかに、たまってますよぉ……<emoji=heart04>」"
translation = "「응우, 자지, 아직 꿀렁꿀렁하고 있어여어…… 뜨거운 거…… 듬~뿍 나오고 있어어…… 배에, 고여있어요오……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、はっ、うれしっ……<emoji=heart04>\u3000好きな人の精子受け止めて……おま○こす～っごくしあわせになっちゃいまひたぁっ……<emoji=heart04>」"
translation = "「하아, 하앗, 기뻐어……<emoji=heart04> 좋아하는 사람의 정자 받아들여서…… 보지 전~혀 행복하게 돼버렸어여어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えへへぇ……会長さんの赤ちゃんデキちゃうかニャ～……ハロウィンご懐妊～……<emoji=heart04>」"
translation = "「에헤헤에…… 회장님의 아기 생겨버릴까나 냥～…… 할로윈 임신～……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "まだ甘えるように締め付けてくる膣から、ゆっくりとペニスを引き抜く。"
translation = "아직 어리광 부리듯 조여오는 질에서, 천천히 페니스를 뽑아낸다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぁ、あっ……あ、抜けちゃうっ、おち○ちんさよならしちゃうぅ……きゃふぅんっ……<emoji=heart04>」"
translation = "「응아, 아…… 아, 빠져버려, 자지 안녕해버려어…… 꺄후웅읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "たっぷりと子種を吐き出し、役目を終えたペニスがベアトの膣穴から抜ける。"
translation = "듬뿍 씨앗을 토해내고, 임무를 마친 페니스가 베아토의 질 구멍에서 빠진 다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、はっ……しゅごい、おま○こ、精液でぐぢゅぐぢゅぅ……<emoji=heart04>\u3000ぅにゃ、あぁんっ、きもひいい……きもひいぃぃ<emoji=heart04>」"
translation = "「하아, 하앗…… 스고이, 보지, 정액으로 꿀럭꿀럭어……<emoji=heart04> 우냐, 아앙읏, 찌모찌해…… 찌모찌해어어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "開きっぱなしの膣穴からは出したばかりの精液が逆流してきて、ベッドにどろりと垂れる。"
translation = "벌어진 채인 질 구멍에서는 방금 낸 정액이 역류해 나와, 침대에 덜컥 늘어뜨려진다."

[[dialogue]]
speaker = "unk"
original = "愛する女の子の中に、自分の子種を植え付けた達成感と背徳感と高揚感が一斉に駆け巡って、背筋が震えた。"
translation = "사랑하는 여자아이의 안에, 자신의 씨앗을 심어 넣었다는 달성감과 배덕감과 고양감이 일제히 솟구쳐, 등골이 떨렸다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はぁ、はひっ、はひ、うみゃあぁ<emoji=heart04>\u3000精子どぴゅどぴゅされながら……一緒にイッちゃうの、とってもしあわせニャン……<emoji=heart04>」"
translation = "「하아, 하히읏, 하히, 우먀아<emoji=heart04> 정자 철벅철벅 당하면서…… 함께 가버리는 거, 너무 행복해 냥……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「何回もイッてたけど、大丈夫？」"
translation = "「몇 번이나 갔는데, 괜찮아？」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「大丈夫じゃないですよぉ……何回もイカせたのは会長さんじゃないですかぁ……<emoji=heart04>」"
translation = "「괜찮지 않아요오…… 몇 번이나 가게 만든 건 회장님이잖아요오……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「何されても……気持ちよくなりすぎて……おバカになっちゃって……本当に壊れちゃうかと思いました……」"
translation = "「뭘 당해도…… 기분 너무 좋아져서…… 바보가 돼버려서…… 진짜로 부서져 버릴까 생각했어요……」"

[[dialogue]]
speaker = "unk"
original = "さすがにちょっとイタズラしすぎたか、と、反省しかけたのも束の間。"
translation = "역시 조금 장난이 과했나, 하고, 반성하려던 것도 잠시."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でも、もうエッチの限界超えちゃいましたから……ここまでイッちゃったら、もうどれだけヤッても同じ、ですよねっ<emoji=heart04>」"
translation = "「하지만, 이제 섹스의 한계를 넘어버렸으니까…… 여기까지 가버렸으면, 이제 아무리 해도 똑같, 겠죠읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「え……？」"
translation = "「어……？」"

[[dialogue]]
speaker = "unk"
original = "高くあげたお尻を誘うように振り、中出しされて白濁を垂れ流す女性器を見せつけてくる。"
translation = "치솟은 엉덩이를 유혹하듯 흔들며, 안에 싸여 백탁을 흘려보내는 여성기를 보여준다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「せっかく出してくれたのに外にこぼれちゃった分……膣奥にた～っぷり補充してくださいニャン<emoji=heart04>」"
translation = "「모처럼 내줬는데 밖에 흘러나와 버린 만큼…… 질 깊은 곳에 듬~뿍 보충해 주세요 냥<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……ベアト？\u3000まだスイッチ入りっぱなしなの？」"
translation = "「……베아토？ 아직 스위치 켜진 채야？」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「甘ぁい夜が明けるまでが、吸血鬼の時間で、ハロウィンなんです<emoji=heart04>\u3000このまま朝日が昇るまで、愛し合いましょうニャ<emoji=heart04>」"
translation = "「달콤~한 밤이 밝을 때까지가, 흡혈귀의 시간이고, 할로윈이에요<emoji=heart04> 이대로 아침 해가 떠오를 때까지, 사랑을 나누자냥<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ペロッと物欲しそうに舌なめずりをするその仕草は、まさに獲物を狙う猫のそれだった。"
translation = "할짝 아쉬운 듯 혀를 입술로 핥는 그 입놀림은, 그야말로 먹이를 노리는 고양이의 그것이었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私を発情期にさせたのは会長さんなんですから……責任取って満足するまでお付き合いしてくださいニャ<emoji=heart04>」"
translation = "「나를 발정기로 만든 건 회장님이니까…… 책임지고 만족할 때까지 함께해 주세요 냥<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ハロウィンの夜は、永遠に続くと思える程に長くて深い。"
translation = "할로윈 밤은, 영원히 계속될 것처럼 길고 깊다."

[[dialogue]]
speaker = "unk"
original = "際限なく俺を求めてくるベアトに魅せられ、煽られ、促され──限界を超えるまで搾り取られたのだった。"
translation = "끝없이 나를 요구해 오는 베아토에게 매료되고, 부추겨지고, 촉구받아── 한계를 넘을 때까지 쥐어짜였던 것이다."

