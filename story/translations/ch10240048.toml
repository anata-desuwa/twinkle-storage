[[dialogue]]
speaker = "unk"
original = "とある休日。"
translation = "어느 휴일."

[[dialogue]]
speaker = "unk"
original = "その日、ヨミは俺の家に遊びに来ており、２人でのんびりとした時間を過ごしていた。"
translation = "그날, 요미는 나의 집에 놀러 와 있었고, 둘이서 느긋한 시간을 보내고 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――えっ？\u3000アニマ先輩が『分裂薬』を……！？」"
translation = "「――네? 아니마 선배가 『분열약』을……!?」"

[[dialogue]]
speaker = "unk"
original = "俺は笑い話として、アニマ先輩が新たに開発した『分裂薬』の実験に付き合った時のことをヨミに話していた。"
translation = "나는 웃갯소리로 아니마 선배가 새로 개발한 『분열약』의 실험에 협조했을 때의 일을 요미에게 이야기하고 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それで、よかったらまた試してみてくれって予備の薬を渡されたんだけど、正直どう使えばいいのか分からなくてさ」"
translation = "「그래서, 괜찮다면 다시 시험해 달라고 예비 약을 받아왔는데, 솔직히 어떻게 써야 할지 모르겠더라고」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「か、会長の体が分裂しちゃうなんて……こやや……<emoji=heart04>」"
translation = "「회, 회장님의 몸이 분열해 버린다니…… 고야야……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミは何を想像したのか、頬を赤く染めながら尻尾をふるふると揺らす。"
translation = "요미는 무엇을 상상했는지 뺨을 붉게 물들이며 꼬리를 흔들흔들 흔든다."

[[dialogue]]
speaker = "unk"
original = "と、その時だった。"
translation = "바로 그때였다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000エクスノヴァフォームが勝手に起動して……！？」"
translation = "「고얏!? 엑스노바 폼이 제멋대로 작동해서……!?」"

[[dialogue]]
speaker = "unk"
original = "さらに、破邪の鈴が眩く光り始め――"
translation = "게다가 파사의 방울이 눈부시게 빛나기 시작하고――"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「えっ！？\u3000――ふにゃあ～……」"
translation = "「어!? ――후냐아～……」"

[[dialogue]]
speaker = "unk"
original = "鈴の音色が響く。"
translation = "방울 소리가 울려 퍼진다."

[[dialogue]]
speaker = "unk"
original = "その瞬間、俺の意識は微睡みへ沈むように落ちていった――。"
translation = "그 순간, 나의 의식은 졸음에 빠져들듯 떨어져 갔다――."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長！？\u3000大丈夫ですか……！？」"
translation = "「회장님!? 괜찮으세요……!?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「…………ヨミ」"
translation = "「…………요미」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「分裂薬を使って――複数人エッチをするぞ！」"
translation = "「분열약을 사용해서―― 다인원 섹스를 하자!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「えっ……！？\u3000こやぁ～～っ！？」"
translation = "「네……!? 고야아～～읏!?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はあぁ……<emoji=heart04>\u3000こやや……<emoji=heart04>」"
translation = "「하아아……<emoji=heart04> 고야야……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「まさか……破邪の鈴が勝手に、会長に『催眠』をかけてしまうなんて……<emoji=heart04>」"
translation = "「설마…… 파사의 방울이 제멋대로 회장님에게 『최면』을 걸어버리다니……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "――ヨミが背面騎乗位の体勢になり、その左右を分裂した会長が囲む形で、なんと『４Ｐエッチ』をすることになった。"
translation = "――요미가 후면 기승위 자세가 되고, 그 양옆을 분열한 회장이 둘러싸는 형태로 무려 『4P 섹스』를 하게 되었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「お、おち○ぽ様に囲まれてしまっています……<emoji=heart04>\u3000んっ……はあぁ……<emoji=heart04>」"
translation = "「자, 자지님들에게 둘러싸여 버렸어요……<emoji=heart04> 읏…… 하아아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "あまりにも現実離れした状況に、ヨミは混乱を隠せない。"
translation = "너무나도 현실과 떨어진 상황에 요미는 혼란을 감추지 못한다."

[[dialogue]]
speaker = "unk"
original = "それなのに、どこか抗い切れない熱が、腹の奥で静かに膨らんでいた。"
translation = "그런데도 어딘가 거역할 수 없는 열기가 배 속 깊은 곳에서 조용히 부풀어 오르고 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミ、挿れる準備をするからな」"
translation = "「요미, 삽입할 준비를 할 테니까」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04>\u3000会長……あんっ……<emoji=heart04>」"
translation = "「앗<emoji=heart04> 회장님…… 앙읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "会長は既に固く、熱く勃起したペニスを、ヨミの秘部へと擦り付け始める。"
translation = "회장은 이미 단단하고 뜨겁게 발기한 페니스를 요미의 비부에 문지르기 시작한다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふあぁっ……おち○ぽ様、ゴム付けないまま擦り付けられたらぁ……んっ<emoji=heart04>\u3000はあぁっ……ふうぅ……<emoji=heart04>」"
translation = "「후아앗…… 자지님, 콘돔을 안 낀 채로 문지르면…… 읏<emoji=heart04> 하아앗…… 후우으……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でも、ヨミは生のおち○ぽ様の方が好きなんだろう？」"
translation = "「하지만 요미는 노콘 자지님을 더 좋아하잖아?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そ、それはだって……そっちの方が気持ちいいですし……<emoji=heart04>」"
translation = "「그, 그건 그야…… 그쪽이 더 기분 좋기도 하고……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それだけ？」"
translation = "「그것뿐이야?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04>\u3000んんっ……<emoji=heart04>\u3000あ、あと……匂いも――」"
translation = "「앗<emoji=heart04> 응읏……<emoji=heart04> 아, 그리고…… 냄새도――」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ゴム付けない方が、おち○ぽ様の匂いもするので……生エッチの方が好きですぅ<emoji=heart04>」"
translation = "「콘돔을 안 끼는 편이 자지님의 냄새도 나서…… 생섹스가 더 좋아요어<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「おま○こも愛液が溢れて、もうぐしょぐしょになってるぞ」"
translation = "「보지에서도 애액이 넘쳐서 벌써 흠뻑 젖어있다고」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやんっ<emoji=heart04>\u3000逞しいおち○ぽ様に囲まれて……はあぁ……<emoji=heart04>」"
translation = "「고얀읏<emoji=heart04> 늠름한 자지님들에게 둘러싸여서…… 하아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「強いオスの臭いに包まれて、おま○こ発情してきちゃってますぅ……<emoji=heart04>」"
translation = "「강한 수컷의 냄새에 싸여서 보지가 발정해 버려요어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺のペニスも、もうぬるぬるになってるから、挿れるぞ……？」"
translation = "「내 페니스도 벌써 미끈미끈해졌으니까 삽입한다……?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふあぁっ……<emoji=heart04>\u3000おち○ぽ様、膣穴に当たって……！」"
translation = "「후아앗……<emoji=heart04> 자지님, 질 구멍에 닿아서……!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「先っぽで押し広げられて……<emoji=heart04>\u3000あっ――<emoji=heart04>」"
translation = "「귀두로 넓혀져서……<emoji=heart04> 앗――<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふああぁっ<emoji=heart04><emoji=heart04>\u3000おち○ぽ様、入って来ましたぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「후아아앗<emoji=heart04><emoji=heart04> 자지님, 들어왔어요오～～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "会長はペニスを根元まで深く沈めると、ヨミの蜜に濡れた秘部を丹念にかき混ぜるように腰を揺らした。"
translation = "회장은 페니스를 뿌리 끝까지 깊숙이 정액으로 채우듯 묻고는, 요미의 애액으로 젖은 비부를 정성스럽게 휘젓듯이 허리를 흔들었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000んうぅっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000はぁんっ<emoji=heart04>\u3000ふああぁんっ<emoji=heart04>」"
translation = "「앗<emoji=heart04> 앙읏<emoji=heart04> 하아앗<emoji=heart04> 응우읏<emoji=heart04> 앗<emoji=heart04> 하앙읏<emoji=heart04> 후아아앙읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "粘膜同士が絡み合うたび、ねっとりとした水音が響き、甘い快感がヨミの身体を内側から震わせていく。"
translation = "점막끼리 마찰할 때마다 끈적한 물소리가 울려 퍼지고, 달콤한 쾌감이 요미의 몸을 안쪽에서부터 떨리게 만든다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「生おち○ぽ様、粘膜擦れ合って、おま○こ気持ちいいですぅ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んふぅっ<emoji=heart04>\u3000ふあぁっ<emoji=heart04>\u3000はああぁんっ<emoji=heart04>」"
translation = "「생자지님, 점막이 맞닿아서 보지 기분 좋아요어<emoji=heart04> 앗<emoji=heart04> 앙읏<emoji=heart04> 응후읏<emoji=heart04> 후아앗<emoji=heart04> 하아아앙읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミ、左右の手コキを忘れてるぞ」"
translation = "「요미, 양손으로 대딸해 주는 거 잊고 있잖아」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「は、はいっ<emoji=heart04>\u3000ごめんなさいぃ<emoji=heart04>\u3000今からちゃんとしますぅ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000しょっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000ふうぅ～っ<emoji=heart04>」"
translation = "「네, 네엡<emoji=heart04> 죄송해요오<emoji=heart04> 지금부터 제대로 할게요어<emoji=heart04> 읏<emoji=heart04> 읏차<emoji=heart04> 하아앗<emoji=heart04> 후우으～읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミは慌てながらも両手を動かし始める。"
translation = "요미는 당황하면서도 양손을 움직이기 시작한다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はああぁっ<emoji=heart04>\u3000おち○ぽ様から、我慢汁溢れてきてますぅ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000んふうぅ～っ……<emoji=heart04>」"
translation = "「하아아앗<emoji=heart04> 자지님한테서 쿠퍼액이 넘쳐나오고 있어요어<emoji=heart04> 읏<emoji=heart04> 하아앗<emoji=heart04> 응후우으～읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "腰を打ち込まれ続ける快感に身体を震わせながら、それぞれの手で左右のペニスを優しく扱っていく。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「とろとろでぇ<emoji=heart04>\u3000ぬるぬるしてぇ<emoji=heart04>\u3000んふぅっ<emoji=heart04>\u3000すごいですぅ～っ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000んあぁっ<emoji=heart04>\u3000ふああぁんっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「くんくんっ<emoji=heart04>\u3000おち○ぽ様から、濃いオスの匂いがしてぇ<emoji=heart04>\u3000んんぅっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000ふうぅ～っ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「おま○こ反応して、爆裂キュンキュンしちゃいますぅ～っ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000はぁんっ<emoji=heart04>\u3000んああぁんっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「興奮して、乳首がすごい勃起してるぞ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そう言って、左右に立つ会長たちがヨミの胸へと手を伸ばす。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "指先が敏感になった乳首を摘まみ、ゆっくりと弄り始めた。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ！？\u3000ち、乳首ぃ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000ふあぁっ<emoji=heart04>\u3000んああぁ～っ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "乳首を責められた瞬間、ヨミの背筋がびくりと震える。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「両方の乳首摘ままれて、シコシコ気持ちいいですぅ～っ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んふぅっ<emoji=heart04>\u3000んあぁっ<emoji=heart04>\u3000はああぁんっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "下半身の快感と繋がるように、甘い痺れがヨミの全身へと広がっていく。"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「なら、ここも一緒にしたらどうだ？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そう言って、ヨミの下にいる会長が手を伸ばし――"
translation = ""

[[dialogue]]
speaker = "unk"
original = "指で『クリトリス』を摘まむ。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000そこは――ふあぁぁぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "鋭い快感が一気に駆け抜けた。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「んあああぁ～～っ<emoji=heart04><emoji=heart04>\u3000おま○こも乳首もクリ、全部同時に弄られてすごいですぅ～～っ<emoji=heart04><emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000はああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "乳首、秘部、そしてクリトリス。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "三か所を同時に責め立てられたことで、ヨミの理性は急速に崩れていく。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「気持ちいいっ<emoji=heart04>\u3000すごく気持ちよくて、頭の中バチバチしちゃいますぅ～～っ<emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んあぁっ<emoji=heart04>\u3000はああぁっ<emoji=heart04>\u3000ふああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミがエッチに乱れているのを見たら、俺も興奮してきた……！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そう言って左右の会長が、ヨミの顔のすぐ近くへペニスを差し出す。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
