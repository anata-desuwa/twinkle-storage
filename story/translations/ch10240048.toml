[[dialogue]]
speaker = "unk"
original = "とある休日。"
translation = "어느 휴일."

[[dialogue]]
speaker = "unk"
original = "その日、ヨミは俺の家に遊びに来ており、２人でのんびりとした時間を過ごしていた。"
translation = "그날, 요미는 나의 집에 놀러 와 있었고, 둘이서 느긋한 시간을 보내고 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――えっ？\u3000アニマ先輩が『分裂薬』を……！？」"
translation = "「――네? 아니마 선배가 『분열약』을……!?」"

[[dialogue]]
speaker = "unk"
original = "俺は笑い話として、アニマ先輩が新たに開発した『分裂薬』の実験に付き合った時のことをヨミに話していた。"
translation = "나는 웃갯소리로 아니마 선배가 새로 개발한 『분열약』의 실험에 협조했을 때의 일을 요미에게 이야기하고 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それで、よかったらまた試してみてくれって予備の薬を渡されたんだけど、正直どう使えばいいのか分からなくてさ」"
translation = "「그래서, 괜찮다면 다시 시험해 달라고 예비 약을 받아왔는데, 솔직히 어떻게 써야 할지 모르겠더라고」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「か、会長の体が分裂しちゃうなんて……こやや……<emoji=heart04>」"
translation = "「회, 회장님의 몸이 분열해 버린다니…… 고야야……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミは何を想像したのか、頬を赤く染めながら尻尾をふるふると揺らす。"
translation = "요미는 무엇을 상상했는지 뺨을 붉게 물들이며 꼬리를 흔들흔들 흔든다."

[[dialogue]]
speaker = "unk"
original = "と、その時だった。"
translation = "바로 그때였다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000エクスノヴァフォームが勝手に起動して……！？」"
translation = "「고얏!? 엑스노바 폼이 제멋대로 작동해서……!?」"

[[dialogue]]
speaker = "unk"
original = "さらに、破邪の鈴が眩く光り始め――"
translation = "게다가 파사의 방울이 눈부시게 빛나기 시작하고――"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「えっ！？\u3000――ふにゃあ～……」"
translation = "「어!? ――후냐아～……」"

[[dialogue]]
speaker = "unk"
original = "鈴の音色が響く。"
translation = "방울 소리가 울려 퍼진다."

[[dialogue]]
speaker = "unk"
original = "その瞬間、俺の意識は微睡みへ沈むように落ちていった――。"
translation = "그 순간, 나의 의식은 졸음에 빠져들듯 떨어져 갔다――."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長！？\u3000大丈夫ですか……！？」"
translation = "「회장님!? 괜찮으세요……!?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「…………ヨミ」"
translation = "「…………요미」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「分裂薬を使って――複数人エッチをするぞ！」"
translation = "「분열약을 사용해서―― 다인원 섹스를 하자!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「えっ……！？\u3000こやぁ～～っ！？」"
translation = "「네……!? 고야아～～읏!?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はあぁ……<emoji=heart04>\u3000こやや……<emoji=heart04>」"
translation = "「하아아……<emoji=heart04> 고야야……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「まさか……破邪の鈴が勝手に、会長に『催眠』をかけてしまうなんて……<emoji=heart04>」"
translation = "「설마…… 파사의 방울이 제멋대로 회장님에게 『최면』을 걸어버리다니……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "――ヨミが背面騎乗位の体勢になり、その左右を分裂した会長が囲む形で、なんと『４Ｐエッチ』をすることになった。"
translation = "――요미가 후면 기승위 자세가 되고, 그 양옆을 분열한 회장이 둘러싸는 형태로 무려 『4P 섹스』를 하게 되었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「お、おち○ぽ様に囲まれてしまっています……<emoji=heart04>\u3000んっ……はあぁ……<emoji=heart04>」"
translation = "「자, 자지님들에게 둘러싸여 버렸어요……<emoji=heart04> 읏…… 하아아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "あまりにも現実離れした状況に、ヨミは混乱を隠せない。"
translation = "너무나도 현실과 떨어진 상황에 요미는 혼란을 감추지 못한다."

[[dialogue]]
speaker = "unk"
original = "それなのに、どこか抗い切れない熱が、腹の奥で静かに膨らんでいた。"
translation = "그런데도 어딘가 거역할 수 없는 열기가 배 속 깊은 곳에서 조용히 부풀어 오르고 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミ、挿れる準備をするからな」"
translation = "「요미, 삽입할 준비를 할 테니까」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04>\u3000会長……あんっ……<emoji=heart04>」"
translation = "「앗<emoji=heart04> 회장님…… 앙읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "会長は既に固く、熱く勃起したペニスを、ヨミの秘部へと擦り付け始める。"
translation = "회장은 이미 단단하고 뜨겁게 발기한 페니스를 요미의 비부에 문지르기 시작한다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふあぁっ……おち○ぽ様、ゴム付けないまま擦り付けられたらぁ……んっ<emoji=heart04>\u3000はあぁっ……ふうぅ……<emoji=heart04>」"
translation = "「후아앗…… 자지님, 콘돔을 안 낀 채로 문지르면…… 읏<emoji=heart04> 하아앗…… 후우으……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でも、ヨミは生のおち○ぽ様の方が好きなんだろう？」"
translation = "「하지만 요미는 노콘 자지님을 더 좋아하잖아?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そ、それはだって……そっちの方が気持ちいいですし……<emoji=heart04>」"
translation = "「그, 그건 그야…… 그쪽이 더 기분 좋기도 하고……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それだけ？」"
translation = "「그것뿐이야?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04>\u3000んんっ……<emoji=heart04>\u3000あ、あと……匂いも――」"
translation = "「앗<emoji=heart04> 응읏……<emoji=heart04> 아, 그리고…… 냄새도――」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ゴム付けない方が、おち○ぽ様の匂いもするので……生エッチの方が好きですぅ<emoji=heart04>」"
translation = "「콘돔을 안 끼는 편이 자지님의 냄새도 나서…… 생섹스가 더 좋아요어<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「おま○こも愛液が溢れて、もうぐしょぐしょになってるぞ」"
translation = "「보지에서도 애액이 넘쳐서 벌써 흠뻑 젖어있다고」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやんっ<emoji=heart04>\u3000逞しいおち○ぽ様に囲まれて……はあぁ……<emoji=heart04>」"
translation = "「고얀읏<emoji=heart04> 늠름한 자지님들에게 둘러싸여서…… 하아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「強いオスの臭いに包まれて、おま○こ発情してきちゃってますぅ……<emoji=heart04>」"
translation = "「강한 수컷의 냄새에 싸여서 보지가 발정해 버려요어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺のペニスも、もうぬるぬるになってるから、挿れるぞ……？」"
translation = "「내 페니스도 벌써 미끈미끈해졌으니까 삽입한다……?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふあぁっ……<emoji=heart04>\u3000おち○ぽ様、膣穴に当たって……！」"
translation = "「후아앗……<emoji=heart04> 자지님, 질 구멍에 닿아서……!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「先っぽで押し広げられて……<emoji=heart04>\u3000あっ――<emoji=heart04>」"
translation = "「귀두로 넓혀져서……<emoji=heart04> 앗――<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふああぁっ<emoji=heart04><emoji=heart04>\u3000おち○ぽ様、入って来ましたぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「후아아앗<emoji=heart04><emoji=heart04> 자지님, 들어왔어요오～～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "会長はペニスを根元まで深く沈めると、ヨミの蜜に濡れた秘部を丹念にかき混ぜるように腰を揺らした。"
translation = "회장은 페니스를 뿌리 끝까지 깊숙이 정액으로 채우듯 묻고는, 요미의 애액으로 젖은 비부를 정성스럽게 휘젓듯이 허리를 흔들었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000んうぅっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000はぁんっ<emoji=heart04>\u3000ふああぁんっ<emoji=heart04>」"
translation = "「앗<emoji=heart04> 앙읏<emoji=heart04> 하아앗<emoji=heart04> 응우읏<emoji=heart04> 앗<emoji=heart04> 하앙읏<emoji=heart04> 후아아앙읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "粘膜同士が絡み合うたび、ねっとりとした水音が響き、甘い快感がヨミの身体を内側から震わせていく。"
translation = "점막끼리 마찰할 때마다 끈적한 물소리가 울려 퍼지고, 달콤한 쾌감이 요미의 몸을 안쪽에서부터 떨리게 만든다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「生おち○ぽ様、粘膜擦れ合って、おま○こ気持ちいいですぅ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んふぅっ<emoji=heart04>\u3000ふあぁっ<emoji=heart04>\u3000はああぁんっ<emoji=heart04>」"
translation = "「생자지님, 점막이 맞닿아서 보지 기분 좋아요어<emoji=heart04> 앗<emoji=heart04> 앙읏<emoji=heart04> 응후읏<emoji=heart04> 후아앗<emoji=heart04> 하아아앙읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミ、左右の手コキを忘れてるぞ」"
translation = "「요미, 양손으로 대딸해 주는 거 잊고 있잖아」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「は、はいっ<emoji=heart04>\u3000ごめんなさいぃ<emoji=heart04>\u3000今からちゃんとしますぅ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000しょっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000ふうぅ～っ<emoji=heart04>」"
translation = "「네, 네엡<emoji=heart04> 죄송해요오<emoji=heart04> 지금부터 제대로 할게요어<emoji=heart04> 읏<emoji=heart04> 읏차<emoji=heart04> 하아앗<emoji=heart04> 후우으～읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミは慌てながらも両手を動かし始める。"
translation = "요미는 당황하면서도 양손을 움직이기 시작한다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はああぁっ<emoji=heart04>\u3000おち○ぽ様から、我慢汁溢れてきてますぅ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000んふうぅ～っ……<emoji=heart04>」"
translation = "「하아아앗<emoji=heart04> 자지님한테서 쿠퍼액이 넘쳐나오고 있어요어<emoji=heart04> 읏<emoji=heart04> 하아앗<emoji=heart04> 응후우으～읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "腰を打ち込まれ続ける快感に身体を震わせながら、それぞれの手で左右のペニスを優しく扱っていく。"
translation = "허리를 계속 처박히는 쾌감에 몸을 떨면서, 각자의 손으로 좌우의 페니스를 상냥하게 다뤄 간다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「とろとろでぇ<emoji=heart04>\u3000ぬるぬるしてぇ<emoji=heart04>\u3000んふぅっ<emoji=heart04>\u3000すごいですぅ～っ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000んあぁっ<emoji=heart04>\u3000ふああぁんっ<emoji=heart04>」"
translation = "「걸쭉해서어<emoji=heart04> 미끈거려서어<emoji=heart04> 응후읏<emoji=heart04> 엄청나요오～읏<emoji=heart04> 앗<emoji=heart04> 앙읏<emoji=heart04> 하아앗<emoji=heart04> 응아앗<emoji=heart04> 후아아앙읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「くんくんっ<emoji=heart04>\u3000おち○ぽ様から、濃いオスの匂いがしてぇ<emoji=heart04>\u3000んんぅっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000ふうぅ～っ<emoji=heart04>」"
translation = "「킁킁읏<emoji=heart04> 자지 님한테서, 짙은 수컷 냄새가 나서어<emoji=heart04> 응응읏<emoji=heart04> 하아앗<emoji=heart04> 후우으～읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「おま○こ反応して、爆裂キュンキュンしちゃいますぅ～っ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000はぁんっ<emoji=heart04>\u3000んああぁんっ<emoji=heart04>」"
translation = "「보지 반응해서, 폭렬 쿵쾅쿵쾅해버려요오～읏<emoji=heart04> 앗<emoji=heart04> 하앙읏<emoji=heart04> 응아아앙읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「興奮して、乳首がすごい勃起してるぞ」"
translation = "「흥분해서, 유두가 엄청 발기했잖아」"

[[dialogue]]
speaker = "unk"
original = "そう言って、左右に立つ会長たちがヨミの胸へと手を伸ばす。"
translation = "그렇게 말하며, 좌우에 선 회장들이 요미의 가슴으로 손을 뻗는다."

[[dialogue]]
speaker = "unk"
original = "指先が敏感になった乳首を摘まみ、ゆっくりと弄り始めた。"
translation = "손끝이 민감해진 유두를 집어, 천천히 만지작거리기 시작했다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ！？\u3000ち、乳首ぃ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000ふあぁっ<emoji=heart04>\u3000んああぁ～っ<emoji=heart04>」"
translation = "「앗!? 유, 유두으<emoji=heart04> 응읏<emoji=heart04> 하아앗<emoji=heart04> 후아앗<emoji=heart04> 응아아아～읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "乳首を責められた瞬間、ヨミの背筋がびくりと震える。"
translation = "유두를 괴롭힘당한 순간, 요미의 등줄기가 움찔하고 떨린다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「両方の乳首摘ままれて、シコシコ気持ちいいですぅ～っ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んふぅっ<emoji=heart04>\u3000んあぁっ<emoji=heart04>\u3000はああぁんっ<emoji=heart04>」"
translation = "「양쪽 유두 집혀서, 딸딸이 기분 좋아요오～읏<emoji=heart04> 앗<emoji=heart04> 앙읏<emoji=heart04> 응후읏<emoji=heart04> 응아앗<emoji=heart04> 하아아앙읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "下半身の快感と繋がるように、甘い痺れがヨミの全身へと広がっていく。"
translation = "하반신의 쾌감과 연결되듯, 달콤한 저림이 요미의 전신으로 퍼져 나간다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「なら、ここも一緒にしたらどうだ？」"
translation = "「그럼, 여기도 같이 하면 어때?」"

[[dialogue]]
speaker = "unk"
original = "そう言って、ヨミの下にいる会長が手を伸ばし――"
translation = "그렇게 말하며, 요미의 아래에 있는 회장이 손을 뻗어――"

[[dialogue]]
speaker = "unk"
original = "指で『クリトリス』を摘まむ。"
translation = "손가락으로 『클리토리스』를 집는다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000そこは――ふあぁぁぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「고약!? 거기느은――후아아아아～～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "鋭い快感が一気に駆け抜けた。"
translation = "날카로운 쾌감이 한꺼번에 스쳐 지나갔다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「んあああぁ～～っ<emoji=heart04><emoji=heart04>\u3000おま○こも乳首もクリ、全部同時に弄られてすごいですぅ～～っ<emoji=heart04><emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000はああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「응아아아～～읏<emoji=heart04><emoji=heart04> 보지도 유두도 클리, 전부 동시에 만져져서 엄청나요오～～읏<emoji=heart04><emoji=heart04> 앗<emoji=heart04> 앙읏<emoji=heart04> 하아아아～～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "乳首、秘部、そしてクリトリス。"
translation = "유두, 비부, 그리고 클리토리스."

[[dialogue]]
speaker = "unk"
original = "三か所を同時に責め立てられたことで、ヨミの理性は急速に崩れていく。"
translation = "세 곳을 동시에 몰아붙여진 탓에, 요미의 이성은 급속히 무너져 간다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「気持ちいいっ<emoji=heart04>\u3000すごく気持ちよくて、頭の中バチバチしちゃいますぅ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「기분 좋아아<emoji=heart04> 엄청 기분 좋아서, 머릿속이 바치바치해버려요오～～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んあぁっ<emoji=heart04>\u3000はああぁっ<emoji=heart04>\u3000ふああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「앗<emoji=heart04> 앙읏<emoji=heart04> 응아앗<emoji=heart04> 하아아앗<emoji=heart04> 후아아아～～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミがエッチに乱れているのを見たら、俺も興奮してきた……！」"
translation = "「요미가 야하게 흐트러지는 걸 보니, 나도 흥분해 오는데……!」"

[[dialogue]]
speaker = "unk"
original = "そう言って左右の会長が、ヨミの顔のすぐ近くへペニスを差し出す。"
translation = "그렇게 말하며 좌우의 회장이, 요미의 얼굴 바로 근처로 페니스를 내밀어진다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ……！\u3000おち○ぽ様、我慢汁がいっぱいでぇ～<emoji=heart04>\u3000こんな近くで匂いを嗅いだら、頭クラクラしちゃいますぅ～っ<emoji=heart04>」"
translation = "「앗……! 자지 님, 쿠퍼액이 가득이라서어～<emoji=heart04> 이런 가까이서 냄새를 맡으면, 머리가 어질어질해버려요오～읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「濃いオスフェロモンの匂いでぇ～<emoji=heart04>\u3000んふうぅ～っ<emoji=heart04>\u3000興奮して、感度上がっちゃいますぅ～っ<emoji=heart04>\u3000あっ、あっ、あっ、あんっ<emoji=heart04>\u3000ふああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「짙은 수컷 페로몬 냄새로오～<emoji=heart04> 응후우으～읏<emoji=heart04> 흥분해서, 감도 올라가버려요오～읏<emoji=heart04> 앗, 앗, 앗, 앙읏<emoji=heart04> 후아아앙읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ<emoji=heart04>\u3000こやあぁんっ<emoji=heart04>\u3000気持ちいいの大きく膨らんでますっ<emoji=heart04>」"
translation = "「고약<emoji=heart04> 고야아앙읏<emoji=heart04> 기분 좋은 거 커다랗게 부풀고 있어요읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「気持ちいいのキちゃいますっ<emoji=heart04>\u3000あっ、あっ、あっ、あっ、んあああぁっ<emoji=heart04><emoji=heart04>」"
translation = "「기분 좋은 거 와버려요읏<emoji=heart04> 앗, 앗, 앗, 앗, 응아아아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「イクっ<emoji=heart04>\u3000イクイクっ<emoji=heart04><emoji=heart04>」"
translation = "「간다아<emoji=heart04> 간다간다아<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「イっちゃいますぅ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「가버려요오～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ――ふあああぁぁぁ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「앗――후아아아아아～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミの全身を駆け巡る快感が限界を迎え、腰の奥で膨れ上がった熱が弾け、ヨミの体が大きく震えた。"
translation = "요미의 전신을 내달리는 쾌감이 한계에 달해, 허리 깊은 곳에서 부풀어 오른 열기가 터지며, 요미의 몸이 크게 떨렸다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「んっ<emoji=heart04>\u3000はああぁ～っ<emoji=heart04>\u3000イっちゃいましたぁ～～っ<emoji=heart04><emoji=heart04>\u3000あっ<emoji=heart04>\u3000んっ……ふうぅ～っ<emoji=heart04>」"
translation = "「응읏<emoji=heart04> 하아아아～읏<emoji=heart04> 가버렸어요오～～읏<emoji=heart04><emoji=heart04> 앗<emoji=heart04> 응읏……후우으～읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "力が抜け、荒い吐息が何度も漏れる。"
translation = "힘이 빠지고, 거친 숨소리가 몇 번이고 새어 나온다."

[[dialogue]]
speaker = "unk"
original = "快感の余韻はすぐには消えず、身体の奥でじんじんと甘く脈打ち続けていた。"
translation = "쾌감의 여운은 금방 사라지지 않고, 몸속 깊은 곳에서 찌릿찌릿 알싸하게 계속 고동치고 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「んはあぁ～っ……<emoji=heart04><emoji=heart04>\u3000イったことで完全発情子作りモードに入っちゃいましたぁ～っ……<emoji=heart04><emoji=heart04>\u3000はあぁっ、ふうぅ～っ……<emoji=heart04>」"
translation = "「응하아아~……<emoji=heart04><emoji=heart04> 가게 되어서 완전 발정 아이 만들기 모드에 들어가 버렸어요~……<emoji=heart04><emoji=heart04> 하아앗, 후우~……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「だから……会長<emoji=heart04>\u3000いえ――<b>ご主人様</b><emoji=heart04>」"
translation = "「그러니까…… 회장님<emoji=heart04> 아니――<b>주인님</b><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ご主人様の子種で――ヨミのおま○こに種付けして欲しいですぅ<emoji=heart04><emoji=heart04>」"
translation = "「주인님의 씨앗으로――요미의 보지에 교배해 주셨으면 해요<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミは潤んだ瞳を向けながら、自ら腰を小さく揺らして媚びる。"
translation = "요미는 촉촉히 젖은 눈동자를 보내며, 스스로 허리를 작게 흔들어 아양을 떤다."

[[dialogue]]
speaker = "unk"
original = "快感に蕩けた表情には、隠そうともしない欲望が滲んでいた。"
translation = "쾌감에 녹아내린 표정에는, 숨기려 하지도 않는 욕망이 번져 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「なら……本気で行くぞ！」"
translation = "「그러면…… 본기억으로 간다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ――<emoji=heart04><emoji=heart04>」"
translation = "「앗――<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやああああああぁぁぁ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「고야아아아아아아아~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "会長は腰の動きをさらに速めた。"
translation = "회장은 허리의 움직임을 한층 더 빠르게 했다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ、あっ、あっ、あんっ<emoji=heart04>\u3000ふああぁんっ<emoji=heart04><emoji=heart04>\u3000んっ、あっ、あっ、あっ<emoji=heart04>\u3000んああぁんっ<emoji=heart04><emoji=heart04>\u3000あっ、あっ、あっ、あっ<emoji=heart04>\u3000ふあああぁぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「앗, 앗, 앗, 응앗<emoji=heart04> 후아아앙<emoji=heart04><emoji=heart04> 응, 앗, 앗, 앗<emoji=heart04> 응아아앙<emoji=heart04><emoji=heart04> 앗, 앗, 앗, 앗<emoji=heart04> 후아아아아~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "激しい律動が絶え間なく続き、ヨミの身体は快感に翻弄されていく。"
translation = "격렬한 율동이 끊임없이 이어지고, 요미의 몸은 쾌감에 휘둘려 간다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「おち○ぽ様、すごいっ<emoji=heart04>\u3000気持ちいいですぅ<emoji=heart04>\u3000あっ、あっ、あっ、あんっ<emoji=heart04>\u3000はああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「자지님, 대단해<emoji=heart04> 기분 좋아요<emoji=heart04> 앗, 앗, 앗, 응앗<emoji=heart04> 하아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "１度絶頂を迎えたはずの体は、更に快感を求めるように反応し続け、そのたびに甘い吐息が漏れる。"
translation = "한 번 절정을 맞이했을 터인 몸은, 한층 더 쾌감을 요구하듯 계속 반응하고, 그때마다 달콤한 숨소리가 새어 나온다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「おま○こ気持ちいいっ<emoji=heart04>\u3000気持ち良くして頂いてありがとうございますぅっ<emoji=heart04>\u3000あっ、あっ、あっ、あっ<emoji=heart04>\u3000んああぁ～っ<emoji=heart04><emoji=heart04>」"
translation = "「보지 기분 좋아<emoji=heart04> 기분 좋게 해주셔서 감사해요<emoji=heart04> 앗, 앗, 앗, 앗<emoji=heart04> 응아아~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふああぁっ<emoji=heart04>\u3000おち○ぽ様、膨らみ始めましたぁ<emoji=heart04>\u3000あっ、あっ、あっ、あんっ<emoji=heart04>\u3000はああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「후아앗<emoji=heart04> 자지님, 부풀어 오르기 시작했어요<emoji=heart04> 앗, 앗, 앗, 응앗<emoji=heart04> 하아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「左右のおち○ぽ様も膨らんで、我慢汁の量も増えてきてますぅっ<emoji=heart04><emoji=heart04>」"
translation = "「양쪽의 자지님도 부풀어서, 쿠퍼액의 양도 늘어나고 있어요<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そう言いながら、ヨミは左右の手をさらに速く動かす。"
translation = "그렇게 말하면서, 요미는 양손을 더욱 빠르게 움직인다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「お射精っ<emoji=heart04>\u3000お射精するなら、顔に精液いっぱいかけて欲しいですぅ～っ<emoji=heart04><emoji=heart04>」"
translation = "「사정<emoji=heart04> 사정한다면, 얼굴에 정액 듬뿍 뿌려주셨으면 해요~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "快感に乱されながらも、必死に奉仕を続ける姿には、どこか夢中になっているような熱があった。"
translation = "쾌감에 흐트러지면서도, 흐트러짐 없이 봉사를 계속하는 모습에는, 어딘가 열중해 있는 듯한 열기가 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「大好きなご主人様の精液の匂いで、ヨミの全身を包み込んで欲しいですぅっ<emoji=heart04><emoji=heart04>\u3000あっ、あっ、あっ、あっ<emoji=heart04>\u3000ふあああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「가장 좋아하는 주인님의 정액 냄새로, 요미의 전신을 감싸 안아주셨으면 해요<emoji=heart04><emoji=heart04> 앗, 앗, 앗, 앗<emoji=heart04> 후아아아~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「わかった――中だけじゃなく、外にも沢山射精してやるからなっ！」"
translation = "「알았다――안쪽뿐만 아니라, 밖에도 잔뜩 사정해 줄 테니까!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はいぃっ<emoji=heart04>\u3000ありがとうございますぅっ<emoji=heart04>」"
translation = "「네에잇<emoji=heart04> 감사해요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "会長は腰の動きを、さらに加速させていく。"
translation = "회장은 허리의 움직임을, 더욱 가속시켜 간다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ！？\u3000――んあああぁ～～っ<emoji=heart04><emoji=heart04>\u3000激しいおち○ぽ様、きましたぁ～～っ<emoji=heart04><emoji=heart04>\u3000あっ、あっ、あっ、あっ、ふああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「앗!? ――응아아아~~앗<emoji=heart04><emoji=heart04> 격렬한 자지님, 왔어요~~앗<emoji=heart04><emoji=heart04> 앗, 앗, 앗, 앗, 후아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「激しくじゅぽじゅぽ、おま○こかき回されてぇ<emoji=heart04>\u3000あっ、あっ、あっ、あっ、はあああぁっ<emoji=heart04><emoji=heart04>」"
translation = "「격렬하게 뷰퓻뷰퓻, 보지 휘저어지고 싶어<emoji=heart04> 앗, 앗, 앗, 앗, 하아아아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "勢いを増した刺激は、容赦なくヨミの感覚を揺さぶり続ける。"
translation = "기세를 더한 자극은, 사정없이 요미의 감각을 흔들어댄다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「気持ちいいっ<emoji=heart04><emoji=heart04>\u3000すごく気持ちいいですぅ～～っ<emoji=heart04><emoji=heart04>\u3000あっ、あっ、あっ、あっ、んああぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「기분 좋아<emoji=heart04><emoji=heart04> 엄청 기분 좋아요~~앗<emoji=heart04><emoji=heart04> 앗, 앗, 앗, 앗, 응아아앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "会長は再び、ヨミの両方の乳首とクリへ手を伸ばす。"
translation = "회장은 다시, 요미의 양쪽 유두와 클리토리스로 손을 뻗는다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000――んあああぁ～～っ<emoji=heart04><emoji=heart04>\u3000乳首とクリ、また同時にぃ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「고앗!? ――응아아아~~앗<emoji=heart04><emoji=heart04> 유두랑 클리, 또 동시에~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「しゅごいっ<emoji=heart04>\u3000全部気持ちよしゅぎて、飛んじゃいますぅ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「대단해<emoji=heart04> 전부 너무 기분 좋아서, 날아가 버려요~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ、あっ、あっ、あっ、ふああぁんっ<emoji=heart04><emoji=heart04>\u3000んっ、あっ、あっ、あっ、んあああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「앗, 앗, 앗, 앗, 후아앙<emoji=heart04><emoji=heart04> 응, 앗, 앗, 앗, 응아아아~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "重なり合う刺激によって、ヨミの身体は大きく震える。"
translation = "포개어지는 자극에 의해, 요미의 몸은 크게 떨린다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はああああぁっ<emoji=heart04><emoji=heart04>\u3000またきましゅっ<emoji=heart04>\u3000さっきよりも、もっと気持ちいいのが膨らんできてましゅうぅ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「하아아아앗<emoji=heart04><emoji=heart04> 또 와요<emoji=heart04> 아까보다, 훨씬 더 기분 좋은 게 부풀어 오르고 있어요~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "快感の波は次々と押し寄せ、逃げ場を失った感覚をさらに高みへと押し上げていく。"
translation = "쾌감의 파도는 밀려들고, 도망칠 곳을 잃은 감각을 더욱 드높은 곳으로 올려 보내는데."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「もっ、もうだめぇっ<emoji=heart04>\u3000頭の中真っ白になっちゃいますぅ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「이제, 이제 안 돼<emoji=heart04> 머릿속이 하얗게 되어버려요~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くっ……俺もそろそろイキそうだっ……！」"
translation = "「큭…… 나도 슬슬 싸버릴 것 같다……!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04><emoji=heart04>\u3000きたっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000すごく大きいのきましたっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あっ、あっ、あっ、あっ、ふあああぁぁぁ～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「앗<emoji=heart04><emoji=heart04> 왔다<emoji=heart04><emoji=heart04><emoji=heart04> 엄청나게 커다란 게 왔어요<emoji=heart04><emoji=heart04><emoji=heart04> 앗, 앗, 앗, 앗, 후아아아아아~~앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「んああああああっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000イクっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000イクイクっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000イっちゃいますぅ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응아아아아아앗<emoji=heart04><emoji=heart04><emoji=heart04> 가요<emoji=heart04><emoji=heart04><emoji=heart04> 가요가요<emoji=heart04><emoji=heart04><emoji=heart04> 가버려요~~~앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミ、もう出るっ！！\u3000中に出すぞっ！！！」"
translation = "「요미, 이제 나온다!! 안에 싸버린다!!!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「おち○ぽ様、来てきてっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000ご主人様の精液を、お恵み下さああぁ～～～いっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「자지님, 와줘와줘<emoji=heart04><emoji=heart04><emoji=heart04> 주인님의 정액을, 베풀어 주세요~~앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっあっあっあっ、イクっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000イクイクイクイクっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「앗앗앗앗, 가요<emoji=heart04><emoji=heart04><emoji=heart04> 가요가요가요가요<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふあああああああああっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000イっ――――<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「후아아아아아아아앗<emoji=heart04><emoji=heart04><emoji=heart04> 가――――<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「イックうううぅぅぅ～～～～～～～～～んっ<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>\u3000んああああああぁぁぁ～～～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「가아아아아아~~~~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04> 응아아아아아아아~~~~~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミは絶頂を迎え、全身を大きく反らせながら震わせた。"
translation = "요미는 절정을 맞이하여, 전신을 크게 뒤로 젖히며 떨었다."

[[dialogue]]
speaker = "unk"
original = "その瞬間、それぞれのペニスから大量の精液が勢いよく噴き出した。"
translation = "그 순간, 각각의 음경에서 대량의 정액이 기세 좋게 뿜어져 나왔다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000ふあああぁぁぁ～～っ<emoji=heart04><emoji=heart04>\u3000おち○ぽ様から精液、いっぱい噴き出してますぅ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「앗<emoji=heart04><emoji=heart04><emoji=heart04> 후아아아아~~앗<emoji=heart04><emoji=heart04> 자지님한테서 정액, 잔뜩 뿜어져 나오고 있어요~~~앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやああぁんっ<emoji=heart04><emoji=heart04>\u3000すごいっ<emoji=heart04>\u3000止まりませんっ<emoji=heart04>\u3000いっぱいですぅ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「고야아앙<emoji=heart04><emoji=heart04> 대단해<emoji=heart04> 멈추지 않아요<emoji=heart04> 잔뜩이에요~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「んっ――はああぁ～っ<emoji=heart04><emoji=heart04>\u3000体の内側も外側も、ご主人様の熱いのかけられてますぅ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「응――하아아~앗<emoji=heart04><emoji=heart04> 몸 안쪽도 안쪽도, 주인님의 뜨거운 게 덮어씌워지고 있어요~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "やがて、射精の勢いも少しずつ収まり、激しかった時間は余韻へと変わっていって――"
translation = "이윽고, 사정의 기세도 조금씩 가라앉고, 격렬했던 시간은 여운으로 바뀌어 가며――"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はあぁっ……んっ……ふうぅ……<emoji=heart04>」"
translation = "「하아앗…… 응…… 후우……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "射精が止まった後、ヨミは熱っぽい吐息を漏らしながら、うっとりとした表情を浮かべていた。"
translation = "사정이 멈춘 후, 요미는 열기 어린 숨소리를 내쉬며, 황홀한 표정을 짓고 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「精液お恵み、ありがとうございますぅ……<emoji=heart04>\u3000体中ご主人様の匂いに包まれて、幸せですぅ……<emoji=heart04>」"
translation = "「정액을 베풀어 주셔서, 감사해요……<emoji=heart04> 온몸이 주인님 냄새로 감싸여서, 행복해요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ふああぁ……<emoji=heart04>\u3000ご主人様との４Ｐエッチ、すごかったです……<emoji=heart04>\u3000気持ち良くて……頭の中、とろとろになっちゃいましたぁ……<emoji=heart04>」"
translation = "「후아아……<emoji=heart04> 주인님과의 4P 섹스, 대단했어요……<emoji=heart04> 기분 좋아서…… 머릿속이, 걸쭉하게 녹아버렸어요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "――と、その時。"
translation = "――라고, 그때."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ん……あれ……？\u3000俺……どうして分裂して……」"
translation = "「응…… 어라……? 나…… 어째서 분열해서……」"

[[dialogue]]
speaker = "unk"
original = "『俺』の意識は、夢から目覚めるようにはっきりと起き上がってきた。"
translation = "『나』의 의식은, 꿈에서 깨어나듯 확실히 일어났다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ……会長、お目覚めになりましたか……？」"
translation = "「앗…… 회장님, 깨어나셨나요……?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「その……破邪の鈴が、私がエッチなことを考えていたのを、勝手に叶えてしまったというか……」"
translation = "「그게…… 파사의 방울이, 제가 야한 생각을 하고 있던 것을, 마음대로 이뤄버렸다고나 할까……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そうか……それで俺、分裂してヨミを囲んで……」"
translation = "「그런가…… 그래서 나, 분열해서 요미를 둘러싸고……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ごめんなさい……会長にご迷惑をおかけして……」"
translation = "「죄송해요…… 회장님께 폐를 끼쳐서……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いや、そういうことなら――」"
translation = "「아니, 그런 거라면――」"

[[dialogue]]
speaker = "unk"
original = "エッチしていた時の記憶が戻った俺は、ヨミの秘部に手を伸ばして、指で触れた。"
translation = "섹스하고 있었을 때의 기억이 돌아온 나는, 요미의 은밀한 부위에 손을 뻗어, 손가락으로 만졌다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ<emoji=heart04>\u3000か、会長……！？」"
translation = "「고앗<emoji=heart04> 회, 회장님……!?」"

[[dialogue]]
speaker = "unk"
original = "秘部を愛撫しながら、俺は彼女の耳元で囁く。"
translation = "은밀한 부위를 애무하면서, 나는 그녀의 귓가에 속삭인다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミ……ご主人様を自分の欲望に付き合わせておいて、１人で満足してちゃダメだろう？」"
translation = "「요미…… 주인님을 자신의 욕망에 어울리게 해놓고, 혼자서 만족하면 안 되잖아?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だって――俺は今、３人に分裂してるんだぞ？」"
translation = "「그야――나는 지금, 3명으로 분열되어 있다고?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……！」"
translation = "「……!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「は、はい……ごめんなさい<emoji=heart04>」"
translation = "「네, 네…… 죄송해요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミは頬を赤く染めながら、言う。"
translation = "요미는 뺨을 붉게 물들이며, 말한다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「どうか、３人分のおち○ぽ様が満足するまで、ヨミのメイドおま○こをお使い下さい<emoji=heart04>」"
translation = "「부디, 3명분의 자지님이 만족할 때까지, 요미의 메이드 보지를 사용해 주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――あっ<emoji=heart04>\u3000ご主人様ぁ……<emoji=heart04>」"
translation = "「――앗<emoji=heart04> 주인님……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやぁん……<emoji=heart04>」"
translation = "「고야앙……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "その後も分裂した俺は、何度も３人の位置を入れ替えながら、ヨミを白濁色に染め続けてしまうのだった。"
translation = "그 후로도 분열된 나는, 몇 번이고 3명의 위치를 바꾸어가며, 요미를 탁한 백색으로 계속 물들여 가는 것이었다."

