[[dialogue]]
speaker = "unk"
original = "九浄家メイド隊の新人メイドだと紹介された獣人魔族の少女『<ruby>狛里<rt>こまり</rt></ruby>』。"
translation = "쿠죠가 메이드대의 신입 메이드라고 소개받은 수인 마족 소녀 『<ruby>코마리<rt>코마리</rt></ruby>』."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔界の辺境から来た、まだまだ新人さんなのです。どうぞよろしくお願いするであります♪」"
translation = "「마계의 변방에서 온, 아직 한참 신입인 것이외다. 아무쪼록 잘 부탁드리는 것이외다♪」"

[[dialogue]]
speaker = "unk"
original = "張り切った様子で犬耳と尻尾を揺らす彼女と、俺は握手を交わす。"
translation = "의욕이 넘치는 모습으로 강아지 귀와 꼬리를 흔드는 그녀와, 나는 악수를 나눈다."

[[dialogue]]
speaker = "unk"
original = "『狛里』って呼んでもいいかな？"
translation = "'코마리'라고 불러도 될까?"

[[dialogue]]
speaker = "unk"
original = "こちらこそよろしく"
translation = "나야말로 잘 부탁해"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「もちろんであります！\u3000魔王様♪」"
translation = "「당연한 것이외다! 마왕님♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「え？\u3000――様付けはしなくてもいい、でありますか？」"
translation = "「에? ──님 자는 안 붙여도 된다, 는 것이외까?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「だめなのです！\u3000狛里は後輩で、メイドなのです！\u3000だから敬意を込めて、魔王様って呼びたいのであります♪」"
translation = "「안 되는 것이외다! 코마리는 후배이고, 메이드인 것이외다! 그러니까 경의를 담아, 마왕님이라고 부르고 싶은 것이외다♪」"

[[dialogue]]
speaker = "unk"
original = "どうやら元気なだけではなく、真面目な性格でもあるらしい。"
translation = "아무래도 활발할 뿐만 아니라, 진지한 성격이기도 한 모양이다."

[[dialogue]]
speaker = "unk"
original = "そんなことを思った次の瞬間――"
translation = "그런 생각을 한 다음 순간──"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様、ちょっと失礼するのであります！」"
translation = "「마왕님, 잠시 실례하는 것이외다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「――くんくん、くんくんくん♪」"
translation = "「──킁킁, 킁킁킁♪」"

[[dialogue]]
speaker = "unk"
original = "狛里は自然な動作で近づいてくると、俺の首筋へ顔を寄せて、<b>匂いを嗅いだ</b>。"
translation = "코마리는 자연스러운 동작으로 다가오더니, 내 목덜미로 얼굴을 가져가, <b>냄새를 맡았다</b>."

[[dialogue]]
speaker = "unk"
original = "！？\u3000な、何！？"
translation = "!? 므, 뭐야!?"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわ～ふっ<emoji=heart04>\u3000やっぱりなのです！\u3000魔王様の匂い、狛里、すっごく好きですぅ♪」"
translation = "「바우와~후<emoji=heart04> 역시인 것이외다! 마왕님의 냄새, 코마리, 엄청 좋아하는 것이외다♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000匂いが好きって……！」"
translation = "「코얏!? 냄새가 좋다니……!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへっ♪\u3000実は狛里、『匂いを嗅ぐ』のが大好きなのです♪」"
translation = "「에헤헤♪ 사실 코마리, 『냄새 맡기』를 엄청 좋아하는 것이외다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ♪\u3000魔王様は、安心できるみたいな、すっごくいい匂いがするのであります♪」"
translation = "「바우와후♪ 마왕님은 안심이 되는 듯한, 엄청 좋은 냄새가 나는 것이외다♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里さん、そ、それって……」"
translation = "「코마리 씨, 그, 그거……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふふっ。実は狛里は――『オープン匂いフェチ』なのだ」"
translation = "「후후. 사실 코마리는── 『오픈 냄새 페티시』라네」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「えぇ～～っ！？」"
translation = "「에에~~~!?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（ま、まさかの同じフェチ仲間！？\u3000だけど、オープンって……！）"
translation = "(설, 설마했던 같은 취향 동인!? 하지만, 오픈이라니……!)"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「くんくん♪\u3000くんくん♪」"
translation = "「킁킁♪ 킁킁킁♪」"

[[dialogue]]
speaker = "unk"
original = "狛里は嬉しそうに尻尾をパタパタさせながら、俺の周囲を回る。そしてあちこちに顔を近づけては、遠慮なく匂いを嗅いでくる。"
translation = "코마리는 기쁜 듯이 꼬리를 살랑살랑 흔들며, 내 주위를 돈다. 그리고 여기저기에 얼굴을 가까이 대고는, 거리낌 없이 냄새를 맡아온다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ♪\u3000こっちの方からもっといい匂いがするのですっ。ああっ、でもこっちの匂いも捨てがたいのです♪」"
translation = "「바우와후♪ 이쪽에서 더 좋은 냄새가 나는 것이외다. 아앗,하지만 이쪽 냄새도 버리기 아까운 것이외다♪」"

[[dialogue]]
speaker = "unk"
original = "まるで大型犬がじゃれついてくるのように、遠慮容赦なく鼻と体を密着させてくる。"
translation = "마치 대형견이 장난치며 덤벼드는 것처럼, 사정없이 코와 몸을 밀착시켜 온다."

[[dialogue]]
speaker = "unk"
original = "これが本当に犬なら可愛いものなのだが──"
translation = "이게 진짜 개라면 귀여운 일이었겠지만──"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「くんくん♪\u3000くんくんくんっ♪」"
translation = "「킁킁♪ 킁킁킁♪」"

[[dialogue]]
speaker = "unk"
original = "発育のいい女の子に全身密着されながら匂いを嗅がれまくるのは、かなり恥ずかしいのだが！？"
translation = "발육이 좋은 여자아이에게 전신 밀착당하며 냄새를 한없이 맡아지는 것은, काफी 부끄러운데!? "

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふむ。魔王がだらしない顔をしておるな。ちなみに、これはまったく関係ない話なのだが……狛里は附属生でありながら、バストは脅威の９６センチだぞ♪」"
translation = "「흠. 마왕이 얼빠진 얼굴을 하고 있군. 참고로 이건 전혀 상관없는 이야기네만…… 코마리는 부속생이면서도 가슴이 경이로운 96센티라네♪」"

[[dialogue]]
speaker = "unk"
original = "どうしてそれを今言ったんです！？"
translation = "왜 그걸 지금 말하는 건가요!?"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわ～ふっ♪\u3000魔王様の髪の毛の中、香ばしい匂いがするのです～♪」"
translation = "「바우와~후♪ 마왕님의 머리카락 속, 고소한 냄새가 나는 것이외다~♪」"

[[dialogue]]
speaker = "unk"
original = "ついにはバックハグの形で抱きしめられてしまい、髪の毛の中に顔を突っ込まれて『魔王吸い』をされてしまう！！"
translation = "끝내는 백하그 형태로 안겨버려서, 머리카락 속에 얼굴을 처박고 '마왕 흡입'을 당하고 만다!!"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「いかんな、狛里が興奮して我を忘れている……ここまで魔王と相性がいいとは思わなかったぞ」"
translation = "「안 되겠군, 코마리가 흥분해서 자아를 잃고 있어…… 이 정도로 마왕과 궁합이 좋을 줄은 몰랐구나」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「狛里、ステイ！！」"
translation = "「코마리, 스테이!!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「――ハッ！？」"
translation = "「──핫!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ご、ごめんなさいなのですっ！\u3000本当にいい匂いだから、つい……えへへっ♪」"
translation = "「죄, 죄송한 것이외다! 정말 좋은 냄새가 나서 그만…… 에헤헤♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（あ、あんなに会長の匂いを堂々と……）"
translation = "(아, 저렇게 당당하게 회장님의 냄새를……)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（爆裂うらやま――いえ！\u3000爆裂オープン過ぎます！）"
translation = "(폭렬 부러워── 아니! 폭렬 오픈이 넘쳐나요!)"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「狛里は数ヶ月前、魔界の辺境で九浄家のスカウトが見つけてきてな。先日の『大交流』の際に、人間界へ招き入れたのだ」"
translation = "「코마리는 몇 달 전, 마계의 변방에서 쿠죠 가문의 스카우트가 찾아내서 말이지. 얼마 전 『대교류』 때 인간계로 불러들인 거라네」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「『ＸＥＬＯＳ』討伐後、リクリエという現象はなくなり、直近の危険度はかなり下がったと言える」"
translation = "「『XELOS』 토벌 후, 리크리에라는 현상은 사라져서 당장의 위험도는 상당히 낮아졌다고 할 수 있지」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「しかしながら、残ったアステライトとモンスターには、今までにない兆候も見られる。未だ、予断は許さない状況だ」"
translation = "「그렇지만 남겨진 아스테라이트와 몬스터에게는 지금까지 없었던 징후도 보인다네. 아직 방심은 금물인 상황이야」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そこで──次世代を担うエースの育成、というわけだ」"
translation = "「그래서── 차세대를 짊어질 에이스의 육성,이라는 거다」"

[[dialogue]]
speaker = "unk"
original = "ということは、強いんですね"
translation = "그렇다는 건, 강하다는 거네요"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ああ。星騎士としての実力は私が保証しよう」"
translation = "「아아. 성기사로서의 실력은 내가 보증하마」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そこで、狛里にプリマステラの資格を与えるかどうか、魔王にはぜひ確かめて欲しいと思ってな」"
translation = "「그래서, 코마리에게 프리마스테라 자격을 줄지 어떨지, 마왕이 꼭 확인해 주었으면 해서 말이지」"

[[dialogue]]
speaker = "unk"
original = "狛里の実力を見せてもらう為、俺たちはアリーナへ移動し、『仮想結界システム』を起動した。"
translation = "코마리의 실력을 확인하기 위해, 우리는 아레나로 이동해 『가상결계 시스템』을 가동했다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「それでは、狛里も準備するであります！」"
translation = "「그러면, 코마리도 준비하는 것이외다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「――変身！」"
translation = "「──변신!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「これが狛里の戦闘服であります！」"
translation = "「이것이 코마리의 전투복인 것이외다!」"

[[dialogue]]
speaker = "unk"
original = "すごく似合ってるよ"
translation = "엄청 잘 어울려"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへっ♪\u3000ありがとうなのです！」"
translation = "「에헤헤♪ 고마운 것이외다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「可愛い服で、狛里も大好きなのです♪」"
translation = "「귀여운 옷이라, 코마리도 엄청 좋아하는 것이외다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「では魔王様！\u3000手合わせ、よろしくお願いするであります！」"
translation = "「그럼 마왕님! 겨루기, 잘 부탁드리는 것이외다!」"

[[dialogue]]
speaker = "unk"
original = "模擬戦が始まって――しばらく後。"
translation = "모의전이 시작되고── 얼마 지나지 않아."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ！\u3000さすがリクリエを打倒した魔王様……とってもお強いのですぅ」"
translation = "「바우와후! 역시 리크리에를 쓰러뜨린 마왕님…… 엄청 강하신 것이외다」"

[[dialogue]]
speaker = "unk"
original = "狛里も、すごい強さだ"
translation = "코마리도 엄청난 강함이야"

[[dialogue]]
speaker = "unk"
original = "今の俺は魔王の力を使わず、星力のみで戦っている。"
translation = "지금의 나는 마왕의 힘을 쓰지 않고, 성력만으로 싸우고 있다."

[[dialogue]]
speaker = "unk"
original = "だが、その状態では一進一退。簡単には勝ち切れない程だった。"
translation = "하지만 그 상태로는 일진일퇴. 쉽게 이겨내지 못할 정도였다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里さん、強いとは聞いていましたが、まさかここまでだなんて！」"
translation = "「코마리 씨, 강하다는 말은 들었지만 설마 이 정도일 줄이야!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（会長に接近戦で引けを取らない……それどころか、野生の獣のような凄まじい気迫を感じさせて……！）"
translation = "(회장님에게 근접전으로 밀리지 않아…… 도리어 야생의 짐승 같은 무시무시한 기세를 느끼게 하고……!)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（魔界にいた頃は、一体どんな生活を……？）"
translation = "(마계에 있었을 때는 대체 어떤 생활을……?)"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「狛里は過酷な状況を乗り越え、魔界の辺境を救ってみせた『英雄』だからな」"
translation = "「코마리는 가혹한 상황을 이겨내고, 마계의 변방을 구해낸 『영웅』이니까 말이지」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「英雄……？」"
translation = "「영웅……?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「――魔王よ。狛里の強さはもう十分に伝わっていると思うが、どうだ？」"
translation = "「──마왕이여. 코마리의 강함은 이제 충분히 전달되었다고 생각하는데, 어떤가?」"

[[dialogue]]
speaker = "unk"
original = "そうですね。ここまでにしましょう"
translation = "그렇네요. 여기까지 하죠"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えっ、もういいのですか？」"
translation = "「에, 벌써 끝인 것이외까?」"

[[dialogue]]
speaker = "unk"
original = "俺は頷き、プリマステラとしての十分な実力があることを伝える。"
translation = "나는 고개를 끄덕여, 프리마스테라로서 충분한 실력이 있음을 전달한다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「――本当なのですか！？」"
translation = "「──정말인 것이외까!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「わ～いっ！\u3000ありがとうなのです♪」"
translation = "「와~이! 고마운 것이외다♪」"

[[dialogue]]
speaker = "unk"
original = "狛里は嬉しそうにぴょんぴょん飛び跳ねて、俺の手を取りぶんぶんと上下に振る。"
translation = "코마리는 기쁜 듯이 깡충깡충 뛰어오르며, 내 손을 잡고 붕붕 위아래로 흔든다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「あっ♪\u3000魔王様、模擬戦で汗をかいて、さっきよりもっといい匂いがするのです<emoji=heart04>\u3000――くんくんくん♪」"
translation = "「앗♪ 마왕님, 모의전으로 땀을 흘려서, 아까보다 훨씬 더 좋은 냄새가 나는 것이외다<emoji=heart04> ── 킁킁킁♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「っ！！\u3000ぺろぺろぺろ～♪」"
translation = "「읏!! 할짝할짝할짝~♪」"

[[dialogue]]
speaker = "unk"
original = "狛里ステイ！\u3000ステイ！！"
translation = "코마리 스테이! 스테이!!"

[[dialogue]]
speaker = "unk"
original = "ぐわぁーーーー！？"
translation = "으악ーーーー!?"

[[dialogue]]
speaker = "unk"
original = "額と頬を伝う汗を、目を輝かせて舌で舐め取ってきたぞ、この娘！？\u3000距離感どうなってるんだ！？？"
translation = "이마와 뺨을 타고 흐르는 땀을, 눈을 빛내며 혀로 핥아왔다고, 이 아이!? 거리감이 어떻게 된 거야!?"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こややや……！」"
translation = "「코야야야……!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（か、会長の『生汗』をあんな近くでくんくんするなんて！）"
translation = "(회, 회장님의 '생땀'을 저렇게 가까이서 킁킁거리다니!)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（なんて爆裂うらやまし――いえ、爆裂オープンなんですか！？）"
translation = "(이 얼마나 폭렬 부러운── 아니, 폭렬 오픈인 건가요!?)"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ヨミヨミは見ているだけでよいのか？」"
translation = "「요미요미는 보고 있기만 해도 괜찮은가?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ご、ご当主様！？」"
translation = "「당, 당주님!?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「顔を赤くしながら、羨ましそうな目で見ていたぞ？」"
translation = "「얼굴을 붉히면서, 부러운 눈으로 보고 있었다만?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「流石の私も、殿方の汗を舌で味わう性癖はありませんからね！？」"
translation = "「아무리 저라도 남성의 땀을 혀로 맛보는 성향은 없으니까요!?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私はただ、生汗くんくんはちょっとうらやましいなってそう思っただけなんですからっ！？」"
translation = "「저는 그저, 생땀 킁킁은 조금 부럽다고 그렇게 생각했을 뿐이라구요!?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふっふっふっ。動揺のあまり、本音がダダ漏れになっておるぞ♪」"
translation = "「훋훋훋. 동요한 나머지 본심이 새어나오고 있구나♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えっ！？」"
translation = "「에!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「もしかして……ヨミ先輩も、匂いを嗅ぐのが好きなのです！？」"
translation = "「혹시…… 요미 선배도 냄새 맡는 걸 좋아하는 것이외까!?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こややっ！？\u3000そ、それは、そのぉ……！」"
translation = "「코얏!? 그, 그건, 그게……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむ。ただし――ヨミは狛里と違い、普段は恥ずかしがってその性癖を隠している」"
translation = "「음. 다만── 요미는 코마리와 달리, 평소에는 부끄러워해서 그 성향을 숨기고 있지」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「いわゆる『ムッツリ匂いフェチ』というやつだな」"
translation = "「이른바 『음흉한 냄새 페티시』라는 녀석이다」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ご当主様ぁーーっ！？」"
translation = "「당주님~~~!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「むっつり？\u3000くんくんするの、隠しているのです？」"
translation = "「음흉? 킁킁하는 거, 숨기고 있는 것이외까?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……その」"
translation = "「……그건」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里さんはヒトの匂いを嗅ぐのって……恥ずかしくないんですか？」"
translation = "「코마리 씨는 사람 냄새를 맡는 게…… 부끄럽지 않으신가요?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「？」"
translation = "「?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ♪\u3000狛里、匂いを嗅ぐの大好きだもん♪」"
translation = "「네♪ 코마리, 냄새 맡는 거 엄청 좋아하니까요♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そ、そんな屈託のない笑顔で言われると……」"
translation = "「그, 그렇게 구김살 없는 미소로 말씀하시면……」"

[[dialogue]]
speaker = "unk"
original = "で、でも相手は選んだ方がいいかな……"
translation = "하, 하지만 상대는 가리는 게 좋을지도 모르겠는데……"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そ、そうですよね……」"
translation = "「그, 그렇겠지요……」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふ？」"
translation = "「바우와후?」"

[[dialogue]]
speaker = "unk"
original = "不思議そうに首を傾げる狛里。"
translation = "신기한 듯 고개를 기우뚱하는 코마리."

[[dialogue]]
speaker = "unk"
original = "そんな彼女を見ながら、俺たちは思わず苦笑いをしてしまうのだった。"
translation = "그런 그녀를 보면서, 우리는 어이없는 쓴웃음을 지을 수밖에 없었다."

[[dialogue]]
speaker = "unk"
original = "――翌日。九浄家にて。"
translation = "──다음 날. 쿠죠 가문에서."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――え？\u3000私が狛里さんの『教育係』をですか？」"
translation = "「──에? 제가 코마리 씨의 『교육 담당』을 말인가요?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ええ！\u3000メイドの先輩として、新人の指導をお願いしたいと思っているの！」"
translation = "「네! 메이드 선배로서, 신인의 지도를 부탁하고 싶어!」"

[[dialogue]]
speaker = "unk"
original = "九浄家メイド隊のメイド長『蘭美』は、頷きながらそう宣言した。"
translation = "쿠죠 가문 메이드대의 메이드장 『라비』는, 고개를 끄덕이며 그렇게 선언했다."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「当主様の言う『ヨミの成長を促す秘策』はズバリ、この教育係のことよ！」"
translation = "「당주님이 말씀하신 『요미의 성장을 촉진할 비책』은 바로 이 교육 담당을 말하는 거야!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ヒトにものを教えるのは、自分の成長にも繋がるわ！\u3000どうかしら？」"
translation = "「남을 가르치는 건, 자신의 성장으로도 이어지니까! 어때?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（後輩に仕事を教えるのは、これが初めて）"
translation = "(후배에게 일을 가르치는 건, 이번이 처음)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（私に務まるか、自信はないけど……）"
translation = "(내가 해낼 수 있을지, 자신은 없지만……)"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……わ、わかりました！」"
translation = "「……아, 알겠습니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「その<ruby>任務<rt>クエスト</rt></ruby>、お引き受けします！」"
translation = "「그 <ruby>임무<rt>퀘스트</rt></ruby>, 맡도록 하겠습니다!」"

[[dialogue]]
speaker = "unk"
original = "ヨミは自身の成長の為にも、教育係という新たな役目へ挑戦することを決めるのだった。"
translation = "요미는 자신의 성장을 위해서도, 교육 담당이라는 새로운 역할에 도전하기로 결심하는 것이었다."

