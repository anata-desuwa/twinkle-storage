[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「また負けた！？」"
translation = "「또 졌다！？」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「何故なの！？\u3000その海パンの強さは一体……！？」"
translation = "「어째서지！？ 그 사각 수영복의 강함은 대체……！？」"

[[dialogue]]
speaker = "unk"
original = "季節が『夏』だからさ"
translation = "계절이 『여름』이기 때문이지"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「――守護星である地球上の概念『夏』を力に変換することで、通常フォームの２倍の出力で戦えるですって……！？」"
translation = "「――수호성인 지구상의 개념 『여름』을 힘으로 변환함으로써, 통상 폼의 2배의 출력으로 싸울 수 있다는 거야……！？」"

[[dialogue]]
speaker = "unk"
original = "デメリット付きだけどね"
translation = "디메리트가 있긴 하지만 말야"

[[dialogue]]
speaker = "unk"
original = "ただし、夏の期間限定という"
translation = "단, 여름의 기간 한정이라는"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「くっ……だとしても、シンプルに強力だわ……！」"
translation = "「큭…… 그렇다 해도, 단순하게 강력해……！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「でも、私の水着だって、夏の力でパワーアップした守護天使『サマーエクラエル』の霊力が宿っているのよ！」"
translation = "「하지만, 내 수영복도, 여름의 힘으로 파워업한 수호천사 『서머 에클라엘』의 영력이 깃들어 있어！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「その力を使いこなして、会長に勝ってみせるわ！」"
translation = "「그 힘을 능숙하게 다뤄서, 회장을 이겨 보이겠어！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「もう１度勝負よ！」"
translation = "「다시 한 번 승부야！」"

