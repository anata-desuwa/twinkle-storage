[[dialogue]]
speaker = "unk"
original = "ルネアの自動解析霊術が継続中である為、俺たちは海の家に宿泊した。"
translation = "루네아의 자동 분석 영술이 계속되는 중이었기에, 우리들은 바다의 집에 숙박했다."

[[dialogue]]
speaker = "unk"
original = "そうして、夜が明けた翌日。"
translation = "그렇게, 날이 밝은 다음 날."

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「異世会長さん、おはようなのです～♪」"
translation = "「이세계 회장님, 안녕하신 것입니다~♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「もしかして朝練をしていたの？」"
translation = "「혹시 아침 연습을 하고 있었던 거야?」"

[[dialogue]]
speaker = "unk"
original = "俺が海の家の外で格闘の型を反復練習していると、クルセイダースの４人がやってくる。"
translation = "내가 바다의 집 밖에서 격투 자세를 반복 연습하고 있자, 크루세이더즈 4명이 다가온다."

[[dialogue]]
speaker = "unk"
original = "自力で戦えるようにね"
translation = "자력으로 싸울 수 있도록 말이지"

[[dialogue]]
speaker = "unk"
original = "力が使えないからこそ"
translation = "힘을 쓸 수 없으니까 더더욱"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「……なるほど、そういうところも咲良クンにちょっと似てるわね」"
translation = "「……과연, 그런 부분도 사쿠라 군을 약간 닮았네」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「確かに、影ながらコツコツと努力してる感じがね♪」"
translation = "「확실히, 남몰래 꾸준히 노력하는 느낌이네♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「幼なじみのあたしでも、なんか親近感覚えるからね～」"
translation = "「소꿉친구인 나조차도, 왠지 친근감이 들 정도니까~」"

[[dialogue]]
speaker = "unk"
original = "そういえば、みんなに聞きたかったんだ"
translation = "그러고 보니, 모두에게 물어보고 싶은 게 있었어"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「え？\u3000――咲良クンがどんな人か……？」"
translation = "「에? ――사쿠라 군이 어떤 사람인지……?」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「あ～、まぁ、こんなふうにあたしたちが言ってたら、そりゃ気になるか」"
translation = "「아~ 뭐, 이렇게 우리들이 말하고 있으니, 그야 신경 쓰이겠지」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「とにかくポジティブだよね～」"
translation = "「어쨌든 긍정적이지~」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「家にお金が無くて、貧乏暮らしではあるんだけど、だからこそ何事も前向きに楽しめるっていうかね」"
translation = "「집에 돈이 없어서, 가난하게 살고 있긴 하지만, 그렇기 때문에 무엇이든 전향적으로 즐길 수 있다고나 할까」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「とっても面白い人なのですよ～」"
translation = "「매우 재미있는 사람이랍니다~」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「うん。会長よりもおバカなことを言うね～。あと、スケベなことも♪」"
translation = "「응. 회장보다 바보 같은 소리를 하네~. 그리고, 엉큼한 짓도♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「その癖、私よりも勉強の成績はいいのよ！」"
translation = "「그런 주제에, 나보다 공부 성적은 좋아!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「シンくん、学年１位を取るくらい、勉強ができるんだよ～」"
translation = "「신 군, 전교 1등을 할 정도로, 공부를 잘하거든~」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「会長さんは、『キラキラな学園生活』を送りたいから、学年１位を取って、生徒会長さんになったのです！」"
translation = "「회장님은, 『반짝반짝한 학원 생활』을 보내고 싶어서, 전교 1등을 하고, 학생회장님이 된 것이에요!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「確かに努力家なのは認めるけど……でもそのうち、私は必ず勝ってみせるわ！」"
translation = "「확실히 노력파라는 건 인정하지만…… 하지만 조만간, 나는 반드시 이겨보이겠어!」"

[[dialogue]]
speaker = "unk"
original = "シンの好きなものとかってあるかな？"
translation = "신의 좋아하는 거라든가 있어?"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「咲良クンの好きなもの……？\u3000う～ん、そうね――」"
translation = "「사쿠라 군이 좋아하는 것……? 음~ 글쎄――」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「『ビフテキ』なのです♪」"
translation = "「『비프스테이크』인 것입니다♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あはは、そうそう、ビーフステーキもあったよね♪」"
translation = "「아하하, 맞아 맞아, 비프스테이크도 있었지♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「正確には、シンは何を食べても『うまいっ！』って言うんだけどね～」"
translation = "「정확히는, 신은 뭘 먹어도 『맛있다!』고 하지만 말이야~」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「これまで食べたことがないっていうから、誕生日に私たちでビフテキを作ってあげたのよ」"
translation = "「지금까지 먹어본 적이 없다고 해서, 생일에 우리끼리 비프스테이크를 만들어 줬었어」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「そしたら、実際は違ってて、今までシンが頭の中で想像してたのは『トンテキ』――豚肉のステーキの方だったっていうね～」"
translation = "「그랬더니, 사실은 달랐고, 지금까지 신이 머릿속으로 상상했던 건 『돈스테이크』―― 돼지고기 스테이크 쪽이었다는 거지~」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「全く……ふふっ♪\u3000まあ、喜んで食べてくれたから、許してあげたけど♪」"
translation = "「정말이지…… 후후♪ 뭐, 기뻐하며 먹어줬으니까, 용서해 줬지만♪」"

[[dialogue]]
speaker = "unk"
original = "そんな風にしばらく話した後、俺たちは海の家で朝食をすることになった。"
translation = "그런 식으로 잠시 이야기를 나눈 후, 우리들은 바다의 집에서 아침 식사를 하게 되었다."

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「はい、夕霧ナナカ特製、冷やし蕎麦、お待ち～♪」"
translation = "「자, 유우기리 나나카 특제, 냉소바, 나왔습니다~♪」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「おっ、待ってたぜ！」"
translation = "「오, 기다렸다구!」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「わぁっ♪\u3000美味しそ～♪」"
translation = "「와아♪ 맛있겠다~♪」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「いただきます、なのです～♪」"
translation = "「잘 먹겠습니다, 인 것입니다~♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ほう、これは本当にすごいな。蕎麦作りの腕前だけなら、あの蛍火をも上回るかもしれん」"
translation = "「호오, 이것 참 정말 대단하군. 소바 만들기 실력만큼은, 저 호타루비를 능가할지도 모르겠어」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ♪\u3000そうでしょ～？\u3000ナナカちゃんは、うちの学園の『一芸入試』を、これで合格したんだから～♪」"
translation = "「후후♪ 그렇죠~? 나나카짱은, 우리 학원의 『장기 입시』를, 이걸로 합격했으니까요~♪」"

[[dialogue]]
speaker = "unk"
original = "うまいっ！"
translation = "맛있다!"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「えへへ♪\u3000まあ、まだまだ父親には敵わないんだけどね～」"
translation = "「에헤헤♪ 뭐, 아직 아버지에게는 미치지 못하지만 말이야~」"

[[dialogue]]
speaker = "unk"
original = "と……そこへ、ルネアがやって来る。"
translation = "그리고…… 거기에, 루네아가 찾아온다."

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「みんな、自動解析が終わったわ」"
translation = "「얘들아, 자동 분석이 끝났어」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「本当！？\u3000それでルネアさん、どうだったの？」"
translation = "「정말!? 그래서 루네아 씨, 어떻게 됐어?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「やっぱりリゾート結界内に、何者かによって強力な封印術式がかけられているみたいね」"
translation = "「역시 리조트 결계 내에, 누군가에 의해 강력한 봉인 술식이 걸려 있는 모양이야」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「そして、その術式には『リ・クリエ』の力の痕跡があったわ」"
translation = "「그리고, 그 술식에는 『리 크리에』의 힘의 흔적이 있었어」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「あの、そちらの世界の『リ・クリエ』って、流星クルセイダースのみんなが止めたんじゃ……？」"
translation = "「저기, 그쪽 세계의 『리 크리에』는, 유성 크루세이더즈 모두가 막은 게……?」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「そう。本来なら、もう起こることはないはずなのに……」"
translation = "「맞아. 원래대로라면, 더 이상 일어날 리 없을 텐데……」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「それが何故、今ここでその力を感じるのか……」"
translation = "「그게 어째서, 지금 여기서 그 힘이 느껴지는 건지……」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「それを確かめる為にも、リゾート結界に張られている封印術式の『核』を見つける必要があるわ」"
translation = "「그걸 확인하기 위해서라도, 리조트 결계에 쳐져 있는 봉인 술식의 『핵』을 찾을 필요가 있어」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「核の場所は、もう判明しているのかしら？」"
translation = "「핵의 위치는, 이미 판명된 건가요?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「ええ。私が追跡することができるわ」"
translation = "「그래. 내가 추적할 수 있어」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「朝食を食べ終わったら、みんなで向かいましょう」"
translation = "「아침 식사를 다 먹으면, 다 같이 향하도록 하자」"

[[dialogue]]
speaker = "unk"
original = "そうして朝食後、ルネアに付いて行き、向かった場所には――"
translation = "그렇게 아침 식사 후, 루네아를 따라가, 향한 곳에는――"

[[dialogue]]
speaker_original = "魔族"
speaker_translation = "마족"
original = "「……！\u3000イ～」"
translation = "「……! 이~」"

[[dialogue]]
speaker = "unk"
original = "１匹の魔族の姿があった。"
translation = "1마리의 마족의 모습이 있었다."

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「あれよ！\u3000あの魔族が持っている、丸い宝玉！」"
translation = "「저거야! 저 마족이 가지고 있는, 둥근 보옥!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あの魔族は本物……？\u3000それとも……？」"
translation = "「저 마족은 진짜……? 아니면……?」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「とりあえず捕まえてみるしかなさそうですね」"
translation = "「우선 붙잡아 보는 수밖에 없을 것 같네요」"

[[dialogue]]
speaker_original = "魔族たち"
speaker_translation = "마족들"
original = "「イ～～！」"
translation = "「이~~!」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「宝玉から影が広がって、また魔族が沢山出てきた！」"
translation = "「보옥에서 그림자가 펼쳐져서, 또 마족이 많이 나왔어!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「ビンゴみたいだね。――よ～し、気合い入れて行きますか！」"
translation = "「빙고인 것 같네. ――좋~아, 기합 넣고 가볼까!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「はい！\u3000会長さんを早く目覚めさせる為にも、頑張りますよ～！」"
translation = "「네! 회장님을 얼른 깨우기 위해서라도, 힘낼게요~!」"

[[dialogue]]
speaker = "unk"
original = "俺たちは謎の宝玉を確保する為に、再び魔族たちとの戦闘を開始するのだった。"
translation = "우리들은 의문의 보옥을 확보하기 위해, 다시 마족들과의 전투를 개시하는 것이었다."

