[[dialogue]]
speaker = "unk"
original = "第８話,ＶＳ星喰らいシャドウ・アポロ戦闘後,B"
translation = "제8화, VS 별을 먹는 자 섀도 아폴로 전투 후, B"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「なんでだっ！\u3000どうしてこんなに、こいつらは……強いんだっ──！？」"
translation = "「어째서냐! 어째서 이렇게나, 이 녀석들은…… 강한 거냐──!?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「世界は、やり直すべきなんだ……消えるべきなのにっ！！」"
translation = "「세계는, 다시 시작해야 해…… 사라져야 하는데!!」"

[[dialogue]]
speaker_original = "アポロ（大人）"
speaker_translation = "아폴로(성인)"
original = "「そこの『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』は幻影みたいなものだ！\u3000使徒に攻撃を集中する──セーラ、援護を頼む！！」"
translation = "「저기 있는 『<ruby>XELOS<rt>제로스</rt></ruby>』는 환영 같은 거다! 사도에게 공격을 집중한다── 세라, 지원을 부탁해!!」"

[[dialogue]]
speaker_original = "セーラ"
speaker_translation = "세라"
original = "「おっけーアポロちゃん！\u3000ハートブレイクショット！！」"
translation = "「오케이 아폴로짱! 하트 브레이크 샷!!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「だめだっ……この拠点も、もう──ぐぅううぅううっ！！」"
translation = "「안 돼…… 이 거점도 이제── 으으으으으으윽!!」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「最後のトドメ──任せますわ！！」"
translation = "「마지막 결정타── 맡기겠어요!!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「風穴ブチ空けてやりましてよ！\u3000ベットショット・ハイローラー！！！」"
translation = "「구멍을 뻥 뚫어주겠어요! 베팅 샷 하이 롤러!!!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「──────うああぁあぁぁああっ！！！」"
translation = "「──────으아아아아아아앗!!!」"

[[dialogue]]
speaker_original = "ルリエル"
speaker_translation = "루리엘"
original = "「やりましたっ！\u3000セナリィさんの攻撃……手応えありなのです！」"
translation = "「해냈습니다! 세나리 씨의 공격…… 손응답이 있는 것입니다!」"

[[dialogue]]
speaker_original = "ユウリ"
speaker_translation = "유우리"
original = "「ああっ。ようやく、使徒の動きが止まった……！！」"
translation = "「아아. 겨우, 사도의 움직임이 멈췄다……!!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ここまで、か…………くそ…………！！」"
translation = "「여기까지, 인가………… 젠장…………!!」"

[[dialogue]]
speaker_original = "ＸＥＬＯＳ"
speaker_translation = "제로스"
original = "「ギ…………ィ…………ィィィ…………」"
translation = "「키…………이…………이이이…………」"

[[dialogue]]
speaker_original = "ソフィア"
speaker_translation = "소피아"
original = "「『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』が……何かを、伝えようとしている……？」"
translation = "「『<ruby>XELOS<rt>제로스</rt></ruby>』가…… 무언가를, 전하려 하고 있어……?」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「もう抵抗する力はなさそうだけれど……油断しちゃダメよ、ソフィ」"
translation = "「이제 저항할 힘은 없어 보이지만…… 방심하면 안 돼, 소피」"

[[dialogue]]
speaker_original = "ＸＥＬＯＳ"
speaker_translation = "제로스"
original = "「ギ…………ァ…………ァァアァ…………」"
translation = "「키…………아…………아아아아…………」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「へへ……負け、か……最期に、神の言葉を、教えてやるよ……」"
translation = "「헤헤…… 패배, 인가…… 마지막으로, 신의 말을, 가르쳐 주지……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「『ヒトの分際で……どこまでも愚弄する……蒙昧な輩たち……許さん……決して……許さん…………』」"
translation = "「『인간 주제에…… 어디까지고 우롱하는…… 몽매한 무리들…… 용서 못 한다…… 결코…… 용서 못 해…………』」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「はっ。悪党の最期に似合いのセリフですわね！」"
translation = "「핫. 악당의 최후에 어울리는 대사군요!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「『決して許さん……呪ってやる……その魂の、輪廻が尽きるまで…………』」"
translation = "「『결코 용서 못 한다…… 저주해 주마…… 그 영혼의, 윤회가 다할 때까지…………』」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「『おのれ…………バンデット・セナリィ────！！』」"
translation = "「『이놈………… 밴디트 세나리────!!』」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「──ええぇえぇえええぇえぇっ！？」"
translation = "「── 에에에에에에에엣!?」"

[[dialogue]]
speaker = "unk"
original = "アポロのシャドウと『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』の分身体は──塵のようにかき消えた。"
translation = "아폴로의 섀도와 『<ruby>XELOS<rt>제로스</rt></ruby>』의 분신체는── 먼지처럼 사라졌다."

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「……しぶとい連中でしたが、なんとか勝利を手にできましたわね」"
translation = "「……끈질긴 녀석들이었습니다만, 어떻게든 승리를 손에 쥐었군요」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「ちょっとお待ちなさいな！？\u3000なんで私だけ特別に恨まれてますの！？」"
translation = "「잠깐 기다려 보세요!? 왜 나만 특별히 원망받는 건가요!?」"

[[dialogue]]
speaker_original = "ソフィア"
speaker_translation = "소피아"
original = "「最後のトドメを刺したのは、セナリィさんの銃弾でしたから──お見事でした」"
translation = "「마지막 결정타를 날린 것은, 세나리 씨의 총알이었으니까요── 훌륭했습니다」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「嬉しくねーですわ！？\u3000なんか呪ってやるとか言ってましたわよ！？」"
translation = "「기쁘지 않다고요!? 왠지 저주해 주겠다든가 말했었다고요!?」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「……はぁ。戦いが終わった後も騒々しいんだから」"
translation = "「……하아. 싸움이 끝난 후에도 시끄럽다니까」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「負け惜しみを言わせるくらいに圧倒できたことを誇るべきだわ。よくやったわね、皆」"
translation = "「패자의 원망을 하게 만들 정도로 압도한 것을 자랑스러워해야 해. 잘했다, 모두」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「アルタイルの星騎士たちの連携も見事だったけれど……リーエン。流石はキュリオスの女帝に仕えるだけはあるわね」"
translation = "「알타이르 성기사들의 연계도 훌륭했지만…… 리엔. 역시 큐리오스의 여제를 섬길 만하네」"

[[dialogue]]
speaker_original = "リーエン"
speaker_translation = "리엔"
original = "「妃竜院マハムート。貴様も賞賛に値する戦いぶりだった──いずれ手合わせを願いたいものだ」"
translation = "「키류인 마하무트. 너도 칭찬받아 마땅한 싸움 모습이었다── 언젠가 겨뤄보고 싶군」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「いいでしょう。<ruby>新星寮<rt>ラルーナ</rt></ruby>の寮長として迎え撃ってあげるわ」"
translation = "「좋겠지. <ruby>신성 기숙사<rt>라루나</rt></ruby>의 기숙사장으로서 맞서 주겠어」"

[[dialogue]]
speaker_original = "アポロ（大人）"
speaker_translation = "아폴로(성인)"
original = "「よし……これで『星喰らい』の拠点制圧も３つ目だ！\u3000王手とまではいかないが、『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』をかなり追い詰められたはずだ」"
translation = "「좋아…… 이것으로 『별을 먹는 자』의 거점 제압도 3번째다! 외통수까지는 아니지만, 『<ruby>XELOS<rt>제로스</rt></ruby>』를 상당히 몰아붙였을 터다」"

[[dialogue]]
speaker_original = "アポロ（大人）"
speaker_translation = "아폴로(성인)"
original = "「しかし驚いたぞ！\u3000幹内世界の可能性ってやつは凄まじいな、まさかバニーガールの戦闘服まであるだなんて！」"
translation = "「하지만 놀랐다고! 줄기 내부 세계의 가능성이라는 건 굉장하네, 설마 바니걸 전투복까지 있을 줄이야!」"

[[dialogue]]
speaker_original = "ルリエル"
speaker_translation = "루리엘"
original = "「はいなのです！\u3000セーラ先輩はともかく、あの真面目なユウリ先輩まで……いったい何が起こったらこんなことに！？」"
translation = "「네인 것입니다! 세라 선배는 그렇다 치고, 그 진지한 유우리 선배까지…… 대체 무슨 일이 일어나면 이렇게 되는 것인가요!?」"

[[dialogue]]
speaker_original = "ユウリ"
speaker_translation = "유우리"
original = "「掘り下げんな！\u3000さっさとアルタイルに戻るぞっ！\u3000一刻も早く、この戦闘服を脱がせろ！！」"
translation = "「캐묻지 마! 얼른 알타이르로 돌아가자! 한시라도 빨리, 이 전투복을 벗겨줘!!」"

[[dialogue]]
speaker_original = "セーラ"
speaker_translation = "세라"
original = "「ちょいちょい、ルリちー？\u3000ウチはともかくってどーゆーことー？」"
translation = "「이봐 이봐, 루리치-? 나는 그렇다 치고라니 무슨 소리야-?」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ユウリさんのお気持ち、私には痛いほど分かりますわ……！」"
translation = "「유우리 씨의 마음, 저에게는 아플 정도로 잘 압니다……!」"

[[dialogue]]
speaker_original = "ユウリ"
speaker_translation = "유우리"
original = "「うお！？\u3000ヒルディオーネ先輩……！？」"
translation = "「우오!? 힐디요네 선배……!?」"

[[dialogue]]
speaker_original = "ソフィア"
speaker_translation = "소피아"
original = "「おぉ。ユウリ先輩の両手をがっちり握って……なるほど、バニーの皆さん、戦闘服が発現した経緯は同じ、ということでしょうか？」"
translation = "「오오. 유우리 선배의 두 손을 꽉 쥐고…… 과연, 바니 여러분, 전투복이 발현한 경위는 같다,라는 것일까요?」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「私やマイン、それに千園寺様だけではなかったんですわね！\u3000あのヘンタイの毒牙にかかった不幸な星騎士は……！」"
translation = "「저나 마인, 그리고 센온지 님뿐만이 아니었던 거군요! 저 변태의 독아에 걸린 불행한 성기사는……!」"

[[dialogue]]
speaker_original = "ユウリ"
speaker_translation = "유우리"
original = "「え……へ、ヘンタイ？\u3000ユリアーナ……じゃないっ。ユーリスはそんな奴じゃないですよ、先輩！！」"
translation = "「에…… 변, 변태? 율리아나……가 아니야. 유리스는 그런 녀석이 아니라고요, 선배!!」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「……ユーリス？\u3000新星学園の、ジルラント王国の……？\u3000確か緋宮会長と同じく、珍しい男性の星騎士でしたわよね」"
translation = "「……유리스? 신성학원의, 질란트 왕국의……? 분명 히노미야 회장과 마찬가지로, 보기 드문 남성 성기사였죠」"

[[dialogue]]
speaker_original = "セーラ"
speaker_translation = "세라"
original = "「ウチとユウリちゃんのバニーフォームは、あの王子様から貰ったものだからね～♪」"
translation = "「나랑 유우리짱의 바니 폼은, 저 왕자님한테 받은 거니까 말이지~♪」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ですわっ！？\u3000なんてハレンチな！！！」"
translation = "「그렇습니까!? 이 무슨 파렴치한!!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「あの超がつくほど真面目そうな王子様が……？\u3000ヒトは見かけによりませんのね」"
translation = "「저 도가 넘을 정도로 진지해 보이는 왕자님이……? 사람은 겉보기로 판단할 수 없군요」"

[[dialogue]]
speaker_original = "ユウリ"
speaker_translation = "유우리"
original = "「ま、待て待て！\u3000あたしら、カジノに潜入捜査をしなくちゃいけなくて、それで用意してもらっただけだって！」"
translation = "「기, 기다려 기다려! 우리들, 카지노에 잠입 수사를 해야만 해서, 그래서 준비해 준 것뿐이라고!」"

[[dialogue]]
speaker_original = "セーラ"
speaker_translation = "세라"
original = "「そーそー。てゆーか、セナリィちゃんたちの衣装は、王子様経由じゃないってこと？」"
translation = "「맞아 맞아. 그보다, 세나리짱 일행의 의상은, 왕자님을 거친 게 아니라는 소리?」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「──ううぅっ！！」"
translation = "「── 으으윽!!」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「頭がっ……！\u3000存在しないヘンタイの記憶が、また……！！」"
translation = "「머리가……! 존재하지 않는 변태의 기억이, 또……!!」"

[[dialogue]]
speaker_original = "ユウリ"
speaker_translation = "유우리"
original = "「あたしやセーラさん以上に、ヤバイ状況だったみたいだな……」"
translation = "「나나 세라 씨 이상으로, 위험한 상황이었던 모양이군……」"

[[dialogue]]
speaker_original = "セーラ"
speaker_translation = "세라"
original = "「語ると長そうだね～♪\u3000その辺りはまた、帰ってから聞くことにしよっか♪」"
translation = "「이야기하면 길어질 것 같네~♪ 그쪽은 또, 돌아가서 듣기로 할까♪」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「うふふ♪\u3000ソフィもお疲れ様。それにとーってもカワイイ衣装を着てるのね～<emoji=heart04>\u3000ぎゅーってしていい？」"
translation = "「우후후♪ 소피도 수고했어. 게다가 매~우 귀여운 의상을 입고 있네~<emoji=heart04> 꽉 안아도 될까?」"

[[dialogue]]
speaker_original = "ソフィア"
speaker_translation = "소피아"
original = "「いいわけないでしょう。人前でベタベタしないでください、しっしっ」"
translation = "「될 리가 없잖아요. 사람들 앞에서 끈적거리 지 말아 주세요, 훠이 훠이」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「あーん、そんなぁ。こんなにオシャレしてる妹をハグできないだなんて、生殺しだわ～……！」"
translation = "「아앙, 너무해. 이렇게나 멋 부린 여동생을 허그할 수 없다니, 희망고문이야~……!」"

[[dialogue]]
speaker_original = "アポロ（大人）"
speaker_translation = "아폴로(성인)"
original = "「よし──確保だ！」"
translation = "「좋아── 확보다!」"

[[dialogue]]
speaker_original = "ソフィア"
speaker_translation = "소피아"
original = "「ちょっ、アポロさん！？\u3000は、離してくださいっ！」"
translation = "「잠깐, 아폴로 씨!? 놓, 놓아주세요!」"

[[dialogue]]
speaker_original = "アポロ（大人）"
speaker_translation = "아폴로(성인)"
original = "「いーや、離さないぞ！\u3000姉も妹も、いて当たり前じゃない。いつ別れるかわかったもんじゃないんだからな！\u3000ほらサーシャ！」"
translation = "「아-니, 안 놓아줄 거다! 언니도 여동생도, 있는 게 당연한 게 아니라고. 언제 헤어질지 알 수 없는 거니까 말이지! 자, 사샤!」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「アポロちゃん、ナイスフォロー～♪\u3000ソフィを捕まえて──ぎゅ～ぅ～っ<emoji=heart04>」"
translation = "「아폴로짱, 나이스 서포트~♪ 소피를 잡아서── 꽉~~<emoji=heart04>」"

[[dialogue]]
speaker_original = "ソフィア"
speaker_translation = "소피아"
original = "「ああぁ、もうっ……姉さんっ、むぎゅぅ！？」"
translation = "「아아아, 정말이지…… 언니, 으윽!?」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「甘いパンケーキの香りがするわ～……うふふ<emoji=heart04>\u3000今日はずーっと、ソフィをだっこしちゃおうかしら～<emoji=heart04>」"
translation = "「달콤한 팬케이크 향기가 나네~…… 우후후<emoji=heart04> 오늘은 내~내, 소피를 안아버릴까나~<emoji=heart04>」"

[[dialogue]]
speaker_original = "ソフィア"
speaker_translation = "소피아"
original = "「ダメに決まってるでしょう！\u3000離れてください～っ！」"
translation = "「안 되는 게 당연하잖아요! 떨어져 주세요~!」"

[[dialogue]]
speaker_original = "ルリエル"
speaker_translation = "루리엘"
original = "「と言いつつ、ソフィアもまんざらでもなさそうなのです。でんでん♪」"
translation = "「라고 말하면서도, 소피아도 내심 싫지 않은 모양인 것입니다. 덴덴♪」"

[[dialogue]]
speaker_original = "ソフィア"
speaker_translation = "소피아"
original = "「ルリもからかわないでください、もぅっ！！」"
translation = "「루리도 놀리지 말아 주세요, 정말!!」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「やれやれ、収拾がつかないわね……本当に。帰還するわよ！」"
translation = "「이런 이런, 수습이 안 되네…… 정말이지. 귀환하자!」"

[[dialogue]]
speaker = "unk"
original = "『星喰らい』の拠点は、残すところあと２つ。"
translation = "『별을 먹는 자』의 거점은, 남은 곳이 단 2곳."

[[dialogue]]
speaker = "unk"
original = "創造神との戦いは、終幕へと近づきつつあった──"
translation = "창조신과의 싸움은, 종막으로 가까워지고 있었다──"

