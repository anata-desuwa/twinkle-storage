[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふぅ……飾り作りも順調に進んでるんじゃないかニャ？」"
translation = "「후우…… 장식 만들기 순조롭게 진행되고 있는 거 아니냐냥?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あ、梨緒からメッセージ来てた。ゴーストの捕獲もほとんど終わったって。アポロは鬼ごっこして遊んでたってさ」"
translation = "「아, 리오한테 메시지 왔어. 고스트 포획도 거의 끝났다네. 아폴로는 술래잡기하고 놀았대」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そっか、それなら一安心だね。えっと……」"
translation = "「그렇구나, 그렇다면 일단 안심이다냥. 에또……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアト、何か私と話したいことがあるんだよね？\u3000２人きりでさ」"
translation = "「베아트, 나한테 뭔가 하고 싶은 말 있지? 둘이서만 말이야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ぎくっ！\u3000ど、どうしてわかったのニャ？」"
translation = "「찔끔! 어, 어떻게 안 거냐냥?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトがわかりやす過ぎるからだよ。ベアトが私を選んだ理由はそれでしょ？」"
translation = "「베아트가 너무 알기 쉬우니까 그렇지. 베아트가 나를 택한 이유도 그거잖아?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「う、うん……私、そんなにわかりやすいかニャァ……」"
translation = "「으, 응…… 나 그렇게 알기 쉬우냐냥……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そんなにだよ。ちょうどいい機会だし、聞いてあげる。私は逃げも隠れもしないよ。虫以外の話ならね」"
translation = "「그 정도로 알기 쉬워. 딱 좋은 기회니까 들어줄게. 나는 도망치지도 숨지도 않을 거야. 벌레 이외의 이야기라면 말이지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、そう？\u3000それじゃ、えっと、ね。今だから聞いちゃうけど……」"
translation = "「그, 그래? 그럼, 저기, 말이지. 지금이니까 물어보는 건데……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃんは選管に入った頃、私のこと、どう思ってたのかニャ……？」"
translation = "「나타샤짱은 선관에 들어왔을 무렵, 나에 대해 어떻게 생각했었나 냥……？」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトのこと？\u3000え、最初から怪しんでたよ」"
translation = "「베아트에 대해서? 에, 처음부터 수상하다고 생각했어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ンニャ～～～～っ！？」"
translation = "「냐~~~~!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だって何か隠してるオーラがひしひしと出てたし。何か私たちには話せないような秘密があるんだろうなって思ってた」"
translation = "「그야 무언가 숨기고 있는 오라가 생생하게 느껴졌거든. 우리에게는 말할 수 없는 비밀이 있겠구나 하고 생각했어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そんなにバレバレだったのニャッ！？」"
translation = "「그렇게나 뻔히 보였던 거 냥!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「顔とか態度にも出てたし、プロフィールの作り方も甘かったからね」"
translation = "「얼굴이나 태도에도 나타났고, 프로필을 만든 것도 허술했으니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「魔界からの留学生なんて戸籍がないし、素性なんていくらでも隠せるから、潜り込むにはうってつけだし」"
translation = "「마계에서 온 유학생 같은 건 호적이 없어서, 신분 따위 얼마든지 숨길 수 있으니 잠입하기에는 적격이었고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「わざわざ選管に入ったのも、何か企んでるのかと思ってたよ。星徒会を監視するにはちょうどいいポジションだからね」"
translation = "「일부러 선관에 들어온 것도 무언가 꿍꿍이가 있어서라고 생각했어. 성도회를 감시하기에는 딱 좋은 위치니까」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そういうのじゃないよ～っ」"
translation = "「그런 거 아니야~」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だよね。至る所が隙だらけで、潜入工作のプロフェッショナルには見えなかった。わざと隙を見せつけて、油断を誘ってるのかと思ったくらいだよ」"
translation = "「그렇겠지. 모든 곳에 빈틈이 투성이라서, 잠입 공작의 프로페셔널로는 보이지 않았어. 일부러 빈틈을 보여서 방심을 유도하는 건가 싶었을 정도야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ううん、考えすぎです……ただの素ですニャ……」"
translation = "「으응, 너무 많이 생각한 거예요…… 그냥 본 모습이에요 냥……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うん、それもすぐ気づいた。脅威にはならないと確信したから、ボロが出るまで泳がせてたの」"
translation = "「응, 그것도 금방 눈치챘어. 위협은 되지 않는다고 확신했기 때문에, 허점이 나올 때까지 꼬리를 밟지 않고 놔둔 거야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「何かやらかそうとしても、いつでも後ろから刺せたし、消そうと思えば３０回はチャンスがあったからね」"
translation = "「무언가 저지르려고 해도 언제든 뒤에서 찌를 수 있었고, 없애려고 마음만 먹었으면 30번은 기회가 있었으니까」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そんな風に思われてたの！？\u3000というか私、３０回も死んでたの！？」"
translation = "「그런 식으로 생각되고 있었던 거야!? 그보다 나, 30번이나 죽었던 거야!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうだよ。実際にはやらなかったんだから、優しい私に感謝してね」"
translation = "「그래. 실제로는 하지 않았으니까, 상냥한 나에게 감사해줘」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うん、ありがと──」"
translation = "「응, 고마──」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「って、あれ？\u3000今のってお礼言うところ……？」"
translation = "「앗, 어라? 방금 건 감사해야 하는 부분……？」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「選管の仲間としてやっていく内に、隠している素性はともかく、性格は裏表のない筋金入りのお人好しだってわかった」"
translation = "「선관의 동료로서 지내는 동안, 숨기고 있는 신분은 어찌 됐든, 성격은 겉과 속이 없는 뼈속까지 착해 빠진 사람이라는 걸 알았어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「早とちりで消さなくてよかった、って今では思ってるよ」"
translation = "「성급하게 없애지 않아서 다행이다, 라고 지금은 생각하고 있어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん……。えへへ、ありがとう♪」"
translation = "「나타샤짱……. 에헤헤, 고마워♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「お礼言うところでもないよ。お人好しすぎるのも、良し悪しだし」"
translation = "「고마워할 부분도 아니야. 너무 착해 빠진 것도 장단점이 있으니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「少なくとも私はベアトみたいなお人好しにはなれないよ。人と接する時は、まず最初に疑ってかかるべきと教わってきたからね」"
translation = "「적어도 나는 베아트처럼 착해 빠진 사람은 될 수 없어. 사람을 대할 때는, 먼저 의심부터 하고 봐야 한다고 배워왔으니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「でもベアトのお人好しには助けられてる。意地っ張りなくせにメンタルよわよわな梨緒の面倒を見てくれるのもありがたいし」"
translation = "「하지만 베아트의 착한 성품에는 도움을 받고 있어. 고집불통이면서 멘탈은 멘탈대로 약하디약한 리오를 보살펴 주는 것도 고맙고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「アポロともなんだかんだうまくやってるし、今はベアトのこと、信頼も尊敬もしてるよ」"
translation = "「아폴로와도 어찌저찌 잘 지내고 있고, 지금은 베아트에 대해 신뢰도 존경도 하고 있어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「選管にいてくれないと困るから、定期的にこっちに来て、みんなの面倒見てあげてよ」"
translation = ""

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あはは、ナターシャちゃんがそんなに褒めてくれるの初めてだね。嬉しいニャ」"
translation = "「아하하, 나타샤짱이 그렇게 칭찬해 주는 건 처음이네. 기뻐 냥」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもね、私は優しいんじゃなくて、わがままニャだけだよ」"
translation = "「하지만 말이지, 나는 상냥한 게 아니라, 이기적인 것뿐이야 냥」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私はね、昔も、今も、自分が『そうしたいっ！\u3000そうあってほしいっ！』って方向に突き進んでるだけ」"
translation = "「나는 말이지, 예전도, 지금도, 내가 『그러고 싶어! 그랬으면 좋겠어!』라는 방향으로 돌진하고 있을 뿐이야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「これってすっごくわがままじゃない？」"
translation = "「이거 엄청 이기적인 거 아니야?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふっ」"
translation = "「후후」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん？」"
translation = "「나타샤짱？」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そう言って、いろいろ梨緒とかに世話焼いて、よその世界を守るために命かけてるじゃん」"
translation = "「그렇게 말하면서, 이것저것 리오 같은 애들을 챙겨주고, 다른 세계를 지키기 위해 목숨을 걸고 있잖아」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そういうのを『優しい』って言うんだよ」"
translation = "「그런 걸 『상냥하다』고 하는 거야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そう……かな？」"
translation = "「그런…… 걸까?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもそうだったら……嬉しいニャ♪」"
translation = "「하지만 그렇다면…… 기뻐 냥♪」"

