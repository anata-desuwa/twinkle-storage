[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふぅ……飾り作りも順調に進んでるんじゃないかニャ？」"
translation = "「후우…… 장식 만들기 순조롭게 진행되고 있는 거 아니냐냥?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あ、梨緒からメッセージ来てた。ゴーストの捕獲もほとんど終わったって。アポロは鬼ごっこして遊んでたってさ」"
translation = "「아, 리오한테 메시지 왔어. 고스트 포획도 거의 끝났대. 아폴로는 술래잡기하면서 놀았대」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そっか、それなら一安心だね。えっと……」"
translation = "「그렇구나, 그렇다면 일단 안심이네. 으음……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアト、何か私と話したいことがあるんだよね？\u3000２人きりでさ」"
translation = "「베아토, 나한테 무슨 하고 싶은 말 있는 거지? 둘이서만 말이야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ぎくっ！\u3000ど、どうしてわかったのニャ？」"
translation = "「찔끔! 어, 어떻게 안 거냐냥?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトがわかりやす過ぎるからだよ。ベアトが私を選んだ理由はそれでしょ？」"
translation = "「베아토가 너무 알기 쉬워서 그래. 베아토가 나를 선택한 이유도 그거잖아?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「う、うん……私、そんなにわかりやすいかニャァ……」"
translation = "「으, 응…… 나, 그렇게나 알기 쉬운 거냐냥……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そんなにだよ。ちょうどいい機会だし、聞いてあげる。私は逃げも隠れもしないよ。虫以外の話ならね」"
translation = "「그 정도야. 딱 좋은 기회니까, 들어줄게. 나는 도망치지도 숨지도 않아. 벌레 이외의 이야기라면 말이지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、そう？\u3000それじゃ、えっと、ね。今だから聞いちゃうけど……」"
translation = "「그, 그래? 그럼, 으음, 있잖아. 지금이니까 물어보는 건데……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃんは選管に入った頃、私のこと、どう思ってたのかニャ……？」"
translation = "「나타샤짱은 선관에 들어왔을 무렵, 나에 대해 어떻게 생각했었던 거냐냥……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトのこと？\u3000え、最初から怪しんでたよ」"
translation = "「베아토 이야기? 에, 처음부터 의심했었어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ンニャ～～～～っ！？」"
translation = "「냐아아아아앗!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だって何か隠してるオーラがひしひしと出てたし。何か私たちには話せないような秘密があるんだろうなって思ってた」"
translation = "「그야 무언가 숨기고 있는 오라가 팍팍 나오고 있었는걸. 우리에게는 말할 수 없는 비밀이 있겠구나 하고 생각했어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そんなにバレバレだったのニャッ！？」"
translation = "「그렇게나 들통났었던 거냐냥!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「顔とか態度にも出てたし、プロフィールの作り方も甘かったからね」"
translation = "「얼굴이나 태도에도 나왔었고, 프로필 만드는 방법도 허술했으니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「魔界からの留学生なんて戸籍がないし、素性なんていくらでも隠せるから、潜り込むにはうってつけだし」"
translation = "「마계에서 온 유학생 같은 건 호적이 없고, 신원 같은 건 얼마든지 숨길 수 있으니까, 잠입하기에는 안성맞춤이고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「わざわざ選管に入ったのも、何か企んでるのかと思ってたよ。星徒会を監視するにはちょうどいいポジションだからね」"
translation = "「일부러 선관에 들어온 것도, 무언가 꿍꿍이가 있는 건가 싶었어. 성도회를 감시하기에는 딱 좋은 위치니까」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そういうのじゃないよ～っ」"
translation = "「그런 거 아니야~앗」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だよね。至る所が隙だらけで、潜入工作のプロフェッショナルには見えなかった。わざと隙を見せつけて、油断を誘ってるのかと思ったくらいだよ」"
translation = "「그렇겠지. 여기저기 헛점투성이라서, 잠입 공작의 전문가로는 보이지 않았어. 일부러 헛점을 보여서, 방심을 유도하는 건가 싶었을 정도야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ううん、考えすぎです……ただの素ですニャ……」"
translation = "「으응, 너무 깊게 생각한 거예요…… 그냥 본 모습이라구요냥……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うん、それもすぐ気づいた。脅威にはならないと確信したから、ボロが出るまで泳がせてたの」"
translation = "「응, 그것도 금방 알아챘어. 위협은 되지 않는다고 확신했으니까, 허점이 나올 때까지 놔두었던 거야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「何かやらかそうとしても、いつでも後ろから刺せたし、消そうと思えば３０回はチャンスがあったからね」"
translation = "「무언가 일을 저지르려고 해도, 언제든 뒤에서 찌를 수 있었고, 없애려고 마음먹으면 30번은 기회가 있었으니까」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そんな風に思われてたの！？\u3000というか私、３０回も死んでたの！？」"
translation = "「그런 식으로 생각되고 있었던 거야!? 그보다 나, 30번이나 죽을 뻔했던 거야!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうだよ。実際にはやらなかったんだから、優しい私に感謝してね」"
translation = "「그래. 실제로는 안 그랬으니까, 다정한 나한테 감사해줘」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うん、ありがと──」"
translation = "「응, 고마워──」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「って、あれ？\u3000今のってお礼言うところ……？」"
translation = "「라니, 어라? 지금 거 고맙다고 말할 타이밍……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「選管の仲間としてやっていく内に、隠している素性はともかく、性格は裏表のない筋金入りのお人好しだってわかった」"
translation = "「선관 동료로 지내는 동안, 숨기고 있는 신원은 둘째치고, 성격은 겉과 속이 다른 데 없는 뼛속까지 오지랖 넓은 좋은 사람이라는 걸 알았어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「早とちりで消さなくてよかった、って今では思ってるよ」"
translation = "「성급하게 없애지 않아서 다행이다, 라고 지금은 생각하고 있어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん……。えへへ、ありがとう♪」"
translation = "「나타샤짱……. 에헤헤, 고마워♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「お礼言うところでもないよ。お人好しすぎるのも、良し悪しだし」"
translation = "「고마워할 일도 아니야. 너무 착해 빠진 것도, 좋은 것만은 아니고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「少なくとも私はベアトみたいなお人好しにはなれないよ。人と接する時は、まず最初に疑ってかかるべきと教わってきたからね」"
translation = "「적어도 나는 베아토처럼 착해질 수는 없어. 사람을 대할 때는, 먼저 의심부터 하고 봐야 한다고 배워왔으니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「でもベアトのお人好しには助けられてる。意地っ張りなくせにメンタルよわよわな梨緒の面倒を見てくれるのもありがたいし」"
translation = "「하지만 베아토의 오지랖에는 도움받고 있어. 고집쟁이이면서 멘탈은 붕어빵인 리오를 돌봐주는 것도 고맙고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「アポロともなんだかんだうまくやってるし、今はベアトのこと、信頼も尊敬もしてるよ」"
translation = "「아폴로하고도 어찌어찌 잘 지내고 있고, 지금은 베아토를 신뢰도 존경도 하고 있어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「選管にいてくれないと困るから、定期的にこっちに来て、みんなの面倒見てあげてよ」"
translation = ""

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あはは、ナターシャちゃんがそんなに褒めてくれるの初めてだね。嬉しいニャ」"
translation = "「아하하, 나타샤짱이 그렇게 칭찬해 주는 거 처음이네. 기쁘다냥」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもね、私は優しいんじゃなくて、わがままニャだけだよ」"
translation = "「하지만 말이지, 나는 다정한 게 아니라, 이기적일 뿐이다냥」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私はね、昔も、今も、自分が『そうしたいっ！\u3000そうあってほしいっ！』って方向に突き進んでるだけ」"
translation = "「나는 말이지, 예전도, 지금도, 자신이 『돌파하고 싶어! 그렇게 되어주었으면 좋겠어!』라는 방향으로 돌진하고 있을 뿐이야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「これってすっごくわがままじゃない？」"
translation = "「이거 엄청 이기적인 거 아니야?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふっ」"
translation = "「후후」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん？」"
translation = "「나타샤짱?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そう言って、いろいろ梨緒とかに世話焼いて、よその世界を守るために命かけてるじゃん」"
translation = "「그렇게 말하면서, 이것저것 리오 같은 애들 챙겨주고, 다른 세계를 지키기 위해 목숨 걸고 있잖아」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そういうのを『優しい』って言うんだよ」"
translation = "「그런 걸 『다정하다』고 하는 거야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そう……かな？」"
translation = "「그러……려나?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもそうだったら……嬉しいニャ♪」"
translation = "「하지만 그렇다면…… 기쁘다냥♪」"

