[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふぅ……飾り作りも順調に進んでるんじゃないかニャ？」"
translation = "「후우…… 장식 만들기 순조롭게 진행되고 있는 거 아니냐냥?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あ、梨緒からメッセージ来てた。ゴーストの捕獲もほとんど終わったって。アポロは鬼ごっこして遊んでたってさ」"
translation = "「아, 리오한테 메시지 왔어. 고스트 포획도 거의 끝났대. 아폴로는 술래잡기하면서 놀고 있었대」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そっか、それなら一安心だね。えっと……」"
translation = "「그렇구나, 그렇다면 안심이다냥. 에또……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアト、何か私と話したいことがあるんだよね？\u3000２人きりでさ」"
translation = "「베아트, 나한테 하고 싶은 말이 있는 거지? 둘이서만 말이야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ぎくっ！\u3000ど、どうしてわかったのニャ？」"
translation = "「찔끔! 어, 어떻게 안 거냐냥?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトがわかりやす過ぎるからだよ。ベアトが私を選んだ理由はそれでしょ？」"
translation = "「베아트가 너무 티 나서 그래. 베아트가 나를 고른 이유도 그거지?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「う、うん……私、そんなにわかりやすいかニャァ……」"
translation = "「으, 응…… 나 그렇게 티 났냐냥……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そんなにだよ。ちょうどいい機会だし、聞いてあげる。私は逃げも隠れもしないよ。虫以外の話ならね」"
translation = "「그 정도로 티 났어. 마침 좋은 기회니 들어줄게. 나는 도망치지도 숨지도 않아. 벌레 이외의 이야기라면 말이지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、そう？\u3000それじゃ、えっと、ね。今だから聞いちゃうけど……」"
translation = "「그, 그래? 그럼, 에또, 말이지. 지금이니까 물어보는 건데……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃんは選管に入った頃、私のこと、どう思ってたのかニャ……？」"
translation = "「나타샤 양은 선관에 들어왔을 무렵, 나에 대해 어떻게 생각하고 있었냐냥……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトのこと？\u3000え、最初から怪しんでたよ」"
translation = "「베아트에 관한 거? 에, 처음부터 수상하다고 여겼는데」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ンニャ～～～～っ！？」"
translation = "「냐앙~~~~!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だって何か隠してるオーラがひしひしと出てたし。何か私たちには話せないような秘密があるんだろうなって思ってた」"
translation = "「그야 뭔가를 숨기고 있는 오라가 팍팍 풍겼는걸. 우리한텐 말할 수 없는 비밀이 있겠구나 하고 생각했어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そんなにバレバレだったのニャッ！？」"
translation = "「그렇게나 빤히 다 보였단 냐!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「顔とか態度にも出てたし、プロフィールの作り方も甘かったからね」"
translation = "「얼굴이나 태도에도 드러났고, 프로필 작성 방식도 어설펐으니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「魔界からの留学生なんて戸籍がないし、素性なんていくらでも隠せるから、潜り込むにはうってつけだし」"
translation = "「마계에서 온 유학생 같은 건 호적이 없어서, 신분 따위 얼마든지 숨길 수 있으니까 침투하기엔 딱 좋기도 하고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「わざわざ選管に入ったのも、何か企んでるのかと思ってたよ。星徒会を監視するにはちょうどいいポジションだからね」"
translation = "「일부러 선관에 들어온 것도 뭔가를 꾸미고 있어서인가 했지. 성도회를 감시하기엔 딱 좋은 위치니까」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そういうのじゃないよ～っ」"
translation = "「그런 거 아니라고~」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だよね。至る所が隙だらけで、潜入工作のプロフェッショナルには見えなかった。わざと隙を見せつけて、油断を誘ってるのかと思ったくらいだよ」"
translation = "「그렇겠지. 가는 곳마다 허점투성이라 잠입 공작의 프로페셔널로는 안 보였어. 일부러 허점을 내보여서 방심을 유도하는 건가 싶었을 정도야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ううん、考えすぎです……ただの素ですニャ……」"
translation = "「으응, 너무 많이 생각한 겁니다…… 그냥 본 모습이에요 냐……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うん、それもすぐ気づいた。脅威にはならないと確信したから、ボロが出るまで泳がせてたの」"
translation = "「응, 그것도 금방 알아챘어. 위협은 안 된다고 확신했으니까, 밑천이 드러날 때까지 지켜보고 있었던 거야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「何かやらかそうとしても、いつでも後ろから刺せたし、消そうと思えば３０回はチャンスがあったからね」"
translation = "「뭔가 사고를 치려고 해도, 언제든 뒤에서 찌를 수 있었고, 없애려고 마음만 먹었으면 30번은 기회가 있었으니까」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そんな風に思われてたの！？\u3000というか私、３０回も死んでたの！？」"
translation = "「그런 식으로 생각되고 있었던 거야!? 그보다 나, 30번이나 죽었던 거야!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうだよ。実際にはやらなかったんだから、優しい私に感謝してね」"
translation = "「그래. 실제로는 안 그랬으니까, 상냥한 나한테 감사하도록 해」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うん、ありがと──」"
translation = "「응, 고마─」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「って、あれ？\u3000今のってお礼言うところ……？」"
translation = "「앗, 어라? 방금 건 감사해야 할 부분인가……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「選管の仲間としてやっていく内に、隠している素性はともかく、性格は裏表のない筋金入りのお人好しだってわかった」"
translation = "「선관 동료로 지내는 동안, 숨기고 있는 신분이야 어쨌든, 성격은 겉과 속이 다른 데가 없는 뼛속까지 호인이라는 걸 알았어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「早とちりで消さなくてよかった、って今では思ってるよ」"
translation = "「성급하게 없애버리지 않아서 다행이다, 하고 지금은 생각하고 있어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん……。えへへ、ありがとう♪」"
translation = "「나타샤짱……. 에헤헤, 고마워♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「お礼言うところでもないよ。お人好しすぎるのも、良し悪しだし」"
translation = "「감사할 것도 아니야. 너무 호인인 것도 장단점이 있으니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「少なくとも私はベアトみたいなお人好しにはなれないよ。人と接する時は、まず最初に疑ってかかるべきと教わってきたからね」"
translation = "「적어도 나는 베아트 같은 호인은 될 수 없어. 사람을 대할 때는 우선 의심부터 하고 봐야 한다고 배워왔으니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「でもベアトのお人好しには助けられてる。意地っ張りなくせにメンタルよわよわな梨緒の面倒を見てくれるのもありがたいし」"
translation = "「하지만 베아트의 호인스러운 면 덕분에 도움받고 있어. 고집불통이면서 멘탈은 약하디약한 리오의 수발을 들어주는 것도 고맙고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「アポロともなんだかんだうまくやってるし、今はベアトのこと、信頼も尊敬もしてるよ」"
translation = "「아폴로하고도 뭐니 뭐니 해도 잘 지내고 있고, 지금은 베아트를 신뢰도 존경도 하고 있어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「選管にいてくれないと困るから、定期的にこっちに来て、みんなの面倒見てあげてよ」"
translation = ""

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あはは、ナターシャちゃんがそんなに褒めてくれるの初めてだね。嬉しいニャ」"
translation = "「아하하, 나타샤짱이 그렇게 칭찬해 주는 건 처음이네. 기쁘다 냐」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもね、私は優しいんじゃなくて、わがままニャだけだよ」"
translation = "「하지만 말이야, 나는 상냥한 게 아니라 제멋대로일 뿐이다 냐」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私はね、昔も、今も、自分が『そうしたいっ！\u3000そうあってほしいっ！』って方向に突き進んでるだけ」"
translation = "「나는 말이야, 예전에도 지금도 내가 『그러고 싶어! 그랬으면 좋겠어!』 하는 방향으로 돌진할 뿐이야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「これってすっごくわがままじゃない？」"
translation = "「이거 엄청 제멋대로 아니야?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふっ」"
translation = "「후후」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん？」"
translation = "「나타샤짱?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そう言って、いろいろ梨緒とかに世話焼いて、よその世界を守るために命かけてるじゃん」"
translation = "「그렇게 말하면서 이것저것 리오 같은 애들 챙겨주고, 다른 세계를 지키기 위해 목숨 걸고 있잖아」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そういうのを『優しい』って言うんだよ」"
translation = "「그런 걸 『상냥하다』고 하는 거야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そう……かな？」"
translation = "「그런……가?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でもそうだったら……嬉しいニャ♪」"
translation = "「하지만 그렇다면…… 기쁘다 냐♪」"

