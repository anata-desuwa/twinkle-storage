[[dialogue]]
speaker = "unk"
original = "ルネアの自動解析を待つ間、俺たちは海で水遊びをすることになった。"
translation = "루네아의 자동 해석을 기다리는 동안, 우리는 바다에서 물놀이를 하게 되었다."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「それじゃあ、会長！\u3000私と勝負よ！」"
translation = "「그럼, 회장님! 저랑 승부해요!」"

[[dialogue]]
speaker = "unk"
original = "受けて立つぞ！"
translation = "도전을 받아주지!"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「そういえば、ロロットちゃんのトントロ、どうやって浮いてるの、それ？」"
translation = "「그러고 보니, 로롯 양의 톤토로, 그건 어떻게 떠 있는 거야?」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「これはですね～、女神さんが特製の浮き輪を用意してくれたのですよ♪」"
translation = "「이건 말이죠~, 여신님이 특제 튜브를 준비해 준 거랍니다♪」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「その浮き輪を付けていると、重力を無視して、宙に浮くことができるのよ」"
translation = "「그 튜브를 끼고 있으면 중력을 무시하고 공중에 떠 있을 수 있단다」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「トントロさんの浮き輪姿、とっても可愛いわよね<emoji=heart04>」"
translation = "「톤토로 씨의 튜브 낀 모습, 정말 귀엽네<emoji=heart04>」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「って、わぷっ！？」"
translation = "「앗, 와폇!?」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「あ～あ～、余所見してるから～」"
translation = "「아~ 아~, 한눈을 파니까~」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「くっ……！\u3000会長に隙を突かれたわ……！」"
translation = "「큭……! 회장님에게 빈점을 찔렸다니……!」"

[[dialogue]]
speaker = "unk"
original = "いや、別に狙ったわけじゃないんだけど……"
translation = "아니, 딱히 노린 건 아닌데……"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「ルネアさんは、水着には着替えないの？」"
translation = "「루네아 씨는 수영복으로 안 갈아입나요?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「ふっ……マトイ、甘いわね」"
translation = "「후…… 마토이, 무르구나」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「女神の装束は、陸海空、全適正オールＳよ！」"
translation = "「여신의 의상은 육해공, 전 적성 올 S야!」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「シミュレーションＲＰＧかよ」"
translation = "「시뮬레이션 RPG냐고」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「それよりも、リアちゅわ～ん！\u3000水の滴る水着姿、セクシー過ぎるぜ～<emoji=heart04>」"
translation = "「그보다, 리아 쨔~앙! 물에 젖은 수영복 모습, 너무 섹시하다구~<emoji=heart04>」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「パーちゃん？\u3000褒めてくれるのは嬉しいけど、あんまり女の子の水着をジロジロ見ちゃ、めっだゾ？」"
translation = "「파~짱? 칭찬해 주는 건 기쁘지만, 너무 여자아이의 수영복을 빤히 보면 안 된단다?」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「はうっ！？\u3000もう堪らん<emoji=heart04>\u3000その瑞々しい果実にダイブ不可避だぜ、リアちゃ～ん<emoji=heart04>」"
translation = "「하읏!? 더는 못 참겠다구<emoji=heart04> 그 싱싱한 과실로 다이브 불가피라구, 리아 짱~<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「パーちゃん、ダメよ～？」"
translation = "「파~짱, 안돼요~?」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「バリヒメェっ！？」"
translation = "「발리히메에!?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「リアのおっぱいを触っていいのは、私だけよ～？」"
translation = "「리아의 가슴을 만져도 되는 건, 나뿐이란다~?」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「ヒエッ！？\u3000り、理事長、目が怖いぜ……！」"
translation = "「히익!? 이, 이사장님, 눈빛이 무섭다구……!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「いや、お姉ちゃんも別に触っていいわけじゃないからね！？」"
translation = "「아니, 언니도 딱히 만져도 되는 건 아니거든!?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「もう１人の私よ。水遊びをするなら、一緒にサーフィンでもどうだ？」"
translation = "「또 한 명의 나여. 물놀이를 할 거라면, 함께 서핑이라도 어떤가?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「おっ、いいわね～。ヘレナちゃんも私と同じで、得意ってわけね♪」"
translation = "「오, 좋은데~. 헬레나 찬도 나와 마찬가지로 잘하는 거구나♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ああ、鏡映しなのでな♪」"
translation = "「아아, 거울에 비친 모습이니까♪」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「サーフィン！\u3000私もやってみたいのです～♪」"
translation = "「서핑! 저도 해보고 싶은 것입니다~♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「おっ、ロロットちゃん、興味ある？\u3000じゃあ、みんなもやってみる～？」"
translation = "「오, 로롯 양, 관심 있어? 그럼 다 같이 해볼래~?」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「リアお姉様のサーフィン姿……！\u3000見てみたいかも……<emoji=heart04>」"
translation = "「리아 언니의 서핑 모습……! 보고 싶을 지도……<emoji=heart04>」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「えっ？\u3000私！？\u3000わ、私はその、お姉ちゃんと違って、サーフィンはあまり得意じゃないっていうか～」"
translation = "「에? 나!? 나, 나는 그, 언니랑 달라서 서핑은 그다지 잘하지 못한다고나 할까~」"

[[dialogue]]
speaker = "unk"
original = "俺、サーフィンは経験あるんで出来ますよ！"
translation = "나, 서핑은 해본 적 있어서 할 줄 알아!"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「えっ、会長、そうなの！？」"
translation = "「에, 회장님, 정말이야!?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「そういえば、前にリゾート結界に閉じ込められた時、リップルとフィオナさんに、みっちりスパルタで叩き込まれてたっけ……」"
translation = "「그러고 보니, 전에 리조트 결계에 갇혔을 때, 리플과 피오나 씨에게 철저하게 스파르타로 구르고 배웠었지……」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「ちょっと待って。前にも閉じ込められたことあるの？\u3000その話、めっちゃ気になるんだけど～！」"
translation = "「잠깐만. 전에도 갇힌 적이 있어? 그 이야기, 엄청 궁금한데~!」"

[[dialogue]]
speaker = "unk"
original = "そうして、しばらくみんなで水遊びをした後。"
translation = "그렇게, 한동안 다 같이 물놀이를 한 후."

[[dialogue]]
speaker = "unk"
original = "ロロットが「お腹が空いたのです～」と言ったのをきっかけに、ビーチでバーベキューを行うことになった。"
translation = "로롯이 「배가 고픈 것입니다~」라고 말한 것을 계기로, 비치에서 바비큐를 하게 되었다."

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「海の家がちゃんと機能してて、助かったわ♪」"
translation = "「바다의 집이 제대로 기능하고 있어서 다행이었어♪」"

[[dialogue]]
speaker = "unk"
original = "備えておいてくれたおかげだな"
translation = "대비해 두어 준 덕분이네"

[[dialogue]]
speaker = "unk"
original = "リップルがこういう時の為に"
translation = "리플이 이럴 때를 위해서"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「問題解決したら、後でお礼を言っとかないとね」"
translation = "「문제 해결되면, 나중에 감사 인사를 전해야겠네」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ヘレナちゃん同士が出会った記念に、カンパ～イ♪」"
translation = "「헬레나 찬끼리 만난 기념으로, 건~배♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「乾杯だ♪\u3000んくっ――♪」"
translation = "「건배다♪ 꿀꺽――♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「おっ、ヘレナちゃん、いい飲みっぷりじゃな～い♪」"
translation = "「오, 헬레나 찬, 마시는 기세가 좋은데~♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ぷはぁっ……<emoji=heart04>\u3000ふふっ、もうわかるだろうが、私も酒は強いぞ？」"
translation = "「푸하앗……<emoji=heart04> 후후, 이미 알고 있겠지만, 나도 술은 세다고?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そうこなくっちゃ～♪\u3000私も飲むわよ～♪」"
translation = "「그래야지~♪ 나도 마실 거라구~♪」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「ん～<emoji=heart04>\u3000お肉、とっても美味しいのです～♪」"
translation = "「음~<emoji=heart04> 고기, 정말 맛있는 것입니다~♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「は～い、次の焼けたよ～♪」"
translation = "「자~, 다음 거 구워졌어~♪」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「はいは～い！\u3000欲しいのです～♪」"
translation = "「네, 네~! 원하는 것입니다~♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「へい、ロロちゃんお待ち！\u3000ルネアのお皿も空いてるから、ほいっと♪」"
translation = "「자, 로로 양 기다렸지! 루네아의 접시도 비어 있으니까, 착♪」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「気が利くわね、ナナカ♪\u3000……ってこれ、お肉じゃなくて野菜じゃない！」"
translation = "「센스 있네, 나나카♪ ……잠깐 이거, 고기가 아니라 야채잖아!」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「私、ニンジンは要らないわよ！」"
translation = "「나, 당근은 필요 없다고!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「いやいや、女神様も好き嫌いはせず、野菜はしっかり食べないと～♪」"
translation = "「이거 참, 여신님도 편식하지 말고, 야채는 꼭 챙겨 먹어야죠~♪」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「む～っ、聖沙！\u3000ニンジンあげるわ！\u3000野菜スティックをよく食べてるでしょう！？」"
translation = "「으~응, 미사! 당근 줄게! 야채 스틱 자주 먹잖아!?」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「私！？\u3000確かに食べてるけど……あれはダイエットの為にというか～、ごにょごにょ……」"
translation = "「나!? 확실히 먹고는 있지만…… 그건 다이어트를 위해서라고나 할까~, 중얼중얼……」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「副会長さんは、本当はハンバーグやカレーとかが好きなのですよ～」"
translation = "「부회장님은 사실 햄버그나 카레 같은 걸 좋아하는 것이에요~」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ちょっ！？\u3000ロロットさん！\u3000そ、そんなんじゃないわよ！？」"
translation = "「잠깐!? 로롯 씨! 그, 그런 거 아니거든!?」"

[[dialogue]]
speaker = "unk"
original = "じゃあ、次の食事はカレーでも作ろっか？"
translation = "그럼, 다음 식사는 카레라도 만들까?"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「えっ！？\u3000会長も料理したりするの？」"
translation = "「에!? 회장님도 요리하거나 해?」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「――カレーは家でよく作ったりする？\u3000ふ、ふ～ん、そこもちょっと咲良クンに似てるのね……」"
translation = "「――카레는 집에서 자주 만들거나 해? 흠, 흐~응, 그 부분도 약간 사쿠라 군을 닮았네……」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「あっ、こっちの網でも、次のお肉焼けましたよ～」"
translation = "「앗, 이쪽 석쇠에서도 다음 고기 구워졌어요~」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「マトイちゃん、ありがと～♪」"
translation = "「마토이 양, 고마워~♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「というか、ナナカさんとマトイに焼肉奉行の座を取られてしまっているわ……！」"
translation = "「그보다, 나나카 씨와 마토이에게 고기 구이 주도권을 빼앗겨 버렸어……!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「マトイちゃん、両手それぞれで別の作業してるのすごいね～♪」"
translation = "「마토이 양, 양손으로 각각 다른 작업하고 있다니 대단하네~♪」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「あはは、実は私、両利きなんですよ～」"
translation = "「아하하, 사실 저, 양손잡이거든요~」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「両利きですって！？\u3000くっ……マトイ、やるわね……！」"
translation = "「양손잡이라고!? 큭…… 마토이, 제법인데……!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「マトイちゃん、口開けて？\u3000あ～ん♪」"
translation = "「마토이 양, 입 벌려봐? 아~앙♪」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「え？\u3000私にですか！？」"
translation = "「에? 저한테 말인가요!?」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「なっ……！？\u3000お姉様！？」"
translation = "「큭……!? 언니!?」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「マトイちゃんは両手塞がってるでしょ～？\u3000だから、先輩が食べさせてあげる♪\u3000ほら、あ～ん<emoji=heart04>」"
translation = "「마토이 양은 양손이 다 차 있잖아~? 그러니까, 선배가 먹여줄게♪ 자, 아~앙<emoji=heart04>」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「じ、じゃあ失礼して……あ～ん♪\u3000もぐもぐ……」"
translation = "「그, 그럼 실례해서…… 아~앙♪ 우물우물……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ふふっ、美味しい？」"
translation = "「후후, 맛있어?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「は、はい。美味しいです♪\u3000リア先輩、ありがとうございます♪」"
translation = "「네, 네. 맛있어요♪ 리아 선배, 감사합니다♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「くっ……！\u3000お、お姉様からあ～んしてもらえるなんて……羨ましい……！」"
translation = "「큭……! 어, 언니한테 아~앙을 받다니…… 부러워……!」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「リアちゃ～ん<emoji=heart04>\u3000俺もリアちゃんにあ～んしてもらいたいぜ～<emoji=heart04>」"
translation = "「리아 짱~<emoji=heart04> 나도 리아 짱한테 아~앙 받고 싶다구~<emoji=heart04>」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あっ、パーちゃん、お酒臭～い！\u3000もしかしなくても、飲んでるでしょ～？」"
translation = "「앗, 파~짱, 술 냄새나~! 혹시나 해서 말인데, 마셨지~?」"

[[dialogue]]
speaker = "unk"
original = "というか、パッキーって食事できるんだ"
translation = "그나저나, 패키는 식사할 수 있구나"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「おうよ！\u3000見た目はぬいぐるみだが、これは俺様が大昔に魔法で自作した『義体』だからな。ちゃんと食事を楽しめる機能があるんだぜ♪」"
translation = "「당연하지! 겉보기엔 인형이지만, 이건 이 몸이 먼 옛날에 마법으로 만든 『의체』니까 말이야. 제대로 식사를 즐길 수 있는 기능이 있다구♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「私ともたまにお酒飲んだりしてるわよね～」"
translation = "「나랑도 가끔 술 마시곤 하지~」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「長い時を過ごすのに、酒が飲めないのは辛すぎるからな～」"
translation = "「긴 세월을 보내면서 술도 못 마시는 건 너무 괴로우니까 말이야~」"

[[dialogue]]
speaker = "unk"
original = "もしかしてそれが機能を付けた理由……？"
translation = "혹시 그게 기능을 붙인 이유……?"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「ククク……あと見た目を可愛くしたのは、俺様が武器として使っていたパペットの女子ウケが良かったからなんだぜ……！」"
translation = "「쿠쿠쿠…… 그리고 겉모습을 귀엽게 한 건, 이 몸이 무기로 사용하던 파펫의 여자애들 인기가 좋았기 때문이다……!」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「そうすれば、俺様のことを可愛いって抱っこしてくれる女の子の胸に、合法的に触れるだろ～？」"
translation = "「그러면 이 몸을 귀엽다고 안아주는 여자애들의 가슴에 합법적으로 닿을 수 있잖아~?」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「このエロパンダ、動機が不純過ぎる……！」"
translation = "「이 음란 팬더, 동기가 너무 불순해……!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「確かに可愛いのが、悔しいわね……！」"
translation = "「확실히 귀여운 게 분하네……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふふっ、大賢者パッキー、なかなか面白い人物のようであるな」"
translation = "「후후, 대현자 패키, 제법 재미있는 인물인 것 같구나」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「！\u3000ヘレナちゃん、よければ俺様を、その大きな胸で抱いてくれてもいいんだぜ？」"
translation = "「! 헬레나 찬, 괜찮다면 이 몸을 그 커다란 가슴으로 안아줘도 된다구?」"

[[dialogue]]
speaker = "unk"
original = "キリッとした感じでポーズを取りながら言うパッキー。"
translation = "멋진 척 포즈를 취하며 말하는 패키."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「残念だが遠慮させてもらおう。こう見えて、私は身持ちは固い女なのでな」"
translation = "「아쉽지만 사양하도록 하지. 이래 봬도 나는 정조 관념이 철저한 여자라서 말이다」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そうだわ！\u3000ねぇねぇ、ヘレナちゃんは年上の男性が好みだったりする～？」"
translation = "「맞다! 저기 저기, 헬레나 찬은 연상의 남자가 취향이거나 해~?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「私、年上のオジサマが好みのタイプなのよ～♪」"
translation = "「나는 연상의 아저씨가 취향 스타일이라구~♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そこはあいにく、鏡映しのせいか、逆でな。私は年下の可愛い男がタイプなのだ」"
translation = "「그쪽은 안타깝게도 거울에 비친 탓인지 반대라서 말이지. 나는 연하의 귀여운 남자가 취향이다」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「え～？\u3000そうなの～！？」"
translation = "「에~? 그래~!?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「海外のアクション映画の俳優みたいに、渋くてダンディーなオジサマ、素敵だと思うんだけどな～♪」"
translation = "「해외 액션 영화 배우처럼, 중후하고 댄디한 아저씨, 멋지다고 생각하는데~♪」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「ああ～、確かにああいうカッコよさ、ちょっとわかるかも……」"
translation = "「아아~, 확실히 그런 멋짐, 조금은 알 지도……」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「！\u3000マトイちゃん、本当！？」"
translation = "「! 마토이 양, 정말!?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「え？\u3000ええ。私、映画は普通に観るので……」"
translation = "「에? 네. 저, 영화는 평범하게 보니까요……」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ああいう渋いオジサマって憧れるわよね～！」"
translation = "「그런 중후한 아저씨는 동경하게 되잖아~!」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「へ、ヘレナさん、近い！\u3000距離が近いです！」"
translation = "「헤, 헬레나 씨, 가까워요! 거리가 가깝습니다!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「え～？\u3000女の子同士なんだから、別にいいじゃな～い<emoji=heart04>」"
translation = "「에~? 여자애끼리인데, 상관없잖아~<emoji=heart04>」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "（う……ヘレナさん、すごい美人だから、くっ付かれるとなんかドキドキする……！）"
translation = "(으…… 헬레나 씨, 엄청 미인이라서 달라붙으면 왠지 두근거려……!)"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「異世界の私も、どうやら『絡み酒』のようであるな。ふふっ♪」"
translation = "「이세계의 나도 아무래도 『주정』이 있는 모양이군. 후후♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「魔王よ、ちゃんと肉を食べているか？\u3000よければヘレナちゃんが焼いてやるぞ♪」"
translation = "「마왕이여, 고기는 제대로 먹고 있나? 괜찮다면 헬레나 찬이 구워주마♪」"

[[dialogue]]
speaker = "unk"
original = "こ、こっちのヘレナちゃんも近い……！"
translation = "이, 이쪽 헬레나 찬도 가까워……!"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「もしかして、年下好きってそういうこと……！？」"
translation = "「혹시, 연하 좋아하는 게 그런 의미……!?」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「あっ、このお肉、もう焼けてますね！\u3000いただきなのです～♪」"
translation = "「앗, 이 고기, 이제 다 구워졌네요! 잘 먹겠습니다인 것입니다~♪」"

[[dialogue]]
speaker_original = "魔族"
speaker_translation = "마족"
original = "「イ～♪」"
translation = "「이~♪」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「って、あ～！？\u3000お肉が取られました～！？」"
translation = "「앗, 아~!? 고기를 빼앗겼습니다~!?」"

[[dialogue]]
speaker_original = "魔族"
speaker_translation = "마족"
original = "「もぐもぐ♪」"
translation = "「우물우물♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「魔族！？\u3000どうしてここに！？」"
translation = "「마족!? 어째서 여기에!?」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「！\u3000足元！\u3000なんか周りに黒い影が広がってない！？」"
translation = "「! 발밑! 왠지 주변에 검은 그림자가 펼쳐지고 있지 않아!?」"

[[dialogue]]
speaker_original = "魔族たち"
speaker_translation = "마족들"
original = "「イ～～！」"
translation = "「이~~!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「影から沢山魔族が湧いて来てる……！？」"
translation = "「그림자에서 수많은 마족이 솟아나오고 있어……!?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「すごい数……！\u3000これ、バーベキューのお肉じゃなくて、私たちを狙ってきてませんか……！？」"
translation = "「엄청난 수……! 이거 바비큐 고기가 아니라, 저희를 노리고 온 거 아닌가요……!?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「この魔族たちは、一体……？」"
translation = "「이 마족들은 대체……?」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「とりあえずここは――」"
translation = "「우선 여기는――」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「みんな、変身だよ！」"
translation = "「모두, 변신이야!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「はい！\u3000リア先輩！」"
translation = "「네! 리아 선배!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「新しい力の試し時だね！」"
translation = "「새로운 힘을 시험해 볼 때네!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「行きますよ～！」"
translation = "「갑니다~!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「――主に付き従い、楽園に降臨せよ燦然たる陽光の天使、トロピカルミエル！」"
translation = "「――주를 따르며, 낙원에 강림하라 찬란한 햇살의 천사, 트로피컬 미엘!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「――主と共に在り、天楼の稲光を以って引き穿て夏雷の天使、サマーエクラエル！」"
translation = "「――주와 함께 있으며, 천루의 벼락으로 뚫어라 여름 번개의 천사, 서머 에클라엘!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「――主へ託せ、秘められし乙女の煌姿を解き放つは灼海の天使、シーヴァルカネル！」"
translation = "「――주에게 맡겨라, 감춰진 소녀의 찬란한 모습을 해방하는 것은 작해의 천사, 시 발카넬!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「――主が召さるるは、透き通る海風に抱かれし碧涼の天使、リゾートスリセル！」"
translation = "「――주께서 부르시는 것은, 투명한 바닷바람에 품어진 벽량의 천사, 리조트 스리셀!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「変身完了なのです♪」"
translation = "「변신 완료인 것입니다♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「流星クルセイダース、水着フォームで見参、ってね♪」"
translation = "「유성 크루세이더즈, 수영복 폼으로 등장, 이란 말씀♪」"

[[dialogue]]
speaker = "unk"
original = "４人共、いつの間に……！？"
translation = "네 사람 다, 어느 사이에……!?"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「実はルネアちゃんが、リゾート結界を作る時に、いつでも水着に変身できて便利だからって、一緒に水着フォームも作ってくれたんだ」"
translation = "「사실 루네아 짱이 리조트 결계를 만들 때, 언제든 수영복으로 변신할 수 있으면 편리하니까 라면서 함께 수영복 폼도 만들어 준 거야」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「さあ――いざ尋常に、勝負よ！」"
translation = "「자―― 정정당당하게, 승부야!」"

[[dialogue]]
speaker = "unk"
original = "水着フォームへ変身した流星クルセイダースの４人と共に、俺たちは魔族との戦闘を開始するのだった。"
translation = "수영복 폼으로 변신한 유성 크루세이더즈 4명과 함께, 우리는 마족과의 전투를 개시했다."

