[[dialogue]]
speaker = "unk"
original = "ハロウィンが過ぎた後も、環は時々俺の家にやってきてギターの練習をしていた。"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ギターの練習をするときは、ちゃんとその格好になるんだな」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「だってその方が気分がアガるからね」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "その気持ちは分かる。気分のアガる格好の方が練習も捗るだろう。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "けど、よくよく見るとこの格好って……けっこう下半身に訴えてくる格好なんだよな……"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あれ？\u3000もしかして会長、いまボクのことやらしー目で見てなかった？」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……正直エッチだな、と思いながら見てました」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふーん、そうなんだ……じゃ、この格好のボクと、したいって思ってるの？」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それは、まあ……」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、そっか♪\u3000素直でよろしい♪\u3000その素直さに免じて……いいよ。この格好でしちゃっても……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そう言うと環は、俺の手を引っ張ってベッドに横たわった。"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは……すっごい足、広げられて……やらしー格好、させられちゃってるよ……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "片足を掴んで押し上げると、ショートパンツの開いたファスナーの内側に、愛液に濡れた割れ目が露出する。"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そんなやらしー格好をさせられて、環は興奮しちゃってるんだな」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「何言ってるのさ……興奮しちゃってるのはキミだって同じじゃないか……」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふふ……そーんなにおち○ちん……ぱんぱんに膨らませちゃってさ……」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だって環の格好がエロすぎるから……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "手軽にここからいつでも挿入してください、と言わんばかりのファスナー。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そんなの興奮しない方がおかしいというものだろう。"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふふふ……それ、ぶち込みたいんだ……。ボクのおま○こに……」"
translation = "「후후후…… 그거, 박아 넣고 싶은 거지……? 내 보지에……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「待ちきれないみたいに、ピクピクさせちゃって……会長のおち○ちん、かわいいなぁ……」"
translation = "「기다리지 못하겠다는 듯이, 씰룩거려 가지고…… 회장님의 자지, 귀엽네……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いいよ、挿れて……ボクのおま○こにねじ込んで、気持ちよくなって……んんっ……」"
translation = "「좋아, 넣어도…… 내 보지에 밀어 넣어서, 기분 좋아져 봐…… 응읏……」"

[[dialogue]]
speaker = "unk"
original = "俺を誘惑する言葉にたまらなくなって、ペニスの先端を花びらの中に潜らせる。"
translation = "나를 유혹하는 말에 참을 수 없게 되어, 음경의 끝부분을 꽃잎 사이에 밀어 넣는다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ぁ……んんんんっ……<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아…… 응응응읏……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "環の唇から、気持ちよさそうな声が漏れた。"
translation = "타마키의 입술에서, 기분 좋은 듯한 소리가 새어나왔다."

[[dialogue]]
speaker = "unk"
original = "同時に、俺のペニスを環の柔らかい膣襞が包み込んでくる。"
translation = "동시에, 내 음경을 타마키의 부드러운 질 벽이 감싸 안아 온다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あぁ、あ……あぁあ……会長の、おち○ちん……ボクのおま○こ、いっぱいにしちゃった……あはぁ……<emoji=heart04>」"
translation = "「아아, 아…… 아아아…… 회장님의, 자지…… 내 보지, 가득 채워 버렸어…… 아하아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「なんだか、声が嬉しそうだ……」"
translation = "「어쩐지, 목소리가 기뻐 보인다……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「だってさぁ……嬉しいに決まってるよ……んんっ……キミとひとつになってるんだから……<emoji=heart04>」"
translation = "「그야…… 기쁜 게 당연하잖아…… 응읏…… 너랑 하나가 되고 있으니까……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「身体も心も自然に悦んじゃうよ……ん……はぁあ……<emoji=heart04>」"
translation = "「몸도 마음도 자연스럽게 기뻐해 버려…… 응…… 하아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふふ……ボク、会長のことも、もっともっと気持ちよくしたいな……だから……んっ……」"
translation = "「후후…… 나, 회장님도 더욱더 기분 좋게 해주고 싶은걸…… 그러니까…… 응읏……」"

[[dialogue]]
speaker = "unk"
original = "環が力を込めると、結合部はもちろん膣全体がキュッと狭まる。"
translation = "타마키가 힘을 주자, 결합부는 물론 질 전체가 꽉 조여든다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはっ……おち○ちん締め付けちゃった……んんっ……<emoji=heart04>」"
translation = "「아핫…… 자지 조여 버렸다…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「これ、気持ちいいの？\u3000おち○ちん、締め付けられて気持ちいいんだ……<emoji=heart04>\u3000だったら、もっとしてあげる……んんっ……<emoji=heart04>」"
translation = "「이거, 기분 좋아? 자지, 조여져서 기분 좋은 거구나……<emoji=heart04> 그러면, 더 해 줄게…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぁ……あぁあ……環っ……！」"
translation = "「아…… 아아아…… 타마키……!」"

[[dialogue]]
speaker = "unk"
original = "環の与えてくれる刺激に耐えられなくなり、俺は刺激を求めてピストンを始める。"
translation = "타마키가 안겨주는 자극에 견딜 수 없어져, 나는 자극을 찾아 피스톤질을 시작한다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あっ……あ……あっ……んっ、あぁあ……もう……我慢、出来なかったんだね……んんっ……<emoji=heart04>」"
translation = "「앗…… 아…… 앗…… 응읏, 아아아…… 정말…… 참지, 못했구나…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「気持ちよく、なりたくて……動いちゃうんだ……んんっ、あっ……あ、ああっ……<emoji=heart04>」"
translation = "「기분 좋아지고, 싶어서…… 움직여 버리는구나…… 응응읏, 앗…… 아, 아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「おち○ちんが、ボクのおま○こをかき分けて……出たり入ったりして……気持ちよくなろうとしてる……んんっ……<emoji=heart04>」"
translation = "「자지가, 내 보지를 헤집고…… 나왔다 들어갔다 하면서…… 기분 좋아지려고 하고 있어…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「どう？\u3000ボクのおま○こ、気持ちいい……？\u3000おち○ちんシコシコして、気持ちいい……？」"
translation = "「어때? 내 보지, 기분 좋아……? 자지 문질러서, 기분 좋아……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああ……すごく、気持ちいい……環……んんっ……」"
translation = "「아아…… 엄청, 기분 좋아…… 타마키…… 응응읏……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはっ……んんっ……ふ……んんっ……切なそうな顔、しちゃって……好きだなぁ……ボク、その顔、大好きなんだぁ……<emoji=heart04>」"
translation = "「아핫…… 응응읏…… 후…… 응응읏…… 애타는 표정, 지어 가지고…… 좋네…… 나, 그 표정, 정말 좋아해……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボクに夢中になってる顔……おち○ちん、気持ちよくて……もっともっと気持ちよくなりたくて……苦しそうにしてる顔……<emoji=heart04>」"
translation = "「나한테 빠져 있는 표정…… 자지, 기분 좋아서…… 더욱더 기분 좋아지고 싶어서…… 괴로워하는 표정……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それがどんどん荒々しくなって……欲望、むき出しにして……ボクのこと、求めてくるんだ……んんっ、は、ぁあ……<emoji=heart04>」"
translation = "「그게 거칠어져 가면서…… 욕망을, 거침없이 드러내고…… 나를, 원해 오네…… 응응읏, 하, 아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「全部、ぶつけて……んんっ、あ……ああぁっ……<emoji=heart04>\u3000ボク、受け止めるから……会長の大好きなおま○こで……<emoji=heart04>」"
translation = "「전부, 부딪쳐 줘…… 응응읏, 아…… 아아앗……<emoji=heart04> 내가, 받아들일 테니까…… 회장님이 정말 좋아하는 보지로……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あっ、あ、ああ……ん、あぁあ、はぁ……んぅ、くぅん、ん、はぁ……<emoji=heart04>\u3000はぁ、あ、ああ……あっ、あっ、あ、ああっ……<emoji=heart04>」"
translation = "「앗, 아, 아아…… 응, 아아아, 하아…… 응으, 큭, 응, 하아……<emoji=heart04> 하아, 아, 아아…… 앗, 앗, 아, 아앗……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "心地よさに酔ったような環の言葉に、更に欲望が高まる。"
translation = "쾌감에 취한 듯한 타마키의 말에, 더욱 욕망이 고조된다."

[[dialogue]]
speaker = "unk"
original = "奥までしっかり届くように、ペニスを根元まで繰り返し押し込む。"
translation = "깊은 곳까지 확실히 닿도록, 음경을 뿌리까지 반복해서 밀어 넣는다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「はぁ、あっ……<emoji=heart04>\u3000んんっ……ん、んぅう……そんなに、されたらぁ……<emoji=heart04>」"
translation = "「하아, 앗……<emoji=heart04> 응응읏…… 응, 응으으…… 그렇게, 당하면……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、あ、んっ、あっ、あ、ああ……<emoji=heart04>\u3000はぁ、あ、ああ……や、んぅう……おかしく、なっちゃうぅ……んんんっ……<emoji=heart04>」"
translation = "「아, 아, 응읏, 앗, 아, 아아……<emoji=heart04> 하아, 아, 아아…… 야, 응으으…… 이상해져, 버려…… 응응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「会長の、たくましいおち○ちん……ボクの１番奥まで届いて……んんっ……<emoji=heart04>\u3000あ、あぁあ……何も考えられなくなっちゃうよぉ……<emoji=heart04>」"
translation = "「회장님의, 늠름한 자지…… 내 가장 깊은 곳까지 닿아서…… 응응읏……<emoji=heart04> 아, 아아아…… 아무것도 생각할 수 없게 되어 버려……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ずんっ、ずんって……頭の中、揺らされてる感じぃ……んんっ……それがいいの……気持ちいいのっ……あ、ああっ……<emoji=heart04>」"
translation = "「쿵, 쿵 하고…… 머릿속이, 흔들리는 느낌…… 응응읏…… 그게 좋아…… 기분 좋아…… 아, 아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そのまま、どこまでも気持ちよくしてやるからな……」"
translation = "「그대로, 어디까지고 기분 좋게 해 줄 테니까……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん……して……意識、飛んじゃうくらい……ボクのこと、気持ちよくして……<emoji=heart04>\u3000激しく求められたいの……キミに……んんっ……<emoji=heart04>」"
translation = "「응…… 해줘…… 정신이, 날아갈 정도로…… 나를, 기분 좋게 해줘……<emoji=heart04> 격렬하게 원해지고 싶어…… 너한테…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あぁ、お望みどおりにっ……！」"
translation = "「아아, 바라는 대로……!」"

[[dialogue]]
speaker = "unk"
original = "緩やかに滑らせるような動きから、乱暴に突くような動きに変化させる。"
translation = "부드럽게 미끄러지듯 움직이던 동작에서, 거칠게 찌르는 듯한 움직임으로 변화시킨다."

[[dialogue]]
speaker = "unk"
original = "すると環の声色が、快感の度合を示すように高まった。"
translation = "그러자 타마키의 목소리가, 쾌감의 정도를 나타내듯 높여졌다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ああっ、あっ、あっ……<emoji=heart04>\u3000んっ、あっ、あっ、あ、ああ、あっ……<emoji=heart04>\u3000あ、あぁあ、んっ、あっ、ああんっ……<emoji=heart04>」"
translation = "「아앗, 앗, 앗……<emoji=heart04> 응읏, 앗, 앗, 아, 아아, 앗……<emoji=heart04> 아, 아아아, 응읏, 앗, 아앙읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「太くて、熱くて、たくましいのっ<emoji=heart04>\u3000おま○この奥に、叩きつけられてるよっ……<emoji=heart04>\u3000あっ、あ、ああぁあ、あっ、ああっ……<emoji=heart04>」"
translation = "「굵고, 뜨겁고, 늠름한 게<emoji=heart04> 보지 깊은 곳에, 내리쳐지고 있어……<emoji=heart04> 앗, 아, 아아아, 앗, 아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そこっ、弱い、のっ、ん、んんぅうっ……<emoji=heart04>\u3000キミに開発されて、感じるようになった場所っ……あ、ああっ……<emoji=heart04>」"
translation = "「거기, 약해, 응, 응응으읏……<emoji=heart04> 너한테 개발당해서, 느끼게 된 곳…… 아, 아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「はあっ、あっ、あ、ああっ<emoji=heart04>\u3000容赦なく、攻めちゃうんだ……ボクのこと、いっぱい感じさせたくてっ……んっ、あっ、あ、あああっ……<emoji=heart04>」"
translation = "「하앗, 앗, 아, 아앗<emoji=heart04> 사정없이, 공략하는구나…… 나를, 가득 느끼게 하고 싶어서…… 응읏, 앗, 아, 아아앗……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "何度も肌を重ね合わせてきた。"
translation = "몇 번이고 살을 겹쳐 왔다."

[[dialogue]]
speaker = "unk"
original = "だから、環の気持ちいい場所もいろいろ分かってきている。"
translation = "그렇기에, 타마키의 기분 좋은 위치도 여러 가지로 알아가고 있다."

[[dialogue]]
speaker = "unk"
original = "その部分をしっかり刺激するように、俺は力強いピストンを繰り出した。"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あぁあ、あっ……<emoji=heart04>\u3000んくぅ、うっ、あっ……そんなに、されたら……スイッチ入っちゃうよぉ……んんっ……<emoji=heart04>」"
translation = "「아아아, 앗……<emoji=heart04> 응쿠, 읏, 앗…… 그렇게, 당하면…… 스위치 들어가 버려…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「喘ぎ声、止められなくなってっ……あっ、あぁあっ……発情してるみたいに、喘いじゃうっ……あ、あ、あぁああっ……<emoji=heart04>」"
translation = "「신음 소리, 멈출 수 없게 돼서…… 앗, 아아앗…… 발정한 것처럼, 신음해 버려…… 아, 아, 아아아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いいよ、環の感じてる声、もっと聞きたいから……」"
translation = "「좋아, 타마키가 느끼는 목소리, 더 듣고 싶으니까……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「やぁあ、んんっ……恥ずかしいもん……下品な声、会長に聞かせたくない……んんうっ……<emoji=heart04>」"
translation = "「싫어, 응응읏…… 부끄러운걸…… 천박한 목소리, 회장님한테 들려주고 싶지 않아…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「でもっ、抑えられないよっ、んっ、あっ、ああっ……<emoji=heart04>\u3000だって、おち○ちん、すごいんだもんっ……<emoji=heart04>\u3000おち○ちんが悪いんだよぅっ……<emoji=heart04>」"
translation = "「하지만, 억누를 수 없어, 응읏, 앗, 아앗……<emoji=heart04> 그야, 자지가, 대단한걸……<emoji=heart04> 자지가 나쁜 거야……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボクのおま○こ、簡単に気持ちよくしちゃう、悪いおち○ちん……えへへ……好きぃ……悪い子だけど、でも、気持ちよくしてくれるから好きぃ……<emoji=heart04>」"
translation = "「내 보지, 간단하게 기분 좋게 만들어 버리는, 나쁜 자지…… 에헤헤…… 좋아…… 나쁜 아이지만, 그래도, 기분 좋게 해주니까 좋아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "唇を緩め、微かに微笑みながら訴えてくる。"
translation = "입술을 풀고, 희미하게 미소 지으며 호소해 온다."

[[dialogue]]
speaker = "unk"
original = "俺は環の大好きな悪いおち○ちんで、更に激しくおま○こをこすり立てた。"
translation = "나는 타마키가 정말 좋아하는 나쁜 자지로, 더욱 격렬하게 보지를 문질러 대었다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あっ、ああ、あっ、あっ、んんっ<emoji=heart04>\u3000あぁあ、んぅ、う、あっ、あっ、あ、ああっ<emoji=heart04>\u3000はぁ、あ、あああっ<emoji=heart04>」"
translation = "「앗, 아아, 앗, 앗, 응응읏<emoji=heart04> 아아아, 응으, 으, 앗, 앗, 아, 아앗<emoji=heart04> 하아, 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "結合部からは水音が淫靡な響きを奏でている。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "それは環の興奮がずっと高まり続けていることを示しているようだった。"
translation = "그것은 타마키의 흥분이 계속 높아지고 있음을 나타내는 듯했다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「環……環っ……！」"
translation = "「타마키…… 타마키……!」"

[[dialogue]]
speaker = "unk"
original = "愛しさがあふれて来て、たまらず俺は環の名前を繰り返し呼んでしまう。"
translation = "사랑스러움이 넘쳐흘러, 참지 못하고 나는 타마키의 이름을 반복해서 부르고 만다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あぁあんっ……名前、耳元で囁くの、だめだってぇ……<emoji=heart04>」"
translation = "「아아앙읏…… 이름, 귓가에서 속삭이는 거, 안 된다니까……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「気持ち、ぐちゃぐちゃになっちゃうっ……<emoji=heart04>\u3000あっ、あ、あああっ……は、んんっ、や、あぁあっ……<emoji=heart04>」"
translation = "「기분, 엉망진창이 되어 버려……<emoji=heart04> 앗, 아, 아아앗…… 하, 응응읏, 야, 아아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あぁあっ、んんっ……ボクも、キミのこと、好きっ<emoji=heart04>\u3000大好きだよっ<emoji=heart04>\u3000会長っ、あっ、あ、あぁあっ、んっ、あっ、あああっ<emoji=heart04>」"
translation = "「아아앗, 응응읏…… 나도, 너, 좋아<emoji=heart04> 정말 좋아해<emoji=heart04> 회장님, 앗, 아, 아아앗, 응읏, 앗, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺の言葉に応えるように、環も繰り返す。"
translation = "내 말에 응답하듯, 타마키도 반복한다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あっ、ああっ、す、好きっ、んんっ、好きっ、好きぃっ、んんんっ、大好きぃっ<emoji=heart04>」"
translation = "「앗, 아앗, 좋, 좋아, 응응읏, 좋아, 좋아, 응응응읏, 정말 좋아해<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「好きって気持ち、収まりきらなくてっ<emoji=heart04>\u3000爆発しそうになってるよっ<emoji=heart04>\u3000んんぅっ、ん、あぁあ、あ、あああっ<emoji=heart04>」"
translation = "「좋아한다는 마음, 다 담지 못해서<emoji=heart04> 폭발할 것 같아졌어<emoji=heart04> 응응읏, 응, 아아아, 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「言葉からだけじゃなくて、身体にもっ、教え込まれてるみたいっ<emoji=heart04>\u3000おま○この奥っ、突かれるたびにっ<emoji=heart04>\u3000ボクが会長のこと好きだってこと分からされちゃってるっ<emoji=heart04>」"
translation = "「말뿐만 아니라, 몸에도, 아예 새겨지는 것 같아<emoji=heart04> 보지 깊은 곳, 찔릴 때마다<emoji=heart04> 내가 회장님을 좋아한다는 걸 알게 돼 버려<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「はぁ、あっ、あっ<emoji=heart04>\u3000もっと、教え込んでっ、ボクの心にも、身体にもっ……ボクが会長が好きだってこと教え込んでっ<emoji=heart04>」"
translation = "「하아, 앗, 앗<emoji=heart04> 더, 새겨줘, 내 마음에도, 몸에도…… 내가 회장님을 좋아한다는 걸 가르쳐줘<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あぁあっ、んっ、あっ、好きっ、好きすぎるよぉっ<emoji=heart04>\u3000ああっ、んっ、もうっ、好きっ、好き、好きぃっ<emoji=heart04>\u3000キミのこと、大好きなんだよぉっ<emoji=heart04>」"
translation = "「아아앗, 응읏, 앗, 좋아, 너무 좋아해<emoji=heart04> 아앗, 응읏, 정말, 좋아, 좋아, 좋아<emoji=heart04> 너를, 정말 좋아해<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「はぁ、あっ<emoji=heart04>\u3000会長のことっ、もっと好きって言いたいよぉっ<emoji=heart04>\u3000キミのこと、好きって叫びながら絶頂したいよぉっ……んんっ……<emoji=heart04>」"
translation = "「하아, 앗<emoji=heart04> 회장님을, 더 좋아한다고 말하고 싶어<emoji=heart04> 너를, 좋아한다고 외치면서 절정하고 싶어…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ゾクリと背筋が震える。"
translation = "소름이 돋듯 등줄기가 떨린다."

[[dialogue]]
speaker = "unk"
original = "大好きな女の子に、大好きと叫ばれながら絶頂してもらえたら……どれだけ嬉しいことだろう。"
translation = "정말 좋아하는 여자아이에게, 정말 좋아한다고 외쳐지면서 절정해 준다면…… 얼마나 기쁠까."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「叫んでくれよ……俺のこと好きって言いながらイッてくれ……」"
translation = "「외쳐줘…… 나를 좋아한다고 말하면서 싸줘……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「んっ、うんっ……ボク、イクねっ……んんっ<emoji=heart04>\u3000会長のこと、好きって言いながら、イクっ……んんっ、あっ、あ、あああっ<emoji=heart04>」"
translation = "「응읏, 응…… 나, 갈게…… 응응읏<emoji=heart04> 회장님을, 좋아한다고 말하면서, 갈게…… 응응읏, 앗, 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「はぁ、う、あ、ああっ、んっ、あああっ<emoji=heart04>\u3000あ、あ、あっ、あ、んんっ、あっ、あぁあ、あ、あああっ<emoji=heart04>」"
translation = "「하아, 으, 아, 아앗, 응읏, 아아앗<emoji=heart04> 아, 아, 앗, 아, 응응읏, 앗, 아아아, 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "徐々に絶頂に向かって、環が昇り詰めていくのが分かる。"
translation = "서서히 절정을 향해, 타마키가 올라가는 것을 알 수 있다."

[[dialogue]]
speaker = "unk"
original = "声が、表情が、膣の締め付けが、そして時折、ビクンビクンと震える全身がそれを伝えていた。"
translation = "목소리가, 표정이, 질의 조임이, 그리고 때때로 경련하듯 떨리는 전신이 그것을 전하고 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はぁ、ぁ……環っ……好きだ……好きだっ……！」"
translation = "「하아, 아…… 타마키…… 좋아해…… 좋아한다……!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、あっ、んんっ、あっ、ああ……あっ、あ、あああっ<emoji=heart04>\u3000はぁ、あっ、ボクもっ、好きっ、好きっ、好きぃっ……んんっ、あっ、ああんっ<emoji=heart04>」"
translation = "「아, 앗, 응응읏, 앗, 아아…… 앗, 아, 아아앗<emoji=heart04> 하아, 앗, 나도, 좋아, 좋아, 좋아…… 응응읏, 앗, 아앙읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "あふれんばかりの愛情を互いにぶつけ合いながら、俺と環は理性のタガが外れたように求め合う。"
translation = "넘쳐흐를 듯한 애정을 서로 부딪치며, 나와 타마키는 이성의 고삐가 풀린 것처럼 서로를 원한다."

[[dialogue]]
speaker = "unk"
original = "肌と肌を打ち付けながら、一気に解き放つ最後の瞬間まで欲望を抑え込む。"
translation = "살과 살을 부딪치며, 한꺼번에 해방할 마지막 순간까지 욕망을 억누른다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ああっ、あっ、んっ、あっ、あ……んんっ、もう、イクっ……会長っ、ボク、ボクっ……もう、イッ、ちゃうっ、あ、あああっ……！」"
translation = "「아앗, 앗, 응읏, 앗, 아…… 응응읏, 이제, 가…… 회장님, 나, 나…… 이제, 가, 버려, 아, 아아앗……!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あっ、あっ、あっ、あ、あ、あああっ！\u3000んんっ、あっ、あ、あぁあ、んっ、あ、あぁああっ！」"
translation = "「앗, 앗, 앗, 아, 아, 아아앗! 응응읏, 앗, 아, 아아아, 응읏, 아, 아아아앗!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「かい、ちょうっ、すきっ、んっ、あっ、あ、あ、ああ、あっ！\u3000すき、すきっ、だいすきぃっ、んんっ、あっ、あ、ふぁ、あ、ああっ！」"
translation = "「회, 장님, 좋아, 응읏, 앗, 아, 아, 아아, 앗! 좋아, 좋아, 정말 좋아, 응응읏, 앗, 아, 하아, 아, 아앗!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「んっ、あっ、ああ……んんっ……もう、イクっ、よ……ボクっ、もうっ、イクっ、イッちゃうっ……んんんっ……！！」"
translation = "「응읏, 앗, 아아…… 응응읏…… 이제, 갈게…… 나, 이제, 갈게, 가 버려…… 응응응읏……!!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ぁあっ！\u3000あぁああああああーーーーーーっ！！！」"
translation = "「아앗! 아아아아아아아아ーーーーーー잇!!!」"

[[dialogue]]
speaker = "unk"
original = "環の絶頂の叫びと共に、俺は膣内で白濁液をほとばしらせる。"
translation = "타마키의 절정의 외침과 함께, 나는 질내에 백탁액을 분출시킨다."

[[dialogue]]
speaker = "unk"
original = "愛情で埋め尽くさんばかりに、何度も何度も脈動させ、熱い液体で環の内側を満たしていく。"
translation = "애정으로 가득 채우듯, 몇 번이고 맥동시키며, 뜨거운 액체로 타마키의 안쪽을 채워 간다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あっ、あぁあ……かい、ちょお……んんっ……熱いの……ドクドクって……注がれててっ……<emoji=heart04>」"
translation = "「앗, 아아아…… 회, 장님…… 응응읏…… 뜨거워…… 꿀럭꿀럭 하고…… 쏟아져서……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「すごく、あったかいよぉ……会長ぉ……好きぃっ……<emoji=heart04>」"
translation = "「엄청, 따뜻해…… 회장님…… 좋아해……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "恍惚とした表情を浮かべながら、環は俺の吐き出したものを嬉しそうに受け止める。"
translation = "황홀한 표정을 지으며, 타마키는 내가 뿜어낸 것을 기쁜 듯이 받아들인다."

[[dialogue]]
speaker = "unk"
original = "何度も「好き」を繰り返しながら──"
translation = "몇 번이고 「좋아해」를 반복하면서──"

[[dialogue]]
speaker = "unk"
original = "やがて全てを出し尽くし、俺は環の中に埋まっていたペニスをゆっくりと引き抜く。"
translation = "이윽고 모든 것을 쏟아내고, 나는 타마키의 안에 묻혀 있던 음경을 천천히 빼낸다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あぁううっ……んんぅう……<emoji=heart04>」"
translation = "「아아으으읏…… 응응으으……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "充血した花びらの内側から、トロリとした白い液体があふれ出る。"
translation = "충혈된 꽃잎 안쪽에서, 걸쭉한 하얀 액체가 흘러나온다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「んくぅ……ふふ……お腹のなか……会長ので、いっぱいだよ……んんっ……<emoji=heart04>」"
translation = "「응쿠…… 후후…… 배 속…… 회장님 거로, 가득이야…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ホントはイッた瞬間にも、好きって叫びたかったけど……あはは……そんな余裕なかったよ……」"
translation = "「사실은 간 순간에도, 좋아한다고 외치고 싶었지만…… 아하하…… 그럴 여유가 없었어……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「気持ちはちゃんと伝わって来たよ……」"
translation = "「마음은 제대로 전달되었어……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「本当かな？\u3000だとしたら嬉しいけど……」"
translation = "「정말일까? 그렇다면 기쁘지만……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「でも、会長からの気持ちは……ここに……いーっぱいもらったから……ボクは満足かな……<emoji=heart04>」"
translation = "「하지만, 회장님의 마음은…… 여기에…… 가ー득 받았으니까…… 나는 만족할지도……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "下腹部を撫でながら、環は幸せそうに呟く。"
translation = "아랫배를 문지르며, 타마키는 행복한 듯 중얼거린다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あぁ、もう……そうやって……！」"
translation = "「아아, 정말…… 그렇게……!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「え、どうしたのさ……？」"
translation = "「에, 왜 그래……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「環が可愛すぎて困ってるんだよ！\u3000そんなこと言われたら……」"
translation = "「타마키가 너무 귀여워서 곤란하다고! 그런 소릴 들으면……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「……言われたら何なの？\u3000またしたくなっちゃう、とでも言いたいのかな……？」"
translation = "「……들으면 뭐? 또 하고 싶어진다, 라고라도 말하고 싶은 걸까나……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふふふっ……♪\u3000いいよ、ボクも、まだまだいっぱい欲しいから♪」"
translation = "「후후훗……♪ 좋아, 나도, 아직아직 가득 원하니까♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「何度だってしよ？\u3000会長の愛情が枯れてなくなっちゃうまで♪」"
translation = "「몇 번이고 하자? 회장님의 애정이 마르고 없어질 때까지♪」"

[[dialogue]]
speaker = "unk"
original = "環への愛情が枯れてなくなる、なんてことは無いのだが……"
translation = "타마키를 향한 애정이 마르고 없어지는, 일 따위는 없겠지만……"

[[dialogue]]
speaker = "unk"
original = "とりあえず俺は欲望のままに環を抱きしめ、２回戦目に突入したのだった。"
translation = "우선 나는 욕망대로 타마키를 안아 올리고, 2회전에 돌입했던 것이었다."

