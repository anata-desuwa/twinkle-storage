[[dialogue]]
speaker = "unk"
original = "第３話,ダブルヘレナと大人の飲み会,P"
translation = "제3화, 더블 헬레나와 어른의 술자리, P"

[[dialogue]]
speaker = "unk"
original = "その日、こちらの世界のヘレナちゃんの提案で、『大人の飲み会』が開かれることになった。"
translation = "그날, 이쪽 세계의 헬레나짱의 제안으로, 『어른의 술자리』가 열리게 되었다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「わざわざ他の人たちにも声をかけてくれてありがとね、ヘレナちゃん♪」"
translation = "「일일이 다른 사람들에게도 말을 걸어줘서 고마워, 헬레나짱♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「気にするな。せっかく飲み会をするのならば、賑やかな方が好みであろう？」"
translation = "「신경 쓰지 마라. 모처럼 술자리를 가질 거라면, 시끌벅적한 편이 취향 아니겠나?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「さっすが、異世界の私♪\u3000わかってるわね～」"
translation = "「역시나, 이세계의 나♪ 잘 알고 있네~」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「というわけで――今回は『酒飲み三銃士』を呼んでおいたぞ」"
translation = "「그런 고로 ──이번에는 『애주가 삼총사』를 불러두었다」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「酒飲み三銃士？」"
translation = "「애주가 삼총사?」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「ふふっ♪\u3000本日はお招き頂きましてありがとうございます、ヘレナ様♪」"
translation = "「후훗♪ 오늘은 초대해 주셔서 감사합니다, 헬레나 님♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「まずは、自らの人形を作り出す能力によって、酔えば交代してリセットができるマリオン・ネイマール」"
translation = "「우선은, 자신의 인형을 만들어내는 능력에 의해, 취하면 교대해서 리셋을 할 수 있는 마리온 네이마르」"

[[dialogue]]
speaker_original = "リコリンフィア"
speaker_translation = "리코린피아"
original = "「異世界のヘレナと酒が飲めるとは、面白いな。今日はよろしく頼む」"
translation = "「이세계의 헬레나와 술을 마실 수 있다니, 흥미롭군. 오늘 잘 부탁한다」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「続いて、毒を操る星騎士で、体内のアルコールを自在に分解できるリコリンフィア」"
translation = "「이어서, 독을 다루는 성기사로, 체내의 알코올을 자재로 분해할 수 있는 리코린피아」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「ええっと……ヘレナ理事長？\u3000『酒飲み三銃士』って呼び名、初めて聞いたんですけど……」"
translation = "「어 그러니까…… 헬레나 이사장님? 『애주가 삼총사』라는 호칭, 처음 들었는데요……」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そして、新星学園の教師で、どれだけ酔っても短時間で自動回復できる特殊体質の、トワちゃん先生だ」"
translation = "「그리고, 신성학원의 교사로, 아무리 취해도 단시간에 자동 회복할 수 있는 특수 체질의, 토와짱 선생님이다」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「わお♪\u3000みんな可愛い子ばっかり♪」"
translation = "「와오♪ 다들 귀여운 아이들뿐♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ちなみに３人共、実はこう見えて、お前より年上なのだぞ」"
translation = "「참고로 3명 다, 사실 이렇게 보여도, 너보다 연상이라네」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「えっ！？\u3000そうなの！？\u3000こんなに可愛いのに！？」"
translation = "「에!? 그래!? 이렇게나 귀여운데!?」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「ふふっ♪\u3000異世界のヘレナ様も、とてもお可愛らしいですよ<emoji=heart04>」"
translation = "「후훗♪ 이세계의 헬레나 님도, 대단히 귀여우신걸요<emoji=heart04>」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「いや～、可愛いって言われると照れるな～……えへへへ<emoji=heart04>」"
translation = "「이야~, 귀엽다는 말을 들으니 부끄럽네~…… 에헤헤헤<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ごめんなさい！\u3000先輩方相手にタメ口を使っちゃって、失礼しました～」"
translation = "「죄송해요! 선배님들을 상대로 말을 놓아버려서, 실례했습니다~」"

[[dialogue]]
speaker_original = "リコリンフィア"
speaker_translation = "리코린피아"
original = "「いや、別に構わんさ。こちらの世界のヘレナと同じように接した方が、私としても楽だからな」"
translation = "「아니, 딱히 상관없단다. 이쪽 세계의 헬레나와 똑같이 대하는 편이, 나로서도 편하니까 말이지」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「ふふっ、私は普段からこんな喋り方ですが、ヘレナ様はどうぞ自然体で話されて下さい。その方がよりお可愛らしいでしょうから♪」"
translation = "「후훗, 저는 평소에도 이런 말투입니다만, 헬레나 님은 부디 자연스럽게 이야기해 주세요. 그 편이 한층 더 귀여우실 테니까요♪」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「私にもあんまり気にしなくて大丈夫だよ～。これから一緒に仲良く、お酒飲むんだしね♪」"
translation = "「나한테도 그다지 신경 쓰지 않아도 괜찮아~. 이제부터 함께 사이좋게, 술 마실 거기도 하고♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「先輩方、優しい～♪\u3000じゃあお言葉に甘えて、今日はよろしくお願いしますね～♪」"
translation = "「선배님들, 상냥해~♪ 그럼 호의에 상응하여, 오늘은 잘 부탁드립니다~♪」"

[[dialogue]]
speaker = "unk"
original = "そうして、大人の飲み会が始まって少し経つ頃には、ヘレナはすっかり３人と打ち解けていた。"
translation = "그렇게, 어른의 술자리가 시작되고 조금 지났을 즈음에는, 헬레나는 완전히 3명과 스스럼없이 친해져 있었다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ぷはぁ～っ♪\u3000みんな、お酒が強くてすごく楽しいわ～♪」"
translation = "「푸하~♪ 다들, 술이 세서 너무 즐거워~♪」"

[[dialogue]]
speaker_original = "リコリンフィア"
speaker_translation = "리코린피아"
original = "「どうやら、異世界のヘレナも、こっちのヘレナと同じく大した『酒豪』のようだな」"
translation = "「아무래도, 이세계의 헬레나도, 이쪽의 헬레나와 마찬가지로 대단한 『애주가』인 모양이군」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむ。酒の好みは少々違っていたりするがな」"
translation = "「음. 술 취향은 약간 다르긴 하지만 말이다」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ、男の好みもね～。これも、ヘレナちゃんの言っていた『鏡映し』ってやつなのかしら？」"
translation = "「후훗, 남자 취향도 말이지~. 이것도, 헬레나짱이 말했던 『거울 비추기』라는 것일까나?」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「こちらの世界のヘレナ様は、私と同じで年下の可愛い子がお好みでしたね♪」"
translation = "「이쪽 세계의 헬레나 님은, 저와 마찬가지로 연하의 귀여운 아이가 취향이었지요♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「え～、マリオンちゃんもそうなの～？\u3000私は渋くてダンディーな年上のオジサマ派なんだけどな～。リコリンちゃんと、トワちゃんは？」"
translation = "「에~, 마리온짱도 그래~? 나는 묵직하고 단디한 연상의 아저씨 파인데~. 리코린짱이랑, 토와짱은?」"

[[dialogue]]
speaker_original = "リコリンフィア"
speaker_translation = "리코린피아"
original = "「私はこれまであまり恋愛は考えたことがなかったが……最近は、年下もアリかと思い始めていてな。トワもそうだろう？」"
translation = "「나는 지금까지 그다지 연애는 생각해 본 적이 없었다만…… 최근에는, 연하도 괜찮지 않을까 생각하기 시작해서 말이지. 토와도 그렇겠지?」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「えっ！？\u3000いやいや、私は教師だからね！？\u3000と、年下好きっていうのは色々と問題があるというか～」"
translation = "「에!? 아니아니, 나는 교사라구!? 연, 연하를 좋아한다는 건 여러 가지로 문제가 있다고나 할까~」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「あらら、トワちゃん、反応でバレバレよ～？」"
translation = "「어라라, 토와짱, 반응으로 훤히 다 보여~?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「でもそっか～、年上好きは私だけかぁ～。残念～」"
translation = "「그렇지만 그런가~, 연상 좋아하는 건 나뿐인가~. 아쉬워~」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「もう１人の私のそれは、私からすると『憧れ』のようにも思えるがな」"
translation = "「또 다른 나의 그것은, 내가 보기엔 『동경』인 것처럼도 느껴진다만」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「憧れ……？」"
translation = "「동경……?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「実は私ね～、子供の頃に母から『魔王』の話を聞いて、ずっと憧れてたのよ～」"
translation = "「사실 나 말이지~, 어릴 적에 어머니에게 『마왕』 이야기를 듣고, 줄곧 동경했었어~」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「でも、今の魔王は私より年下だし、その子の父親である先代魔王のオジサマは既婚者だし、『ないものねだり』の憧れって言われたら、その通りなのよね～」"
translation = "「하지만, 지금의 마왕은 나보다 연하이고, 그 아이의 아버지인 선대 마왕 아저씨는 유부남이고, 『없는 것을 탐내는』 동경이라고 한다면, 그대로이지만 말이야~」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「かといって、昔からの『憧れ』を捨てられるほど、簡単には大人になれないんだけど～」"
translation = "「 그렇다고 해서, 예전부터의 『동경』을 버릴 수 있을 정도로, 간단히 어른이 될 수는 없지만~」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「……わかる！\u3000わかるよ、ヘレナちゃん！\u3000私もまだ星騎士を続けたいし……！\u3000け、結婚だって……女だったらやっぱりしたいよね！」"
translation = "「……알아! 알아, 헬레나짱! 나도 아직 성기사를 계속하고 싶고……! 게, 결혼도…… 여자라면 역시 하고 싶잖아!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「トワちゃん、わかってくれるの！？\u3000ありがと～！\u3000ぎゅ～っ<emoji=heart04>\u3000なでなで～♪」"
translation = "「토와짱, 알아주는 거야!? 고마워~! 꽉~<emoji=heart04> 쓰담쓰담~♪」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「ちょっ、ヘレナちゃん！？\u3000年上だから、ハグはまだしも頭撫でるのは、ちょっと恥ずかしいよ～！？」"
translation = "「잠깐, 헬레나짱!? 연상인데, 포옹은 둘째치고 머리 쓰다듬는 건, 조금 창피해~!?」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「ふむ……ヘレナ様、でしたら、少し考え方を変えてみるのはいかがでしょう？」"
translation = "「흠…… 헬레나 님, 그렇다면, 조금 생각을 바꿔보시는 건 어떠실지요?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「？\u3000マリオンちゃん、どういうこと？」"
translation = "「? 마리온짱, 무슨 소리야?」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「憧れを待つのではなく、自分で作るのです」"
translation = "「동경을 기다리는 것이 아니라, 스스로 만드는 것입니다」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「つまり――理想の渋くてダンディーな男性を、自分の手で育てればよいのです」"
translation = "「즉── 이상적인 묵직하고 단디한 남성을, 자신의 손으로 키우면 되는 것입니다」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「……！」"
translation = "「……！」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「なるほど。たとえば異世界の魔王を、今から自分好みに育てていけば、いずれは憧れのダンディーな魔王に成長するかもしれない――ということだな？」"
translation = "「과연. 예를 들어 이세계의 마왕을, 지금부터 내 취향대로 키워가면, 언젠가는 동경하던 단디한 마왕으로 성장할지도 모른다――라는 거군?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「その発想は、なかったわ……！」"
translation = "「그런 발상은, 못 해봤어……!」"

[[dialogue]]
speaker_original = "リコリンフィア"
speaker_translation = "리코린피아"
original = "「理想は運命の相手が現れることだろう。しかし、それは『憧れが叶うのを待つ』という受け身な考え方でもある」"
translation = "「이상은 운명의 상대가 나타나는 것이겠지. 하지만, 그것은 『동경이 이루어지길 기다린다』라는 수동적인 사고방식이기도 하다」"

[[dialogue]]
speaker_original = "リコリンフィア"
speaker_translation = "리코린피아"
original = "「だが、私たちはもう大人だ。憧れを叶えたいなら、自分から掴みに行かねばな」"
translation = "「하지만, 우리들은 이제 어른이다. 동경을 이루고 싶다면, 스스로 붙잡으러 가지 않으면 안 되지」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「確かにね……うんっ♪\u3000よかったわ、異世界に来て！\u3000ありがとう、トワちゃん、マリオンちゃん、リコリンちゃん！\u3000――ぎゅ～っ<emoji=heart04>」"
translation = "「확실히 그렇네…… 응♪ 다행이야, 이세계에 와서! 고마워, 토와짱, 마리온짱, 리코린짱! ――꼬~옥<emoji=heart04>」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「ちょっ、ヘレナちゃん！\u3000だから抱き着くのは、恥ずかしいってば～！」"
translation = "「잠깐, 헬레나짱! 그러니까 끌어안는 건, 창피하다니까~!」"

[[dialogue]]
speaker_original = "リコリンフィア"
speaker_translation = "리코린피아"
original = "「ふふっ……どうやらこちらのヘレナと同じで、酒が入ると誰彼構わず抱き着く癖があるようだな」"
translation = "「후후…… 아무래도 이쪽의 헬레나와 마찬가지로, 술이 들어가면 누구 가릴 것 없이 끌어안는 습관이 있는 모양이군」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「まあまあ、うふふっ♪\u3000お可愛らしいですこと<emoji=heart04>\u3000私はされるの、大歓迎ですよ♪」"
translation = "「이런이런, 우후후♪ 귀여우셔라<emoji=heart04> 저는 당하는 거, 대환영이에요♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ならば私も同じようにハグさせてもらおうか♪\u3000ぎゅ～っ<emoji=heart04>」"
translation = "「그렇다면 나도 똑같이 허그하게 해줄까♪ 꽉~<emoji=heart04>」"

[[dialogue]]
speaker_original = "トワ先生"
speaker_translation = "토와 선생님"
original = "「って、なんで私をサンドイッチするの～！？\u3000リコとマリオンもいるでしょ～！？」"
translation = "「아니, 왜 나를 샌드위치로 만드는 거야~!? 리코랑 마리온도 있잖아~!?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「だって私たちは、ほとんど双子みたいなものだし～♪\u3000ね～？」"
translation = "「그치만 우리들은, 거의 쌍둥이나 다름없는걸~♪ 그치~?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ああ。プリティーでゴージャスな鏡映し故にな♪」"
translation = "「아아. 프리티하고 고저스한 거울에 비친 모습이니까 말이지♪」"

[[dialogue]]
speaker_original = "リコリンフィア"
speaker_translation = "리코린피아"
original = "「いいな～♪\u3000トワちゃん、ヘレナお姉ちゃんたちに囲まれて～♪\u3000リコリン、羨ましい～<emoji=heart04>」"
translation = "「좋겠다~♪ 토와짱, 헬레나 언니들한테 둘러싸여서~♪ 리코린, 부러워~<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「って……えっ！？\u3000リコリンちゃん、その制服と喋り方は何！？」"
translation = "「라니…… 에!? 리코린짱, 그 제복이랑 말투는 뭐야!?」"

[[dialogue]]
speaker_original = "リコリンフィア"
speaker_translation = "리코린피아"
original = "「リコリンリン♪\u3000これはリコリンの附属生モードだよ～♪\u3000てへっ☆」"
translation = "「리코린린♪ 이건 리코린의 부속생 모드야~♪ 테헷☆」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「きゃ～んっ♪\u3000なにそれ、めっちゃ可愛い～っ<emoji=heart04>」"
translation = "「꺄~앙♪ 뭐야 그거, 엄청 귀여워~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "こうして――異世界のヘレナはそれからも、こちらの世界の大人メンバーたちと、賑やかな夜を楽しむのだった。"
translation = "이렇게해서――이세계의 헬레나는 그 후로도, 이쪽 세계의 어른 멤버들과, 시끌벅적한 밤을 즐기는 것이었다."

