[[dialogue]]
speaker = "unk"
original = "第１話,夏の最強,P"
translation = "제1화, 여름의 최강, P"

[[dialogue]]
speaker = "unk"
original = "夏のある日。星徒会の仕事が早く片付いたので、星徒会みんなでリゾート結界に遊びに来ていた。"
translation = "어느 여름날. 성도회의 일이 일찍 끝난 덕분에 성도회 모두와 함께 리조트 결계로 놀러 왔다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「マトイ、もうちょっと右よ！\u3000あー、行きすぎ！」"
translation = "「마토이, 조금 더 오른쪽이야! 아─, 너무 갔어!」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「もうちょっとじゃ分かんないよ！\u3000もっと具体的にお願い！」"
translation = "「조금 더라고만 하면 모른다니까! 좀 더 구체적으로 부탁해!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「もうちょっとはもうちょっとよ！\u3000あ、今度は左に行きすぎたわ！」"
translation = "「조금 더는 조금 더야! 아, 이번엔 왼쪽으로 너무 갔어!」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「えー！？」"
translation = "「에─!?」"

[[dialogue]]
speaker = "unk"
original = "マトイとヴィーナスがスイカ割りをしているが、ヴィーナスの指示が大雑把すぎて苦戦しているようだ。"
translation = "마토이와 비너스가 수박 깨기를 하고 있지만, 비너스의 지시가 너무 대충이라 고전하고 있는 모양이다."

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「おお、宇治金時。なんと素晴らしい響きでしょうか。抹茶と小豆のハーモニーは氷の上でも完璧です」"
translation = "「오오, 우지킨토키. 얼마나 멋진 울림인가요. 말차와 팥의 하모니는 얼음 위에서도 완벽하군요」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「私はどうしようかしら……アナちゃんの宇治金時も美味しそうだし、イチゴ練乳もブルーハワイも捨てがたいわ～」"
translation = "「난 어떡할까나…… 아나짱의 우지킨토키도 맛있어 보이고, 딸기 연유도 블루 하와이도 버리기 아깝네~」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「では両方頼んでシェアしませんか。実は私も気になっていたので」"
translation = "「그럼 양쪽 다 시켜서 나누어 먹지 않겠나요. 사실 저도 신경 쓰였거든요」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「それはナイスアイディアだわ～。ありがとう、アナちゃん」"
translation = "「그거 나이스 아이디어네~. 고마워, 아나짱」"

[[dialogue]]
speaker = "unk"
original = "平和だ……"
translation = "평화롭다……"

[[dialogue]]
speaker = "unk"
original = "こんなにゆったり時間が流れるのはいつ以来だろう。この平和がずっと続けばいいのに。"
translation = "이렇게 여유롭게 시간이 흐르는 게 얼마 만일까. 이 평화가 계속 이어지면 좋을 텐데."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「いいところで会ったな。私と戦え、魔王」"
translation = "「좋은 데서 만났군. 나와 싸워라, 마왕」"

[[dialogue]]
speaker = "unk"
original = "平和は１秒で崩壊した。"
translation = "평화는 1초 만에 붕괴했다."

[[dialogue]]
speaker = "unk"
original = "その恰好は？"
translation = "그 차림은?"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「これはネビュラに作らせた水着型の人工戦闘服だ。今日はこいつの試しで泳ぎに来ていたのだが、貴様に会えるとは運がいい」"
translation = "「이건 네뷸라에게 만들게 한 수영복형 인공 전투복이다. 오늘은 이 녀석의 테스트 겸 수영하러 왔다만, 네놈을 만나다니 운이 좋군」"

[[dialogue]]
speaker = "unk"
original = "水着、似合ってる"
translation = "수영복, 잘 어울려"

[[dialogue]]
speaker = "unk"
original = "中身はともかく見た目は美人でスタイルもいい。思わず口に出ていた。"
translation = "속이야 어쨌든 겉모습은 미인에 스타일도 좋다. 나도 모르게 입 밖으로 튀어나왔다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「そうだろうそうだろう。動きやすくて私も気に入っている」"
translation = "「그렇겠지 그렇겠지. 움직이기 편해서 나도 마음에 들어 한다」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ちなみに得物も新しくなっていてな。星力の使い方次第で打撃も斬撃もできる優れ物だ。ククク、気になるだろう？」"
translation = "「참고로 무기도 새로워져서 말이지. 성력의 사용법에 따라 타격도 참격도 가능한 우수한 물건이다. 크크크, 신경 쓰이지?」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「というわけだ、私と戦え」"
translation = "「그렇게 된 거다, 나와 싸워라」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「……イヤだと？\u3000なぜだ！？\u3000この私の新しい力だぞ？\u3000気になって仕方ないだろう。正直になれ、魔王」"
translation = "「……싫다고? 왜냐!? 이 나의 새로운 힘이라고? 궁금해서 참을 수 없을 텐데. 솔직해져라, 마왕」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「……興味がない？\u3000しらばっくれるな。なら、なぜ貴様は私をジロジロ見ているんだ？」"
translation = "「……관심 없어? 시치미 떼지 마라. 그럼 왜 네놈은 나를 빤히 쳐다보고 있는 거냐?」"

[[dialogue]]
speaker = "unk"
original = "イングリットの体に目がいっているだけなのだが、それを正直に言うこともできない。"
translation = "잉그리드의 몸에 눈이 가고 있을 뿐이지만, 그것을 솔직하게 말할 수도 없다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「戦え、でないと大声で喚き散らすぞ」"
translation = "「싸워라, 안 그러면 큰 소리로 떠들어 대겠다」"

[[dialogue]]
speaker = "unk"
original = "それはやめて"
translation = "그건 참아줘"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ふむ。なら……」"
translation = "「흐음. 그럼……」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「たーたかえ……たーたかえ……そんなに戦うのが怖いかザーコ」"
translation = "「싸워─라…… 싸워─라…… 그렇게 싸우는 게 무섭냐 저─질」"

[[dialogue]]
speaker = "unk"
original = "耳元でささやくのもやめて"
translation = "귓가에서 속삭이는 것도 참아줘"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「大声はやめろと言うから小声で言ってやったのに、我儘な奴め。貴様が戦わないと、私が夏の最強になれないではないか」"
translation = "「큰 소리는 치지 말라기에 작은 소리로 말해줬거늘, 제멋대로인 녀석이군. 네놈이 싸워주지 않으면 내가 여름의 최강이 될 수 없지 않으냐」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「……夏の最強とは、だと？\u3000いいだろう、説明してやろう」"
translation = "「……여름의 최강이란 게 뭐냐고? 좋다, 설명해 주지」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「聞けば、私のように水着の戦闘服を持つ星騎士も多いという。ならば、その中でもっとも強い者が夏の最強だ。私がさっき決めた」"
translation = "「듣자 하니 나처럼 수영복 전투복을 가진 성기사도 많다고 하더군. 그렇다면 그중에서 가장 강한 자가 여름의 최강이다. 내가 방금 정했다」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「クロト、誰その天使？\u3000知ってる人？」"
translation = "「쿠로토, 누구야 저 천사는? 아는 사람?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「ヴィーナス？\u3000ヴィーナスどこいったの～！？」"
translation = "「비너스? 비너스 어디 갔어~!?」"

[[dialogue]]
speaker = "unk"
original = "いつの間にか、ヴィーナスがイングリットに気付いてやってきていた。向こうで放置されたマトイが右往左往している。"
translation = "어느샌가 비너스가 잉그리드를 발견하고 다가와 있었다. 저쪽에서 방치된 마토이가 우왕좌왕하고 있다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「私はイングリット。コラプサーだ。貴様こそ何者だ」"
translation = "「나는 잉그리드. 콜랩서다. 네놈이야말로 정체가 뭐냐」"

[[dialogue]]
speaker = "unk"
original = "かつて星騎士と敵対していた組織・コラプサーの一員で、今は敵ではないが、それはそれとして戦うことしか頭にない生粋の戦闘狂だ。"
translation = "과거 성기사와 적대하던 조직 콜랩서의 일원으로, 지금은 적이 아니지만 그것과는 별개로 싸울 생각밖에 없는 태생부터 전투광이다."

[[dialogue]]
speaker = "unk"
original = "コラプサー随一のトラブルメーカーとして学園内でも有名である。"
translation = "콜랩서 제일의 트러블 메이커로서 학원 내에서도 유명하다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「あなたが噂の不審者ね。私は九浄ヴィーナス！\u3000星徒会のスーパーフィクサーとは私のことよ！」"
translation = "「당신이 소문의 불심검문자구나. 나는 쿠죠 비너스! 성도회의 슈퍼 픽서라면 바로 나라고!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ボーナスだかピーナッツだか知らんが、邪魔をするなら容赦せんぞ。私は魔王と戦いたいのだ」"
translation = "「보너스인지 피너츠인지 모르겠다만, 방해한다면 용서치 않겠다. 나는 마왕과 싸우고 싶단 말이다」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「ヴィーナスよ！\u3000今日は星徒会で遊びに来たのよ。そっちこそ邪魔しないでちょうだい」"
translation = "「비너스야! 오늘은 성도회끼리 놀러 온 거라고. 그쪽이야말로 방해하지 말아 줄래」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「どうやら退く気はないようだな」"
translation = "「아무래도 물러날 생각은 없는 모양이군」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「そっちもね。行くわよ！」"
translation = "「그쪽도 마찬가지네. 간다!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「叩き斬る！\u3000ツインリッパー！」"
translation = "「베어 넘기겠다! 트윈 리퍼!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「行っけー！\u3000サマーレーヴァテイン！」"
translation = "「가─랏! 서머 레바테인!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「この星力の輝き、ただ者ではないな。強き水着星騎士として認めてやろう。私が夏の最強となるための糧となれ！」"
translation = "「이 성력의 광채, 보통내기가 아니군. 강한 수영복 성기사로서 인정해 주지. 내가 여름의 최강이 되기 위한 밑거름이 되어라!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「夏の最強って何？」"
translation = "「여름의 최강이 뭐야?」"

[[dialogue]]
speaker = "unk"
original = "一番強い水着星騎士のことらしい"
translation = "제일 강한 수영복 성기사를 말하는 것 같아"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「なんでクロトが答えるのよ。でもそう言われたら、私だって譲れな……はっ、そうだわ！」"
translation = "「왜 쿠로토가 대답하는 거야. 하지만 그렇게 말한다면 나도 양보 못…… 핫, 그렇네!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「もしもし、ヘレナちゃん？\u3000ちょっと思いついたんだけど……」"
translation = "「여보세요, 헬레나짱? 방금 생각난 게 있는데……」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「何をしている？\u3000来ないならこちらから行くぞ」"
translation = "「뭘 하고 있지? 오지 않는다면 이쪽에서 가겠다」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「……うん、よろしくお願いね。じゃ、また後で」"
translation = "「……응, 잘 부탁해. 그럼 나중에 봐」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「ねぇイングリット。私たちだけで夏の最強を決めるのはもったいないと思わない？」"
translation = "「있지, 잉그리드. 우리끼리만 여름의 최강을 정하는 건 아깝다고 생각하지 않아?」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「なんだと？\u3000貴様、何を言って……」"
translation = "「뭐라고? 네놈, 무슨 소리를……」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「ごにょごにょごにょ……」"
translation = "「속닥속닥속닥……」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「……クク、クハハハハッ！！\u3000面白いことを考えるではないか！\u3000ヴィーナスといったな！\u3000気に入ったぞ！」"
translation = "「……크크, 크하하하하!! 재미있는 생각을 하는구나! 비너스라고 했지! 마음에 들었다!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「イングリットもね。私たち、仲良くなれそうね！」"
translation = "「잉그리드도 말이야. 우리, 친해질 수 있을 것 같네!」"

[[dialogue]]
speaker = "unk"
original = "熱い握手を交わす２人。"
translation = "뜨거운 악수를 나누는 두 사람."

[[dialogue]]
speaker = "unk"
original = "ヴィーナスもナチュラルにバトルマニアであったことを失念していた。この２人の同調に、嫌な予感しかない。"
translation = "비너스도 천성적으로 배틀 마니아였다는 사실을 잊고 있었다. 이 두 사람의 동조에 불길한 예감밖에 들지 않는다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「星騎士どもよ、夏の最強はこのイングリットだ。首を洗って待っていろ。クハハハ！！」"
translation = "「성기사들이여, 여름의 최강은 이 잉그리드다. 목을 씻고 기다려라. 크하하!!」"

