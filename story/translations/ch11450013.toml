[[dialogue]]
speaker = "unk"
original = "第３話,久しぶりの登校,P"
translation = "제3화, 오랜만의 등교, P"

[[dialogue]]
speaker = "unk"
original = "アニマ先輩の分裂薬を使って、久しぶりに附属教室に登校してみた。"
translation = "아니마 선배의 분열약을 사용해서, 오랜만에 부속 교실에 등교해 보았다."

[[dialogue]]
speaker = "unk"
original = "『女子アバター』にはどうしても抵抗があるが、今はクラスメイトとしてヒメがいる。"
translation = "『여성 아바타』에는 아무래도 거부감이 있지만, 지금은 반 친구로서 히메가 있다."

[[dialogue]]
speaker = "unk"
original = "彼女から「クラスメイトとして一緒に過ごしてみたい」とお願いされると、どうしても拒否しきれなかった。"
translation = "그녀에게 「클래스메이트로서 함께 지내보고 싶다」고 부탁받자, 아무래도 거절할 수 없었다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「これが……魔王……ちゃん……」"
translation = "「이것이…… 마왕……짱……」"

[[dialogue]]
speaker = "unk"
original = "ちゃん、はやめてね"
translation = "짱, 은 그만둬 줘"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そ、そうか……では、普段通り魔王、と」"
translation = "「그, 그렇군…… 그럼, 평소대로 마왕, 이라고」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「しかし、噂には聞いていたが……本当に可愛らしい女の子なのだな……」"
translation = "「하지만, 소문으로는 들었지만…… 정말로 귀여운 여자아이구나……」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「恋人がこんな可愛い女の子になってショックを受けましたか？」"
translation = "「연인이 이렇게 귀여운 여자아이가 되어서 쇼크를 받으셨나요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「いや、驚きはしたが何も問題ない」"
translation = "「아니, 놀라긴 했지만 아무 문제 없다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「この姿の魔王は素直に可愛いが、それでも魔王が魔王であることには変わりない」"
translation = "「이 모습의 마왕은 솔직히 귀엽지만, 그래도 마왕이 마왕인 것에는 변함이 없다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「だから私の愛は何一つ変わることはない。小さい姿になった私を受け入れてくれた魔王の気持ちと同じくな」"
translation = "「그러니 나의 사랑은 단 하나도 변함이 없다. 작은 모습이 된 나를 받아들여 준 마왕의 마음과 마찬가지로 말이지」"

[[dialogue]]
speaker = "unk"
original = "ヒメ……ありがとう……"
translation = "히메…… 고마워……"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「それにしても久しぶりだな！」"
translation = "「그나저나 오랜만이구나!」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「そうですよ。久しぶりの登校なのですから、分からないことがあったら何でも言ってくださいね。ママダレナが優しく教えてあげます♪」"
translation = "「맞아요. 오랜만의 등교이니까, 모르는 것이 있다면 뭐든지 말해 주세요. 마마달레나가 친절하게 가르쳐 줄게요♪」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ああ、いや……そういったことは私に任せて欲しいのだが」"
translation = "「아아, 아니…… 그런 일은 내게 맡겨주었으면 한다만」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「あら、オオヒメだって<ruby>附属校<rt>ここ</rt></ruby>に通い始めたのはつい先日のことじゃないですか」"
translation = "「어머, 오오히메도 <ruby>부속교<rt>여기</rt></ruby>에 다니기 시작한 건 얼마 전 일 아니었나요」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「そうだぞ、学校生活についてなら、アルモたんやマグダレナの方がセンパイなのだ！」"
translation = "「맞다구, 학교생활에 대해서라면, 알무탄이나 막달레나가 선배라구!」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「恋人だからって会長を独り占めしようとするのはずるいのだ！」"
translation = "「연인이라고 해서 회장을 독점하려고 하는 건 치사하다구!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そんなつもりは……私は純粋に１人のクラスメイトとして魔王の力になりたいと……」"
translation = "「그럴 작정은…… 나는 순수하게 한 사람의 클래스메이트로서 마왕의 힘이 되고 싶어서……」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「だったらアルモたんも１人のクラスメイトとして、会長の力になりたいぞ！」"
translation = "「그러면 알무탄도 한 사람의 클래스메이트로서, 회장의 힘이 되고 싶다구!」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「ええ、私も１人のママとして会長さまのお力になりたいです♪」"
translation = "「네, 저도 한 사람의 엄마로서 회장님의 힘이 되어드리고 싶어요♪」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「う……ぐ……確かに２人の言う通り……私が魔王を独占していい道理はない……」"
translation = "「우…… 윽…… 확실히 두 사람 말이 맞아…… 내가 마왕을 독점해도 될 도리는 없다……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ママダレナもアルモたんもそこまでにしてあげてはいかがですか？\u3000ヒメさんが可愛そうです」"
translation = "「마마달레나도 알무탄도 거기까지 해두는 게 어떨까요? 히메 씨가 불쌍해요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「っ！\u3000ナミエル殿……」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「緋宮会長が久しぶりに登校する気になったのは、ヒメさんが働きかけてくれたからです」"
translation = "「히노미야 회장이 오랜만에 등교할 마음이 든 것은, 히메 씨가 작용해 주었기 때문입니다」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「であれば、会長の面倒をヒメさんが見るのは自然なことだと思いますよ」"
translation = "「그러하면, 회장의 돌봄을 히메 씨가 보는 것은 자연스러운 일이라고 생각해요」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「確かに、ナミエルの言う通りですね。では会長さまのお世話はオオヒメにお任せします」"
translation = "「확실히, 나미엘의 말대로네요. 그럼 회장님의 수발은 오오히메에게 맡기겠어요」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「その代わりオオヒメに分からないことがあったら遠慮なくアルモたんを頼るのだ！」"
translation = "「그 대신 오오히메가 모르는 것이 있으면 스스럼없이 알무탄을 의지하라구!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「もちろん、ママダレナや私のことも頼ってください」"
translation = "「물론, 마마달레나나 저에게도 의지해 주세요」"

[[dialogue]]
speaker = "unk"
original = "３人ともありがとう"
translation = "세 사람 모두 고마워"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ありがとう、みんな……（特にナミエル殿……）」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ではでは、早速１限目の授業の準備にかかろう。教科書は持ってきているな？\u3000ノートは？\u3000筆記用具は？」"
translation = "「자 자, 그럼 바로 1교시 수업 준비를 하자. 교과서는 가져왔지? 노트는? 학용품은?」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「オオヒメ、すごい張り切りようなのだ……」"
translation = "「오오히메, 엄청 의욕이 넘친다구……」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「ふふっ、張り切り過ぎて空回りしてしまわなければいいのですが」"
translation = "「후후, 너무 의욕이 넘쳐서 헛돌지만 않으면 좋을 텐데요」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ヒメさんが失敗しそうになった時は、私たちで影からサポートしましょう」"
translation = "「히메 씨가 실수할 것 같아지면, 저희가 뒤에서 지원해 주죠」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「それではみんな、また明日」"
translation = "「그럼 모두, 내일 또 보자」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「はい、それではまた明日です」"
translation = "「네, 그럼 내일 또 봐요」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「会長もまた登校して来い、待ってるのだ♪」"
translation = "「회장도 또 등교해라, 기다릴 테니까♪」"

[[dialogue]]
speaker = "unk"
original = "久しぶりの附属生としての１日は、大きな問題に出くわすことなく終わった。"
translation = "오랜만의 부속생으로서의 하루는, 큰 문제와 부딪히지 않고 끝났다."

[[dialogue]]
speaker = "unk"
original = "それというのもヒメが細かく俺の面倒を見てくれ、他のクラスメイトたちもそれをバックアップしてくれたからだろう。"
translation = "그것도 히메가 세세하게 내 수발을 들어주고, 다른 클래스메이트들도 그것을 백업해 주었기 때문일 것이다."

[[dialogue]]
speaker = "unk"
original = "さて、ここからはいつも通り男の俺に戻って、緋宮クロトとして行動を──"
translation = "자, 이제부터는 평소대로 남자인 나로 돌아가서, 히노미야 쿠로토로서 행동을──"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker = "unk"
original = "あれ……？"
translation = "어라……?"

[[dialogue]]
speaker = "unk"
original = "教室からずっとヒメが一緒についてきている。"
translation = "교실에서부터 계속 히메가 함께 따라오고 있다."

[[dialogue]]
speaker = "unk"
original = "それはまあ、いいのだけど──"
translation = "그야 뭐, 괜찮지만──"

[[dialogue]]
speaker = "unk"
original = "ヒメは大きい姿にならないの？"
translation = "히메는 큰 모습이 되지 않는 거야?"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ええ、まあ……何というか……もう少し……」"
translation = "「응, 뭐…… 뭐라고 할까…… 조금 더……」"

[[dialogue]]
speaker = "unk"
original = "俺が男に戻るタイミングで、ヒメも大人の姿に戻るのかと思っていた。"
translation = "내가 남자로 돌아가는 타이밍에, 히메도 어른의 모습으로 돌아갈 거라고 생각했다."

[[dialogue]]
speaker = "unk"
original = "けれどヒメは少し頬を赤らめながら、ときどき俺の方に目をやりつつ何かを言いたそうにモジモジしている。"
translation = "하지만 히메는 조금 뺨을 붉히면서, 때때로 내 쪽을 바라보며 무언가 말하고 싶다는 듯 머뭇거리고 있다."

[[dialogue]]
speaker = "unk"
original = "どうしたの──？"
translation = "왜 그래──?"

[[dialogue]]
speaker = "unk"
original = "と、訊ねようとして気が付いた。"
translation = "라고, 물어보려다 깨달았다."

[[dialogue]]
speaker = "unk"
original = "教室ではずっとしっかり者のヒメとして俺の世話を焼きっぱなしだった。"
translation = "교실에서는 내내 야무진 히메로서 내 수발만 들고 있었다."

[[dialogue]]
speaker = "unk"
original = "だからきっと、今日は１日中ずっと我慢してたんだな……"
translation = "그러니 분명, 오늘은 하루 종일 내내 참았던 거겠지……"

[[dialogue]]
speaker = "unk"
original = "ヒメ、手を"
translation = "히메, 손을"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「あ……」"
translation = "「아……」"

[[dialogue]]
speaker = "unk"
original = "俺が手を差し出すと、目をキラキラと輝かせながらしっかり握ってくる。"
translation = "내가 손을 내밀자, 눈을 반짝반짝 빛내며 꼭 쥐어온다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「えへへ……♪\u3000では、手を繋いで星徒会室に向かおう♪」"
translation = "「에헤헤……♪ 그럼, 손을 잡고 성도회실로 향하자♪」"

[[dialogue]]
speaker = "unk"
original = "嬉しそうなヒメの声に俺まで嬉しくなりながら、手を繋いで星徒会室へと向かったのだった。"
translation = "기뻐 보이는 히메의 목소리에 나까지 기뻐지면서, 손을 잡고 성도회실로 향했던 것이었다."

