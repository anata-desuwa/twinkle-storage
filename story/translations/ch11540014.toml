[[dialogue]]
speaker = "unk"
original = "第４話,またいつか会いましょう,P"
translation = "제4화, 또 언젠가 만납시다"

[[dialogue]]
speaker = "unk"
original = "クルセイダース一行が元の世界へと帰る、その前日。"
translation = "크루세이더즈 일행이 원래 세계로 돌아가는, 그 전날."

[[dialogue]]
speaker = "unk"
original = "２人のヘレナは、一緒に並んで街へと出かけていた。"
translation = "두 명의 헬레나는, 함께 나란히 거리로 나갔다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「聞いていた通り、こっちの世界は私たちの世界よりも技術が進んでるのね～」"
translation = "「들을 대로, 이쪽 세계는 우리 세계보다 기술이 발전해 있네~」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「映画もＣＧ技術がすごくて、テンションが上がっちゃったわ♪」"
translation = "「영화도 CG 기술이 대단해서, 흥분해버렸어♪」"

[[dialogue]]
speaker = "unk"
original = "異世界のヘレナの希望で、２人は映画館へ行ってきたところだった。"
translation = "이세계의 헬레나의 희망으로, 두 사람은 영화관에 갔다 온 참이었다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「どうやら、主演の『オジサマ』も気に入ったようだな」"
translation = "「아무래도, 주연인 『아저씨』도 마음에 든 모양이군」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そりゃあね！\u3000まさか『テム・クリアーズ』がこっちにもいて、しかもあんなに渋いオジサマに進化してるなんて思わないじゃな～い♪」"
translation = "「그야 그렇지! 설마 『톰 클리어즈』가 이쪽에도 있고, 게다가 그렇게나 묵직한 아저씨로 진화해 있을 줄은 생각지도 못했잖아~♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「『ミッション・アンタッチャブル』シリーズも、こっちだと最終作……！\u3000くぅ～、元星騎士とはいえ、力も使えないのにあのスタントは痺れるわ～<emoji=heart04>」"
translation = "「『미션 언터처블』 시리즈도, 이쪽이면 최종작……! 으으~, 전 성기사라고는 해도, 힘도 못 쓰는데 저 스턴트는 소름 돋네~<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「こっちの洋画で気になるものがあれば、土産として好きなだけ買って、持って行くといい。金なら私がいくらでも出そう」"
translation = "「이쪽 서양 영화에서 마음에 드는 것이 있다면, 선물로 좋을 대로 사서, 가지고 가도록 해라. 돈이라면 내가 얼마든지 내주마」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ほんと！？\u3000ヘレナちゃん、ありがと～！\u3000大好き～♪」"
translation = "「정말!? 헬레나짱, 고마워~! 너무 좋아~♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふふっ、よいよい♪\u3000金とはこういう時の為に使うものだ」"
translation = "「후후, 좋다 좋아♪ 돈이란 이런 때를 위해 쓰는 것이다」"

[[dialogue]]
speaker = "unk"
original = "それから、異世界のヘレナが見たいという場所を巡っていく。"
translation = "그러고 나서, 이세계의 헬레나가 보고 싶다는 장소를 둘러본다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――こっちの世界のことはリアから聞いていたけど、実際に見ると、やっぱり素敵ね」"
translation = "「――이쪽 세계에 대해서는 리아한테 들었지만, 실제로 보니까, 역시 멋지네」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「それは、人間、天使、魔族の三種族が共に暮らしていることが……か？」"
translation = "「그것은, 인간, 천사, 마족의 세 종족이 함께 살아가고 있다는 점이…… 말이냐?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そう。もちろん、私たちの世界にはいない『モンスター』って存在がいるわけだし、大変なことも多いでしょうけど……」"
translation = "「응. 물론, 우리 세계에는 없는 『몬스터』라는 존재가 있는 거니까, 힘든 일도 많겠지만……」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「それでも、三種族が手を取り合って一緒に暮らしているこの世界の在り方は、すごく素敵なものだって、私には思えるわ」"
translation = "「그래도, 세 종족이 손을 잡고 함께 살아가고 있는 이 세계의 모습은, 너무나도 멋진 것이라고, 나에게는 느껴져」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そちらの世界では、天使や魔族は、一般に広く認知されているわけではないのだったな」"
translation = "「그쪽 세계에서는, 천사나 마족은, 일반적으로 널리 알려져 있는 것은 아니었지」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ええ。少し前までは、私もそれでいいと思っていた。過去に三種族が争った結果、ルネアちゃんは世界を３つに分けたわけだし……」"
translation = "「응. 얼마 전까지는, 나도 그걸로 됐다고 생각했어. 과거에 세 종족이 다툰 결과, 루네아짱은 세계를 3개로 나누었으니까……」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「でもね、最近は……うちの世界の魔王、『シンちゃん』の姿を見ていて、考え方が変わったの」"
translation = "「하지만 말이야, 최근에는…… 우리 세계의 마왕, 『신짱』의 모습을 보면서, 생각이 바뀌었어」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「あの子を中心に、魔族や天使たちは仲良く手を取り合って、一緒に今を生きている」"
translation = "「그 아이를 중심으로, 마족이나 천사들은 사이좋게 손을 잡고, 함께 지금을 살아가고 있어」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「それを見ていると、私たちの世界でも――この世界と同じように、三種族が手を取り合って共に発展していける未来があるんじゃないかって」"
translation = "「그걸 보고 있으면, 우리 세계에서도―― 이 세계와 마찬가지로, 세 종족이 손을 잡고 함께 발전해 나갈 수 있는 미래가 있지 않을까 하고」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「もちろん色々な問題があるでしょうけど……それでも」"
translation = "「물론 여러 가지 문제가 있겠지만…… 그래도」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「こうして実際に存在している光景を見たら――やっぱり頑張ってみたくなっちゃうわよね」"
translation = "「이렇게 실제로 존재하는 광경을 보았으니까―― 역시 힘내보고 싶어져 버리네」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「九浄家の当主として、三種族が一緒に暮らせる世界を作っていけるように」"
translation = "「쿠죠가의 당주로서, 세 종족이 함께 살아갈 수 있는 세계를 만들어 갈 수 있도록」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「できるとも」"
translation = "「할 수 있고말고」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「何故なら、私たちは魂の『鏡映し』。ならば――私にできて、そなたにできないことは何もないのだから」"
translation = "「왜냐하면, 우리들은 영혼의 『거울에 비춤』. 그렇다면―― 나에게 할 수 있고, 그대에게 할 수 없는 일 따위는 아무것도 없으니까」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ……もう１人の自分にそう言ってもらえると、俄然やる気が湧いてくるわ♪」"
translation = "「후후…… 또 하나의 자신에게 그런 소리를 들으니까, 훨씬 의욕이 솟아나네♪」"

[[dialogue]]
speaker = "unk"
original = "それから日が落ちるまで街を巡り、２人は学園へと戻ってきた。"
translation = "그러고 나서 해가 질 때까지 거리를 둘러보고, 두 사람은 학원으로 돌아왔다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「あ～あ、もうちょっと色んなところ見て回りたかったけど、時間切れね」"
translation = "「아~아, 좀 더 여러 곳을 둘러보고 싶었지만, 시간 종료네」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――今日までありがとね、ヘレナちゃん。おかげで、すごく楽しかったわ♪」"
translation = "「――오늘까지 고마웠어, 헬레나짱. 덕분에, 정말 즐거웠어♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「礼など不要だ」"
translation = "「감사 따위는 필요 없다」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「私とお前は双子の姉妹のようなもの……そうであろう？」"
translation = "「나와 너는 쌍둥이 자매 같은 것…… 그렇지 않느냐?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ええ。短い間だったけど……本当の家族みたいに思ってるわ。だから――」"
translation = "「응. 짧은 시간이었지만…… 진짜 가족처럼 생각하고 있어. 그러니까――」"

[[dialogue]]
speaker = "unk"
original = "言葉の続きを紡ぐ前に、ヘレナはもう１人の自分へと歩み寄り――抱きしめる。"
translation = "말의 이음을 자아내기 전에, 헬레나는 또 하나의 자신에게 다가가―― 껴안는다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「今回だけじゃなく、またいつか会いましょう」"
translation = "「이번뿐만 아니라, 또 언젠가 만나요」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「……ふふっ。それは、今日観た映画の台詞か？」"
translation = "「……후후. 그거, 오늘 본 영화 대사인가?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そうね。言いたくなっちゃったの♪」"
translation = "「그렇네. 말하고 싶어졌는걸♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「奇遇だな。私も同じことを、明日言うつもりだった」"
translation = "「기우로군. 나도 같은 말을 내일 할 작정이었다」"

[[dialogue]]
speaker = "unk"
original = "そう言って、こちらの世界のヘレナもまた、静かに抱きしめ返す。"
translation = "그렇게 말하며, 이쪽 세계의 헬레나도 다시금 조용히 맞아 안아준다."

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「鏡映しだからわかるのだ。明日、妹のリアの前でこういう姿を見せるのは――少し照れくさいのであろう？」"
translation = "「거울처럼 비추고 있으니 알 수 있지. 내일, 여동생 리아 앞에서 이런 모습을 보이는 건―― 조금 부끄러운 것이겠지?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「あはは♪\u3000そりゃそうよ～。リアの前では、カッコいい大人のお姉さんでいたいもの♪」"
translation = "「아하하♪ 그야 그렇지~. 리아 앞에서는 멋진 어른 언니로 있고 싶은걸♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ならば、普段のイタズラな振る舞いも、少しは自重した方がよいぞ？」"
translation = "「그러면, 평소의 장난스러운 행동도 조금은 자제하는 편이 좋을 거다?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「は～い。善処しま～す♪\u3000ふふっ♪」"
translation = "「네~. 선처하겠습니~다♪ 후후♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「……帰ったら、今夜はもう少し酒でも飲みながら話すか？」"
translation = "「……돌아가면, 오늘 밤은 술이라도 좀 더 마시면서 이야기할까?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「おっ、いいわね～♪\u3000今夜はとことん語り明かしましょ♪」"
translation = "「앗, 좋은데~♪ 오늘 밤은 끝까지 철야로 이야기 나누자♪」"

[[dialogue]]
speaker = "unk"
original = "肩を並べながら――２人のヘレナはゆっくりと、九浄家へと歩き出す。"
translation = "어깨를 나란히 하며―― 두 사람의 헬레나는 천천히 쿠죠 가로 걸어 나간다."

[[dialogue]]
speaker = "unk"
original = "いつか再び出会う、その日を信じて。"
translation = "언젠가 다시 만날 그날을 믿으며."

