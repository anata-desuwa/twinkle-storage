[[dialogue]]
speaker = "unk"
original = "第３話,昔日のかけら,P"
translation = "제3화, 석일의 조각, P"

[[dialogue]]
speaker = "unk"
original = "週末、母さんが夜までいないということで、コハルコがごはんを作りに来てくれた。"
translation = "주말, 어머니가 밤까지 안 계신다고 해서 코하루코가 밥을 해주러 와주었다."

[[dialogue]]
speaker = "unk"
original = "俺だって料理はひと通りできるけど、恋人の手料理は特別だ。"
translation = "나도 요리는 웬만큼 할 수 있지만, 연인의 손요리는 특별하다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はい、ミートソーススパゲッティ出来上がり～。付け合わせにサラダもあるよ」"
translation = "「자, 미트 소스 스파게티 다 됐어～. 곁들임으로 샐러드도 있어」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ふふっ、お口に合うといいんだけど」"
translation = "「후후, 입맛에 맞으면 좋겠는데」"

[[dialogue]]
speaker = "unk"
original = "美味しいっ！"
translation = "맛있어!"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ならよかった」"
translation = "「그렇다면 다행이야」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「時間がない時は市販のソースを使うこともあるけど、うちは基本的に手作りなんだ。ひき肉と、玉ねぎと、缶詰のホールトマト。お母さんのレシピなの」"
translation = "「시간이 없을 때는 시판 소스를 쓰기도 하지만, 우리 집은 기본적으로 수제야. 다진 고기랑, 양파랑, 캔에 든 홀 토마토. 엄마의 레시피거든」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「といっても、普通のミートソースだけどね。でもうちの家族は大好きだから、会長さんも気に入ってくれると嬉しいな」"
translation = "「라고 해도, 평범한 미트 소스지만 말이야. 그래도 우리 가족은 정말 좋아하니까, 회장님도 마음에 들어 해 주면 기쁘겠어」"

[[dialogue]]
speaker = "unk"
original = "何の変哲もないミートソーススパゲティだけど、だからこそ、フォークが止まらない。"
translation = "아무런 변함없는 미트 소스 스파게티지만, 그렇기에 포크가 멈추지 않는다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あははっ、そんなにがっつかなくてもいいのに。いつでも作ってあげるからね」"
translation = "「아하하, 그렇게 허겁지겁 먹지 않아도 되는데. 언제든 만들어 줄 테니까」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「パソコンの調子はどう？\u3000異常とかない？」"
translation = "「컴퓨터 상태는 어때? 이상 같은 건 없어?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「……いつも元気にピカピカ光ってる？\u3000それはよかった…………のかな？\u3000あのときは楽しく組んでたけど、派手すぎない？」"
translation = "「……항상 활기차게 번쩍번쩍 빛나고 있어? 그거 다행이네…………인 걸까? 그때는 즐겁게 조립했지만, 너무 화려하진 않아?」"

[[dialogue]]
speaker = "unk"
original = "賑やかで楽しいよ"
translation = "북적거려서 즐거워"

[[dialogue]]
speaker = "unk"
original = "俺が使っているパソコンは、以前にコハルコと２人で組んだもの。当然、ゲームもネットも快適だ。"
translation = "내가 쓰고 있는 컴퓨터는 이전에 코하루코와 둘이서 조립한 것. 당연히 게임도 인터넷도 쾌적하다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「そっか。ならいいや」"
translation = "「그래. 그럼 됐어」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「秋葉原にまた新しいお店ができてね。時間あるときに２人で行ってみようよ」"
translation = "「아키하바라에 또 새로운 가게가 생겼거든. 시간 날 때 둘이서 가보자」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うちの家族？\u3000うん、みんな元気だよ。秋葉原に来たら顔出してあげて。ナツコもトウコも喜ぶよ」"
translation = "「우리 가족? 응, 다들 잘 지내. 아키하바라에 오면 얼굴 좀 비춰줘. 나츠코도 토우코도 기뻐할 거야」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「お母さんも体調すごくよくなってきてね。そのうち家族で旅行も行きたいなぁ。あ、でも、お父さんはさらにお腹出てきた。夜食はやめてっていつも言ってるんだけど」"
translation = "「엄마도 컨디션이 굉장히 좋아졌어. 조만간 가족 여행도 가고 싶네. 아, 근데 아빠는 배가 더 나왔어. 야식은 그만 먹으라고 항상 말하고 있는데」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「会長さんのお母さんは元気？\u3000ちゃんと会ったことないけど、いつかは挨拶しないとね」"
translation = "「회장님 어머니는 잘 지내셔? 제대로 뵌 적은 없지만, 언젠가는 인사드려야 할 텐데」"

[[dialogue]]
speaker = "unk"
original = "とりとめのない話、なんでもない時間。"
translation = "두서없는 이야기, 아무것도 아닌 시간."

[[dialogue]]
speaker = "unk"
original = "コハルコと一緒だと、それが心地いい。あれこれ話しているうちに皿も空になった。"
translation = "코하루코와 함께 있으면 그것이 기분 좋다. 이런저런 이야기를 나누는 사이에 접시도 비워졌다."

[[dialogue]]
speaker = "unk"
original = "ごちそうさまでした"
translation = "잘 먹었습니다"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はい、お粗末様でした。食後のコーヒー、飲むよね？」"
translation = "「네, 별말씀을요. 식후 커피, 마실 거지?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はい、どうぞ。隣、座るね」"
translation = "「자, 여기. 옆에 앉을게」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「今日はこれからどうする？\u3000どこか出かける？」"
translation = "「오늘은 이제부터 뭐 할까? 어디 나갈까?」"

[[dialogue]]
speaker = "unk"
original = "今日はこのまままったりかな"
translation = "오늘은 이대로 느긋하게 있을까"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「そうだね、ずっとこうしてよっか」"
translation = "「그렇네, 계속 이렇게 있자」"

[[dialogue]]
speaker = "unk"
original = "コハルコが肩を預けてくる。彼女の体温、匂い、全てが愛おしい。"
translation = "코하루코가 어깨를 빌려온다. 그녀의 체온, 냄새, 모든 것이 사랑스럽다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ふふっ、ふふふっ」"
translation = "「후후, 후후후」"

[[dialogue]]
speaker = "unk"
original = "コハルコ"
translation = "코하루코"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「なーに、会長さん？」"
translation = "「응, 회장님?」"

[[dialogue]]
speaker = "unk"
original = "愛してる"
translation = "사랑해"

[[dialogue]]
speaker = "unk"
original = "好きだ"
translation = "좋아해"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うん。私もだよ……」"
translation = "「응. 나도야……」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「……………………あ」"
translation = "「……………………아」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「どわああああぁぁぁぁぁ～～～～～～っ！？」"
translation = "「도와아아아아아아아아～～～～～～윽!?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「リ、リノさん、いつからそこに！？」"
translation = "「리, 리노 씨, 언제부터 거기에!?」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「ごめんなさいね。用事が片付いたから、ついさっき帰ってきたんだけど、どう入っていいのか分からなくて、様子を窺っちゃったわ」"
translation = "「미안해요. 용무가 끝나서 방금 막 돌아왔는데, 어떻게 들어가야 할지 몰라서 기색을 살피고 말았네」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「私のことは気にしなくていいから、続けて続けて」"
translation = "「내 일은 신경 쓰지 않아도 되니까, 계속해 계속해」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「そんなの無理ですぅ～！」"
translation = "「그건 무리예요～!」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「２人きりだとこんな感じなのねぇ。母さんまでドキドキしちゃいそう。あ、ちなみに呼び捨てなのは……」"
translation = "「둘이 있을 때는 이런 느낌이구나. 엄마까지 두근거려 버릴 것 같아. 아, 참고로 말을 놓는 건……」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「私から言い出したことです……」"
translation = "「제가 제안한 거예요……」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「きゃ～～～！」"
translation = "「꺄～～～!」"

[[dialogue]]
speaker = "unk"
original = "コハルコからのお願いで、２人きりやプライベートのときは呼び捨てで、敬語も使わないようにしている。"
translation = "코하루코의 부탁으로, 둘이 있을 때나 프라이빗할 때는 이름을 부르고, 경어도 사용하지 않기로 했다."

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「コハルコちゃんが来てるなら、クロトも教えてくれればいいのに～。じゃあ私、また出かけるわね。コハルコちゃんはゆっくりしていって」"
translation = "「코하루코짱이 와 있다면 쿠로토도 알려주면 좋았을걸～. 그럼 난 다시 나갔다 올게. 코하루코짱은 천천히 있다 가렴」"

[[dialogue]]
speaker = "unk"
original = "母さん、ストップ"
translation = "어머니, 스톱"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「え？」"
translation = "「에?」"

[[dialogue]]
speaker = "unk"
original = "さっき話にも出た通り、コハルコと母さんはちゃんと会ったことがない。"
translation = "방금 이야기에도 나왔듯이, 코하루코와 어머니는 제대로 만난 적이 없다."

[[dialogue]]
speaker = "unk"
original = "母さん不在の時にコハルコが来るか、コハルコが来ると知って母さんが出かけてるかだ。会っても今日みたいに少しだけ。"
translation = "어머니가 부재중일 때 코하루코가 오거나, 코하루코가 온다는 걸 알고 어머니가 외출하거나 해서다. 만나도 오늘처럼 아주 잠깐뿐."

[[dialogue]]
speaker = "unk"
original = "気を遣ってくれているといえばそれまでだが──"
translation = "배려해 주고 있는 것이라 한다면 그렇지만──"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「……私が、コハルコちゃんを避けている気がする？」"
translation = "「……내가 코하루코짱을 피하고 있는 것 같니?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「っ！」"
translation = "「앗!」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「それはちが……わないかもしれないわね。私も気付かないうちにそうしていたのかも」"
translation = "「그건 틀리……지 않을지도 모르겠네. 나도 모르는 사이에 그러고 있었을지도」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「いい機会だから、ちゃんと話しましょうか。コハルコちゃん、クロト、時間もらっていいかしら？」"
translation = "「좋은 기회니까, 제대로 이야기해볼까. 코하루코짱, 쿠로토, 시간 좀 내줄래?」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「まず誤解しないで欲しいんだけど、私はあなたたちの交際を歓迎しているし、応援しているの。それだけは分かっていて」"
translation = "「우선 오해하지 말았으면 하는데, 나는 너희들의 교제를 환영하고 응원하고 있어. 그것만은 알아줬으면 해」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はい、それはもちろん」"
translation = "「네, 그건 물론이죠」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「ありがと～」"
translation = "「고마워～」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「でも、コハルコちゃんがクロトと仲良くしているのを見ると、心がざわざわするというか、まだ慣れないのよ。あなたはあの人にそっくりだから」"
translation = "「하지만 코하루코짱이 쿠로토와 사이좋게 지내는 걸 보면 마음이 술렁거린다고 할까, 아직 익숙해지지 않아. 네가 그 사람이랑 쏙 빼닮았거든」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あの人…………イザベラさんですね」"
translation = "「그 사람………… 이자벨라 씨군요」"

[[dialogue]]
speaker = "unk"
original = "イザベラとは、コハルコの生みの親の魔女だ。"
translation = "이자벨라란, 코하루코의 생모인 마녀다."

[[dialogue]]
speaker = "unk"
original = "彼女をベースに、光の魔女の力を付与して生み出されたコハルコは、イザベラのクローンともいえるだろう。"
translation = "그녀를 베이스로 빛의 마녀의 힘을 부여해 만들어진 코하루코는, 이자벨라의 클론이라고도 할 수 있을 것이다."

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「そう。私、若い頃はイザベラさんにボコボコにされたことがあるから、どうしても脳裏をよぎっちゃうの」"
translation = "「그래. 나, 젊을 적에 이자벨라 씨에게 너덜너덜하게 당한 적이 있어서, 아무래도 뇌리를 스쳐 지나가 버려」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ボコボコ！？\u3000リノさんが、イザベラさんに！？」"
translation = "「너덜너덜!? 리노 씨가 이자벨라 씨에게요!?」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「あ、物理的にじゃないわよ。なんというか、学術的に？\u3000昔、ネビュラの若い魔女たちの研究発表の場があって、講評がイザベラさんだったのよ」"
translation = "「아, 물리적으로는 아니야. 뭐랄까, 학술적으로? 예전에 네뷸라의 젊은 마녀들의 연구 발표 자리가 있었는데, 강평이 이자벨라 씨였거든」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「それはもう、ボッコボコだったわぁ……」"
translation = "「그건 정말, 탈탈 털렸었지……」"

[[dialogue]]
speaker_original = "イザベラ"
speaker_translation = "이자벨라"
original = "「素人質問だけどいいかしら？」"
translation = "「비전문가적인 질문인데 괜찮을까?」"

[[dialogue]]
speaker_original = "イザベラ"
speaker_translation = "이자벨라"
original = "「先行研究は確認した？」"
translation = "「선행 연구는 확인했어?」"

[[dialogue]]
speaker_original = "イザベラ"
speaker_translation = "이자벨라"
original = "「その論文は知ってるわ。書いたの私だから」"
translation = "「그 논문은 알고 있어. 쓴 거 나니까」"

[[dialogue]]
speaker_original = "イザベラ"
speaker_translation = "이자벨라"
original = "「資料はどうやって集めたの？\u3000まさか資料室にあるものだけで完結してないわよね？\u3000ちゃんと自分の足で集めなさい」"
translation = "「자료는 어떻게 모았어? 설마 자료실에 있는 것만으로 완결한 건 아니겠지? 제대로 직접 발로 뛰어서 모으렴」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "（何でだろう、ありありとイメージできる……）"
translation = "（왜일까, 생생하게 이미지가 그려져……）"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「あのときは自分のことを優秀な研究員だと思ってたから、ふてくされてセドナとやけ酒したわ」"
translation = "「그때는 스스로를 우수한 연구원이라고 생각했었으니까, 삐져서 세도나랑 화풀이로 술을 잔뜩 마셨어」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "（セドナさん、また巻き込まれてる）"
translation = "（세도나 씨, 또 휘말리고 있어）"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「でもね、あの経験があったから今の私がある。イザベラさんは道を踏み外してしまったけど、尊敬する先達なのは変わらないわ」"
translation = "「그래도 말이야, 그 경험이 있었기에 지금의 내가 있어. 이자벨라 씨는 길을 잘못 들고 말았지만, 존경하는 선배인 건 변함없어」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「イザベラさんがいなかったら、見付けられなかったものもあるかもしれない。昔のことって意外なとこで今と繋がっているものよ」"
translation = "「이자벨라 씨가 없었다면 찾아내지 못했을 것도 있을지 몰라. 옛날 일이라는 건 의외의 곳에서 지금과 이어져 있는 법이란다」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「……リノさん。今のお話、聞けてよかったです」"
translation = "「……리노 씨. 지금 이야기 들을 수 있어서 다행이에요」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「うん。ならよかった」"
translation = "「응. 그럼 됐어」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ところで、イザベラさんも体を動かすの苦手だったり……？」"
translation = "「그나저나 이자벨라 씨도 몸을 움직이는 데 서툴렀나요……?」"

[[dialogue]]
speaker = "unk"
original = "コハルコの運動音痴は遺伝なのだろうか。俺もちょっと気になっていた。"
translation = "코하루코의 운동치 설정은 유전인 걸까. 나도 조금 궁금해졌다."

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「それはないわね。遺跡調査の毎日で体力は人一倍あったし、思考を最適、高速化する魔法と魔力による身体強化で戦う肉体派の魔女だったから」"
translation = "「그건 아니었어. 유적 조사 때문에 매일같이 체력은 남들보다 배는 좋았고, 사고를 최적화, 고속화하는 마법과 마력에 의한 신체 강화로 싸우는 육체파 마녀였으니까」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「えぇ～～～～～～～～～～！？」"
translation = "「에에～～～～～～～～～～!?」"

[[dialogue]]
speaker_original = "イザベラ"
speaker_translation = "이자벨라"
original = "「動きが遅いわ。ハエが止まるわね」"
translation = "「움직임이 느리네. 파리가 앉겠어」"

[[dialogue]]
speaker_original = "イザベラ"
speaker_translation = "이자벨라"
original = "「シッ！\u3000シッシッ！」"
translation = "「쉿! 훠이! 훠이!」"

[[dialogue]]
speaker = "unk"
original = "コハルコと同じ顔で、高速の肉弾戦で戦うイザベラ。あまりにも意外な絵面だった。"
translation = "코하루코와 같은 얼굴로, 고속 육탄전으로 싸우는 이자벨라. 너무나도 의외인 모습이었다."

