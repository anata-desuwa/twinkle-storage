[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さん、ヒマワリちゃんとセックスしてるところを見せてくれませんか？」"
translation = "「회장님, 히마와리짱이랑 섹스하는 모습을 보여주지 않으실래요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「えーと……俺の耳がおかしくなったのかな？\u3000どういうこと？」"
translation = "「어라…… 내 귀가 이상해진 건가? 무슨 소리야?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ミウがね、あたしと会長さんがえっちしてるとこ、見たいんだってさー」"
translation = "「미우가 말이지, 나랑 회장님이 야한 짓 하는 거, 보고 싶대ー」"

[[dialogue]]
speaker = "unk"
original = "ヒマワリが補足する。恐ろしいことに聞き間違いじゃなかった。"
translation = "히마와리가 보충한다. 끔찍하게도 잘못 들은 게 아니었다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さんといっぱいえっちしてるって自慢したら、ミウが興味持っちゃってねー」"
translation = "「회장님이랑 야한 짓 많이 했다고 자랑했더니, 미우가 흥미를 가져버려서 말이지ー」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「そーゆーことだからさ、あたしと会長さんがえっちしてるとこ、ミウに見せてあげてもいい？」"
translation = "「그런 거니까 말야, 나랑 회장님이 야한 짓 하는 거, 미우한테 보여줘도 돼?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「えええええーっ！？」"
translation = "「에에에에에엑!?」"

[[dialogue]]
speaker = "unk"
original = "あっけらかんとしたヒマワリの相談に、さすがに戸惑う。俺より下の世代の倫理観って、こんなゆるゆるなの？"
translation = "태연한 히마와리의 상담에, 역시나 당황스럽다. 나보다 어린 세대의 윤리관은, 이렇게나 허술한 건가?"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「えっちな動画も見たことはあるんですけど、肝心な場所が隠れちゃってて、よくわからなかったんです」"
translation = "「야한 동영상도 본 적은 있습니다만, 정작 중요한 부분이 가려져 있어서, 잘 몰랐거든요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「兵法三十六計にも、美女で誘惑する美人計というものがあります。詳しく知っておけばプランに組み込めそうですしね」"
translation = "「병법삼십육계에도, 미녀로 유혹하는 미인계라는 것이 있습니다. 자세히 알고 있으면 플랜에 편입시킬 수 있을 테니까요」"

[[dialogue]]
speaker = "unk"
original = "ただの性的な好奇心だけじゃないのは、ミウらしいといえばらしい……のかな。"
translation = "단순한 성적 호기심 때문만은 아닌 것은, 미우답다면 답다고 해야 할까……."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「っていうわけだから、ね！\u3000あたしたちを助けると思って！」"
translation = "「그렇게 된 거니까, 응! 우리를 돕는 셈 치고!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヒマワリが構わなくて、ミウがどうしてもって言うなら、まぁ……」"
translation = "「히마와리가 상관없고, 미우가 정 그렇다고 한다면, 뭐……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしなら全然ＯＫだよー。他の人だとちょっと恥ずかしいけど、ミウならお風呂で裸の見せあいっこもしてるしー」"
translation = "「나는 완전 OK야ー. 다른 사람이면 조금 부끄럽겠지만, 미우라면 목욕탕에서 알몸 보여주기도 하고 있고ー」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「他の人になんて頼めませんし、どうしてもです」"
translation = "「다른 사람에게 부탁할 수는 없고, 꼭 좀 부탁드립니다」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……絶対の絶対に、みんなには内緒だからね？」"
translation = "「……절대로 절대로, 모두에게는 비밀이다?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「もちろんっ！」"
translation = "「당연하지!」"

[[dialogue]]
speaker = "unk"
original = "こうして俺たち３人は、重大な秘密を共有する運命共同体となったのだった。"
translation = "이렇게 우리 3명은, 중대한 비밀을 공유하는 운명공동체가 된 것이었다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あはは……事務所でえっちしたなんてバレたら、セナリィ社長にめっちゃ怒られるよねー」"
translation = "「아하하…… 사무실에서 야한 짓 한 걸 들키면, 세나리 사장한테 엄청 혼나겠지ー」"

[[dialogue]]
speaker = "unk"
original = "俺とヒマワリはミウに見せつけるように性器を露出する。"
translation = "나와 히마와리는 미우에게 과시하듯 성기를 노출한다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「どう？\u3000見えてる？」"
translation = "「어때? 보여?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「は、はい……見えてます……！\u3000ヒマワリちゃんのおま○こと会長さんのおち○ちん……！」"
translation = "「네, 네…… 보입니다……! 히마와리짱의 보지랑 회장님의 자지……!」"

[[dialogue]]
speaker = "unk"
original = "おしっこをさせるような両脚を抱えた体勢は、性器同士が見えやすいようにとミウのリクエストだ。"
translation = "오줌을 누게 하는 듯한 양다리를 안은 자세는, 성기끼리 잘 보이도록 해달라는 미우의 요청이다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うーん……ミウになら見られても平気かと思ったけど……やっぱりちょっと恥ずかしいね、えへへ……」"
translation = "「으응…… 미우한테라면 보여져도 괜찮을 줄 알았는데…… 역시 조금 부끄럽네, 에헤헤……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「本物のおち○ちんって、こんなに大きいんですね……！\u3000男性はみんな、こんなに大きなものを股にぶら下げて……？」"
translation = "「진짜 자지는, 이렇게나 큰 거군요……! 남성은 모두, 이렇게 큰 것을 사타구니에 매달고……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「人によってだったり、体調によってサイズが変わったりはするけどね」"
translation = "「사람에 따라 다르기도 하고, 컨디션에 따라 크기가 바뀌기도 하지만 말야」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「初めて見ると、びっくりするよねー。あたしもこんなの絶対入るわけないー！\u3000って思ったもん」"
translation = "「처음 보면, 놀라지ー. 나도 이런 거 절대 들어갈 리가 없어ー! 라고 생각했는걸」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そうだよね……会長さんのは大きい方なんでしょうか……？」"
translation = "「그렇군요…… 회장님의 것은 큰 편인 걸까요……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「どうだろう……他の人と比べたことないからね」"
translation = "「글쎄…… 다른 사람과 비교해 본 적은 없으니까」"

[[dialogue]]
speaker = "unk"
original = "トイレや温泉で他人のイチモツを目にする機会はあっても、それがフル勃起状態ってことはないからな。"
translation = "화장실이나 온천에서 타인의 물건을 볼 기회는 있어도, 그게 풀 발기 상태일 리는 없으니까 말이지."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしも会長さん以外のち○ちん知らないし──あれれ、会長さん？\u3000今日のち○ちん、いつもよりおっきくなってない？」"
translation = "「나도 회장님 말고는 자지를 모르고── 어라라, 회장님? 오늘 자지, 평소보다 커져 있지 않아?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それは、まあ……いつもより興奮してるから」"
translation = "「그건, 뭐…… 평소보다 흥분해 있으니까」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ミウに見せて、興奮してるんだ。んもーっ、会長さんってば変態さんだなー<emoji=heart04>」"
translation = "「미우한테 보여줘서, 흥분하고 있구나. 정말이지ー, 회장님도 참 변태라니까ー<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "自分より年下の女の子に性行為を見せつけるなんて、背徳的なシチュエーションで興奮するなっていう方が無理だ。"
translation = "자신보다 어린 여자아이에게 성행위를 보여주다니, 배덕적인 시추에이션에서 흥분하지 말라는 쪽이 무리다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヒマワリだって、興奮してるだろ？」"
translation = "「히마와리도, 흥분하고 있잖아?」"

[[dialogue]]
speaker = "unk"
original = "鼓動のドキドキが伝わってくるし、太ももはじっとり汗かいてるし、体温は高いし、息も荒い。"
translation = "두근거리는 심장소리가 전해져 오고, 벅지는 땀으로 축축하고, 체온은 높고, 숨도 거칠다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「そ、そんなわけないしー！？」"
translation = "「그, 그럴 리 없거든ー!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃんのおま○こ、ぱくぱく誘うみたいに開いて……とろとろのお汁がいっぱい垂れてるね……えっちする時って、こんなに濡れるものなの？」"
translation = "「히마와리짱의 보지, 뻐끔뻐끔 유혹하듯이 열려서…… 걸쭉한 즙이 잔뜩 늘어져 있네요…… 야한 짓 할 때란, 이렇게 젖는 건가요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わー！\u3000ミウー！\u3000あんまり解説しないでよー！」"
translation = "「와ー! 미우ー! 너무 해설하지 마ー!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、ヒマワリちゃん、顔真っ赤」"
translation = "「후후, 히마와리짱, 얼굴이 새빨개」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「だって、お風呂で裸は見せても、脚開いて、おま○こまで見せたことはないじゃん……」"
translation = "「그치만, 목욕탕에서 알몸은 보여줘도, 다리 벌리고, 보지까지 보여준 적은 없잖아……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あれれ……？\u3000あたし、もしかして、ものすごーくいけないことしてない……？」"
translation = "「어라라……? 나, 혹시, 엄청나ー게 안 될 짓을 하고 있는 거 아냐……?」"

[[dialogue]]
speaker = "unk"
original = "やっと気づいたのか。だからといって、ここまでその気にさせられていたら、今更引き返せない。"
translation = "겨우 깨달은 건가. 그렇다고 해서, 여기까지 달아오르게 만들어 놓고, 이제 와서 되돌릴 수는 없다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「どう見てもヒマワリちゃんのおま○この穴……会長さんのおち○ちんより小さいんですけど……こんなに太いのが、本当に入っちゃうんですか？」"
translation = "「어떻게 봐도 히마와리짱의 보지 구멍…… 회장님의 자지보다 작은데요…… 이렇게 굵은 게, 정말로 들어가나요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「た、たぶん……いつもよりおっきいから、ちょっと苦しいかもだけど……」"
translation = "「아, 아마도…… 평소보다 크니까, 조금 힘들지도 모르지만……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「一度入っちゃえば、すぐ馴染んで、気持ちよくなるもんな」"
translation = "「한 번 들어가면, 금방 적응돼서, 기분 좋아지잖아」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んわーっ！\u3000耳元で恥ずかしいこと言わないでー！\u3000ねっ、ねっ、ミウ、やっぱやめない！？\u3000あたし、恥ずかしすぎて死んじゃうかも！\u3000恥ずか死だよー！」"
translation = "「으와아악! 귓가에서 부끄러운 말 하지 마ー! 저기, 저기, 미우, 역시 관두지 않을래!? 나, 너무 부끄러워서 죽을지도 몰라! 부끄러워 죽겠어ー!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「だーめ<emoji=heart04>\u3000ヒマワリちゃんがおち○ちん入れられて気持ちよくなってるとこ、見たいなー」"
translation = "「안ー돼<emoji=heart04> 히마와리짱이 자지 박혀서 기분 좋아진 모습, 보고 싶은걸」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ミウのドＳーっ！\u3000う、ううぅ、会長さんも、もう我慢できない感じだよねー……？」"
translation = "「미우 엄청 새디스트~! 으, 으으, 회장님도 이제 못 참겠다는 느낌이지~……?」"

[[dialogue]]
speaker = "unk"
original = "よくわかっている。伊達に何度も体を重ねているわけではない。"
translation = "잘 알고 있다. 헛되이 몇 번이고 몸을 겹친 것은 아니다."

[[dialogue]]
speaker = "unk"
original = "抱えているヒマワリの体を揺らし、股間の辺りに添える。"
translation = "안고 있는 히마와리의 몸을 흔들어, 사타구니 근처에 댄다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んっ……！？\u3000か、会長さん、そっちじゃないよぉ……そこだとお尻に入っちゃうって……」"
translation = "「응……!? 회, 회장님 그쪽이 아니야…… 거기면 엉덩이로 들어간다고……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ミウ、入れる場所、教えてくれる？」"
translation = "「미우, 넣을 위치, 가르쳐 줄래?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「は、はいっ……もうちょっと後ろに引いて……あっ、そこ右です……で、そのまま下に……！」"
translation = "「네, 네엣…… 조금 더 뒤로 당겨서…… 아, 거기 오른쪽이에요…… 그리고, 그대로 아래로……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ひぁっ！？\u3000ち○ちん当たったぁ……！\u3000んもぉ、会長さんやる気まんまん過ぎだってぇ……」"
translation = "「히앗!? 자지 닿았어……! 정말이지, 회장님 너무 의욕이 만만이잖아……」"

[[dialogue]]
speaker = "unk"
original = "勃起の尖端が、温かなぬめりに触れる。"
translation = "발기한 끝부분이, 따스한 점액에 닿는다."

[[dialogue]]
speaker = "unk"
original = "何度も入れた覚えのあるヒマワリの膣穴だと、ペニスが記憶している。"
translation = "몇 번이고 넣었던 기억이 있는 히마와리의 질 구멍이라고, 페니스가 기억하고 있다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「よし、入れるよ。おま○こに入っていくところ、ちゃんと見ててね」"
translation = "「좋아, 넣을게. 보지에 들어가는 부분, 똑똑히 보고 있어」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「は、はいっ……じっくり見ます……！」"
translation = "「네, 네엣…… 자세히 보겠습니다……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さん、ノリノリじゃんっ……んんんっ……！？\u3000はっ、あ、やっぱし、いつもよりち○ちんおっきい……太すぎだってぇ……！」"
translation = "「회장님 신났네…… 응응응……!? 하, 아, 역시 평소보다 자지 커…… 너무 굵다고……!」"

[[dialogue]]
speaker = "unk"
original = "まるでヒマワリとの初体験で処女膜を裂いた時のような、膣穴を無理やりこじ開ける圧迫感がペニスに伝わる。"
translation = "마치 히마와리와의 첫 경험에서 처녀막을 찢었을 때와 같은, 질 구멍을 억지로 비집고 열어젖히는 압박감이 페니스에 전해진다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ふぁ、あっ、あっ……！？\u3000おま○こ広がる、広がっちゃ……んぃ、ひっ、んぃ、んぅいいいぃぃっ！？」"
translation = "「후아, 아, 아……!? 보지 벌어져, 벌어져버…… 으응, 히익, 으응, 으으이이이익……!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はーっ、はぁーっ、はぁーっ……！\u3000ホントに入っちゃったぁ……！\u3000ミウの目の前で、生えっちぃ……<emoji=heart04>」"
translation = "「하아ー, 하아ー, 하아ー……! 진짜로 들어와 버렸어……! 미우 눈앞에서, 생 야한 짓이라니……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んもぉ、今日のち○ちん、おっきすぎだってぇ……！\u3000お腹ん中、ずっしりしてるよぉ……！」"
translation = "「정말, 오늘 자지 너무 크단 말이야……! 배 속이 묵직하다구……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「うっわぁ……本当におち○ちん入っちゃってる……！\u3000おま○こってこんなに広がるんだね……！」"
translation = "「우와아…… 정말로 자지 들어갔어……! 보지가 이렇게나 넓어지는구나……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ちょ、ミウ、顔近いってば……ふぁ、息当たってるぅ……！」"
translation = "「잠깐, 미우, 얼굴 너무 가깝다니까…… 후아, 숨결이 닿고 있어어……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃんのえっちな声、初めて聞いたよ……ヒマワリちゃんも女の子なんだね……」"
translation = "「히마와리짱의 야한 목소리, 처음 들어봐…… 히마와리짱도 여자아이구나……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「お、女の子って……そんなの決まって──ぁんっ！？」"
translation = "「여, 여자애는…… 그야 당연히── 앙!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さんっ、んっ<emoji=heart04>\u3000話してるとちゅーなのにっ、んんっ<emoji=heart04>\u3000おま○こ、ほじっちゃ、んっ、んんーっ！」"
translation = "「회장님, 응<emoji=heart04> 이야기하는 도중인데, 응응<emoji=heart04> 보지 후비면, 응, 응으─읏!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「うわっ、うわぁ、おち○ちんが出たり入ったり出たり入ったり……！」"
translation = "「우와, 우와아, 자지가 나갔다 들어갔다 나갔다 들어갔다……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んぅ、ううっ、ミウ、あんまり見ないでってー！\u3000んぁ、あっ、はっ、あぅんっ<emoji=heart04>」"
translation = "「응우, 으으, 미우, 너무 보지 말라니까~! 응아, 아, 하, 아응<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、はっ……無理っ、無理だよ……こんなえっちなの、目ぇ離せないっ……！\u3000あっ……ヒマワリちゃんのお汁が口に……ぺろっ」"
translation = "「하아, 하아…… 무리, 무리야…… 이런 야한 거 눈을 뗄 수 없어……! 아…… 히마와리 양의 애액이 입에…… 핥짝」"

[[dialogue]]
speaker = "unk"
original = "夢中になって近づいていたせいで、ミウの顔に愛液の飛沫が飛んだらしく、その雫をぺろりと舐めとった。"
translation = "열중해서 다가간 탓에, 미우의 얼굴에 애액 방울이 튄 모양이라, 그 방울을 핥짝하고 핥아 내렸다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「やぁんっ、舐めちゃやだーっ！\u3000んぁ、はぁっ、あぅうぅんっ<emoji=heart04>\u3000か、会長さぁんっ、いきなり、激しすぎ、だって、ばぁっ……<emoji=heart04>」"
translation = "「야앙, 핥으면 안 돼─! 응아, 하아, 아으으응<emoji=heart04> 회, 회장님, 갑자기 너무 격렬하다고 진짜……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、あっ……すごい……ヒマワリちゃんのそんな顔、見たことない……とってもえっちで、かわいいね……<emoji=heart04>」"
translation = "「하아, 아…… 대단해…… 히마와리짱의 그런 얼굴, 본 적 없어…… 엄청 야하고, 귀엽네……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はぅぅ……恥ずかしいってばぁ……恥ずかしくて、心臓飛び出ちゃいそうなくらいドキドキだよぉ……」"
translation = "「하으으…… 부끄럽다니까…… 부끄러워서 심장 튀어나올 정도로 두근두근거려……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さん、ヒマワリちゃんのおま○この中って、どんな感じなんですか……？」"
translation = "「회장님, 히마와리짱의 보지 안은, 어떤 느낌인가요……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「すっごく狭くて、握りしめるみたいに絞めつけてきて……いつもより興奮してるからかな、火傷しそうに熱くて、ぬるっぬる……！」"
translation = "「엄청 좁고, 움켜쥐듯이 조여와서…… 평소보다 흥분해 있어서 그럴까, 데일 정도로 뜨겁고, 미끈미끈……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ひぁああぁぁっ……<emoji=heart04>\u3000えっちなこと、耳元で言わないでっ……会長さんのち○ちんだってアツアツなくせにぃっ……<emoji=heart04>」"
translation = "「히아아아앗……<emoji=heart04> 야한 말 귀에대고 하지 마…… 회장님 자지도 뜨끈뜨끈하면서……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃんは……会長さんのおち○ちん、きもちいいの……？」"
translation = "「히마와리짱은…… 회장님의 자지, 기분 좋아……?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うぅぅ……い、言わなきゃだめぇ……？」"
translation = "「으으…… 마, 말해야 돼……?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「うん、だーめ」"
translation = "「응, 안ー돼」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うぅ、悪ノリしすぎだよぉ……んぅ、んっ……きもち、いいよぉ……ち○ちんっ、ち○ちんきもちいいっ……すっごくきもちいいよぅっ……<emoji=heart04>」"
translation = "「으으, 너무 장단 맞추잖아…… 응우, 응…… 기분, 좋아…… 자지, 자지 기분 좋아…… 엄청 기분 좋아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そんなに？\u3000こんな大きいので中を抉られてるのに、苦しくも痛くもないんだ……？」"
translation = "「그 정도야? 이렇게 큰 걸로 안을 들쑤시고 있는데, 괴롭지도 아프지도 않은 거야……?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うんっ、うんっ<emoji=heart04>\u3000ち○ちんきもちいいのっ、きもちいいだけぇっ……<emoji=heart04>」"
translation = "「응, 응<emoji=heart04> 자지 기분 좋아, 기분 좋을 뿐이야……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「下から、ずんずんされるとね？\u3000ち○ちんで、おま○こから頭のてっぺんまで貫かれてるみたいでっ……んんーっ<emoji=heart04>」"
translation = "「밑에서 쿵쿵 박히면 말이지? 자지로 보지부터 머리 꼭대기까지 꿰뚫리는 것 같아서…… 응응─읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はぁ、はひっ、んぃいいぃっ……<emoji=heart04>\u3000きもちよすぎてっ、のーみそ空っぽになっちゃうんだぁ……<emoji=heart04>」"
translation = "「하아, 하히, 응이이잇……<emoji=heart04> 너무 기분 좋아서 뇌속이 텅 비어버릴 것 같아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さんはこんなに可愛いヒマワリちゃんを独り占めしてたなんて……ちょっと妬けちゃいます……はぁ……んっ……」"
translation = "「회장님은 이렇게 귀여운 히마와리짱을 독점하고 있었다니…… 조금 질투 나네요…… 하아…… 윽……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あはっ……ミウもえっちな顔になってる……<emoji=heart04>\u3000あたしたちのえっちで興奮しちゃった……？」"
translation = "「아핫…… 미우도 야한 얼굴이 됐어……<emoji=heart04> 우리들의 야한 짓으로 흥분해 버렸어……?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「でも、会長さんのち○ちんは、あたしだけのものだから……ごめんね<emoji=heart04>」"
translation = "「하지만, 회장님의 자지는, 나만의 것이니까…… 미안해<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "目の前で喘いでいる親友にすら譲らないヒマワリの独占欲にペニスが震える。"
translation = "눈앞에서 헐떡이고 있는 절친에게조차 양보하지 않는 히마와리의 독점욕에 페니스가 떨린다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あんっ<emoji=heart04>\u3000会長さん……？\u3000ち○ちんびくんって動いたんだけど──んっ<emoji=heart04>\u3000あっ、あぅ、うぅううんっ<emoji=heart04>」"
translation = "「앙<emoji=heart04> 회장님……? 자지 꿀렁 하고 움직였는데──응<emoji=heart04> 아, 아우, 우으으응<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "抱きかかえている愛しい彼女に、思いっきり欲望を吐き出したいとピストンが加速した。"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あっ、はっ、あぅ、んぁぅっ<emoji=heart04>\u3000ち○ちん本気になっちゃったっ、あっ、んぁ、あっあっあっあぁっ<emoji=heart04>」"
translation = "「아, 하, 아우, 응아우<emoji=heart04> 자지 진심이 되어 버렸어, 아, 응아, 아아아아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ずぼずぼとヒマワリの膣道を高速で往復する度、愛液がかき出され、俺たちの行為を呆然と見つめているミウに霧雨のように降りかかる。"
translation = "푹푹 히마와리의 질도를 고속으로 왕복할 때마다, 애액이 흘러나와, 우리들의 행위를 멍하니 바라보고 있는 미우에게 안개비처럼 흩뿌려진다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あっ、そこ、そこ、そこっ<emoji=heart04>\u3000おま○こ引っかかれるの弱いのっ、んぁ、あっ<emoji=heart04>\u3000はぁ、はっ、はぅんっ<emoji=heart04>」"
translation = "「아, 거기, 거기, 거기<emoji=heart04> 보지 긁히는 거 약하단 말야, 응아, 아<emoji=heart04> 하아, 하, 하웅<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はぁ、あっ……きもち、いっ……はぅ、ち○ちん好きぃっ……<emoji=heart04>\u3000会長さん好きっ、しゅきしゅきぃっ<emoji=heart04>」"
translation = "「하아, 아…… 기분, 좋아…… 하우, 자지 좋아아……<emoji=heart04> 회장님 좋아, 죠아죠아아<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ねっ、ねっ……このまま、おま○こにせーし、びゅるびゅる～って出しちゃお……<emoji=heart04>\u3000ミウに中出ししてるとこ、見せてあげよっ……<emoji=heart04>」"
translation = "「저기, 저기…… 이대로, 보지에 정액, 뷰르뷰르~ 하고 내보내 자……<emoji=heart04> 미우에게 안에 싸는 거, 보여 주자……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「な、中に出しちゃうんですか……？\u3000そんなことしたら、ヒマワリちゃん、赤ちゃんデキちゃうかもだよ……！？」"
translation = "「아, 안에 싸 버리는 건가요……? 그런 짓을 하면, 히마와리짱, 아기가 생겨 버릴지도 모른다고……!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「だって、中に出されるのって……す～～～っごくきもちいいんだよ……えへへ<emoji=heart04>」"
translation = "「그치만, 안에 싸여지는 건…… 아~~~주 기분 좋은걸…… 에헤헤<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はぁ、んんっ、あったか～いのがお腹の奥で広がってぇ、んっ<emoji=heart04>\u3000最っ高に幸せになっちゃうんだ～<emoji=heart04>」"
translation = "「하아, 응응, 따뜻~한 것이 배 속 깊은 곳에서 퍼져서, 응<emoji=heart04> 최~고로 행복해져 버리는걸~<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さんもこのままがいいよね？\u3000あたしの中に出すの、だぁい好きだもんねっ<emoji=heart04>」"
translation = "「회장님도 이대로가 좋지? 내 안에 싸는 거, 정~말 좋아하니까<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あ、ああっ……ヒマワリ、ヒマワリっ……！」"
translation = "「아, 아아…… 히마와리, 히마와리……!」"

[[dialogue]]
speaker = "unk"
original = "愛しい彼女を呼びながら、腰を振り乱して昂らせていく。絶頂が近づいたら、快楽を貪るのが最優先だ。"
translation = "사랑스러운 그녀를 부르며, 허리를 미친 듯이 흔들어 고조시켜 간다. 절정이 가까워지면, 쾌락을 탐하는 것이 최우선이다."

[[dialogue]]
speaker = "unk"
original = "理性を失った獣のようにセックスに没頭している俺たちの無様な姿は、ミウの目にはどう映っているのだろう。"
translation = "이성을 잃은 짐승처럼 섹스에 몰두하고 있는 우리들의 볼품없는 모습은, 미우의 눈에는 어떻게 비치고 있을까."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はぁ、あっ、あっ、んぁっ<emoji=heart04>\u3000このまま……このまま、ちょーらい？\u3000ミウにあたしたちのラブラブなとこ、見せつけちゃおっ<emoji=heart04>」"
translation = "「하아, 아, 아, 응아<emoji=heart04> 이대로…… 이대로, 주울래? 미우한테 우리 러브러브한 모습, 자랑해 버리자<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（ヒマワリちゃんも会長さんもこんな風に乱れちゃうなんて……セックスって、どんなに気持ちいいんだろう……）"
translation = "（히마와리짱도 회장님도 이런 식으로 흐트러져 버리다니…… 섹스는 얼마나 기분 좋은 걸까……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（ひとりで弄るよりもずっとずっと気持ちいいんだよね……？\u3000いいなぁ……私もしてみたいなぁ……<emoji=heart04>）"
translation = "（혼자서 자위하는 것보다 훨씬 훨씬 기분 좋은 거겠지……? 부럽다…… 나도 해보고 싶다……<emoji=heart04>）"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んぁあぁぁあ～～っ<emoji=heart04>\u3000はぁっ、あっ、あっあっあっ<emoji=heart04>」"
translation = "「응아아아아~~앗<emoji=heart04> 하아, 아, 아아아<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あ、あっ<emoji=heart04>\u3000あ、あっ、すごい、バチバチって、あたま、あたまヘンっ、ヘンになっちゃうっ<emoji=heart04>」"
translation = "「아, 앗<emoji=heart04> 아, 앗, 대단해, 짜릿짜릿해서, 머리, 머리가 이상, 이상해져 버려<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そんなとろけた顔、見たことないよっ……！\u3000おち○ちんでおま○こほじられたら、そんな風になっちゃうんだね……！」"
translation = "「그런 넋이 나간 얼굴, 본 적 없어……! 자지로 보지 후벼파지면, 그런 식으로 돼 버리는 거구나……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えへへ、いいでしょ～<emoji=heart04>\u3000会長さんとのえっちよりきもちいいことなんて知らないも～ん……<emoji=heart04>」"
translation = "「에헤헤, 부럽지~<emoji=heart04> 회장님과의 야한 짓보다 기분 좋은 건 모르는걸~……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さんも、ち○ちんきもちいいよね？\u3000あたしのおま○こ好き？」"
translation = "「회장님도 자지 기분 좋지? 내 보지 좋아해?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああ……ヒマワリのおま○こ気持ちよすぎ……ぐっ、くぅ、うぅうぅっ……！」"
translation = "「아아…… 히마와리의 보지 너무 기분 좋아…… 윽, 큭, 우우우……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んぅうぅぅぅっ！？\u3000ち、ち○ちん、もっとおっきくぅっ……んぁ、はぁっ、もう出そ？\u3000びゅーびゅーしちゃいそっ？」"
translation = "「응으으으읏!? 자, 자지, 더 커져어…… 응아, 하아, 벌써 싸? 뷰뷰 해버릴 것 같아?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ご、ごめん……もう我慢できないっ……！」"
translation = "「미, 미안…… 더는 못 참겠어……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んへへっ、我慢しなくていいよっ……<emoji=heart04>\u3000あたしもっ……めちゃきもちいーのキテるからぁ……<emoji=heart04>」"
translation = "「응헤헤, 참지 않아도 돼……<emoji=heart04> 나도…… 엄청 기분 좋은 거 오고 있으니까아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしもイッ、イキそ、だしっ……<emoji=heart04>\u3000おま○こ、せーし、欲しがっちゃってるからぁっ……<emoji=heart04>」"
translation = "「나도 갈, 갈 것 같고……<emoji=heart04> 보지가, 정액, 탐내고 있으니까아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はぁ、あっ、あっ、んぁっ<emoji=heart04>\u3000ミウ、見ててねっ、あたしが、会長さんの彼女だってとこ……ち○ちんでイカされちゃうとこぉ……<emoji=heart04>」"
translation = "「하아, 아, 아, 응아<emoji=heart04> 미우, 똑똑히 봐, 내가 회장님의 여자친구라는 모습…… 자지로 가버리는 모습……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んぃひっ<emoji=heart04>\u3000イッ……イッちゃう、イッぢゃう、イッぢゃぅうぅぅぅっ……<emoji=heart04>」"
translation = "「응이히<emoji=heart04> 가…… 가버려, 가버려, 가버려어어어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヒマワリの体は爪先からふくらはぎまでピンと張り、体を貫くような絶頂の衝動を受け止める準備を整える。"
translation = "히마와리의 몸은 발끝부터 종아리까지 꼿꼿이 펴지고, 몸을 꿰뚫는 듯한 절정의 충동을 받아낼 준비를 마친다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ふぁ、あっあっあっ……<emoji=heart04>\u3000んぁああぁぁぁっ……<emoji=heart04>\u3000おま○こ、おま○こイッちゃうイッぢゃうよぉっ……<emoji=heart04>」"
translation = "「하아, 아아, 아……<emoji=heart04> 응아아아아……<emoji=heart04> 보지, 보지 가버려, 가버려잇……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はぁ、はひぃんっ<emoji=heart04>\u3000あっ、ち○ちんどくどくしてる、ちょうらいっ、せーし、せーしっ<emoji=heart04>\u3000あーっ、んあぁあぁぁーっ<emoji=heart04>」"
translation = "「하아, 하히응<emoji=heart04> 아, 자지 꿀렁꿀렁거려, 줘, 정액, 정자<emoji=heart04> 아아, 응아아아<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あっ、あ、ああーっ<emoji=heart04>\u3000イッ、イッちゃうイッ、イクイクイクイクッイッ──ぅぅぅうぅぅんっっっ<emoji=heart04><emoji=heart04>」"
translation = "「아, 아, 아아아<emoji=heart04> 가, 가버려, 가, 가자가자가자가자 가──으으으응<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「っくぅうぅうぅううぅぅぅんっっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「읏쿠우우우우우웅<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "抱えているヒマワリの体が大きく震えると同時、ペニスは大量の精液を噴き上げた。"
translation = "안고 있는 히마와리의 몸이 크게 떨림과 동시에 음경은 대량의 정액을 뿜어냈다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はぁーっ、はっ、はぁ、はぁーっ！\u3000イッちゃっ、たぁぁ……<emoji=heart04>\u3000はぁっ、はっ、はひぃっ……<emoji=heart04>」"
translation = "「하아, 하, 하아, 하아! 가버렸, 다아……<emoji=heart04> 하앗, 하, 하히잇……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はぁ、はぁっ、うっわ、すっごぉ……<emoji=heart04>\u3000どっくんどっくんって……いっぱい出てるよぉ……<emoji=heart04>」"
translation = "「하아, 하앗, 우와, 대단해……<emoji=heart04> 꿀렁꿀렁 하고…… 많이 나오고 있어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふ、ふたりとも、イッちゃった、の……？」"
translation = "「두, 두 사람 모두, 가버린, 거야……?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えへへぇ……うん、ミウに見られてたら、いつもよりきもちよかったぁ……<emoji=heart04>\u3000ごめんねぇ、ミウをダシにしちゃったみたいでぇ……<emoji=heart04>」"
translation = "「에헤헤…… 응, 미우가 보고 있으니까, 평소보다 기분 좋았어……<emoji=heart04> 미안해, 미우를 핑계 삼은 것 같아서……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「う、ううん、私からお願いしたことだし……はぁっ、はぁーっ、はぁーっ……すごぉい……<emoji=heart04>」"
translation = "「으, 아니, 내가 부탁한 일이고…… 하앗, 하아, 하아…… 대단해……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（見てただけで、私もイッちゃいそうだった……おま○こすごく濡れてる……）"
translation = "（보기만 했는데, 나도 가버릴 것 같았어…… 보지 엄청 젖어있어……）"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ちゃんと中に出したのも、見てもらわないとね」"
translation = "「제대로 안쪽에 낸 것도, 봐줘야지」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えっ……んぁ、あっ、はぅっ……ち○ちん抜けるっ……まだ抜いちゃやだぁっ……<emoji=heart04>」"
translation = "「에…… 응아, 아, 하읏…… 자지 빠져…… 아직 빼면 안 돼……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あぅんっ！\u3000ち○ちん、抜けちゃったぁ……もうちょっと繋がってたかったのになー……」"
translation = "「아응! 자지, 빠져버렸다…… 조금 더 연결되어 있고 싶었는데─……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃんのおま○こ、開きっぱなしになっちゃってる……わっ、わっ、奥から白いのがいっぱい出てきた……！」"
translation = "「히마와리짱의 보지, 벌어진 채로 있어…… 와, 와, 깊은 곳에서 하얀 게 엄청 나왔어……!」"

[[dialogue]]
speaker = "unk"
original = "出し切ったペニスがヒマワリの中から抜け落ち、開いた膣穴の奥からは泡立った白濁がどろりと垂れる。"
translation = "다 쏟아낸 페니스가 히마와리의 안에서 빠져나가고, 벌어진 질 구멍 깊은 곳에서는 거품 섞인 백탁액이 걸쭉하게 흘러내린다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「これが会長さんの精液……！？\u3000こんなにたくさん出るモノなんだね……本で読んだのと全然違う……！」"
translation = "「이게 회장님의 정액……!? 이렇게나 많이 나오는 거구나…… 책에서 읽은 거랑 전혀 달라……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「今日はいつもより多いよ……んもぉ、会長さんってばミウに見られてたからって興奮しすぎぃ……ほらぁ、床にまで垂れちゃって──」"
translation = "「오늘은 평소보다 많아…… 정말이지, 회장님도 참 미우가 보고 있다고 해서 너무 흥분했어…… 봐봐, 바닥에까지 흘러내려서──」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あっ！\u3000カーペットに垂れたらシミがついちゃうっ！\u3000セナリィ社長にバレちゃうよ！」"
translation = "「앗! 카펫에 떨어지면 얼룩진단 말이야! 세나리 사장님한테 들키고 말아!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「それはマズーいっ！\u3000あぅぅ、腰抜けちゃって、動けないよーっ！」"
translation = "「그건 큰일이다! 아우우, 허리에 힘이 풀려서, 움직일 수 없어─!」"

[[dialogue]]
speaker = "unk"
original = "余韻を味わう間もなく、俺たちは性行為の証拠隠滅を図る。"
translation = "여운을 맛볼 겨를도 없이, 우리들은 성행위의 증거인멸을 시도한다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「壁にまで汁が飛んじゃってるーっ！\u3000こんなに飛ぶんだねー」"
translation = "「벽에까지 즙이 튀어있어─! 이렇게나 튀는구나─」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「セナリィ社長にバレないように綺麗にしておかなきゃ……くんくん……えっちな臭いもしちゃってるかも……」"
translation = "「세나리 사장님한테 들키지 않게 깨끗이 해둬야…… 킁킁…… 야한 냄새도 나는 것 같아……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あんまり嗅がないでよー！\u3000よし、消臭剤撒いておこう！\u3000トイレの取ってくるー！」"
translation = "「너무 맡지 마─! 좋아, 소취제 뿌려두자! 화장실에서 가져올게─!」"

[[dialogue]]
speaker = "unk"
original = "我を忘れて、没頭していた後の事後処理に追われる俺たちだったが──"
translation = "정신없이 몰두했던 뒤의 뒷처리에 쫓기는 우리들이었지만──"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あの、会長さん……２人のセックス、とても刺激的でしたけど……」"
translation = "「저기, 회장님…… 두 사람의 섹스, 매우 자극적이었습니다만……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「やっぱり実際に経験してみないとわからないことってあると思うんです。良かったら、私にもおち○ちん貸してもらえると──」"
translation = "「역시 실제로 경험해보지 않으면 모르는 게 있다고 생각해요. 괜찮으시다면, 저에게도 자지 빌려주실 수──」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ええぇっ！？」"
translation = "「에에엑!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「こら、ミウーっ！\u3000いきなり誘惑しないで！」"
translation = "「이놈, 미우─! 갑자기 유혹하지 마!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あはは、冗談。こんなにラブラブな２人の間に割って入ろうとは思わないよ」"
translation = "「아하하, 농담. 이렇게 러브러브한 두 사람 사이에 끼어들 생각은 없어」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「だ、だったらいいんだけど……」"
translation = "「그, 그렇다면 다행이지만……」"

[[dialogue]]
speaker = "unk"
original = "そんな話をしながら、丹念に証拠を隠滅していく。"
translation = "그런 이야기를 하면서, 정성껏 증거를 인멸해 나간다."

[[dialogue]]
speaker = "unk"
original = "やがて、元々綺麗だったゴールデングースの事務所は一層きれいに片付いたのだった。"
translation = "이윽고, 원래 깨끗했던 골든 구스의 사무실은 한층 더 깨끗하게 정리되었다."

