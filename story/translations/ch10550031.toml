[[dialogue]]
speaker = "unk"
original = "第１話,推しのメイド姿が可愛すぎて無理,P"
translation = "제1화, 최애의 메이드 모습이 너무 귀여워서 무리, P"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「どうぞ、会長さーん。エルデリーゼ様がお待ちすよー」"
translation = "「어서 오세요, 회장~님. 엘데리제 님이 기다리고 계셔요~」"

[[dialogue]]
speaker = "unk"
original = "エルゼに呼び出された先は、なぜか九浄家のお屋敷だった。"
translation = "엘제에게 불려 간 곳은, 어째서인지 쿠죠 가문의 저택이었다."

[[dialogue]]
speaker = "unk"
original = "美鶴の案内の元、中庭へと足を運ぶと──"
translation = "미츠루의 안내를 받아 안뜰로 발걸음을 옮기자──"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「お待ちしておりましたわ、会長様」"
translation = "「기다리고 있었습니다, 회장님」"

[[dialogue]]
speaker = "unk"
original = "メイド服のエルゼに出迎えられた。"
translation = "메이드복 차림의 엘제에게 맞이 받았다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「やっと念願のメイド服を着ることが出来ましたわ。はぁあぁん……かわいい、かわいすぎます……かわいすぎて無理ですわ……<emoji=heart04>」"
translation = "「드디어 염원하던 메이드복을 입을 수 있게 되었어요. 하아아앙…… 귀여워, 너무 귀여워요…… 너무 귀여워서 무리에요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "その格好は！？"
translation = "그 복장은!?"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヘレナ様にメイド服をいただきましたの。私専用の特注品なのですわ」"
translation = "「헬레나 님께 메이드복을 받았답니다. 저 전용의 특주품이에요」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「縫製はいつも通りうちの仕事ー」"
translation = "「재봉은 평소처럼 우리 집 일~」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「身体にぴったり、シンデレラフィットですわ。美鶴様はとても素晴らしいお仕事をなさいますのね。当家にも来ていただきたいくらいですわ」"
translation = "「몸에 쏙, 신데렐라 피트예요. 미츠루 님은 정말 훌륭한 일을 하시는군요. 저희 가문에도 오시게 하고 싶을 정도예요」"

[[dialogue]]
speaker = "unk"
original = "メイド服なんて見慣れてるんじゃ？"
translation = "메이드복 같은 건 자주 보지 않나?"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「見るのと着るのとでは全く別なのですわ」"
translation = "「보는 것과 입는 것은 완전히 별개예요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「以前、お屋敷で働いておりましたメイドに『メイド服を着てみたいので私の服と交換して欲しい』とお願いしたことがあるのですけど」"
translation = "「이전에, 저택에서 일하던 메이드에게 『메이드복을 입어보고 싶으니 내 옷과 교환해 줬으면 좋겠다』라고 부탁한 적이 있습니다만」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「『お嬢様にこのような服を着せるなんて、とんでもございません！』と叱られてしまいましたの」"
translation = "「『아가씨에게 이런 옷을 입히다니, 당치도 않습니다!』라며 혼나고 말았어요」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「いくらデザインが可愛くても、あくまで使用人の服装っすからねー」"
translation = "「아무리 디자인이 귀여워도, 어디까지나 고용인의 복장이니까요~」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「五名門のお嬢様が着るにゃ相応しくはないでしょうよ。うちが頼まれても、多分貸さなかったっすね」"
translation = "「오명문의 아가씨가 입기엔 어울리지 않겠죠. 우리한테 부탁했어도 아마 안 빌려줬을 거라요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「私も軽率な発言をしたと反省しましたわ……」"
translation = "「저도 경솔한 발언을 했다고 반성했어요……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そんなことがあって諦めていたところに今回のお話を頂いて……あぁ、ヘレナ様、本当にありがとうございます！」"
translation = "「그런 일이 있어서 포기하고 있던 차에 이번 이야기를 듣게 되어서…… 아아, 헬레나 님, 정말 감사합니다!」"

[[dialogue]]
speaker = "unk"
original = "どうしてメイド服に憧れてたの？"
translation = "어째서 메이드복을 동경했던 거야?"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「話せば長くなりますが──そう、あれはお忍びで推しの地下アイドルのライブを見に行った時のことですわ」"
translation = "「말하자면 길어집니다만── 그래요, 그건 몰래 최애 지하 아이돌의 라이브를 보러 갔을 때의 일입니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「今日はどんなパフォーマンスを見せてくださるのでしょう──」"
translation = "「오늘은 어떤 퍼포먼스를 보여주실까──」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そんな風にドキドキしながら開演を待っていると、舞台袖から何人ものメイドさんが現れましたの」"
translation = "「그런 식으로 두근거리며 개연을 기다리고 있자, 무대 뒤에서 수많은 메이드분들이 나타났어요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いつもはメンバーカラーに合わせた色とりどりの衣装なのですけど、その日は特別イベントで全員メイド服を着ていましたわ」"
translation = "「평소에는 멤버 컬러에 맞춘 알록달록한 의상이었습니다만, 그날은 특별 이벤트로 전원 메이드복을 입고 있었습니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そのメイド衣装に身を包んだ推しの皆様を一目見た瞬間、私の全身にビビビと電気が走ったのですわ！」"
translation = "「그 메이드 의상을 두른 최애분들을 한눈 본 순간, 제 온몸에 찌릿찌릿 전기가 통했습니다!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「早鐘のような胸の高鳴り、血が沸き立つような昂揚……あのトキメキを何と表現していいのか、私には分かりませんでした」"
translation = "「자진모리 장단 같은 가슴의 고동, 피가 끓어오르는 듯한 고양…… 그 설렘을 뭐라고 표현해야 좋을지, 저로서는 알 수 없었습니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ですが、後に知りましたの！\u3000あれこそが『好きすぎて無理』もしくは『てぇてぇ』と呼ばれることに……！」"
translation = "「하지만, 나중에 알게 되었어요! 그것이야말로 『너무 좋아서 무리』 혹은 『눈부셔(떼에떼에)』라고 불린다는 것을……!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「我に返った頃には、ステージは終了していて……手元にはいつの間にか購入していた全てのメイドさんのチェキが残っていましたわ……」"
translation = "「제정신으로 돌아왔을 즈음에는, 무대가 끝나있었고…… 손에는 어느샌가 구입했던 모든 메이드분의 체키(폴라로이드)가 남아있었습니다……」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「推しが尊すぎてマジヤバいってヤツすね」"
translation = "「최애가 너무 존엄해서 진짜 대박이라는 그거군요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はい……それほどまでに推しのメイド姿は、私の胸に爪痕を残していったのです……」"
translation = "「네…… 그 정도로 최애의 메이드 모습은, 제 가슴에 손톱자국을 남기고 갔습니다……」"

[[dialogue]]
speaker = "unk"
original = "どうやらそれこそが、エルゼの中に眠っていた『メイド萌え』の覚醒めた瞬間だったらしい。ちっとも長い話ではなかったな。"
translation = "아무래도 그것이야말로, 엘제 안에 자고 있던 『메이드 모에』가 눈을 뜬 순간이었던 모양이다. 전혀 긴 이야기가 아니었잖아."

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「エルデリーゼ様がぶっ飛んじゃうほどの尊み……気になるっすね。そのアイドルさんたちはどんなパフォーマンスしてたんです？」"
translation = "「엘데리제 님이 뿅가버릴 정도의 존엄함…… 궁금하네요. 그 아이돌분들은 어떤 퍼포먼스를 했나요?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「どのような……ですか？\u3000それはそれは大変可愛らしくて、踊りづらそうな衣装でありながら普段以上にキレのあるダンスで──」"
translation = "「어떤…… 이라니요? 그것은 그것은 대단히 귀엽고, 춤추기 힘들어 보이는 의상이면서도 평소 이상으로 절도 있는 댄스로──」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「んー、言葉だけじゃあんましわかんないっすね。エルデリーゼ様、再現できないすか？」"
translation = "「음─, 말만으로는 그다지 잘 모르겠네요. 엘데리제 님, 재현해 줄 수 없나요?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「さ、再現ですの！？\u3000私程度に上手く再現できるかどうか……」"
translation = "「재, 재현 말인가요!? 저 따위가 잘 재현할 수 있을지……」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「上手くなくてもいいんすよ。うち、見てみたいな～。ね、会長さんも見てみたいすよね？」"
translation = "「잘하지 못해도 돼요. 나, 보고 싶은걸~. 저기, 회장님도 보고 싶죠?」"

[[dialogue]]
speaker = "unk"
original = "もちろん見てみたい！"
translation = "당연히 보고 싶지!"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「わ、わかりましたわ……！\u3000本物の魅力には遠く及ばないと思いますが……ご<ruby>笑覧<rt>しょうらん</rt></ruby>くださいませ」"
translation = "「알, 알겠습니다……! 진짜의 매력에는 턱없이 미치지 못한다고 생각합니다만…… <ruby>관람해<rt>소란</rt></ruby> 주시옵소서」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「すぅー、はぁー、すぅー、はぁー……！」"
translation = "「흡─, 하─, 흡─, 하─……!」"

[[dialogue]]
speaker = "unk"
original = "覚悟を決めたエルゼは呼吸を整えると──"
translation = "각오를 다진 엘제는 호흡을 가다듬더니──"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「お帰りなさいませーっ！\u3000ご・主・人・さーまっ♪」"
translation = "「다녀오셨어요─! 주·인·님─♪」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「美味しくな～れ、美味しくな～れっ、萌え・萌え・きゅーん☆\u3000で・す・わ<emoji=heart04>」"
translation = "「맛있어져라~, 맛있어져라~, 모에·모에·큥☆ 이·랍·니·다<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ほら、後ろのご主人さまたちー！\u3000ちゃーんと見えておりますのよー！\u3000お声をくださいませー！」"
translation = "「자, 뒤에 계신 주인님들─! 똑·바·로 보이고 있답니다─! 목소리를 내주세요─!」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「うっわ、再現度たっか」"
translation = "「우와, 재현도 엄청 높네」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「さぁ、皆様もご一緒にっ♪\u3000キュンキュンキュキューン<emoji=heart04>」"
translation = "「자, 여러분도 함께♪ 큥큥큥큐웅<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "キュンキュンキュキューン！"
translation = "큥큥큥큐웅!"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「きゅんきゅんきゅきゅーん……だんだんメイドじゃなくなってるすね」"
translation = "「큥큥큥큐웅…… 점점 메이드가 아니게 되어가네요」"

[[dialogue]]
speaker = "unk"
original = "そのままエルゼはまるっと１曲分の完コピダンスを披露した。"
translation = "그대로 엘제는 통째로 1곡 분량의 완벽한 커버 댄스를 선보였다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふぅー……私のメイド愛、そしてメイドさんの素晴らしさ、伝わりました？」"
translation = "「후우─…… 저의 메이드 사랑, 그리고 메이드분의 훌륭함, 전달되었나요?」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「そりゃもう、充分に」"
translation = "「그야 물론, 충분히」"

[[dialogue]]
speaker = "unk"
original = "アイドルメイド・エルゼに俺たちのハートはすっかり持っていかれたのであった。"
translation = "아이돌 메이드 엘제에게 우리들의 하트는 푹 빼앗겨버린 것이었다."

