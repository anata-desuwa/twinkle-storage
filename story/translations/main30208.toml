[[dialogue]]
speaker = "unk"
original = "第８話,『ライブ！』,B"
translation = "제8화, 『라이브!』, B"

[[dialogue]]
speaker = "unk"
original = "そして、いよいよ本番。ハロウィンの日がやってくる。"
translation = "그리고, 드디어 본방. 할로윈 날이 찾아온다."

[[dialogue]]
speaker = "unk"
original = "<ruby>平行世界門<rt>パラレルゲート</rt></ruby>を通ってデネブへ。"
translation = "<ruby>평행세계문<rt>패러렐 게이트</rt></ruby>을 통해 데네브로."

[[dialogue]]
speaker = "unk"
original = "ハロウィンの飾り付けが行われた極星学園星徒会室には、守護天使たちの演奏をひと目見ようと大勢の人が詰めかけていた。"
translation = "할로윈 장식이 이루어진 극성학원 성토회실에는, 수호천사들의 연주를 보기 위해 수많은 사람들이 몰려들어 있었다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「思っていたよりも……大勢の人が集まってくれたのだな……」"
translation = "「생각했던 것보다…… 많은 사람들이 모여주었구나……」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「あれ～、もしかして緊張してるの～？」"
translation = "「어라～, 혹시 긴장하고 있는 거야～?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「馬鹿な……私は守護天使だぞ？\u3000緊張などするものか！」"
translation = "「바보 같은…… 나는 수호천사라고? 긴장 따위 할 것 같으냐!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「だが、私たちの演奏で満足してもらえなかったら、と思うと……不安に思う気持ちは、ある……」"
translation = "「하지만, 우리들의 연주로 만족하지 못하면 어쩌나, 하고 생각하면…… 불안한 마음은, 있다……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「オオヒメ、肩の力を抜いて。そういうネガティブなことは、一旦ぜーんぶ忘れてさ。思いっきり楽しんでいこう」"
translation = "「오오히메, 어깨에 힘을 빼. 그런 부정적인 것은, 일단 전부ー 잊어버리고 말이야. 마음껏 즐겨보자고」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「せっかくルヴィネさまが企画してくれたハロウィンパーティーなんだから、ボクたちも楽しまなきゃもったいないよ」"
translation = "「모처럼 루비네 님이 기획해 준 할로윈 파티니까, 우리들도 즐기지 않으면 손해라구」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ふむ。ラクシャよ。随分と余裕があるように見えるが、レミカとの特訓に手応えを感じているからか？」"
translation = "「흠. 락샤여. 제법 여유가 있는 것처럼 보이다만, 레미카와의 특훈에 손응답을 느끼고 있기 때문인가?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うーん、どうだろうね。正直に言うとあまり自信はないんだけど……でもみんながくれたボクの役目だからね」"
translation = "「으ー음, 글쎄다. 솔직히 말해서 별로 자신은 없지만…… 그래도 모두가 준 나의 역할이니까 말이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「全力で『体験』し尽くしてみせるよ。さて……そろそろ時間だね」"
translation = "「전력으로 『체험』해보이겠어. 자…… 슬슬 시간이네」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「こういう時は皆で円陣を組むものではないかしら？」"
translation = "「이럴 때는 다 함께 원진을 짜는 것이 아니었나요?」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「えー。やめようよ、そういうこっぱずかしいの……」"
translation = "「에ー. 그만두자구, 그런 쑥스러운 건……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それはどっちかっていうとアイドルとかのステージかな？\u3000ボクたちはロックバンドだから、こんな感じじゃない？」"
translation = "「그건 어느 쪽인가 하면 아이돌 같은 사람들의 무대일까나? 우리들은 록 밴드니까, 이런 느낌 아니야?」"

[[dialogue]]
speaker = "unk"
original = "ラクシャが拳を握り、突き出す。"
translation = "락샤가 주먹을 쥐고, 뻗어 올린다."

[[dialogue]]
speaker = "unk"
original = "他の皆もそれに倣い、互いに拳と拳を軽く打ち合わせる。"
translation = "다른 이들도 그에 따라, 서로의 주먹과 주먹을 가볍게 맞대었다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「よし、それじゃ行くよ！\u3000『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』のファーストライブ、幕開けだ！」"
translation = "「좋아, 그럼 간다! 『Golden Angels』의 퍼스트 라이브, 서막이다!」"

[[dialogue]]
speaker = "unk"
original = "ライブが始まる。"
translation = "라이브가 시작된다."

[[dialogue]]
speaker = "unk"
original = "始まってしまえば──後は夢中で楽しむのみ。"
translation = "시작되어 버리면── 남은 것은 정신없이 즐기는 것뿐."

[[dialogue]]
speaker = "unk"
original = "守護天使たちの演奏は、シルヴィやレミカたちの協力で飛躍的に上達した。"
translation = "수호천사들의 연주는 실비나 레미카 들의 협력으로 비약적으로 향상되었다."

[[dialogue]]
speaker = "unk"
original = "けれど、やはり所詮は付け焼刃。粗も見えれば失敗もあった。"
translation = "하지만, 역시 결국은 임시방편. 어설픈 점도 보이고 실수도 있었다."

[[dialogue]]
speaker = "unk"
original = "それでも会場に集まった人たちは、些細なことなど気にならぬほど守護天使たちのライブを楽しんでいる。"
translation = "그럼에도 회장에 모인 사람들은, 사소한 것 따위 신경 쓰이지 않을 정도로 수호천사들의 라이브를 즐기고 있다."

[[dialogue]]
speaker = "unk"
original = "そして、ラクシャも──"
translation = "그리고, 락샤도──"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "（派手に、大げさに、滑稽に、大胆に、けれど繊細に、凛々しく、精一杯格好をつけて……）"
translation = "(화려하게, 과장되게, 우스꽝스럽게, 대담하게, 하지만 섬세하게, 늠름하게, 온 힘을 다해 폼을 잡고……)"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "（ステージの端から端まで使って……視線を誘導して……サイコーの演奏を繰り広げるみんなを引き立てて……）"
translation = "(무대 끝에서 끝까지 사용해서…… 시선을 유도하고…… 최고의 연주를 펼치는 모두를 돋보이게 해서……)"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "（思いっきり楽しんでもらえるように……そしてボクも……今、この瞬間を楽しめるように……）"
translation = "(마음껏 즐길 수 있도록…… 그리고 나도…… 지금, 이 순간을 즐길 수 있도록……)"

[[dialogue]]
speaker = "unk"
original = "観客の皆は、守護天使たちの演奏も、ラクシャのパフォーマンスも笑顔で楽しんでいる。"
translation = "관객 모두는, 수호천사들의 연주도, 락샤의 퍼포먼스도 미소 지으며 즐기고 있다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "（あはは……なんだろ、これ……超、楽しいかも……！）"
translation = "(아하하…… 뭘까, 이거…… 엄청, 즐거울지도……!)"

[[dialogue]]
speaker = "unk"
original = "１曲目が終わる。"
translation = "1곡째가 끝난다."

[[dialogue]]
speaker = "unk"
original = "ラクシャはセシアからマイクを受け取ると、ステージの最前面に歩み出た。"
translation = "락샤는 세시아로부터 마이크를 받아 들고, 무대 가장 앞으로 걸어 나왔다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「みなさーん！\u3000ハロウィン、楽しんでますかーっ！」"
translation = "「여러분ー! 할로윈, 즐기고 계신가요ー!」"

[[dialogue]]
speaker = "unk"
original = "喝采が起こる。"
translation = "갈채가 일어난다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ハロウィンパーティーに天から舞い降りた守護天使、『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』でーす！」"
translation = "「할로윈 파티에 하늘에서 내려온 수호천사, 『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』입니다~!」"

[[dialogue]]
speaker = "unk"
original = "また、喝采が起こる。"
translation = "다시금, 갈채가 일어난다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「今日はね、リクリエからの復興を頑張ってるみんなに元気を届けようと思って、こうしてライブとかしてみたんですけど……」"
translation = "「오늘은 말이지, 리크리에로부터의 복구를 위해 노력하고 있는 모두에게 힘을 전해 주려고, 이렇게 라이브 같은 걸 해 봤는데……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「みんな、楽しんでくれたかなーっ？」"
translation = "「모두, 즐거웠으려나~?」"

[[dialogue]]
speaker = "unk"
original = "ひと際大きな、喝采が起こる。"
translation = "유난히 큰, 갈채가 일어난다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そっかそっか。楽しんでくれたならよかったよ」"
translation = "「그렇구나 그렇구나. 즐거웠다면 다행이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「だって、バンドを組んでライブしよう、なんてバカなことを言い始めたのはボクなんだけど、実はこれ思いついたのってけっこー最近のことなんだよね」"
translation = "「그치만, 밴드를 결성해서 라이브를 하자, 같은 바보 같은 소리를 시작한 건 나지만, 사실 이거 떠올린 건 제~법 최근 일이었단 말이지」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「おまけに全員、楽器なんて弾いたことがない未経験者。ちゃんとみんなを楽しませることが出来るパフォーマンスになってるか心配だったんだけど……」"
translation = "「게다가 전원, 악기 같은 건 켜 본 적도 없는 미경험자. 제대로 모두를 즐겁게 해줄 수 있는 퍼포먼스가 되었을지 걱정이었는데……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「楽しんでもらえたんだね、そっかそっか……ん～っ……」"
translation = "「즐겨 준 거구나, 그렇구나 그렇구나…… 음~……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボクもすっごく楽しかったーーーーっ！！！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "割れんばかりの、喝采が起こる。"
translation = "터질 듯한, 갈채가 일어난다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ホントはもっとみんなと一緒に盛り上がりたいんだけど……ごめんね、２曲しか用意できなかったから、ライブは次の曲で終わりなんだ」"
translation = "「사실은 좀 더 모두 함께 흥을 돋우고 싶지만…… 미안해, 2곡밖에 준비하지 못해서, 라이브는 다음 곡으로 끝이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「せっかく守護天使が集まったバンドだし、最後の曲に行く前にこの思いつきに付き合ってくれたメンバーを紹介させてよ！」"
translation = "「모처럼 수호천사가 모인 밴드고, 마지막 곡으로 가기 전에 이 엉뚱한 생각에 함께해 준 멤버를 소개할게!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「まずは……ギターのオオヒメ！」"
translation = "「우선은…… 기타 담당 오오히메!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「オオヒメはね、簡単に言うと超真面目で努力家かな」"
translation = "「오오히메는 말이야, 간단히 말해 엄청 진지하고 노력파려나」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「今回の練習でもいっちばん真面目だったね～。おかげであっという間にギターも弾けるようになっちゃったんだ」"
translation = "「이번 연습에서도 제일 진지했었지~. 덕분에 눈 깜짝할 사이에 기타도 칠 수 있게 되어 버렸거든」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「世話焼きなところもあって、ちょっと口うるさいなーって思うこともあるけど……でも、居ないと困るみんなのまとめ役って感じだね」"
translation = "「남을 잘 챙기는 면도 있어서, 약간 잔소리가 심하네~ 하고 생각할 때도 있지만…… 그래도, 없으면 난감한 모두의 총괄 역할이라는 느낌이네」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あと、ド天然でからかうといい音が鳴るから、みんなも弄ってあげてねーっ！」"
translation = "「그리고, 엄청 천연이라 놀리면 좋은 소리가 나니까, 모두들 장난쳐 봐~!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「なんだとっ！？」"
translation = "「뭐라고!?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「さて、次はベースのアルモタヘル！」"
translation = "「자, 다음은 베이스 담당 알모타헬!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「どう？\u3000見た目、ちょっといかつくて怖い感じするよね？」"
translation = "「어때? 겉모습은, 약간 험악해서 무서운 느낌이 들지?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「でも実は全然だよ。話してみたら、超面白いから。見かけたら声をかけてみてよ。主に出没するのは……ご飯が食べられるところかな？」"
translation = "「하지만 사실은 전혀 안 그래. 얘기해 보면, 엄청 재미있으니까. 보이면 말을 걸어 봐. 주로 출몰하는 곳은…… 밥을 먹을 수 있는 곳이려나?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「お肉が大好きでさ。いっつも肉のことばっかり考えてるんだよ。練習の時もお腹がすいて倒れちゃってさ、何を言うかと思ったら『肉が食べたい』ってさ」"
translation = "「고기를 엄청 좋아해서 말이야. 언제나 고기 생각만 하고 있다구. 연습할 때도 배가 고파서 쓰러져 버려가지고, 무슨 말을 하나 했더니 『고기가 먹고 싶다』라고 하더라고」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ね、面白いでしょう？\u3000このライブの打ち上げは焼肉ってことになってるんだけど、もう頭の中はそのことでいっぱいじゃないかな？」"
translation = "「그치, 재미있지? 이 라이브의 뒤풀이는 고깃집으로 정해져 있는데, 벌써 머릿속은 그 생각으로 가득하지 않을까?」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「肉が美味い店の情報を知っていれば、遠慮はいらん、我に申すがよい！」"
translation = "「고기가 맛있는 가게의 정보를 알고 있다면, 사양할 필요 없다, 짐에게 아뢰도록 해라!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「えーっと次は誰にしようかな……じゃあ、ドラムのマグダレナ！」"
translation = "「으음~ 다음은 누구로 할까…… 그럼, 드럼 담당 막달레나!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「マグダレナはねー。見た通り、そのまんまのお姉さんって感じかな？」"
translation = "「막달레나는 말이지~. 보이다시피, 그대로의 누님이라는 느낌이려나?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「オオヒメとはちょっと方向性の違う世話焼きでね～。ボクはよくわかんないんだけど、母性？\u3000とか、そんな感じっぽいよ」"
translation = "「오오히메와는 약간 방향성이 다른 보살핌이라 말이지~. 나는 잘 모르겠지만, 모성? 같은, 그런 느낌 같아」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「けど、そろそろ人間界にも慣れてきて、ちょっとずつだらしないところが見え始めてるかな～。そうそう、この間なんかもね～……」"
translation = "「하지만, 슬슬 인간계에도 익숙해져서, 조금씩 게으른 모습이 보이기 시작하려나~. 맞아 맞아, 얼마 전에도 말이야~……」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ラクシャ？\u3000親しみを持たれるのは良いことですが、守護天使としての威厳も大切ですよ？」"
translation = "「락샤? 친근감을 느끼게 하는 것은 좋습니다만, 수호천사로서의 위엄도 중요하다고요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「はーい、叱られたのでやめときまーす」"
translation = "「네~, 혼났으니까 그만둘게~요」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ……！\u3000こら、気配を消そうとしない！\u3000そこのキーボード担当のパテル！」"
translation = "「아……! 이봐, 기척을 지우려고 하지 마! 거기 키보드 담당 파텔!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ポリシーらしいんだけどね、あんまり人前に出たがらないんだよ。ほらほら、もうステージに出ちゃったんだから、あきらめてご挨拶しときなよ」"
translation = "「신념인 것 같지만 말이야, 그다지 사람들 앞에 나서는 걸 안 좋아해. 자자, 이미 무대에 나와 버렸으니까, 포기하고 인사나 하라고」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ああ、そうそう。パテルはね、超イタズラ好きだから要注意ね」"
translation = "「아아, 맞아 맞아. 파텔은 말이야, 엄청 장난을 좋아하니까 주의해야 해」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「特に今日はハロウィンだから、なにかイタズラしてやろうって企んでるんじゃないかな？」"
translation = "「특히 오늘은 할로윈이니까, 무슨 장난을 칠까 꾸미고 있는 게 아닐까?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「イタズラがしたいだけだから、お菓子をあげても許してもらえないだろうし……あんまりデネブのみんなに迷惑をかけないようにね」"
translation = "「장난을 치고 싶을 뿐이니까, 과자를 줘도 용서해 주지 않을 거고…… 그다지 데네브의 모두에게 피해를 주지 않도록 해줘」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「あたしは善良な一般市民にイタズラなんてしないよ～だ！\u3000もう、勝手なこと言わないでよね！」"
translation = "「난 선량한 일반 시민에게 장난 따위 치지 않는다고~! 정말, 제멋대로 말하지 말라고!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そして最後のメンバーは、さっき可愛い声でロックな歌を聴かせてくれたボーカル、セシア！」"
translation = "「그리고 마지막 멤버는, 아까 귀여운 목소리로 록한 노래를 들려준 보컬, 세시아!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「セシアは見た目に反してかなりのしっかり者なんだけど、ちょーっと困った性癖をもってるんだよね」"
translation = "「세시아는 외모와는 달리 제법 야무지지만, 사~짝 곤란한 성벽을 가지고 있단 말이지」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「母性を感じる人を見かけると、すーぐ甘えにいってママにしちゃうんだよ。実は１番の要注意人物かもしれないな～、みんなも気を付けて」"
translation = "「모성을 느끼게 하는 사람을 보면, 바~로 어리광 부리러 가서 엄마로 만들어 버린다구. 사실 제일 주의해야 할 인물일지도 몰라~, 모두들 조심해」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「わたくしの新しいママになってくれるヒトがいるなら、いつでも歓迎するわ♪」"
translation = "「저의 새로운 엄마가 되어 주실 분이 계시다면, 언제든 환영이에요♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「とまあ、守護天使って実はこんな変わり者集団だったりするんだけど……ちょっとはボクたちのこと、知ってもらえたかな？」"
translation = "「라며 뭐, 수호천사라는 건 사실 이런 괴짜 집단이기도 한데…… 조금은 우리에 대해, 알게 되었으려나?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うんうん、それじゃメンバー紹介はこのくらいにして……そろそろ行こうかなっ！」"
translation = "「응응, 그럼 멤버 소개는 이 정도로 하고…… 슬슬 가 볼까!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「最後まで楽しんで行ってくださいねーっ！\u3000以上、ギター担当、《円環》のラクシャでしたーっ♪」"
translation = "「끝까지 즐기다 가 주세요~! 이상, 기타 담당, 《원환》의 락샤였습니다~♪」"

[[dialogue]]
speaker = "unk"
original = "もう一度、割れんばかりの拍手と喝采を受けながら、最後の曲が始まった。"
translation = "다시 한번, 터질 듯한 박수와 갈채를 받으며, 마지막 곡이 시작되었다."

[[dialogue]]
speaker = "unk"
original = "熱狂が渦を巻く。"
translation = "열광이 소용돌이친다."

[[dialogue]]
speaker = "unk"
original = "こうしてデネブのハロウィンパーティーは、盛り上がりの最高潮を迎えたのだった。"
translation = "이렇게 데네브의 할로윈 파티는, 열기의 최고조를 맞이한 것이었다."

