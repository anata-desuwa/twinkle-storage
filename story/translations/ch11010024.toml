[[dialogue]]
speaker = "unk"
original = "第４話,白紙の予定表,P"
translation = "제4화, 백지의 예정표"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「む～～～～～～」"
translation = "「으으으음~~~~」"

[[dialogue]]
speaker = "unk"
original = "放課後、一緒に帰ろうとシルヴィ先輩を迎えに行くと、難しい顔で何やら唸っていた。手にはプリントを持っている。"
translation = "방과 후, 같이 하교하려고 실비 선배를 데리러 가니, 심각한 얼굴로 무언가 끙끙거리고 있었다. 손에는 유인물을 들고 있다."

[[dialogue]]
speaker = "unk"
original = "どうしたんですか？"
translation = "무슨 일이에요?"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、会長くん！\u3000見てよコレ」"
translation = "「아, 회장 군! 이것 좀 봐」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩がにらめっこしていたプリントには『進路希望調査』と書いてある。"
translation = "실비 선배가 노려보고 있던 유인물에는 『진로 희망 조사』라고 적혀 있다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ゼロなんとかも倒して、リクリエも落ち着いたけどさ。今度は先のことも考えないとなんだよねぇ……」"
translation = "「제로 뭐시기도 쓰러뜨리고 리크리에도 진정됐지만 말이야. 이제는 앞날도 생각해야 하니까……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「最初は学園を卒業したら、天界に帰るつもりだったけど、今は迷ってるんだ。帰ったら、ＧＦＣもボスチキンも購買のチキンもないし」"
translation = "「처음에는 학원을 졸업하면 천계로 돌아갈 생각이었는데, 지금은 망설여져. 돌아가면 GFC도 보스 치킨도 매점 치킨도 없잖아」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「それに何より──」"
translation = "「그리고 무엇보다──」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「君がいないからね」"
translation = "「네가 없으니까 말이야」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「んふふっ、照れてる？\u3000つんつん……へへへ、ほっぺた柔らか～い。おやおや～、顔が赤くなってきたぞ～？」"
translation = "「음후훗, 부끄러워? 쿡쿡…… 헤헤헤, 볼 말랑말랑해~. 오호라~, 얼굴이 빨개지기 시작했네~?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ごめんごめん、可愛くってつい。あ、でも、男の子に可愛いって言うのはよくないかな？」"
translation = "「미안 미안, 귀여워서 나도 모르게. 아, 하지만 남자애한테 귀엽다고 하는 건 안 좋으려나?」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩ならいいです"
translation = "실비 선배라면 괜찮아요"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ありがと。ふふっ、彼女だけの特権だね」"
translation = "「고마워. 후훗, 여자친구만의 특권이네」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「真面目な話、君とは離れたくない。でも故郷に帰りたい自分もいて…………どうしようかなって」"
translation = "「진지하게 말하자면, 너랑은 떨어지고 싶지 않아. 하지만 고향에 돌아가고 싶은 마음도 있고………… 어떡하면 좋을까 싶어서」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩が俺を故郷と同じくらい大事に思ってくれている。"
translation = "실비 선배가 나를 고향만큼이나 소중하게 생각해주고 있다."

[[dialogue]]
speaker = "unk"
original = "それは嬉しいけど、悩ませているのは申し訳なく感じる。"
translation = "그건 기쁘지만, 고민하게 만드는 것이 미안하게 느껴진다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「遠距離恋愛もしたくないし……会長くんの周りには、魅力的な女の子いっぱいいるもん。君が浮気するとは思わないけど、やっぱり不安になっちゃうよ」"
translation = "「원거리 연애도 하고 싶지 않고…… 회장 군 주변엔 매력적인 여자애들이 잔뜩 있는걸. 네가 바람피울 거라곤 생각 안 하지만, 역시 불안해져 버려」"

[[dialogue]]
speaker = "unk"
original = "浮気なんてしません"
translation = "바람 같은 거 안 피워요"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「会長くん……」"
translation = "「회장 군……」"

[[dialogue]]
speaker = "unk"
original = "俺の気持ちを伝えたくて、シルヴィ先輩の目をじっと見る。"
translation = "내 마음을 전하고 싶어서 실비 선배의 눈을 가만히 바라본다."

[[dialogue]]
speaker = "unk"
original = "やがて先輩は目を閉じて……"
translation = "이윽고 선배는 눈을 감고……"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker = "unk"
original = "誘われるように、唇に近付く──"
translation = "이끌리듯 입술에 다가간다──"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「なにやってるのよ、あなたたち」"
translation = "「뭐 하는 거니, 너희들」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「きゃ～～～～～～っ！？」"
translation = "「꺄아아아아악!?」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「放課後とはいえ、現役の星徒会長と元星徒会役員が学園内で乳繰り合うとはいい度胸ね。選管にでも報告しておこうかしら？」"
translation = "「방과 후라고는 하지만, 현역 성태회장과 전 성태회 임원이 학내에서 애정 행각이라니 배짱이 좋구나. 선관위에라도 보고해둘까?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「マム！？\u3000どうしてここに！？」"
translation = "「마무!? 왜 여기 있는 거야!?」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「どうしても何も、忘れ物を取りに来ただけよ。それより、進路希望で悩むなんてあなたらしくないというか、意外ね」"
translation = "「왜고 뭐고 잊으러 온 물건을 가지러 왔을 뿐이야. 그보다 진로 희망으로 고민하다니 너답지 않달까 의외네」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「え、聞こえてた？」"
translation = "「어, 들렸어?」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「盗み聞きするつもりはなかったけれどね」"
translation = "「엿들을 생각은 없었지만 말이야」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「あなた、星徒会に入る時は即断即決だったらしいじゃない。そのあなたがこんなに悩む姿を見るとは思わなかったわ」"
translation = "「너, 성태회에 들어올 때는 즉단즉결이었다면서. 그런 네가 이렇게 고민하는 모습을 보게 될 줄은 몰랐어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あたしだって悩むときは悩みますー！\u3000……ちなみに、マムは進路希望、なんて書いた？」"
translation = "「나도 고민할 때는 고민한다구요─! ……참고로 마무는 진로 희망 뭐라고 썼어?」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「実家に帰って妃竜院家を継ぐって書いたわ。当たり前でしょ」"
translation = "「본가로 돌아가서 비룡원 가문을 잇겠다고 썼어. 당연하잖아」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「そりゃそうだー！\u3000マム、魔界の貴族だった！」"
translation = "「그렇구나─! 마무, 마계 귀족이었지!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「……ねぇ、マムに恋人がいたらどうする？」"
translation = "「……있지, 마무에게 연인이 있다면 어떡할 거야?」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「当然、連れて帰るわ」"
translation = "「당연히 데리고 가야지」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「即答！？」"
translation = "「즉답!?」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「私の恋人なら私の在り方を理解しているはずよ。あなたはそうじゃないの？」"
translation = "「내 연인이라면 나의 삶의 방식을 이해하고 있을 텐데. 너는 그렇지 않니?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「それは……う～ん、分かんない。一緒についてきてほしい気持ちもあるけど、うちの田舎、ホントに何もないし…………」"
translation = "「그건…… 으음, 모르겠어. 함께 가줬으면 하는 마음도 있지만 우리 시골은 정말로 아무것도 없고…………」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「あなたにも遠慮とかあったのね。ますます意外だわ」"
translation = "「너에게도 사양이라는 게 있었구나. 점점 더 의외인걸」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「まぁいいわ。あなたがそんなに悩むなら、すぐに答えなんて出ないでしょう。これで気分転換でもしてきなさい」"
translation = "「뭐 좋아. 네가 그렇게 고민한다면 금방 답이 나오진 않겠지. 이걸로 기분 전환이라도 하고 오렴」"

[[dialogue]]
speaker = "unk"
original = "そう言って、マムがくれたのはナイトプールのチケットだった。"
translation = "그렇게 말하며 마무가 준 것은 나이트 풀 티켓이었다."

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「もらいものだけど、私は使わないからあなたたちにあげるわ」"
translation = "「받은 거지만 난 안 쓸 테니까 너희 줄게」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「え、ありがとう！\u3000えぇっと……畏怖！」"
translation = "「엣, 고마워! 에 그러니까…… 외포!」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「いや、それ、挨拶じゃないから。……あなたには卒業までに畏怖の意味を教えたかったけど、無理そうね。じゃあ私はこれで失礼するわ」"
translation = "「아니, 그거 인사 아니니까. ……너에게 졸업 전까지 외포의 의미를 가르쳐주고 싶었지만 무리 같네. 그럼 난 이만 실례하겠어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、マム、忘れ物は？」"
translation = "「아, 마무, 잊은 물건은?」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「それは会長に何とかしてもらうわ。頼んだわよ？」"
translation = "「그건 회장이 어떻게든 해줄 거야. 부탁하마?」"

[[dialogue]]
speaker = "unk"
original = "俺に目配せして、マムは帰ってしまった。どうやらシルヴィ先輩を心配して戻ってきてくれたようだ。"
translation = "나에게 눈짓하고 마무는 돌아가 버렸다. 아무래도 실비 선배가 걱정되어 돌아와 준 모양이다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「チケット、もらっちゃったね。せっかくだから、早速、使っちゃう……？」"
translation = "「티켓, 받아버렸네. 이왕 이렇게 된 거 바로 써버릴까……?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「へ～、ナイトプールってこんな感じなんだね」"
translation = "「헤~, 나이트 풀은 이런 느낌이구나」"

[[dialogue]]
speaker = "unk"
original = "ムーディーな照明に照らされ、昼間とは打って変わった雰囲気を纏うプール。非日常的な空間だ。"
translation = "무드 있는 조명에 비쳐 낮과는 사뭇 다른 분위기를 띠는 수영장. 비일상적인 공간이다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「なんていうか…………ちょっとエッチ？」"
translation = "「뭐랄까………… 조금 야한데?」"

[[dialogue]]
speaker = "unk"
original = "言い方！"
translation = "말투가 그게 뭐야!"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「えぇ～、だってさ、外でプールなのに、夜だから暗くて寝室みたいじゃん」"
translation = "「에에~, 그게 말야, 야외 수영장인데 밤이라 어두워서 꼭 침실 같잖아」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「でも、不思議と落ち着くかも。うん、けっこう好き～」"
translation = "「하지만 묘하게 마음이 차분해질지도. 응, 꽤 좋아~」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「空気がじめっとして……じゃなくて、しっとりしてるっていうか……ああもう、上手く説明できないや。会長くん、こっち来て！」"
translation = "「공기가 눅눅해서…… 가 아니라, 촉촉하달까…… 아 정말, 잘 설명을 못 하겠어. 회장 군, 이쪽으로 와!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ああ、ごめん！\u3000勢い余って落ちちゃった！」"
translation = "「아아, 미안! 기세가 넘쳐서 빠져버렸어!」"

[[dialogue]]
speaker = "unk"
original = "水の中で密着する。シルヴィ先輩の体が触れ合って、体温が伝わってくる。"
translation = "물속에서 밀착한다. 실비 선배의 몸이 닿으며 체온이 전해져 온다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ごめんついでに、このままぎゅってしてて…………うん、ありがと」"
translation = "「미안한 김에 이대로 꼭 안고 있어줘………… 응, 고마워」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「会長くんを近くに感じるって言いたかったんだけど……物理的にゼロ距離だね……あはは…………」"
translation = "「회장 군을 가깝게 느끼고 싶다고 말하려 했는데…… 물리적으로 제로 거리네…… 아하하…………」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「……このまま聞いて」"
translation = "「……이대로 들어줘」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あたしは星騎士になるために流星市国に来た」"
translation = "「나는 성기사가 되기 위해 유성시국에 왔어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ここで、みんなと出会って、いろんな楽しいこと、いろんなチキンやから揚げにも出会って…………君にも出会えた」"
translation = "「여기서 모두와 만나고, 여러 가지 즐거운 일, 여러 가지 치킨이나 가라아게와도 만나고………… 너와도 만났어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「みんなみんな、あたしの大好きな一部なんだ。だからこの街を離れたくないけど、故郷もやっぱりあたしの一部だから、帰りたい気持ちも本当なんだ」"
translation = "「모두 모두, 내가 정말 좋아하는 일부야. 그래서 이 거리를 떠나고 싶지 않지만, 고향도 역시 나의 일부니까 돌아가고 싶은 마음도 진심이야」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「会長くんにも同じように、やりたいこととかあると思う。一緒に生きていきたいけど、できるかどうかは分かんない」"
translation = "「회장 군에게도 마찬가지로 하고 싶은 일이라든가 있을 거라 생각해. 함께 살아가고 싶지만, 그럴 수 있을지 어떨지는 모르겠어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「だから、今はまだ答えは出さないよ。君と少しづつ答え合わせできたらいいな…………ダメかな？」"
translation = "「그러니까, 지금은 아직 답을 내지 않을게. 너와 조금씩 답을 맞춰갈 수 있다면 좋겠네………… 안 될까?」"

[[dialogue]]
speaker = "unk"
original = "一緒に納得いく答えを見付けましょう"
translation = "함께 납득할 수 있는 답을 찾아보자"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「うん、ありがとう。会長くんならそう言ってくれるって思ってた」"
translation = "「응, 고마워. 회장 군이라면 그렇게 말해줄 거라고 생각했어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「……んふふっ、言いたいこと全部言えた気がする。来てよかったね」"
translation = "「……응후후, 하고 싶은 말 전부 한 것 같아. 오길 잘했네」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「今日はこのままゆったりして…………むむっ、チキンの匂い！」"
translation = "「오늘은 이대로 느긋하게 지내면서………… 므믓, 치킨 냄새!」"

[[dialogue]]
speaker = "unk"
original = "このプールではフードメニューにも力を入れている。美味しいフライドチキンにも出会えるかもしれない。"
translation = "이 수영장에서는 푸드 메뉴에도 힘을 쏟고 있다. 맛있는 프라이드치킨과도 만날 수 있을지도 모른다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「チキーン！\u3000どこだー！！」"
translation = "「치키이인! 어디냐아!!」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩に手を引かれ、プールサイドをどたどた駆けまわる夜だった。"
translation = "실비 선배에게 손을 이끌려, 풀사이드를 타다닥 달려 다니는 밤이었다."

