[[dialogue]]
speaker = "unk"
original = "第３話,ラブコメ漫画談義,P"
translation = "제3화, 러브코미디 만화 담의, P"

[[dialogue]]
speaker = "unk"
original = "カフェテリアに、イクシーと俺、リィベルが揃った。このメンバーで何をするのかというと──"
translation = "카페테리아에 익시와 나, 리벨이 모였다. 이 멤버로 무엇을 하느냐 하면──"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「はい、どうぞ。私のおすすめです」"
translation = "「자, 여기요. 제 추천작이에요.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「ありがとう。私はこれよ」"
translation = "「고마워. 나는 이거야.」"

[[dialogue]]
speaker = "unk"
original = "じゃあ、俺からはこれ"
translation = "그럼, 나한테선 이거."

[[dialogue]]
speaker = "unk"
original = "俺たちは定期的におすすめの漫画を貸し合うようになっていた。"
translation = "우리들은 정기적으로 추천 만화를 서로 빌려주게 되었다."

[[dialogue]]
speaker = "unk"
original = "もともと俺は漫画を読むのが趣味だし、イクシーも偏りはあるけど漫画は好きだ。"
translation = "원래 나는 만화를 읽는 게 취미고, 익시도 치우침은 있지만 만화를 좋아한다."

[[dialogue]]
speaker = "unk"
original = "リィベルが漫画に興味を持ったところに俺たちが漫画を貸したのがきっかけで、この流れができたのだった。"
translation = "리벨이 만화에 흥미를 가졌을 때 우리가 만화를 빌려준 것이 계기가 되어, 이런 흐름이 생긴 것이었다."

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「貸してもらっておいてなんだけど、イクシリオンの好みの偏りがすごいわね」"
translation = "「빌려받고서 하는 말이지만, 익시리온의 취향은 편향이 심하네.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「この前は主人公がエッチなトラブルに巻き込まれるラブコメで、その前のは主人公がエッチなトラブルに巻き込まれるラブコメだったわよね」"
translation = "「저번엔 주인공이 야한 트러블에 휘말리는 러브코미디였고, 그 전것도 주인공이 야한 트러블에 휘말리는 러브코미디였지?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「そして今回は……やっぱり主人公がエッチなトラブルに巻き込まれるラブコメなのね」"
translation = "「그리고 이번엔…… 역시 주인공이 야한 트러블에 휘말리는 러브코미디구나.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「うぅ、偏っててすみません……。ですが、おすすめなのは本当です。みんな面白いんですよ！」"
translation = "「우으, 치우쳐 있어서 죄송해요…… 하지만 추천하는 건 정말이에요. 다들 재미있다구요!」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「別に責めてないわ。あなたのおすすめ、ちゃんと面白いし」"
translation = "「딱히 책망하는 건 아니야. 네 추천작, 확실히 재미있고.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「リィベルさんのおすすめは……不器用な２人の恋模様を描いた作品ですね。確か最近、アニメ化もしていましたよね？」"
translation = "「리벨 씨의 추천작은…… 서투른 두 사람의 사랑 모습을 그린 작품이네요. 그러고 보니 최근 애니화도 되었었죠?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「ええ。私もアニメから入って原作にドハマりしたわ。有名な作品だから、もう読んでるかもしれないけど……」"
translation = "「응. 나도 애니로 입문해서 원작에 푹 빠졌어. 유명한 작품이니까 이미 읽었을지도 모르지만……」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「いえ、気になってはいたんですけど、まだ読めてなかったので、ちょうどよかったです。ありがとうございます」"
translation = "「아니요, 관심은 있었는데 아직 못 읽어봐서 딱 잘됐어요. 감사합니다.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「ふっ。ならよかったわ」"
translation = "「후훗. 그럼 다행이고.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ではまたお会いしましょう。感想、聞かせてくださいね」"
translation = "「그럼 또 만나요. 감상, 들려주세요.」"

[[dialogue]]
speaker = "unk"
original = "数日後。俺たちは再びカフェテリアに集った。"
translation = "며칠 후. 우리들은 다시 카페테리아에 모였다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「リィベルさんのおすすめ、本当によかったです。お互いを想い合う２人の気持ちに胸がきゅんとしてしまいました。アニメもチェックしてみようと思います」"
translation = "「리벨 씨의 추천작, 정말 좋았어요. 서로를 생각하는 두 사람의 마음 때문에 가슴이 쿵클해져 버렸어요. 애니도 체크해 보려고 해요.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「でしょう。キャストも合ってるからぜひ観てみて」"
translation = "「그렇지? 캐스팅도 잘 어울리니까 꼭 봐봐.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「あなたのおすすめも面白かったわ。エッチなトラブルは多かったけど……いや、本当にエッチなトラブルばっかりなんだけど……それでも、だからこそ面白いのかしら」"
translation = "「네 추천작도 재미있었어. 야한 트러블은 많았지만…… 아니, 정말 야한 트러블뿐이었지만…… 그래도, 그렇기 때문에 재미있는 걸까.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ええ、そうなんです！\u3000主人公の男の子は特別な力を持っていて、それを目的に多くのヒロインが彼を誘惑するのですが、主人公は振り向きもしません」"
translation = "「네, 맞아요! 주인공 남학생은 특별한 힘을 가지고 있어서, 그걸 목적으로 많은 히로인이 그를 유혹하지만 주인공은 돌아보지도 않아요.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「彼は自分の力で大切な人を失っていて、力の怖さを知っているから、力を目的にした関係の虚しさを誰よりも理解しているんです」"
translation = "「그는 자신의 힘 때문에 소중한 사람을 잃어서, 힘의 무서움을 알고 있기 때문에, 힘을 목적으로 한 관계의 허무함을 누구보다 이해하고 있거든요.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「自分を誘惑してくるヒロインたちにも幸せになって欲しくて、打算による誘惑を振り払うのよね。本心では動じてるのに。硬派とはこのことね」"
translation = "「자신을 유혹해 오는 히로인들도 행복해지길 바라서, 타산에 의한 유혹을 뿌리치는 거지. 본심으로는 동요하면서도. 하드보일드라는 건 이런 거겠지.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「そうですそうです！\u3000その優しさがいつしかヒロインに伝わって、彼女たちも気付かないうちに主人公に惹かれてしまうんです……でも主人公はそれに気付かないんですよねぇ」"
translation = "「맞아요, 맞아요! 그 상냥함이 어느샌가 히로인에게 전달되어서, 그녀들도 모르는 사이에 주인공에게 끌려버리는 거예요…… 하지만 주인공은 그걸 눈치채지 못하죠.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「そういう意味では８巻は秀逸だったわね」"
translation = "「그런 의미에서는 8권이 뛰어났어.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あ、あのシーンですね？\u3000初登場時は主人公に裸を見られても動じなかったヒロインが、好意を自覚してからは、裸を見られるのが恥ずかしくってつい隠してしまうんですよね」"
translation = "「아, 그 장면 말이죠? 첫 등장 때는 주인공에게 알몸을 보여도 동요하지 않던 히로인이, 호감을 자각하고 나서는 알몸을 보이는 게 부끄러워서 그만 숨겨버리는 거요.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「今まで恥じらいの表情を見せなかったヒロインが、ついに見せる羞恥……とっってもエッチでした～<emoji=heart04>\u3000思い出しただけでよだれが止まりません！」"
translation = "「지금까지 수줍어하는 표정을 보여주지 않던 히로인이 마침내 보여주는 수치심…… 어엄청 야했어요～<emoji=heart04> 떠올린 것만으로 침이 안 멈춰요!」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「まぁ、かなりセンシティブなシーンだったわね。でも、今までと違うリアクションで関係性の変化を見せるのは感心したわ」"
translation = "「뭐, 상당히 센시티브한 장면이었지. 하지만 지금까지와 다른 리액션으로 관계의 변화를 보여주는 건 감탄했어.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「肝心の主人公には好意が伝わらないのが残念です……」"
translation = "「정작 중요한 주인공에게는 호감이 전달되지 않는 게 아쉬워요……」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「まぁね。ラブコメの主人公は鈍感じゃないと身がもたないから仕方ないわ」"
translation = "「뭐 그렇지. 러브코미디의 주인공은 둔감하지 않으면 버틸 수가 없으니까 어쩔 수 없어.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「この主人公、自分は幸せになっちゃいけないと思っているのが不憫で……なんとか幸せになって欲しいです」"
translation = "「이 주인공, 자신은 행복해지면 안 된다고 생각하는 게 가엾어서…… 어떻게든 행복해졌으면 좋겠어요.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「明るい作風とは裏腹に、けっこう闇が深いのよね。作者の癖なんでしょうね」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "この作者の前作は登場人物をいじめ抜く作風で評判だったから、それが今作にも活きているようだ。"
translation = "이 작가의 전작은 등장인물을 괴롭히는 작풍으로 평판이 자자했기에, 그것이 이번 작에도 살아있는 듯하다."

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「エッチなシーン盛りだくさんなんですけど、それだけじゃなくて、いつの間にかヒロインや主人公の幸せを願っているんですよね。本当に素敵な漫画です」"
translation = "「야한 장면이 가득하지만, 그것뿐만 아니라 어느샌가 히로인이나 주인공의 행복을 빌게 돼요. 정말 멋진 만화예요.」"

[[dialogue]]
speaker = "unk"
original = "イクシーが漫画を気に入ってくれて嬉しくなる。漫画好きとして鼻が高い。"
translation = "익시가 만화를 마음에 들어 해줘서 기뻐진다. 만화가로서 뿌듯하다."

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「なんで魔王がにやけてるのよ」"
translation = "「왜 마왕이 싱글벙글하는 거야?」"

[[dialogue]]
speaker = "unk"
original = "この漫画をイクシーに勧めたの俺だから"
translation = "이 만화를 익시에게 추천한 건 나니까."

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「そうなの。面白いのは認めるけど、よく彼女にこんなスケベ漫画を勧めたわね。さすが魔王、と言っておくわ」"
translation = "「그렇구나. 재미있는 건 인정하지만, 잘도 그녀에게 이런 야한 만화를 추천했네. 역시 마왕, 이라고 해두지.」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「興味深いお話をされていますね。私も混ぜていただけますか？」"
translation = "「흥미로운 이야기를 하고 계시네요. 저도 끼워주실 수 있나요?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「あなたは──」"
translation = "「당신은──」"

[[dialogue]]
speaker_original = "ウルスラ"
speaker_translation = "우르슬라"
original = "「私は流星学園３年生のウルスラ・バレンタインと申します。購買部をお手伝いしていますから、お会いしたこともあるかもしれませんが」"
translation = "「저는 유성학원 3학년 우르술라 발렌타인이라고 합니다. 매점을 돕고 있으니 만나뵌 적이 있을지도 모르겠습니다만.」"

[[dialogue]]
speaker_original = "ウルスラ"
speaker_translation = "우르슬라"
original = "「盗み聞きするつもりはなかったのですが、つい耳に入ってしまって……そのラブコメ漫画、私にもご教授お願いできませんか？」"
translation = "「엿들으려던 건 아니었지만 그만 귀에 들어와버려서…… 그 러브코미디 만화, 제게도 가르침을 주실 수 없을까요?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「もちろんです！\u3000まずは一巻をどうぞ！」"
translation = "「물론이죠! 우선 1권부터 보세요!」"

[[dialogue]]
speaker_original = "ウルスラ"
speaker_translation = "우르슬라"
original = "「では、失礼して……むむ、なんてハレンチな…………え、この主人公、お乳にもお尻にも興味を示さないなんて！？」"
translation = "「그럼 실례해서…… 흠흠, 어쩜 이리 파렴치한………… 어, 이 주인공, 가슴에도 엉덩이에도 흥미를 보이지 않는다니!?」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「最初はそうお思いでしょう。ささ、読み進めてください」"
translation = "「처음엔 그렇게 생각하시겠죠. 자자, 더 읽어보세요.」"

[[dialogue]]
speaker_original = "ウルスラ"
speaker_translation = "우르슬라"
original = "「はぁ……？\u3000え、あとの回想で主人公も動揺してるの分かるじゃないですか！？\u3000でも鋼の理性で何でもないふりを……ハードボイルドですね」"
translation = "「하아……? 어, 뒤의 회상에서 주인공도 동요하고 있는 걸 알 수 있잖아요!? 하지만 강철 같은 이성으로 아무렇지 않은 척을…… 하드보일드하네요.」"

[[dialogue]]
speaker_original = "ウルスラ"
speaker_translation = "우르슬라"
original = "「この主人公の方、深い傷を抱えていらっしゃるんですね……でも、だからこそ、ヒロインたちに慈愛を以て接しておられる……」"
translation = "「이 주인공 분, 깊은 상처를 안고 계신 거군요…… 하지만 그렇기에 히로인들에게 자애를 가지고 대하시는……」"

[[dialogue]]
speaker_original = "ウルスラ"
speaker_translation = "우르슬라"
original = "「それじゃダメなんですよ、慈愛では！\u3000慈愛と愛は別物です！\u3000うぅ、もどかしい……今すぐこの中に入って仲を進展させたいぃ……」"
translation = "「그렇게는 안 돼요, 자애로는! 자애와 사랑은 별개예요! 우으, 안달 나라…… 지금 당장 이 안에 들어가서 관계를 진전시키고 싶어어……」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「その気持ち、痛いほど分かります」"
translation = "「그 마음, 뼈저리게 이해해요.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「激しく同意するわ」"
translation = "「격렬하게 동의해.」"

[[dialogue]]
speaker_original = "ウルスラ"
speaker_translation = "우르슬라"
original = "「それにしても不思議な作品ですね。最初はハレンチさに驚きましたけど、いつの間にか気にならなく……いえ、ないと物足りなくなってしまいます」"
translation = "「그건 그렇고 신기한 작품이네요. 처음엔 파렴치함에 놀랐지만 어느샌가 신경 쓰이지 않게…… 아니, 없으면 아쉬워져 버려요.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「ええ、ストーリーももちろんですが、画も素晴らしいんです！\u3000私が一番好きなのは５巻の、ヒロインたちがあられもない姿で集結するシーンで……」"
translation = "「네, 스토리도 물론이지만 그림도 뛰어나요! 제가 가장 좋아하는 건 5권의, 히로인들이 차마 볼 수 없는 모습으로 집결하는 장면인데요……」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「ねぇ、ちょっと」"
translation = "「저기, 잠깐만.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「え？\u3000ミ、ミアさん！？\u3000どうしてここに！？」"
translation = "「네? 미, 미아 씨!? 어째서 여기에!?」"

[[dialogue]]
speaker_original = "ミア"
speaker_translation = "미아"
original = "「どうしても何も、カフェテリアで猥談してる学生がいるって風紀委員に通報があったんだけど……まさかイクシーさんたちだったなんて思わなかったわ」"
translation = "「어째서고 뭐고, 카페테리아에서 음담패설을 하는 학생이 있다는 제보가 풍기위원회에 들어왔는데…… 설마 익시 씨 일행일 줄은 몰랐네.」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「いえ、私たちは漫画について語り合っていただけで、エッチな話をしていたわけでは……」"
translation = "「아니요, 저희는 만화에 대해 이야기하고 있었을 뿐이고, 야한 이야기를 하던 게……」"

[[dialogue]]
speaker_original = "ミア"
speaker_translation = "미아"
original = "「どうせエッチな漫画なんでしょっ！\u3000分かってるわよ！\u3000全員、これから生徒指導室で反省文よ！」"
translation = "「어차피 야한 만화잖아! 알고 있다고! 전원, 지금부터 학생지도실에서 반성문이야!」"

[[dialogue]]
speaker = "unk"
original = "語り合いに熱くなりすぎ、俺たちはそろって連行されてしまった。"
translation = "이야기에 너무 열중한 나머지, 우리들은 가지런히 연행되어 버렸다."

[[dialogue]]
speaker_original = "ウルスラ"
speaker_translation = "우르슬라"
original = "「これもまた、愛の代償ですね」"
translation = "「이것 또한, 사랑의 대가네요.」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「なんで私まで……」"
translation = "「왜 나까지……」"

[[dialogue]]
speaker_original = "イクシリオン"
speaker_translation = "익실리온"
original = "「本当にごめんなさ～い！」"
translation = "「정말 죄송해~요!」"

