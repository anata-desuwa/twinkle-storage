[[dialogue]]
speaker = "unk"
original = "第３話,これからもずっと一緒に,P"
translation = "제3화, 앞으로도 계속 함께, P"

[[dialogue]]
speaker = "unk"
original = "その日、ヨミは俺の家で、以前の『花嫁修業』の続きを行っていた。"
translation = "그날, 요미는 나의 집에서 이전에 했던 『신부 수업』의 이어서를 진행하고 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――はいっ♪\u3000『おいなりさん』できましたよ、会長♪」"
translation = "「──네♪ 『유부초밥』 완성했어요, 회장님♪」"

[[dialogue]]
speaker = "unk"
original = "うん……うまいっ！"
translation = "음…… 맛있다!"

[[dialogue]]
speaker = "unk"
original = "いただきます"
translation = "잘 먹겠습니다"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「えへへっ♪\u3000よかったです」"
translation = "「에헤헤♪ 다행이에요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「少しずつですけど、前より料理もできるようになってきましたし……いいお嫁さんに近付けている気がします♪」"
translation = "「조금씩이지만 전보다 요리도 할 수 있게 되었고…… 좋은 색시에게 가까워지고 있는 느낌이 들어요♪」"

[[dialogue]]
speaker = "unk"
original = "爆裂いいお嫁さんになれるよ"
translation = "폭렬 좋은 색시가 될 수 있어"

[[dialogue]]
speaker = "unk"
original = "ヨミは今のままでも"
translation = "요미는 지금 이대로도"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやんっ<emoji=heart04>\u3000も、もう……会長はすぐそうやって褒めるんですから……<emoji=heart04>」"
translation = "「코양<emoji=heart04> 정, 정말…… 회장님은 금방 그렇게 칭찬하시니까……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「でも……ありがとうございます♪」"
translation = "「하지만…… 감사합니다♪」"

[[dialogue]]
speaker = "unk"
original = "ヨミは照れながらも嬉しそうに微笑む。"
translation = "요미는 수줍어하면서도 기쁜 듯 미소짓는다."

[[dialogue]]
speaker = "unk"
original = "しばらく他愛もない話を続けていた時だった。"
translation = "한동안 사소한 이야기를 이어가던 때였다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そういえば会長――卒業した後のことって考えていますか？」"
translation = "「그러고 보니 회장님── 졸업한 뒤의 일은 생각해 두셨나요?」"

[[dialogue]]
speaker = "unk"
original = "卒業後？"
translation = "졸업 후?"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい。私たち、今は学園に通っていますけど……いつかは卒業しますよね？\u3000……その後のことです」"
translation = "「네. 저희, 지금은 학원에 다니고 있지만…… 언젠가는 졸업하겠죠? ……그 후의 일이에요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私は、星騎士としてのお役目を果たしたら……天ヶ崎神宮へ戻ろうと思っています」"
translation = "「저는 별기사로서의 책무를 다하면…… 아마가사키 신궁으로 돌아가려고 생각하고 있어요」"

[[dialogue]]
speaker = "unk"
original = "実家に戻るんだね"
translation = "친정으로 돌아가는구나"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい。巫女として生まれ育ちましたし、天ヶ崎神宮は私にとって大切な場所ですから……」"
translation = "「네. 무녀로 태어나 자랐고, 아마가사키 신궁은 저에게 소중한 장소이니까요……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「でも……その……会長のことも、もちろん大好きですし……<emoji=heart04>」"
translation = "「하지만…… 그…… 회장님도 물론 너무 좋아하고……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「だから、その時になったら……会長はどうするのかなって、少し気になってしまって……」"
translation = "「그래서, 그때가 되면…… 회장님은 어떻게 할지 조금 신경 쓰여버려서……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「天ヶ崎神宮は魔界にありますから、人間界との行き来も簡単ではありませんし……」"
translation = "「아마가사키 신궁은 마계에 있으니까 인간계와의 왕래도 쉽지 않고……」"

[[dialogue]]
speaker = "unk"
original = "もちろん付いていくよ"
translation = "당연히 따라가지"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――え？\u3000いいんですか……！？」"
translation = "「──에? 괜찮으신가요……!?」"

[[dialogue]]
speaker = "unk"
original = "俺はヨミのことが好きだから"
translation = "나는 요미를 좋아하니까"

[[dialogue]]
speaker = "unk"
original = "当たり前だよ"
translation = "당연한 거야"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長……！\u3000えへへ……<emoji=heart04>\u3000よかったぁ……」"
translation = "「회장님……! 에헤헤……<emoji=heart04> 다행이다……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「実は少しだけ不安だったんです。もし会長が魔界へ行くのは嫌だったら、どうしようって……」"
translation = "「사실 조금 불안했어요. 만약 회장님이 마계에 가는 걸 싫어하시면 어쩌나 하고……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「でも、ちゃんと聞けて安心しました<emoji=heart04>」"
translation = "「하지만 제대로 들을 수 있어서 안심했어요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヨミは嬉しそうに俺の腕へ抱き付く。"
translation = "요미는 기쁜 듯 내 팔에 안겨든다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私の故郷――天ヶ崎神宮のある『アマツミカ』地方は、とても自然が綺麗なんですよ♪」"
translation = "「제 고향── 아마가사키 신궁이 있는 『아마트미카』 지방은 자연이 참 예뻐요♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「小さい頃は、神社の近くの野原をよく走り回っていました♪」"
translation = "「어릴 때는 신사 근처 들판을 자주 뛰어놀곤 했어요♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「古い建物もたくさん残っていて、時代劇みたいな街並みなんです」"
translation = "「오래된 건물도 많이 남아있어서 시대극 같은 거리 풍경이에요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「いつか会長にも……私が育った景色を見てほしいです♪」"
translation = "「언젠가 회장님에게도…… 제가 자란 풍경을 보여드리고 싶어요♪」"

[[dialogue]]
speaker = "unk"
original = "今から、行くのが楽しみだ"
translation = "지금부터 가는 게 기대되네"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はいっ♪\u3000それで……両親にも紹介して……」"
translation = "「네♪ 그래서…… 부모님께도 소개하고……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「せ、正式な婚約者になってもらえたら……<emoji=heart04>」"
translation = "「정, 정식 약혼자가 되어주신다면……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ああ、もちろんだ"
translation = "아아, 물론이지"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「えへへ……<emoji=heart04>」"
translation = "「에헤헤……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「なんだか不思議ですね。少し前までは、卒業したら天ヶ崎神宮へ戻るのが当たり前だと思っていたのに……」"
translation = "「어쩐지 신기하네요. 조금 전까지는 졸업하면 아마가사키 신궁으로 돌아가는 게 당연하다고 생각했는데……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「今は、その先のことまで考えてしまいます」"
translation = "「지금은 그 너머의 일까지 생각해 버려요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長とどんな家に住もうとか……どんな毎日を過ごそうとか……そんなことばかり考えてしまうんです<emoji=heart04>」"
translation = "「회장님과 어떤 집에 살까…… 어떤 매일을 보낼까…… 그런 생각만 하게 돼요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "それだけ真剣ってことだね"
translation = "그만큼 진심이라는 뜻이지"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい<emoji=heart04>\u3000だって私は――本気で会長のお嫁さんになるつもりですから<emoji=heart04>」"
translation = "「네<emoji=heart04> 그야 저는── 진심으로 회장님의 색시가 될 작정이니까요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「だから……天ヶ崎神宮は私の故郷ですけど」"
translation = "「그러니까…… 아마가사키 신궁은 제 고향이지만」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「これから先は、会長がいる場所も、私の帰る場所になるんです<emoji=heart04>」"
translation = "「앞으로는 회장님이 계신 곳도 제가 돌아갈 장소가 되는 거예요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "なら、俺も帰る場所を増やさないと"
translation = "그럼, 나도 돌아갈 장소를 늘려야겠네"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやんっ♪」"
translation = "「코양♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はいっ<emoji=heart04>\u3000人間界にも、魔界にも、私たちの帰る場所を作りましょう♪」"
translation = "「네<emoji=heart04> 인간계에도 마계에도 저희가 돌아갈 장소를 만들어요♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そして何年経っても――おかえりなさいって言い合える夫婦になりたいです<emoji=heart04>」"
translation = "「그리고 몇 년이 지나도── 다녀왔습니다라고 주고받을 수 있는 부부가 되고 싶어요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "きっとなれるよ"
translation = "분명 될 수 있을 거야"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「えへへっ♪\u3000はいっ！」"
translation = "「에헤헤♪ 네!」"

[[dialogue]]
speaker = "unk"
original = "ヨミは俺へ寄り添うと、嬉しそうに尻尾を擦り寄せる。"
translation = "요미는 나에게 바짝 안기며 기쁜 듯 꼬리를 비벼댄다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「これからもずっと、一緒ですから<emoji=heart04>」"
translation = "「앞으로도 계속 함께니까요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "故郷も。未来も。これから歩いていく人生も――その全部をヨミと一緒にしていく。"
translation = "고향도. 미래도. 앞으로 걸어갈 인생도── 그 전부를 요미와 함께해 간다."

[[dialogue]]
speaker = "unk"
original = "そんな将来を思い描きながら、俺は彼女の温もりを感じるのだった。"
translation = "그런 미래를 그리며, 나는 그녀의 온기를 느끼는 것이었다."

