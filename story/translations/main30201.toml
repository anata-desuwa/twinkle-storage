[[dialogue]]
speaker = "unk"
original = "第１話,『ルヴィネの修行方針』,B"
translation = "제1화, 『루비네의 수련 방침』, B"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「さて……次に私がすべきことは何かしら」"
translation = "「자…… 다음에 내가 해야 할 일은 뭘까나」"

[[dialogue]]
speaker = "unk"
original = "端末でスケジュールを確認しながらルヴィネが呟く。"
translation = "단말기로 스케줄을 확인하면서 루비네가 중얼거린다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「女神として十全に役目を果たすため、人間界で学べることは徹底的に学んでおきたいわ」"
translation = "「여신으로서 만전하게 역할을 다하기 위해, 인간계에서 배울 수 있는 것은 철저하게 배워두고 싶어」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ルヴィネ様……」"
translation = "「루비네 님……」"

[[dialogue]]
speaker = "unk"
original = "ルヴィネの言葉にマグダレナがやんわりと声をかける。"
translation = "루비네의 말에 막달레나가 부드럽게 말을 건넨다."

[[dialogue]]
speaker = "unk"
original = "この日、ルヴィネの仕事を補佐するため、アルタイルの守護天使であるマグダレナがデネブに来ていた。"
translation = "이날, 루비네의 업무를 보좌하기 위해, 알타이르의 수호천사인 막달레나가 데네브에 와 있었다."

[[dialogue]]
speaker = "unk"
original = "現在、デネブ側の守護天使たちは皆、コアで休眠状態となっている。"
translation = "현재, 데네브 쪽의 수호천사들은 모두 코어에서 휴면 상태로 있다."

[[dialogue]]
speaker = "unk"
original = "そのためマグダレナら守護天使が平行世界の移動を行っても、問題は起こらないと確認されていた。"
translation = "그 때문에 막달레나 등 수호천사가 평행세계를 이동해도, 문제는 일어나지 않는다고 확인되어 있었다."

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「テルル様はルヴィネ様に、ヒトとして過ごす時間を設けました」"
translation = "「텔루르 님은 루비네 님에게, 인간으로서 보내는 시간을 마련하셨습니다」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ですが、その『修業期間』とは言葉通りの意味では無いように思います」"
translation = "「하지만, 그 『수련 기간』이란 글자 그대로의 의미는 아닌 것처럼 생각됩니다」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「極星学園の皆様と、青春を謳歌して頂くこと──それこそが先代の本意なのですから、そう気負わないでください」"
translation = "「극성학원의 여러분과, 청춘을 구가해 주시는 것── 그것이야말로 선대의 본의이시니, 그렇게 부담 갖지 마세요」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ええ、それは理解しているつもりよ。けれど、何かをしていないと落ち着かない性分なの」"
translation = "「그래, 그것은 이해하고 있을 성고야. 그렇지만, 무언가를 하고 있지 않으면 안절부절못하는 성미거든」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「根を詰めて修行をするつもりはないけれど、つい目標や目的が欲しいと思ってしまうのよ」"
translation = "「무리해서 수련을 할 생각은 없지만, 문득 목표나 목적이 갖고 싶어져 버려」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「であれば、『女神としての修行』や『女神としての責務』ではなく──」"
translation = "「그러시다면, 『여신으로서의 수련』이나 『여신으로서의 책무』가 아니라──」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「『この世界に生きるひとりの天使として、色々なことに主観的に関わる、挑戦する』という方針で行動するのはいかがでしょう？」"
translation = "「『이 세계에 살아가는 한 사람의 천사로서, 여러 가지 일에 주관적으로 관여하고, 도전한다』라는 방침으로 행동하시는 것은 어떠실지요？」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「先日のオオヒメと同じことです。実際に生きている人々と交わり、経験を重ねること。その過程で人々から何かを学ぶこと」"
translation = "「요전 날의 오오히메와 같은 것입니다. 실제로 살아가는 사람들과 교류하고, 경험을 쌓는 것. 그 과정에서 사람들로부터 무언가를 배우는 것」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「テルル様がルヴィネ様に望まれた『修業』は、そういった事なのではないかと思うのです」"
translation = "「텔루르 님이 루비네 님에게 바라셨던 『수련』은, 그러한 것이 아닐까 생각합니다」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……確かに、先日、流星学園の附属校に体験入学してみて、学んだわ」"
translation = "「……확실히, 요전 날 유성학원의 부속교에 체험 입학해 보고, 배웠어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「関係の無い、第三者として校内を視察しただけでは、気付けなかっただろうと思うことも多かった」"
translation = "「상관없는 제3자로서 교내를 시찰했을 뿐이라면, 시정하지 못했을 거라고 생각하는 것도 많았지」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「突然附属生にされて、小さな同級生がたくさん出来てしまって、どうしようかと思う瞬間もあったけれど……」"
translation = "「갑자기 부속생이 되어, 작은 동급생이 많이 생겨버려서, 어쩌나 싶은 순간도 있었지만……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「主観的に関わる──その重要性は身に染みて理解したわ」"
translation = "「주관적으로 관여한다── 그 중요성은 뼈저리게 이해했어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そうね、今後の私の行動方針としては、それを掲げるのがいいのかもしれないわね」"
translation = "「그래, 향후 나의 행동 방침으로는, 그것을 내거는 것이 좋을지도 모르겠네」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「例えば、ですが……今なら丁度ハロウィンが近い時期です。まずはそれを体験してみてはいかがでしょう？」"
translation = "「예를 들어, 입니다만…… 지금이라면 마침 할로윈이 가까운 시기입니다. 우선은 그것을 체험해 보시는 것은 어떠실지요？」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「アルタイルにはハロウィンに詳しい方々がいます」"
translation = "「알타이르에는 할로윈에 대해 잘 아시는 분들이 계십니다」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「彼女たちにハロウィンの盛り上げ方を相談して、デネブのハロウィンもアルタイルに負けないよう盛り上げる、というのも良いかもしれません」"
translation = "「그녀들에게 할로윈 분위기를 띄우는 방법을 상담하고, 데네브의 할로윈도 알타이르에 지지 않도록 분위기를 띄운다, 라는 것도 좋을지도 모릅니다」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ふふ……いいわね、それ」"
translation = "「후후…… 좋네, 그거」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「デネブにもハロウィンの習慣はあるけれど、お祭りとして大々的に盛り上げる、といったことは久しく行っていないわ」"
translation = "「데네브에도 할로윈 습관은 있지만, 축제로서 대대적으로 분위기를 띄운다, 같은 것은 오랫동안 하지 않았거든」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「今年からは極星学園星徒会として、改めてハロウィンが盛り上がるように頑張ってみようかしら」"
translation = "「올해부터는 극성학원 성도회로서, 새삼스럽게 할로윈이 활기차지도록 힘내볼까나」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「きっと皆様も喜ぶでしょう」"
translation = "「분명 여러분도 기뻐하시겠지요」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「やりがいがありそうね」"
translation = "「보람이 있을 것 같네」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ではアルタイルの有識者に連絡を取り、ハロウィンの事前調査が行えるようにしておきますね」"
translation = "「그럼 알타이르의 유식자에게 연락을 취해, 할로윈 사전 조사를 진행할 수 있도록 해두겠습니다」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ええ、手配は任せるわ。よろしく頼むわね」"
translation = "「그래, 수속은 맡길게. 잘 부탁해」"

[[dialogue]]
speaker = "unk"
original = "それから数日後、ルヴィネがアルタイルにやってきた。"
translation = "그로부터 며칠 후, 루비네가 알타이르에 찾아왔다."

[[dialogue]]
speaker = "unk"
original = "目的はハロウィンについて勉強するためだ。"
translation = "목적은 할로윈에 대해 공부하기 위해서다."

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「こちらでしばらくお待ちください」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「キャナンシー、と言ったかしら？\u3000マグダレナの言うハロウィンの有識者というのは」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「はい。流星学園と新星学園は毎回、共同でハロウィンパーティーを開催しているのですが──」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「実行委員長として、そのパーティーを始めとしたハロウィン関連の行事を取り仕切っているのが<ruby>瓜姫<rt>うりひめ</rt></ruby>キャナンシーさまです」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「後はジャクリーヌさまからもお話も聞くことが出来るとのことでした」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ジャクリーヌ？\u3000それはどんなヒトなのかしら？」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ハロウィンの化身、ジャック・オー・ランタンさまのご息女です。新星学園の１年に在籍していらっしゃいます」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そんなヒトまで、この学園にはいるのね」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「けれど思っていた以上にいろいろ聞くことが出来そうで、楽しみだわ」"
translation = ""

[[dialogue]]
speaker_original = "キャナンシー"
speaker_translation = "캐넌시"
original = "「あっらぁ～、光栄だわぁ～♪\u3000ハロウィンにそぉ～んな関心を持っていただけるなんてぇ～♪」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……！？」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ルヴィネ様、こちらがキャナンシーさまです」"
translation = ""

[[dialogue]]
speaker_original = "キャナンシー"
speaker_translation = "캐넌시"
original = "「お待たせしてしまいましたわぁ～！\u3000私、ハロウィン実行委員会会長のキャナンシーよぉ～、よろしくねぇ～♪」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「極星星徒会長ルヴィネよ。ハロウィンのいろはについて学ばせてもらうわ」"
translation = ""

[[dialogue]]
speaker_original = "キャナンシー"
speaker_translation = "캐넌시"
original = "「まかせてちょうだぁ～い♪\u3000ハロウィンの素晴らしさについて、たぁ～っぷりお勉強していってもらうわぁ～♪」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「よ、よろしく……」"
translation = ""

[[dialogue]]
speaker_original = "キャナンシー"
speaker_translation = "캐넌시"
original = "「ゆ～っくりお話しできるように、スゥイ～トなルームを借り切っているのよぉ～♪」"
translation = ""

[[dialogue]]
speaker_original = "キャナンシー"
speaker_translation = "캐넌시"
original = "「さぁさぁ行きましょぉ～ん♪\u3000ハロウィンの魅力、たぁ～っぷり教えちゃうんだからぁ～♪」"
translation = ""

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ではキャナンシーさま。よろしくお願いします」"
translation = ""

[[dialogue]]
speaker_original = "キャナンシー"
speaker_translation = "캐넌시"
original = "「まかせてぇ～♪\u3000さ、参りましょ～っ♪」"
translation = ""

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ひゃ、わぁああああーーーっ！！！！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "こうしてキャナンシーによってルヴィネはさらわれ──"
translation = ""

[[dialogue]]
speaker = "unk"
original = "もとい、キャナンシーの用意したスイートルームへ案内され、ハロウィンの何たるかについて教え込まれるのだった。"
translation = ""

