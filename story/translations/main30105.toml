[[dialogue]]
speaker = "unk"
original = "第５話,『いろいろな授業』,B"
translation = "제5화, 『여러 가지 수업』, B"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「待ちに待った戦闘訓練の時間なのだ！」"
translation = "「기다리고 기다리던 전투 훈련 시간인 것이다!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「随分と張り切っているが、大丈夫なのか？」"
translation = "「제법 의욕이 넘치는데, 괜찮은 거냐?」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「何を心配そうな顔をしているのだ？」"
translation = "「무슨 걱정스러운 얼굴을 하고 있는 것이다?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「我々は守護天使なのだぞ？\u3000学生、それも附属生の星力で太刀打ちできるはずがないだろう？」"
translation = "「우리는 수호천사란 말이다? 학생, 그것도 부속생의 성력으로 맞설 수 있을 리가 없지 않느냐?」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「それは無理なのだ！\u3000だからアルモたんはマグダレナを相手に戦闘訓練をするのだ♪」"
translation = "「그건 무리인 것이다! 그래서 알모탄은 막달레나를 상대로 전투 훈련을 하는 것이다♪」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「ふふ、いいですよアルモタヘル。相手になりましょう♪」"
translation = "「후후, 좋아요 알모타헬. 상대가 되어 주지요♪」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「…………私は？\u3000どうすれば？」"
translation = "「…………나는? 어떻게 하면 되지?」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「残念ながらこの訓練は１対１の模擬戦形式なのだ」"
translation = "「안타깝게도 이 훈련은 1 대 1 모의전 형식인 것이다」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「ごめんなさい、オオヒメ」"
translation = "「미안해요, 오오히메」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そ、そんな……文献で見たぞ……これがあの『２人組を作れの恐怖』か……実際に体験してみると何と恐ろしい……」"
translation = "「그, 그런…… 문헌에서 보았다…… 이것이 그 『2인 1조를 만들라의 공포』인가…… 실제로 체험해 보니 이 얼마나 무서운지……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ヒメさん」"
translation = "「히메 씨」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ナミエル殿？」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「よろしければ私と組んで頂けませんか？」"
translation = "「괜찮으시다면 저와 조를 짜지 않으시겠어요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「な、ナミエル殿っ……！\u3000あなたはどこまで優しいのだ……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「是非、お願いする。大丈夫だ、ナミエル殿が怪我をせぬよう力を加減するからな」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「加減を……。そうですか、ありがとうございます」"
translation = "「조절을……. 그러신가요, 감사합니다」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「この辺りでいかがですか？\u3000他の方々と少し距離を取りましたので、存分に戦えます」"
translation = "「이쯤이면 어떠신가요? 다른 분들과 조금 거리를 두었으니, 마음껏 싸울 수 있습니다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そうだな。では始めるとしよう」"
translation = "「그렇군. 그럼 시작하기로 하지」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「その前に、ですが……私は決して親切心でヒメさんに声をかけたわけではありませんので」"
translation = "「그전에, 입니다만…… 저는 결코 친절함으로 히메 씨에게 말을 건 것이 아니니까요」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「純粋に戦闘訓練の相手として、望んでヒメさんを選ばせて頂きました」"
translation = "「순수하게 전투 훈련 상대로서, 원해서 히메 씨를 선택했습니다」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「私も本気で参りますので……ヒメさんこそお怪我なさらぬようご注意ください」"
translation = "「저도 진심으로 임할 테니…… 히메 씨야말로 다치시지 않도록 주의해 주세요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「っ……！？」"
translation = "「씃……!?」"

[[dialogue]]
speaker = "unk"
original = "一瞬で間合いを詰めたナミエルの放った一撃を辛うじて受ける。"
translation = "순식간에 간격을 좁힌 나미엘이 날린 일격을 겨우 받아낸다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（何という鋭い一撃……！\u3000<ruby>天叢雲剣<rt>我が剣</rt></ruby>でなければ受け切れていたかどうか……）"
translation = "（이 무슨 날카로운 일격……! <ruby>천총운검<rt>나의 검</rt></ruby>이 아니었다면 다 받아낼 수 있었을지……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（いや……驚かされたのは攻撃の鋭さだけではない……）"
translation = "（아니…… 놀란 것은 공격의 날카로움뿐만이 아니다……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（ナミエル殿から伝わってくる強烈な気迫……内に漲る星力……今までとはまるで別人のようだ……）"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（っ……！\u3000この展開も文献で見た覚えがある。まさか、これは……！）"
translation = "（씃……! 이 전개도 문헌에서 본 기억이 있다. 설마, 이것은……!）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（『親友だと思って仲良くなった相手が、実は最強の裏ボスだった』パターンではないか！！）"
translation = "（『절친이라고 생각하고 친해진 상대가, 사실은 최강의 숨겨진 보스였다』 패턴이 아닌가!!）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（何ということだ……これから友情を育んで行けるかもしれない、と、そう思っていたのに……）"
translation = "（이 무슨 일인가…… 이제부터 우정을 키워갈 수 있을지도 모른다고, 그렇게 생각하고 있었는데……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（いや、諦めてはいけない！\u3000彼女が裏ボスとして覚醒するフラグを折れば、まだ希望はあるはずだ！）"
translation = "（아니, 포기해서는 안 된다! 그녀가 숨겨진 보스로 각성하는 플래그를 꺾는다면, 아직 희망은 있을 것이다!）"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「よく分かりませんが、まだ余計なことを考えるほどの余裕があるようですね」"
translation = "「잘 모르겠습니다만, 아직 딴생각을 할 정도의 여유가 있으신 모양이네요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「いえ……あなたは強い。私こそ見誤っていたようだ、ナミエル殿の正体を……」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「……一撃、受けただけで、そこまで見抜かれてしまうのですね。流石は守護天使様です……」"
translation = "「……일격, 받았을 뿐인데, 거기까지 간파당해 버리다니요. 역시나 수호천사님이십니다……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「では、やはりあなたは……なのですね」"
translation = "「그럼, 역시 당신은…… 인 것이겠지」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「昔の話です。今は星見家にお仕えする、一介のメイドですからっ！」"
translation = "「옛날 이야기입니다. 지금은 호시미가를 섬기는, 한 명의 메이드이니까요!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そのフラグ、私が折ってみせるっ！」"
translation = "「그 플래그, 내가 꺾어 보이겠다!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「くっ……！」"
translation = "「큭……!」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「何だか白熱した戦いになってきてるのだ」"
translation = "「어쩐지 백열한 싸움이 되어 가고 있는 것이다」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「会話も噛み合っているようで噛み合っていないような……」"
translation = "「대화도 맞물리는 것 같으면서 맞물리지 않는 것 같기도 하고……」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「でもナミエル、ちょっと楽しそうなのだ」"
translation = "「하지만 나미엘, 조금 즐거워 보이는 것이다」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「私たちを除けばナミエルの戦闘能力はこのクラスで群を抜いていますから」"
translation = "「우리들을 제외하면 나미엘의 전투 능력은 이 반에서 단연 으뜸이니까요」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「本気で戦える相手が現れて、嬉しいのかもしれません」"
translation = "「진심으로 싸울 수 있는 상대가 나타나서, 기쁠지도 모릅니다」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「そうなのだ！\u3000ナミエルーっ！\u3000オオヒメーっ！\u3000どっちも頑張るのだーっ！」"
translation = "「그런 것이다! 나미엘─! 오오히메─! 둘 다 힘내는 것이다─!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「はぁ……はぁ……はぁ……」"
translation = "「하아…… 하아…… 하아……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「はぁ……はぁ……はぁ……」"
translation = "「하아…… 하아…… 하아……」"

[[dialogue]]
speaker_original = "２人"
speaker_translation = "2명"
original = "「やぁああああっ！！！！」"
translation = "「야아아아앗!!!!」"

[[dialogue]]
speaker = "unk"
original = "──こうして授業時間いっぱいまで、オオヒメとナミエルの戦いは続いたのだった。"
translation = "──이렇게 수업 시간 끝까지, 오오히메와 나미엘의 싸움은 계속된 것이었다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ではナミエル殿、始めよう」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「お願いします」"
translation = "「부탁드립니다」"

[[dialogue]]
speaker = "unk"
original = "次の授業は美術だった。"
translation = "다음 수업은 미술이었다."

[[dialogue]]
speaker = "unk"
original = "オオヒメとナミエルは向かい合って座り、互いの顔をデッサンする。"
translation = "오오히메와 나미엘은 마주 보고 앉아, 서로의 얼굴을 데생한다."

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「自己紹介では芸術に関心が深いとおっしゃっていましたが……絵はお得意ですか？」"
translation = "「자기소개에서는 예술에 관심이 깊다고 말씀하셨습니다만…… 그림은 잘 그리시나요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「嗜む程度、だな」"
translation = "「취미 삼아 그리는 정도, 다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（とは言ったが、これは得意分野だ……）"
translation = "(라고는 말했지만, 이건 전문 분야다……)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（実体を得てから、これ幸いといろいろ描いてきたので、正直、自信はある……）"
translation = "（실체를 얻고 나서, 이때다 싶어 이것저것 그려왔기에, 솔직히, 자신은 있다……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（だが……ナミエル殿には今日１日、本当に世話になったからな……）"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（その恩返しにも、最高傑作を贈りたい……）"
translation = "（그 보답으로라도, 최고 걸작을 선물하고 싶다……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（…………）"
translation = "（…………）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（まじまじと見ていると……ナミエル殿は美しい顔立ちをしているのだな……）"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（神秘的な色の瞳……ほんのり桜色に染まった頬……滑らかで光沢のある艶髪……）"
translation = "（신비로운 색의 눈동자…… 살짝 벚꽃색으로 물든 뺨…… 매끄럽고 광택이 나는 윤기 있는 머리……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（全てを写し取り、全てを表現したい……）"
translation = "（모든 것을 그려 담고, 모든 것을 표현하고 싶다……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（この真っ白な紙の上に、ナミエル殿の魅力を余すことなく注ぎ込みたい……）"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（…………）"
translation = "（…………）"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「…………あの」"
translation = "「…………저기」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ん……？」"
translation = "「응……?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「……いえ……とても真剣に描いていらっしゃると思いまして……」"
translation = "「……아니요…… 굉장히 진지하게 그리고 계신다고 생각해서……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そう……だな……」"
translation = "「그렇게…… 보이는가……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「出来た……完成だ……」"
translation = "「됐다…… 완성이다……」"

[[dialogue]]
speaker = "unk"
original = "オオヒメが全身全霊を注ぎ込んで描いたナミエルの絵が完成した。"
translation = "오오히메가 전심전력을 쏟아부어 그린 나미엘의 그림이 완성되었다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「見てもらえるか？\u3000このような感じなのだが……」"
translation = "「봐 줄 수 있겠나? 이런 느낌이다만……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「っ……！？」"
translation = "「씃……!?」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「どれどれ、私たちにも見せて頂けますか～？」"
translation = "「어디 어디, 저희에게도 보여 주시겠어요~?」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「うわっ、メチャメチャ上手いのだ！\u3000オオヒメ本気出し過ぎなのだ！」"
translation = "「우와, 엄청나게 잘 그리는 것이다! 오오히메 진심 너무 낸 것이다!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「な、何事も真剣に取り組むべきだからな」"
translation = "「무, 무슨 일이든 진지하게 임해야 하는 법이니까」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ありがとうございます、ヒメさん。こんなに素晴らしい絵を描いてくださって」"
translation = "「감사합니다, 히메 씨. 이렇게 훌륭한 그림을 그려 주셔서」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「親切にしてくれたナミエル殿へのせめてもの礼だ、受け取って貰えると嬉しい」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「いいのですか？」"
translation = "「괜찮으신가요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「構わない。そのつもりで描いたのだから」"
translation = "「상관없다. 그럴 작정으로 그린 것이니까」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ありがとうございます……」"
translation = "「감사합니다……」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「ナミエルはどんな絵を描いたのだ？\u3000ナミエルの描いたオオヒメの絵も見たいのだ！」"
translation = "「나미엘은 어떤 그림을 그린 것이다? 나미엘이 그린 오오히메의 그림도 보고 싶은 것이다!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「えっ？\u3000あの……ヒメさんの絵の後では……ちょっと……」"
translation = "「에? 저기…… 히메 씨의 그림 뒤에는…… 좀……」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「もったいつけないで見せるのだ♪\u3000オオヒメもナミエルの絵、見たいのだ？」"
translation = "「뜸 들이지 말고 보여주는 것이다♪ 오오히메도 나미엘의 그림, 보고 싶지?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「それは……無論、見たいが……」"
translation = "「그건…… 물론, 보고 싶다만……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「わ、わかりました……どうぞ……」"
translation = "「아, 알겠습니다…… 여기요……」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「申し訳ありません……絵は、得意ではありませんので……」"
translation = "「죄송합니다…… 그림은, 잘 그리지 못해서……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「い、いや、個性的で素晴らしい絵だと思う！\u3000私は好きだ！\u3000何よりナミエル殿が一生懸命描いてくれた、その心が伝わってくる！」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「無理にフォローしていただかなくても、大丈夫ですから……」"
translation = "「억지로 쉴드 쳐주지 않으셔도, 괜찮으니까요……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「いや、本当に嬉しいのだ！\u3000友達に自分の絵を描いてもらうなど初めての経験だからな！\u3000ぜひ宝物にしたい！」"
translation = "「아니, 정말로 기쁘다! 친구에게 자신의 그림을 받다니 처음 하는 경험이니까 말이다! 부디 보물로 삼고 싶구나!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「え……」"
translation = "「에……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「駄目……だろうか？」"
translation = "「안…… 되겠느냐?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「……こんな絵で宜しければ、お持ちください」"
translation = "「……이런 그림이라도 괜찮으시다면, 가져가 주세요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「おお、感謝するぞ！」"
translation = "「오오, 감사한다!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「…………と言いましたか？」"
translation = "「…………라고 하셨나요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ん？\u3000どうしたのだ、ナミエル殿？」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「あ、いいえ……何でもありません……！」"
translation = "「아, 아니요…… 아무것도 아닙니다……!」"

