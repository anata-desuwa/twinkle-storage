[[dialogue]]
speaker = "unk"
original = "第１話,ミウの告白プラン,P"
translation = "제1화, 미우의 고백 플랜, P"

[[dialogue]]
speaker = "unk"
original = "これは──私、深沢ミウが会長さんと付き合うことになった時のことです。"
translation = "이것은── 나, 후카사와 미우가 회장님과 사귀게 되었을 때의 이야기입니다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふふ～ん、ふんふんふふふ～ん♪」"
translation = "「후후후~응, 흥흥후후후~응♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（浮かれるあまり、鼻歌が漏れてしまうのも仕方ないですよね）"
translation = "（너무 신난 나머지, 콧노래가 새어나오는 것도 어쩔 수 없죠）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（だって、今日は会長さんとデートなんですから♪）"
translation = "（그야, 오늘은 회장님과 데이트니까요♪）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（デートではありますけど、私と会長さんは、まだ正式にお付き合いをしているわけではありません）"
translation = "（데이트이긴 하지만, 나와 회장님은 아직 정식으로 사귀고 있는 건 아닙니다）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（会長さんが『私好みの映画のチケットがたまたま手に入ったから』と誘ってくれたんです）"
translation = "（회장님이 『내 취향의 영화 티켓이 우연히 생겼으니까』 하고 청해주셨거든요）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（ふふ、会長さんってば素直じゃないんですから♪）"
translation = "（후후, 회장님도 참 솔직하지 못하시다니까요♪）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（気になっている私を誘うために、自腹でチケットを購入したんですよね？）"
translation = "（신경 쓰이는 나를 청하기 위해, 자비로 티켓을 구입하신 거죠?）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（『かわいいクマちゃん型ロボットが大量発生して、一般人を襲うパニック映画』なんて、普通はデートに誘う時に選ぶ映画じゃないですけど……）"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（でも、私は違います。間違いなくＢ級映画だとわかりきってるんですけど、Ｗｅｂ予告の時から気になってて、観に行きたかったんです）"
translation = "（하지만, 저는 다릅니다. 틀림없는 B급 영화라는 걸 잘 알고 있었지만, Web 예고편 때부터 신경 쓰여서, 보러 가고 싶었거든요）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（さすがは会長さんです。私の好みを完璧に熟知しているなんて……私のこと、好きすぎじゃないですか？）"
translation = "（역시 회장님입니다. 제 취향을 완벽하게 숙지하고 계시다니…… 나를, 너무 좋아하는 거 아닌가요?）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（この映画に誘われてしまったら、断る理由なんてありません）"
translation = "（이 영화에 초대받아 버렸다면, 거절할 이유 따위 없습니다）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（いえ、会長さんに誘われたらどんなに甘々な恋愛映画でも、ＴＶシリーズを観ているのが前提のアニメ映画だったとしても観に行きますけどね）"
translation = "（아니, 회장님이 청해주셨다면 아무리 달콤한 연애 영화라도, TV 시리즈를 보는 게 전제인 애니메이션 영화라 해도 보러 가겠지만요）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（私の好みを理解してくれていて、これまでの私への態度や振る舞い、ヒマワリちゃんや社長と比べても特別扱い……）"
translation = "（제 취향을 이해해주고 있고, 지금까지의 나에 대한 태도나 행동, 히마와리짱이나 사장님과 비교해도 특별 대우……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（私をわざわざ映画デートにまで誘ってくれるのですから、会長さんが私に好意を寄せているのは確実です）"
translation = "（나를 일부러 영화 데이트에까지 청해주시는 것이니, 회장님이 나에게 호감을 품고 있는 것은 확실합니다）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（鯛焼き屋の前を通った時に、香ばしい良い匂いを嗅いだが最後、うっかり買っちゃうくらい確実です）"
translation = "（붕어빵집 앞을 지날 때, 고소하고 좋은 냄새를 맡으면 그만, 얼떨결에 사버릴 정도로 확실합니다）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（今日で曖昧な関係には終止符を打ちましょう。覚悟してください、会長さん♪）"
translation = "（오늘로 애매한 관계에는 종지부를 냅시다. 각오하세요, 회장님♪）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（ムード満点の場所に誘いこめば、私が好きすぎて我慢できなくなった会長さんから告白してくれるはずです）"
translation = "（분위기 만점인 장소로 끌어들이면, 내가 너무 좋아서 참을 수 없어진 회장님이 고백해주실 터입니다）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（我ながら完璧なプランですね。徹夜で考案しただけはあります。会長さん、今日こそあなたを私の恋人にしてみせますからね！）"
translation = "（나 스스로도 완벽한 플랜이네요. 밤을 새워 고안한 보람이 있습니다. 회장님, 오늘이야말로 당신을 내 연인으로 만들어 보이겠으니까요!）"

[[dialogue]]
speaker = "unk"
original = "そして、ついに決戦の日。デートの当日がやってきて──"
translation = "그리고, 마침내 결전의 날. 데이트 당일이 찾아오고──"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「映画、期待通りでとても面白かったです♪\u3000会長さんはどうしてこの映画を観ようと思ったんですか？」"
translation = "「영화, 기대했던 대로 정말 재미있었어요♪ 회장님은 어째서 이 영화를 보려고 생각하셨나요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（ふふ、わかってますよ。私を誘うために、わざわざ購入されたことくらい）"
translation = "（후후, 알고 있어요. 나를 청하기 위해, 일부러 구입하셨다는 것쯤은）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（でも、あえて尋ねることで、会長さんの本音を引き出しやすく──）"
translation = "（하지만, 일부러 물어봄으로써, 회장님의 속마음을 끌어내기 쉽게──）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「……え？\u3000チケットは美鶴さんから頂いたんですか？\u3000美鶴さんとはＢ級映画友達……あー、そうだったんですね」"
translation = "「……에? 티켓은 미츠루 씨한테 받으신 건가요? 미츠루 씨와는 B급 영화 친구…… 아─, 그랬었군요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「美鶴さんにそんな趣味があることも、会長さんと映画を観たりする仲だとも知りませんでした」"
translation = "「미츠루 씨한테 그런 취미가 있는 것도, 회장님과 영화를 보거나 하는 사이인 줄도 몰랐어요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（美鶴さんって！？\u3000聞いてないですよ、そんなの！）"
translation = "（미츠루 씨라니!? 들어본 적 없어요, 그런 거!）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（いえいえ、動揺してはいけません！\u3000冷静に、状況を立て直さなくては……）"
translation = "（아니아니, 동요해서는 안 됩니다! 냉정하게, 상황을 다시 수습해야……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さん、私、行きたい場所があるんです。１人だとちょっと行きづらいところなので一緒にお願いできますか？」"
translation = "「회장님, 저, 가고 싶은 장소가 있어요. 혼자서는 약간 가기 힘든 곳이라 함께 부탁드릴 수 있을까요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「わぁ……イルミネーション、綺麗ですよね！\u3000カップルが多いので、１人だと居づらくて」"
translation = "「와아…… 일루미네이션, 예쁘네요! 커플이 많아서 혼자 있으면 있기 거북해서」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さんと一緒なら、不自然じゃないですよね♪」"
translation = "「회장님과 함께라면 어색하지 않죠♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「私たちの関係って周りからどう見られてるんでしょう……やっぱり、年頃の男女が２人でいたら、恋人同士に見られちゃうんですかね、なんて。えへへ♪」"
translation = "「우리 관계는 주변에서 어떻게 보고 있을까요…… 역시 이따금 또래 남녀 둘이 있으면 연인 사이로 보이고 말겠죠, 라든가. 에헤헤♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（おかしいですね。周りには恋人ばかりで、ムーディーな音楽もかかっています）"
translation = "（이상하네요. 주변에는 연인들뿐이고 분위기 있는 음악도 흐르고 있습니다）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（こんなにも出来上がっているシチュエーションなのに、会長さんの態度はいつもとまったく変わりません）"
translation = "（이렇게까지 판이 깔린 상황인데 회장님의 태도는 평소와 전혀 다르지 않아요）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（刻一刻と時間は流れていきます）"
translation = "（시시각각 시간은 흘러갑니다）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（あれ？\u3000あれあれあれ？\u3000会長さん？\u3000ここで告白しないでいいんですか？\u3000大チャンスですよ？\u3000二つ返事で『ＯＫ』する準備はできてますよ？）"
translation = "（어라? 어라어라어라? 회장님? 여기서 고백 안 해도 돼요? 대찬스라고요? 두말없이 『OK』할 준비는 되어 있다고요?）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（このチャンスを逃すと、次に告白できるのはいつになるかわかりませんよ？\u3000何もないまま、解散になっちゃいますよ？）"
translation = "（이 기회를 놓치면 다음에 고백할 수 있는 게 언제일지 모른다고요? 아무 일도 없이 해산해 버리고 말아요?）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（このまま、何もないまま、なんですか……？）"
translation = "（이대로, 아무 일도 없이, 가나요……？）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（会長さんは男女問わず、誰に対しても分け隔てなく優しい……そんな会長さんだからこそ、好きになったのですけど……）"
translation = "（회장님은 남녀 불문하고 누구에게나 차별 없이 친절한…… 그런 회장님이기에 좋아하게 된 거지만……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（もしかして、私もただ親切にしてあげてるだけの……会長さんの周りにいる女の子の１人でしかないんですか……！？）"
translation = "（혹시 나도 그냥 친절하게 대해주는…… 회장님 주변에 있는 여자아이 중 한 명일 뿐인 건가요……!?）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（そんなの……そんなの嫌です……！\u3000私だけはあなたの特別でありたい……）"
translation = "（그런 건…… 그런 건 싫어요……! 나만큼은 당신에게 특별하고 싶어……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（もっと冷静でいなくちゃいけないのに……さっきだって美鶴さんの名前が出ただけで動揺しちゃって……）"
translation = "（좀 더 침착해야 하는데…… 아까도 미츠루 씨의 이름이 나온 것만으로 동요해 버려서……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（会長さんの近くにいるだけで独占欲が爆発して……いつもの私じゃいられなくなっちゃう……）"
translation = "（회장님 근처에 있는 것만으로 독점욕이 폭발해서…… 평소의 나로 있을 수 없게 돼버려……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（やだ、やだ……！\u3000会長さんが他の子と付き合うなんて、私のものじゃないなんて、絶対にやだっ……！）"
translation = "（싫어, 싫어……! 회장님이 다른 애랑 사귄다니, 내 것이 아니게 된다니 절대로 싫어……!）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（言わなきゃ、今、私の口から言わなきゃ！\u3000会長さんが好きだって！\u3000私の恋人に、彼氏になってくださいって言わなきゃ……！）"
translation = "（말해야 해, 지금 내 입으로 말해야 해! 회장님을 좋아한다고! 내 연인이, 남자친구가 되어달라고 말해야 해……!）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あ、あのっ！\u3000か、会長ひゃんっ！\u3000わ、わたっ、わた、わた、しっ……！」"
translation = "「아, 저기! 회, 회장 히양! 나, 나, 나, 나, 나……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（噛み噛みだよっ！\u3000なんて言えばいいのかわからない。どう伝えれば、私の好きな気持ちが伝わるかもわからない……）"
translation = "（혀 다 꼬였잖아! 뭐라고 말해야 할지 모르겠어. 어떻게 전달해야 내 좋아하는 마음이 전해질지도 모르겠어……）"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふぅ……あ、あぁ、か、会長さん、私っ、わた──」"
translation = "「후우…… 아, 아아, 회, 회장님, 저, 저──」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（言葉が、出てこない……続けられない……同じことばかり繰り返して……。みっともないよ、私──）"
translation = "（말이 나오지 않아…… 이어갈 수 없어…… 같은 말만 되풀이하고…… 볼품없어, 나──）"

[[dialogue]]
speaker = "unk"
original = "言葉を詰まらせて……顔も見られなくなって……私は俯いてしまった。"
translation = "말을 잇지 못하고…… 얼굴도 볼 수 없게 되어…… 나는 고개를 숙여버렸다."

[[dialogue]]
speaker = "unk"
original = "会長さんは黙って私の言葉を待ってくれていましたが、そんな私の様子を見て優しく肩に手を置いてくれました。"
translation = "회장님은 묵묵히 내 말을 기다려주었지만, 그런 내 모습을 보고 다정하게 어깨에 손을 올려주었다."

[[dialogue]]
speaker = "unk"
original = "そして──言ってくれたんです。"
translation = "그리고── 말해주었다."

[[dialogue]]
speaker = "unk"
original = "俺もミウが好きだよ"
translation = "나도 미우를 좋아해"

[[dialogue]]
speaker = "unk"
original = "ありがとう、ミウ"
translation = "고마워, 미우"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「え──？」"
translation = "「에──？」"

[[dialogue]]
speaker = "unk"
original = "俺と付き合ってください"
translation = "나와 사귀어 주세요"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふぅ、うぁ、あぁぁ……ぅわあぁぁん！」"
translation = "「후으, 우아, 아아아…… 으와아앙!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「人前で──ましてや大好きな人の目の前で泣くなんて、情けなくて、格好悪いのに……」"
translation = "「남들 앞에서── 하물며 좋아하는 사람 눈앞에서 울다니, 한심하고 볼품없는데……」"

[[dialogue]]
speaker = "unk"
original = "全然、思い通りにいかなかった告白のみっともなさと──"
translation = "전혀 뜻대로 되지 않았던 고백의 볼품없음과──"

[[dialogue]]
speaker = "unk"
original = "何も言うことが出来なくなってしまった自分への情けなさと──"
translation = "아무 말도 할 수 없게 되어버린 자신에 대한 한심함과──"

[[dialogue]]
speaker = "unk"
original = "一番欲しかった言葉を、大好きな人に言ってもらえた、その嬉しさで私は──"
translation = "가장 듣고 싶었던 말을 좋아하는 사람에게 들었다는 그 기쁨에 나는──"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「うわぁああぁぁぁん！\u3000わ、私も好きっ、好きですっ！\u3000会長さんっ、かいちょぉさぁんっ……！」"
translation = "「우와아아아앙! 나, 나도 좋아, 좋아해요! 회장님, 회장느님……!」"

[[dialogue]]
speaker = "unk"
original = "もう、声を抑えることが出来なくなって泣きじゃくってしまいました。"
translation = "이제 목소리를 죽일 수 없게 되어 엉엉 울어버리고 말았다."

[[dialogue]]
speaker = "unk"
original = "そんな私を会長さんは優しく抱きしめて……ずっと、ずっと……胸の中で気が済むまで泣かせてくれたのでした。"
translation = "그런 나를 회장님은 다정하게 안아주고…… 계속, 계속…… 품 안에서 마음이 풀릴 때까지 울게 해주었다."

