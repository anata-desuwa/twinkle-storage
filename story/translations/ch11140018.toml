[[dialogue]]
speaker = "unk"
original = "世界の存亡を懸けた戦いを経て──恋人関係となった俺とルヴィ。"
translation = "세계의 존망을 건 싸움을 거쳐── 연인 관계가 된 나와 루비."

[[dialogue]]
speaker = "unk"
original = "今日は彼女の方から、アルタイル世界を訪ねてくれていた。"
translation = "오늘은 그녀 쪽에서, 알타이르 세계를 찾아와 주었다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……ここが魔王の部屋。意外だわ、ずいぶんと片付いているのね」"
translation = "「……여기가 마왕의 방. 의외네, 상당히 정돈되어 있어」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「彼女が来るから、慌てて綺麗にしたとも言う」"
translation = "「그녀가 오니까, 허둥지둥 깨끗이 치웠다고도 하지」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ふふっ──そうなの？\u3000言わなければバレないのに、正直すぎないかしら」"
translation = "「후후── 그래? 말하지 않으면 안 들켰을 텐데, 너무 솔직한 거 아닐까」"

[[dialogue]]
speaker = "unk"
original = "お互いに平静は装っていても、どうしても意識してしまう。"
translation = "서로 평정심은 가장하고 있어도, 아무래도 의식해버린다."

[[dialogue]]
speaker = "unk"
original = "なにせ『今日は母さんがいないから』と言って自宅に誘ったのだ。ルヴィもこれから何をするのか、察しているはず。"
translation = "어쨌든 『오늘은 엄마가 없으니까』라며 집에 초대한 것이다. 루비도 이제부터 뭘 할지, 눈치채고 있을 터."

[[dialogue]]
speaker = "unk"
original = "バクバクと早鐘を打つ心臓の音も、ルヴィに届いているかもしれない。"
translation = "쿵쾅쿵쾅 요란하게 뛰는 심장 소리도, 루비에게 들리고 있을지도 모른다."

[[dialogue]]
speaker = "unk"
original = "ひとまず落ち着こうとベッドに腰を下ろすと──"
translation = "일단 진정하자며 침대에 앉자──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ん……しょ」"
translation = "「응…… 차」"

[[dialogue]]
speaker = "unk"
original = "ルヴィは俺の隣ではなく、膝上に座ってきた。"
translation = "루비는 내 옆이 아니라, 무릎 위에 앉아왔다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「今日はずいぶん、大胆なんだな……？」"
translation = "「오늘은 굉장히, 대담하네……?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「いいじゃない。これからもっと、凄いことをするんでしょう？」"
translation = "「괜찮잖아. 이제부터 더욱, 대단한 짓을 할 거지?」"

[[dialogue]]
speaker = "unk"
original = "俺の体に背中を預けて、見上げてくるルヴィ。恋人にぴったり密着されて、俺のペニスはすぐに反応を始めてしまう。"
translation = "내 몸에 등울 맡기고, 올려다보는 루비. 연인에게 딱 밀착되어, 내 페니스는 금방 반응을 시작해버린다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ん……魔王の、大きくなってる……」"
translation = "「응…… 마왕 거, 커지고 있어……」"

[[dialogue]]
speaker = "unk"
original = "スカートに包まれたルヴィのまるいお尻に、勃起ペニスがぐいぐいと当たっている……"
translation = "치마에 감싸인 루비의 동그란 엉덩이에, 발기한 페니스가 꾹꾹 부딪히고 있다……"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……嫌じゃ、ないか？」"
translation = "「……싫지는, 않나?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「いいえ。むしろ反応してくれて嬉しいくらい……私みたいな体でも興奮してくれるんだなって……」"
translation = "「아니. 오히려 반응해줘서 기쁠 정도야…… 나 같은 몸으로도 흥분해주는구나 싶어서……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あ──また硬くなったわ。私のお尻に、ぐい、ぐいって……ふふ<emoji=heart04>」"
translation = "「아── 또 단단해졌네. 내 엉덩이에, 꾹, 꾹 하고…… 후후<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ルヴィがお尻をもじもじ動かして、刺激してくる。"
translation = "루비가 엉덩이를 꼼물꼼물 움직여서, 자극해온다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……少し面白いかも。このまま続けてあげましょうか？」"
translation = "「……조금 재밌을지도. 이대로 계속해줄까?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……悪いけど、もう我慢できそうにない──いいか？」"
translation = "「……미안하지만, 더는 참을 수 없을 것 같아── 괜찮을까?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ええ。私は次の女神になる者ではあるけれど……気兼ねなんてしなくていいわ」"
translation = "「응. 나는 다음 여신이 될 자이기는 하지만…… 거리낄 필요는 없어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「魔王……私の処女、もらってくれる？」"
translation = "「마왕…… 내 처녀, 가져가 줄래?」"

[[dialogue]]
speaker = "unk"
original = "ルヴィの問いかけに、俺はうなずく。"
translation = "루비의 물음에, 나는 고개를 끄덕인다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ありがとう。初めての相手が貴方だなんて、すごく嬉しい……<emoji=heart04>」"
translation = "「고마워. 첫 상대가 당신이라니, 정말 기뻐……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ね、魔王。せっかくだから、したいことは全部聞かせて頂戴？」"
translation = "「저기, 마왕. 모처럼이니까, 하고 싶은 건 전부 들려주겠어?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「私、魔王の彼女だもの。彼女は、彼氏のしたいことを叶えてあげるものでしょう？」"
translation = "「나, 마왕의 여자친구인걸. 여자친구는, 남자친구가 하고 싶은 것을 이뤄주는 거잖아?」"

[[dialogue]]
speaker = "unk"
original = "頬を赤く染めた恋人に、そんないじらしいことを言われたら……もう歯止めは利かない。"
translation = "뺨을 붉게 물들인 연인에게, 그런 애교 있는 말을 들으면…… 이제 제어는 듣지 않는다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だったら────」"
translation = "「그렇다면────」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ず、随分といい趣味をしているのね……貴方……」"
translation = "「제, 제법 좋은 취향을 가지고 있네…… 당신……」"

[[dialogue]]
speaker = "unk"
original = "俺がしたリクエストは、大きく２つ。"
translation = "내가 한 리퀘스트는, 크게 2가지."

[[dialogue]]
speaker = "unk"
original = "１つは、戦闘服に着替えてほしいというもの。"
translation = "1개는, 전투복으로 갈아입어 주었으면 한다는 것."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「確かに私の戦闘服は、露出が多い方だけれど……貴方、もしかして私が変身するたびに、いやらしい目で見ていたの……？」"
translation = "「확실히 내 전투복은, 노출이 많은 편이지만…… 당신, 혹시 내가 변신할 때마다, 야한 눈으로 보고 있었던 거야……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……黙秘権を行使したい」"
translation = "「……묵비권을 행사하고 싶어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「白状しているのと変わらないじゃない……」"
translation = "「자백하고 있는 거나 다름없잖아……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「それに、こんな体勢でしたい、だなんて──」"
translation = "「게다가, 이런 자세로 하고 싶다, 라니──」"

[[dialogue]]
speaker = "unk"
original = "２つ目のお願いは──行為の前に、ルヴィが膝上に乗ってきてくれた体勢。それを変えずに、そのまま繋がりたいというもの。"
translation = "2번째 부탁은── 행위 전에, 루비가 무릎 위에 올라타 준 자세. 그것을 바꾸지 않고, 그대로 이어지고 싶다는 것."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「私から甘えてくれたのが、嬉しかったからって……それは、いいのだけど……」"
translation = "「내가 애교 부려준 것이, 기뻤다고 해서…… 그건, 괜찮지만……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「な、なんだか予想と違うわ……正常位でするとばかり、思ってたから……」"
translation = "「어, 어쩐지 예상과 달라…… 정상위로 할 거라고만, 생각했었으니까……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それは次のエッチでさせてほしい」"
translation = "「그건 다음 섹스에서 하게 해줘」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「さりげなく次の予約まで取って……いやらしいんだから、本当に……<emoji=heart04>」"
translation = "「슬그머니 다음 예약까지 잡고…… 야하다니까, 정말로……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そんな会話をしているうちに、ルヴィの視線が俺のペニスへと向かう。"
translation = "그런 대화를 하는 동안에, 루비의 시선이 내 페니스로 향한다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……勃起した男性器を見るのは、初めてなのだけど。お、大きすぎないかしら……？」"
translation = "「……발기한 남성기를 보는 건, 처음이지만. 너, 너무 크지 않아……?」"

[[dialogue]]
speaker = "unk"
original = "男はなんて単純なんだろう──彼女に大きいと言われただけで体が震える。"
translation = "남자는 어쩜 이리 단순할까── 그녀에게 크다는 말을 들은 것만으로 몸이 떨린다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ぴくぴく震えて、喜んでる……こっちは全部入るか、不安になってるのに……えい<emoji=heart04>」"
translation = "「찌릿찌릿 떨면서, 기뻐하고 있어…… 이쪽은 전부 들어갈지, 불안해하고 있는데…… 앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ルヴィの指先が、亀頭をつんと触る。"
translation = "루비의 손끝이, 귀두를 톡 건드린다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「──やっぱり敏感なのね、これ。凄い……ガチガチに硬いのは、竿のところだけ……？\u3000先っぽは張っているけど、ぷにってしてるのね……」"
translation = "「──역시 민감하네, 이거. 대단해…… 단단하게 딱딱한 건, 기둥 부분뿐……? 끝부분은 부풀어 있지만, 말랑하네……」"

[[dialogue]]
speaker = "unk"
original = "つん、つん。さわ、さわ。"
translation = "톡, 톡. 어루, 만지."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「魔王……これ、何て呼んで欲しい……？\u3000その、エッチな知識は調べてきたけれど……男性器の呼び方って、たくさんあるでしょう」"
translation = "「마왕…… 이거, 뭐라고 불러주면 좋겠어……? 그, 야한 지식은 조사해 왔지만…… 남성기의 부르는 법은, 많이 있잖아」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「どう呼ぶのが、貴方は一番、嬉しい……？」"
translation = "「어떻게 부르는 게, 당신은 가장, 기뻐……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「じゃあ、ルヴィが知ってる中で、一番いやらしいヤツでお願い」"
translation = "「그럼, 루비가 알고 있는 것 중에, 가장 야한 녀석으로 부탁해」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「私の、知ってる中で……？\u3000えっと……その……じゃあ……」"
translation = "「내가, 알고 있는 것 중에……? 어…… 그…… 그럼……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ち──ち○ぽ……とか……？」"
translation = "「자―― 자지…… 라던가……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「…………っ！」"
translation = "「…………읏!」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あ、ぁっ……<emoji=heart04>\u3000また──ち、ち○ぽ<emoji=heart04>\u3000ビクビク、してっ……そ、そう。貴方が喜んでくれるなら……いっぱい呼んであげる……<emoji=heart04>」"
translation = "「아, 아읏……<emoji=heart04> 또── 자, 자지<emoji=heart04> 찌릿찌릿, 하고…… 그, 그래. 당신이 기뻐해 준다면…… 많이 불러줄게……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "あの真面目で聡明なルヴィが、ものすごく直接的な呼び方をしてくれる。それだけでもう、たまらなくなっていた。"
translation = "그 진지하고 총명한 루비가, 엄청나게 직접적인 표현으로 불러준다. 그것만으로 이미, 견딜 수 없게 되어 있었다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「その……ね？\u3000貴方の膝に乗って、お、おま○こっ<emoji=heart04>\u3000膝を開いて、見せていたら……私の方も、濡れてきちゃった、みたいなの……<emoji=heart04>」"
translation = "「그…… 있지? 당신 무릎에 타서, 보, 보지잇<emoji=heart04> 무릎을 벌리고, 보여주고 있었더니…… 내 쪽도, 젖어버린, 것 같아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「じ、自分でも知らなかったのだけれど……私って、なんだかすごく、濡れやすかった、みたいっ<emoji=heart04>」"
translation = "「나, 나조차도 몰랐었지만…… 나란 건, 어쩐지 엄청, 젖기 쉬웠던, 모양이야읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「だから、もう、前戯はいらないというか……ううん、違うわ<emoji=heart04>\u3000もう、私の方がたまらなく、なっちゃってるから……<emoji=heart04>」"
translation = "「그러니까, 이제, 전희는 필요 없다고 할까…… 아니, 아니야<emoji=heart04> 이제, 내가 견딜 수 없게, 되어버렸으니까……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「魔王のち○ぽ、私のおま○こに……頂戴？\u3000遠慮しないで、いいからぁ……<emoji=heart04>」"
translation = "「마왕의 자지, 내 보지에…… 줄래? 거리끼지 않아도, 되니까아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "もう本当に我慢できない。俺はルヴィの体をしっかり抱えなおして、狙いを定めて──"
translation = "이제 정말 더는 참을 수 없다. 나는 루비의 몸을 단단히 고쳐 안고, 조준을 맞춰서──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「んんぅぅうっ──あぁ、ああぁああっ……<emoji=heart04><emoji=heart04>」"
translation = "「응응으으읏── 아아, 아아아앗……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あっ……こ、これっ……凄い……<emoji=heart04>\u3000ぶっといち○ぽっ……ずぶって、は、挿入って、るっ……<emoji=heart04>」"
translation = "「앗…… 이, 이거…… 대단해……<emoji=heart04> 굵은 자지잇…… 푹 하고, 삽, 삽입되고, 있어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「これが、せ、せっくすっ……<emoji=heart04>\u3000あ、ぁっ……ふぅうっ<emoji=heart04>」"
translation = "「이게, 세, 섹스……<emoji=heart04> 아, 아읏…… 후우읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "華奢なルヴィの女性器の狭さは凄まじく、柔らかい膣肉がぎちゅぎちゅと俺のペニスを締め付けてくる。"
translation = "가녀린 루비의 여성기의 좁음은 엄청났고, 부드러운 질 고기가 꽉꽉 내 페니스를 조여온다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「はぁ、あ、ぅっ……<emoji=heart04>\u3000ま、魔王……？\u3000う、動いて、いいわっ……<emoji=heart04>\u3000遠慮しないで……<emoji=heart04>」"
translation = "「하아, 아, 읏……<emoji=heart04> 마, 마왕……? 으, 움직여도, 좋아앗……<emoji=heart04> 거리끼지 말고……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ち○ぽ、大きくて、ちょっぴり苦しいけれどっ<emoji=heart04>\u3000すごく……濡れててっ<emoji=heart04>\u3000痛みは、ほとんど、ないからぁ……<emoji=heart04>\u3000お願い、う、動いて……？」"
translation = "「자지, 커서, 조금 답답하지만읏<emoji=heart04> 엄청…… 젖어있어서읏<emoji=heart04> 아픔은, 거의, 없으니까아……<emoji=heart04> 부탁이야, 으, 움직여줘……?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「いっぱい、出し入れして……ち○ぽ、気持ちよくなって欲しいの……<emoji=heart04>」"
translation = "「가득, 넣었다 뺐다 해줘…… 자지, 기분 좋아졌으면 좋겠어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "とろけたルヴィの声音に誘われて、俺は──"
translation = "녹아내린 루비의 목소리에 유혹되어, 나는──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ふぁぁあっ<emoji=heart04>\u3000ああっ……んん、んぅっ……<emoji=heart04>\u3000ぁ、あぁあっ……んん、んぁぁ、あぁっ……<emoji=heart04>」"
translation = "「후아아앗<emoji=heart04> 아앗…… 응응, 응읏……<emoji=heart04> 아, 아아앗…… 응응, 응아아, 아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「魔王の、ち○ぽっ……<emoji=heart04>\u3000出たり、入ったりっ……ぅう、ふぁ、あぁっ<emoji=heart04>\u3000私の、なかっ<emoji=heart04>\u3000広げられてっ……ひぁ、あ、あぁっ<emoji=heart04>」"
translation = "「마왕의, 자지잇……<emoji=heart04> 나왔다, 들어갔다읏…… 으으, 후아, 아앗<emoji=heart04> 내, 안이잇<emoji=heart04> 넓혀지고 있어서읏…… 히아, 아, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「や、やっぱりっ<emoji=heart04>\u3000あんまり、痛く、ないっ……<emoji=heart04>\u3000んん、ぅあ、あ、あぁっ……<emoji=heart04>\u3000はぁ、んんっ<emoji=heart04>」"
translation = "「여, 역시읏<emoji=heart04> 별로, 아프지, 않아읏……<emoji=heart04> 응응, 으아, 아, 아앗……<emoji=heart04> 하아, 응응읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「初めてだから、覚悟、してた、のにっ……<emoji=heart04>\u3000わ、私と、魔王っ……体の相性、いいのっ……かしらっ……あ、あぁあっ……ふぅうっ<emoji=heart04>」"
translation = "「처음이라서, 각오, 했었, 는데읏……<emoji=heart04> 나, 나랑, 마왕읏…… 몸 속궁합, 좋은 걸, 까읏…… 아, 아아앗…… 후우읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ルヴィの声は本当に気持ちよさそうで、ホッとする。小柄な彼女に無理をさせているんじゃないかって、少し心配していたから。"
translation = "루비의 목소리는 정말 기분 좋아 보여서, 안도한다. 아담한 그녀에게 무리를 시키고 있는 게 아닌가 하고, 조금 걱정했었으니까."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あ、あぁっ……ひぅうっ<emoji=heart04>\u3000そ、そこっ<emoji=heart04>\u3000好き、かもっ……んんんっ<emoji=heart04>」"
translation = "「아, 아앗…… 히우읏<emoji=heart04> 거, 거기잇<emoji=heart04> 좋아할지도읏…… 응응응읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ストロークをするたび、ルヴィの反応が変わる。どうやら女性器の奥──おへその裏あたりに感じるポイントがあるみたいだ。"
translation = "스트로크를 할 때마다, 루비의 반응이 바뀐다. 아무래도 여성기의 깊은 곳── 배꼽 뒤쪽 즈음에 느끼는 포인트가 있는 모양이다."

[[dialogue]]
speaker = "unk"
original = "抱きかかえているから、角度の調整は簡単だ。ルヴィにもっと気持ちよくなってもらいたい。"
translation = "껴안고 있으니까, 각도 조절은 간단하다. 루비가 더욱 기분 좋아지길 바란다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あッ──ぁっ<emoji=heart04>\u3000あ、ああ、あぁっ<emoji=heart04>\u3000魔王、そんなっ<emoji=heart04>\u3000おへその、裏っ<emoji=heart04>\u3000ばっかりっ──ふあぁ、あ、あぁ、んん、あぁっ<emoji=heart04>」"
translation = "「아읏──아앗<emoji=heart04> 아, 아아, 아앗<emoji=heart04> 마왕, 그런읏<emoji=heart04> 배꼽의, 뒤쪽읏<emoji=heart04> 만읏──후아아, 아, 아아, 응응, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「こ、こんなの、知ら──ないっ<emoji=heart04>\u3000私の、し、知らない、ところっ<emoji=heart04>\u3000魔王の、ち○ぽでっ<emoji=heart04>\u3000見つけられてるっ……んんぅうっ<emoji=heart04>」"
translation = "「이, 이런 거, 몰라──읏<emoji=heart04> 내가, 모, 모르는, 부분읏<emoji=heart04> 마왕의, 자지로읏<emoji=heart04> 파악당하고 있어…… 응응으읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "──私の知らないところ？\u3000つまり……知っているところもある、ということなのか？"
translation = "──내가 모르는 부분? 즉…… 알고 있는 부분도 있다는, 소리인가?"

[[dialogue]]
speaker = "unk"
original = "こんなこと訊ねるのはマナー違反かもしれないけれど──"
translation = "이런 걸 묻는 건 매너 위반일지도 모르지만──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「え、えぇっ……？\u3000普段、１人で、んんっ……する、のかって……あ、貴方、ねっ……！？\u3000あ、あぁあっ……ひぅ、んんっ……<emoji=heart04>」"
translation = "「에, 에엣……? 평소에, 혼자서, 응응읏…… 하는 거냐니…… 당, 당신, 말이야읏……!? 아, 아아앗…… 히우, 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ルヴィのこと、たくさん知りたいんだ」"
translation = "「루비에 대해, 많이 알고 싶어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そ、そんなこと、言ってっ……んんんっ<emoji=heart04>\u3000もう……い、言えば、いいんで、しょうっ……あ、ああっ<emoji=heart04>」"
translation = "「그, 그런 소릴, 하고읏…… 응응응읏<emoji=heart04> 정말이지…… 마, 말하면, 되잖아읏…… 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「お、オナニー……しっ……したこと、あるわっ……<emoji=heart04>\u3000ま、前までは、しなかったっ……全然、しなかった、けどっ……<emoji=heart04>」"
translation = "「자, 자위…… 했…… 한 적, 있어어……<emoji=heart04> 전, 전까지는, 안 했어읏…… 전혀, 안 했었, 지만읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「貴方とっ──お付き合い、始めてからっ……し始めたっ……んんぁぁっ<emoji=heart04>\u3000なんで、ち○ぽ硬くしてる、のっ？\u3000ぁ、んんぅっ<emoji=heart04>」"
translation = "「당신하고읏── 교제, 시작하고 나서읏…… 하기 시작했어…… 응응아아읏<emoji=heart04> 왜, 자지 단단하게 만들고, 있어읏? 아, 응응읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "女神候補の女の子が、俺と付き合い始めてから、自身を慰めるようになった──本当に聞いてはいけない告白を聞いている気がして、興奮してしまう。"
translation = "여신 후보인 여자아이가, 나와 교제하기 시작하고 나서, 스스로를 위로하게 되었다── 정말로 들어선 안 될 고백을 듣는 느낌이 들어서, 흥분해버린다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「でも、おま○この中、あんまり、感じなかったし……愛液も、こんなに出ちゃうことなんて、なかったからぁ<emoji=heart04>\u3000お、驚い、ちゃったのっ……<emoji=heart04>\u3000ふぅ、ぁ、あっ<emoji=heart04>」"
translation = "「하지만, 보지 안은, 별로, 느끼지 못했고…… 애액도, 이렇게 나와버릴 리가 없었으니까아<emoji=heart04> 놀, 놀라, 버렸어어……<emoji=heart04> 후우, 아, 앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「自分で、する時は──ク、クリトリス、とかっ……ばっかり、触ってっ……はぁぁ、あぁ、あぁっ<emoji=heart04>\u3000ん、んんんぅっ<emoji=heart04>」"
translation = "「혼자서, 할 때는── 클, 클리토리스, 라던가만…… 만지고잇…… 하아아, 아아, 아앗<emoji=heart04> 응, 응응응으읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ルヴィは根が真面目なのか、本当に包み隠さず喋ってくれる。こんな自慰の告白を聞いたら、むくむくと好奇心が湧いてきてしまう。"
translation = "루비는 근본이 진지한 건지, 정말 숨김없이 말해준다. 이런 자위 고백을 들으니, 몽실몽실 호기심이 솟구쳐버린다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ルヴィが自分で触ってるところ、見てみたいな」"
translation = "「루비가 스스로 만지고 있는 모습, 보고 싶은데」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「な、何を言って、るの……！？\u3000そ、そんなの、は、恥ずかしいっ……<emoji=heart04>」"
translation = "「무, 무슨 소릴, 하는 거야……!? 그, 그런 거, 부, 부끄러워잇……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「彼女は、彼氏のしたいことを叶えてあげるものだって、さっき──」"
translation = "「여자친구는, 남자친구가 하고 싶은 걸 이뤄주는 거라고, 방금──」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そ、そんなっ……そんなのっ……ぁ、ぁぅ、んんっ……<emoji=heart04>」"
translation = "「그, 그런 거읏…… 그런 거읏…… 아, 아우, 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「…………す、すれば、いいんで、しょう……？\u3000本当に……え、えっち……なんだからっ……<emoji=heart04>」"
translation = "「…………하, 하면, 되잖아……? 진짜로…… 야, 야하다니까……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ルヴィの細い指が、ゆっくりとクリトリスに伸びて……"
translation = "루비의 가는 손가락이, 천천히 클리토리스로 뻗어가며……"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「──ひぁっ<emoji=heart04>\u3000ぁっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あぅっ<emoji=heart04>\u3000ち○ぽされながら、クリっ……あ、あぁぁあっ<emoji=heart04>\u3000はあぁあ、んぅ、ぁあぁあっ……<emoji=heart04>」"
translation = "「──히앗<emoji=heart04> 아앗<emoji=heart04> 앗<emoji=heart04> 아우읏<emoji=heart04> 자지 당하면서, 클리잇…… 아, 아아아앗<emoji=heart04> 하아아아, 응우, 아아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ま、魔王っ……これっ<emoji=heart04>\u3000これで、いいっ……？\u3000あ、あぁっ──んんんっ<emoji=heart04>\u3000興奮、して──くれてるっ……？」"
translation = "「마, 마왕읏…… 이거읏<emoji=heart04> 이걸로, 됐어……? 아, 아앗──응응응읏<emoji=heart04> 흥분, 해주고──있어……?」"

[[dialogue]]
speaker = "unk"
original = "ペニスを出し入れされながら、ルヴィが覚えたてのクリトリスオナニーを始めた。"
translation = "페니스를 넣었다 뺐다 당하면서, 루비가 막 익힌 클리토리스 자위를 시작했다."

[[dialogue]]
speaker = "unk"
original = "それを間近で、特等席で見物できるだなんて──興奮しないわけがない。"
translation = "그것을 바로 앞에서, 특등석에서 구경할 수 있다니── 흥분하지 않을 리가 없다."

[[dialogue]]
speaker = "unk"
original = "もっと彼女の乱れたところを見たい……！"
translation = "더욱 그녀가 흐트러진 모습을 보고 싶어……!"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ひぁぁあぁああっ！？\u3000あっあっあっ、んんぅ、んぁあ、あぁああっ<emoji=heart04>\u3000ああぁあっ<emoji=heart04>\u3000はぁあ、ふぅぅっ<emoji=heart04>」"
translation = "「히아아아아앗!? 앗앗앗, 응응우, 응아아, 아아앗<emoji=heart04> 아아앗<emoji=heart04> 하아아, 후우우읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「いきなり、そんなっ──ぁぁあ、んんんぅっ<emoji=heart04>\u3000ち○ぽ、強すぎっ──<emoji=heart04>\u3000あっあっあっ、あぁあ、ふぅぅ、んんあぁああっ<emoji=heart04>」"
translation = "「갑자기, 그런 거읏──아아아, 응응응으읏<emoji=heart04> 자지, 너무 세엣──<emoji=heart04> 앗앗앗, 아아아, 후우우, 응응아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「中っ<emoji=heart04>\u3000奥ぅっ<emoji=heart04>\u3000ち○ぽ、ごりごり当たる、ぅっ<emoji=heart04>\u3000うぁあ、ああ、ぁあ、ぁあっ<emoji=heart04>\u3000気持ちいいっ……これ、いい、気持ちいいっ<emoji=heart04>」"
translation = "「안잇<emoji=heart04> 깊은 곳이잇<emoji=heart04> 자지, 고리고리 부딪혀, 잇<emoji=heart04> 우아아, 아아, 아아, 아앗<emoji=heart04> 기분 좋아읏…… 이거, 좋아, 기분 좋아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺に真下から穿たれながら、ルヴィがクリオナで乱れていく。"
translation = "나에게 바로 밑에서 찔리면서, 루비가 클리 자위로 흐트러져 간다."

[[dialogue]]
speaker = "unk"
original = "背面座位での、激しいピストンでどんどんルヴィの体は火照り、ふわふわと甘い香りが俺の鼻をくすぐる──"
translation = "배면좌위에서의, 격렬한 피스톤으로 점점 루비의 몸은 달아오르고, 몽실몽실 달콤한 향기가 내 코를 간지럽힌다──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「魔王っ<emoji=heart04>\u3000あ、あぁあ、ああぁあっ<emoji=heart04>\u3000ち○ぽ、奥ばっかり、そんな、ぁっ……あぅっ<emoji=heart04>\u3000ひぅう、んぁ、あぁ、あぁっ<emoji=heart04>」"
translation = "「마왕읏<emoji=heart04> 아, 아아아, 아아앗<emoji=heart04> 자지, 깊은 곳만, 그런, 아읏…… 아우읏<emoji=heart04> 히우우, 응아, 아아, 아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "一突きごとにルヴィの体がびくついて、愛液がとぱとぱ漏れ出て、ペニスの侵入を容易いものへ変えていく。"
translation = "한 번 찌를 때마다 루비의 몸이 찌릿찌릿 떨리고, 애액이 울컥울컥 새어나와, 페니스의 침입을 용이하게 만들어 간다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「はぁあ、ふぅうっ<emoji=heart04>\u3000ぅあ、あ、あぁっ<emoji=heart04>\u3000こんなの知らないっ……こんなに気持ちいいの知らないっ、知らない知らないっ──ぁぁああっ<emoji=heart04>」"
translation = "「하아아, 후우우읏<emoji=heart04> 으아, 아, 아앗<emoji=heart04> 이런 거 몰라읏…… 이렇게 기분 좋은 거 몰라읏, 몰라몰라읏──아아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "──もっと乱れて欲しい。セックスしながらのオナニー、もっと見せて欲しい。"
translation = "──더 흐트러졌으면 좋겠다. 섹스하면서 하는 자위, 더 보여주었으면 좋겠다."

[[dialogue]]
speaker = "unk"
original = "そう伝えながら、ピストンを続けていると……ルヴィは自ら、おっぱいを触り始めた。"
translation = "그렇게 전하면서, 피스톤을 계속하고 있자…… 루비는 스스로, 가슴을 만지기 시작했다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ふぅっ<emoji=heart04>\u3000んんっ<emoji=heart04>\u3000んぁっ、あっあっあっ、んぁあ、あぁっ<emoji=heart04>\u3000おっぱい、ぜ、全然、感じなかった、のにっ<emoji=heart04>」"
translation = "「후우읏<emoji=heart04> 응응읏<emoji=heart04> 응아읏, 앗앗앗, 응아아, 아앗<emoji=heart04> 가슴, 전, 전혀, 느끼지 못했는데읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「魔王の、ち○ぽで、ぱんぱんされてるとっ<emoji=heart04>\u3000ぜ、ぜんぶいいっ<emoji=heart04>\u3000ふぁ、ああ、ぁあっ<emoji=heart04>\u3000ひぅ、んんん、んぅうっ<emoji=heart04>」"
translation = "「마왕의, 자지로, 팡팡 당하고 있으면읏<emoji=heart04> 전, 전부 좋아앗<emoji=heart04> 후아, 아아, 아앗<emoji=heart04> 히우, 응응응, 응우읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "冷静沈着な、デネブの指導者。次代の女神となる予定の天使。数多の立派な肩書きを持つ彼女が、汗だくになって乱れている。"
translation = "냉정침착한, 데네브의 지도자. 다음 세대의 여신이 될 예정인 천사. 수많은 훌륭한 직함을 가진 그녀가, 땀범벅이 되어 흐트러지고 있다."

[[dialogue]]
speaker = "unk"
original = "小柄なのにお尻周りの肉付きはよくて、もっちりしたヒップへピストンを繰り返すのが心地よくて仕方がない。"
translation = "아담한데도 엉덩이 주변의 살집은 좋아서, 모찌 같은 엉덩이에 피스톤을 반복하는 것이 기분 좋아서 견딜 수 없다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「魔王、好きっ……好きっ<emoji=heart04>\u3000あ、あぁ、ああぁあっ<emoji=heart04>\u3000好きよ、好きなのっ……あ、あぁあ、ぅうぅうっ<emoji=heart04>\u3000んんぅっ<emoji=heart04>\u3000ふぁああっ<emoji=heart04>」"
translation = "「마왕, 좋아해…… 좋아해엣<emoji=heart04> 아, 아아, 아아앗<emoji=heart04> 좋아해, 좋아하는걸읏…… 아, 아아아, 으우으우읏<emoji=heart04> 응응읏<emoji=heart04> 후아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺も好きだ──ルヴィ！」"
translation = "「나도 좋아해── 루비!」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「うんっ──ぁ、あぁあっ<emoji=heart04>\u3000ひぅ、んん、んんんっ<emoji=heart04>\u3000あっあっあっあっあっ<emoji=heart04>\u3000ち○ぽ、膨らんでっ──これ、も、もう、出るのっ？」"
translation = "「응읏──아, 아아앗<emoji=heart04> 히우, 응응, 응응응읏<emoji=heart04> 앗앗앗앗앗<emoji=heart04> 자지, 부풀어 올라서── 이거, 버, 벌써, 나오는 거야?」"

[[dialogue]]
speaker = "unk"
original = "──限界は間近だ。俺は歯を食いしばって、ピストンを続ける。"
translation = "──한계는 머지않았다. 나는 이빨을 악물고, 피스톤을 계속한다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「遠慮、しないでっ<emoji=heart04>\u3000きてっ<emoji=heart04>\u3000きて、きて、きてっ<emoji=heart04>\u3000私のおま○こにっ<emoji=heart04>\u3000いっぱい、出してっ──んんんぅぅううっ<emoji=heart04>」"
translation = "「거리끼지, 말아줘어<emoji=heart04> 와줘잇<emoji=heart04> 와줘, 와줘, 와줘잇<emoji=heart04> 내 보지에잇<emoji=heart04> 가득, 내보내줘어──응응응으으우읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あ、ぁ──イクっ<emoji=heart04>\u3000私もっ、イクっ──ぅ、ぁあっ<emoji=heart04>\u3000イク、イク、イクイクイクっ──<emoji=heart04>」"
translation = "「아, 아── 간다잇<emoji=heart04> 나도잇, 간다잇──으, 아앗<emoji=heart04> 간다, 간다, 간다간다간다잇──<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ぁ、ぁああぁ、ぁぁぁぁあああぁあ──っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아, 아아아아, 아아아아아아아아──읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「んぅぁあぁあぁぁぁぁぁあああ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응우아아아아아아아아아아~~~읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あ、あぅっ<emoji=heart04>\u3000ひぅっ<emoji=heart04>\u3000ひぅぁ、あっ──あぁぁあっ<emoji=heart04>\u3000あった、かいっ……気持ち、ぃいっ……ふうぅうっ……<emoji=heart04>」"
translation = "「아, 아우읏<emoji=heart04> 히우읏<emoji=heart04> 히우아, 앗──아아아앗<emoji=heart04> 따뜻, 해엣…… 기분, 좋아앗…… 후우우읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "恋人の天使のお腹に、容赦も遠慮もなく精液を送り込む。"
translation = "연인인 천사의 배에, 용서도 거리낌도 없이 정액을 쏟아부어 넣는다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ぅあぁっ<emoji=heart04>\u3000びゅるって、びゅるびゅるって──まだ、出てっ<emoji=heart04>\u3000ひぅぁあ、あぁあぁぁぁっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「으아앗<emoji=heart04> 뷰릇하고, 뷰릇뷰릇하고── 아직, 나오고 있어어<emoji=heart04> 히우아아, 아아아아앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "どくん、どくんと撃ち放つたび、ルヴィは小刻みに痙攣して反応を返してくれる──なんて可愛いんだ、この子。"
translation = "꿀렁, 꿀렁 뿜어낼 때마다, 루비는 찔끔찔끔 경련하며 반응을 돌려준다── 어쩜 이리 귀여운 걸까, 이 아이."

[[dialogue]]
speaker = "unk"
original = "そして、長い射精がようやく終わりに近づいたその時……"
translation = "그리고, 긴 사정이 겨우 끝에 가까워진 바로 그때……"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「────っ！？」"
translation = "「────읏!?」"

[[dialogue]]
speaker = "unk"
original = "ぶるるっ、とルヴィの体が震えた。"
translation = "부르르, 하고 루비의 몸이 떨렸다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「え、ぁっ──？\u3000や、ぁぁっ──！？\u3000ま、待ってっ……で、出るっ……やぁっ……！」"
translation = "「에, 아앗──? 시, 싫어어읏──!? 자, 잠깐만잇…… 나, 나온다…… 싫어앗……!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「出る……？」"
translation = "「나온다……?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「だ、だめだめだめだめっ──だめぇえぇえぇっ──！！」"
translation = "「안, 안돼안돼안돼안돼엣── 안돼에에에엣──!!」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ふぇああぁぁあぁぁあぁ～～～～っ……！！」"
translation = "「후에아아아아아아아~~~~~읏……!!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「──！？」"
translation = "「──!?」"

[[dialogue]]
speaker = "unk"
original = "しゅぃぃいぃぃぃぃ──"
translation = "슉이이이이이이이──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ま、まって……とまってっ……ぁ、あぁあっ<emoji=heart04>\u3000んんぅぅうう～っ……<emoji=heart04>」"
translation = "「자, 잠깐만…… 멈춰줘잇…… 아, 아아앗<emoji=heart04> 응응으으으~읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "絶頂で緊張が弛んでしまったのか。ルヴィはイキながら、おもらしを始めてしまった。"
translation = "절정으로 긴장이 풀려버린 것일까. 루비는 가면서, 지려버리고 말았다."

[[dialogue]]
speaker = "unk"
original = "何だこの光景……すごい。めちゃくちゃ、興奮する──"
translation = "뭐냐 이 광경은…… 대단해. 엄청나게, 흥분된다──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「や、やだぁっ……ま、魔王の部屋、汚しちゃっ、ぅっ……とまって、とまって、ぇっ……！」"
translation = "「시, 싫어어읏…… 마, 마왕의 방, 더럽혀버려, 읏…… 멈춰줘, 멈춰줘, 엣……!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「──気にしなくていいよルヴィ。全部出し切っちゃおう。ほらっ」"
translation = "「──신경 쓰지 않아도 돼 루비. 전부 쏟아내 버리자. 자아」"

[[dialogue]]
speaker = "unk"
original = "ぐりっ、とルヴィの感じるおへその裏をペニスで一突きする。"
translation = "꾹, 하고 루비가 느끼는 배꼽 뒤쪽을 페니스로 한 번 찌른다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「やぁぁあっ！？\u3000ばかぁっ<emoji=heart04>\u3000あぁ──あぁぁぁあぁああぁぁ～～～…………っ<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「야아아앗!? 바보야아<emoji=heart04> 아아── 아아아아아아아아~~~~~……읏<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "しゅろろろろろろっ──"
translation = "슈로로로로로로읏──"

[[dialogue]]
speaker = "unk"
original = "そうして──たっぷり時間をかけて、ルヴィのおもらし絶頂は止まった。"
translation = "그렇게── 듬뿍 시간을 들여, 루비의 지림 절정은 멈췄다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「────死にたい」"
translation = "「────죽고 싶어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「初エッチで……彼氏の部屋で……イキすぎておもらしだなんて……」"
translation = "「첫 섹스에서…… 남자친구의 방에서…… 너무 가서 지려버리다니……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「これは夢……？\u3000夢であって。お願い……」"
translation = "「이건 꿈인가……? 꿈이어라. 부탁이야……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「気にしないでいいよ。掃除すればすむから」"
translation = "「신경 쓰지 않아도 돼. 청소하면 그만이니까」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「…………最悪だわ。貴方との、初めての……思い出が……」"
translation = "「…………최악이야. 당신과의, 첫…… 추억이……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺は嬉しいよ。大好きなルヴィと繋がれたし……こんなになっちゃうくらい、感じてくれたってことだし」"
translation = "「나는 기뻐. 너무 좋아하는 루비와 이어졌고…… 이렇게 되어버릴 정도로, 느껴주었다는 거니까」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それに正直言うと、ルヴィのおもらし、偶然とはいえ見られたの……ちょっと……」"
translation = "「게다가 솔직히 말하자면, 루비가 지린 거, 우연이라고는 해도 볼 수 있었던 거…… 조금……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……ちょっと？」"
translation = "「……조금?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ちょっと興奮した」"
translation = "「조금 흥분했어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「…………ばかぁっ！」"
translation = "「…………바보야!」"

[[dialogue]]
speaker = "unk"
original = "アクシデントもあったけれど、そんな感じで俺とルヴィの初体験エッチは幕を閉じたのだった──"
translation = "해프닝도 있었지만, 그런 느낌으로 나와 루비의 첫 체험 섹스는 막을 내린 것이었다──"

