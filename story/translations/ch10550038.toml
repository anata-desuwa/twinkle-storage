[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「会長様、私にメイドのご奉仕をさせてくださいませ♪」"
translation = "「회장님, 제가 메이드로서 봉사하게 해주세요♪」"

[[dialogue]]
speaker = "unk"
original = "家に遊びに来るや否やメイド服に着替えたエルゼは、耳を疑うおねだりを持ちかけてきた。"
translation = "집에 놀러 오자마자 메이드복으로 갈아입은 엘제는, 귀를 의심케 하는 부탁을 건네왔다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ご奉仕って、何をするかわかってるのか！？」"
translation = "「봉사라니, 뭘 하는지 알고는 있는 거야!?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「もちろんですわ。まだ不慣れで、上手にできるかはわかりませんけど……心を込めて、丁寧に──」"
translation = "「물론이에요. 아직 서툴러서, 잘할 수 있을지는 모르겠지만…… 정성을 담아, 정성껏──」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「お風呂掃除いたしますわ！」"
translation = "「욕실 청소를 하겠어요!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……お風呂掃除？」"
translation = "「……욕실 청소?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はい、九浄家の皆様から習いましたの。蛇口や鏡の水アカ、タイルの隙間の頑固なカビの落とし方まで！\u3000隅々まで綺麗に致しますわ！」"
translation = "「네, 쿠죠 가문의 여러분께 배웠답니다. 수도꼭지나 거울의 물때, 타일 사이의 완강한 곰팡이를 제거하는 방법까지! 구석구석 깨끗하게 만들겠어요!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「な、なんだ、本当に家事なのか。メイドのご奉仕なんて言うから、てっきり──」"
translation = "「뭐, 뭐야, 정말 집안일인가. 메이드의 봉사라고 하길래, 어김없이──」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「てっきり……なんでしょう？\u3000会長様？\u3000なんだかがっかりされてるようですけど……お風呂掃除はお嫌ですの？」"
translation = "「어김없이…… 무슨 말씀이신가요? 회장님? 왠지 실망하신 것 같습니다만…… 욕실 청소는 싫으신가요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「嫌じゃない！\u3000ちっとも嫌じゃないぞ！\u3000エルゼに綺麗にしてもらえたら嬉しいなー！」"
translation = "「싫지 않아! 조금도 싫지 않다고! 엘제에게 깨끗하게 청소받는다면 기쁘지ー!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ですわよね♪\u3000九浄家で培った手並み、是非披露させてくださいませ」"
translation = "「그러시죠♪ 쿠죠 가문에서 다진 솜씨를 꼭 선보이게 해주세요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふんふんふ～ん♪\u3000ごしごし、ごしごし♪\u3000綺麗にいたしますわ～♪」"
translation = "「흥흥흥～♪ 싹싹, 싹싹♪ 깨끗하게 만들겠어요～♪」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「会長様はご存じですか？\u3000お風呂の壁は上から下に向かって洗うのがいいんですのよ」"
translation = "「회장님은 알고 계신가요? 욕실 벽은 위에서 아래로 닦는 것이 좋답니다」"

[[dialogue]]
speaker = "unk"
original = "リズムに乗って、魅惑的なお尻が揺れている。"
translation = "리듬을 타며, 매혹적인 엉덩이가 흔들리고 있다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そうそう、以前にお風呂をお借りした時、隅の汚れがちょっと気になってましたの。さっぱり落ちて、満足満足ですわ♪\u3000会長様──」"
translation = "「맞다, 이전에 욕실을 빌렸을 때, 구석의 더러움이 조금 신경 쓰였거든요. 깔끔하게 떨어져서 만족 만족이에요♪ 회장님──」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「エルゼーっ！」"
translation = "「엘제ー!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「きゃぁんっ！？」"
translation = "「캬앙!?」"

[[dialogue]]
speaker = "unk"
original = "いつも以上に可愛い彼女の姿に、我慢は限界を迎えた。"
translation = "평소 이상으로 귀여운 그녀의 모습에, 인내심은 한계에 달했다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「か、会長様っ……！？\u3000このような格好にされては、お掃除ができないのですけど……んぅっ！？」"
translation = "「회, 회장님……!? 이런 차림을 만드시면, 청소를 할 수 없습니다만……응으!?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ひぁ……お尻に当たっている硬いのは、おち○ぽ様ですの……！？\u3000ど、どうして、勃起されてしまっているんです……？」"
translation = "「히아…… 엉덩이에 닿고 있는 단단한 것은, 자지 님인가요……!? 어, 어째서 발기해 버리신 건가요……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「エルゼのメイド姿が可愛すぎるからだよ。お尻を振りながら誘惑したりするから」"
translation = "「엘제의 메이드 모습이 너무 귀여우니까 그렇지. 엉덩이를 흔들면서 유혹하거나 하니까」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ち、違いますわ……誘ってなどいません……私は真面目に、メイドとしてのご奉仕を全うしようと……んんっ！\u3000おち○ぽ様、擦りつけないでくださいませ」"
translation = "「아, 아닙니다…… 유혹한 게 아니에요…… 저는 진지하게, 메이드로서의 봉사를 다하려…… 응응!? 자지 님, 문지르지 말아 주세요」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「メイドといえば、主人の性欲処理も大切なお仕事なんだよ。おち○ぽ様が気持ちよくなるよう、ご奉仕しなきゃね」"
translation = "「메이드라고 하면, 주인님의 성욕 처리도 중요한 일이라고. 자지 님이 기분 좋아지도록, 봉사해야지」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そ、そうなんですの……！？\u3000九浄家の皆様はそんなことは一言も──いえ、せつな様が近いことをおっしゃっていたような……？」"
translation = "「그, 그런 가요……!? 쿠죠 가문의 여러분은 그런 말씀은 한마디도── 아니, 세츠나 님이 비슷한 말씀을 하셨던 것 같은……?」"

[[dialogue]]
speaker = "unk"
original = "せつなが余計なことを吹き込んでくれていたお陰で、信憑性が増したらしい。"
translation = "세츠나가 쓸데없는 소리를 불어넣어 준 덕분에, 신빙성이 더해진 모양이다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「わ、わかりましたわ……おち○ぽ様にご奉仕いたしますから、お部屋に……ベッドに行きましょう？」"
translation = "「아, 알겠습니다…… 자지 님에게 봉사할 테니까, 방으로…… 침대로 가요?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「このまま交わったら、メイド服が汚れてしまいますわ……それにお風呂では声が響きすぎて……」"
translation = "「이대로 관계하면, 메이드복이 더러워져 버려요…… 거기다 욕실에서는 소리가 너무 울려서……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だめ。このまま、ここでするよ」"
translation = "「안 돼. 이대로, 여기서 할 거야」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そんなぁ……んっ、あっ、ふぁぅ……」"
translation = "「그런…… 응, 아, 하우……」"

[[dialogue]]
speaker = "unk"
original = "部屋に戻る時間すら惜しい。俺は張りつめたペニスを、エルゼの股間に添え、割れ目に沿うように前後に擦りつける。"
translation = "방으로 돌아갈 시간조차 아깝다. 나는 팽팽하게 부풀어 오른 페니스를 엘제의 가랑이에 대고, 갈라진 틈을 따라 전후로 문지른다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はっ、あっ、んぁ……会長様のおち○ぽ様、いつもより大きくて、熱いような気がしますわ……」"
translation = "「하, 아, 응아…… 회장님의 자지 님, 평소보다 크고, 뜨거운 느낌이 들어요……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「メイドのエルゼが可愛すぎるせいだよ……！」"
translation = "「메이드인 엘제가 너무 귀여운 탓이야……!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ひぁ、あっ……耳元で、そんな、あっ……囁かれたら……嬉しくなってしまいます……いけないのに、拒めなくなってしまいますわぁ……<emoji=heart04>」"
translation = "「히아, 아…… 귓가에서, 그런, 아…… 속삭이시면…… 기뻐져 버려요…… 안 되는데, 거절할 수 없게 되어 버려요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "くちゅくちゅと鳴る微かな水音。ふにふにと柔らかい陰唇に擦りつけて、滴っている愛液をペニスに満遍なくまぶす。"
translation = "질퍽질퍽 소리가 나는 미약한 물소리. 말랑말랑 부드러운 음순에 문질러서, 흘러내리는 애액을 페니스에 빠짐없이 묻힌다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あぁん……いやらしい音、させないでくださいまし、おま○こスリスリしてはダメですわ……<emoji=heart04>」"
translation = "「아앙…… 야한 소리, 나게 하지 말아 주세요, 보지 비비면 안 돼요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぅ、はぁ、はっ……会長様は、イジワルです……焦らされたら、おち○ぽ様が恋しくなってしまいますのぉ……<emoji=heart04>」"
translation = "「응으, 하아, 하…… 회장님은, 애태우시는군요…… 애태우시면, 자지 님이 그리워져 버려요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ちょっと弄っただけなのに、簡単に欲しがるようになっちゃったね」"
translation = "「살짝 만졌을 뿐인데, 쉽게 원하게 되어버렸네」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぅぅ……会長様が、いけないのですわ……私におち○ぽ様の味を教えたのは、会長様ですのよ……？」"
translation = "「응으으…… 회장님이 나쁜 거예요…… 제게 자지 님의 맛을 가르쳐 준 건 회장님이시라고요……?」"

[[dialogue]]
speaker = "unk"
original = "すっかりスイッチの入ったエルゼは自ら腰を前後に動かし、ペニスにローション代わりの愛液をまとわせる。"
translation = "스위치가 완전히 켜진 엘제는 스스로 허리를 앞뒤로 움직이며, 페니스에 로션 대신 애액을 묻힌다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いつも気持ちよくなるまで、愛してくださるから……おち○ぽ様が入ってくると思うだけで、はしたなく濡れてしまいますの……ああ、欲しい、欲しいですわ……」"
translation = "「항상 기분 좋아질 때까지 사랑해 주시니까…… 자지 님이 들어온다고 생각하는 것만으로도 품위 없이 젖어버려요…… 아아, 갖고 싶어, 갖고 싶어요……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「エルゼはメイドさんなんだから、欲しがってないでご主人様にご奉仕しないと」"
translation = "「엘제는 메이드니까, 떼쓰지 말고 주인님께 봉사해야지.」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁ、はっ、そうでしたわね……ご奉仕いたします……おち○ぽ様に、おま○こご奉仕、させていただきますわ……<emoji=heart04>」"
translation = "「하아, 하아, 그랬었죠…… 봉사하겠어요…… 자지 님께 보지 봉사, 올리겠어요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "エルゼは自らペニスを自身の膣口へと誘導する。"
translation = "엘제는 스스로 페니스를 자신의 질구로 유도한다."

[[dialogue]]
speaker = "unk"
original = "くちゅりと音を立てて、勃起の尖端がエルゼの花びらの内側に潜った。"
translation = "질척하는 소리를 내며, 발기한 끝부분이 엘제인 꽃잎 안쪽으로 파고들었다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「入れさせて、いただきます……<emoji=heart04>」"
translation = "「삽입하게 해 주세요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んひぁうぅううぅぅんっ<emoji=heart04>」"
translation = "「응히아우우응읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "粘ついた愛液でぬかるんでいる膣穴は、いつも以上に張りつめているペニスをいとも容易く飲み込んでしまった。"
translation = "끈적한 애액으로 질척이는 질 구멍은 평소 이상으로 팽팽해진 페니스를 너무나 쉽게 삼켜버렸다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁ、んっ、ひぅぐうぅぅっ……<emoji=heart04>\u3000んぁ、はぁっ、おち○ぽ様ずっぷりですわ……もう一番奥まで届いちゃいましたぁ……<emoji=heart04>」"
translation = "「하아, 응읏, 히우구우우읏……<emoji=heart04> 응아, 하앗, 자지 님 푹 들어왔어요…… 벌써 가장 안쪽까지 닿아버렸어요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「みたい、だな……先っぽがエルゼの奥に、当たってるっ……！」"
translation = "「그런 것 같네…… 끝부분이 엘제의 안쪽에 닿았어……!」"

[[dialogue]]
speaker = "unk"
original = "女体で最も深い場所。ドーナツ状のコリコリとした子宮口に亀頭が触れている。"
translation = "여체에서 가장 깊은 곳. 도넛 모양의 오돌토돌한 자궁구에 귀두가 닿아 있다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぃ、んぅ、はぁぁ……この格好ですと、おち○ぽ様っ、ひぅっ、んゃうぅっ<emoji=heart04>\u3000深ぁくまで届いてしまいますぅ<emoji=heart04>」"
translation = "「응이, 응으, 하아아…… 이 자세면 자지 님, 히웃, 응야우읏<emoji=heart04> 깊은 곳까지 닿아버려요<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁ、んんっ……挿れたら、もう抗えませんの……私、おち○ぽ様の虜ですわ……<emoji=heart04>」"
translation = "「하아, 응응읏…… 삽입당하면, 더는 거역할 수 없어요…… 저, 자지 님의 포로예요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「エルゼも腰振って。俺を気持ちよくする奉仕の心を忘れないようにね」"
translation = "「엘제도 허리 흔들어. 나를 기분 좋게 만드는 봉사의 마음을 잊지 않도록.」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふぁ、はっ、はぁい、ご奉仕させていただきますっ……<emoji=heart04>」"
translation = "「후아, 하앗, 네에, 봉사하겠어요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んあっ、あっ、あっ、どうですか、会長様ぁっ？\u3000おち○ぽ様っ、きもちっ、いいっ、ですかっ？」"
translation = "「응앗, 앗, 앗, 어떠세요, 회장님? 자지 님, 기분, 좋은, 가요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いいよ、エルゼの中、すごく気持ちいいっ」"
translation = "「좋아, 엘제 안쪽, 엄청 기분 좋아.」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んふふっ、褒められてしまいましたわぁ……会長様が気持ちよくなってくれると、私も嬉しくなってしまいますっ……<emoji=heart04>」"
translation = "「응후후, 칭찬받아버렸어요…… 회장님이 기분 좋아지시면, 저도 기뻐져요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「愛しい人に身も心も捧げる……これが奉仕の心得ですのね……<emoji=heart04>」"
translation = "「사랑하는 사람에게 몸도 마음도 바친다…… 이것이 봉사의 마음가짐이군요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぁ、はっ、あぁんっ<emoji=heart04>\u3000おち○ぽ様、どくどくって動きましたわ<emoji=heart04>」"
translation = "「응아, 하앗, 아앙읏<emoji=heart04> 자지 님, 꿀렁꿀렁 움직였어요<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぅ、ふぅ、あっ、ああっ……おっきなおち○ぽ様ぁ……おなかっ、引っ張り出されちゃいまふっ<emoji=heart04>」"
translation = "「응우, 후우, 앗, 아앗…… 커다란 자지 님…… 배속, 잡아당겨지는 느낌이에요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「エルゼのおま○こが吸い付きすぎなんだよ……！\u3000奉仕なんて言いながら、エルゼの方が愉しんでるんじゃない？」"
translation = "「엘제 보지가 너무 빨아들이잖아……! 봉사라고 하면서 엘제가 더 즐기고 있는 거 아니야?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁ、はっ……だって……おち○ぽ様、とっても長くて大きくて……私では届かないとこ、ぐりぐりしてくれますのぉっ……<emoji=heart04>」"
translation = "「하아, 하앗…… 그치만…… 자지 님, 너무 길고 커서…… 저 혼자선 안 닿는 곳을 문질문질해 주시는걸요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「会長様と出会うまで、こんなこと知らなかったのに……いけないことを覚えてしまいましたの……<emoji=heart04>」"
translation = "「회장님과 만나기 전까진 이런 거 몰랐는데…… 못된 걸 배워버렸어요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁ、あっ、会長様にっ……おち○ぽ様にぃ、私のおま○こ、とろっとろに溶かされてしまいましたわぁ……<emoji=heart04>」"
translation = "「하아, 앗, 회장님께…… 자지 님께, 제 보지, 녹아내릴 정도로 질척해져 버렸어요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ、ふぁぁ、おち○ぽ様、おち○ぽ様ぁっ……<emoji=heart04>\u3000赤ちゃんのお部屋っ、ごんっ、ごんっ、ノックしてっ……<emoji=heart04>」"
translation = "「앗, 후아아, 자지 님, 자지 님……<emoji=heart04> 아기 방, 쿵, 쿵, 노크해줘……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "名器を喩えるのに『ミミズ千匹』とはよく言ったものだ。"
translation = "명기를 비유할 때 『지렁이 천 마리』라고 하는 말이 딱 들어맞는다."

[[dialogue]]
speaker = "unk"
original = "エルゼが甘い喘ぎを漏らす度、子種を貪ろうとする膣ヒダがうねうねとうごめく。"
translation = "엘제가 달콤한 교성을 내뱉을 때마다, 씨앗을 탐하려는 질 주름이 꿈틀꿈틀 움직인다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぅふっ、ひぁ、あ、はぁっ……<emoji=heart04>\u3000ひにゃあっ<emoji=heart04>\u3000体、痺れてしまいますっ、立ってられなくなってしまいますわっ……んぁ、あっ、あぅ、んふぅっ<emoji=heart04>」"
translation = "「응우후, 히아, 아, 하앗……<emoji=heart04> 히냐앗<emoji=heart04> 몸이 저려와요, 서 있을 수 없게 되어버려요…… 응아, 앗, 아우, 응후앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「会長しゃまっ<emoji=heart04>\u3000もっと、もっとぉ<emoji=heart04>\u3000きもちよく、してっ、くださいませっ<emoji=heart04>\u3000あっ、んぅ、はっ、あっあーっあぁーっ<emoji=heart04>」"
translation = "「회장님<emoji=heart04> 더, 더 많이<emoji=heart04> 기분 좋게, 해주, 세요<emoji=heart04> 앗, 응우, 하앗, 앗아-앗아아-<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "このままじゃエルゼが満足する前に、こっちがイカされてしまいそうだ。"
translation = "이대로 가다간 엘제가 만족하기 전에 이쪽이 먼저 싸버릴 것 같다."

[[dialogue]]
speaker = "unk"
original = "メイドに無様に負けるご主人様なんて、許されるはずがない。ここは一気に、エルゼを追い込んで──"
translation = "메이드에게 볼품없이 패배하는 주인이라니, 용납될 리 없다. 여기서는 한 번에 엘제를 몰아붙여서──"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふぁぁあぁぁんっ！？\u3000あっ、ふぁあぁぁんっ<emoji=heart04>\u3000あっ、んぁ、はぁん<emoji=heart04>\u3000んぁっ、あぁあぁぁーーっ<emoji=heart04>」"
translation = "「후아아아앙앗!? 앗, 후아아앙앗<emoji=heart04> 앗, 응아, 하앙<emoji=heart04> 응앗, 아아아아--앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "股間から脳天まで貫くように熱杭のピストンを打ち付ける。"
translation = "고관절부터 정수리까지 꿰뚫듯이 뜨거운 말뚝 같은 피스톤을 박아 넣는다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んあぁっ<emoji=heart04>\u3000ふぁっ、あっ、ぁあ、おち○ぽ様っ、おち○ぽひゃまっ<emoji=heart04>\u3000ごんごんっ<emoji=heart04>\u3000ごんごん突かれてまひゅわっ<emoji=heart04>」"
translation = "「응아앗<emoji=heart04> 후앗, 앗, 아아, 자지 님, 자지 님<emoji=heart04> 쿵쿵<emoji=heart04> 쿵쿵 찔리고 있어요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "性器が交じり合って奏でる淫水の音、そして、エルゼの高らかでいやらしい喘ぎは、より激しく、より大きく、風呂場に響き渡る。"
translation = "성기가 섞이며 자아내는 음수의 소리, 그리고 엘제의 높고 야한 숨소리는 더욱 격렬하게, 더욱 크게 욕실에 울려 퍼진다."

[[dialogue]]
speaker = "unk"
original = "その音量に比例するように、性器に巡る快感の痺れもまた強まり、更に上の快感を求めてピストンは加速する。"
translation = "그 음량에 비례하듯 성기로 몰려드는 쾌감의 저림 또한 강해지고, 더욱 높은 쾌감을 찾아 피스톤은 가속한다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぁ、あっ、あっあっああぁっ<emoji=heart04>\u3000激し、激しすぎれすっ、おま○こっおま○こ壊れちゃいまひゅっ<emoji=heart04>」"
translation = "「응아, 앗, 앗앗아아앗<emoji=heart04> 격해, 너무 격해요, 보지, 보지 망가져버려요<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ふぁ、あっ、あっ、おち○ぽ様に、弱いとこ、全部バレちゃってましゅわっ<emoji=heart04>\u3000突かれるとっ、力、抜けちゃっ、んぁっ、あっ、ひぁあぁあっ<emoji=heart04>」"
translation = "「후아, 앗, 앗, 자지 님께, 약한 곳, 전부 들켜버렸어요<emoji=heart04> 찌르면, 힘이, 빠져버, 응앗, 앗, 히아아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「おかひくっ、頭も、おま○こも、おかひくなっちゃいまふわぁ<emoji=heart04>\u3000おち○ぽ様にっ<emoji=heart04>\u3000おかひくっ<emoji=heart04>\u3000されちゃってまひゅわぁっ<emoji=heart04>」"
translation = "「이상해, 머리도, 보지도, 이상해져버려요<emoji=heart04> 자지 님께<emoji=heart04> 이상하게<emoji=heart04> 만들어지고 있어요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いいぞ、もっとおかしくなっちゃえ。えっちなエルゼは俺だけのモノだからね」"
translation = "「좋아, 더 이상해져 버려. 야한 엘제는 나만의 것이니까.」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はっ、はぃいぃっ<emoji=heart04>\u3000ふしだらな私は、会長様だけのモノですわっ……<emoji=heart04>」"
translation = "「하앗, 하이잇<emoji=heart04> 음란한 저는, 회장님만의 것이에요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁんっ……お父様にもお母様にも秘密の……おち○ぽ様大好きで、お変態な私ぃ……<emoji=heart04>」"
translation = "「하앙…… 아버님께도 어머님께도 비밀인…… 자지 님 아주 좋아하고, 변태인 저……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "名門・桜十路のお嬢様を、セックスの虜になるまで躾けたなんてバレようものなら極刑モノだろう。"
translation = "명문 오구로지 가문의 영애를 섹스의 포로가 될 때까지 길들였다는 게 들통나면 극형감이겠지."

[[dialogue]]
speaker = "unk"
original = "だからこそ、だ。禁忌の行為故に、俺もエルゼも限りなく昂ってしまう。"
translation = "그렇기 때문에 더욱, 금기시된 행위이기에 나와 엘제 모두 한없이 고양되고 만다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んあっ、はっ、もっともっとっ、おち○ぽ様パンパンしてくださいませっ<emoji=heart04>\u3000はっ、あっ、あぁっ<emoji=heart04>」"
translation = "「응앗, 하앗, 더 많이, 자지 님 팡팡 해주세요……<emoji=heart04> 하앗, 앗, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ、あーっ、んぁ、はっ、はひぃんっ、頭がふわふわしましゅわぁ……<emoji=heart04>\u3000あっ、あーっあーっあぁーっ<emoji=heart04>\u3000はぁああぁーーっ<emoji=heart04>」"
translation = "「앗, 아-, 응아, 하앗, 하히응앗, 머리가 몽롱해져요……<emoji=heart04> 앗, 아-앗아-앗아아-<emoji=heart04> 하아아아--앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "エルゼと俺の体温が等しくなり、溶け合ってひとつになってしまったかのような錯覚すら覚えた。"
translation = "엘제와 나의 체온이 같아져, 녹아내려 하나가 되어버린 듯한 착각마저 들었다."

[[dialogue]]
speaker = "unk"
original = "エルゼとの淫らな行為に溺れ、感じすぎているのは俺も同じ。"
translation = "엘제와의 음란한 행위에 빠져, 너무 느끼고 있는 것은 나 역시 마찬가지."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ<emoji=heart04>\u3000おち○ぽ様っ、おっきくぅ……！\u3000きもちいいとこ、ぞりぞり擦ってまひゅっ……んあっ、ぁああっ……イ、イキそう、ですのねっ……？」"
translation = "「앗<emoji=heart04> 자지 님, 커져서……! 기분 좋은 곳, 쓱쓱 문지르고 있어요…… 응앗, 아아앗…… 사, 싸실 것, 같네요……?」"

[[dialogue]]
speaker = "unk"
original = "何回も咥え込んでるだけあって、エルゼの優等生おま○こは、絶頂の差し迫ったペニスの反応もすっかり覚えている。"
translation = "몇 번이고 물고 있었던 만큼, 엘제의 모범생 보지는 사정이 임박한 페니스의 반응도 완전히 기억하고 있다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぁっ、あぁんっ<emoji=heart04>\u3000抜くつもり、ありませんわよね……中に出してしまいますのねっ？\u3000私、また会長様のモノにされてしまいますっ……<emoji=heart04>」"
translation = "「응앗, 아앙앗<emoji=heart04> 빼실 생각, 없으신 거죠…… 안에 싸버리시는 거죠? 저, 또 회장님의 것으로 만들어져 버려요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああっ、中に出すよっ……！\u3000エルゼの子宮に、全部っ……俺の愛情注ぐからねっ……！」"
translation = "「아아, 안에 쌀 거야……! 엘제의 자궁에, 전부…… 내 애정을 쏟아부을 테니까……!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁ、あっ、嬉ひいっ<emoji=heart04>\u3000くださいっ、そのままっ、そのままっ<emoji=heart04>\u3000アツぅいお精子っ、私の中にっ、いっぱい、いっぱい出してっ、出してくださいませっ<emoji=heart04>」"
translation = "「하아, 앗, 기뻐요<emoji=heart04> 주세요, 그대로, 그대로<emoji=heart04> 뜨거운 정액, 제 안에, 가득, 가득 내보내, 내보내 주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ、あっあっ、わたくひもっ、イッ、イキまひゅ、イキまひゅからっ<emoji=heart04>\u3000お射精感じたら、イッちゃいまひゅからぁっ<emoji=heart04>」"
translation = "「앗, 앗앗, 저도, 가, 갈 것 같아요, 갈 것 같으니까<emoji=heart04> 사정 느끼면, 가버릴 테니까요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イキたがっているエルゼの子宮は下がり、精を求めている膣内はいつも以上に狭く、キュンキュンと締め付けてくる。"
translation = "가고 싶어 하는 엘제의 자궁은 내려와 있고, 정액을 바라는 질 내는 평소보다 더 좁아져 꽉꽉 조여온다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いつものように、どくんどくんどくんって、たぁっぷりっ<emoji=heart04>\u3000いやらしいメイドのおま○こにっ、注いでくださいませっ<emoji=heart04>」"
translation = "「평소처럼 꿀렁꿀렁 꿀렁하고 듬뿍<emoji=heart04> 음란한 메이드의 보지에, 쏟아부어 주세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ただ、ひたすらに快感を追い求めて、エルゼを貫く。バチバチと脳内で雷光が弾けて、眼前が真っ白に染まっていく。"
translation = "그저 오롯이 쾌감만을 좇으며 엘제를 꿰뚫는다. 머릿속에서 번개가 팍팍 튀고, 눈앞이 하얗게 물들어 간다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ、あ、ああっ！？\u3000おち○ぽ様、おち○ぽ様ぁ<emoji=heart04>\u3000んあっ！？\u3000ひぅ、んぅううぅぅぅっ<emoji=heart04>」"
translation = "「앗, 아, 아앗!? 자지 님, 자지 님<emoji=heart04> 응앗!? 히우, 응우우우읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁんっ、おち○ぽ様、おち○ぽ様っ<emoji=heart04>\u3000ずぼずぼっ<emoji=heart04>\u3000どくどくしへましゅっ<emoji=heart04>」"
translation = "「하앙, 자지 님, 자지 님<emoji=heart04> 푹푹<emoji=heart04> 꿀렁꿀렁하고 있어요<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あっ、あっ、きもちいいのきてますっ、きもちいいのしゅきっ、しゅきぃ、だいしゅきれすわぁっ<emoji=heart04>」"
translation = "「앗, 앗, 기분 좋은 거 와요, 기분 좋은 거 좋아, 좋아, 정말 좋아요<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁっ、はっ、んぁ、あっ<emoji=heart04>\u3000あっ、あぁあぁんっ<emoji=heart04>\u3000会長ひゃまっ、なかっ、なかにいっぱい、お精子くださいませっ<emoji=heart04>」"
translation = "「하앗, 하앗, 응아, 앗<emoji=heart04> 앗, 아아아앙읏<emoji=heart04> 회장님, 안에, 안에 가득, 정액 주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぃっ！？\u3000ぁ、ああっあっ、ぁ、ぁあぁっ、んんぅっ<emoji=heart04>\u3000はひっ、はっ、あっ、ああぁあぁっ<emoji=heart04>」"
translation = "「응잇!? 아, 아앗앗, 아, 아아앗, 응응읏<emoji=heart04> 하힛, 하앗, 앗, 아아아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぃ──ぁはあぁああぁあぁあぁんっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응이──아하아아아아아앙읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぃいぃぃいぃっ<emoji=heart04>\u3000イッ、イッグっ、んぃ、ひっ、んぅいぃっ<emoji=heart04>\u3000イッて、イッてましゅ、イッでぅうぅぅぅんっ<emoji=heart04>」"
translation = "「응이이이이잇<emoji=heart04> 가, 가읏, 응이, 히읏, 응우잇<emoji=heart04> 가, 가고 있어요, 가고 있어어어응읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "エルゼの体の奥の奥、子宮口に亀頭をぴったりと押しつけ、俺は彼女の望む通りに精を放った。"
translation = "엘제의 몸 가장 깊은 곳, 자궁구에 귀두를 딱 밀착시키고, 나는 그녀가 원하는 대로 정액을 방출했다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぃっ<emoji=heart04>\u3000はっ、はぁ、んぅっ<emoji=heart04>\u3000びゅくびゅくびゅくぅっ……アッツぅいお精子ぃ、お精子いっぱい出てましゅわぁ……<emoji=heart04>」"
translation = "「응잇<emoji=heart04> 하앗, 하아, 응읏<emoji=heart04> 왈칵왈칵왈칵…… 뜨거운 정액, 정액 가득 나오고 있어요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "吐精の脈動にシンクロするように、抱えているエルゼの身体は激しく痙攣し、絶頂を訴える。"
translation = "사정의 맥동에 Synchronize 하듯, 안고 있는 엘제의 몸은 격렬하게 경련하며 절정을 말해준다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁ、あっ……はぁ、んっ、んぁはあぁぁっ……<emoji=heart04>\u3000元気なお精子……子宮に入ってきてますのぉ……<emoji=heart04>」"
translation = "「하아, 앗…… 하아, 응읏, 응아하아아앗……<emoji=heart04> 싱싱한 정액…… 자궁에 들어오고 있어요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はっ、はぁっ<emoji=heart04>\u3000ぉあっ<emoji=heart04>\u3000はっ、はぁ、ほぁぁぁ……っ<emoji=heart04>\u3000はっ、はひっ、ふぅ、ふぁ、はぁあぁぁぁんっ……んんんーっ！？」"
translation = "「하앗, 하앗<emoji=heart04> 오앗<emoji=heart04> 하앗, 하아, 호아아아……앗<emoji=heart04> 하앗, 하힛, 후우, 후아, 하아아아앙앗……응응응-!?」"

[[dialogue]]
speaker = "unk"
original = "まだ尿道に残っている精液を吐き出すべく、腰を捻り、痙攣し続けている膣内でぐりぐりと亀頭を刺激する。"
translation = "요도에 아직 남아있는 정액을 토해내기 위해, 허리를 비틀어 계속 경련하고 있는 질 내에서 귀두를 문질문질 자극한다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぁっ！？\u3000あっ、だめ、だめれすっ<emoji=heart04>\u3000おま○こイッてますの、イッてますのにぃっ！\u3000そんなにぐりぐりされたらっ<emoji=heart04>」"
translation = "「응아앗!? 앗, 안돼, 안돼요<emoji=heart04> 보지 가고 있는데, 가고 있는데! 그렇게 문지르면<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぃ、敏感ですからっ、だめっ、出ちゃいますっ<emoji=heart04>\u3000おしっこっ、おしっこ出ちゃいますのっ<emoji=heart04>」"
translation = "「응이, 민감하니까, 안돼, 나와버려요<emoji=heart04> 오줌, 오줌 나와버려요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「風呂場だから流せばいいだけだぞ。気にせず出しちゃえ、イキしょん漏らしちゃえっ」"
translation = "「욕실이니까 흘려보내면 돼. 신경 쓰지 말고 내보내, 분수 싸버려.」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「い、いやっ、綺麗にしましたのにっ、会長様のお家でおもらし、なんてっ、んぁ、ぐりぐりしちゃ、あっ、はぁっ、あっあっあぁーっ<emoji=heart04>」"
translation = "「시, 싫어, 깨끗이 했는데, 회장님 집에서 지려버린다니, 응아, 문지르면, 앗, 하앗, 앗앗아-앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぅ、ひぃぅうぅぅっ！\u3000出る、出ちゃう、出ちゃいまっ──んぁ、っはあぁあぁあぁぁぁんっ<emoji=heart04>」"
translation = "「응우, 히우우우읏! 나와, 나와, 나와버──응아, 앗하아아아아아앙앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んぁあぁぁぁっ<emoji=heart04>\u3000おしっこ、おしっこ出ちゃってますのぉっ！\u3000んぃ、ひぅ、んぅううぅぅっ<emoji=heart04>」"
translation = "「응아아아아앗<emoji=heart04> 오줌, 오줌 나와버리고 있어요! 응이, 히우, 응우우우읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "エルゼの尿道から、虹のように弧を描くおしっこが噴き出た。"
translation = "엘제의 요도에서 무지개처럼 호를 그리는 오줌이 뿜어져 나왔다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んゃ、あっ、おしっこ止まりませんのっ！\u3000んゃ、あっ、あっ、あぁっ、見ないで、会長様、見ないでくださいませっ<emoji=heart04>」"
translation = "「응야, 앗, 오줌이 안 멈춰요! 응야, 앗, 앗, 아앗, 보지 마세요, 회장님, 보지 말아 주세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "見なくとも勢いのついた放尿が、激しく風呂のタイルを叩いている音は聞こえるし、微かなアンモニア臭が浴室に充満している。"
translation = "보지 않아도 기세가 붙은 방뇨가, 격렬하게 욕실 타일을 때리는 소리가 들리고, 미세한 암모니아 냄새가 욕실에 자욱하다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あ、あっ、あっ、止まらないですのっ、ずっと、ずっと出ちゃいますのぉっ<emoji=heart04>\u3000んぁ、おち○ぽ様ぐりぐり止めてくださいませぇっ<emoji=heart04>」"
translation = "「아, 앗, 앗, 안 멈춰요, 계속, 계속 나와버려요<emoji=heart04> 응아, 자지 님 문지르는 거 멈춰주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「んひぅっ<emoji=heart04>\u3000おしっこ、きもちいぃ……<emoji=heart04>\u3000イキながらおもらし、きもひいいれすぅっ……<emoji=heart04>」"
translation = "「응히웃<emoji=heart04> 오줌, 기분 좋아……<emoji=heart04> 가면서 싸버리는 거, 기분 좋아요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "精液を塗りこむように刺激しているその間、エルゼのおしっこはいつまでも出続けた。"
translation = "정액을 문질러 넣듯이 자극하는 동안, 엘제의 오줌은 끝없이 계속 나왔다."

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「はぁっ、はぁ……おち○ぽ様で気持ちよくなって……おしっこでも気持ちよくなってしまって……」"
translation = "「하아, 하아…… 자지 님으로 기분 좋아지고…… 오줌으로도 기분 좋아져 버리고……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「会長様とお付き合いしていると、ますますお変態になってしまいますの……」"
translation = "「회장님하고 사귀다 보니, 점점 더 변태가 되어버려요……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そう？\u3000エルゼがますます俺好みの女の子になってくれてるの、すごく嬉しいよ」"
translation = "「그래? 엘제가 점점 더 내 취향인 여자가 되어줘서, 난 정말 기쁜데.」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「うぅう……会長様は意地悪ですわ……」"
translation = "「우우…… 회장님은 짓궏으세요……」"

[[dialogue]]
speaker = "unk"
original = "本当に、すこし意地悪が過ぎたかな、と思いつつも……"
translation = "정말로 조금 장난이 과했나 싶으면서도……"

[[dialogue]]
speaker = "unk"
original = "真っ赤になりながら、抗議するエルゼの可愛さに愛おしさを募らせないではいられないのだった。"
translation = "새빨개진 채 항의하는 엘제의 귀여움에 사랑스러움이 더해질 수밖에 없었다."

