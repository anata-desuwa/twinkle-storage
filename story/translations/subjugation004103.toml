[[dialogue]]
speaker = "unk"
original = "２人の見習いメイドが修行を始めて３日経った。"
translation = "두 견습 메이드가 수행을 시작하고 3일이 지났다."

[[dialogue]]
speaker = "unk"
original = "たった３日、されど３日だ。物覚えの良し悪しもあるだろう。ただ、それとは別の理由で両者に明らかな差が生まれていた。"
translation = "단 3일, 그렇지만 3일이다. 습득력의 차이도 있을 것이다. 다만, 그것과는 별개의 이유로 양자 사이에 명확한 차이가 생겨나고 있었다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ご主人様～<emoji=heart04>\u3000焼きたてのホットケーキでございまぁーす<emoji=heart04>」"
translation = "「주인님~<emoji=heart04> 갓 구운 핫케이크 나왔습니더~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "おいしそうだね"
translation = "맛있어 보이네"

[[dialogue]]
speaker = "unk"
original = "ありがとう！"
translation = "고마워!"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクが焼いたやつだから、よーく味わって食べてね<emoji=heart04>\u3000モエモエキューンってやつ、やろうか？」"
translation = "「내가 구운 거니까 잘~ 맛보고 먹어줘<emoji=heart04> 모에모에 큥이라는 거, 해볼까?」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「それは市井のメイド喫茶がすることです。星見家のメイドはそんなことしないんですよ」"
translation = "「그건 시중의 메이드 카페에서나 하는 일입니다. 호시미 가문의 메이드는 그런 짓은 하지 않아요」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「えー、でもにーにーはそういうの好きそうじゃない？」"
translation = "「에~, 하지만 오빠는 그런 거 좋아할 것 같지 않아?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「確かに。主人に合わせて行動を変えるのも大事なことなのです」"
translation = "「확실히. 주인에게 맞춰 행동을 바꾸는 것도 중요한 법입니다」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「でしょ～？\u3000ってことで、にーにーいっくよ～～！」"
translation = "「그치~? 그런 의미로, 오빠 간다~~!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「食らえ！\u3000モエモエアタァァァーーーーック！！！」"
translation = "「받아라! 모에모에 어택ーーーー!!!」"

[[dialogue]]
speaker = "unk"
original = "はちみつかけすぎ！"
translation = "꿀을 너무 많이 쳤잖아!"

[[dialogue]]
speaker = "unk"
original = "ぎゃあ！"
translation = "갸악!"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ウキキ♪\u3000はちみつびしゃがけ～♪」"
translation = "「우키키♪ 꿀 듬뿍 뿌리기~♪」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「よーし、あたしも負けてらんないな！\u3000行くぞ、フィオナ！」"
translation = "「좋았어, 나도 지고 있을 순 없지! 간다, 피오나!」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「ひゃい！\u3000あ、待って姉さん心の準備が……」"
translation = "「히얏! 아, 잠깐만 언니 마음의 준비가……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「モエモエキューーーーン<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「모에모에 큐ーーー운<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「……………………っっ」"
translation = "「……………………윽」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「……さ、さすが姉さんですね、気を失いそうになるほどの破壊力でした」"
translation = "「……과, 역시 언니네요, 정신을 잃을 뻔할 정도의 파괴력이었어요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そうか？\u3000じゃあもう１回……」"
translation = "「그래? 그럼 한 번 더……」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「お待ち下さい、アポロ様。それ以上はいけません、可愛さの過剰摂取になってしまいます」"
translation = "「기다리십시오, 아폴로 님. 그 이상은 안 됩니다, 귀여움 과다 섭취가 되어버립니다」"

[[dialogue]]
speaker = "unk"
original = "交代するよ、フィオナ"
translation = "교대할게, 피오나"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「ええ、よろしくお願いします、会長」"
translation = "「네, 잘 부탁드립니다, 회장님」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「おー、次は魔王だな？\u3000あたしが紅茶を入れてやるから、楽しんでくれ！\u3000かなり練習したから自信あるんだ」"
translation = "「오, 다음은 마왕인가? 내가 홍차를 타줄 테니까, 즐겨줘! 엄청 연습해서 자신 있다고」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そーっと……慎重に……うん、このくらいでいいかな……蒸らしの時間もカンペキだ！」"
translation = "「살며시…… 신중하게…… 응, 이 정도면 됐으려나…… 뜸 들이는 시간도 완벽해!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「どうぞ、ご主人様。あたしが心を込めていれた紅茶だぞ」"
translation = "「자, 주인님. 내가 정성을 담아 딴 홍차야」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「ああ、姉さんがあんなに立派になって……」"
translation = "「아아, 언니가 저렇게 훌륭해져서……」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「心を鬼にして厳しくご指導した甲斐がございました」"
translation = "「마음을 독하게 먹고 엄하게 지도한 보람이 있었군요」"

[[dialogue]]
speaker = "unk"
original = "上手に淹れられたね"
translation = "잘 타줬네"

[[dialogue]]
speaker = "unk"
original = "おいしいよ、アポロ"
translation = "맛있어, 아폴로"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「星見家のメイドとして当然……なのですっ」"
translation = ""

[[dialogue]]
speaker_original = "フェニエル"
speaker_translation = "페니엘"
original = "「修行を始めてまだ３日なのに、凄くしっかりしてるなぁ……」"
translation = "「수행을 시작한 지 아직 3일밖에 안 됐는데, 엄청 야무지네……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「やはり星見家のお嬢様という生まれの影響でしょうか」"
translation = "「역시 호시미 가의 아가씨라는 타고난 혈통의 영향일까요」"

[[dialogue]]
speaker_original = "フェニエル"
speaker_translation = "페니엘"
original = "「ううん、アポロ様だって最初は全然できなかったよ。でも凄く頑張って練習したから」"
translation = "「으응, 아폴로 님도 처음엔 전혀 못 했어. 하지만 엄청 노력해서 연습했으니까」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「むむ……お嬢様！\u3000次はこっちの番だよ～！\u3000アポロよりすごいとこ見せちゃうからね！」"
translation = "「으으…… 아가씨! 다음은 이쪽 차례야~! 아폴로보다 대단한 모습 보여줄 테니까!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「お茶くらい簡単だって。お茶っ葉入れて、お湯をドバァーーって……」"
translation = "「차 정도야 간단하다고. 찻잎 넣고, 찻물을 콰아아ーー하고……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「それ、教わったのと違うだろ」"
translation = "「그거, 배운 거랑 다르잖아」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「口に入ればみんな同じだって！\u3000そりゃそりゃ～～！！」"
translation = "「입에 들어가면 다 똑같다고! 자자~~!!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「うおっ！？\u3000あれ、なんか違うな～。どうなってるの？\u3000めちゃ苦そうな臭いしてるし……」"
translation = "「우앗!? 어라, 뭔가 이상하네~. 어떻게 된 거지? 엄청 쓴 냄새가 나는데……」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「待ちなさい。そんな紅茶を提供させるわけにはいきません」"
translation = "「기다리세요. 그런 홍차를 제공하게 둘 수는 없습니다」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「な、なんでだよ～！」"
translation = "「왜, 왜냐고~!」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「全てが間違っています。修行が足りなかったようですね」"
translation = "「모든 것이 틀렸습니다. 수행이 부족했던 모양이군요」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクはこういう細かいことするの、苦手だし……嫌いだから……」"
translation = "「나는 이런 세세한 거 하는 거, 잘 못하고…… 싫어하니까……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「やっぱメイドなんてボクには無理だよ～。バトルしてる方がずっとずっと楽しいのになぁ」"
translation = "「역시 메이드 같은 건 나한테 무리야~. 배틀하고 있는 편이 훨씬 훨씬 재미있는데 말이지」"

