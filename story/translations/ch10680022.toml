[[dialogue]]
speaker = "unk"
original = "第２話,えっへん、リアお姉ちゃんだゾ♪,P"
translation = "제2화, 에헴, 리아 언니라구♪, P"

[[dialogue]]
speaker = "unk"
original = "流星クルセイダースの一行が九浄家に泊まった翌日――リゾート結界のビーチにて。"
translation = "류세이 크루세이더즈 일행이 쿠죠 가문에 묵은 다음 날―― 리조트 결계의 비치에서."

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「はい、ヴィーナスちゃん、あ～ん<emoji=heart04>」"
translation = "「자, 비너스짱, 아～앙<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「あ～ん♪」"
translation = "「아～앙♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ふふっ、どう？\u3000かき氷、美味しい？」"
translation = "「후훗, 어때? 빙수, 맛있어？」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「うんっ♪\u3000とっても美味しいわ、リアお姉ちゃん♪」"
translation = "「응♪ 너무 맛있어, 리아 언니♪」"

[[dialogue]]
speaker = "unk"
original = "２人がすごく仲良くなっててビックリしたよ"
translation = "두 사람이 엄청 사이가 좋아져서 깜짝 놀랐어"

[[dialogue]]
speaker = "unk"
original = "昨日、九浄家にいなかった俺は、今日になって２人の距離が急激に縮まっていることに驚きを隠せなかった。"
translation = "어제, 쿠죠 가문에 없었던 나는, 오늘이 되어 두 사람의 거리가 급격히 좁혀진 것에 놀라움을 숨길 수 없었다."

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ふふっ、九浄リアはヴィーナスちゃんのお姉ちゃんに進化したんだよ～♪\u3000えっへん♪」"
translation = "「후훗, 쿠죠 리아는 비너스짱의 언니로 진화한 거라구～♪ 에헴♪」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「私もお姉ちゃんが２人もできて、妹になったわ！\u3000えっへん♪」"
translation = "「나도 언니가 2명이나 생겨서, 여동생이 되었어! 에헴♪」"

[[dialogue]]
speaker = "unk"
original = "こうして見ると、リア先輩とヴィーナスは似たところがあって、気が合うのかもしれない――そんなことを俺が考えていると。"
translation = "이렇게 보니, 리아 선배와 비너스는 닮은 구석이 있어서, 마음이 맞는 것일지도 모른다―― 그런 생각을 내가 하고 있자."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「じ～っ……」"
translation = "「지～끄러……」"

[[dialogue]]
speaker = "unk"
original = "少し離れた物陰から、聖沙がじっとこちらを見つめているのが目に入った。"
translation = "조금 떨어진 그늘에서, 세이샤가 빤히 이쪽을 바라보고 있는 것이 눈에 들어왔다."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ぐぬぬ……」"
translation = "「으누누……」"

[[dialogue]]
speaker = "unk"
original = "しかも、どこか葛藤しているような表情だ。"
translation = "게다가, 어딘가 갈등하고 있는 듯한 표정이다."

[[dialogue]]
speaker = "unk"
original = "なんでわざわざ隠れて見てるんだ？"
translation = "왜 일부러 숨어서 보고 있는 거지？"

[[dialogue]]
speaker = "unk"
original = "えっと……聖沙？"
translation = "저기…… 세이샤？"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ハッ……！？\u3000しまった、つい身を乗り出して……！」"
translation = "「핫……!? 이런, 나도 모르게 몸을 내밀어서……！」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あれ、聖沙ちゃん？\u3000どうしたの？」"
translation = "「어라, 세이샤짱? 무슨 일이야？」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「こ、これはそのぉ……」"
translation = "「이, 이것은 그게……」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「リア先輩がヴィーナスさんとすごく楽しそうにしてるから……邪魔しちゃ悪いと思いつつも、ちょっと羨ましくなっちゃって……」"
translation = "「리아 선배가 비너스 씨와 너무 즐겁게 있어서…… 방해하면 안 된다고 생각하면서도, 조금 부러워져 버려서……」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「私は先輩に――リアお姉様に、あ～んをしてもらったことなんて、１度もないから……」"
translation = "「저는 선배에게―― 리아 언니에게, 아～앙을 받아본 적 따위, 1번도 없으니까……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「！\u3000そっか……そうだよね……」"
translation = "「! 그렇구나…… 그랬구나……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ごめんね、聖沙ちゃん。今まで、聖沙ちゃんが私のことをお姉様って呼んで慕ってくれてたのに、ちゃんと向き合えてなかったよね……」"
translation = "「미안해, 세이샤짱. 지금까지, 세이샤짱이 나를 언니라고 부르며 따라주었는데, 제대로 마주하지 못했었지……」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「い、いえ！\u3000私が一方的に押し付けていたようなものなので……」"
translation = "「아, 아니에요! 제가 일방적으로 강요했던 것이나 다름없어서……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「でも……これからは大丈夫だよ！\u3000私、ちゃんと受け止めるから！」"
translation = "「하지만…… 이제부터는 괜찮아! 나, 제대로 받아들일 테니까！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「え？\u3000それってどういう……」"
translation = "「네? 그건 무슨……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「私ね……『お姉ちゃん』って呼んでもらえるのが、すごく嬉しいって気づいたの！」"
translation = "「나 말이지…… 『언니』라고 불리는 게, 너무 기쁘다는 걸 깨달았어！」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「だからこれからは、『先輩』としてだけじゃなくて――みんなの『お姉ちゃん』としても頑張るね！」"
translation = "「그러니까 이제부터는, 『선배』로서뿐만 아니라―― 모두의 『언니』로서도 힘낼게！」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「聖沙ちゃんがお姉様って呼んでくれるなら、それにちゃんと応えるよ♪」"
translation = "「세이샤짱이 언니라고 불러준다면, 거기에 제대로 응할게♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「さあ、おいで♪\u3000今まで我慢させちゃってた分、遠慮しないで甘えていいよ、聖沙ちゃん♪」"
translation = "「자, 어서 와♪ 지금까지 참게 만들었던 만큼, 사려하지 말고 어리광 부려도 돼, 미사짱♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「！\u3000お、お姉様……<emoji=heart04>」"
translation = "「! 어, 언니……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そう言って歩み寄ってきた聖沙の頭に、リア先輩はそっと手を置く。"
translation = "그렇게 말하며 다가온 세이샤의 머리에, 리아 선배는 살포시 손을 얹는다."

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「は～い、なでなで～<emoji=heart04>」"
translation = "「자～아, 쓰담쓰담～<emoji=heart04>」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「！？\u3000ふ、ふわああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「!? 후, 후와아아아～～앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「お、お姉様に頭を撫でられて、頭の中に百合の花が咲き乱れちゃう……<emoji=heart04>」"
translation = "「어, 언니에게 머리를 쓰다듬어져서, 머릿속에 백합 꽃이 흐드러지게 피어버려……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "――と、その時だった。"
translation = "――라고, 바로 그때였다."

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「――クックック、確かに聞いたぜ……！\u3000リアちゃんがお姉ちゃんとして頑張ると！」"
translation = "「――큭큭큭, 확실히 들었다고……！ 리아짱이 언니로서 힘낸다고！」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あっ、パーちゃん……？」"
translation = "「앗, 파짱……？」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「なら――俺様もリアちゃんの弟になって甘えたいぜ<emoji=heart04>\u3000お姉ちゃ～ん<emoji=heart04>」"
translation = "「그렇다면―― 이몸도 리아짱의 남동생이 되어 응석 부리고 싶다고<emoji=heart04> 언니～아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そう言ってパッキーは、リア先輩に向かって突撃ダイブをかまそうとする。"
translation = "그렇게 말하며 패키는, 리아 선배를 향해 돌격 다이빙을 감행하려 한다."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ダメよ、パッキーさん！\u3000お姉様は私が守るわ！」"
translation = "「안 돼요, 패키 씨! 언니는 제가 지키겠어요！」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「そうよ！\u3000スケベなことを考えてるの、見え見えなんだから！」"
translation = "「그래! 밝히는 짓을 생각하고 있는 거, 뻔히 보이니까！」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「邪魔するんじゃねぇ、ヒスとナス！\u3000俺様だってリアちゃんに甘えたいんだ！」"
translation = "「방해하지 마라, 히스와 가지! 이몸도 리아짱에게 응석 부리고 싶단 말이다！」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「ナスって私のこと！？\u3000でも不思議としっくり来るわね！」"
translation = "「가지라는 건 나를 말하는 거야!? 하지만 이상하게 딱 들어맞네！」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「ククク！\u3000油断したな！\u3000これが俺様の華麗なステップ技――『デビルパンダゴースト』だぜ！」"
translation = "「큭큭큭! 방심했구나! 이것이 이몸의 화려한 스텝 기술―― 『데블 판다 고스트』다！」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「なっ！？\u3000足の間をすり抜けて……！？」"
translation = "「뭣!? 다리 사이를 빠져나가서……!?」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「いけない！\u3000お姉様が危ないわ！」"
translation = "「안 돼! 언니가 위험해요！」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「リアお姉ちゃ～ん<emoji=heart04>」"
translation = "「리아 언니～아<emoji=heart04>」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「は～い♪\u3000パッキーちゃん、オイタはダメよ～？」"
translation = "「네～에♪ 패키짱, 짓궂은 짓은 안 돼요～？」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「ハッ！？\u3000――冷たぁっ！？」"
translation = "「핫!? ―― 차가왓!?」"

[[dialogue]]
speaker = "unk"
original = "突如放たれた星術によって、パッキーの体は首から下が氷に包まれ、その場で固まってしまった。"
translation = "갑자기 방출된 성술에 의해, 패키의 몸은 목 아래로 얼음에 싸여, 그 자리에서 굳어버렸다."

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「サーシャ<b>ちゃん</b>！」"
translation = "「샤샤짱！」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「ふふっ、リアちゃんもついに『お姉ちゃん』の道に目覚めたのね～♪」"
translation = "「후훗, 리아짱도 마침내 『언니』의 길에 눈뜬 거네～♪」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「さ、サーシャちゃん、冷たいぜ……！\u3000俺様としては、お姉ちゃんたちに挟んでもらって温めてもらえると……」"
translation = "「샤, 샤샤짱, 차갑다고……！ 이몸으로서는, 언니들에게 끼여서 따뜻하게 해주었으면……」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「う～ん、お姉ちゃんって呼んでもらえるのは嬉しいんだけど～」"
translation = "「으～음, 언니라고 불리는 건 기쁘지만 말이지～」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「な～んか、パッキーちゃんは甘やかしちゃダメな気がするのよね～。お姉ちゃんとして」"
translation = "「어～언지, 패키짱은 오냐오냐해주면 안 될 것 같은 느낌이 든단 말이지～. 언니로서」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「何故に！？」"
translation = "「어째서!?」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あはは……パーちゃんは素直なのはいいんだけど、悪いこと考えてる時も素直すぎるせいかな～……」"
translation = "「아하하…… 파짱은 솔직한 건 좋은데, 나쁜 일 생각하고 있을 때도 너무 솔직한 탓일까나～……」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「本当のお姉ちゃんは、ダメな時はちゃんとダメだって叱るものよ～？\u3000だから～」"
translation = "「진짜 언니는, 안 될 때는 제대로 안 된다고 꾸짖는 법이야～？ 그러니까～」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「パッキーちゃん、エッチなことはしちゃ――めっ♪」"
translation = "「패키짱, 야한 짓은 하면―― 안 돼♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「そうだよ、パーちゃん。私からも――めっ、だゾ<emoji=heart04>」"
translation = "「맞아, 파짱. 나로서도―― 안 돼, 라구<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そう言って２人は同時に、パッキーのおでこを人差し指で、ツンと突いた。"
translation = "그렇게 말하며 두 사람은 동시에, 패키의 이마를 검지 손가락으로, 톡 하고 찔렀다."

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「はうっ！？\u3000２人にツンってされて……！\u3000俺様は――俺様はぁ～～っ！？」"
translation = "「하욱!? 두 사람에게 톡 당해서……！ 이몸은―― 이몸은아～～앗!?」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「ぬおおおおおおぉ～～っ！！？」"
translation = "「느오오오오오오～～앗!!?」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「――ハァ……ハァ……<emoji=heart04>\u3000こうやって怒られるのも、これはこれで……<emoji=heart04>」"
translation = "「――하아…… 하아……<emoji=heart04> 이렇게 혼나는 것도, 이것은 이것대로……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "パッキー、お前……"
translation = "패키, 너……"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「フッ……異世界の魔王様よ、これぞまさに賢者タイムというやつだぜ……」"
translation = "「훗…… 이세계의 마왕님이여, 이것이야말로 그야말로 현자 타임이라는 녀석이다……」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「賢者タイムって、何？」"
translation = "「현자 타임이, 뭐야？」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「えっ！？\u3000さ、さあ？\u3000私にはわからないわ！」"
translation = "「엣!? 글, 글쎄요? 저는 모르겠어요！」"

[[dialogue]]
speaker_original = "サーシャ"
speaker_translation = "사샤"
original = "「ふふっ、リアちゃん、私たちもっと仲良くなれそうね～♪」"
translation = "「후훗, 리아짱, 우리 더욱 사이가 좋아질 수 있을 것 같네～♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「うん♪\u3000『お姉ちゃん同盟』を結成だね♪」"
translation = "「응♪ 『언니 동맹』을 결성하자는 거지♪」"

[[dialogue]]
speaker = "unk"
original = "こうして、リア先輩はサーシャさんと握手し、改めて親交を深めるのだった。"
translation = "이렇게 해서, 리아 선배는 사샤 씨와 악수하고, 새삼 친교를 다지는 것이었다."

