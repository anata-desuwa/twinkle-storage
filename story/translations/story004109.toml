[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「はぁ、はぁ、はぁ、はぁあ～～～～～～<emoji=heart04>」"
translation = "「하아, 하아, 하아, 하아아～～～～～～<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「力が湧いて、きます……。体が、疼いて……はぁ、あはぁっ<emoji=heart04>」"
translation = "「힘이 솟아, 나와요……. 몸이, 쑤셔서…… 하아, 아하아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシリオンは未知の感覚に戸惑っているのか、もじもじと太ももを擦り合わせる。"
translation = "익실리온은 미지의 감각에 낯설어하는지, 꼬물꼬물 허벅지를 맞비빈다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（なんかこう……えっちな感じ……友達のえっちな顔とか見たくないんだけど！）"
translation = "(왠지 이거…… 야한 느낌…… 친구의 야한 얼굴 같은 거 보고 싶지 않은데!)"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「イクシーちゃん、どうしたの～？」"
translation = "「익시짱, 왜 그래～?」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「いえ、その……ムラムラ、もといムズムズしてしまって、抑えられないんです……あっ<emoji=heart04>」"
translation = "「아니요, 그게…… 근질근질, 아니 쑤셔와서, 주체할 수가 없어요…… 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「体が……んんっ、特にお腹の……しきゅ……が熱くてぇ……<emoji=heart04>」"
translation = "「몸이…… 윽, 특히 배의…… 자지……가 뜨거워서어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「し……なんて～？」"
translation = "「자…… 뭐라고～?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「丹田！\u3000おへその下って丹田って言うらしいですよイクシリオン先輩！」"
translation = "「단전! 배꼽 아래는 단전이라고 부른대요, 익실리온 선배!」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「そ、そうです！\u3000丹田がすごく熱いんですぅ！」"
translation = "「그, 그래요! 단전이 엄청 뜨거워요으!」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "（あっぶな……こいつ、戦闘中に直球のエロ発言かまそうとしたわよ。ていうか、なんで私がフォローしてるのよ！）"
translation = "(위험했어…… 이 녀석, 전투 중에 돌직구 에로 발언을 날리려고 했잖아. 그보다, 왜 내가 커버치고 있는 건데!)"

[[dialogue]]
speaker = "unk"
original = "魔将となったイクシリオンの下腹部には生物的な文様が刻まれ、妖しく光る。"
translation = "마장이 된 익실리온의 하복부에는 생물적인 문양이 새겨져, 요염하게 빛난다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「あぁ、感じます……<emoji=heart04>\u3000私の星力と、魔本の魔力がここで交わって……あっ<emoji=heart04>\u3000より大きな力が育っていますっ<emoji=heart04>」"
translation = "「아아, 느껴져요……<emoji=heart04> 제 성력과, 마도서의 마력이 여기서 섞여서…… 앗<emoji=heart04> 더욱 커다란 힘이 자라고 있어요<emoji=heart04>」"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「ガァアア！！」"
translation = "「크아아아!!」"

[[dialogue]]
speaker = "unk"
original = "イクシリオンの異様さに様子をうかがっていたモンスターだったが、しびれを切らして襲いかかる。"
translation = "익실리온의 기이함에 동태를 살피던 몬스터였으나, 참다못해 덤벼든다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「──ラストクレイモア」"
translation = "「──라스트 클레이모어」"

[[dialogue]]
speaker = "unk"
original = "闇をまとった大剣が、瘴気ごとモンスターを切って捨てた。"
translation = "어둠을 두른 대검이, 장기와 함께 몬스터를 베어버렸다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「はぁあ～～～～っ<emoji=heart04>\u3000これが魔将の力……なんて気持ちいいんでしょう<emoji=heart04>」"
translation = "「하아아~~~~앗<emoji=heart04> 이것이 마장의 힘…… 어쩜 이렇게 기분 좋은 걸까요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「んん、もっと、もっと気持ちよくなりたいです……<emoji=heart04>」"
translation = "「응, 더욱, 더욱 기분 좋아지고 싶어요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "自らの下腹部を撫でるイクシリオン。すると文様が輝きを増し、さらに力を高めていく。"
translation = "자신의 하복부를 문지르는 익실리온. 그러자 문양이 광채를 더하며, 더욱 힘을 높여간다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「はぁあああっ！！\u3000メガリビドーディヴァイダーーッ！！」"
translation = "「하아아아앗!! 메가 리비도 디바이더──앗!!」"

[[dialogue]]
speaker = "unk"
original = "魔力で編まれた刃が伸び、天にも届くような極大の剣と化し、モンスターをまとめて両断する。"
translation = "마력으로 엮인 날이 늘어나, 하늘에 도달할 듯한 극대의 검으로 변해, 몬스터를 일괄 양단한다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「はぁあ～～～～～～っ<emoji=heart04>\u3000ゾクゾクします～～っ<emoji=heart04>\u3000もっと、もっとぉっ<emoji=heart04>」"
translation = "「하아아~~~~~~앗<emoji=heart04> 소름이 돋아요~~앗<emoji=heart04> 더, 더요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "嗜虐的な笑みを浮かべ、剣を振るうイクシリオン。その快感を表すように、文様はますます煌めいていた。"
translation = "가학적인 미소를 띠며, 검을 휘두르는 익실리온. 그 쾌감을 나타내듯, 문양은 점점 더 찬란히 빛나고 있었다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「わーはっはっは！\u3000どけどけモンスターども！\u3000ここは私と魔王様の領地だぞー！\u3000ワンワンアーミー突撃～！」"
translation = "「와ー하하하! 비켜라 비켜 몬스터 놈들! 여기는 나와 마왕님의 영지다ー! 멍멍이 아미 돌격～!」"

[[dialogue]]
speaker = "unk"
original = "カティアは数に任せた攻撃でモンスターを蹂躙する。使い魔犬は倒されても種となり、また大地に新たな芽吹きを残していく。"
translation = "카티아는 수에 의존한 공격으로 몬스터를 짓밟는다. 사역마 견은 쓰러져도 씨앗이 되어, 다시 대지에 새로운 싹을 남겨간다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「イクシーちゃんもカティアちゃんも楽しそう～♪\u3000いいな～♪」"
translation = "「익시짱도 카티아짱도 즐거워 보여～♪ 부럽네～♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「じゃあ、サランも悪い子になっちゃおうかな～」"
translation = "「그럼, 사란도 나쁜 아이가 되어볼까나～」"

[[dialogue]]
speaker = "unk"
original = "そう言ってサランはモンスターの頭上に飛び、巨大な泡だて器を構えた。"
translation = "그렇게 말하며 사란은 몬스터의 머리 위로 뛰어올라, 거대한 거품기를 겨누었다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「サランは、誰かのためを思って作るお菓子が大好き～」"
translation = "「사란은, 누군가를 생각하며 만드는 과자를 정말 좋아해～」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「誰かがおいしいって言ってくれるのが嬉しいから、お菓子作りが大好きなんだ～」"
translation = "「누군가가 맛있다고 말해주는 게 기쁘니까, 과자 만들기를 정말 좋아하는 거야～」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「でもね～。今日は誰かのためじゃなくて、サランのためだけに作るんだぁ～。今日はそんな気分なの～♪」"
translation = "「하지만 말이야~. 오늘은 누군가를 위해서가 아니라, 사란만을 위해서 만드는 거야~. 오늘은 그런 기분인걸~♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「今日のサランは悪い子だから～♪\u3000好き放題しちゃうよぉ～♪」"
translation = "「오늘의 사란은 나쁜 아이니까～♪ 마음껏 해버릴 거야아～♪」"

[[dialogue]]
speaker = "unk"
original = "サランが泡だて器に魔力を集め、ふわりと虚空を泳がすと、綿菓子の雲が生まれた。"
translation = "사란이 거품기에 마력을 모아, 둥실 허공을 헤엄치게 하자, 솜사탕 구름이 태어났다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「そ～れ～！\u3000キルシュシュガーレイン！」"
translation = "「자～아～! 키르슈 슈가 레인!」"

[[dialogue]]
speaker = "unk"
original = "空からシロップの雨が降り注ぎ、華やかな香りが辺り一面に漂う。"
translation = "하늘에서 시럽 비가 내리고, 화려한 향기가 주변 일대에 감돈다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「あ、甘くて美味しいですね。でもそれだけではないような……？」"
translation = "「아, 달콤하고 맛있네요. 하지만 그것뿐만이 아닌 것 같은……?」"

[[dialogue]]
speaker = "unk"
original = "シロップは味方を癒す一方で、モンスターには毒となる。"
translation = "시럽은 아군을 치유하는 한편, 몬스터에게는 독이 된다."

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「ガ……？」"
translation = "「크……?」"

[[dialogue]]
speaker = "unk"
original = "酔ったように足元がおぼつかなくなる異形たち。方向を見失い、お互いに激突する。"
translation = "취한 것처럼 발걸음이 비틀거리는 이형들. 방향을 잃고, 서로 충돌한다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「お次はあま～いクリーム召し上がれ～♪\u3000グラトニースイートディザスタ～！」"
translation = "「다음은 달～콤한 크림 드세요～♪ 글러트니 스위트 디자스터～!」"

[[dialogue]]
speaker = "unk"
original = "泡だて器がくるくると踊ると、クリームの波が瞬く間に生まれ、甘い破滅がモンスターを飲み込んでいく。"
translation = "거품기가 빙글빙글 춤추자, 크림의 파도가 순식간에 태어나, 달콤한 파멸이 몬스터를 삼켜간다."

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「ガァ～～♪」"
translation = "「크아～～♪」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「モンスターが幸せそうな鳴き声を上げて消滅した……。こわ……」"
translation = "「몬스터가 행복한 듯한 울음소리를 내며 소멸했어……. 무서워……」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ん～、たのしい～♪\u3000もっと甘めでもいいかな～。香りは……バラのリキュールを使ってみてもいいかも～」"
translation = "「응～, 재미있어～♪ 좀 더 달게 해도 되려나～。향은…… 장미 리큐르를 써봐도 좋을지도～」"

[[dialogue]]
speaker = "unk"
original = "クリームをぺろりとひと舐めしながら、微笑むサラン。戦闘中だというのにまるで遊んでいるようだ。"
translation = "크림을 할짝 한 번 핥으면서, 미소 짓는 사란. 전투 중인데도 마치 놀고 있는 것 같다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「うん、できあがり～。サランのおすすめ、たっぷり召し上がれ～♪」"
translation = "「응, 완성～. 사란의 추천, 듬뿍 드세요～♪」"

[[dialogue]]
speaker = "unk"
original = "ホイッパーが宙を舞う度、様々な味わいクリームの波が生まれ、モンスターを丸呑みにしていく。"
translation = "휘퍼가 공중을 날 때마다, 다양한 맛의 크림 파도가 태어나, 몬스터를 꿀꺽 삼켜간다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「行け行けワンワンアーミー！\u3000モンスターを倒して魔王様に褒めてもらうんだー！\u3000手柄はみんな私のものだ！\u3000わはははは！」"
translation = "「가라 가라 멍멍이 아미! 몬스터를 쓰러뜨리고 마왕님께 칭찬받는 거다ー! 공적은 전부 내 거다! 와하하하!」"

[[dialogue]]
speaker = "unk"
original = "使い魔犬の大群が領地を増やしながらモンスターを包囲、逃げ道を奪う。"
translation = "사역마 견 대군이 영지를 넓히면서 몬스터를 포위, 도망칠 길을 빼앗는다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「はぁ、はぁ……メガリビドーディヴァイダー！！\u3000はぅああ～～～～<emoji=heart04>」"
translation = "「하아, 하아…… 메가 리비도 디바이더!! 하우아아아～～～～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "上空からはイクシリオンの大剣が襲い掛かり──"
translation = "상공에서는 익실리온의 대검이 덮쳐오고──"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「おかわりもあるから～残さず食べてね～♪\u3000ふふ、ふふふ～♪」"
translation = "「한 그릇 더 있으니까～ 남기지 말고 먹어줘～♪ 후후, 후후후～♪」"

[[dialogue]]
speaker = "unk"
original = "残ったモンスターすら、サランのクリームに飲み込まれる。"
translation = "남은 몬스터조차, 사란의 크림에 삼켜진다."

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「私、もう帰っていいですか……？」"
translation = "「저, 이제 돌아가도 될까요……?」"

[[dialogue]]
speaker = "unk"
original = "我欲を開放した魔将たちによってモンスターが殲滅されていく様を、シャルレーヌは茫然と眺めるしかなかった。"
translation = "사욕을 해방한 마장들에 의해 몬스터가 섬멸되어 가는 모습을, 샬레느는 망연히 바라볼 수밖에 없었다."

