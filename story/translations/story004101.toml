[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「対象者『桜十路サラン』、適合罪科『暴食』。……魔本、貸出承認」"
translation = "「대상자 『사쿠라쥬지 사란』, 적합 죄과 『폭식』. ……마서, 대출 승인」"

[[dialogue]]
speaker = "unk"
original = "リィベルの宣告とともに、魔本がサランの頭上へと飛び立つ。"
translation = "리벨의 선언과 함께, 마서가 사란의 머리 위로 날아오른다."

[[dialogue]]
speaker = "unk"
original = "するとページが開き、魔力がサランへと降り注いだ。"
translation = "그러자 페이지가 열리고, 마력이 사란에게 쏟아져 내렸다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ぽよ～？\u3000すごいすご～い。力が溢れてきちゃう～」"
translation = "「포요～？ 대단해 대단해～. 힘이 넘쳐흘러버려～」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふわ～。体がなんだかぽかぽかするの～。これが魔将の力なのかな～」"
translation = "「후와～. 몸이 왠지 따끈따끈해～. 이것이 마장의 힘인 걸까나～」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふふっ、ふふふ～<emoji=heart04>」"
translation = "「후훗, 후후후～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "こうしてサランは魔将への覚醒に成功した。"
translation = "이렇게 해서 사란은 마장으로의 각성에 성공했다."

[[dialogue]]
speaker = "unk"
original = "なぜ彼女が魔将に選ばれたのか。それは少し時を遡る──"
translation = "왜 그녀가 마장으로 선택되었는가. 그것은 조금 시간을 거슬러 올라간다──"

[[dialogue]]
speaker = "unk"
original = "今日も新星学園の図書館は平和だった。"
translation = "오늘도 신성학원의 도서관은 평화로웠다."

[[dialogue]]
speaker = "unk"
original = "心地よい静寂が満ち、利用者は読書に勉強にと、それぞれの時間を過ごしている。"
translation = "기분 좋은 정적이 가득하고, 이용자는 독서와 공부로 저마다의 시간을 보내고 있다."

[[dialogue]]
speaker = "unk"
original = "だがその一方で、カウンターの裏では不穏なやりとりがあった。"
translation = "하지만 그 한편으로, 카운터 뒤에서는 불온한 주고받음이 있었다."

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「何かとても大切なことを忘れている……ような……」"
translation = "「뭔가 아주 중요한 것을 잊고 있는…… 듯한……」"

[[dialogue]]
speaker_original = "ウィステリア"
speaker_translation = "위스테리아"
original = "「物忘れ？\u3000深淵書庫の管理システムにもそんなことあるのね」"
translation = "「건망증? 심연서고의 관리 시스템에도 그런 일이 있구나」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「生身の肉体を得てしまった以上、仕方ないわ。この前も予約締切を忘れて……じゃなくて、嫌な予感がするわ。何か大きな見落としをしているような…………」"
translation = "「실제의 육체를 얻어버린 이상, 어쩔 수 없어. 얼마 전에도 예약 마감을 잊어서……가 아니라, 불길한 예감이 들어. 뭔가 큰 간과를 하고 있는 듯한…………」"

[[dialogue]]
speaker_original = "ウィステリア"
speaker_translation = "위스테리아"
original = "「ふぅん。元凶の『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』を倒してリクリエも落ち着いたんだし、もう少し気楽に構えたら？」"
translation = "「흠. 원흉인 『<ruby>ＸＥＬＯＳ<rt>제로스</rt></ruby>』를 쓰러뜨려서 리크리에도 일단락됐는데, 좀 더 편하게 생각하면 어때?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「確かにリクリエの元凶たる『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』を倒し、世界の危機は回避された」"
translation = "「확실히 리크리에의 원흉인 『<ruby>ＸＥＬＯＳ<rt>제로스</rt></ruby>』를 쓰러뜨려, 세계의 위기는 회피되었어」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「けれどモンスターがいる以上、リクリエは終わっていない。魔将は戦い続けるわ」"
translation = "「하지만 몬스터가 있는 이상, 리크리에는 끝나지 않았어. 마장은 계속 싸울 거야」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「というか、あなたが呑気すぎるのよ。さすがは怠惰の魔将ね」"
translation = "「그보다, 네가 너무 태평한 거야. 과연 나태의 마장답네」"

[[dialogue]]
speaker = "unk"
original = "竜翼の少女の名はリィベル・ビブリオテーク。"
translation = "용의 날개를 가진 소녀의 이름은 리벨 비블리오테크."

[[dialogue]]
speaker = "unk"
original = "リクリエで滅ぼされた魔族の怨念を集めて作られた『深淵書庫』の管理システム──それが人格を得て実体化したものだ。"
translation = "리크리에에서 멸망한 마족의 원한을 모아 만들어진 『심연서고』의 관리 시스템── 그것이 인격을 얻어 실체화한 것이다."

[[dialogue]]
speaker = "unk"
original = "幾度も魔族を滅ぼしてきたリクリエを打倒し、魔本に秘められた無念を晴らすことこそ彼女の使命。"
translation = "몇 번이고 마족을 멸망시켜 온 리크리에를 타도하고, 마서에 숨겨진 한을 풀어주는 것이야말로 그녀의 사명."

[[dialogue]]
speaker = "unk"
original = "今は新星学園に所属し、図書委員として魔将の候補者を探している。"
translation = "지금은 신성학원에 소속되어, 도서위원으로서 마장 후보자를 찾고 있다."

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「これを見て」"
translation = "「이것을 봐」"

[[dialogue]]
speaker = "unk"
original = "リィベルが虚空に手をかざすと、３冊の魔本が現れた。"
translation = "리벨이 허공에 손을 가누자, 3권의 마서가 나타났다."

[[dialogue]]
speaker = "unk"
original = "魔本はそれぞれ禍々しい光を放っている。"
translation = "마서는 저마다 불길한 빛을 발하고 있다."

[[dialogue]]
speaker_original = "ウィステリア"
speaker_translation = "위스테리아"
original = "「……呪いが活性化しているわね」"
translation = "「……저주가 활성화되고 있네」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「ええ。『暴食』『色欲』『強欲』の３つが暴走の兆しを見せている。早く適合者を探さないと、呪いが溢れだすわ」"
translation = "「응. 『폭식』 『색욕』 『강욕』의 3개가 폭주의 조짐을 보이고 있어. 서둘러 적합자를 찾지 않으면, 저주가 흘러넘칠 거야」"

[[dialogue]]
speaker = "unk"
original = "莫大な深淵書庫の呪いを７つの大罪になぞらえて分割し、適合者に貸し出す『魔将システム』。深淵書庫の魔力を利用しながら、魔本の暴走を防ぐものだ。"
translation = "막대한 심연서고의 저주를 7개의 대죄에 비유하여 분할하고, 적합자에게 대여하는 『마장 시스템』. 심연서고의 마력을 이용하면서, 마도의 폭주를 막는 것이다."

[[dialogue]]
speaker = "unk"
original = "大罪の魔本に適合し、呪いの器となる者を『魔将』と呼ぶ。"
translation = "대죄의 마도서에 적합하여, 저주의 그릇이 되는 자를 『마장』이라 부른다."

[[dialogue]]
speaker_original = "ウィステリア"
speaker_translation = "위스테리아"
original = "「深淵書庫はこの新星学園の地下に存在している。呪いが溢れれば、学園はおろか、流星市国全域に危険が及ぶわ。それだけは避けないと」"
translation = "「심연서고는 이 신성학원의 지하에 존재하고 있어. 저주가 넘쳐나면, 학원은커녕, 유성시국 전역에 위험이 미치게 돼. 그것만큼은 피해야 해」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「全てあなたが引き受けてくれればよかったのだけど」"
translation = "「모두 당신이 맡아주었으면 좋았을 텐데」"

[[dialogue]]
speaker_original = "ウィステリア"
speaker_translation = "위스테리아"
original = "「何度も言ってるでしょ、無理なものはむ～り。そんなことしたら廃人になっちゃうってば」"
translation = "「몇 번이나 말했잖아, 무리인 건 무~리. 그런 짓을 했다간 폐인이 되어버린다니까」"

[[dialogue]]
speaker_original = "ウィステリア"
speaker_translation = "위스테리아"
original = "「ところで紙屋敷さんは？\u3000今日は当番の日だったでしょ。……まぁ、紙屋敷さんは当番じゃなくても毎日のようにいるけど」"
translation = "「그나저나 카미야시키 씨는? 오늘은 당번인 날이었잖아. ……뭐, 카미야시키 씨는 당번이 아니더라도 매일같이 있지만」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「モネなら人を探しに出ているわ。なんでも、魔将の候補者に心当たりがあるらしいの」"
translation = "「모네라면 사람을 찾으러 나갔어. 아무래도, 마장의 후보자에 짚이는 데가 있는 모양이야」"

[[dialogue]]
speaker_original = "ウィステリア"
speaker_translation = "위스테리아"
original = "「候補者？\u3000カフェテリアで大食いの子でもスカウトしてくるのかしら……？」"
translation = "「후보자? 카페테리아에서 대식가인 아이라도 스카우트해 오는 걸까……?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「さぁ……」"
translation = "「글쎄……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（カウンターの中でウィステリアさんとリィベルが難しい話をしてる……気がする）"
translation = "(카운터 안에서 위스테리아 씨와 리벨이 어려운 이야기를 하고 있는…… 느낌이 들어)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（モネ先輩が魔将？\u3000とかいうのになってプリマステラになれたし、私だって……！）"
translation = "(모네 선배가 마장? 이라는 게 되어서 프리마스테라가 될 수 있었고, 나라고 해도……!)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（せっかく星騎士になれるって聞いて流星市国に来たのに、星力が全然伸びてないし……）"
translation = "(모처럼 성기사가 될 수 있다고 들어서 유성시국에 왔는데, 성력이 전혀 늘지 않고 있고……)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（いくら星術の訓練しても強くならないし、当然プリマステラにもなれないし……）"
translation = "(아무리 성술 훈련을 해도 강해지지 않고, 당연히 프리마스테라도 될 수 없고……)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（強い星騎士になって、ビッグな魔族になるって心に決めて故郷を出たのに、このまま弱いままは嫌だ）"
translation = "(강한 성기사가 되어서, 거대한 마족이 되겠다고 마음먹고 고향을 떠났는데, 이대로 약한 채인 건 싫어)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（いい加減、私も強くなりたい！\u3000どんな手を使ってでも強くなってやる！）"
translation = "(이제 좀, 나도 강해지고 싶어! 어떤 수를 써서라도 강해져 주겠어!)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（あの２人が魔将の秘密を知っているって噂だし、どうにか話を聞けないかな……？）"
translation = "(저 두 사람이 마장의 비밀을 알고 있다는 소문이고, 어떻게든 이야기를 들을 수 없을까……?)"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「ただいま戻りました～」"
translation = "「지금 돌아왔습니다~」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（わわっ、隠れなきゃっ）"
translation = "(와왓, 숨어야 해)"

[[dialogue]]
speaker_original = "モネ"
speaker_translation = "모네"
original = "「あれ？\u3000今どなたかいました？」"
translation = "「어라? 방금 누군가 계셨나요?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "「さぁ、気付かなかったけど」"
translation = "「글쎄, 눈치채지 못했는데」"

[[dialogue]]
speaker_original = "ウィステリア"
speaker_translation = "위스테리아"
original = "「あら？\u3000紙屋敷さんが連れてきたのって──」"
translation = "「어머? 카미야시키 씨가 데려온 건──」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「初めまして……になるでしょうか。流星学園附属１年生、シャルレーヌ・ディアーブルと申します」"
translation = "「처음…… 뵙겠습니다라고 해야 할까요. 유성학원 부속 1학년, 샬레느 디아블이라고 합니다」"

