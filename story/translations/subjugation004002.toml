[[dialogue]]
speaker = "unk"
original = "ベアトリスとナターシャが変身を遂げた後、ジャクリーヌはもらったお菓子を持っていつの間にか去っていた。"
translation = "베아트리스와 나타샤가 변신을 마친 후, 자클린은 받은 과자를 들고 어느샌가 가버린 뒤였다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私のこの衣装は、黒猫……ニャン？\u3000梨緒ちゃんのぶちゃ猫の影響かニャ？」"
translation = "「나의 이 의상은 검은 고양이…… 냥? 리오짱의 못난이 고양이의 영향인가 냐?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「吸血鬼の羽も生えたままだし、吸血鬼の使い魔って感じかな？」"
translation = "「흡혈귀의 날개도 난 채로고, 흡혈귀의 사역마라는 느낌일까?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私、本物の吸血鬼なんだけどニャー？」"
translation = "「나, 진짜 흡혈귀인데 냐─?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ちなみにその語尾は？」"
translation = "「참고로 그 어미는?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「戦闘服のせいか、勝手に出ちゃうんニャ！」"
translation = "「전투복 탓인지, 저절로 나와버린다 냐!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「で、ナターシャちゃんのそれは……？」"
translation = "「그래서, 나타샤짱의 그거는……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ベアトに引っ張られて吸血鬼になっちゃったみたい。マントもあるし、吸血鬼の貴族って感じ？」"
translation = "「베아트한테 끌려들어가서 흡혈귀가 되어버린 것 같아. 망토도 있고, 흡혈귀 귀족이라는 느낌?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「じゃあ今の私は、ナターシャちゃんの使い魔なのかニャ？」"
translation = "「그럼 지금의 나는, 나타샤짱의 사역마인 거냐?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いいね。かわいがってあげるよ、ベアトニャン」"
translation = "「좋네. 귀여워해 줄게, 베아트냥」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えへへ～、ご主人様～♪」"
translation = "「에헤헤~, 주인님~♪」"

[[dialogue]]
speaker = "unk"
original = "ナターシャに顎を撫でられ、ベアトリスが機嫌良さそうな声を出す。"
translation = "나타샤에게 턱을 쓰다듬어지며, 베아트리스가 기분 좋은 듯한 소리를 낸다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でも……でも～……うーん……」"
translation = "「하지만…… 하지만~…… 으음……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「なに、人の胸元じろじろ見たりして。見られるのは慣れてるけど、そうも露骨だとさすがに気になるかな」"
translation = "「왜 그래, 남의 가슴께를 뻔히 쳐다보고. 시선받는 건 익숙하지만, 그렇게 노골적이면 아무리 나라도 신경 쓰이는데」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「その衣装……確かに吸血鬼っぽいけど……なんていうか……エッチすぎないかニャ」"
translation = "「그 의상…… 확실히 흡혈귀 같기는 하지만…… 뭐라고 해야 하나…… 너무 야하지 않나 냐」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「吸血鬼ってそういうものじゃない？\u3000普段のベアトの戦闘服もなかなか煽情的だと思うし」"
translation = "「흡혈귀라는 건 그런 거 아니야? 평소 베아트의 전투복도 제법 자극적이라고 생각하는데」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私吸血鬼だけどエッチじゃないよ！？\u3000そもそも吸血鬼はエッチじゃないからっ！」"
translation = "「나 흡혈귀지만 야하지 않아!? 애초에 흡혈귀는 야하지 않으니까!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうかな～？\u3000今のベアトの衣装も相当エッチだと思うけど」"
translation = "「그럴까~? 지금 베아트의 의상도 상당해서 야하다고 생각하는데」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「やっぱりっ！？\u3000露出度高い人に見慣れちゃってたからか、これくらいなら普通かなって思ってたけど……」"
translation = "「역시!? 노출도 높은 사람한테 눈이 익어버려서 그런가, 이 정도면 보통인가 싶었는데……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「わかる。ここにいると肌色面積の感覚が麻痺するよね」"
translation = "「알아. 여기 있으면 살색 면적의 감각이 마비되지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でも、ナターシャちゃんは平気そうだね……？\u3000恥ずかしがってるの私だけニャの……？」"
translation = "「하지만, 나타샤짱은 멀쩡해 보이네……? 부끄러워하는 건 나뿐인 거냐……?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「これでもエージェントだからね。ハニートラップだって仕掛けるし、この程度の露出でいちいち恥ずかしがってられないって」"
translation = "「이래 봬도 요원이니까. 미인계도 쓰는데, 이 정도 노출로 일일이 부끄러워할 순 없지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ひええ……ナターシャちゃんオトナすぎるニャ～……」"
translation = "「히에에…… 나타샤짱 너무 어른이다 냐~……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でも、これがジャクリーヌさんのハロウィンパワーなんだね。すごい……」"
translation = "「하지만, 이게 자클린 씨의 할로윈 파워구나. 대단해……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いつもいつもハロウィンの度に騒動を起こしてたとは聞いてたけど、噂通りだね」"
translation = "「항상 할로윈 때마다 소동을 일으켰다고는 들었지만, 소문대로네」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ま、これで仮装はＯＫ。ジャクリーヌに会った目的は果たせたんじゃない？」"
translation = "「뭐, 이걸로 가장은 OK. 자클린을 만난 목적은 달성한 거 아니야?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そうだね……こんなにハロウィンフォームがセクシーとは思わなかったけど……」"
translation = "「그렇네…… 이렇게 할로윈 폼이 섹시할 줄은 몰랐지만……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──ベアト、ストップ」"
translation = "「──베아트, 스톱」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えっ、何！？\u3000どこかはみ出しちゃってる！？」"
translation = "「앗, 뭐야!? 어디 튀어나오기라도 했어!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうじゃなくて、怪しい気配を感じたよ。ひとつ、ふたつ、みっつ……ううん、それどころじゃない」"
translation = "「그게 아니라, 수상한 기척을 느꼈어. 하나, 둘, 셋…… 아니, 그 정도가 아니야」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ニャッ！？\u3000ナターシャちゃん、あそこ見て！\u3000あんなにいっぱい！」"
translation = "「냐!? 나타샤짱, 저기 봐! 저렇게나 많이!」"

[[dialogue]]
speaker_original = "ゴースト"
speaker_translation = "ゴースト"
original = "「キャッキャッ！\u3000キャッキャッ！」"
translation = "「꺄아꺄아! 꺄아꺄아!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「お化けの団体さん？\u3000さっきまではあんなのいなかったよね？\u3000あれだけの数、気づかないわけがないし」"
translation = "「귀신 단체 손님? 아까까지는 저런 거 없었잖아? 저 정도 수면 눈치채지 못했을 리가 없고」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「いつの間に出てきたのかな。石をひっくり返したら、わさわさ出てくるダンゴムシみたいだね」"
translation = "「언제 나왔을까. 돌을 뒤집어보면 우글우글 나오는 쥐느느릇이 같다」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ひっ！？\u3000なんでそんなたとえ出したの！？\u3000私が虫嫌いなこと知ってるよね！？」"
translation = "「힉!? 왜 그런 비유를 하는 거야!? 내가 벌레 싫어하는 거 알고 있지!?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ごめんニャさいっ、咄嗟にいいたとえが思いつかなくって……」"
translation = "「죄송합니다 냐, 순간 적절한 비유가 떠오르지 않아서……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そもそもたとえなくてよくない？\u3000とりあえず、あのお化けたち対処しよっか」"
translation = "「애초에 비유 안 해도 되잖아? 일단, 저 귀신들 처리할까」"

