[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「な、何言ってるのあなた……ここはディアーブル家の領地よ？」"
translation = "「무, 무슨 소리를 하는 거야 너…… 여기는 디아블 가의 영지라고?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「今はそうだけど、関係ないよ」"
translation = "「지금은 그렇지만, 상관없어」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「だって魔王様と私で世界征服して、三界は私たちのものになるんだから」"
translation = "「왜냐면 마왕 님과 내가 세계 정복해서, 삼계는 우리 것이 될 테니까」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「は…………？」"
translation = "「하…………?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「はぁーーーーーーっ！！？」"
translation = "「하아ーーーーーー읏!?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「世界征服なんて本気で言ってるの……？\u3000正気？」"
translation = "「세계 정복이라니 진심으로 하는 소리야……? 제정신이야?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「え、うん。魔族に生まれたからには、一生に一度は世界征服してみたくない？」"
translation = "「에, 응. 마족으로 태어난 이상, 일생에 한 번쯤은 세계 정복해 보고 싶지 않아?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「え……そんな、旅行に行くみたいなノリで言われても…………」"
translation = "「에…… 그런, 여행이라도 가는 듯한 텐션으로 말해도…………」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「それはシャルレーヌ……様が無欲なだけじゃないですか～？」"
translation = "「그건 샬레느…… 님이 무욕해서 그런 거 아닌가요～?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「私が無欲ぅ！？\u3000生まれて初めて言われたわよ！？」"
translation = "「내가 무욕우!? 태어나서 처음 들은 소리거든!?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "（いや、確かに世界征服って言ってた魔族、他にもいたけど……普通、本気だと思わないでしょ！？）"
translation = "(아니, 확실히 세계 정복이라고 말했던 마족, 다른 녀석도 있었지만…… 보통, 진심이라고 생각 안 하잖아!?)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私なんか、物心ついたときから世界征服したかったですよ？\u3000ずっとずっと昔から……」"
translation = "「나 같은 건, 철들었을 때부터 세계 정복하고 싶었다고요? 까마득히 옛날부터……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私が生まれたのはシャリオンでも片田舎で、本当に何もないところで……見渡す限りの空と山と、あと畑が私の始まりでした」"
translation = "「내가 태어난 건 샤리온에서도 시골이라, 정말 아무것도 없는 곳에서…… 눈길 닿는 곳마다 하늘과 산과, 그리고 밭이 내 시작이었어요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「昔はひいおじいちゃんも元気で、畑仕事によくついていきました。その時、聞いたんです。ご先祖様は、魔王っていう世界で一番強い人の配下だったんだって」"
translation = "「옛날엔 증조할아버지도 건강하셔서, 밭일에 자주 따라갔었어요. 그때, 들었어요. 조상님은, 마왕이라는 세계에서 가장 강한 사람의 배하였다고」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「『世界で一番強い』……その言葉に胸が躍りました」"
translation = "「『세계에서 가장 강하다』…… 그 말에 가슴이 쿵쾅거렸어요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「世界一有名で、みんなが尊敬して、銅像もあちこちに建ってて、思わずははーってひれ伏しちゃうような人に、私もなりたいって思いました」"
translation = "「세계에서 제일 유명하고, 모두가 존경하고, 동상도 여기저기 서 있고, 나도 모르게 하하─ 하고 엎드려 버릴 것 같은 사람이, 나도 되고 싶다고 생각했어요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「星力に目覚めて、新星学園に留学できたときは、このまま世界で一番強くなってやるんだって本気で思ってました」"
translation = "「성력에 눈을 뜨고, 신성학원에 유학할 수 있었을 때는, 이대로 세계에서 제일 강해져 주겠다고 진심으로 생각했어요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「でも全然強くなれなくて…………世界征服なんて夢のまた夢だって諦めかけて」"
translation = "「하지만 전혀 강해질 수 없어서………… 세계 정복 따위 꿈속의 꿈이라고 포기하려던 차에」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「そんなとき、あの人に出会ったんです！」"
translation = "「그때, 그 사람을 만난 거예요!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「そう、魔王様に！」"
translation = "「그래요, 마왕 님을!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「御前試合で見事に逆転勝利……本当にかっこよかったな～～～～！！」"
translation = "「어전시합에서 멋지게 역전 승리…… 정말로 멋있었지～～～～!!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「昔話じゃなくて、魔王様が本当にいて、本当に、本当に強くて！\u3000すっごくすっごく嬉しかった！」"
translation = "「옛날 이야기가 아니라, 마왕 님이 정말로 계시고, 정말로, 정말로 강해서! 엄청 엄청 기뻤어요!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「最初はただ、魔王様に近付いて、ビッグな魔族になりたかっただけでした。でもそのうち気付いたんです」"
translation = "「처음엔 그저, 마왕 님에게 접근해서, 거물 마족이 되고 싶었을 뿐이었어요. 하지만 그러는 사이에 깨달았죠」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「この人なら世界征服できる……ううん、この人こそ世界征服すべきだって！！」"
translation = "「이 사람이라면 세계 정복할 수 있어…… 아니아니, 이 사람이야말로 세계 정복해야 해!! 라고」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私は魔王様の配下として、世界征服をお手伝いするんだって張り切って……でもでも、やっぱり私は魔王様と並び立てるほど強くはなくて…………」"
translation = "「나는 마왕 님의 배하로서, 세계 정복을 도울 거라고 신이 나서…… 하지만하지만, 역시 나는 마왕 님과 나란히 설 만큼 강하지는 않아서…………」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「だから私は強くなりたかった。魔王様の配下として相応しいように……魔王様と一緒に世界征服できるように！」"
translation = "「그래서 나는 강해지고 싶었어. 마왕 님의 배하로서 어울리도록…… 마왕 님과 함께 세계 정복할 수 있도록!」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「は、はぁ……黙って聞いてたけど、何言ってるかよく分からないわ……」"
translation = "「하, 하아…… 가만히 듣고 있었는데, 무슨 말을 하는지 잘 모르겠어……」"

[[dialogue]]
speaker = "unk"
original = "呆れ戸惑うシャルレーヌを尻目に、カティアはモンスターの群れをにらむ。"
translation = "어이없어하며 당황하는 샬레느를 힐끔 보고, 카티아는 몬스터 무리를 노려본다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「モンスターめ……よくも、よくも……未来の魔王様と私の領地をーーーーーーっ！！！」"
translation = "「몬스터 놈들…… 잘도, 잘도…… 미래의 마왕 님과 내 영지를ーーーーーー읏!!!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「許さない許さない許さない……私たちの領地を滅茶苦茶にしやがってぇーーーーっ！！！」"
translation = "「용서 못 해 용서 못 해 용서 못 해…… 우리들의 영지를 엉망진창으로 만들어 놓고서어ーーーー읏!!!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「世界は私と魔王様が征服するんだ……モンスターやアステラなんかに私たちの<ruby>領地<rt>世界</rt></ruby>をくれてやるもんかーーーーっ！！」"
translation = "「세계는 나와 마왕 님이 정복할 거야…… 몬스터나 아스테라 따위에게 우리의 <ruby>영지<rt>세계</rt></ruby>를 내줄 것 같냐아ーーーー읏!!」"

[[dialogue]]
speaker = "unk"
original = "カティアの咆哮が空に轟き、それに応えるかのごとく、シャルレーヌが持っていた魔本が光り出す。"
translation = "카티아의 포효가 하늘에 울려 퍼지고, 그것에 응답하듯, 샬레느가 가지고 있던 마본이 빛나기 시작한다."

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「え……？\u3000『強欲』の魔本が反応してる……？」"
translation = "「에……? 『강욕』의 마본이 반응하고 있어……?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あ、そうだ魔本！\u3000強くなりたいからそれちょうだい！\u3000ていうかよこせ～っ！」"
translation = "「아, 맞다 마본! 강해지고 싶으니까 그거 줘! 라기보다 내놔라～읏!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「星騎士として強くなれなくてもいい！\u3000世界征服するためなら、どんな手を使ってでも強くなってやる！」"
translation = "「성기사로서 강해지지 못해도 좋아! 세계 정복하기 위해서라면, 어떤 수를 써서라도 강해져 주겠어!」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『ようやく通信魔法が繋がったわ。状況は視ていたけど、相当厳しいようね』"
translation = "『겨우 통신 마법이 연결되었네. 상황은 보고 있었지만, 상당히 엄혹한 모양이구나』"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『魔本が反応したのはカティア、あなたよ』"
translation = "『마본이 반응한 것은 카티아, 너야』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ホントに！？」"
translation = "「진짜!?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「うそ～～っ！？\u3000世界征服に反応したってこと！？」"
translation = "「거짓말～～읏!? 세계 정복에 반응했다는 거야!?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『世界征服……子どもじみた夢かもしれないけど、あなたは本気でそれを欲するの？』"
translation = "『세계 정복…… 아이 같은 꿈일지도 모르지만, 너는 진심으로 그것을 원하는 거니?』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「もちろん！\u3000逆に世界征服したくない理由ってあるのかな？」"
translation = "「당연하지! 반대로 세계 정복하고 싶지 않은 이유라도 있어?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『ふっ……言うわね。それでこそ魔将よ。大罪を背負うにふさわしいわ』"
translation = "『훗…… 제법이네. 이래야 마장이지. 대죄를 짊어지기에 적합해』"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『分不相応な夢を抱く弱き者よ。大きな野望を持つちっぽけなあなたを、<ruby>魔本<rt>わたし</rt></ruby>たちは認めるわ』"
translation = "『분수에 맞지 않는 꿈을 품는 약한 자여. 큰 야망을 가진 보잘것없는 너를, <ruby>마본<rt>나</rt></ruby>들은 인정하마』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「一言どころか二言ぐらい余計なんだけど！\u3000でももらえるものはもらう！」"
translation = "「한마디는커녕 두마디 정도 쓸데없거든! 그치만 줄 수 있는 건 받겠어!」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『さぁ、本を手に取って……あなたの『強欲』を世界に見せつけてやりなさい』"
translation = "『자, 책을 손에 들고…… 너의 『강욕』을 세계에 과시해 보이려무나』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「うん！\u3000魔本よ、来い！」"
translation = "「응! 마본아, 와라!」"

[[dialogue]]
speaker = "unk"
original = "カティアが手をかざすと、シャルレーヌが持っていた『強欲』の魔本がそこに収まり、強い光を放つ。"
translation = "카티아가 손을 내밀자, 샬레느가 가지고 있던 『강욕』의 마본이 그곳에 안착하여, 강한 빛을 발한다."

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『対象者『カティア・セルベラス』、適合罪科『強欲』。……魔本、貸出承認』"
translation = "『대상자 『카티아 세르베라스』, 적합 죄과 『강욕』. ……마본, 대여 승인』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「うおおおぉぉーーーーーーっ！！！」"
translation = "「우오오오오오ーーーーーー읏!!!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「『強欲』の魔将カティア・セルベラス、ここに見参！\u3000世界は私と魔王様のものだぁーーっ！！」"
translation = "「『강욕』의 마장 카티아 세르베라스, 여기에 등장! 세계는 나와 마왕 님의 것이다아ーー읏!!」"

