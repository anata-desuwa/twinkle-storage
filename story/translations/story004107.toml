[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「な、何言ってるのあなた……ここはディアーブル家の領地よ？」"
translation = "「무, 무슨 소리를 하는 거야 너…… 여기는 디아블가의 영지라고?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「今はそうだけど、関係ないよ」"
translation = "「지금은 그렇지만, 상관없어」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「だって魔王様と私で世界征服して、三界は私たちのものになるんだから」"
translation = "「그치만 마왕님하고 내가 세계정복해서, 삼계는 우리 것이 될 거니까」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「は…………？」"
translation = "「하…………?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「はぁーーーーーーっ！！？」"
translation = "「하아ーーーーーー앗!!?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「世界征服なんて本気で言ってるの……？\u3000正気？」"
translation = "「세계정복이라니 진심으로 하는 소리야……? 제정신이야?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「え、うん。魔族に生まれたからには、一生に一度は世界征服してみたくない？」"
translation = "「에, 응. 마족으로 태어난 이상, 평생에 한 번은 세계정복 해보고 싶지 않아?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「え……そんな、旅行に行くみたいなノリで言われても…………」"
translation = "「에…… 그런, 여행이라도 가는 듯한 기분으로 말해도…………」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「それはシャルレーヌ……様が無欲なだけじゃないですか～？」"
translation = "「그건 샬레느…… 님이 무욕할 뿐 아닌가요～?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「私が無欲ぅ！？\u3000生まれて初めて言われたわよ！？」"
translation = "「내가 무욕하다아!? 태어나서 처음 들어봤거든!?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "（いや、確かに世界征服って言ってた魔族、他にもいたけど……普通、本気だと思わないでしょ！？）"
translation = "（아니, 확실히 세계정복이라고 말하던 마족, 다른 녀석도 있었지만…… 보통, 진심이라고 생각하지 않잖아!?）"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私なんか、物心ついたときから世界征服したかったですよ？\u3000ずっとずっと昔から……」"
translation = "「나 따위, 철들었을 때부터 세계정복 하고 싶었다고요? 아주 아주 옛날부터……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私が生まれたのはシャリオンでも片田舎で、本当に何もないところで……見渡す限りの空と山と、あと畑が私の始まりでした」"
translation = "「내가 태어난 건 샤리온에서도 시골 구석으로, 정말 아무것도 없는 곳이라…… 둘러보는 한 끝없는 하늘과 산, 그리고 밭이 내 시작이었어요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「昔はひいおじいちゃんも元気で、畑仕事によくついていきました。その時、聞いたんです。ご先祖様は、魔王っていう世界で一番強い人の配下だったんだって」"
translation = "「옛날에는 증조할아버지도 건강하셔서, 밭일에 자주 따라갔었어요. 그때 들었어요. 조상님은, 마왕이라는 세계에서 가장 강한 사람의 부하였다고」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「『世界で一番強い』……その言葉に胸が躍りました」"
translation = "「『세계에서 가장 강하다』…… 그 말에 가슴이 뛰었어요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「世界一有名で、みんなが尊敬して、銅像もあちこちに建ってて、思わずははーってひれ伏しちゃうような人に、私もなりたいって思いました」"
translation = "「세계에서 가장 유명하고, 모두가 존경하고, 동상도 여기저기 서 있어서, 나도 모르게 넓죽 엎드려 버릴 것 같은 사람이, 나도 되고 싶다고 생각했어요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「星力に目覚めて、新星学園に留学できたときは、このまま世界で一番強くなってやるんだって本気で思ってました」"
translation = "「성력에 눈을 뜨고, 신성학원에 유학할 수 있었을 때는, 이대로 세계에서 가장 강해져 주겠다고 진심으로 생각했었어요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「でも全然強くなれなくて…………世界征服なんて夢のまた夢だって諦めかけて」"
translation = "「하지만 전혀 강해질 수 없어서………… 세계정복 따위 꿈의 또 꿈이라고 포기하려 할 때」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「そんなとき、あの人に出会ったんです！」"
translation = "「그럴 때, 그 사람을 만난 거예요!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「そう、魔王様に！」"
translation = "「그래요, 마왕님을!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「御前試合で見事に逆転勝利……本当にかっこよかったな～～～～！！」"
translation = "「어전시합에서 멋지게 역전승…… 정말 너무 멋있었지～～～～!!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「昔話じゃなくて、魔王様が本当にいて、本当に、本当に強くて！\u3000すっごくすっごく嬉しかった！」"
translation = "「옛날이야기가 아니라, 마왕님이 정말로 계시고, 정말로, 정말로 강해서! 엄청 엄청 기뻤어요!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「最初はただ、魔王様に近付いて、ビッグな魔族になりたかっただけでした。でもそのうち気付いたんです」"
translation = "「처음에는 그저, 마왕님에게 접근해서 빅한 마족이 되고 싶었을 뿐이었어요. 하지만 그러던 중에 깨달은 거예요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「この人なら世界征服できる……ううん、この人こそ世界征服すべきだって！！」"
translation = "「이 사람이라면 세계정복을 할 수 있어…… 아니, 이 사람이야말로 세계정복을 해야만 한다고!!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私は魔王様の配下として、世界征服をお手伝いするんだって張り切って……でもでも、やっぱり私は魔王様と並び立てるほど強くはなくて…………」"
translation = "「나는 마왕님의 부하로서 세계정복을 돕는 거라며 의욕을 부렸지만…… 그래도 그래도, 역시 나는 마왕님과 어깨를 나란히 할 정도로 강하지는 않아서…………」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「だから私は強くなりたかった。魔王様の配下として相応しいように……魔王様と一緒に世界征服できるように！」"
translation = "「그래서 나는 강해지고 싶었어. 마왕님의 부하로서 어울리도록…… 마왕님과 함께 세계정복을 할 수 있도록!」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「は、はぁ……黙って聞いてたけど、何言ってるかよく分からないわ……」"
translation = "「하, 하아…… 가만히 듣고는 있었지만, 무슨 말을 하는 건지 잘 모르겠는데……」"

[[dialogue]]
speaker = "unk"
original = "呆れ戸惑うシャルレーヌを尻目に、カティアはモンスターの群れをにらむ。"
translation = "어이없어하며 당황하는 샬레느를 뒤로하고, 카티아는 몬스터 무리를 노려본다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「モンスターめ……よくも、よくも……未来の魔王様と私の領地をーーーーーーっ！！！」"
translation = ""

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「許さない許さない許さない……私たちの領地を滅茶苦茶にしやがってぇーーーーっ！！！」"
translation = ""

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「世界は私と魔王様が征服するんだ……モンスターやアステラなんかに私たちの<ruby>領地<rt>世界</rt></ruby>をくれてやるもんかーーーーっ！！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "カティアの咆哮が空に轟き、それに応えるかのごとく、シャルレーヌが持っていた魔本が光り出す。"
translation = "카티아의 포효가 하늘에 울려 퍼지고, 그에 응답하듯이 샬레느가 가지고 있던 마도서가 빛나기 시작한다."

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「え……？\u3000『強欲』の魔本が反応してる……？」"
translation = "「어……? 『탐욕』의 마도서가 반응하고 있어……?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あ、そうだ魔本！\u3000強くなりたいからそれちょうだい！\u3000ていうかよこせ～っ！」"
translation = ""

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「星騎士として強くなれなくてもいい！\u3000世界征服するためなら、どんな手を使ってでも強くなってやる！」"
translation = "「성기사로서 강해지지 못해도 상관없어! 세계정복을 위해서라면, 어떤 수단을 써서라도 강해져 주겠어!」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『ようやく通信魔法が繋がったわ。状況は視ていたけど、相当厳しいようね』"
translation = "『드디어 통신마법이 연결되었네. 상황은 보고 있었지만, 상당히 엄혹한 모양이구나』"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『魔本が反応したのはカティア、あなたよ』"
translation = "『마도서가 반응한 것은 카티아, 너란다』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ホントに！？」"
translation = "「진짜!?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「うそ～～っ！？\u3000世界征服に反応したってこと！？」"
translation = ""

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『世界征服……子どもじみた夢かもしれないけど、あなたは本気でそれを欲するの？』"
translation = "『세계정복…… 어린애 같은 꿈일지도 모르지만, 너는 진심으로 그것을 바라는 거니?』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「もちろん！\u3000逆に世界征服したくない理由ってあるのかな？」"
translation = "「당연하지! 반대로 세계정복을 하고 싶지 않은 이유라도 있어?」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『ふっ……言うわね。それでこそ魔将よ。大罪を背負うにふさわしいわ』"
translation = "『후…… 제법이네. 이래야 마장이지. 대죄를 짊어지기에 어울려』"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『分不相応な夢を抱く弱き者よ。大きな野望を持つちっぽけなあなたを、<ruby>魔本<rt>わたし</rt></ruby>たちは認めるわ』"
translation = "『분수에 맞지 않는 꿈을 품은 약자여. 큰 야망을 가진 보잘것없는 너를, <ruby>마도서<rt>우리</rt></ruby>들은 인정하마』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「一言どころか二言ぐらい余計なんだけど！\u3000でももらえるものはもらう！」"
translation = "「한 마디는커녕 두 마디 정도 쓸데없는 소리지만! 그래도 주는 건 받아 가겠어!」"

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『さぁ、本を手に取って……あなたの『強欲』を世界に見せつけてやりなさい』"
translation = "『자, 책을 손에 들고…… 너의 『탐욕』을 세계에 과시해 보아라』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「うん！\u3000魔本よ、来い！」"
translation = "「응! 마도서여, 와라!」"

[[dialogue]]
speaker = "unk"
original = "カティアが手をかざすと、シャルレーヌが持っていた『強欲』の魔本がそこに収まり、強い光を放つ。"
translation = "카티아가 손을 내밀자, 샬레느가 가지고 있던 『탐욕』의 마도서가 그 손에 들어가며 강한 빛을 발한다."

[[dialogue]]
speaker_original = "リィベル"
speaker_translation = "리벨"
original = "『対象者『カティア・セルベラス』、適合罪科『強欲』。……魔本、貸出承認』"
translation = "『대상자 『카티아 세르베라스』, 적합죄과 『탐욕』. ……마도서, 대여 승인』"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「うおおおぉぉーーーーーーっ！！！」"
translation = ""

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「『強欲』の魔将カティア・セルベラス、ここに見参！\u3000世界は私と魔王様のものだぁーーっ！！」"
translation = ""

