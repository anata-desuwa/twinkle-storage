[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「――くうぅっ！？」"
translation = "「――크읏！？」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「まだよ……！\u3000まだ諦めないわ！」"
translation = "「아직이야……！ 아직 포기하지 않아！」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「聖沙ちゃん！」"
translation = "「세이샤짱！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「お姉様！？」"
translation = "「언니！？」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「見てたよ！\u3000聖沙ちゃんが、水着で諦めないで頑張っているところ！」"
translation = "「보고 있었어！ 세이샤짱이, 수영복으로 포기하지 않고 열심히 하는 모습！」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「だから、私も応援するよ！」"
translation = "「그러니까, 나도 응원할게！」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「聖沙ちゃんの水着なら、会長くんの海パンに勝てるって！」"
translation = "「세이샤짱의 수영복이라면, 회장군의 사각 수영복을 이길 수 있다고！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「お姉様……！\u3000はいっ！」"
translation = "「언니……！ 네！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「私――ハイレグに勝ってみせます！」"
translation = "「나―― 하이레그를 이겨 보이겠어요！」"

[[dialogue]]
speaker = "unk"
original = "来い！\u3000聖沙っ！！"
translation = "덤벼라! 미사!!"

[[dialogue]]
speaker = "unk"
original = "その意気やよし！"
translation = "그 기세 아주 좋다！"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ええ！\u3000何度だって勝負よ、会長っ！！」"
translation = "「그래! 몇 번이든 승부야, 회장!!」"

