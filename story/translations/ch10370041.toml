[[dialogue]]
speaker = "unk"
original = "第１話,酔ってないよ～？,P"
translation = "제1화, 취하지 않았어～?"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「でね～、魔将になって、魔界で大暴れしてきたんだ～♪\u3000よく覚えてないけど楽しかった～♪」"
translation = "「그래서 말이지～, 마장이 되어서, 마계에서 크게 난동 부리고 왔어～♪ 잘 기억은 안 나지만 즐거웠어～♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「新星学園の地下におっきな書庫があったなんてびっくりした～。魔将になったから、今は自由に出入りできるんだ～」"
translation = "「신성학원 지하에 커다란 서고가 있었다니 놀랐어～. 마장이 되었으니까, 지금은 자유롭게 출입할 수 있어～」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「昔の魔界のレシピを研究してるから、会長ちゃんも楽しみにしててね～♪」"
translation = "「옛날 마계의 레시피를 연구하고 있으니까, 회장짱도 기대해 줘～♪」"

[[dialogue]]
speaker = "unk"
original = "新星学園の地下深くにある深淵書庫。そこには過去のリクリエで滅ぼされた魔族の怨念が収蔵されており、当時の状況も断片的に知ることができる。"
translation = "신성학원 지하 깊은 곳에 있는 심연서고. 거기에는 과거의 리크리에로 멸망한 마족의 원한이 수장되어 있어, 당시의 상황도 단편적으로 알 수 있다."

[[dialogue]]
speaker = "unk"
original = "レシピもいいけど……"
translation = "레시피도 좋지만……"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ぽよ～？\u3000あ、まだ会長ちゃんに魔将フォームを見てもらってなかったね～。そんなに楽しみなの～？」"
translation = "「포요～? 아, 아직 회장짱한테 마장 폼을 보여주지 않았었네～. 그렇게 기대돼～?」"

[[dialogue]]
speaker = "unk"
original = "力強くうなずく。恋人の新たな装いが楽しみでないわけがない。"
translation = "힘차게 고개를 끄덕인다. 연인의 새로운 차림새가 기대되지 않을 리 없다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふわ～、嬉しい～♪\u3000じゃあ場所を変えるね～♪」"
translation = "「후와～, 기뻐～♪ 그럼 장소를 바꿀게～♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ではでは～、へんし～ん♪」"
translation = "「그럼 그럼～, 변～신♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふわ～♪\u3000体がぽかぽかする～♪」"
translation = "「후와～♪ 몸이 따끈따끈해～♪」"

[[dialogue]]
speaker = "unk"
original = "魔将となったサランから大きな力を感じる。もともと優秀なプリマステラだったが、さらに強くなったのが佇まいから分かる。"
translation = "마장이 된 사란에게서 커다란 힘이 느껴진다. 원래 우수한 프리마스테라였지만, 더욱 강해진 것이 자태에서 느껴진다."

[[dialogue]]
speaker = "unk"
original = "だが、それ以上に……"
translation = "하지만, 그 이상으로……"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ぽよ～？\u3000サランのお顔に何かついてる～？」"
translation = "「포요～? 사란의 얼굴에 무슨 문제라도 있어～?」"

[[dialogue]]
speaker = "unk"
original = "いや、何でもない……"
translation = "아니, 아무것도 아니야……"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「そぉ～？\u3000ヘンな会長ちゃん～」"
translation = "「그래～? 이상한 회장짱～」"

[[dialogue]]
speaker = "unk"
original = "いつになく刺激的な恰好に思わず見入ってしまった。付き合っているとはいえ、勝手にジロジロ見るのはさすがによくない。"
translation = "평소와 달리 자극적인 모습에 나도 모르게 넋을 놓고 바라보았다. 사귀고 있다고는 해도, 마음대로 빤히 쳐다보는 건 역시 좋지 않다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「サランのおっぱい、見たいなら見たいって言えばいいのに～」"
translation = "「사란의 가슴, 보고 싶으면 보고 싶다고 말하면 되는데～」"

[[dialogue]]
speaker = "unk"
original = "ぶはっ！？"
translation = "푸핫!?"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ちがうの～？\u3000会長ちゃんはサランのおっぱい大好きでしょ～？」"
translation = "「아니야～? 회장짱은 사란의 가슴 정말 좋아하잖아～?」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「……ふふっ、あははっ♪\u3000冗談だよ～。会長ちゃんはおっぱいだけじゃなくてサランの全部が大好きだもんね～♪」"
translation = "「……후후, 아하하♪ 농담이야～. 회장짱은 가슴뿐만 아니라 사란의 전부를 정말 좋아하니까～♪」"

[[dialogue]]
speaker = "unk"
original = "答えに窮していると、向こうが助け舟を出してくれた。……当然、大好きだけど。"
translation = "답을 하지 못해 쩔쩔매고 있자, 저쪽에서 구원의 손길을 내밀어 주었다. ……당연히, 정말 좋아하지만."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふふ～、会長ちゃんの困ったお顔、可愛かったよ～♪」"
translation = "「후후～, 회장짱의 난처해하는 얼굴, 귀여웠어～♪」"

[[dialogue]]
speaker = "unk"
original = "…………酔ってる？"
translation = "…………취했어?"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「えぇ～、酔ってないよ～？」"
translation = "「에에～, 안 취했어～?」"

[[dialogue]]
speaker = "unk"
original = "サランは本当に美味しいものを食べるとお酒を飲んだみたいに酩酊してしまう。"
translation = "사란은 정말로 맛있는 것을 먹으면 술을 마신 것처럼 만취해 버린다."

[[dialogue]]
speaker = "unk"
original = "それに似ているけど、まだ何も食べていないのでいつもよりタチが悪い。魔将の力のせいなのだろうか。"
translation = "그것과 닮았지만, 아직 아무것도 먹지 않았기에 평소보다 질이 나쁘다. 마장의 힘 때문인 걸까."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「それより～、サラン、うずうずしてきちゃった～<emoji=heart04>\u3000会長ちゃん、サランと戦ってくれる～？」"
translation = "「그보다도～, 사란, 근질근질해지기 시작했어～<emoji=heart04> 회장짱, 사란이랑 싸워줄래～?」"

[[dialogue]]
speaker = "unk"
original = "わかった"
translation = "알았어"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ありがと～<emoji=heart04>\u3000会長ちゃん大好き～<emoji=heart04>」"
translation = "「고마워～<emoji=heart04> 회장짱 정말 좋아해～<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「じゃあ、こっちからいくね～。ホイッパースマッシュ～！」"
translation = "「그럼, 이쪽에서 갈게～. 휘퍼 스매시～!」"

[[dialogue]]
speaker = "unk"
original = "長物と化した泡立て器から繰り出される、重い打撃。腕を交差して受け止めるが、床にめり込むんじゃないかと思うほどの衝撃だ。"
translation = "긴 무기가 된 거품기에서 자아내지는, 무거운 타격. 팔을 교차해 받아내지만, 바닥에 박히는 게 아닐까 싶을 정도의 충격이다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「そ～れ、キルシュシュガーレイン～♪」"
translation = "「자아～, 키르슈 슈가 레인～♪」"

[[dialogue]]
speaker = "unk"
original = "サランが泡立て器を振るうと、綿菓子の雲が生まれ、甘いシロップの雨が降り注ぐ。"
translation = "사란이 거품기를 휘두르자, 솜사탕 구름이 생겨나고, 달콤한 시럽 비가 쏟아진다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ん～、いい香り～♪\u3000サラン大好き～♪」"
translation = "「음～, 좋은 향기～♪ 사란 정말 좋아해～♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「キルシュっていうのはね～、さくらんぼのことなんだよ～。キルシュヴァッサーっていうさくらんぼのお酒をそう呼ぶの～」"
translation = "「키르슈라는 건 말이지～, 체리를 말하는 거야～. 키르슈바서라는 체리 술을 그렇게 불러～」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「いろんなお菓子に使われてるから、この香りだけでおなか空いちゃう～」"
translation = "「여러 과자에 쓰이고 있으니까, 이 향기만으로 배가 고파져 버려～」"

[[dialogue]]
speaker = "unk"
original = "シロップの雨には魔力が含まれていて、浴びれば感覚を鈍らせる。メルヘンな術に見えるが、強力な攻撃だ。"
translation = "시럽 비에는 마력이 포함되어 있어, 뒤집어쓰면 감각을 둔하게 만든다. 메르헨스러운 술식으로 보이지만, 강력한 공격이다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「おなか空いちゃったから～、クリーム出しちゃえ～♪\u3000会長ちゃんも召し上がれ～♪」"
translation = "「배가 고파졌으니까～, 크림을 내보내자～♪ 회장짱도 드세요～♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「せーの、グラトニースイートディザスタ～♪」"
translation = "「하나 둘, 글러트니 스위트 디자스터～♪」"

[[dialogue]]
speaker = "unk"
original = "白いクリームの波がトレーニングルームに氾濫し、視界が白で埋め尽くされた。"
translation = "하얀 크림의 파도가 트레이닝 룸에 범람하며, 시야가 하얗게 메워졌다."

[[dialogue]]
speaker = "unk"
original = "とてつもなく甘い！"
translation = "엄청나게 달다!"

[[dialogue]]
speaker = "unk"
original = "甘さを文字通りに全身に浴びてしまった。とろけるような多幸感が満ち、力が抜けていく。"
translation = "달콤함을 말 그대로 온몸으로 뒤집어써 버렸다. 녹아내리는 듯한 다행감이 차오르며, 힘이 빠져나간다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふふふ～♪\u3000どう、美味しかった～？」"
translation = "「후후후～♪ 어때, 맛있었어～?」"

[[dialogue]]
speaker = "unk"
original = "蠱惑的な笑みを浮かべるサラン。いつもの無邪気なサランも可愛いけれど、新しい扉が開きそうだ。"
translation = "현혹적인 미소를 짓는 사란. 평소의 천진난만한 사란도 귀엽지만, 새로운 문이 열릴 것 같다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふふ、ふふふ～♪\u3000つぎはどんなクリームにしようかにゃ～、こんぺーとーのいんせきもいいな～♪」"
translation = "「후후, 후후후～♪ 다음은 어떤 크림으로 할까나～, 별사탕 운석도 좋겠네～♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「えへへ～、ふわふわ～♪\u3000ぽよ～？\u3000かいちょーちゃんがさんにんになっちゃった～？\u3000おとくだね～♪\u3000すっぱいかいちょーちゃんはどのこかな～？\u3000あはは～♪」"
translation = "「에헤헤～, 폭신폭신～♪ 포요～? 회장짱이 세 명이 되어버렸어～? 이득이네～♪ 시큼한 회장짱은 어떤 아이일까나～? 아하하～♪」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふわぁ～…………サラン、ねむたくなっちゃった～～。おやすみぃ～」"
translation = "「후와아～………… 사란, 졸려졌어～～. 잘 자아～」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「すぅ、すぅ…………」"
translation = "「쿨, 쿨…………」"

[[dialogue]]
speaker = "unk"
original = "酔った末に寝てしまった。魔将フォームは強力だが、制御に難があるみたいだ。"
translation = "취한 끝에 잠들어 버렸다. 마장 폼은 강력하지만, 제어에 어려움이 있는 모양이다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「……え？\u3000サラン、魔将になって酔っぱらっちゃってたの～？」"
translation = "「……어? 사란, 마장이 되어서 취해버렸던 거야～?」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「おっぱい……？\u3000サラン、そんなこと言ってたの～？\u3000うぅ～、恥ずかしいよ～」"
translation = "「가슴……? 사란, 그런 말을 했었어～? 우으～, 부끄러워～」"

[[dialogue]]
speaker = "unk"
original = "刺激的だったり、恥ずかしがったり、今日はサランの珍しいところが見れて嬉しかった。"
translation = "자극적이거나, 부끄러워하거나, 오늘은 사란의 보기 드문 모습을 볼 수 있어서 기뻤다."

