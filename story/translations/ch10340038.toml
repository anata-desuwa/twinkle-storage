[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様。お話があります」"
translation = "「마왕님. 드릴 말씀이 있습니다」"

[[dialogue]]
speaker = "unk"
original = "新たに得た魔将フォームをまとい、神妙な顔でやってくるカティア。"
translation = "새롭게 얻은 마장 폼을 두르고, 침통한 표정으로 찾아오는 카티아."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様は世界の頂点に立つお方。いずれ私だけでなく、三界の全てが魔王様に<ruby>傅<rt>かしず</rt></ruby>くでしょう」"
translation = "「마왕님은 세계의 정점에 서실 분. 언젠가 저뿐만 아니라, 삼계의 모든 것이 마왕님께 조아리겠지요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ですが、私が一番のしもべでありたいです」"
translation = "「하지만, 제가 최고의 하인이고 싶습니다」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様の一番特別で、唯一の存在になりたいです」"
translation = "「마왕님의 가장 특별하고, 유일한 존재가 되고 싶어요」"

[[dialogue]]
speaker = "unk"
original = "カティアが真っ直ぐ俺を見つめる。"
translation = "카티아가 똑바로 나를 바라본다."

[[dialogue]]
speaker = "unk"
original = "カティアの想いが真剣なことは理解できるのだが、何を言わんとしているのかがよく分からなかった。"
translation = "카티아의 마음이 진심이라는 것은 이해할 수 있지만, 무슨 말을 하려는 건지 잘 알 수 없었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ええっと……具体的にどういうこと？」"
translation = "「어라…… 구체적으로 무슨 뜻이야?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「それは、あの……」"
translation = "「그건, 저기……」"

[[dialogue]]
speaker = "unk"
original = "俺が尋ねると、カティアはもじもじと恥ずかしそうに体をくねらせる。"
translation = "내가 묻자, 카티아는 머뭇머뭇 부끄러운 듯 몸을 꼬아댄다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様が世界征服したら、かわいい女の子を集めてハーレムとか作るかもしれないじゃないですか？」"
translation = "「마왕님이 세계를 정복하면, 귀여운 여자아이들을 모아서 하렘이라도 만들지 모르는 일적이잖아요?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「でもそういうのはイヤというか……魔王様は私の魔王様でいてほしいから……」"
translation = "「하지만 그런 건 싫다기보다…… 마왕님은 제 마왕님으로 계셔주셨으면 하니까……」"

[[dialogue]]
speaker = "unk"
original = "なんだそんなことか、と心の中で呟く。"
translation = "뭐야 그런 거였나, 하고 마음속으로 중얼거린다."

[[dialogue]]
speaker = "unk"
original = "もしも世界征服するとしても、ハーレムなんて作る気はさらさらない。"
translation = "만약 세계를 정복한다 해도, 하렘 따위를 만들 생각은 전혀 없다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「みんなの魔王様を、私だけのものにしたいんです！\u3000私、強欲ですから！」"
translation = "「모두의 마왕님을, 저만의 것으로 만들고 싶어요! 저, 탐욕스러우니까요!」"

[[dialogue]]
speaker = "unk"
original = "俺を自分のものにしたいなんて、ささやかな強欲だ。"
translation = "나를 자신의 것으로 만들고 싶다니, 소소한 탐욕이다."

[[dialogue]]
speaker = "unk"
original = "でも思っていることは俺も同じだ。"
translation = "하지만 생각하는 것은 나도 마찬가지다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺もそうだよ、カティア」"
translation = "「나도 그래, 카티아」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「──！」"
translation = "「──!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「カティアは俺のものだし、誰にも渡さない。俺もカティアのものだ」"
translation = "「카티아는 내 것이고, 누구에게도 주지 않아. 나도 카티아의 거야」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様……！」"
translation = "「마왕님……!」"

[[dialogue]]
speaker = "unk"
original = "もどかしそうにしていたカティアの表情がぱぁっと明るくなる。"
translation = "답답해하던 카티아의 표정이 활짝 밝아진다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「じゃあ……その証をください」"
translation = "「그럼…… 그 증표를 주세요」"

[[dialogue]]
speaker = "unk"
original = "顔を赤くしてねだるカティアに頷き、彼女をベッドに横たえる。"
translation = "얼굴을 붉히며 조르는 카티아에게 고개를 끄덕이고, 그녀를 침대에 눕힌다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様……<emoji=heart04>」"
translation = "「마왕님……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "カティアがベッドに仰向けになり、俺を迎えるように足を開く。"
translation = "카티아가 침대에 바르게 눕더니, 나를 맞이하듯 다리를 벌린다."

[[dialogue]]
speaker = "unk"
original = "そしてお腹を無防備に晒して……いわゆる犬の服従のポーズをとった。"
translation = "그리고 배를 무방비하게 드러내며…… 이른바 개가 복종할 때 취하는 포즈를 취했다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「くぅ～ん……カティアは魔王様のしもべですワン<emoji=heart04>\u3000魔王様に全部捧げますワン<emoji=heart04>」"
translation = "「킁～응…… 카티아는 마왕님의 하인이다 멍<emoji=heart04> 마왕님께 전부 바칠게요 멍<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "犬にやるように、カティアのお腹を優しく撫でてやる。"
translation = "개에게 하듯, 카티아의 배를 다정하게 쓰다듬어 준다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「きゅぅ～ん<emoji=heart04>\u3000魔王様にお腹撫でられると、体がポカポカします……<emoji=heart04>\u3000それにお腹の奥がキュンキュンして……はあぁ……<emoji=heart04>」"
translation = "「끼～응<emoji=heart04> 마왕님이 배를 쓰다듬어 주시니까, 몸이 따끈따끈해요……<emoji=heart04> 거기다 배 속 깊은 곳이 찌릿찌릿해서…… 하아아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "剥き出しになった秘部から蜜が溢れ、陰唇から覗く膣口が物欲しそうにひくつく。"
translation = "노출된 비부에서 꿀이 넘쳐흐르고, 음순 사이로 엿보이는 질구가 아쉬운 듯 씰룩거린다."

[[dialogue]]
speaker = "unk"
original = "軽く体をよじると、小柄なのに大きなおっぱいが揺れた。"
translation = "몸을 가볍게 비틀자, 아담하면서도 커다란 가슴이 흔들렸다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「カティアのおっぱい、大きくてエッチだ」"
translation = "「카티아의 가슴, 크고 야해」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「えへへ……<emoji=heart04>\u3000魔王様に喜んでもらえてうれしいです<emoji=heart04>」"
translation = "「에헤헤……<emoji=heart04> 마왕님이 기뻐해 주셔서 기뻐요<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「カティアのおっぱいも魔王様のものですから、好きにしてくださいね<emoji=heart04>」"
translation = "「카티아의 가슴도 마왕님의 것이니까, 마음대로 해주세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そこまで言われて我慢できるわけなく、たわわな胸に手を伸ばした。"
translation = "거기까지 듣고 참을 수 있을 리가 없어서, 풍만한 가슴으로 손을 뻗었다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「んん～～っ<emoji=heart04>\u3000魔王様におっぱい触られて……はあぁ<emoji=heart04>\u3000んんっ……<emoji=heart04>」"
translation = "「응응～～읏<emoji=heart04> 마왕님이 가슴을 만져주셔서…… 하아아<emoji=heart04> 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "カティアのおっぱいは本当に柔らかくて、力を込めると指が沈み、間から肉がこぼれる。"
translation = "카티아의 가슴은 정말 부드러워서, 힘을 주면 손가락이 푹 파묻히고 사이로 살이 넘쳐난다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はぁ、あっ……魔王様……そんなにおっぱい触られたら……んっ<emoji=heart04>\u3000魔王様の、欲しくなります……<emoji=heart04>」"
translation = "「하아, 아앗…… 마왕님…… 그렇게 가슴을 만져대시면…… 응읏<emoji=heart04> 마왕님의 것, 갖고 싶어져요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "おっぱいを揉んでいると、ペニスが反り返るほど勃起し、カティアの性器もびしょびしょになっていた。"
translation = "가슴을 주무르고 있자, 페니스가 뒤틀릴 정도로 발기하고, 카티아의 성기도 푹 젖어 있었다."

[[dialogue]]
speaker = "unk"
original = "俺ももう我慢できなくて、カティアの濡れた秘部にペニスを突き入れる。"
translation = "나도 더는 참지 못하고, 카티아의 젖은 비부에 페니스를 찔러 넣는다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふぁあああ～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「후아아아아～～～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "怒張したペニスがカティアの小さな穴を広げ、膣内へと入った。"
translation = "팽창한 페니스가 카티아의 작은 구멍을 넓히며, 질 내로 들어갔다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はあぁっ……あっ……あんっ<emoji=heart04>\u3000魔王様のおち○ぽ、大きいっ……<emoji=heart04>\u3000はぁっ、あっ……おま○この中で、おち○ぽ、動いてるぅ……<emoji=heart04>」"
translation = "「하아앗…… 앗…… 안읏<emoji=heart04> 마왕님의 자지, 크다……<emoji=heart04> 하앗, 앗…… 보지 안에서, 자지가, 움직이고 있어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「んんっ、はぁ……あっ、んんっ<emoji=heart04>\u3000おち○ぽの形、わかっちゃう……<emoji=heart04>\u3000ひぁ、んっ……んぁああっ<emoji=heart04>」"
translation = "「응응읏, 하아…… 앗, 응응읏<emoji=heart04> 자지의 형태, 알 것 같아……<emoji=heart04> 히아, 응읏…… 응아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「っ……カティアの中、熱くてトロトロで気持ちいいよ」"
translation = "「읏…… 카티아의 속, 뜨겁고 녹아내릴 것 같아서 기분 좋아」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はい、私も魔王様のおち○ぽ、気持ちいいですっ<emoji=heart04>\u3000はぁっ、あっ……中から広げられてっ……ゴリゴリってぇ……ん～～っ<emoji=heart04>」"
translation = "「네, 저도 마왕님의 자지, 기분 좋아요읏<emoji=heart04> 하앗, 앗…… 안에서 넓혀져서…… 드득드득거리며…… 응～～읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふっ、はぁ……<emoji=heart04>\u3000こんな気持ちいいおち○ぽ、誰にも渡しませんっ……んんはぁ……私専用の、魔王おち○ぽですっ……<emoji=heart04>」"
translation = "「후윽, 하아……<emoji=heart04> 이렇게 기분 좋은 자지, 누구한테도 안 줄 거예요…… 응응하아…… 제 전용, 마왕 자지예요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "誰にも渡さない──その言葉の通り、膣が収縮して絡みつく。"
translation = "누구에게도 주지 않는다── 그 말대로, 질이 수축하며 조여온다."

[[dialogue]]
speaker = "unk"
original = "深く突き入れると、ペニス全体を締め付けられて快感が押し寄せてきた。"
translation = "깊게 찔러 넣자, 페니스 전체가 조여들며 쾌감이 밀려왔다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「カティアも俺専用だからな」"
translation = "「카티아도 내 전용이니까 말이지」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はい、魔王様専用の、メス犬ま○こです<emoji=heart04>\u3000いっぱいおち○ぽズボズボして、気持ち良くなってくださいっ<emoji=heart04>」"
translation = "「네, 마왕님 전용의, 암캐 보지예요<emoji=heart04> 푹푹 자지 질퍽하게 박아줘서, 기분 좋아져 주세요읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふっ、あっ……ひああぁっ<emoji=heart04>\u3000魔王様におち○ぽ入れてもらえて、幸せ、です<emoji=heart04>\u3000ふぁっ、あっ、あぁんっ<emoji=heart04>」"
translation = "「후윽, 앗…… 히아아앗<emoji=heart04> 마왕님이 자지 넣어주셔서, 행복, 해요<emoji=heart04> 후앗, 앗, 아앙읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "腰を突き出す度、ガチガチに硬くなったペニスと、柔らかい肉壁が摩擦する。"
translation = "허리를 쳐올릴 때마다, 딱딱하게 굳은 페니스와 부드러운 살벽이 마찰한다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「んぁ、はっ……あぁあっ、あっ、んんんっ……<emoji=heart04>\u3000魔王様に突かれて、気持ちいいっ<emoji=heart04>\u3000あっ……あっ……ふぁああっ<emoji=heart04>」"
translation = "「응아, 하앗…… 아아앗, 앗, 응응응읏……<emoji=heart04> 마왕님한테 박혀서, 기분 좋아<emoji=heart04> 앗…… 앗…… 후아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様のおち○ぽ好き<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000突かれるのいい<emoji=heart04>\u3000ふああぁっ、はぁっ<emoji=heart04>\u3000ズンズンされる度に、もっと好きになっちゃいますぅ<emoji=heart04>」"
translation = "「마왕님의 자지 좋아<emoji=heart04> 안읏<emoji=heart04> 박히는 거 좋아<emoji=heart04> 후아아앗, 하앗<emoji=heart04> 푹푹 찔릴 때마다, 더욱 좋아져 버려요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "突かれる勢いでたぷたぷと揺れるおっぱいを鷲掴みにする。"
translation = "박아 넣는 기세로 요동치며 흔들리는 가슴을  움켜쥔다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふぁあああっ<emoji=heart04>\u3000あ<emoji=heart04>\u3000おっぱい揉みくちゃにされて、んんっ<emoji=heart04>\u3000体、熱くなってる<emoji=heart04>」"
translation = "「후아아아앗<emoji=heart04> 아<emoji=heart04> 가슴을 주물러대서, 응응읏<emoji=heart04> 몸이, 뜨거워지고 있어<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ひああぁっ<emoji=heart04>\u3000はあぁっ、はっ、んんっ<emoji=heart04>\u3000魔王様にしていただくことは、全部、幸せですっ<emoji=heart04>」"
translation = "「히아아앗<emoji=heart04> 하아앗, 앗, 응응읏<emoji=heart04> 마왕님이 해주시는 건, 전부, 행복해요읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "欲望のまま、力任せにおっぱいを揉んでいるのに、カティアは嬉しそうに膣を締め付けてくる。"
translation = "욕망이 이끄는 대로, 힘껏 가슴을 주무르고 있는데도, 카티아는 기쁜 듯이 질을 조여온다."

[[dialogue]]
speaker = "unk"
original = "小さな体に不釣り合いなカティアのおっぱいを、好き放題揉みしだきながら腰を動かす至福を味わう。"
translation = "작은 체구에 어울리지 않는 카티아의 가슴을 마음껏 주무르고 헤집으며 허리를 움직이는 지복을 맛본다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はぁはっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000おっぱい揉まれながら、突かれてっ……ふああぁっ<emoji=heart04>\u3000これ、気持ちいいっ<emoji=heart04>」"
translation = "「하아하앗<emoji=heart04> 앗<emoji=heart04> 가슴 주물러지면서, 박혀서…… 후아아앗<emoji=heart04> 이거, 기분 좋아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "柔らかな胸の先端、ツンと尖った乳首にしゃぶりつく。"
translation = "부드러운 가슴 끝, 뾰족하게 선 젖꼭지를 빨아대기 시작한다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「くぅ～ん<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「킁～응<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "その瞬間、カティアが犬の鳴き声を上げて前進を震わせた。"
translation = "그 순간, 카티아가 개의 울음소리를 내며 전신을 떨었다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はぁ<emoji=heart04>\u3000んん<emoji=heart04>\u3000先っぽ、あ<emoji=heart04>\u3000そんなちゅうちゅう吸ったり、ペロペロしたら……んん～～っ<emoji=heart04>」"
translation = "「하아<emoji=heart04> 응응<emoji=heart04> 끝부분, 아<emoji=heart04> 그렇게 쪽쪽 빨고, 핥아대면…… 응응～～읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふああぁ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000んん<emoji=heart04>\u3000おっぱい気持ちいい<emoji=heart04>\u3000乳首、ジンジンしちゃいますぅ<emoji=heart04>」"
translation = "「후아아<emoji=heart04> 앗<emoji=heart04> 응응<emoji=heart04> 가슴 기분 좋아<emoji=heart04> 젖꼭지, 찌릿찌릿해 버려요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "舌先でちろちろと舐めたり、吸い付いたりしてカティアのおっぱいを味わい、さらに乳首を甘噛みする。"
translation = "혀 끝으로 감질나게 핥거나, 빨아들이며 카티아의 가슴을 맛보고, 나아가 젖꼭지를 깨문다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ひぃいんっ！？」"
translation = "「깨엥!?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あ<emoji=heart04>\u3000あ<emoji=heart04>\u3000それ、ヤバいですぅ……<emoji=heart04>\u3000んんっ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000おっぱい、すごいぃ……<emoji=heart04>」"
translation = "「아<emoji=heart04> 아<emoji=heart04> 그거, 위험해요……<emoji=heart04> 응응읏<emoji=heart04> 응읏<emoji=heart04> 가슴, 굉장해……<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「おま○こ熱くて、お腹の奥、キュンキュン切ないぃ……<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000んん～～っっ<emoji=heart04>」"
translation = "「보지가 뜨거워서, 배 속 깊은 곳이 찌릿찌릿 가슴 아파……<emoji=heart04> 하아앗<emoji=heart04> 응응～～읏읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "乳首を責める度、膣壁がぎゅうっとペニスにしがみついてきて心地いい。"
translation = "젖꼭지를 괴롭힐 때마다, 질벽이 꽉 페니스를 매달려 와서 기분이 좋다."

[[dialogue]]
speaker = "unk"
original = "俺もたまらなくなって、突き込む力が強くなる。"
translation = "나도 견딜 수 없어져서, 쳐올리는 힘이 세어진다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「んん～～～～っ<emoji=heart04><emoji=heart04>\u3000魔王様のおち○ぽ、奥に、当たってっ<emoji=heart04>\u3000ひぁああっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000すごいぃっ<emoji=heart04>」"
translation = "「응응～～～～읏<emoji=heart04><emoji=heart04> 마왕님의 자지, 안쪽에, 닿아서<emoji=heart04> 히아아앗<emoji=heart04> 앗<emoji=heart04> 대단해읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「んぁあああっ<emoji=heart04>\u3000あ<emoji=heart04>\u3000あ<emoji=heart04>\u3000ふぁああっ<emoji=heart04>\u3000はっ<emoji=heart04>\u3000子宮に<emoji=heart04>\u3000来るっ<emoji=heart04>\u3000おち○ぽすごいぃっ<emoji=heart04>」"
translation = "「응아아아앗<emoji=heart04> 아<emoji=heart04> 아<emoji=heart04> 후아아앗<emoji=heart04> 앗<emoji=heart04> 자궁에<emoji=heart04> 와<emoji=heart04> 자지 대단해읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はぁ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000あっ、あんっ<emoji=heart04>\u3000奥、ゴンゴン叩かれてる<emoji=heart04>\u3000ひぃあああっ<emoji=heart04>」"
translation = "「하아<emoji=heart04> 하아앗<emoji=heart04> 앗, 안읏<emoji=heart04> 깊은 곳이, 쿵쿵 찧어지고 있어<emoji=heart04> 히아아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "亀頭が子宮に当たると、衝撃が快感になり、カティアも手足をビクビク跳ねさせて喘ぐ。"
translation = "귀두가 자궁에 부딪히자, 충격이 쾌감이 되고, 카티아도 팔다리를 펄떡거리며 헐떡인다."

[[dialogue]]
speaker = "unk"
original = "ペニスをさらに奥に押し込み、抉るように押し当てる。"
translation = "페니스를 더욱 깊은 곳까지 밀어 넣고, 헤집듯 들이밀어 대 본다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「きゅぅ～～～んっ<emoji=heart04>」"
translation = "「끼～～～응읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様のおち○ぽで、子宮、ぐりぐりされてるっ<emoji=heart04>\u3000これしゅごいぃっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000おま○こ壊れちゃうぅっ<emoji=heart04>」"
translation = "「마왕님의 자지로, 자궁, 꾸욱꾸욱 눌러지고 있어<emoji=heart04> 이거 대단해읏<emoji=heart04> 앗<emoji=heart04> 보지 망가져 버려어읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ああっ<emoji=heart04>\u3000んんぁあっ<emoji=heart04>\u3000子宮、感じる<emoji=heart04>\u3000あ、ダメっ<emoji=heart04>\u3000お腹の奥きゅうって<emoji=heart04>\u3000切ないっ<emoji=heart04>\u3000あっつい精子欲しくなりますぅっ<emoji=heart04>」"
translation = "「아앗<emoji=heart04> 응응아앗<emoji=heart04> 자궁, 느껴져<emoji=heart04> 아, 안 돼<emoji=heart04> 배 속 깊은 곳이 꽉 조여서<emoji=heart04> 가슴 아파<emoji=heart04> 뜨거운 정액이 갖고 싶어져요읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "蕩けた顔で喘ぐカティアがかわいくて、唇を奪った。"
translation = "녹아내린 얼굴로 헐떡이는 카티아가 귀여워서, 입술을 빼앗았다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「んんむ──っ！\u3000くちゅるっ、ちゅるちゅるっ、じゅぷるっ<emoji=heart04>\u3000ちゅるれろっ<emoji=heart04>\u3000へるっ<emoji=heart04>\u3000れろっ<emoji=heart04>」"
translation = "「응응음──읏! 쪽쪽, 쥬웁, 쥬푸륵<emoji=heart04> 쪽레로<emoji=heart04> 낼름<emoji=heart04> 레로<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "舌を差し入れると、カティアも応えてくれて、唾液を絡め合う。"
translation = "혀를 밀어 넣자, 카티아도 응답해 주며, 타액을 서로 얽어맨다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「んぶっ、じゅるるっ、ちゅく、れる<emoji=heart04>\u3000んん、っむぅ、へるっ、じゅるるるっ<emoji=heart04>\u3000へるへる、じゅりゅ、じゅぷるる<emoji=heart04>」"
translation = "「응츕, 쥬르륵, 쪽, 낼름<emoji=heart04> 응응, 읏음, 낼름, 쥬르르륵<emoji=heart04> 낼름낼름, 쥬류, 쥬푸르르<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「まおう、しゃまぁ……へるへるっ、れぇる、じゅぷれろ<emoji=heart04>\u3000じゅくるっ<emoji=heart04>\u3000んっふぅ<emoji=heart04>\u3000へりゅ<emoji=heart04>\u3000じゅ──ずずっ<emoji=heart04>」"
translation = "「마왕, 님…… 낼름낼름, 레에르, 쥬푸레로<emoji=heart04> 쥬륵<emoji=heart04> 응후<emoji=heart04> 낼름<emoji=heart04> 쥬──쯥<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "カティアの唾液を飲み込むと、ますます体の熱が増し、動きが加速していく。"
translation = "카티아의 침을 삼키자, 한층 더 몸의 열기가 더해지며, 움직임이 가속해 간다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ひぃいんっ<emoji=heart04>\u3000魔王様のおち○ぽで<emoji=heart04>\u3000奥、ドチュドチュ突かれてっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000お腹に響く<emoji=heart04>\u3000子宮、疼いちゃいますぅっ<emoji=heart04>」"
translation = "「깨엥<emoji=heart04> 마왕님의 자지로<emoji=heart04> 깊은 곳, 철벅철벅 박혀서<emoji=heart04> 앗<emoji=heart04> 앗<emoji=heart04> 배에 울려<emoji=heart04> 자궁이, 쑤셔버려요읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ペニスを深く突き入れながら、カティアのお腹を撫でると……"
translation = "페니스를 깊게 찔러 넣으면서, 카티아의 배를 쓰다듬자……"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「くぅ～～ん<emoji=heart04>\u3000ワンワン<emoji=heart04>\u3000ワン<emoji=heart04>\u3000わふぅ<emoji=heart04>」"
translation = "「킁～～응<emoji=heart04> 멍멍<emoji=heart04> 멍<emoji=heart04> 와후<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「わぉ～んっ<emoji=heart04>\u3000魔王様にお腹撫でられると……きゅぅん<emoji=heart04>\u3000子宮キュンキュンしますぅっ<emoji=heart04>」"
translation = "「아우～응읏<emoji=heart04> 마왕님이 배를 쓰다듬어 주시면…… 끼응<emoji=heart04> 자궁이 찌릿찌릿해요읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "子犬のように鳴いて喜ぶカティアがかわいくて仕方ない。"
translation = "강아지처럼 짖으며 기뻐하는 카티아가 귀여워서 견딜 수가 없다."

[[dialogue]]
speaker = "unk"
original = "カティアは誰にも渡さない。渡すものか。"
translation = "카티아는 누구에게도 넘기지 않는다. 넘길까 보냐."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「カティアは俺のものだ……！」"
translation = "「카티아는 내 거야……!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はいっ<emoji=heart04>\u3000はっ、はっ<emoji=heart04>\u3000私は、カティアは、魔王様のものですっ<emoji=heart04>」"
translation = "「네읏<emoji=heart04> 하앗, 하앗<emoji=heart04> 저는, 카티아는, 마왕님의 것이에요읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あっ<emoji=heart04>\u3000あぁんっ<emoji=heart04>\u3000魔王様の命令なら、何でも聞きます<emoji=heart04>\u3000エッチだって<emoji=heart04>\u3000パイズリだってしますぅ<emoji=heart04>」"
translation = "「앗<emoji=heart04> 아앙읏<emoji=heart04> 마왕님의 명령이라면, 뭐든지 들을게요<emoji=heart04> 야한 짓도<emoji=heart04> 파이즈리도 할게요<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「首輪付けて、四つん這いで散歩します<emoji=heart04>\u3000片足上げておしっこします<emoji=heart04>」"
translation = "「목줄을 차고, 엎드려 기며 산책할게요<emoji=heart04> 한 다리를 들고 오줌 싸게요<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様が孕めと言ったら孕みますっ<emoji=heart04>\u3000赤ちゃんたくさん産みますっ<emoji=heart04>」"
translation = "「마왕님이 임신하라고 하면 임신할게요읏<emoji=heart04> 아기 잔뜩 낳을게요읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「だから魔王様をください！」"
translation = "「그러니까 마왕님을 주세요!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様の全部をください！」"
translation = "「마왕님의 전부를 주세요!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああ、俺は全部カティアのものだ！」"
translation = "「그래, 나는 전부 카티아의 거야!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様──！！」"
translation = "「마왕님──!!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あぁっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000嬉しいっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000魔王様、大好きですっ<emoji=heart04><emoji=heart04>」"
translation = "「아앗<emoji=heart04> 안읏<emoji=heart04> 기뻐요<emoji=heart04> 하아앗<emoji=heart04> 마왕님, 정말 좋아해요읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "カティアに応えると、嬉しそうにキュンキュン締め付けてきた。"
translation = "카티아에게 응답하자, 기쁜 듯이 찌릿찌릿 조여왔다."

[[dialogue]]
speaker = "unk"
original = "限界がすぐそこまで近づき、ラストスパートをかける。"
translation = "한계가 바로 앞까지 다가와, 마지막 스퍼트를 올린다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「出すぞ、カティア……！」"
translation = "「싸질러버릴게, 카티아……!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ひゃいっ<emoji=heart04>\u3000出して<emoji=heart04>\u3000出して<emoji=heart04>\u3000しもべおま○こに、中出しして<emoji=heart04>\u3000種付けしてくださいっ<emoji=heart04><emoji=heart04>」"
translation = "「히얏<emoji=heart04> 싸줘<emoji=heart04> 싸줘<emoji=heart04> 하인 보지에, 질내사정 해줘<emoji=heart04> 교배해 주세요읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ひぁっ<emoji=heart04>\u3000ああぁんっ<emoji=heart04>\u3000私の全部は、魔王様のものですから<emoji=heart04>\u3000んぁっ<emoji=heart04>あっ<emoji=heart04>\u3000孕ませほーだい子宮に、中出ししてくださいぃっ<emoji=heart04><emoji=heart04>」"
translation = "「히앗<emoji=heart04> 아아앙읏<emoji=heart04> 제 모든 것은, 마왕님의 것이니까<emoji=heart04> 응아읏<emoji=heart04> 앗<emoji=heart04> 마음껏 임신시키는 자궁에, 질내사정 해주세요오읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ひぃぁああっ<emoji=heart04>\u3000あ──あ──あ──んん～～っ<emoji=heart04>\u3000おち○ぽ、奥にズンズン来て、おま○こイキますぅっ<emoji=heart04>」"
translation = "「히아아앗<emoji=heart04> 아── 아── 아── 응응～～읏<emoji=heart04> 자지, 깊은 곳에 푹푹 들어와서, 보지 가버려요읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000魔王様の、せーえき欲しくて、子宮キュンキュンするぅ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000イクイク<emoji=heart04>\u3000イッくぅぅっ<emoji=heart04>」"
translation = "「앗<emoji=heart04> 앗<emoji=heart04> 마왕님의, 정액이 탐나서, 자궁이 찌릿찌릿해<emoji=heart04> 앗<emoji=heart04> 가버려 가버려<emoji=heart04> 가버려어어읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふぁああっ<emoji=heart04>\u3000おち○ぽ、奥にゴチュンって、ひやあぁあっ<emoji=heart04>\u3000あ──あ──おま○こイクぅぅ～～～っ<emoji=heart04><emoji=heart04>」"
translation = "「후아아앗<emoji=heart04> 자지, 안쪽에 쿵 하고, 히야아아앗<emoji=heart04> 아── 아── 보지 가버려어어～～～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そしてペニスを根元まで突き入れ、欲望を解き放つ──！！"
translation = "그리고 페니스를 뿌리까지 찔러 넣고, 욕망을 해방한다──!!"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ひぁああああ～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「히아아아아아～～～～～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あっついぃっ<emoji=heart04><emoji=heart04>\u3000あついの出てるぅ～～～～っ<emoji=heart04><emoji=heart04>」"
translation = "「앗<emoji=heart04> 앗<emoji=heart04> 뜨거워어읏<emoji=heart04><emoji=heart04> 뜨거운 게 나오고 있어어～～～～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ペニスが脈打ち、子宮に精を送り込む度、カティアが四肢をビクビクと震わせながら悶える。"
translation = "페니스가 맥동하고, 자궁에 정액을 쏟아낼 때마다, 카티아가 사지를 펄떡거리며 몸부림친다."

[[dialogue]]
speaker = "unk"
original = "同時に膣がぎゅっと収縮し、熱い粘膜に搾られながら射精を続ける。"
translation = "동시에 질이 꽉 수축하며, 뜨거운 점막에 쥐어짜이면서 사정을 계속한다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くぅぅっ……」"
translation = "「크으윽……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「んん～～～っ<emoji=heart04>\u3000魔王様のせーえき、たくさん出てる……<emoji=heart04>\u3000あぁっ、嬉しいっ……<emoji=heart04>」"
translation = "「응응～～～읏<emoji=heart04> 마왕님의 정액, 잔뜩 나오고 있어……<emoji=heart04> 아앗, 기뻐……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "亀頭を子宮口に密着させ、下半身に力を込める。"
translation = "귀두를 자궁구에 밀착시키고, 하반신에 힘을 쏟는다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はあぁっ……<emoji=heart04>\u3000まだ、出て……<emoji=heart04>\u3000んんっ、魔王様のせーえきで、お腹、いっぱいぃ……<emoji=heart04>」"
translation = "「하아앗……<emoji=heart04> 아직, 나오고……<emoji=heart04> 응응읏, 마왕님의 정액으로, 배, 가득해……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "一滴残らずカティアの中に注ぎ、ようやく射精が止まった。"
translation = "한 방울도 남김없이 카티아의 안에 쏟아붓고 나서야 겨우 사정이 멈췄다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はぁ、はぁ……はああぁ……たくさん、出してもらいましたぁ……<emoji=heart04>」"
translation = "「하아, 하아…… 하아아…… 잔뜩, 넣어주셨어요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "膣口から精液を垂らし、満足そうな表情を浮かべるカティア。"
translation = "질구에서 정액을 흘리며, 만족스러운 표정을 짓는 카티아."

[[dialogue]]
speaker = "unk"
original = "そんなカティアがかわいくて、頭をくしゃくしゃと撫でる。"
translation = "그런 카티아가 귀여워서, 머리를 헝클어뜨리며 쓰다듬는다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「えへへへ……<emoji=heart04>\u3000撫でられるの好きぃ<emoji=heart04>」"
translation = "「에헤헤헤……<emoji=heart04> 쓰다듬어 주는 거 좋아<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「でもたくさん溢れちゃって、もったいないです……」"
translation = "「하지만 잔뜩 넘쳐버려서, 아까워요……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「またいくらでも出すよ。俺はカティアのものなんだから」"
translation = "「또 얼마든지 싸줄게. 나는 카티아의 거니까」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様……<emoji=heart04>」"
translation = "「마왕님……<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「へへへ～<emoji=heart04>\u3000魔王様が私のもの……そう言われると嬉しくなっちゃいますね<emoji=heart04>」"
translation = "「헤헤헤～<emoji=heart04> 마왕님이 내 거…… 그렇게 들으니 기뻐져 버리네요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "照れくさそうにはにかむカティアがかわいい。"
translation = "부끄러운 듯 수줍게 웃는 카티아가 귀엽다."

[[dialogue]]
speaker = "unk"
original = "このしもべ兼恋人を、愛しく思う気持ちがより強くなっていく。"
translation = "이 하인 겸 연인을 사랑스럽게 생각하는 마음이 더욱 강해져 간다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様と私で、三界で一番の子だくさんになりましょう！」"
translation = "「마왕님과 제가, 삼계에서 으뜸가는 다산 가정이 되어보죠!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「三界一！？\u3000それは嬉しいけど……大変じゃないか？」"
translation = "「삼계 으뜸!? 그건 기쁘지만…… 힘들지 않을까?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「大変でも欲しいものは欲しいんです。私は強欲ですから」"
translation = "「힘들어도 갖고 싶은 건 갖고 싶어요. 저는 탐욕스러우니까요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「だからずっとずっといつまでも……お付き合いお願いしますね、魔王様<emoji=heart04>」"
translation = "「그러니까 계속 계속 언제까지나…… 잘 부탁드려요, 마왕님<emoji=heart04>」"

