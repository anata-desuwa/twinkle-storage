[[dialogue]]
speaker = "unk"
original = "第１０話,アフタートーク,B"
translation = "제10화, 애프터 토크, B"

[[dialogue]]
speaker = "unk"
original = "ベガ世界における『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』との決戦から、少しして。"
translation = "베가 세계에서의 『<ruby>XELOS<rt>제로스</rt></ruby>』와의 결전으로부터 조금 뒤."

[[dialogue]]
speaker = "unk"
original = "その日、俺はメルエルから天界で起こった出来事の一部始終を聞くことになったのだが──"
translation = "그날, 나는 멜엘로부터 천계에서 일어난 사건의 전말을 듣게 되었는데──"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……天界で大変なことが起きたとは聞いていたけど、そんなことがあっただなんて」"
translation = "「……천계에서 큰일이 일어났다는 건 들었지만 그런 일이 있었을 줄이야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「うん。ごめんね、報せるのが遅くなっちゃって……」"
translation = "「응. 미안해, 알리는 게 늦어져서……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「謝るのはこっちの方だ。よくラストナンバーを退けてくれた」"
translation = "「사과할 건 이쪽이야. 라스트 넘버를 잘 물리쳐줬어」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「まさか最終決戦の前に、世界の危機が一度迫っていただなんて……想像もしてなかったから」"
translation = "「설마 최종 결전 전에 세계의 위기가 한 번 닥쳐왔었을 줄은…… 상상도 못 했으니까」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それにしても大変だったんじゃないか？\u3000メルエルが魔王因子を全て捨てちゃっただなんて……」"
translation = "「그나저나 힘들지 않겠어? 멜엘이 마왕 인자를 전부 버려버리다니……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「そ、そうだね～……ナターシャちゃんのお母さんは寝込んじゃったとか、なんとか……」"
translation = "「그, 그렇네~…… 나타샤 짱의 어머니는 앓아누우셨다나 뭐라나……」"

[[dialogue]]
speaker = "unk"
original = "そりゃそうだろう。２０００年以上前から続けてきた一族のお役目が、いきなりなくなってしまったんだから。"
translation = "그야 그렇겠지. 2000년 이상 이어온 일족의 소명이 갑자기 없어져 버렸으니."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でも……そうなるとナターシャの役目はどうなるんだ？\u3000まさか天界に帰っちゃったりとか──」"
translation = "「하지만…… 그렇게 되면 나타샤의 역할은 어떻게 되는 거지? 설마 천계로 돌아가 버린다거나──」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「あ、そのことなんだけど……」"
translation = "「아, 그 일인데……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「お邪魔しまーす。会長さん、選管からの連絡事項が──」"
translation = "「실례할게요. 회장님, 선관위에서 온 연락 사항이──」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「あっ！\u3000ナターシャちゃん！！」"
translation = "「앗! 나타샤 짱!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「げっ、メルエル。失礼しましたー」"
translation = "「게엣, 멜엘. 실례했습니다~」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「も～っ！\u3000どうしてそういうこと言うのー！？\u3000一緒にお話しようよ～っ！」"
translation = "「정말~! 왜 그런 말을 하는 거야~!? 같이 이야기하자니까~!!」"

[[dialogue]]
speaker = "unk"
original = "ナターシャは「はぁぁ～～」と、これ見よがしに大きなため息をつきながら、俺に選管の書類を渡してくる。"
translation = "나타샤는 「하아아~~」 하고, 보란 듯이 커다란 한숨을 내쉬며 나에게 선관위 서류를 건네준다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ありがとう、ナターシャ。あとで梨緒に返事しておくよ。ところで──」"
translation = "「고마워, 나타샤. 나중에 리오에게 답장해 둘게. 그나저나──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ん？」"
translation = "「응?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「メルエルから天界で起こったことを色々聞いてたんだが……君はこれからどうなるんだ？」"
translation = "「멜엘한테 천계에서 일어난 일을 이것저것 들었는데…… 너는 이제 어떻게 되는 거지?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「まさか別の仕事のために、天界に戻ったりとか……」"
translation = "「설마 다른 일 때문에 천계로 돌아간다거나……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「何、もしかして戻ってほしいの？」"
translation = "「뭐야, 혹시 돌아가길 바라는 거야?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……そうなったら寂しいから、確認したいなって」"
translation = "「……그렇게 되면 외로울 것 같아서 확인하고 싶었어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「確かに聖庭園のエージェントとして、お姫様を守る役目はなくなったよ。お姫様が軽率に、その立場を捨てちゃったからね」"
translation = "「확실히 성정원의 에이전트로서 공주님을 지키는 역할은 없어졌어. 공주님이 경솔하게 그 입장을 버려버렸으니까」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「だって余計なしがらみなしで、ナターシャちゃんと一緒にいたかったんだもん……」"
translation = "「그치만 쓸데없는 굴레 없이 나타샤 짱이랑 같이 있고 싶었단 말이야……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……はぁ。ほんっと能天気だよね。ともかく天界の魔王の血統はもういない。だけどうちの母さん、強情でさ」"
translation = "「……하아. 정말 대책 없이 낙천적이라니까. 아무튼 천계의 마왕 혈통은 이제 없어. 하지만 우리 엄마, 고집불통이라서 말이지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「『姫が魔王でなくなったとしても、リガルタ様の娘なのだから守りなさい』ってうるさいんだよね」"
translation = "「『공주님이 마왕이 아니게 되었다 해도, 리갈타 님의 따님이니 지키도록 하렴』이라며 시끄럽거든」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「聞いてやる義理もないけど、人間界にいた方が私も気が楽だし──ってわけで、もうしばらくこっちにいることにしたよ」"
translation = "「들어줄 의리도 없지만, 인간계에 있는 편이 나도 마음 편하고── 그런 이유로 당분간 여기 있기로 했어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「少なくとも、メルエルが卒業するまでは、新星学園に通うつもり」"
translation = "「적어도 멜엘이 졸업할 때까지는 신성 학원에 다닐 생각이야」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そうか……よかった。それじゃあこれからもよろしく、ナターシャ」"
translation = "「그렇구나…… 다행이다. 그럼 앞으로도 잘 부탁해, 나타샤」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「こちらこそ。ってわけでさ、会長さん。メルエルの手綱、ちゃんと握っておいてよ」"
translation = "「나야말로. 그런 의미에서 회장님. 멜엘의 고삐, 제대로 쥐고 있어 달라고」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「どういうことぉ！？」"
translation = "「그게 무슨 소리야!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「もー朝も昼も夜も、ナターシャちゃんナターシャちゃんってやかましいんだよね。人目も気にせずベタベタしてくるし……」"
translation = "「정말 아침이고 낮이고 밤이고, 나타샤 짱 나타샤 짱 거리며 시끄럽다니까. 남들 눈도 신경 안 쓰고 끈적하게 달라붙고……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「だって少し前まで、喧嘩で距離が開いてたし……！\u3000反動が来ちゃうのも仕方ないよぉ！！」"
translation = "「그치만 얼마 전까지 싸워서 거리가 벌어졌었는걸……! 반동이 오는 것도 어쩔 수 없잖아!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「仕方なくない。ベタベタする人付き合い、好きじゃないって言ってるじゃん」"
translation = "「어쩔 수 없지 않아. 끈적거리는 대인관계, 좋아하지 않는다고 말했잖아」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「それじゃ──会長さん。またね」"
translation = "「그럼── 회장님. 또 봐」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「あ～っ！\u3000待ってよぉ、ナターシャちゃん！！」"
translation = "「아앗! 기다려, 나타샤 짱!!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ちょうど放課後だし、一緒にこの前の猫カフェでも行こっ。ね？」"
translation = "「마침 방과 후니까, 같이 저번에 갔던 고양이 카페라도 가자. 응?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「また？\u3000あんまり気乗りしないなぁ」"
translation = "「또? 별로 내키지 않는데」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「え～、でも猫ちゃんを抱っこしてる時のナターシャちゃん、嬉しそうだったよ？\u3000証拠の写真もあるし！」"
translation = "「에~ 하지만 고양이를 안고 있을 때의 나타샤 짱, 기뻐 보였다구? 증거 사진도 있고!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうやってパシャパシャ勝手に撮ってくるお気楽天使がいるから気乗りしないって言ってるの──」"
translation = "「그렇게 찰칵찰칵 멋대로 찍어대는 낙천가 천사가 있어서 내키지 않는다고 말하는 거야──」"

[[dialogue]]
speaker = "unk"
original = "メルエルは相変わらず底抜けに明るい笑顔を浮かべていて。"
translation = "멜엘은 여전히 끝없이 밝은 미소를 짓고 있었고."

[[dialogue]]
speaker = "unk"
original = "ナターシャもなんだかんだで、まんざらでもない微笑みを返している──"
translation = "나타샤도 이런저런 말을 해도, 그리 싫지만은 않은 미소를 돌려주고 있다──"

[[dialogue]]
speaker = "unk"
original = "そのまま２人は、星徒会室を出て行って──俺だけが残される。"
translation = "그대로 두 사람은 성도회실을 나가고── 나만이 남겨진다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……仲直りできたみたいで、何よりだな」"
translation = "「……화해한 것 같아서 다행이군」"

[[dialogue]]
speaker = "unk"
original = "リガルタ老の血を引く者から、魔王因子は完全に失われた。そのことがきっかけで、今後も何かトラブルが起きるかもしれないけれど。"
translation = "리갈타 노인의 피를 이어받은 자로부터 마왕 인자는 완전히 소실되었다. 그 일을 계기로 앞으로도 무언가 문제가 생길지도 모르지만."

[[dialogue]]
speaker = "unk"
original = "世界のために戦ってくれた頼もしい天使の戦友たちのためならば、俺も協力は惜しまない。"
translation = "세계를 위해 싸워준 든든한 천사 전우들을 위해서라면, 나도 협력을 아끼지 않을 것이다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「さて──仕事、片付けるかな」"
translation = "「자── 일, 끝내볼까」"

[[dialogue]]
speaker = "unk"
original = "うららかで平和な午後の星徒会室で、俺はナターシャから渡された書類に目を通すのだった──"
translation = "화창하고 평화로운 오후의 성도회실에서, 나는 나타샤에게 받은 서류를 훑어보는 것이었다──"

