[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ティンクル☆くるせいだーすコラボ、第３弾！」"
translation = "「트윙클☆크루세이더즈 콜라보, 제3탄!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ついに、開催当日よ～♪」"
translation = "「드디어, 개최 당일이야～♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「どんどん、ぱふぱふ～♪」"
translation = "「팡파르 빰빰～♪」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「流星町の『ルネアリゾート結界』、お披露目の時ね♪」"
translation = "「유성 마을의 『루네아 리조트 결계』, 공개할 시간이야♪」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「待ってました～♪」"
translation = "「기다렸습니다～♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「よ～し、夏の海を思いっきり楽しんじゃうぞ～！」"
translation = "「좋아, 여름 바다를 마음껏 즐겨주겠어～!」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「クックック、俺様も、水着のリアちゃんとスウィートなバカンスを楽しむぜ……！」"
translation = "「큭큭큭, 이 몸도, 수영복 차림의 리아 짱과 스위트한 바캉스를 즐겨주마……!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「パーちゃ～ん？\u3000私の可愛いリアに、オイタしたりしちゃダメよ～？」"
translation = "「패～키? 나의 귀여운 리아에게, 허튼짓하면 안 된다～?」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「ヒエッ！？\u3000ハ、ハイ……」"
translation = "「히익!? 네, 넵……」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ<emoji=heart04>\u3000それじゃあ、あんまり待たせちゃっても悪いし、そろそろ始めましょうか♪」"
translation = "「후훗<emoji=heart04> 그러면, 너무 기다리게 해도 미안하니까, 슬슬 시작해 볼까♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「うん♪\u3000みんな、せ～ので行くよ～♪」"
translation = "「응♪ 다들, 하나 둘 하면 가는 거야～♪」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「いつでもいいわよ♪」"
translation = "「언제든 좋아♪」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「は～い♪」"
translation = "「네～♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「よっしゃ♪」"
translation = "「오예♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「せ～のっ♪」"
translation = "「하나─ 둘!♪」"

[[dialogue]]
speaker_original = "全員"
speaker_translation = "전원"
original = "「コラボイベント、<ruby>ＲＥＡＤＹ<rt>レディー</rt></ruby>\u3000<ruby>ＧＯ<rt>ゴー</rt></ruby>！！」"
translation = "「콜라보 이벤트, <ruby>READY<rt>레디</rt></ruby> <ruby>GO<rt>고</rt></ruby>!!」"

