[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「――これでよしっと」"
translation = ""

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「とりあえず、原因を特定する為の『自動解析霊術』を展開しておいたわ」"
translation = "「우선, 원인을 특정하기 위한 『자동 해석 영술』을 전개해 두었어」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「私たちはその間、何をすればいいのでしょう？」"
translation = "「우리들은 그동안, 무엇을 하면 좋을까요?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「自動解析が終わるまでは、一旦待つしかないわね」"
translation = "「자동 해석이 끝날 때까지는, 일단 기다릴 수밖에 없겠네」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「それってどれくらいかかるもんなの？」"
translation = "「그건 어느 정도 걸리는 거야?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「大体、半日から、１日くらいってところかしら」"
translation = "「대략, 반나절에서, 하루 정도라는 느낌일까」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そういうことなら、私は異世界の子たちとは初対面だし、自己紹介をしておきたいわ♪」"
translation = "「그런 거라면, 나는 이세계 아이들과는 초면이고, 자기소개를 해두고 싶네♪」"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんは、俺たちの方へ向き直る。"
translation = "헬레나 씨는, 우리 쪽을 향해 돌아선다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「改めまして、私は流星町の九浄家当主で、私立流星学園の理事長をやっている『九浄ヘレナ』よ。よろしくね♪」"
translation = "「새삼스럽지만, 나는 유성정의 쿠죠가 당주이자, 사립 유성 학원의 이사장을 맡고 있는 『쿠죠 헬레나』야. 잘 부탁해♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そ・れ・と、リアの『お姉ちゃん』をやっているわ♪\u3000――えいっ<emoji=heart04>」"
translation = "「그・리・고, 리아의 『언니』를 맡고 있단다♪ ――에잇<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そう言って、ヘレナさんはリア先輩の背後へ回り込むと、脇の下から両手を伸ばして――"
translation = "그렇게 말하며, 헬레나 씨는 리아 선배의 등 뒤로 돌아 들어가더니, 겨드랑이 밑으로 두 손을 뻗어――"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ちょっ、お姉ちゃん！？\u3000――きゃあっ！？」"
translation = "「잠깐, 언니!? ――꺄앗!?」"

[[dialogue]]
speaker = "unk"
original = "突然、リア先輩の胸を揉み始めた。"
translation = "갑자기 리아 선배의 가슴을 주무르기 시작했다."

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「へ、ヘレナさん！？\u3000何をして……！？」"
translation = "「헤, 헬레나 님!? 무슨 짓을……!?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ♪\u3000私たち姉妹のコミュニケーションよ<emoji=heart04>\u3000ね～、リア？」"
translation = ""

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ち、違うの！\u3000これは、お姉ちゃんがいつも、勝手にイタズラしてくるだけで～！」"
translation = "「아, 아니거든! 이건 언니가 매번 제멋대로 장난치는 것뿐이고~!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あ～ん！\u3000恥ずかしいから、みんなの前で触るのやめて～！」"
translation = "「아~앙! 부끄러우니까 모두 앞에서 만지는 거 그만해~!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ちなみに、今でもお風呂は一緒に入ってるのよ<emoji=heart04>」"
translation = "「참고로 지금도 목욕은 같이 하고 있단다<emoji=heart04>」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「それも、お姉ちゃんが勝手に入って来るからでしょ～！」"
translation = "「그것도 언니가 제멋대로 들어오는 거잖아~!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「お、お姉様とお風呂……<emoji=heart04>」"
translation = "「언, 언니분과 목욕……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「聖沙？\u3000鼻血出てるよ、鼻血」"
translation = "「미사? 코피 나오고 있어, 코피」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ハッ！？\u3000べ、別にお姉様の破廉恥な姿を想像したわけじゃないんだからねっ！？」"
translation = "「핫!? 따, 딱히 언니분의 파렴치한 모습을 상상한 건 아니니까 말이지!?」"

[[dialogue]]
speaker = "unk"
original = "め、目のやり場に困る……"
translation = "시, 시선을 어디다 둬야 할지 모르겠어……"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「異世会長さんも、副会長さんと同じで、ムッツリさんですね～」"
translation = "「이세계 회장님도 부회장님이랑 똑같이 야한 생각이 가득한 분이시네요~」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ち、違うわよ！？\u3000私はそんなんじゃないんだからっ！」"
translation = "「아, 아니거든!? 난 그런 사람이 아니란 말야!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「さてと、リアの胸も揉んで落ち着いたところで――」"
translation = "「자 그럼, 리아의 가슴도 주물러서 진정되었으니――」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「改めて、もう１人の『九浄ヘレナ』さんとも、ちゃんと挨拶しないとね♪」"
translation = "「새삼스럽지만, 또 한 명의 『쿠죠 헬레나』 님과도 제대로 인사를 나눠야겠지♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そうであったな」"
translation = "「그랬었지」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「と言っても、ひと目見た時から、全然他人って感じがしなかったのよね～」"
translation = "「그렇다고 해도, 첫눈에 보았을 때부터 전혀 남 같다는 느낌이 안 들었단 말이지~」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ああ。私は、そなたの『鏡映し』――」"
translation = "「그래. 나는 그대의 『거울에 비친 모습』――」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「こちらの世界でも同じく、九浄家の当主と、新星学園の理事長を務めている」"
translation = "「이쪽 세계에서도 마찬가지로, 쿠죠가의 당주와 신성 학원의 이사장을 맡고 있다」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「……そなたは、私という存在を見てどう思う？」"
translation = "「……그대는 나라는 존재를 보고 어떻게 생각하나?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「う～ん、私としては――すごく気が合いそうで、嬉しいわね♪」"
translation = "「으~음, 나로서는――굉장히 마음이 잘 맞을 것 같아서 기쁜걸♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そうか……ふふっ。私も同じだ」"
translation = "「그런가…… 후후. 나도 마찬가지다」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「同じ魂を持つ者だからな。会えたことに、心が高揚している」"
translation = "「같은 영혼을 가진 자이니까 말이지. 만나게 되어 마음이 고양되는군」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ、よかった♪\u3000でも、１つ問題があるのよね～」"
translation = "「후후, 다행이다♪ 하지만 한 가지 문제가 있단 말이지~」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「私たち、同姓同名でしょ？\u3000なんて呼んだらいいか、ちょっと迷っちゃわない？」"
translation = "「우리, 동명이인이잖아? 뭐라고 부르면 좋을지 조금 망설여지지 않아?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「それなら、私のことは『ヘレナちゃん』と呼ぶがよい。周りには、よくそう言っているのでな」"
translation = "「그렇다면 나를 『헬레나짱』이라고 부르면 된다. 주변에도 자주 그렇게 말하곤 하니까」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「じゃあ、私のことは呼び捨てで、『ヘレナ』でいいわ♪」"
translation = "「그럼 나에 대해서는 이름을 그냥 불러서 『헬레나』라고 하면 돼♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そういうことで――よろしくね、ヘレナちゃん♪」"
translation = "「그렇게 됐으니――잘 부탁해, 헬레나짱♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ああ。こちらこそ、よろしく頼む。ヘレナよ」"
translation = "「그래. 나야말로 잘 부탁한다, 헬레나」"

[[dialogue]]
speaker = "unk"
original = "そう言って、２人のヘレナさんはにこやかに握手を交わす。"
translation = "그렇게 말하며 두 사람의 헬레나 님은 미소를 지으며 악수를 나눈다."

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ふふっ♪\u3000お姉ちゃんたち、仲良くなれそうだね♪」"
translation = ""

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「マトイは、あれから元気にしてた？」"
translation = "「마토이는 그 뒤로 잘 지냈어?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「はい、聖沙お姉様♪」"
translation = "「네, 미사 언니분♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「一応聞いてはいたけど……マトイが聖沙を『お姉様』呼びしてるのを見ると、同じ２年生だから変な感じだな～」"
translation = "「일단 듣기는 했지만…… 마토이가 미사를 『언니분』이라고 부르는 걸 보면, 같은 2학년이라 이상한 기분이네~」"

[[dialogue]]
speaker = "unk"
original = "ちょっと不思議な感じだ"
translation = "조금 희한한 기분이다"

[[dialogue]]
speaker = "unk"
original = "俺も４人が揃っているのを見ると"
translation = "나도 4명이 모여 있는 것을 보면"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あっ、そっか！\u3000会長くんたちからしたら、私たち４人揃っては、これが初めてだもんね」"
translation = "「아, 그렇구나! 회장군 시점에서 보면 우리 4명이 모인 건 이번이 처음이지」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「最初は、私とリア先輩の２人だけで、会長たちと出会ったのよね」"
translation = "「처음에는 나랑 리아 선배 둘만 회장 일행과 만났었지」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「その次に、私と会計さんの２人で、異世界へ行ったのです♪」"
translation = "「그 다음에는 저랑 회계님 둘이서 이세계로 간 것입니다♪」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「俺様は、どっちの時もいたけどな！」"
translation = "「이몸은 어느 쪽일 때도 있었지만 말야!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「パッキーさんは、どっちの時も操られて敵になってたけど……」"
translation = "「팍키 씨는 어느 쪽일 때도 조종당해서 적이 되어 있었지만……」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「あははっ、確かに～♪」"
translation = "「아하하, 확실히~♪」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「俺が操られてたのは、ルネアのせいだぜ！」"
translation = "「내가 조종당한 건 루네아 탓이라고!」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「そ、それはこの前、ちゃんと理由を説明して謝ったじゃない！\u3000悪かったわよ……！」"
translation = "「그, 그건 요전에 제대로 이유를 설명하고 사과했잖아! 미안했다고……!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「まあまあ。結果的に、ルネアちゃんのおかげで会長くんやマトイちゃんたちと出会えたわけだし、ね？」"
translation = "「자자. 결과적으로 루네아짱 덕분에 회장군이나 마토이짱 일행을 만날 수 있었던 거니까, 응?」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「そうですね。なんだかんだ、異世界に来れてすごく楽しかったし！」"
translation = "「맞아요. 어찌 됐든 이세계에 올 수 있어서 정말 즐거웠고!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「おかげで、元の世界へ戻った後に、咲良クンの『羨ましい～』って顔を見ることができたわ♪」"
translation = "「덕분에 원래 세계로 돌아간 뒤에 사쿠라 군의 『부러워~』 하는 얼굴을 볼 수 있었는걸♪」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「……！\u3000そうだ、いいことを思いついたのです！」"
translation = "「……! 맞다, 좋은 생각이 떠오른 것입니다!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「どうせしばらく待つしかないのなら、その間、海で楽しく過ごしませんか？」"
translation = "「어차피 한동안 기다릴 수밖에 없다면, 그동안 바다에서 즐겁게 보내지 않겠나요?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「え？\u3000楽しく……？」"
translation = "「에? 즐겁게……?」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「はい♪\u3000急いてはことを甘んじる、とも言いますし――」"
translation = "「네♪ 서두르면 일을 그르친다는 말도 있고――」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「会長さんが思わず起きてきたくなるくらい、『キラキラで楽しいバカンス』を過ごすのです！」"
translation = "「회장님이 저도 모르게 일어나고 싶어질 정도로 『반짝반짝하고 즐거운 바캉스』를 보내는 것입니다!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「それ、いいかも！\u3000シンは『キラキラな学園生活を送りたい』っていつも言ってるし！」"
translation = "「거, 괜찮을지도! 신은 『반짝반짝한 학원 생활을 보내고 싶다』고 항상 말했었고!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ロロットさん、やるわね……！\u3000確かに、いいアイデアかもしれないわ」"
translation = "「로롯 씨, 제법이네……! 확실히 좋은 아이디어일지도 몰라」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「うんっ♪\u3000私もいいと思う！」"
translation = ""

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「私たちが楽しそうにしていたら――」"
translation = "「우리가 즐거워하고 있으면――」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「シンくんなら『僕も混ざりたい～！』って飛び起きてきそうな、そんな気がする♪」"
translation = "「신 군이라면 『나도 껴줘~!』라며 벌떡 일어날 것 같은, 그런 느낌이 들어♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「なら、みんなで、水遊びで勝負しましょう！」"
translation = "「그럼 다 함께 물놀이로 승부해요!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「水遊び！\u3000待ってました、なのです～♪」"
translation = "「물놀이! 기다리고 있었습니다~♪」"

[[dialogue]]
speaker = "unk"
original = "こうして俺たちは、ただ待つのではなく、やれることを積極的にしてみようと決めるのだった。"
translation = "이렇게 해서 우리는 그저 기다리는 게 아니라 할 수 있는 일을 적극적으로 해보기로 결정하는 것이었다."

