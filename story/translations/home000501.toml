[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「はぁい♪\u3000『九浄ヘレナよ』♪」"
translation = "「하아잇♪ 『쿠죠 헤레나야』♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「『俺の知ってるヘレナちゃんと違う！』ってなった方は初めまして♪」"
translation = "「『내가 아는 헤레나 짱이랑 달라!』라고 생각하신 분들은 처음 뵙겠습니다♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「知ってるって人は、お久しぶり～♪」"
translation = "「알고 있다는 분들은, 오랜만이야～♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「私は『流星クルセイダース』の――」"
translation = "「나는 『유성 크루세이더즈』의──」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「――私、『九浄リア』のお姉ちゃんなんだ～♪」"
translation = "「──나, 『쿠죠 리아』의 언니란다～♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そういうこと<emoji=heart04>\u3000――えいっ<emoji=heart04>」"
translation = "「그렇게 된 거야<emoji=heart04> ──에잇<emoji=heart04>」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「きゃっ！？」"
translation = "「꺄악!?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ<emoji=heart04>\u3000今日もリアの大きなおっぱいは柔らかくて、癒やされるわね～<emoji=heart04>」"
translation = "「후훗<emoji=heart04> 오늘도 리아의 커다란 가슴은 말랑말랑해서, 힐링 되네～<emoji=heart04>」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ちょっとお姉ちゃん！\u3000恥ずかしいから、イタズラで胸を触るのはやめて～！」"
translation = "「잠깐 언니! 부끄러우니까, 장난으로 가슴 만지는 건 그만해～!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――とまぁ、こんな感じで、私たち２人は『流星町』の九浄家仲良し姉妹なのよ～♪」"
translation = "「──뭐, 이런 느낌으로, 우리 둘은 『유성 마을』 쿠죠 가문의 사이좋은 자매란다～♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「仲良しでも、胸を触っていいわけじゃないからね！？\u3000もうっ！\u3000ぷんぷん！」"
translation = "「사이좋아도, 가슴을 만져도 된다는 건 아니니까 말야!? 정말! 흥흥!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「あ～ん<emoji=heart04>\u3000リアったら、頬を膨らませちゃって可愛いんだから～<emoji=heart04>」"
translation = "「아～앙<emoji=heart04> 리아도 참, 볼을 부풀리고는 귀엽다니까～<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「それで、私がこうして顔出ししている以上、もうわかっちゃうとは思うんだけど――」"
translation = "「그래서, 내가 이렇게 얼굴을 비추고 있는 이상, 벌써 눈치챘을 거라 생각하지만──」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「今回！\u3000ついに、私も『ティンクルスターナイツ』の世界へお邪魔させてもらうことになったのよ～♪」"
translation = "「이번에! 드디어, 저도 『티클 스타 나이츠』의 세계로 실례하게 되었답니다～♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「わ～♪\u3000ぱちぱちぱち～♪」"
translation = "「와～♪ 짝짝짝～♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「それで、イベントの舞台となる場所は～」"
translation = "「그래서, 이벤트의 무대가 될 장소는～」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「ここは女神である、私の出番ね！\u3000――それっ♪」"
translation = "「여기는 여신인, 나의 차례네! ──에잇♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――夏の海が広がる『リゾート結界』よ～♪」"
translation = "「──여름 바다가 펼쳐지는 『리조트 결계』야～♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「イェ～イっ♪」"
translation = "「예이～♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そして、夏といえば、やっぱり水着よね！\u3000というわけで～」"
translation = "「그리고, 여름 하면, 역시 수영복이지! 그런 고로～」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「水着フォームに、チェ～ンジっ♪」"
translation = "「수영복 폼으로, 체～인지♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「元クルセイダースの私も、時を経て、ついにプレイアブルで参戦よ♪」"
translation = "「전직 크루세이더즈인 나도, 시간을 거쳐, 드디어 플레이어블로 참전이야♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「もちろん、お姉様たちだけじゃないわ！」"
translation = "「물론, 언니들뿐만이 아니야!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「私も水着フォームで登場するわよ！」"
translation = "「나도 수영복 폼으로 등장한다고!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「いやいや、同じ流星生徒会のメンバーとして、あたしたち２人も忘れてもらっちゃ困るよ～」"
translation = "「아니아니, 같은 유성 학생회 멤버로서, 우리 둘도 잊어버리면 곤란해～」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「そうですよ～。だって今回は――」"
translation = "「맞아요～. 왜냐면 이번에는──」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「私たちクルセイダースが、４人揃って登場するのですから♪」"
translation = "「우리 크루세이더즈가, 4명 다 모여서 등장하니까요♪」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「そうそう♪\u3000って、シンのことを忘れてない？」"
translation = "「맞아 맞아♪ 근데, 신을 잊어버린 거 아냐?」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「あっ、いけません、そうでした～♪」"
translation = "「앗, 안 돼요, 그랬었죠～♪」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「そういえば、咲良クンの姿が見当たらないけど、どうしたのかしら？」"
translation = "「그러고 보니, 사쿠라 군의 모습이 보이지 않는데, 어떻게 된 걸까?」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「シン様なら、ちょっと遅れてから来るって言ってたぜ」"
translation = "「신 님이라면, 조금 늦게 온다고 했어」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「会長さん、相変わらず間の悪い人ですね～」"
translation = "「회장님, 여전히 타이밍이 안 좋은 분이네요～」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「あっ、もちろんこの俺様――大賢者パッキーも登場するぜ！」"
translation = "「앗, 물론 이 몸── 대현자 패키도 등장한다고!」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「私もこの『ルネアリゾート結界』を創造した女神として、華麗に降臨するわよ♪」"
translation = "「나도 이 『루네아 리조트 결계』를 창조한 여신으로서, 화려하게 강림할 거야♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「というわけで――今回は私たち『流星クルセイダース』が揃ってお届けする水着イベント♪」"
translation = "「그런 고로── 이번에는 우리 『유성 크루세이더즈』가 함께 전해드리는 수영복 이벤트♪」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「ティンクルスターナイツ×ティンクル☆くるせいだーすコラボ、第３弾！」"
translation = "「트윙클 스타 나이츠×트윙클☆크루세이더즈 콜라보, 제3탄!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「タイトルは、名づけて『<ruby>ＣＲＯＳＳＩＮＧ<rt>クロッシング</rt></ruby>\u3000<ruby>ＳＵＭＭＥＲ<rt>サマー</rt></ruby>\u3000<ruby>ＳＴＡＲＳ<rt>スターズ</rt></ruby>！！』」"
translation = "「타이틀은, 이름하여 『<ruby>CROSSING<rt>크로싱</rt></ruby> <ruby>SUMMER<rt>서머</rt></ruby> <ruby>STARS<rt>스타즈</rt></ruby>!!』」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「まもなくスタートよ！」"
translation = "「곧 스타트야!」"

[[dialogue]]
speaker_original = "４人"
speaker_translation = "4명"
original = "「お楽しみに～♪」"
translation = "「기대해 줘～♪」"

