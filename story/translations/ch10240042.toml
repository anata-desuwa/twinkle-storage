[[dialogue]]
speaker = "unk"
original = "第２話,ヨミとミヤハルと煩悩解放,P"
translation = "제2화, 요미와 미야하루와 번뇌 해방"

[[dialogue]]
speaker = "unk"
original = "その日、ヨミは巫女の力を扱う星騎士――陰陽師の『<ruby>安倍野<rt>あべの</rt></ruby>ミヤハル』の元を訪れていた。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――ミヤハルさん、こんな感じなんですけど、どうでしょう？」"
translation = "「――미야하루 씨, 이런 느낌입니다만, 어떤가요?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うんうん♪\u3000ヨミはんの巫女舞、ほんま綺麗やわぁ<emoji=heart04>\u3000見るたびに、どんどん上達しとるねぇ♪」"
translation = "「응응♪ 요미 양의 무녀춤, 참말로 예쁘구마<emoji=heart04> 볼 때마다 점점 실력이 느는구나♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ありがとうございます♪\u3000ミヤハルさんのご指導のおかげです」"
translation = "「감사합니다♪ 미야하루 씨의 지도 덕분이에요」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「天ヶ崎の舞は、うちん家の巫女舞とはまた違う魅力があるわぁ♪」"
translation = "「아마가사키의 춤은 우리 집 무녀춤하고는 또 다른 매력이 있당께♪」"

[[dialogue]]
speaker = "unk"
original = "最近、よくミヤハルの所に来てるんだって？"
translation = "요즘, 자주 미야하루에게 가고 있다며?"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい。ミヤハルさんは巫女としても先輩ですし、ご指導頂いているんです」"
translation = "「네. 미야하루 씨는 무녀로서도 선배고, 지도를 받고 있어요」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うちは巫女の力を教えるんが家のお役目やけど、ヨミはんの巫女の力は別流派みたいなもんやからなぁ」"
translation = "「우리야 무녀의 힘을 가르치는 게 집안 역할이지만, 요미 양의 무녀 힘은 다른 유파 같은 기니까」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うちもええ刺激をもろて、勉強させてもろうとるんよ♪」"
translation = "「우리도 좋은 자극을 받고, 공부가 되고 있당게♪」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ヨミはん、せっかくやし、今日は巫女舞以外も試してみよか？」"
translation = "「요미 양, 모처럼인데 오늘은 무녀춤 말고 다른 것도 시도해 볼까나?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい！\u3000よろしくお願いします」"
translation = "「네! 잘 부탁드립니다」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ただし、その『破邪の鈴』を使う時は気ぃ付けや」"
translation = "「단, 그 『파사의 방울』을 쓸 때는 조심해라」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「え？」"
translation = "「네?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「この前から見とる限りやと、持ち主の願いや想いを増幅する性質がありそうなんよ」"
translation = "「요전부터 보고 있자니, 소유자의 소원이나 마음을 증폭하는 성질이 있는 것 같더라고」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うちの陰陽術に似とる気配がするわぁ」"
translation = "「우리 음양술하고 비슷한 기운이 풍기는구마」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そうなんですか？\u3000わかりました、気を付けますね」"
translation = "「그런가요? 알겠습니다, 조심할게요」"

[[dialogue]]
speaker = "unk"
original = "それからしばらくして。"
translation = "그리고 잠시 후."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――よしっ、今日は爆裂絶好調です♪」"
translation = "「――좋아, 오늘은 폭렬 절호조예요♪」"

[[dialogue]]
speaker = "unk"
original = "すごくいい感じだ！"
translation = "엄청 좋은 느낌이다!"

[[dialogue]]
speaker = "unk"
original = "ヨミのエクスノヴァフォーム"
translation = "요미의 엑스 노바 폼"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「！\u3000えへへへっ♪」"
translation = "「! 에헤헤헷♪」"

[[dialogue]]
speaker = "unk"
original = "俺が褒めると嬉しそうに、ヨミの尻尾がぶんぶんと揺れる。"
translation = "내가 칭찬하자 기쁜 듯이, 요미의 꼬리가 붕붕 흔들린다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「この調子で――破邪の鈴！」"
translation = "「이 기세로――파사의 방울!」"

[[dialogue]]
speaker = "unk"
original = "ふにゃあ～"
translation = "후냐아~"

[[dialogue]]
speaker = "unk"
original = "不意に、俺の意識が微睡むように揺らいだ。"
translation = "갑자기, 나의 의식이 잠에 빠져들듯 흔들렸다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「…………ヨミ」"
translation = "「…………요미」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい？\u3000会長、どうしました？」"
translation = "「네? 회장님, 왜 그러세요?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「あらぁ？\u3000これは……」"
translation = "「어라아? 이건……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミは、今日も頑張っていて偉いな」"
translation = "「요미는, 오늘도 열심히 하고 참 대견하네」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「真面目だし、努力家だし……」"
translation = "「성실하고, 노력가이고……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「何より――可愛いし」"
translation = "「무엇보다――귀엽고」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000かかか、会長！？」"
translation = "「코얏!? 회, 회장님!?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「――さすが俺の好きになった女の子だ」"
translation = "「――역시 내가 반한 여자답다」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやぁ～っ！？」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「どうやら……ボロン<emoji=heart04>\u3000と出てしもうたみたいやねぇ<emoji=heart04>」"
translation = "「아무래도…… 보롱<emoji=heart04> 하고 나와버린 모양이네<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ボロン！？\u3000な、何がですか！？」"
translation = "「보롱!? 머, 뭐가 말인가요!?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「それは――ヨミはんの『煩悩』や<emoji=heart04>」"
translation = "「그건――요미 양의 『번뇌』야<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「煩悩ぉ！？」"
translation = "「번뇌요!?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「会長はんがおかしゅうなったんは、おそらく破邪の鈴の力で――」"
translation = "「회장님이 이상해진 건, 아마 파사의 방울 힘으로――」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ヨミはんが心の奥で願っとることを、演じさせてしもうとるんや<emoji=heart04>」"
translation = "「요미 양이 마음 속 깊은 곳에서 바라고 있는 걸 연기하게 만들어 버린 거랑게<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そ、そんなこと――」"
translation = "「그, 그런 건――」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミはもっと褒められるべきだ」"
translation = "「요미는 좀 더 칭찬받아야 마땅해」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「～～～～っ！？」"
translation = ""

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「あるみたいやねぇ♪」"
translation = "「있었던 모양이구마♪」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「よしよし」"
translation = "「착하지 착해」"

[[dialogue]]
speaker = "unk"
original = "自然な動作で、クロトはヨミの頭を撫でる。"
translation = "자연스러운 동작으로, 쿠로토는 요미의 머리를 쓰다듬는다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000ふ、ふにゃあ～……<emoji=heart04>」"
translation = "「코얏!? 훠, 후냐아~……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「めっちゃ幸せそうな顔しとるやん♪」"
translation = "「엄청 행복한 표정을 짓고 있구마♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「――ハッ！？\u3000ち、違います！」"
translation = "「――핫!? 아, 아니에요!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「今のは反射的に……！」"
translation = "「방금 건 반사적으로……!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミ、えらいえらい♪」"
translation = "「요미, 착하다 착해♪」"

[[dialogue]]
speaker = "unk"
original = "――モフモフ。"
translation = "――쓰다듬쓰다듬."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こややっ！？」"
translation = "「코야앗!?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そ、そんな尻尾をモフモフしちゃダメです……！\u3000こやぁ～……<emoji=heart04>」"
translation = "「그, 그런 꼬리를 쓰다듬으시면 안 돼요……! 코야아～……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「本当に反射やろか？\u3000ふふっ♪」"
translation = "「정말로 반사일까나? 후후♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「うぅぅ～……！」"
translation = "「우으으～……!」"

[[dialogue]]
speaker = "unk"
original = "その時――再び鈴が鳴った。"
translation = "그때――다시 방울이 울렸다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……ヨミ」"
translation = "「……요미」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやっ！？\u3000な、なんでしょう……？」"
translation = "「코얏!? 무, 무슨 일이신가요……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いい匂いがするな」"
translation = "「좋은 냄새가 나네」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「！！！！！！」"
translation = "「!!!!!!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「近くで嗅いでもいいか？」"
translation = "「가까이서 맡아봐도 될까?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやややややぁぁぁぁ～～っ！？」"
translation = "「코야야야야야아아아아～～앗!?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「次の願望みたいやねぇ♪」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くんくん」"
translation = "「킁킁」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ひゃうっ！？」"
translation = "「히얏!?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うん……安心する、俺の大好きな匂いだ」"
translation = "「응…… 안심돼, 내가 정말 좋아하는 냄새야」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「～～～～～～っ！！」"
translation = "「～～～～～～앗!!」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「なるほどなぁ♪\u3000ヨミはん、自分が匂いを嗅ぎたいだけやなくて――」"
translation = "「과연 그렇구만♪ 요미 양, 자신이 냄새를 맡고 싶을 뿐만 아니라――」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「会長はんにも同じように嗅いで欲しかったんやねぇ♪」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「爆裂ちがいますぅぅぅっ！！」"
translation = "「폭렬 아니거든요오오엇!!」"

[[dialogue]]
speaker = "unk"
original = "すると、慌てるヨミの手の中で鈴がさらに強く鳴り響く。"
translation = "그러자, 당황하는 요미의 손안에서 방울이 더욱 강하게 울려 퍼진다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヨミ」"
translation = "「요미」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「まだあるんですか！？」"
translation = "「또 있는 건가요!?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「今日は離れたくない」"
translation = "「오늘은 떨어지고 싶지 않아」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「え」"
translation = "「에」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「今夜はずっと――ヨミと一緒にいたい」"
translation = "「오늘 밤은 계속――요미랑 같이 있고 싶어」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやややあああぁ――――っ！？」"
translation = "「코야야야아아아――――앗!?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「あらまぁ<emoji=heart04>」"
translation = "「어머나<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「これは大物の願望が出てきたなぁ♪」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「違いますっ！！」"
translation = "「아닙니다!!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「違いますけど違わなくないですけど違うんですーーーっ！！！」"
translation = "「아니지만 안 아닌 것도 아니지만 아니거든요ーーー앗!!!」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「どっちなんやろなぁ♪」"
translation = "「어느 쪽일까나♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「もう勘弁してくださいぃぃぃっ！！！」"
translation = "「이제 봐주세요오오오앗!!!」"

[[dialogue]]
speaker = "unk"
original = "ヨミは慌てて鈴を押さえ込み、必死に力を制御する。"
translation = "요미는 서둘러 방울을 억눌러, 억지로 힘을 제어한다."

[[dialogue]]
speaker = "unk"
original = "数秒後。"
translation = "몇 초 후."

[[dialogue]]
speaker = "unk"
original = "ようやく鈴の光が収まった。"
translation = "겨우 방울의 빛이 가라앉았다."

[[dialogue]]
speaker = "unk"
original = "俺は一体何を……？"
translation = "내가 대체 무슨 짓을……?"

[[dialogue]]
speaker = "unk"
original = "……あれ？"
translation = "……어라?"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長っ！\u3000さっきまでのことは忘れてくださいぃ～～っ！！」"
translation = "「회장님! 방금 전까지의 일은 잊어주세요오～～앗!!」"

[[dialogue]]
speaker = "unk"
original = "顔を真っ赤にしながら叫ぶヨミに、俺は首を傾げる。"
translation = "얼굴이 새빨개진 채 외치는 요미를 보며, 나는 고개를 갸웃거린다."

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「残念やけど、うちは忘れられへんなぁ♪」"
translation = "「안타깝지만, 난 못 잊겠는걸♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやぁっ！？」"
translation = "「코야앗!?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「でもな、ヨミはん」"
translation = "「하지만 말야, 요미 양」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「え？」"
translation = "「에?」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「煩悩があるいうんは、叶えたい願いがあるっていうことや」"
translation = "「번뇌가 있다는 건, 이루고 싶은 소원이 있다는 뜻이야」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「誰かと仲ようなりたい。もっと近付きたい――」"
translation = "「누군가와 사이좋아지고 싶다. 더 가까워지고 싶다――」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「そう思うこと自体は、何も恥ずかしいことやあらへんよ」"
translation = "「그렇게 생각하는 것 자체는, 전혀 부끄러운 게 아니란다」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「せやから、ヨミはんはもうちょっと素直になってもええと思うなぁ♪」"
translation = "「그러니까, 요미 양은 좀 더 솔직해져도 괜찮다고 생각해♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……はい」"
translation = "「……네」"

[[dialogue]]
speaker = "unk"
original = "ヨミはちらりと俺を見て、照れながら言う。"
translation = "요미는 힐끔 나를 보고는, 수줍어하며 말한다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「少しずつ……頑張ってみます」"
translation = "「조금씩…… 노력해 볼게요」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ふふっ♪\u3000それでええんよ<emoji=heart04>\u3000また困ったことがあったら、いつでも相談しに来ぃや♪」"
translation = "「후후♪ 그걸로 된 거야<emoji=heart04> 또 곤란한 일이 있으면, 언제든 상담하러 오렴♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい。ありがとうございます、ミヤハルさん」"
translation = "「네. 감사합니다, 미야하루 씨」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「それに、スケベなお悩み相談やったら、うちは大得意やしなぁ♪」"
translation = "「게다가, 음란한 고민 상담이라면 내 전문 분야이기도 하고 말야♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こややっ！？\u3000す、スケベって……！」"
translation = "「코야앗!? 음, 음란이라니……!」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「ヨミはん、思った以上にスケベみたいやしなぁ<emoji=heart04>」"
translation = "「요미 양, 생각했던 것 이상으로 음란한 모양이네<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミヤハル"
speaker_translation = "미야하루"
original = "「うち、前よりずっと親近感が湧いたわぁ<emoji=heart04>\u3000これからもっと仲ようなれそうやわ♪」"
translation = "「나, 전보다 훨씬 친근감이 생겼어<emoji=heart04> 앞으로 더 사이좋아질 수 있을 것 같네♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こややあああぁ～～っ！？」"
translation = "「코야야아아아～～앗!?」"

[[dialogue]]
speaker = "unk"
original = "こうしてヨミは、巫女としてだけでなく、別の意味でもミヤハルと親交を深めるのであった。"
translation = "이렇게 해서 요미는, 무녀로서뿐만 아니라, 다른 의미로도 미야하루와 친분을 다지는 것이었다."

