[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「会長ちゃん、召し上がれ～♪」"
translation = "「회장짱, 드세요~♪」"

[[dialogue]]
speaker = "unk"
original = "夜のカフェテリアで、サランが試作した新作プリンを食べる。"
translation = "밤의 카페테리아에서 사란이 시작한 신작 푸딩을 먹는다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「美味しい……！！」"
translation = "「맛있어……!!」"

[[dialogue]]
speaker = "unk"
original = "ただのプリンではなく、たっぷり入れたスパイスと、砂糖やミルクの甘さが調和した独特の味わいだ。"
translation = "단순한 푸딩이 아니라 듬뿍 넣은 향신료와 설탕이나 밀크의 달콤함이 조화를 이룬 독특한 맛이다."

[[dialogue]]
speaker = "unk"
original = "人を選びそうな味なのに、食べれば食べるほど、もっと欲しくなる。スプーンが止まらない。"
translation = "취향을 탈 만한 맛인데도 먹으면 먹을수록 더 원하게 된다. 스푼이 멈추지 않는다."

[[dialogue]]
speaker = "unk"
original = "暴食の魔将となったサランが到達した、悪魔的な一品だ。"
translation = "폭식의 마장이 된 사란이 도달한 악마적인 일품이다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ならよかった～。サランもいただきま～す♪」"
translation = "「그러면 다행이다~. 사란도 잘 먹겠습니다~♪」"

[[dialogue]]
speaker = "unk"
original = "サランが自分で作ったプリンをスプーンですくい、口に運ぶ。"
translation = "사란이 직접 만든 푸딩을 스푼으로 떠서 입으로 운반한다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「うん、おいし～<emoji=heart04>」"
translation = "「응, 맛있어~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "唇をペロリと舐め、蠱惑的な笑みを浮かべるサラン。"
translation = "입술을 낼름 핥고 현혹적인 미소를 짓는 사란."

[[dialogue]]
speaker = "unk"
original = "今まで見せたことのなかった表情にドキリとしてしまう。"
translation = "지금까지 보여준 적 없던 표정에 두근거리고 만다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「はぁ～……<emoji=heart04>\u3000体、熱くなってきたかも～<emoji=heart04>」"
translation = "「하아~……<emoji=heart04> 몸, 뜨거워진 것 같을지도~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "美食酔いのせいか、サランの顔がほんのり上気する。"
translation = "미식에 취해서인지 사란의 얼굴이 살짝 상기된다."

[[dialogue]]
speaker = "unk"
original = "露出の大きな魔将フォームと相まって、情欲をかき立てられる。"
translation = "노출이 큰 마장 폼과 어우러져 정욕을 자극한다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「美味しいもの、もっともっと食べたいなぁ～<emoji=heart04>」"
translation = "「맛있는 거 더 많이 먹고 싶네~<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「え……？」"
translation = "「어……?」"

[[dialogue]]
speaker = "unk"
original = "サランは机の下に潜り込むと、俺のズボンに手をかけて──"
translation = "사란은 책상 밑으로 기어들어가 내 바지에 손을 대고──"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ぺろっ<emoji=heart04>」"
translation = "「할짝<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くぁっ……！？」"
translation = "「크앗……!?」"

[[dialogue]]
speaker = "unk"
original = "サランがいたずらっぽい表情を浮かべ、亀頭を舐めた。"
translation = "사란이 장난스러운 표정을 지으며 귀두를 핥았다."

[[dialogue]]
speaker = "unk"
original = "しかも逃がさないと言わんばかりに、ペニスを大きなおっぱいで挟んでいる。"
translation = "게다가 놓치지 않겠다는 듯이 자지를 커다란 가슴으로 감싸고 있다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「えへへ～♪\u3000会長ちゃんのおち○ぽ、とっても元気～♪」"
translation = "「에헤헤~♪ 회장짱의 자지, 엄청 쌩쌩해~♪」"

[[dialogue]]
speaker = "unk"
original = "怒張した下半身で、サランのおっぱいの柔らかさを直に味わう。"
translation = "발기한 하반신으로 사란의 가슴의 부드러움을 직접 느낀다."

[[dialogue]]
speaker = "unk"
original = "おっぱいはむっちりしているのにふわふわで、極上のお菓子のようだ。"
translation = "가슴은 빵빵하면서도 폭신폭신해서 최상급 과자 같다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ぺろ、れる……んれろ<emoji=heart04>\u3000ちろちろ<emoji=heart04>\u3000あはぁ……会長ちゃんのおち○ぽ、おいし～<emoji=heart04>」"
translation = "「할짝, 낼름…… 낼름<emoji=heart04> 핥짝핥짝<emoji=heart04> 아하아…… 회장짱의 자지, 맛있어~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "亀頭を舐め、うっとりとした声を漏らすサラン。"
translation = "귀두를 핥으며 황홀한 목소리를 내는 사란."

[[dialogue]]
speaker = "unk"
original = "甘い声と快感で、ペニスがさらにいきり立つ。"
translation = "달콤한 목소리와 쾌감으로 자지가 더욱 우뚝 선다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「へろ……れろ……ちゅっ<emoji=heart04>\u3000カリのところも……ぺろ<emoji=heart04>」"
translation = "「할짝…… 낼름…… 쪽<emoji=heart04> 귀두 테두리 부분도…… 할짝<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うっ……！」"
translation = "「윽……!」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ここもおいし～<emoji=heart04>\u3000あ、おっぱいの中でおち○ぽビクンってして、大きくなったぁ～<emoji=heart04>\u3000こうしてると、おっぱいでおち○ぽ食べてるみたい～<emoji=heart04>」"
translation = "「여기 도 맛있어~<emoji=heart04> 아, 가슴 속에서 자지가 꿈틀하고 커졌어~<emoji=heart04> 이러고 있으니까 가슴으로 자지를 먹고 있는 것 같아~<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「うふふ<emoji=heart04>\u3000おち○ぽ熱くて、硬くて、おいし～って、サランのおっぱいが言ってるよ～？」"
translation = "「우후후<emoji=heart04> 자지가 뜨겁고 딱딱해서 맛있어~라고 사란의 가슴이 말하고 있어~?」"

[[dialogue]]
speaker = "unk"
original = "ペニスの感触を味わうように、左右の乳房をぎゅっと寄せる。"
translation = "자지의 감촉을 맛보듯 양쪽 젖가슴을 꽉 모은다."

[[dialogue]]
speaker = "unk"
original = "するとサランのおっぱいが強く押し付けられ、その柔らかさでドクンと脈打った。"
translation = "그러자 사란의 가슴이 강하게 눌려 그 부드러움으로 쿵쾅하고 맥박쳤다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「あぁん<emoji=heart04>\u3000会長ちゃんのおち○ぽも、おっぱいおいし～って、言ってるよ～」"
translation = "「아앙<emoji=heart04> 회장짱의 자지도 가슴 맛있어~라고 말하고 있어~」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「あ……先っぽからおつゆ出てきた～。じゃあ～……ぺろっ」"
translation = "「아…… 끝에서 쿠퍼액 나왔다~. 그럼~…… 할짝」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ん～～～～<emoji=heart04><emoji=heart04>\u3000おち○ぽのおつゆ、おいし～<emoji=heart04>」"
translation = "「응~~~~<emoji=heart04><emoji=heart04> 자지의 쿠퍼액, 맛있어~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "鈴口からにじんできた先走りを味わい、歓喜に震えるサラン。"
translation = "요도구에서 배어 나온 쿠퍼액을 맛보고 환희에 떠는 사란."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「会長ちゃんの美味しいおち○ぽ、もっと食べたいなぁ～<emoji=heart04>」"
translation = "「회장짱의 맛있는 자지, 더 먹고 싶네~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "サランの顔に浮かぶ恍惚の色が深くなり、獲物を狙う目で俺を見る。"
translation = "사란의 얼굴에 떠오른 황홀한 기색이 깊어져 먹잇감을 노리는 눈으로 나를 본다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あの……サラン？\u3000ここカフェテリアだし、少し待って──」"
translation = "「저기…… 사란? 여기 카페테리아고, 조금만 기다려──」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「いただきま～す。あ～……」"
translation = "「잘 먹겠습니다~. 아~……」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「あ～むっ<emoji=heart04>\u3000んじゅっ<emoji=heart04>\u3000んっ……ふっ……じゅるる<emoji=heart04>」"
translation = "「아~음<emoji=heart04> 꿀꺽<emoji=heart04> 응…… 후…… 쯥쯥<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くううぅっ……！！」"
translation = "「크으으으윽……!!」"

[[dialogue]]
speaker = "unk"
original = "サランは有無を言わさずペニスを咥え、さらに胸を上下させて刺激を与えてくる。"
translation = "사란은 다짜고짜 자지를 입에 물고 더욱 가슴을 위아래로 움직여 자극을 준다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んじゅるっ<emoji=heart04>\u3000じゅるれる、ちゅぱっ……んん、ふぅ……じゅぷるるっ<emoji=heart04>\u3000んふふ、サランの口の中で、ビクビクしてる～<emoji=heart04>」"
translation = "「쯥쯥<emoji=heart04> 낼름낼름, 쪽…… 응응, 후우…… 쪽쪽<emoji=heart04> 응후후, 사란의 입안에서 꿈틀꿈틀하고 있어~<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「じゅぷっ、じゅっ、んんっ……<emoji=heart04>\u3000へるれる、じゅるっ<emoji=heart04>\u3000会長ちゃんのおち○ぽ、おいし～<emoji=heart04>\u3000んっ、ちゅるれるっ<emoji=heart04>」"
translation = "「쯥, 쪽, 응응……<emoji=heart04> 핥짝, 쯥<emoji=heart04> 회장짱의 자지, 맛있어~<emoji=heart04> 응, 낼름낼름<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "胸に挟みながらペニスをしゃぶり、嬉しそうな声を漏らすサラン。"
translation = "가슴에 끼운 채 자지를 빨며 기쁜 목소리를 내는 사란."

[[dialogue]]
speaker = "unk"
original = "竿の部分がボリュームのあるおっぱいに包まれ、亀頭を唾液たっぷりの口内で刺激され、瞬く間に射精欲が高まっていく。"
translation = "기둥 부분이 볼륨 있는 가슴에 감싸이고 귀두를 침이 듬뿍 묻은 입안에서 자극받아 순식간에 사정 욕구가 높아져 간다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んふっ<emoji=heart04>\u3000おち○ぽ、口の中で、大きくなってぇ……<emoji=heart04>\u3000んむっ<emoji=heart04>\u3000じゅるるっ<emoji=heart04>\u3000んんふっ、じゅっ、じゅぷるっ<emoji=heart04>」"
translation = "「응후<emoji=heart04> 자지, 입안에서 커져서……<emoji=heart04> 응음<emoji=heart04> 쯥쯥<emoji=heart04> 응응후, 쯥, 쪽쪽<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くっ……待って、それ、強い……っ」"
translation = "「큭…… 잠깐, 그거, 세……윽」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「何か言った～？\u3000じゅくるるるっ……！」"
translation = "「뭐라고 했어~? 쯥쯥쯥……!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うぁあっ……！？」"
translation = "「우아앗……!?」"

[[dialogue]]
speaker = "unk"
original = "俺の制止もサランの耳に入らず、ペニスを吸われて声を上げてしまった。"
translation = "나의 제지도 사란의 귀에 들어가지 않고, 자지를 빨려 목소리를 내고 말았다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふっ、んっ、んむぅっ<emoji=heart04>\u3000じゅるちゅぱっ、じゅっ、じゅるっ<emoji=heart04>\u3000んふぅ、んんむっ、じゅくっ、じゅるるん<emoji=heart04>」"
translation = "「후윽, 응윽, 응므윽<emoji=heart04> 쥬릅츄퍕, 쥬윽, 쥬릅<emoji=heart04> 응후, 응응므, 쥬륵, 쥬르릉<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んっ、じゅる、会長ちゃんのおち○ぽ好きぃ<emoji=heart04>\u3000もっと、もっとぉ……んむっ、じゅぷっ、んじゅくるっ<emoji=heart04>」"
translation = "「응윽, 쥬릅, 회장짱의 자지 좋아<emoji=heart04> 더, 더…… 응므, 쥬퍕, 응쥬륵<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "『暴食』に染まり、口いっぱいにペニスを頬張るサラン。"
translation = "『폭식』에 물들어, 입 가득 자지를 볼볼이 머금는 사란."

[[dialogue]]
speaker = "unk"
original = "サランが俺を味わっていることに興奮しながらも、捕食されているようにも感じた。"
translation = "사란이 나를 맛보고 있다는 것에 흥분하면서도, 포식당하고 있는 것처럼도 느껴졌다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んんっ<emoji=heart04>\u3000またおつゆ出てきたぁ……<emoji=heart04>\u3000会長ちゃんの味、おいし～<emoji=heart04>\u3000んじゅっ、んふっ<emoji=heart04>」"
translation = "「응응<emoji=heart04> 또 즙 나왔다……<emoji=heart04> 회장짱의 맛, 맛있어~<emoji=heart04> 응쥬, 응후<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「じゅぷじゅる、おつゆたくさん……じゅっ、じゅぷっ、じゅるぅっ<emoji=heart04>\u3000もっと出して、じゅくじゅる……<emoji=heart04>」"
translation = "「쥬퍕쥬릅, 즙 잔뜩…… 쥬윽, 쥬퍕, 쥬르윽<emoji=heart04> 더 내줘, 쥬륵쥬릅……<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「それじゃあ～……じゅるるっ──！！」"
translation = "「그럼 말이야~~…… 쥬르륵──!!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うあぁああっ！？」"
translation = "「우아아아앗!?」"

[[dialogue]]
speaker = "unk"
original = "亀頭を強く吸われ、頭が真っ白になりそうな刺激にまた情けない声が漏れる。"
translation = "귀두를 강하게 빨려, 머리가 하얗게 될 것 같은 자극에 또 한심한 목소리가 새어나온다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふふ<emoji=heart04>\u3000おち○ぽ、またビクビクしてる～<emoji=heart04>\u3000んじゅっ、じゅる<emoji=heart04>\u3000また吸っちゃお～……じゅるるる～っ<emoji=heart04>」"
translation = "「후후<emoji=heart04> 자지, 또 찌릿찌릿거려~<emoji=heart04> 응쥬, 쥬릅<emoji=heart04> 또 빨아버려야지~…… 쥬르르르~앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くあぁああっ……！！\u3000出る、出るからっ……ううぅっ……！」"
translation = "「쿠아아아앗……!! 나온다, 나올 테니까…… 우우윽……!」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んふふふっ<emoji=heart04>\u3000らしていいよ～<emoji=heart04>\u3000れるっ、ちゅぷっ、じゅぷるる<emoji=heart04>\u3000じゅるれるっ、じゅっぷ、じゅぅっ<emoji=heart04>」"
translation = "「응후후후<emoji=heart04> 나와도 돼~<emoji=heart04> 나온다, 츄퍕, 쥬퍕르르<emoji=heart04> 쥬릅나온다, 쥬퍕, 쥬욱<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "あまりの快感に腰を引こうとするが、サランは胸をぎゅっと寄せて逃がさない。"
translation = "지나친 쾌감에 허리를 빼려고 하지만, 사란은 가슴을 꽉 끌어안아 놓아주지 않는다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ら～め<emoji=heart04>\u3000じゅるじゅるじゅぱっ<emoji=heart04>\u3000じゅっぷ<emoji=heart04>\u3000じゅぷ<emoji=heart04>\u3000じゅぷ<emoji=heart04>」"
translation = "「아~ 안 돼<emoji=heart04> 쥬릅쥬릅쥬빰<emoji=heart04> 쥬웁<emoji=heart04> 쥬읍<emoji=heart04> 쥬읍<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「出して出して～<emoji=heart04>\u3000んっ、ふっ<emoji=heart04>\u3000んじゅるっ<emoji=heart04>\u3000んんっ、んっ、じゅるじゅぱっ<emoji=heart04>\u3000じゅくるる～～っ<emoji=heart04>」"
translation = "「내보내줘 내보내줘~<emoji=heart04> 응, 후윽<emoji=heart04> 응쥬릅<emoji=heart04> 응응, 응, 쥬릅쥬빰<emoji=heart04> 쥬쿨쿨~~읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "精液をねだりながらペニスを吸われ、それがトドメとなって──"
translation = "정액을 애원하며 페니스를 빨아대고, 그것이 결정타가 되어──"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「～～～～～っ！！」"
translation = "「~~~~~읏!!」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んん～～～～っ<emoji=heart04><emoji=heart04>」"
translation = "「응응~~~~읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "こらえ切れず射精し、サランが口で受け止める。"
translation = "참지 못하고 사정하여, 사란이 입으로 받아낸다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んんっ……ん……ふぅっ……<emoji=heart04>\u3000んくっ……んっ……ごくん<emoji=heart04>」"
translation = "「응응……응……후우……<emoji=heart04> 응큼……응……꿀꺽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "口内に注がれた精液を味わい、うっとりとした吐息を漏らす。"
translation = "구강 내에 poured 정액을 맛보며, 황홀한 숨결을 내뱉는다."

[[dialogue]]
speaker = "unk"
original = "そして喉を鳴らし、一滴残らず飲み込んだ。"
translation = "그리고 목을 울리며, 한 방울도 남김없이 삼켰다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「会長ちゃんのせーえき、とってもおいしい～<emoji=heart04><emoji=heart04>\u3000サラン、会長ちゃんのおち○ぽもせーえきも大好き～<emoji=heart04><emoji=heart04>」"
translation = "「회장짱의 정액, 엄청 맛있어~<emoji=heart04><emoji=heart04> 사란, 회장짱의 자지도 정액도 너무 좋아~<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「でも……もっと出せるよね～<emoji=heart04><emoji=heart04>」"
translation = "「하지만…… 더 낼 수 있지~<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "サランの眼が妖しく光り、ゾクッと背筋が震える。"
translation = "사란의 눈이 요염하게 빛나고, 오싹하게 등골이 휜다."

[[dialogue]]
speaker = "unk"
original = "そしてまたペニスを咥えて──"
translation = "그리고 다시 페니스를 물고서──"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んじゅっ<emoji=heart04>\u3000じゅるっ<emoji=heart04>\u3000んんっ<emoji=heart04>\u3000じゅるるるっ<emoji=heart04>\u3000じゅくっ<emoji=heart04>\u3000んっ、ふっ、じゅるるんっ<emoji=heart04>」"
translation = "「응쥬<emoji=heart04> 쥬릅<emoji=heart04> 응응<emoji=heart04> 쥬르르륵<emoji=heart04> 쥬욱<emoji=heart04> 응, 후, 쥬르릉<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ま、待って……！\u3000うぁっ……出した、ばかりだから……」"
translation = "「기, 기다려……! 우앗…… 방금, 냈으니까……」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「待てないの～<emoji=heart04>\u3000じゅっ<emoji=heart04>\u3000んじゅっぷ<emoji=heart04>\u3000んんっ、ふっ、じゅるじゅる<emoji=heart04>\u3000れるじゅる<emoji=heart04>」"
translation = "「못 기다려~<emoji=heart04> 쥬<emoji=heart04> 응쥬웁<emoji=heart04> 응응, 후, 쥬릅쥬릅<emoji=heart04> 낼름쥬릅<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺のことはお構いなしに、胸と口でペニスを激しく嬲る。"
translation = "나에 대한 건 아랑곳하지 않고, 가슴과 입으로 페니스를 격렬하게 농락한다."

[[dialogue]]
speaker = "unk"
original = "射精した直後のペニスを揉みくちゃにされ、文字通り壊れるかと思った。"
translation = "사정한 직후의 페니스를 쥐어짜여, 문자 그대로 부서지는 줄 알았다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んんっ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000じゅぷっ<emoji=heart04>\u3000じゅぱっ<emoji=heart04>\u3000ちゅるれる、じゅっぷっ<emoji=heart04>\u3000んじゅっ、じゅっ、じゅっく<emoji=heart04>」"
translation = "「응응<emoji=heart04> 응<emoji=heart04> 쥬읍<emoji=heart04> 쥬빰<emoji=heart04> 츄르낼름, 쥬웁<emoji=heart04> 응쥬, 쥬, 쥬욱<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んふっ<emoji=heart04>\u3000また先走りのおつゆ出てきた～<emoji=heart04>\u3000じゅれろ……おち○ぽに残ったせーえきの味する～<emoji=heart04>\u3000じゅぷっ<emoji=heart04>\u3000エッチな味して、おいし～<emoji=heart04>」"
translation = "「응후<emoji=heart04> 또 쿠퍼액 나왔어~<emoji=heart04> 쥬르르…… 자지에 남은 정액 맛이 나~<emoji=heart04> 쥬읍<emoji=heart04> 야한 맛이 나서, 맛있어~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "恍惚とした表情で、心底美味しそうにペニスをしゃぶり続けるサラン。"
translation = "황홀한 표정으로, 진심으로 맛있다는 듯이 페니스를 계속 빨아대는 사란."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んぶっ<emoji=heart04>\u3000じゅるっ<emoji=heart04>\u3000んっ、んっ<emoji=heart04>\u3000サランのおっぱいの中で、おち○ぽビクビクしてる～<emoji=heart04>\u3000これ好き～<emoji=heart04>」"
translation = "「응붑<emoji=heart04> 쥬릅<emoji=heart04> 응, 응<emoji=heart04> 사란의 가슴 안에서, 자지가 찌릿찌릿하고 있어~<emoji=heart04> 이거 좋아~<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「じゅっぷ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000ぐちゅぷっ<emoji=heart04>\u3000んんっ<emoji=heart04>\u3000んじゅぷっ<emoji=heart04>\u3000じゅるっ<emoji=heart04>\u3000ぐぷっ<emoji=heart04>\u3000んふぅ<emoji=heart04>\u3000んじゅくっ<emoji=heart04>\u3000じゅぷるるるっ<emoji=heart04>」"
translation = "「쥬웁<emoji=heart04> 응<emoji=heart04> 구츄읍<emoji=heart04> 응응<emoji=heart04> 응쥬웁<emoji=heart04> 쥬릅<emoji=heart04> 구읍<emoji=heart04> 응후<emoji=heart04> 응쥬욱<emoji=heart04> 쥬퓌르르륵<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「会長ちゃんのおち○ぽおいし～<emoji=heart04>\u3000好き～<emoji=heart04>\u3000んじゅ<emoji=heart04>\u3000じゅぷっ<emoji=heart04>\u3000ぐちゅぷっ<emoji=heart04>」"
translation = "「회장짱의 자지 맛있어~<emoji=heart04> 좋아~<emoji=heart04> 응쥬<emoji=heart04> 쥬읍<emoji=heart04> 구츄읍<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「じゅくれるっ<emoji=heart04>\u3000へるるっ<emoji=heart04>\u3000せーえきも好き～<emoji=heart04>\u3000先走りも好き～<emoji=heart04>\u3000んじゅぷっ<emoji=heart04>\u3000会長ちゃんは、全部美味しくて好き～<emoji=heart04>」"
translation = "「쮸웁<emoji=heart04> 핥짝<emoji=heart04> 정액도 좋아～<emoji=heart04> 쿠퍼액도 좋아～<emoji=heart04> 쮸웁<emoji=heart04> 회장 찬은 전부 맛있어서 좋아～<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「だからもっと、じゅるっ<emoji=heart04>\u3000出して出して～<emoji=heart04>\u3000じゅくっ、じゅるっ<emoji=heart04>\u3000ちゅぷれろっ<emoji=heart04>\u3000むじゅるじゅぷっ<emoji=heart04>」"
translation = "「니까 더, 쮸릅<emoji=heart04> 내줘 내줘～<emoji=heart04> 쮸욱, 쮸릅<emoji=heart04> 츄릅핥짝<emoji=heart04> 쮸루쮸웁<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "暴食に目覚めたサランは俺を味わうことに夢中で、乱暴に責めてくる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そのせいで、さっき出したばかりなのにまた精液が尿道を上ってきた。"
translation = "그 바람에, 방금 냈을 뿐인데 또 정액이 요도를 거슬러 올라왔다."

[[dialogue]]
speaker = "unk"
original = "しかもさっきよりも熱く、濃くて、爆発しそうな情動がせり上がってくる。"
translation = "게다가 방금보다 뜨겁고, 짙어서, 폭발할 것 같은 정동이 밀려 올라온다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んふふ<emoji=heart04>\u3000おち○ぽ脈打って～、せーえきまた出そうなんだね～<emoji=heart04>\u3000んっ、んじゅっ<emoji=heart04>\u3000じゃあ～……」"
translation = "「응후후<emoji=heart04> 자지 맥박치면서～, 정액 또 나올 것 같네～<emoji=heart04> 응, 쮸읍<emoji=heart04> 그럼～……」"

[[dialogue]]
speaker = "unk"
original = "サランが舌先を尖らせ、縦に割れた鈴口をほじくるように舐める。"
translation = "사란이 혀끝을 뾰족하게 만들어, 세로로 갈라진 귀두 구멍을 파헤치듯 핥는다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んれぇ～ろ<emoji=heart04>」"
translation = "「으응핥~짝<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「～～～～～っ！！？」"
translation = "「～～～～～읏!!?」"

[[dialogue]]
speaker = "unk"
original = "強烈過ぎる刺激に、本当にペニスが壊れたのかと思った。"
translation = "너무 강렬한 자극에, 정말로 페니스가 부서진 게 아닌가 생각했다."

[[dialogue]]
speaker = "unk"
original = "おもらしするように先走りを吐き出し、それをサランが受け止める。"
translation = "지려버리듯 쿠퍼액을 뱉어내고, 그것을 사란이 받아낸다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ん～～～～っ<emoji=heart04><emoji=heart04>\u3000先走り、おいし～～<emoji=heart04><emoji=heart04>\u3000じゅるるっ<emoji=heart04>\u3000んっ<emoji=heart04>\u3000じゅぷっ<emoji=heart04>\u3000もっと出して～<emoji=heart04>」"
translation = "「응～～～～읏<emoji=heart04><emoji=heart04> 쿠퍼액, 맛있어～～<emoji=heart04><emoji=heart04> 쮸루룹<emoji=heart04> 응<emoji=heart04> 쮸웁<emoji=heart04> 더 내줘～<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「じゅぷじゅるっ<emoji=heart04>\u3000じゅりゅりゅ<emoji=heart04>\u3000んっ、んむ、んぶっ<emoji=heart04>\u3000ぜんぶ出して出して～<emoji=heart04>\u3000せーえき欲しいの～<emoji=heart04>」"
translation = "「쮸웁쮸릅<emoji=heart04> 쮸료료<emoji=heart04> 응, 으음, 읍<emoji=heart04> 전부 내줘 내줘～<emoji=heart04> 정액 갖고 싶어～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "いつものサランからは想像できない、精液を搾り取ることしか考えていない暴力的なパイズリフェラ。"
translation = "평소의 사란에게선 상상할 수 없는, 정액을 쥐어짜 낼 생각밖에 없는 폭력적인 파이즈리 펠라."

[[dialogue]]
speaker = "unk"
original = "このままでは俺の体液を全部サランに吸われてしまう──そんな錯覚すら覚える。"
translation = "이대로라면 내 체액을 전부 사란에게 빨려버린다──그런 착각마저 든다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んんっ<emoji=heart04>\u3000んっ、んっ<emoji=heart04>\u3000んじゅっ<emoji=heart04>\u3000んじゅぷるるっ<emoji=heart04>\u3000んっ──んっ──んんんっ<emoji=heart04>」"
translation = "「응응<emoji=heart04> 응, 응<emoji=heart04> 쮸읍<emoji=heart04> 쮸웁쁘르<emoji=heart04> 응──응──응응응<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ボリュームたっぷりの乳房を強く押し付けられ、ペニスが潰れるかと思った。"
translation = "볼륨 가득한 가슴을 강하게 눌러대어, 페니스가 으깨지는가 싶었다."

[[dialogue]]
speaker = "unk"
original = "肉の塊でぎゅうっと絞られ、爆発寸前に熱が膨れ上がる。"
translation = "고깃덩어리로 꽉 쥐어짜여, 폭발 직전에 열기가 부풀어 오른다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んじゅぷっ<emoji=heart04>\u3000んんっ<emoji=heart04>\u3000じゅるじゅるぅ<emoji=heart04>\u3000うふふ～<emoji=heart04>\u3000おち○ぽドクンドクンしてる～<emoji=heart04>\u3000ぐちゅぷっ、サランのお口に全部出して～<emoji=heart04>」"
translation = "「쮸웁<emoji=heart04> 응응<emoji=heart04> 쮸릅쮸릅<emoji=heart04> 우후후～<emoji=heart04> 자지 두근두근하고 있어～<emoji=heart04> 쮸부욱, 사란의 입에 전부 내줘～<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「じゅぷっ<emoji=heart04>\u3000じゅっ<emoji=heart04>\u3000出して出して～<emoji=heart04>\u3000じゅれろっ<emoji=heart04>\u3000んふっ、んっ<emoji=heart04>\u3000じゅぷるっ<emoji=heart04>\u3000じゅるる～っ<emoji=heart04>」"
translation = "「쮸웁<emoji=heart04> 쮸읏<emoji=heart04> 내줘 내줘～<emoji=heart04> 쮸렠<emoji=heart04> 응후, 응<emoji=heart04> 쮸웁<emoji=heart04> 쮸루루～읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「らしてらしてらして～<emoji=heart04><emoji=heart04>\u3000んじゅぷっ<emoji=heart04>\u3000じゅぅっ<emoji=heart04>\u3000じゅるじゅるじゅるっ──じゅるるる～～～～っ<emoji=heart04><emoji=heart04>」"
translation = "「래줘래줘래줘～<emoji=heart04><emoji=heart04> 쮸웁<emoji=heart04> 쮸우<emoji=heart04> 쮸릅쮸릅쮸릅──쮸루루루～～～～읏<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そしてもう一度、下半身が壊れるほど強く吸われて──"
translation = "그리고 다시 한 번, 하반신이 부서질 정도로 강하게 빨려──"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んんん～～～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「응응응～～～～～～～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "口内に迸る精液の勢いに、軽く目を見開くサラン。"
translation = "입안으로 분출하는 정액의 기세에, 살짝 눈을 크게 뜨는 사란."

[[dialogue]]
speaker = "unk"
original = "だけど舌で精を受け止める度に、陶然とした表情に染まっていく。"
translation = "하지만 혀로 정액을 받아낼 때마다, 황홀한 표정으로 물들어 간다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「おち○ぽ、ドクドクしてる……<emoji=heart04>\u3000んっ……んっ……んん……ふぅ<emoji=heart04>」"
translation = "「자지, 두근두근하고 있어……<emoji=heart04> 응……응……응응……후우<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「じゅりゅ、じゅるぅ<emoji=heart04>\u3000くちゅ<emoji=heart04>\u3000せーえき、おいひ～<emoji=heart04>\u3000んくんくっ<emoji=heart04>\u3000会長ちゃんの味～<emoji=heart04>」"
translation = "「쮸료, 쮸류<emoji=heart04> 쮸웁<emoji=heart04> 정액, 마시쏘～<emoji=heart04> 꿀꺽꿀꺽<emoji=heart04> 회장 찬의 맛～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "尿道を熱い塊が駆け抜け、その快感に神経が焼かれる。"
translation = "요도를 뜨거운 덩어리가 달려나가고, 그 쾌감에 신경이 구워진다."

[[dialogue]]
speaker = "unk"
original = "ペニスの感覚が半分なくなってきて、二度と使い物にならなくなるんじゃないかとさえ思う。"
translation = "페니스의 감각이 절반쯤 사라져가서, 두 번 다시 쓸 수 없게 되는 게 아닐까 하는 생각마저 든다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「おっぱいでおち○ぽ搾ってあげるね～<emoji=heart04>\u3000んっ<emoji=heart04>\u3000んしょっ<emoji=heart04>」"
translation = "「가슴으로 자지 쥐어짜 줄게～<emoji=heart04> 응<emoji=heart04> 영차<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ううぅっ……！」"
translation = "「으우우읏……!」"

[[dialogue]]
speaker = "unk"
original = "サランがおっぱいをぎゅうっと押し付けながら、下から上へと動かし、ペニスから精液を絞り出す。"
translation = "사란이 가슴을 꽉 눌러대면서, 아래에서 위로 움직여, 페니스에서 정액을 쥐어짜 낸다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んふっ<emoji=heart04>\u3000せーえき出てきた～<emoji=heart04>\u3000ずずっ……じゅるるぅっ……！！」"
translation = "「응후<emoji=heart04> 정액 나왔다～<emoji=heart04> 쮸쮸룹……쮸루루읏……!!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くあああぁあっ──！？」"
translation = "「크아아아앗──!?」"

[[dialogue]]
speaker = "unk"
original = "あまりに強烈な吸引に、戦いの中でも出したことのない悲鳴を上げてしまう。"
translation = "너무나 강렬한 흡입에, 싸움 속에서도 질러본 적 없는 비명을 지르고 만다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「んんっ……ちゅぅちゅぅ……<emoji=heart04>」"
translation = "「응응……츄읍츄읍……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "射精の勢いが落ちてくると、サランは名残惜しそうに甘く吸う。"
translation = "사정의 기세가 떨어지자, 사란은 아쉽다는 듯 달콤하게 판다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「こくこく……んくっ……んっ……ごくんっ<emoji=heart04>」"
translation = "「꿀꺽꿀꺽……응읏……응……꿀꺽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そして喉を鳴らし、口の中に出された精を全て飲み込んだ。"
translation = "그리고 목을 울리며, 입안에 나온 정액을 전부 삼켰다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ごちそうさまでした～♪」"
translation = "「잘 먹었습니다～♪」"

[[dialogue]]
speaker = "unk"
original = "ようやくペニスから口を離すと、舌をペロリと舐めて不敵に笑う。"
translation = "겨우 페니스에서 입을 떼더니, 혀를 낼름 핥고는 사납게 웃는다."

[[dialogue]]
speaker = "unk"
original = "まるで贅を尽くしたフルコースを平らげた後のようだ。"
translation = "마치 사치를 다한 풀코스를 비워낸 후 같다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ふふふ～<emoji=heart04>\u3000美味しかったよ～、会長ちゃん<emoji=heart04>」"
translation = "「후후후～<emoji=heart04> 맛있었어～, 회장 찬<emoji=heart04>」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「おち○ぽちゃんもありがと～<emoji=heart04>\u3000ちゅっ<emoji=heart04>」"
translation = "「자지 찬도 고마워～<emoji=heart04> 쪽<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くぁっ……」"
translation = "「크앗……」"

[[dialogue]]
speaker = "unk"
original = "射精しすぎでくたくたになったペニスの先端に口付けされ、思わず呻きが漏れた。"
translation = "지나친 사정으로 흐물흐물해진 페니스 끝에 입맞춤당해, 나도 모르게 신음이 흘러나왔다."

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「またいっぱい食べさせてね～、会長ちゃん<emoji=heart04>」"
translation = "「또 많이 먹여줘～, 회장 찬<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker = "unk"
original = "もうろくに返事もできない。"
translation = "이제 제대로 대답도 할 수 없다."

[[dialogue]]
speaker = "unk"
original = "暴食の魔将の餌食となり、精魂尽き果てたのだった──"
translation = "폭식의 마장의 먹이가 되어, 정혼이 다하여 버린 것이었다──"

