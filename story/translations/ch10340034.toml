[[dialogue]]
speaker = "unk"
original = "第４話,カティアと見る世界,P"
translation = "제4화, 카티아와 보는 세계"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「シャ～～クッ！！」"
translation = "「샤～～크!!」"

[[dialogue]]
speaker = "unk"
original = "ある放課後、リィベルからモンスター出現の連絡を受け、カティア（と一緒にいた俺）は魔界に出撃した。"
translation = "어느 방과 후, 리벨로부터 몬스터 출현 연락을 받고 카티아(와 함께 있던 나)는 마계로 출격했다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「いっけ～！\u3000バウバンキッシュマーチ！！」"
translation = "「가라～! 바우 뱅키시 마치!!」"

[[dialogue]]
speaker_original = "犬の使い魔"
speaker_translation = "犬の使い魔"
original = "「バウバウバ～ウ！」"
translation = "「바우바우바～우!」"

[[dialogue]]
speaker = "unk"
original = "魔犬の群れがモンスターに殺到する。何度見ても圧巻の攻撃だ。かわいい。"
translation = "마견 무리가 몬스터에게 쇄도한다. 몇 번을 봐도 압권인 공격이다. 귀엽다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「わーっはっは！\u3000地獄の番犬の行進だベロス！\u3000恐れおののけ！」"
translation = "「와ー하하! 지옥의 파수견 행진이다 베로스! 두려워 떨지어다!」"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「シャ～～！？」"
translation = "「샤～～!?」"

[[dialogue]]
speaker = "unk"
original = "犬に飲まれてモンスターが見えなくなった。機械型モンスターでも、魔将の手にかかればこんなものだ。俺は必要なかったかもしれない。"
translation = "개떼에 파묻혀 몬스터가 보이지 않게 되었다. 기계형 몬스터라도 마장의 손에 걸리면 이 정도다. 나는 필요 없었을지도 모른다."

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「グオオオオォッ！」"
translation = "「크오오오오옷!」"

[[dialogue]]
speaker = "unk"
original = "危ない！"
translation = "위험해!"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「わっ！」"
translation = "「와앗!」"

[[dialogue]]
speaker = "unk"
original = "カティアを抱きかかえて、攻撃をかわす。モンスターは一体だけじゃなかったようだ。"
translation = "카티아를 껴안고 공격을 피한다. 몬스터는 한 마리뿐만이 아니었던 모양이다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様、ありがとうございます……」"
translation = "「마왕님, 감사합니다……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様、見ててください！\u3000あのモンスターも血祭りにあげてみせますガオ！！」"
translation = "「마왕님, 보고 계세요! 저 몬스터도 피의 제물로 바쳐 보이겠어 가오!!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔犬たちよ、吠えろ！\u3000地獄の底から轟け、ハウンドハウリングバースト！」"
translation = "「마견들이여, 짖어라! 지옥 밑바닥에서 울려 퍼져라, 하운드 하울링 버스트!」"

[[dialogue]]
speaker_original = "犬の使い魔"
speaker_translation = "犬の使い魔"
original = "「ワオーーーーン！！」"
translation = "「아오ーーーー응!!」"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「グギャァ……」"
translation = "「크갸아……」"

[[dialogue]]
speaker = "unk"
original = "魔力を帯びた咆哮がモンスターを粉砕し、巨体を跡形もなく消滅させた。以前とは段違いの攻撃力だ。"
translation = "마력을 띤 포효가 몬스터를 분쇄하고, 거구를 흔적도 없이 소멸시켰다. 이전과는 차원이 다른 공격력이다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふっふ～♪\u3000どうですか、魔王様。『強欲』の魔将の力は。これならすぐにプリマステラにもなれますよね？」"
translation = "「흣흣～♪ 어떠신가요, 마왕님. 『탐욕』의 마장의 힘은. 이 정도라면 금방 프리마스테라도 될 수 있겠죠?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「……え、どんなに強くても、隙だらけじゃプリマステラは難しい？\u3000そんなぁ～～、魔王様、厳しいです～～！」"
translation = "「……에, 아무리 강해도 허점투성이면 프리마스테라는 힘들다고요? 무슨 소릴요～～, 마왕님, 너무 엄격해요～～!」"

[[dialogue]]
speaker = "unk"
original = "今日は俺がいたからカバーできたけど、いつもできるとは限らない。プリマステラになれば１人で戦うことも増えるから、なおさらだ。"
translation = "오늘은 내가 있었으니 커버할 수 있었지만, 항상 그럴 수 있는 건 아니다. 프리마스테라가 되면 혼자 싸우는 일도 늘어나니까, 더더욱 그렇다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「強さも大事だけど、周りを見ることも大事……それは、はい、そうです……」"
translation = "「강함도 중요하지만 주변을 살피는 것도 중요…… 그건, 네, 맞아요……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「うぅ、ごめんなさい……魔王様は私を心配してくれてるのに、生意気言って……」"
translation = "「우으, 죄송해요…… 마왕님은 나를 걱정해 주시는 건데, 건방진 소릴 하고……」"

[[dialogue]]
speaker = "unk"
original = "分かってくれればいいんだ"
translation = "알아주면 된 거야"

[[dialogue]]
speaker = "unk"
original = "よしよし"
translation = "착하지 착해"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふふ……魔王様の手、だいすき<emoji=heart04>\u3000もっと撫でてください<emoji=heart04>」"
translation = "「후후…… 마왕님 손, 너무 좋아<emoji=heart04> 더 쓰다듬어 주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「撫で方、上手すぎですぅ……<emoji=heart04>\u3000くぅ～ん<emoji=heart04>」"
translation = "「쓰다듬는 솜씨가 너무 훌륭해요……<emoji=heart04> 킁～응<emoji=heart04>」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あ、ところで、これからどうします？\u3000リィベルが回収してくれるまで時間かかると思いますけど」"
translation = "「아, 그건 그렇고 이제 어쩌죠? 리벨이 회수하러 와줄 때까지 시간 오래 걸릴 것 같은데요」"

[[dialogue]]
speaker = "unk"
original = "深淵書庫の魔本の力では、流星市国へ帰るのは時間がかかるらしい。儀式の準備に数時間必要なのだとか。"
translation = "심연서고의 마도서 힘으로는 유성시국으로 돌아가는 데 시간이 걸리는 모양이다. 의식 준비에 몇 시간이 필요하다던가."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「もし他にやることなかったら、案内したいところがあるんですワン」"
translation = "「혹시 달리 할 일 없으시면 안내해 드리고 싶은 곳이 있다 멍」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ここ、実家から割と近くて……あ、実家には帰りません。畑仕事を手伝わされるので。景色のいいところがあって、ぜひ見てほしいんです」"
translation = "「여기, 본가에서 비교적 가까워서…… 아, 본가에는 안 돌아가요. 밭일 도와달라고 하니까. 경치 좋은 곳이 있어서 꼭 보여드리고 싶어요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「星騎士ならひとっ飛び……あ、魔王様、ちょっと思い付いたことがあって……」"
translation = "「성기사라면 단숨에 날아가서…… 아, 마왕님, 문득 생각난 게 있어서……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はい！\u3000ほらほら、魔王様、私の背中に！」"
translation = "「네! 자자, 마왕님, 제 등 뒤로!」"

[[dialogue]]
speaker = "unk"
original = "言われるままに背負われてしまった。後輩の、女の子に。"
translation = "말하는 대로 업혀 버렸다. 후배인, 여자아이에게."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「今の私なら、飛んだ方が速いのか、走った方が速いのか、試してみたかったんです。じゃあ魔王様、しっかり掴まっててくださいね！」"
translation = "「지금의 나라면 날아가는 게 빠른지, 달리는 게 빠른지 시험해 보고 싶었어요. 그럼 마왕님, 꼭 꽉 잡고 계세요!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「準備いいですか、魔王様？\u3000じゃあ……よ～～い、ドン！」"
translation = "「준비되셨나요, 마왕님? 그럼…… 제～～일, 땅!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様、見てください！\u3000これが私の見せたかった景色……魔王様、顔色が……大丈夫ですか？」"
translation = "「마왕님, 보세요! 이것이 제가 보여드리고 싶었던 경치…… 마왕님, 얼굴색이…… 괜찮으신가요?」"

[[dialogue]]
speaker = "unk"
original = "ちょっと休憩させて……"
translation = "잠시 쉬게 해줘……"

[[dialogue]]
speaker = "unk"
original = "魔将になったカティアは飛ぶより速くて、スリル満点だ。楽しめたのは最初の一瞬だけで、あとはカティアに掴まるのに必死だった。"
translation = "마장이 된 카티아는 날아가는 것보다 빨라서, 스릴 만점이다. 즐길 수 있었던 건 처음 순간뿐이었고, 나머지는 카티아에게 매달리느라 필사적이었다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ごめんなさい、魔王様……私の思い付きに巻き込んじゃって……」"
translation = "「죄송해요, 마왕님…… 제 엉뚱한 생각에 휘말리게 해서……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「……私自身は怖くないのか、ですか？\u3000いえ、風を切って走るの気持ちいいですワン！」"
translation = "「……나 자신은 무섭지 않은가, 인가요? 아니요, 바람을 가르며 달리는 건 기분 좋다 멍!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「風にも匂いがあって……流星市国はいろんな食べ物の匂いがして、故郷の風は草の匂いがして……どっちも大好きです」"
translation = "「바람에도 냄새가 있어서…… 유성시국은 여러 가지 음식 냄새가 나고, 고향의 바람은 풀 냄새가 나고…… 둘 다 너무 좋아요」"

[[dialogue]]
speaker = "unk"
original = "匂いまで感じる余裕はなかったけど、カティアの見ている世界を少しだけ垣間見れて嬉しい。"
translation = "냄새까지 느낄 여유는 없었지만, 카티아가 보고 있는 세계를 조금이나마 엿볼 수 있어서 기쁘다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あ、落ち着いてきました？\u3000じゃあ、見てください。これが私の見せたかったものです」"
translation = "「아, 진정되셨나요? 그럼, 보세요. 이것이 제가 보여드리고 싶었던 거예요」"

[[dialogue]]
speaker = "unk"
original = "カティアに手を引かれて立ち上がる。今まで気付かなかったが、山の頂上まで来ていたみたいだ。"
translation = "카티아에게 손을 이끌려 일어선다. 지금까지 몰랐는데, 산 정상까지 와 있었던 모양이다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「初めてここに来たのは、ひいおじいちゃんと一緒だったんです。いつしか一緒に登れなくなって……いつの間にか一人でも来るようになってました」"
translation = "「처음 여기에 온 건, 증조할아버지랑 함께였어요. 어느덧 함께 오르지 못하게 되고…… 어느새 혼자서도 오게 되었죠」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「私の足が速いのは、この山で鍛えられたお陰ですワン」"
translation = "「제 발이 빠르건, 이 산에서 단련된 덕분이다 멍」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ここから見ると、世界ってこんなに大きいんだって感動しました。全部、全部、手に入れてやるぞって見るたびに思うんです」"
translation = "「여기서 보면, 세계란 이렇게나 크구나 하고 감동했어요. 전부, 전부, 손에 넣고 말겠어 하고 볼 때마다 생각해요」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「モンスター退治のついでになっちゃいましたけど、魔王様と一緒にここに来られてよかったですガオ」"
translation = "「몬스터 퇴치 덤으로 오게 됐지만, 마왕님과 함께 여기에 와서 다행이에요 크앙」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様と一緒なら、世界征服だってカンタンですワン！」"
translation = ""

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ね、魔王様？」"
translation = "「그렇죠, 마왕님?」"

[[dialogue]]
speaker = "unk"
original = "夕日に照らされたカティアの笑顔を見ていると、本当に世界征服できる気がしてくるから不思議だ。"
translation = "석양에 비친 카티아의 웃는 얼굴을 보고 있으니, 정말로 세계를 정복할 수 있을 것 같은 기분이 드는 게 희한하다."

[[dialogue]]
speaker = "unk"
original = "言葉で応えるよりも相応しい気がして、カティアの頭をそっと撫でてやる。"
translation = "말로 답하는 것보다 어울릴 것 같은 기분이 들어, 카티아의 머리를 살포시 쓰다듬어 준다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あ、撫でてくれるんですか？\u3000わふ～<emoji=heart04>」"
translation = "「아, 쓰다듬어 주시는 건가요? 와후～<emoji=heart04>」"

