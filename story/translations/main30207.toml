[[dialogue]]
speaker = "unk"
original = "第７話,『ひとつになる心』,B"
translation = "제7화, 『하나가 되는 마음』, B"

[[dialogue]]
speaker = "unk"
original = "ハロウィンに向けて、『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』メンバーの猛特訓は続いていた。"
translation = "할로윈을 향해, 『Golden Angels』 멤버의 맹특훈은 계속되고 있었다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「オオヒメさんは、だいぶ上達してきた感じするねー」"
translation = "「오오히메 씨는, 제법 실력이 늘어난 느낌이네─」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「そうだろうか？\u3000そう言ってもらえると嬉しいのだが」"
translation = "「그러한가? 그렇게 말해주니 기쁘다만」"

[[dialogue]]
speaker = "unk"
original = "元々、興味があったということもあるのだろう。"
translation = "원래부터 관심이 있었다는 점도 있을 것이다."

[[dialogue]]
speaker = "unk"
original = "オオヒメはその真面目な性格を発揮して練習を積み重ね、着実に上達していっていた。"
translation = "오오히메는 특유의 진지한 성격을 발휘해 연습을 거듭하며, 착실히 실력을 올려가고 있었다."

[[dialogue]]
speaker = "unk"
original = "その一方で──"
translation = "그 한편으로──"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ずん、たん。ずんずんたん。ずん、たん。ずんずんたん……♪」"
translation = "「쿵, 작. 쿵쿵작. 쿵, 작. 쿵쿵작……♪」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ここでシンバルです、え～いっ！」"
translation = "「여기서 심벌입니다, 야앗!」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ふぅ……どうでしたか、セシア」"
translation = "「후우…… 어땠나요, 세시아」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ええ、素晴らしい演奏だったわ、ママダレナ<emoji=heart04>」"
translation = "「네, 훌륭한 연주였어요, 마마다레나<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「そうだね、叩けてることは叩けてるんだけど……」"
translation = "「그래, 치고 있다는 건 치고 있는 건데……」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「致命的なくらいノンビリしてるね～」"
translation = "「치명적일 정도로 느긋하네~」"

[[dialogue]]
speaker = "unk"
original = "あまりにもスローペースすぎて、リズム隊としての意味を成していなかった。"
translation = "너무나도 느린 페이스라서, 리듬 파트로서의 의미를 이루지 못하고 있었다."

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「うーむ……」"
translation = "「으음……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あれ？\u3000どうしたの、アルモタヘル？\u3000難しい顔でずっと突っ立ったままだけど……」"
translation = "「어라? 왜 그래, 알모타헬? 어려운 얼굴로 계속 서 있기만 하고……」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「もしかして、分からなくて悩んでるところがあるんじゃないかな？」"
translation = "「혹시, 잘 몰라서 고민하는 부분이 있는 거 아닐까?」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「いや、違うぞ……」"
translation = "「아니다, 그게 아니야……」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「腹が減り過ぎて……力が出ぬ。……きゅぅぅぅ」"
translation = "「배가 너무 고파서…… 힘이 안 난다. ……꼬르르륵」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「大変！\u3000アルモタヘルさんが倒れた！」"
translation = "「큰일이야! 알모타헬 씨가 쓰러졌어!」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ひ、人の子よ……肉を……我に肉を……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こんな調子で本当にハロウィンに間に合うのだろうか？」"
translation = "「이런 상태로 정말로 할로윈에 맞출 수 있을 것인가?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「元々問題の無かったパテル、レミカ殿の指導で問題ないレベルまで達しているセシアはともかく、他の者はまだまだ話にならない……」"
translation = "「원래부터 문제가 없었던 파텔, 레미카 공의 지도로 문제없는 수준까지 도달한 세시아는 그렇다 치고, 다른 자들은 아직 한참 멀었어……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「シルヴィ殿には評価してもらったが、私もまだまだ人前で演奏するに足る域に至っていないことは自分が一番よく分かっている……」"
translation = "「실비 공에게는 평가받았다만, 나 또한 아직 남들 앞에서 연주하기에 족한 영역에는 이르지 못했다는 것을 스스로가 가장 잘 알고 있다……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「うぅぅ……また心配になってきてしまった。いっそ全てを忘れて引きこもってしまいたい……」"
translation = "「으으으…… 다시 걱정이 되기 시작했어. 차라리 모든 걸 잊고 방구석에 틀어박혀 버리고 싶다……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あらら、こっちじゃメンタルブレイク……大変だぁ♪」"
translation = "「어라라, 이쪽은 멘탈 붕괴…… 큰일이네~♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ほらほらオオヒメ、大丈夫だからもっと肩の力を抜きなよ～」"
translation = "「자자 오오히메, 괜찮으니까 좀 더 어깨에 힘을 빼라구~」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あなたは肩の力を抜き過ぎなのだ！」"
translation = "「그대는 어깨에 힘을 너무 뺀 것이다!」"

[[dialogue]]
speaker = "unk"
original = "と……"
translation = "하고……"

[[dialogue]]
speaker = "unk"
original = "そうして１日。また１日と過ぎてゆき、ハロウィンの日が近づいてくる。"
translation = "그렇게 하루. 또 하루가 지나가고, 할로윈 날이 가까워져 온다."

[[dialogue]]
speaker = "unk"
original = "そして──ライブ当日がいよいよ目前にまで迫ってきていた。"
translation = "그리고── 라이브 당일이 마침내 눈앞까지 다가와 있었다."

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ワン、ツー、ワンツースリーフォー♪」"
translation = "「원, 투, 원투쓰리포♪」"

[[dialogue]]
speaker = "unk"
original = "マグダレナのスティックが軽快にドラムを叩く。"
translation = "막달레나의 스틱이 경쾌하게 드럼을 친다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「おお～。いい感じだね……」"
translation = "「오오~. 좋은 느낌이네……」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ママダレナ、とっても頑張っていたのよ」"
translation = "「마마다레나, 엄청 열심히 했는걸요」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ずっと見守ってくれていたものね。ありがとう、セシア」"
translation = "「줄곧 지켜봐 주었지. 고마워, 세시아」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「ママダレナ～っ<emoji=heart04>」"
translation = "「마마다레나~<emoji=heart04>」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「マグダレナよ、そのまま続けていてくれ。我の成果も見てもらう」"
translation = "「막달레나여, 그대로 계속해주게. 나의 성과도 보여주겠다」"

[[dialogue]]
speaker = "unk"
original = "マグダレナがリズムを刻んでいるところに、アルモタヘルのベースの音が自然に加わる。"
translation = "막달레나가 리듬을 타고 있는 곳에, 알모타헬의 베이스 소리가 자연스럽게 더해진다."

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「すごいよ、息ぴったり！」"
translation = "「대단해, 호흡이 척척 맞아!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「アルモタヘルの懸念は、本番で空腹のあまり倒れてしまわないことだけだな」"
translation = "「알모타헬의 우려는, 본방에서 공복을 못 이겨 쓰러져 버리지 않는 것뿐이군」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「そのような失態を晒さぬよう、ライブの前にたらふく肉を食して望むとしよう」"
translation = ""

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「それじゃあたしも参加しようかな」"
translation = "「그럼 나도 참가해 볼까나」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「わたくしも！」"
translation = "「저도요!」"

[[dialogue]]
speaker = "unk"
original = "パテルの奏でるシンセサウンドがリズム隊に彩りを添える。"
translation = "파텔이 연주하는 신디사이저 사운드가 리듬조에 채색을 더한다."

[[dialogue]]
speaker = "unk"
original = "そこにセシアの透き通ったハミングが重なる。"
translation = "거기에 세시아의 투명한 허밍이 겹쳐진다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「では……私たちも行こうか」"
translation = "「그럼…… 우리도 가볼까」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「オッケー♪」"
translation = "「오케이♪」"

[[dialogue]]
speaker = "unk"
original = "最後のピース──"
translation = "마지막 조각──"

[[dialogue]]
speaker = "unk"
original = "ギターの音がパチリと音を立てて噛み合って──"
translation = "기타 소리가 딱 하고 소리를 내며 맞물리고──"

[[dialogue]]
speaker = "unk"
original = "爆発的なエネルギーと共に動き出した『メロディ』はもう止まらなかった。"
translation = "폭발적인 에너지와 함께 움직이기 시작한 『멜로디』는 더 이상 멈추지 않았다."

[[dialogue]]
speaker = "unk"
original = "心がひとつに重なっていく。"
translation = "마음이 하나로 겹쳐져 간다."

[[dialogue]]
speaker = "unk"
original = "６本の糸が縒り合い、１本の糸になる──"
translation = "6개의 실이 꼬여서, 1개의 실이 된다──"

[[dialogue]]
speaker = "unk"
original = "これが、<ruby>音楽<rt>ハーモニー</rt></ruby>──守護天使バンド、『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』の体現する音楽だった。"
translation = "이것이, <ruby>음악<rt>하모니</rt></ruby>──수호천사 밴드, 『Golden Angels』가 체현하는 음악이었다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「……やった？」"
translation = "「……해냈어?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「これなら……いけるんじゃない？\u3000ハロウィンパーティー」"
translation = "「이거라면…… 해낼 수 있지 않을까? 할로윈 파티」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「技術はまだまだ拙い……だが、手ごたえはあった」"
translation = "「기술은 아직 서툴다…… 하지만, 손응무는 있었어」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「歌い切った瞬間、心が熱く震えるのを感じたわ」"
translation = "「다 부른 순간, 마음이 뜨겁게 떨리는 걸 느꼈어」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「それだけではありません。私たちの心もひとつになるような……」"
translation = "「그뿐만이 아닙니다. 저희의 마음도 하나가 되는 듯한……」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「うむ。これが、ライブ……我はようやく理解したのかもしれぬな」"
translation = "「음. 이것이, 라이브…… 짐은 이제야 비로소 이해한 것일지도 모르겠구나」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「みんなも分かってくれたみたいだね！\u3000これがライブの感動なんだよ」"
translation = "「모두도 알아채 준 것 같네! 이것이 라이브의 감동이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ライブステージではこの感動が、観客をも巻き込んで１つに膨れ上がるんだ♪」"
translation = "「라이브 무대에서는 이 감동이, 관객까지 끌어들여 하나로 부풀어 오르는 거야♪」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「そうか……待ち遠しいな。一刻も早くこの感動を、人の子らと分かち合いたい……」"
translation = "「그런가…… 기다려지는군. 한시라도 빨리 이 감동을, 사람의 아이들과 나누고 싶구나……」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「とは言え、ラクシャの弾き方はちょっと大袈裟すぎると思うけどね～」"
translation = "「그렇다고는 해도, 락샤의 연주 방식은 조금 너무 과장되었다고 생각하지만 말이야~」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いや～、ボクが好きなバンドのギターがそういう弾き方をするから、見様見真似で練習してたら癖になっちゃってさ～」"
translation = "「아니~, 내가 좋아하는 밴드의 기타가 그런 방식으로 연주하니까, 흉내 내며 연습하다 보니 습관이 돼버려서 말이지~」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「ううん、むしろ良いと思う！\u3000今の演奏を見てて、私からもちょっと提案があるんだ」"
translation = "「응응, 오히려 좋다고 생각해! 지금 연주를 보면서, 나한테도 약간 제안이 있어」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「提案……？」"
translation = "「제안……？」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「こう……弾きながら壇上を動き回ったり、パフォーマンスをしたり、っていう魅せ方があるんだよね」"
translation = "「이렇게…… 연주하면서 무대 위를 돌아다니거나, 퍼포먼스를 하거나, 하는 연출 방법이 있거든」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「当然難易度はあがっちゃうと思うし……本来は楽曲の完成度の方が優先度は高いんだけど」"
translation = "「당연히 난이도는 올라가 버린다고 생각하고…… 원래는 악곡의 완성도가 더 우선순위가 높긴 하지만」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「でも、ライブの目的が楽曲を聴かせることじゃなくて、『デネブの人たちを楽しませる、元気づけること』だっていうなら、そういう盛り上げ方もありなんじゃないかな？」"
translation = "「하지만, 라이브의 목적이 악곡을 들려주는 것이 아니라, 『데네브 사람들을 즐겁게 하고, 기운을 북돋아 주는 것』이라면, 그런 식으로 분위기를 띄우는 것도 괜찮지 않을까?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「なるほど……」"
translation = "「과연……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いいね！\u3000それもやってみよう！！」"
translation = "「좋네! 그것도 해보자!!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「またそんな安請け合いを……」"
translation = "「또 그런 선뜻 섣부른 승낙을……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いいじゃん！\u3000別にミスっちゃいけない厳粛な発表会をやるわけじゃないんだし、盛り上げ重視なら、何でもやったもん勝ちだよ！」"
translation = "「괜찮잖아! 딱히 실수해서는 안 되는 엄숙한 발표회를 하는 것도 아니고, 분위기 조성이 우선이라면, 뭐든 해본 사람이 장땡이지!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そんなわけでレミカ、ボクにライブパフォーマンスの何たるかを叩きこんでもらえるかな？」"
translation = ""

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「うん、わかった。任せてよ！！」"
translation = "「응, 알았어. 맡겨줘!!」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「……ラクシャがやる気を出している以上、私たちも負けてはいられませんね」"
translation = "「……락샤가 의욕을 내고 있는 이상, 저희도 지고 있을 수는 없겠네요」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「最後の追い込みというわけだな！\u3000気合いを入れて行こうではないか！」"
translation = "「마지막 스퍼트라는 뜻이로군! 기합을 넣고 가보지 않겠나!」"

