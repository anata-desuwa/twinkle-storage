[[dialogue]]
speaker = "unk"
original = "放課後のトレーニング施設に、キーボードの小気味よい音がカタカタと響く。"
translation = "방과 후의 트레이닝 시설에 키보드의 경쾌한 소리가 타닥타닥 울려 퍼진다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「……よし、メンテナンス完了。システム異常なしっと」"
translation = "「……좋아, 유지 보수 완료. 시스템 이상 없음」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「コハルコ、何やってるの？」"
translation = "「코하루코, 뭐 하고 있어?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「何って……定期メンテナンスだよ。機械でも、定期的にお手入れしてあげないと壊れちゃうの」"
translation = "「뭐냐니…… 정기 점검이야. 기계도 정기적으로 손질해 주지 않으면 고장 나버려」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「シルヴィがいつも行ってるフライドチキンのお店も、システムを保守してくれる人がいるから毎日営業できるんだよ」"
translation = "「실비가 자주 가는 프라이드치킨 가게도 시스템을 유지해 주는 사람이 있으니까 매일 영업할 수 있는 거야」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「こういう目に見えない仕事が日常を支えているの。日々のメンテナンスを疎かにすると、ある日突然トラブルが……」"
translation = "「이런 보이지 않는 일이 일상을 지탱하고 있어. 일상의 점검을 소홀히 하면 어느 날 갑자기 트러블이……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ストップストップー！\u3000あたしが言いたいのはそういうことじゃないって！」"
translation = "「스톱 스톱~! 내가 하고 싶은 말은 그런 게 아니라고!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「他にやることあるよねって言いたかったの！\u3000ほら、これ！」"
translation = "「다른 할 일이 있지 않냐고 말하고 싶었어! 자, 이거!」"

[[dialogue]]
speaker = "unk"
original = "シルヴィが手にした紙袋には、九浄ヘレナブランドのロゴがデカデカと描かれている。"
translation = "실비가 든 종이봉투에는 쿠죠 헬레나 브랜드의 로고가 큼지막하게 그려져 있다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うぅ……本当に着ないとダメかなぁ……？」"
translation = "「으으…… 정말 입어야만 할까……?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「せっかくもらった人工戦闘服だよ？\u3000着ないともったいないって。それに、ヘレナさんにはお世話になってるって言ったのコハルコだし」"
translation = "「어렵게 얻은 인공 전투복이잖아? 입지 않으면 아깝다고. 게다가 헬레나 씨에게 신세를 지고 있다고 말한 건 코하루코 본인이잖아」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「それは……そうなんだけどぉ」"
translation = "「그건…… 그렇긴 하지만어어」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "（学園に入学する前、私はハッカーとして活動していた。その中で、身の危険を感じて、ヘレナさんに保護してもらった恩がある）"
translation = "（학원에 입학하기 전, 나는 해커로서 활동했었다. 그 와중에 신변의 위험을 느껴 헬레나 씨에게 보호받은 은혜가 있다）"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "（新星学園のシステム担当になれたのも、入学できたのも、ヘレナさんのおかげ……なんだけど……）"
translation = "（신성 학원의 시스템 담당이 된 것도, 입학할 수 있었던 것도 헬레나 씨 덕분……이긴 한데……）"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「だって水着だよ水着！\u3000私なんかが着てどうするのさ。こういうのはもっと似合う人がいると思うんだけどなぁ……」"
translation = "「그치만 수영복이야, 수영복! 나 같은 게 입어서 뭐 하게. 이런 건 더 잘 어울리는 사람이 있다고 생각하는데에……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あははっ、コハルコって意外と自分に自信ないよね。大丈夫だって、ヘレナさんがコハルコのためにデザインしてくれたんだしさ」"
translation = "「아하핫, 코하루코는 의외로 자신감이 없네. 괜찮다니까, 헬레나 씨가 코하루코를 위해 디자인해 준 거니까」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「そりゃシルヴィは似合うと思うよ？\u3000でも私は……」"
translation = "「그야 실비는 잘 어울리겠지만 말야. 하지만 나는……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「はいはい、ネガネガしないの。じゃあ、あたしが先に着るから、コハルコはあとからついといで。２人で一緒なら怖くないでしょ？」"
translation = "「자자, 부정적으로 굴지 말고. 그럼 내가 먼저 입을 테니까 코하루코는 나중에 따라와. 둘이 함께라면 무섭지 않잖아?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「もう、子ども扱いしないで」"
translation = "「정말, 어린애 취급 하지 마」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あははっ、そこはお互い様だと思うけど、まぁいいや。じゃあ──」"
translation = "「아하핫, 그건 서로 마찬가지라고 생각하지만, 뭐 됐어. 그럼──」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「変身！」"
translation = "「변신!」"

[[dialogue]]
speaker = "unk"
original = "紙袋を高く掲げ、シルヴィが叫ぶ…………が、何も起きない。"
translation = "종이봉투를 높이 치켜들며 실비가 외친다…………만, 아무 일도 일어나지 않는다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「……変身！\u3000へんっしんっ！\u3000へ～んしん♪\u3000……あれ？\u3000あれあれ？」"
translation = "「……변신! 벼언신! 벼~언신♪ ……어라? 어라어라?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「コハルコどうしよ～！？\u3000戦闘服壊れちゃった！？」"
translation = "「코하루코 어떡해~! 전투복 고장 났나 봐!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「そっか、シルヴィは人工戦闘服は初めてなんだっけ。まずは普通の服みたいに着てから、星力を通すみたいだよ」"
translation = "「맞다, 실비는 인공 전투복이 처음이었지. 우선 보통 옷처럼 입은 다음에 성력을 통하게 하는 모양이야」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「なるほど～！」"
translation = "「과연~!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「というか、そもそも人工戦闘服って何！？\u3000天界から流星市国に帰ってきたらサーシャが知らない戦闘服になっててビックリしたし！」"
translation = "「그보다 애초에 인공 전투복이 뭐야!? 천계에서 유성시국으로 돌아왔더니 사샤가 모르는 전투복을 입고 있어서 깜짝 놀랐다고!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「さぁ～、私もよく分かんない」"
translation = "「글쎄~ 나도 잘 몰라」"

[[dialogue]]
speaker = "unk"
original = "戦闘服は本来、天体から与えられた星力が形となったもの。"
translation = "전투복은 본래 천체로부터 부여받은 성력이 형태가 된 것."

[[dialogue]]
speaker = "unk"
original = "人為的に形態を変えたり能力を付与する人工戦闘服は、長い星騎士の歴史において、まだ始まったばかりの若い技術だ。"
translation = "인위적으로 형태를 바꾸거나 능력을 부여하는 인공 전투복은 오랜 성기사의 역사에서 이제 막 시작된 어린 기술이다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「考えても仕方ないから、とりあえず着替えてくる！」"
translation = "「생각해도 소용없으니까 일단 갈아입고 올게!」"

[[dialogue]]
speaker = "unk"
original = "トレーニング施設にはシミュレーターと一緒に更衣室やシャワーが併設されており、コハルコも忙しい時はよく利用している。"
translation = "트레이닝 시설에는 시뮬레이터와 함께 탈의실과 샤워실이 병설되어 있어, 코하루코도 바쁠 때는 자주 이용하고 있다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「どうかな？\u3000似合ってる？」"
translation = "「어때? 잘 어울려?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うん。華やかな水着が、元気なシルヴィのイメージにぴったり」"
translation = "「응. 화려한 수영복이 활기찬 실비의 이미지에 딱이야」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「イエーイ！\u3000あたし元気が取り柄だからね！」"
translation = "「예이! 내 장점은 활기찬 거니까!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「さぁさぁ、次はコハルコの番だよ」"
translation = "「자자, 다음은 코하루코 차례야」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うぅ、もはや逃げ場なし…………変でも笑わないでね」"
translation = "「으으, 이제 도망갈 곳도 없네………… 이상해도 웃지 마」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「……ど、どう？\u3000大胆すぎない？」"
translation = "「……어, 어때? 너무 대담하지 않아?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「似合ってる似合ってる！\u3000でもちょっとえっち！」"
translation = "「잘 어울려, 잘 어울려! 근데 좀 야해!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「こらー！\u3000そういうこと言わないの！」"
translation = "「얘! 그런 말 하는 거 아냐!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ごめんごめん。でも本当に似合ってるから、堂々としてればいいのに。じゃあ、このまま海かプールにでも──」"
translation = "「미안 미안. 하지만 정말 잘 어울리니까 당당하게 있으면 될 텐데. 그럼 이대로 바다나 수영장에라도──」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ま、待って！！」"
translation = "「기, 기다려!!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「……………………私、泳げないから」"
translation = "「……………………나, 수영 못 하니까」"

