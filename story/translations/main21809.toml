[[dialogue]]
speaker = "unk"
original = "第９話,魔王になんてならない,B"
translation = "제9화, 마왕 따위 되지 않아, B"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「お父様。待っていてください。過去の改変は目前です」"
translation = "「아버님. 기다려 주십시오. 과거 개변이 눈앞입니다」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「強力な使徒を手中に収めた後は、聖庭園を陥落させましょう。そして次は魔界──」"
translation = "「강력한 사도를 손에 넣은 후에는, 성정원을 함락시키지요. 그리고 다음은 마계──」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「『星の再会』の増援を全て叩き潰せば、緋宮クロトに勝ち目はありません」"
translation = "「『별의 재회』의 증원을 모두 분쇄하면, 히노미야 쿠로토에게 승산은 없습니다」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「ディザスターハンドとの融合も起きない……厄災の右腕を操る魔王が存在する未来は否定され、お父様の存在は不動のものに──」"
translation = "「디재스터 핸드와의 융합도 일어나지 않고…… 재앙의 오른팔을 조종하는 마왕이 존재하는 미래는 부정되어, 아버님의 존재는 부동의 것으로──」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「……させ、ません」"
translation = "「……하게, 두지 않아요」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「あら──まだ立ちあがれるだなんて。誤算だったかしら」"
translation = "「어머──아직 일어설 수 있다니. 오산이었을까」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ふふ……未来を視ることが、できるのでしょう？\u3000確認が、足らないのでは、ないですか……？」"
translation = "「후후…… 미래를 볼 수, 있는 거지요? 확인이, 부족했던 게, 아닌가요……?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「星眼の使用は疲れるのよ。もう使う必要もないでしょう？\u3000武器を持つこともやっとの状態で、私を脅かせるとでも？」"
translation = "「성안의 사용은 피곤하단다. 이제 쓸 필요도 없겠지? 무기를 잡는 것도 겨우인 상태로, 나를 위협할 수라도 있다고?」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「無理、でしょうね……私では……」"
translation = "「무기라, 겠죠…… 저로서는……」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「でも、メルエルちゃんは……きっと立ち上がり、ますよ……。あの子は、とても強い子、ですから……」"
translation = "「하지만, 멜엘 양은…… 분명 일어설, 거예요……. 그아이는, 매우 강한 아이,니까요……」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「私が……お姉ちゃんが……妹を信じなくてどうします？\u3000抵抗をやめるつもりは、ありません……！」"
translation = "「제가…… 언니가…… 동생을 믿지 않으면 어쩌겠어요? 저항을 그만둘 생각은, 없습니다……!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「馬鹿らしい。あれだけの濃度の瘴気に包まれて、精神を保てるわけがない」"
translation = "「어처구니없군. 그만한 농도의 정기에 둘러싸이고도, 정신을 유지할 수 있을 리가 없다」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「次に立ち上がった時は、２０００年前の再来となるわ。リクリエによって作り替えられ、お父様に付き従う忠実な使徒としてね」"
translation = "「다음에 일어섰을 때는, 2000년 전의 재래가 될 거다. 리크리에에 의해 새로 만들어져, 아버님을 따르는 충실한 사도로서 말이지」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「それこそ……あり得ません。あの子は全てを跳ねのける……」"
translation = "「그거야말로…… 있을 수 없습니다. 그아이는 모든 것을 튕겨낼 거예요……」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「貴女は知らないのでしょう……聖庭園が生み出したアルケインコードを。リガルタ様の一族が生み出した、あの輝きの力を……！」"
translation = "「당신은 모르겠지요…… 성정원이 만들어낸 아르케인 코드를. 리갈타 님의 일족이 만들어낸, 그 빛의 힘을……!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「囀っていなさい。ここからの挽回などあり得ないのよ」"
translation = "「지껄이고 있거라. 여기서 만회하는 것 따위 있을 수 없으니」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「……ぁ、ぁっ…………！！」"
translation = "「……아, 앗…………!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「そろそろ瘴気に呑まれる頃ね？\u3000お姫様の最期の言葉を噛み締めるといいわ」"
translation = "「이제 정기에 삼켜질 즈음이겠지? 공주님의 마지막 말을 되새기는 게 좋을 거다」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「アル…………ケイン…………」"
translation = "「아르…………케인…………」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「……っ！？」"
translation = "「……읏!?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「カオス──クエーサー────！！！」"
translation = "「카오스──퀘이사────!!!」"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『……リガルタの娘、メルエル。侵食する瘴気を跳ね除け、よくぞアルケインコードを唱えてくれました』"
translation = "『……리갈타의 딸, 멜엘. 침식하는 정기를 튕겨내고, 잘도 아르케인 코드를 읊어주었습니다』"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「テルル！？\u3000そんなっ……馬鹿な──！？」"
translation = "「텔루르!? 그런…… 말도 안 돼──!?」"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『ラストナンバーと言いましたか。まさか時を渡り、過去を変えようと画策するとは……』"
translation = "『라스트 넘버라고 했습니까. 설마 시간을 넘어, 과거를 바꾸려고 책동하다니……』"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「未来は確認していた……！\u3000お前が干渉してこないことは、数多の未来を視て、確かめていた……な、なぜ──！？」"
translation = "「미래는 확인했었다……! 네가 간섭해 오지 않는다는 것은, 수많은 미래를 보고, 확신했었다…… 어, 어째서──!?」"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『ええ、そうでしょう──だからこそ私も、貴女の存在を感知したその時から、決断していました』"
translation = "『예, 그렇겠지요──그렇기에 저도, 당신의 존재를 감지한 그 순간부터, 결단하고 있었습니다』"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『一切の干渉をしないと。ヒトの子を信じ、何も手を出さないと』"
translation = "『일체의 간섭을 하지 않겠다고. 인간의 자식을 믿고, 아무것도 손대지 않겠다고』"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「……っ！！？？」"
translation = "「……읏!!??」"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『“私が干渉しないことを決めた未来”を、貴女は星眼で視続けた……』"
translation = "『“내가 간섭하지 않기로 결정한 미래”를, 당신은 성안으로 계속 본 것입니다……』"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『そしてどれだけ確認しても未来が揺らがないことを知れば、星眼を使わない瞬間が訪れるはず……』"
translation = "『그리고 아무리 확인해도 미래가 흔들리지 않는다는 것을 알면, 성안을 쓰지 않는 순간이 찾아올 터……』"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『その一瞬の隙に乗じて干渉する。未来視の能力を持つ貴女を出し抜くには、これしか方法がありません』"
translation = "『그 한순간의 허점을 타 간섭한다. 미래시 능력을 가진 당신을 속여넘기려면, 이 방법밖에 없었습니다』"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「こ、のぉおおっ────！？」"
translation = "「이, 이놈이이잇────!?」"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『過去への跳躍により、因果の糸がかき乱れた今──世界の修正力が働くまでの、この一時だけならば──』"
translation = "『과거로의 도약으로 인해, 인과의 실이 어지러워진 지금──세계의 수정력이 작용하기 전, 이 한때뿐이라면──』"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『天使メルエル。貴女が近い未来、手に入れるであろう──絆の力を引き寄せましょう』"
translation = "『천사 멜엘. 당신이 가까운 미래, 손에 넣을──유대의 힘을 끌어당기겠습니다』"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「ふ、ふざけるな……ふざけるな、ふざけるな！！\u3000死にぞこないが──どこまでお父様の邪魔をすれば──！！！」"
translation = "「장, 장난치지 마…… 장난치지 마, 장난치지 마!! 뒈지다 만 녀석이──어디까지 아버님을 방해해야──!!!」"

[[dialogue]]
speaker_original = "テルル"
speaker_translation = "테루루"
original = "『私が力を貸せるのはここまで──さあ、受け取りなさい！！』"
translation = "『내가 힘을 빌려줄 수 있는 것은 여기까지──자, 받으세요!!』"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「はいっ……女神様！！」"
translation = "「네…… 여신님!!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「チェンジ──ノヴァフォーム！！！」"
translation = "「체인지──노바 폼!!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「そ──そんな──こんなこと、あっていいわけが──！？」"
translation = "「그──그런──이런 일이, 있을 수 있다니──!?」"

[[dialogue]]
speaker_original = "メルエル（覚醒）"
speaker_translation = "메르엘 (각성)"
original = "「女神テルル様……ありがとうございます」"
translation = "「여신 텔루르 님…… 감사합니다」"

[[dialogue]]
speaker_original = "メルエル（覚醒）"
speaker_translation = "메르엘 (각성)"
original = "「会長くんとの絆の力で……必ず！\u3000私たちの勝利する未来を掴んでみせます！！」"
translation = "「회장 군과의 유대의 힘으로…… 반드시! 우리의 승리하는 미래를 움켜쥐어 보이겠어요!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「認められるわけがない──消えろ！！」"
translation = "「인정할 수 없다──사라져라!!」"

[[dialogue]]
speaker_original = "メルエル（覚醒）"
speaker_translation = "메르엘 (각성)"
original = "「はぁあぁぁぁっ──！！」"
translation = "「하아아아앗──!!」"

[[dialogue]]
speaker = "unk"
original = "メルエルが操るレイピアによって、ラストナンバーの撃ちだす光の羽根が全て叩き斬られていく。"
translation = "멜엘이 조종하는 레이피어에 의해, 라스트 넘버가 쏘아내는 빛의 깃털이 전부 베어져 나간다."

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "（星力総量が、計測できない！？\u3000──ならば！\u3000未来を視て、今この時から──最上の結末を引き寄せる！！）"
translation = "（성력 총량을, 측정할 수 없어!? ──그렇다면! 미래를 보고, 지금 이 순간부터──최상의 결말을 끌어당긴다!!）"

[[dialogue]]
speaker = "unk"
original = "オリジナル以上の精度を持つ『天機の星眼』を起動する──"
translation = "원본 이상의 정밀도를 가진 『천기의 성안』을 기동한다──"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「…………っ！？」"
translation = "「…………읏!?」"

[[dialogue]]
speaker = "unk"
original = "視える未来は──数多。"
translation = "보이는 미래는──수없이 많다."

[[dialogue]]
speaker = "unk"
original = "しかし待ち受ける結末は──たったの１つ。"
translation = "하지만 기다리는 결말은──단 하나."

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「私が……滅びる！？\u3000そんな、そんな、そんなそんなそんな──！？！？」"
translation = "「내가…… 멸망해!? 말도 안 돼, 말도 안 돼, 말도 안 돼 말도 안 돼 말도 안 돼──!?!?」"

[[dialogue]]
speaker = "unk"
original = "どれだけ観測しても。行動を変えても。何を企んでも──"
translation = "아무리 관측해도. 행동을 바꿔도. 무슨 꿍꿍이를 꾸며도──"

[[dialogue]]
speaker = "unk"
original = "この３人の天使に、滅ぼされる未来しか……観測できない。"
translation = "이 세 명의 천사에게, 멸망당하는 미래밖에…… 관측되지 않는다."

[[dialogue]]
speaker = "unk"
original = "ラストナンバーは、期せずして体験していた──かつてレナーテ・<ruby>Ｚ<rt>ジグ</rt></ruby>・サイフリートが抱き続けた絶望を。"
translation = "라스트 넘버는, 뜻하지 않게 체험하고 있었다── 한때 레나테・<ruby>Z<rt>지그</rt></ruby>・사이프리트가 안고 있던 절망을."

[[dialogue]]
speaker = "unk"
original = "何をしても変えられない、破滅の未来を──"
translation = "무슨 짓을 해도 바꿀 수 없는, 파멸의 미래를──"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「──メルエルちゃん！！」"
translation = "「──멜엘 양!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──メルエルッ！！」"
translation = "「──멜엘!!」"

[[dialogue]]
speaker_original = "メルエル（覚醒）"
speaker_translation = "메르엘 (각성)"
original = "「うん、行こう──みんなっ！！」"
translation = "「응, 가자── 얘들아!!」"

[[dialogue]]
speaker_original = "３人"
speaker_translation = "3명"
original = "『ユニゾン！！！』"
translation = "『유니존!!!』"

[[dialogue]]
speaker_original = "メルエル（覚醒）"
speaker_translation = "메르엘 (각성)"
original = "「エゴイスティック──シンフォニー！！！」"
translation = "「에고이스틱──심포니!!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「ぁああ──ぁあ、ぁぁぁあっ──！？！？！？」"
translation = "「아아아──아아, 아아아앗──!?!?」"

[[dialogue]]
speaker = "unk"
original = "聖庭園の天使たちが放つユニゾンアタックにより、ラストナンバーは貯蔵していた全ての霊力を消し飛ばされ──"
translation = "성정원의 천사들이 방출하는 유니존 어택에 의해, 라스트 넘버는 저장해 두었던 모든 영력을 날려버리고──"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「そん、なっ……」"
translation = "「그런, 말도……」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「お父様っ……申し訳、ございま──せっ……！」"
translation = "「아버님…… 죄송, 합니다──……!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「ああぁぁああっ…………！！！」"
translation = "「아아아아앗…………!!」"

[[dialogue]]
speaker_original = "メルエル（覚醒）"
speaker_translation = "메르엘 (각성)"
original = "「…………なんとか、倒せたね」"
translation = "「…………어떻게든, 쓰러뜨렸네」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ええ。メルエルちゃん、その姿は──」"
translation = "「네. 멜엘 양, 그 모습은──」"

[[dialogue]]
speaker_original = "メルエル（覚醒）"
speaker_translation = "메르엘 (각성)"
original = "「う、うん。女神様が、今だけの力を貸すって……あっ──」"
translation = "「으, 응. 여신님이, 지금만의 힘을 빌려준다고…… 아──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「戻った……？」"
translation = "「돌아왔다……?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「……うん。因果の糸が乱れた、一時の力だって聞いてたから」"
translation = "「……응. 인과의 실이 흐트러진, 일시적인 힘이라고 들었으니까」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（でも……予感があるよ。近い未来、また会長くんから、受け取れる力なんだよね？）"
translation = "（하지만…… 예감이 들어. 가까운 미래, 또 회장 군에게서, 받을 수 있는 힘인 거지?）"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「想定外の襲撃だったけれど……何とかなったね。みんな無事で、よかった……」"
translation = "「상정 외의 습격이었지만…… 어떻게든 되었네. 모두 무사해서, 다행이야……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうだね。ケイティ姉さん……これで全部終わり。一件落着かな」"
translation = "「그렇네. 케이티 언니…… 이걸로 전부 끝. 사건 해결이려나」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「──ううん、ナターシャちゃん。まだ１つ、やり残してることがあるよ」"
translation = "「──으응, 나타샤 양. 아직 하나, 다 하지 못한 일이 있어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……？」"
translation = "「……?」"

[[dialogue]]
speaker = "unk"
original = "メルエルはコントロールルームの最奥に進む。"
translation = "멜엘은 컨트롤 룸의 가장 안쪽으로 나아간다."

[[dialogue]]
speaker = "unk"
original = "リクリエの瘴気によって見せられた、過去の記憶を頼りに操作を行い、１つの宝玉を取り出した。"
translation = "리크리에의 정기에 의해 보여진, 과거의 기억을 더듬어 조작을 실시해, 하나의 보옥을 꺼내들었다."

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「メルエルちゃん、それは……？」"
translation = "「멜엘 양, 그것은……?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「２０００年前に、はぐれ魔女さんに協力してもらって作った魔道具だよ。魔王因子を外部から削り取って、悪い魔王を弱らせるための宝玉……」"
translation = "「2000년 전에, 외딴 마녀님에게 협력받아 만든 마도구야. 마왕 인자를 외부에서 깎아내어, 나쁜 마왕을 약화시키기 위한 보옥……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「女神の神殿にある、魔王因子に働きかけて弱らせる機能も、この魔道具を介して行われてるみたい。……全部、見てきたから」"
translation = "「여신의 신전에 있는, 마왕 인자에 작용하여 약화시키는 기능도, 이 마도구를 매개로 이루어지고 있는 것 같아. ……전부, 보고 왔으니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……何をするつもり、メルエル？」"
translation = "「……무얼 할 작정이야, 멜엘?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「うん。これ……私に使おうかなって思うんだ」"
translation = "「응. 이거…… 나한테 쓰려고 생각해」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……っ！？」"
translation = "「……읏!?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「前世のことを知って、ナターシャちゃんが悩んでたことも知ることができて。その上で、私が出した結論だよ」"
translation = "「전생의 일을 알고, 나타샤 양이 고민하던 것도 알 수 있게 되어서. 그 위에서, 내가 내린 결론이야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「私は──魔王になんてならない！\u3000天界の魔王様は、リガルタ様で終わり！」"
translation = "「나는──마왕 따위 되지 않아! 천계의 마왕님은, 리갈타 님으로 끝!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「世界を救う本当の魔王は、会長くんがいる。私は彼の傍に立つ、１人の星騎士。それ以上でも、それ以下でもない」"
translation = "「세계를 구할 진짜 마왕은, 회장 군이 있어. 나는 그의 곁에 서는, 한 명의 성기사. 그 이상도, 그 이하도 아니야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「その意思の証として、この魔道具を全力で起動する。私の中の魔王因子を全部、消しちゃうつもり」"
translation = "「그 의지의 증거로서, 이 마도구를 전력으로 기동하겠어. 내 안의 마왕 인자를 전부, 없애버릴 작정이야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「本気で言ってるの？\u3000だって魔王因子がなくなったら、メルエル──もう、魔王の力も、アルケインコードも、使えなくなるのに──」"
translation = "「진심으로 하는 소리야? 그야 마왕 인자가 사라지면, 멜엘──이제, 마왕의 힘도, 아르케인 코드도, 쓸 수 없게 되는데──」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「うん！\u3000だって魔王因子があると、ナターシャちゃんと仲直りできないんだもん。だから、いらないかなって！」"
translation = "「응! 그야 마왕 인자가 있으면, 나타샤 양이랑 화해할 수 없는걸. 그러니까, 필요 없을까 하고!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「は──はぁあっ！？\u3000そんな自分勝手な理由で、簡単に……！？」"
translation = "「하──하아앗!? 그런 이기적인 이유로, 간단히……!?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ご先祖様の行いも、三界を壊した罪も……私は絶対に忘れないよ」"
translation = "「조상님의 행보도, 삼계를 부순 죄도…… 나는 절대로 잊지 않을 거야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「でもね、リガルタ様が魔王の血族に求めたものは──リクリエを退けるための切り札だと思うの」"
translation = "「하지만 말이야, 리갈타 님이 마왕의 혈족에게 요구한 것은──리크리에를 물리치기 위한 히든카드라고 생각해」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「リクリエは、会長くんが──魔王・緋宮クロトが止めるよ！」"
translation = "「리크리에는, 회장 군이──마왕 히노미야 쿠로토가 막을 거야!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「だから魔王も、英雄も、２人はいらない……」"
translation = "「그러니까 마왕도, 영웅도, 두 명은 필요 없어……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「私は姫咲メルエル──お姫様でもないし、魔王でもない。会長くんの下で戦う、ただの天使の星騎士だよ！」"
translation = "「나는 히메사키 멜엘──공주님도 아니고, 마왕도 아니야. 회장 군 아래에서 싸우는, 그저 천사 성기사야!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「──どうかな、ナターシャちゃん？」"
translation = "「──어때, 나타샤 양?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ど、どうって……」"
translation = "「어, 어떠냐니……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「私は全部を知って、『何も知らない小娘』じゃなくなった上で、『天界の魔王であること』を捨てるよ」"
translation = "「나는 전부를 알고, 『아무것도 모르는 애송이』가 아니게 된 위에, 『천계의 마왕인 것』을 버릴 거야」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「これでナターシャちゃんの中にあった矛盾やモヤモヤ、解消できたかな？\u3000──仲直り、できるかな？」"
translation = "「이걸로 나타샤 양 안에 있던 모순이나 찜찜함, 해소되었으려나? ──화해, 할 수 있으려나?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（ああ、本当に……本当にこのバカ女は……！！）"
translation = "（아아, 정말로…… 정말로 이 바보 같은 여자는……!!）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（でも……私は『メルエルの強さ』を、見誤っていたのかもしれない……）"
translation = "（하지만…… 나는 『멜엘의 강함』을, 잘못 보고 있었던 걸지도 몰라……）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（私は、『メルエルの強さ』がいつか、メルエルを殺してしまうんじゃないかって、怖かった……）"
translation = "（나는, 『멜엘의 강함』이 언젠가, 멜엘을 죽여버리는 게 아닐까, 무서웠어……）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（でもきっと、今の『メルエルの強さ』は、メルエルのことを殺さない）"
translation = "（하지만 분명, 지금의 『멜엘의 강함』은, 멜엘을 죽이지 않아）"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（それはきっと、会長さんっていう『本物の魔王』と出会えたことで変わったんだと思うけど……）"
translation = "(그건 분명, 회장님이라는 『진짜 마왕』과 만나면서 변한 거라고 생각하지만……)"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（でも……私は、強いメルエルのことを、もう少しだけ信じてもいいかもしれない。嫌わなくても、いいかもしれない）"
translation = "(하지만…… 나는, 강한 멜엘을 조금쯤은 더 믿어도 될지도 몰라. 미워하지 않아도, 될지도 몰라)"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "（……ま、私がそんなことを考えたなんて、メルエルには一生、内緒なんだけど）"
translation = "(……뭐, 내가 그런 생각을 했다는 건, 멜엘에겐 평생 비밀이지만)"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「それにね、これならナターシャちゃんを嫌いなお仕事から解放できるよ！」"
translation = "「게다가 말이야, 이거라면 나타샤 양을 싫어하는 일에서 해방시켜 줄 수 있어!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「私が魔王じゃなくなれば、護衛の任務も必要なくなるよね！？」"
translation = "「내가 마왕이 아니게 되면, 호위 임무도 필요 없어지잖아!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はあ……やっぱりメルエルのこと、好きになれないや。こんな大ごとを、あっさり決めちゃってさ──」"
translation = "「하아…… 역시 멜엘은 좋아할 수가 없네. 이런 큰일을 단숨에 결정해 버리고──」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「あ──『嫌い』からちょっぴり昇格した？\u3000昇格したよね、今っ！」"
translation = "「아── 『싫음』에서 살짝 승격했어? 승격했지, 방금!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「～～～～～～っ！！」"
translation = "「～～～～～～윽!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「────だいっきらい！！！」"
translation = "「────정말 싫어!!!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「えぇぇえっ！？\u3000なんで～～～っ！？」"
translation = "「에에에엑!? 어째서~~~!?」"

[[dialogue]]
speaker = "unk"
original = "──こうして２度目となる天界防衛は見事、果たされ。"
translation = "──이렇게 두 번째 천계 방위는 멋지게 완수되었다."

[[dialogue]]
speaker = "unk"
original = "創造神『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』の最期のあがきは、メルエルたちの活躍によって阻止されたのだった──"
translation = "창조신 『<ruby>XELOS<rt>제로스</rt></ruby>』의 마지막 발악은, 멜엘 일행의 활약으로 저지된 것이었다──"

