[[dialogue]]
speaker = "unk"
original = "第２話,吸血鬼よりも吸血鬼らしく,P"
translation = "제2화, 흡혈귀보다 흡혈귀답게, P"

[[dialogue]]
speaker = "unk"
original = "『会長さん、夜、こっそり抜け出せる？\u3000誰にも見つからないようにここに来てよ』"
translation = "『회장님, 밤에 몰래 빠져나올 수 있어? 아무한테도 걸리지 않게 여기로 와줘』"

[[dialogue]]
speaker = "unk"
original = "ナターシャに手渡された紙に書かれていた指定先は、深夜のカフェテリアだった。"
translation = "나타샤에게 전달받은 종이에 적힌 약속 장소는, 한밤중의 카페테리아였다."

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ふふっ……よくぞ我が元に馳せ参じたな、魔王よ」"
translation = "「후훗…… 잘도 나의 곁으로 달려와 주었구나, 마왕이여」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「我が呼びかけに応えたということは、眷属へと堕ちる心づもりはできたのかえ？」"
translation = "「나의 부름에 응했다는 것은, 권속으로 떨어질 마음의 준비가 되었다는 뜻인가?」"

[[dialogue]]
speaker = "unk"
original = "ナターシャ！？"
translation = "나타샤!?"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そう、我が名はナターシャ。ナターシャ・チルノ。夜の眷属を統べる絶対なる王、ヴァンパイアなり！」"
translation = "「그래, 나의 이름은 나타샤. 나타샤 치루노. 밤의 권속을 통솔하는 절대적인 왕, 뱀파이어니라!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──なーんてね」"
translation = "「──라는 건 장난이고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「私のキャラじゃないけど、せっかく手に入れたハロウィンフォームだし、演出込みでお披露目しようかと思ってさ」"
translation = "「내 캐릭터는 아니지만, 어렵게 얻은 할로윈 폼이기도 하고, 연출까지 더해서 선보일까 해서 말이야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「私なりのイタズラ。びっくりした？」"
translation = "「나 나름대로의 장난. 깜짝 놀랐어?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「本来の吸血鬼ってこういうものでしょ。日の光も、ニンニクも平気なベアトが例外すぎるんだって」"
translation = "「본래 흡혈귀는 이런 법이잖아. 햇빛도, 마늘도 멀쩡한 베아토가 너무 예외인 거라고」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「くっちゅんっ！」"
translation = "「에취!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あれれ、風邪ひいちゃったかな……？\u3000私、吸血鬼なのに～……」"
translation = "「어라라, 감기 걸려 버렸나……? 나, 흡혈귀인데～……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「まあ、今はベアトの話は置いといて。この戦闘服、似合ってるかな？」"
translation = "「뭐, 지금은 베아토 이야기는 치워두고. 이 전투복, 잘 어울려?」"

[[dialogue]]
speaker = "unk"
original = "ポーズ、大胆すぎない……？"
translation = "포즈, 너무 대담한 거 아니야……?"

[[dialogue]]
speaker = "unk"
original = "似合ってる、けど……"
translation = "잘 어울려, 그렇지만……"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「こういう衣装は、自分の魅力を見せつけるためのモノでしょ？」"
translation = "「이런 의상은, 자신의 매력을 과시하기 위한 거잖아?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「吸血鬼どうこうは冗談にしても、魔王は強い力を持っているし、監視下に置いておかなきゃいけないのは相変わらずなわけ」"
translation = "「흡혈귀 어쩌구는 농담으로 치더라도, 마왕은 강한 힘을 가지고 있고, 감시하에 두어야 하는 건 여전하니까 말이지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「手っ取り早く、会長さんをモノにしておきたいってのは、まあまあ本気なんだよね」"
translation = "「재빠르게, 회장님을 내 것으로 만들어 두고 싶다는 건, 어느 정도 진심이거든」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いい機会だし聞いちゃおうかな」"
translation = "「좋은 기회인데 물어볼까나」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ね、会長さんはどうしたら私のモノになってくれる？\u3000あなたをモノにするために、私は何をしたらいいのかな？」"
translation = "「있잖아, 회장님은 어떻게 해야 내 것이 되어줄래? 당신을 내 것으로 만들기 위해, 나는 뭘 해야 좋을까?」"

[[dialogue]]
speaker = "unk"
original = "何をされても堕ちない！"
translation = "무슨 짓을 당해도 안 넘어가!"

[[dialogue]]
speaker = "unk"
original = "誰のモノにもならない！"
translation = "누구의 것도 되지 않아!"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「おやおや、強情だね。会長さんが私の虜になってくれたら、なんでもしてあげるのに」"
translation = "「어라라, 고집이 세네. 회장님이 나의 포로가 되어준다면, 뭐든지 해줄 텐데」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「<ruby>初心<rt>うぶ</rt></ruby>なメルエルやベアトには絶対できないような、あーんなことやこーんなこともしてあげる<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「一晩中……ううん、じ～っくり時間をかけて……１滴残らず搾り取ってあげちゃう<emoji=heart04>」"
translation = "「밤새도록…… 아니지, 느~긋하게 시간을 들여서…… 한 방울도 남김없이 짜내 줄게<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "何を搾り取る気！？"
translation = "뭘 짜낼 셈이야!?"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あはは、顔真っ赤。血が上っちゃってる？」"
translation = "「아하하, 얼굴이 새빨개. 피가 머리로 쏠렸어?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「他にも～……血がいっぱい巡っちゃってるところ、あるんじゃないかな？」"
translation = "「그밖에도~~…… 피가 잔뜩 쏠려있는 곳이, 있지 않을까?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ほら、早く教えて。さもないと……時間切れになっちゃうよ」"
translation = "「자, 어서 알려줘. 그렇지 않으면…… 시간 초과가 되어버린다고」"

[[dialogue]]
speaker = "unk"
original = "もう朝……？"
translation = "벌써 아침……?"

[[dialogue]]
speaker = "unk"
original = "時間切れ……？"
translation = "시간 초과……?"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ナ、ナ、ナターシャちゃんっ、会長くんと何してるのーっ！？」"
translation = ""

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はい、残念。タイムアーップ」"
translation = "「네, 아쉬워라. 타임 아웃」"

[[dialogue]]
speaker = "unk"
original = "どうして、ここに！？"
translation = "어째서, 여기에!?"

[[dialogue]]
speaker = "unk"
original = "メルエル！？"
translation = "멜엘!?"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「私のＤＩＳＣにメッセージが来たのっ！\u3000会長くんを襲ってほしくなかったら、すぐにここに来なさいって！」"
translation = "「내 DISC로 메시지가 왔단 말이야! 회장군을 습격당하기 싫으면, 당장 여기로 오라고!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「もちろん、送信したのは私。私からメルエルへのイタズラ。どう？\u3000楽しんでもらえた？」"
translation = "「물론, 보낸 건 나야. 내가 멜엘한테 한 장난. 어때? 즐거웠어?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「楽しくないよ！\u3000ドッキドキだったよ！\u3000こういうのはイタズラを超えちゃってるからよくないよっ！」"
translation = "「안 즐거웠거든! 두근두근했단 말이야! 이런 건 장난 수준을 넘어섰으니까 안 좋아!」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「私じゃなかったら、もっと怒られてるよっ！\u3000『メッ！』じゃ済まないからねっ」"
translation = "「내가 아니었으면, 더 혼났을 거라구! 『맴!』 하고 끝날 일이 아니니까 말이야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うーん、そうなんだ。匙加減が難しいね。相手がメルエルと会長さんで良かったよ」"
translation = "「으응, 그렇구나. 정도를 조절하기가 어렵네. 상대가 멜엘이랑 회장님이라 다행이었어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「あれれ？\u3000会長さん、名残惜しそうな顔してる。私にしてほしいことでもあった？」"
translation = "「어라라? 회장님, 아쉬워하는 듯한 얼굴을 하고 있어. 내가 해줬으면 하는 일이라도 있었어?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「物事はなんでも即断即決がオススメだよ。優柔不断だと、もたもたしてる隙に指の隙間から逃げちゃうからね」"
translation = "「모든 일에는 즉단즉결을 추천해. 우유부단하게 멍하니 있는 사이에 손가락 틈새로 빠져나가 버리니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うん、面白かった。それじゃ、吸血鬼は吸血鬼らしくドロンと消えるね。２人とも、おやすみ～」"
translation = "「응, 재미있었어. 그럼, 흡혈귀는 흡혈귀답게 뿅 하고 사라질게. 두 사람 모두, 잘 자~」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「消えちゃったっ！？\u3000もうナターシャちゃんってばーっ！」"
translation = "「사라져 버렸어!? 정말 나타샤짱도 참-!」"

[[dialogue]]
speaker = "unk"
original = "勝手気ままなイタズラに翻弄されたメルエルと俺だけが、深夜のカフェテリアに残されたのであった。"
translation = "제멋대로인 장난에 휘둘린 멜엘과 나만이, 한밤중의 카페테리아에 남겨진 것이었다."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「もうナターシャちゃんってば…………。帰ろっか、会長くん」"
translation = "「정말 나타샤짱도 참…………. 돌아갈까, 회장군」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「それで、その、会長くん……襲われちゃった？」"
translation = "「그래서, 그, 회장군…… 습격당했어?」"

[[dialogue]]
speaker = "unk"
original = "襲われてないっ！"
translation = "안 당했어!"

[[dialogue]]
speaker = "unk"
original = "未遂だよっ！？"
translation = "미수라고!? "

[[dialogue]]
speaker = "unk"
original = "俺は無事、吸血鬼の牙にかかることなく帰路に就いた──"
translation = "나는 무사히 흡혈귀의 송곳니에 걸려들지 않고 귀갓길에 올랐다──"

