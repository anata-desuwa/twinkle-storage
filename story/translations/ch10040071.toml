[[dialogue]]
speaker = "unk"
original = "第１話,アポロの真意,P"
translation = "제1화, 아폴로의 진심, P"

[[dialogue]]
speaker = "unk"
original = "星見家メイド隊のメイド長であるキリカは、突然訪れた難題に困惑していた。"
translation = "호시미 가문 메이드대의 메이드장인 키리카는, 갑작스레 닥친 난제에 곤혹스러워하고 있었다."

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「アポロ様が……メイド修行、ですか？」"
translation = "「아폴로 님께서…… 메이드 수행, 말입니까?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「うん！」"
translation = "「응!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「めーわくをかけたのはあたしもなのに、クーシェンだけ罰を受けるのはよくないぞ！」"
translation = "「민폐를 끼친 건 나도 마찬가지인데, 쿠셴만 벌을 받는 건 좋지 않아!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしもちゃんと罰を受けたい！\u3000それがあたしの正義だ！」"
translation = "「나도 제대로 벌을 받고 싶어! 그게 나의 정의다!」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「正義、ですか……そう言われてしまうと、駄目とは言いづらいですね……」"
translation = "「정의, 인가요…… 그렇게 말씀하시면, 안 된다고 하기는 어렵네요……」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「フィオナお嬢様は何と？」"
translation = "「피오나 아가씨께서는 뭐라고 하셨죠?」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「アポロ様の好きにさせてあげて欲しいと」"
translation = "「아폴로 님이 좋을 대로 하게 해 주셨으면 좋겠다고」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「フィオナがオッケーなら、何も問題ないな！」"
translation = "「피오나가 오케이했다면, 아무 문제 없네!」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「問題大ありです。我ら星見家メイド隊は、星見家の皆さまにお仕えする身。であるのに、主であるアポロ様に同じことをさせるなど……」"
translation = "「문제 아주 많습니다. 우리 호시미 가문 메이드대는 호시미 가문의 여러분을 모시는 몸. 그럼에도, 주인이신 아폴로 님께 같은 일을 시키다니……」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「ちょ～っと気まずいですよねぇ」"
translation = "「좀~ 쑥스러운 상황이긴 하네요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そっか……あたしのわがままでみんなに迷惑かけちゃうのは、よくないよな」"
translation = "「그렇구나…… 나의 어리광으로 모두에게 민폐를 끼치는 건, 좋지 않겠지」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「いえ、我々の迷惑などお気になさらないで下さい。何より優先すべきは、アポロ様のお気持ちですから」"
translation = "「아닙니다, 저희의 불편 따위는 신경 쓰지 마십시오. 무엇보다 우선해야 할 것은 아폴로 님의 마음이니까요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「つまり、あたしの真意を問う！\u3000ってことだな？\u3000確かに、いきなりあたしがメイド修行したいなんて言っても、遊びだと思われて当然だ」"
translation = "「즉, 나의 진심을 묻겠다! 라는 뜻이지? 확실히, 갑자기 내가 메이드 수행을 하고 싶다고 해도, 장난이라고 생각하는 게 당연해」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「真剣にメイドをしてるみんなに失礼なことだと思う。でも、安心してくれ、決して遊びじゃないぞ」"
translation = "「진지하게 메이드를 하고 있는 모두에게 실례되는 일이라고 생각해. 하지만, 안심해 줘, 결코 장난이 아니니까」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「……と仰いますと？」"
translation = "「……라고 말씀하심은?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしも同じ罰を受けるって言ったけど、それは理由の半分なんだ」"
translation = "「나도 같은 벌을 받겠다고 했지만, 그건 이유의 반이야」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「もう半分は……クーシェンのためだ。いきなりメイドって言われたら戸惑うだろ。だから、あたしが一緒にいてやるんだ」"
translation = "「나머지 반은…… 쿠셴을 위해서야. 갑자기 메이드라고 들으면 당황스럽잖아. 그러니까, 내가 함께 있어 주는 거지」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「そんなお優しい考えがあったのですね……アポロ様には」"
translation = "「그런 상냥한 생각이 있으셨군요…… 아폴로 님께는」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「感服致しました。アポロ様のそのお気持ちを決して無駄には致しません。我ら星見家メイド隊一丸となってお２人のメイド修行をお支えしましょう」"
translation = "「감복했습니다. 아폴로 님의 그 마음을 결코 무다로 만들지 않겠습니다. 우리 호시미 가문 메이드대 일동이 하나가 되어 두 분의 메이드 수행을 보좌하겠습니다」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「全メイドに通達、これより星見家メイド隊は特別モードに移行。アポロ様、クーシェン様の両名を見習いメイドとしてお迎えします」"
translation = "「전원 메이드에게 통달, 지금부터 호시미 가문 메이드대는 특별 모드로 이행. 아폴로 님, 쿠셴 님 두 분을 견습 메이드로 맞이합니다」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「了解です～」"
translation = "「알겠습니다~」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ちょ、ちょっと大袈裟じゃないか？」"
translation = "「잠, 잠시만 너무 과장된 거 아니야?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ふつーでいいんだよ、ふつーで。受け入れ態勢バッチリだと、クーシェンもビビっちゃうし……」"
translation = "「보통~으로도 괜찮아, 보통으로. 받아들일 태세가 너무 완벽하면, 쿠셴도 겁먹어 버리고……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしだって……修行にちょっぴりワクワクしてるの、なんか悪いだろ」"
translation = "「나라도…… 수행에 조금 설레는 거, 왠지 미안하잖아」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「ふふっ、存じておりますよ。メイド修行と言っても修行は修行。アポロ様の琴線にも触れるものがあるのでしょう」"
translation = "「후후, 알고 있답니다. 메이드 수행이라고 해도 수행은 수행. 아폴로 님의 거문고선에도 닿는 부분이 있겠지요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「しょうがないだろ。流星ライダーだって、強敵と戦う前には修行してるしな」"
translation = "「어쩔 수 없잖아. 유성 라이더도 강적과 싸우기 전에는 수행하고 있으니까」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「メイド修行は、戦闘訓練だけではありませんよ？」"
translation = "「메이드 수행은 전투 훈련뿐만이 아니에요?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしだってそのくらいわかってるよ。でもさ、知らないことを教わって、それでもっとすごい自分になるんだ、それだけでワクワクしちゃうだろ」"
translation = "「나라도 그 정도는 알고 있어. 그렇지만, 모르는 것을 배우고, 그걸로 더욱 대단한 자신이 되는 거잖아, 그것만으로도 설레게 되잖아」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「素晴らしい向上心です。であれば、私から申し上げることは何も御座いません」"
translation = "「훌륭한 향상심입니다. 그렇다면, 제가 드릴 말씀은 아무것도 없습니다」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「ビシバシしごきますので、お覚悟を、アポロ様」"
translation = "「엄격하게 굴릴 테니, 각오하세요, 아폴로 님」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「うん！\u3000遠慮なくやっちゃってくれよな！」"
translation = "「응! 사정없이 해 줘!」"

[[dialogue]]
speaker = "unk"
original = "こうしてアポロはメイド見習いとして修行を受けることを、正式に許可されたのだった。"
translation = "이렇게 해서 아폴로는 메이드 견습으로서 수행을 받는 것을 정식으로 허가받은 것이었다."

[[dialogue]]
speaker = "unk"
original = "星見家から招待を受け、やってきた俺の前に現れたのは──"
translation = "호시미 가문으로부터 초대를 받아 찾아온 나의 앞에 나타난 것은──"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「い、いらっしゃい、魔王」"
translation = "「어, 어서 와, 마왕」"

[[dialogue]]
speaker = "unk"
original = "め、メイド服だ……"
translation = "메, 메이드복이다……"

[[dialogue]]
speaker = "unk"
original = "アポロ！？"
translation = "아폴로!?."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「うん、メイド服もらったんだけど……ど、どうかな？」"
translation = "「응, 메이드복을 받았는데…… 어, 어때?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「こういうひらひらした感じの服は、動きづらくて好きじゃないんだけど……」"
translation = "「이런 하늘하늘한 느낌의 옷은, 움직이기 불편해서 좋아하지 않지만……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「……フィオナが、魔王はこういうの絶対好きだって言うんだ」"
translation = "「……피오나가, 마왕은 이런 거 절대 좋아할 거라고 말했어」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ほんとのところ？\u3000どうなんだ？\u3000おまえはメイド服のあたし、好きか？」"
translation = "「진짜로? 어때? 너는 메이드복을 입은 나, 좋아해?」"

[[dialogue]]
speaker = "unk"
original = "めっちゃ可愛い！\u3000最高！"
translation = "엄청 귀여워! 최고야!"

[[dialogue]]
speaker = "unk"
original = "大好き！"
translation = "정말 좋아해!"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「お、おうっ……そこまでとは思わなかったから、ちょっとビックリしたぞ」"
translation = "「어, 어우…… 그 정도일 줄은 몰랐어서, 조금 놀랐다고」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「でもよかった！\u3000魔王が気に入ってくれたなら、あたしも大丈夫だ！」"
translation = "「그래도 다행이다! 마왕이 마음에 들어 해 줬다면, 나도 괜찮아!」"

[[dialogue]]
speaker = "unk"
original = "応援してるよ"
translation = "응원하고 있어"

[[dialogue]]
speaker = "unk"
original = "メイド修行、頑張ってね"
translation = "메이드 수행, 열심히 해"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「えへへ～、すぐに可愛いメイドさんになっちゃうから、期待していいぞ」"
translation = "「에헤헤~, 금방 귀여운 메이드 양이 될 테니까, 기대해도 좋아」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王があたしのこと欲しくなっちゃうくらい、最高のメイドさんになるぞ～！」"
translation = "「마왕이 나를 갖고 싶어 할 정도로, 최고의 메이드 양이 될 거라고~!」"

[[dialogue]]
speaker = "unk"
original = "こうして、アポロはメイド修行にやる気を漲らせるのだった。"
translation = "이렇게 해서, 아폴로는 메이드 수행에 의욕을 넘치게 하는 것이었다."

