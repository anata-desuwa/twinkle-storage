[[dialogue]]
speaker = "unk"
original = "第４話,甘え上手になりたい,P"
translation = "제4화, 어리광 잘 부리게 되고 싶어,P"

[[dialogue]]
speaker = "unk"
original = "とある休日、俺の家にヒメが遊びに来ていた。"
translation = "어느 휴일, 우리 집에 히메가 놀러 와 있었다."

[[dialogue]]
speaker = "unk"
original = "部屋に招き入れると、もはや何も言わなくても膝の上に乗ってくる。"
translation = "방으로 안아 들이자, 이제는 아무 말도 하지 않아도 무릎 위에 올라탄다."

[[dialogue]]
speaker = "unk"
original = "すっかり定位置だね"
translation = "완전히 고정석이네"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「はっ……！\u3000す、すまない……この姿になると条件反射のように甘えてしまう……」"
translation = "「핫……! 미, 미안하다…… 이 모습이 되면 조건반사처럼 어리광을 부리게 된다……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「けれど親しき仲にも礼儀あり、きちんと許しをもらってから座るべきだったな」"
translation = "「하지만 친한 사이에도 예의가 있는 법, 제대로 허락을 받고 나서 앉았어야 했는데」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「事後承諾になってしまったが……魔王、いいだろうか？」"
translation = "「사후승낙이 되어버렸다만…… 마왕, 괜찮겠나?」"

[[dialogue]]
speaker = "unk"
original = "もちろん大歓迎だ"
translation = "당연히 대환영이야"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そうか……感謝する」"
translation = "「그런가…… 고맙다」"

[[dialogue]]
speaker = "unk"
original = "小さい姿になっても生真面目なところは変わらないんだな、と微笑ましい気持ちになってしまう。"
translation = "작은 모습이 되어도 고지식한 점은 변함없구나, 하고 미소가 지어지는 마음이 되어버린다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ん、どうした？\u3000何かおかしかったか？」"
translation = "「음, 왜 그러나? 무슨 이상한 일이라도 있었나?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「私を抱っこしているときは、まあ大概笑顔だが……笑みが抑えられないといった様子だ」"
translation = "「나를 안고 있을 때는, 뭐 대개 웃는 얼굴이다만…… 웃음을 참지 못하겠다는 모습이구나」"

[[dialogue]]
speaker = "unk"
original = "ヒメは可愛いなと思って"
translation = "히메가 귀엽다고 생각해서"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「なっ……！\u3000急に何を言うんだ！\u3000からかっているのか……？」"
translation = "「놛……! 갑자기 무슨 소릴 하는 거냐! 놀리는 건가……?」"

[[dialogue]]
speaker = "unk"
original = "とんでもない、本心から出た言葉だ。"
translation = "당치도 않아, 본심에서 나온 말이야."

[[dialogue]]
speaker = "unk"
original = "込み上げる気持ちを抑えきれずヒメを抱きしめると、何も言わずにあやすように頭を撫でる。"
translation = "벅차오르는 마음을 주체하지 못하고 히메를 안아 올리자, 아무 말 없이 다독이듯 머리를 쓰다듬는다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「むぅぅ……」"
translation = "「으으으……」"

[[dialogue]]
speaker = "unk"
original = "やはりからかわれているのだと思ったのか、ヒメは少し不満げな表情を浮かべた。"
translation = "역시 놀림당하고 있다고 생각했는지, 히메는 약간 불만스러운 표정을 지었다."

[[dialogue]]
speaker = "unk"
original = "ごめんごめん"
translation = "미안 미안"

[[dialogue]]
speaker = "unk"
original = "どこまでも真面目なヒメのことを可愛いと思った、と謝罪しつつ伝える。"
translation = "언제나 진지한 히메가 귀엽다고 생각했다고, 사과하며 전한다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「複雑だな……魔王は誉め言葉として、私のことを真面目と評してくれたようだ」"
translation = "「복잡하군…… 마왕은 칭찬의 의미로 나를 성실하다고 평가해 준 것 같다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「けれど私は、自身の融通の利かない性質が、時に欠点になりうるということも知っている」"
translation = "「하지만 나는 내 융통성 없는 성질이 때로는 단점이 될 수 있다는 것도 알고 있다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「となると、真面目であるというのは果たして誉め言葉なのかどうなのか……」"
translation = "「그렇다면 성실하다는 것은 과연 칭찬인지 어떤지……」"

[[dialogue]]
speaker = "unk"
original = "言ったそばから難しい顔をして考え込み始める。"
translation = "말하기가 무섭게 어려운 표정을 지으며 생각에 잠기기 시작한다."

[[dialogue]]
speaker = "unk"
original = "けれど……"
translation = "하지만……"

[[dialogue]]
speaker = "unk"
original = "（背中の羽がパタパタしてる……）"
translation = "(등 뒤의 날개가 파닥거리고 있어……)"

[[dialogue]]
speaker = "unk"
original = "口ではそう言いつつも、自身の真面目さを評価されるのはやっぱり嬉しいのかもしれない。"
translation = "입으로는 그렇게 말하면서도, 자신의 성실함을 인정받은 것은 역시 기쁜 것일지도 모른다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「あっ……」"
translation = "「앗……」"

[[dialogue]]
speaker = "unk"
original = "羽を優しく撫でると、少し驚いたような声を漏らした。"
translation = "날개를 부드럽게 쓰다듬자, 조금 놀란 듯한 목소리를 내었다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ん……魔王は……本当に私のことを撫でるのが好きなのだな」"
translation = "「음…… 마왕은…… 정말 나를 쓰다듬는 걸 좋아하는구나」"

[[dialogue]]
speaker = "unk"
original = "だって可愛いから"
translation = "그야 귀여우니까"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「またそんな事を言う……もういい、今は素直に受け取っておくことにしよう」"
translation = "「또 그런 소리를…… 됐다, 지금은 순순히 받아들이도록 하지」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「遠慮はいらない、魔王の気が済むまで思う存分撫でるといい」"
translation = "「수줍어할 필요 없다, 마왕의 기분이 풀릴 때까지 마음껏 쓰다듬도록 해라」"

[[dialogue]]
speaker = "unk"
original = "お許しが出たので、思う存分撫でまわさせてもらうことにする。"
translation = "허락이 떨어졌으므로, 마음껏 만져대기로 한다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「んっ、その下から羽をクシャクシャされる感じ……気持ちよくて、いいな……」"
translation = "「음, 그 아래에서 날개가 구겨지는 느낌…… 기분 좋아서, 괜찮군……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「撫でられるのも好きだが……それも、好きかもしれない……」"
translation = "「쓰다듬어지는 것도 좋아하지만…… 그것도, 좋을지도 모르겠다……」"

[[dialogue]]
speaker = "unk"
original = "表情を緩めながら、されるがままになってくれるヒメ。"
translation = "표정을 풀며, 맡기는 대로 있어 주는 히메."

[[dialogue]]
speaker = "unk"
original = "リラックスしてくれてる顔だ"
translation = "편안해하는 얼굴이다"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「魔王が上手なのだ。その優しい手つきはいつだって私の緊張を<ruby>解<rt>ほど</rt></ruby>いてくれる……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "その発言、ちょっとエッチか"
translation = "그 발언, 약간 야할지도"

[[dialogue]]
speaker = "unk"
original = "…………"
translation = "…………"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「っ！？\u3000な、何故そうなる！」"
translation = "「윽!? 어, 어째서 그렇게 되는 거냐!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「いや……確かに破廉恥な発言に聞こえなくもないかもしれない、か……？」"
translation = "「아니…… 확실히 파렴치한 발언으로 들리지 않는 것도 아닐지도, 모르나……?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「だが仕方がないだろう、本当にそう思ったのだから……」"
translation = "「하지만 어쩔 수 없잖느냐, 정말로 그렇게 생각했으니……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「あぁ、そう言っている間にも……魔王の指が……私をどんどん気持ちよくしてくる……うぅう……」"
translation = "「아아, 그렇게 말하는 동안에도…… 마왕의 손가락이…… 나를 자꾸만 기분 좋게 만들어 와…… 우으으……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そうしたら……どんどん顔が緩んでしまって……」"
translation = "「그렇게 되니…… 자꾸만 얼굴이 풀어져 버려서……」"

[[dialogue]]
speaker = "unk"
original = "俺だけに見せてくれる一面ってことで"
translation = "나한테만 보여주는 일면이라는 뜻으로"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そうだな……私と魔王は恋人同士なのだから……２人だけの時は気を緩めても……」"
translation = "「그렇구나…… 나와 마왕은 연인 사이니까…… 둘만 있을 때는 긴장을 풀어도……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「だが、他の者にはこんな姿は見せられぬ……くれぐれも秘密にしておいてくれ……ふにゅぅ……<emoji=heart04>」"
translation = "「하지만, 다른 이들에게는 이런 모습을 보여줄 수 없어…… 부디 비밀로 해 다오…… 후뉴우……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "<ruby>蕩<rt>とろ</rt></ruby>けきった声を上げながら、全身から力を抜いて身を預けてくる。"
translation = "<ruby>푹<rt>녹아</rt></ruby> 녹아버린 목소리를 내며, 온몸의 힘을 빼고 몸을 맡겨온다."

[[dialogue]]
speaker = "unk"
original = "その後も、俺はヒメがフニャフニャにふやけるまで、彼女を撫でまわし続けたのだった。"
translation = "그 후로도, 나는 히메가 흐물흐물해질 때까지, 그녀를 계속 쓰다듬어 주었던 것이다."

