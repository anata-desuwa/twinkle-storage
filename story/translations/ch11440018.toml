[[dialogue]]
speaker = "unk"
original = "狛里がようやく『恋人』の意味をちゃんと理解して、正式に付き合い始めてから、しばらく経ったある日。"
translation = "코마리가 겨우 『연인』의 의미를 제대로 이해하고, 정식으로 사귀기 시작하고서 얼마간 지난 어느 날."

[[dialogue]]
speaker = "unk"
original = "放課後に星徒会室で仕事をしていると、狛里が勢いよく駆け込んできた。"
translation = "방과 후에 성도회실에서 일을 하고 있자, 코마리가 기세 좋게 달려 들어왔다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様ぁ～～っ！」"
translation = "「마왕님~~!」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うぉっ！？\u3000狛里、どうしたんだ？」"
translation = "「우옷!? 코마리, 무슨 일이야?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はぁ……はぁ……！\u3000わふぅ～っ<emoji=heart04>」"
translation = "「하아…… 하아……! 와후~<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狛里の様子がおかしいと感じて、俺は書類作業の手を止め、彼女の元へと向かう。"
translation = "코마리의 상태가 이상하다고 느껴, 나는 서류 작업하던 손을 멈추고 그녀에게로 향한다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「顔が赤くなってるけど、大丈夫か？」"
translation = "「얼굴이 빨개졌는데, 괜찮아?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様――ばうわふっ<emoji=heart04>」"
translation = "「마왕님――바우와후<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「おわぁ！？」"
translation = "「어와!?」"

[[dialogue]]
speaker = "unk"
original = "近づくやいなや、俺はその場に押し倒されて、服を脱がされてしまい――"
translation = "다가가기가 무섭게, 나는 그 자리에서 덮쳐져 옷이 벗겨져 버리고――"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ<emoji=heart04>\u3000魔王様の『おち○ぽ様』、出ましたぁ<emoji=heart04>」"
translation = "「바우와후<emoji=heart04> 마왕님의 『자지님』, 나왔습니다아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ペニスが露出すると、狛里は嬉しそうな顔を浮かべる。"
translation = "페니스가 노출되자, 코마리는 기쁜 듯한 표정을 짓는다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「狛里……もしかして『発情期』が！？」"
translation = "「코마리…… 혹시 『발정기』가!?」"

[[dialogue]]
speaker = "unk"
original = "狛里と恋人になった際、ヘレナちゃんから獣人系魔族の『発情期』については教えてもらっていた。"
translation = "코마리와 연인이 되었을 때, 헬레나짱에게 수인계 마족의 『발정기』에 대해서는 들어서 알고 있었다."

[[dialogue]]
speaker = "unk"
original = "狛里の発情期については、これまでまだ１度も来ていないと狛里本人から聞かされていたのだが……"
translation = "코마리의 발정기에 대해서는, 지금까지 아직 1번도 오지 않았다고 코마리 본인에게 들었었지만……"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様のおち○ぽ様っ<emoji=heart04>\u3000おち○ぽ様っ<emoji=heart04>\u3000おち○ぽ様ですぅ<emoji=heart04><emoji=heart04>\u3000はあっ<emoji=heart04>\u3000はぁあっ<emoji=heart04>\u3000はふぅぅ～～んっ<emoji=heart04>」"
translation = "「마왕님의 자지님<emoji=heart04> 자지님<emoji=heart04> 자지님입니다아<emoji=heart04><emoji=heart04> 하앗<emoji=heart04> 하아앗<emoji=heart04> 하후으으~~응<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「おち○ぽ様おっきくなってるのですぅ<emoji=heart04>\u3000魔王様も発情っ<emoji=heart04>\u3000狛里に発情してくれてるのです？<emoji=heart04>」"
translation = "「자지님 커진 것입니다아<emoji=heart04> 마왕님도 발정<emoji=heart04> 코마리한테 발정해 주신 것입니까?<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里にも発情期きたのですぅ<emoji=heart04>\u3000あぁあんっ<emoji=heart04>\u3000おま○こムズムズして、おち○ぽ様入れたくてしょうがないのですぅ～<emoji=heart04>」"
translation = "「코마리한테도 발정기가 온 것입니다아<emoji=heart04> 아아앙<emoji=heart04> 보지 가려워서 자지님 넣고 싶어서 견딜 수 없는 것입니다아~<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「これが、エッチな気持ちなのですねっ<emoji=heart04>\u3000狛里、エッチなことで頭がいっぱいなのですっ<emoji=heart04>\u3000いっぱいエッチしましょう、魔王様ぁ<emoji=heart04>」"
translation = "「이것이 야한 기분이군요<emoji=heart04> 코마리, 야한 생각으로 머리가 가득 찬 것입니다<emoji=heart04> 많이 야한 짓 해요, 마왕님<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そう言って、狛里は既に愛液が溢れて濡れている秘部を、ペニスに擦り付けてくる。"
translation = "그렇게 말하며, 코마리는 이미 애액이 넘쳐흐려 젖어있는 비밀스러운 부위를 페니스에 비벼댄다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んあぁあぁあ～～っ<emoji=heart04>\u3000おま○こ気持ちいいのですぅ<emoji=heart04>\u3000もう我慢できませんっ<emoji=heart04>\u3000おち○ぽ様、中に挿れちゃいますぅ<emoji=heart04>」"
translation = "「응아아아~~앗<emoji=heart04> 보지 기분 좋은 것입니다아<emoji=heart04> 이제 못 참겠습니다<emoji=heart04> 자지님 안에 넣어버릴 것입니다아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "静止する間もなく、狛里はそそり立ったペニスに思い切りよく腰を落とす。"
translation = "말릴 새도 없이, 코마리는 우뚝 선 페니스에 거침없이 허리를 내리린다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んっ――<emoji=heart04><emoji=heart04>」"
translation = "「응――<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「あぁああっ――ふあああぁ～～～っ<emoji=heart04><emoji=heart04>」"
translation = "「아아앗――후아아아아~~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「狛里、大丈夫かっ！？」"
translation = "「코마리, 괜찮아!?」"

[[dialogue]]
speaker = "unk"
original = "と、心配したのもつかの間、次の瞬間には狛里はじゅっぷじゅっぷと派手な水音を立てながら、大胆に腰を振り始めた。"
translation = "라고, 걱정한 것도 잠시, 다음 순간 코마리는 철퍽철퍽 요란한 소리를 내며 과감하게 허리를 흔들기 시작했다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はああぁっ<emoji=heart04><emoji=heart04>\u3000わふううぅ～～んっ<emoji=heart04><emoji=heart04>」"
translation = "「하아아앗<emoji=heart04><emoji=heart04> 와후우우~~응<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「交尾気持ちいいのですぅ<emoji=heart04><emoji=heart04>\u3000あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000気持ちいいっ<emoji=heart04>\u3000気持ちいい～～<emoji=heart04>\u3000はあぁぁんっ<emoji=heart04>\u3000ふわぁぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「교미 기분 좋은 것입니다아<emoji=heart04><emoji=heart04> 앗<emoji=heart04> 앙<emoji=heart04> 기분 좋아<emoji=heart04> 기분 좋아~~ <emoji=heart04> 하아앙<emoji=heart04> 후와앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「おち○ぽ様に狛里おま○こ、じゅぷじゅぷじゅぷ～～って押し広げられてぇっ<emoji=heart04>\u3000わふっ<emoji=heart04>\u3000わふっ<emoji=heart04>\u3000わふうぅんっ<emoji=heart04><emoji=heart04>」"
translation = "「자지님한테 코마리 보지, 쥬프쥬프쥬프~~ 하고 벌려져서어<emoji=heart04> 와후<emoji=heart04> 와후<emoji=heart04> 와후웅<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「初めてなのに、すっごく気持ちいいのですぅ～～っ<emoji=heart04><emoji=heart04>\u3000はあぁあっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000ふわあぁんっ<emoji=heart04><emoji=heart04>」"
translation = "「처음인데 진짜 너무 기분 좋은 것입니다아~~앗<emoji=heart04><emoji=heart04> 하아앗<emoji=heart04> 앙<emoji=heart04> 후와앙<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狛里は初めてとは思えない程、悦楽に乱れた表情を浮かべながら腰を上下に振り、ぱちゅぱちゅと大きな水音を響かせる。"
translation = "코마리는 처음이라고는 믿기지 않을 정도로 쾌락에 흐트러진 표정을 지으며 허리를 위아래로 흔들어, 찰팍찰팍 커다란 수액 소리를 울린다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様も、もっともっと発情っ<emoji=heart04>\u3000して欲しいのですっ<emoji=heart04>\u3000狛里と一緒に、交尾で頭いっぱいのオスになって下さぁいっ<emoji=heart04>」"
translation = "「마왕님도 더 많이 발정<emoji=heart04> 해주셨으면 하는 것입니다<emoji=heart04> 코마리랑 같이 교미로 머리속이 가득 찬 수컷이 되어주세요오<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狛里は顔を近づけると、俺の頬や首筋へと『舌』を這わせてきて。"
translation = "코마리는 얼굴을 다가오더니, 내 뺨과 목덜미로 『혀』를 기어오게 해서."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んっ<emoji=heart04>\u3000ふうぅっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000んちゅるっ<emoji=heart04>\u3000ぺろぺろぺろっ<emoji=heart04>\u3000はあんっ<emoji=heart04>\u3000れろれろぉ～<emoji=heart04>」"
translation = "「응<emoji=heart04> 후우<emoji=heart04> 앙<emoji=heart04> 응츄릅<emoji=heart04> 핥짝핥짝핥짝<emoji=heart04> 하앙<emoji=heart04> 레로레로오~<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様ぁ、あんっ<emoji=heart04>\u3000れる～っ、くちゅるるっ<emoji=heart04>\u3000はあんっ<emoji=heart04>\u3000ぺろぺろっ<emoji=heart04>\u3000んふぅ～っ<emoji=heart04>\u3000れるれるれるっ<emoji=heart04>\u3000ちゅっ、ちゅっ<emoji=heart04>」"
translation = "「마왕님, 앙<emoji=heart04> 레로~, 쿠츄룰<emoji=heart04> 하앙<emoji=heart04> 핥짝핥짝<emoji=heart04> 응후~<emoji=heart04> 레로레로레로<emoji=heart04> 쪽, 쪽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "胸板を舐めて、それから俺の『乳首』を吸う。"
translation = "가슴을 핥고, 그러고 나서 나의 『유두』를 판다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「あんっ<emoji=heart04>\u3000乳首なめなめして、気持ちよくしましゅ<emoji=heart04>\u3000くちゅるるっ<emoji=heart04>\u3000ちゅっ<emoji=heart04>\u3000れろれろっ<emoji=heart04>\u3000れろちゅっ<emoji=heart04>」"
translation = "「앙<emoji=heart04> 젖꼭지 핥짝핥짝해서 기분 좋게 해드릴게요<emoji=heart04> 쿠츄룰<emoji=heart04> 쪽<emoji=heart04> 레로레로<emoji=heart04> 레로쪽<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んふぅ～っ<emoji=heart04>\u3000あぁあんっ<emoji=heart04>\u3000ぺろぺろっ<emoji=heart04>\u3000んふうぅんっ<emoji=heart04>\u3000んんぅ<emoji=heart04>\u3000れるれるっ<emoji=heart04>\u3000ちゅっちゅっ<emoji=heart04>」"
translation = "「응후~<emoji=heart04> 아아앙<emoji=heart04> 핥짝핥짝<emoji=heart04> 응후웅<emoji=heart04> 응응<emoji=heart04> 레로레로<emoji=heart04> 쪽쪽<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「くんくん<emoji=heart04>\u3000魔王様の汗、エッチな匂いなのですぅ<emoji=heart04>\u3000はああぁ～っ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000れろれろっ、れるちゅっ<emoji=heart04>」"
translation = "「킁킁<emoji=heart04> 마왕님의 땀, 야한 냄새인 것입니다아<emoji=heart04> 하아아~앗<emoji=heart04> 앙<emoji=heart04> 레로레로, 레로쪽<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ちゅぱぁっ<emoji=heart04>\u3000あぁあんっ<emoji=heart04>\u3000魔王様の発情したオスの匂い、興奮するのですぅ<emoji=heart04>\u3000くんくんっ<emoji=heart04>」"
translation = "「츄팟<emoji=heart04> 아아앙<emoji=heart04> 마왕님의 발정한 수컷 냄새, 흥분되는 것입니다아<emoji=heart04> 킁킁<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺の乳首から唇を離すと、今度は腰を振りながら匂いを嗅ぎ始める。"
translation = "내 유두에서 입술을 떼더니, 이번에는 허리를 흔들며 냄새를 맡기 시작한다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「腰パンパンするたびに溢れてくる、狛里のおま○こ汁と、おち○ぽ様のお汁が混ざった匂いもすごくてぇっ<emoji=heart04>\u3000くんくんっ<emoji=heart04>」"
translation = "「허리 팡팡 칠 때마다 흘러나오는 코마리 보지물이랑 자지님 애액이 섞인 냄새도 대단해서어<emoji=heart04> 킁킁<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「嗅いでると、おま○この奥キュンキュンして、もっともっと気持ちよくなっちゃいますぅ～っ<emoji=heart04><emoji=heart04>」"
translation = "「냄새 맡고 있으니까 보지 안쪽이 큥큥거려서 더욱더 기분 좋아져 버립니다아~잇<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「くんくんっ<emoji=heart04>\u3000――んはあぁ～っ<emoji=heart04>\u3000わふっ<emoji=heart04>\u3000わふっ<emoji=heart04>\u3000わふうぅんっ<emoji=heart04><emoji=heart04>」"
translation = "「킁킁<emoji=heart04> ──응하아~앗<emoji=heart04> 와후<emoji=heart04> 와후<emoji=heart04> 와후웅<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狛里は興奮した様子で息を荒くしながら、腰の動きをさらに大きくしていく。"
translation = "코마리는 흥분한 기색으로 거칠게 숨을 쉬며, 허리의 움직임을 한층 더 크게 해간다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里のおま○こ、気持ちいいのがっ<emoji=heart04>\u3000あぁあんっ<emoji=heart04>\u3000どんどん大きくなってるのですぅ<emoji=heart04>」"
translation = "「코마리 보지, 기분 좋은 게<emoji=heart04> 아아앙<emoji=heart04> 점점 더 커지는 것입니다아」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「おち○ぽ様の出っ張ったところぉ<emoji=heart04>\u3000あぁんっ<emoji=heart04>\u3000おま○この内側、カリカリされてぇっ<emoji=heart04>\u3000ふわああぁっ<emoji=heart04><emoji=heart04>\u3000気持ちいいのですぅ～っ<emoji=heart04><emoji=heart04>」"
translation = "「자지님의 귀두 부분이이<emoji=heart04> 아앙<emoji=heart04> 보지 안쪽을 긁어대서어<emoji=heart04> 후와아아앗<emoji=heart04><emoji=heart04> 기분 좋은 것입니다아~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「これ、知ってるのですっ<emoji=heart04>\u3000んあああぁっ<emoji=heart04><emoji=heart04>\u3000気持ちいいのが膨らんで、イク感じぃっ<emoji=heart04><emoji=heart04>」"
translation = "「이거 알고 있는 것입니다<emoji=heart04> 응아아아앗<emoji=heart04><emoji=heart04> 기분 좋은 게 부풀어 올라서 갈 것 같은 느낌이이<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「あっ、あんっ<emoji=heart04><emoji=heart04>\u3000ふわああぁっ<emoji=heart04><emoji=heart04>\u3000はあああぁ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「앗, 앙<emoji=heart04><emoji=heart04> 후와아아앗<emoji=heart04><emoji=heart04> 하아아아~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「イクっ<emoji=heart04><emoji=heart04>\u3000狛里、イっちゃいますぅ<emoji=heart04><emoji=heart04>\u3000あああっ――<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「간다아<emoji=heart04><emoji=heart04> 코마리, 가버리는 것입니다아<emoji=heart04><emoji=heart04> 아아앗――<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ふわあああぁぁぁ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000イっクうううぅぅぅ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「후와아아아아~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04> 간다아아아아~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狛里は尻尾をピンと立ててビクビクと体を震わせながらも、腰振りを止めない。"
translation = "코마리는 꼬리를 꼿꼿이 세우고 파르르 몸을 떨면서도, 허리 흔들기를 멈추지 않는다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「あぁあんっ<emoji=heart04>\u3000はぁあんっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000今のすっごく気持ちよかったのですぅ<emoji=heart04>\u3000ふわあぁあんっ<emoji=heart04>」"
translation = "「아아앙<emoji=heart04> 하아앙<emoji=heart04> 앙<emoji=heart04> 방금 거 엄청 기분 좋았던 것입니다아<emoji=heart04> 후와아앙<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「あっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000ふうぅっ<emoji=heart04>\u3000はあぁっ、あんっ<emoji=heart04>\u3000ふああぁんっ<emoji=heart04>」"
translation = "「앗<emoji=heart04> 앙<emoji=heart04> 후우<emoji=heart04> 하아앗, 앙<emoji=heart04> 후아앙<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "発情で高まった性欲は１回の絶頂では満足しないようで、むしろ腰振りの速度はどんどん速まっていた。"
translation = "발정으로 고조된 성욕은 1번의 절정으로는 만족하지 못하는 듯, 오히려 허리를 흔드는 속도는 점점 빨라지고 있었다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はぁっ、はぁっ、はあぁっ<emoji=heart04>\u3000くぅ～んっ、くぅ～んっ<emoji=heart04>\u3000魔王様ぁっ<emoji=heart04><emoji=heart04>」"
translation = "「하앗, 하앗, 하아앗<emoji=heart04> 깨~응, 깨~응<emoji=heart04> 마왕님아아<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狛里は絶頂の余韻を感じているのか、恍惚とした様子で、俺の顔を舌で舐めてくる。"
translation = "코마리는 절정의 여운을 느끼고 있는지, 황홀한 표정으로 내 얼굴을 혀로 핥아온다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ぺろっ<emoji=heart04>\u3000ぺろんっ<emoji=heart04>\u3000れろれろっ<emoji=heart04>\u3000わふぅ～っ<emoji=heart04><emoji=heart04>」"
translation = "「핥짝<emoji=heart04> 핥아앏<emoji=heart04> 레로레로<emoji=heart04> 와후~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そして、そのまま俺の唇も舐めてきて――"
translation = "그리고, 그대로 내 입술도 핥아오며――"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「れろっ――ちゅっ<emoji=heart04>\u3000んむっ<emoji=heart04>\u3000れるれるっ<emoji=heart04>\u3000れろちゅっ<emoji=heart04>」"
translation = "「레로――쪽<emoji=heart04> 응묵<emoji=heart04> 레로레로<emoji=heart04> 레로쪽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "唇が重なり、キスをする。キスをしながらも、狛里のピストンは止まらない。"
translation = "입술이 겹쳐지고, 키스를 한다. 키스를 하면서도 코마리의 피스톤은 멈추지 않는다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ぺろっ<emoji=heart04>\u3000んちゅっ<emoji=heart04>\u3000ちゅぱっ<emoji=heart04>\u3000ちゅむっ<emoji=heart04>\u3000ちゅれるっ<emoji=heart04>\u3000ちゅぷっ<emoji=heart04>\u3000れるれるっ<emoji=heart04>\u3000ちゅむむっ<emoji=heart04>\u3000ちゅるるる<emoji=heart04>\u3000れろちゅっ<emoji=heart04>」"
translation = "「핥짝<emoji=heart04> 응쪽<emoji=heart04> 츄팟<emoji=heart04> 츄묵<emoji=heart04> 츄레로<emoji=heart04> 츄풋<emoji=heart04> 레로레로<emoji=heart04> 츄묵묵<emoji=heart04> 츄룰룰루<emoji=heart04> 레로쪽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狛里の舌が口の中へと入って来て、俺の舌が絡めとられる。"
translation = "코마리의 혀가 입안으로 들어와, 나의 혀가 얽혀 들어간다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はああぁっ、キス気持ちいいれしゅっ<emoji=heart04>\u3000んむっ<emoji=heart04>\u3000ちゅっ<emoji=heart04>\u3000ちゅぱっ<emoji=heart04>\u3000れろちゅっ<emoji=heart04>\u3000れろれろっ<emoji=heart04>\u3000ちゅむむっ<emoji=heart04>\u3000れるれるっ<emoji=heart04>\u3000ちゅるるるっ<emoji=heart04>\u3000ちゅぱぁっ<emoji=heart04>」"
translation = "「하아아앗, 키스 기분 좋은 것이에여<emoji=heart04> 응묵<emoji=heart04> 쪽<emoji=heart04> 츄팟<emoji=heart04> 레로쪽<emoji=heart04> 레로레로<emoji=heart04> 츄묵묵<emoji=heart04> 레로레로<emoji=heart04> 츄룰룰루<emoji=heart04> 츄파아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んふうぅっ<emoji=heart04>\u3000あぁあんっ<emoji=heart04>\u3000魔王様ぁ、しゅきしゅきぃ<emoji=heart04>」"
translation = "「응후우<emoji=heart04> 아아앙<emoji=heart04> 마왕님, 좋아해애<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「――んむぅ～っ<emoji=heart04>\u3000ちゅっちゅっ<emoji=heart04>\u3000大しゅき大しゅき、大しゅきぃっ<emoji=heart04><emoji=heart04>」"
translation = "「――응무아~앗<emoji=heart04> 쪽쪽<emoji=heart04> 진짜 좋아 진짜 좋아, 진짜 좋아아<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里、魔王様の赤ちゃん欲しいっ<emoji=heart04>\u3000れろちゅっ<emoji=heart04>\u3000んちゅっ<emoji=heart04>\u3000ちゅぱぁっ<emoji=heart04><emoji=heart04>」"
translation = "「코마리, 마왕님 아기 갖고 싶어<emoji=heart04> 레로쪽<emoji=heart04> 응쪽<emoji=heart04> 츄파아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「――はああぁっ<emoji=heart04>\u3000大しゅきな魔王様との、赤ちゃん<emoji=heart04><emoji=heart04>」"
translation = "「――하아아앗<emoji=heart04> 너무 조아하는 마왕님과의, 아기<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里の中に魔王様の『子種』、いっぱい注いで欲しいのれしゅぅ<emoji=heart04>\u3000はぁあんっ<emoji=heart04>」"
translation = "「코마리 안에 마왕님의 『씨앗』, 듬뿍 쏟아부어 주셨으면 하는 것이에여어<emoji=heart04> 하아앙<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様も気持ちよくなってぇ<emoji=heart04>\u3000あぁあんっ<emoji=heart04>\u3000イってほしいのれしゅっ<emoji=heart04>」"
translation = "「마왕님도 기분 좋아지셔서어<emoji=heart04> 아아앙<emoji=heart04> 갔으면 하는 것이에여<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里がいっぱい動いてっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000もっともっと、おち○ぽ様を発情させるのですぅっ<emoji=heart04>」"
translation = "「코마리가 많이 움직여서<emoji=heart04> 앙<emoji=heart04> 더욱더 자지님을 발정시키는 것입니다아<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んうぅっ――<emoji=heart04><emoji=heart04>」"
translation = "「응우읏――<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ふお゛おぉっ<emoji=heart04><emoji=heart04>\u3000おほっ、おっ、おおっ<emoji=heart04>\u3000あぁああっ<emoji=heart04>\u3000おんっ、んおおぉんっ<emoji=heart04><emoji=heart04>」"
translation = "「후오오옷<emoji=heart04><emoji=heart04> 어흑, 어, 어억<emoji=heart04> 아아앗<emoji=heart04> 억, 으오오웅<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「お゛おおっ<emoji=heart04>\u3000おち○ぽ様、奥に当たってしゅごいのれしゅぅ<emoji=heart04>\u3000おっ、おっ、おっ、おっ、わおおぉんっ<emoji=heart04><emoji=heart04>\u3000気持ちいいのれしゅぅっ<emoji=heart04>」"
translation = "「오오억<emoji=heart04> 자지님, 안쪽에 닿아서 대단한 것이에여어<emoji=heart04> 억, 억, 억, 억, 와오오웅<emoji=heart04><emoji=heart04> 기분 좋은 것이에여어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "どちゅどちゅと腰を強く打ち付け、狛里の口からは獣のような鳴き声が漏れ始める。"
translation = "쿵쾅쿵쾅 허리를 강하게 박아대며, 코마리의 입에서는 짐승 같은 울음소리가 새어나오기 시작한다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「もっと<emoji=heart04>\u3000もっと強く動いて、お゛おっ<emoji=heart04>\u3000気持ち良く、するのれしゅっ<emoji=heart04>\u3000おっ、おっ、おっ、おっ、ふおおぉんっ<emoji=heart04><emoji=heart04>」"
translation = "「더<emoji=heart04> 더 세게 움직여서, 어억<emoji=heart04> 기분 좋게, 해드리는 것이에여<emoji=heart04> 억, 억, 억, 억, 후오오웅<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「おま○こ<emoji=heart04>\u3000おま○こしゅごいのでしゅぅっ<emoji=heart04>\u3000お゛おおっ、おっ、おっ、おっ、おほおぉ～っ<emoji=heart04><emoji=heart04>」"
translation = "「보지<emoji=heart04> 보지 대단한 것이에여어<emoji=heart04> 오오억, 억, 억, 억, 어후오오~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「強いの効くっ<emoji=heart04>\u3000おま○こきもちぃくて、しあわせなのでしゅぅ～～っ<emoji=heart04><emoji=heart04>\u3000おっ、おっ、おおんっ、んおおぉんっ<emoji=heart04><emoji=heart04>」"
translation = "「세게 치는 거 잘 먹혀<emoji=heart04> 보지 기분 좋아서 행복한 것이에여어~~앗<emoji=heart04><emoji=heart04> 억, 억, 오웅, 으오오웅<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「おち○ぽ様も、しあわしぇっ<emoji=heart04>\u3000お゛おっ<emoji=heart04>\u3000しあわしぇにするのれしゅぅ<emoji=heart04>\u3000んふぅ～っ<emoji=heart04>\u3000ぺろぺろっ<emoji=heart04>\u3000れろれろれろぉ～っ<emoji=heart04><emoji=heart04>」"
translation = "「자지님도 행복해라<emoji=heart04> 오억<emoji=heart04> 행복하게 만들어드릴 것이에여어<emoji=heart04> 응후~~앗<emoji=heart04> 핥짝핥짝<emoji=heart04> 레로레로레로오~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狛里は再び顔を近づけてきて、俺の顔を舌で舐める。"
translation = "코마리는 다시 얼굴을 다가와, 내 얼굴을 혀로 핥는다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様ぁ<emoji=heart04>\u3000んむぅ～っ<emoji=heart04><emoji=heart04>\u3000んちゅっ<emoji=heart04>\u3000ちゅばっ<emoji=heart04>\u3000れろっ<emoji=heart04>\u3000れろちゅっ<emoji=heart04>\u3000ちゅむっ<emoji=heart04>\u3000れるれるっ<emoji=heart04>\u3000ぢゅるるるっ<emoji=heart04>\u3000ちゅぶぶっ<emoji=heart04>\u3000ちゅばぁっ<emoji=heart04><emoji=heart04>」"
translation = "「마왕님아<emoji=heart04> 응무아~~앗<emoji=heart04><emoji=heart04> 응쪽<emoji=heart04> 츄븝<emoji=heart04> 레로<emoji=heart04> 레로쪽<emoji=heart04> 츄묵<emoji=heart04> 레로레로<emoji=heart04> 쥬룰룰루<emoji=heart04> 츄븝븝<emoji=heart04> 츄파아앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そして、舌を絡めて貪るようなディープキスを交わす。"
translation = "그리고, 혀를 얽으며 탐하듯 딥키스를 나눈다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はああぁっ<emoji=heart04>\u3000キスしゅきっ<emoji=heart04>\u3000気持ちくてしあわしぇ～っ<emoji=heart04>\u3000んちゅぅ～っ<emoji=heart04>\u3000れるれるっ<emoji=heart04>\u3000ぢゅれるっっ<emoji=heart04>\u3000ちゅぶぶぶっ<emoji=heart04>\u3000ぢゅるるるっ<emoji=heart04>\u3000れろちゅっ<emoji=heart04><emoji=heart04>」"
translation = "「하아아앗<emoji=heart04> 키스 좋아아<emoji=heart04> 기분 좋아서 행복해e~잇<emoji=heart04> 응츄우~~앗<emoji=heart04> 레로레로<emoji=heart04> 쥬레로읏<emoji=heart04> 츄븝븝븝<emoji=heart04> 쥬룰룰루<emoji=heart04> 레로쪽<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「――んはああぁっ<emoji=heart04><emoji=heart04>\u3000お゛おおっ<emoji=heart04>\u3000またさっきみたいに、気持ちぃのくるのでしゅぅ<emoji=heart04><emoji=heart04>\u3000おっ<emoji=heart04>\u3000おおおっ<emoji=heart04>」"
translation = "「――응하아아앗<emoji=heart04><emoji=heart04> 오오억<emoji=heart04> 또 아까처럼 기분 좋은 게 오는 것이에여어<emoji=heart04><emoji=heart04> 억<emoji=heart04> 오오억<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ふおおぉっ<emoji=heart04><emoji=heart04>\u3000おち○ぽ様、狛里の中で大きくなってましゅっ<emoji=heart04>\u3000お゛っ<emoji=heart04>\u3000おっ<emoji=heart04>\u3000おおおっ<emoji=heart04>」"
translation = "「후오오앗<emoji=heart04><emoji=heart04> 자지님, 코마리 안에서 커지고 있습니댜<emoji=heart04> 어억<emoji=heart04> 억<emoji=heart04> 오오억<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「まおーしゃま、狛里と一緒にっ<emoji=heart04>\u3000おおおっ<emoji=heart04>\u3000もっと、きもちくなるのでしゅぅ<emoji=heart04><emoji=heart04>\u3000お゛っ<emoji=heart04>\u3000おっ<emoji=heart04>\u3000おっ<emoji=heart04>」"
translation = "「마왕님, 코마리랑 같이<emoji=heart04> 오오억<emoji=heart04> 더 기분 좋아지는 것이에여어<emoji=heart04><emoji=heart04> 어억<emoji=heart04> 억<emoji=heart04> 억<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里おま○こで、おち○ぽ様きもちぃく<emoji=heart04>\u3000ふおおっ<emoji=heart04>\u3000おち○ぽ様しあわしぇにするのれしゅぅ<emoji=heart04><emoji=heart04>\u3000おっ――<emoji=heart04><emoji=heart04>」"
translation = "「코마리 보지로 자지님 기분 좋게<emoji=heart04> 후오오<emoji=heart04> 자지님 행복하게 만드는 것이에여어<emoji=heart04><emoji=heart04> 억――<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「おふううぅ～～っ<emoji=heart04><emoji=heart04>\u3000わふっ、わふっ、わふっ、わふうぅんっ<emoji=heart04><emoji=heart04>」"
translation = "「오후우우~~앗<emoji=heart04><emoji=heart04> 와후, 와후, 와후, 와후웅<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狛里は膣内をきゅうきゅうと強く締め付けながら、腰を更に激しく動かし始める。"
translation = "코마리는 질 내부를 조여대며, 허리를 더욱 격렬하게 움직이기 시작한다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んおおぉ～～っ<emoji=heart04><emoji=heart04>\u3000おっ、おっ、おっ、おんっ、ふおおぉんっ<emoji=heart04><emoji=heart04>」"
translation = "「응오오~~앗<emoji=heart04><emoji=heart04> 억, 억, 억, 웅, 후오오웅<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「きてるのですぅ<emoji=heart04><emoji=heart04>\u3000きもちぃのすごく来て、イってましゅうっ<emoji=heart04><emoji=heart04>」"
translation = "「오고 있는 것입니다아<emoji=heart04><emoji=heart04> 기분 좋은 게 엄청 와서 가버리고 있습니댜아<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「さっきより、もっとしあわしぇになってましゅっ<emoji=heart04><emoji=heart04>\u3000おっ、おっ、おっ、おっ、ふおおおぉ～～っ<emoji=heart04><emoji=heart04>」"
translation = "「아까보다 더 행복해지고 있습니댜<emoji=heart04><emoji=heart04> 억, 억, 억, 억, 후오오오~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くっ……俺も、もうイキそうだ！」"
translation = "「큭…… 나도, 이제 싸버릴 것 같아!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「きてっ<emoji=heart04>\u3000きてくだしゃい、まおーさまっ<emoji=heart04><emoji=heart04>\u3000狛里も、もうイキそうでしゅっ<emoji=heart04><emoji=heart04>」"
translation = "「와줘<emoji=heart04> 와주세요, 마왕님<emoji=heart04><emoji=heart04> 코마리도 이제 갈 것 같습니댜<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「まおーしゃまの子種、中にいっぱい出してっ<emoji=heart04>\u3000出してくだしゃいいいぃっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「おっ、おっ、おっ、おっ、ふおおおんっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000んっ、おっ、おっ、おっ、ほおおぉ～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「狛里、もう出るっ！！！」"
translation = "「코마리, 이제 나온다!!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「おっおっおっお゛っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000イクイクっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000狛里もイキますっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ふお゛おおおおおぉ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000イクイクイクイクっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「お゛っ――<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んお゛おおおぉぉぉ～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>\u3000イックうううぅぅぅ～～～～～～～～～<emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "狛里が腰をひときわ強く打ち付けた瞬間。俺も限界を迎えて、彼女の一番奥に思いっきり精を吐き出した。"
translation = "코마리가 허리를 한층 더 세게 세차게 박아넣은 순간. 나도 한계에 도달해, 그녀의 가장 깊은 곳에 있는 힘껏 정액을 토해냈다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「お゛っ――んおおおぉ～～～んっ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000おち○ぽ様からまおーさまの子種、いっぱい出てますぅ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「あっ<emoji=heart04><emoji=heart04>\u3000ふわあああぁ～～っ<emoji=heart04><emoji=heart04>\u3000子宮にどぴゅどぴゅ熱いの注がれてぇ<emoji=heart04><emoji=heart04>\u3000きもちぃくてしあわせですぅ～っ<emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はああぁっ<emoji=heart04><emoji=heart04>\u3000わふぅん……<emoji=heart04>\u3000すごい……<emoji=heart04>\u3000魔王様のお射精、まだ中で続いてますぅ～……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "やがて、長く続いた射精も終わり――"
translation = "이윽고, 길게 이어진 사정도 끝나고――"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んっ……くぅ～ん<emoji=heart04>\u3000はあぁ……ふうぅ……<emoji=heart04>」"
translation = "「응…… 킁~응<emoji=heart04> 하아아…… 후우……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "お互いの体から力が抜け、膣からペニスが抜けると、愛液と精液が混じり合った白濁となって溢れ出た。"
translation = "서로의 몸에서 힘이 빠지고, 질에서 페니스가 빠지자, 애액과 정액이 섞인 백탁액이 되어 뿜어져 나왔다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様との交尾……すっごく気持ち良かったのですぅ<emoji=heart04>\u3000んふうぅ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……狛里、少し落ち着いた？」"
translation = "「……코마리, 조금 진정됐어?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はい……<emoji=heart04>」"
translation = "「네……<emoji=heart04>」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里……魔王様を上手く発情させることができたでしょうか？<emoji=heart04>」"
translation = "「코마리…… 마왕님을 잘 발정시킬 수 있었을까요?<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああ。俺もすごく気持ち良かったよ」"
translation = "「응. 나도 엄청 기분 좋았어」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへっ……よかったのです<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「んっ……わふうぅ～っ<emoji=heart04>\u3000それにしても……くんくん<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「おち○ぽ様、狛里のお汁と子種ですごいエッチな匂いがするのですぅ<emoji=heart04>\u3000はあぁっっ……<emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「嗅いでたら、狛里のおま○こ、またウズウズしてきて……<emoji=heart04>\u3000くぅ～ん<emoji=heart04><emoji=heart04>」"
translation = "「맡고 있으니까, 코마리 보지, 또 쑤셔오기 시작해서……<emoji=heart04> 킁~응<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「も、もしかしてまた……？」"
translation = "「혹, 혹시 또……?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はい、魔王様ぁ<emoji=heart04>\u3000狛里、もっともっと交尾したいであります<emoji=heart04><emoji=heart04>」"
translation = "「네, 마왕님아<emoji=heart04> 코마리, 더 더 교미하고 싶은 말입니다<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「なら、せめて場所を移して――」"
translation = "「그럼, 적어도 장소를 옮겨서――」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「わふぅ～んっ<emoji=heart04><emoji=heart04>\u3000魔王様、我慢できないのですぅ～っ<emoji=heart04>\u3000ぺろぺろっ<emoji=heart04>\u3000れろれろぉ～っ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "堪らなそうに、狛里は俺の顔を舐めてくる。"
translation = "견딜 수 없다는 듯, 코마리는 나의 얼굴을 핥아온다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「待て待て！\u3000このまま続けてると、本当に誰か星徒会室に来ちゃうかもしれないから！」"
translation = "「잠깐 기다려! 이대로 계속하다간, 진짜로 누군가 성도회실에 올지도 모르니까!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様ぁ～<emoji=heart04><emoji=heart04>\u3000ばうわ～～ふぅ<emoji=heart04><emoji=heart04>」"
translation = "「마왕님아~<emoji=heart04><emoji=heart04> 바우와~~후<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "結局その後、俺はもう１度狛里に襲われて、その場で精を搾り取られてしまうのであった――"
translation = "결국 그 후, 나는 또 한 번 코마리에게 덮쳐져, 그 자리에서 정액을 쥐어짜여 버리고 마는 것이었다――"

