[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「今日も猫耳メイド喫茶でのアルバイト、終了ですね。会長、お疲れ様でした」"
translation = "「오늘도 고양이 귀 메이드 카페에서의 알바, 종료네요. 회장님, 수고하셨습니다」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「シュティレもだいぶ接客に慣れてきたな」"
translation = "「슈틸레도 제법 접객에 익숙해졌네」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。労働は性に合っている気がいたします。ぶい」"
translation = "「네. 노동은 적성에 맞는 느낌이 듭니다. 브이」"

[[dialogue]]
speaker = "unk"
original = "最新型ギガンドムのプラモデルをゲットするための資金稼ぎも順調。もう少しで目標額まで貯まりそうだ。"
translation = "최신형 기간돔의 프라모델을 얻기 위한 자금 벌이도 순조롭다. 조금만 더 모으면 목표액까지 모일 것 같다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「さて会長。この後のスケジュールですが、把握しておいででしょうか」"
translation = "「그럼 회장님. 이 뒤의 일정입니다만, 파악하고 계신지요」"

[[dialogue]]
speaker = "unk"
original = "そう言われて俺は考える──が、心当たりがない。"
translation = "그렇게 들은 나는 생각한다──지만, 짚이는 데가 없다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「おや、会長ともあろう御方が珍しいですね。ではお教えいたしましょう」"
translation = "「어라, 회장님이실 분이 드문 일이네요. 그럼 알려드리도록 하겠습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長はこの後、バニーのシュティレとラブホテルにしけこんで、くんずほぐれつパコパコする予定がございます。ぶい」"
translation = "「회장님은 이 뒤, 바니 모습의 슈틸레와 러브호텔에 기어들어 가서 엉켜 붙어 떡칠 예정이 있습니다. 브이」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「──初耳だ！？」"
translation = "「──처음 듣는데!?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ええ。今、考えましたので」"
translation = "「네. 방금 생각해낸 것이라」"

[[dialogue]]
speaker = "unk"
original = "相変わらずマイペースというか、ノリがいいというか、突飛というか……"
translation = "여전히 마이페이스라고 해야 할지, 흥이 좋다고 해야 할지, 엉뚱하다고 해야 할지……"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「実はアルバイト中、会長からの視線に気づいておりました。シュティレの胸部装甲や臀部装甲をじろじろと……」"
translation = "「사실 알바 중, 회장님의 시선을 눈치채고 있었습니다. 슈틸레의 흉부 장갑이나 둔부 장갑을 뚫어지게 바라보시고……」"

[[dialogue]]
speaker = "unk"
original = "確かにおっぱいやお尻を見ていたけれど……仕方ないじゃないか。付き合ってる恋人が、こんな際どい衣装を着ていたら。"
translation = "확실히 가슴이나 엉덩이를 보고 있었지만…… 어쩔 수 없잖아. 사귀고 있는 연인이 이런 훤히 드러난 의상을 입고 있으면."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「そこでシュティレ、思い返してみたのです。会長と最後にまぐわったのはいつか──答えは３日前です」"
translation = "「그래서 슈틸레, 되돌아보았습니다. 회장님과 마지막으로 교의를 맺은 것은 언제인가── 답은 3일 전입니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「すなわち精液のフルチャージが完了しているのではないかと推測しました。違いますか？」"
translation = "「즉 정액의 풀 차지가 완료되어 있는 것이 아닌가 하고 추측했습니다. 아닙니까?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「違わないけど、ここ往来だから。声をおさえて」"
translation = "「틀린 건 아닌데, 여기 길거리니까. 목소리 줄여」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「その点は気を配っております。ご安心ください。シュティレのえっちなセリフを聞けるのは会長だけです、ぶい」"
translation = "「그 점은 신경 쓰고 있습니다. 안심하십시오. 슈틸레의 야한 대사를 들을 수 있는 건 회장님뿐입니다, 브이」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「さぁ会長。可及的速やかに、近場のラブホに潜入。オナホウサギで性処理をいたしましょう。レッツ、動物交尾」"
translation = "「자 회장님. 가급적 속히, 근처 러브호에 잠입. 오나홀 토끼로 성처리를 합시다. 레츠, 동물 교미」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「言い方……！」"
translation = "「말투가……!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「む──申し訳ございません。好きピ同士の愛の営みであるのに『オナホで性処理』などと言うのは無粋でしたね」"
translation = "「무── 죄송합니다. 좋아피(좋아하는 사람)끼리의 사랑의 영위인데 『오나홀로 성처리』라고 하는 것은 멋이 없었네요」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「訂正します。会長、可及的速やかに、恋人ウサギのシュティレに愛情いっぱいのらぶらぶチ○ポピストンをください。ぶいぶい」"
translation = "「정정하겠습니다. 회장님, 가급적 속히, 연인 토끼 슈틸레에게 애정 가득한 러브러브 자지 피스톤을 주세요. 브이브이」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「だから、言い方……！！」"
translation = "「니까, 말투가……!!」"

[[dialogue]]
speaker = "unk"
original = "シュティレと付き合っていると、本当に退屈しない。"
translation = "슈틸레와 사귀고 있으면 정말 지루할 틈이 없다."

[[dialogue]]
speaker = "unk"
original = "さんざん煽られて、すっかりその気になってしまった俺は、シュティレの手を引いて手近のラブホテルへ向かって──"
translation = "하도 부추김을 당해 완전히 그럴 기분이 되어버린 나는, 슈틸레의 손을 끌고 가까운 러브호텔로 향해서──"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「おお……これはなんとも、そそるシチュエーションです。言ってみるものですね……<emoji=heart04>」"
translation = "「오오…… 이것 참 자극적인 시추에이션입니다. 말해보고 볼 일이네요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "せっかくのバニー衣装だから、ハメ撮りセックスをしてみたい。その提案をしてきたのはシュティレだった。"
translation = "모처럼의 바니 의상이니 하메도리 섹스를 해보고 싶다. 그 제안을 해온 것은 슈틸레였다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「以前から思っていたのです。私も会長も、お互いが初めて同士の相手。ゆえに上達するためには、様々な教材が必要だと……<emoji=heart04>」"
translation = "「이전부터 생각하고 있었습니다. 저도 회장님도 서로가 처음인 상대. 그렇기에 실력이 늘기 위해서는 다양한 교재가 필요하다고……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「巷にあふれるアダルトビデオは、どうしても創作色が強いので。やはり頼りになるのは私たち自身の記録です」"
translation = "「시중에 넘치는 성인 비디오는 아무래도 창작 색채가 강하니까요. 역시 믿을 수 있는 것은 우리 자신의 기록입니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「今日のエロチ○ポセックスを録画し、お互い観返すことで、さらなる高みへ登ることができるはず……ぶいぶい<emoji=heart04>」"
translation = "「오늘의 야한 자지 섹스를 녹화하여, 서로 돌려봄으로써 한층 더 높은 곳으로 올라갈 수 있을 터…… 브이브이<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「さらなる高みって……俺たちはいったいどこへ行くんだろう……？」"
translation = "「한층 더 높은 곳이라니…… 우리 대체 어디로 가는 걸까……?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふふ。どこへだって一緒です、会長<emoji=heart04>\u3000ぶいぶい<emoji=heart04>\u3000ぶいぶい、ぶいっ<emoji=heart04>」"
translation = "「후후. 어디든 함께입니다, 회장님<emoji=heart04> 브이브이<emoji=heart04> 브이브이, 브잇<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "いつもより『ぶい』が多い──シュティレも興奮しているのかも。"
translation = "평소보다 『브이』가 많다── 슈틸레도 흥분해 있을지도 모르겠다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あ、教材などとそれっぽいことを言っておりますが、要はハメ撮りプレイなので。あとでデータ、お渡ししますね？」"
translation = "「아, 교재니 뭐니 그럴듯한 소리를 했습니다만, 요는 하메도리 플레이이므로. 나중에 데이터, 전달해 드릴게요?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「シュティレとパコれない時は、このビデオでしこしこＯＫです……<emoji=heart04>」"
translation = "「슈틸레와 떡치지 못할 때는, 이 비디오로 딸딸이 OK입니다……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「大好きな彼ピにすけべなオカズのご提供です、ぶいぶい<emoji=heart04>」"
translation = "「정말 좋아하는 남친에게 야한 반찬 제공입니다, 브이브이<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あ──会長のチ○ポ、ぴくぴくしております……もう我慢も限界でしょうか？」"
translation = "「아── 회장님의 자지, 씰룩씰룩하고 있습니다…… 이제 한계인가요?」"

[[dialogue]]
speaker = "unk"
original = "──ここまで誘惑されたら、もう一切の手加減はできない。"
translation = "──여기까지 유혹당했으면, 더 이상 사정을 봐줄 수 없다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「望むところです<emoji=heart04>\u3000挿入をお願いいたします……会長<emoji=heart04>」"
translation = "「바라던 바입니다<emoji=heart04> 삽입을 부탁드립니다…… 회장님<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ひぅっ──んん、んんうう……んぁぁあっ……<emoji=heart04>」"
translation = "「히윽── 응응, 응응으으…… 응아아앗……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "何度も交わっているというのに、シュティレの女性器の狭さとキツさは相変わらずだ。"
translation = "몇 번이고 관계를 가졌는데도 슈틸레의 여성이 가진 좁음과 조임은 여전하다."

[[dialogue]]
speaker = "unk"
original = "油断したら押し返されてしまいそうなほどの、強烈な締まり。けれど膣内は、すでにとっぷりと濡れそぼっている。"
translation = "방심하면 밀려나 버릴 것 같은 강렬한 조임. 하지만 질 내는 이미 푹 젖어 있다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふぅう、ふぅうう～っ<emoji=heart04>\u3000会長のチ○ポ……今日もしっかり、格納完了です……ぶい……<emoji=heart04>」"
translation = "「후우, 후우우～읏<emoji=heart04> 회장님의 자지…… 오늘도 격납 완료입니다…… 브이……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「それとも、ぴょ、ぴょんぴょん……<emoji=heart04>\u3000の方が、今のコスチュームには合っている、でしょうかっ……んんっ<emoji=heart04>」"
translation = "「아니면, 깡, 깡충깡충……<emoji=heart04> 쪽이 지금 코스튬에는 어울릴까요…… 응응읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "『ぶい』も『ぴょん』も、どっちも可愛い。どっちもしてほしい──そうシュティレの耳元で囁く。"
translation = "『브이』도 『깡충』도 둘 다 귀엽다. 둘 다 해줬으면 좋겠다── 고 슈틸레의 귓가에 소곤거린다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふゃぁぁっ……<emoji=heart04>\u3000あ、ぁっ<emoji=heart04>\u3000ぞくぞく、しましたぁ……<emoji=heart04>\u3000ふふぅ、了解ですっ……ぴょーん、ぴょん……<emoji=heart04>」"
translation = "「후아아앗……<emoji=heart04> 아, 아앗<emoji=heart04> 오싹오싹, 했어요……<emoji=heart04> 후후, 알겠습니다…… 깡충, 깡충……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「こ、この体勢……撮影映えするから、初めて行いましたがっ……お、ぉっ……<emoji=heart04>\u3000よく行う、騎乗位とは全然、違いますっ……<emoji=heart04>」"
translation = "「이, 이 자세…… 촬영이 잘 나와서 처음 해봤습니다만…… 오, 앗……<emoji=heart04> 자주 하는 기승위와는 전혀 다릅니다……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「チ○ポを１点に、体重がかかってっ……ほ、ぉっ<emoji=heart04>\u3000う、んんっ<emoji=heart04>\u3000気持ちいい、ですっ……んんぅ<emoji=heart04>」"
translation = "「자지를 한 점으로 체중이 실려서…… 하, 앗<emoji=heart04> 으, 응응읏<emoji=heart04> 기분 좋아요…… 응응으<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長、お、お願いしますっ……<emoji=heart04>\u3000ウサギの、発情おま○こ……<emoji=heart04>\u3000ぱこぱこ<emoji=heart04>\u3000して、くださいっ……ぴょん、ぴょんぴょん……っ<emoji=heart04>」"
translation = "「회장님, 부, 부탁드립니다……<emoji=heart04> 토끼의 발정 보지……<emoji=heart04> 떡칠<emoji=heart04> 해주세요…… 깡충, 깡충깡충……읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そのおねだりが最後の一押しだ。俺はシュティレの膝を抱えなおして、ピストンを行う──"
translation = "그 애원이 마지막 한 구사였다. 나는 슈틸레의 무릎을 고쳐 안고 피스톤을 시작한다──"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「んんぅっ<emoji=heart04>\u3000ふぁ、ぁ、あぁあっ<emoji=heart04>\u3000うぅうっ<emoji=heart04>\u3000あっあっ……はぁあ、ぁっ……んんぅ、んんっ……<emoji=heart04>」"
translation = "「응응윽<emoji=heart04> 하, 아, 아아앗<emoji=heart04> 으으읏<emoji=heart04> 아앗 아앗…… 하아아, 앗…… 응응으, 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「これっ<emoji=heart04>\u3000すごっ<emoji=heart04>\u3000すごい、れすっ<emoji=heart04>\u3000会長のチ○ポっ<emoji=heart04>\u3000容赦なく、シュティレのおま○こ、突きあげてっ──ふあぁぁっ<emoji=heart04>」"
translation = "「이거<emoji=heart04> 대단<emoji=heart04> 대단해요<emoji=heart04> 회장님의 자지가<emoji=heart04> 사정없이 슈틸레의 보지, 찌르고 들어와서── 후아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あ、あぁぁっ<emoji=heart04>\u3000全部、撮られてますっ……チ○ポをぱくってしてる、おま○こ<emoji=heart04>\u3000データに、残されちゃって、ますっ……んん<emoji=heart04>」"
translation = "「아, 아아앗<emoji=heart04> 전부 찍히고 있어요…… 자지를 앙 물고 있는 보지<emoji=heart04> 데이터에 남겨져 버려요…… 응응<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長も、タブレットの画面、見てくださいっ<emoji=heart04>\u3000はぁああ、ふぅうっ……<emoji=heart04>\u3000すごい、光景ですっ──ぁぁぁっ<emoji=heart04>」"
translation = "「회장님도 태블릿 화면 보세요<emoji=heart04> 하아아아, 후우욱……<emoji=heart04> 엄청난 광경이에요── 아아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "撮影自体はＤＩＳＣで行われているが、その隣にはシュティレが立てかけた大きめのタブレットがある。"
translation = "촬영 자체는 DISC로 이루어지고 있지만, 그 옆에는 슈틸레가 세워둔 커다란 태블릿이 있다."

[[dialogue]]
speaker = "unk"
original = "撮影している画面をそのまま映しているらしい──これなら行為の撮影がやりやすくなるでしょう、というのがシュティレの主張だった。"
translation = "촬영하고 있는 화면을 그대로 비추고 있는 모양이다── 이러면 행위 촬영을 하기 쉬워질 거라는 게 슈틸레의 주장이었다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「おっ<emoji=heart04>\u3000ぁっ<emoji=heart04>\u3000ふぅ、んんっ<emoji=heart04>\u3000ぴ、ぴーす<emoji=heart04>\u3000ぴーすっ<emoji=heart04>\u3000ぶい、ぶいっ──ぁ、あぁあぁっ<emoji=heart04>」"
translation = "「앗<emoji=heart04> 앗<emoji=heart04> 후우, 응응읏<emoji=heart04> 브, 브이<emoji=heart04> 브이잇<emoji=heart04> 브이, 브이── 아, 아아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ハメ撮り<emoji=heart04>\u3000た、楽しいかも、しれませんっ<emoji=heart04>\u3000あ、あぁっ<emoji=heart04>\u3000はぁ、んんっ<emoji=heart04>\u3000こ、興奮<emoji=heart04>\u3000してしまい、ますっ……んぁあ<emoji=heart04>」"
translation = "「하메도리<emoji=heart04> 재, 재밌을지도 모르겠습니다<emoji=heart04> 아, 아앗<emoji=heart04> 하아, 응응읏<emoji=heart04> 흥, 흥분되어버려요…… 응아아<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「わ、私っ……こんな顔、していたん、ですねっ……あ、あぁっ<emoji=heart04>\u3000ふうう、んんっ<emoji=heart04>\u3000あはぁ……へ、へんな、かおです……<emoji=heart04>」"
translation = "「나, 나…… 이런 얼굴 하고 있었군요…… 아, 아앗<emoji=heart04> 후우우, 응응읏<emoji=heart04> 아하아…… 이, 이상한 얼굴이에요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "──変じゃない。とびきり可愛い顔だ、そう伝えながらシュティレの好きな奥を穿つ。"
translation = "──이상하지 않아. 엄청 귀여운 얼굴이다, 라고 전하며 슈틸레가 좋아하는 깊은 곳을 찌른다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「うぁ、あぁっ<emoji=heart04>\u3000お、ぉっ<emoji=heart04>\u3000はぁあ……<emoji=heart04>\u3000そ、そう、ですかっ<emoji=heart04>\u3000会長が、喜んでくれているなら、よ、よかったっ<emoji=heart04>」"
translation = "「우아, 아앗<emoji=heart04> 오, 앗<emoji=heart04> 하아아……<emoji=heart04> 그, 그렇습니까<emoji=heart04> 회장님이 기뻐해 주신다면 다, 다행이에요<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「実際、見てみたら、ちょっと恥ずかしかったのでっ……編集で、目元にモザイクでも、かけようかなと、思いましたがっ……<emoji=heart04>」"
translation = "「막상 실제로 보니 조금 부끄러워서…… 편집으로 눈가에 모자이크라도 걸까 생각했습니다만……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長が『可愛い』って<emoji=heart04>\u3000言ってくれたのでっ……無加工で、いきますっ<emoji=heart04>\u3000ぶ、ぶい、ぶいっ<emoji=heart04>」"
translation = "「회장님이 『귀엽다』고<emoji=heart04> 말해주셨으니까…… 무가공으로 가겠습니다<emoji=heart04> 브, 브이, 브잇<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "──というか、目元を隠したら余計にいやらしい気がする。本当にそういうビデオみたいじゃないか。"
translation = "──라기보다 눈가를 가리면 오히려 더 야한 느낌이 든다. 정말 그런 비디오 같잖아."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふ、ふふっ<emoji=heart04>\u3000そう言われれば、そうかもっ……ですねっ<emoji=heart04>\u3000ご希望であれば、バージョン２としてっ<emoji=heart04>\u3000お、お渡し、しますがっ？」"
translation = "「후, 후후<emoji=heart04> 들어보니 그럴지도……겠네요<emoji=heart04> 원하신다면 버전 2로서<emoji=heart04> 전, 전달해 드리겠지만요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……ちょっと欲しいかも」"
translation = "「……조금 갖고 싶을지도」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「りょ、りょうかいですっ<emoji=heart04>\u3000編集は、シュティレにお任せくださいっ……ぴょ、ぴょん、ぴょんっ<emoji=heart04>」"
translation = "「아, 알겠습니다<emoji=heart04> 편집은 슈틸레에게 맡겨주세요…… 깡, 깡충, 깡충<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「初めてのハメ撮りで、はぁあっ<emoji=heart04>\u3000和風バニーの格好までしてっ、んんんっ<emoji=heart04>\u3000ぞ、ゾクゾクするのが、止まりませんっ……<emoji=heart04>」"
translation = "「첫 하메도리로, 하아앗<emoji=heart04> 일본풍 바니 차림까지 하고서, 응응응읏<emoji=heart04> 오, 오싹거리는 게 멈추지 않습니다……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「気持ちいいっ……気持ちいい、ですっ……<emoji=heart04>\u3000会長のチ○ポ<emoji=heart04>\u3000恋人のチ○ポっ……最高、ですっ──ん、んんぅっ、ふぁああ<emoji=heart04>」"
translation = "「기분 좋아…… 기분 좋아요……<emoji=heart04> 회장님의 자지<emoji=heart04> 연인의 자지…… 최고입니다── 응, 응응윽, 후아아아<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「背面、駅弁はっ……男性に、負担の大きい、体位と、推測っ……<emoji=heart04>\u3000たくさん、応援、いたしますっ──んんぅ<emoji=heart04>」"
translation = "「후면, 에키벤(서서 들기)은…… 남성에게 부담이 큰 체위로 추측……<emoji=heart04> 많이 응원하겠습니다── 응응으<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ぶ、ぶい、ぶいっ<emoji=heart04>\u3000ぴょ、ぴょんっ<emoji=heart04>\u3000ぴょんっ<emoji=heart04>\u3000会長、チ○ポのピストン、が、頑張ってくださいっ、ぴょんっ<emoji=heart04>」"
translation = "「브, 브이, 브잇<emoji=heart04> 깡, 깡충<emoji=heart04> 깡충<emoji=heart04> 회장님, 자지 피스톤 힘내주세요, 깡충<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「えっちなウサギの、おま○この中っ<emoji=heart04>\u3000いっぱいこすって、出し入れっ<emoji=heart04>\u3000してください、ぴょん、ぴょんっ<emoji=heart04>」"
translation = "「야한 토끼의 보지 안<emoji=heart04> 잔뜩 문질러서 넣었다 뺐다<emoji=heart04> 해주세요, 깡충, 깡충<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "シュティレは本当に賢くて、飲み込みが早い。このシチュエーションで、俺がどんなことをすれば興奮してくれるのかをよく理解している。"
translation = "슈틸레는 정말로 똑똑하고, 습득이 빠르다. 이 상황에서, 내가 어떤 행동을 해야 흥분하는지를 잘 이해하고 있다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長っ<emoji=heart04>\u3000チ○ポ、もっとえっちに、奥までぐいって、欲しいぴょんっ……<emoji=heart04>\u3000がんばれ、がんばれっ……ぶい、ぶい、ぶいっ<emoji=heart04>」"
translation = "「회장님<emoji=heart04> 자지, 더 야하게, 깊은 곳까지 꾹, 넣어줬으면 좋겠용……<emoji=heart04> 힘내라, 힘내라…… 브이, 브이, 브이<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ウサギシュティレにっ<emoji=heart04>\u3000種付け、する精液っ<emoji=heart04>\u3000んんっ<emoji=heart04>\u3000タマタマでいっぱい、作ってくださいっ<emoji=heart04>\u3000ぴょんぴょん、ぴょんっ<emoji=heart04><emoji=heart04>」"
translation = "「토끼 슈틸레에게<emoji=heart04> 씨뿌리기, 하는 정액<emoji=heart04> 응응<emoji=heart04> 불알로 잔뜩, 만들어 주세요<emoji=heart04> 깡충깡충, 깡충<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "呼吸がどんどん荒くなっていくのを止められない。もっと強く、速くペニスをこすって、気持ちよくなりたい──もはやブレーキなんて利かなかった。"
translation = "호흡이 점점 거칠어져 가는 것을 멈출 수 없다. 더 세게, 빠르게 페니스를 문질러서, 기분 좋아지고 싶다── 이제 브레이크 따위는 작동하지 않았다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「んんぅっ<emoji=heart04>\u3000んっんっんっんっ<emoji=heart04>\u3000んぁ、あっあっあっあっ<emoji=heart04>\u3000あぁぁ、あぁあああぁっ<emoji=heart04>」"
translation = "「응응읏<emoji=heart04> 응응응응<emoji=heart04> 응아, 아아아아<emoji=heart04> 아아아, 아아아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「チ○ポの突き上げっ──んぉっ<emoji=heart04>\u3000ぅう、んんっ<emoji=heart04>\u3000激しい、れすっ……あ、あぁあ、んんぅ、ふぅうっ<emoji=heart04>」"
translation = "「자지의 치올리기──응앗<emoji=heart04> 으으, 응응<emoji=heart04> 격렬, 해용…… 아, 아아아, 응응으, 후우우<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "感じるあまり、ぎちぎちと締まりを増すシュティレの膣内を、かきわけるようにしてペニスをねじ込む。"
translation = "느끼는 나머지, 꽉 쪼여오는 슈틸레의 질 내부를, 헤집듯이 페니스를 쑤셔 넣는다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「激しっ<emoji=heart04>\u3000激しい、ですっ<emoji=heart04>\u3000はあぁ、あ、あぁ、んぅっ<emoji=heart04>\u3000会長のチ○ポ、て、手加減、ありませんっ──お、ぉおおっ<emoji=heart04>」"
translation = "「격렬해<emoji=heart04> 격렬해요<emoji=heart04> 하아, 아, 아아, 응읏<emoji=heart04> 회장님의 자지, 사, 사정, 없어요── 오, 오오오<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「動けないからっ<emoji=heart04>\u3000気持ちいいところっ<emoji=heart04>\u3000シュティレのおま○こっ<emoji=heart04>\u3000弱点、ずぅっと、責められてっ──ん、んんぅう～っ<emoji=heart04>」"
translation = "「움직일 수 없으니까<emoji=heart04> 기분 좋은 곳<emoji=heart04> 슈틸레의 보지<emoji=heart04> 약점, 계속, 괴롭혀져서── 응, 응응으~읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はぁ、あ、あぁっ<emoji=heart04>\u3000んんぅ、んぁあぁっ<emoji=heart04>\u3000おへその裏っ<emoji=heart04>\u3000そこばっかり、ん、んんぅっ<emoji=heart04>\u3000ひぅぅううっ<emoji=heart04>」"
translation = "「하아, 아, 아앗<emoji=heart04> 응응으, 응아앗<emoji=heart04> 배꼽 뒤쪽<emoji=heart04> 거기만, 응, 응응읏<emoji=heart04> 히우우우우<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ちゃんとカメラのレンズを見ろ、ウサギらしくするんだ──そんな命令までしてしまう。俺もだいぶ、興奮にあてられていた。"
translation = "똑바로 카메라 렌즈를 봐라, 토끼답게 해라── 그런 명령까지 하고 만다. 나도 상당 부분, 흥분에 휩싸여 있었다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「す、すみませっ<emoji=heart04>\u3000あ、ぁあっ<emoji=heart04>\u3000ぶ、ぶい、ぶいっ<emoji=heart04>\u3000ぴょ、ぴょん、ぴょんっ<emoji=heart04>\u3000あ、あぁ、あぁああっ<emoji=heart04>」"
translation = "「죄, 죄송해<emoji=heart04> 아, 아앗<emoji=heart04> 브, 브이, 브이<emoji=heart04> 까, 깡충, 깡충<emoji=heart04> 아, 아아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「これが、わ、私っ？\u3000責められてる時の、私の顔っ<emoji=heart04>\u3000はあぁ、あ、あぁあっ<emoji=heart04>\u3000恥ずかし、恥ずかしいっ──んんぅ<emoji=heart04>」"
translation = "「이게, 나, 나? 괴롭혀지고 있을 때의, 내 얼굴<emoji=heart04> 하아, 아, 아아앗<emoji=heart04> 부끄러, 부끄러워── 응응으<emoji=heart04>」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「で、でも、でもでもっ<emoji=heart04>\u3000隠しませ、んっ<emoji=heart04>\u3000全部、撮影、してっ<emoji=heart04>\u3000会長に喜んで、もらわないとっ──お、おっぉおっ<emoji=heart04>」"
translation = "「하, 하지만, 하지만 하지만<emoji=heart04> 숨기지, 않아요<emoji=heart04> 전부, 촬영, 해줘<emoji=heart04> 회장님이 기뻐해, 주셔야 하니까── 오, 오오오<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ウサギのカチューシャがふりふりと揺れる。シュティレの全身はしっとり火照って、汗ばんでいた。"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「気持ちいいっ<emoji=heart04>\u3000会長のぴすとん、だ、大好きっ<emoji=heart04>\u3000大好きですっ──ふわぁあぁっ<emoji=heart04>\u3000あ、あぁあ<emoji=heart04>\u3000ひぅんっ<emoji=heart04>\u3000んぁぁっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あぁぁあっ<emoji=heart04>\u3000き、記録に残っちゃいますっ<emoji=heart04>\u3000全部残っちゃいますっ<emoji=heart04>\u3000感じてるお顔もっ<emoji=heart04>\u3000チ○ポを咥えてるおま○こもっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「お、ぉ、ぉおおっ<emoji=heart04>\u3000おま○この奥っ<emoji=heart04>\u3000ズンズンされてる時の、えっちなお顔も<emoji=heart04>\u3000全部、ビデオに残っちゃいます、んんんっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "──今しているエッチを、後で見返せる。いつでもシュティレの痴態を再生して、オカズにすることができる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そのことを実感するたびに、俺のピストンに熱がこもる。"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ぴょ、ぴょん、ぴょんっ<emoji=heart04>\u3000ぴょんぴょん、ぴょんっ<emoji=heart04>\u3000会長の躾けぴすとんっ、すごい、ぴょんっっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あとで会長に見られるの、恥ずかしいのにっ、う、嬉しい、ぴょんっ<emoji=heart04>\u3000いっぱい使ってっ<emoji=heart04>\u3000くださいぴょんっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はぁ、はぁ、はぁあっ<emoji=heart04>\u3000も、もう、限界、ですからっ<emoji=heart04>\u3000オナニーしてる会長も、ペース上げてっ<emoji=heart04>\u3000くださいっ<emoji=heart04>\u3000ぶいっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "今後、俺のオカズになることを見越して、画面の向こうへのセリフまで挟み始めた──あまりにいやらしすぎる。ラストスパートを止められない。"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あっあっあっあっあっ<emoji=heart04>\u3000射精、射精されちゃいますっ<emoji=heart04>\u3000ウサギのおま○こ、会長の精液でドロドロにされちゃいますっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「イってるお顔、ばっちり映しますっ<emoji=heart04>\u3000だから会長、イって、イって<emoji=heart04>\u3000イってイってイってっ<emoji=heart04>\u3000あ、あ、あ、ああぁあっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「好き、好き、好き好き好き好き好きっ──ん、んん、んぅうぅう～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あ、ああぁぁあっ<emoji=heart04>\u3000イクっ、イクっ<emoji=heart04>\u3000イク、ぅぅぅうぅぅうう～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「んぁあぁぁぁぁあぁあああ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あ、ああぁあっ<emoji=heart04>\u3000ひぅぅう、んんんぅうぅう～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "シュティレの体をがっちり捕まえて、お腹の奥へめがけて全力の射精を見舞う。"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「お、ぉぉおっ<emoji=heart04>\u3000あ、あぁぁあっ──ふぅう、んぁあ、あ、あぁぁあっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「精液──んんうっ<emoji=heart04>\u3000ひぅあ<emoji=heart04>\u3000ど、どれだけ、出てっ──あ、あぅうっ<emoji=heart04>\u3000あ、あぁっ……うぅ、んんっ──<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺の腕の中でガクガク、ビクビクと震えるシュティレが愛おしい。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "搾るようなペニスへの締め付けはあまりに心地よくて。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "膝から力が抜けないように歯を食いしばりながら、俺は最後の一滴まで彼女の中へ撃ち込んだ。"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふはぁぁあっ……はあぁあっ……はひぃっ……ひぅ、んんっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ぁぁあ……チ○ポ、抜けてっ……ふぅうっ<emoji=heart04>\u3000こ、こんなに、たくさん……出して、いただけた、だなんて……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ぴ、ぴーす……ぴーす……<emoji=heart04>\u3000会長に、たくさん、あ、愛して、いただきました……ぴょん……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ご満足、い、いただけましたか……会長……？」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……最高だった」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふふ……それなら、提案した甲斐が、あ、ありました……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「でも……私、イった後って……こ、こんな顔、してるんですね……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「どろどろに、ふやけて……<emoji=heart04>\u3000ふ、ふふー……表情は、あまり、動かない……そんな自覚が、あったのですが……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「シュティレはエッチの後は、いつもこんな感じだよ。最高に、可愛い」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あは……<emoji=heart04>\u3000可愛いと、言っていただけました……こ、この喜びは……ジェスチャーで、表すしか、ありませんね……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長……大好きです<emoji=heart04>\u3000これからもいっぱい、らぶらぶハメ撮り、いたしましょう……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ぶい、ぶい、ぶいの──ぶいっ<emoji=heart04>」"
translation = ""

