[[dialogue]]
speaker = "unk"
original = "第９話,『ハロウィンのあとに』,B"
translation = "제9화, 『할로윈의 뒤에』, B"

[[dialogue]]
speaker = "unk"
original = "ライブの後も、ハロウィンパーティーは大盛況だった。"
translation = "라이브 후에도, 할로윈 파티는 성황이었다."

[[dialogue]]
speaker = "unk"
original = "デネブの人々は、久しぶりに開かれた大々的な饗宴を楽しみ、笑顔を浮かべ──"
translation = "데네브의 사람들은, 오랜만에 열린 대대적인 향연을 즐기며, 미소를 짓고──"

[[dialogue]]
speaker = "unk"
original = "やがて、お祭り騒ぎの時間は終わりを迎えた。"
translation = "이윽고, 축제 소동의 시간은 끝을 맞이했다."

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ルヴィネ様、こちらの飾りの取り外しは終わりました」"
translation = "「루비네 님, 이쪽의 장식 제거는 끝났습니다」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「もぐもぐ……こちらも片付け終わったぞ」"
translation = "「우물우물…… 이쪽도 정리가 끝났다구」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「行儀が悪いですよ、アルモタヘル。お肉を食べながら喋らない」"
translation = "「버릇이 없군요, 알모타헬. 고기를 먹으면서 말하지 마세요」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ふぐぅ……」"
translation = "「큭……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「みんな、片付けまで手伝ってくれて、ありがとう」"
translation = "「모두, 정리까지 도와줘서 고마워」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「主であるルヴィネさまが頑張ってるんだから、ボクたちが頑張るのは当然だよ」"
translation = "「주인인 루비네 님이 열심히 하고 계시니까, 우리가 열심히 하는 건 당연한 거야」"

[[dialogue]]
speaker = "unk"
original = "星徒会室の飾り付けが全て外され、非日常の景色はすっかり日常の景色へと変わっていた。"
translation = "성도회실의 장식이 모두 제거되어, 비일상의 풍경은 완전히 일상의 풍경으로 변해 있었다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……今日のパーティーは大成功だったわ。みんなはその盛り上がりにひと役もふた役も買ってくれた」"
translation = "「……오늘 파티는 대성공이었어. 모두는 그 열기에 한몫도 두몫도 해 주었지」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「それについても改めてお礼を言わせて、ありがとう」"
translation = "「그에 대해서도 새삼 감사를 표할게, 고마워」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ルヴィネ様はご満足いただけましたか？」"
translation = "「루비네 님은 만족하셨습니까?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ええ、とっても楽しかったわ」"
translation = "「응, 정말 즐거웠어」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「私たちにとっても貴重な体験になりました」"
translation = "「저희에게도 귀중한 경험이 되었습니다」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ハロウィンに向けて皆が一丸となって努力すること。その結実であるハロウィンパーティーを楽しむこと──」"
translation = "「할로윈을 향해 모두가 하나가 되어 노력하는 것. 그 결실인 할로윈 파티를 즐기는 것──」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「それらをこの身で感じることができたことを、心より嬉しく思います」"
translation = "「그것들을 이 몸으로 느낄 수 있었던 것을, 진심으로 기쁘게 생각합니다」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「それは私も同じよ」"
translation = "「그건 나도 마찬가지야」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「お祭りという非日常が、過酷な日々を過ごすデネブの人々の心の癒しになる……」"
translation = "「축제라는 비일상이, 가혹한 나날을 보내는 데네브 사람들의 마음의 안식이 된다……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「理屈で知っていたつもりになっていたけれど……みんなを楽しませるために色々な準備をして、それが実際に喜ばれて」"
translation = "「이론으로 알고 있었다고 생각했지만…… 모두를 즐겁게 하기 위해 여러 가지 준비를 하고, 그것이 실제로 기뻐해 주어서」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「お祭りそのものだけじゃない、お祭りの準備まで含めたそのすべてがイベントであり……その中で得た感情のひとつひとつが、明日への活力へと繋がっている」"
translation = "「축제 그 자체뿐만 아니라, 축제의 준비까지 포함한 그 모든 것이 이벤트이며…… 그 속에서 얻은 감정 하나하나가, 내일로 향하는 활력으로 이어지고 있어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そんな光景を見て、祭というものの必要性をよりはっきりと理解できたわ。……『主体的に参加する』というのは、こういうことなのね」"
translation = "「그런 광경을 보고, 축제라는 것의 필요성을 보다 명확하게 이해할 수 있었어. ……『주체적으로 참여한다』라는 건, 이런 거였구나」"

[[dialogue]]
speaker = "unk"
original = "ルヴィネは噛みしめるように学びを語ったのだった。"
translation = "루비네는 되새기듯 배움을 이야기하는 것이었다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うーん……何とか無事に終わったね～」"
translation = "「으음…… 어떻게든 무사히 끝났네~」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「結果的にはな。無事に終えることが出来た。だが本当に綱渡りの連続だっただろう」"
translation = "「결과적으로는 말이지. 무사히 끝낼 수 있었다. 하지만 정말 아슬아슬한 순간의 연속이었겠지」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いや～、いろいろ迷惑をかけちゃってごめんね～」"
translation = "「아니~, 여러 가지로 폐를 끼쳐서 미안해~」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「でも、ラクシャの提案のおかげで私たちも、より主観的にハロウィンというものを実感し、楽しむことが出来ました」"
translation = "「하지만, 락샤의 제안 덕분에 저희도, 보다 주관적으로 할로윈이라는 것을 실감하고, 즐길 수 있었습니다」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「そうだな。何もかもが得難い経験ではあった」"
translation = "「그렇다. 무엇 하나 얻기 힘든 경험이긴 했다」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「最初に話を聞いた時には、全く意味が分からなかったが……提案してくれたこと、感謝している」"
translation = "「처음에 이야기를 들었을 때에는, 전혀 의미를 알 수 없었지만…… 제안해 준 것, 감사하고 있다」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「お～、そうなんだ。まさか感謝の言葉が貰えるとは思ってなかったよ～」"
translation = "「아~, 그렇구나. 설마 감사의 말을 들을 줄은 몰랐네~」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、そうだ。せっかく結成した『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』だし、ハロウィン１日で終わりにするのももったいないよね？」"
translation = "「아, 맞다. 모처럼 결성한 『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』이고, 할로윈 하루로 끝내기엔 아깝잖아?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「この際だからさ、定期的にライブをするっていうのはどう？\u3000ほら、デネブではライブしたけど、アルタイルではしてないわけだし」"
translation = "「이왕 이렇게 된 김에 말이야, 정기적으로 라이브를 하는 건 어때? 봐봐, 데네브에서는 라이브를 했지만, 알타이르에서는 안 했잖아」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「絶対反対っ！！！！！！」"
translation = "「절대 반대!!!!!!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「え～」"
translation = "「에~」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「今回はおまけで参加してあげただけって言ったよね？\u3000だからこれで終わり！\u3000絶対あり得ない！」"
translation = "「이번엔 덤으로 참가해 준 것뿐이라고 말했잖아? 그러니까 이걸로 끝! 절대 말도 안 돼!」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「パテルは何をプリプリと怒っている？」"
translation = "「파텔은 무엇 때문에 씩씩거리며 화를 내고 있는 건가?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ライブの最後のＭＣの時、無理やりスポットライトを当てちゃったから……ちょっと拗ねてるんだよね」"
translation = "「라이브의 마지막 MC 때, 억지로 억지로 스포트라이트를 비춰 버렸으니까…… 약간 삐쳐 있단 말이지」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「成程。それでライブの後からやけに静かだったのか」"
translation = "「과연. 그래서 라이브 후부터 유난히 조용했던 건가」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「それを言うならわたくしの紹介も酷かったんじゃないかしら？」"
translation = "「그걸 말하자면 저의 소개도 심하지 않았나요?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「というか全員酷かっただろう」"
translation = "「이라기보다 전원 심했잖아」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ちょっと弄る感じにした方がオイシイかな～って」"
translation = "「조금 놀리는 느낌으로 하는 게 반응이 좋으려나~ 싶어서」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ラクシャ。終わったことよりも、我らにとってもっと重大なことがまだ残っているだろう」"
translation = "「락샤. 지나간 일보다도, 우리에게 있어 더욱 중대한 일이 아직 남아 있지 않은가」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「はいはい、焼肉ですね」"
translation = "「네네, 고깃집이죠」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「うむ。ライブ後の定番は焼肉なのであろう？\u3000ずっと楽しみにしていたのだ」"
translation = "「음. 라이브 뒤의 정석은 고깃집 아니겠느냐? 줄곧 기대하고 있었다」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あなたは会場の片付けの際にもずっと食べていただろう……」"
translation = "「당신은 회장의 정리를 할 때에도 계속 먹고 있었잖아요……」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「無論、打ち上げは別腹だ」"
translation = "「무론, 뒤풀이는 별개의 배다」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「んじゃ打ち上げの焼き肉屋で、『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』の今後についてじっくり話そうか」"
translation = "「그럼 뒤풀이 고깃집에서, 『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』의 향후에 대해 진지하게 이야기해 볼까」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「だからやらないって！\u3000ぜーったいやらないっ！」"
translation = "「그러니까 안 한다고! 절~대 안 해!」"

[[dialogue]]
speaker = "unk"
original = "断固拒否するパテルの声が夜空に響く。"
translation = "단호히 거부하는 파텔의 목소리가 밤하늘에 울려 퍼진다."

[[dialogue]]
speaker = "unk"
original = "こうしてハロウィンパーティーのために結成されたバンド、『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』はハロウィンの終わりと共に解散が決定したのだった。"
translation = "이렇게 할로윈 파티를 위해 결성된 밴드, 『Ｇｏｌｄｅｎ\u3000Ａｎｇｅｌｓ』는 할로윈의 끝과 함께 해산이 결정된 것이었다."

