[[dialogue]]
speaker = "unk"
original = "第３話,イチャイチャイタズラ合戦,P"
translation = "제3화, 꽁냥꽁냥 장난 합전"

[[dialogue]]
speaker = "unk"
original = "先日のデネブでのおもてなしのお礼に、またアルタイルにやってきたベアトリスをカフェに誘った。"
translation = "요전날 데네브에서의 대접에 대한 답례로, 다시 알타일에 찾아온 베아트리스를 카페로 불렀다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「じゃ、じゃーんっ！\u3000お待たせしました、会長さんっ」"
translation = "「짜, 짜잔! 기다리셨습니다, 회장님!」"

[[dialogue]]
speaker = "unk"
original = "ベアトニャンだー！"
translation = "베아트냥이다—!"

[[dialogue]]
speaker = "unk"
original = "その格好は！？"
translation = "그 차림은!? "

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「せっかくハロウィンフォームを手に入れたので、この衣装でパーティーに参加しようと思うんですけど……」"
translation = "「모처럼 할로윈 폼을 얻었으니까, 이 의상으로 파티에 참가하려고 생각하는데요……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ちょっと浮かれすぎですかね……？\u3000ど、どうですかニャン？」"
translation = "「너무 들뜬 걸까요……? 어, 어떤가요 냥?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「……え？\u3000かわいい？\u3000そ、そうですか……」"
translation = "「……네? 귀엽다구요? 그, 그런가요……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えへへ、それなら～……会長さん、トリック・オア・トリートっ！」"
translation = "「에헤헤, 그렇다면~…… 회장님, 트릭 오어 트릿!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「……お菓子の持ち合わせがない？\u3000仕方ないですね、それならイタズラしちゃいますニャン、ふっふっふ」"
translation = "「……가지고 있는 과자가 없다구요? 어쩔 수 없네요, 그렇다면 장난을 쳐버릴 거예요 냥, 후후후」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「イタズラ……イタズラ……？\u3000イタズラって何をすればいいんですかね？」"
translation = "「장난…… 장난……? 장난은 뭘 하면 좋을까요?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ビックリさせたいとは思うんですけど……人に迷惑をかけるようなイタズラはよくないと思うんですっ」"
translation = "「놀라게 해주고 싶기는 한데요…… 남에게 피해를 주는 장난은 안 좋다고 생각해요!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うーん、いざ考えると難しいですね……ゴーストさんたちみたいに、会長さんに落書きをするわけにもいかニャいですし……」"
translation = "「음—, 막상 생각하려니 어렵네요…… 고스트들처럼 회장님한테 낙서를 할 수도 없는 노릇이고요 냥……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「考えてみると難しいです……会長さん、ニャにかイタズラのヒントをくださいっ！」"
translation = "「생각해 보면 어렵네요…… 회장님, 뭐냥 장난의 힌트를 주세요!」"

[[dialogue]]
speaker = "unk"
original = "自分がやられたら恥ずかしいこととか？"
translation = "자기가 당하면 부끄러운 거라든가?"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私がされたら、恥ずかしいことですか……そうですニャア、それなら──」"
translation = "「제가 당하면 부끄러운 거요…… 그렇겠냐아, 그렇다면──」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「～～～っ！！？？\u3000こ、これはダメだよねっ！\u3000エッチすぎちゃうよねっ！」"
translation = "「~~~!!?? 이, 이건 안 되지! 너무 야하잖아!」"

[[dialogue]]
speaker = "unk"
original = "自分の妄想で顔を赤らめたり、身悶えたりするベアトリス。"
translation = "자신의 망상으로 얼굴을 붉히거나, 몸부림치는 베아트리스."

[[dialogue]]
speaker = "unk"
original = "だがようやく実行できるイタズラを思いついたようだ。"
translation = "하지만 드디어 실행할 수 있는 장난이 떠오른 듯하다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「よ、よーし、イタズラしちゃいますよっ！」"
translation = "「좋, 좋아—, 장난을 쳐버리겠어요!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「すみませーん！\u3000このジュース、ひとつお願いしまーす」"
translation = "「여기요—! 이 주스, 하나 부탁해요—」"

[[dialogue]]
speaker = "unk"
original = "ベアトリスが注文し、テーブルに到着したのはジョッキサイズの特大フルーツジュースだ。"
translation = "베아트리스가 주문하고, 테이블에 도착한 것은 조끼 사이즈의 특대 과일 주스다."

[[dialogue]]
speaker = "unk"
original = "添えてある２本のストローは、ぐるぐる回ってハートの形を描いていた。"
translation = "곁들여진 2개의 빨대는, 빙글빙글 돌아 하트 모양을 그리고 있었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふっふっふ……会長さんは私とこのジュースを一緒に飲まなければいけないのニャッ。これが私の考えたイタズラですニャン！」"
translation = "「후후후…… 회장님은 나와 이 주스를 같이 마셔야만 해요 냥. 이것이 내가 생각한 장난입니다 냥!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私はこっち、会長さんはあっち側のストローを咥えて……ちゅ～～～っ……んぐんぐっ……あっ、このジュース、美味しいですねっ」"
translation = "「나는 이쪽, 회장님은 저쪽 빨대를 물고…… 쪽~~~…… 꿀꺽꿀꺽…… 아, 이 주스, 맛있네요!」"

[[dialogue]]
speaker = "unk"
original = "（これってイタズラかなぁ……？）"
translation = "(이게 장난인가……?)"

[[dialogue]]
speaker = "unk"
original = "トロピカルで美味しいね"
translation = "트로피컬하고 맛있네"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぐ、んぐ……ちゅーちゅー……会長さん、全然飲んでないんじゃニャいですか？\u3000ちっとも減らないですよ？」"
translation = "「꿀꺽, 꿀꺽…… 쪽쪽…… 회장님, 전혀 안 마시고 있는 거 아닌가요 냥? 조금도 줄어들지 않아요?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "（会長さんと向かい合って吸い合うのって、お互いを吸血してるみたいで……ちょっとエッチかもっ……！）"
translation = "(회장님이랑 마주 보고 빨아 마시는 건, 서로를 흡혈하고 있는 것 같아서…… 조금 야할지도……!)"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぐ、んぐ……ちゅうぅ……そんなにじっと見つめられたら照れちゃいます～っ」"
translation = "「꿀꺽, 꿀꺽…… 쪽…… 그렇게 빤히 바라보시면 부끄러워요~」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「んぐっ、んぐっ……ちゅうぅぅぅ……ぷはっ！\u3000飲み終わりましたねっ、どうでしたか、私のイタズラはっ」"
translation = "「꿀꺽, 꿀꺽…… 쪽…… 푸하! 다 마셨네요, 어땠나요, 나의 장난은!」"

[[dialogue]]
speaker = "unk"
original = "攻守交代だ、トリック・オア・トリート！"
translation = "공수교대다, 트릭 오어 트릿!"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ふふ、甘いですよ、会長さん。お菓子だけに！」"
translation = "「후후, 만만해요, 회장님. 과자처럼 말이죠!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「こんなこともあろうかと、私はちゃ～んとお菓子をストックして……して……して……？\u3000あれれ？」"
translation = "「이럴 줄 알고, 나는 매~우 챙겨서 과자를 비축해…… 비축…… 비축……? 어라라?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「来る途中にアポロちゃんにあげて……いつの間にかお菓子の持ち合わせ、使い切っちゃってましたっ！」"
translation = "「오는 길에 아폴로짱에게 줘버려서…… 어느새 가지고 있던 과자를 다 써버렸어요!」"

[[dialogue]]
speaker = "unk"
original = "詰めが甘い……お菓子だけに"
translation = "마무리가 어설프네…… 과자처럼 말이지"

[[dialogue]]
speaker = "unk"
original = "さすがはベアトリス"
translation = "역시 베아트리스"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「むう……仕方ないですね、観念しました」"
translation = "「으으…… 어쩔 수 없네요, 체념했어요」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「会長さんはどんなイタズラを仕掛けてくるんですか？\u3000イタズラのお手本、見せてくださいっ」"
translation = "「회장님은 어떤 장난을 칠 건가요? 장난의 본보기, 보여주세요!」"

[[dialogue]]
speaker = "unk"
original = "つんっ、つんっ"
translation = "콕콕"

[[dialogue]]
speaker = "unk"
original = "それじゃ軽～～く……"
translation = "그럼 가볍~~게……"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「きゃんっ<emoji=heart04>\u3000脇腹はくすぐったいですっ！\u3000ボディタッチは反則ですよ～っ！」"
translation = "「꺄앙<emoji=heart04> 옆구리는 간지러워요! 바디 터치는 반칙이에요~!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「それがありなら、私だって会長さんに触っちゃいますよ。えいっ、えいっ<emoji=heart04>」"
translation = "「그게 허용된다면, 나도 회장님을 만질 거예요. 에잇, 에잇<emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あんっ<emoji=heart04>\u3000もう、会長さんの反撃は、的確に弱点を突いてきますよねっ」"
translation = "「앙<emoji=heart04> 정말, 회장님의 반격은 정확하게 약점을 질러오네요!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ハロウィンフォームを身にまとっている以上、負けるわけにはいかニャいですっ、こちょこちょこちょっ」"
translation = "「할로윈 폼을 두르고 있는 이상, 질 수는 없는 법이에요 냥, 간질간질간질!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「やぁんっ<emoji=heart04>\u3000待って、待ってっ、会長さんズルいですっ！\u3000そこまでするなら私にだって考えが──」"
translation = "「야앙<emoji=heart04> 잠깐, 잠깐만요, 회장님 치사해요! 거기까지 한다면 나한테도 생각이──」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「……どんな考えがあるのか興味深いところだが、そろそろやめておいた方が良さそうだぞ」"
translation = "「……어떤 생각이 있는지 흥미로운 부분이다만, 슬슬 그만두는 편이 좋을 것 같구나」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ひゃあっ！？\u3000り、梨緒ちゃんっ！？」"
translation = "「히얏!? 리, 리오짱!?」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「どこからともなくいかがわしい声が聞こえてくると思ったら……いかがわしい格好で何をしているんだ」"
translation = "「어디선가 수상쩍은 소리가 들려온다고 생각했더니…… 수상쩍은 차림으로 뭘 하고 있는 거지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「いかがわしい声でもないし、いかがわしい格好でもないし、いかがわしいこともしてませんよっ！？\u3000……ですニャ？\u3000会長さん？」"
translation = "「수상쩍은 소리도 아니고, 수상쩍은 차림도 아니고, 수상쩍은 짓도 안 했어요!? ……그렇죠 냥? 회장님?」"

[[dialogue]]
speaker = "unk"
original = "シテマセンヨ"
translation = "안 했어요"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んー？\u3000どっち見てるんだ、魔王。そっちには誰もいないぞー？」"
translation = "「응—? 어느 쪽을 보고 있는 거냐, 마왕. 그쪽엔 아무도 없다고—?」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「露骨に視線をそらしているのが、いかがわしさの証明だな」"
translation = "「노골적으로 시선을 돌리는 게, 수상쩍다는 증거로군」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、そもそもアポロちゃんにお菓子を取られちゃったから、イタズラ合戦にニャっちゃったんだよっ」"
translation = "「그, 애초에 아폴로짱한테 과자를 빼앗겨서, 장난 합전이 되어버린 거라고 냥」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「それなら、あたしもくすぐりっこ勝負に混ざればいいのか？\u3000くすぐるのは得意だぞっ！\u3000うりうりうりうりっ！」"
translation = "「그러면, 나도 간지럽히기 승부에 섞이면 되는 건가? 간지럽히는 건 자신 있다고! 우리우리우리우리!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ひゃあんっ<emoji=heart04>\u3000ちょ、ちょっと、アポロちゃんっ<emoji=heart04>\u3000それだめっ<emoji=heart04>\u3000そこはもうくすぐりじゃないからぁっ<emoji=heart04>」"
translation = "「히야앙<emoji=heart04> 자, 잠깐만요, 아폴로짱<emoji=heart04> 그건 안 돼<emoji=heart04> 거기선 이제 간지럽히는 게 아니니까아<emoji=heart04>」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「ベアト！\u3000キミは控えめな性格のわりに声が大きいぞ！\u3000そのような嬌声をあげていたらお店に迷惑が──」"
translation = "「베아트! 너는 조신한 성격치고는 소리가 크다! 그런 교성을 지르고 있으면 가게에 피해가──」"

[[dialogue]]
speaker_original = "蛍火"
speaker_translation = "호타루비"
original = "「ここはカフェテリアですので、いかがわしい行為はお店の外でお願いします」"
translation = "「여기는 카페테리아이므로, 수상쩍은 행위는 가게 밖에서 부탁드립니다」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「だから、いかがわしいことなんてしてませんニャァァァンッ<emoji=heart04>」"
translation = "「그러니까, 수상쩍은 짓 따위 안 했다고요 냐아아아앙<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "あらぬ疑い（？）をかけられた俺たちは、カフェから追い出されてしまうのだった。"
translation = "쓸데없는 의심(?)을 받은 우리들은, 카페에서 쫓겨나고 마는 것이었다."

