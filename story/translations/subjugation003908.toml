[[dialogue]]
speaker = "unk"
original = "果たして、ヨミと狛里の２人により、ライカンスウォームのボス個体は討伐された。"
translation = "결국 요미와 코마리 두 사람에 의해 라이칸 스웜의 보스 개체는 토벌되었다."

[[dialogue]]
speaker = "unk"
original = "その後、増殖が止まった群れについても、学園の星騎士たちによって無事に全滅させることができた。"
translation = "그 후 증식이 멈춘 무리에 대해서도 학원의 성기사들에 의해 무사히 전멸시킬 수 있었다."

[[dialogue]]
speaker = "unk"
original = "それから数日後。"
translation = "그리고 며칠 후."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ヨミ先輩！\u3000頼まれていたお掃除、終わったのです！」"
translation = "「요미 선배! 부탁받았던 청소, 끝난 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里、ありがとうございます」"
translation = "「코마리, 고맙습니다.」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……あっ、そこの隅っこの窓、拭き忘れがありますね」"
translation = "「……앗, 저기 구석에 있는 창문, 닦는 걸 잊으셨네요.」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ！？」"
translation = "「바우와프!?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ほ、本当なのです！\u3000ごめんなさいなのです……」"
translation = "「정, 정말인 것입니다! 죄송한 것입니다……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ですが、以前よりミスが減って、丁寧な仕事ができていると感じますよ！」"
translation = "「하지만 이전보다 실수도 줄고 꼼꼼하게 잘 해내고 있다고 느껴져요!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへっ♪\u3000本当でありますか……？\u3000ヨミ先輩にそう言ってもらえると、嬉しいのです！」"
translation = "「에헤헤♪ 정말인 것입니까……? 요미 선배에게 그런 말을 들으니 기쁜 것입니다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「実は最近、お仕事が終わった後に『見直しの時間』を作るようにしているのです！」"
translation = "「사실 최근에는 일이 끝난 후에 『검토 시간』을 만들도록 하고 있는 것입니다!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「なるほど。凄くいいことだと思います」"
translation = "「그렇군요. 아주 좋은 일이라고 생각해요.」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「焦らなくても、狛里は十分頑張っていますから。この調子で行きましょう！」"
translation = "「서두르지 않아도 코마리는 충분히 노력하고 있으니까요. 이 기세로 가기로 해요!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいなのですっ！」"
translation = "「네인 것입니다!」"

[[dialogue]]
speaker = "unk"
original = "狛里は嬉しそうに尻尾を振る。"
translation = "코마리는 기쁜 듯이 꼬리를 흔든다."

[[dialogue]]
speaker = "unk"
original = "その様子を見て、ヨミも少し嬉しくなるのだった。"
translation = "그 모습을 보고 요미도 조금 기뻐지는 것이었다."

[[dialogue]]
speaker = "unk"
original = "昼休み。"
translation = "점심시간."

[[dialogue]]
speaker = "unk"
original = "俺が食事をしていると――"
translation = "내가 식사를 하고 있자――"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様、発見であります♪」"
translation = "「마왕님, 발견인 것입니다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「くんくん、くんくん♪」"
translation = "「킁킁, 킁킁♪」"

[[dialogue]]
speaker = "unk"
original = "こ、狛里、人前だと恥ずかしいって！"
translation = "코, 코마리, 남들 앞에서는 부끄럽다고!"

[[dialogue]]
speaker = "unk"
original = "狛里は俺の隣へやって来ると、べったりと体をひっつけて頭や腋の匂いを嗅ぎ始めた。"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへっ、今日も魔王様はいい匂いがするのです♪」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こややっ！？\u3000こ、狛里！\u3000お昼休憩だからといって、会長にくっ付き過ぎです！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ♪\u3000だって魔王様の匂い、大好きなんですもん♪」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「め、メイドたるもの、節度は必要ですよ！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「は～い♪」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「返事だけは素直なんですから、もう……」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「てへへ♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "狛里の尻尾が、楽しそうにパタパタと振られる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヨミも狛里にすっかり懐かれてるな"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あはは……。威厳がなくて、いいのか悪いのか」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「それでは一緒に、本日の料理練習を始めましょう！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「了解であります！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「今日は肉じゃがなのですね！」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はい。メイド長から教わった内容を思い出して――」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……あれ？」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ヨミ先輩？」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そのぉ……じゃがいもって、先に入れるんでしたっけ？」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「え？」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「お肉が先でしたっけ……？」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「え？」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「…………」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「…………」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやぁ～～っ！？」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「わ、忘れてしまいました～～っ！！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「だ、大丈夫なのです！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里、ちゃんとメモしてあるのです！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "狛里は懐からメモ帳を取り出す。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「助かります……！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「先輩、できない時は狛里を頼ってくださいなのです」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里も、できない時はヨミ先輩を頼るのですから！」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「……ふふっ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヨミは少し照れながら笑った。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「そうですね」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「私も、まだまだ未熟です」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「でも――」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里が安心して頼れるような先輩になれるよう、これからも頑張ります」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里も、そんな先輩を頼ってもらえるような、立派な後輩になるのです！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "２人は顔を見合わせる。そして――"
translation = ""

[[dialogue]]
speaker_original = "ヨミ＆狛里"
speaker_translation = "ヨミ＆狛里"
original = "「あははっ♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "楽しそうな笑い声が厨房に響く。"
translation = ""

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふむ」"
translation = ""

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ヨミも、少しは先輩らしくなったようだな」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「はい。まだまだ未熟ですけど……」"
translation = ""

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「先輩は後輩に教えて、一緒に成長していくものですから♪」"
translation = ""

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「であるな。狛里も一歩、良き方向へ進めたようだ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヨミと狛里を影から見守りながら、微笑む２人。"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「狛里、次は買い出しの復習をしますよ」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ！\u3000ちゃんとメモも持ってきたのです！」"
translation = ""

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「バッチリですね♪\u3000それでは一緒に行きましょう！」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「かしこまりましたであります！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "以前より少しだけ先輩らしくなったヨミと、前より落ち着いて人を頼れるようになった狛里。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "九浄家メイド隊の２人は、仲良く並んで歩き出すのだった。"
translation = ""

