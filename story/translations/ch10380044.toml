[[dialogue]]
speaker = "unk"
original = "第４話,これも命の営み？,P"
translation = "제4화, 이것도 영혼의 영위?"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「グワ～オォオオオッ！！」"
translation = "「크와~오오오옷!!」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「切り伏せます！\u3000は、ぁ、あぁ～っ<emoji=heart04>\u3000メガリビドーディヴァイダー！！」"
translation = "「베어버리겠습니다! 하, 아, 아아~앗<emoji=heart04> 메가 리비도 디바이더!!」"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「グォォ……」"
translation = "「크오오……」"

[[dialogue]]
speaker = "unk"
original = "デート中にモンスターと遭遇したが、イクシーがあっという間に一刀両断してしまった。"
translation = "데이트 중에 몬스터와 조우했지만, 익시가 순식간에 일도양단해 버렸다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「会長、見ていてくれましたか？\u3000私の戦いぶり、いかがでしたでしょうか？」"
translation = "「회장님, 보고 계셨나요? 제 싸우는 모습, 어떠셨나요?」"

[[dialogue]]
speaker = "unk"
original = "迫力満点だった"
translation = "박력 만점이었다."

[[dialogue]]
speaker = "unk"
original = "途中、変な声が漏れていた気がするけど、気のせいということにしておこう。"
translation = "중간에 이상한 소리가 새어 나왔던 것 같지만, 기분 탓으로 치기로 하자."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ありがとうございます。魔将の力も、使いこなせるようになってきたようです。……ん、んんっ<emoji=heart04>」"
translation = "「감사합니다. 마장의 힘도 능숙하게 다룰 수 있게 된 것 같습니다. ……응, 으응<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "もじもじと内ももをこすり合わせるイクシー。刺激的すぎて目に毒だ。"
translation = "꿀적꿀적 허벅지 안쪽을 문지르는 익시. 너무 자극적이라 눈독이다."

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「見事な剣閃だったぞ。イクシリオン」"
translation = "「훌륭한 검선이었다. 익실리온」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「アルモタヘル様！？\u3000ご覧になっていたのですね」"
translation = "「알모타헬 님!? 보고 계셨군요」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ああ、食べ歩きの最中で見かけてな。その新たな装いもよく似合っているぞ」"
translation = "「그래, 길거리 음식을 먹던 중에 보여서 말이지. 그 새로운 차림새도 잘 어울린다」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ありがとうございます。ですがこれは『色欲』の大罪の名を持つもの。《命脈》の守護天使たるアルモタヘル様にお見せするようなものでは……」"
translation = "「감사합니다. 하지만 이것은 『색욕』의 대죄의 이름을 가진 것. 《명맥》의 수호천사이신 알모타헬 님께 보여드릴 만한 것은……」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ふっ。そもそも『色欲』、すなわち性欲は生物が持つ本能……命の営みそのものだ。何を恥じらうことがあろう」"
translation = "「훗. 애초에 『색욕』, 즉 성욕은 생물이 가진 본능…… 생명의 영위 그 자체다. 무엇을 부끄러워하겠느냐」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「性欲があるから、新しい命が生まれる。お前たちだって、そうやって生まれてきたのだ。そして、お前たちからもいずれ新しい命が生まれるだろう」"
translation = "「성욕이 있기에 새로운 생명이 태어난다. 너희도 그렇게 태어난 것이다. 그리고, 너희에게서도 언젠가 새로운 생명이 태어나겠지」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「わわ、私たちから新しい命！？」"
translation = "「와와, 저희에게서 새로운 생명!?」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ん、違うのか？\u3000お前たちは番なのだから、いずれ子を授かるのだと思っていたが……いや、もちろん、お前たちが決めることだが。私がとやかく言うことではないか」"
translation = "「응, 아닌가? 너희는 짝이니까, 언젠가 아이를 가질 것이라 생각했다만…… 아니, 물론 너희가 결정할 일이지. 내가 왈가왈부할 일은 아닌가」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「私の子ども……会長の赤ちゃん……はぁ、はぁ……<emoji=heart04>」"
translation = "「제 아이…… 회장님의 아기…… 하아, 하아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「どうした？\u3000息が荒いぞ」"
translation = "「왜 그러나? 숨이 거칠구나」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ああ、いえ……なんでも……は、んっ<emoji=heart04>\u3000あぁっ、もう我慢できませんっ！\u3000失礼いたします～～！」"
translation = "「아아, 아뇨…… 아무것도…… 하, 앙<emoji=heart04> 아앗, 더 이상 못 참겠어요! 실례하겠습니다~~!」"

[[dialogue]]
speaker = "unk"
original = "突然、イクシーが俺を抱えて飛び上がる。そのまま向かったのは──"
translation = "갑자기 익시가 나를 안아 들고 뛰어오른다. 그대로 향한 곳은──"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「はぁ、はぁ……<emoji=heart04>\u3000うぅ～～～っ<emoji=heart04>」"
translation = "「하아, 하아……<emoji=heart04> 우으~~~읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "欲望に満ちた眼で俺を見つめるイクシー。ちょっと怖い。"
translation = "욕망에 찬 눈으로 나를 바라보는 익시. 조금 무섭다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ダメですっ！\u3000抑えきれませんっ！」"
translation = "「안 돼요! 억누를 수 없어요!」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ん、ちゅっ……ちゅるる、じゅるっ……ちゅぱ……は、あ、はぁ……ちゅ、ちゅる、ちゅるる……れろ、れろ……」"
translation = "「응, 츄…… 츄르르, 쥬릇…… 츄파…… 하, 아, 하아…… 츄, 츄르, 츄르르…… 레로, 레로……」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ぷはっ……アルモタヘル様のお言葉のせいで、会長と子作りすることを意識してしまって……はぁ、はぁ……体が、ん、疼いて我慢できないんです……」"
translation = "「푸하…… 알모타헬 님의 말씀 때문에, 회장님과 아이 만들기 하는 것을 의식해 버려서…… 하아, 하아…… 몸이, 앙, 쑤셔서 견딜 수 없어요……」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「会長……今すぐあなたが欲しいですぅ……<emoji=heart04>」"
translation = "「회장님…… 지금 당장 당신을 원해요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「……え？\u3000今日はキスだけで我慢？\u3000どうしてですかぁ！？\u3000今すぐ会長とあんなことこんなことしたいのにぃっ<emoji=heart04>」"
translation = "「……에? 오늘은 키스만으로 참으라고요? 어째서인가요!? 지금 당장 회장님과 이런 일 저런 일 하고 싶은데에<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "魔将の力を使いこなす訓練だよ"
translation = "마장의 힘을 다스리는 훈련이야."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「な、なるほど……魔将フォームになると、すぐ会長を求めてしまいます。これも暴走なのかもしれません」"
translation = "「나, 과연…… 마장 폼이 되면, 금방 회장님을 요구하게 됩니다. 이것도 폭주인 것일지도 몰라요」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「分かりました。今日はキスだけで我慢します。……残念ですけど、すごく残念ですけどぉ……」"
translation = "「알겠습니다. 오늘은 키스만으로 참을게요. ……아쉽지만, 너무 아쉽지만요……」"

[[dialogue]]
speaker = "unk"
original = "（ごめん、イクシー）"
translation = "(미안, 익시)"

[[dialogue]]
speaker = "unk"
original = "俺だってあんなことやこんなことしたい。だけどこのままじゃダメだと思うから、俺も我慢しないと。"
translation = "나도 이런 일이나 저런 일을 하고 싶다.하지만 이대로는 안 된다고 생각하니까, 나도 참아야 해."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「でも、キスはいくらしてもいいんですよね……？\u3000い～っぱい、い～～～っぱいキスしちゃいますからね<emoji=heart04>」"
translation = "「하지만, 키스는 얼마든지 해도 괜찮은 거죠……? 마~아니, 마~~~~~아니 키스할 테니까요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ちゅぱっ<emoji=heart04>\u3000ちゅるじゅるる、じゅる……ちゅ、ちゅるぱっ<emoji=heart04>\u3000んはぁ、れろれろ、りゅる……ちゅ、ちゅるる<emoji=heart04>」"
translation = "「츄팟<emoji=heart04> 츄르쥬르르, 쥬르…… 츄, 츄르팍<emoji=heart04> 으응하아, 레로레로, 리류르…… 츄, 츄르르<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ぶはっ……ねぇ、会長？\u3000キスはどこまでＯＫですか？\u3000このままでは会長の全身にキスしてしまいそうです<emoji=heart04>」"
translation = "「부하…… 저기, 회장님? 키스는 어디까지 OK인가요? 이대로라면 회장님의 전신에 키스해 버릴 것 같아요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "首から上ならまぁ……"
translation = "목 위라면 뭐……"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「分かりましたぁ<emoji=heart04>\u3000ん、ちゅっ、ちゅっ、ちゅっ<emoji=heart04>\u3000れろ、ん、ちゅっ<emoji=heart04>」"
translation = "「알겠습니다아<emoji=heart04> 응, 츄, 츄, 츄<emoji=heart04> 레로, 응, 츄<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーの唇が、俺の頬や首、額にまで触れる。触れていない場所はないほどに、キスの雨が降ってくる。"
translation = "익시의 입술이 내 뺨과 목, 이마에까지 닿는다. 닿지 않은 곳이 없을 정도로 키스의 비가 내려쏟아진다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ふふっ、ちょっと思い付いちゃいました<emoji=heart04>」"
translation = "「후후, 문득 좋은 생각이 떠올랐어요<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「んちゅっ<emoji=heart04>\u3000れぇろれぇろ、んちゅぱっ<emoji=heart04>\u3000れろれろれろ……んちゅ、ちゅっ<emoji=heart04>」"
translation = "「응츄<emoji=heart04> 레에로레에로, 응츄팍<emoji=heart04> 레로레로레로……응츄, 츄<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「どう、ですか？\u3000お耳にキスしてみました<emoji=heart04>」"
translation = "「어, 어때요? 귀에 키스해 봤어요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "これは危険だ。脳みそを直接舐められた気さえする。"
translation = "이건 위험하다. 뇌를 직접 핥아지는 느낌마저 든다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「じゃあ次はこっちから……」"
translation = "「그럼 다음은 이쪽에서……」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ちゅっ<emoji=heart04>\u3000んちゅる、ちゅるっ<emoji=heart04>\u3000れぇろれぇろ……んちゅぱっ<emoji=heart04>」"
translation = "「츄<emoji=heart04> 응츄루, 츄루<emoji=heart04> 레에로레에로……응츄팍<emoji=heart04>」"

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「私はキスで我慢しますけど、会長は我慢できますかぁ<emoji=heart04>\u3000んふふっ<emoji=heart04>」"
translation = "「저는 키스로 참겠지만, 회장님은 참을 수 있으신가요오<emoji=heart04> 응후후<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "イクシーが俺の理性を崩そうとしてきた。すでに勝てる気がしない。"
translation = "익시가 내 이성을 무너뜨리려 해 왔다. 이미 이길 수 있을 것 같지 않다."

[[dialogue]]
speaker_original = "イクシリオン（覚醒）"
speaker_translation = "イクシリオン（覚醒）"
original = "「ちゅっ、ちゅっ、ちゅっ<emoji=heart04>\u3000んちゅっ……ちゅるっ、んぱっ<emoji=heart04>\u3000れろれぇろ……んん、んちゅるっ、ちゅぱっ<emoji=heart04>\u3000れろ……れぇろれろ……<emoji=heart04>」"
translation = "「츄, 츄, 츄<emoji=heart04> 응츄……츄루, 응팍<emoji=heart04> 레로레에로……응응, 응츄루, 츄팍<emoji=heart04> 레로……레에로레로……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "結局、イクシーの攻撃は、俺が屈するまで続いたのだった……"
translation = "결국 익시의 공격은 내가 굴복할 때까지 계속된 것이었다……"

