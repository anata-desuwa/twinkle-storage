[[dialogue]]
speaker = "unk"
original = "リ・クリエの力を操る堕天使ザタナーンと、戦闘を開始した俺たち。"
translation = "리 크리에의 힘을 다루는 타천사 자타난과, 전투를 개시한 우리들."

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「これが今のクルセイダースの力か。だが――やはりリ・クリエの力には及ばない」"
translation = "「이것이 지금의 크루세이더스의 힘인가. 하지만―― 역시 리 크리에의 힘에는 미치지 못한다」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「くっ……めちゃくちゃ強い……！\u3000分厚い壁に守られてるみたいに、攻撃が全然通らない……！」"
translation = "「큭…… 엄청나게 강해……! 두꺼운 벽에 보호받고 있는 것처럼, 공격이 전혀 먹히지 않아……!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「私のバリアーは逆に、薄い氷みたいにすぐ割られてしまうのです……！」"
translation = "「제 배리어는 반대로, 얇은 얼음처럼 금방 깨져 버리는 것입니다……!」"

[[dialogue]]
speaker_original = "マトイ（覚醒）"
speaker_translation = "마토이(각성)"
original = "「私の盾も気休めくらいにしかならない……！」"
translation = "「내 방패도 위안 정도밖에 되지 않아……!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「それでも、負けないわ！\u3000決して諦めたりしない！」"
translation = "「그래도, 지지 않아! 결코 포기하지 않겠어!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「――はああぁっ！」"
translation = "「――하아아앗!」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「無駄だ」"
translation = "「소용없다」"

[[dialogue]]
speaker = "unk"
original = "そう言って手で払いのけるように、ザタナーンは凄まじい衝撃波を放つ。"
translation = "그렇게 말하며 손으로 쳐내듯, 자타난은 무시무시한 충격파를 내뿜는다."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「きゃああぁっ！？」"
translation = "「캬아아앗!?」"

[[dialogue]]
speaker = "unk"
original = "吹き飛ばされた聖沙を、リア先輩が受け止める。"
translation = "날아간 미사를, 리아 선배가 받아낸다."

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「聖沙ちゃん！\u3000大丈夫！？」"
translation = "「미사짱! 괜찮아!?」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「リア先輩、ありがとうございます……！」"
translation = "「리아 선배, 감사해요……!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「マズいわね……根本的な出力の差が圧倒的すぎる……！」"
translation = "「곤란하네…… 근본적인 출력 차이가 너무 압도적이야……!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ああ、私の魂も危険を囁き続けている。気を抜けば、一瞬で全滅しかねないと……！」"
translation = "「아아, 내 영혼도 위험하다고 계속 속삭이고 있다. 방심하면, 일순간에 전멸할지도 모른다고……!」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「当然だ。リ・クリエの力は、神でも制御できぬ力」"
translation = "「당연하다. 리 크리에의 힘은, 신조차 제어할 수 없는 힘」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「魔王の力がなければ、敵うはずもない」"
translation = "「마왕의 힘이 없다면, 당해낼 수 있을 리가 없다」"

[[dialogue]]
speaker = "unk"
original = "俺が戦うことができれば……！"
translation = "내가 싸울 수만 있다면……!"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「ダメよ、会長！\u3000力が使えない状態で、リ・クリエの力を受けたら、一瞬で消し飛ばされてしまうわ！」"
translation = "「안 돼, 회장! 힘을 쓸 수 없는 상태에서, 리 크리에의 힘을 받으면, 일순간에 날아가 버려!」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「リ・クリエの力を前に、魔王様が未だ戦えないこの状況、いよいよマズいぜ……！」"
translation = "「리 크리에의 힘을 앞에 두고, 마왕님이 아직도 싸우지 못하는 이 상황, 이제 진짜 곤란하다구……!」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「貴様たちの力は、我が脅威とはならないと判断した。故に……そろそろ終わらせよう」"
translation = "「너희의 힘은, 나의 위협이 되지 않는다고 판단했다. 고로…… 슬슬 끝내도록 하지」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「――女神に再生を」"
translation = "「――여신에게 재생을」"

[[dialogue]]
speaker = "unk"
original = "次の瞬間、ルネアの足元に黒い影が広がる。"
translation = "다음 순간, 루네아의 발밑에 검은 그림자가 펼쳐진다."

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「！\u3000足が影から離れない……！」"
translation = "「! 발이 그림자에서 떨이지지 않아……!」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「やべぇ！\u3000全員、ルネアを守れっ！」"
translation = "「위험해! 전원, 루네아를 지켜라!」"

[[dialogue]]
speaker_original = "マトイ（覚醒）"
speaker_translation = "마토이(각성)"
original = "「させない！\u3000ディバイドシールド！」"
translation = "「하게 두지 않아! 디바이드 실드!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「全力バリアーなのです！」"
translation = "「전력 배리어인 것입니다!」"

[[dialogue]]
speaker = "unk"
original = "マトイとロロットがルネアの前に何重にも、防御壁を展開する。"
translation = "마토이와 로롯이 루네아의 앞에 몇 겹으로나, 방어벽을 전개한다."

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「その強度は既に見極めている」"
translation = "「그 강도는 이미 파악했다」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「――無意味だ」"
translation = "「――무의미하다」"

[[dialogue]]
speaker = "unk"
original = "ザタナーンがリ・クリエの力を収束させた強大な閃光を撃ち放つ。"
translation = "자타난이 리 크리에의 힘을 수렴시킨 강대한 섬광을 쏘아보낸다."

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「一瞬で盾もバリアーも、全部消し飛ばされて……！？」"
translation = "「일순간에 방패도 배리어도, 전부 날아가 버리다니……!?」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ルネアちゃん、避けて！」"
translation = "「루네아짱, 피해!」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「くっ……！」"
translation = "「큭……!」"

[[dialogue]]
speaker = "unk"
original = "ルネアが霊力を最大にして、防御フィールドを展開。そこへザタナーンの放った閃光が衝突する。"
translation = "루네아가 영력을 최대치로 올려, 방어 필드를 전개. 그곳으로 자타난이 쏜 섬광이 충돌한다."

[[dialogue]]
speaker = "unk"
original = "うあっ――！？"
translation = "우앗――!?"

[[dialogue]]
speaker = "unk"
original = "爆風のような衝撃波が辺りに広がり、俺は吹き飛ばされて砂浜を転がる。"
translation = "폭풍 같은 충격파가 주변으로 퍼지고, 나는 날아가 모래사장을 구른다."

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「ふ、防ぎきれない……！」"
translation = "「막, 막아낼 수 없어……!」"

[[dialogue]]
speaker = "unk"
original = "わずか数秒で、ルネアの防御フィールドに亀裂が走る。"
translation = "불과 몇 초 만에, 루네아의 방어 필드에 균열이 간다."

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「っ……諦めない！」"
translation = "「쯧…… 포기 안 해!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「ザタナーン！\u3000ルネアさんに攻撃するのをやめなさい！\u3000――はああぁっ！」"
translation = "「자타난! 루네아 씨를 공격하는 걸 당장 그만두세요! ――하아아앗!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「聖沙、助太刀するぞ！\u3000ふっ――！」"
translation = "「미사, 거들겠다! 훗――!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ザタナーン！\u3000こっちよ！」"
translation = "「자타난! 여기야!」"

[[dialogue]]
speaker = "unk"
original = "ザタナーンの背後に回り、３人が攻撃を仕掛ける。"
translation = "자타난의 등 뒤로 돌아가, 3명이 공격을 시도한다."

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「通らぬ。もはや貴様らでは止められぬ」"
translation = "「통하지 않는다. 이제 너희로선 멈출 수 없다」"

[[dialogue]]
speaker = "unk"
original = "しかし、ザタナーンは微動だにせず、リ・クリエの防御フィールドの前に、攻撃はかき消されてしまう。"
translation = "하지만, 자타난은 미동조차 하지 않고, 리 크리에의 방어 필드 앞에, 공격은 지워지고 만다."

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「終わりだ、女神よ」"
translation = "「끝이다, 여신이여」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ダメ！\u3000ルネアちゃんを消さないで！」"
translation = "「안 돼! 루네아짱을 지우지 마!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「やめて！\u3000やめなさいよ！」"
translation = "「그만둬! 그만두란 말이야!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「ルネアーーっ！！\u3000逃げてぇーーーっ！！！」"
translation = ""

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「お願いですっ！\u3000誰か！\u3000ルネアさんをっ！！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "みんなが必死に叫んでいる、その中で。"
translation = "모두가 필사적으로 외치고 있는, 그 속에서."

[[dialogue]]
speaker = "unk"
original = "俺は地面に着いた手で、砂を握り締めながら、立ち上がる。"
translation = "나는 땅에 짚은 손으로, 모래를 쥐어짜며, 일어선다."

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「おい、魔王様、何を……！？」"
translation = "「어이, 마왕님, 뭘……!?」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「ダメ！\u3000会長、こっちに来ちゃ……！」"
translation = "「안 돼! 회장, 이쪽으로 오면……!」"

[[dialogue]]
speaker = "unk"
original = "大丈夫、俺は――"
translation = "괜찮아, 나는――"

[[dialogue]]
speaker = "unk"
original = "俺はルネアの方へと、迷わずに全力で走り出す。"
translation = "나는 루네아가 있는 쪽으로, 망설임 없이 전력으로 달려나간다."

[[dialogue]]
speaker = "unk"
original = "俺たちは――"
translation = "우리들은――"

[[dialogue]]
speaker = "unk"
original = "体の内側から上がる、その『声』を信じて。"
translation = "몸 안쪽에서 울려 퍼지는, 그 『목소리』를 믿고."

[[dialogue]]
speaker = "unk"
original = "『魔王』だ！！"
translation = "『마왕』이다!!"

[[dialogue]]
speaker = "unk"
original = "心を合わせて、告げる。"
translation = "마음을 맞춰, 고한다."

[[dialogue]]
speaker = "unk"
original = "主を導くは――"
translation = "주인을 인도하는 것은――"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「この力は……！」"
translation = "「이 힘은……!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「知っているのです！」"
translation = "「알고 있는 것입니다!」"

[[dialogue]]
speaker = "unk"
original = "古の盟約によりて降り立つ漆黒の天使"
translation = "고대의 맹약에 따라 강림하는 칠흑의 천사"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「うん。包み込むように温かくて、キラキラとした――」"
translation = "「응. 감싸 안듯이 따뜻하고, 반짝반짝한――」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「シンの……！」"
translation = "「신의……!」"

[[dialogue]]
speaker = "unk"
original = "――アヴァンシェル！！！"
translation = "――아방셸!!!"

[[dialogue]]
speaker = "unk"
original = "その瞬間、俺の体の中から力が湧き上がり、輝きとなって一気に広がる。"
translation = "그 순간, 내 몸속에서 힘이 솟구쳐 오르며, 빛이 되어 일시에 퍼진다."

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「何……！？」"
translation = "「뭐……!?」"

[[dialogue]]
speaker = "unk"
original = "その輝きはルネアを守り、ザタナーンの攻撃を吹き飛ばした。"
translation = "그 빛은 루네아를 지키고, 자타난의 공격을 날려버렸다."

[[dialogue]]
speaker_original = "マトイ（覚醒）"
speaker_translation = "마토이(각성)"
original = "「会長……その戦闘服は……！？」"
translation = "「회장…… 그 전투복은……!?」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「白い髪に、赤い瞳……目覚めたか……！」"
translation = "「하얀 머리에, 빨간 눈…… 눈을 뜬 건가……!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「シンちゃんと同じ、黒い戦闘服……！」"
translation = "「신짱과 같은, 검은 전투복……!」"

[[dialogue]]
speaker_original = "ルネア"
speaker_translation = "루네아"
original = "「武器も、シンと同じ杖……！」"
translation = "「무기도, 신과 같은 지팡이……!」"

[[dialogue]]
speaker = "unk"
original = "――みんな、遅くなってごめん"
translation = "――모두들, 늦어서 미안해"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「……！」"
translation = "「……!」"

[[dialogue]]
speaker = "unk"
original = "一瞬、ナナカは驚いたように目を丸くしてから、ふっと笑顔を浮かべて。"
translation = "일순간, 나나카는 놀란 듯 눈을 동그랗게 떴다가, 풋 미소를 지으며."

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「ははっ♪\u3000遅刻し過ぎでしょ、全く！」"
translation = "「하하♪ 지각이 너무 심하잖아, 정말!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「……もうっ！\u3000遅いわよ！\u3000間一髪だったじゃない！」"
translation = "「……정말이지! 늦었잖아! 일초지척이었다구!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ふふっ♪\u3000だけど、やっぱり魔王様だね♪\u3000こうしてちゃんと駆け付けてくれた」"
translation = "「후후♪ 하지만, 역시 마왕님이네♪ 이렇게 제대로 달려와 주고」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「えへへっ♪\u3000会長さんが一緒なら、一騎当千確実なのですよ！」"
translation = "「에헤헤♪ 회장님이 함께라면, 일기당천 확실한 것입니다!」"

[[dialogue]]
speaker_original = "ザタナーン"
speaker_translation = "자타난"
original = "「魔王……やはり、リ・クリエの抑止力として、立ちはだかるか……！」"
translation = "「마왕…… 역시, 리 크리에의 억지력으로서, 가로막아서는가……!」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「そうだぜ、ザタナーン」"
translation = "「그렇다구, 자타난」"

[[dialogue]]
speaker_original = "パッキー"
speaker_translation = "팟키"
original = "「魔王様は――これまで１度だって、リ・クリエを許したことはないんだからな！」"
translation = "「마왕님은―― 지금까지 단 한 번도, 리 크리에를 허용한 적이 없으니까 말이야!」"

[[dialogue]]
speaker = "unk"
original = "一緒に行くよ、みんな！"
translation = "함께 가자, 모두들!"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「はい♪\u3000なら、アレをやりましょ～！」"
translation = "「네♪ 그럼, 그걸 해봐요~!」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ふふっ♪\u3000そうだね、決めちゃおう！」"
translation = "「후후♪ 그래, 결정타를 날려보자!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「よっしゃ♪\u3000気合入れ直しで、やりますか！」"
translation = "「좋았어♪ 기합 다시 넣고, 해볼까!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「仕方ないわね……やってあげるわ！」"
translation = "「어쩔 수 없네…… 해줄게!」"

[[dialogue]]
speaker_original = "ロロット"
speaker_translation = "로롯토"
original = "「生徒会書記、ロロット・ローゼンクロイツ！」"
translation = "「학생회 서기, 로롯 로젠크로이츠!」"

[[dialogue]]
speaker_original = "ナナカ"
speaker_translation = "나나카"
original = "「生徒会会計、夕霧ナナカ！」"
translation = "「학생회 회계, 유우기리 나나카!」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「生徒会<size=20>副</size>会長、聖沙・<ruby>Ｂ<rt>ブリジッタ</rt></ruby>・クリステレス！」"
translation = ""

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「生徒会相談役、九浄リア！」"
translation = "「학생회 상담역, 쿠죠 리아!」"

[[dialogue]]
speaker = "unk"
original = "そして、会長として自分も名乗ってから、全員で声を合わせる。"
translation = "그리고, 회장으로서 자신도 이름을 대고는, 전원이 목소리를 맞춘다."

[[dialogue]]
speaker_original = "５人"
speaker_translation = "5명"
original = "「キラキラの学園生活は、流星クルセイダースにガッチリお任せ！」"
translation = "「반짝반짝한 학원 생활은, 류세이 크루세이더스에게 확실히 맡겨줘!」"

[[dialogue]]
speaker = "unk"
original = "こうして、復活した魔王の力と共に、流星クルセイダースはザタナーンへ再び勝負を挑むのだった。"
translation = "이렇게, 부활한 마왕의 힘과 함께, 류세이 크루세이더스는 자타난에게 다시 승부를 도전하는 것이었다."

