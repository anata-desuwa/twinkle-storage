[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「なんか、私ばかり語ってるのもズルいよね。ベアトは私のこと、どう思ってたのか話してよ」"
translation = "「왠지 나만 이야기하는 것도 치사하잖아. 베아토는 나에 대해 어떻게 생각했는지 말해줘」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えっ、私？」"
translation = "「에, 나?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そりゃそうでしょ。私が先に話したんだから、ベアトの番」"
translation = "「그야 그렇잖아. 내가 먼저 말했으니까, 베아토 차례」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「まぁそうなるよね……。うーんと、選管で初めて顔を合わせた時のイメージだとね……」"
translation = "「뭐 그렇게 되겠네…… 음-, 선관위에서 처음 얼굴을 맞대었을 때의 이미지라면 말이지……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「正直に言っちゃうと……最初はちょっと怖そうな人だなって思ったよ。ちょっとだけね」"
translation = "「솔직히 말하자면…… 처음엔 조금 무서워 보이는 사람이라고 생각했어. 아주 조금 말이지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「その後、聖庭園から差し向けられた暗殺者って聞いて……」"
translation = "「그 후, 성정원에서 보낸 암살자라는 소릴 듣고……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「暗殺者なんてお仕事が本当にあることも、漫画みたいに暗殺者を差し向ける組織があることにも驚いたよ」"
translation = "「암살자라는 직업이 정말 존재하는 것도, 만화처럼 암살자를 자객으로 보내는 조직이 있다는 것도 놀라웠어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「でも……最初は梨緒ちゃんとも仲良くなかったのに、今じゃすっかり仲良しさんだもんニャ」"
translation = "「하지만…… 처음엔 리오짱하고도 사이가 안 좋았는데, 지금은 완전히 사이좋은 친구잖아 냥」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「え、別に今も梨緒と仲いいつもりなんてないんだけど」"
translation = "「에, 딱히 지금도 리오랑 친하게 지낼 생각 같은 건 없는데」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「え～、絶対仲良しだよ。ナターシャちゃん、梨緒ちゃんのサンドイッチよく取ってるし」"
translation = "「에~, 절대 사이좋은 거 맞아. 나타샤짱, 리오짱 샌드위치 자주 뺏어 먹고」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いや、梨緒からしたら、たまったもんじゃないでしょ」"
translation = "「아니, 리오 입장에선 기가 찰 노릇이잖아」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「梨緒ちゃん、最近はナターシャちゃんに取られるの見越して、多めに持ってきてるんだよ？\u3000ほら、仲良しっ！」"
translation = "「리오짱, 요즘은 나타샤짱에게 뺏길 걸 내다보고, 일부러 넉넉하게 챙겨오고 있다고? 봐봐, 사이좋은 거 맞네!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「そうなんだ。随分たくさん持ってきてるとは思ってたけど……ま、ベアトが言うなら仲いいってことでいいや」"
translation = "「그랬구나. 제법 많이 챙겨온다고는 생각했지만…… 뭐, 베아토가 그렇다면 사이좋은 걸로 해두지 뭐」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うんっ、ナターシャちゃんと梨緒ちゃんは仲良しさんニャ」"
translation = "「응, 나타샤짱이랑 리오짱은 사이좋은 친구 냥」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「話が梨緒の方に逸れたけど……最初は怖そうって思った、ってことは、今は怖くないんだ？\u3000ベアトが私を怖くなくなったのっていつ？」"
translation = "「이야기가 리오 쪽으로 샜는데…… 처음엔 무서워 보였다는 건, 지금은 안 무섭다는 거야? 베아토가 날 안 무서워하게 된 건 언제부터야?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「う～～ん……『そんなに怖くない人だ！』ってなったのは……クイズ大会の時かニャ？」"
translation = "「으~~음…… 『그렇게 무서운 사람은 아니야!』라고 생각하게 된 건…… 퀴즈 대회 때였으려나 냥?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「割とすぐじゃん」"
translation = "「제법 금방이잖아」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うん、すぐ。その後もいろんな相手と戦う中で、背中を任せられる頼りになる仲間だ──ってわかったの」"
translation = "「응, 금방. 그 후로도 여러 상대와 싸우면서, 등 뒤를 맡길 수 있는 든든한 동료다──라는 걸 알았어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃん、いつも落ち着いてるし、危険なとこでは梨緒ちゃんを止めたり、助けたりしてくれるし」"
translation = "「나타샤짱, 항상 침착하고, 위험한 곳에서는 리오짱을 말리거나 도와주고 말이지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いや、それは梨緒が危なっかしいだけだから」"
translation = "「아니, 그건 리오가 위태위태해서 그런 것뿐이니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ストッパーがいないと、あっさり全滅するからね。梨緒もアポロもベアトも頭に血が上ると突っ込みがちだし」"
translation = "「제동을 걸어줄 사람이 없으면, 허무하게 전멸하거든. 리오도 아폴로도 베아토도 열받으면 돌진하는 타입이고」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あはは……そうかも……。私、いつも『落ち着きが足りない』って怒られてたから……」"
translation = "「아하하…… 그럴지도…… 나, 항상 『침착성이 부족하다』라고 혼났으니까……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「怒られ続けてたなら、少しくらい改善する努力をしたら？」"
translation = "「계속 혼났다면, 조금쯤은 개선하려는 노력을 해보는 게 어때?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「いや、それができたら１人でデネブからアルタイルに渡ってくるなんて無茶しないか」"
translation = "「아니, 그게 됐다면 혼자서 데네브에서 알타이르로 건너오는 무모한 짓은 안 했으려나」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「あははは……今思い返しても、あれはほんとに無茶でした……」"
translation = "「아하하하…… 지금 되돌아봐도, 그건 정말 무모했어요……」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「だから、ナターシャちゃんは私にできないこと、なんでもできて凄い！\u3000って思ってた。ううん、今も思ってる。カボチャのランタン作りも上手だしね」"
translation = "「그러니까, 나타샤짱은 내가 못 하는 일을 뭐든지 해내서 대단해! 라고 생각했어. 아니, 지금도 생각하고 있어. 호박 등불 만드는 것도 잘하고 말이지」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ん、ありがと。梨緒やジグはともかく、ベアトに褒められると素直に嬉しい」"
translation = "「응, 고마워. 리오나 지그는 몰라도, 베아토에게 칭찬 들으니 순수하게 기쁘네」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えへへ、ナターシャちゃんと一緒にハロウィンの準備できて良かったニャ」"
translation = "「에헤헤, 나타샤짱이랑 함께 할로윈 준비를 할 수 있어서 다행이야 냥」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「私ね、ナターシャちゃんとハロウィンを楽しみたい。もっともっと仲良くなりたい」"
translation = "「나 말이지, 나타샤짱이랑 할로윈을 즐기고 싶어. 더욱더 사이좋아지고 싶어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「だからナターシャちゃんに声をかけたんだ」"
translation = "「그래서 나타샤짱한테 말을 건 거야」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……うん、知ってる」"
translation = "「……응, 알고 있어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ホント、ベアトってお人好しな上に物好きだよね」"
translation = "「정말, 베아토는 호인인 데다 특이하단 말이지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナターシャちゃんだって、素直じゃない上に恥ずかしがり屋さんだよっ♪」"
translation = "「나타샤짱이야말로 솔직하지 못한 데다 부끄럼쟁이라구♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はいはい、無駄話はもうおしまい。こっちのランタンはできあがったよ」"
translation = "「네네, 쓸데없는 이야기는 이제 끝. 이쪽 등불은 완성됐어」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「わ、早いっ。こっちももうすぐ終わるから、ちょっと待ってて～」"
translation = "「와, 빠르다. 이쪽도 곧 끝나니까, 잠시만 기다려줘~」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「待ってて、じゃなくて手伝うよ。クモの巣じゃなければね」"
translation = "「기다려줘, 가 아니라 도와줄게. 거미줄이 아니라면 말이지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うんっ、ナターシャちゃん手伝ってっ」"
translation = "「응, 나타샤짱 도와줘」"

