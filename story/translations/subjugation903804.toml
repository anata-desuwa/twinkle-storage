[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「くっ……また負けたわ……！\u3000でも――」"
translation = "「큭…… 또 졌어……！ 하지만――」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「わかってきたわ！\u3000水着の力の使い方が！」"
translation = "「알 것 같아！ 수영복의 힘을 사용하는 방법을！」"

[[dialogue]]
speaker = "unk"
original = "俺の海パンをここまで追い詰めるとは"
translation = "내 사각 수영복을 여기까지 몰아붙이다니"

[[dialogue]]
speaker = "unk"
original = "やるな、聖沙……"
translation = "제법이군, 세이샤……"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「あと少し！\u3000もうちょっとで、あなたの海パンに追いつける！」"
translation = "「조금만 더！ 조금만 더하면, 당신의 사각 수영복을 따라잡을 수 있어！」"

[[dialogue]]
speaker = "unk"
original = "なら、俺も海パンの更なる力を見せよう"
translation = "그렇다면, 나도 사각 수영복의 더한 힘을 보여주지"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「何……！？\u3000会長の海パンが、光り出して……！？」"
translation = "「뭐……！？ 회장의 사각 수영복이, 빛나기 시작해서……！？」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「なっ……！？\u3000その海パンは……！？」"
translation = "「뭣……！？ 그 사각 수영복은……！？」"

[[dialogue]]
speaker = "unk"
original = "『スーパー水着フォーム』だっ！！！"
translation = "『슈퍼 수영복 폼』이다！！！"

[[dialogue]]
speaker = "unk"
original = "これが俺の……海パンを超えた海パン――"
translation = "이것이 나의…… 사각 수영복을 초월한 사각 수영복――"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「と、トランクスタイプの海パンが――」"
translation = "「트, 트렁크 타입의 사각 수영복이――」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「<b>ハイレグ</b>の海パンになったぁぁぁーーーーーーッ！！？」"
translation = "「<b>하이레그</b> 사각 수영복이 되었다아아아ーーーーーー쏭！！？」"

