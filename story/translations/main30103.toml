[[dialogue]]
speaker = "unk"
original = "第３話,『附属生としての新生活』,B"
translation = "제3화, 『부속생으로서의 새 생활』, B"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「いよいよ、だな……」"
translation = "「드디어, 로군……」"

[[dialogue]]
speaker = "unk"
original = "これから学園生活を送ることになる教室の前に立って、大きく深呼吸する。"
translation = "이제부터 학원 생활을 보내게 될 교실 앞에 서서, 크게 심호흡한다."

[[dialogue]]
speaker = "unk"
original = "ちなみに、ルヴィネはオオヒメとは別のクラスの転入となっており、頼ることはできない。"
translation = "참고로, 루비네는 오오히메와는 다른 반으로 편입하게 되어, 의지할 수는 없다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（いよいよここから私の学園生活が始まるのか）"
translation = "(드디어 여기서부터 나의 학원 생활이 시작되는 것인가)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（私にとって初めての経験──）"
translation = "(나에게 있어서 첫 경험──)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（守護天使として恥ずかしくないよう、上手く立ち回るために予習をしてきた……完璧に！）"
translation = "(수호천사로서 부끄럽지 않도록, 잘 대처하기 위해 예습을 해왔다…… 완벽하게!)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（学園生活恐るるに足らず、いざ！）"
translation = "(학원 생활 두려워할 것 없다, 자!)"

[[dialogue]]
speaker = "unk"
original = "オオヒメは先生の後に続いて教室に入る。"
translation = "오오히메는 선생님의 뒤를 이어 교실로 들어간다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（さて……ここが最初の関門、自己紹介だが……）"
translation = "(자…… 여기가 첫 번째 관문, 자기소개지만……)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（接しやすい印象を与えるために、１番大事なのは笑顔だ）"
translation = "(접하기 쉬운 인상을 주기 위해, 가장 중요한 것은 미소다)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（声が小さかったり、聞き取りづらかったりしてはいけない。歯切れの良い明朗な挨拶をする）"
translation = "(목소리가 작거나, 알아듣기 힘들어서는 안 된다. 또박또박하고 명랑한 인사를 한다)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（そして内容……必要以上に自分語りをしてはいけない。だが、あまりに無個性な自己紹介になってしまってもいけない）"
translation = "(그리고 내용…… 필요 이상으로 자기 이야기를 해서는 안 된다. 하지만, 너무나 개성이 없는 자기소개가 되어 버려서도 안 된다)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（なぜならその後の会話の糸口が無くなってしまうからだ）"
translation = "(왜냐하면 그 후의 대화의 물꼬가 사라져 버리기 때문이다)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（会話の糸口が無ければ、クラスメイト達は私に話しかけづらくなってしまう）"
translation = "(대화의 물꼬가 없으면, 학급 친구들은 나에게 말을 걸기 어려워지고 만다)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（結果、１人ぼっちの寂しい自由時間を過ごすという未来が待っているわけだ。そのような愚を犯してはならない）"
translation = "(결국, 외톨이로 쓸쓸한 자유 시간을 보낸다는 미래가 기다리고 있는 셈이다. 그런 어리석은 짓을 저질러서는 안 된다)"

[[dialogue]]
speaker_original = "先生"
speaker_translation = "先生"
original = "「ではオオヒメさん。自己紹介をお願いします」"
translation = "「그럼 오오히메 양. 자기소개를 부탁합니다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「うむ……私はオオヒメ。このような姿をしているが、この世界の摂理を司る守護天使の１柱である」"
translation = "「음…… 나는 오오히메. 이러한 모습을 하고 있지만, 이 세계의 섭리를 관장하는 수호천사의 1주다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「芸術や芸能の分野に特に関心を持っている。特にお笑いが好きだ。古典的な落語から、現代の芸人たちの披露するコントまで」"
translation = "「예술이나 예능 분야에 특히 관심을 가지고 있다. 특히 개그를 좋아한다. 고전적인 라쿠고부터, 현대의 예인들이 선보이는 콘트까지」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「同じ趣味の者がいれば、是非語り合いたいと思っている。どうぞよろしくお願いします」"
translation = "「같은 취미를 가진 자가 있다면, 꼭 함께 이야기 나누고 싶다고 생각한다. 잘 부탁한다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（……キマった。長すぎず短すぎず、的確に自身のことを伝えきった。これで私の学園生活は好スタートを切ることが出来るだろう）"
translation = "(……멋지게 정해졌다. 너무 길지도 짧지도 않게, 적절하게 자신에 대해 전부 전달했다. 이것으로 나의 학원 생활은 좋은 출발을 할 수 있겠지)"

[[dialogue]]
speaker_original = "先生"
speaker_translation = "先生"
original = "「ありがとうございます。では、オオヒメさん、席についてください」"
translation = "「감사합니다. 그럼, 오오히메 양, 자리에 앉아 주세요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「私の席は、あちらの席で良いのだな？」"
translation = "「내 자리는, 저쪽 자리면 되는 것인가?」"

[[dialogue]]
speaker = "unk"
original = "後列の窓際寄りに空席があった。"
translation = "뒷줄 창가 쪽에 빈자리가 있었다."

[[dialogue]]
speaker = "unk"
original = "そこが自分に割り当てられた席だと判断し、オオヒメはそこに向かって歩いていく。"
translation = "거기가 자신에게 할당된 자리라고 판단하고, 오오히메는 그곳을 향해 걸어간다."

[[dialogue]]
speaker = "unk"
original = "しかし、自己紹介という大仕事を終えたオオヒメの中に、わずかな油断があった──"
translation = "하지만, 자기소개라는 큰일을 마친 오오히메의 마음속에, 작은 방심이 있었다──"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ぐはっ！！！！！」"
translation = "「크헉─────!!!!!」"

[[dialogue]]
speaker_original = "先生"
speaker_translation = "先生"
original = "「お、オオヒメさん！？」"
translation = "「오, 오오히메 양!?」"

[[dialogue]]
speaker = "unk"
original = "足がもつれて思いきり転んでしまっていた。"
translation = "발이 꼬여서 힘껏 넘어져 버리고 말았다."

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "先生"
speaker_translation = "先生"
original = "「あ、あの……大丈夫、ですか……オオヒメさん？」"
translation = "「저, 저기…… 괜찮, 으신가요…… 오오히메 양?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（うぅうううっ！！！\u3000失敗した！\u3000失敗した！\u3000失敗したっ！\u3000やらかしてしまったぁっ！！）"
translation = "(으으으으읏!!! 실패했다! 실패했다! 실패했다아앗! 저질러 버렸다아앗!!)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（せっかく完璧に自己紹介を決めたというのに、なんというベタな失敗を！\u3000<ruby>画竜点睛<rt>がりょうてんせい</rt></ruby>を欠くとはこのことだ！）"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（これではもう『ドジっ子守護天使』という印象以外は吹き飛んでしまったに違いないっ！\u3000くぅうううううっ！！！！）"
translation = "(이래서야 이제 『덜렁이 수호천사』라는 인상 외에는 날아가 버렸음에 틀림없다앗! 끄으으으으읏!!!!)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（だが、いつまでも顔を伏せてはいられぬ。何事も無かったように立ち上がり席に向かうのだ）"
translation = "(하지만, 언제까지고 얼굴을 엎드리고 있을 수는 없다. 아무 일도 없었다는 듯이 일어나 자리로 향하는 것이다)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「大丈夫だ、心配には及ばない。皆も驚かせてしまい済まなかったな」"
translation = "「괜찮다, 걱정할 필요는 없다. 모두도 놀라게 해서 미안했구나」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ふっ……ふふ……」"
translation = "「훗…… 후후……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（消えて無くなりたいっ！！！！！）"
translation = "(사라져 버리고 싶다!!!!!)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（はぁ……もういやだ……今すぐ神殿に逃げ帰って扉の奥に閉じこもりたい……）"
translation = "(하아…… 이제 싫다…… 지금 당장 신전으로 도망쳐 돌아가 문 뒤에 갇혀 있고 싶다……)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（転んでしまったのは実は、皆に親しみを持ってもらうためのパフォーマンスだった、ということに出来ないだろうか？）"
translation = "(넘어진 것은 사실, 모두에게 친근감을 갖게 하기 위한 퍼포먼스였다, 라는 것으로 만들 수는 없을까?)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（いや、それはあまりに苦しい！\u3000それに、そんな誤魔化しをしたところで何の意味があろうか……）"
translation = "(아니, 그것은 너무 억지다! 게다가, 그런 얼버무림을 한들 무슨 의미가 있겠는가……)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（こんな時……<b>彼ら</b>はどうしていたか……）"
translation = "（이럴 때…… <b>그들</b>은 어떻게 하고 있었더라……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（学園生活を送るに当たって、私が調べた文献の<b>主人公</b>たちが取った行動……ここで私が取るべき最適解は……）"
translation = "（학원 생활을 보낼 때, 내가 조사했던 문헌의 <b>주인공</b>들이 취했던 행동…… 여기서 내가 취해야 할 최적해는……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（────そうだ！\u3000モブになるのだ！）"
translation = "（────맞아! 모브가 되는 거야!）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（転校生ということで物珍しさから関心を持たれているが、数日もすればその熱も冷めてくるだろう）"
translation = "（전학생이라는 점 때문에 신기함에 관심을 받고 있지만, 며칠만 지나면 그 열기도 식겠지）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（これから２週間、私は決して目立たぬよう気配を消し、クラスのモブとなることに徹するのだ）"
translation = "（앞으로 2주간, 나는 결코 눈에 띄지 않게 기척을 지우고, 반의 모브가 되는 것에 철저해지는 거야）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（そうすれば今の私の失態も、皆の記憶から忘れられてゆくはず……）"
translation = "（그러면 지금 나의 실태도, 모두의 기억 속에서 잊혀 갈 터……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（本来の目的を考えれば積極的に交流を持つべきところなのだが、これは不測の事態であるから仕方がない！）"
translation = "（본래 목적을 생각하면 적극적으로 교류를 가져야 할 때지만, 이것은 예측 못한 사태니까 어쩔 수 없어!）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（私はモブ……私はモブ……何の特徴もないただの守護天使……）"
translation = "（나는 모브…… 나는 모브…… 아무런 특징도 없는 그냥 수호천사……）"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「あの……」"
translation = "「저기……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ひゃいっ！？」"
translation = "「히얏!?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「あ、すみません……急に声をかけてしまって……」"
translation = "「아, 죄송해요…… 갑자기 말을 걸어서……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「い、いや……少々考えごとをしていたのだ……。私のようなモブ守護天使に何か御用か？」"
translation = "「아, 아니…… 잠시 생각을 하고 있었다…… 나 같은 모브 수호천사에게 무슨 볼일이라도 있나?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「先ほど転んだ時にどこか痛めたのではないかと心配になりまして……大丈夫でしたか？」"
translation = "「아까 넘어졌을 때 어디 다친 건 아닌가 싶어서 걱정이 돼서요…… 괜찮으신가요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ああ、大丈夫だ……どこも怪我はしていない……」"
translation = "「아아, 괜찮다…… 어디도 다치지 않았어……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「そうですか。なら安心です……」"
translation = "「그런가요. 그렇다면 다행이에요……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「気遣い感謝する。あなたの名を教えてもらえるだろうか？」"
translation = "「배려해 줘서 고맙다. 그대의 이름을 가르쳐 줄 수 있겠나?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ナミエル・クレシェンテと申します。よろしくお願いします、オオヒメ様」"
translation = "「나미엘 크레셴테라고 합니다. 잘 부탁드려요, 오오히메님」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（無様な姿をさらした私を笑うでもなく……それどころか心配をしてくれている……何と心優しい娘だろうか……）"
translation = "(볼품없는 모습을 드러낸 나를 놀리지도 않고…… 도리어 걱정을 해주고 있다니…… 이 얼마나 마음씨 고운 아이인가……)"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（ナミエル・クレシェンテ……偶然、席が隣になった彼女があまりにも天使すぎるのだが！？\u3000私はむしろ運がいいのかもしれない……）"
translation = "（나미엘 크레셴테…… 우연히 옆자리가 된 그녀가 너무나도 천사 같은데!? 나는 오히려 운이 좋은 걸지도 몰라……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（はっ……待て！？\u3000モブとして気配を消して過ごそうと決めたばかりなのに、この展開はまるで……）"
translation = "（앗…… 잠깐!? 모브로서 기척을 지우고 지내기로 방금 결정했는데, 이 전개는 마치……）"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "（主人公とヒロイン、運命の出会いではないか！\u3000この場合、私はどう振る舞えばいいのだ？）"
translation = "（주인공과 히로인, 운명의 만남이 아닌가! 이 경우, 나는 어떻게 행동해야 하지?）"

[[dialogue]]
speaker = "unk"
original = "突然の状況に混乱するオオヒメ。とりあえず──"
translation = "갑작스러운 상황에 혼란스러워하는 오오히메. 우선──"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「クラスメイトなのだから私のことは気軽にヒメとでも呼んでくれ。まあ、私にはいささか可愛すぎる響きではあるが……」"
translation = "「클래스메이트니까 나에 대해서는 편하게 히메라고 불러줘. 뭐, 나에게는 약간 너무 귀여운 어감이긴 하지만……」"

[[dialogue]]
speaker = "unk"
original = "余所行きでない、いつもの自己紹介をしておくことにしたのだった。"
translation = "외출용이 아닌, 평소의 자기소개를 해두기로 한 것이었다."

