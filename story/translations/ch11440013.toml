[[dialogue]]
speaker = "unk"
original = "第３話,狛里の恋愛観,P"
translation = "제3화, 코마리의 연애관, P"

[[dialogue]]
speaker = "unk"
original = "とある昼休み、俺は大聖堂カフェテリアでヴィーナスと一緒に昼食を取っていた。"
translation = "어느 점심시간, 나는 대성당 카페테리아에서 비너스와 함께 점심을 먹고 있었다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「うん！\u3000特盛お子様ランチ、美味しいわね♪」"
translation = "「응! 곱빼기 어린이 런치, 정말 맛있네♪」"

[[dialogue]]
speaker = "unk"
original = "ヴィーナスはそのお子様ランチ、好きだよな"
translation = "비너스는 그 어린이 런치, 진짜 좋아하는구나"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「えへへっ、だって美味しいんだもの♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そんな話をしていると――"
translation = "그런 이야기를 하고 있자니――"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様～っ♪\u3000ヴィーナスお嬢様～！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "元気な声と共に、狛里が駆け寄ってきた。"
translation = "활기찬 목소리와 함께, 코마리가 달려왔다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「あら、狛里もお昼？」"
translation = "「어머, 코마리도 점심 먹으러 왔니?」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいなのです！\u3000狛里も一緒に食べてもいいですか？」"
translation = "「네인 것입니다! 코마리도 같이 먹어도 될까요?」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「ええ、もちろんいいわよ！」"
translation = "「응, 물론 괜찮고말고!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ありがとうなのです！\u3000魔王様、お隣失礼するであります♪」"
translation = "「고마운 것입니다! 마왕님, 옆자리 실례하는 말입니다♪」"

[[dialogue]]
speaker = "unk"
original = "狛里は俺の隣へ座ってくる。"
translation = "코마리는 내 옆에 앉는다."

[[dialogue]]
speaker = "unk"
original = "狛里はおにぎりか？"
translation = "코마리는 주먹밥이야?"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ♪\u3000狛里はおにぎり大好きなのです！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "手に持っているものだけではなく、運んできたお皿の上にもおにぎりが山積みになっている。"
translation = "손에 들고 있는 것뿐만 아니라, 가져온 접시 위에도 주먹밥이 수북하게 쌓여 있다."

[[dialogue]]
speaker = "unk"
original = "そして――"
translation = "그리고――"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「くんくん♪」"
translation = "「킁킁♪」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「あっ、また始まったわね」"
translation = "「앗, 또 시작됐네」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへへっ♪\u3000やっぱり魔王様はいい匂いがするのです♪」"
translation = ""

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「狛里はあっという間にクロトに懐いたわね！」"
translation = "「코마리는 눈 깜짝할 사이에 쿠로토한테 따랐네!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「はいっ！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "狛里は俺の隣にぴったりとくっ付いたまま即答する。"
translation = "코마리는 내 옆에 딱 달라붙은 채 즉답한다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様は優しいですし、強いですし、いい匂いもするのです♪」"
translation = "「마왕님은 상냥하시고, 강하시고, 좋은 냄새도 나는 것입니다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「だから大好きなのであります♪」"
translation = "「그래서 정말 좋아하는 말입니다♪」"

[[dialogue]]
speaker = "unk"
original = "そ、そっか……"
translation = "그, 그렇구나……"

[[dialogue]]
speaker = "unk"
original = "まあ、狛里の場合、異性としての意味合いはないのだろうが、少し照れてしまう。"
translation = "뭐, 코마리의 경우, 이성으로서의 의미는 없겠지만, 조금 쑥스러워진다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「う～～ん。それってつまり――」"
translation = "「음~~. 그거 그러니까――」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「狛里はクロトのことを、異性として好きってこと？」"
translation = "「코마리는 쿠로토를 이성으로서 좋아한다는 뜻이야?」"

[[dialogue]]
speaker = "unk"
original = "ちょっ！？\u3000ヴィーナス、何を突然！？"
translation = "잠깐만!? 비너스, 갑자기 무슨 말을!?"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「なによ、大切なことよ？\u3000曖昧にしていても、嬉しいことは何にもないわ！」"
translation = "「뭐 어때, 중요한 거잖아? 애매하게 굴어봤자 좋을 거 하나도 없어!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様を、異性として……？」"
translation = "「마왕님을, 이성으로서……?」"

[[dialogue]]
speaker = "unk"
original = "狛里はきょとんと首を傾げる。"
translation = "코마리는 갸웃하며 고개를 기운다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「うん。女の子として、男の子のクロトが好きなのかって話よ！」"
translation = "「응. 여자아이로서, 남자아인 쿠로토가 좋은 거냐는 이야기야!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「安心するだけじゃなくて、ドキドキもするとか。他の『好き』とはちょっと違う、特別な気持ちになるとか──」"
translation = "「안심되는 것뿐만 아니라, 두근두근하기도 한다거나. 다른 『좋아함』과는 조금 다른, 특별한 기분이 된다거나──」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「あと、もっとも大事なのは……クロトの赤ちゃんを産みたいって思うかどうかよ！！」"
translation = "「그리고, 가장 중요한 건…… 쿠로토의 아기를 낳고 싶다고 생각하는지 어떤지야!!」"

[[dialogue]]
speaker = "unk"
original = "あの！！？\u3000ヴィーナスさんっ！？？"
translation = "저기요!!? 비너스 씨!???"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「大丈夫よ、安心してクロト……」"
translation = "「괜찮아, 안심해 쿠로토……」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「九浄家ではメイド隊の子相手に、性教育も行っているわ！\u3000ヘレナちゃんが！！」"
translation = "「쿠죠가에서는 메이드대 아이들을 대상으로, 성교육도 실시하고 있어! 헬레나짱이!!」"

[[dialogue]]
speaker = "unk"
original = "いや、確かに大切なことですけれどもっ！！！"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様の、赤ちゃん……」"
translation = "「마왕님의, 아기……」"

[[dialogue]]
speaker = "unk"
original = "狛里は少し考え込んだ後。"
translation = "코마리는 잠시 생각에 잠긴 후."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「なるほど！\u3000狛里、わかったであります！」"
translation = "「그렇군요! 코마리, 알았는 말입니다!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「これが『恋』というものだったのですね！」"
translation = "「이것이 『사랑』이라는 것이었군요!」"

[[dialogue]]
speaker = "unk"
original = "えっ！？"
translation = ""

[[dialogue]]
speaker = "unk"
original = "狛里は勢いよく立ち上がって、言う。"
translation = "코마리는 기세 좋게 일어서서 말한다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様！」"
translation = "「마왕님!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里――魔王様のことが大好きなのです<emoji=heart04>」"
translation = "「코마리―― 마왕님을 정말 좋아하는 것입니다<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "一瞬で、カフェテリアが静まり返る。"
translation = "순식간에, 카페테리아가 정적에 싸인다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「狛里……あなた、なかなかやるわね！」"
translation = "「코마리…… 너, 제법인데!」"

[[dialogue]]
speaker = "unk"
original = "ちょ、ちょっと待ってくれ！"
translation = "잠, 잠깐 기다려 줘!"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「？」"
translation = "「?」"

[[dialogue]]
speaker = "unk"
original = "狛里は首を傾げて、不思議そうな顔をする。"
translation = "코마리는 고개를 갸웃하며, 의아한 표정을 짓는다."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「好きって、ちゃんと伝えた方がいいのですよね？」"
translation = "「좋아한다고, 제대로 전하는 편이 좋은 거죠?」"

[[dialogue]]
speaker = "unk"
original = "それはそうなんだけども……！"
translation = "그건 그렇지만……!"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふ？」"
translation = "「바우와후?」"

[[dialogue]]
speaker = "unk"
original = "狛里は本気で何が問題なのかわかっていない様子だった。"
translation = "코마리는 진심으로 뭐가 문제인지 모르겠다는 표정이었다."

[[dialogue]]
speaker = "unk"
original = "翌朝。"
translation = "다음 날 아침."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「――魔王様～！\u3000おはようございますであります～！」"
translation = "「――마왕님~! 좋은 아침인 말입니다~!」"

[[dialogue]]
speaker = "unk"
original = "狛里は元気よく駆け寄ってくると、俺の腕へ抱き着いてきた。"
translation = "코마리는 활기차게 달려오더니, 내 팔에 껴안겨 왔다."

[[dialogue]]
speaker = "unk"
original = "な、なんで腕に！？"
translation = "왜, 왜 팔에!?"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「好きな男の子には、こうしてスキンシップするものだと聞いたのです♪」"
translation = "「좋아하는 남자애한테는, 이렇게 스킨십을 하는 거라고 들은 것입니다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様も、狛里がたくさんくっついたら、嬉しいのです？」"
translation = "「마왕님도, 코마리가 많이 달라붙으면, 기쁜 것입니까?」"

[[dialogue]]
speaker = "unk"
original = "匂いを嗅がれる以上に良くないのでは！？"
translation = "냄새를 맡아대는 것 이상으로 안 좋은 거 아닌가!?"

[[dialogue]]
speaker = "unk"
original = "嬉しくないと言ったら嘘になるけど……"
translation = "기쁘지 않다고 하면 거짓말이겠지만……"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふ？」"
translation = "「바우와후?」"

[[dialogue]]
speaker = "unk"
original = "その後も――"
translation = "그 후로도――"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「魔王様～っ♪\u3000大好きなのです～<emoji=heart04>\u3000くんくん♪」"
translation = ""

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里のお腹、撫でてくださいなのです～♪\u3000ああっ、服の上からじゃないのです！？\u3000シャツの下まで手を入れて、ちゃんとなでなでしてくださいなのです～！」"
translation = "「코마리 배, 쓰다듬어 주세요인 것입니다~♪ 아앗, 옷 위로가 아닌 것입니다!? 셔츠 밑까지 손을 넣어서, 제대로 쓱쓱 쓰다듬어 주세요인 것입니다~!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「えへへ♪\u3000今日は褒めてもらえて嬉しいのですっ。魔王様のお顔、ぺろぺろしちゃうのですぅ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ことあるごとに、俺へ甘えてくるようになってしまった。"
translation = "시도 때도 없이, 나에게 응석을 부려대게 되어버렸다."

[[dialogue]]
speaker = "unk"
original = "数日後。"
translation = "며칠 후."

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「学園の風紀が乱れるからやめなさい！！！」"
translation = "「학원의 풍기가 문란해지니까 그만두세요!!!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ！？」"
translation = "「바우와후!?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「だいたいね、いくらあなたの魔族の本能が強いからって、ヒトの恋人はそんな付き合い方はしないのよ！！」"
translation = "「어쨌든 말이지, 아무리 당신의 마족 본능이 강하다지만, 인간 연인은 그런 식의 교제를 하지 않는다고!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「人目をはばからず抱きついたり、相手の顔や手を舐めたり、仰向けに寝っ転がってお腹を見せて服従のポーズは取らないの！」"
translation = "「남 시선 아랑곳않고 안기거나, 상대의 얼굴이나 손을 핥거나, 배를 드러내고 누워서 복종 포즈를 취하진 않아!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「それじゃあもうヒトじゃなくて、動物なんだから！\u3000せめて付き合ってから、２人きりの部屋の中でやりなさい！！」"
translation = "「그럼 더 이상 인간이 아니라, 동물이니까! 적어도 사귀고 나서, 둘만의 방 안에서 하라고!!」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「わかっているのです、蘭美メイド長！\u3000だから狛里は、魔王様のツガイになりたいわけじゃないのです♪」"
translation = "「알고 있는 것입니다, 라비 메이드장! 그러니까 코마리는, 마왕님의 반려가 되고 싶은 게 아닌 것입니다♪」"

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「狛里はただ、大好きな魔王様の『ペット』になりたいだけなのであります！！」"
translation = "「코마리는 그저, 정말 좋아하는 마왕님의 『펫』이 되고 싶을 뿐인 말입니다!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「うん、うん……うん！？」"
translation = "「응, 응…… 응!?」"

[[dialogue]]
speaker = "unk"
original = "どういうこと！？"
translation = "무슨 소리야!?."

[[dialogue]]
speaker_original = "狛里"
speaker_translation = "狛里"
original = "「ばうわふっ♪」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "またしても斜め上の方向に話が飛躍しつつも、狛里はひとり、笑顔で尻尾をぶんぶんと振るのであった。"
translation = "또다시 엉뚱한 방향으로 이야기가 비약하면서도, 코마리는 혼자서 싱글벙글 웃으며 꼬리를 세차게 흔드는 것이었다."

