[[dialogue]]
speaker = "unk"
original = "第３話,波に踊る強者たち,P"
translation = "제3화, 파도에 춤추는 강자들, P"

[[dialogue]]
speaker_original = "リーリア"
speaker_translation = "릴리아"
original = "「アナちゃん、ルルカちゃん、そっち行ったよ！」"
translation = "「아나짱, 루루카짱, 그쪽으로 갔어!」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「らじゃー。攻撃開始」"
translation = "「라져. 공격 개시」"

[[dialogue]]
speaker_original = "ルルカ"
speaker_translation = "루루카"
original = "「よーし、挟み撃ち～！\u3000逃がさないよ！」"
translation = "「좋아, 협공이다~! 놓치지 않아!」"

[[dialogue]]
speaker_original = "レイラ"
speaker_translation = "레이라"
original = "「あばばばばば！\u3000たくさん食べると胸が大きくなるって言っただけなのになんで狙われてるんですか私！？」"
translation = "「아바바바바! 많이 먹으면 가슴이 커진다고 말했을 뿐인데 왜 노려지는 건가요 저!?」"

[[dialogue]]
speaker = "unk"
original = "レイラが水鉄砲で集中砲火されているかと思えば──"
translation = "레이라가 물총으로 집중 포화를 당하고 있는가 싶더니──"

[[dialogue]]
speaker_original = "キサナ"
speaker_translation = "키사나"
original = "「おっ、流星の会長サマじゃねえか。アタシと遊んでくれや」"
translation = "「오호, 유성의 회장님이시구먼. 나랑 좀 놀아보자고」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「ええ、受けて立ちます。コラプサーの方と戦うのは初めてですね。よろしくお願いします」"
translation = "「네, 받아들이죠. 콜랩서 분과 싸우는 건 처음이네요. 잘 부탁드립니다」"

[[dialogue]]
speaker = "unk"
original = "意外な組み合わせの対決もあった。そこかしこで水着の星騎士たちが戦いを繰り広げている。"
translation = "의외의 조합인 대결도 있었다. 여기저기서 수영복 차림의 성기사들이 싸움을 펼치고 있다."

[[dialogue]]
speaker = "unk"
original = "イングリットの次の相手は──"
translation = "잉그리드의 다음 상대는──"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「見つけたわよ、イングリット！」"
translation = "「찾았어, 잉그리드!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「待ちわびたぞ、ヴィーナス！」"
translation = "「오매불망 기다렸다, 비너스!」"

[[dialogue]]
speaker = "unk"
original = "昔からの友人みたいに楽しそうで、この前初めて話したとは思えない。"
translation = "오래전부터 알고 지낸 친구처럼 즐거워 보여서, 요 전날 처음 대화했다고는 믿기지 않는다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「感謝しよう。貴様のおかげで夏の最強を決めるにふさわしい舞台が整った」"
translation = "「감사하마. 네놈 덕분에 여름의 최강을 가리기에 걸맞은 무대가 갖춰졌다」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「お礼を言うのはこっちだわ。あなたが夏の最強なんて言い出さなければ、この大会はなかったんだし」"
translation = "「고맙다는 말은 이쪽이 할 소리야. 당신이 여름의 최강 같은 소리를 안 했으면 이런 대회는 없었을 테니까」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「じゃあ、始めましょう！」"
translation = "「그럼, 시작하자!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「夏の最強を決める戦いを！」"
translation = "「여름의 최강을 정하는 싸움을!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「まずは足を止めるわよ、フィクサーチェーン！」"
translation = "「우선 발을 묶어주겠어, 픽서 체인!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「なんの、ブレイドクロスシザー！」"
translation = "「어림없다, 블레이드 크로스 시저!」"

[[dialogue]]
speaker = "unk"
original = "四方から伸びる鎖。イングリットは剣を交差させ、力ずくで切り裂いていく。"
translation = "사방에서 뻗어 나오는 사슬. 잉그리드는 검을 교차시켜 힘으로 베어 넘긴다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「やるわね、これならどうかしら？\u3000サマーモーニンスター！」"
translation = "「제법이네, 이건 어떠려나? 서머 모닝스타!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぬぅっ！」"
translation = "「누우읏!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「さらに、もう一発！」"
translation = "「거기에, 한 방 더!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ぐはあぁっ！」"
translation = "「구하아앗!」"

[[dialogue]]
speaker = "unk"
original = "ヴィーナスのビームを受け、イングリットが水面に叩きつけられた。"
translation = "비너스의 빔을 맞고 잉그리드가 수면으로 내동댕이쳐졌다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ククク。強いな、ヴィーナス。いいぞ、私はお前のような強者を求めていた！」"
translation = "「크크크. 강하군, 비너스. 좋다, 나는 너 같은 강자를 원했다!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「体が燃えるように熱い！\u3000私の魂が、肉体が、戦うことを悦んでいる！」"
translation = "「몸이 타오르듯 뜨겁다! 나의 혼이, 육체가, 싸우는 것을 기뻐하고 있어!」"

[[dialogue]]
speaker = "unk"
original = "まるで酒にでも酔ったかのようだ。イングリットの恍惚が見ているこちらにまで伝わってくる。"
translation = "마치 술에 취한 것만 같다. 잉그리드의 황홀경이 지켜보는 이쪽까지 전해져 온다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「あなた、本当に戦うのが好きなのね」"
translation = "「당신, 정말로 싸우는 걸 좋아하는구나」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「当然だ。私はそのために生まれ、生きてきた。武を極めるためにこそ、この命はある」"
translation = "「당연하다. 나는 그러기 위해 태어났고, 살아왔다. 무를 끝까지 연마하기 위해 이 목숨이 있는 것이다」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「だがな。私とて、いつまでも戦士でいられるとは限らない。戦いで命を落とすか、病で戦えぬ体となるか、老いて戦えなくなるか」"
translation = "「하지만 말이다. 나라고 해서 언제까지나 전사로 남으리란 보장은 없지. 싸움에서 목숨을 잃거나, 병으로 싸우지 못할 몸이 되거나, 늙어서 싸울 수 없게 되거나」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「あるいは、戦いそのものがなくなるかだ。ならば、今、目の前にある戦いに全霊を懸け、全身を捧げる。それが生きるということだ！」"
translation = "「혹은 싸움 그 자체가 사라지거나 말이다. 그렇다면 지금 눈앞에 있는 싸움에 전령을 걸고, 전신을 바친다. 그것이 산다는 것이다!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「すごいわあなた！\u3000ただ戦うのが好きなだけだと思ってたけど……本当に、本当に、そうなのね！」"
translation = "「당신 대단해! 그냥 싸우는 걸 좋아할 뿐이라고 생각했는데…… 정말로, 정말로 그렇구나!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「そうとも。それが、イングリットという戦士。私という魂だ！」"
translation = "「그렇고말고. 그것이 잉그리드라는 전사. 나라는 혼이다!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「ふふ、ふふふ！\u3000私もね、心がかーっと燃えてるわ。今、すごくあなたに勝ちたい！」"
translation = "「후후, 후후후! 나도 말이야, 마음이 확 타오르고 있어. 지금, 무척이나 당신을 이기고 싶어!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「私もだ、ヴィーナス！\u3000貴様は私が倒す！」"
translation = "「나도 마찬가지다, 비너스! 네놈은 내가 쓰러뜨린다!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「次の一撃、全力でいくわ！」"
translation = "「다음 일격, 전력으로 가겠어!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「ああ、来い！」"
translation = "「아아, 와라!」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「はあぁぁ……必殺奥義！\u3000コスモブレイクカリバー！！」"
translation = "「하아아아…… 필살오의! 코스모 브레이크 칼리버!!」"

[[dialogue]]
speaker = "unk"
original = "さながら巨大な光の槍のような、極太のビームが迫る。"
translation = "마치 거대한 빛의 창과 같은, 엄청난 굵기의 빔이 다가온다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「クハハハ！\u3000敵に不足なし！\u3000その光、斬る！」"
translation = "「크하하하! 적수가 부족함이 없군! 그 빛, 베어 넘기겠다!」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「──ザンブレイクセイバーッ！！」"
translation = "「──잔 브레이크 세이버어!!」"

[[dialogue]]
speaker = "unk"
original = "星力で編まれた大剣がビームを迎え撃つ。一瞬、拮抗しているように見えたが──"
translation = "성력으로 짜인 대검이 빔을 맞받아친다. 잠시 길항하는 것처럼 보였지만──"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「行っけー！」"
translation = "「가─랏!」"

[[dialogue]]
speaker = "unk"
original = "星力の出力はヴィーナスの方が上だ。コラプサーの星力吸収もほとんど機能していない以上、勝敗は決しただろう。"
translation = "성력의 출력은 비너스 쪽이 위다. 콜랩서의 성력 흡수도 거의 기능하지 않는 이상, 승패는 결정된 것이나 다름없다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「クク、クハハハハ！\u3000これだ、これこそ私の欲していたものだ！」"
translation = "「크크, 크하하하하! 이거다, 이것이야말로 내가 갈구하던 것이다!」"

[[dialogue]]
speaker = "unk"
original = "だが、イングリットの眼に諦めの色はない。むしろ嬉々として輝く。"
translation = "하지만 잉그리드의 눈에 포기하는 기색은 없다. 오히려 기쁘다는 듯 빛난다."

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「はああああぁっ！！」"
translation = "「하아아아아아앗!!」"

[[dialogue]]
speaker = "unk"
original = "刹那、大剣が形を変え、細く薄い１本の刀となった。"
translation = "찰나, 대검이 형태를 바꾸어 가늘고 얇은 한 자루의 도가 되었다."

[[dialogue]]
speaker = "unk"
original = "星力はより濃く、鋭く研ぎ澄まされ、光の槍を切り裂く。"
translation = "성력은 더욱 짙고 날카롭게 갈고 닦여 빛의 창을 베어 가른다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「きゃあっ！？」"
translation = "「꺄앗!?」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「隙は見逃さんっ！！」"
translation = "「빈틈은 놓치지 않는다!!」"

[[dialogue]]
speaker = "unk"
original = "執念の一撃がヴィーナスの不意を突き、イングリットが肉薄する。"
translation = "집념의 일격이 비너스의 허를 찌르고, 잉그리드가 육박한다."

[[dialogue]]
speaker = "unk"
original = "そして距離を取らせないまま執拗に攻め続け、とうとう押し勝った。イングリットの粘り勝ちだ。"
translation = "그리고 거리를 벌리지 못하게 집요하게 몰아붙인 끝에, 드디어 압도했다. 잉그리드의 끈기 승리다."

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「私の、負けね……」"
translation = "「내가, 졌네……」"

[[dialogue]]
speaker_original = "イングリット"
speaker_translation = "잉그리드"
original = "「改めて感謝しよう、強き者よ。貴様のおかげで私はより強くなった」"
translation = "「다시 한번 감사하마, 강한 자여. 네놈 덕분에 나는 더욱 강해졌다」"

[[dialogue]]
speaker = "unk"
original = "予想を超える熱い戦いに、俺も自然と拳を強く握っていた──"
translation = "예상을 뛰어넘는 뜨거운 싸움에 나도 모르게 주먹을 꽉 쥐고 있었다──"

