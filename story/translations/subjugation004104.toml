[[dialogue]]
speaker = "unk"
original = "クーシェンとアポロのメイド修行は続いていた。"
translation = "쿠셴과 아폴로의 메이드 수행은 계속되고 있었다."

[[dialogue]]
speaker = "unk"
original = "２人が担当する仕事も増え、夜の警備も任されるようになった。"
translation = "두 사람이 담당하는 일도 늘어, 밤의 경비도 맡겨지게 되었다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「このお屋敷に警備なんて必要ないと思うけどね～」"
translation = "「이 저택에 경비 같은 건 필요 없다고 생각하지만 말이야~」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「なんなの、星見家メイド隊って。どいつもこいつも強いやつばっかだし」"
translation = "「뭐라는 거야, 호시미 가 메이드대는. 이 녀석이고 저 녀석이고 강한 녀석들뿐이고」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「あいつらと戦えるかもってワクワクしてたんだけどな～」"
translation = "「그 녀석들과 싸울 수 있을 지도 모른다고 두근거렸었는데 말이지~」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「アポロとはいい勝負できるし、マリオンはやりづらい相手だけど、勝てない相手じゃない」"
translation = "「아폴로와는 좋은 승부가 되고, 마리온은 상대하기 힘든 녀석이지만, 이길 수 없는 상대는 아니야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「フェニエルとナミエルは……わっかんないけど、マリオンよりは弱そう、たぶん。でも戦ったら案外楽しいかもね」"
translation = "「페니엘과 나미엘은…… 모~르겠지만, 마리온보다는 약해 보여, 아마도. 하지만 싸우면 뜻밖에 재미있을지도 모르겠네」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「けど、あのメイド長はやばいな～。正面からやりあったらボクも勝てないかも。にーにーが師匠って呼ぶのも納得だよ」"
translation = "「하지만, 그 메이드장은 위험하단 말이지~. 정면에서 맞붙으면 나도 이길 수 없을지도. 오빠가 스승이라고 부르는 것도 납득이 가」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（…………はぁ、つまんないなー）"
translation = "（…………하아, 재미없네ー）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（アポロはなんか楽しそうなんだよね、メイド修行するの）"
translation = "（아폴로는 왠지 즐거워 보인단 말이지, 메이드 수행 하는 거）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（ボクと似てるやつだって思ってたのに……やっぱりお嬢様だもんな……）"
translation = "（나랑 비슷한 녀석이라고 생각했었는데…… 역시 아가씨인 거겠지……）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「あー、もうやめやめ！\u3000メイド修行なんてちっとも楽しくないし！」"
translation = "「아ー, 이제 그만 그만! 메이드 수행 따위 조금도 재미없고!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ここまで付き合ってたのがそもそもおかしいんだって。ボクらしくなかった」"
translation = "「여기까지 맞춰준 게 애초에 이상했던 거야. 나답지 않았어」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（だからずっとイライラしてたんだ。きっとそうだよ）"
translation = "（그래서 계속 짜증이 났던 거야. 틀림없이 그래）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクはボクらしく、楽しくやるのが一番なんだ」"
translation = "「나는 나답게, 재미있게 하는 게 제일이야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（なら、どうして……ボクはつまんないメイド修行に付き合ってたの？）"
translation = "（그러면, 어째서…… 나는 재미없는 메이드 수행에 맞춰주고 있었던 거지?）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「それは……アポロがいたから……」"
translation = "「그건…… 아폴로가 있었으니까……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（本当なら、アポロがメイド修行をやる必要なんてなかったんだ）"
translation = "（사실이라면, 아폴로가 메이드 수행을 할 필요 같은 건 없었어）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（あいつは星見家のお嬢様だ。使用人の真似事なんてふさわしくない）"
translation = "（그 녀석은 호시미 가의 아가씨다. 하수인 시늉 같은 건 어울리지 않아）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（それなのに、わざわざメイド修行をするなんて言い出したのは、ボクのためだ）"
translation = "（그런데도, 일부러 메이드 수행을 하겠다고 말한 건, 나를 위해서야）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（ボクの心が折れちゃわないように。ボクがボクらしさを失わないために、寄り添ってくれたんだよね……）"
translation = "（내 마음이 꺾여버리지 않도록. 내가 나다움을 잃지 않기 위해서, 곁에 있어 준 거겠지……）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「でも、これ以上は無理だよ。アポロには悪いけどね」"
translation = "「하지만, 이 이상은 무리야. 아폴로에게는 미안하지만」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そうだ、逃げちゃえばいいんだ♪」"
translation = "「그래, 도망쳐버리면 되는 거야♪」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ウキキ～♪」"
translation = "「우키키~♪」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「やった！\u3000脱走成功だ～！\u3000地獄の修行だって脅かしてたけど、楽勝じゃんか！」"
translation = "「됐다! 탈출 성공이다~! 지옥의 수행이라고 위협하더니, 식은 죽 먹기잖아!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「どいつもこいつも甘いんじゃないの？\u3000こんなことならバトルだってふっかけとけばよかったかもな～」"
translation = "「이 녀석이고 저 녀석이고 무른 거 아니야? 이럴 거였으면 배틀이라도 걸어볼 걸 그랬나~」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「メイドなんて大したことないんだって。メイド長はおっかないけど、あいつが特別なだけだし。よゆーよゆー」"
translation = "「메이드 같은 건 별거 없다고. 메이드장은 무섭지만, 그 녀석이 특별할 뿐이고. 여유 여유」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「よゆー……」"
translation = "「여유……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「……ほんとに、そうなのか？」"
translation = "「……정말로, 그런 걸까?」"

[[dialogue]]
speaker = "unk"
original = "クーシェンが足を止める。"
translation = "쿠셴이 발걸음을 멈춘다."

[[dialogue]]
speaker = "unk"
original = "不安げな面持ちで、素早く周囲を見渡した。"
translation = "불안한 표정으로, 재빠르게 주위를 둘러보았다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「誰！？\u3000そこにいるのはわかってるんだからね！」"
translation = "「누구야!? 거기 있다는 거 알고 있으니까!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「……あたしだ、クーシェン」"
translation = "「……나다, 쿠셴」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ふーん……ボクを捕まえに来たのが、アポロとは思わなかったよ」"
translation = "「후응…… 나를 잡으러 온 게, 아폴로일 줄은 몰랐네」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしはクーシェンを捕まえにきたんじゃないぞ。ちょっとだけ話をしようと思ってさ」"
translation = "「나는 쿠셴을 잡으러 온 게 아니라고. 조금 이야기를 할까 해서 말이지」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「話って？\u3000こっちには話すことなんてないってば」"
translation = "「이야기라니? 이쪽은 이야기할 것 따위 없다니까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「クーシェンだって薄々きづいてるんだろ？\u3000キリカはいつでも逃げられるようにしてたってこと」"
translation = "「쿠셴도 억지나마 눈치채고 있었잖아? 키리카는 언제든 도망칠 수 있게 해두었다는 거」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「…………なんとなく、そうかなとは思ってた」"
translation = "「…………왠지, 그렇겠지 하고는 생각했어」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「修行は厳しいからな。心が折れて、逃げちゃおうって思うやつだってたくさんいる」"
translation = "「수행은 엄격하니까 말이야. 마음이 꺾여서, 도망쳐버리자고 생각하는 녀석도 많아」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そういうのを無理矢理連れ戻したって、そいつは同じように修行を続けられないんだ」"
translation = "「그런 녀석을 억지로 붙잡아 되돌려놓아 봤자, 그 녀석은 이전처럼 수행을 계속할 수 없어」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「うるさいなー。そうだよ、ボクはメイド修行が嫌で逃げ出したんだよ。それで？\u3000ボクに何を言いたいのさ」"
translation = "「시끄럽네ー. 그래, 나는 메이드 수행이 싫어서 도망친 거야. 그래서? 나한테 무슨 말을 하고 싶은 건데」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクと比べてアポロは立派だよね～。あんなメイドの真似事も真面目にやっちゃってさ」"
translation = "「나하고 비교해서 아폴로는 훌륭하네~. 그런 메이드 시늉도 진지하게 해버리고말이야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「今だって、ボクを心配して探しに来てくれたんでしょ？\u3000あー、あー、ご立派ご立派。でも、ボクはアポロとは違うんだ」"
translation = "「지금도, 나를 걱정해서 찾으러 와 준 거지? 아ー, 아ー, 참 훌륭하셔. 하지만, 나는 아폴로하고는 달라」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「違わないぞ。あたしだって逃げたことあるからな」"
translation = "「다르지 않아. 나도 도망친 적이 있으니까」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「……え？」"
translation = "「……에?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしも、イタズラしてバツを受けたことがあってさ、イヤになって逃げ出しちゃったんだよ」"
translation = "「나도, 장난치다가 벌을 받은 적이 있어서 말이야, 싫어져서 도망쳐버렸었어」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「今のクーシェンとおんなじだろ？\u3000だからその気持ちもわかるし、先輩としてアドバイスできるかなって」"
translation = "「지금의 쿠셴하고 똑같잖아? 그러니까 그 기분도 알고, 선배로서 조언해 줄 수 있을까 해서」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「それで……わざわざ追いかけてきてくれたの？」"
translation = "「그래서…… 일부러 쫓아와 준 거야?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そうだぞ」"
translation = "「그렇다」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あ、一応言っておくけど、クーシェンの脱出ルート、あたしの時とまんま一緒だったからな」"
translation = "「아, 일단 말해두겠는데, 쿠셴의 탈출 루트, 내가 도망쳤을 때랑 똑같았으니까 말이야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「うぇ～、ほんとに？」"
translation = "「우에~, 정말로?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ぜーんぶキリカのしわざだ。逃げだされた時のことを考えて、あらかじめ逃げやすいルートを用意しておくんだよ」"
translation = "「전 전부 키리카가 한 짓이다. 도망쳤을 때의 일을 생각해서, 미리 도망치기 쉬운 루트를 준비해 두는 거야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「性格悪いな～、あのメイド長。でもさ、なんでわざわざそんなことするの？」"
translation = "「성격 나쁘네~, 그 메이드장. 하지만 말이야, 왜 일부러 그런 짓을 하는 거야?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「それも１つの修行だからだ！」"
translation = "「그것도 하나의 수행이니까다!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「イヤなことがあったら逃げちゃうこともあるかもしれない。けど、逃げた後どうするかが大事なんだってさ」"
translation = "「싫은 일이 있으면 도망쳐버리는 일도 있을지도 몰라. 하지만, 도망친 후에 어떻게 하느냐가 중요하다고 하더라」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「負けた気がして悔しくなって、先のこといろいろ考えて……そして、戻ってくるんだ。自分が納得するために」"
translation = "「진 것 같아서 억울해지고, 앞일에 대해 여러 가지 생각하고…… 그리고, 돌아오는 거야. 자신이 납득하기 위해서」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「どうしてさ。そうなるとも限らないだろ？」"
translation = "「어째서인데. 그렇게 된다는 보장도 없잖아?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「かもな。でも、クーシェンなら気付く……逃げたって、何も変わらないってことにな」"
translation = "「지도 몰라. 하지만, 쿠셴이라면 깨달을 거야…… 도망쳐봤자, 아무것도 바뀌지 않는다는 것을 말이지」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「逃げるのをやめて、戻ってきて、そこではじめて考えるんだ。自分がしていることの意味を」"
translation = "「도망치는 것을 그만두고, 돌아와서, 거기서 비로소 생각하는 거야. 자신이 하고 있는 일의 의미를」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「っ……！！」"
translation = "「윽……!!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（メイド修行をしたのは、罰として押しつけられただけ。無理矢理させられたから、つまんなかった。自由じゃないのが嫌だった）"
translation = "（메이드 수행을 한 건, 벌로서 강요당했을 뿐. 억지로 하게 되었으니까, 재미없었어. 자유롭지 않은 게 싫었어）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（自由な方がいい、そんなの決まってる。でも、何か変だった……）"
translation = "（자유로운 편이 좋아, 그런 건 당연해. 하지만, 뭔가 이상했어……）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（逃げちゃえばいいんだって思い付いて逃げ出してみたけど、いざ自由になってみたら、もやもやして気持ちが晴れなくて……）"
translation = "（도망쳐버리면 된다고 생각해서 도망쳐봤지만, 막상 자유로워져 보니, 찜찜해서 기분이 나아지지 않아서……）"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「クーシェンは、メイド修行にどんな意味があると思う？」"
translation = "「쿠셴은, 메이드 수행에 어떤 의미가 있다고 생각해?」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「……わかんないよ。そんなの……意味なんてないと思ってた。けど……」"
translation = "「……모르겠어. 그런 거…… 의미 따위 없다고 생각했어. 하지만……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「意味がないはずがないんだ。たとえば、ほら、これ」"
translation = "「의미가 없을 리가 없어. 예를 들면, 봐봐, 이거」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「この歩き方とかさ。うちのメイドは全員できるけど、戦う時に便利なんだぜ」"
translation = "「이 걸음걸이라든가 말이야. 우리 메이드는 전원 할 수 있지만, 싸울 때 편리하거든」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「力任せに殴りつけるだけじゃ、ただの暴力だ。もっと違う強さを、メイドは持ってると思うんだ」"
translation = "「힘에 맡겨 패배시키는 것뿐이라면, 그건 단순한 폭력이야. 더욱 다른 강함을, 메이드는 가지고 있다고 생각해」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「だから、あたしはメイド修行を頑張る！\u3000今よりもっと強くなるために！」"
translation = "「그러니까, 나는 메이드 수행을 열심히 할 거야! 지금보다 더욱 강해지기 위해서!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「それが……メイド修行をする意味……なの？」"
translation = "「그게…… 메이드 수행을 하는 의미……인 거야?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ああ！\u3000だから、クーシェンも見つけたらいいぞ。目標があれば、つまんないことだって頑張ろうって気持ちになるしな！」"
translation = "「아아! 그러니까, 쿠셴도 찾으면 돼. 목표가 있으면, 재미없는 일이라도 열심히 해야겠다는 기분이 드니까!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「……凄いな、アポロは。うん、なんかかっこいいよ」"
translation = "「……대단하네, 아폴로는. 응, 왠지 멋있어」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そんなことないぞ。さっきも言ったけど、あたしは経験者だからな。キリカの考えてることとか、後でフィオナがこっそり教えてくれたんだ」"
translation = "「그렇지 않아. 아까도 말했지만, 나는 경험자니까 말이지. 키리카가 생각하고 있는 거라든가, 나중에 피오나가 몰래 가르쳐줬었거든」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「だから、その時のフィオナに、今度はあたしがなるんだ」"
translation = "「그러니까, 그때의 피오나가, 이번에는 내가 되는 거야」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「同じことをクーシェンに教えて、それであたしが逃げたことにも意味が生まれる。逃げたのは無駄じゃなかったんだって」"
translation = "「같은 것을 쿠셴에게 가르쳐주고, 그것으로 내가 도망쳤던 것에도 의미가 태어나. 도망쳤던 건 헛되지 않았던 거라고」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「……なんだよ、それ……」"
translation = "「……뭐야, 그게……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（つまり、ボクが逃げたのも、アポロが既に通った道だったってこと？）"
translation = "（즉, 내가 도망친 것도, 아폴로가 이미 지나온 길이었다는 뜻?）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（メイド修行を嫌がってたボク。嫌がらず、そこに意味を見出して頑張ってたアポロ）"
translation = "（메이드 수행을 싫어했던 나. 싫어하지 않고, 거기에 의미를 찾아내며 열심히 했던 아폴로）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（全然違うよね……アポロの方がずっとかっこよくて……強い、と思う）"
translation = "（전혀 다르네…… 아폴로 쪽이 훨씬 멋있고…… 강해, 라고 생각해）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（今のアポロは、ボクより強いんだ……）"
translation = "（지금의 아폴로는, 나보다 강해……）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ねえ、アポロ……お屋敷に戻って修行を続けたら……ボクも強くなれるかな？」"
translation = "「저기, 아폴로…… 저택으로 돌아가서 수행을 계속하면…… 나도 강해질 수 있을까?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「もちろんだ！」"
translation = "「당연하지!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「アポロよりも？」"
translation = "「아폴로보다도?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「それはわかんないけど、クーシェン次第だと思うぞ」"
translation = "「그건 모르겠지만, 쿠셴 하기 나름이라고 생각해」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「……あはは、そっか。そうだよね、うん、アポロの言う通りだ」"
translation = "「……아하하, 그렇구나. 그렇겠지, 응, 아폴로가 하는 말이 맞아」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「心配させちゃってごめんね。でも、ボクはもう大丈夫だから」"
translation = "「걱정시켜서 미안해. 하지만, 나는 이제 괜찮으니까」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（……負けて……られるかっての……）"
translation = "（……지고…… 있을 수 있겠냐고……）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "（ボクはかなり後れを取ってる。でもアポロが……ともだちが教えてくれたから……あとはガムシャラに追いかければいい）"
translation = "（나는 상당히 뒤처져 있어. 하지만 아폴로가…… 친구가 가르쳐줬으니까…… 남은 건 무작정 뒤쫓아가면 돼）"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボク、戻るよ。そしてメイド修行の再開だ～！」"
translation = "「나, 돌아갈게. 그리고 메이드 수행 재개다~!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「おう！\u3000でも覚悟しといた方がいいぞ、キリカのお説教が待ってるからな」"
translation = "「오우! 하지만 각오해 두는 편이 좋을 거다, 키리카의 설교가 기다리고 있을 테니까 말이지」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「や、やっぱり～？」"
translation = "「역, 역시~?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「でも、２人で叱られたら、つらさも半分だ！」"
translation = "「하지만, 둘이서 혼나면, 괴로움도 반이야!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「そうはならないと思うけど……でも、うん、アポロと一緒ならきっと大丈夫！」"
translation = "「그렇게 되진 않을 거라고 생각하지만…… 하지만, 응, 아폴로와 함께라면 분명 괜찮아!」"

[[dialogue]]
speaker = "unk"
original = "この後、お屋敷に戻ったクーシェンとアポロは仲良くお説教を受けた。"
translation = "이후, 저택으로 돌아간 쿠셴과 아폴로는 사이좋게 설교를 들었다."

[[dialogue]]
speaker = "unk"
original = "しかし、つまらなそうな顔をしていたかつてのクーシェンは、もうどこにもなかった。"
translation = "그러나, 재미없는 표정을 짓고 있던 이전의 쿠셴은, 이제 어디에도 없었다."

