[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「お帰りなさいませ、ご主人様……」"
translation = "「다녀오셨습니까, 주인님……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「メイドのエルデリーゼでございます。ご主人様、私になんなりとお申し付けくださいませ──ですわ♪」"
translation = "「메이드 엘데리제라고 합니다. 주인님, 제게 무엇이든 명령해 주시길── 바라요♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「実に見事な立ち振る舞いだな、エルデリーゼ嬢」"
translation = "「참으로 훌륭한 품성이로군, 엘데리제 양」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ありがとうございます。それにしても……美鶴様が仕立てを担当されたこのメイド風の人工戦闘服、本当に素晴らしいですわ」"
translation = "「감사합니다. 그나저나…… 미츠루 님이 재봉을 담당하신 이 메이드풍 인공 전투복, 정말로 멋져요」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「うむ、戦闘服としての機能面はいつも通りアニマに任せているが、服飾部分は美鶴の仕事だ。今回はいつも以上に良い仕事をしてくれた」"
translation = "「음, 전투복으로서의 기능면은 평소처럼 아니마에게 맡겨 두었지만, 의복 부분은 미츠루의 작품이다. 이번엔 평소 이상으로 일을 잘해 주었어」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「ありがとうございます。やー、我ながらめちゃカワに仕上がりましたわ」"
translation = "「감사합니다. 야~, 제가 만들었지만 엄청 귀엽게 완성됐다니까요」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「でも当主様、どういう心境の変化です？\u3000うちらはみんな和風メイドなのに、いきなり洋風メイドだなんて。や、作ってて楽しかったすけど」"
translation = "「근데 가주님, 무슨 심경의 변화예요? 우리들은 전부 일본풍 메이드인데, 갑자기 서양풍 메이드라니. 야, 만들면서 즐겁긴 했지만요」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「なぁに、いつもの気まぐれというやつだ。たまには洋風メイドも良かろうと思ってな」"
translation = "「무어냐, 평소의 변덕이라는 거다. 가끔은 서양풍 메이드도 좋겠지 싶어서 말이다」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「モデルとして思い浮かべていたのがエルデリーゼ嬢だったので、さっそく屋敷に呼んで着てもらうことにしたのだが……大正解であったな」"
translation = "「모델로서 떠올리고 있던 것이 엘데리제 양이었기에, 즉시 저택으로 불러 입어 보게 한 것이다만…… 대성답이었군」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「眼福ではありますけどね……恐れ多くも桜十路家のお嬢様にメイド服を着せようなんて、とんでもないこと考えるのたぶん当主様くらいっすよ……」"
translation = "「눈호강이긴 하지만요…… 황송하게도 사쿠라쥬지 가문의 영애에게 메이드복을 입히다니, 말도 안 되는 생각을 하는 건 아마 가주님 정도일 거라구요……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「うふふ、私もこんなに可愛いメイド服を着ることができて本当に嬉しいですわ」"
translation = "「우후후, 저도 이렇게 귀여운 메이드복을 입을 수 있어서 정말로 기뻐요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「実は以前、お屋敷に帰った時、当家のメイドにお洋服を交換してもらおうとしたこともあったのですけど……」"
translation = "「사실 이전에, 저택으로 돌아갔을 때 저희 가문의 메이드에게 옷을 교환해 달라고 하려고 했던 적도 있었습니다만……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「メイドからは『とんでもございません！』と拒否され、それがばれてお母様からはこっ酷く叱られてしまって……諦めざるを得ませんでしたの」"
translation = "「메이드가 『당치도 않으십니다!』라며 거절하고, 그것이 들켜서 어머님께는 혹독하게 혼나 버려서…… 포기할 수밖에 없었답니다」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「へぇ～、それじゃ念願のメイド服なんすね～」"
translation = "「헤~, 그럼 염원의 메이드복인 거네요~」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ええ、思いもよらぬところで夢が叶ってしまいましたわ。重ね重ね、素晴らしいお洋服をありがとうございます」"
translation = "「네, 뜻밖의 곳에서 꿈이 이루어져 버렸어요. 거듭거듭, 멋진 옷을 감사드립니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「それで私はどのようなお仕事をすればよろしいでしょう？\u3000お掃除ですの？\u3000お洗濯ですの？」"
translation = "「그래서 저는 어떤 일을 하면 좋을까요? 청소인가요? 빨래인가요?」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「え……働くつもり、なんすか？」"
translation = "「에…… 일할 생각, 인가요?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「もちろんですわ！\u3000メイド服を着たからには、メイドのお仕事をしなくてはなりませんの！」"
translation = "「당연하죠! 메이드복을 입은 이상, 메이드 일을 해야만 해요!」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「っておっしゃってますけど、どうします？\u3000当主様」"
translation = "「라고 말씀하시는데, 어떻게 해요? 가주님」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「着飾られるだけでは満足できぬというわけか。ふふ……さすがはエルデリーゼ嬢、私の目に狂いは無かったということだな」"
translation = "「차려입기만 해서는 만족할 수 없다는 뜻인가. 후후…… 역시나 엘데리제 양, 내 눈이 틀리지 않았다는 것이로군」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「よろしい、この際であるからメイドの仕事も体験して頂こう！\u3000美鶴、屋敷を案内し、仕事を手伝ってもらうがいい」"
translation = "「좋다, 이왕 이렇게 된 김에 메이드 일도 체험해 보도록 해라! 미츠루, 저택을 안내하고, 일을 돕게 하거라」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「うぃっす、了解しました」"
translation = "「예잇, 알겠습니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ありがとうございます。では美鶴様、参りましょう」"
translation = "「감사합니다. 그럼 미츠루 님, 가시죠」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「──というわけでヨミー、協力よろ、ってことで」"
translation = "「──라는 이유로 요미─, 협조 부탁~이라는 걸로」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「もー、そんなこと言って美鶴さん、またいつもの省エネモードに入るつもりじゃないんですか？」"
translation = "「정말─, 그런 말을 하고 미츠루 씨, 또 평소처럼 절약 모드로 들어가려는 거 아닌가요?」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「いやいや、まさか。そんな事しませんって」"
translation = "「아니아니, 설마. 그런 짓 안 한다니까요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あっ、失礼しました、エルデリーゼ様。私たちでお屋敷のご案内をさせていただきますね」"
translation = "「앗, 실례했습니다, 엘데리제 님. 저희가 저택 안내를 해드리겠습니다」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「よろしくお願いしますわ、ヨミ様」"
translation = "「잘 부탁드려요, 요미 님」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「はいっ。……こや～、メイド服姿になってもお綺麗で、思わず見惚れてしまいます……」"
translation = "「네. ……고야～, 메이드복 모습이 되셔도 아름다우셔서, 나도 모르게 넋을 잃고 바라보게 돼요……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ありがとうございます。まるで生まれた時から着ていたかのようなシンデレラフィットですの」"
translation = "「감사합니다. 마치 태어났을 때부터 입고 있었던 것 같은 신데렐라 핏이에요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「きっと美鶴様の腕が、とてもよろしいのですわね」"
translation = "「분명 미츠루 님의 솜씨가, 매우 훌륭하신 거겠지요」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「嬉しいっすね～。でも、シンデレラフィットってのも当然と言えば当然なんすよ」"
translation = "「기쁘네요～. 하지만, 신데렐라 핏이라는 것도 당연하다면 당연한 거라구요」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「だってそのメイド服はエルデリーゼ様のためのオーダーメイドっすからね」"
translation = "「왜냐면 그 메이드복은 엘데리제 님을 위한 맞춤 제작이니까요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヘレナ様が私をイメージして作ってくださったのですよね、本当に嬉しいです♪」"
translation = "「헬레나 님이 저를 이미지해서 만들어 주신 거지요, 정말 기뻐요♪」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「あー、それだけじゃなくてですね。これはちょっとした技術革新なんすよ」"
translation = "「아ー, 그것뿐만 아니라요. 이건 약간의 기술 혁신이라구요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「？\u3000どういうことですの？」"
translation = "「? 무슨 말씀이신가요?」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「これまでの人工戦闘服はその力を引き出すために、その戦闘服に込められたテーマにアプローチする必要があったんすけど──」"
translation = "「지금까지의 인공 전투복은 그 힘을 끌어내기 위해, 그 전투복에 담긴 테마에 접근할 필요가 있었습니다만──」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「最近の研究で、着用する対象者をきっかり定めて調整すれば、テーマにアプローチしなくてもすぐに力を引き出せるようになったんす」"
translation = "「최근 연구로, 착용할 대상자를 딱 정해서 조정하면, 테마에 접근하지 않아도 바로 힘을 끌어낼 수 있게 되었다구요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ、そうなんですのね！」"
translation = "「어머, 그렇군요!」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「起動するだけならって話っすけどね。本当にそのフォームを使いこなそうと思ったら、やっぱ習熟と理解を深めた方がいいんすけど」"
translation = "「기동하는 것뿐이라면이라는 이야기지만요. 정말로 그 폼을 숙달해서 쓰려고 한다면, 역시 숙련과 이해를 심화하는 편이 좋다구요」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「やっぱり訓練は必要ってことなんですね～」"
translation = "「역시 훈련은 필요하다는 거네요～」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「そそ」"
translation = "「그렇지」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「問題ありませんわ！\u3000私、お勉強も訓練も大好物ですの！」"
translation = "「문제없어요! 저, 공부도 훈련도 매우 좋아하니까요!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「戦闘服の理解を深めるということは……メイドのなんたるかを知るのが大切ですわね！\u3000ヨミ様、美鶴様、メイドの極意、ご教授くださいませ！」"
translation = "「전투복의 이해를 심화한다는 것은…… 메이드의 진수가 무엇인지 아는 것이 중요하겠지요! 요미 님, 미츠루 님, 메이드의 오의, 전수해 주세요!」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「メイドの極意なんて大層なコト、うちに聞くのは間違ってますんで～。その辺はヨミー、よろしく～」"
translation = "「메이드의 오의라는 거창한 것을, 우리에게 묻는 것은 잘못되었다구요～. 그쪽은 요미ー, 잘 부탁해～」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こやぁーん！？\u3000私にも荷が重いです！\u3000メイドのことならメイド長に聞くのが１番では──」"
translation = "「고야앙!? 저에게도 짐이 무겁습니다! 메이드에 관한 거라면 메이드장에게 묻는 것이 1번이 아닌──」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ん？\u3000そこの茂み、ちょっと動きませんでしたか？」"
translation = "「응? 거기 덤불, 조금 움직이지 않았나요?」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「ぎくっ」"
translation = "「뜨끔」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「そこにいらっしゃるのは──どなたですのっ！？」"
translation = "「거기 계신 것은── 누구신가요!?」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「ヒマワリちゃん、避けて！」"
translation = "「히마와리짱, 피해!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ひゃあっ！？\u3000あ、危なかったぁ！」"
translation = "「히앗!? 위험했다!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「エルデリーゼ先輩……！？\u3000桜十路のお嬢様が、どうして九浄家に……！？」"
translation = "「엘데리제 선배……!? 사쿠라쥬지의 영애가, 어째서 쿠죠 가문에……!?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あなたたち、何者ですの！？\u3000曲者です！\u3000皆の者、出合え出合えですわー！」"
translation = "「당신들, 누구인가요!? 수상한 자입니다! 모두들, 나와라 나와라예요ー!」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "（ヒマワリ、と叫んでいたように思いましたけど……それじゃあの２人、ヒマワリさんとミウさん？）"
translation = "(히마와리, 라고 소리쳤던 것 같습니다만…… 그럼 저 두 사람, 히마와리 씨와 미우 씨?)"

