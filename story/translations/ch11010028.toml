[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「メガジャンボチキン、美味しかったー！\u3000文字通りおっきくて、大満足～！\u3000また来ようね！」"
translation = "「메가 점보 치킨, 맛있었어! 말 그대로 큼직해서 대만족~! 또 오자!」"

[[dialogue]]
speaker = "unk"
original = "今日は早起きして海の家に並び、先日のメガジャンボチキンのリベンジを果たした。"
translation = "오늘은 일찍 일어나 바다의 집에 줄을 서서, 요전번 메가 점보 치킨의 복수를 완수했다."

[[dialogue]]
speaker = "unk"
original = "せっかく海に来たので、ついでに遊んでいる。"
translation = "모처럼 바다에 왔으니, 겸사겸사 놀고 있다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「まさか一羽丸ごとフライドチキンにしちゃうなんて驚きだよ。色んな部位を一度に食べられてすごい贅沢だよね～」"
translation = "「설마 한 마리를 통째로 프라이드치킨으로 만들다니 놀라워. 여러 부위를 한 번에 먹을 수 있어서 정말 사치스럽네~」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「……会長くん、話聞いてる～？\u3000なんかぼーっとしてない？」"
translation = "「……회장 군, 얘기 듣고 있어~? 왠지 멍하니 있지 않아?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「早起きしたから寝不足なのかな？\u3000それとも…………何か我慢してる？」"
translation = "「일찍 일어나서 수면 부족인 걸까? 아니면………… 무언가 참고 있어?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「うっ…………」"
translation = "「윽…………」"

[[dialogue]]
speaker = "unk"
original = "自分ではうまく誤魔化しているつもりだったけど、シルヴィ先輩にはお見通しらしい。"
translation = "나름대로 잘 얼버무리고 있다고 생각했지만, 실비 선배에게는 훤히 들여다보이는 모양이다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「シルヴィ先輩の水着姿にムラムラきちゃって……」"
translation = "「실비 선배의 수영복 차림에 성욕이 솟구쳐서……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「そっかそっか。そんなこと考えてたんだ～。他にたくさん人もいるのに、会長くんのエッチ<emoji=heart04>」"
translation = "「그렇구나 그렇구나. 그런 생각을 하고 있었구나~. 다른 사람들도 잔뜩 있는데, 회장 군은 변태<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「でもね、あたしもおんなじ気持ちだよ。会長くんの体見てたら、あたしもドキドキしちゃう……」"
translation = "「하지만 말야, 나도 같은 기분이야. 회장 군의 몸을 보고 있으면 나도 두근거려 버려……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「前来たとき、人気のない場所を見付けておいたんだ。今から２人で行こうよ。そこで…………ね<emoji=heart04>」"
translation = "「저번에 왔을 때 사람이 없는 장소를 봐 뒀어. 지금부터 둘이서 가자. 거기서………… 알지?<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩に手を引かれ、海水浴場から離れる。誰もいない場所で、俺たちは全てを晒し合った。"
translation = "실비 선배에게 손을 이끌려 해수욕장에서 벗어난다. 아무도 없는 곳에서, 우리들은 모든 것을 서로 드러냈다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あはっ。お外でこんなカッコして、お尻突き出して、あたしも人のコト言えないや」"
translation = "「아하. 밖에서 이런 꼴을 하고 엉덩이를 내밀다니, 나도 남 말 할 처지가 아니네」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「野外プレイで、しかもバックでしたいなんて、会長くんもいい趣味してるよねぇ」"
translation = "「야외 플레이에, 게다가 뒤로 하고 싶다니, 회장 군도 참 좋은 취미네」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩がこんな体勢になっているのは俺の希望だ。先輩が泳いでいる時、お尻がどうしても気になってしまった。"
translation = "실비 선배가 이런 자세를 취하고 있는 것은 나의 희망이다. 선배가 수영하고 있을 때, 엉덩이가 아무래도 신경 쓰여 버렸다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あたし、バックはあんまり好きじゃないんだよね。顔があんまり見えないし、なんていうか、使われてる感？」"
translation = "「나, 뒤로 하는 건 별로 좋아하지 않거든. 얼굴이 잘 안 보이기도 하고, 뭐랄까, 사용당하는 느낌?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「使われてる感？」"
translation = "「사용당하는 느낌?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「うん。こっちはほとんど動けないのに、そっちは一方的に動けるし、腰とかお尻つかまれて、一方的に性欲処理されてる感じ？」"
translation = "「응. 이쪽은 거의 움직일 수 없는데, 저쪽은 일방적으로 움직일 수 있고, 허리나 엉덩이를 붙잡혀서 일방적으로 성욕 처리되는 느낌?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、あとお尻の穴も丸見えだし」"
translation = "「아, 그리고 똥구멍도 훤히 보이고」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「なんかすみません……」"
translation = "「왠지 죄송합니다……」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩がそんな風に思っているとは知らなかった。言われてみれば、今までのエッチは向き合う体位が主で、バックでしたことはあまりない。"
translation = "실비 선배가 그렇게 생각하고 있는 줄은 몰랐다. 그러고 보니 지금까지의 섹스는 마주 보는 체위가 주를 이뤘고, 뒤로 한 적은 거의 없다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「謝らなくていいよ。だって会長くんは、あたしのおま○こで『性欲処理』したかったんだよね？」"
translation = "「사과할 필요 없어. 왜냐면 회장 군은 내 보지로 『성욕 처리』하고 싶었던 거잖아?」"

[[dialogue]]
speaker = "unk"
original = "蠱惑的に笑いながら、お尻を揺らすシルヴィ先輩。"
translation = "요염하게 웃으며 엉덩이를 흔드는 실비 선배."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それは…………はい」"
translation = "「그건………… 네」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩の大きなお尻を掴んで、思い切り滾りをぶつけたい。それは偽りない本心だ。"
translation = "실비 선배의 커다란 엉덩이를 잡고, 마음껏 열기를 쏟아붓고 싶다. 그것은 거짓 없는 본심이다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あははっ、正直でよろしい。年上の女の子つかまえて、おま○こ使って気持ちよくなりたいなんて悪い子だぁ<emoji=heart04>」"
translation = "「아하핫, 솔직해서 좋네. 연상의 여자애 붙잡고 보지 써서 기분 좋아지고 싶다니 나쁜 아이구나아<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「でもいいよ。今日はあたしのおま○こ使わせたげる。その代わり、あたしもいっぱい気持ちよくしてね？」"
translation = "「하지만 좋아. 오늘은 내 보지 쓰게 해줄게. 그 대신 나도 잔뜩 기분 좋게 해줘야 해?」"

[[dialogue]]
speaker = "unk"
original = "お許しも出たところで、少しためらいを感じつつも、先輩の中に入っていく。"
translation = "허락도 떨어졌기에, 조금 망설임을 느끼면서도 선배의 안으로 들어간다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「んは～～～～～～っ<emoji=heart04>」"
translation = "「응하~~~~~~앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「おっきい、おち○ぽ、入ってきたぁっ<emoji=heart04>\u3000あっついぃ……」"
translation = "「커다란 자지 들어왔어어<emoji=heart04> 뜨거워어……」"

[[dialogue]]
speaker = "unk"
original = "夏の暑気も遠く感じるほど、シルヴィ先輩の膣内は熱くて、ぎゅっと締まって気持ちいい。"
translation = "여름의 더위도 멀게 느껴질 정도로, 실비 선배의 질 내는 뜨겁고 꽉 조여서 기분 좋다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「どう、会長くん。あたしのおま○こ気持ちい～い？」"
translation = "「어때, 회장 군. 내 보지 기분 조오오아?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はい、すごく……気持ちいい、です……！」"
translation = "「네, 정말…… 기분 좋습니다……!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「んふふっ、だよねぇ。おち○ぽ、あたしの中でビクビクして、気持ちいいって伝わってくるもん」"
translation = "「응후후, 그렇겠지. 자지, 내 안에서 움찔움찔해서 기분 좋다는 게 전해져 오는걸」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「……はぁ、ん……いいよ、動いて。あたしのおま○こい～っぱい使って気持ちよくなってね<emoji=heart04>」"
translation = "「……하아, 응…… 좋아, 움직여줘. 내 보지 마아않이 써서 기분 좋아지렴<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「はぁ、ああ、あっ<emoji=heart04>\u3000おち○ぽ、あたしの中で、動いてるっ<emoji=heart04>」"
translation = "「하아, 아아, 앗<emoji=heart04> 자지 내 안에서 움직이고 있어어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩の細い腰に手をかけ、腰を振る。水着姿を見た時からこうしたかった。"
translation = "실비 선배의 가느다란 허리에 손을 얹고 허리를 흔든다. 수영복 차림을 봤을 때부터 이렇게 하고 싶었다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あたしのおま○こ……んあ、あっ……本当に会長くんに使われちゃってるぅ……んんっ、ふあっ<emoji=heart04>」"
translation = "「내 보지…… 응아, 앗…… 정말로 회장 군에게 쓰여지고 있어어…… 응윽, 후아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺が動くたび、大きなおっぱいが震え、長い髪が揺れる。シルヴィ先輩の体を支配しているような気さえする。"
translation = "내가 움직일 때마다 커다란 가슴이 떨리고 긴 머리카락이 흔들린다. 실비 선배의 몸을 지배하고 있는 듯한 기분마저 든다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「会長くんのおち○ぽおっきぃ……ん、んんっ……お外なのに、いつもよりおっきくない？\u3000会長くんのヘンタイ<emoji=heart04>」"
translation = "「회장 군 자지 커어…… 응, 응윽…… 야외인데 평소보다 더 크지 않아? 회장 군 변태애<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「誘ってきたのは先輩ですよ」"
translation = "「유혹한 건 선배잖아요」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「それは、ん、そうだけどぉ……」"
translation = "「그건, 응, 그렇지만어어……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あはぁっ……ん、あ、はぁっ……ホントに、ん、会長くんのおち○ぽ、がっちがち……<emoji=heart04>\u3000ふあっ<emoji=heart04>」"
translation = "「아하아앗…… 응, 아, 하앗…… 정말로, 응, 회장 군 자지 빳빳해……<emoji=heart04> 후아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩への溜まった劣情と、先輩を物のように使っているという背徳感が、興奮を高めていた。"
translation = "실비 선배를 향해 쌓였던 열정과, 선배를 물건처럼 다루고 있다는 배덕감이 흥분을 고조시켰다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「そんなに、あたしのおま○こ……ん、あ……使いたかったんだぁ……<emoji=heart04>\u3000あはぁ……<emoji=heart04>」"
translation = "「그렇게나 내 보지…… 응, 아…… 쓰고 싶었구나아……<emoji=heart04> 아하아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あつくて、かったいの……あたしの、一番おく、届いてるっ……おくまで、会長くんの、ものにされちゃってるぅ……<emoji=heart04>」"
translation = "「뜨겁고 단단한 게…… 내 제일 깊은 곳까지 닿고 있어…… 안쪽까지 회장 군의 것으로 만들어지고 있어어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩が俺の物に……"
translation = "실비 선배가 나의 것으로……"

[[dialogue]]
speaker = "unk"
original = "学園の人気者で、尊敬を集める先輩で、綺麗で可愛い上級生。そんな彼女が、お尻を突き出して俺の欲望を受け止めてくれている。"
translation = "학원의 인기인이며 존경을 받는 선배이자, 아름답고 귀여운 상급생. 그런 그녀가 엉덩이를 내밀고 나의 욕망을 받아내고 있다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あぁんっ<emoji=heart04>\u3000うそっ……また、大きくなった……？\u3000会長くん、興奮しすぎぃ……んふふ……やっぱり可愛い<emoji=heart04>」"
translation = "「아앙앗<emoji=heart04> 거짓말…… 또 커졌어……? 회장 군 너무 흥분했어어…… 응후후…… 역시 귀여워<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ずんずんって、おち○ぽ……あっ、あはっ<emoji=heart04>\u3000ひびいて、るっ……ふは、はぁ……<emoji=heart04>」"
translation = "「푹푹 하고 자지가…… 앗, 아핫<emoji=heart04> 울리고 있어어…… 후하, 하아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「はぁ、あ……あんまり好きじゃないって、言ったばかり、なのに……感じてる……おま○こ、おち○ぽでごしごしされると気持ちよくなっちゃうっ<emoji=heart04>」"
translation = "「하아, 아…… 별로 좋아하지 않는다고 말한 지 얼마 안 됐는데…… 느끼고 있어…… 보지, 자지로 슥슥 비벼지면 기분 좋아져 버려어<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「じゃあ先輩もヘンタイですね」"
translation = "「그럼 선배도 변태네요」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「もうっ、言わないでっ……自分でも、んっ、そう思ってるからっ……あ、あんっ<emoji=heart04>」"
translation = "「정말, 말하지 마아…… 나 스스로도, 응, 그렇게 생각하고 있으니까아…… 아, 안앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「お外で、後ろから突かれてるのに……あんまり好きじゃないのに……あぁっ、おま○こ突かれると、じゅわって気持ちいいっ<emoji=heart04>」"
translation = "「밖에서 뒤로 찔리고 있는데…… 별로 좋아하지 않는데…… 아앗, 보지 찔리니까 쥬욱 하고 기분 좋아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩の秘所からは愛液がとめどなく溢れており、その言葉が嘘ではないことを証明している。"
translation = "실비 선배의 비소에서는 애액이 끊임없이 흘러넘치고 있어 그 말이 거짓이 아님을 증명하고 있다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「こういうのはどうですか？」"
translation = "「이런 건 어떤가요?」"

[[dialogue]]
speaker = "unk"
original = "今までと角度を変えてシルヴィ先輩の膣内を穿つ。"
translation = "지금까지와 각도를 바꿔 실비 선배의 질 내부를 꿰뚫는다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「はぁぁぁ～～～～～っ<emoji=heart04><emoji=heart04>」"
translation = "「하아아아~~~~~앗<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「んあっ……今の、なに……！？\u3000ぞわぞわってしたっ……」"
translation = "「응앗…… 방금 그거 뭐야……!? 소름 돋았어어……!」"

[[dialogue]]
speaker = "unk"
original = "やっぱり思った通りだ。経験が少ないということは、まだ開発されていないということ。普段の体位では当たらないところを狙って突く。"
translation = "역시 생각대로다. 경험이 적다는 것은 아직 개발되지 않았다는 것. 평소 체위로는 닿지 않는 곳을 노려 찌른다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ふあ、あぁっ……いつもと、違うとこ、当たってるっ<emoji=heart04>\u3000あ、はぁ、ああっ<emoji=heart04>」"
translation = "「후아, 아아앗…… 평소랑 다른 곳에 닿고 있어어<emoji=heart04> 아, 하아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「おち○ぽ、気持ちいいっ<emoji=heart04>\u3000気持ちよくされちゃってるっ<emoji=heart04>\u3000あたしのなか、おち○ぽで知らないとこほじくられてるっ<emoji=heart04>」"
translation = "「자지 기분 좋아앗<emoji=heart04> 기분 좋게 만들어지고 있어어<emoji=heart04> 내 안이 자지로 모르는 곳까지 파헤쳐지고 있어어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "何度も体を重ねてきたけど、まだ俺の届いていないところがあったなんて。シルヴィ先輩の全部を俺のものにしたくて、開拓を進める。"
translation = "몇 번이나 몸을 섞어 왔지만, 아직 내가 닿지 못한 곳이 있었다니. 실비 선배의 전부를 내 것으로 만들고 싶어 개척을 진행한다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、あっ……また違うとこあたった<emoji=heart04>\u3000あたしのおま○こ、ふぁっ、弱いとこ、探されてるっ<emoji=heart04>」"
translation = "「아, 앗…… 또 다른 데 닿았어<emoji=heart04> 내 보지의, 후앗, 약한 곳을 찾고 있어어<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あたしのおま○こ、もう君のなのに、もっともっと君のものにされちゃうっ<emoji=heart04>\u3000は、あ、はぁ～～っ<emoji=heart04>」"
translation = "「내 보지 이미 네 것인데, 더더욱 네 것으로 만들어지고 있어어<emoji=heart04> 하, 아, 하아~~앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ふああ～～～～っ<emoji=heart04>\u3000そこ、そこだめっ<emoji=heart04>\u3000感じちゃうっ<emoji=heart04>\u3000体ぶるぶるって震えちゃうっ<emoji=heart04>\u3000はぁ、あ、あ～～～～っ<emoji=heart04>」"
translation = "「후아아~~~~앗<emoji=heart04> 거기, 거긴 안 돼앗<emoji=heart04> 느껴버려엇<emoji=heart04> 몸이 부르르 떨려버려엇<emoji=heart04> 하아, 아, 아~~~~앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "探索を繰り返すうち、シルヴィ先輩の最も弱いところを発見した。"
translation = "탐색을 거듭한 끝에 실비 선배의 가장 약한 곳을 발견했다."

[[dialogue]]
speaker = "unk"
original = "突くと腰全体ががくがくと揺れ、膣がきゅっと嬉しそうに締まる。"
translation = "찌르면 허리 전체가 가늘게 떨리고, 질이 꽉 하고 기쁜 듯이 조여온다."

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩をもっと貪りたい──そう思うより先に、身体に力が入って──"
translation = "실비 선배를 좀 더 탐하고 싶다── 그렇게 생각하기보다 먼저 몸에 힘이 들어가고──"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、あ、あ、あぁっ<emoji=heart04>\u3000ふあ、あ、あ、ひぃっ、ああぁ～～っ<emoji=heart04>」"
translation = "「아, 아, 아, 아아앗<emoji=heart04> 후아, 아, 아, 히잇, 아아아~~앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「おち○ぽ強くなったぁっ<emoji=heart04>\u3000は、ふあぁっ<emoji=heart04>\u3000弱いとこ、何度もぶっ叩かれてるっ<emoji=heart04>」"
translation = "「자지 강해졌어어앗<emoji=heart04> 하, 후아앗<emoji=heart04> 약한 곳을 몇 번이나 얻어맞고 있어어앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「後ろからされるの、好きじゃなかったのに、好きになっちゃうっ<emoji=heart04>\u3000ヤバっ<emoji=heart04>\u3000あたしのおま○こ、おち○ぽで塗りつぶされちゃうっ<emoji=heart04>」"
translation = "「뒤로 하는 거 좋아하지 않았는데, 좋아하게 돼버려어앗<emoji=heart04> 위험해앗<emoji=heart04> 내 보지, 자지로 덧칠해져 버려어앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "先輩を性欲のはけ口にするばかりか、蹂躙し、征服する。背徳的な興奮が下半身から押し寄せる。"
translation = "선배를 성욕의 배출구로 삼을 뿐만 아니라, 유린하고 정복한다. 배덕적인 흥분이 하반신에서 밀려온다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「だめ、だめっ<emoji=heart04>\u3000弱いとこばっかり、ずるいよぉっ<emoji=heart04>\u3000はあぁっ<emoji=heart04>\u3000気持ちいっ<emoji=heart04>\u3000気持ちよすぎっ<emoji=heart04>」"
translation = "「안 돼, 안 돼앗<emoji=heart04> 약한 곳만 노리다니 비겁해애앗<emoji=heart04> 하아앗<emoji=heart04> 기분 좋아앗<emoji=heart04> 너무 기분 좋아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、はっ、はあぁっ<emoji=heart04>\u3000んあ、あ、ああ、ああぁ～～っ<emoji=heart04>\u3000ふあ、あんっ<emoji=heart04>」"
translation = "「아, 핫, 하아앗<emoji=heart04> 응아, 아, 아아, 아아아~~앗<emoji=heart04> 후아, 안앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "腰を叩きつけながら、激しく揺れるおっぱいに手を伸ばす。加減なんてできなくて、鷲掴みにした。"
translation = "허리를 부딪치며 격렬하게 흔들리는 가슴에 손을 뻗는다. 가감 같은 건 할 수 없어서 움켜쥐었다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あぁっ<emoji=heart04>\u3000おっぱいぐにぐにされてるっ……あ、んんっ……乳首、ぎゅってつままれてるっ<emoji=heart04>」"
translation = "「아앗<emoji=heart04> 가슴 주물주물 당하고 있어어…… 아, 응윽…… 젖꼭지 꽉 꼬집히고 있어어앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「おま○こも、おっぱいも、会長くんの好き放題されてるっ<emoji=heart04>\u3000いっぱい気持ちよくて、からだ、ブッ壊れちゃいそうっ、あっ、ひあぁっ<emoji=heart04>」"
translation = "「보지도 가슴도 회장 군 마음대로 되고 있어어앗<emoji=heart04> 잔뜩 기분 좋아서 몸이 망가져 버릴 것 같아앗, 앗, 히아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "もし先輩を本当に快感で壊せたら──凶暴な感情を自分でも抑えきれない。"
translation = "만약 선배를 정말로 쾌감으로 망가뜨릴 수 있다면── 포악한 감정을 나 스스로도 억제할 수 없다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、はぁっ<emoji=heart04>\u3000あ、あ、あ、あ、ああぁっ<emoji=heart04>\u3000会長くん、待って、激しすぎぃっ<emoji=heart04>\u3000ホントに壊れちゃうよぉっ<emoji=heart04>」"
translation = "「아, 하앗<emoji=heart04> 아, 아, 아, 아, 아아앗<emoji=heart04> 회장 군 기다려, 너무 격렬해애앗<emoji=heart04> 정말로 망가져 버릴 거야아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「パンパンって、お尻、叩かれてる、みたいっ……ふぁっ<emoji=heart04>\u3000腰、がっちり掴まれて、はぁ、あっ、逃げらんないっ<emoji=heart04>」"
translation = "「팡팡 하고 엉덩이 얻어맞는 것 같아아…… 후앗<emoji=heart04> 허리 꽉 붙잡혀서, 하아, 앗, 도망 못 가앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "前のめりになって、左手で腰を捕まえながら、胸を揉みしだく。シルヴィ先輩の全身を、俺もまた全身で味わう。"
translation = "몸을 앞으로 숙여 왼손으로 허리를 붙잡은 채 가슴을 주무른다. 실비 선배의 전신을 나 또한 온몸으로 맛본다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「はぁ、あ……会長くん、がっつき、すぎ……ふあっ、そんなに、あたしのこと、ブッ壊したいんだ……？」"
translation = "「하아, 아…… 회장 군 너무 허겁지겁이야…… 후앗, 그렇게나 나를 망가뜨리고 싶은 거야……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はい、俺の手でブッ壊したいです……っ！」"
translation = "「네, 제 손으로 망가뜨리고 싶어요……!」"

[[dialogue]]
speaker = "unk"
original = "先輩の全身、足の先から髪の毛一本まで、俺で染めたい。俺のものにしたい。"
translation = "선배의 전신, 발끝부터 머리카락 한 올까지 나로 물들이고 싶다. 나의 것으로 만들고 싶다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「はぁ～～～～っ<emoji=heart04>\u3000あはぁっ<emoji=heart04>\u3000だめ、可愛すぎぃっ<emoji=heart04>\u3000おま○こキュンキュンしちゃうっ<emoji=heart04>」"
translation = "「하아~~~~앗<emoji=heart04> 아하앗<emoji=heart04> 안 돼, 너무 귀여워어앗<emoji=heart04> 보지가 큥큥거려어앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「いつも、真面目で優しい会長くんが……あたしに、こんなに乱暴にっ……なっちゃうんだっ<emoji=heart04>」"
translation = "「항상 성실하고 상냥한 회장 군이…… 나에게 이렇게나 난폭하게…… 돼버리다니앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「そんなに、あたしのこと、好き……？」"
translation = "「그렇게나 내가 좋아……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「好きです。だから、全部、くださいっ！」"
translation = "「좋아해요. 그러니까 전부 주세요!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「んはぁっ<emoji=heart04>\u3000いいよ、ぜんぶ、あげるっ……だから、あたしのこと、ぶっ壊してっ……はぁっ<emoji=heart04>」"
translation = "「응하앗<emoji=heart04> 좋아, 전부 줄게…… 그러니까 나를 망가뜨려 줘어…… 하앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩の腰を両手で掴んで、渾身の力で一番奥まで穿つ。"
translation = "실비 선배의 허리를 양손으로 붙잡고 혼신의 힘을 다해 제일 안쪽까지 꿰뚫는다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ひあ、あ、ああっ<emoji=heart04>\u3000またおち○ぽ強くなったぁ<emoji=heart04>\u3000あ、あ、あ、ああっ<emoji=heart04>」"
translation = "「히아, 아, 아앗<emoji=heart04> 또 자지 강해졌어어어<emoji=heart04> 아, 아, 아, 아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ズンズンって、奥まで、来てるっ<emoji=heart04>\u3000ひぁっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000これ、すごいぃっ<emoji=heart04>」"
translation = "「즈웅즈웅 하고 안쪽까지 오고 있어어앗<emoji=heart04> 히앗<emoji=heart04> 앗<emoji=heart04> 이거 굉장해애앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「んひぃ、い、んあっ<emoji=heart04>\u3000弱いとこから、奥まで、おち○ぽでほじくられてるっ<emoji=heart04>\u3000会長くんのだって、マーキングされてるっ<emoji=heart04>」"
translation = "「응히이, 이, 응앗<emoji=heart04> 약한 곳부터 안쪽까지 자지로 파헤쳐지고 있어어앗<emoji=heart04> 회장 군 거라고 마킹 당하고 있어어앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "さっき見付けたシルヴィ先輩の弱点を擦りながら、子宮めがけて突く。文字通り、先輩の全部を俺で染めるために。"
translation = "방금 찾아낸 실비 선배의 약점을 문지르며 자궁을 향해 찌른다. 말 그대로 선배의 전부를 나로 물들이기 위해."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「やぁ、あ、ああっ<emoji=heart04>\u3000子宮の、入り口……は、あぁっ<emoji=heart04>\u3000赤ちゃんつくるところ、ノックされてるっ<emoji=heart04>」"
translation = "「야아, 아, 아앗<emoji=heart04> 자궁 입구…… 하, 아아앗<emoji=heart04> 아기 만드는 곳 노크 당하고 있어어앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「おち○ぽから、伝わってくるっ<emoji=heart04>\u3000あたしの中で、せーえき出したいってぇ……はぁ、んんっ<emoji=heart04>」"
translation = "「자지로부터 전해져 와앗<emoji=heart04> 내 안에서 정액 내고 싶어 한다고오…… 하아, 응윽<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「いいよっ、出してっ<emoji=heart04>\u3000あたしの子宮、君のせーしでいっぱいにしてぇっ<emoji=heart04>」"
translation = "「좋아앗, 내줘앗<emoji=heart04> 내 자궁 네 정자로 가득 채워줘어어앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、あ、あ、あぁ～～<emoji=heart04>\u3000おち○ぽビクビクしてるっ<emoji=heart04>\u3000せーし出そうなんだねっ<emoji=heart04>」"
translation = "「아, 아, 아, 아아~~<emoji=heart04> 자지 움찔거리고 있어어앗<emoji=heart04> 정자 내보낼 것 같구나앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、だめ、はぁ、ヤバっ<emoji=heart04>\u3000中に出されるの、想像したら、おま○こキュンってしちゃうっ<emoji=heart04>」"
translation = "「아, 안 돼, 하아, 위험해앗<emoji=heart04> 안에 싸는 거 상상했더니 보지가 큥 하고 울려버려앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「イクイクイク、あたしも、イクっ<emoji=heart04>\u3000はぁ、あ、あ、あ、ああ、ああぁっ──<emoji=heart04><emoji=heart04>」"
translation = "「간다간다간다, 나도 가아앗<emoji=heart04> 하아, 아, 아, 아, 아아, 아아아앗──<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そして先端が行き当たった瞬間、精も根も解き放った。"
translation = "그리고 끝부분이 가닿은 순간, 온 힘을 다해 해방했다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ひああああ～～～～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「히아아아아아~~~~~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あああ～～っ<emoji=heart04>\u3000出てる、せーし、あたしの中で出てるぅ……<emoji=heart04>\u3000おま○こあっついぃ……<emoji=heart04>」"
translation = "「아아아~~앗<emoji=heart04> 나오고 있어, 정자 내 안에서 나오고 있어어……<emoji=heart04> 보지 뜨거워어어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「んんっ<emoji=heart04>\u3000ドクドクって、おち○ぽ嬉しそうに震えてるぅ……あはっ、あたしまで嬉しくなっちゃう……<emoji=heart04>」"
translation = "「응윽<emoji=heart04> 울컥울컥 하고 자지가 기쁜 듯이 떨리고 있어어…… 아핫, 나까지 기뻐져 버려……<emoji=heart04>」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「はぁはぁ……おま○こいっぱい締めてあげるね……んんっ<emoji=heart04>」"
translation = "「하아 하아…… 보지 가득 조여줄게…… 응윽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "最後の一滴まで搾り取ろうと、下半身に力を込めるシルヴィ先輩。"
translation = "마지막 한 방울까지 짜내려는 듯 하반신에 힘을 주는 실비 선배."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「く……うぅっ……！」"
translation = "「크…… 으윽……!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あっ<emoji=heart04>\u3000また、びゅって出たぁ……<emoji=heart04>\u3000熱いの、お腹に染み込んでる……<emoji=heart04>\u3000あ……はぁ……<emoji=heart04>」"
translation = "「앗<emoji=heart04> 또 뷰릇 하고 나왔어어……<emoji=heart04> 뜨거운 게 배 속에 스며들고 있어…… 아…… 하아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "限界を超えて搾り取られ、最後の一滴までシルヴィ先輩の中に吐き出した。"
translation = "한계를 넘어 짜내어져, 마지막 한 방울까지 실비 선배의 안에 쏟아냈다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あはっ、すっごい出たね。めっちゃせーしこぼれてる～」"
translation = "「아하핫, 정말 많이 나왔네. 정자가 잔뜩 새어 나오고 있어~」"

[[dialogue]]
speaker = "unk"
original = "力を使い果たしたペニスが萎え、膣口から白い粘液が漏れ落ちた。先輩の脚の間に精液が小さく溜まっていく。"
translation = "힘을 다한 페니스가 시들고, 질 입구에서 하얀 점액이 흘러내렸다. 선배의 다리 사이에 정액이 작게 고여 간다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「会長くん、今日はいつになくワイルドだったね～。可愛い顔して、こんなことしたいと思ってたんだ～？」"
translation = "「회장 군, 오늘은 평소답지 않게 와일드했네~. 귀여운 얼굴을 하고 이런 짓을 하고 싶어 했구나~?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ごめんなさい……」"
translation = "「죄송합니다……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「んふふ、いいよいいよ。そんだけあたしのこと好きだってことだもんね」"
translation = "「응후후, 괜찮아 괜찮아. 그만큼 나를 좋아한다는 뜻이니까」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、はぁ……激しすぎて、本当にブッ壊れちゃった……体に力が入んないや～。あははっ」"
translation = "「아, 하아…… 너무 격렬해서 정말로 망가져 버렸어…… 몸에 힘이 안 들어가네~. 아하핫」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「全身だるいのに、お腹だけ熱くて変な感じ……でも、これ好きかも」"
translation = "「전신이 나른한데 배 안만 뜨거워서 이상한 기분…… 하지만 이거 좋을지도」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ」"
translation = "「아」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「先のことは未定って言ったけど……このままデキちゃったら、会長くんのお嫁さんっていうのもアリだよね。あはははっ」"
translation = "「앞날은 미정이라고 말했지만…… 이대로 생겨버린다면 회장 군의 신부가 되는 것도 나쁘지 않겠네. 아하하하핫」"

[[dialogue]]
speaker = "unk"
original = "激しく乱れ合った後でも、明るく笑うシルヴィ先輩。"
translation = "격렬하게 뒤섞인 후에도 밝게 웃는 실비 선배."

[[dialogue]]
speaker = "unk"
original = "その笑顔を見ながら、シルヴィ先輩のお腹が大きくなるのを思わず想像してしまうのだった。"
translation = "그 미소를 보며 실비 선배의 배가 불러오는 것을 나도 모르게 상상하게 되는 것이었다."

