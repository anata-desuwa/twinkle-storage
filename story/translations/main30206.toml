[[dialogue]]
speaker = "unk"
original = "第６話,『それぞれの特訓』,B"
translation = "제6화, 『각자의 특훈』, B"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ふー……」"
translation = "「후─……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「で、どうだった？\u3000初セッションの感想は？」"
translation = "「그래서, 어땠어? 첫 세션 소감은?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「いや無理だろう！」"
translation = "「아니 무리잖아!」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「感想を聞かれるまでもないな」"
translation = "「소감을 들을 필요도 없겠군」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「マイナス１００ポイントね……」"
translation = "「마이너스 100포인트네요……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ちょっとちょっとみんな～。もっと本気になってくれなきゃ困るよ～」"
translation = "「잠깐 잠깐 얘들아~. 좀 더 진지해져 주지 않으면 곤란하다고~」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「無茶を言うな！\u3000一度、動画を見ただけで弾けるものか！」"
translation = "「터무니없는 소리 마라! 한번, 동영상을 본 것만으로 켤 수 있을 리가 있나!」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「そもそも私たちは全員、楽器の扱い方すら知らない初心者ですからね……」"
translation = "「애초에 저희는 전원, 악기를 다루는 법조차 모르는 초보자이니까요……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「というかラクシャ、発案者のあなたもまったく弾けていないではないか！\u3000どういうことなのだ！」"
translation = "「그보다 락샤, 발안자인 당신도 전혀 켜지 못하고 있지 않은가! 어떻게 된 것인가!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そんなこと言われても、ボクだってみんなと同じ未経験者だし～」"
translation = "「그런 말을 들어도, 나도 모두와 같은 미경험자고~」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「だったらどうして、バンドを組もうなどと言い始めたのだ……」"
translation = "「그렇다면 어째서, 밴드를 짜자느니 하는 말을 꺼낸 것인가……」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「いや～、思ってた以上にひどい状態だね～。残念だけどもう諦めた方がいいんじゃない？」"
translation = "「이야~, 생각했던 것 이상으로 참혹한 상태네~. 아쉽지만 이제 포기하는 편이 좋지 않아?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あれ？\u3000でもパテルはちゃんと弾けてたよね？」"
translation = "「어라? 하지만 파텔은 제대로 켜고 있었지?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「やはり経験者だったのか？」"
translation = "「역시 경험자였던 건가?」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「ううん。本当に未経験者だよ。でもまあ、動画を見て何となくやってみたら出来ちゃった」"
translation = "「으응. 정말로 미경험자야. 뭐 그렇지만, 동영상을 보고 어쩐지 해보니까 돼버렸어」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「て、天才っ！？」"
translation = "「천, 천재!?」"

[[dialogue]]
speaker_original = "パテル"
speaker_translation = "파텔"
original = "「どうして勧誘した本人が驚いてるのかな……」"
translation = "「어째서 권유한 본인이 놀라고 있는 걸까……」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「しかし、このままではライブで演奏はおろか、まともに音を奏でる事すら出来そうにないが？」"
translation = "「하지만, 이대로라면 라이브에서 연주는커녕, 제대로 소리를 내는 것조차 힘들 것 같다만?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ぅぅ……困ったなぁ、どうしよう……」"
translation = "「으으…… 난처하네, 어쩌지……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「なーんてね。安心してよ、実はその辺、ちゃーんと考えがあるから♪」"
translation = "「~라는 건 거짓말. 안심해, 실은 그 부분, 재대로 생각이 있으니까♪」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「もはや一寸ほどの信用も置けないのだが……」"
translation = "「이제는 한 치의 신용도 둘 수 없다만……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「って話してたら、ナイスタイミングで到着したみたいだね」"
translation = "「라고 얘기하고 있으니까, 나이스 타이밍으로 도착한 모양이네」"

[[dialogue]]
speaker = "unk"
original = "メッセージの着信を知らせる通知音にＤＩＳＣを確認したラクシャは、トレーニングルームのドアを開けに行く。"
translation = "메시지의 수신을 알리는 통지음에 DISC를 확인한 락샤는, 트레이닝룸의 문을 열러 간다."

[[dialogue]]
speaker = "unk"
original = "入ってきたのは──"
translation = "들어온 것은──"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「イエーイ♪\u3000シルヴィ・グリムランドですっ！\u3000環ちゃんに頼まれて先生しに来ました～♪」"
translation = "「이야~이♪ 실비 그림랜드입니다! 타마키짱이 부탁해서 선생님 하러 왔어요~♪」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ・グリムランド。"
translation = "실비 그림랜드."

[[dialogue]]
speaker = "unk"
original = "一時期、見習い星騎士の指導のため離れていたが、最近、新星学園に戻ってきた。"
translation = "한동안, 견습 성기사의 지도를 위해 떠나있었지만, 최근, 신성학원으로 돌아왔다."

[[dialogue]]
speaker = "unk"
original = "過去には新星星徒会の副会長を務めていたこともある星騎士だ。"
translation = "과거에는 신성성학생회의 부회장을 맡았던 적도 있는 성기사다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「シルヴィさん、来てくれてありがとー！」"
translation = "「실비 씨, 와줘서 고마워─!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「なんと彼女はバンド経験者なんだ。さすがに素人だけでライブは無謀すぎるからさ、先生役をお願いしておいたんだよ」"
translation = "「무려 그녀는 밴드 경험자야. 역시 초보자끼리만으로 라이브는 너무 무모하니까 말이지, 선생님 역할을 부탁해 두었던 거야」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「バンド仲間も連れてきたよ～。あたしの専門はドラムだから、それ以外の楽器もちゃんと教えられるようにって」"
translation = "「밴드 동료도 데려왔어~. 내 전문은 드럼이니까, 그 이외의 악기도 제대로 가르쳐 줄 수 있도록 해서」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「至れり尽くせり感謝だよ～」"
translation = "「지극정성에 감사해~」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「それだけじゃないよ！\u3000偶然この話を聞いて乗り気になってくれた人も連れて来ちゃったんだよねー」"
translation = "「그것뿐만이 아니야! 우연히 이 이야기를 듣고 마음이 쏠린 사람도 데리고 와버렸거든─」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「みなさん、こんにちは」"
translation = "「여러분, 안녕하세요」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「レミカ殿！」"
translation = "「레미카 공!」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「シルヴィ先輩から話を聞いて面白そうだって思ったんだ。よかったら協力させてもらってもいいかな？」"
translation = "「실비 선배에게 이야기를 듣고 재미있을 것 같다고 생각했어. 괜찮다면 협력하게 해줘도 될까?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「我々にとっては有難いが……レミカ殿は芸能活動で忙しい身ではないか？」"
translation = "「우리로서는 감사할 따름이다만…… 레미카 공은 연예 활동으로 바쁜 몸이 아닌가?」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「うん……でも、どうしても協力したいんだ。『リクリエの被害から復興しようと頑張る人々を元気づけたい』って動機に心打たれちゃったから」"
translation = "「응…… 하지만, 어떻게 해서든 협력하고 싶어. 『리크리에의 피해로부터 부흥하려고 힘쓰는 사람들을 북돋아 주고 싶다』라는 동기에 마음을 빼앗겨 버렸으니까」"

[[dialogue]]
speaker_original = "レミカ"
speaker_translation = "레미카"
original = "「楽器は専門じゃないけど、ボーカルの事だったら力になれると思うし、ダンスやパフォーマンスの事でも相談に乗れると思うよ？」"
translation = "「악기는 전문이 아니지만, 보컬에 관한 거라면 힘이 되어줄 수 있을 것 같고, 댄스나 퍼포먼스에 관한 거라도 상담을 받아줄 수 있을 것 같은데?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「心強い言葉、感謝する。レミカ殿！」"
translation = "「든든한 말, 감사하오. 레미카 공!」"

[[dialogue]]
speaker_original = "アルモタヘル"
speaker_translation = "아르모타헬"
original = "「ふふ、気が付けば盤石の体勢が整っているではないか」"
translation = "「후후, 정신을 차리고 보니 난공불락의 체제가 갖추어져 있지 않은가」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「これなら何とかなるんじゃないかしら？」"
translation = "「이거라면 어떻게든 되지 않을까요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「みんなの<ruby>瞳<rt>め</rt></ruby>に光が<ruby>灯<rt>とも</rt></ruby>る、か……」"
translation = "「모두의 <ruby>눈<rt>눈</rt></ruby>에 빛이 <ruby>켜진다<rt>켜진다</rt></ruby>, 인가……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「よーし、それじゃさっそく練習開始だよっ♪」"
translation = "「좋―아, 그럼 곧바로 연습 개시야♪」"

[[dialogue]]
speaker_original = "全員"
speaker_translation = "전원"
original = "「おーっ！」"
translation = "「오―!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「まさか、あたしのよく通ってたフライドチキンのお店……<ruby>ＧＦＣ<rt>ジーエフシー</rt></ruby>の店員さんが、守護天使様だったなんてね～」"
translation = "「설마, 내가 자주 다니던 프라이드치킨 가게…… <ruby>GFC<rt>지 에프 씨</rt></ruby>의 점원분이, 수호천사님이었다니 말이야~」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「店員さんの相棒は後々、新星学園の星徒会長になる子で、しかも世界を救う魔王だったりするし……どうかしてるよね、あのお店！」"
translation = "「점원분의 파트너는 나중에, 신성학원의 성학생회장이 되는 아이이고, 게다가 세계를 구하는 마왕이기도 하고…… 어떻게 된 거 아니야, 그 가게!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは～、確かにとんでもない店かも」"
translation = "「아하하~, 확실히 엄청난 가게일지도」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「でもどうして守護天使が正体を隠してバイトなんかしてたの？」"
translation = "「근데 어째서 수호천사가 정체를 숨기고 알바 같은 걸 하고 있었어?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それはまあ、いろいろ事情があってね～」"
translation = "「그건 뭐, 여러 가지 사정이 있어서 말이지~」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ラクシャ様、だっけ？\u3000今後はそっちで呼んだ方がいいですか？」"
translation = "「락샤 님, 이었나? 앞으로는 그쪽으로 부르는 편이 좋을까요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「今までの顔見知りには『市倉環』でお願いしたいかな～。敬語もいらないから♪」"
translation = "「지금까지 알고 지내던 사이엔 『이치쿠라 타마키』로 부탁하고 싶은데~. 존댓말도 필요 없으니까♪」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「じゃあたしはこれからも、環ちゃんって呼ぶことにするね♪」"
translation = "「그럼 난 앞으로도, 타마키짱이라고 부르기로 할게♪」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「それにしてもビックリしたな～。見かけないなーって思ってたらいきなり連絡が来て、素人を集めてバンドを組みたいから助けて、なんて言われるんだもん」"
translation = "「그나저나 깜짝 놀랐네~. 안 보인다 했더니 갑자기 연락이 와서, 초보자를 모아서 밴드를 짜고 싶으니까 도와줘, 라니 말이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「シルヴィさんと知り合いで本当に良かったよ～」"
translation = "「실비 씨랑 아는 사이라 정말 다행이었어~」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「っていうか環ちゃん、この学園の子とほとんど知り合いなんでしょ？\u3000顔の広さなら１番かもって聞いたよ？」"
translation = "「그나저나 타마키짱, 이 학원 아이들이랑 거의 다 아는 사이지? 마당발로 치면 1등일지도란 소릴 들었다구?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「色んなところにフラフラ顔を出してたからね～。まさかこんな形で活きるとは思わなかったよ」"
translation = "「이곳저곳 알씬거렸으니까 말이지~. 설마 이런 형태로 도움이 될 줄은 몰랐어」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「どうかな？\u3000ぶっちゃけ、ハロウィンまでに何とかなりそう？」"
translation = "「어떨까? 솔직히 말해서, 할로윈까지 어떻게든 될 것 같아?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「始めたばっかりだから、まだ何とも言えないけど──」"
translation = "「막 시작했을 뿐이라, 아직 뭐라 말할 수 없지만──」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ぶっちゃけ、普通に考えたら無理だよね～。でも、やれるだけのことは全部やってみるよ」"
translation = "「솔직히 말해서, 보통으로 생각하면 무리겠지~. 하지만, 할 수 있는 만큼은 전부 해볼게」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「バンドに興味を持ってくれたの、やっぱ嬉しかったからね。経験者としてはやっぱり力になりたいじゃない？」"
translation = "「밴드에 흥미를 가져준 거, 역시 기뻤으니까 말이야. 경험자로서는 역시 힘이 되어주고 싶잖아?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ありがと、シルヴィさん」"
translation = "「고마워, 실비 씨」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「いえいえ、どういたしまして」"
translation = "「천만에요, 별말씀을」"

[[dialogue]]
speaker = "unk"
original = "顔を見合わせてると笑みがこぼれる。"
translation = "마주 보며 미소가 흘러나온다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、マグダレナさんがちょっと困ってるみたい。ちょっと見てくるね」"
translation = "「아, 막달레나 씨가 약간 난처해하고 있는 것 같아. 잠시 보고 올게」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん、頼んだよ」"
translation = "「응, 부탁해」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「っていうか環ちゃんも練習しなきゃだよ～」"
translation = "「그나저나 타마키짱도 연습해야 한다구~」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「もっちろん！\u3000めっちゃするよー♪」"
translation = "「물~론! 엄청 할 거야─♪」"

[[dialogue]]
speaker = "unk"
original = "シルヴィはマグダレナの隣について、リズムの刻み方を教える。"
translation = "실비는 막달레나의 옆에 붙어서, 리듬을 타는 법을 가르쳐 준다."

[[dialogue]]
speaker = "unk"
original = "他の守護天使たちにもマンツーマンで先生がついて指導に当たっている。"
translation = "다른 수호천사들에게도 1대1로 선생님이 붙어서 지도에 임하고 있다."

[[dialogue]]
speaker = "unk"
original = "そんな光景を眺めながら、ラクシャはそっと胸に手を当てた。"
translation = "그런 광경을 바라보면서, 락샤는 가만히 가슴에 손을 얹었다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「……これはこれで、ちょっと楽しい──かな？」"
translation = "「……이건 이것대로, 약간 즐거울──지도?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「…………うん」"
translation = "「…………응」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「よし、ボクもみんなに負けないように頑張らなくっちゃね！」"
translation = "「좋아, 나도 모두에게 지지 않도록 힘내야겠네!」"

