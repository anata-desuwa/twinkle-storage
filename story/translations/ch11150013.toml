[[dialogue]]
speaker = "unk"
original = "第３話,最強のモフモフ,P"
translation = "제3화, 최강의 몽실몽실, P"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「会長、いらっしゃいませ♪」"
translation = "「회장님, 어서 오세요♪」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「おや、主様もこちらに？\u3000奇遇でござるな。今日の日替わりケーキはレモンタルトでござるよ」"
translation = "「어라, 주군님도 여기에? 기우로구먼. 오늘의 추천 케이크는 레몬 타르트라오」"

[[dialogue]]
speaker = "unk"
original = "息抜きにカフェテリアに寄ると、ヨミが出迎えてくれた。"
translation = "휴식을 취하러 카페테리아에 들르니, 요미가 마중해 주었다."

[[dialogue]]
speaker = "unk"
original = "せつなもここでお茶をしていたようだ。"
translation = "세츠나도 여기서 차를 마시고 있었던 모양이다."

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「ふむ。ここが学園のカフェテリアか。面白みのある場所ではなさそうだな」"
translation = "「흠. 여기가 학원의 카페테리아인가. 재미가 있을 만한 장소는 아닌 것 같군」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「こ、こ、煌嶺さん！？」"
translation = "「코, 코, 코우레이 님!?」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「なぜ驚く？\u3000妾は学園の理事だ。学園の施設を見に来て何が悪い？」"
translation = "「어째서 놀라지? 짐은 학원의 이사다. 학원의 시설을 보러 온 것이 무엇이 나쁘단 말이냐?」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「それはそうでござるが……」"
translation = "「그건 그렇소이다만……」"

[[dialogue]]
speaker = "unk"
original = "そういえば……"
translation = "그러고 보니……"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「む？」"
translation = "「음?」"

[[dialogue]]
speaker = "unk"
original = "せつなの師匠であるシズルさんも、九尾の狐の魔族だった。"
translation = "세츠나의 스승인 시즈루 님도, 구미호 마족이었다."

[[dialogue]]
speaker = "unk"
original = "九尾の狐は大変稀少な存在と聞くが、シズルさんと何か関係があるのだろうか？"
translation = "구미호는 매우 희귀한 존재라고 들었는데, 시즈루 님과 무슨 관계가 있는 것일까?"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「忍びの里にも九尾の狐の魔族がいる……？\u3000知らぬな。妾とは関係ない。キュリオスの皇帝に嫁いだ初代煌嶺が、九尾の魔族だっただけのこと」"
translation = "「닌자 마을에도 구미호 마족이 있다……? 모르겠군. 짐과는 관계없다. 큐리오스의 황제에게 시집온 초대 코우레이가, 구미호 마족이었을 뿐인 일」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「九尾がいくら稀少な存在だからといって、それだけで結び付けられては迷惑というものだ」"
translation = "「구미호가 아무리 희귀한 존재라고 해도, 그것만으로 연관 짓는다면 곤란하다」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「本当にただの偶然でござったか」"
translation = "「정말 그냥 우연이었소이까」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「しかし九尾の魔族は長寿でござる。師匠は見かけによらずものすごく長生きでござるが、煌嶺殿もそうなのでござるか？」"
translation = "「하지만 구미호 마족은 장수하오. 스승님은 보기와 달리 엄청나게 오래 사셨소이다만, 코우레이 전하도 그러하오?」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「無礼な猫娘だな。妾の齢は貴様らとそう変わらん。妾がその師匠とやらのように歳を重ねていると、そう想像しているのなら……処すぞ？」"
translation = "「무례한 고양이 양이로군. 짐의 나이는 네놈들과 그리 다르지 않다. 짐이 그 스승인가 하는 자처럼 나이를 먹었을 것이라 그리 상상하고 있다면…… 처벌하겠다?」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ひぃぃっ！？\u3000ごめんなさいでござるーっ！！」"
translation = "「히익!? 죄송하옵니다──!!」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「だが長く生きた九尾だろうと、妾には遠く及ばぬ。なぜなら──」"
translation = "「하지만 오래 산 구미호라 해도, 짐에게는 미치지 못한다. 왜냐하면──」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「妾の尻尾こそ至高だからだ！！」"
translation = "「짐의 꼬리야말로 최고이기 때문이다!!」"

[[dialogue]]
speaker = "unk"
original = "そこ！？"
translation = "거기!?"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「確かに師匠は小柄な分、毛量では負けるでござるな……。尻尾が本体かと思うほどの大ボリュームでござる」"
translation = "「확실히 스승님은 아담한 만큼, 털 양으로는 질 것 같소이다만……. 꼬리가 본체인가 싶을 정도의 대볼륨이오」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「妾は気前が良い。今ならこの尻尾、モフらせてやってもよいぞ、魔王？」"
translation = "「짐은 인심이 좋다. 지금이라면 이 꼬리, 쓰다듬게 해주어도 좋다만, 마왕?」"

[[dialogue]]
speaker = "unk"
original = "なんだって……！？"
translation = "뭐라고……!?"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「たとえ尾の１本で比較しても、そこな狐娘よりも上。それが九尾だぞ」"
translation = "「비록 꼬리 1개로 비교한다 해도, 거기 있는 여우 양보다 위. 그것이 구미호다」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「むむ……別に張り合うつもりはないですけど、なんか悔しいです……」"
translation = "「으으…… 딱히 겨룰 생각은 없습니다만, 어쩐지 억울하네요……」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「ほれ、どうする？\u3000妾がモフらせてやると言っているのだ、躊躇する理由がどこにある？」"
translation = "「자, 어찌할 테냐? 짐이 쓰다듬게 해주겠다고 말하고 있다, 주저할 이유가 어디에 있지?」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「柔らかくて温い、ふさふさの尻尾が９本」"
translation = "「부드럽고 따뜻한, 풍성한 꼬리가 9개」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「当然手入れも欠かさぬ。妾のために用意させた特別な油を使っている。そんじょそこらの獣人系魔族とは毛並みが違うぞ」"
translation = "「당연히 손질도 빠뜨리지 않는다. 짐을 위해 준비하게 한 특별한 오일을 사용하고 있지. 흔해 빠진 수인계 마족과는 털결이 다르다」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「この九尾の極上のモフモフに包まれたいと思わんのか？\u3000んん？\u3000ん～？」"
translation = "「이 구미호의 극상의 몽실몽실함에 파묻히고 싶지 않은가? 응? 음~?」"

[[dialogue]]
speaker = "unk"
original = "くっ……誘惑に抗えない……！"
translation = "큭…… 유혹에 거역할 수 없어……!"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「ふふ……どうだ、妾の尾は？\u3000極上の九尾に包まれた心地は？」"
translation = "「후후…… 어떠냐, 짐의 꼬리는? 극상의 구미호에 파묻힌 기분은?」"

[[dialogue]]
speaker = "unk"
original = "モフモフに包まれて……昇天しそう……"
translation = "몽실몽실함에 파묻혀서…… 승천할 것 같아……"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ああ！？\u3000主様の顔がすっかり蕩けているでござる！？」"
translation = "「아아!? 주군님의 얼굴이 완전히 황홀해져 있소이다!?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「正気を保ってください！\u3000相手はあの大欲の女帝ですよ！」"
translation = "「정신 차리세요! 상대는 그 대욕의 여제라고요!」"

[[dialogue]]
speaker = "unk"
original = "煌嶺の尻尾に埋もれながら、もっとモフモフを味わいたくて、もがくように手を動かすと──"
translation = "코우레이의 꼬리에 파묻히면서, 좀 더 몽실몽실함을 맛보고 싶어서, 발버둥 치듯 손을 움직이자──"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「ひあぁんっ！？\u3000もう、くすぐったいってば～」"
translation = "「히아앙!? 정말, 간지럽다니까~」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「なんかかわいい声が出たでござる！？」"
translation = "「어쩐지 귀여운 목소리가 나왔소이다!?」"

[[dialogue]]
speaker = "unk"
original = "そっちの姿でその声出せるんだ……"
translation = "그 모습으로 그런 목소리를 낼 수 있구나……"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「そりゃ出せるよ。気分でやってるだけだし」"
translation = "「그야 낼 수 있지. 기분 내켜서 하는 것뿐이고」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「あんっ<emoji=heart04>\u3000んんっ<emoji=heart04>\u3000はあぁん<emoji=heart04>\u3000魔王さんってば、触り方がエッチだよ～」"
translation = "「앙<emoji=heart04> 응<emoji=heart04> 하앙<emoji=heart04> 마왕님도 참, 만지는 방식이 야해~」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「ふふ、魔王さん、私の尻尾に夢中になってかわいいな～。リーエンちゃんも私の尻尾好きだけど、魔王さんも気に入ったみたいだね♪」"
translation = "「후후, 마왕님, 내 꼬리에 푹 빠져서 귀엽네~. 리엔짱도 내 꼬리 좋아하지만, 마왕님도 마음에 든 모양이네♪」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「主様が女帝の虜になったでござる……」"
translation = "「주군님이 여제의 포로가 되어버렸소이다……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ですね……すっかりメロメロです……」"
translation = "「그러게요…… 완전히 푹 빠졌어요……」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「あなたたち羨ましいの？\u3000私の尻尾は９本あるからまだ余裕あるし、２人もモフモフさせてあげるね♪」"
translation = "「너희들 부러워? 내 꼬리는 9개나 있으니까 아직 여유 있고, 둘도 몽실몽실하게 해줄게♪」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ええっ！？\u3000そんなこと言ってませ──ひゃあっ！？」"
translation = "「에엣!? 그런 말 안 했──히얏!?」"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ちょ、ちょっと待つでござ──あぁ～っ！？」"
translation = "「잠, 잠시만 기다리시오──아아~!?」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「ヨミー、せつな、いるー？」"
translation = "「요미~, 세츠나, 있어~?」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「──って、何？\u3000あの毛の塊」"
translation = "「──라니, 뭐야? 저 털 뭉치는」"

[[dialogue]]
speaker = "unk"
original = "モフモフに癒される～……"
translation = "몽실몽실함에 힐링된다~……"

[[dialogue]]
speaker_original = "せつな"
speaker_translation = "세츠나"
original = "「ふわふわでござる～……」"
translation = "「푹신푹신하오~……」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ダメになっちゃいます～……」"
translation = "「망가져 버려요~……」"

[[dialogue]]
speaker_original = "煌嶺"
speaker_translation = "코레이"
original = "「あなたもこっち来る？\u3000モフモフさせてあげるよ？」"
translation = "「너도 이쪽으로 올래? 몽실몽실하게 해줄게?」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「いや、ダメになりたくないんで遠慮しときます」"
translation = "「아니, 망가지고 싶지 않으니까 사양할게」"

[[dialogue]]
speaker_original = "美鶴"
speaker_translation = "미츠루"
original = "「やれやれ……３人して何やってんだか」"
translation = "「이런 이런…… 셋이서 뭐 하는 건지」"

