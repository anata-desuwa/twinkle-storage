[[dialogue]]
speaker = "unk"
original = "第１話,路上での出会い,P"
translation = "제1화, 길에서의 만남, P"

[[dialogue]]
speaker = "unk"
original = "<ruby>『ＸＥＬＯＳ』<rt>ゼロス</rt></ruby>との決戦の後、世界はようやく平和を取り戻した。"
translation = "<ruby>『XELOS』<rt>제기</rt></ruby>와의 결전 후, 세계는 겨우 평화를 되찾았다."

[[dialogue]]
speaker = "unk"
original = "忙しい日々が続いていた俺と環にもようやく余裕が生まれ、今までの時間を取り戻そうとするかのようにデートを重ねていた。"
translation = "바쁜 나날이 계속되고 있던 나와 락샤에게도 겨우 여유가 생겨, 지금까지의 시간을 되찾으려는 듯 데이트를 거듭하고 있었다."

[[dialogue]]
speaker = "unk"
original = "その日の俺たちは特に決まった予定もなく、ただぶらぶらと歩いていただけだったのだが……"
translation = "그날의 우리들은 딱히 정해진 예정도 없이, 그저 빈둥빈둥 걷고 있을 뿐이었지만……"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あれ？\u3000人だかりが出来てるけど、何やってるんだろ？」"
translation = "「어라? 인파가 몰려 있는데, 뭐 하고 있는 거지?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あー、路上ライブだ。こんだけ人が集まってるってことは上手いのかな？\u3000ちょっと聞いていかない？」"
translation = "「아-, 거리 라이브다. 이만큼 사람이 모여 있다는 건 잘하는 걸까? 잠깐 들렀다 갈래?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「へぇ～、なんかパッと見た感じふつーな感じの女の子だけど、あの子が弾くんだね……」"
translation = "「헤~, 왠지 얼핏 보기엔 평범한 느낌의 여자아이인데, 저 아이가 연주하는 거네……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「エレキギターの音とか聞くと、２人で働いてたライブハウスの事とか思い出しちゃわない？」"
translation = "「일렉 기타 소리 같은 걸 들으면, 둘이서 일했던 라이브 하우스 일 같은 거 떠올라 버리지 않아?」"

[[dialogue]]
speaker = "unk"
original = "あとフェスね、フェス！"
translation = "그리고 페스 말이지, 페스!"

[[dialogue]]
speaker = "unk"
original = "すごく思い出してたよ"
translation = "엄청 떠올리고 있었어"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだね！\u3000数あるバイトの中でもかなり大変なヤツだったけど、すごく面白かったバイトでもあるな～」"
translation = "「그렇네! 수많은 알바 중에서도 엄청 힘들었던 녀석이었지만, 굉장히 재미있었던 알바이기도 하네~」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、何だか懐かしくなってきたよ。また一緒にバイトするのも面白いかもね♪」"
translation = "「아하하, 왠지 그리워졌어. 다시 함께 알바하는 것도 재미있을지도♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、始まるみたい。ふふっ、ワクワクしてきたよー」"
translation = "「아, 시작하려나 봐. 후후, 설레기 시작했어-」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「っ……！\u3000うわ……上手っ……！\u3000すっごい速弾き……！！」"
translation = "「씃……! 우와…… 잘해……! 엄청난 속주……!!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それに演奏に没頭しちゃってる感じが、超カッコいいよね……弾き始める前とはまるで別人みたい……」"
translation = "「게다가 연주에 몰두해 버린 느낌이, 너무 멋지지…… 치기 시작하기 전과는 마치 딴사람 같아……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ギターのことはよく分からないんだけど、これ、多分すごいんだよね？」"
translation = "「기타에 대해서는 잘 모르겠는데, 이거, 아마 대단한 거지?」"

[[dialogue]]
speaker = "unk"
original = "プロなのかな？"
translation = "프로인 걸까?"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「プロの人って路上ライブとかやるの？\u3000でも、そうだって言われても驚かないよ」"
translation = "「프로인 사람이 거리 라이브 같은 걸 하나? 하지만, 그렇다고 들어도 놀라지 않을 거야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ライブハウスでバイトしてた時もいろんなギターを聞いてきたけど、こんなにビビッと来たこと無かったかも」"
translation = "「라이브 하우스에서 알바했을 때도 여러 기타를 들어왔지만, 이렇게 찌릿하고 온 적은 없었을지도」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「カッコいいなぁ……ギターが弾けるって、こんなにカッコ良かったんだ……」"
translation = "「멋지다…… 기타를 칠 수 있다는 건, 이렇게나 멋진 거였구나……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「時間を忘れて最後まで聞き入っちゃってたね」"
translation = "「시간을 잊고 끝까지 넋을 잃고 들어버렸네」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うーん……でも欲を言えば、まだまだもっと聞いてたかったよ」"
translation = "「으음…… 하지만 욕심을 내자면, 아직 더욱더 듣고 싶었어」"

[[dialogue]]
speaker = "unk"
original = "もっと聞いてく？"
translation = "더 듣고 갈래?"

[[dialogue]]
speaker = "unk"
original = "時間が大丈夫なら"
translation = "시간이 괜찮다면"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「えっ？\u3000あ、そうか！\u3000あるよね、いっぱい聞けるところ！」"
translation = "「에? 아, 그렇구나! 있지, 가득 들을 수 있는 곳!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「店長さんにも久しぶりに挨拶したいし、行こう行こう♪」"
translation = "「점장님한테도 오랜만에 인사하고 싶고, 가자 가자♪」"

[[dialogue]]
speaker = "unk"
original = "俺と環は場所を移動して、昔、一緒に働いていたライブハウスにやってきていた。"
translation = "나와 락샤는 장소를 이동해서, 예전에, 함께 일했던 라이브 하우스에 찾아와 있었다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「お客さんとしてくると、また違った感じがするね～」"
translation = "「손님으로서 오니까, 또 다른 느낌이 드네~」"

[[dialogue]]
speaker = "unk"
original = "少し緊張気味に地下に続く階段を降りていき、重たい扉を押して中に入る。"
translation = "조금 긴장한 기색으로 지하로 이어지는 계단을 내려가, 무거운 문을 밀고 안으로 들어간다."

[[dialogue]]
speaker_original = "店長"
speaker_translation = "店長"
original = "「いらっしゃい──って、あら？\u3000環ちゃんじゃんか」"
translation = "「어서 오── 란, 어라? 락샤잖아」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、ご無沙汰♪\u3000今日はお客さんとして来たよ♪」"
translation = "「아하하, 오랜만이야♪ 오늘은 손님으로 왔어♪」"

[[dialogue]]
speaker = "unk"
original = "２人でお願いします"
translation = "둘이서 부탁드립니다"

[[dialogue]]
speaker_original = "店長"
speaker_translation = "店長"
original = "「あいよ。何だぁ？\u3000２人でデートかぁ？」"
translation = "「오냐. 뭐야? 둘이서 데이트냐?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん、そんな感じ」"
translation = "「응, 그런 느낌」"

[[dialogue]]
speaker_original = "店長"
speaker_translation = "店長"
original = "「やっぱ付き合ってたんじゃねーかよ」"
translation = "「역시 사귀고 있던 거 아니었냐고」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「バイトしてた時は違うよ。その後学校で再会して、それから付き合うようになったんだから」"
translation = "「알바했을 때는 아니야. 그 후 학교에서 재회해서, 그러고 나서 사귀게 된 거니까」"

[[dialogue]]
speaker_original = "店長"
speaker_translation = "店長"
original = "「へぇ～、運命だねぇ～。ま、ゆっくり楽しんで行きなよ」"
translation = "「헤~, 운명이네~. 뭐, 천천히 즐기다 가라구」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん、ありがと！」"
translation = "「응, 고마워!」"

[[dialogue]]
speaker = "unk"
original = "このライブハウスは最大収容人数が２００人ほどの小さなハコだ。"
translation = "이 라이브 하우스는 최대 수용 인원이 200명 정도 되는 작은 공연장이다."

[[dialogue]]
speaker = "unk"
original = "けれど知名度はそこそこにあるようで、今日も大勢の客が入っている。"
translation = "하지만 인지도는 그럭저럭 있는 모양이라, 오늘도 많은 손님이 들어차 있다."

[[dialogue]]
speaker = "unk"
original = "俺たちは後ろの方に陣取って、ライブを楽しむことにした。"
translation = "우리들은 뒤쪽에 자리를 잡고, 라이브를 즐기기로 했다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「盛り上がってるねー。最前列の人たちとか、曲に合わせて飛び跳ねてて楽しそうだよ」"
translation = "「신났네-. 맨 앞줄 사람들 같은 건, 노래에 맞춰 뛰놀아서 즐거워 보여」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「バイトしながら眺めてた風景だけど、興味を持ってみると結構違う風に感じられるんだね」"
translation = "「알바하면서 바라보던 풍경이지만, 흥미를 가지고 보니까 제법 다르게 느껴지는구나」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ギターソロもカッコイイと思ったけど、バンドを組んで演奏するのも迫力があっていいなぁ」"
translation = "「기타 솔로도 멋지다고 생각했지만, 밴드를 결성해서 연주하는 것도 박력 있어서 좋네」"

[[dialogue]]
speaker = "unk"
original = "自分でもやってみたくなった？"
translation = "직접 해보고 싶어졌어?"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、それは考えてもみなかったよ」"
translation = "「아하하, 그건 생각지도 못했어」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「さすがに無理じゃないかな～。ボク、楽器とかやったことないし。会長はどうなの？」"
translation = "「역시 무리이지 않을까~. 나, 악기 같은 거 해본 적 없고. 회장님은 어때?」"

[[dialogue]]
speaker = "unk"
original = "そんな余裕も無かったし"
translation = "그런 여유도 없었고"

[[dialogue]]
speaker = "unk"
original = "俺もないな"
translation = "나도 없어"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだよね～。でも、世界も平和になったことだし、それこそ何か始めてみてもいいかもねー」"
translation = "「그렇지~. 하지만, 세계도 평화로워졌고,이야말로 무언가 시작해 봐도 좋을지도 모르겠네-」"

[[dialogue]]
speaker = "unk"
original = "そんな話をしながら、俺と環は久しぶりのライブハウスで音楽を堪能したのだった。"
translation = "그런 이야기를 하면서, 나와 락샤는 오랜만의 라이브 하우스에서 음악을 만끽한 것이었다."

