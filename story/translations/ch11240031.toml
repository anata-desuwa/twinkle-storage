[[dialogue]]
speaker = "unk"
original = "第１話,路上での出会い,P"
translation = "제1화, 길거리에서의 만남, P"

[[dialogue]]
speaker = "unk"
original = "<ruby>『ＸＥＬＯＳ』<rt>ゼロス</rt></ruby>との決戦の後、世界はようやく平和を取り戻した。"
translation = "<ruby>『XELOS』<rt>제기</rt></ruby>와의 결전 후, 세계는 겨우 평화를 되찾았다."

[[dialogue]]
speaker = "unk"
original = "忙しい日々が続いていた俺と環にもようやく余裕が生まれ、今までの時間を取り戻そうとするかのようにデートを重ねていた。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "その日の俺たちは特に決まった予定もなく、ただぶらぶらと歩いていただけだったのだが……"
translation = "그날의 우리는 딱히 정해진 일정 없이 그저 느긋하게 걷고 있을 뿐이었지만……"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あれ？\u3000人だかりが出来てるけど、何やってるんだろ？」"
translation = "「어라? 사람이 많이 모여 있는데, 뭘 하고 있는 거지?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あー、路上ライブだ。こんだけ人が集まってるってことは上手いのかな？\u3000ちょっと聞いていかない？」"
translation = "「아ー, 길거리 라이브다. 이렇게 사람이 모여 있다는 건 잘하는 걸까? 잠깐 듣고 가지 않을래?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「へぇ～、なんかパッと見た感じふつーな感じの女の子だけど、あの子が弾くんだね……」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「エレキギターの音とか聞くと、２人で働いてたライブハウスの事とか思い出しちゃわない？」"
translation = "「일렉 기타 소리를 들으면 둘이서 일했던 라이브 하우스 일이 떠오르지 않아?」"

[[dialogue]]
speaker = "unk"
original = "あとフェスね、フェス！"
translation = "그리고 페스티벌도 말이지, 페스티벌!"

[[dialogue]]
speaker = "unk"
original = "すごく思い出してたよ"
translation = "엄청 떠올리고 있었어"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだね！\u3000数あるバイトの中でもかなり大変なヤツだったけど、すごく面白かったバイトでもあるな～」"
translation = "「맞아! 수많은 알바 중에서도 bastante 힘든 일이었지만, 엄청 재미있었던 알바이기도 했지～」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、何だか懐かしくなってきたよ。また一緒にバイトするのも面白いかもね♪」"
translation = "「아하하, 왠지 그리워졌어. 다시 같이 알바하는 것도 재미있을지도♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、始まるみたい。ふふっ、ワクワクしてきたよー」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「っ……！\u3000うわ……上手っ……！\u3000すっごい速弾き……！！」"
translation = "「씃……! 우와…… 잘한다……! 엄청난 속주……!!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それに演奏に没頭しちゃってる感じが、超カッコいいよね……弾き始める前とはまるで別人みたい……」"
translation = "「게다가 연주에 몰두해 있는 느낌이 너무 멋지네…… 연주하기 전과는 마치 다른 사람 같아……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ギターのことはよく分からないんだけど、これ、多分すごいんだよね？」"
translation = "「기타는 잘 모르겠지만, 이거 아마 대단한 거겠지?」"

[[dialogue]]
speaker = "unk"
original = "プロなのかな？"
translation = "프로인 걸까?"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「プロの人って路上ライブとかやるの？\u3000でも、そうだって言われても驚かないよ」"
translation = "「프로인 사람이 길거리 라이브 같은 걸 하나? 하지만 그렇다고 해도 놀라지 않을 거야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ライブハウスでバイトしてた時もいろんなギターを聞いてきたけど、こんなにビビッと来たこと無かったかも」"
translation = "「라이브 하우스에서 알바할 때도 여러 기타를 들어봤지만, 이렇게 전율이 온 적은 없었을지도」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「カッコいいなぁ……ギターが弾けるって、こんなにカッコ良かったんだ……」"
translation = "「멋지다…… 기타를 칠 수 있다는 건 이렇게나 멋진 거였구나……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「時間を忘れて最後まで聞き入っちゃってたね」"
translation = "「시간을 잊고 끝까지 넋을 놓고 듣고 있었네」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うーん……でも欲を言えば、まだまだもっと聞いてたかったよ」"
translation = "「으음…… 하지만 욕심을 내자면 아직 더 듣고 싶었어」"

[[dialogue]]
speaker = "unk"
original = "もっと聞いてく？"
translation = "더 듣고 갈래?"

[[dialogue]]
speaker = "unk"
original = "時間が大丈夫なら"
translation = "시간이 괜찮다면"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「えっ？\u3000あ、そうか！\u3000あるよね、いっぱい聞けるところ！」"
translation = "「엣? 아, 그렇구나! 있지, 많이 들을 수 있는 곳!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「店長さんにも久しぶりに挨拶したいし、行こう行こう♪」"
translation = "「점장님께도 오랜만에 인사드리고 싶고, 가자 가자♪」"

[[dialogue]]
speaker = "unk"
original = "俺と環は場所を移動して、昔、一緒に働いていたライブハウスにやってきていた。"
translation = "나와 타마키는 장소를 이동하여 예전에 함께 일했던 라이브 하우스로 찾아왔다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「お客さんとしてくると、また違った感じがするね～」"
translation = "「손님으로 오니까 또 다른 느낌이 드네～」"

[[dialogue]]
speaker = "unk"
original = "少し緊張気味に地下に続く階段を降りていき、重たい扉を押して中に入る。"
translation = "조금 긴장한 채 지하로 이어지는 계단을 내려가, 무거운 문을 밀고 안으로 들어간다."

[[dialogue]]
speaker_original = "店長"
speaker_translation = "店長"
original = "「いらっしゃい──って、あら？\u3000環ちゃんじゃんか」"
translation = "「어서 오세요── 어라? 타마키 양이잖아」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、ご無沙汰♪\u3000今日はお客さんとして来たよ♪」"
translation = "「아하하, 오랜만이에요♪ 오늘은 손님으로 왔어요♪」"

[[dialogue]]
speaker = "unk"
original = "２人でお願いします"
translation = "둘이서 부탁드립니다"

[[dialogue]]
speaker_original = "店長"
speaker_translation = "店長"
original = "「あいよ。何だぁ？\u3000２人でデートかぁ？」"
translation = "「오냐. 뭐야? 둘이서 데이트냐?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん、そんな感じ」"
translation = "「응, 그런 느낌」"

[[dialogue]]
speaker_original = "店長"
speaker_translation = "店長"
original = "「やっぱ付き合ってたんじゃねーかよ」"
translation = "「역시 사귀고 있던 거였잖아」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「バイトしてた時は違うよ。その後学校で再会して、それから付き合うようになったんだから」"
translation = "「알바할 때는 아니었어요. 그 후에 학교에서 재회해서, 그러고 나서 사귀게 된 거니까요」"

[[dialogue]]
speaker_original = "店長"
speaker_translation = "店長"
original = "「へぇ～、運命だねぇ～。ま、ゆっくり楽しんで行きなよ」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん、ありがと！」"
translation = "「응, 고마워!」"

[[dialogue]]
speaker = "unk"
original = "このライブハウスは最大収容人数が２００人ほどの小さなハコだ。"
translation = "이 라이브 하우스는 최대 수용 인원이 200명 정도 되는 작은 공연장이다."

[[dialogue]]
speaker = "unk"
original = "けれど知名度はそこそこにあるようで、今日も大勢の客が入っている。"
translation = "하지만 인지도는 제법 있는 편인 듯, 오늘도 많은 손님이 들어차 있다."

[[dialogue]]
speaker = "unk"
original = "俺たちは後ろの方に陣取って、ライブを楽しむことにした。"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「盛り上がってるねー。最前列の人たちとか、曲に合わせて飛び跳ねてて楽しそうだよ」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「バイトしながら眺めてた風景だけど、興味を持ってみると結構違う風に感じられるんだね」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ギターソロもカッコイイと思ったけど、バンドを組んで演奏するのも迫力があっていいなぁ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "自分でもやってみたくなった？"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、それは考えてもみなかったよ」"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「さすがに無理じゃないかな～。ボク、楽器とかやったことないし。会長はどうなの？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そんな余裕も無かったし"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺もないな"
translation = ""

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだよね～。でも、世界も平和になったことだし、それこそ何か始めてみてもいいかもねー」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そんな話をしながら、俺と環は久しぶりのライブハウスで音楽を堪能したのだった。"
translation = ""

