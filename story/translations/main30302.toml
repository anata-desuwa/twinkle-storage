[[dialogue]]
speaker = "unk"
original = "第２話,『自由気ママ』,B"
translation = "제3화, 『자유기엄마』, B"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「にしてもセッシー！\u3000その衣装、抜群に似合ってるじゃん！\u3000可愛いし、タダ者じゃない感もムンムンだぜ☆」"
translation = "「그나저나 세시! 그 의상, 끝내주게 잘 어울리잖아! 귀엽기도 하고, 보통내기가 아닌 느낌도 물씬 난다구☆」"

[[dialogue]]
speaker = "unk"
original = "紅明の言う通り、セシアの身にまとっている衣装は、普段の彼女のものとは少し違っていた。"
translation = "코메이의 말대로, 세시아가 입고 있는 의상은, 평소의 그녀의 것과는 조금 달랐다."

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ええ。これはルヴィネさまとの契約によって再び芽吹いた力なの」"
translation = "「네. 이것은 루비네 님과의 계약에 의해 다시 싹튼 힘이에요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「契約っていうと、前にセッシーが話してくれてたアレか～」"
translation = "「계약이라 하면, 전에 세시가 말해줬던 그거인가~」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「新しい女神であるルヴィっちと契約することで、女神と守護天使の間の繋がりが強くなり、新たな力に目覚めることがある、って」"
translation = "「새로운 여신인 루비치와 계약함으로써, 여신과 수호천사 사이의 연결이 강해져서, 새로운 힘에 눈뜨는 경우가 있다, 라고」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「じゃあもしかして、この姿がセッシーが転生する前の……？」"
translation = "「그럼 혹시, 이 모습이 세시가 전생하기 전의……?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そうよ。新たな契約によって、わたくしの前身──《万成》のアウクセシアが持っていた力の一部が蘇ったわ」"
translation = "「맞아요. 새로운 계약에 의해, 저의 전신── 《만성》의 아욱세시아가 가졌던 힘의 일부가 되살아났어요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そして、わたくしのこの衣装も、その力の影響を強く受けているの」"
translation = "「그리고, 저의 이 의상도, 그 힘의 영향을 강하게 받고 있어요」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「オオヒメにラクシャ、２人の時はあまり上手く行った手応えがなかったのだけれど……３人目にしてようやく、ってところかしら」"
translation = "「오오히메와 락샤, 두 사람 때는 그다지 잘 된 손응답이 없었지만…… 세 번째에 와서야 겨우, 라는 느낌일까」"

[[dialogue]]
speaker = "unk"
original = "守護天使とルヴィネの契約。"
translation = "수호천사와 루비네의 계약."

[[dialogue]]
speaker = "unk"
original = "それはルヴィネが、先代女神であるテルルから譲り受けた守護天使たちと、互いの関係をより強固にするためのものであった。"
translation = "그것은 루비네가, 선대 여신인 텔루르에게 물려받은 수호천사들과, 서로의 관계를 더욱 견고히 하기 위한 것이었다."

[[dialogue]]
speaker = "unk"
original = "既に、オオヒメとラクシャは契約が完了している。しかし──"
translation = "이미, 오오히메와 락샤는 계약이 완료되어 있다. 그러나──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「新しい契約によって世界の摂理に影響が出なかったことは、以前の２人から報告を受けているわ」"
translation = "「새로운 계약으로 인해 세계의 섭리에 영향이 가지 않았다는 것은, 이전의 두 사람에게 보고받았어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「けれど、契約後に起きる外見の変化についてはその限りではない。いいのかしら、あなたの姿もどのように変化してしまうか分からないのだけれど……」"
translation = "「하지만, 계약 후에 일어나는 외형의 변화에 대해서는 장담할 수 없어. 괜찮겠어, 당신의 모습도 어떻게 변화해 버릴지 모르는데……」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「摂理に影響が出ないならば問題ないわ。契約後の姿についても、むしろ楽しみなほどよ」"
translation = "「섭리에 영향이 가지 않는다면 문제없어요. 계약 후의 모습에 대해서도, 오히려 기대될 정도예요」"

[[dialogue]]
speaker_original = "セシア"
speaker_translation = "세시아"
original = "「わたくしは大丈夫。だから、さあルヴィネさま、契約を結び直しましょう」"
translation = "「저는 괜찮아요. 그러니, 자 루비네 님, 계약을 다시 맺도록 해요」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ええ、分かったわ……セシア」"
translation = "「그래, 알았어…… 세시아」"

[[dialogue]]
speaker = "unk"
original = "少し不安げな様子を残しながら、ルヴィネはセシアの前に手をかざした。"
translation = "조금 불안한 기색을 남긴 채, 루비네는 세시아의 앞에 손을 내밀었다."

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ルヴィネさまと新しい契約を結ぶことで、わたくしの奥底に『蓄積』されていたものが昇華されて、この姿が引き出されたようね」"
translation = "「루비네 님과 새로운 계약을 맺음으로써, 저의 깊은 곳에 『축적』되어 있던 것이 승화되어, 이 모습이 끌어내진 것 같네요」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「欲を言えば、完全に元のアウクセシアの姿に戻してあげられれば良かったのだけれど……」"
translation = "「욕심을 내자면, 완전히 원래의 아욱세시아의 모습으로 돌려줄 수 있었다면 좋았겠지만……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ルヴィネさまが気に病む必要はないわ。今のわたくしは、１度転生を果たした身であるし……」"
translation = "「루비네 님이 마음 쓸 필요는 없어요. 지금의 저는, 한 번 전생을 완수한 몸이기도 하고……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「大切なことは姿かたちではないわ。その者の『個』を形作る、魂の煌き──ママへの愛の波動さえ忘れなければ、わたくしは十分だもの」"
translation = "「중요한 것은 생김새가 아니에요. 그 사람의 『개성』을 형성하는, 영혼의 반짝임── 엄마를 향한 사랑의 파동만 잊지 않는다면, 저는 충분한걸요」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そ、そんなものなのかしら……？」"
translation = "「그, 그런 것일까……?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「アタシ的には大きくなったセッシーの姿も見てみたいけど、でもやっぱり小さい方がセッシーって感じがしてしっくりくるぜ！」"
translation = "「나로서는 커진 세시의 모습도 보고 싶지만, 역시 작은 쪽이 세시라는 느낌이 들어서 착 가라앉는다구!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「紅明ママーーーーっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「코메이 엄마──────<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ええっと紅明……もしかしてあなたもセシアのママ？\u3000なのかしら？？」"
translation = "「어 그러니까 코메이…… 혹시 당신도 세시아의 엄마? 인 것일까??」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「うっしっし♪\u3000まあ、そんなトコロっしょ☆」"
translation = "「우씨씨♪ 뭐, 그런 셈이지☆」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ルヴィネさま、紅明ママはただのママじゃないわ。紅明ママは最高のママの１人なの～<emoji=heart04>」"
translation = "「루비네 님, 코메이 엄마는 그냥 엄마가 아니에요. 코메이 엄마는 최고의 엄마 중 한 명이에요~<emoji=heart04>」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そ、そう……」"
translation = "「그, 그래……」"

[[dialogue]]
speaker = "unk"
original = "と、そんな話をしていると星徒会室のドアがノックされた。"
translation = "라며, 그런 이야기를 나누고 있자 성도회실의 문이 노크되었다."

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「失礼しますね、会長さん」"
translation = "「실례하겠습니다, 회장님」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「……！！？」"
translation = "「……!!?」"

[[dialogue]]
speaker = "unk"
original = "入ってきたのは新星学園の学園長である十六夜シノだった。"
translation = "들어온 것은 신세이 학원의 학원장인 이자요이 시노였다."

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「もしかして、お待たせしてしまいましたか？」"
translation = "「혹시, 기다리게 해버렸나요?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「いいえ、ちょうど先ほど魔王との話が終わったところよ」"
translation = "「아니, 마침 방금 마왕과의 이야기가 끝난 참이야」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「ふふ、どうやら良いタイミングだったようですね」"
translation = "「후후, 아무래도 타이밍이 좋았던 모양이네요」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「聖庭園からの使節団の方々は既に会議室の方へお通ししています。さっそくですがご案内しますね」"
translation = "「성정원에서 온 사절단 분들은 이미 회의실 쪽으로 안내해 두었습니다. 곧바로 안내해 드릴게요」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「お願いするわ」"
translation = "「부탁할게」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「それから、紅明さんもルヴィネさんの会談に同行されていると聞いていますが……」"
translation = "「그리고, 코메이 씨도 루비네 씨의 회담에 동행하고 있다고 들었습니다만……」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「お話の内容はわからないんで、会談自体には参加しないんですが、道案内とヒトの手配を任されてます☆」"
translation = "「이야기 내용은 모르니까, 회담 자체에는 참석하지 않지만, 길 안내랑 사람 수배를 맡았거든요☆」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「ありがとうございます。顔の広い紅明さんの協力、とても心強いです」"
translation = "「감사합니다. 발이 넓은 코메이 씨의 협력, 정말 든든하네요」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「アタシに任しといてください、シノ学園長☆\u3000アタシの元気とコネクション、ルヴィっちにばっちり共有しちまうぜ！！」"
translation = "「나한테 맡겨 두세요, 시노 학원장님☆ 나의 에너지와 커넥션, 루비치한테 확실하게 공유해 버릴 테니까!!」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「ふふ、確かに紅明さんのエネルギーはどんな時でも役に立ってしまうでしょうね」"
translation = "「후후, 확실히 코메이 씨의 에너지는 어떤 때라도 도움이 되겠네요」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「それと……あら。あなたは確か、守護天使の──」"
translation = "「그리고…… 어머. 당신은 분명, 수호천사의──」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「──ママ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「──엄마~~~~<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「はい！？」"
translation = "「네!?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「わ～！\u3000おだやかな表情、安心感を与える話し方……とってもそそられるママみよ～！」"
translation = "「와~! 온화한 표정, 안심감을 주는 말투…… 너무나 훔쳐보고 싶어지는 엄마미예요~!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「それにその、飛び込んでこいとばかりに膨らんだ大きなお胸……まさしくセシアの求めるママだわ～！」"
translation = "「게다가 그, 뛰어들라는 듯이 부풀어 오른 큰 가슴…… 그야말로 세시아가 바라는 엄마예요~!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「お願いママ～♪\u3000セシアのこと抱っこして～！\u3000それでいっぱい、よしよしして～っ<emoji=heart04>」"
translation = "「부탁이에요 엄마~♪ 세시아를 안아주세요~! 그리고 많이많이, 쓰다듬어 주세요~<emoji=heart04>」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "（こ、これはどういうことでしょう……私が、ママ？？）"
translation = "（이, 이건 무슨 일일까요…… 내가, 엄마??）"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "（けれど、こんなに純真な目で私のことをママと呼んで……もしかしてセシアさんは私に甘えたい、ということなのでしょうか？）"
translation = "（하지만, 이렇게 순진한 눈으로 나를 엄마라고 부르고…… 혹시 세시아 씨는 나에게 응석 부리고 싶다는 뜻일까요?）"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「……ありがとうございます、セシアさん。ですが私はあなたのママではなく──」"
translation = "「……감사합니다, 세시아 씨. 하지만 저는 당신의 엄마가 아니라──」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「皆まで言わずともわかるわ。あなたは教育者の<ruby>鑑<rt>かがみ</rt></ruby>……その在り方には、生徒全員へ向けた大いなる博愛の精神を感じるもの」"
translation = "「끝까지 말하지 않아도 알아봐요. 당신은 교육자의 귀감…… 그 존재 방식에는, 학생 전원을 향한 커다란 박애 정신이 느껴지는걸요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「それもまた、わたくしの求める受容性。よって理想のママ、その形のひとつと言えるのよ！」"
translation = "「그것 또한, 제가 바라는 수용성. 따라서 이상적인 엄마, 그 형태 중 하나라고 할 수 있는 거예요!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「うーん、始まっちゃったかあ」"
translation = "「으음, 시작돼 버렸나」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「シノママ～♪\u3000セシアね、いっぱい甘えたいの～。その大きなお胸に飛び込ませてほしいの～♪」"
translation = "「시노 엄마~♪ 세시아 말이죠, 많이 응석 부리고 싶어요~. 그 큰 가슴에 뛰어들게 해주었으면 해요~♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「セシア、以前より疑問だったのだけれど……あなたはどうしてあちこちでママを作ろうとするの？」"
translation = "「세시아, 이전부터 의문이었는데…… 당신은 어째서 이곳저곳에서 엄마를 만들려고 하는 거야?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ママを求める気持ちに理由なんてないわ。人はみな、ママになってくれる人を自然に求めてしまうものなのよ？」"
translation = "「엄마를 바라는 마음에 이유 따위는 없어요. 사람은 누구나, 엄마가 되어줄 사람을 자연스럽게 요구하게 되는 법이라구요?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「まー、シノ学園長も嫌じゃなければ付き合ってください☆\u3000セッシーはいつも心のママを求めてて、シノ学園長の中にそれを見出したみたいなんで♪」"
translation = "「뭐-, 시노 학원장님도 싫지 않다면 상대해 주세요☆ 세시는 항상 마음속 엄마를 찾고 있어서, 시노 학원장님에게서 그걸 발견한 모양이니까♪」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「心のママ、ですか？\u3000なるほど……」"
translation = "「마음속 엄마, 인가요? 그렇군요……」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "（細かい事情はよくわかりませんが、こんなに純粋な気持ちで求めてくれるのならば、応えないわけにはいかないでしょう。これも教育者としての務め──）"
translation = "（구체적인 사정은 잘 모르겠지만, 이렇게 순수한 마음으로 바라준다면, 응해주지 않을 수 없겠죠. 이것도 교육자로서의 의무──）"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「ではセシアさん。私にできる範囲でよければ、ママだと思って甘えてください」"
translation = "「그럼 세시아 씨. 제가 할 수 있는 범위 내라면, 엄마라고 생각하고 응석 부려 주세요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「やったわ～♪\u3000新しいママよ～♪\u3000むぎゅ～♪」"
translation = "「해냈다~♪ 새로운 엄마예요~♪ 꼬옥~♪」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「えっと……これでいいのでしょうか？」"
translation = "「저기…… 이걸로 된 걸까요?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ばっちり☆\u3000セッシーはもうシノ学園長のママみにすっかり魅了されちゃってるっしょ～♪」"
translation = "「완벽해☆ 세시는 이제 시노 학원장님의 엄마미에 완전히 매료되어버린 거잖아~♪」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「シノママ～、セシアにいい子いい子して～♪\u3000ママに会えて嬉しいの～♪」"
translation = "「시노 엄마~, 세시아 착하다 착하다 해주세요~♪ 엄마를 만나서 기뻐요~♪」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「い、いい子いい子……？」"
translation = "「착, 착하다 착하다……?」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「学園長と言っても私、歳は学園の皆さんと変わりませんし……プライベートでは、その……結構ずぼらと言いますか……」"
translation = "「학원장이라고 해도 저, 나이는 학원 여러분과 다를 바 없고…… 사적으로는, 그…… 제법 칠칠치 못하다고 할까……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「あら、そうなのね？」"
translation = "「어머, 그런가요?」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「え、ええ。私、あまりママと呼ぶにふさわしくないかもしれませんよ……？」"
translation = "「네, 네. 저, 그다지 엄마라고 부르기에 어울리지 않을지도 몰라요……?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そんなことないわ～<emoji=heart04>\u3000ママが不安になっても、セシアが抱きしめてあげる～♪\u3000ぎゅ～っ♪」"
translation = "「그렇지 않아요~<emoji=heart04> 엄마가 불안해져도, 세시아가 안아줄게요~♪ 꼬옥~♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「あの……私たちはいつまでこれを見せ続けられるのかしら？」"
translation = "「저기…… 우리들은 언제까지 이걸 계속 봐야 하는 걸까?」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「あっ……す、すみません！」"
translation = "「앗…… 죄, 죄송합니다!」"

[[dialogue]]
speaker = "unk"
original = "ルヴィネに声をかけられて、シノがハッと我に返る。"
translation = "루비네가 말을 걸어오자, 시노가 앗 하고 정신을 차린다."

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「セッシーも甘えるのはそこまでにしとくっしょ☆\u3000会合のお供っていうお仕事の最中だかんね」"
translation = "「세시도 응석 부리는 건 거기까지 해두는 거라구☆ 회합 동행이라는 일인 중간이니까 말야」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「そうね、ママに迷惑をかけてはいけないわ。ごめんなさい、シノママ」"
translation = "「그렇네요, 엄마에게 피해를 주어서는 안 돼요. 죄송해요, 시노 엄마」"

[[dialogue]]
speaker_original = "シノ"
speaker_translation = "시노"
original = "「ええ、大丈夫ですよ」"
translation = "「네, 괜찮아요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「でも……ふふ！\u3000こうなると大いに期待できるわね！」"
translation = "「하지만…… 후후! 이렇게 되면 크게 기대할 수 있겠네요!」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「期待って？」"
translation = "「기대라니?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「新しいママとの出会いについてよ！」"
translation = "「새로운 엄마와의 만남에 대해서예요!」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「どういうこと……！？」"
translation = "「무슨 소리야……!?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「デネブでの『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』との戦い。その後のベガでの決戦でも、たくさんの星騎士の人たちと一同に会する機会こそあったわ……」"
translation = "「데네브에서의 『<ruby>ＸＥＬＯＳ<rt>제로스</rt></ruby>』와의 싸움. 그 후의 베가에서의 결전에서도, 수많은 성기사 분들과 한자리에 모일 기회는 있었어요……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「けれどあの時は、ばたばたしていたもの。その場にいるみんなとゆっくり自己紹介なんてできなかったし……」"
translation = "「하지만 그때는, 어수선했었는걸요. 그 자리에 있는 모두와 천천히 자기소개 따위 할 수 없었고……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「それに世界に迫る存亡の危機を前に、わたくし自身、ママを探す心の目を無意識に閉ざしていたみたい……！」"
translation = "「게다가 세계에 닥쳐온 존망의 위기 앞에, 저 자신, 엄마를 찾는 마음의 눈을 무의식중에 닫아두고 있었던 것 같아요……!」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「…………？？？？」"
translation = "「…………????」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「要はシリアスな空気を読んで、甘え上手なオギャりモードのセッシーをセーブしてたってことっしょ☆」"
translation = "「요는 진지한 분위기를 파악해서, 응석 잘 부리는 응애 모드의 세시를 세이브하고 있었다는 거잖아☆」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「その通りよ、紅明ママ！\u3000だから今ここで再会するまで──シノママに溢れんばかりのママみがあることにも気づいていなかったの……！」"
translation = "「맞아요, 코메이 엄마! 그래서 지금 여기서 재회할 때까지── 시노 엄마에게 넘쳐흐르는 엄마미가 있다는 것도 깨닫지 못하고 있었어요……!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「これは嬉しい誤算というものね♪\u3000平和そのものとなった今なら、あのときには気付けなかった、ママセンサーに引っかかる人がもっといるはずだわ！」"
translation = "「이것은 기쁜 오산이라는 거네요♪ 평화 그 자체가 된 지금이라면, 그때는 깨닫지 못했던, 엄마 센서에 걸리는 사람이 훨씬 더 있을 터예요!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「この調子なら──きっと学園を巡るうちに、たくさんの新しいママに出会えるはずよ♪」"
translation = "「이 기세라면── 분명 학원을 돌아다니는 동안, 수많은 새로운 엄마와 만날 수 있을 터예요♪」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「セッシーはママ探しに余念がないねぇ☆」"
translation = "「세시는 엄마 찾기에 여념이 없네☆」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「もちろんルヴィネさまの道案内や護衛が最優先ではあるけれど──お仕事の合間に、ママになってくれそうなヒトを探すの」"
translation = "「물론 루비네 님의 길 안내나 호위가 최우선이기는 하지만── 일하는 중간중간, 엄마가 되어 줄 만한 사람을 찾는 거예요」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「これぞまさに、一石二鳥というものじゃないかしら。うふふふ♪」"
translation = "「이야말로 그야말로, 일석이조라는 것이 아닐까요. 우후후후♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「しっかり聞いても、やっぱりその理屈はよくわからないわ……？」"
translation = "「똑똑히 들어도, 역시 그 이치는 잘 모르겠는데……?」"

