[[dialogue]]
speaker = "unk"
original = "第７話,『歓迎の歌声』,B"
translation = "제7화, 『환영의 노래』, B"

[[dialogue]]
speaker = "unk"
original = "放課後、突発的に計画されたオオヒメの歓迎会が、学園近場のカラオケボックスで開催されることになった。"
translation = "방과 후, 돌발적으로 계획된 오오히메의 환영회가 학원 근처의 가라오케 박스에서 개최되기로 했다."

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "『オオヒメ、転入おめでとーなのだーっ♪』"
translation = "『오오히메, 전학 축하한다인 거다─♪』"

[[dialogue]]
speaker_original = "３人"
speaker_translation = "3명"
original = "「っ……！！？」"
translation = "「읏……!!?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「やかましいぞ！\u3000急に大声で叫ぶな！」"
translation = "「시끄럽다! 갑자기 큰 소리로 외치지 마!」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "『テンションが上がってついつい叫んでしまったのだ♪』"
translation = "『흥이 올라서 그만 외쳐버린 거다♪』"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「ワンドリンク制ですから飲み物を選んでください。それから食べたいものがあれば──」"
translation = "「1드링크제이니까 음료를 골라주세요. 그리고 먹고 싶은 게 있다면──」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "『肉ーーーっ！』"
translation = "『고기───잇!』"

[[dialogue]]
speaker_original = "３人"
speaker_translation = "3명"
original = "「っ……！！？」"
translation = "「읏……!!?」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "『アルモたんは唐揚げがいいのだ！\u3000山盛り唐揚げを頼むのだ！』"
translation = "『알모탄은 가라아게가 좋은 거다! 수북하게 담긴 가라아게를 주문하는 거다!』"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "『お祝いするならやっぱりお肉が１番なのだ！\u3000めでたいのだ！』"
translation = "『축하할 때는 역시 고기가 으뜸인 거다! 경사스러운 거다!』"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "『オオヒメ転入おめでとーなのだーっ♪』"
translation = "『오오히메 전학 축하한다인 거다─♪』"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「マイク没収です！！」"
translation = "「마이크 몰수입니다!!」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「あぅ……取られちゃったのだ……」"
translation = "「아우…… 빼앗겨버린 거다……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ヒメさんは何を飲まれますか？」"
translation = "「히메 씨는 무엇을 드시겠어요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「お茶があれば……ふむふむ、では麦茶を貰おう」"
translation = "「차라도 있다면…… 음음, 그럼 보리차를 받도록 하지」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「わかりました」"
translation = "「알겠습니다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「リモコンの操作に慣れているようだが、カラオケにはよく来るのか？」"
translation = "「리모컨 조작에 익숙해 보이는데, 가라오케에는 자주 오나?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「極まれに、ですね。フィオナお嬢様が流星星徒会の皆様と遊びに出かける時、私を誘ってくださることがあるんです」"
translation = "「지극히 드물게, 요. 피오나 양이 류세이 학생회 분들과 놀러 나가실 때, 저를 불러주시는 경우가 있거든요」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「積極的に歌うということは無いのですが、リモコンの操作はその時に覚えました」"
translation = "「적극적으로 노래를 부르는 일은 없습니다만, 리모컨 조작은 그때 익혔습니다」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「なるほどな。……しかし、本当に大丈夫だったのか？」"
translation = "「그렇군. ……하지만, 정말 괜찮았던 건가?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「何がですか？」"
translation = "「무엇이 말인가요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「本当は今日もメイドの仕事があったのだろう？\u3000私の歓迎会でそれを休ませてしまって」"
translation = "「사실은 오늘 메이드 일이 있었겠지? 내 환영회 때문에 쉬게 만들어 버려서」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「問題ありません。メイド長のキリカさんには事情を説明し、許可を頂いていますから」"
translation = "「문제없습니다. 메이드장이신 키리카 씨에게 사정을 설명하고, 허가를 받았으니까요」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ヒメさんの歓迎会なのですから、余計な心配などせず楽しみましょう」"
translation = "「히메 씨의 환영회이니까, 쓸데없는 걱정은 하지 마시고 즐기도록 해요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「うむ、そうだな」"
translation = "「음, 그렇군」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「ふ～、熱唱したのだ……ん？\u3000次の曲が入ってないのだ！\u3000誰か入れるのだ！」"
translation = "「후～, 열창했던 것이다…… 응? 다음 곡이 안 들어간 것이다! 누군가 넣는 것이다!」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「そろそろ本日の主役、オオヒメが歌いますか～？」"
translation = "「슬슬 오늘의 주인공, 오오히메가 노래할까요～?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「む……しかし、まだ何を歌うか決まっていないのだが」"
translation = "「음…… 하지만, 아직 뭘 부를지 정하지 못했는데」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「リモコンで曲を探すのは難しいと感じ、本を用意してもらったのだが……まさかこんなに曲があるとは」"
translation = "「리모컨으로 곡을 찾는 건 어렵다고 느껴서, 책을 준비해 달라고 했다만…… 설마 이렇게나 곡이 있을 줄이야」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「しかも私が歌える曲と言ったら限られている。ジャンルで言うと童謡か演歌だが……」"
translation = "「게다가 내가 부를 수 있는 곡이라고 하면 한정되어 있다. 장르로 치면 동요나 엔카인데……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「童謡、いいと思いますよ？」"
translation = "「동요, 좋다고 생각해요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「しかし、カラオケには流れがあると聞いた。せっかくの空気を、私の童謡で盛り下げてしまうわけにはいかないだろう？」"
translation = "「하지만, 가라오케에는 흐름이라는 게 있다고 들었다. 애써 만든 분위기를, 내 동요로 가라앉게 만들 수는 없지 않은가?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「大丈夫です。実は童謡は、歌ってみると案外盛り上がるものなんです」"
translation = "「괜찮습니다. 사실 동요는, 부르고 보면 뜻밖에 분위기가 사는 법이거든요」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「そうだぞ！\u3000アルモたんも童謡は大好きなのだ！」"
translation = "「그렇다고! 알모 탄도 동요는 아주 좋아하는 것이다!」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「参加者がみんな歌えることが多いですから。突然、全員の大熱唱が始まったりして楽しかったりするのですよね～」"
translation = "「참가자 모두가 부를 수 있는 경우가 많으니까요. 갑자기, 전원의 대열창이 시작되거나 해서 즐겁기도 하고요～」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「なるほど、そういうものなのか……」"
translation = "「그렇군, 그런 것인가……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「最初ですし、私も一緒に歌いましょうか？」"
translation = "「처음이기도 하니, 저도 함께 부를까요?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「いいのか？\u3000そうしてくれると、とても助かる」"
translation = "「괜찮겠나? 그렇게 해준다면, 아주 큰 도움이 된다」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「ふふ、よろしくお願いします……」"
translation = "「후후, 잘 부탁드립니다……」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「おお、デュエットなのだ！\u3000いいぞ２人とも、どんどんやるのだ！」"
translation = "「오오, 듀엣인 것이다! 좋다 둘 다, 점점 더 하는 것이다!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「それでは聞いてください、『どんぐりころころ』です」"
translation = "「그러면 들어주세요, 『도토리 굴러가유』입니다」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "『どんぐり来たのだーっ！\u3000オオヒメ、転入おめでとーっ♪』"
translation = "『도토리 왔다ー! 오오히메, 전학 축하해ー♪』"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「没収です♪」"
translation = "「몰수입니다♪」"

[[dialogue]]
speaker_original = "アルモタヘル（幼少）"
speaker_translation = "아르모타헬(어린 시절)"
original = "「あぅ……また持ってかれたのだ……」"
translation = "「아우…… 또 빼앗긴 것이다……」"

[[dialogue]]
speaker_original = "マグダレナ（幼少）"
speaker_translation = "막달레나(어린 시절)"
original = "「オオヒメ、マイクをどうぞ」"
translation = "「오오히메, 마이크 받으세요」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「うむ……ではいくぞ……」"
translation = "「음…… 그럼 간다……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「せーのっ……♪」"
translation = "「하나둘……♪」"

[[dialogue]]
speaker = "unk"
original = "和気藹々とした天使たちの歌声が、小さなカラオケボックス内に響く。"
translation = "화기애애한 천사들의 노래가, 작은 가라오케 룸 안에 울려 퍼진다."

[[dialogue]]
speaker = "unk"
original = "こうしてオオヒメの流星学園附属校生活、第１日目は無事に幕を閉じたのだった。"
translation = "이렇게 오오히메의 류세이 학원 부속교 생활, 첫째 날은 무사히 막을 내렸다."

