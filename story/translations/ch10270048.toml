[[dialogue]]
speaker = "unk"
original = "コハルコが少しだけ海に潜れるようになってから、俺たちはリゾート結界のプライベートビーチを借りて泳ぐ練習を続けていた。"
translation = "코하루코가 조금이나마 바다에 잠길 수 있게 된 후로, 우리들은 리조트 결계의 프라이빗 비치를 빌려 수영 연습을 계속하고 있었다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ぷはーっ！\u3000どう、どれくらい潜れた？」"
translation = "「푸하아! 어때, 얼마나 잠겨 있었어?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「一分くらいかな」"
translation = "「1분 정도려나」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「やった！\u3000新記録！」"
translation = "「해냈다! 신기록!」"

[[dialogue]]
speaker = "unk"
original = "あれからコハルコは日に日に潜れる時間が増えた。泳ぐのは１メートルも進んでないけど、本人が楽しそうなら、それはそれでいい。"
translation = "그날 이후 코하루코는 나날이 잠겨 있는 시간이 늘어났다. 헤엄치는 건 1미터도 나아가지 못했지만, 본인이 즐거워 보인다면 그것으로 됐다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「けっこう動いたし、ちょっと休憩しよっか」"
translation = "「꽤 움직였으니 조금 쉴까」"

[[dialogue]]
speaker = "unk"
original = "……さっきリゾート結界に来たばかりな気もするけど。コハルコの運動時間は短い。"
translation = "……방금 리조트 결계에 온 것 같은 기분도 들지만. 코하루코의 운동 시간은 짧다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ちゅっ<emoji=heart04>」"
translation = "「쪽<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ふふっ、驚いた？\u3000会長さん、ぼーっとしてたからつい」"
translation = "「후후, 놀랐어? 회장님, 멍하니 있길래 그만」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ん！？\u3000……んちゅっ、ちゅる、じゅるる……ちゅぱっ、ちゅるる、ちゅる、じゅるる…………」"
translation = "「음!? ……음쫔, 츄르, 쥬르르…… 츄팟, 츄르르, 츄르, 쥬르르…………」"

[[dialogue]]
speaker = "unk"
original = "反撃とばかりにコハルコの唇を奪い、舌を絡めて互いの唾液を味わう。"
translation = "반격이라도 하듯 코하루코의 입술을 빼앗고, 혀를 얽어 서로의 타액을 맛본다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あっ<emoji=heart04>\u3000ふあぁっ<emoji=heart04>\u3000おっぱい揉まれてるぅ……」"
translation = "「앗<emoji=heart04> 후아앗<emoji=heart04> 가슴 만져지고 있어……」"

[[dialogue]]
speaker = "unk"
original = "水着の隙間から手を入れ、コハルコの胸を揉みしだく。普段の制服姿からは想像できないボリュームで、ふわふわで気持ちいい。"
translation = "수영복 틈새로 손을 넣어 코하루코의 가슴을 주무른다. 평소의 교복 모습에선 상상할 수 없는 볼륨으로, 폭신폭신해서 기분 좋다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ここでしちゃうの……？」"
translation = "「여기서 할 거야……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ダメ？」"
translation = "「안 돼?」"

[[dialogue]]
speaker = "unk"
original = "コハルコの手を取り、俺の股間に当てさせた。水着越しにコハルコの手のひらを感じる。"
translation = "코하루코의 손을 잡아 내 가랑이에 대게 했다. 수영복 너머로 코하루코의 손바닥이 느껴진다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あ……会長さんのおち○ぽ、おっきくなってる……」"
translation = "「아…… 회장님 자지, 커져 있어……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……コハルコを抱きたくて仕方ないんだ」"
translation = "「……코하루코를 안고 싶어서 견딜 수가 없어」"

[[dialogue]]
speaker = "unk"
original = "今までなんとか我慢してたけど、コハルコの水着姿が魅力的すぎて、さっきのキスで決壊してしまった。"
translation = "지금까지 어떻게든 참아왔지만, 코하루코의 수영복 모습이 너무나 매력적이어서 방금 전의 키스로 결계가 무너지고 말았다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「私でこんなにしてくれたんだ……うん、いいよ」"
translation = "「나 때문에 이렇게까지 된 거구나…… 응, 좋아」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「じゃあ場所的に、チャラ男に強引に連れ込まれるシチュエーションで……」"
translation = "「그럼 장소도 장소니까, 양아치한테 억지로 끌려온 시츄에이션으로……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ストップ。今日はそういうのなしで、普通にエッチしたい」"
translation = "「스톱. 오늘은 그런 거 없이, 그냥 평범하게 섹스하고 싶어」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「え」"
translation = "「에」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「いや、えっと、そう言ってくれるのは嬉しいんだけど……」"
translation = "「아니, 저기, 그렇게 말해주는 건 기쁘지만……」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「プレイじゃなくて素で服を脱いで、大事なとこ見せ合って、しかも合体してって、こっぱずかしすぎない！？」"
translation = "「플레이가 아니라 생으로 옷을 벗고, 소중한 곳을 서로 보여주고, 게다가 합체한다는 건 너무 낯간지럽지 않아!?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「普段のプレイの方がよっぽど恥ずかしいよ」"
translation = "「평소에 하던 플레이가 훨씬 더 부끄러운 거야」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ウソぉっ！？」"
translation = "「거짓말!?」"

[[dialogue]]
speaker = "unk"
original = "正義感だけじゃなく羞恥心もズレているコハルコだった。"
translation = "정의감뿐만 아니라 수치심도 어긋나 있는 코하루코였다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「大丈夫、恥ずかしさなんて忘れるくらい気持ちよくするから」"
translation = "「괜찮아, 부끄러움 같은 건 잊을 정도로 기분 좋게 해줄 테니까」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「えっ、あっ！？」"
translation = "「에, 앗!?」"

[[dialogue]]
speaker = "unk"
original = "コハルコを押し倒し、水着をはぎ取る。世界で一番エッチで可愛い彼女がそこにいた。"
translation = "코하루코를 밀어트려 수영복을 벗겨낸다. 세상에서 가장 야하고 귀여운 그녀가 그곳에 있었다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うぅ、会長さんに全部見られてる……」"
translation = "「우으, 회장님한테 전부 보여지고 있어……」"

[[dialogue]]
speaker = "unk"
original = "コハルコの秘所はすでに濡れている。"
translation = "코하루코의 비소는 이미 젖어 있다."

[[dialogue]]
speaker = "unk"
original = "もちろん海水ではなくて、コハルコからにじみ出た蜜だ。"
translation = "물론 바닷물이 아니라 코하루코에게서 배어 나온 애액이다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「綺麗だよ、コハルコ」"
translation = "「아름다워, 코하루코」"

[[dialogue]]
speaker = "unk"
original = "水着が乱れ、ほとんど裸な俺の彼女。太陽の光に照らされた身体は見惚れるくらいに美しかった。"
translation = "수영복이 흐트러져 거의 알몸이나 다름없는 내 여자친구. 태양 빛에 비친 몸은 넋을 잃고 볼 정도로 아름다웠다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はぁ、はぁ……会長さんのおち○ぽ、おま○こに擦れて熱い……」"
translation = "「하아, 하아…… 회장님 자지, 보지에 스쳐서 뜨거워……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「コハルコもね」"
translation = "「코하루코도 그래」"

[[dialogue]]
speaker = "unk"
original = "お互いの体の敏感な部分が触れ合って、体温を伝え合う。好きという気持ちが熱になって全身にみなぎっていた。"
translation = "서로의 몸의 민감한 부분이 맞닿아 체온을 나눈다. 좋아한다는 마음이 열기가 되어 전신에 넘쳐나고 있었다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ん、ふぁ……おち○ぽ、先っぽからおつゆ出てる……先っぽつやつやで、今すぐ私の中に入りたいって言ってるみたい」"
translation = "「음, 하아…… 자지, 끝에서 물이 나오고 있어…… 끝이 반질반질해서 지금 당장 내 안으로 들어가고 싶다고 말하는 것 같아」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああ、早くコハルコの中にぶち込みたい」"
translation = "「아아, 빨리 코하루코 안에 처박고 싶어」"

[[dialogue]]
speaker = "unk"
original = "コハルコの好みに合わせて、あえて乱暴な言葉を使う。"
translation = "코하루코의 취향에 맞춰 일부러 거친 말투를 사용한다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「いいよ、来て。会長さんのおっきなおち○ぽ、私のおま○こにぶち込んでっ、私のおま○こで気持ちよくなって……！」"
translation = "「좋아, 와줘. 회장님의 커다란 자지, 내 보지에 처박아줘, 내 보지로 기분 좋아져 줘……!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「んあ～～～～～～～っ<emoji=heart04>」"
translation = "「응아아아아아아아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "深く深く、コハルコの中に侵入する。膣内は熱くとろけて、でもきつく締め付けてくる。"
translation = "깊게 깊게, 코하루코의 안으로 침입한다. 질 안은 뜨겁게 녹아내리면서도, 동시에 꽉 조여 온다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はぁ、はぁ……おち○ぽ、おっきい……かたくて、あっつくて……はぁ、あん……きもちいい……きもちいいが私の中に入ってる……」"
translation = "「하아, 하아…… 자지, 커…… 딱딱하고, 뜨거워서…… 하아, 앙…… 기분 좋아…… 기분 좋은 게 내 안에 들어와 있어……」"

[[dialogue]]
speaker = "unk"
original = "つないだ手からコハルコの興奮が伝わってくる。きっと俺からコハルコにも伝わっている。"
translation = "잡은 손에서 코하루코의 흥분이 전해져 온다. 분명 나로부터 코하루코에게도 전해지고 있을 것이다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ふぅ、ん……まだ、動かないで……今、動かれたら、すぐイっちゃいそうだから……はぁ、あ…………」"
translation = "「후우, 응…… 아직 움직이지 마…… 지금 움직이면 바로 가버릴 것 같으니까…… 하아, 아…………」"

[[dialogue]]
speaker = "unk"
original = "コハルコの呼吸、鼓動がわずかな振動になってペニスを刺激する。動かなくても気持ちいい。"
translation = "코하루코의 호흡, 고동이 미세한 진동이 되어 페니스를 자극한다. 움직이지 않아도 기분 좋다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「会長さんのおち○ぽ、ビクビクしてる……ふふっ」"
translation = "「회장님 자지, 움찔거리고 있어…… 후후」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「自分の中に、自分じゃないものがいるのって、改めて考えると不思議だよね。でも会長さんのだって思ったら、すごく愛しいの」"
translation = "「자신의 안에 자신이 아닌 것이 있다는 건, 다시 생각해보면 신기하네. 하지만 회장님 것이라고 생각하니까 정말 사랑스러워」"

[[dialogue]]
speaker = "unk"
original = "コハルコの手が下腹部をなぞる。俺のペニスはそこに確かに入っていて、子宮に向かって伸びている。"
translation = "코하루코의 손이 하복부를 훑는다. 내 페니스는 그곳에 확실히 들어가 있어 자궁을 향해 뻗어 있다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あっ<emoji=heart04>\u3000またおち○ぽビクビクした……会長さんのスケベ。私の子宮、そんなに気になるんだ」"
translation = "「앗<emoji=heart04> 또 자지 움찔했어…… 회장님 변태. 내 자궁이 그렇게나 궁금한 거야?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はぁ、ん……焦らしてごめんね。そろそろ動いていいよ…………おち○ぽ、子宮までいっぱい突いて」"
translation = "「하아, 응…… 애태워서 미안해. 이제 움직여도 돼………… 자지로 자궁까지 잔뜩 찔러줘」"

[[dialogue]]
speaker = "unk"
original = "もう一度、手を固くつなぎなおす。そして下半身に力を込めて──"
translation = "다시 한번 손을 꽉 고쳐 잡는다. 그리고 하반신에 힘을 주어──"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あっ、あっ、あぁっ……おち○ぽ、私の中で動いてるぅ……<emoji=heart04>」"
translation = "「앗, 앗, 아아앗…… 자지, 내 안에서 움직이고 있어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あぁっ、あっ<emoji=heart04>\u3000会長さんのおち○ぽ気持ちいい、会長さんのおち○ぽ好きぃ<emoji=heart04>」"
translation = "「아아앗, 앗<emoji=heart04> 회장님 자지 기분 좋아, 회장님 자지 좋아해<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺は？」"
translation = "「나는?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「会長さんももちろん好き、だからおち○ぽも好きっ<emoji=heart04>」"
translation = "「회장님도 당연히 좋아해, 그러니까 자지도 좋아!<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ははっ、俺もコハルコが好きだよ」"
translation = "「하하, 나도 코하루코를 좋아해」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うん、うん。会長さんの優しいところが好き、妹たちにも優しいところも好き、頼りになるところも好きっ」"
translation = "「으음, 으음. 회장님의 다정한 면이 좋아, 여동생들에게도 다정한 점도 좋고, 의지가 되는 면도 좋아!」"

[[dialogue]]
speaker = "unk"
original = "つながる前は恥ずかしがっていたのに、今ではとろけた顔でペニスをくわえ込んでいる。"
translation = "이어지기 전에는 부끄러워하더니, 지금은 황홀한 표정으로 페니스를 물고 있다."

[[dialogue]]
speaker = "unk"
original = "口にはしないけど、下半身に素直なコハルコも好きだ。"
translation = "입 밖으로 내지는 않지만, 하반신에 솔직한 코하루코도 좋다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「おち○ぽ気持ちいいよぉ……お腹の奥から好きって気持ち溢れてくるぅ……<emoji=heart04>」"
translation = "「자지 기분 좋아아…… 배 안쪽에서 좋아한다는 마음이 넘쳐흘러어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それも、俺もだ」"
translation = "「그건, 나도 마찬가지야」"

[[dialogue]]
speaker = "unk"
original = "俺の好きな人が、俺を好きでいてくれて。裸を晒して、身体の一番深い部分で受け入れてくれる。性器から伝わる快感以上に、それが嬉しい。"
translation = "내가 좋아하는 사람이 나를 좋아해 주고. 나체를 드러내고, 몸의 가장 깊은 부분으로 받아들여 준다. 성기로 전해지는 쾌감 이상으로, 그것이 기쁘다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「会長さん……んっ、あっ」"
translation = "「회장님…… 응, 앗」"

[[dialogue]]
speaker = "unk"
original = "コハルコが物欲しそうに口を動かす。花の蜜に誘われる虫のように、本能的に食らいついた。"
translation = "코하루코가 뭔가를 원하는 듯 입을 움직인다. 꽃의 꿀에 유혹당하는 벌레처럼, 본능적으로 달려들었다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「……ん、ちゅる、ちゅぱっ、じゅるる、じゅる……んじゅるる、ちゅぷ、ちゅるちゅぱ、じゅるるる……<emoji=heart04>」"
translation = "「……음, 츄르, 츄파, 쥬르르, 쥬르…… 음쥬르르, 츄푸, 츄르츄파, 쥬르르르……<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ちゅぷちゅぱ、ちゅるる、じゅるるる\u3000れろ、れるろ……ん、ふ……れろれぇろ、ちゅぷる、ちゅる、じゅる、れろ……<emoji=heart04>」"
translation = "「츄푸츄파, 츄르르, 쥬르르르 레로, 레르로…… 음, 후…… 레로레에로, 츄푸르, 츄르, 쥬르, 레로……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "お互いに唇をなめ合い、吸い合い、舌を絡めて、貪り合う。"
translation = "서로 입술을 핥고, 빨고, 혀를 얽으며, 탐닉한다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「んふー……ふー……ふー……」"
translation = "「음후─…… 후─…… 후─……」"

[[dialogue]]
speaker = "unk"
original = "息もできないほどキスに夢中で、限界がきて、息を吸って、またキスをする。"
translation = "숨도 못 쉴 정도로 키스에 꿈꾸다 한계가 오면 숨을 들이키고, 다시 키스를 한다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ん、りゅる、れろ、ちゅぱ、ちゅ、ちゅ……んふ、あ、じゅる、じゅるるる……ちゅぱ、じゅるる、じゅる、れろ<emoji=heart04>」"
translation = "「음, 류르, 레로, 츄파, 츄, 츄…… 음후, 아, 쥬르, 쥬르르르…… 츄파, 쥬르르, 쥬르, 레로<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「じゅるる、じゅる、ちゅる、ちゅるる……れら、れろ……ん、ふ、んん、ちゅ、ちゅ、ちゅぱ、ちゅるる、ちゅ、ちゅるる……<emoji=heart04>」"
translation = "「쥬르르, 쥬르, 츄르, 츄르르…… 레라, 레로…… 음, 후, 음음, 츄, 츄, 츄파, 츄르르, 츄, 츄르르……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "キスの際に手がほどけ、今度は胸に手を伸ばす。"
translation = "키스를 하며 손이 풀리고, 이번에는 가슴으로 손을 뻗는다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あ、はっ、あぁっ……おっぱい、鷲掴みにされてる……あ、ん、あふぅ……いいよ、もっと強くして…………あ、あぁっ<emoji=heart04>」"
translation = "「아, 핫, 아아앗…… 가슴, 움켜쥐어지고 있어…… 아, 음, 아후우…… 좋아, 좀 더 강하게 해줘………… 아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あんっ<emoji=heart04>\u3000……会長さん、おっぱい大好きだもんね。泳ぐ練習してる時もずっと見てたし」"
translation = "「안앗<emoji=heart04> ……회장님, 가슴 정말 좋아하네. 수영 연습할 때도 계속 보고 있었고」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それは……うん、見てたけど」"
translation = "「그건…… 응, 보고 있었지만」"

[[dialogue]]
speaker = "unk"
original = "水着で抑えきれない、はみ出さんばかりの乳房に目がいくのは仕方ない。けどバレてたのは恥ずかしい。"
translation = "수영복으로 다 가려지지 않는, 터져 나올 듯한 유방에 눈이 가는 건 어쩔 수 없다. 하지만 들켰다는 게 부끄럽다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ふふっ、照れなくていいのに。会長さんは私のこと、いくらでもエッチな目で見ていいの」"
translation = "「후훗, 부끄러워하지 않아도 되는데. 회장님은 나를 얼마든지 야한 눈으로 봐도 돼」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「私にしたいこと、何でもしていいんだよ。私はとっくに君のものなんだから」"
translation = "「나한테 하고 싶은 거, 뭐든지 해도 된다구. 나는 진작에 네 것이니까」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「じゃあ……」"
translation = "「그럼……」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あぁっ、おっぱい吸われてる……ちくび、舌でくりくりされてるぅ……<emoji=heart04>\u3000あっ、んんっ<emoji=heart04>」"
translation = "「아아앗, 가슴 빨리고 있어…… 유두, 혀로 굴려지고 있어어……<emoji=heart04> 앗, 음음앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "コハルコの大きな胸にしゃぶりつく。前から着やせすると思ってたけど、最近はまた大きくなった気がする。"
translation = "코하루코의 커다란 가슴을 빨아댄다. 전부터 옷을 입으면 날씬해 보인다고 생각했는데, 최근에는 또 커진 것 같다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「おま○こ熱いぃ……おっぱい熱いぃ……会長さんとつながってるところ、みんな熱くて気持ちいいよぉ……<emoji=heart04>」"
translation = "「보지 뜨거워어…… 가슴 뜨거워어…… 회장님과 이어져 있는 곳, 모두 뜨겁고 기분 좋아아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "夏の日差しなんて感じないくらい、俺も全身が熱い。熱は冷めるどころか一段と勢いを増し──"
translation = "여름 햇살 따위 느껴지지 않을 정도로, 나도 온몸이 뜨겁다. 열기는 식기는커녕 한층 더 기세를 더해──"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あ～～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000あっ、あっ、ああぁっ<emoji=heart04>\u3000おち○ぽ、激しいっ、奥までズンズン来るっ<emoji=heart04>」"
translation = "「아~~~~~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04> 앗, 앗, 아아앗<emoji=heart04> 자지, 격렬해, 안쪽까지 푹푹 들어와앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「おち○ぽ気持ちいいっ<emoji=heart04>\u3000奥までズボズボされるの好きぃ<emoji=heart04>\u3000もっと、もっとしてぇ<emoji=heart04>」"
translation = "「자지 기분 좋아앗<emoji=heart04> 안쪽까지 푹푹 박히는 거 좋아아<emoji=heart04> 좀 더, 좀 더 해줘어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "とろけた顔でペニスを味わうコハルコ。脳を焼くような甘い声に、俺も限界が近い。"
translation = "황홀한 표정으로 페니스를 맛보는 코하루코. 뇌를 태우는 듯한 달콤한 목소리에 나도 한계가 가깝다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「会長さんのおち○ぽ、私の中で暴れてる……ふふっ、いいよ、好きなだけ私のおま○こで気持ちよくなってっ<emoji=heart04>」"
translation = "「회장님의 자지, 내 안에서 날뛰고 있어…… 후훗, 좋아, 마음껏 내 보지로 기분 좋아져줘엇<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あ、はぁ、あっ、ああぁっ<emoji=heart04>\u3000あぁ、ふあ、ああ、あっ<emoji=heart04>\u3000奥、私のいちばん奥まで、おち○ぽ来てるぅ<emoji=heart04>」"
translation = "「아, 하아, 앗, 아아앗<emoji=heart04> 아아, 후아, 아아, 앗<emoji=heart04> 안쪽, 내 가장 깊은 곳까지, 자지가 오고 있어어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "力の限りに腰を突き出せば、亀頭がこつこつと奥に当たる。そこがコハルコの子宮の入り口。子どもを作る場所だ。"
translation = "힘껏 허리를 내밀면 귀두가 툭툭 안쪽에 닿는다. 그곳이 코하루코의 자궁 입구. 아이를 만드는 장소다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はぁ、あっ<emoji=heart04>\u3000私の子宮、おち○ぽで突かれてるっ<emoji=heart04>\u3000赤ちゃんのお部屋、おち○ぽでノックされてるっ<emoji=heart04>」"
translation = "「하아, 앗<emoji=heart04> 내 자궁, 자지로 찔려지고 있어엇<emoji=heart04> 아기 방, 자지로 노크당하고 있어엇<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「お腹の奥、熱いのぉ<emoji=heart04>\u3000私の子宮、せーえき欲しいって切なくなってるっ<emoji=heart04>」"
translation = "「배 안쪽, 뜨거워어<emoji=heart04> 내 자궁, 정액 원한다고 애달파지고 있어엇<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「んあ、ああっ、あ～～～～っ<emoji=heart04>\u3000おち○ぽ強い、おち○ぽ激しいよぉ<emoji=heart04>\u3000もっと、もっとぉ<emoji=heart04>\u3000好きなだけ使ってぇっ<emoji=heart04>」"
translation = "「음아, 아앗, 아~~~~앗<emoji=heart04> 자지 강해, 자지 격렬해에<emoji=heart04> 좀 더, 좀 더어<emoji=heart04> 마음껏 사용해줘엇<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "コハルコを気遣う余裕がなくて、力任せに腰を振る。パンパンと肉と肉がぶつかる音がする。"
translation = "코하루코를 배려할 여유가 없어 힘껏 허리를 흔든다. 팍팍 소리를 내며 살과 살이 부딪치는 소리가 들린다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「コハルコの会長さん専用おま○こ、いっぱい、いっぱいズボズボしてっ<emoji=heart04>\u3000好き、大好きっ<emoji=heart04>\u3000会長さんもおち○ぽも好きっ<emoji=heart04>」"
translation = "「코하루코의 회장님 전용 보지, 잔뜩, 잔뜩 푹푹 박아줘엇<emoji=heart04> 좋아해, 정말 좋아해앗<emoji=heart04> 회장님도 자지도 좋아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ひあ、ああ、ああぁっ<emoji=heart04>\u3000あ～～～、あっ、ふあ、あぁっ<emoji=heart04>\u3000私の、中でおち○ぽ、またおっきくなったっ<emoji=heart04>」"
translation = "「히아, 아아, 아아앗<emoji=heart04> 아~~~, 앗, 후아, 아앗<emoji=heart04> 내, 안에서 자지, 또 커졌어엇<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「しゃせー、してっ<emoji=heart04>\u3000せーえき、出してっ<emoji=heart04>\u3000君のせーえきで、おなかいっぱいにしてっ<emoji=heart04>」"
translation = "「사정, 해줘엇<emoji=heart04> 정액, 내보내 줘엇<emoji=heart04> 네 정액으로, 배부르게 해줘엇<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああ、たらふく射精してやるからな、コハルコ」"
translation = "「아아, 실컷 사정해 줄 테니까, 코하루코」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うん、もっと、いっぱい愛してっ<emoji=heart04>\u3000いっぱい奥まで突いてっ<emoji=heart04>\u3000奥でいっぱいしゃせーしてっ<emoji=heart04>」"
translation = "「응, 좀 더, 잔뜩 사랑해줘엇<emoji=heart04> 잔뜩 안쪽까지 찔러줘엇<emoji=heart04> 안쪽에서 잔뜩 사정해줘엇<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「コハルコ、好きだ」"
translation = "「코하루코, 좋아해」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うん、うん、うん<emoji=heart04>\u3000君のこといっぱい好き<emoji=heart04>\u3000君のおち○ぽも好き<emoji=heart04>\u3000君のせーえきも好き<emoji=heart04>\u3000君の赤ちゃんの素、いっぱい欲しい<emoji=heart04>」"
translation = "「응, 응, 응<emoji=heart04> 너를 정말 좋아해<emoji=heart04> 네 자지도 좋아해<emoji=heart04> 네 정액도 좋아해<emoji=heart04> 네 아기 씨, 잔뜩 갖고 싶어<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺もコハルコのおま○こ好きだよ」"
translation = "「나도 코하루코의 보지 좋아해」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「嬉しいっ<emoji=heart04>\u3000君が私で気持ちよくなってくれるの嬉しい<emoji=heart04>」"
translation = "「기뻐엇<emoji=heart04> 네가 나로 기분 좋아져서 기뻐<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「私のおま○こ、君専用のおち○ぽ入れだから、いっぱい使って<emoji=heart04>\u3000いっぱい出して気持ちよくなって<emoji=heart04>」"
translation = "「내 보지, 네 전용 자지 보관함이니까, 잔뜩 써줘<emoji=heart04> 잔뜩 내보내서 기분 좋아져줘<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あぁっ、はあぁっ<emoji=heart04>\u3000手、ぎゅっとして<emoji=heart04>\u3000一緒にイこうねっ<emoji=heart04>」"
translation = "「아앗, 하아앗<emoji=heart04> 손, 꽉 잡아줘<emoji=heart04> 같이 가자앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "手を再びつないで、硬く握る。指の痕が残りそうなほど、強く、強く。何があってもほどないように。"
translation = "손을 다시 맞잡고, 꽉 쥔다. 손가락 자국이 남을 정도로, 강하게, 강하게. 무슨 일이 있어도 풀리지 않도록."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あぁ～～～～っ<emoji=heart04>\u3000あっ、あっ、あぁっ<emoji=heart04>\u3000おち○ぽまた強くなった<emoji=heart04>\u3000イきそうなんだ<emoji=heart04>\u3000せーえき出されちゃうんだ<emoji=heart04>\u3000あはっ<emoji=heart04>」"
translation = "「아아~~~~앗<emoji=heart04> 앗, 앗, 아앗<emoji=heart04> 자지 또 강해졌어<emoji=heart04> 갈 것 같아아<emoji=heart04> 정액 내보내져 버려엇<emoji=heart04> 아핫<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「私もイっちゃう、イっちゃいそうっ<emoji=heart04>\u3000おち○ぽでイカされちゃうっ<emoji=heart04>」"
translation = "「나도 갈게, 갈 것 같아앗<emoji=heart04> 자지로 가게 되어버려엇<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はぁ、あっ、ああぁ～～～～っ<emoji=heart04>\u3000あっ、ひぃん、ふあ、ああぁっ<emoji=heart04>\u3000あっ、あっ、ああ～～っ<emoji=heart04>\u3000んん、んあ、えあっ<emoji=heart04>\u3000あひ、あ、あふあっ<emoji=heart04>」"
translation = "「하아, 앗, 아아아~~~~앗<emoji=heart04> 앗, 히인, 후아, 아아앗<emoji=heart04> 앗, 앗, 아아~~앗<emoji=heart04> 음음, 음아, 에앗<emoji=heart04> 아히, 아, 아후앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「出すぞ、コハルコ！」"
translation = "「낸다, 코하루코!」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「うん、うん、出して<emoji=heart04>\u3000せーし、いっぱい私に注いで<emoji=heart04>\u3000私の子宮、君でいっぱいにしてっ<emoji=heart04>\u3000あ、うあ、あ、はぁ、ああぁっ<emoji=heart04>」"
translation = "「응, 응, 내줘엇<emoji=heart04> 정자, 잔뜩 나한테 쏟아줘엇<emoji=heart04> 내 자궁, 너로 가득 채워줘엇<emoji=heart04> 아, 우아, 아, 하아, 아아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「イクイクイクっ<emoji=heart04>\u3000イっちゃうっ<emoji=heart04>\u3000おま○こイっちゃうっ<emoji=heart04>\u3000ひああぁ～～～～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「간다간다간다앗<emoji=heart04> 가버려엇<emoji=heart04> 보지 가버려엇<emoji=heart04> 히아아아~~~~~~~~~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はぁ～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>\u3000んんっ<emoji=heart04>\u3000せーえき、ドプドプって私の中に注がれてるぅ<emoji=heart04><emoji=heart04>」"
translation = "「하아~~~~~~~앗<emoji=heart04><emoji=heart04><emoji=heart04> 음음앗<emoji=heart04> 정액, 울컥울컥 내 안으로 쏟아지고 있어어<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "下半身に力を込め、最後の一滴までコハルコの膣内に精を放つ。"
translation = "하반신에 힘을 주어, 마지막 한 방울까지 코하루코의 질 내에 정을 내뿜는다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「おち○ぽ、ビクビクって……あ、はぁ、あっ<emoji=heart04>\u3000びゅーってあついの、出てるぅ……<emoji=heart04>」"
translation = "「자지, 움찔움찔하면서…… 아, 하아, 앗<emoji=heart04> 뷰릇하고 뜨거운 거, 나오고 있어어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はぁ、ふあ、あっ……ん、んん、ん～～～っ<emoji=heart04>」"
translation = "「하아, 후아, 앗…… 음, 음음, 음~~~앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "コハルコもまた、尽きるまで精を搾りとろうと、膣を締め続けていた。"
translation = "코하루코 또한 다할 때까지 정을 짜내려는 듯 질을 계속 조이고 있었다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ふふっ……せーえきでおなかいっぱい……<emoji=heart04>\u3000あっ、抜けちゃっ…………んっ<emoji=heart04>」"
translation = "「후훗…… 정액으로 배불러……<emoji=heart04> 앗, 빠져버렸………… 음앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "渾身の射精でペニスが萎え、コハルコから抜け落ちる。"
translation = "혼신의 사정으로 페니스가 시들어 코하루코에게서 빠져나온다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はぁ、はぁ、はぁ…………おま○こからせーえきこぼれてる……うぅ、もったいない……」"
translation = "「하아, 하아, 하아………… 보지에서 정액 흘러나와…… 으으, 아까워……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……何度でも注ぐから大丈夫だよ」"
translation = "「……몇 번이고 쏟아줄 테니까 괜찮아」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「ふふっ、ならいっか……」"
translation = "「후훗, 그럼 됐어……」"

[[dialogue]]
speaker = "unk"
original = "コハルコは絶頂に涙を浮かべ、息も絶え絶えだ。俺も似たようなものだろう。"
translation = "코하루코는 절정에 눈물을 머금고 숨을 헐떡이고 있다. 나도 마찬가지일 것이다."

[[dialogue]]
speaker = "unk"
original = "何度でもはちょっと強がりだ。少なくとも休んでからでないと、続きはできそうにない。"
translation = "몇 번이고라는 건 조금 허세다. 적어도 쉬고 나서가 아니면 다음은 할 수 없을 것 같다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「はぁー……はぁー……」"
translation = "「하아─…… 하아─……」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「会長さんので私の中、いっぱいになってる……幸せぇ……」"
translation = "「회장님 것으로 내 안, 가득 차 있어…… 행복해에……」"

[[dialogue]]
speaker = "unk"
original = "コハルコがまた下腹部をなでた。そこには子宮があって、俺の分身がコハルコの中にいる。"
translation = "코하루코가 다시 하복부를 쓰다듬었다. 그곳에는 자궁이 있고, 나의 분신이 코하루코 안에 있다."

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「学園を卒業して、一緒に暮らすようになったら、本当の子作りしようね。その頃には、君のこと、なんて呼んでるのかな？」"
translation = "「학원을 졸업하고 같이 살게 되면 진짜 아기 만들기 하자. 그 무렵엔 너를 뭐라고 부르고 있을까?」"

[[dialogue]]
speaker_original = "コハルコ"
speaker_translation = "쿠하루코"
original = "「あなた、とか？\u3000あはは、ちょっと恥ずかしいね」"
translation = "「당신, 이라던가? 아하하, 조금 부끄럽네」"

[[dialogue]]
speaker = "unk"
original = "汗や愛液、精液に塗れてほほ笑むコハルコは、やっぱり世界で一番可愛かった。"
translation = "땀과 애액, 정액에 젖어 미소 짓는 코하루코는 역시 세상에서 가장 귀여웠다."

