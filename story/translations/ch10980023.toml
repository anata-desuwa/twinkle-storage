[[dialogue]]
speaker = "unk"
original = "第３話,君は君のままで,P"
translation = "제3화, 너는 너인 채로, P"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さんは今期のアニメ、何観てますか？\u3000たまには違ったジャンルも観てみようと思ってるんですけど」"
translation = "「회장님은 이번 분기 애니, 뭐 보고 계세요? 가끔은 다른 장르도 봐볼까 생각 중인데요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「また詰みプラモ増えちゃったんですよね。会長さん、今度一緒に作りましょう♪」"
translation = "「또 안 만든 프라모델 늘어나버렸단 말이죠. 회장님, 다음에 같이 만들어요♪」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「そうだ、週末アキバ行きましょ！\u3000音ゲーがアニメとコラボしてるんですよー！\u3000１回叩いておきたいんで！\u3000会長さんとやりたいこといっぱいだー！」"
translation = "「맞다, 주말에 아키바 가요! 리듬 게임이 애니랑 콜라보하고 있거든요─! 1번은 플레이해두고 싶어서! 회장님이랑 하고 싶은 거 엄청 많다─!」"

[[dialogue]]
speaker_original = "女学生"
speaker_translation = "女学生"
original = "「あっ、ヒマワリ。会長さんとランチデート？」"
translation = "「앗, 히마와리. 회장님이랑 점심 데이트?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「へへー、いいでしょー」"
translation = "「헤헤─, 부럽지─」"

[[dialogue]]
speaker = "unk"
original = "友達？"
translation = "친구?"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はい！\u3000会長さんとお付き合いしてるのはフルオープンなんで！\u3000別に隠さなくてもいいかなって！」"
translation = "「네! 회장님이랑 사귀는 건 풀 오픈이라서요! 딱히 숨기지 않아도 괜찮을까 해서!」"

[[dialogue]]
speaker_original = "女学生"
speaker_translation = "女学生"
original = "「楽しんでるとこ邪魔してごめんだけど、午後イチは移動教室だよー。そろそろ準備しないと」"
translation = "「즐거운 데 방해해서 미안하지만, 오후 첫 교시는 이동 수업이야─. 슬슬 준비해야지」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「そうだった！\u3000じゃ、会長さん、また後でー！」"
translation = "「그랬었지! 그럼, 회장님, 나중에 봐요─!」"

[[dialogue]]
speaker = "unk"
original = "気兼ねなく、学園内でヒマワリと２人で過ごす時間も増えていった。"
translation = "스스럼없이, 학원 내에서 히마와리와 둘이서 보내는 시간도 늘어갔다."

[[dialogue]]
speaker = "unk"
original = "オープンにデートを重ねていた、とある日。"
translation = "오픈하게 데이트를 거듭하던, 어느 날."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あいたたた……うぅ、ポカしちゃったなー」"
translation = "「아이타타타…… 우으, 실수해버렸네─」"

[[dialogue]]
speaker = "unk"
original = "ヒマワリが怪我したって！？"
translation = "히마와리가 다쳤다고!?"

[[dialogue]]
speaker = "unk"
original = "ヒマワリがゴールデングースでの任務中、不注意で怪我を負ってしまったと聞き、事務所に駆け付けた。"
translation = "히마와리가 골든 구스에서의 임무 중, 부주의로 부상을 입었다는 소식을 듣고, 사무소로 달려갔다."

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「申し訳ありません、会長様。ヒマワリに手傷を負わせてしまいましたわ」"
translation = "「죄송합니다, 회장님. 히마와리에게 상처를 입히고 말았습니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「社長が謝らないでください！\u3000あたしの不注意だったんで」"
translation = "「사장님이 사과하지 마세요! 제 부주의 때문이었으니까요」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「確かに注意力散漫な部分が見受けられましたわ。ヒマワリ、会長様に伝えたいことがあるのではなくて？」"
translation = "「확실히 주의력이 산만한 부분이 엿보였습니다. 히마와리, 회장님께 전달하고 싶은 말이 있는 게 아니었나요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はい……」"
translation = "「네……」"

[[dialogue]]
speaker = "unk"
original = "なんでも話してくれ"
translation = "뭐든 말해줘"

[[dialogue]]
speaker = "unk"
original = "そうなのか？"
translation = "그런 건가?"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「では、私は席を外しますわね」"
translation = "「그럼, 저는 자리를 비켜드리겠습니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うーーーーん……」"
translation = "「으ーーーー응……」"

[[dialogue]]
speaker = "unk"
original = "珍しく考えごと？"
translation = "웬일로 고민거리라도 있어?"

[[dialogue]]
speaker = "unk"
original = "どうした、ヒマワリ？"
translation = "무슨 일이야, 히마와리?"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さん……あたしたちってカップルですよね？\u3000恋人同士ですよね！？\u3000パートナーですよね！？\u3000伴侶ですよね！？」"
translation = "「회장님…… 저희 커플 맞죠? 연인 사이 맞죠!? 파트너 맞죠!? 반려 맞죠!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしと会長さん、こんなに仲良くって、よくふたりきりでもいるのに……」"
translation = "「저랑 회장님, 이렇게 사이가 좋고 자주 둘이서만 있는데……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「クラスの子たちにちっとも付き合っている風に見えないって……仲の良い兄妹みたいって言われたんです」"
translation = "「반 아이들이 전혀 사귀는 것처럼 안 보인다고…… 사이좋은 남매 같다는 소리를 들었어요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしは会長さんが大好きです。お話しするの楽しいし、一緒にいるだけで幸せだし、それでいいと思ってたんですけど……」"
translation = "「저는 회장님이 정말 좋아요. 대화하는 것도 즐겁고 같이 있는 것만으로도 행복해서 그걸로 됐다고 생각했는데요……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「これだけじゃダメなんですかね……？\u3000もっと、恋人っぽい感じにした方がいいんでしょうか？」"
translation = "「이것만으로는 안 되는 걸까요……? 좀 더 연인다운 느낌을 내는 편이 좋은 걸까요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「それよりも、デート先もアキバばっかりだし、アニメとゲームとホビーの話ばかりだし……」"
translation = "「그보다 데이트장소도 아키바뿐이고, 애니랑 게임이랑 취미 이야기뿐이라……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしが振り回してばっかりのお付き合いで、会長さんは満足してないんじゃないかって……」"
translation = "「제가 휘두르기만 하는 연애라, 회장님이 만족하지 못하고 계신 건 아닐까 해서……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「会長さんは無理してあたしに合わせてくれてるのかなって……本当はもっと大人っぽいデートをしたいのかなって……」"
translation = "「회장님이 억지로 저한테 맞춰주고 계신 걸까 봐…… 사실은 좀 더 어른스러운 데이트를 하고 싶으신 건 아닐까 해서……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「いろいろ考えてたら、頭ん中、グルグルしちゃって……夜も眠れなくなっちゃって……セナリィ社長とミウにも心配されちゃいました」"
translation = "「이것저것 생각하다 보니 머릿속이 빙글빙글 돌아서…… 밤에도 잠을 못 자게 돼서…… 세나리 사장님이랑 미우한테도 걱정을 끼치고 말았어요」"

[[dialogue]]
speaker = "unk"
original = "君にはいつもの君のままでいてほしい"
translation = "너는 평소의 모습 그대로 있으면 좋겠어"

[[dialogue]]
speaker = "unk"
original = "周りのことなんて気にしないで"
translation = "주변 시선 따위는 신경 쓰지 마"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「本当に、本当ですか……？」"
translation = "「정말로, 정말인가요……?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「オシャレなデートスポットより、アキバショッピングの方が好きな女ですよ……？」"
translation = "「세련된 데이트 스폿보다 아키바 쇼핑을 더 좋아하는 여자라고요……?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ブランド品なんかより、スペシャルグレードのプラモで喜んじゃう女ですよ……？」"
translation = "「명품 같은 것보다 스페셜 그리드 프라모델에 기뻐하는 여자라고요……?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ちんちくりんだし……ううん、いつかはスラッとしてナイスバディでカッコいい女性になりますけど！」"
translation = "「땅꼬마에다가…… 아니, 언젠가는 날씬하고 나이스 바디인 멋진 여성이 되겠지만요!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「今のままで、本当にいいんですね？\u3000大好きな会長さんの言うことだから信じちゃいますよ？」"
translation = "「지금 이대로 정말 괜찮은 거죠? 좋아하는 회장님이 하시는 말씀이니까 믿어버릴 거라고요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あはっ……ありがとうございます。会長さんの口から聞けたら、元気出てきました！」"
translation = "「아하…… 감사합니다. 회장님 입으로 직접 들으니까 기운이 나네요!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「よーし、こんな怪我、すぐに治して現場復帰するぞー！」"
translation = "「좋ー아, 이런 부상 따위 금방 고치고 현장에 복귀하자ー!」"

[[dialogue]]
speaker = "unk"
original = "やっぱり、まっすぐで元気なヒマワリが一番可愛い。"
translation = "역시 솔직하고 활기찬 히마와리가 가장 귀엽다."

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「まったく、何に悩んでいるのかと思えば……」"
translation = "「참 나, 무슨 고민을 하나 했더니……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ヒマワリちゃん、基本的にオープンなのに、会長さんのことになると抱え込みがちですよね」"
translation = "「히마와리 양, 기본적으로 솔직하면서도 회장님에 관한 일이면 혼자 안고 가려는 경향이 있네요」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「あの２人、この上なくお似合いですのに、何を気にしているのやら。恋する乙女は複雑ですわね」"
translation = "「저 두 사람, 이이상 없을 정도로 잘 어울리는데 뭘 신경 쓰는 건지. 사랑하는 소녀는 복잡하군요」"

[[dialogue]]
speaker_original = "セナリィ"
speaker_translation = "세나리"
original = "「もうしばらく、ふたりきりにしておきましょうか。あの空気の間に入るのは、甘すぎて胃もたれしてしまいそうですわ」"
translation = "「조금 더 둘만 있게 해둘까요. 저 분위기 사이에 들어가는 건 너무 달아서 속이 거북해질 것 같아요」"

