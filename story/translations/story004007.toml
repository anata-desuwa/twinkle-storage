[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「シス！\u3000お久しぶりですねぇ！！」"
translation = "「시스! 오랜만이네요!!」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「……ちっ。邪魔者が来たの」"
translation = "「……쳇. 방해꾼이 온 거야」"

[[dialogue]]
speaker = "unk"
original = "……シスの知り合いか？"
translation = "……시스의 아는 사람인가?"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「ぜーんぜん♪\u3000知らないヤツなの♪」"
translation = "「전─혀♪ 모르는 녀석이야♪」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「会長。何だか目が虚ろというか……」"
translation = "「회장님. 어쩐지 눈이 공허하다고 해야 하나……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「……ダッチ様が仰っていた『支配』の影響でしょうか？」"
translation = "「……더치 님이 말씀하시던 『지배』의 영향일까요?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ええ。記憶が改竄されているようですね」"
translation = "「네. 기억이 개변되어 있는 것 같군요」"

[[dialogue]]
speaker = "unk"
original = "…………お前は？"
translation = "…………너는?"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「悲しいですねぇ、緋宮クロト様！\u3000私のことを思い出してもいただけないとは！」"
translation = "「슬프네요, 히미야 쿠로토 님! 저에 대해 떠올려 주시지도 못하다니!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「ヌッフフフ。しかしご安心を！\u3000すぐに貴方を呪縛から解き放ち──可憐なバニー服が似合う爆乳美少女に変身させてさしあげますよッ！！」"
translation = "「누후후후. 하지만 안심하십시오! 즉시 당신을 속박에서 풀어주고── 가련한 바니복이 어울리는 폭유 미소녀로 변신시켜 드리죠!!」"

[[dialogue]]
speaker = "unk"
original = "なんだかすごく……嫌な気分だ……"
translation = "어쩐지 엄청…… 불쾌한 기분이다……"

[[dialogue]]
speaker = "unk"
original = "……あんたとは初対面のはずだけど"
translation = "……당신과는 초면일 터인데"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「会長、目を覚まして！！\u3000貴方はそのロストアイテムに操られてるのよ！」"
translation = "「회장님, 정신 차려!! 당신은 그 로스트 아이템에 조종당하고 있어!」"

[[dialogue]]
speaker = "unk"
original = "……きみ、は？"
translation = "……너, 는?"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「九浄家メイド隊の羽宮蘭美よ！\u3000学園のリーダーなんでしょう、しゃんとしなさい！！」"
translation = "「구죠 가 메이드대의 하네미야 라미야! 학원의 리더잖아, 정신 똑바로 차려!!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「魔王様！\u3000私たちと共に帰りましょう！」"
translation = "「마왕님! 저희와 함께 돌아가지요!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「そうです会長。皆、心配しています……！」"
translation = "「맞습니다 회장님. 모두, 걱정하고 있습니다……!」"

[[dialogue]]
speaker = "unk"
original = "学園……星騎士……？"
translation = "학원…… 성기사……?"

[[dialogue]]
speaker = "unk"
original = "…………魔王？"
translation = "…………마왕?"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「……ごめんなさいなの、お兄ちゃん。ちょっとだけ、眠っててなの」"
translation = "「……미안하다는 거, 오빠. 잠깐만, 자고 있어라는 거」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あっ……！！」"
translation = "「앗……!!」"

[[dialogue]]
speaker = "unk"
original = "緋宮クロトの膝から力が抜け、その場にくずれ落ちる。"
translation = "히미야 쿠로토의 무릎에서 힘이 빠지고, 그 자리에 무너져 내린다."

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「イ～～～～♪」"
translation = "「이~~~~♪」"

[[dialogue]]
speaker = "unk"
original = "気を失った緋宮クロトを、シエスタの傀儡のモンスターたちが丁重に運び、安全なところまで移動させた──"
translation = "정신을 잃은 히미야 쿠로토를, 시에스타의 괴뢰 몬스터들이 정중히 운반해, 안전한 곳까지 이동시켰다──"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「これで気兼ねなく、お前たちをぶちのめせるの」"
translation = "「이걸로 꺼림칙함 없이, 너희들을 두들겨 패 줄 수 있다는 거」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「頭のおかしいヘンタイアイテム……そしてその眷属！\u3000手加減しないのっ！！」"
translation = "「머리가 이상한 변태 아이템…… 그리고 그 권속! 봐주지 않는다는 거!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「待ちなさい！\u3000誰が誰の眷属ですって！？」"
translation = "「기다리세요! 누가 누구의 권속이라는 거죠!?」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「ダッチと一緒にいて、『欲望』の壁でシスの力を弾いてるの！\u3000眷属でなくてなんなのっ！」"
translation = "「더치와 함께 있으면서, 『욕망』의 벽으로 시스의 힘을 튕겨내고 있다는 거! 권속이 아니면 뭐라는 거!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「屈辱だわっ。こんな奴の手下だと思われてるの、私！？」"
translation = "「굴욕이야. 이런 녀석의 부하라고 생각되다니, 나!?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「寂しいことを言わないでください、シス！\u3000久しぶりの兄妹の再会だというのに……」"
translation = "「섭섭한 말씀은 하지 말아 주세요, 시스! 오랜만의 남매 재회인데……」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「うるさいの！\u3000ヘンタイは喋るんじゃないの！\u3000お前なんかお兄ちゃんじゃないの！！\u3000死ねなの！！！」"
translation = "「시끄럽다는 거! 변태는 말하지 말라는 거! 너 따위 오빠가 아니라는 거!! 죽으라는 거!!!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ず、随分と嫌われているのですね、ダッチ様……？」"
translation = "「꽤, 굉장히 싫어하고 계신 거네요, 더치 님……?」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フフフ、反抗期なのですよ！\u3000そういうところも可愛いのですがね！！」"
translation = "「후후후, 반항기인 거랍니다! 그런 점도 귀엽지만 말이죠!!」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「ここで会ったが１００年目……八つ裂きにして、二度とその口利けないようにしてやるの！！！」"
translation = "「여기서 만난 게 백년째…… 갈기갈기 찢어서, 두 번 다시 그 입을 놀리지 못하게 해 주겠다는 거!!!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「反抗期ってレベルじゃないくらい嫌われてるじゃない！？\u3000貴方、何をしたのよ！？」"
translation = "「반항기라는 수준이 아닐 정도로 싫어하고 있잖아!? 당신, 무슨 짓을 한 거야!?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「兄妹仲は劣悪のようですが、やることは変わりません。ドリルのサビにしてさしあげましょう。ぴょんぴょん」"
translation = "「남매 사이는 열악한 것 같습니다만, 할 일은 변하지 않습니다. 드릴의 녹으로 만들어 드리죠. 깡총깡총」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ええ。容赦は致しません！\u3000ぴょんぴょん！」"
translation = "「네. 용서는 하지 않겠습니다! 깡총깡총!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「スピードで圧倒するわ……ぴょんっ！」"
translation = "「스피드로 압도하겠어…… 깡총!」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「フフフゥ！\u3000子ウサギたちのぴょんぴょんエールで、欲望シールドもギンギンですッ！\u3000行きますよ、皆様！！」"
translation = "「후후후! 아기 토끼들의 깡총깡총 응원으로, 욕망 실드도 팽팽합니다앗! 갑니다, 여러분!!」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「邪魔はさせないの……ようやく、ようやく理想のお兄ちゃんを手に入れたの！」"
translation = "「방해하게 두지 않는다는 거…… 드디어, 드디어 이상적인 오빠를 손에 넣었다는 거!」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「シスは──『妹』のロストアイテム！\u3000自分の世界を守るためにも、負けられないの！！」"
translation = "「시스는── 『여동생』의 로스트 아이템! 자신의 세계를 지키기 위해서도, 질 수 없다는 거!!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……『妹』？\u3000『支配』ではないのですか」"
translation = "「……『여동생』? 『지배』가 아닌 것입니까」"

[[dialogue]]
speaker_original = "ダッチ"
speaker_translation = "더치"
original = "「はて？\u3000私も初耳ですねぇ」"
translation = "「글쎄요? 저도 처음 듣는 이야기네요」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「お喋りは後にしなさい！\u3000来るわよっ！！」"
translation = "「수다는 나중에 해요! 온다고요!!」"

[[dialogue]]
speaker_original = "シエスタ"
speaker_translation = "シエスタ"
original = "「ウサギ狂いのヘンタイとその眷属──容赦しないの！！！」"
translation = "「토끼에 미친 변태와 그 권속── 용서하지 않는다는 거!!!」"

