[[dialogue]]
speaker = "unk"
original = "次の日も、クーシェンはメイド服を着て立っていた。"
translation = "다음 날도, 쿠셴은 메이드복을 입고 서 있었다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「いててて……メイド長は鬼かよ～」"
translation = "「아아아…… 메이드장은 악마냐고~」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「鬼です」"
translation = "「악마 맞습니다」"

[[dialogue]]
speaker_original = "フェニエル"
speaker_translation = "페니엘"
original = "「鬼って言う人もいますね」"
translation = "「악마라고 부르는 사람도 있긴 하죠」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「鬼は鬼でも、キリカはいい鬼だぞ！」"
translation = "「악마는 악마라도, 키리카는 착한 악마라고!」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「うふふっ、それはフォローになっていないかもしれませんね」"
translation = "「우후후, 그거 커버가 안 되는 것 같은데요」"

[[dialogue]]
speaker_original = "キリカ"
speaker_translation = "키리카"
original = "「アポロ様がいい鬼と言って下さったのですから、いい鬼と誇れる鬼になりましょう」"
translation = "「아폴로 님께서 착한 악마라고 말씀해 주셨으니, 착한 악마라고 자랑할 수 있는 악마가 됩시다」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「ほ、ほどほどにしてあげてね、キリカ」"
translation = "「적, 적당히 해줘, 키리카」"

[[dialogue]]
speaker = "unk"
original = "クーシェンとアポロ、２人の膝は仲良く赤くなっていた。"
translation = "쿠셴과 아폴로, 두 사람의 무릎은 사이좋게 붉어져 있었다."

[[dialogue]]
speaker = "unk"
original = "理由を訊ねても、２人は笑うだけだった。"
translation = "이유를 물어도, 두 사람은 웃기만 할 뿐이었다."

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「さーて、今日もメイド修行を頑張るぞ～！」"
translation = "「자~ 그럼, 오늘도 메이드 수행을 열심히 해볼까~!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ということでメイドの先輩たち、ボクにビシバシ指導してよねっ」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「……急にやる気を出しましたね。朝食に好物でも出たのでしょうか？」"
translation = "「……갑자기 의욕을 내는군요. 아침으로 좋아하는 거라도 나온 걸까요?」"

[[dialogue]]
speaker_original = "フェニエル"
speaker_translation = "페니엘"
original = "「うーん、なんとなくだけど違うんじゃないかな……」"
translation = "「으~음, 왠지 모르겠지만 그건 아닌 것 같은데……」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「まあ、やる気を出してくれたのはよいことです。相手が見習いメイドとは言え、こちらは指導役に選ばれた先輩ですから、しっかり励みましょう」"
translation = "「뭐, 의욕을 내준 건 좋은 일입니다. 상대가 견습 메이드라곤 하나, 이쪽은 지도역으로 뽑힌 선배이니, 확실히 힘냅시다」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「よろしくお願いしますっ、ナミエル先輩！\u3000フェニエル先輩！」"
translation = ""

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「お、おお……ここまで素直にされると、なんだか可愛く感じてきましたね」"
translation = "「오, 오오…… 이렇게까지 순분순분하게 나오니, 어쩐지 귀엽게 느껴지기 시작했네요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「クーシェンばっかズルいぞ～！\u3000あたしももっと厳しく教えてくれよな！」"
translation = "「쿠셴만 치사하다고~! 나한테도 더 엄하게 가르쳐줘!」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「お任せ下さい。さあ、フニさまもご一緒に」"
translation = "「맡겨주십시오. 자, 후니 님도 함께」"

[[dialogue]]
speaker = "unk"
original = "こうして心を入れ替えたクーシェンは、メイド修行に邁進するのだった。"
translation = "이렇게 마음을 고쳐먹은 쿠셴은, 메이드 수행에 매진하는 것이었다."

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「クーシェンさんは基礎からやり直しましょう。ですよね、マリオンさん」"
translation = "「쿠셴 씨는 기초부터 다시 시작하죠. 그렇죠, 마리온 씨」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「そうですね、てんでダメダメでしたから……」"
translation = "「그렇네요, 전연 엉망진창이었으니까……」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ボクってばそんなにダメダメだったの？」"
translation = "「나 그렇게나 엉망진창이었어?」"

[[dialogue]]
speaker_original = "マリオン"
speaker_translation = "마리온"
original = "「論より証拠、そうですね……フェニエルさん、少し歩いてみてもらえますか？」"
translation = "「백문이 불여일견, 그렇죠…… 페니엘 씨, 조금 걸어봐 주시겠어요?」"

[[dialogue]]
speaker_original = "フェニエル"
speaker_translation = "페니엘"
original = "「は、はい。歩くだけでいいんですよね」"
translation = "「네, 네. 걷기만 하면 되는 거죠」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「クーシェンさんはフニさまをよく見ていて下さい」"
translation = "「쿠셴 씨는 후니 님을 잘 보고 계세요」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「う、うん……って……フェニエル先輩、なんかすごくない？\u3000歩いてるだけなのに、オーラがあるっていうか……」"
translation = "「으, 응…… 그렇다 해도…… 페니엘 선배, 왠지 대단하지 않아? 걷고 있을 뿐인데, 오라가 있다고 해야 하나……」"

[[dialogue]]
speaker_original = "フェニエル"
speaker_translation = "페니엘"
original = "「えへへ～、そうですかねぇ？」"
translation = "「에헤헤~, 그런가요?」"

[[dialogue]]
speaker_original = "ナミエル"
speaker_translation = "나미엘"
original = "「星見家のメイドなら、このくらい出来て当たり前です」"
translation = "「호시미 가의 메이드라면, 이 정도는 기본입니다」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしも出来るぞ！\u3000ほらほら～」"
translation = "「나도 할 수 있다고! 봐봐~」"

[[dialogue]]
speaker_original = "フィオナ"
speaker_translation = "피오나"
original = "「姉さんさすがです、バッチリですよ」"
translation = "「언니 역시 대단해요, 완벽해요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「いや、あたしもまだまだだ。フェニエルのほうがずっときれいな歩き方だしな」"
translation = "「아니, 나도 아직 멀었어. 페니엘 쪽이 훨씬 예쁜 걸음걸이고말이야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「それでもボクより全然かっこいいよ！\u3000フェニエル先輩みたいには出来ないし、アポロに教えて欲しいな～って」"
translation = "「그치만 나보다 훨씬 멋지다고! 페니엘 선배처럼은 못 하고, 아폴로가 가르쳐줬으면 좋겠네~ 하고」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「じゃあ、一緒にやってみよう」"
translation = "「그럼, 같이 해보자」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「こ、こんな感じ？\u3000意識して歩くのって結構ムズいな～」"
translation = "「이, 이런 느낌? 의식하고 걷는 거 제법 어렵네~」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「スカートのすそを気にするといいぞ。ぺろんってならないように足を動かすんだ」"
translation = "「스커트 자락을 신경 쓰면 좋아. 펄럭이지 않도록 발을 움직이는 거야」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「な、なるほど……おー、確かにいい感じかも……」"
translation = "「그, 그렇구나…… 오ー, 확실히 좋은 느낌일지도……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「すごいな！\u3000一瞬でこんなによくなってる！」"
translation = "「대단한데! 순식간에 이렇게 좋아지다니!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「アポロのアドバイスのおかげだってば～」"
translation = "「아폴로의 조언 덕분이라니까~」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「こいつはうかうかしてらんないな。のんびりしてたらあっという間に追い越されちゃいそうだ」"
translation = "「이거 방심하고 있을 수가 없겠는걸. 멍하니 있다간 순식간에 추월당해 버리겠어」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「ふっふーん、すぐに追い越す予定だから覚悟してよね～」"
translation = "「후훗, 금방 추월할 예정이니까 각오하라고~」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「どっちがすごいメイドになるか、勝負だ！」"
translation = "「어느 쪽이 대단한 메이드가 될지, 승부다!」"

[[dialogue]]
speaker_original = "クーシェン"
speaker_translation = "쿠셰엔"
original = "「うん！」"
translation = "「응!」"

[[dialogue]]
speaker = "unk"
original = "クーシェンがやる気を出し、アポロが触発される。互いを高め合う好循環が発生していた。"
translation = "쿠셴이 의욕을 내고, 아폴로가 자극을 받는다. 서로를 끌어올려 주는 선순환이 발생하고 있었다."

