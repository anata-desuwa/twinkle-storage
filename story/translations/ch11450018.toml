[[dialogue]]
speaker = "unk"
original = "今日もヒメは小さい方の姿で、俺の膝の上に乗っていた。"
translation = "오늘도 히메는 작은 쪽의 모습으로, 내 무릎 위에 앉아 있었다."

[[dialogue]]
speaker = "unk"
original = "そして、抱っこしたままいつものように、羽や頭を撫でさせてもらっていると……"
translation = "그리고, 안아 든 채 평소처럼 날개나 머리를 쓰다듬게 해주고 있자니……"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そう言えば、この姿で……あれ、したことは無かったな……」"
translation = "「그러고 보니, 이 모습으로…… 그거, 한 적은 없었네……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「急に何を言い出した……？」"
translation = "「갑자기 무슨 말을 하는 거야……?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ふと思ってしまったのだ！\u3000魔王とは……恋人として何度か肌を重ねてきた……」"
translation = "「문득 생각나 버린 거다! 마왕과는…… 연인으로서 몇 번인가 살을 겹쳐 왔지만……」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「けれど、恥ずかしさが先に立って……思うままに振る舞うことが出来ていないように思う……」"
translation = "「하지만, 부끄러움이 앞서서…… 생각하는 대로 행동하지 못하고 있다고 생각해……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「イメージプレイの時はノリノリだけどな」"
translation = "「이미지 플레이를 할 때는 신나 하면서 말이지」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「あ、あれはそういう物だと割り切っているから出来るのであって……！」"
translation = "「그, 그거야 그런 거라고 단정 짓고 있으니까 할 수 있는 거라……!」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ともかく……この姿なら、もっと大胆に甘えることが出来るのではないかと思ったのだ……」"
translation = "「어쨌든…… 이 모습이라면, 좀 더 대담하게 어리광 부릴 수 있지 않을까 생각한 거다……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「確かにそれは興味深いかもしれない……試してみようか？」"
translation = "「확실히 그건 흥미로울지도 모르겠네…… 시도해 볼까?」"

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「いいか？\u3000お願いしても……」"
translation = "「괜찮을까? 부탁해도……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「もちろんだ。いっぱい大胆になって、いっぱい甘えてくれよ……」"
translation = "「당연하지. 잔뜩 대담해져서, 잔뜩 어리광 부려줘……」"

[[dialogue]]
speaker = "unk"
original = "それまで俺はヒメを膝の上に乗せて抱きしめていたが、それを離してベッドに横になる。"
translation = "그때까지 나는 히메를 무릎 위에 얹고 안고 있었지만, 그것을 떨어뜨리고 침대에 눕는다."

[[dialogue]]
speaker = "unk"
original = "するとヒメは足を広げて、自身の局部に俺のペニスを押し当てた。"
translation = "그러자 히메는 다리를 벌리고, 자신의 국부에 나의 페니스를 밀어붙였다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「魔王のここ……すごく大きくなっているな……」"
translation = "「마왕의 여기…… 엄청 커져 있네……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「その姿のヒメにまたがられてると、背徳感がすごくて……」"
translation = "「그 모습의 히메가 올라타 있으니까, 배덕감이 엄청나서……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「やはりこの姿の私は、魔王の性癖を歪めてしまっているのではないか……？」"
translation = "「역시 이 모습의 나는, 마왕의 성벽을 왜곡해 버리고 있는 게 아닐까……?」"

[[dialogue]]
speaker = "unk"
original = "そんなことはない、とキッパリ否定したいところだったが、下半身の反応的にあまりにも説得力に欠ける。"
translation = "그런 일은 없다고 딱 잘라 부정하고 싶은 참이었지만, 하반신의 반응상 너무나도 설득력이 부족하다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「本当に大きくしてしまって……んんっ……」"
translation = "「정말로 크게 만들어 버려서…… 응응쯧……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こんな……ぶっといち○ぽを見せつけられたら……はぁ……ち○ぽに甘えたくなってしまう……」"
translation = "「이런…… 굵디굵은 자지를 보여주면…… 하아…… 자지에 어리광 부리고 싶어져 버려……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いいよ。思う存分甘えてくれ」"
translation = "「좋아. 마음껏 어리광 부려줘」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ん……はぁ……魔王……魔王のち○ぽ……熱くて硬いち○ぽ……んんっ……」"
translation = "「응…… 하아…… 마왕…… 마왕의 자지…… 뜨겁고 단단한 자지…… 응응쯧……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こうして、おま○こにスリスリして……気持ちいい……」"
translation = "「이렇게, 보지에 쓱쓱 비비고…… 기분 좋아……」"

[[dialogue]]
speaker = "unk"
original = "嬉しそうな表情を浮かべて、局部にペニスを押し当てながら腰を前後に動かす。"
translation = "기쁜 듯한 표정을 지으며, 국부에 페니스를 밀어붙이면서 허리를 앞뒤로 움직인다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んっ、あ、んんん……自然に……動いてしまう……んっ、あ……んくぅ……んんっ……<emoji=heart04>」"
translation = "「응쯧, 아, 응응응…… 자연스럽게…… 움직여 버려…… 응쯧, 아…… 응쿠우…… 응응쯧……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、んっ……あっ……ち○ぽ……凄くて……もっと、甘えたい……いい、だろうか……魔王……んんっ……<emoji=heart04>」"
translation = "「하아, 응쯧…… 아…… 자지…… 대단해서…… 좀 더, 어리광 부리고 싶어…… 괜찮, 으려나…… 마왕…… 응응쯧……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「この大きなち○ぽで……私のこと……可愛がって……おま○この１番奥まで……甘やかして欲しい……<emoji=heart04>」"
translation = "「이 커다란 자지로…… 나를…… 귀여워해 줘…… 보지의 가장 안쪽까지…… 귀여워해 줬으면 좋겠어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あ……んんんっ……！！！」"
translation = "「아…… 응응응쯧……!!!」"

[[dialogue]]
speaker = "unk"
original = "ペニスの先端を局部に誘導し、そのままゆっくりと呑み込んでいく。"
translation = "페니스의 끝을 국부로 유도하고, 그대로 천천히 삼켜 간다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あっ！\u3000んん、あ……あぁあ、あ……はぁ、あああっ……！！」"
translation = "「하아, 아! 응응, 아…… 아아아, 아…… 하아, 아아앗……!!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「入って、来てるっ……身体、小さくなったから……まるで、初めて魔王を受け入れた時みたいだ……んんんっ……！」"
translation = "「들어, 오고 있어…… 몸, 작아졌으니까…… 마치, 처음 마왕을 받아들였을 때 같아…… 응응응쯧……!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「おま○こ、メリメリって裂きながら……私の中に入ってきてる……んんんっ……」"
translation = "「보지, 찌찢찌르르 찢으면서…… 내 안으로 들어오고 있어…… 응응응쯧……」"

[[dialogue]]
speaker = "unk"
original = "腰を落とし、奥深くまで俺のペニスを加え込む。"
translation = "허리를 내리고, 깊숙한 곳까지 내 페니스를 물어 담는다."

[[dialogue]]
speaker = "unk"
original = "熱っぽい息を漏らしながら、上体を反らし俺の方へ視線を向けてくる。"
translation = "열기 띤 숨을 내쉬며, 상체를 젖혀 내 쪽으로 시선을 돌린다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「魔王……キス、したい……いいだろうか……？」"
translation = "「마왕…… 키스, 하고 싶어…… 괜찮을까……?」"

[[dialogue]]
speaker = "unk"
original = "髪がはらりと垂れ、ヒメの香りが鼻孔をくすぐる。"
translation = "머리카락이 풀썩 늘어지고, 히메의 향기가 콧가를 간지럽힌다."

[[dialogue]]
speaker = "unk"
original = "それに誘われるように顔を近づけ、唇を触れ合わせた。"
translation = "그것에 이끌리듯 얼굴을 가까이 가져가, 입술을 맞대었다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んっ、は……ん、ちゅ……んんっ、ふ……んっ、んっ、ん……は……んんふっ……ちゅ、は……<emoji=heart04>」"
translation = "「응쯧, 하…… 응, 츄…… 응응쯧, 후…… 응쯧, 응쯧, 응…… 하…… 응응후쯧…… 츄, 하……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ふぁ……この体勢だと……キスするの、苦しいな……失敗だったか……？」"
translation = "「후아…… 이 자세라면…… 키스하는 거, 괴롭네…… 실패였나……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そんなことないよ」"
translation = "「그렇지 않아」"

[[dialogue]]
speaker = "unk"
original = "そう言って俺は、ヒメの背中や首筋についばむようなキスを繰り返す。"
translation = "그렇게 말하며 나는, 히메의 백이나 목덜미에 쪼는 듯한 키스를 반복한다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「は……あっ……<emoji=heart04>\u3000んんっ、あっ、は、あああ……んんっ、あっ、あ……あぁあ……んんっ……はぁ……<emoji=heart04>」"
translation = "「하…… 아앗……<emoji=heart04> 응응쯧, 아앗, 하, 아아아…… 응응쯧, 아앗, 아…… 아아아…… 응응쯧…… 하아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あぁあ……いっぱいキス、あちこちにされたら……嬉しくなってしまう……<emoji=heart04>\u3000あっ、んぅ、う……魔王……あ、は、あぁあ……<emoji=heart04>」"
translation = "「아아아…… 잔뜩 키스, 여기저기에 당하면…… 기뻐져 버려……<emoji=heart04> 아앗, 응으, 우…… 마왕…… 아, 하, 아아아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "唇の軽い刺激が心地よいのか、ヒメが声を震わせる。"
translation = "입술의 가벼운 자극이 기분 좋은지, 히메가 목소리를 떨군다."

[[dialogue]]
speaker = "unk"
original = "そして、結合部が何かを促すようにペニスを締め付けてきた。"
translation = "그리고, 결합부가 무언가를 촉구하듯 페니스를 조여 왔다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヒメ……動くよ……」"
translation = "「히메…… 움직일게……」"

[[dialogue]]
speaker = "unk"
original = "優しくヒメの身体を押し上げるように動き始める。"
translation = "상냥하게 히메의 몸을 밀어 올리듯 움직이기 시작한다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あ……んんっ……キスされながら……んんっ……ち○ぽ、動かされるの……気持ちいい、ぞ……んんっ……<emoji=heart04>」"
translation = "「하아, 아…… 응응쯧…… 키스당하면서…… 응응쯧…… 자지, 움직여지는 거…… 기분 좋아…… 응응쯧……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「おま○このなか……ゆっくり動いて……よしよしされてるみたいだ……あ、ああんっ……<emoji=heart04>」"
translation = "「보지의 안…… 천천히 움직여서…… 쓰다듬어지고 있는 것 같아…… 아, 아앙쯧……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こんな、のっ……どこまでも……気持ちよくなってしまう……あっ、あっ、んっ……<emoji=heart04>」"
translation = "「이런, 거…… 어디까지나…… 기분 좋아져 버려…… 아앗, 아앗, 응쯧……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "快感を訴える声を漏らしながら、ヒメ自身もゆっくりと腰をグラインドさせる。"
translation = "쾌감을 호소하는 목소리를 내며, 히메 자신도 천천히 허리를 그라인드시킨다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あ……あぁあ……ち○ぽに甘やかされて……んんっ、あ……こんなに、優しくされてるのに……あっ、ああっ……<emoji=heart04>」"
translation = "「하아, 아…… 아아아…… 자지에 예쁨받아서…… 응응쯧, 아…… 이렇게, 상냥하게 대해지고 있는데…… 아앗, 아아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「壊れてしまいそうなくらい……感じてるんだ……んっ、ああ、あっ……んんぅ……魔王っ……んくぅ……<emoji=heart04>」"
translation = "「망가져 버릴 것 같을 정도로…… 느끼고 있어…… 응쯧, 아아, 아앗…… 응응으…… 마왕…… 응쿠우……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "その言葉が本当であると示すように、膣内に潜り込ませたペニスに強烈な締め付けが襲ってくる。"
translation = "그 말이 사실임을 증명하듯, 질내에 파고들게 한 페니스에 강렬한 조임이 밀려온다."

[[dialogue]]
speaker = "unk"
original = "こんなに締め付けられたら、こっちだって壊れてしまいそうだ。"
translation = "이렇게 조여지면, 이쪽이야말로 망가져 버릴 것 같다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あっ、ああ……あっ、ん、あ、ああっ……<emoji=heart04>\u3000んん、ぁ、ああ……はぁ、あっ……んっ、ふ、あぁああ……<emoji=heart04>」"
translation = "「하아, 아앗, 아아…… 아앗, 응, 아, 아아앗……<emoji=heart04> 응응, 아, 아아…… 하아, 아앗…… 응쯧, 후, 아아아아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヒメのおま○こを味わいながら、両手で滑らかな肌をなぞる。"
translation = "히메의 보지를 맛보면서, 양손으로 매끄러운 피부를 훑는다."

[[dialogue]]
speaker = "unk"
original = "熱を帯びて汗ばんだヒメの身体は、まるで磁石のように俺の手を吸い付かせた。"
translation = "열을 띠고 땀에 젖은 히메의 몸은, 마치 자석처럼 내 손을 들러붙게 만들었다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あ……んんっ……<emoji=heart04>\u3000そんな、優しい手つきで……撫でまわして……はぁ、ああぁあ……<emoji=heart04>」"
translation = "「아…… 응응쯧……<emoji=heart04> 그런, 상냥한 손길로…… 어루만지고…… 하아, 아아아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「撫でられるの……好きだろう……？」"
translation = "「쓰다듬어지는 거…… 좋아하지……?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んん……好き……<emoji=heart04>\u3000嬉しい……もっと、撫でて欲しい……んぅうう……<emoji=heart04>」"
translation = "「응응…… 좋아……<emoji=heart04> 기뻐…… 좀 더, 쓰다듬어 줬으면 좋겠어…… 응으우우……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「おま○こ……突きながら……全身くまなく……魔王の手に愛撫されたい……んっ、あっ、あぁああっ……<emoji=heart04>」"
translation = "「보지…… 찌르면서…… 전신 구석구석…… 마왕의 손에 애무당하고 싶어…… 응쯧, 아앗, 아아아앗……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "手のひらが肌を滑るたびに、ヒメは身体をビクンと震わせて鋭敏な反応を示す。"
translation = "손바닥이 피부를 지칠 때마다, 히메는 몸을 흠칫 떨며 민감한 반응을 보인다."

[[dialogue]]
speaker = "unk"
original = "そして柔肌だけでなく、背中で可愛く揺れている羽にも手を伸ばした。"
translation = "그리고 부드러운 살결뿐만 아니라, 등 뒤에서 귀엽게 흔들리고 있는 날개에도 손을 뻗었다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あ……羽も……触って……んんっ、あっ、あああ……<emoji=heart04>」"
translation = "「하아, 아…… 날개도…… 만져줘…… 응응쯧, 아앗, 아아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あああっ……んっ、あっ、はぁあ……あっ……や……んんっ、ああ……<emoji=heart04>\u3000はぁっ、はぁっ、はぁ、あっ……ああ、あ、ああぁあ……<emoji=heart04>」"
translation = "「아아앗…… 응쯧, 아앗, 하아아…… 아앗…… 싫…… 응응쯧, 아아……<emoji=heart04> 하앗, 하앗, 하아, 아앗…… 아아, 아, 아아아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んっ……<emoji=heart04>\u3000羽と一緒に……おっぱいも……触るのか……？\u3000んんっ、あっ……あぁあ……<emoji=heart04>」"
translation = "「응쯧……<emoji=heart04> 날개랑 같이…… 가슴도…… 만지는 거야……? 응응쯧, 아앗…… 아아아……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "小さな体にアンバランスな豊乳を、下から持ち上げるようにして揉みほぐす。"
translation = "작은 몸에 언밸런스한 풍만한 가슴을, 아래에서 올려놓듯 주무른다."

[[dialogue]]
speaker = "unk"
original = "その弾力に夢中になりながら、ペニスの先端でヒメの子宮を圧迫した。"
translation = "그 탄력에 열중하면서, 페니스의 끝으로 히메의 자궁을 압박했다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あっ、あ、あっ、あっ……んふぅ……んんっ……<emoji=heart04>\u3000そこ……いい……気持ちいい……魔王っ……あっ、ああんっ……<emoji=heart04>」"
translation = "「아앗, 아, 아앗, 아앗…… 응후우…… 응응쯧……<emoji=heart04> 거기…… 좋아…… 기분 좋아…… 마왕…… 아앗, 아앙쯧……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「は、あ、ああっ……<emoji=heart04>\u3000んっ、あっ……あぁあ……奥の方……責められると……弱いんだ……<emoji=heart04>」"
translation = "「하, 아, 아아앗……<emoji=heart04> 응쯧, 아앗…… 아아아…… 깊은 곳…… 괴롭혀지면…… 약해……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「小さくなっても好きなところは同じなんだな……」"
translation = "「작아져도 좋아하는 부분은 똑같구나……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ん……そう、みたいだ……奥、以外のところも……気持ちいい、が……特にそこは……弱いから……んんんっ、あっ、あ、ああっ……<emoji=heart04>」"
translation = "「응…… 그런, 가 봐…… 깊은 곳, 이외의 부분도…… 기분 좋아, 지만…… 특히 거기는…… 약하니까…… 응응응쯧, 아앗, 아, 아아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「だから……おっぱいを揉まれながら……ち○ぽでいじめられると……んんっ、すぐに、切なくなって……あ、ああっ……<emoji=heart04>」"
translation = "「그러니까…… 가슴을 주물러지면서…… 자지로 괴롭혀지면…… 응응쯧, 금방, 안달 나서…… 아, 아아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「もっと欲しくなる……？」"
translation = "「좀 더 원하게 돼……?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「い、言わせないで……くれ……んんっ、あっ……分かってる、だろう……んっ、あっ、ああっ……<emoji=heart04>」"
translation = "「말, 말하게 하지 말아…… 줘…… 응응쯧, 아앗…… 알고 있, 잖아…… 응쯧, 아앗, 아아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああ、分かってる……だからヒメが甘えてくれたら、ヒメのして欲しいことしてあげるよ……」"
translation = "「아아, 알고 있어…… 그러니까 히메가 어리광 부려주면, 히메가 하고 싶은 거 해줄게……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁうぅ……そんな、意地悪なことっ……んんっ……<emoji=heart04>\u3000だけど、私も……魔王に、甘えたいから……だから……」"
translation = "「하아우으…… 그런, 짓궂은 소릴…… 응응읏……<emoji=heart04> 그렇지만, 나도…… 마왕한테, 어리광 부리고 싶으니까…… 그러니까……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「魔王……あなたの逞しい、ち○ぽで……私のおま○こ……激しくズボズボして欲しい……<emoji=heart04>」"
translation = "「마왕…… 당신의 억센, 자지로…… 내 보지…… 격렬하게 푸욱푸욱 해줬으면 좋겠어……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あっ……！\u3000あぁああんっ！！」"
translation = "「아앗……! 아아아앙쯧!!」"

[[dialogue]]
speaker = "unk"
original = "普段のヒメからは出てこない可愛らしいおねだりを聞いて、一気に興奮が高まる。"
translation = "평소의 히메에게서는 나오지 않는 귀여운 조르기를 듣고, 일기해 흥분이 고조된다."

[[dialogue]]
speaker = "unk"
original = "ヒメの身体を両手でしっかり捕まえた俺は、先程よりも強めに下半身を突き上げる。"
translation = "히메의 몸을 양손으로 확실히 잡은 나는, 아까보다 강하게 하반신을 쳐올린다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぉっ、おっ、んんっ……あ、あ、ああっ……！\u3000んんっ、おっ、お、おぉおっ……ん、おおおっ……！」"
translation = "「응오쯧, 오쯧, 응응쯧…… 아, 아, 아아앗……! 응응쯧, 오쯧, 오, 오오오쯧…… 응, 오오오쯧……!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんうっ……！\u3000ち○ぽがっ、んんっ、お、奥っ……一気に、ズブッってしてっ、ん……ひ、あっ……あぁあ、あっ、あ……ん、んぉぉっ！」"
translation = "「응응우쯧……! 자지가쯧, 응응쯧, 깊, 깊은 곳쯧…… 한 번에, 푸욱 하고 해줘쯧, 응…… 히, 아앗…… 아아아, 아앗, 아…… 응, 응오오쯧!」"

[[dialogue]]
speaker = "unk"
original = "ヒメの声色が獣じみたものに変わる。"
translation = "히메의 목소리가 짐승 같은 것으로 변한다."

[[dialogue]]
speaker = "unk"
original = "深く染みわたるような快感は、激しく押し寄せる官能の波に変化した。"
translation = "깊이 스며드는 듯한 쾌감은, 격렬하게 밀려드는 관능의 파도로 변화했다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ひ、んうっ、んんっ……！\u3000ん、ぁ、ああっ……や、ぁああ……んんっ、おっ、お、おぉお、んっ、お、おおおっ……！」"
translation = "「히, 응우쯧, 응응쯧……! 응, 아, 아아앗…… 아, 아아아…… 응응쯧, 오쯧, 오, 오오오, 응쯧, 오, 오오오쯧……!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「しゅ、ごいっ……そんな、激しく、されたらっ……！\u3000んんっ、おっ……お、おおおっ……！」"
translation = "「대, 대단해쯧…… 그렇게, 격렬하게, 당하면쯧……! 응응쯧, 오쯧…… 오, 오오오쯧……!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ちっちゃくなった、私のおま○こっ……！\u3000壊れちゃうかも、しれないのにっ……んおっ、おっ、おおぉおっ……！」"
translation = "「작아진, 내 보지쯧……! 망가져 버릴지도, 모르는데쯧…… 응오쯧, 오쯧, 오오오쯧……!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「力いっぱひ……突いてくるっ……おぉおっ……！\u3000なのに、うれひいっ！\u3000激しくしてくれるの、うれひいぃいっ<emoji=heart04>」"
translation = "「힘껏…… 찔러와쯧…… 오오오쯧……! 그런데도, 기뻐어! 격렬하게 해주는 거, 기뻐어어쯧<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んおっ、おっ、おおおっ……<emoji=heart04>\u3000お、んんっ、んぅ、んんっ……<emoji=heart04>\u3000んっ、んっ、んんっ<emoji=heart04>\u3000おおぉおっ、おっ、おおおっ<emoji=heart04>」"
translation = "「응오쯧, 오쯧, 오오오쯧……<emoji=heart04> 오, 응응쯧, 응으, 응응쯧……<emoji=heart04> 응쯧, 응쯧, 응응쯧<emoji=heart04> 오오오쯧, 오쯧, 오오오쯧<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "全身で歓ぶように、苦悶の叫びを上げるヒメ。"
translation = "전신으로 기뻐하듯, 고뇌의 비명을 지르는 히메."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんっ、んっ、あ、ああっ……<emoji=heart04>\u3000い、いいっ……すごく……んんっ、いいっ<emoji=heart04>\u3000んんっ、んっ、んっ、あ、ぁああ、んっ、んぅううっ<emoji=heart04>」"
translation = "「응응쯧, 응쯧, 아, 아아앗……<emoji=heart04> 조, 좋아…… 엄청…… 응응쯧, 좋아<emoji=heart04> 응응쯧, 응쯧, 응쯧, 아, 아아아, 응쯧, 응으우우쯧<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「来てるぅっ<emoji=heart04>\u3000壊れる、ぎりぎり手前のっ<emoji=heart04>\u3000１番、気持ちよくなれるの、来てるっ！\u3000んっ、おっ、おおっ<emoji=heart04>」"
translation = "「오고 있어어<emoji=heart04> 망가지기, 직전의<emoji=heart04> 가장, 기분 좋아질 수 있는 거, 오고 있어! 응쯧, 오쯧, 오오쯧<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こんなの、気持ちよすぎるっ<emoji=heart04>\u3000んんっ、こんなの、味わわされたら、私っ、魔王セックスに夢中になっちゃうっ……<emoji=heart04>」"
translation = "「이런 거, 너무 기분 좋아쯧<emoji=heart04> 응응쯧, 이런 거, 맛보게 되면, 나쯧, 마왕 섹스에 빠져버려쯧……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「抜けらせられなくなるっ<emoji=heart04>\u3000セックスに夢中にさせられるっ<emoji=heart04>\u3000んぉっ、おっ、おおっ、ほ、おおおっ<emoji=heart04>\u3000おっ、おっ、おっ、お、おおっ<emoji=heart04>」"
translation = "「헤어 나올 수 없게 돼쯧<emoji=heart04> 섹스에 빠지게 돼쯧<emoji=heart04> 응오쯧, 오쯧, 오오쯧, 호, 오오오쯧<emoji=heart04> 오쯧, 오쯧, 오쯧, 오, 오오쯧<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でも、止めて欲しくないよな……？」"
translation = "「하지만, 멈추지 않았으면 좋겠지……?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「止めないでっ<emoji=heart04>\u3000セックスっ、続けてぇっ<emoji=heart04>\u3000もっと、いっぱひ、私のこと……きもひよく、させてくれぇえっ<emoji=heart04>」"
translation = "「멈추지 말아줘어<emoji=heart04> 섹스쯧, 계속해줘어<emoji=heart04> 좀 더, 많이이, 나를…… 기분 좋게, 해줘어어쯧<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヒメの求めに応じて、更に激しくペニスで膣内をかき回す。"
translation = "히메의 요구에 응해, 더욱 격렬하게 페니스로 질내를 휘젓는다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぉ、おっ、おっ、お、おおっ<emoji=heart04>\u3000おおっ<emoji=heart04>\u3000おっ<emoji=heart04>\u3000おっ<emoji=heart04>\u3000おぉお<emoji=heart04>\u3000お、おおっ、んんっ、ん、おぉおおっ<emoji=heart04>」"
translation = "「응오, 오쯧, 오쯧, 오, 오오쯧<emoji=heart04> 오오쯧<emoji=heart04> 오쯧<emoji=heart04> 오쯧<emoji=heart04> 오오오<emoji=heart04> 오, 오오쯧, 응응쯧, 응, 오오오오쯧<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「声っ、止まらなひっ、んんっ、おっ、おおっ、おっ、おおっ<emoji=heart04>\u3000んぉおおおっ<emoji=heart04>\u3000おぉ、お<emoji=heart04>\u3000お<emoji=heart04>\u3000おおおっ<emoji=heart04>」"
translation = "「목소리쯧, 멈추지 않아아, 응응쯧, 오쯧, 오오쯧, 오쯧, 오오쯧<emoji=heart04> 응오오오오쯧<emoji=heart04> 오오, 오<emoji=heart04> 오<emoji=heart04> 오오오쯧<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こんなに、小さい、女の子の格好、なのにっ<emoji=heart04>\u3000おほぉっ<emoji=heart04>\u3000おっ、おっ<emoji=heart04>\u3000おおっ<emoji=heart04>\u3000げ、下品に、叫んでっ<emoji=heart04>\u3000んぉ、おっ、おおっ<emoji=heart04>」"
translation = "「이렇게, 작은, 여자아이 모습, 인데도쯧<emoji=heart04> 오호오쯧<emoji=heart04> 오쯧, 오쯧<emoji=heart04> 오오쯧<emoji=heart04> 지, 저질스럽게, 소리치고쯧<emoji=heart04> 응오, 오쯧, 오오쯧<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あたま、まっひろに、なってきてっ<emoji=heart04>\u3000んんっ、んっ、んうぅうっ<emoji=heart04>\u3000呂律も、まわらなく、なってひて……んんっ、お、おぉお、お、んんうっ<emoji=heart04>」"
translation = "「머리, 하얗게, 되어버려서쯧<emoji=heart04> 응응쯧, 응쯧, 응우우우쯧<emoji=heart04> 혀도, 안 돌아가게, 되어버리구…… 응응쯧, 오, 오오오, 오, 응응우쯧<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「魔王の、ち○ぽっ！\u3000わらひのことっ、どこまで気持ちよく、するのらぁっっ、あ、ああんっっ<emoji=heart04>」"
translation = "「마왕의, 자지쯧! 나를쯧, 어디까지 기분 좋게, 하려는 거야아쯧쯧, 아, 아앙쯧쯧<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「わらひの、おま○こもっ<emoji=heart04>\u3000ち○ぽに乱暴、されること、喜んでてっ<emoji=heart04>\u3000あ、んんっ、んぉうっ、おっ、おぉお<emoji=heart04>\u3000もう、止まらなひのぉおっっ<emoji=heart04><emoji=heart04>」"
translation = "「내, 보지도쯧<emoji=heart04> 자지한테 험하게, 당하는 거, 기뻐하고 있어서쯧<emoji=heart04> 아, 응응쯧, 응오우쯧, 오쯧, 오오오<emoji=heart04> 이제, 안 멈춰어어쯧쯧<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ヒメの歓喜の声が高まっていく。"
translation = "히메의 환희의 목소리가 높아져 간다."

[[dialogue]]
speaker = "unk"
original = "快感に全て曝け出した声が、俺の絶頂感もどんどん高めていってくれる。"
translation = "쾌감에 모든 것을 다 내던진 목소리가, 나의 절정감도 점점 더 높여준다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんっ、あ、ううんっ<emoji=heart04>\u3000まおう、のっ、ち○ぽも、おま○こで、ビクビクいってりゅっ<emoji=heart04><emoji=heart04>」"
translation = "「응읏, 아, 우응읏<emoji=heart04> 마왕, 의, 자지도, 보지에서, 찌릿찌릿거리고 있쮸<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぉおおっ、お、お、おおっ<emoji=heart04>\u3000まおうっ<emoji=heart04>\u3000まおうっ<emoji=heart04>\u3000ち○ぽが、ち○ぽがぁ、ち○ぽ、ち○ぽがぁっ<emoji=heart04>」"
translation = "「응오오읏, 어, 어, 오오읏<emoji=heart04> 마왕앗<emoji=heart04> 마왕앗<emoji=heart04> 자지가, 자지가아, 자지, 자지가아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「出して、くりぇっ<emoji=heart04>\u3000んっ、あっ、ああっ<emoji=heart04>\u3000中出しっ、しゃせーっ、しゃせーをっ、わらひの中でっ<emoji=heart04>\u3000あ、ああっ、あっ、ん、ぁ、ああっ<emoji=heart04>」"
translation = "「싸줘, 줘어<emoji=heart04> 응읏, 아, 아아읏<emoji=heart04> 안에 싸줘, 정액을, 정액을, 나 중에서어<emoji=heart04> 아, 아아읏, 앗, 응, 아, 아아읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「わらひの、ちっちゃなおま○こを……まおうの特濃せーえきでっ<emoji=heart04>\u3000んんっ、ぁ、んんっ……いっぱいにひてぇえっ<emoji=heart04>」"
translation = "「나의, 조그마한 보지를…… 마왕의 특농 정액으로오<emoji=heart04> 응응읏, 아, 응응읏…… 가득 채워줘어어<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あぁあっ、らめっ、らめらめ、らめぇっ<emoji=heart04>\u3000いくっ<emoji=heart04>\u3000いくっ<emoji=heart04>\u3000いっちゃうっ<emoji=heart04>\u3000わらひもっ<emoji=heart04>\u3000あっ、あぁあ、あ、あああっ！」"
translation = "「아아앗, 안돼엣, 안돼안돼, 안돼애<emoji=heart04> 간다<emoji=heart04> 간다<emoji=heart04> 가버려어<emoji=heart04> 나도오<emoji=heart04> 앗, 아아아, 아, 아아앗!」"

[[dialogue]]
speaker = "unk"
original = "搾り取ろうとするように、結合部の締め付けがこれ以上ないほど強くなる。"
translation = "쥐어짜 내려는 듯이, 결합부의 조임이 더할 나위 없이 강해진다."

[[dialogue]]
speaker = "unk"
original = "俺はヒメの最深部に欲望の限りを解き放とうと、意識を下半身に集中させた。"
translation = "나는 히메의 가장 깊은 곳에 욕망이 닿는 한 조여 오는 하반신에 의식을 집중했다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ああっ、あっ、あっ！\u3000んっ、あっ、あああっ！\u3000あ、んんっ、あっ、あ、あああっ！」"
translation = "「아아읏, 앗, 앗! 응읏, 앗, 아아앗! 아, 응응읏, 앗, 아, 아아앗!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「いぐっ！\u3000わらひ、いぐっ！\u3000んんっ！\u3000まおうの子種、受け入れられりゅっ！\u3000んんっ、あっ、あ、あああっ！」"
translation = "「가아! 나, 가아! 응응읏! 마왕의 씨앗, 받아들여져어! 응응읏, 앗, 아, 아아앗!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「びゅっびゅって、してっ！\u3000あつぅい液体っ、わらひのおま○こに、いっぱい注ぎ込んでっ！\u3000んっ、あっ、あ、あああっ！」"
translation = "「쀼뷰욱 하고, 해줘! 뜨거운 액체, 나의 보지에, 가득 쏟아부어줘! 응읏, 앗, 아, 아아앗!」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんっ、んっ、ん、んんっ<emoji=heart04>\u3000んぉ、おっ、おっ、んっ、ん、んんぅっ<emoji=heart04>\u3000く、るぅっ、んんっ<emoji=heart04>\u3000んぉ、お、おぉおっ、おっ、おぉおおおっ……」"
translation = "「응응읏, 응읏, 응, 응응읏<emoji=heart04> 응오, 오읏, 오읏, 응읏, 응, 응응으읏<emoji=heart04> 구, 러어읏, 응응읏<emoji=heart04> 응오, 오, 오오오읏, 오읏, 오오오오오읏……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぉおおおおおおおおおおおっ！！\u3000おおおっ、おっ、おっ、おぉおおお～～～っ！！！」"
translation = "「응오오오오오오오오오오읏!! 오오오읏, 오읏, 오읏, 오오오오오~~~읏!!!」"

[[dialogue]]
speaker = "unk"
original = "絶頂の叫びと共に、俺の上でヒメの身体が大きく痙攣する。"
translation = "절정의 부르짖음과 함께, 내 위에서 히메의 몸이 크게 경련한다."

[[dialogue]]
speaker = "unk"
original = "と、同時に俺はあらん限りの精を、ヒメの中で勢いよく解き放った。"
translation = "과 동시에, 나는 가진 바 모든 정액을 히메의 안에 세차게 쏟아내었다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ほぉおっ！\u3000おっ！\u3000んんっ、おっ、おおっ！\u3000んっ、んぅううっ……！」"
translation = "「호오오읏! 오읏! 응응읏, 오읏, 오오읏! 응읏, 응으우우읏……!」"

[[dialogue]]
speaker = "unk"
original = "瞬く間に、熱い液体が膣内を満たし、収まりきらなくなった白濁液があふれてくる。"
translation = "순식간에 뜨거운 액체가 질 내를 채우고, 다 담기지 못한 백탁액이 넘쳐흐른다."

[[dialogue]]
speaker = "unk"
original = "ヒメは呼吸を苦しくさせながらも、懸命に膣口を締めて、それをこぼさないようにしているかのようだった。"
translation = "히메는 숨을 가쁘게 쉬면서도, 젖먹던 힘까지 다해 질구를 조여 그걸 흘리지 않으려는 듯 보였다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんっ……ふ……んんぅ……<emoji=heart04>\u3000んん……<emoji=heart04>\u3000んぁ、ん……んんぅ……<emoji=heart04>」"
translation = "「응응읏…… 후…… 응응으……<emoji=heart04> 응응……<emoji=heart04> 응아, 응…… 응응으……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ち○ぽ……どくどくしてりゅっ……<emoji=heart04>\u3000こんな小さなわらひを……容赦なく孕ませようとしてりゅぅ……んんっ……<emoji=heart04>」"
translation = "「자지…… 꿀렁꿀렁거리고 있어어……<emoji=heart04> 이렇게 작은 나를…… 용서 없이 임신시키려고 하고 있어어…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヒメも……こんなにぎちぎちに締め付けて……孕みたがってるじゃないか……」"
translation = "「히메도…… 이렇게 꽉 쪼여대고…… 임신하고 싶어 하고 있잖아……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「らってぇ……んんっ……せぇし、あったかひ……んんっ……<emoji=heart04>\u3000お腹の中に、たまってくの……気持ちひぃ、からぁ……んんっ……<emoji=heart04>」"
translation = "「그치마안…… 응응읏…… 정자, 따뜻해에…… 응응읏……<emoji=heart04> 배 속에, 쌓여가는 거…… 기분 좋으니까아…… 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「離したくない……んんっ、まおうのち○ぽ……でっかいち○ぽぉ……んんっ、ぁ、んんっ……<emoji=heart04>」"
translation = "「놓아주고 싶지 않아…… 응응읏, 마왕의 자지…… 커다란 자지이…… 응응읏, 아, 응응읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "意識を虚ろにしながら、ヒメは歓喜の言葉を漏らす。"
translation = "의식을 몽롱하게 하면서, 히메는 환희의 말을 흘린다."

[[dialogue]]
speaker = "unk"
original = "互いの意識が噛み合ったように、俺はヒメに出し尽くし、ヒメは俺を絞りつくし──"
translation = "서로의 의식이 딱 맞물린 것처럼, 나는 히메에게 전부 쏟아붓고, 히메는 나를 쥐어짜 내며──"

[[dialogue]]
speaker = "unk"
original = "ようやく絶頂の波が引いてきたところで、ヒメの膣内からペニスを引き抜いた。"
translation = "겨우 절정의 파도가 차분해질 무렵, 히메의 질 내에서 페니스를 빼냈다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぁううっ……んんっ……」"
translation = "「응아우우읏…… 응응읏……」"

[[dialogue]]
speaker = "unk"
original = "俺の注ぎ込んだ白濁液が、音を立ててあふれ出る。"
translation = "내가 쏟아부은 백탁액이 소리를 내며 울컥 쏟아져 나온다."

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ……ぁ……はぁ……んっ……ん、んぅ……んんん……」"
translation = "「하아…… 아…… 하아…… 응읏…… 응, 응으…… 응응응……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「は、ふへ……えへへ……どう、だろうか……魔王……私は、十分に甘えられていただろうか……？」"
translation = "「하, 후헤…… 에헤헤…… 어떨, 까나…… 마왕…… 나는, 충분히 응석 부린 걸까……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「自分ではどう思う……？」"
translation = "「스스로는 어떻게 생각해……?」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「甘えた……いっぱい、甘えられたと思う……」"
translation = "「응석 부렸어…… 잔뜩, 응석 부렸다고 생각해……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そうだな。すごく可愛かったし……大胆だった……」"
translation = "「그래. 엄청 귀여웠고…… 대담했어……」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ふふ……魔王も……いつもより興奮していたのではないか……？\u3000となると、やはり小さい身体の方が魔王の性癖には合うのだろうか……」"
translation = "「후후…… 마왕도…… 평소보다 흥분해 있던 거 아닌가……? 그렇다면 역시 작은 몸 쪽이 마왕의 성벽에는 맞는 걸까나……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そういうわけじゃないって……言っただろ、ヒメが甘えてくれるなら、それだけで俺はいつも嬉しいって」"
translation = "「그런 게 아니라고…… 말했잖아, 히메가 응석을 부려준다면, 그것만으로 나는 항상 기쁘다고」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「そうか……ふふ、ありがとう……」"
translation = "「그렇구나…… 후후, 고마워……」"

[[dialogue]]
speaker = "unk"
original = "満足げな笑みを浮かべるヒメ。"
translation = "만족스러운 미소를 짓는 히메."

[[dialogue]]
speaker = "unk"
original = "俺たちはそのまま絶頂の余韻に浸りながら、その後もずっと甘え合ったのだった。"
translation = "우리들은 그대로 절정의 여운에 젖은 채, 그 후로도 내내 서로 응석을 부렸다."

[[dialogue]]
speaker = "unk"
original = "そして、後日──"
translation = "그리고 며칠 뒤──"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「わ、私は……なんてことを……」"
translation = "「내, 나는…… 무슨 짓을……」"

[[dialogue]]
speaker = "unk"
original = "大人の姿に戻ったヒメは、この時の自身の言動を思い返して、またもや頭を抱えるのだった。"
translation = "어른의 모습으로 돌아온 히메는, 이때의 자신의 언동을 되새기며 또다시 머리를 감싸쥐었다."

