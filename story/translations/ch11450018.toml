[[dialogue]]
speaker = "unk"
original = "今日もヒメは小さい方の姿で、俺の膝の上に乗っていた。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そして、抱っこしたままいつものように、羽や頭を撫でさせてもらっていると……"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「そう言えば、この姿で……あれ、したことは無かったな……」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「急に何を言い出した……？」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ふと思ってしまったのだ！\u3000魔王とは……恋人として何度か肌を重ねてきた……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「けれど、恥ずかしさが先に立って……思うままに振る舞うことが出来ていないように思う……」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「イメージプレイの時はノリノリだけどな」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「あ、あれはそういう物だと割り切っているから出来るのであって……！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「ともかく……この姿なら、もっと大胆に甘えることが出来るのではないかと思ったのだ……」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「確かにそれは興味深いかもしれない……試してみようか？」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ（幼少）"
speaker_translation = "オオヒメ（幼少）"
original = "「いいか？\u3000お願いしても……」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「もちろんだ。いっぱい大胆になって、いっぱい甘えてくれよ……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "それまで俺はヒメを膝の上に乗せて抱きしめていたが、それを離してベッドに横になる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "するとヒメは足を広げて、自身の局部に俺のペニスを押し当てた。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「魔王のここ……すごく大きくなっているな……」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「その姿のヒメにまたがられてると、背徳感がすごくて……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「やはりこの姿の私は、魔王の性癖を歪めてしまっているのではないか……？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そんなことはない、とキッパリ否定したいところだったが、下半身の反応的にあまりにも説得力に欠ける。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「本当に大きくしてしまって……んんっ……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こんな……ぶっといち○ぽを見せつけられたら……はぁ……ち○ぽに甘えたくなってしまう……」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いいよ。思う存分甘えてくれ」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ん……はぁ……魔王……魔王のち○ぽ……熱くて硬いち○ぽ……んんっ……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こうして、おま○こにスリスリして……気持ちいい……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "嬉しそうな表情を浮かべて、局部にペニスを押し当てながら腰を前後に動かす。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んっ、あ、んんん……自然に……動いてしまう……んっ、あ……んくぅ……んんっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、んっ……あっ……ち○ぽ……凄くて……もっと、甘えたい……いい、だろうか……魔王……んんっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「この大きなち○ぽで……私のこと……可愛がって……おま○この１番奥まで……甘やかして欲しい……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あ……んんんっ……！！！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ペニスの先端を局部に誘導し、そのままゆっくりと呑み込んでいく。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あっ！\u3000んん、あ……あぁあ、あ……はぁ、あああっ……！！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「入って、来てるっ……身体、小さくなったから……まるで、初めて魔王を受け入れた時みたいだ……んんんっ……！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「おま○こ、メリメリって裂きながら……私の中に入ってきてる……んんんっ……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "腰を落とし、奥深くまで俺のペニスを加え込む。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "熱っぽい息を漏らしながら、上体を反らし俺の方へ視線を向けてくる。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「魔王……キス、したい……いいだろうか……？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "髪がはらりと垂れ、ヒメの香りが鼻孔をくすぐる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "それに誘われるように顔を近づけ、唇を触れ合わせた。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んっ、は……ん、ちゅ……んんっ、ふ……んっ、んっ、ん……は……んんふっ……ちゅ、は……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ふぁ……この体勢だと……キスするの、苦しいな……失敗だったか……？」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そんなことないよ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そう言って俺は、ヒメの背中や首筋についばむようなキスを繰り返す。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「は……あっ……<emoji=heart04>\u3000んんっ、あっ、は、あああ……んんっ、あっ、あ……あぁあ……んんっ……はぁ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あぁあ……いっぱいキス、あちこちにされたら……嬉しくなってしまう……<emoji=heart04>\u3000あっ、んぅ、う……魔王……あ、は、あぁあ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "唇の軽い刺激が心地よいのか、ヒメが声を震わせる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そして、結合部が何かを促すようにペニスを締め付けてきた。"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヒメ……動くよ……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "優しくヒメの身体を押し上げるように動き始める。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あ……んんっ……キスされながら……んんっ……ち○ぽ、動かされるの……気持ちいい、ぞ……んんっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「おま○このなか……ゆっくり動いて……よしよしされてるみたいだ……あ、ああんっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こんな、のっ……どこまでも……気持ちよくなってしまう……あっ、あっ、んっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "快感を訴える声を漏らしながら、ヒメ自身もゆっくりと腰をグラインドさせる。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あ……あぁあ……ち○ぽに甘やかされて……んんっ、あ……こんなに、優しくされてるのに……あっ、ああっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「壊れてしまいそうなくらい……感じてるんだ……んっ、ああ、あっ……んんぅ……魔王っ……んくぅ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "その言葉が本当であると示すように、膣内に潜り込ませたペニスに強烈な締め付けが襲ってくる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "こんなに締め付けられたら、こっちだって壊れてしまいそうだ。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あっ、ああ……あっ、ん、あ、ああっ……<emoji=heart04>\u3000んん、ぁ、ああ……はぁ、あっ……んっ、ふ、あぁああ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヒメのおま○こを味わいながら、両手で滑らかな肌をなぞる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "熱を帯びて汗ばんだヒメの身体は、まるで磁石のように俺の手を吸い付かせた。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あ……んんっ……<emoji=heart04>\u3000そんな、優しい手つきで……撫でまわして……はぁ、ああぁあ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「撫でられるの……好きだろう……？」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んん……好き……<emoji=heart04>\u3000嬉しい……もっと、撫でて欲しい……んぅうう……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「おま○こ……突きながら……全身くまなく……魔王の手に愛撫されたい……んっ、あっ、あぁああっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "手のひらが肌を滑るたびに、ヒメは身体をビクンと震わせて鋭敏な反応を示す。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そして柔肌だけでなく、背中で可愛く揺れている羽にも手を伸ばした。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ、あ……羽も……触って……んんっ、あっ、あああ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あああっ……んっ、あっ、はぁあ……あっ……や……んんっ、ああ……<emoji=heart04>\u3000はぁっ、はぁっ、はぁ、あっ……ああ、あ、ああぁあ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んっ……<emoji=heart04>\u3000羽と一緒に……おっぱいも……触るのか……？\u3000んんっ、あっ……あぁあ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "小さな体にアンバランスな豊乳を、下から持ち上げるようにして揉みほぐす。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "その弾力に夢中になりながら、ペニスの先端でヒメの子宮を圧迫した。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あっ、あ、あっ、あっ……んふぅ……んんっ……<emoji=heart04>\u3000そこ……いい……気持ちいい……魔王っ……あっ、ああんっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「は、あ、ああっ……<emoji=heart04>\u3000んっ、あっ……あぁあ……奥の方……責められると……弱いんだ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「小さくなっても好きなところは同じなんだな……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ん……そう、みたいだ……奥、以外のところも……気持ちいい、が……特にそこは……弱いから……んんんっ、あっ、あ、ああっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「だから……おっぱいを揉まれながら……ち○ぽでいじめられると……んんっ、すぐに、切なくなって……あ、ああっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「もっと欲しくなる……？」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「い、言わせないで……くれ……んんっ、あっ……分かってる、だろう……んっ、あっ、ああっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ああ、分かってる……だからヒメが甘えてくれたら、ヒメのして欲しいことしてあげるよ……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁうぅ……そんな、意地悪なことっ……んんっ……<emoji=heart04>\u3000だけど、私も……魔王に、甘えたいから……だから……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「魔王……あなたの逞しい、ち○ぽで……私のおま○こ……激しくズボズボして欲しい……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あっ……！\u3000あぁああんっ！！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "普段のヒメからは出てこない可愛らしいおねだりを聞いて、一気に興奮が高まる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヒメの身体を両手でしっかり捕まえた俺は、先程よりも強めに下半身を突き上げる。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぉっ、おっ、んんっ……あ、あ、ああっ……！\u3000んんっ、おっ、お、おぉおっ……ん、おおおっ……！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんうっ……！\u3000ち○ぽがっ、んんっ、お、奥っ……一気に、ズブッってしてっ、ん……ひ、あっ……あぁあ、あっ、あ……ん、んぉぉっ！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヒメの声色が獣じみたものに変わる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "深く染みわたるような快感は、激しく押し寄せる官能の波に変化した。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ひ、んうっ、んんっ……！\u3000ん、ぁ、ああっ……や、ぁああ……んんっ、おっ、お、おぉお、んっ、お、おおおっ……！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「しゅ、ごいっ……そんな、激しく、されたらっ……！\u3000んんっ、おっ……お、おおおっ……！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ちっちゃくなった、私のおま○こっ……！\u3000壊れちゃうかも、しれないのにっ……んおっ、おっ、おおぉおっ……！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「力いっぱひ……突いてくるっ……おぉおっ……！\u3000なのに、うれひいっ！\u3000激しくしてくれるの、うれひいぃいっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んおっ、おっ、おおおっ……<emoji=heart04>\u3000お、んんっ、んぅ、んんっ……<emoji=heart04>\u3000んっ、んっ、んんっ<emoji=heart04>\u3000おおぉおっ、おっ、おおおっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "全身で歓ぶように、苦悶の叫びを上げるヒメ。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんっ、んっ、あ、ああっ……<emoji=heart04>\u3000い、いいっ……すごく……んんっ、いいっ<emoji=heart04>\u3000んんっ、んっ、んっ、あ、ぁああ、んっ、んぅううっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「来てるぅっ<emoji=heart04>\u3000壊れる、ぎりぎり手前のっ<emoji=heart04>\u3000１番、気持ちよくなれるの、来てるっ！\u3000んっ、おっ、おおっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こんなの、気持ちよすぎるっ<emoji=heart04>\u3000んんっ、こんなの、味わわされたら、私っ、魔王セックスに夢中になっちゃうっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「抜けらせられなくなるっ<emoji=heart04>\u3000セックスに夢中にさせられるっ<emoji=heart04>\u3000んぉっ、おっ、おおっ、ほ、おおおっ<emoji=heart04>\u3000おっ、おっ、おっ、お、おおっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でも、止めて欲しくないよな……？」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「止めないでっ<emoji=heart04>\u3000セックスっ、続けてぇっ<emoji=heart04>\u3000もっと、いっぱひ、私のこと……きもひよく、させてくれぇえっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヒメの求めに応じて、更に激しくペニスで膣内をかき回す。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぉ、おっ、おっ、お、おおっ<emoji=heart04>\u3000おおっ<emoji=heart04>\u3000おっ<emoji=heart04>\u3000おっ<emoji=heart04>\u3000おぉお<emoji=heart04>\u3000お、おおっ、んんっ、ん、おぉおおっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「声っ、止まらなひっ、んんっ、おっ、おおっ、おっ、おおっ<emoji=heart04>\u3000んぉおおおっ<emoji=heart04>\u3000おぉ、お<emoji=heart04>\u3000お<emoji=heart04>\u3000おおおっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「こんなに、小さい、女の子の格好、なのにっ<emoji=heart04>\u3000おほぉっ<emoji=heart04>\u3000おっ、おっ<emoji=heart04>\u3000おおっ<emoji=heart04>\u3000げ、下品に、叫んでっ<emoji=heart04>\u3000んぉ、おっ、おおっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あたま、まっひろに、なってきてっ<emoji=heart04>\u3000んんっ、んっ、んうぅうっ<emoji=heart04>\u3000呂律も、まわらなく、なってひて……んんっ、お、おぉお、お、んんうっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「魔王の、ち○ぽっ！\u3000わらひのことっ、どこまで気持ちよく、するのらぁっっ、あ、ああんっっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「わらひの、おま○こもっ<emoji=heart04>\u3000ち○ぽに乱暴、されること、喜んでてっ<emoji=heart04>\u3000あ、んんっ、んぉうっ、おっ、おぉお<emoji=heart04>\u3000もう、止まらなひのぉおっっ<emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヒメの歓喜の声が高まっていく。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "快感に全て曝け出した声が、俺の絶頂感もどんどん高めていってくれる。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんっ、あ、ううんっ<emoji=heart04>\u3000まおう、のっ、ち○ぽも、おま○こで、ビクビクいってりゅっ<emoji=heart04><emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぉおおっ、お、お、おおっ<emoji=heart04>\u3000まおうっ<emoji=heart04>\u3000まおうっ<emoji=heart04>\u3000ち○ぽが、ち○ぽがぁ、ち○ぽ、ち○ぽがぁっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「出して、くりぇっ<emoji=heart04>\u3000んっ、あっ、ああっ<emoji=heart04>\u3000中出しっ、しゃせーっ、しゃせーをっ、わらひの中でっ<emoji=heart04>\u3000あ、ああっ、あっ、ん、ぁ、ああっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「わらひの、ちっちゃなおま○こを……まおうの特濃せーえきでっ<emoji=heart04>\u3000んんっ、ぁ、んんっ……いっぱいにひてぇえっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「あぁあっ、らめっ、らめらめ、らめぇっ<emoji=heart04>\u3000いくっ<emoji=heart04>\u3000いくっ<emoji=heart04>\u3000いっちゃうっ<emoji=heart04>\u3000わらひもっ<emoji=heart04>\u3000あっ、あぁあ、あ、あああっ！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "搾り取ろうとするように、結合部の締め付けがこれ以上ないほど強くなる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺はヒメの最深部に欲望の限りを解き放とうと、意識を下半身に集中させた。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ああっ、あっ、あっ！\u3000んっ、あっ、あああっ！\u3000あ、んんっ、あっ、あ、あああっ！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「いぐっ！\u3000わらひ、いぐっ！\u3000んんっ！\u3000まおうの子種、受け入れられりゅっ！\u3000んんっ、あっ、あ、あああっ！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「びゅっびゅって、してっ！\u3000あつぅい液体っ、わらひのおま○こに、いっぱい注ぎ込んでっ！\u3000んっ、あっ、あ、あああっ！」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんっ、んっ、ん、んんっ<emoji=heart04>\u3000んぉ、おっ、おっ、んっ、ん、んんぅっ<emoji=heart04>\u3000く、るぅっ、んんっ<emoji=heart04>\u3000んぉ、お、おぉおっ、おっ、おぉおおおっ……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぉおおおおおおおおおおおっ！！\u3000おおおっ、おっ、おっ、おぉおおお～～～っ！！！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "絶頂の叫びと共に、俺の上でヒメの身体が大きく痙攣する。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "と、同時に俺はあらん限りの精を、ヒメの中で勢いよく解き放った。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ほぉおっ！\u3000おっ！\u3000んんっ、おっ、おおっ！\u3000んっ、んぅううっ……！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "瞬く間に、熱い液体が膣内を満たし、収まりきらなくなった白濁液があふれてくる。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヒメは呼吸を苦しくさせながらも、懸命に膣口を締めて、それをこぼさないようにしているかのようだった。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んんっ……ふ……んんぅ……<emoji=heart04>\u3000んん……<emoji=heart04>\u3000んぁ、ん……んんぅ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ち○ぽ……どくどくしてりゅっ……<emoji=heart04>\u3000こんな小さなわらひを……容赦なく孕ませようとしてりゅぅ……んんっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ヒメも……こんなにぎちぎちに締め付けて……孕みたがってるじゃないか……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「らってぇ……んんっ……せぇし、あったかひ……んんっ……<emoji=heart04>\u3000お腹の中に、たまってくの……気持ちひぃ、からぁ……んんっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「離したくない……んんっ、まおうのち○ぽ……でっかいち○ぽぉ……んんっ、ぁ、んんっ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "意識を虚ろにしながら、ヒメは歓喜の言葉を漏らす。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "互いの意識が噛み合ったように、俺はヒメに出し尽くし、ヒメは俺を絞りつくし──"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ようやく絶頂の波が引いてきたところで、ヒメの膣内からペニスを引き抜いた。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「んぁううっ……んんっ……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺の注ぎ込んだ白濁液が、音を立ててあふれ出る。"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「はぁ……ぁ……はぁ……んっ……ん、んぅ……んんん……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「は、ふへ……えへへ……どう、だろうか……魔王……私は、十分に甘えられていただろうか……？」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「自分ではどう思う……？」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「甘えた……いっぱい、甘えられたと思う……」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そうだな。すごく可愛かったし……大胆だった……」"
translation = ""

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「ふふ……魔王も……いつもより興奮していたのではないか……？\u3000となると、やはり小さい身体の方が魔王の性癖には合うのだろうか……」"
translation = "「후후…… 마왕도…… 평소보다 흥분했던 게 아닌가……? 그렇다는 건, 역시 작은 몸 쪽이 마왕의 성벽에 맞는 것일까……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そういうわけじゃないって……言っただろ、ヒメが甘えてくれるなら、それだけで俺はいつも嬉しいって」"
translation = "「그런 게 아니라고…… 말했잖아, 히메가 응석 부려준다면, 그것만으로 나는 언제나 기쁘다고」"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「そうか……ふふ、ありがとう……」"
translation = "「그런가…… 후후, 고맙다……」"

[[dialogue]]
speaker = "unk"
original = "満足げな笑みを浮かべるヒメ。"
translation = "만족스러운 미소를 짓는 히메."

[[dialogue]]
speaker = "unk"
original = "俺たちはそのまま絶頂の余韻に浸りながら、その後もずっと甘え合ったのだった。"
translation = "우리들은 그대로 절정의 여운에 젖은 채, 그 후로도 계속 서로 응석을 부렸다."

[[dialogue]]
speaker = "unk"
original = "そして、後日──"
translation = "그리고, 며칠 뒤──"

[[dialogue]]
speaker_original = "オオヒメ"
speaker_translation = "오오히메"
original = "「わ、私は……なんてことを……」"
translation = "「내, 내가…… 무슨 짓을……」"

[[dialogue]]
speaker = "unk"
original = "大人の姿に戻ったヒメは、この時の自身の言動を思い返して、またもや頭を抱えるのだった。"
translation = "어른의 모습으로 돌아온 히메는, 이때의 자신의 언동을 되돌아보고, 또다시 머리를 감싸쥐었다."

