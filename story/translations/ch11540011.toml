[[dialogue]]
speaker = "unk"
original = "第１話,異世界の九浄ヘレナ,P"
translation = "제1화, 이세계의 쿠죠 헬레나"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「出張版！\u3000おしえて、理事長さ～ん♪」"
translation = "「출장판! 가르쳐줘, 이사장님~♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「今回は、世界の枠を越えた『ダブルヘレナ』でお送りするぞ♪」"
translation = "「이번에는, 세계의 틀을 넘어선 『더블 헬레나』로 전해줄게♪」"

[[dialogue]]
speaker = "unk"
original = "なんか急に始まった！？"
translation = "뭔가 갑자기 시작됐다!?"

[[dialogue]]
speaker = "unk"
original = "呼び出されたと思ったら"
translation = "불려 왔나 싶었더니"

[[dialogue]]
speaker = "unk"
original = "リゾート結界の一件の後――異世界の『流星クルセイダース』の一行は、元の世界へ戻るまでの間、しばらくこちらの世界で過ごすことになった。"
translation = "리조트 결계 일건 이후―― 이세계의 『유성 크루세이더즈』 일행은, 원래 세계로 돌아갈 때까지, 당분간 이쪽 세계에서 지내게 되었다."

[[dialogue]]
speaker = "unk"
original = "そんな中、俺は異世界のヘレナさんに呼び出され、再びリゾート結界へとやって来ていた。"
translation = "그러던 중, 나는 이세계의 헬레나 씨에게 불려 와, 다시 리조트 결계로 오게 되었다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ、せっかくだし、こっちの世界の魔王ちゃんと、改めて仲良くなりたいと思ってね～♪」"
translation = "「후후, 모처럼이고, 이쪽 세계의 마왕짱이랑, 다시 사이좋아지고 싶다고 생각해서 말이지~♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「それに、世界を越えて２人のヘレナが揃ったのだ。ちゃんとファンサービスをしておかねばな」"
translation = "「게다가, 세계를 넘어 두 명의 헬레나가 모였다. 제대로 팬 서비스를 해둬야지」"

[[dialogue]]
speaker = "unk"
original = "ファンサービスって何！？"
translation = "팬 서비스라니 뭐야!?"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「というわけで、私が異世界の『九浄ヘレナ』よ～♪」"
translation = "「그런 고로, 내가 이세계의 『쿠죠 헬레나』야~♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「流星クルセイダースの『九浄リア』のお姉ちゃんをやっているわ♪」"
translation = "「유성 크루세이더즈의 『쿠죠 리아』의 언니를 하고 있어♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そして、私がお馴染み、こちらの世界のプリティーでゴージャスな『ヘレナちゃん』であるぞ♪」"
translation = "「그리고, 내가 익숙한, 이쪽 세계의 프리티하고 고저스한 『헬레나짱』이다♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「それじゃあヘレナちゃん、まずはアレからやるわよ～！」"
translation = "「그럼 헬레나짱, 우선 그것부터 하자~!」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ああ。もう１人の私よ、プリティーに合わせてゆくぞ」"
translation = "「아아. 또 하나의 나여, 프리티에 맞추도록 하지」"

[[dialogue]]
speaker = "unk"
original = "すると、異世界のヘレナさんは静かに目を閉じ、詠唱を開始する。"
translation = "그러자, 이세계의 헬레나 씨는 조용히 눈을 감고, 영창을 시작한다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――主を照らすは、十字架の鏡に映りし九浄の守護星……デネブ・アルゲディ！」"
translation = "「――주를 비추는 것은, 십자가의 거울에 비친 쿠죠의 수호성…… 데네브 알게디!」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ばばーん☆\u3000ヘレナちゃんと同じ守護星の加護を受けて、私も星騎士に変身よ～♪」"
translation = "「짜잔☆ 헬레나짱과 같은 수호성의 가호를 받아서, 나도 성기사로 변신이야~♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「さあ、スクショタイムだ！\u3000存分にゴージャスなツーショットを撮るがよいぞ♪」"
translation = "「자, 스크린샷 타임이다! 마음껏 고저스한 투 샷을 찍도록 하여라♪」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「いぇ～い☆\u3000お姉さんたちからのサービスよ<emoji=heart04>」"
translation = "「이예~이☆ 언니들의 서비스야<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "スクショタイムって何です！？"
translation = "스크린샷 타임이라니 뭡니까!?"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "『ええい！\u3000男なら細かいことは気にするな！\u3000前を向いて進み続けろ！』"
translation = "『에에이! 남자라면 사소한 건 신경 쓰지 마라! 앞을 향해 계속 나아가라!』"

[[dialogue]]
speaker = "unk"
original = "突然、芝居がかった男口調で言い放つヘレナさん。"
translation = "갑자기, 연극조의 남자 말투로 내뱉는 헬레나 씨."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「――さあ、魔王ちゃん、お姉さんになんでも質問をカモンよ！」"
translation = "「――자, 마왕짱, 언니에게 뭐든지 질문을 카몬이야!」"

[[dialogue]]
speaker = "unk"
original = "今の喋り方は一体……？"
translation = "방금 말투는 대체……?"

[[dialogue]]
speaker = "unk"
original = "ええっと、じゃあ……"
translation = "에또, 그럼……"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ♪\u3000好きな洋画に出てくる『オジサマ軍曹』のリスペクトよ♪」"
translation = "「후후♪ 좋아하는 서양 영화에 나오는 『아저씨 상사』의 리스펙트야♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「異世界の私は『洋画好き』ということでな」"
translation = "「이세계의 나는 『서양 영화 마니아』라는 것이지」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "『そういうことだ！\u3000わかったか、少年！\u3000わかったら、さっさと次の質問をぶつけてこい！』"
translation = "『그런 거다! 알겠나, 소년! 알았으면, 얼른 다음 질문을 던져라!』"

[[dialogue]]
speaker = "unk"
original = "ヘレナさんは元クルセイダースなんですよね？"
translation = "헬레나 씨는 전 크루세이더즈였죠?"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ええ♪\u3000妹のリアに守護天使の宿ったロザリオを渡す前は、私が向こうの世界の流星学園で、生徒会長として魔族と戦っていたの」"
translation = "「응♪ 동생인 리아에게 수호천사가 숙인 묵주를 넘겨주기 전에는, 내가 저쪽 세계의 유성학원에서, 학생회장으로서 마족과 싸웠었어」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「それで『リ・クリエ』との戦いでは、もう変身できなくなっちゃってたから、リア達の後方支援に回っていたけど……」"
translation = "「그래서 『리 크리에』와의 싸움에서는, 더 이상 변신할 수 없게 돼버렸으니까, 리아 일행의 후방 지원으로 돌아섰지만……」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「でもまさか、異世界に来てまた戦えるようになる日が来るなんて、夢にも思わなかったわ～♪」"
translation = "「하지만 설마, 이세계에 와서 다시 싸울 수 있게 되는 날이 올 줄은, 꿈에도 생각 못 했어~♪」"

[[dialogue]]
speaker = "unk"
original = "異世界での九浄家の役目って……？"
translation = "이세계에서의 쿠죠가의 역할이란……?"

[[dialogue]]
speaker = "unk"
original = "前から気になってたんですけど"
translation = "전부터 궁금했었는데요"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「いい質問ね！\u3000向こうの世界での九浄家は、古くから『フィーニスの塔』の管理を任されてきた一族なの」"
translation = "「좋은 질문이네! 저쪽 세계에서의 쿠죠가는, 옛날부터 『피니스의 탑』의 관리를 맡아온 일족이야」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「それと同時に流星学園を運営して、霊力適正のある子にロザリオを渡し、クルセイダースの役目を継承していく」"
translation = "「그와 동시에 유성학원을 운영하고, 영력 적성이 있는 아이에게 묵주를 넘겨주어, 크루세이더즈의 역할을 계승해 나가지」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そうして代々、『リ・クリエ』を防ぐ為の活動を密かに行ってきたって感じね」"
translation = "「그렇게 대대로, 『리 크리에』를 막기 위한 활동을 은밀히 해왔다는 느낌이려나」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「で、現在は私が九浄家の当主を引き継いで、学園の理事長を務めているわ。こちらの世界のヘレナちゃんと同じくね♪」"
translation = "「그래서, 현재는 내가 쿠죠가의 당주를 맡아서, 학원의 이사장을 하고 있어. 이쪽 세계의 헬레나짱처럼 말이지♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「正確には、私の方が魂の導きに従って、もう１人の私の在り方を真似たのだがな」"
translation = "「정확히는, 내가 영혼의 인도에 따라, 또 하나의 나의 모습을 흉내 낸 것이지만 말이다」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「向こうでの九浄家は、役割的にはこちらの世界での『星見家』の方が近いと言えるだろう」"
translation = "「저쪽에서의 쿠죠가는, 역할상으로는 이쪽 세계의 『호시미가』에 가깝다고 할 수 있겠지」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「そうそう！\u3000星見家といえば、ご当主様が流星市国の教皇様なんでしょう？」"
translation = "「맞아 맞아! 호시미가라고 하면, 당주님이 유성시국의 교황님이시라면서?」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ヘレナちゃんに写真を見せてもらったけど、とっても渋くてダンディーなオジサマで、素敵だったわ～<emoji=heart04>」"
translation = "「헬레나짱에게 사진을 보여달라고 했는데, 엄청 묵직하고 단디한 아저씨라서, 멋졌어~<emoji=heart04>」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「あ～あ、既婚者じゃなければ、猛烈にアタックしてたのに～♪」"
translation = "「아~아, 기혼자가 아니었다면, 맹렬하게 대시했을 텐데~♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ふふっ、男性の好みに関しては、私とは鏡映しで見事に反転した感じであるな」"
translation = "「후후, 남성 취향에 관해서는, 나와 거울에 비춘 듯이 멋지게 반전된 느낌이군」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「残念ね～。ヘレナちゃんも同じ『年上のオジサマ好き』だったら、お酒を飲みながら、とことん語り明かしたかったのに～」"
translation = "「아쉽네~. 헬레나짱도 같은 『연상 아저씨 취향』이었다면, 술 한잔하면서, 끝까지 이야기꽃을 피우고 싶었는데~」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「ほう？\u3000私としては、たとえ好みにズレがあったとしても、じっくりと盃を交わしたいと思っていたがな」"
translation = "「호오? 나로서는, 설령 취향에 차이가 있다 해도, 느긋하게 술잔을 나누고 싶다고 생각하고 있었다만」"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「あははっ、冗談よ～♪\u3000せっかくこうして出会うことができたんだから、仲良く飲むに決まってるじゃな～い！」"
translation = "「아하하, 농담이야~♪ 모처럼 이렇게 만날 수 있게 되었으니까, 사이좋게 마시는 게 당연하잖아~!」"

[[dialogue]]
speaker = "unk"
original = "異世界のヘレナさんは、ヘレナちゃんと仲良さそうに肩を組みながら笑う。"
translation = "이세계의 헬레나 씨는, 헬레나짱과 사이좋게 어깨동무를 하며 웃었다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「さて、改めて自己紹介も済んだところで、魔王ちゃんにはこれをあげるわ。――はいっ♪」"
translation = "「자, 그럼 자기소개도 끝났으니, 마왕짱에게는 이걸 줄게. ――자앗♪」"

[[dialogue]]
speaker = "unk"
original = "と、ヘレナさんがどこからともなく取り出してみせたのは、謎の『トロフィー』であった。"
translation = "그러고는, 헬레나 씨가 어디선가 꺼내어 보인 것은, 의문의 『트로피』였다."

[[dialogue]]
speaker = "unk"
original = "一体、なんのトロフィーなのかと首を傾げる俺に、ヘレナさんは答える。"
translation = "대체 무슨 트로피인가 하고 고개를 갸웃거리는 나에게, 헬레나 씨는 답한다."

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「名づけて――『異世界のヘレナと知り合ったで賞』よ♪」"
translation = "「이름하여―― 『이세계의 헬레나와 알게 된 상』이야♪」"

[[dialogue]]
speaker_original = "ヘレナ"
speaker_translation = "헬레나"
original = "「そういえば、もう１人の私は、向こうの世界の魔王が実績を達成するたびに、トロフィーを与えていたのだったな」"
translation = "「그러고 보니, 또 하나의 나는, 저쪽 세계의 마왕이 업적을 달성할 때마다, 트로피를 주곤 했었지」"

[[dialogue]]
speaker = "unk"
original = "トロフィーを集めると、何かあるんですか？"
translation = "트로피를 모으면, 무슨 일이라도 있나요?"

[[dialogue]]
speaker_original = "ヘレナ（原作）"
speaker_translation = "헬레나(원작)"
original = "「ふふっ♪\u3000それは～、集めた時のヒ・ミ・ツよ<emoji=heart04>」"
translation = "「후후♪ 그거~슨, 모았을 때의 비·밀이야<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "異世界のヘレナさんはそう言って、唇に指を当て、悪戯っぽくウインクしてみせるのだった。"
translation = "이세계의 헬레나 씨는 그렇게 말하고는, 입술에 손가락을 대고, 장난스럽게 윙크해 보이는 것이었다."

