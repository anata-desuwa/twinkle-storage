[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「せつなと閃から報告を受けたわ。２人ともなかなかやるようね！」"
translation = "「세츠나와 센에게 보고받았어. 둘 다 제법 하잖아!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「それはもう見事なお手並みでしたの！\u3000肝心の捕り物シーンが見られなかったのは残念でしたけど」"
translation = "「그건 정말 훌륭한 솜씨였어요! 정작 중요한 체포 장면을 보지 못한 건 아쉬웠지만요」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「そう……でも九浄家に仕える使用人たる者、荒事に長けているだけでもダメよ。頭脳や対応力も優秀でなければね」"
translation = "「그래…… 하지만 쿠죠가를 섬기는 하인인 자, 거친 일에 능숙할 뿐만으로는 안 돼. 두뇌나 대응력도 우수해야지」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「というわけで、ヨミの事務仕事を手伝ってもらうわ！」"
translation = "「그런 고로, 요미의 사무 일을 도와주도록 해!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「事務仕事ですか？」"
translation = "「사무 일 말인가요?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「お願いしてしまってごめんなさい！\u3000メイドのお仕事じゃないんですけど……」"
translation = "「부탁하게 되어서 죄송해요! 메이드 일은 아니지만……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「どういったお仕事なんですか？」"
translation = "「어떤 일인가요?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「ご存知かと思いますが、私、学園では任務管轄係として働いておりまして」"
translation = "「아시리라 생각하지만, 저, 학원에서는 임무 관할계로 일하고 있어서요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「知ってますよ。何度かお世話になったこともありますし」"
translation = "「알고 있어요. 몇 번 신세 진 적도 있고요」"

[[dialogue]]
speaker = "unk"
original = "モンスターとの戦闘時にオペレーターを務めたり、任務の発注や案内などを行うのが任務管轄係の主な仕事だ。"
translation = "몬스터와의 전투 시 오퍼레이터를 맡거나, 임무의 발주나 안내 등을 실시하는 것이 임무 관할계의 주요 일이다."

[[dialogue]]
speaker = "unk"
original = "星騎士の出撃数や、モンスターの撃墜数などの管理も行っているが、ヨミもその任務管轄係として働いている。"
translation = "성기사의 출격 수나, 몬스터의 격추 수 등의 관리도 실시하고 있지만, 요미도 그 임무 관할계로서 일하고 있다."

[[dialogue]]
speaker = "unk"
original = "ヒマワリもミウも大聖堂カフェテリアで、仕事に従事しているヨミの姿を何度も見たことがあった。"
translation = "히마와리도 미우도 대성당 카페테리아에서, 일에 종사하고 있는 요미의 모습을 몇 번이고 본 적이 있었다."

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「最近、利用者が大幅に増えたのは嬉しい悲鳴なんですけど、お仕事がいっぱい過ぎて事務作業が追いつかない状態になってしまってまして」"
translation = "「최근, 이용자가 대폭 늘어난 건 기쁜 비명이지만, 일이 너무 많아서 사무 작업이 따라가지 못하는 상태가 되어버려서요」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「利用者のリスト化と上手な捌き方を考案して、ヨミを手伝ってあげてほしいの。どう、できるかしら？」"
translation = "「이용자의 리스트화와 요령 있게 처리하는 방법을 고안해서, 요미를 도와주었으면 해. 어때, 할 수 있겠니?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「大丈夫です。むしろ、荒事よりも得意ジャンルです」"
translation = "「괜찮습니다. 오히려, 거친 일보다 특기 장르예요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「分業にしよっか。利用者のリスト化はあたしが入力するんで、誰か未処理のリストを仕分けて並べてくれませんか？」"
translation = "「분업으로 할까. 이용자 리스트화는 내가 입력할 테니까, 누군가 미처리 리스트를 분류해서 늘어놓아 주지 않을래?」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「私がやるわ！\u3000ヒマワリの入力スピード、私の仕分けスピードに追いつけるかしら？」"
translation = "「내가 할게! 히마와리의 입력 스피드, 내 분류 스피드를 따라잡을 수 있을까?」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「あの、では私はどうしましょう……？」"
translation = "「저기, 그럼 저는 어떻게 할까요……?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「私と一緒にリスト化の効率的なフローを考えませんか？\u3000それが終わったら、リスト化作業に合流ということで」"
translation = "「저와 함께 리스트화의 효율적인 플로우를 생각해 보지 않겠어요? 그게 끝나면, 리스트화 작업에 합류하는 걸로 해서」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「わ、わかりました～！」"
translation = "「아, 알겠습니다~!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「うううっ！\u3000何なんですの、２人のこのお仕事出来るオーラ！\u3000私の入り込む隙がありませんわ！」"
translation = "「으으윽! 뭐인가요, 두 사람의 이 일 잘하는 오라는! 제가 파고들 틈이 없어요!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ふふ、ヒマワリもミウもやるわね。山積みだった報告書がこんなに簡単に片づいてしまうなんて」"
translation = "「후후, 히마와리도 미우도 제법이네. 산더미 같았던 보고서가 이렇게 간단히 정리되어 버리다니」"

[[dialogue]]
speaker_original = "ヨミ"
speaker_translation = "요미"
original = "「明日からのお仕事が、とっても楽になりますー！\u3000ミウさん、ありがとうございます！」"
translation = "「내일부터의 일이, 엄청 편해져요─! 미우 씨, 감사합니다!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「いえいえ、私はちょっとアイデアを出しただけですから。元々のヨミさんの処理能力の高さを活かしているだけですよ」"
translation = "「아니에요, 저는 약간 아이디어를 냈을 뿐이니까요. 원래 요미 씨의 처리 능력의 높음을 살렸을 뿐이에요」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「閃やせつなも、あなたたちをべた褒めしていたわ。『見習い』が外れるのも、そう遠い先の話じゃなさそうね」"
translation = "「센이나 세츠나도, 너희를 엄청 칭찬했었어. 『수습』을 떼는 것도, 그다지 머지않은 이야기 같네」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「えへへー、そういってもらえて嬉しいです。早く立派な使用人になりたいですねー」"
translation = "「에헤헤─, 그렇게 말해주니 기뻐요. 빨리 훌륭한 하인이 되고 싶네요─」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（ヒマワリちゃん、楽しむのもいいけど、私たちの本当の目的は忘れないようにね）"
translation = "（히마와리짱, 즐기는 것도 좋지만, 우리의 진짜 목적은 잊지 않도록 해）"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "（そうなんだよねー。メイド隊のみんなを騙してるみたいで、ちょっと胸が痛いなー）"
translation = "（그렇지─. 메이드대 모두를 속이고 있는 것 같아서, 약간 가슴이 아프네─）"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「ヒマワリ様もミウ様も使用人体験を満喫していて……羨ましいですわ」"
translation = "「히마와리 님도 미우 님도 하인 체험을 만끽하고 있어서…… 부러워요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「せっかくの可愛いメイドタイプの人工戦闘服なのですし、持ち腐れになってしまいますわ！\u3000私ももっとメイドとしてご奉仕したいですのっ！」"
translation = "「모처럼 귀여운 메이드 타입의 인공 전투복인데, 썩혀버리게 되잖아요! 저도 좀 더 메이드로서 봉사하고 싶어요!」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「ヘレナ様からは許可を頂いているけど……本当にいいのかしら？\u3000あなたは桜十路家という名家のお嬢様なのに」"
translation = "「헬레나 님으로부터 허락은 받았지만…… 정말 괜찮은 거니? 너는 사쿠라쥬지가라는 명가의 아가씨인데」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あら、名家というならば蘭美様も魔界の名家の出身ですわよね？\u3000それなのにメイドとして働いていらっしゃるではありませんの」"
translation = "「어머, 명가라고 한다면 라비 님도 마계의 명가 출신이시잖아요? 그런데도 메이드로서 일하고 계시지 않나요」"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「あら、これは１本取られたわね……」"
translation = "「어머, 이거 한 방 먹었네……」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「可愛いだけではなくてとても動きやすくて、お仕事でも戦闘でも力を発揮できますのよ？\u3000黙って見ているだけなんてもったいないですわ！」"
translation = "「귀여울 뿐만 아니라 엄청 움직이기 편해서, 일에서도 전투에서도 힘을 발휘할 수 있다구요? 잠자코 보고만 있는 건 아까워요!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「その人工戦闘服、すごくハイスペックそうですもんね？\u3000それにしても何故エルデリーゼ先輩が、その人工戦闘服を着ることになったんですか？」"
translation = "「그 인공 전투복, 엄청 하이스펙 같아 보이던데요? 그건 그렇고 어째서 엘데리제 선배가, 그 인공 전투복을 입게 된 건가요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あ、それ気になってました！\u3000あたしも知りたいです！」"
translation = "「아, 그거 궁금했어요! 나도 알고 싶어요!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「あら、おふたりにはお話ししてませんでしたか？\u3000実はヘレナ様がこの人工戦闘服を思いついた際に私をイメージしてくださったのです」"
translation = "「어머, 두 분에게는 말씀드리지 않았나요? 사실 헬레나 님이 이 인공 전투복을 떠올리셨을 때 저를 이미지해 주신 거예요」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「実際に戦闘服が出来上がったら、どうしても私が着ているところをみたくて、モデルとしてスカウトされたという事ですのよ」"
translation = "「실제로 전투복이 완성되자, 어떻게 해서든 제가 입은 모습을 보고 싶어서, 모델로서 스카우트되셨다는 거랍니다」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「では本当に、エルデリーゼ先輩のために作られた戦闘服なんですね」"
translation = "「그럼 정말로, 엘데리제 선배를 위해 만들어진 전투복이군요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「少しだけ戦った感じだと、なんか普通の人工戦闘服に感じない力を感じたんですけど……何か秘密があったりするんですか？」"
translation = "「조금 싸워본 느낌으로는, 왠지 일반적인 인공 전투복으로 느껴지지 않는 힘을 느꼈는데요…… 무슨 비밀이라도 있는 건가요?」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「いいえ？\u3000特にうかがってはいませんけど……」"
translation = "「아뇨? 딱히 들은 바는 없습니다만……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「そっかー……エルゼ先輩がそう言うなら、そうなのかなー」"
translation = "「그렇구나─…… 엘제 선배가 그렇게 말한다면, 그런 거겠지─」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（何かを隠している様子はなし……あてが外れちゃったかな？）"
translation = "（무언가를 숨기고 있는 모습은 없음…… 헛다리를 짚은 걸까?）"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「２人とも、随分と食いつきがいいのね……はっ！？\u3000もしかして、あなたたち……！」"
translation = "「둘 다, 제법 관심이 많네…… 앗!? 혹시, 너희……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ぎくっ！？」"
translation = "「찔끔!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（潜入捜査が勘付かれた！？\u3000ちょっと前のめりになりすぎちゃったから──）"
translation = "（잠입 수사가 눈치채였어!? 너무 적극적으로 나섰나──）"

[[dialogue]]
speaker_original = "蘭美"
speaker_translation = "라미"
original = "「チーパオよりもメイド服に興味があったのかしら？\u3000それなら今度、美鶴にお願いしてみるといいわ！」"
translation = "「치파오보다 메이드복에 관심이 있었던 걸까? 그렇다면 다음에, 미츠루에게 부탁해 보면 좋을 거야!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「め、メイド服もいいですね～！\u3000長いスカートの中に武器を仕込んでおくのとか格好いいですしー！」"
translation = "「메, 메이드복도 좋네요~! 긴 치마 속에 무기를 숨겨두는 거라든가 멋지고요─!」"

[[dialogue]]
speaker_original = "エルデリーゼ"
speaker_translation = "엘데리제"
original = "「まあ！\u3000言われてみれば、映画やアニメで見たことがありますわ！\u3000素敵ですわよね！」"
translation = "「어머! 듣고 보니, 영화나 애니메이션에서 본 적이 있어요! 멋지네요!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それも含めて、今度、美鶴さんにも詳しいお話をうかがいたいです」"
translation = "「그것도 포함해서, 다음에, 미츠루 씨에게도 자세한 이야기를 듣고 싶어요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "（ふぅ……気づかれてない……よね？）"
translation = "（후우…… 눈치채지 못했어…… 맞지?）"

