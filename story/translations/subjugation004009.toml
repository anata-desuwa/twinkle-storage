[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ハロウィンデコレーション、完了っと」"
translation = "「할로윈 데코레이션, 완료 완료」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「お菓子とお料理も揃ったね。サランさん、蛍火さん、手伝ってくれてありがとうございましたっ」"
translation = "「과자랑 요리도 준비됐네요. 사란 씨, 호타루비 씨, 도와주셔서 고마웠습니다」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「ううん、サランも役に立てて嬉しい～♪」"
translation = "「으응, 사란도 도움이 되어서 기뻐~♪」"

[[dialogue]]
speaker_original = "蛍火"
speaker_translation = "호타루비"
original = "「ですが、私たちも参加してよろしいのですか？\u3000選挙管理委員会の皆さんのハロウィンパーティーだったのでは？」"
translation = "「하지만, 저희도 참가해도 괜찮은 건가요? 선거관리위원회의 여러분의 할로윈 파티였던 게 아닌지?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「いいんです、いいんです。おふたりには協力してもらったお礼もしたいですし、みんなで盛り上がった方が楽しいですからっ」"
translation = "「괜찮아요, 괜찮아요. 두 분께는 협조해주신 답례도 하고 싶고, 다 함께 시끌벅적한 편이 더 즐거우니까요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「おー、パーティー会場はここだなー！\u3000あ、カボチャのランタンがある！\u3000カッコイイなこれ！」"
translation = "「오─, 파티 장소는 여기구나─! 아, 호박 렌턴이 있어! 멋지다 이거!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「ベアト、ナターシャ、お疲れさま。見事に場を整えてくれたな。君たちに任せてよかったよ」"
translation = "「베아토, 나샤타, 수고했어. 멋지게 자리를 정돈해 주었네. 너희에게 맡기길 잘했어」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「私たちじゃこうはできなかったね。さて、捕まえたイタズラお化けたちはここで放しちゃっていいのかな？」"
translation = "「우리로선 이렇게 못 했겠지. 자, 붙잡은 장난꾸러기 유령들은 여기서 풀어줘도 될까?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「はい、ゴーストさんたちも一緒に、みんなでパーティーを楽しみましょうっ！」"
translation = "「네, 고스트 씨들도 함께, 다 같이 파티를 즐겨요!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「では……ハロウィンパーティーの始まりだ！\u3000皆、グラスは持ったか？」"
translation = "「그럼…… 할로윈 파티의 시작이다! 모두, 잔은 들었나?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「飲んで歌って踊って騒げーっ！\u3000かんぱーーーいっ！」"
translation = "「마시고 노래하고 춤추고 떠들어라─! 건─배───잇!」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「カンパーイ！\u3000お前たちもパーティーを楽しむゆー！」"
translation = "「건─배! 너희도 파티를 즐겨라 유─!」"

[[dialogue]]
speaker_original = "ゴースト"
speaker_translation = "ゴースト"
original = "「キャッキャッキャーーッ！」"
translation = "「키앗키앗키──잇!」"

[[dialogue]]
speaker_original = "サラン"
speaker_translation = "사란"
original = "「とってもにぎやか～♪\u3000サランたちもカンパ～イ♪」"
translation = "「매우 시끌벅적해~♪ 사란들도 건~배♪」"

[[dialogue]]
speaker_original = "蛍火"
speaker_translation = "호타루비"
original = "「では私も……乾杯」"
translation = "「그럼 저도…… 건배」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「今日はお腹がパンパンになるまで食べるぞー！\u3000ん？\u3000この真っ赤なスパゲティ、美味そうだ！\u3000ナポリタンか？」"
translation = "「오늘은 배가 터질 때까지 먹는다─! 응? 이 새빨간 스파게티, 맛있어 보인다! 나폴리탄인가?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ナポリタンじゃなくって暗殺者のパスタっていうんだよっ。私たちの自信作っ！\u3000ね、ナターシャちゃん♪」"
translation = "「나폴리탄이 아니라 암살자의 파스타라고 하는 거야. 우리들의 자신작! 그치, 나타샤 짱♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「もぐもぐ……ニンニクもこのくらいなら、アポロでも大丈夫じゃない？」"
translation = "「우물우물…… 마늘도 이 정도라면, 아폴로라도 괜찮지 않아?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「なっ……！？\u3000ナターシャがニンニクマシマシのを食べてる！？」"
translation = "「뭣……!? 나타샤가 마늘 듬뿍 들어간 걸 먹고 있어!?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「食べられるようになったんだよね。情報はアップデートしなきゃだよ」"
translation = "「먹을 수 있게 되었다구. 정보는 업데이트해야지」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ニャははっ♪\u3000アポロちゃんもどうぞ」"
translation = "「냐하하♪ 아폴로 짱도 드세요」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「暗殺者のパスタ……？\u3000ちょっと怖い名前だけど、ナターシャが食べるくらい美味いのか？\u3000どれどれ……ずずずっ」"
translation = "「암살자의 파스타……? 조금 무서운 이름이지만, 나타샤가 먹을 정도로 맛있는 건가? 어디 어디…… 후루룩」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んっ！？\u3000ほんとだ！\u3000これ美味いぞ！\u3000ちょっとニンニクキツいけど！」"
translation = "「응!? 진짜다! 이거 맛있어! 조금 마늘이 세지만!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「いやいや、ちょっとどころじゃないだろう。ここからでもわかるくらいに匂いが強いぞ」"
translation = "「아니아니, 조금 수준이 아니잖아. 여기서도 알 수 있을 정도로 냄새가 강하다고」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「いいから梨緒も食ってみろって！\u3000ほら、ジグも！」"
translation = "「됐으니까 리오도 먹어 보라니까! 자, 지그도!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「そ、そうだな、２人の自信作というなら……いただきます……あむっ……！」"
translation = "「그, 그렇네, 두 사람의 자신작이라고 한다면…… 잘 먹겠습니다…… 냠……!」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「んんっ……！？\u3000確かに匂いは強いが、なかなか癖になる味かもしれないな……！」"
translation = "「음……!? 확실히 냄새는 강하지만, 제법 중독성 있는 맛일지도 모르겠네……!」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「うん、パンチが効いていて刺激的だね」"
translation = "「응, 펀치가 들어가 있어서 자극적이네」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「だろっ！？\u3000２人ともいい仕事するじゃないか！」"
translation = "「그렇지!? 두 사람 다 좋은 일을 해내잖아!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「大好評だよっ、ナターシャちゃんっ♪」"
translation = "「대호평이야, 나타샤 짱♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ま、蛍火先生の教えが良かったからだよ。ありがとうございます」"
translation = "「뭐, 호타루비 선생님의 가르침이 좋았으니까야. 감사합니다」"

[[dialogue]]
speaker_original = "蛍火"
speaker_translation = "호타루비"
original = "「いえ、私もいい学びになりました。いつか私も、ナターシャさんに美味しいと言わせてみせます」"
translation = "「아뇨, 저도 좋은 배움이 되었습니다. 언젠가 저도, 나타샤 씨에게 맛있다는 말을 듣게 해 보이겠습니다」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「ベアトとナターシャの様子を見る限り、パーティーの準備を介して２人の仲が深まったようだな」"
translation = "「베아토와 나타샤의 모습을 보는 한, 파티 준비를 통해 두 사람의 사이가 깊어진 모양이네」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「みたいだね。いい采配だったんじゃないかな」"
translation = "「그런 것 같네. 좋은 지휘였던 게 아닐까」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「その口ぶり……ジグには最初から可能性が見えていたのか？」"
translation = "「그 말투…… 지그에게는 처음부터 가능성이 보였던 건가?」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「さぁね、それを言うのは野暮というものだよ。２人が仲良くなったのは、２人が腹を割って歩み寄った結果さ」"
translation = "「글쎄, 그걸 말하는 건 촌스럽다는 거란다. 두 사람이 친해진 건, 두 사람이 솔직하게 마음을 열고 다가간 결과야」"

[[dialogue]]
speaker_original = "梨緒"
speaker_translation = "리오"
original = "「そうだな──ん？\u3000んん？\u3000なんだかさっきよりもゴーストが増えてやしないか？」"
translation = "「그렇군── 응? 어라? 어쩐지 아까보다 고스트가 늘어나 있지 않은가?」"

[[dialogue]]
speaker_original = "ジグ"
speaker_translation = "지그"
original = "「捕まえ損ねていたやつかな？\u3000パーティーの盛り上がりを嗅ぎつけてきたのかもしれないね」"
translation = "「놓쳤던 녀석일까? 파티의 분위기를 냄새 맡고 온 걸지도 모르겠네」"

[[dialogue]]
speaker_original = "ジャクリーヌ"
speaker_translation = "자클린"
original = "「ゆーゆっゆっゆっ！\u3000お前たちもパーティーを盛り上げるゆーっ！」"
translation = "「유~유유유! 너희도 파티 흥을 돋우는 거다 유~!」"

[[dialogue]]
speaker_original = "ゴースト"
speaker_translation = "ゴースト"
original = "「キャッキャッキャーーーッ！！！」"
translation = "「키앗키앗키───잇!!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うわ、はちゃめちゃだね。どう収拾つけるの、これ」"
translation = "「우와, 엉망진창이네. 어떻게 수습할 거야, 이거」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「大丈夫だよっ。どんな楽しいパーティーだって、永遠には続かない。ちゃんと終わりが来るんだから」"
translation = "「괜찮아. 아무리 즐거운 파티라도, 영원히 계속되지는 않아. 제대로 끝이 오는 법이니까」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「だからナターシャちゃん、世界は平和になったんだし、せっかく仮装までしてるんだし、もっともっと楽しもうニャン♪」"
translation = "「그러니까 나타샤 짱, 세계는 평화로워졌고, 모처럼 가장까지 했으니까, 더욱더 즐기자 냥♪」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はいはい。吸血鬼同士、夜通し踊り続けるっていうのも悪くないかもね」"
translation = "「네네. 흡혈귀끼리, 밤새도록 계속 춤추는 것도 나쁘지 않을지도 모르겠네」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うんっ、ナイスアイデアっ！\u3000踊ろ、ナターシャちゃんっ！」"
translation = "「응, 나이스 아이디어! 춤추자, 나타샤 짱!」"

[[dialogue]]
speaker = "unk"
original = "２人は手を取り合い、自分たちで手に入れた平和を享受する。"
translation = "두 사람은 손을 잡고, 자신들이 손에 넣은 평화를 누린다."

[[dialogue]]
speaker = "unk"
original = "それは死を迎え入れるまで続くのか、瞬きのような束の間でしかないのかは、まだわからないけれど──"
translation = "그것이 죽음을 맞이할 때까지 계속될지, 찰나와 같은 찰나에 불과할지는, 아직 알 수 없지만──"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「世界は平和になったけど、選管の仕事はあくまで監視だからね」"
translation = "「세계는 평화로워졌지만, 선관의 일은 어디까지나 감시니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「星徒会がいつ変なことをやらかすかわからないし、監視は依然継続」"
translation = "「성도회가 언제 이상한 짓을 저지를지 모르고, 감시는 여전히 계속」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「だから、ベアト。選管の仲間として──」"
translation = "「그러니까, 베아토. 선관의 동료로서──」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「友達としてっ！」"
translation = "「친구로서!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「これからも、よろしく」"
translation = "「앞으로도, 잘 부탁해」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「うんっ！」"
translation = "「응!」"

