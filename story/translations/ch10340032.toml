[[dialogue]]
speaker = "unk"
original = "第２話,シャリオン魔界事情その２,P"
translation = "제2화, 샤리온 마계 사정 그 두 번째"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ワンワワ～ン♪\u3000目指せ世界征服～♪」"
translation = "「멍멍멍～♪ 목표는 세계 제패～♪」"

[[dialogue]]
speaker = "unk"
original = "放課後はカティアと一緒に花壇の手入れだ。カティアと付き合うようになってから、日課になっていた。"
translation = "방과 후에는 카티아와 함께 화단을 가꾼다. 카티아와 사귀게 된 이후로 일과가 되어 있었다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様、いつもありがとうございます。でも星徒会の仕事はいいんですか？\u3000お忙しいんじゃ……」"
translation = "「마왕님, 항상 감사해요. 하지만 성회 일은 괜찮으신가요? 바쁘신 게……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「……え、星徒会のみんなも応援してくれてるから大丈夫？\u3000そ、そうなんですか……恐縮です」"
translation = "「……에, 성회 사람들도 응원해 주고 있으니까 괜찮다고요? 그, 그렇군요…… 황송하옵니다」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あ、見てください、ここ！\u3000魔王様に選んでもらったお花が咲いてます！\u3000立派な赤いお花ですワン」"
translation = "「아, 이것 좀 보세요! 마왕님이 골라주신 꽃이 피었어요! 근사한 붉은 꽃이다 멍」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「ふふっ、かわいい……それにいい匂い……魔王様もかいでみてください」"
translation = "「후후, 귀여워…… 게다가 좋은 냄새…… 마왕님도 맡아보세요」"

[[dialogue]]
speaker = "unk"
original = "カティアに促されて花壇の前にかがむと、少し甘く、瑞々しい香りがした。"
translation = "카티아가 권해서 화단 앞에 쪼그려 앉으니, 약간 달콤하고 싱그러운 향기가 났다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「あ……」"
translation = "「아……」"

[[dialogue]]
speaker = "unk"
original = "カティアも同じようにかがんでいたから、自然と間近で目が合う。"
translation = "카티아도 똑같이 쪼그려 앉아 있었기에, 자연스럽게 가까운 거리에서 눈이 마주친다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「えっと、えっと…………ワン」"
translation = "「저기, 저기…………멍」"

[[dialogue]]
speaker = "unk"
original = "お互いの好意を確かめ合ってからというもの、こんな風に照れるカティアが見れて嬉しい。"
translation = "서로의 호감을 확인한 후부터, 이런 식으로 수줍어하는 카티아를 볼 수 있어서 기쁘다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker = "unk"
original = "カティアも俺もかがんでいるから、花壇で作業していると思われるはず……甘い誘惑に抗えなくて、花に誘われる虫のように、そっとカティアの唇に近付く。"
translation = "카티아도 나도 쪼그려 앉아 있으니, 화단 일을 하고 있다고 생각할 터…… 달콤한 유혹을 이기지 못하고, 꽃에 끌리는 벌레처럼 살포시 카티아의 입술로 다가간다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「……ハッ！\u3000この匂いは！」"
translation = "「……핫! 이 냄새는!」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「ディア―ブル家がハルヴィーノ家に負けるはずないでしょう。その前に、人口流出で領地が消滅するのでは～？」"
translation = "「디아블 가문이 할비노 가문 따위에게 질 리가 없잖아요. 그전에 인구 유출로 영지가 소멸하지나 않을지～？」"

[[dialogue]]
speaker_original = "ジュリエッテ"
speaker_translation = "줄리엣타"
original = "「んぎぎぎ……ハルヴィーノ家が斜陽なのは事実でございますが、詐称魔王のディアーブル家ごときに遅れはとりませんわ～！」"
translation = "「으기기기…… 할비노 가문이 사양길인 것은 사실입니다만, 사칭 마왕인 디아블 가문 따위에게 뒤처지진 않아요～！」"

[[dialogue]]
speaker = "unk"
original = "向こうから、貴族の２人組がやってきた。何やら言い争いをしているようだ。"
translation = "저쪽에서 귀족 2인조가 걸어왔다. 무언가 다투고 있는 모양이다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（シャルレーヌ様の甘い匂い、やっぱり苦手……）"
translation = "(샬레느 님의 달콤한 냄새, 역시 거북해……)"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「あら、会長さんにカティア先輩、ごきげんよう。お見苦しいところをすみません。少し野良フェレットに噛まれてしまって」"
translation = "「어라, 회장님에 카티아 선배, 안녕하신가요. 볼썽사나운 모습을 보여드려 죄송해요. 들페럿한테 살짝 물려서요」"

[[dialogue]]
speaker_original = "ジュリエッテ"
speaker_translation = "줄리엣타"
original = "「誰が野良フェレットでございますか！？\u3000シャルレーヌ様こそ、えぇっと、その……サキュバスですわ～！」"
translation = "「누가 들페럿이라는 건가요!? 샬레느 님이야말로, 어mm, 그…… 서큐버스예요～！」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「それはただの事実ですよ？\u3000嫌味くらいさらっと言ってくださいな」"
translation = "「그건 그냥 사실인데요? 비꼬려면 좀 깔끔하게 말해보시죠」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「２人してどうしたんです？\u3000いつものケンカですか？」"
translation = "「둘이서 무슨 일이야? 평소처럼 싸우는 건가?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「くふふ♪\u3000ケンカだなんて、カティア先輩は冗談がお上手ですね。私とジュリエッテ様でケンカなんてあり得るわけないじゃないですか～♪」"
translation = "「쿠후후♪ 싸움이라니, 카티아 선배는 농담도 잘하시네요. 저와 줄리에트 님이 싸운다는 게 말이 되겠어요～♪」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「ただ、シャリオン地方の将来について意見を交わしていただけですよ～♪\u3000まぁ、ハルヴィーノ領はいずれなくなるかもしれませんが……」"
translation = "「그저, 샤리온 지방의 미래에 대해 의견을 나누고 있었을 뿐이에요～♪ 뭐, 할비노 영지는 머지않아 사라질지도 모르지만……」"

[[dialogue]]
speaker_original = "ジュリエッテ"
speaker_translation = "줄리엣타"
original = "「うぅ～、言わせておけばぁ……おのれシャルレーヌ様……」"
translation = "「우우～, 말하게 내버려두니까…… 오노레 샬레느 님……」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（……魔王様。ハルヴィーノ家は先々代あたりでこけて、だんだん人が少なくなってるって話です。昔は十貴族領でも一番人口が多かったらしいですけど）"
translation = "(……마왕님. 할비노 가문은 전전대쯤에서 넘어져서 점점 사람이 줄어들고 있다는 이야기예요. 옛날에는 십귀족 영지 중에서도 제일 인구가 많았다고 하지만)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（あと、リクリエが落ち着いたから、シャリオン地方では十貴族同士の勢力争いが表面化するかもってシャルレーヌ……様が言ってました）"
translation = "(그리고, 리크리에가 안정됐으니까, 샤리온 지방에서는 십귀족끼리의 세력 다툼이 표면화될지도 모른다고 샬레느…… 님이 말했어요)"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「このままでは、勢力争い以前に、魔獣から領地を守れなくなってしまうのではありませんか～？\u3000そうなれば、領民が隣接するディア―ブルに助けを求めるのは必然」"
translation = "「이대로라면 세력 다툼은커녕, 마수로부터 영지를 지킬 수조차 없게 되는 것 아닌가요～？ 그렇게 되면 영민이 인접한 디아블에 도움을 요청하는 건 당연지사」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「ハルヴィーノ家の没落まであとわずか。今のうちに実家に戻られて、財産を引き上げた方がいいと思いますよ～？\u3000くふふ♪」"
translation = "「할비노 가문의 몰락까지 얼마 남지 않았네요. 지금이라도 본가로 돌아가셔서 재산을 정리하시는 게 어떨까요～？ 쿠후후♪」"

[[dialogue]]
speaker_original = "ジュリエッテ"
speaker_translation = "줄리엣타"
original = "「実家の没落はいい気味でございますが、それをシャルレーヌ様に言われるのはハラ立つでございますわ～！\u3000この温室栽培サキュバスが～！」"
translation = "「본가의 몰락은 꼴좋지만, 그걸 샬레느 님에게 듣는 건 열받는답니다～！ 이 온실 재배 서큐버스가～！」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「ぬくぬく育った箱入り娘ですみませ～ん♪」"
translation = "「따뜻하게 자란 귀한 집 딸이라 죄송하네요～♪」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（魔界の貴族の仕事は、星力がある者を率いて戦士団を組織し、魔獣から領地を守ることです）"
translation = "(마계 귀족의 일은 성력이 있는 자를 이끌고 전사단을 조직해, 마수로부터 영지를 지키는 거예요)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（だから貴族は代々星力を持っていて……星力に目覚めない貴族の立ち位置はめちゃくちゃ微妙です）"
translation = "(그래서 귀족은 대대로 성력을 가지고 있고…… 성력에 눈뜨지 못한 귀족의 입지는 엄청 어정쩡해요)"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "（だから、幼くして星力があったシャルレーヌ様は大事にされてて、星力がなかったジュリエッテ……様？\u3000は冷たい扱いを受けていたんだと思います）"
translation = "(그래서 어릴 때부터 성력이 있던 샬레느 님은 귀하게 여겨졌고, 성력이 없던 줄리에트…… 님? 은 찬밥 신세였던 거라고 생각해요)"

[[dialogue]]
speaker = "unk"
original = "貴族だからといって、優雅な暮らしが約束されているわけでもないらしい。複雑な魔界事情だ。"
translation = "귀족이라고 해서 우아한 삶이 보장되는 것도 아닌 모양이다. 복잡한 마계 사정이다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「まぁ、庶民としては魔獣から守ってくれれば、どこの貴族でもいいんですけどね」"
translation = "「뭐, 서민으로서는 마수로부터 지켜주기만 한다면 어느 귀족이든 상관없지만요」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「む。せっかくヒントをあげているのに、何を言っているんです？\u3000これはあなたにとってチャンスなんですよ、カティア先輩」"
translation = "「흠. 짐짓 힌트를 주고 있는데 무슨 소릴 하시는 건가요? 이건 당신에게 기회라고요, 카티아 선배」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「え……？」"
translation = "「에……？」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「今のあなたなら、ハルヴィーノ戦士団よりも強い。領民の危機に駆け付けて活躍すれば、ハルヴィーノ領を乗っ取り、セルベラス領にすることだってできます」"
translation = "「지금의 당신이라면 할비노 전사단보다 강해요. 영민의 위기에 달려가 활약한다면 할비노 영지를 가로채서 셀베라스 영지로 만들 수도 있다고요」"

[[dialogue]]
speaker_original = "ジュリエッテ"
speaker_translation = "줄리엣타"
original = "「はあ！？\u3000このワンコロがでございますか！？」"
translation = "「하아!? 이 똥개 새끼가 말인가요!?」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「はい。ジュリエッテ様の数倍は強いですよ？\u3000何せ魔将ですから」"
translation = "「네. 줄리에트 님보다 몇 배는 강하다고요? 명색이 마장이니까요」"

[[dialogue]]
speaker = "unk"
original = "魔将の力はノヴァフォームに匹敵する。コラプサーであっても直接戦闘に向かないジュリエッテよりは当然強い。"
translation = "마장의 힘은 노바 폼에 필적한다. 콜랩서라 하더라도 직접 전투에 맞지 않는 줄리에트보다는 당연히 강하다."

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「シャルレーヌ様の言うことが本当だとしても、私はそんなことしません。ハルヴィーノ領がピンチなら、普通に助けに行くだけです」"
translation = "「샬레느 님이 하시는 말이 사실이라 해도, 저는 그런 짓 안 해요. 할비노 영지가 위기라면 그냥 도우러 갈 뿐이에요」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「へぇ、強欲の魔将ともあろう者が、無欲なんですね。十貴族に成り上がる近道で、世界征服の足掛かりになるかもしれなくても？」"
translation = "「헤에, 탐욕의 마장씩이나 되는 자가 무욕하군요. 십귀족으로 출세할 수 있는 지름길이고, 세계 정복의 발판이 될지도 모르는데?」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「はい。だって、私は魔王様の一番の配下で、星騎士だから。危ない目に遭っている人を助けるのが星騎士ですから！\u3000ね、魔王様！」"
translation = "「네. 왜냐면 저는 마왕님의 으뜸가는 부하이자 성기사니까. 위험에 처한 사람을 돕는 게 성기사니까요! 그죠, 마왕님!」"

[[dialogue]]
speaker = "unk"
original = "ああ。もちろんだ"
translation = "아아. 당연하지"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「魔王様が魔王様らしくあるだけで、世界がかしずく──それが私たちの世界征服だベロス！」"
translation = "「마왕님이 마왕님답게 계시는 것만으로 세계가 조아린다──그것이 우리의 세계 정복이다 베로스!」"

[[dialogue]]
speaker_original = "ジュリエッテ"
speaker_translation = "줄리엣타"
original = "（え……べろ？\u3000何でございますの、今のクソダサ語尾は？）"
translation = "(에…… 베로? 뭡니까, 방금 그 개구린 어미는?)"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「ふぅん……あくまでそういうスタンスなんですね。では、お手並み拝見といきましょうか」"
translation = "「후운…… 어디까지나 그런 스탠스군요. 그럼 실력을 감상해 보도록 할까요」"

[[dialogue]]
speaker_original = "ジュリエッテ"
speaker_translation = "줄리엣타"
original = "「世界征服を目指すなら、あなたたちも私のライバルでございます。首をお洗いになられるとよろしいですわ！」"
translation = "「세계 정복을 노린다면 당신들도 제 라이벌입니다. 목을 씻고 기다리시는 게 좋을 거예요!」"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「いや、ジュリエッテ様にはもう勝ってるし」"
translation = "「아니, 줄리에트 님한테는 이미 이겼는데」"

[[dialogue]]
speaker_original = "ジュリエッテ"
speaker_translation = "줄리엣타"
original = "「むき～～！\u3000ああ言えばこう言うワンコロですわ～！\u3000くぅ～、今日のところはこれで失礼いたしますわ！」"
translation = "「무기～～！ 말대꾸 하나는 잘하는 똥개입니다～！ 으윽～, 오늘은 이쯤에서 물러가 드리겠어요！」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「くふふ♪\u3000野良フェレットちゃん、しっぽ巻いて逃げちゃいましたね～♪」"
translation = "「쿠후후♪ 들페럿 양, 꼬리를 내리고 도망쳐 버렸네요～♪」"

[[dialogue]]
speaker_original = "シャルレーヌ"
speaker_translation = "샤를렌"
original = "「では、私も失礼いたします。おふたりの時間をお邪魔してすみません」"
translation = "「그럼 저도 물러가겠습니다. 두 분만의 시간을 방해해서 죄송했어요」"

[[dialogue]]
speaker = "unk"
original = "優雅に一礼して、シャルレーヌも去っていった。"
translation = "우아하게 인사하고, 샬레느도 떠나갔다."

[[dialogue]]
speaker = "unk"
original = "何だったんだろう、今の……"
translation = "뭐였던 걸까, 방금 건……"

[[dialogue]]
speaker_original = "カティア"
speaker_translation = "카티아"
original = "「さぁ……貴族って気まぐれなものですから……」"
translation = "「글쎄요…… 귀족이란 건 변덕스러운 법이니까요……」"

[[dialogue]]
speaker = "unk"
original = "どっと疲れた俺たちは、花の水やりを手早く終えて帰路に就いたのだった……"
translation = "피로가 팍 몰려온 우리들은, 화단의 물주기를 서둘러 마치고 집으로 돌아갔던 것이었다……"

