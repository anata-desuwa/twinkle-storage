[[dialogue]]
speaker = "unk"
original = "第７話,２０００年前の、悪の魔王,B"
translation = "제7화, 2000년 전의 악의 마왕, B"

[[dialogue]]
speaker = "unk"
original = "血のように紅く染まった、魔界の原野。"
translation = "피처럼 붉게 물든 마계의 원야."

[[dialogue]]
speaker = "unk"
original = "そこに降り立ったのは、漆黒の翼を持つ、１人の少女──"
translation = "그곳에 내려선 것은 칠흑의 날개를 가진 한 소녀──"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「……世界を、やり直さなくちゃ」"
translation = "「……세계를, 다시 시작해야 해」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「姫様──！\u3000もう……もうやめてください……！\u3000正気を取り戻して……！！」"
translation = "「공주님──! 이제…… 이제 그만두세요……! 제정신을 차려주세요……!!」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「すべてを壊し、作り直す──再創生でしか、この世界は、救われない……」"
translation = "「모든 것을 부수고 다시 만든다── 재창생으로밖에 이 세계는 구원받을 수 없어……」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「姫様──！！」"
translation = "「공주님──!!」"

[[dialogue]]
speaker_original = "？？？"
speaker_translation = "？？？"
original = "「壊す、壊す、壊す、壊す、壊す──」"
translation = "「부순다, 부순다, 부순다, 부순다, 부순다──」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（なに……今の……）"
translation = "（뭐지…… 방금 건……）"

[[dialogue]]
speaker = "unk"
original = "数多の人々を襲い続けていたのは、誰？"
translation = "수많은 사람을 계속 습격하고 있던 건 누구?"

[[dialogue]]
speaker = "unk"
original = "瘴気に呑まれ、破滅を望んでいたのは──"
translation = "장기에 집어삼켜져 파멸을 바라고 있었던 것은──"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（わた、し……？）"
translation = "（나, 야……?）"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「……ぅ、ぁっ……！！」"
translation = "「……으, 앗……!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「──見事だったわ、衛兵隊長。使徒メルエルの駒として、お前の影を作ることも検討しましょうか」"
translation = "「──훌륭했어, 위병대장. 사도 멜엘의 말로서 네 그림자를 만드는 것도 검토해 볼까」"

[[dialogue]]
speaker_original = "ケイティ"
speaker_translation = "케이티"
original = "「ごめん、ねっ……２人、とも……」"
translation = "「미안, 해…… 둘, 다……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ケイティ、姉、さん……！」"
translation = "「케이티 언, 니……!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「聖庭園最強の星騎士の実力、堪能させてもらったわ。模造品とはいえ、使徒たちを葬るだけはある」"
translation = "「성정원 최강의 성기사 실력, 충분히 감상했어. 모조품이라곤 해도 사도들을 장사지낼 만은 하네」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「おぉおおっ──！！」"
translation = "「오오오옷──!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「まだ来るの？\u3000鬱陶しいわね──」"
translation = "「또 오는 거야? 성가시네──」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ぁっ──ぐ、ぁっ…………！！」"
translation = "「앗── 윽, 아……!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「仕留めるつもりで放ったのだけど、よく耐えたわね？\u3000星騎士の強さは精神力。そのことは知っているつもりだったけれど……」"
translation = "「숨통을 끊을 생각으로 쏜 건데 잘 버텼네? 성기사의 강함은 정신력. 그 사실은 알고 있다고 생각했지만……」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「本来なら、とうの昔に戦闘不能になっているはず……ふふ。貴女にも少し、興味が出てきたわ」"
translation = "「본래라면 진작에 전투 불능이 되었어야 할 텐데…… 후후. 너에게도 조금 흥미가 생겼어」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「何を、言ってるの……」"
translation = "「무슨 소리를 하는 거야……」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「聞かせて頂戴？\u3000貴女は、姫咲メルエルが嫌いだったのよね？」"
translation = "「들려주겠어? 너는 히메사키 멜엘을 싫어했었지?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「神殿にいる間、私にも貴女の過去は共有されていたわ。全て見せてもらった」"
translation = "「신전에 있는 동안 나에게도 네 과거는 공유되었어. 전부 봤지」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「あの能天気な魔王の血統さえいなければ、もっと自由に生きることができたのに──」"
translation = "「그 낙천적인 마왕의 혈통만 없었더라면 더 자유롭게 살 수 있었을 텐데──」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「母さんとの仲だって、もっと真っ当だったかもしれないのに──」"
translation = "「어머니와의 관계도 더 제대로였을지도 모르는데──」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「いなくなれ。消えてしまえ──そう何度も思っていたのに……なぜ今は、命を懸けてまで抵抗するの？」"
translation = "「사라져라. 없어져 버려── 그렇게 몇 번이나 생각했으면서…… 왜 지금은 목숨까지 걸어가며 저항하는 거지?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「何を、くだらないことを、グダグダと……！」"
translation = "「무슨, 쓸데없는 소리를 주절주절……!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「知った風な口、利かないでくれる！？\u3000勝手に覗き見て、勝手に決めつけて──不愉快なんだけど！？」"
translation = "「다 안다는 듯이 지껄이지 말아줄래!? 마음대로 엿보고 마음대로 단정 짓고── 불쾌하거든!?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「気になるのよ。今の貴女はとても強い。だから不思議でならないの」"
translation = "「신경 쓰여. 지금의 너는 매우 강해. 그래서 이상하기 짝이 없어」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「命を懸けてまで、嫌いな相手を守りたいだなんて……理解が出来ない」"
translation = "「목숨을 걸면서까지 싫어하는 상대를 지키고 싶다니…… 이해할 수 없어」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「私は新たな女神として、たくさんのことを学ばなければならない。理解できないものは、できる限り繙いて、知識としなくてはね？」"
translation = "「나는 새로운 여신으로서 많은 것을 배워야 해. 이해할 수 없는 것은 가능한 한 파헤쳐서 지식으로 삼아야 하거든」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「貴女が命を懸ける理由……己の役割に、誇りを持っている？\u3000これなら理解できる。私もお父様の命令は、命を捨ててでも叶えたいもの」"
translation = "「네가 목숨을 거는 이유…… 자신의 역할에 긍지를 가지고 있다? 이거라면 이해할 수 있어. 나도 아버님의 명령은 목숨을 버려서라도 이루고 싶은 것이니까」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「はぁ！？\u3000聖庭園の命令なんて、どうでもいい！\u3000エージェントなんて、いつ辞めようかって思ってるくらいだよ！」"
translation = "「하아!? 성정원의 명령 따위 아무래도 좋아! 에이전트 같은 거 언제 그만둘까 생각할 정도라고!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「メルエルだって嫌い！\u3000母さんと同じくらい──大嫌い！！」"
translation = "「멜엘도 싫어! 어머니만큼이나── 정말 싫어!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「なら、どうして？\u3000興味が尽きないわ。教えて頂戴？」"
translation = "「그럼 어째서? 흥미가 끊이지 않네. 가르쳐주겠어?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「このぉっ──！！」"
translation = "「이이익──!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「見なさい、姫咲メルエルの顔を。瘴気に呑まれて、とても苦しんでいる」"
translation = "「보렴, 히메사키 멜엘의 얼굴을. 장기에 삼켜져서 무척 고통스러워하고 있어」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「あの子の泣いている顔が好きだって、そう言っていたでしょう？」"
translation = "「저 아이의 우는 얼굴이 좋다고, 그렇게 말했었잖아?」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「なのに散乃ナターシャ。今の貴女はなぜそんなにも、面白くなさそうな──辛そうな顔をしているのかしら？」"
translation = "「그런데 치루노 나타샤. 지금의 너는 왜 그렇게나 재미없어 보이는── 괴로운 듯한 표정을 짓고 있는 걸까?」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「うっざ──今のメルエルを見たって、嫌な気分になるだけだっての！！」"
translation = "「짜증 나── 지금의 멜엘을 봤자 기분만 더러울 뿐이라고!!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「メルエルの泣いてる顔は好きだよ──せいせいするから！\u3000ざまあみろって思えて、楽しいから！」"
translation = "「멜엘의 우는 얼굴은 좋아해── 속이 시원하니까! 꼴 좋다고 생각돼서 즐거우니까!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「でもね──そんな捻くれた私でも……！」"
translation = "「하지만 말이야── 그런 뒤틀린 나라도……!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「気に入る泣き顔と、気に入らない泣き顔ってのがあるの──！！」"
translation = "「마음에 드는 우는 얼굴과, 마음에 안 드는 우는 얼굴이 있다는 거야──!!」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「──結論、ヒトは不可解。不完全な生命だもの、理屈で説明しろと言う方が無理な話だったわね」"
translation = "「──결론, 인간은 불가해. 불완전한 생명이니 논리로 설명하라는 게 무리한 이야기였네」"

[[dialogue]]
speaker_original = "ラストナンバー"
speaker_translation = "라스트 넘버"
original = "「もういいわ──消えなさい」"
translation = "「이제 됐어── 사라지렴」"

[[dialogue]]
speaker = "unk"
original = "極大の霊力が束となって、ナターシャの全身を直撃する──"
translation = "극대의 영력이 다발이 되어 나타샤의 전신을 직격한다──"

[[dialogue]]
speaker = "unk"
original = "神殿の床を滑るように転がって、瘴気に苦しむメルエルのすぐそばまで、ナターシャは吹き飛ばされた。"
translation = "신전 바닥을 미끄러지듯 굴러, 장기로 고통받는 멜엘의 바로 옆까지 나타샤는 날려 갔다."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ナ、ターシャ、ちゃんっ……逃げ、てっ……」"
translation = "「나, 타샤 짱…… 도망, 쳐……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「……あん、た……こんな、時にね……」"
translation = "「……너…… 이런, 때까지……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ケイティ、お姉ちゃんと、一緒に……何とか、外に出てっ……人間界、に……」"
translation = "「케이티 언니랑 같이…… 어떻게든 밖으로 나가…… 인간계로……」"

[[dialogue]]
speaker = "unk"
original = "ラストナンバーには敵わない。自分を見捨てて、緋宮クロトのもとへ。"
translation = "라스트 넘버에게는 당해낼 수 없다. 자신을 버리고 히노미야 쿠로토의 곁으로."

[[dialogue]]
speaker = "unk"
original = "メルエルは懸命に言葉を紡ぐが──"
translation = "멜엘은 필사적으로 말을 이어가지만──"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「…………ほんっとうに……嫌い……」"
translation = "「…………정말로…… 싫어……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「ヒトの気持ちも知らないで……危なっかしくて……自分のことは、いつも、後回し……」"
translation = "「남의 속도 모르고…… 위태롭고…… 자기 일은 언제나 뒷전이고……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「メルエルが……魔王なんかじゃ、なかったら……こんな風に、悩まなくて、すんだのに……」"
translation = "「멜엘이…… 마왕 같은 게 아니었다면…… 이런 식으로 고민하지 않아도 됐을 텐데……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「…………苦しい、でしょ……それ……？」"
translation = "「…………괴롭지…… 그거……?」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ぁ──だ、だめ──！」"
translation = "「아── 안 돼, 안 돼──!」"

[[dialogue]]
speaker = "unk"
original = "ナターシャが、メルエルの手をそっと握る──途端に、瘴気が繋いだ手を伝って、ナターシャをも呑み込みにかかる。"
translation = "나타샤가 멜엘의 손을 살며시 잡는다── 그 즉시 장기가 맞잡은 손을 타고 나타샤마저 집어삼키려 한다."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "「ぁ、あぁっ……やめて……離、してっ……ナターシャちゃん……！」"
translation = "「아, 아앗…… 그만둬…… 놔, 줘…… 나타샤 짱……!」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「──あは。良い顔……メルエルの辛そうな顔、やっぱサイコーだよね……」"
translation = "「──아하. 좋은 표정…… 멜엘의 고통스러운 얼굴, 역시 최고네……」"

[[dialogue]]
speaker_original = "ナターシャ"
speaker_translation = "나타샤"
original = "「やっぱり、メルエルの顔をゆがめるのは……自分でやらなきゃ、面白くないや……」"
translation = "「역시 멜엘의 얼굴을 일그러뜨리는 건…… 내가 직접 하지 않으면 재미없단 말이지……」"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（……嫌だ）"
translation = "（……싫어）"

[[dialogue]]
speaker = "unk"
original = "自分だけでなく、大切な幼なじみまで──瘴気に呑まれていく。"
translation = "자신뿐만 아니라 소중한 소꿉친구까지── 장기에 삼켜져 간다."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（……このまま死んじゃうだなんて、自分が消えちゃうだなんて、嫌だよ！！）"
translation = "（……이대로 죽어버리다니, 내가 사라져버리다니 싫어!!）"

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（ずっと何も知らずに生きてきた……ナターシャちゃんや、ケイティお姉ちゃんに、知らずに守られて、生きてきた……！）"
translation = "（계속 아무것도 모른 채 살아왔어…… 나타샤 짱이나 케이티 언니에게 나도 모르게 보호받으며 살아왔어……!）"

[[dialogue]]
speaker = "unk"
original = "──このまま瘴気に汚染され尽くしたら。"
translation = "──이대로 장기에 완전히 오염되어 버린다면."

[[dialogue]]
speaker = "unk"
original = "──自分は、本当に何もできないまま。"
translation = "──나는 정말 아무것도 못한 채로."

[[dialogue]]
speaker = "unk"
original = "──大好きな幼なじみの人生を歪めるだけ歪めて、逝くことになる。"
translation = "──정말 좋아하는 소꿉친구의 인생을 일그러뜨릴 대로 일그러뜨리고 떠나게 된다."

[[dialogue]]
speaker_original = "メルエル"
speaker_translation = "메르엘"
original = "（それだけは、絶対に──嫌だよ──！！！）"
translation = "（그것만은 절대로── 싫어──!!!）"

[[dialogue]]
speaker = "unk"
original = "その想いを強く、強く胸に抱くも……"
translation = "그 마음을 강하게, 강하게 가슴에 품었지만……"

[[dialogue]]
speaker = "unk"
original = "瘴気の汚染は、止まらない──"
translation = "장기의 오염은 멈추지 않는다──"

