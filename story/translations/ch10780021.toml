[[dialogue]]
speaker = "unk"
original = "第１話,光の魔女の落とし方,P"
translation = "제1화, 빛의 마녀를 공략하는 방법, P"

[[dialogue]]
speaker = "unk"
original = "現代に再誕した、先代・光の魔女のトリュファイナさん。"
translation = "현대에 재탄생한, 선대 빛의 마녀인 트리파이나 씨."

[[dialogue]]
speaker = "unk"
original = "これは、彼女と俺がまだ交際を始める前の話だ──"
translation = "이것은, 그녀와 내가 아직 교제를 시작하기 전의 이야기다──"

[[dialogue]]
speaker = "unk"
original = "トリュファイナさんに告白しようと思う"
translation = "트리파이나 씨에게 고백하려고 한다"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「なんと……！」"
translation = "「무려……!」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「とうとう覚悟を決めたんだね、会長！\u3000応援してるよ！」"
translation = "「드디어 각오를 다진 거구나, 회장! 응원하고 있을게!」"

[[dialogue]]
speaker = "unk"
original = "でも悩んでることがあって……"
translation = "하지만 고민하고 있는 것이 있어서……"

[[dialogue]]
speaker = "unk"
original = "２人とも、ありがとう！"
translation = "둘 다, 고마워!"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「ふむ……？\u3000永き時を生きる、魔女の中でもとびきり格の高い『光の魔女様』に、どのようにアプローチすれば良いのかわからない、と」"
translation = "「흠……? 오랜 세월을 살아가는 마녀 중에서도 유독 격이 높은 『빛의 마녀님』에게, 어떻게 접근하면 좋을지 모르겠다, 라」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「確かに私たちとは生きてきた時代も違うし、ずっと年上の魔女さんだけれど……」"
translation = "「확실히 우리와는 살아온 시대도 다르고, 훨씬 연상인 마녀님이지만……」"

[[dialogue]]
speaker = "unk"
original = "アイデアが欲しい！"
translation = "아이디어가 필요해!"

[[dialogue]]
speaker = "unk"
original = "絶対に失敗したくないんだ"
translation = "절대로 실패하고 싶지 않아"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「特に奇をてらった作戦などいらないと思いますが。傍目から見て、光の魔女様は会長にぞっこんに見えます」"
translation = "「딱히 엉뚱한 작전 따위는 필요 없을 거라 생각합니다만. 겉에서 보기에, 빛의 마녀님은 회장님에게 푹 빠져 있는 것처럼 보입니다」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「うん。会長が告白したら、二つ返事でＯＫしてくれそうだよね……」"
translation = "「응. 회장이 고백하면, 선뜻 OK해 줄 것 같은데……」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「しかしオーダーは把握しました。トリュファイナさんが告白をＯＫしたくなるようなアプローチのアイデアを出せばいいのですね」"
translation = "「하지만 오더는 파악했습니다. 트리파이나 씨가 고백을 OK하고 싶어질 만한 접근 아이디어를 내면 되는 것이군요」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「んー。やはり王道がよいのでは？\u3000放課後に校舎裏に呼び出して、愚直に『あいらぶゆー』とアタックです」"
translation = "「음─. 역시 왕도가 좋지 않을까요? 방과 후에 교사 뒤편으로 불러내서, 솔직하게 『아이 러브 유』라고 어택하는 겁니다」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「別のパターンだったら……ラブレターとか！\u3000形に残るものだったら、喜んでくれるかも！」"
translation = "「다른 패턴이라면…… 러브레터라든가! 형태에 남는 거라면, 기뻐해 줄지도!」"

[[dialogue]]
speaker = "unk"
original = "２人とも、楽しそうだなあ……"
translation = "둘 다, 즐거워 보이는걸……"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「楽しいですね。会長のコイバナですよ？」"
translation = "「즐겁네요. 회장님의 연애담이라고요?」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「うん！\u3000すっごく楽しい！\u3000でも悩むなあ、どんなアプローチがいいかなぁ……！」"
translation = "「응! 엄청 즐거워! 하지만 고민되네, 어떤 접근이 좋을까나……!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「──盛り上がっておりますね、先輩方」"
translation = "「──열기가 뜨겁네요, 선배님들」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「あ、あなたは──『閃光』のシュティレちゃん！？」"
translation = "「아, 너는── 『섬광』의 슈틸레짱!?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。『閃光』のシュティレです。話は聞かせていただきましたよ」"
translation = "「네. 『섬광』의 슈틸레입니다. 이야기 들었습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「僭越ながら、トリュファイナさんへのアプローチでアイデアがございます。シュティレは光の魔女様とズッ友の間柄ですので。ぶい」"
translation = "「주제넘지만, 트리파이나 씨에게 할 접근으로 아이디어가 있습니다. 슈틸레는 빛의 마녀님과 베프 관계이니까요. 브이」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「おお。購買部で一緒に過ごすことが多いですものね。会長、貴重な意見が貰えそうですよ」"
translation = "「오오. 매점에서 함께 보내는 일이 많으니까요. 회장, 귀중한 의견을 얻을 수 있을 것 같아요」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「これは先日の話です。購買部の休憩時間に、シュティレのタブレットで、トリュファイナさんと漫画を読んでおりました──」"
translation = "「이건 요전 날의 이야기입니다. 매점 휴식 시간에, 슈틸레의 태블릿으로, 트리파이나 씨와 만화를 읽고 있었습니다──」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ほぇえ～……これが現代の『少女漫画』というものなのですねっ。勉強になりますっ……！」"
translation = "「호에에～…… 이것이 현대의 『순정만화』라는 것이군요. 공부가 됩니다……!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。クラスメイトからオススメされて購入したのですが、なかなかどうして読ませますね」"
translation = "「네. 반 친구에게 추천받아 구입한 것입니다만, 제법 재미있게 읽히네요」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ふふ。シュティレ様は、ロボットの出てくる漫画ばかり読んでいらっしゃいますものね」"
translation = "「후후. 슈틸레 님은, 로봇이 나오는 만화만 읽고 계셨으니까요」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ええ。ギガンドムのコミカライズは余さずチェックしていますが、少女漫画は新鮮です」"
translation = "「네. 기간돔의 코미컬라이즈는 빠짐없이 체크하고 있습니다만, 순정만화는 신선합니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「あ──とうとうイケメン君が、ヒロインに告白するみたいですね。少女漫画の山場と言えましょう」"
translation = "「아── 드디어 미남군이, 히로인에게 고백하는 모양이네요. 순정만화의 절정이라 할 수 있겠죠」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「……ほ、ほぇっ！？\u3000この情熱的なアプローチはいったい！？」"
translation = "「……호, 호에!? 이 열정적인 어프로치는 도대체!?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「壁ドンというやつですね。主に俺様系の男子が、内気な女子に向かって行う、逃げ場を封じる告白シチュエーションです」"
translation = "「카베돈(벽치기)이라는 것입니다. 주로 나쁜 남자 스타일의 남성이, 내성적인 여성을 향해 실시하는, 도망칠 곳을 막는 고백 시츄에이션입니다」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「か、壁ドン……！？\u3000こ、ここ、こんな距離で逃げ場をなくされて、意中の殿方から見つめられては、ひとたまりも……！！」"
translation = "「카, 카베돈……!? 이, 이, 이런 거리에서 도망칠 곳을 잃고, 마음에 둔 남성분이 바라보시면, 당해낼 수가……!!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「し、しかも──『俺の女になれ』！？\u3000ひゃぁ！？\u3000顎をクイって持ち上げて──そんな、口づけまで！？\u3000ほぇぇえ～……！」"
translation = "「게, 게다가── 『내 여자가 되어라』!? 히야아!? 턱을 슥 올려 세우고── 세상에, 입맞춤까지!? 호에에에~……!」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「現代の恋愛アプローチは多様です。いかがですか、トリュファイナさん」"
translation = "「현대의 연애 접근은 다양합니다. 어떠신가요, 트리파이나 씨」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「３０００年前には、このような文化はありませんでした……壁ドン……す、少しっ……憧れてしまうかも、しれません……」"
translation = "「3000년 전에는, 이러한 문화가 없었습니다…… 카베돈…… 조금…… 동경하게 될지도, 모르겠습니다……」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「──以上です。ご清聴ありがとうございました。ぶい」"
translation = "「──이상입니다. 경청해 주셔서 감사합니다. 브이」"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「これは強力な情報ですね。会長、壁ドンでいきましょう」"
translation = "「이건 강력한 정보네요. 회장, 카베돈으로 가죠」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「やるしかないよ会長！\u3000善は急げ！\u3000今日の放課後、早速決行しよう！！」"
translation = "「할 수밖에 없어 회장! 쇠뿔도 단김에 빼라! 오늘 방과 후, 당장 결행하자!!」"

[[dialogue]]
speaker = "unk"
original = "えぇええぇえぇえぇ！？！？！？"
translation = "에에에에에에에!?!?!?!"

[[dialogue]]
speaker = "unk"
original = "みんなに背中を押された勢いで、俺はトリュファイナさんを空き教室に呼びだした──"
translation = "모두에게 등 떠밀린 기세로, 나는 트리파이나 씨를 빈 교실로 불러냈다──"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ま、魔王様。お待たせいたしました。私に何かご用事があると……」"
translation = "「마, 마왕님. 기다리시게 했습니다. 제게 무슨 볼일이라도……」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "（放課後の空き教室……な、なんだかドキドキしてしまいますっ……！\u3000先日読んだ少女漫画と、まったく同じ状況……！）"
translation = "(방과 후의 빈 교실…… 왠지 두근거려 버립니다……! 요전 날 읽은 순정만화와, 완전히 같은 상황……!)"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "（い、いけませんいけませんっ。魔王様はとても真面目なお顔をしていらっしゃいます。浮ついた気持ちは封じなければ……！）"
translation = "(아, 안 됩니다 안 됩니다. 마왕님은 매우 진지한 얼굴을 하고 계십니다. 들뜬 마음은 가라앉혀야……!)"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「それで魔王様。お話とは、いったい──」"
translation = "「그래서 마왕님. 할 말씀이란, 대체──」"

[[dialogue]]
speaker = "unk"
original = "俺はトリュファイナさんを壁際に追い詰めた──壁ドンである。"
translation = "나는 트리파이나 씨를 벽가로 몰아넣었다── 카베돈이다."

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「──ほぇっ！？」"
translation = "「──호엣!?」"

[[dialogue]]
speaker = "unk"
original = "……トリュファイナ"
translation = "……트리파이나"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「は、はいぃっ！？」"
translation = "「네, 네엣!?」"

[[dialogue]]
speaker = "unk"
original = "……俺の女になれ"
translation = "……내 여자가 돼라"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ほぇえぇぇぇえぇえ～～～～～っ！？！？！？」"
translation = "「호에에에에에에~~!?!?!?」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "（こ、告白っ！？\u3000私、告白されています！？！？\u3000しかも壁ドン！！\u3000あの壁ドンです～っ！？！？）"
translation = ""

[[dialogue]]
speaker = "unk"
original = "返事、聞かせろよ？"
translation = "대답, 들려줄래?"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「ぁ……あの！\u3000あのあのっ……そのぉっ……！！」"
translation = "「아…… 저기! 저기 저기…… 그게 말이죠……!!」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「つ、謹んで……お、お受け、いたします……<emoji=heart04>」"
translation = "「삼, 삼가…… 받, 받아들이겠, 습니다……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "（成功したあぁぁぁぁッッッ！？！？）"
translation = "（성공했다아아아아읏!?!?!?）"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "（こ、この後は……顎クイがあって、それでそれで……！）"
translation = "(이, 이 다음은…… 턱을 슥 올리고, 그래서 그래서……!)"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「じ……じぃ～…………<emoji=heart04>」"
translation = "「빤…… 빤히～…………<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "（顎クイとキスを待ってる────！？！？）"
translation = "(턱 슥이랑 키스를 기다리고 있어────!?!?)"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "（あ、あれれ？\u3000見つめてキスをおねだりしたの、間違っていたでしょうか……！？\u3000はしたないって、思われたでしょうか！？）"
translation = "(어, 어라라? 바라보며 키스를 졸라댄 것, 잘못된 걸까요……!? 얌전하지 못하다고, 생각하셨을까요!?)"

[[dialogue]]
speaker = "unk"
original = "トリュファイナさん、ジッとして"
translation = "트리파이나 씨, 가만히 있어 봐"

[[dialogue]]
speaker = "unk"
original = "（最後まで、しっかりやらなきゃ……！）"
translation = "(끝까지, 제대로 해야 해……!)"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「あ……魔王様──<emoji=heart04>」"
translation = "「아…… 마왕님──<emoji=heart04>」"

[[dialogue]]
speaker_original = "トリュファイナ"
speaker_translation = "트류파이나"
original = "「んぅ────ちゅっ<emoji=heart04>」"
translation = "「응으──── 쪽<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "トリュファイナさんの顎をそっと持ち上げて、俺はキスをした。"
translation = "트리파이나 씨의 턱을 살며시 들어 올리고, 나는 키스를 했다."

[[dialogue]]
speaker = "unk"
original = "こうして俺とトリュファイナさんは、恋人同士になったのだった──"
translation = "이렇게 나와 트리파이나 씨는, 연인 사이가 된 것이었다──"

[[dialogue]]
speaker_original = "アナ"
speaker_translation = "아나"
original = "「……わーぉ」"
translation = "「……와─우」"

[[dialogue]]
speaker_original = "マトイ"
speaker_translation = "마토이"
original = "「心配でついてきたけどっ……みみみ、見ちゃいけないものまで見ちゃったかも！？」"
translation = "「걱정돼서 따라왔는데…… 보, 보, 봐서는 안 될 것까지 봐버렸을지도!?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「そうですね。無粋なギャラリーはクールに去るとしましょう」"
translation = "「그렇군요. 멋없는 갤러리는 쿨하게 떠나기로 하죠」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……よかったですね。トリュファイナさん」"
translation = "「……잘됐네요. 트리파이나 씨」"

