[[dialogue]]
speaker = "unk"
original = "第１話,シルヴィ先輩と海デート,P"
translation = "제1화, 실비 선배와 바다 데이트"

[[dialogue]]
speaker = "unk"
original = "今日はシルヴィ先輩のリクエストで海にやってきた。"
translation = "오늘은 실비 선배의 요청으로 바다에 왔다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「へー、これが本物の海かぁ……」"
translation = "「헤에, 이게 진짜 바다구나……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「いや、もちろん見たことはあるんだけど、ちゃんと『海に来た』のは初めてかも。リゾート結界もよかったけど、本物も素敵だね」"
translation = "「아니, 물론 본 적은 있지만, 제대로 『바다에 온』 건 처음일지도. 리조트 결계도 좋았지만, 진짜도 멋지네」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「天界は海がないから、新鮮だよ。人間界で言うと、ウミナシケンってやつ？」"
translation = "「천계는 바다가 없어서 신선해. 인간계로 치면, 우미나시현(바다 없는 현) 같은 거?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「それにしても…………」"
translation = "「그건 그렇고…………」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「人が！\u3000多い！！\u3000あはははははっ！」"
translation = "「사람이! 많아!! 아하하하하하!」"

[[dialogue]]
speaker = "unk"
original = "当然、夏の海水浴場は人でごった返している。家族連れ、カップル、若者のグループ、そこら中に人が溢れていた。"
translation = "당연히 여름 해수욕장은 사람들로 북적거리고 있다. 가족 동반, 커플, 젊은이들 그룹 등 사방에 사람이 넘쳐났다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「いやー、人間界ってホントに人多いよね。うちの田舎はお祭りのときでもこんなに混まないから、テンション上がっちゃう！」"
translation = "「이야─, 인간계는 정말 사람이 많네. 우리 시골은 축제 때도 이렇게 붐비지 않으니까 텐션 올라가버려!」"

[[dialogue]]
speaker = "unk"
original = "先輩、手を"
translation = "선배, 손을"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「うん、ありがとう。はぐれたら大変だもんね」"
translation = "「응, 고마워. 길 잃으면 큰일이니까」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「にぎにぎ……にぎにぎ……会長くんの手、汗ばんでるね。なんか緊張してる？\u3000久々のデートだから？」"
translation = "「니기니기…… 니기니기…… 회장 군의 손, 땀나고 있네. 왠지 긴장하고 있어? 오랜만의 데이트라 그런가?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「そ・れ・と・も～～……あたしの水着にドキドキしてるのかな？\u3000会長くんのエッチ」"
translation = "「그·러·면·서 도~~…… 내 수영복에 두근거리고 있는 걸까? 회장 군 변태」"

[[dialogue]]
speaker = "unk"
original = "頷くしかできない。それくらい、シルヴィ先輩の水着姿は刺激的だった。"
translation = "고개를 끄덕일 수밖에 없다. 그 정도로 실비 선배의 수영복 차림은 자극적이었다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あははっ、照れちゃってかわいいっ。でもせっかくの水着なんだから、ちゃんと見て欲しいな。恋人なんだからじっくり見ていいんだよ」"
translation = "「아하하, 부끄러워해서 귀여워엇. 하지만 기껏 입은 수영복이니까 제대로 봐줬으면 좋겠어. 연인이니까 뚫어지게 봐도 된다구」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ほーら、見て見て」"
translation = "「자아, 봐 봐」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「それに……まだ感想、聞いてないよ？」"
translation = "「그리고…… 아직 감상, 안 들려줬어?」"

[[dialogue]]
speaker = "unk"
original = "すごく似合ってます"
translation = "정말 잘 어울려요"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩の健康的な体を華やかな水着が彩っていて、本当に綺麗だ。"
translation = "실비 선배의 건강미 넘치는 몸을 화려한 수영복이 장식하고 있어 정말 아름답다."

[[dialogue]]
speaker = "unk"
original = "だけど同時に、ボディラインがはっきりわかって目に毒でもある。"
translation = "하지만 동시에 바디라인이 뚜렷하게 드러나서 눈이 즐겁기도 하고 괴롭기도 하다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ふふっ、ありがとう。言わせたみたいになってごめんね。でもすごく嬉しいっ！」"
translation = "「후훗, 고마워. 억지로 말하게 한 것 같아서 미안하네. 하지만 정말 기뻐!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「さぁ、これからどうしよっか」"
translation = "「자, 이제 어떡할까?」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩が俺の腕に抱き着いた。必然的に柔らかい感触が押し付けられる。"
translation = "실비 선배가 내 팔에 매달렸다. 필연적으로 부드러운 감촉이 눌려온다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ん？\u3000どーしたの？」"
translation = "「응? 왜 그래?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「おっぱいが当たってる？\u3000うん、わざと。こんなに人がいるんだもん。会長くんはあたしのだってアピールしとかなきゃ」"
translation = "「가슴이 닿는다고? 응, 일부러야. 이렇게 사람이 많은걸. 회장 군은 내 거라고 어필해 둬야지」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「会長くんも、あたしからよそ見しちゃダメだからね？」"
translation = "「회장 군도 나 말고 딴데 보면 안 돼?」"

[[dialogue]]
speaker = "unk"
original = "よそ見なんてしませんよ"
translation = "딴데 안 봐요"

[[dialogue]]
speaker = "unk"
original = "そんなことできるわけがない。シルヴィ先輩しか視界にないから。"
translation = "그럴 수 있을 리가 없다. 실비 선배밖에 시야에 없으니까."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ふふっ、よろしい」"
translation = "「후훗, 좋았어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「じゃあ、まずは泳ぎ──ちょっと待って！」"
translation = "「자, 그럼 우선 수영── 잠깐만!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あっちの海の家、メガジャンボチキン売ってるって！\u3000のぼりが立ってる！\u3000行ってみようよ！」"
translation = "「저기 바다의 집, 메가 점보 치킨 판대! 깃발이 서 있어! 가보자!」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩が俺の手を引いて走る。"
translation = "실비 선배가 내 손을 끌고 달린다."

[[dialogue]]
speaker = "unk"
original = "興味を持ったら一直線で、俺より年上だけど、こういうところは子どもみたいだ。"
translation = "흥미를 가지면 일직선이라, 나보다 연상이지만 이런 부분은 아이 같다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ほら、着いた！」"
translation = "「보라구, 도착!」"

[[dialogue]]
speaker = "unk"
original = "傍に立つのぼりには、でかでかと『メガジャンボチキン』と書いてあった。さっきいたところからは距離があったけど、よく見付けられたものだ。"
translation = "옆에 서 있는 깃발에는 큼지막하게 『메가 점보 치킨』이라고 적혀 있었다. 아까 있던 곳에선 꽤 거리가 있었는데 잘도 찾아낸 것이다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あたしを呼ぶチキンの声が聞こえたんだよ！\u3000チキンあるところシルヴィあり、だからね！」"
translation = "「나를 부르는 치킨의 목소리가 들렸어! 치킨 있는 곳에 실비 있다, 라니까!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「おじさーん！\u3000メガジャンボチキンくださーい！」"
translation = "「아저씨─! 메가 점보 치킨 주세요─!」"

[[dialogue]]
speaker_original = "おじさん"
speaker_translation = "아저씨"
original = "「あ、ごめんね。メガジャンボチキンは１日１０食限定なんだ。なにせメガジャンボだからね」"
translation = "「아, 미안하구나. 메가 점보 치킨은 하루 10개 한정이야. 아무래도 메가 점보니까 말이다」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「そんなー！\u3000チキンの声は幻聴だった！？」"
translation = "「그럴 수가─! 치킨의 목소리는 환청이었어!?」"

[[dialogue]]
speaker_original = "おじさん"
speaker_translation = "아저씨"
original = "「普通のフライドチキンならあるよ？」"
translation = "「보통 프라이드치킨이라면 있어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「よかった、幻聴じゃなかった！\u3000それふたつください！」"
translation = "「다행이다, 환청이 아니었어! 그거 두 개 주세요!」"

[[dialogue]]
speaker_original = "おじさん"
speaker_translation = "아저씨"
original = "「はいよ、毎度あり～」"
translation = "「네, 여기 있다~」"

[[dialogue]]
speaker = "unk"
original = "おじさんから受け取ったのは、文字通り普通のフライドチキンだった。フライドチキン以外の何物でもなかった。"
translation = "아저씨에게 받은 것은 문자 그대로 평범한 프라이드치킨이었다. 프라이드치킨 외에 아무것도 아니었다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「はい、会長くんの分」"
translation = "「자, 회장 군 거」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「いただきまーす。……もぐもぐ……もぐもぐ……あはっ、あはははっ！」"
translation = "「잘 먹겠습니다. ……우물우물…… 우물우물…… 아핫, 아하하하하!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ほんっとうに普通のフライドチキンだー！！\u3000あははははっ！」"
translation = "「정말로 평범한 프라이드치킨이야─!! 아하하하하!」"

[[dialogue]]
speaker = "unk"
original = "俺もひとかじり……うん、実にフライドチキン。"
translation = "나도 한 입…… 응, 실로 프라이드치킨."

[[dialogue]]
speaker = "unk"
original = "普通に美味しい。でも流星市国ならどこでも食べられるくらいの味だ。"
translation = "평범하게 맛있다. 하지만 유성시국이라면 어디서든 먹을 수 있을 법한 맛이다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「せっかく海まで来たのに、結局いつもと同じことしてる！\u3000あはははっ！\u3000なんか可笑しいね」"
translation = "「기껏 바다까지 왔는데 결국 평소랑 똑같은 짓 하고 있어! 아하하하! 왠지 웃기네」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「会長くん、付き合ってくれてありがとう。振り回しちゃってごめんね」"
translation = "「회장 군, 같이 와줘서 고마워. 휘둘러서 미안해」"

[[dialogue]]
speaker = "unk"
original = "謝る必要なんてない。そんなシルヴィ先輩が好きだし、振り回されるのだって好きだ。"
translation = "사과할 필요 따위 없다. 그런 실비 선배가 좋고, 휘둘리는 것도 좋다."

[[dialogue]]
speaker = "unk"
original = "むしろこれからも振り回されたいです"
translation = "오히려 앞으로도 휘둘리고 싶어요"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「言ったな～？\u3000じゃあこれからもどんどん振り回しちゃうから、覚悟してねっ」"
translation = "「그렇게 말했지~? 그럼 앞으로도 팍팍 휘두를 테니까 각오하라구」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あ、そうだ。写真撮ろうよ、写真。今日一緒に海に来たこと、記録に残しておこう」"
translation = "「아, 맞다. 사진 찍자, 사진. 오늘 같이 바다에 온 거 기록으로 남겨두자」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ほらほら、もっと寄って。見切れちゃうよ」"
translation = "「자자, 좀 더 붙어봐. 잘리겠어」"

[[dialogue]]
speaker = "unk"
original = "お互いに水着同士だから、体が密着すると、素肌と素肌が触れ合う。"
translation = "서로 수영복 차림이라 몸이 밀착되자 맨살과 맨살이 맞닿는다."

[[dialogue]]
speaker = "unk"
original = "なんとか平静を装いながら、なんとかＤＩＳＣの画面に収まった。"
translation = "어떻게든 평정심을 유지하며 겨우 DISC 화면에 담겼다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「じゃあ撮るよ。はい、チーズ…………隙ありっ」"
translation = "「그럼 찍는다. 하나, 둘, 셋………… 틈 발견!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ちゅっ」"
translation = "「쪽」"

[[dialogue]]
speaker = "unk"
original = "シャッターの瞬間、シルヴィ先輩が俺の頬にキスをした。突然の感触に戸惑ってしまう。"
translation = "셔터가 눌리는 순간, 실비 선배가 내 뺨에 키스를 했다. 갑작스러운 감촉에 당황하고 만다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あはっ、いい写真撮れたねっ！」"
translation = "「아핫, 좋은 사진 찍혔네!」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩が見せてくれたＤＩＳＣには、驚いた顔の俺と、俺にキスするシルヴィ先輩の横顔が映っていた。"
translation = "실비 선배가 보여준 DISC에는 놀란 표정의 나와 나에게 키스하는 실비 선배의 옆모습이 찍혀 있었다."

