[[dialogue]]
speaker = "unk"
original = "第４話,３年生の悩み相談,P"
translation = "제4화, 3학년의 고민 상담"

[[dialogue]]
speaker = "unk"
original = "流星クルセイダースの一行が元の世界へと帰る前日――"
translation = "류세이 크루세이더즈 일행이 원래 세계로 돌아가기 전날――"

[[dialogue]]
speaker = "unk"
original = "リアは今回の滞在で親しくなった寮長２人を訪ねていた。"
translation = "리아는 이번 체류에서 친해진 사감장 두 사람을 찾아가 있었다."

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「――そうですの……明日にはもう帰ってしまいますのね……」"
translation = "「――그렇군요…… 내일이면 벌써 돌아가 버리시는군요……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「うん、そうなんだ。だから、帰る前に２人と話しておきたいなって思って……」"
translation = "「응, 맞아. 그러니까, 돌아가기 전에 두 사람과 이야기해 두고 싶다고 생각해서……」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「リア、あなた……」"
translation = "「리아, 너……」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「私たちに、何か相談したいことがあるんじゃない？」"
translation = "「우리에게, 무언가 상담하고 싶은 게 있는 거 아냐？」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「え？」"
translation = "「에？」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「あなた、私のところへ相談に来る寮生と、同じ顔をしているわよ」"
translation = "「너, 내게 상담하러 오는 기숙사생과, 같은 얼굴을 하고 있어」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「すごい……わかっちゃうんだ」"
translation = "「대단해…… 알아버리는구나」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「さすがマムですわね♪\u3000マムには、私もよく相談に乗って頂いてますの」"
translation = "「과연 마무로군요♪ 마무에게는, 저도 자주 상담을 받고 있답니다」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ですから、リア。もし悩んでいることがあるなら、話してみると気持ちが楽になるかもしれませんわよ？」"
translation = "「그러니, 리아. 혹시 고민하고 있는 일이 있다면, 이야기해 보면 마음이 편해질지도 모른답니다？」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「……うん」"
translation = "「……응」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あのね、実は私……向こうの世界で、もうすぐ学園を卒業する時期なんだ」"
translation = "「저기 있지, 사실은 나…… 저쪽 세계에서, 이제 곧 학원을 졸업할 시기야」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「……！\u3000そうでしたのね……」"
translation = "「……! 그러셨군요……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「それで私は、進学するのが決まっているんだけど……」"
translation = "「그래서 나는, 진학하는 것이 정해져 있지만……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「なんとなく、この先どういう将来を歩めばいいのか、不安で……」"
translation = "「어쩐지, 앞으로 어떤 미래를 걸어가면 좋을지, 불안해서……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「……私ね、本当は――」"
translation = "「……나 말이지, 사실은――」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「流星学園を、まだ卒業したくないって気持ちがあるんだ……」"
translation = "「류세이 학원을, 아직 졸업하고 싶지 않다는 마음이 있어……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「向こうの生徒会では、私だけ３年生で……どうして私だけ１年早く生まれたんだろうって、そんなことも考えちゃったりして……」"
translation = "「저쪽 학생회에서는, 나만 3학년이라서…… 어째서 나만 1년 일찍 태어난 걸까 하고, 그런 것도 생각해 버리거나 해서……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「２人も３年生でしょ？\u3000だから……２人は学園を卒業したら、その先どうするのかなって聞いてみたかったんだ」"
translation = "「두 사람도 3학년이지? 그러니까…… 두 사람은 학원을 졸업하면, 그 뒤엔 어떻게 할 건지 들어보고 싶었어」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「……なるほどね」"
translation = "「……그렇군」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「私は、妃竜院家の次期当主として、魔界にある本家へ戻るつもりよ」"
translation = "「나는, 키류인 가문의 차기 당주로서, 마계에 있는 본가로 돌아갈 작정이야」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「そっか……私のお姉ちゃんと同じ感じだね……」"
translation = "「그렇구나…… 우리 언니하고 비슷한 느낌이네……」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「そして、くだらない身内の権力争いを、さっさと終わらせる」"
translation = "「그리고, 하찮은 친족 간의 권력 다툼을, 얼른 끝내겠어」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「あ～……そういうのがあるんだ……」"
translation = "「아～…… 그런 게 있구나……」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「面倒なことにね。でも、それが終わって、私が当主になったら――」"
translation = "「성가시게 말이지. 하지만, 그것이 끝나고, 내가 당주가 되면――」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「魔界に、学園都市を作るわ」"
translation = "「마계에, 학원 도시를 만들겠어」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「えっ、学園都市……？」"
translation = "「엣, 학원 도시……？」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「そう。魔界を人間界のように発展させるために、魔族の子たちが集まって知識を学べる……そんな都市規模の教育機関をね」"
translation = "「그래. 마계를 인간계처럼 발전시키기 위해, 마족 아이들이 모여 지식을 배울 수 있는…… 그런 도시 규모의 교육 기관을 말야」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ふふっ、つまりはマムも『学園が好き』ということですわね♪」"
translation = "「후훗, 결국은 마무도 『학원을 좋아한다』는 뜻이군요♪」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「……学園寮の寮長をやっているのに、嫌いなわけないでしょう？」"
translation = "「……학원 기숙사의 사감장을 하고 있는데, 싫어할 리가 없잖아？」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ちなみに私は、卒業後も星力が続く限り、最強の星騎士を目指して走り続けますわ♪♪」"
translation = "「참고로 저는, 졸업 후에도 성력이 계속되는 한, 최강의 성기사를 목표로 계속 달려나갈 것이랍니다♪♪」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「そして、学園のＯＧとして、後輩たちの為にできることは喜んで協力致しましてよ♪」"
translation = "「그리고, 학원의 OG로서, 후배들을 위해 할 수 있는 일은 기꺼이 협력하겠어요♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「そっか……２人共、卒業しても学園と関わり続けるんだね」"
translation = "「그렇구나…… 두 사람 모두, 졸업해도 학원과 계속 인연을 이어가는구나」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ええ。ですからリア、卒業は必ずしも『終わり』ではありませんのよ」"
translation = "「네. 그러니 리아, 졸업이 반드시 『끝』인 것은 아니랍니다」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「もしもリアが、学園を好きだというのならば、そこへ関わる為の道を選べばいいのですわ」"
translation = "「만약 리아가, 학원을 좋아한다고 한다면, 그곳과 관계를 맺기 위한 길을 선택하면 되는 것이지요」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「幸い、そっちの世界でも、九浄家は学園を運営しているようだしね」"
translation = "「다행히, 그쪽 세계에서도 쿠죠가는 학원을 운영하고 있는 것 같고 말이지」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「そっか……優秀なお姉ちゃんが理事長だし、私にできることはあるのかなって思っちゃってたけど……」"
translation = "「그렇구나…… 우수한 언니가 이사장이고, 나한테 할 수 있는 일이 있을까 생각했었지만……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「……うん。そうだよね。好きなら、諦めずに挑戦してみなくちゃ」"
translation = "「……응. 그렇네. 좋아한다면, 포기하지 않고 도전해 봐야지」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「私、向こうの世界に帰ったら、お姉ちゃんに自分の気持ちを話してみるよ」"
translation = "「나, 저쪽 세계로 돌아가면, 언니한테 내 마음을 이야기해 볼게」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「私も、大好きな学園と関わり続けたいから」"
translation = "「나도, 정말 좋아하는 학원과 계속 인연을 이어가고 싶으니까」"

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ふふっ、私たち、やはり気の合う仲ですわね♪」"
translation = "「후훗, 우리들, 역시 마음이 잘 맞는 사이군요♪」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「困ったことがあれば、また相談なさい」"
translation = "「곤란한 일이 있으면, 또 상담하렴」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ありがとう、２人とも。またこの世界に来れるかわからないのが、ちょっと寂しいけど……」"
translation = "「고마워, 두 사람 모두. 다시 이 세계에 올 수 있을지 모른다는 게, 조금 쓸쓸하지만……」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「……今回来たのは初めてじゃなくて、これで２度目なんでしょう？」"
translation = "「……이번에 온 게 처음이 아니라, 이걸로 두 번째잖아？」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「だったら、２度と会えないなんてことはないでしょ」"
translation = "「그러면, 두 번 다시 만날 수 없다는 건 없겠지」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「少なくとも――あなたがそう思っていればね」"
translation = "「적어도―― 네가 그렇게 생각하고 있다면 말야」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「マムちゃん……！」"
translation = "「마무짱……！」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「ちょっ、なにいきなり抱き着いてるのよ……！」"
translation = "「잠깐, 갑자기 왜 안겨드는 거야……！」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「マムちゃんって、すごくいい子だね……！」"
translation = "「마무짱은, 정말 좋은 아이구나……！」"

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「はあ！？\u3000なに言ってるのよ、もう……」"
translation = "「하아！？ 무슨 소릴 하는 거야, 정말……」"

[[dialogue]]
speaker = "unk"
original = "マハムートは、ふっと口元を緩め、リアの背中をポンと叩く。"
translation = "마하무트는, 피식 입꼬리를 완화하며, 리아의 백중을 퐁 하고 두드린다."

[[dialogue]]
speaker_original = "マハムート"
speaker_translation = "마하무트"
original = "「やれやれ、仕方のない子ね……」"
translation = "「이런이런, 어쩔 수 없는 아이네……」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「ヒルディーちゃんも、ありがとう！」"
translation = "「힐디짱도, 고마워！」"

[[dialogue]]
speaker = "unk"
original = "リアはヒルディオーネとも抱擁を交わす。"
translation = "리아는 힐디요네와도 포옹을 나눈다."

[[dialogue]]
speaker_original = "ヒルディオーネ"
speaker_translation = "힐디오네"
original = "「ええ。リア、また会えると、私も信じておりますわ」"
translation = "「네. 리아, 다시 만날 수 있다고, 저도 믿고 있답니다」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「うん……！」"
translation = "「응……！」"

[[dialogue]]
speaker = "unk"
original = "その日の夜。"
translation = "그날 밤."

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「――これでよしっと♪」"
translation = "「――이걸로 됐다♪」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「あら？\u3000リアお姉ちゃん、また絵日記を書いてたの？」"
translation = "「어라？ 리아 언니, 또 그림 일기를 쓰고 있었어？」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「うん、そうなの♪」"
translation = "「응, 맞아♪」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「？\u3000この絵ってなに？」"
translation = "「？ 이 그림은 뭐야？」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「これは、ヒルディーちゃんとマムちゃんと、私だよ♪」"
translation = "「이건, 힐디짱이랑 마무짱이랑, 나야♪」"

[[dialogue]]
speaker_original = "ヴィーナス"
speaker_translation = "비너스"
original = "「ふ～ん、なんだかよくわからないけど……とっても仲良そうで、素敵な絵ね♪」"
translation = "「흠～, 어쩐지 잘은 모르겠지만…… 엄청 사이좋아 보이고, 멋진 그림이네♪」"

[[dialogue]]
speaker_original = "リア"
speaker_translation = "리아"
original = "「えっへん♪\u3000自信作なの♪」"
translation = "「에헴♪ 자신작이야♪」"

[[dialogue]]
speaker = "unk"
original = "そう言ってリアは、自分の描いた絵を見つめながら微笑むのだった。"
translation = "그렇게 말하며 리아는, 자신이 그린 그림을 바라보며 미소짓는 것이었다."

