[[dialogue]]
speaker = "unk"
original = "第２話,『ラクシャの提案』,B"
translation = "제2화, 『락샤의 제안』, B"

[[dialogue]]
speaker = "unk"
original = "それからしばらくして、デネブに<ruby>市倉環<rt>ラクシャ</rt></ruby>がやって来た、ある日のこと──"
translation = "그러고 나서 얼마 후, 데네브에 <ruby>이치쿠라 타마키<rt>락샤</rt></ruby>가 찾아온, 어느 날의 일──"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ルヴィネさま、何だか、忙しいみたいだね～」"
translation = "「루비네 님, 왠지, 바빠 보이네~」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ええ、ここ最近はアルタイルに通い詰めて、ハロウィンについて学ばせてもらっているわ」"
translation = "「그래, 요 며칠은 알타이르에 매일 들러서, 할로윈에 대해 배우고 있어」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ハロウィン？\u3000なんでまたハロウィンのことなんて勉強し始めたの？」"
translation = "「할로윈? 왜 또 할로윈 같은 걸 공부하기 시작한 거야?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「マグダレナに勧められたのよ」"
translation = "「막달레나가 권유했거든」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「女神の修行として、この世界の色々なことに主観的に関わってみてはどうか、って」"
translation = "「여신의 수행으로서, 이 세계의 여러 일에 주관적으로 관여해 보는 건 어떠냐고」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「それで、もうそろそろハロウィンの時期だから、まずはそれを体験してみてはどうかってね」"
translation = "「그래서, 이제 곧 할로윈 시기니까, 우선은 그걸 체험해 보는 건 어떠냐면서 말이지」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「せっかくハロウィンを体験するのなら、デネブでもアルタイルのように大きなハロウィンパーティーを開きたいと思っているのよ」"
translation = "「모처럼 할로윈을 체험하는 거라면, 데네브에서도 알타이르처럼 큰 할로윈 파티를 열고 싶다고 생각하고 있어」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「言われてみると、デネブの復興は進んでるけど、そういうお祭りごとはご無沙汰になってる感じだねー」"
translation = "「듣고 보니, 데네브의 복구는 진행되고 있지만, 그런 축제 같은 건 한동안 뜸했던 느낌이네ー」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「世界の脅威も無くなったし、デネブでもハロウィンパーティーを、っていうのはいい考えだって思いますよ♪」"
translation = "「세계의 위협도 사라졌고, 데네브에서도 할로윈 파티를, 이라는 건 좋은 생각이라고 생각해요♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「極星星徒会のみんなにも話してみたのだけれど、きっと喜んでくれるだろうって賛成してくれたわ」"
translation = "「극성학생회 모두에게도 이야기해 보았는데, 분명 기뻐해 줄 거라며 찬성해 주었어」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「だから、そのパーティーのためにアルタイルのハロウィン有識者に様々なことを教えてもらっているのよ」"
translation = "「그래서, 그 파티를 위해 알타이르의 할로윈 유식자에게 다양한 것을 배우고 있는 중이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ハロウィンの有識者……っていうと、あのキャラの濃い実行委員長のことかな？」"
translation = "「할로윈의 유식자……라고 하면, 그 캐릭터 강한 실행위원장을 말하는 건가?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「キャナンシーね。ちょっと疲れるヒトではあるけれど、ハロウィンに対する知識と熱意は本物だわ」"
translation = "「캐넌시 말이지. 조금 피곤한 사람이긴 하지만, 할로윈에 대한 지식과 열의는 진짜야」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「今日もこれから彼女のところに行って勉強するところだったの」"
translation = "「오늘도 이제부터 그녀가 있는 곳에 가서 공부하려던 참이었어」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あー、そうだったんだ。これはちょっと間が悪かったかな～？」"
translation = "「아-, 그랬구나. 이건 타이밍이 좀 나빴나~?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「どうかしたの？」"
translation = "「무슨 일이라도 있어?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「えっと、ほら。ルヴィネさまと守護天使たちとの間で、契約を結び直そうって話があったじゃないですか」"
translation = "「저기, 있잖아. 루비네 님과 수호천사들 사이에서, 계약을 다시 맺자는 이야기가 있었잖아요」"

[[dialogue]]
speaker = "unk"
original = "正確には、先代の女神であるテルルから譲り受けた段階で、ルヴィネと守護天使たちの間に主従関係は成立していた。"
translation = "정확히는, 선대 여신인 텔루르에게 물려받은 단계에서, 루비네와 수호천사들 사이에 주종 관계는 성립되어 있었다."

[[dialogue]]
speaker = "unk"
original = "しかし、両者の関係をより強固なものにするために、改めて契約を行うということになっていたのだ。"
translation = "하지만, 양자의 관계를 더욱 견고하게 만들기 위해, 새롭게 계약을 진행하기로 되어 있었던 것이다."

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「<ruby>『ＸＥＬＯＳ』<rt>ゼロス</rt></ruby>との戦いで受けたダメージが深かったんで契約を先送りにさせてもらってたんだけど──」"
translation = "「<ruby>『XELOS』<rt>제기</rt></ruby>와의 싸움에서 입은 손상이 깊어서 계약을 미루고 있었지만──」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それもだいぶ回復してきたんで、そろそろパスの繋ぎ直しをお願いしようかなーって」"
translation = "「그것도 상당히 회복했으니까, 슬슬 패스를 다시 연결해달라고 부탁해볼까~ 하고」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「その件についてなのだけれど……オオヒメとの契約の時に想定外のことが起きてしまったの。だから今は、全員に対して再契約は保留しているわ」"
translation = "「그 건에 대해서 말인데…… 오오히메와의 계약 때 예상치 못한 일이 일어나고 말았어. 그래서 지금은, 전원에 대해 재계약은 보류하고 있단다」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あれから特に、世界の摂理への影響は出ていないみたいだけど？」"
translation = "「그 후로 딱히, 세계의 섭리에 영향은 나오지 않은 것 같은데?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「オオヒメからもそう聞いているわ。けれど、少し慎重になってしまっていて……」"
translation = "「오오히메한테도 그렇게 들었어. 하지만, 조금 신중해져 버려서……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「だったら、ボクでもう一度試してみようよ！」"
translation = "「그러면, 나로 다시 한번 시도해 보자!」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「…………いいのかしら？」"
translation = "「…………괜찮겠니?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「大丈夫じゃないかなー。少しずつでも試して行かないことには何も分からないことだし、それに契約することで新たな力が目覚めるかもしれないんでしょ？」"
translation = "「괜찮지 않을까~. 조금씩이라도 시도해 보지 않고서는 아무것도 알 수 없는 법이고, 게다가 계약함으로써 새로운 힘이 눈을 뜰지도 모르는 거잖아?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ええ、そうね……」"
translation = "「그래, 그렇네……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「わかったわ。では、今から契約しましょう」"
translation = "「알았어. 그럼, 지금부터 계약하자」"

[[dialogue]]
speaker = "unk"
original = "ルヴィネがラクシャの前に手をかざす。"
translation = "루비네가 락샤의 앞에 손을 올려놓는다."

[[dialogue]]
speaker = "unk"
original = "その手のひらが仄かな光を発し、ラクシャの身体を包み込んで──"
translation = "그 손바닥이 희미한 빛을 발하며, 락샤의 몸을 감싸 안고──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「終わったわ。…………って、ええっ！？」"
translation = "「끝났단다. …………랄까, 에엣!?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、ルヴィネさま。この格好ってもしかして……」"
translation = "「아하하, 루비네 님. 이 모습은 혹시……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「最近、ずっとハロウィン漬け……だったからかしら……」"
translation = "「최근, 계속 할로윈에 빠져…… 있었기 때문일까……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あー、やっぱそれが影響しちゃったんだ？」"
translation = "「아─, 역시 그게 영향 주는 바람에 그런가?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「オオヒメの時も契約の影響で、元の姿に変化が起きてしまったのだけれど……」"
translation = "「오오히메 때도 계약의 영향으로, 원래 모습에 변화가 일어나고 말았지만……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「守護天使に相応しい姿であるならまだしも、こんな浮かれた格好にしてしまうなんて……ごめんなさい、ラクシャ」"
translation = "「수호천사에 어울리는 모습이라면 몰라도, 이런 들뜬 모습으로 만들어 버리다니…… 미안해, 락샤」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いやいや、ぜーんぜんオッケーだよ、これ！\u3000超ロックな感じでカッコイイしね♪」"
translation = "「아니아니, 전~혀 오케이거든, 이거! 완전 록한 느낌으로 멋지기도 하고♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「思い出しちゃうなー。ライブハウスやら音楽フェスなんかでバイトしてた時のこと……その時にステージで暴れてた演者さんの衣装みたいだ」"
translation = "「생각나버리네─. 라이브 하우스나 음악 페스티벌 같은 데서 알바했던 시절…… 그때 무대에서 난동 피우던 출연자분들의 의상 같아」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、そうだ、いいこと思いついたかも！\u3000ルヴィネさまはハロウィンのことを勉強して、デネブでもパーティーを開こうとしてるんだよね？」"
translation = "「아, 맞다, 좋은 생각이 떠올랐을지도! 루비네 님은 할로윈에 대해 공부해서, 데네브에서도 파티를 열려고 하는 거지?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「だったらボクもそのパーティーに参加させてよ♪」"
translation = "「그러면 나도 그 파티에 참가시켜 줘♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「えっ？\u3000あなたが？」"
translation = "「에? 네가?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ほら、ルヴィネさまだけじゃなくて、<ruby>守護天使<rt>ボクたち</rt></ruby>がこういった行事に参加することも、意味があると思うんだよね」"
translation = "「봐봐, 루비네 님뿐만 아니라, <ruby>수호천사<rt>우리</rt></ruby>가 이런 행사에 참가하는 것도, 의미가 있다고 생각하거든」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「せっかくこんなにロックでハロウィンな格好になれたんだし、守護天使のみんなでバンドでもやってみようかなって♪」"
translation = "「모처럼 이렇게나 록하고 할로윈스러운 모습이 되었으니, 수호천사 다 같이 밴드라도 해볼까 싶어서♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ラクシャ……」"
translation = "「락샤……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「だからボクたちに、ルヴィネさまの企画したパーティーで演奏させてよ♪」"
translation = "「그러니까 우리한테, 루비네 님이 기획한 파티에서 연주하게 해줘♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「音楽は人を元気にしてくれるからね。きっとパーティーも盛り上がって、復興に励むデネブのみんなも大喜びだよ♪」"
translation = "「음악은 사람을 기운 나게 해주니까 말야. 분명 파티도 달아오르고, 부흥에 힘쓰는 데네브의 모두도 엄청 기뻐할 거야♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……そうね。じゃあお願いするわ」"
translation = "「……그래. 그럼 부탁할게」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「よーし、そうと決まったら準備を始めないと。それじゃルヴィネさま、ありがとうございましたー♪」"
translation = "「좋─아, 그렇게 정해졌으니 준비를 시작해야지. 그럼 루비네 님, 감사했습니다─♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「ぁ……」"
translation = "「아……」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「また、気を遣ってもらっちゃったかしら……」"
translation = "「또, 배려를 받아버린 걸까……」"

[[dialogue]]
speaker = "unk"
original = "自嘲気味に微笑みながらも、素晴らしい部下を残してくれた先代の女神テルルに感謝の呟きを漏らす。"
translation = "자조 섞인 미소를 지으면서도, 훌륭한 부하를 남겨준 선대 여신 테루루에게 감사의 중얼거림을 샌다."

[[dialogue]]
speaker = "unk"
original = "しかし──"
translation = "하지만──"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「でも、守護天使たちのバンドって……あの子たち、ちゃんとできるのかしら？」"
translation = "「하지만, 수호천사들의 밴드라니…… 그 아이들, 제대로 할 수 있으려나?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あ、いたいた発見！\u3000おーい、マグダレナ！」"
translation = "「아, 찾았다 발견! 어이─, 막달레나!」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ラクシャではありませんか。あなたもデネブに来ていたのですか？」"
translation = "「락샤 아니신가요. 당신도 데네브에 와 계셨던 건가요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「うん。ルヴィネさまに再契約してもらいにね。今、それが終わったところだよ」"
translation = "「응. 루비네 님에게 재계약받으러 말이지. 방금 막 그게 끝난 참이야」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「再契約を？\u3000それで、何事もなく無事に契約できましたか？」"
translation = "「재계약을요? 그래서, 아무 일 없이 무사히 계약할 수 있었나요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうだね！\u3000予想外のことは起きたけど、摂理の管理も能力についても問題なし♪\u3000契約したことで、新しい力も発現したしね」"
translation = "「그렇지! 예상치 못한 일이 일어나긴 했지만, 섭리 관리도 능력에 대해서도 문제 없어♪ 계약한 덕분에 새로운 힘도 발현됐고 말야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ちょっとそれを見てもらおうかと思って♪\u3000それじゃ行くよ～」"
translation = "「잠깐 그걸 봐줬으면 해서♪ 그럼 간다~」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「じゃーん。これがルヴィネさまとの契約で発現した、ボクの新しい姿だよ！」"
translation = "「짠─. 이것이 루비네 님과의 계약으로 발현된, 내 새로운 모습이야!」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「あら、これは……どことなくハロウィン風味のようですね？」"
translation = "「어머, 이건…… 어딘가 할로윈 풍인 것 같네요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そうなんだよ。マグダレナがルヴィネさまに勧めたんだよね？\u3000ハロウィンを『体験』してみたらどうか、って」"
translation = "「맞아. 막달레나가 루비네 님에게 추천한 거지? 할로윈을 『체험』해보면 어떨까, 하고」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ルヴィネさまは今、ハロウィンについての勉強の真っ最中でさ、どうやらその事で頭がいっぱいになってたみたいなんだ」"
translation = "「루비네 님은 지금 할로윈에 대한 공부가 한창이라서 말야, 아무래도 그 일로 머릿속이 가득 찼던 모양이야」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「それでこんな感じになっちゃった、ってわけ♪\u3000ボクはこの格好、すごくいいと思うんだけどどうかな？」"
translation = "「그래서 이런 느낌이 되어버렸다, 라는 말씀♪ 나는 이 차림, 엄청 좋다고 생각하는데 어때?」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ええ。ラクシャにとてもよく似合っていると思います」"
translation = "「네. 락샤에게 매우 잘 어울린다고 생각해요」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「あはは、ありがと。それでね、マグダレナにも協力してもらいたいことがあるんだけど」"
translation = "「아하하, 고마워. 그래서 말인데, 막달레나에게도 협력해 주었으면 하는 일이 있거든」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「協力ですか？\u3000なんでしょう、私が力になれることであれば良いのですが……」"
translation = "「협력 말인가요? 무얼까요, 제가 도움이 될 수 있는 일이라면 좋겠습니다만……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボクと一緒にバンドをやろう！」"
translation = "「나랑 같이 밴드를 하자!」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「…………」"
translation = "「…………」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ルヴィネさまがデネブでも、ハロウィンパーティーをやろうとしてるってことは知ってるよね？」"
translation = "「루비네 님이 데네브에서도 할로윈 파티를 하려고 한다는 건 알고 있지?」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ええ」"
translation = "「네」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボクたち守護天使も、そのお手伝いが出来たらいいなって思わない？」"
translation = "「우리 수호천사들도 그 도울 수 있다면 좋겠다고 생각하지 않아?」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「それは、そうですね」"
translation = "「그건, 그렇네요」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「だよね？\u3000だからボクたちでバンドを組んで、デネブのハロウィンパーティーでライブをやろうよ♪」"
translation = "「그렇지? 그러니까 우리끼리 밴드를 결성해서, 데네브의 할로윈 파티에서 라이브를 하자♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ボクは過去にライブハウスやフェスのスタッフのバイトをしてたから知ってるんだけど──」"
translation = "「나 과거에 라이브 하우스나 페스티벌 스태프 알바를 해봐서 아는데──」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「ライブってすっごい盛り上がるんだよ？\u3000演奏者もお客さんもみんなで一体になってさ！\u3000声を上げて、手を振って、ジャンプしてさ！」"
translation = "「라이브라는 건 엄청 흥분된다고? 연주자도 관객도 모두 하나가 되어서 말이야! 소리를 지르고, 손을 흔들고, 점프하면서!」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「そのエネルギーっていったらとんでもない爆発力なんだから」"
translation = "「그 에너지라고 하면 엄청난 폭발력이니까」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「デネブのみんなに元気を出してもらうには、これはもうライブをするしかないって思うんだよ」"
translation = "「데네브의 모두에게 기운을 북돋아 주려면, 이건 이제 라이브를 하는 수밖에 없다고 생각해」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「なるほど。それで私たちでバンドを組もうと……」"
translation = "「그렇군요. 그래서 저희끼리 밴드를 결성하자고……」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「いい考えでしょ？」"
translation = "「좋은 생각이지?」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「ええ。いささか突飛にも思える提案でしたので戸惑ってしまいましたが……良い考えだと思います」"
translation = "「네. 다소 엉뚱하게도 느껴지는 제안이라 당황했습니다만…… 좋은 생각이라고 생각해요」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「それなら私たちもルヴィネ様と一緒に、ハロウィンを『体験』することができますから」"
translation = "「그렇다면 저희도 루비네 님과 함께, 할로윈을 『체험』할 수 있을 테니까요」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「けれど……私は楽器を演奏した経験がありません。他の皆も同じではないでしょうか？」"
translation = "「하지만…… 저는 악기를 연주해 본 경험이 없습니다. 다른 분들도 마찬가지 아닐까요?」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「弾けないなら弾けるようになるまで練習すればいいんだよ！\u3000大丈夫、その辺はちゃーんと考えてあるから♪」"
translation = "「못 연주하면 연주할 수 있게 될 때까지 연습하면 돼! 괜찮아, 그 부분은 따아악 생각해 둔 게 있으니까♪」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「そうですか。では私もあなたの計画に協力させてもらいます」"
translation = "「그렇습니까. 그럼 저도 당신의 계획에 협력하도록 하겠습니다」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「やったぁ、ありがとう♪\u3000まずは１人目確保っ♪」"
translation = "「아싸, 고마워♪ 우선 1명째 확보 완료♪」"

[[dialogue]]
speaker_original = "ラクシャ"
speaker_translation = "락샤"
original = "「よーし、この調子で他のみんなも誘っていこう！\u3000一緒に来てよ、マグダレナ！\u3000ほら、レッツゴー♪」"
translation = "「좋아─, 이 기세로 다른 사람들도 권유하러 가자! 함께 가자, 막달레나! 자, 렛츠 고♪」"

[[dialogue]]
speaker_original = "マグダレナ"
speaker_translation = "막달레나"
original = "「えぇえ……わ、わかりました……」"
translation = "「에에…… 아, 알겠습니다……」"

