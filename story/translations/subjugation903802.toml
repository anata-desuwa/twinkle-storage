[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「キャ～～～～っ！？」"
translation = "「캬～～～～악!?」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「会長の水着フォームに負けた！？」"
translation = "「회장의 수영복 폼에 졌다！？」"

[[dialogue]]
speaker = "unk"
original = "これが俺の『海パン』の力だ！！"
translation = "이것이 나의 『사각 수영복』의 힘이다！！"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「そ、そんな……私の水着が、海パンに敗れるだなんて……！」"
translation = "「그, 그런…… 내 수영복이, 사각 수영복에 패배하다니……！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「い、いや！\u3000そう簡単に認めるわけには行かないわ！」"
translation = "「아, 아니야！ 그렇게 쉽게 인정할 수는 없어！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「会長、もう１度勝負よ！」"
translation = "「회장, 다시 한 번 승부야！」"

[[dialogue]]
speaker_original = "聖沙"
speaker_translation = "미사"
original = "「私の水着で、あなたの海パンに勝ってみせるわ！」"
translation = "「내 수영복으로, 당신의 사각 수영복을 이겨 보이겠어！」"

