[[dialogue]]
speaker = "unk"
original = "第８話,『ママをたずねて三世界』,B"
translation = "제8화, 『마마를 찾아 삼세계』, B"

[[dialogue]]
speaker = "unk"
original = "後日──"
translation = "훗날──"

[[dialogue]]
speaker = "unk"
original = "再びルヴィネがアルタイルにやってくることになった。"
translation = "다시 루비네가 알타이르에 오게 되었다."

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「ルヴィっちがまたお仕事に来るっていうならさ、やっぱアタシらでお出迎えしなくちゃじゃん？」"
translation = "「루비치가 또 일하러 온다고 한다면 말야, 역시 우리들이 마중 나가지 않으면 안 되잖아?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「今回もわたくしたち２人で、見事に案内役を務めてみせるわ！」"
translation = "「이번에도 저희 두 사람이, 멋지게 안내역을 해내 보이겠어요!」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「──失礼するわ」"
translation = "「──실례할게」"

[[dialogue]]
speaker = "unk"
original = "教室のドアが開いてルヴィネが入ってくる。"
translation = "교실 문이 열리고 루비네가 들어온다."

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「数日ぶりね。セシアに紅明、またお願いするわ」"
translation = "「며칠 만이네. 세시아에 코메이, 다시 부탁할게」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「どーってことないって☆\u3000ルヴィっちがこっちに来る時は、いつでもアタシたちがサポートするからさ♪」"
translation = "「별거 아니라니까☆ 루비치가 이쪽에 올 때는, 언제든 우리들이 서포트할 테니까♪」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「それじゃあ、２人に紹介するわね」"
translation = "「그럼, 두 사람에게 소개할게」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「こんにちは～。お邪魔します！」"
translation = "「안녕하세요~. 실례하겠습니다!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「！！！！！」"
translation = "「!!!!!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ルヴィに紹介したいヒトがいるって言われて来たんだけど……」"
translation = "「루비에게 소개하고 싶은 사람이 있다고 해서 왔는데……」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ほわあああああああぁぁぁぁ～～～～！？！？！？！？」"
translation = "「호와아아아아아아아아~~~~!?!?!?!?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「セッシーが壊れた！」"
translation = "「세시가 고장 났다!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「ベアトママ～～～！！！！」"
translation = "「베아토 마마~~~!!!!」"

[[dialogue]]
speaker = "unk"
original = "セシアは開口一番、ベアトリスの胸元に飛び込んでいった。"
translation = "세시아는 첫 마디부터, 베아트리스의 가슴속으로 뛰어들었다."

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「えええええええ～～～～っ！？」"
translation = "「에에에에에엑~~~~!?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「思った以上に喜んでもらえたわね……」"
translation = "「생각 이상으로 기뻐해 주었네……」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「お、ベアちー久しぶり☆\u3000セッシーのママになりにきてくれたカンジ？」"
translation = "「어, 베아치 오래간만☆ 세시의 엄마가 되러 와 준 느낌?」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ママになりにきたってなにぃ！？」"
translation = "「엄마가 되러 왔다니 그게 무슨 소리야!?」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「そういうつもりでは無かったのだけれど、セシアがとても会いたがっていたから連れて来たわ」"
translation = "「그런 작정은 아니었지만, 세시아가 너무 만나고 싶어 해서 데리고 왔단다」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「デネブでの決戦や『リベレーション・ペンタグラム』の直前、同じ九浄家の中で行動はしていたけれど……個別に挨拶する機会はなかったものね」"
translation = "「데네브에서의 결전이나 『리베레이션 펜타그램』 직전, 같은 쿠죠가 안에서 행동하긴 했지만…… 개별적으로 인사할 기회는 없었으니까」"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「セシアに挨拶をしてあげて、ベアト」"
translation = "「세시아에게 인사를 해주렴, 베아토」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「う、うん。ベアトリス・シェイドです。えっと……よろしくね！」"
translation = "「으, 응. 베아트리스 셰이드입니다. 어또…… 잘 부탁해!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「……！\u3000アルタイルの摂理『蓄積』を司る守護天使、《万成》のセシアよ！\u3000よろしくお願いするわ、ベアトママ！！」"
translation = "「……! 알타이르의 섭리 『축적』을 관장하는 수호천사, 《만성》의 세시아야! 잘 부탁해, 베아토 엄마!!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「この控えめな佇まいの奥に感じる繊細な優しさ！\u3000ただそこに在るだけで伝わる世話焼き気質！\u3000聞きしに勝るバブみの権化──これは、問答無用のママよ！」"
translation = "「이 조용한 자태의 깊은 곳에서 느껴지는 섬세한 다정함! 단지 거기에 있는 것만으로 전해지는 챙겨주기 좋아하는 기질! 소문으로 듣던 것보다 더한 마성의 모성애── 이건, 문답무용의 엄마야!」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「ひゃぁああっ！？」"
translation = "「히야아아앗!?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「なんて温かく大きなお胸……ああ、会えて嬉しいわ。バブみが溢れて……溺れてしまいそうだわ……ママ～～～<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「어쩜 이렇게 따스하고 큰 가슴…… 아아, 만나서 기뻐. 모성애가 넘쳐서…… 빠져 버릴 것 같아…… 엄마~~~<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「バブみ！？\u3000ママ！？\u3000どういうことなんですかぁ！？」"
translation = "「모성애!? 엄마!? 어떻게 된 일인가요!?」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「セッシーは本能的にママを求めてるんだぜ☆\u3000特に彼女の心に響いた人は、すぐママ判定しちゃうんだ」"
translation = "「세시는 본능적으로 엄마를 원하고 있단 말이지☆ 특히 자기 마음에 와닿은 사람은 금방 엄마 판정을 내려버려」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「きゅ、急にそんなこと言われても……！\u3000私なんて、どこにでもいる普通の吸血鬼で──」"
translation = "「갑, 갑자기 그런 말을 들어도……! 나 따위, 어디에나 있는 흔한 흡혈귀고──」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「謙遜しなくていいわ。その控えめな態度に隠された、海のようにおおらかな心……何より、惜しみない優しさがにじみ出ているのよ♪」"
translation = "「겸손해할 필요 없어. 그 조용한 태도에 숨겨진, 바다처럼 넓은 마음…… 무엇보다, 아낌없는 다정함이 배어 나오고 있어♪」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「うんうん。アタシにもなんとなくわかるなー、セッシーじゃなくても甘えたくなる何かを感じるぜ☆」"
translation = "「응응. 나한테도 왠지 알 것 같아, 세시가 아니라도 어리광 부리고 싶어지는 무언가를 느끼겠어☆」"

[[dialogue]]
speaker_original = "ベアトリス"
speaker_translation = "베아트리스"
original = "「そ、そうなんでしょうか……？\u3000でも、褒めてもらえているなら嬉しい……かも！\u3000いっぱいナデナデしてあげたらいいのかな……？」"
translation = "「그, 그런가요……? 하지만, 칭찬받은 거라면 기쁠……지도! 쓰다듬쓰다듬 많이 해주면 되는 걸까나……?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「嬉しいわ、ベアトママ<emoji=heart04>」"
translation = "「기뻐요, 베아토 엄마<emoji=heart04>」"

[[dialogue]]
speaker_original = "紅明"
speaker_translation = "코메이"
original = "「おっと、こうなるとなんだかアタシも負けてられない気分。ほーらセッシー、紅明ママも甘やかしてあげちゃうぞ～？」"
translation = "「이런, 이렇게 되면 왠지 나도 질 수 없는 기분. 자아 세시, 코메이 엄마도 응석받아 줄게~?」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「２人のママがセシアのために……こんなに幸せなことはないわ！」"
translation = "「두 명의 엄마가 세시아를 위해…… 이렇게 행복한 일은 없어!」"

[[dialogue]]
speaker_original = "セシア（覚醒）"
speaker_translation = "세시아(각성)"
original = "「紅明ママ～♪\u3000ベアトママ～♪\u3000ああ、代わりばんこに頭を撫でてくれるなんて……まさにヘブンね！」"
translation = "「코메이 엄마~♪ 베아토 엄마~♪ 아아, 번갈아 가며 머리를 쓰다듬어 주다니…… 그야말로 천국이야!」"

[[dialogue]]
speaker = "unk"
original = "紅明とベアトリス──"
translation = "코메이와 베아트리스──"

[[dialogue]]
speaker = "unk"
original = "２人のママに挟まれて、存分にママみを補充したセシアは、満悦の表情を浮かべていた。"
translation = "두 명의 엄마 사이에 끼여, 마음껏 엄마의 온기를 보충한 세시아는, 흡족한 표정을 지었다."

[[dialogue]]
speaker = "unk"
original = "そうしてセシアは、最後までたっぷりママみを摂取するのだった……"
translation = "그렇게 세시아는, 마지막까지 듬뿍 엄마의 온기를 섭취하는 것이었다……"

[[dialogue]]
speaker_original = "ルヴィネ"
speaker_translation = "루비네"
original = "「……それにしてもあれ、いつ終わるのかしら」"
translation = "「……그나저나 저거, 언제 끝나는 걸까」"

[[dialogue]]
speaker = "unk"
original = "３人の様子を見守りながらも、１人そう冷静に突っ込むルヴィネなのであった。"
translation = "세 사람의 모습을 지켜보면서도, 혼자서 그렇게 냉정하게 츳코미를 거는 루비네였다."

