[[dialogue]]
speaker = "unk"
original = "第１話,彼ピとお家デート,P"
translation = "제1화, 남친과 집 데이트"

[[dialogue]]
speaker = "unk"
original = "休日のとある昼下がり。恋人であるシュティレを俺の家へ招いた──"
translation = "휴일의 어느 나른한 오후. 연인인 슈틸레를 나의 집으로 초대했다──"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長のお部屋に来るのは、これで何度目でしょうか。ふふふ、いつ来てもテンションが上がりますね。ぶいぶい」"
translation = "「회장님의 방에 오는 건, 이걸로 몇 번째일까요. 후후후, 언제 와도 텐션이 올라가네요. 부이부이」"

[[dialogue]]
speaker = "unk"
original = "ゆっくりしていってくれ"
translation = "편하게 쉬다 가"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。そうさせていただきます。休日のお家デート。カップルの王道の過ごし方と言えましょう」"
translation = "「네. 그렇게 하겠습니다. 휴일의 집 데이트. 커플의 왕도적인 보내는 방법이라고 할 수 있겠죠」"

[[dialogue]]
speaker = "unk"
original = "ところでちょっと気になるんだけど……"
translation = "그나저나 조금 신경 쓰이는데……"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「どうやらシュティレのこの衣装が気になるようですね。ぴょんぴょん」"
translation = "「아무래도 슈틸레의 이 의상이 신경 쓰이는 모양이군요. 뿅뿅」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「なぜわざわざ変身したのか。その理由は──」"
translation = "「왜 일부러 변신했는가. 그 이유는──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「──気分です」"
translation = "「──기분 탓입니다」"

[[dialogue]]
speaker = "unk"
original = "気分なら仕方ないな"
translation = "기분 탓이라면 어쩔 수 없지"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はい。会長も、シュティレのノリに慣れてきたようですね。嬉しい限りです。ぶいぶい。あーんど、ぴょんぴょん、ぴょーん」"
translation = "「네. 회장님도 슈틸레의 흥에 익숙해진 모양이군요. 기쁘기 그지없습니다. 부이부이. 앤~드, 뿅뿅, 뿅─」"

[[dialogue]]
speaker = "unk"
original = "ダッチとの共闘の際に獲得したという、シュティレの和風バニーフォーム。"
translation = "더치와의 공통 투쟁 시에 획득했다는, 슈틸레의 화풍 바니 폼."

[[dialogue]]
speaker = "unk"
original = "普段のメカメカしい戦闘服とは雰囲気が大きく違う。恋人の色々な姿が見られるのは、彼氏冥利に尽きるというものだ。"
translation = "평소의 메카 메카한 전투복과는 분위기가 크게 다르다. 연인의 다양한 모습을 볼 수 있는 것은, 남자친구 노릇을 하는 보람이 있다는 것이다."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「会長、今日はバニーのシュティレとまったり過ごすとしましょう」"
translation = "「회장님, 오늘은 바니 슈틸레와 느긋하게 보내도록 하죠」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「せっかくのバニーフォーム。なんなりとリクエストをください」"
translation = "「모처럼의 바니 폼. 무엇이든 리퀘스트를 주세요」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「写真撮影でも、膝枕で耳かきでも。一家に一台、閃光のシュティレはどんなおねだりでもばっちりお請けいたします」"
translation = "「사진 촬영이든, 무릎베개로 귀 파주기든. 한 집에 한 대, 섬광의 슈틸레는 어떤 조르기라도 엄연히 받아들입니다」"

[[dialogue]]
speaker = "unk"
original = "じゃあ、写真を……！！"
translation = "그럼, 사진을……!!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「イエス。ドリル和傘を構えますので、シュティレの可憐な勇姿でカメラロールを太らせてくださいませ」"
translation = "「예스. 드릴 종이우산을 겨눌 테니, 슈틸레의 가련한 용맹한 모습으로 카메라 롤을 살찌워 주십시오」"

[[dialogue]]
speaker = "unk"
original = "ありがとう！！"
translation = "고마워!!"

[[dialogue]]
speaker = "unk"
original = "バニーのシュティレに向かって、夢中でＤＩＳＣのシャッターを切っていると──"
translation = "바니 슈틸레를 향해, 정신없이 DISC의 셔터를 누르고 있자──"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「ただいま～。クロト、お腹すいてる？\u3000職場でケーキの差し入れ貰っちゃって──」"
translation = "「다녀왔어~. 쿠로토, 배고파? 직장에서 케이크를 선물받아서──」"

[[dialogue]]
speaker = "unk"
original = "（まずい、シュティレはバニー姿だ……！）"
translation = "(큰일이다, 슈틸레는 바니 차림이야……!)"

[[dialogue]]
speaker = "unk"
original = "母さん！？"
translation = "엄마!?"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「どうも。お邪魔しております、リノさん」"
translation = "「안녕하세요. 실례하고 있습니다, 리노 씨」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「あら？\u3000シュティレちゃん、来てたのね。こんにちは～♪\u3000シュティレちゃんもケーキ食べる？」"
translation = "「어라? 슈틸레짱, 와 있었구나. 안녕~♪ 슈틸레짱도 케이크 먹을래?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「いただきます。ありがとうございます」"
translation = "「잘 먹겠습니다. 감사합니다」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「うんうん。ちょっと待っててね～♪」"
translation = "「응응. 잠시만 기다려줘~♪」"

[[dialogue]]
speaker = "unk"
original = "いつのまに変身を……？"
translation = "언제 변신을……?"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「リノさんにさっきの状況を見咎められると、会長がお叱りを受けるのではと判断したのです」"
translation = "「리노 씨에게 방금 전의 상황을 들키면, 회장님이 꾸중을 들을 것이라 판단했습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「年下の、附属生の恋人にハレンチな衣装を着させているという疑いをもたれては不憫だなと。瞬時に変身を解きました」"
translation = "「연하의, 부속생 연인에게 파렴치한 의상을 입히고 있다는 의심을 받아서는 가엾다고 생각하여, 즉시 변신을 풀었습니다」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「シュティレは気配りもできる天使なのです。ぶいぶい」"
translation = "「슈틸레는 배려도 할 줄 아는 천사인 것입니다. 부이부이」"

[[dialogue]]
speaker = "unk"
original = "ありがとう……！"
translation = "고마워……!"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「では嬉し恥ずかしドキドキの撮影タイム、再開いたしましょう」"
translation = "「그럼 기쁘고 부끄럽고 두근거리는 촬영 타임, 재개하도록 하겠습니다」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「ごめんなさい、聞き忘れちゃった。シュティレちゃん、コーヒーと紅茶、どっちがいいかしら～？」"
translation = "「미안해, 깜빡하고 안 물어봤네. 슈틸레짱, 커피랑 홍차 중에 어떤 게 좋아~?」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「コーヒーでお願いします。砂糖とミルクもいただけると幸いです」"
translation = "「커피로 부탁드립니다. 설탕과 밀크도 주시면 감사하겠습니다」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「は～い。ありがと～♪」"
translation = "「네~. 고마워~♪」"

[[dialogue]]
speaker = "unk"
original = "変身の解除、早すぎない？？？"
translation = "변신 해제, 너무 빠른 거 아니야???."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「スピードには自信がある星騎士ですので。ぶい」"
translation = "「스피드에는 자신 있는 성기사이므로. 부이」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「では会長。今度こそいちゃらぶタイム、再開です」"
translation = "「그럼 회장님. 이번에야말로 꽁냥꽁냥 타임, 재개입니다」"

[[dialogue]]
speaker = "unk"
original = "母さんから貰ったケーキを食べた後も、俺はシュティレと楽しいひと時を過ごした。"
translation = "엄마에게 받은 케이크를 먹은 후에도, 나는 슈틸레와 즐거운 한때를 보냈다."

[[dialogue]]
speaker = "unk"
original = "ギガンドムのアニメを一緒に見たり、今度遊びに行くイベント情報をチェックしたり……そして。"
translation = "기간돔 애니메이션을 함께 보거나, 다음에 놀러 갈 이벤트 정보를 체크하거나…… 그리고."

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「ふふふ。いかがでしょう、シュティレの膝枕と、この日のために作った特製のドリル耳かきは」"
translation = "「후후후. 어떠신가요, 슈틸레의 무릎베개와, 이날을 위해 만든 특제 드릴 귀이개는」"

[[dialogue]]
speaker = "unk"
original = "見た目は怖いけど気持ちいい"
translation = "겉보기엔 무섭지만 기분 좋아"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「そうでしょう。耳の穴を一切傷つけず、耳垢を的確にからめとる螺旋機構を搭載しています。ぶい」"
translation = "「그렇겠죠. 귓구멍을 전혀 다치지 않게 하면서, 귀지를 정확하게 걸러내는 나선 기구를 탑재하고 있습니다. 브이」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「シュティレのダウナーボイスはＡＳＭＲとしても機能するはずです。どうぞ日頃の疲れを癒やしてくださいませ」"
translation = "「슈틸레의 다우너 보이스는 ASMR로도 기능할 터입니다. 아무쪼록 평소의 피로를 풀어주세요」"

[[dialogue]]
speaker = "unk"
original = "うとうと…………"
translation = "꾸벅꾸벅…………"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「２人とも～。そろそろお夕飯の時間だけど──」"
translation = "「두 사람 모두~. 이제 저녁 먹을 시간인데──」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「──あ」"
translation = "「──아」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「…………。ごめんなさい、間違えました～♪」"
translation = "「…………. 죄송해요, 착각했어요~♪」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「……油断しました」"
translation = "「……방심했습니다」"

[[dialogue]]
speaker = "unk"
original = "見られたーーーー！？！？"
translation = "들켰다ーーーー！？！？"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「２人とも～。そろそろお夕飯の時間だけど、どうする～？」"
translation = "「두 사람 모두~. 이제 저녁 먹을 시간인데, 어떻게 할래~？」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「どうも。お邪魔でなければ、ご一緒したいです」"
translation = "「안녕하세요. 방해가 되지 않는다면, 함께하고 싶습니다」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「そう？\u3000わかったわ、用意するわね！」"
translation = "「그래? 알았어, 준비할게!」"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「あ～、びっくりした。まさか息子が、お付き合いしてる附属生の彼女に、バニー服を着させてるのかと思っちゃったわ……！」"
translation = "「아~, 깜짝이야. 설마 아들이, 교제 중인 부속생 여자친구한테, 바니걸 옷을 입히고 있는 건가 하고 생각해 버렸잖아……！」"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「はっはっは。そんなはずないでしょう」"
translation = "「하하하. 그럴 리가 없잖아요」"

[[dialogue]]
speaker = "unk"
original = "うんうん、そんなはずないから！"
translation = "응응, 그럴 리가 없으니까!"

[[dialogue]]
speaker_original = "リノ"
speaker_translation = "리노"
original = "「──なんて言うわけないでしょー！？\u3000クロト、あなたね～～～！！」"
translation = "「──라고 말할 리가 없잖아ー！？ 쿠로토, 너 말이야～～～！！」"

[[dialogue]]
speaker = "unk"
original = "やっぱり誤魔化せなかったー！？"
translation = "역시 얼렁뚱땅 넘어갈 수 없었어ー！？"

[[dialogue]]
speaker = "unk"
original = "いくらお付き合いしているからと言って節度を知りなさい、と俺は母さんにこんこんとお説教をされることになり……"
translation = "아무리 사귀는 사이라고 해도 절도를 지키라며, 나는 어머니에게 꼼꼼하게 설교를 듣게 되었고……"

[[dialogue]]
speaker_original = "シュティレ"
speaker_translation = "슈틸레"
original = "「今回の反省を生かし、次こそは完璧に誤魔化してみせましょう。ぶい」"
translation = "「이번 반성을 살려, 다음번에야말로 완벽하게 속여 넘겨 보이겠습니다. 브이」"

[[dialogue]]
speaker = "unk"
original = "マイペースなシュティレは、また違った方向に決意を固めているのだった──"
translation = "마이페이스인 슈틸레는, 또 다른 방향으로 결의를 다지는 것이었다──"

