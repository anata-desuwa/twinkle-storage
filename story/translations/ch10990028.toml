[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ミウってさ……かなりＳっ気強めだよね……？」"
translation = "「미우 말이야…… 상당한 S 성향이 강하지……?」"

[[dialogue]]
speaker = "unk"
original = "出会って間もない頃から薄々と感じていたことを、俺はおそるおそる尋ねてみた。"
translation = "만난 지 얼마 되지 않았을 때부터 어렴풋이 느끼고 있던 것을, 나는 조심스럽게 물어보았다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そうでしょうか？\u3000たまに言われますが、私自身は至って普通だと思っているんですけど……うーん……」"
translation = "「그런가요? 가끔 듣기는 하지만, 제 자신은 지극히 정상이라고 생각하는데요…… 음……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「相対的に考えると──私がＳなのではなく、会長さんがイジメられたがりのドＭなんじゃないですか？」"
translation = "「상대적으로 생각하면── 제가 S인 것이 아니라, 회장님이 괴롭힘당하고 싶어 하는 극M 아닌가요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そ、そんなことはない！\u3000……よ？」"
translation = "「그, 그런 건 아니야! ……라고?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そうですか？\u3000無理やり女の子の衣装を着せられても、拒むでもなく、むしろ、悦んでるなんて噂も聞きましたし……」"
translation = "「그래요? 억지로 여자아이 의상을 입게 되어도 거부하기는커녕 오히려 기뻐한다는 소문도 들었고요……」"

[[dialogue]]
speaker = "unk"
original = "いったい何処を巡り巡った噂なのだろう。心当たりがなくもないので、強く否定できないのだけど。"
translation = "도대체 어디를 돌아다닌 소문일까. 짚이는 구석이 없지도 않아서 강하게 부정할 수는 없지만."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さん、えっちの時もいつも受け身ですし」"
translation = "「회장님, 섹스할 때도 항상 수동적이고요」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それはミウの攻めが積極的すぎるんだよ！」"
translation = "「그건 미우의 공세가 너무 적극적이라서 그래!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さん、イジってる時よりもイジられてる時の方が気持ちよさそうですから♪\u3000私にされるの、嫌でした？」"
translation = "「회장님, 괴롭힐 때보다 괴롭힘당할 때가 더 기분 좋아 보이니까요♪ 제가 해주는 거, 싫었어요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「嫌じゃないよ。ミウがしてくれるの、気持ちいいし……」"
translation = "「싫지 않아. 미우가 해주는 거, 기분 좋고……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それなら、良かったです。では、会長さんがＭなのか、そうでないか、えっちで確かめてみませんか？」"
translation = "「그렇다면 다행이네요. 그럼, 회장님이 M인지 아닌지, 섹스로 확인해 보지 않겠어요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「たまには攻め攻めな会長さんも見てみたいです。つよつよなおち○ちんで私を屈服させてください<emoji=heart04>」"
translation = "「가끔은 공격적인 회장님도 보고 싶어요. 강인한 자지로 나를 굴복시켜 주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あれあれあれー？\u3000会長さん、いつの間にかこんな恥ずかしい格好になっちゃってますねー？」"
translation = "「어라어라어라ー? 회장님, 어느새 이렇게 부끄러운 모습이 되어버렸네요ー?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「どうして！？」"
translation = "「어째서!?」"

[[dialogue]]
speaker = "unk"
original = "ミウに負けないよう、いつもより積極的に愛撫して、ストッキングを破いたり、衣服を乱したりと攻めていたはずなのに。"
translation = "미우에게 지지 않도록 평소보다 적극적으로 애무하고, 스타킹을 찢거나 옷을 흐트러뜨리는 등 공세를 펼쳤을 텐데."

[[dialogue]]
speaker = "unk"
original = "気がつくと、寝転がる俺にミウが跨る女性上位になっていた。"
translation = "정신을 차려보니 누워있는 내 위에 미우가 올라탄 여성 상위 자세가 되어 있었다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「おち○ちんもお尻も恥ずかしいところぜ～んぶ丸出し……<emoji=heart04>\u3000これ、ちんぐり返しって言うんですよね？」"
translation = "「자지도 엉덩이도 부끄러운 곳 전부ー 드러내고……<emoji=heart04> 이거, 칭구리가에시(자지 뒤집기)라고 하는 거죠?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そういう言葉、どこで覚えてくるの！？」"
translation = "「그런 말, 어디서 배워오는 거야!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「いろんなところで、です。会長さんをいっぱい気持ちよくするため、お勉強してるんですよ」"
translation = "「여러 곳에서요. 회장님을 듬뿍 기분 좋게 해주기 위해 공부하고 있거든요」"

[[dialogue]]
speaker = "unk"
original = "もっと真面目に勉学に励みなさい！\u3000──と言いたいところだけど、ミウは学業の成績も俺が教えるまでもなく超優秀。"
translation = "좀 더 진지하게 학업에 힘써라! ──라고 말하고 싶은 참이지만, 미우는 학업 성적도 내가 가르쳐 줄 필요도 없이 초우수."

[[dialogue]]
speaker = "unk"
original = "『頭の良い子ほどエロい』なんて俗説があるけど、ミウと付き合っているとその正しさを証明させられている気分になる。"
translation = "'머리 좋은 아이일수록 에로이다'라는 속설이 있지만, 미우와 사귀다 보면 그 정당성을 증명당하는 기분이 든다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、飼い主に服従するワンちゃんみたいなのに、おち○ちんは期待しちゃってるんですね」"
translation = "「후후, 주인에게 복종하는 강아지 같은 주제에, 자지는 기대해 버리고 있네요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「先っぽからおもらしみたいにお汁垂らしてカチンコチン♪\u3000ちょっとシコシコしただけで、ぴゅっぴゅしちゃいそうです♪」"
translation = "「끝에서 오줌 싸는 것처럼 즙을 흘리며 꽁꽁♪ 조금만 조물조물해도 퓨퓨 해버릴 것 같아요♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「これで理解ったんじゃないですか？\u3000やっぱり私がＳなんじゃなくて、会長さんがドＭなんですよ」"
translation = "「이걸로 이해하셨죠? 역시 제가 S가 아니라, 회장님이 극M인 거예요」"

[[dialogue]]
speaker = "unk"
original = "そんなことはない──なかったはずだ。"
translation = "그런 일은 없다──없었을 터다."

[[dialogue]]
speaker = "unk"
original = "あるとしたら、『ミウと付き合っている内に、ドＭに変えられてしまった』という方が正しい。"
translation = "있다고 한다면, 『미우와 사귀는 동안, 마조로 바뀌어 버렸다』라는 쪽이 올바르다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「年下の彼女にイジられてー、気持ちよーく射精したくなっちゃってるドＭの会長さん♪」"
translation = "「연하인 여자친구한테 놀림당해서ー, 기분 좋ー게 사정하고 싶어져 버린 마조 회장님♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ドＭって認めたら、挿入れさせてあげますね<emoji=heart04>」"
translation = "「마조라고 인정하면, 삽입하게 해드릴게요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「私のちっちゃくて、狭くて、ぬるぬるであったかくて、きもちい～い……何回も精液を吐き出したおま○こに……<emoji=heart04>」"
translation = "「내 조그맣고, 좁고, 미끌거리고 따뜻해서, 기분 조~은…… 몇 번이고 정액을 토해낸 보지에……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「挿入れたくないですか？\u3000挿入れたいですよね？\u3000会長さんのおち○ちんは、私のおま○この味、覚えちゃってますもんね？」"
translation = "「삽입하고 싶지 않나요? 삽입하고 싶죠? 회장님의 자지는, 내 보지 맛, 기억해 버렸으니까요?」"

[[dialogue]]
speaker = "unk"
original = "素股をするように、肉棒へ股間をなすりつける。"
translation = "스마타를 하듯이, 육봉에 음부를 문지른다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んっ、んぅ……私は別に挿入れなくてもぉ……こうやってぇ……んんっ<emoji=heart04>\u3000ぬるぬる擦りつけてるだけでも気持ちいいんですけどぉ……」"
translation = "「응, 으응…… 나는 딱히 안 넣어도오…… 이렇게애…… 으응<emoji=heart04> 미끌거리는 거 문지르는 것만으로도 기분 좋은데요오……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さんは、挿入れたいんじゃないですかぁ……？\u3000私のおま○この中、勃起したおち○ちんで、ぐちょぐちょにかき回したいんじゃないですかぁ……？」"
translation = "「회장님은, 넣고 싶은 거 아닌가요오……? 내 보지 속, 발기한 자지로, 푹푹 휘젓고 싶은 거 아닌가요오……?」"

[[dialogue]]
speaker = "unk"
original = "口にするまでもなく、ミウはわかりきっている。わかりきっているからこそ。"
translation = "입으로 말할 필요도 없이, 미우는 다 알고 있다. 다 알고 있기에 더욱."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ちゃんと声に出して、言ってくださいね。『ミウのおま○こに、おち○ちん入れて、パコパコしたいですぅ』って」"
translation = "「똑바로 소리 내서, 말해주세요. 『미우 보지에, 자지 넣어서, 떡치고 싶어요오』라고」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あ、ぁっ、ぅ……く、あぁっ……！」"
translation = "「아, 아앗, 으…… 쿠, 아앗……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「どうなんです？\u3000このままお手々でシコシコしてー、無駄打ちさせちゃっても私は構わないんですよ？」"
translation = "「어떤가요? 이대로 손으로 딸딸이 쳐서ー, 허공에 쏘게 해버려도 나는 상관없는데요?」"

[[dialogue]]
speaker = "unk"
original = "俺に服従の言葉を言わせたがっている。張りつめたペニスは我慢の限界だった。"
translation = "나에게 복종의 말을 하게 만들고 싶어 한다. 팽팽하게 부풀어 오른 페니스는 참기 힘들 정도였다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ミ……ミウのおま○こに、生おち○ちんぶちこんでっ……パコパコしたい……ですっ……！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "完全に性欲の主導権を握られている俺はただ頷き、従い、ミウの望む言葉を口にするしかできなかった。"
translation = "완전히 성욕의 주도권을 잡힌 나는 그저 고개를 끄덕이고, 따르고, 미우가 원하는 말을 입에 담을 수밖에 없었다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あはぁっ……<emoji=heart04>\u3000よーく、で・き・ま・し・た<emoji=heart04>」"
translation = "「아하앗……<emoji=heart04> 참·잘·했·어·요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺を褒め称えるミウの恍惚な笑みは、ドＳな傾国の女王様そのもの。"
translation = "나를 칭찬하는 미우의 황홀한 미소는, 도S인 경국의 여왕님 그 자체."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ちゃーんと言えたご褒美です、挿入れちゃいますよ、挿入れちゃいますよー……しっかり見ててくださいね」"
translation = "「똑바ー로 말해준 포상이에요, 넣어 버릴게요, 넣어 버릴게요ー…… 잘 보고 있으세요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さんのおち○ちんが、私のおま○こに食べられちゃうところ……<emoji=heart04>」"
translation = "「회장님의 자지가, 내 보지한테 잡아먹히는 모습……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ミウと俺は、完全に捕食者と非捕食者の関係だった。"
translation = "미우와 나는, 완전히 포식자와 피식자의 관계였다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁっ、んぁ、ぁあぁぁんっ……<emoji=heart04>\u3000今日のおち○ちん、いつもより硬ぁいっ……すっごく興奮してたんですね<emoji=heart04>」"
translation = "「하앗, 응아, 아아앙앗……<emoji=heart04> 오늘 자지, 평소보다 딱딱해엣…… 엄청 흥분했었네요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狭くて小さなミウの膣穴を押し広げて、ペニスが根元まで咥えこまれ、見えなくなっていく。"
translation = "좁고 작은 미우의 질 구멍을 넓히며, 페니스가 뿌리까지 삼켜져, 보이지 않게 되어간다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、はぅうぅんっ……会長さんのおち○ちん、長くてぇっ……んんっ……膣奥に当たったのわかりますか……？」"
translation = "「하아, 하우우웅앗…… 회장님 자지, 길어서어…… 으응…… 질 안쪽에 닿은 거 알겠나요……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ふぅ、あっ、わっ、わかるっ……届いたっ……！」"
translation = "「후으, 아, 아, 알겠어…… 닿았어……!」"

[[dialogue]]
speaker = "unk"
original = "尖端にコリコリとしたリング状の肉の感触が当たる。"
translation = "귀두 끝에 오돌토돌한 링 모양의 살의 감촉이 닿는다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、どうしたんですか、会長さん。お顔真っ赤……お猿さんみたいですよ<emoji=heart04>」"
translation = "「후후, 왜 그러세요, 회장님. 얼굴이 새빨개져서…… 원숭이 같아요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くっ……この格好は、さすがに、恥ずかしいっていうかっ……もうちょっと普通にっ……！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "無理やり大股を開かされ、プロレス技でもかけられてるみたいな体位。尻も開いてしまっているのか、妙に風通しがいい。"
translation = "억지로 다리를 벌려져, 프로레스링 기술이라도 걸린 것 같은 체위. 엉덩이도 벌어져 있는 건지, 묘하게 바람이 잘 통한다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ダーメでーす<emoji=heart04>」"
translation = "「안~ 돼요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ど、どうしてっ……！？」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「だってぇ……私よりも強くて、全校生徒の憧れなのに……お尻の穴も丸出しで、情けない格好を晒してる会長さん……すっごく可愛いじゃないですか<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "お気に入りのオモチャで遊んでいる子供のような無邪気な笑顔で言い放つ。"
translation = "마음에 드는 장난감을 가지고 놀고 있는 아이 같은 천진난만한 웃음으로 내뱉는다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「他の人には……ヒマワリちゃんにだって見せたくないです……今の会長さんは、私だけの秘密……彼女の私だけが見られる特権なんです<emoji=heart04>」"
translation = "「다른 사람한테는…… 히마와리짱한테도 보여주고 싶지 않아요…… 지금의 회장님은, 나만의 비밀…… 여자친구인 나만 볼 수 있는 특권이에요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "小ぶりのおっぱいを揺らしながら、お尻の上下運動を始める。"
translation = "아담한 가슴을 흔들면서, 엉덩이를 위아래로 움직이기 시작한다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぁ……はっ、はっ……どう、ですぅ？\u3000私のおま○こ、気持ちよくないですかぁ？\u3000嫌なら、抜いちゃいますけどぉ……」"
translation = "「응아…… 하아, 하아…… 어, 어때요오? 내 보지, 기분 좋지 않나요오? 싫다면, 빼버릴 건데요오……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「や、やだ、抜きたくないっ……ミウの膣内っ、きもちいいっ……このままがいいっ……！」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふぅん<emoji=heart04>\u3000そうなんですかー<emoji=heart04>\u3000会長さんは、年下の私に乗っかられて……犯されちゃうのが気持ちよくって仕方ないんですね<emoji=heart04>」"
translation = "「후응<emoji=heart04> 그렇군요ー<emoji=heart04> 회장님은, 연하인 나한테 올라타져서…… 범해지는 게 기분 좋아서 어쩔 줄 모르는 거군요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺の不用意な発言で、明らかにミウのギアが上がった。"
translation = "나의 부주의한 발언으로, 분명하게 미우의 기어가 올라갔다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んふっ、会長さんってば、年上なのに、情けなーい<emoji=heart04>\u3000そんな会長さんが、だい・だい・だぁい好きです<emoji=heart04>」"
translation = "「응훗, 회장님도 참, 연상인데, 한심해라ー<emoji=heart04> 그런 회장님이, 정·말·정·말 좋아해요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぉうっ！？\u3000んっ、ふぅ、んぁあぁっ！？」"
translation = "「으욱!? 응, 후으, 응아아앗!?」"

[[dialogue]]
speaker = "unk"
original = "ミウの上下スクワットが加速する。互いの分泌する粘液が絡み合う音が部屋に大きく響いた。"
translation = "미우의 스쿼트 동작이 가속한다. 서로 분비하는 점액이 얽히는 소리가 방안에 크게 울려 퍼졌다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、ドＭな会長さんはもうわかってますよね。『恥ずかしい』は『気持ちいい』なんですよ？」"
translation = "「후후, 마조인 회장님은 이미 알고 있죠? 『부끄럽다』는 『기분 좋다』라는 거 알아챘죠?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、はっ……んぁはぁぁっ<emoji=heart04>\u3000『こんなえっちじゃ気持ちよくない』っていうなら、やめてあげてもよかったんですけど<emoji=heart04>」"
translation = "「하아, 하아…… 응아하아앗<emoji=heart04> 『이런 야한 건 기분 안 좋아』라고 한다면, 그만둬 줄 수도 있었는데요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぅ、はぁ、さっきよりおち○ちんおっきくなって……硬くなって……悦んじゃってますもんね……んふふっ<emoji=heart04>」"
translation = "「응으, 하아, 아까보다 자지 커져서…… 커져서…… 기뻐하고 있으니까요…… 응후후<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "敏感な粘膜と粘膜で擦り合っていたら、反応はバレバレだ。気持ちよさに嘘はつけない。"
translation = "민감한 점막과 점막이 문질러지고 있으면, 반응은 훤히 들통난다. 기분 좋음에는 거짓말을 할 수 없다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それじゃ、そろそろ本気出すので……覚悟してくださいね<emoji=heart04>」"
translation = "「그럼, 이제 슬슬 진심을 낼 테니까…… 각오하세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ミウは汗で張りつく長い髪をかき上げると、ペロリと自分の唇をピンク色の舌で舐め回して微笑む。"
translation = "미우는 땀으로 젖어 붙은 긴 머리를 걷어 올리고는, 핥듯이 자신의 입술을 분홍색 혀로 핥고는 미소 짓는다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「んぅあぁっ！？\u3000んぁ、あぅ、んぁんっ！」"
translation = "「응으아앗!? 응아, 아우, 응앙앗!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んふふふふっ、会長さん、女の子みたいにあんあん喘いじゃって可愛いです<emoji=heart04>\u3000おち○ちんきもちいいんですね<emoji=heart04>」"
translation = "「응후후후훗, 회장님, 여자아이처럼 앙앙 신음하고 귀여워요<emoji=heart04> 자지 기분 좋아서 그렇죠<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "膣肉の締まりが格段に強まっていて、膣道を１往復する度、ペニスが根元から引っこ抜かれそうな快感が突き抜ける。"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はっ、はぁ……ミウだって、きもちよくなってるクセにっ……！\u3000おま○こ、ぐっ、ぐちょぐちょだぞっ……！」"
translation = "「하아, 하아…… 미우야말로 기분 좋아하고 있는 주제에……! 보지, 윽, 축축하잖아……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そうですよぉ？\u3000会長さんの傍にいるだけで、私のおま○こ、すぐに濡れちゃうんですから……<emoji=heart04>」"
translation = "「그렇다고요? 회장님 곁에 있는 것만으로도 제 보지, 금방 젖어버리니까요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ずりずり擦ってるだけじゃ物足りなかったです……会長さんとえっちするの、おま○こでおち○ちんゴシゴシするの、だぁい好きですっ……<emoji=heart04>」"
translation = "「비벼대기만 하는 건 감질났어요…… 회장님이랑 엣치하는 거, 보지로 자지 문질문질하는 거, 너무 좋아해요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺の言葉責めをあっさり受け止めて、いじらしい言葉で反撃してくる。ますます俺の性欲はミウに掌握されていく。"
translation = "내 언어적 공세를 가볍게 받아넘기고는, 기특한 말로 반격해 온다. 점점 더 나의 성욕은 미우에게 장악되어 간다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、んぁ、あっ、あっ<emoji=heart04>\u3000男性が女性に思いきり体重をかけるえっちを、種付けプレス、って言うんですよね？」"
translation = "「하아, 응아, 아, 앗<emoji=heart04> 남성이 여성에게 온힘을 다해 체중을 실어 하는 엣치를 씨뿌리기 프레스, 라고 하는 거죠?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ホントにどこでそんな言葉を……くぅっ！」"
translation = "「진짜 어디서 그런 말을…… 큭!」"

[[dialogue]]
speaker = "unk"
original = "ミウの口から出た品性に欠ける言葉が股間に刺さる。"
translation = "미우의 입에서 나온 품위 없는 단어가 가랑이에 꽂힌다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「だからぁ、会長さんを堕とすために、いっぱいお勉強してますから<emoji=heart04>」"
translation = "「그치만, 회장님을 타락시키기 위해서 공부 많이 했으니까요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「こうやってぇ、んんっ<emoji=heart04>\u3000女性が跨って体重をかける体位はぁ……逆種付けプレスって言うんですかねぇ……？」"
translation = "「이렇게에, 응읏<emoji=heart04> 여성이 올라타서 체중을 싣는 체위는…… 역씨뿌리기 프레스라고 하는 걸까요……?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「こんなに深く挿入れちゃってたら……おち○ちん抜けないですよねー？\u3000このまま中に出すしかないですよねー？」"
translation = "「이렇게 깊게 삽입해 버렸으면…… 자지 안 빠지겠죠—? 이대로 안에 싸는 수밖에 없겠죠—?」"

[[dialogue]]
speaker = "unk"
original = "俺の感じる部分を知り尽くしているミウは、ぱんっぱんっぱんっと、リズミカルにテンポ良く股間を打ち付ける。"
translation = "내가 느끼는 부위를 완벽히 알고 있는 미우는 탁, 탁, 탁 소리가 나게 리드미컬하고 경쾌한 템포로 가랑이를 부딪쳐 온다."

[[dialogue]]
speaker = "unk"
original = "ぷるんぷるんと柔らかく揺れるおっぱいからも目を離せない。"
translation = "탱글탱글 부드럽게 흔들리는 가슴에서도 눈을 뗄 수 없다."

[[dialogue]]
speaker = "unk"
original = "全てはミウの計略であり、巧妙な罠。彼女にハマッてしまったが最後、もう抜け出せやしない。"
translation = "모든 것은 미우의 계략이자 교묘한 덫. 그녀에게 빠져버린 이상, 더는 빠져나갈 수 없다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、会長さんの精液、い～っぱい搾り取っちゃいますっ……んんっ<emoji=heart04>\u3000このまま、子宮に出して、私をママにしちゃってくださいねっ<emoji=heart04>」"
translation = "「후후, 회장님의 정액, 가~득 짜내 버릴 거라고요…… 응읏<emoji=heart04> 이대로 자궁에 싸서, 저를 엄마로 만들어 주세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "１往復毎にペニスが昂る。"
translation = "한 번 왕복할 때마다 성기가 고양된다."

[[dialogue]]
speaker = "unk"
original = "締まりの良すぎる膣肉に包まれ、ローションのようなとろっとろの愛液に促され、セックスを全身で愉しむミウに追い込まれる。"
translation = "조임이 너무 좋은 질 고기에 싸여, 로션 같은 끈적끈적한 애액에 유도되어, 섹스를 온몸으로 즐기는 미우에게 내몰린다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、あっ、あぅ、んっ、はぁ、んんんっ<emoji=heart04>\u3000きもちいっ、会長さんのおち○ちん、きもちいいところばっか擦れるぅっ……<emoji=heart04>」"
translation = "「하아, 앗, 아우, 읏, 하아, 응응응읏<emoji=heart04> 기분 좋아, 회장님의 성기, 기분 좋은 곳만 문질러져어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "睾丸で煮え滾っている精液を、一刻も早く解き放ちたい。でも、このままじゃ、ミウをろくに満足させられないまま、屈してしまう。"
translation = "고환에서 들끓고 있는 정액을 일각이라도 빨리 방출하고 싶다. 하지만, 이대로라면 미우를 제대로 만족시키지 못한 채 굴복하고 만다."

[[dialogue]]
speaker = "unk"
original = "歯を食いしばりながら、性欲と理性のせめぎ合いを堪えた。"
translation = "이를 악물면서 성욕과 이성의 갈등을 견뎌냈다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、んぁっ、はっ、あれ？\u3000あれれ？\u3000どうしたんですか？\u3000歯を食いしばっちゃって……辛そうですね……<emoji=heart04>」"
translation = "「하아, 응아앗, 핫, 어라? 어라라? 왜 그러세요? 이를 악물고…… 괴로워 보이네요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふっ、もう余裕なさそうですね。イッちゃいそうです？\u3000このままじゃ、負けちゃいますよー？\u3000おち○ちんでわからせてくれるんじゃなかったんですか？」"
translation = "「후후엣, 이제 여유가 없어 보이네요. 사정할 것 같아요? 이대로라면 져버린다고요―? 성기로 정신 차리게 해주겠다던 건 아니었나요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「先にイッたら、ダ・メですよ<emoji=heart04>\u3000もうちょっと我慢してくださいねっ、一緒にきもちよくなりましょうねっ<emoji=heart04>」"
translation = "「먼저 사정하면, 안·돼요<emoji=heart04> 조금만 더 참아주세요, 함께 기분 좋아져요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「なら、もう少し加減っ……んくっ、うぅぅっ！」"
translation = "「그러면, 조금만 힘을…… 윽, 우우욱!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あははっ、年下の彼女に『手加減してー』なんてお願いしちゃうなんて、幻滅しちゃいますよ<emoji=heart04>」"
translation = "「아하핫, 연하의 여자친구에게 『살살해줘―』라니 부탁하다니, 환멸해 버려요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "何と言われようが、ミウの与える快感の虜に堕ちてしまっている。脚を抑えて圧し掛かられているから、身動きが取れない。"
translation = "뭐라 말을 듣든 간에 미우가 주는 쾌감의 포로로 떨어지고 있다. 다리를 눌린 채 짓눌려 있어서 몸을 움직일 수 없다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぅんぐぅうぅっ！？\u3000それヤバッ、ヤバいって！」"
translation = "「으응구우욱!? 그거 위험, 위험하다니까!」"

[[dialogue]]
speaker = "unk"
original = "手加減どころか、更にピストンの勢いが増す。"
translation = "살살해주기는커녕 더욱 피스톤의 기세가 더해진다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んあっ！？\u3000あはぁんっ、おち○ちん膨らんでっ、おま○こいっぱいになっちゃってますっ<emoji=heart04>」"
translation = "「응앗!? 아하앙읏, 성기가 부풀어 올라서, 음부 가득 차버렸어요옷<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺の膝に両手を添えて、杖のように立ち上がっては、一気に腰を落とす。"
translation = "내 무릎에 두 손을 얹고 지팡이처럼 일어서서는 한꺼번에 허리를 내린다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あんっ<emoji=heart04>\u3000んぁ、はぁ、はっ、んぁあぁぁっ<emoji=heart04>\u3000きもちいっ、おま○こっ、おま○こきもちいいぃぃっ<emoji=heart04>」"
translation = "「앙읏<emoji=heart04> 응아, 하아, 핫, 응아아아앗<emoji=heart04> 기분 좋아, 음부, 음부 기분 좋아아아읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぁっ<emoji=heart04>\u3000おま○こっ、感じすぎちゃいますっ<emoji=heart04>\u3000はぁんっ<emoji=heart04>\u3000私のおま○こと、会長さんのおち○ちん、相性ぴったりですよねっ<emoji=heart04>」"
translation = "「응아앗<emoji=heart04> 음부, 너무 느껴버려요<emoji=heart04> 하앙읏<emoji=heart04> 제 음부랑 회장님의 성기, 궁합이 딱 맞죠<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "幾度も重ねたセックスで、すっかり馴染んで、ぴったりになったという方が正しいだろう。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺の性癖も、肉体も。自分でも知らない間に、ミウのプランニングによって作り変えられたといっても過言じゃない。"
translation = "내 성벽도, 육체도. 나조차 모르는 사이에 미우의 플래닝에 의해 개조되었다고해도 과언이 아니다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「うぅんっ、どうですかぁ……？\u3000イッちゃいそうですっ？\u3000びゅーびゅーびゅーって、中出しできそうですかぁ……<emoji=heart04>」"
translation = "「우응, 어때요오……? 가버릴 것 같아요? 뷰- 뷰- 뷰- 하고 안싸 할 수 있을 것 같아요오……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「く、あっ、だ、だめなのにっ……！」"
translation = "「크, 아, 안, 안 되는데……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「中出ししちゃダメってわかってても、我慢なんてできないですよねっ<emoji=heart04>\u3000ぅんっ、ふっ、うぅうぅんっ<emoji=heart04>」"
translation = "「안싸 하면 안 된다는 걸 알면서도 참을 수 없지요<emoji=heart04> 응, 후, 우으응<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、あっ、いっしょにイキましょうねっ<emoji=heart04>\u3000ぜったいっ、ぜったいにいっしょですよっ？\u3000いっしょにイッてくれなきゃダメですからねっ<emoji=heart04>」"
translation = "「하아, 아, 함께 가요<emoji=heart04> 절대, 절대로 함께예요? 함께 가주지 않으면 안 되니까요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぁ、はっ、はぁん<emoji=heart04>\u3000あっあぁぁっ！？\u3000はっ、はぅんっ<emoji=heart04>\u3000おま○こっびりびり痺れちゃいますっ<emoji=heart04>」"
translation = "「응아, 하, 하앙<emoji=heart04> 아, 아아앗!? 하, 하응<emoji=heart04> 보지 찌릿찌릿 마비되어 버려요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ミウの腰と膝がガクガク震え、絶頂の接近を訴えつつも、精を搾り取ろうと強烈な膣圧でペニスを締め付け、俺を絶頂に追い込む。"
translation = "미우의 허리와 무릎이 떨리고 절정이 다가옴을 호소하면서도 정액을 쥐어짜내기 위해 강렬한 질압으로 페니스를 조여 나를 절정으로 몰아넣는다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くぁ、あっ、あっ……もう、無理ぃっ……！」"
translation = "「쿠아, 아, 아…… 이제, 무리야……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「いいですよっ、許可しますっ<emoji=heart04>\u3000出して、出してっ<emoji=heart04>\u3000濃ゆぅい精液っ、子宮にっ、いっぱいください、くだひゃいっ<emoji=heart04>」"
translation = "「좋아요, 허락할게요<emoji=heart04> 사정해요, 사정해요<emoji=heart04> 진한 정액, 자궁에 듬뿍 주세요, 주세여<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はっ、あぁんっ<emoji=heart04>\u3000私も、もうらめれすっ、イキそっ、イク、イクッ、イクイクッ<emoji=heart04>\u3000おま○こっ、おま○こイッちゃいまひゅっ<emoji=heart04>」"
translation = "「하, 아앙<emoji=heart04> 저도 이제 무이에여, 가버릴 것 가, 가, 가, 가버려<emoji=heart04> 보지, 보지 가버려여<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あっ、はぁ、んぁあぁぁっ！？\u3000イクッ、イクイグイクッ──イッッちゃぅううぅううぅぅぅぅぅぅっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「아, 하아, 응아아앗!? 가, 가버려 가아앗──가버어어어어어어어<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぅひっ！？\u3000んぁはっ、はぁっ、んんんーっ<emoji=heart04>\u3000アッツぃの、出てっ、んぃっ<emoji=heart04>\u3000ふっ、んぅっ、はぁんっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「んぅっ！？\u3000ふっ、ぅぐっ、んんぅっ！！？」"
translation = "「응읏!? 후, 으극, 응응읏!!?」"

[[dialogue]]
speaker = "unk"
original = "噴き上がった白濁の噴水を、ミウの子宮はごきゅごきゅと美味しそうに飲み干していく。"
translation = "뿜어져 나온 백탁의 분수를 미우의 자궁은 꿀꺽꿀꺽 맛있게 들이켜 간다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あっ、はっ、ふぁっ<emoji=heart04>\u3000はっ、はひっ、ふぅうぅんっ……<emoji=heart04>\u3000せぇぇき、しゅごぉい……たっぷりれふぅ……<emoji=heart04>」"
translation = "「아, 하, 화아<emoji=heart04> 하, 하히, 후우응……<emoji=heart04> 정액 대단해여…… 듬뿍이에여……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はーっ、はぁーっ、はぁーっ……！\u3000まだおち○ちん動いて、まふ……そんなに、私の、おま○こ……きもちよかったんですか……？\u3000えへへ……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はぁっ！\u3000はっ、はっ！\u3000まだ、気持ちいいの続い、てるっ……ぅぐっ！？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "痙攣しているミウの膣ヒダは、精液が出尽くすまで貪欲にペニスを愛撫し続ける。"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「いいんですよー、そのまま私の膣内にいてくださいね……おち○ちん収まるまでずーっと、ずーっと……<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "しばらくの間、ミウの中に留まり──"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふぅ、ふぅん……んっ、はぁぁ……<emoji=heart04>\u3000おち○ちん、おとなしく、なって、きましたね……？」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あんっ……<emoji=heart04>\u3000抜けちゃうと、寂しいです……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ミウが腰を浮かすと、解放されたペニスが這い出るように抜けた。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ペニスの直径サイズにぽっかりと開いた膣穴の奥からは、ゲル状の白濁液がどろりと溢れ出る。"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、はっ……ぁんっ、零しちゃもったいないです……せっかくいっぱい出してもらったのに……」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "摘めるほどに濃厚な白濁液を持ち上げては掌に乗せて、粘土のようにこねて弄ぶ。"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「これが会長さんと私の愛し合った証、ですね<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はぁ、はっ……きもち、よかった……！\u3000ありがと、ミウ……」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「どういたしまして──あれ？\u3000会長さん、もしかして、もうおしまいだと思ってます？」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……え？\u3000だって俺もミウも最後まで──」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「まだまだし足りないですよぉ……えっちしたがってるおま○こ、放っておかれちゃうんですか？」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「たった１回で降参しちゃうなんて、このままだとずーっと私に負けっぱなしになっちゃいますよ？」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「一旦、休憩してから──って、あれ！？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "体は疲れているはずなのに、ペニスはミウの煽りに負けるものかと立ち上がる。"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、会長さんのおち○ちん、まだカチカチのままじゃないですか<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「『おま○こに、もう１回出したいよー出したいよー』って言ってますね。かぁわいい<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「い、いや、その……あれぇ……？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ミウの言う通り、ペニスは痛いくらいに勃起している。ペニスだけは元気なのに、体はすっかり脱力していて動けない。"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、お股開きっぱなしで逃げないってことはぁ……このまま愉しんじゃってもいいですよねー？」"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「よ、よくないっ！\u3000動けないだけだからっ！」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「私は会長さんの彼女なんですから、遠慮しなくていいんですよ。おち○ちんが満足するまで、何度でも<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「おま○こ、まだまだ欲しがっちゃってますから……もっともっと私を愛してくださいね<emoji=heart04>」"
translation = ""

