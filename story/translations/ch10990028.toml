[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ミウってさ……かなりＳっ気強めだよね……？」"
translation = "「미우는 말이야…… 상당한 S 기질이 강하지……?」"

[[dialogue]]
speaker = "unk"
original = "出会って間もない頃から薄々と感じていたことを、俺はおそるおそる尋ねてみた。"
translation = "만난 지 얼마 되지 않았을 때부터 어렴풋이 느끼고 있던 것을, 나는 조심스레 물어보았다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そうでしょうか？\u3000たまに言われますが、私自身は至って普通だと思っているんですけど……うーん……」"
translation = "「그럴까요? 가끔 듣기는 합니다만, 제 자신은 지극히 평범하다고 생각하는데요…… 음……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「相対的に考えると──私がＳなのではなく、会長さんがイジメられたがりのドＭなんじゃないですか？」"
translation = "「상대적으로 생각하면── 제가 S인 게 아니라, 회장님이 괴롭힘당하고 싶어 하는 극M인 거 아닌가요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そ、そんなことはない！\u3000……よ？」"
translation = "「그, 그렇지는 않아! ……거든?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そうですか？\u3000無理やり女の子の衣装を着せられても、拒むでもなく、むしろ、悦んでるなんて噂も聞きましたし……」"
translation = "「그렇습니까? 강제로 여자아이 옷을 입혀져도 거부하지 않고, 오히려 기뻐한다는 소문도 들었는데요……」"

[[dialogue]]
speaker = "unk"
original = "いったい何処を巡り巡った噂なのだろう。心当たりがなくもないので、強く否定できないのだけど。"
translation = "대체 어디를 돌고 돈 소문인 걸까. 짚이는 구석이 없는 것도 아니라서 강하게 부정할 수는 없지만."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さん、えっちの時もいつも受け身ですし」"
translation = "「회장님, 야한 짓 할 때도 항상 수동적이시고요」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それはミウの攻めが積極的すぎるんだよ！」"
translation = "「그건 미우의 공세가 너무 적극적인 거라고!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さん、イジってる時よりもイジられてる時の方が気持ちよさそうですから♪\u3000私にされるの、嫌でした？」"
translation = "「회장님, 괴롭힐 때보다 괴롭힘당할 때가 더 기분 좋아 보이시니까요♪ 제가 해드리는 거, 싫으셨어요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「嫌じゃないよ。ミウがしてくれるの、気持ちいいし……」"
translation = "「싫지 않아. 미우가 해주는 거, 기분 좋고……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それなら、良かったです。では、会長さんがＭなのか、そうでないか、えっちで確かめてみませんか？」"
translation = "「그러시다면 다행이네요. 그럼 회장님이 M인지 아닌지, 야한 짓으로 확인해 볼까요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「たまには攻め攻めな会長さんも見てみたいです。つよつよなおち○ちんで私を屈服させてください<emoji=heart04>」"
translation = "「가끔은 공격적인 회장님도 보고 싶어요. 강인한 자지로 저를 굴복시켜 주세요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あれあれあれー？\u3000会長さん、いつの間にかこんな恥ずかしい格好になっちゃってますねー？」"
translation = "「어라어라어라ー? 회장님, 어느새 이렇게 부끄러운 차림이 되어 버리셨네요ー?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「どうして！？」"
translation = "「어째서!?」"

[[dialogue]]
speaker = "unk"
original = "ミウに負けないよう、いつもより積極的に愛撫して、ストッキングを破いたり、衣服を乱したりと攻めていたはずなのに。"
translation = "미우에게 지지 않도록 평소보다 적극적으로 애무하고, 스타킹을 찢거나 옷을 흐트러뜨리며 공격했을 터인데."

[[dialogue]]
speaker = "unk"
original = "気がつくと、寝転がる俺にミウが跨る女性上位になっていた。"
translation = "정신을 차려보니 누워있는 내 위에 미우가 올라탄 여성 상위 자세가 되어 있었다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「おち○ちんもお尻も恥ずかしいところぜ～んぶ丸出し……<emoji=heart04>\u3000これ、ちんぐり返しって言うんですよね？」"
translation = "「자지도 엉덩이도 부끄러운 부위 전~부 노출……<emoji=heart04> 이거, 뒤집기라고 하는 거 맞죠?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「そういう言葉、どこで覚えてくるの！？」"
translation = "「그런 말은 어디서 배워오는 거야!?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「いろんなところで、です。会長さんをいっぱい気持ちよくするため、お勉強してるんですよ」"
translation = "「여러 곳에서요. 회장님을 잔뜩 기분 좋게 해주기 위해 공부하고 있거든요」"

[[dialogue]]
speaker = "unk"
original = "もっと真面目に勉学に励みなさい！\u3000──と言いたいところだけど、ミウは学業の成績も俺が教えるまでもなく超優秀。"
translation = "좀 더 진지하게 학업에 힘써라! ──라고 말하고 싶은 참이지만, 미우는 학업 성적도 내가 가르쳐 줄 필요도 없이 초우수."

[[dialogue]]
speaker = "unk"
original = "『頭の良い子ほどエロい』なんて俗説があるけど、ミウと付き合っているとその正しさを証明させられている気分になる。"
translation = "『머리가 좋은 아이일수록 에로이다』라는 속설이 있지만, 미우와 교제하고 있으면 그 정당성을 증명당하는 기분이 든다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、飼い主に服従するワンちゃんみたいなのに、おち○ちんは期待しちゃってるんですね」"
translation = "「후후, 주인에게 복종하는 강아지 같은 주제에 자지는 기대하고 있네요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「先っぽからおもらしみたいにお汁垂らしてカチンコチン♪\u3000ちょっとシコシコしただけで、ぴゅっぴゅしちゃいそうです♪」"
translation = "「끝에서 실례하듯이 쿠키 액 흘리면서 딱딱♪ 살짝만 줘도 뷰뷰 해버릴 것 같아요♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「これで理解ったんじゃないですか？\u3000やっぱり私がＳなんじゃなくて、会長さんがドＭなんですよ」"
translation = "「이걸로 이해하지 않으셨나요? 역시 제가 S가 아니라 회장님이 도M인 거예요」"

[[dialogue]]
speaker = "unk"
original = "そんなことはない──なかったはずだ。"
translation = "그럴 리가 없다──없었을 터다."

[[dialogue]]
speaker = "unk"
original = "あるとしたら、『ミウと付き合っている内に、ドＭに変えられてしまった』という方が正しい。"
translation = "만약 그렇다면 『미우와 교제하는 동안 도M으로 바뀌어 버렸다』라는 쪽이 옳다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「年下の彼女にイジられてー、気持ちよーく射精したくなっちゃってるドＭの会長さん♪」"
translation = "「연하인 여자친구한테 괴롭혀져서ー 기분 좋ー게 사정하고 싶어진 도M 회장님♪」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ドＭって認めたら、挿入れさせてあげますね<emoji=heart04>」"
translation = "「도M이라고 인정하시면 삽입하게 해드릴게요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「私のちっちゃくて、狭くて、ぬるぬるであったかくて、きもちい～い……何回も精液を吐き出したおま○こに……<emoji=heart04>」"
translation = "「제 조그맣고, 좁고, 미끈미끈 따뜻해서 기분 조~은…… 몇 번이고 정액을 뱉어낸 보지에……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「挿入れたくないですか？\u3000挿入れたいですよね？\u3000会長さんのおち○ちんは、私のおま○この味、覚えちゃってますもんね？」"
translation = "「넣고 싶지 않으신가요? 넣고 싶으시죠? 회장님의 자지는 제 보지 맛을 기억하고 있으니까요?」"

[[dialogue]]
speaker = "unk"
original = "素股をするように、肉棒へ股間をなすりつける。"
translation = "스마타를 하듯이 육봉에 음부를 문지른다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んっ、んぅ……私は別に挿入れなくてもぉ……こうやってぇ……んんっ<emoji=heart04>\u3000ぬるぬる擦りつけてるだけでも気持ちいいんですけどぉ……」"
translation = "「응, 으응…… 저는 딱히 넣지 않아도오…… 이렇게에…… 응응<emoji=heart04> 미끈미끈 문지르는 것만으로도 기분 좋지만요오……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さんは、挿入れたいんじゃないですかぁ……？\u3000私のおま○この中、勃起したおち○ちんで、ぐちょぐちょにかき回したいんじゃないですかぁ……？」"
translation = "「회장님은 넣고 싶으신 거 아닌가요오……? 제 보지 속을 발기한 자지로 푹신푹신 휘젓고 싶으신 거 아닌가요오……?」"

[[dialogue]]
speaker = "unk"
original = "口にするまでもなく、ミウはわかりきっている。わかりきっているからこそ。"
translation = "입으로 말할 필요도 없이 미우는 다 알고 있다. 다 알고 있기에 더욱."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ちゃんと声に出して、言ってくださいね。『ミウのおま○こに、おち○ちん入れて、パコパコしたいですぅ』って」"
translation = "「똑바로 소리 내서 말해 주세요. 『미우의 보지에 자지 넣고 팍팍 하고 싶습니다아』라고」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あ、ぁっ、ぅ……く、あぁっ……！」"
translation = "「아, 아앗, 윽…… 큭, 아앗……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「どうなんです？\u3000このままお手々でシコシコしてー、無駄打ちさせちゃっても私は構わないんですよ？」"
translation = "「어떠신가요? 이대로 손으로 해줘서 헛발질하게 만들어도 저는 상관없는데요?」"

[[dialogue]]
speaker = "unk"
original = "俺に服従の言葉を言わせたがっている。張りつめたペニスは我慢の限界だった。"
translation = "나에게 복종의 말을 하게 만들고 싶어 한다. 팽팽해진 팽창한 페니스는 참는 것의 한계였다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ミ……ミウのおま○こに、生おち○ちんぶちこんでっ……パコパコしたい……ですっ……！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "完全に性欲の主導権を握られている俺はただ頷き、従い、ミウの望む言葉を口にするしかできなかった。"
translation = "완전히 성욕의 주도권을 쥐여버린 나는 그저 고개를 끄덕이고, 따르며, 미우가 원하는 말을 입에 담을 수밖에 없었다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あはぁっ……<emoji=heart04>\u3000よーく、で・き・ま・し・た<emoji=heart04>」"
translation = "「아하앗……<emoji=heart04> 참·잘·했·어·요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺を褒め称えるミウの恍惚な笑みは、ドＳな傾国の女王様そのもの。"
translation = "나를 칭찬하는 미우의 황홀한 미소는 도S인 경국의 여왕님 그 자체."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ちゃーんと言えたご褒美です、挿入れちゃいますよ、挿入れちゃいますよー……しっかり見ててくださいね」"
translation = "「똑바로 말한 상입니다, 넣어버릴게요, 넣어버릴게요ー…… 잘 보고 있으세요」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「会長さんのおち○ちんが、私のおま○こに食べられちゃうところ……<emoji=heart04>」"
translation = "「회장님의 자지가 제 보지에 먹혀버리는 모습……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ミウと俺は、完全に捕食者と非捕食者の関係だった。"
translation = "미우와 나는 완전히 포식자와 피식자의 관계였다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁっ、んぁ、ぁあぁぁんっ……<emoji=heart04>\u3000今日のおち○ちん、いつもより硬ぁいっ……すっごく興奮してたんですね<emoji=heart04>」"
translation = "「하앗, 응아, 아아앙앗……<emoji=heart04> 오늘 자지, 평소보다 딱딱해엣…… 엄청 흥분했었네요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "狭くて小さなミウの膣穴を押し広げて、ペニスが根元まで咥えこまれ、見えなくなっていく。"
translation = "좁고 작은 미우의 질 구멍을 넓히며 페니스가 뿌리까지 물려 들어가 모습이 사라져 간다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、はぅうぅんっ……会長さんのおち○ちん、長くてぇっ……んんっ……膣奥に当たったのわかりますか……？」"
translation = "「하아, 하우우웅앗…… 회장님 자지, 길어서어…… 으응…… 질 안쪽에 닿은 거 알겠나요……?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ふぅ、あっ、わっ、わかるっ……届いたっ……！」"
translation = "「후으, 아, 아, 알겠어…… 닿았어……!」"

[[dialogue]]
speaker = "unk"
original = "尖端にコリコリとしたリング状の肉の感触が当たる。"
translation = "끝부분에 오돌토돌한 고리 모양의 살 감촉이 닿는다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、どうしたんですか、会長さん。お顔真っ赤……お猿さんみたいですよ<emoji=heart04>」"
translation = "「후후, 왜 그러세요, 회장님. 얼굴이 새빨개져서…… 원숭이 같아요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くっ……この格好は、さすがに、恥ずかしいっていうかっ……もうちょっと普通にっ……！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "無理やり大股を開かされ、プロレス技でもかけられてるみたいな体位。尻も開いてしまっているのか、妙に風通しがいい。"
translation = "억지로 다리를 크게 벌려져 프로레스 기술이라도 걸린 듯한 체위. 엉덩이도 벌어져 버린 것인지 묘하게 바람이 잘 통한다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ダーメでーす<emoji=heart04>」"
translation = "「안ー돼요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ど、どうしてっ……！？」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「だってぇ……私よりも強くて、全校生徒の憧れなのに……お尻の穴も丸出しで、情けない格好を晒してる会長さん……すっごく可愛いじゃないですか<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "お気に入りのオモチャで遊んでいる子供のような無邪気な笑顔で言い放つ。"
translation = "마음에 드는 장난감을 가지고 노는 아이 같은 천진난만한 미소로 쏘아붙인다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「他の人には……ヒマワリちゃんにだって見せたくないです……今の会長さんは、私だけの秘密……彼女の私だけが見られる特権なんです<emoji=heart04>」"
translation = "「다른 사람한테는…… 히마와리짱한테도 보여주고 싶지 않아요…… 지금의 회장님은 나만의 비밀…… 여자친구인 나만 볼 수 있는 특권이에요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "小ぶりのおっぱいを揺らしながら、お尻の上下運動を始める。"
translation = "작은 가슴을 흔들면서 엉덩이의 위아래 운동을 시작한다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぁ……はっ、はっ……どう、ですぅ？\u3000私のおま○こ、気持ちよくないですかぁ？\u3000嫌なら、抜いちゃいますけどぉ……」"
translation = "「응아…… 하아, 하아…… 어, 때요오? 제 보지, 기분 좋지 않으신가요오? 싫다면 빼버릴 건데요오……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「や、やだ、抜きたくないっ……ミウの膣内っ、きもちいいっ……このままがいいっ……！」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふぅん<emoji=heart04>\u3000そうなんですかー<emoji=heart04>\u3000会長さんは、年下の私に乗っかられて……犯されちゃうのが気持ちよくって仕方ないんですね<emoji=heart04>」"
translation = "「후웅<emoji=heart04> 그러신가요ー<emoji=heart04> 회장님은 연하인 저한테 올라타져서…… 범해지는 게 기분 좋아서 어쩔 줄 모르시네요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺の不用意な発言で、明らかにミウのギアが上がった。"
translation = "나의 부주의한 발언으로 명백히 미우의 기어가 올라갔다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んふっ、会長さんってば、年上なのに、情けなーい<emoji=heart04>\u3000そんな会長さんが、だい・だい・だぁい好きです<emoji=heart04>」"
translation = "「응훗, 회장님도 참, 연상인데 한심해ー라<emoji=heart04> 그런 회장님이 정·말·정·말 좋아해요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぉうっ！？\u3000んっ、ふぅ、んぁあぁっ！？」"
translation = "「으욱!? 응, 후으, 응아아앗!?」"

[[dialogue]]
speaker = "unk"
original = "ミウの上下スクワットが加速する。互いの分泌する粘液が絡み合う音が部屋に大きく響いた。"
translation = "미우의 위아래 스쿼트가 가속한다. 서로 분비하는 점액이 얽히는 소리가 방 안에 크게 울려 퍼졌다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、ドＭな会長さんはもうわかってますよね。『恥ずかしい』は『気持ちいい』なんですよ？」"
translation = "「후후, 도M인 회장님은 이미 알고 계시죠? 『부끄럽다』는 『기분 좋다』예요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、はっ……んぁはぁぁっ<emoji=heart04>\u3000『こんなえっちじゃ気持ちよくない』っていうなら、やめてあげてもよかったんですけど<emoji=heart04>」"
translation = "「하아, 하아…… 응아하아아앗<emoji=heart04> 『이런 야한 짓은 기분 안 좋아』라고 하신다면 그만둬 드릴 수도 있었는데요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぅ、はぁ、さっきよりおち○ちんおっきくなって……硬くなって……悦んじゃってますもんね……んふふっ<emoji=heart04>」"
translation = "「응으, 하아, 아까보다 자지 커져서…… 단단해져서…… 기뻐하고 계시니까요…… 응후후<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "敏感な粘膜と粘膜で擦り合っていたら、反応はバレバレだ。気持ちよさに嘘はつけない。"
translation = "민감한 점막과 점막이 비벼지고 있자니 반응은 들통난다. 기분 좋음에 거짓말은 칠 수 없다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「それじゃ、そろそろ本気出すので……覚悟してくださいね<emoji=heart04>」"
translation = "「그럼 이제 슬슬 본기 낼 테니까…… 각오하세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ミウは汗で張りつく長い髪をかき上げると、ペロリと自分の唇をピンク色の舌で舐め回して微笑む。"
translation = "미우는 땀으로 엉겨 붙은 긴 머리를 넘기더니 낼름 자신의 입술을 분홍색 혀로 핥고 미소 짓는다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「んぅあぁっ！？\u3000んぁ、あぅ、んぁんっ！」"
translation = "「응으아앗!? 응아, 아우, 응앙앗!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んふふふふっ、会長さん、女の子みたいにあんあん喘いじゃって可愛いです<emoji=heart04>\u3000おち○ちんきもちいいんですね<emoji=heart04>」"
translation = "「응후후후훗, 회장님, 여자아이처럼 앙앙 신음하고 귀여워요<emoji=heart04> 자지 기분 좋은 거군요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "膣肉の締まりが格段に強まっていて、膣道を１往復する度、ペニスが根元から引っこ抜かれそうな快感が突き抜ける。"
translation = ""

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はっ、はぁ……ミウだって、きもちよくなってるクセにっ……！\u3000おま○こ、ぐっ、ぐちょぐちょだぞっ……！」"
translation = "「하아, 하아…… 미우야말로 기분 좋아하고 있는 주제에……! 보지, 윽, 축축하잖아……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「そうですよぉ？\u3000会長さんの傍にいるだけで、私のおま○こ、すぐに濡れちゃうんですから……<emoji=heart04>」"
translation = "「그렇다고요오? 회장님 곁에 있는 것만으로 제 보지, 금방 젖어버리니까요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ずりずり擦ってるだけじゃ物足りなかったです……会長さんとえっちするの、おま○こでおち○ちんゴシゴシするの、だぁい好きですっ……<emoji=heart04>」"
translation = "「쓱쓱 문지르기만 하는 건 감질났어요…… 회장님이랑 에치하는 거, 보지로 자지 쓱싹쓱싹하는 거, 느으으무 좋아요……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺の言葉責めをあっさり受け止めて、いじらしい言葉で反撃してくる。ますます俺の性欲はミウに掌握されていく。"
translation = "내 언어적 공세를 가볍게 받아넘기고는, 기특한 말로 반격해 온다. 점점 더 나의 성욕은 미우에게 장악되어 간다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、んぁ、あっ、あっ<emoji=heart04>\u3000男性が女性に思いきり体重をかけるえっちを、種付けプレス、って言うんですよね？」"
translation = "「하아, 응아, 아, 앗<emoji=heart04> 남성이 여성에게 마음껏 체중을 실어서 하는 에치를, 씨뿌리기 프레스, 라고 하죠?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ホントにどこでそんな言葉を……くぅっ！」"
translation = "「정말로 어디서 그런 말을…… 쿠윽!」"

[[dialogue]]
speaker = "unk"
original = "ミウの口から出た品性に欠ける言葉が股間に刺さる。"
translation = "미우의 입에서 나온 품위 없는 단어가 가랑이에 꽂힌다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「だからぁ、会長さんを堕とすために、いっぱいお勉強してますから<emoji=heart04>」"
translation = "「그러니까아, 회장님을 타락시키기 위해서, 공부 많이 하고 있으니까요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「こうやってぇ、んんっ<emoji=heart04>\u3000女性が跨って体重をかける体位はぁ……逆種付けプレスって言うんですかねぇ……？」"
translation = "「이렇게에, 응응<emoji=heart04> 여성이 올라타서 체중을 싣는 체위는아…… 역씨뿌리기 프레스라고 하는 걸까요오……?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「こんなに深く挿入れちゃってたら……おち○ちん抜けないですよねー？\u3000このまま中に出すしかないですよねー？」"
translation = "「이렇게 깊게 삽입해 버렸으면…… 자지 안 빠지겠죠ー? 이대로 안에 쌀 수밖에 없겠죠ー?」"

[[dialogue]]
speaker = "unk"
original = "俺の感じる部分を知り尽くしているミウは、ぱんっぱんっぱんっと、リズミカルにテンポ良く股間を打ち付ける。"
translation = "내가 느끼는 부위를 숙지하고 있는 미우는, 탁탁탁하며 리드미컬하고 템포 좋게 가랑이를 부딪쳐 온다."

[[dialogue]]
speaker = "unk"
original = "ぷるんぷるんと柔らかく揺れるおっぱいからも目を離せない。"
translation = "탱글탱글 부드럽게 흔들리는 가슴에서도 눈을 뗄 수 없다."

[[dialogue]]
speaker = "unk"
original = "全てはミウの計略であり、巧妙な罠。彼女にハマッてしまったが最後、もう抜け出せやしない。"
translation = "모든 것은 미우의 계략이자, 교묘한 덫. 그녀에게 빠져버린 이상, 이제 벗어날 수 없다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、会長さんの精液、い～っぱい搾り取っちゃいますっ……んんっ<emoji=heart04>\u3000このまま、子宮に出して、私をママにしちゃってくださいねっ<emoji=heart04>」"
translation = "「후후, 회장님의 정액, 가~득 짜내 버릴 거라구요…… 응응<emoji=heart04> 이대로, 자궁에 싸서, 나를 엄마로 만들어 주세요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "１往復毎にペニスが昂る。"
translation = "1왕복할 때마다 페니스가 고조된다."

[[dialogue]]
speaker = "unk"
original = "締まりの良すぎる膣肉に包まれ、ローションのようなとろっとろの愛液に促され、セックスを全身で愉しむミウに追い込まれる。"
translation = "너무 꽉 조이는 질 고기에 둘러싸여, 로션 같은 농밀한 애액의 촉진을 받으며, 섹스를 전신으로 즐기는 미우에게 몰린다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、あっ、あぅ、んっ、はぁ、んんんっ<emoji=heart04>\u3000きもちいっ、会長さんのおち○ちん、きもちいいところばっか擦れるぅっ……<emoji=heart04>」"
translation = "「하아, 아, 아우, 응, 하아, 응응응<emoji=heart04> 기분 좋아, 회장님의 자지, 기분 좋은 곳만 문질러져어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "睾丸で煮え滾っている精液を、一刻も早く解き放ちたい。でも、このままじゃ、ミウをろくに満足させられないまま、屈してしまう。"
translation = "고환에서 끓어오르고 있는 정액을 한시라도 빨리 방출하고 싶다. 하지만, 이대로는 미우를 제대로 만족시키지도 못한 채 굴복하고 만다."

[[dialogue]]
speaker = "unk"
original = "歯を食いしばりながら、性欲と理性のせめぎ合いを堪えた。"
translation = "이를 악물면서 성욕과 이성의 갈등을 견뎠다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、んぁっ、はっ、あれ？\u3000あれれ？\u3000どうしたんですか？\u3000歯を食いしばっちゃって……辛そうですね……<emoji=heart04>」"
translation = "「하아, 응아앗, 하, 어라? 어라라? 왜 그러세요? 이를 악물고…… 괴로워 보이네요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふっ、もう余裕なさそうですね。イッちゃいそうです？\u3000このままじゃ、負けちゃいますよー？\u3000おち○ちんでわからせてくれるんじゃなかったんですか？」"
translation = "「후후흣, 이제 여유가 없어 보이네요. 싸 버릴 것 같아요? 이대로는 져 버린다구요ー? 자지로 혼내주기로 한 거 아니었나요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「先にイッたら、ダ・メですよ<emoji=heart04>\u3000もうちょっと我慢してくださいねっ、一緒にきもちよくなりましょうねっ<emoji=heart04>」"
translation = "「먼저 싸면, 안·돼요<emoji=heart04> 조금만 더 참아 주세요, 같이 기분 좋아져요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「なら、もう少し加減っ……んくっ、うぅぅっ！」"
translation = "「그러면, 조금만 힘을…… 윽, 우우욱!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あははっ、年下の彼女に『手加減してー』なんてお願いしちゃうなんて、幻滅しちゃいますよ<emoji=heart04>」"
translation = "「아하핫, 연하의 여자친구한테 『살살해줘ー』라니 부탁하다니, 환멸해 버릴 거예요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "何と言われようが、ミウの与える快感の虜に堕ちてしまっている。脚を抑えて圧し掛かられているから、身動きが取れない。"
translation = "무슨 말을 듣든, 미우가 주는 쾌감의 포로로 떨어져 있다. 다리를 눌린 채 짓눌려 있어서 꼼짝도 할 수 없다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ぅんぐぅうぅっ！？\u3000それヤバッ、ヤバいって！」"
translation = "「으응구으윽!? 그거 위험, 위험하다고!」"

[[dialogue]]
speaker = "unk"
original = "手加減どころか、更にピストンの勢いが増す。"
translation = "봐주기는커녕, 더욱 피스톤의 기세가 더해진다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んあっ！？\u3000あはぁんっ、おち○ちん膨らんでっ、おま○こいっぱいになっちゃってますっ<emoji=heart04>」"
translation = "「응앗!? 아하앙, 자지 부풀어 올라서, 보지 꽉 차 버렸어요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "俺の膝に両手を添えて、杖のように立ち上がっては、一気に腰を落とす。"
translation = "내 무릎에 양손을 얹고, 지팡이처럼 일어서서는 한 번에 허리를 내리찍는다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あんっ<emoji=heart04>\u3000んぁ、はぁ、はっ、んぁあぁぁっ<emoji=heart04>\u3000きもちいっ、おま○こっ、おま○こきもちいいぃぃっ<emoji=heart04>」"
translation = "「앙<emoji=heart04> 응아, 하아, 하, 응아아아앗<emoji=heart04> 기분 좋아, 보지, 보지 기분 좋아아아<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぁっ<emoji=heart04>\u3000おま○こっ、感じすぎちゃいますっ<emoji=heart04>\u3000はぁんっ<emoji=heart04>\u3000私のおま○こと、会長さんのおち○ちん、相性ぴったりですよねっ<emoji=heart04>」"
translation = "「응앗<emoji=heart04> 보지, 너무 느껴버려요<emoji=heart04> 하앙<emoji=heart04> 내 보지랑, 회장님 자지, 궁합 딱 맞죠<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "幾度も重ねたセックスで、すっかり馴染んで、ぴったりになったという方が正しいだろう。"
translation = "수없이 되풀이한 섹스로 완전히 익숙해져 딱 맞게 되었다고 하는 편이 올바를 것이다."

[[dialogue]]
speaker = "unk"
original = "俺の性癖も、肉体も。自分でも知らない間に、ミウのプランニングによって作り変えられたといっても過言じゃない。"
translation = "나의 성벽도, 육체도. 스스로도 모르는 사이에 미우의 플래닝에 의해 개조되었다고 해도 과언이 아니다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「うぅんっ、どうですかぁ……？\u3000イッちゃいそうですっ？\u3000びゅーびゅーびゅーって、中出しできそうですかぁ……<emoji=heart04>」"
translation = "「으응, 어떠세요……? 싸 버릴 것 같아요? 뷰뷰뷰하고 안에 쌀 수 있을 것 같아요……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「く、あっ、だ、だめなのにっ……！」"
translation = "「크, 아, 안, 안 되는데……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「中出ししちゃダメってわかってても、我慢なんてできないですよねっ<emoji=heart04>\u3000ぅんっ、ふっ、うぅうぅんっ<emoji=heart04>」"
translation = "「안에 싸면 안 된다는 걸 알고 있어도, 참는 건 못 하겠죠<emoji=heart04> 으응, 후, 으으응<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、あっ、いっしょにイキましょうねっ<emoji=heart04>\u3000ぜったいっ、ぜったいにいっしょですよっ？\u3000いっしょにイッてくれなきゃダメですからねっ<emoji=heart04>」"
translation = "「하아, 아, 같이 가요<emoji=heart04> 절대, 절대로 같이예요? 같이 안 가주면 안 되니까요<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぁ、はっ、はぁん<emoji=heart04>\u3000あっあぁぁっ！？\u3000はっ、はぅんっ<emoji=heart04>\u3000おま○こっびりびり痺れちゃいますっ<emoji=heart04>」"
translation = "「응아, 하, 하앙<emoji=heart04> 아 아아앗!? 하, 하운<emoji=heart04> 보지찌릿찌릿 저려버려요<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "ミウの腰と膝がガクガク震え、絶頂の接近を訴えつつも、精を搾り取ろうと強烈な膣圧でペニスを締め付け、俺を絶頂に追い込む。"
translation = "미우의 허리와 무릎이 덜덜 떨리며 절정이 가까워졌음을 호소하면서도, 정액을 짜내려고 강력한 질압으로 페니스를 조여 오며 나를 절정으로 몰아넣는다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「くぁ、あっ、あっ……もう、無理ぃっ……！」"
translation = "「쿠아, 아, 아…… 이제, 한계야……!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「いいですよっ、許可しますっ<emoji=heart04>\u3000出して、出してっ<emoji=heart04>\u3000濃ゆぅい精液っ、子宮にっ、いっぱいください、くだひゃいっ<emoji=heart04>」"
translation = "「좋아요, 허가할게요<emoji=heart04> 싸줘요, 싸줘요<emoji=heart04> 진한 정액, 자궁에, 가득 주세요, 구세효<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はっ、あぁんっ<emoji=heart04>\u3000私も、もうらめれすっ、イキそっ、イク、イクッ、イクイクッ<emoji=heart04>\u3000おま○こっ、おま○こイッちゃいまひゅっ<emoji=heart04>」"
translation = "「하, 아앙<emoji=heart04> 나도, 이제 안 댸요, 갈 것 같, 가, 간다, 가가가<emoji=heart04> 보지, 보지 가버려혀<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あっ、はぁ、んぁあぁぁっ！？\u3000イクッ、イクイグイクッ──イッッちゃぅううぅううぅぅぅぅぅぅっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「앗, 하아, 응아아아앗!? 간다, 간다간간다── 가버려어어어어어어어어<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「んぅひっ！？\u3000んぁはっ、はぁっ、んんんーっ<emoji=heart04>\u3000アッツぃの、出てっ、んぃっ<emoji=heart04>\u3000ふっ、んぅっ、はぁんっ<emoji=heart04>」"
translation = "「응으힛!? 응아하, 하아, 응응응ー읏<emoji=heart04> 뜨거운 거, 나와서, 응이<emoji=heart04> 후, 응읏, 하앙<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「んぅっ！？\u3000ふっ、ぅぐっ、んんぅっ！！？」"
translation = "「응읏!? 후, 으극, 응응읏!!?」"

[[dialogue]]
speaker = "unk"
original = "噴き上がった白濁の噴水を、ミウの子宮はごきゅごきゅと美味しそうに飲み干していく。"
translation = "뿜어져 나온 백탁의 분수를, 미우의 자궁은 꿀꺽꿀꺽 맛있게 꿀컥 마셔 간다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あっ、はっ、ふぁっ<emoji=heart04>\u3000はっ、はひっ、ふぅうぅんっ……<emoji=heart04>\u3000せぇぇき、しゅごぉい……たっぷりれふぅ……<emoji=heart04>」"
translation = "「앗, 하, 화앗<emoji=heart04> 하, 하히, 후우웅……<emoji=heart04> 져엥, 대다내…… 가득이에효……<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はーっ、はぁーっ、はぁーっ……！\u3000まだおち○ちん動いて、まふ……そんなに、私の、おま○こ……きもちよかったんですか……？\u3000えへへ……<emoji=heart04>」"
translation = "「하ー, 하아ー, 하아ー……! 아직 자지 움직이고 이써요…… 그렇게, 내, 보지…… 기분 좋았나요……? 에헤헤……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はぁっ！\u3000はっ、はっ！\u3000まだ、気持ちいいの続い、てるっ……ぅぐっ！？」"
translation = "「하앗! 하, 하! 아직, 기분 좋은 거 계속, 되고 있어…… 으극!?」"

[[dialogue]]
speaker = "unk"
original = "痙攣しているミウの膣ヒダは、精液が出尽くすまで貪欲にペニスを愛撫し続ける。"
translation = "경련하고 있는 미우의 질 주름은, 정액이 다 나올 때까지 탐욕스럽게 페니스를 애무하듯 조여 대고 있다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「いいんですよー、そのまま私の膣内にいてくださいね……おち○ちん収まるまでずーっと、ずーっと……<emoji=heart04>」"
translation = "「괜찮아요ー, 그대로 내 질 안에 있어 주세요…… 자지 가라앉을 때까지 꼬옥, 꼬옥……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "しばらくの間、ミウの中に留まり──"
translation = "한동안, 미우의 안에 머물다가──"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふぅ、ふぅん……んっ、はぁぁ……<emoji=heart04>\u3000おち○ちん、おとなしく、なって、きましたね……？」"
translation = "「후우, 후응……응, 하아아……<emoji=heart04> 자지, 점잖게, 되어, 가네요……?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「あんっ……<emoji=heart04>\u3000抜けちゃうと、寂しいです……」"
translation = "「앙……<emoji=heart04> 빠져버리면, 허전해요……」"

[[dialogue]]
speaker = "unk"
original = "ミウが腰を浮かすと、解放されたペニスが這い出るように抜けた。"
translation = "미우가 허리를 들자, 해방된 음경이 기어나오듯 빠졌다."

[[dialogue]]
speaker = "unk"
original = "ペニスの直径サイズにぽっかりと開いた膣穴の奥からは、ゲル状の白濁液がどろりと溢れ出る。"
translation = "음경의 직경 사이즈로 뻥 뚫린 질 구멍의 깊은 곳에서는, 겔 상태의 백탁액이 걸쭉하게 흘러넘친다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「はぁ、はっ……ぁんっ、零しちゃもったいないです……せっかくいっぱい出してもらったのに……」"
translation = "「하아, 하……앙, 흘려버리면 아까워요……모처럼 많이 내보내 주셨는데……」"

[[dialogue]]
speaker = "unk"
original = "摘めるほどに濃厚な白濁液を持ち上げては掌に乗せて、粘土のようにこねて弄ぶ。"
translation = "집을 수 있을 정도로 농후한 백탁액을 올려서는 손바닥에 얹고, 찰흙처럼 주무르며 만작거린다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「これが会長さんと私の愛し合った証、ですね<emoji=heart04>」"
translation = "「이것이 회장님과 제가 서로 사랑한 증거,네요<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「はぁ、はっ……きもち、よかった……！\u3000ありがと、ミウ……」"
translation = "「하아, 하……기분, 좋았어……! 고마워, 미우……」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「どういたしまして──あれ？\u3000会長さん、もしかして、もうおしまいだと思ってます？」"
translation = "「천만에요──어라? 회장님, 혹시, 이제 끝이라고 생각하세요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「……え？\u3000だって俺もミウも最後まで──」"
translation = "「……어? 그치만 나도 미우도 끝까지──」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「まだまだし足りないですよぉ……えっちしたがってるおま○こ、放っておかれちゃうんですか？」"
translation = "「아직 한참 부족해요……야한 짓 하고 싶어 하는 보지, 방치해 두실 건가요?」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「たった１回で降参しちゃうなんて、このままだとずーっと私に負けっぱなしになっちゃいますよ？」"
translation = "「겨우 1번으로 항복해 버리다니, 이대로라면 내~내 저한테 지기만 할 텐데요?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「一旦、休憩してから──って、あれ！？」"
translation = "「일단, 휴식하고 나서──라니, 어라!?」"

[[dialogue]]
speaker = "unk"
original = "体は疲れているはずなのに、ペニスはミウの煽りに負けるものかと立ち上がる。"
translation = "몸은 피곤할 텐데, 음경은 미우의 도발에 질쏘냐 하며 일어선다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、会長さんのおち○ちん、まだカチカチのままじゃないですか<emoji=heart04>」"
translation = "「후후, 회장님의 자지, 아직 푹푹 선 채잖아<emoji=heart04>」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「『おま○こに、もう１回出したいよー出したいよー』って言ってますね。かぁわいい<emoji=heart04>」"
translation = "「『보지에, 한 번 더 싸고 싶어- 싸고 싶어-』라고 말하고 있네요. 귀~여워<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「い、いや、その……あれぇ……？」"
translation = "「아, 아니, 그……어라……?」"

[[dialogue]]
speaker = "unk"
original = "ミウの言う通り、ペニスは痛いくらいに勃起している。ペニスだけは元気なのに、体はすっかり脱力していて動けない。"
translation = "미우의 말대로, 음경은 아플 정도로 발기해 있다. 음경만은 기운찬데, 몸은 완전히 탈력해 있어서 움직일 수 없다."

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「ふふ、お股開きっぱなしで逃げないってことはぁ……このまま愉しんじゃってもいいですよねー？」"
translation = "「후후, 가랑이를 벌린 채로 도망치지 않는다는 건……이대로 즐겨버려도 괜찮은 거죠-?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「よ、よくないっ！\u3000動けないだけだからっ！」"
translation = "「안, 안 괜찮아! 움직이지 못할 뿐이니까!」"

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「私は会長さんの彼女なんですから、遠慮しなくていいんですよ。おち○ちんが満足するまで、何度でも<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker_original = "ミウ"
speaker_translation = "미우"
original = "「おま○こ、まだまだ欲しがっちゃってますから……もっともっと私を愛してくださいね<emoji=heart04>」"
translation = "「보지, 아직 한참 원하고 있으니까……좀 더 좀 더 저를 사랑해 주세요<emoji=heart04>」"

