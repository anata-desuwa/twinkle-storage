[[dialogue]]
speaker = "unk"
original = "第２話,召しませ、爆熱四川料理,P"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「へへー、会長さんとアキバデートだー<emoji=heart04>\u3000何回来てもいいですよね、アキバ！\u3000空気が肌に馴染むー」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "なんで、その格好……？"
translation = ""

[[dialogue]]
speaker = "unk"
original = "デートはいいんだけど"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「アキバならこーゆーコンセプトカフェもありますし！\u3000悪目立ちしないなら、着るチャンスかなって！」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「それに今日のお店は、もぐログ評価☆４．５の中華料理ですから！\u3000行く場所に合わせたコーディネートって大事じゃないですか？」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んー、地図によると、たぶんこの辺……穴場みたいだから……あっ、ここ！\u3000ここの四川料理です！」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「めっちゃ辛そうですけど、あたし、濃いのと辛いのは得意なんで！\u3000任せてください！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヒマワリに背中を押され、覚悟を決めて店に踏み入る。"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うわー！\u3000お店に入っただけで本格的ないい匂い！\u3000食欲が刺激されますねー！\u3000うーん、ど・れ・に・し・よ・う・か・なー。会長さんは何にします？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ほどほどな辛さのヤツで……"
translation = ""

[[dialogue]]
speaker = "unk"
original = "ヒマワリのお任せで"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ほどほどですねー。すみませーん、注文いいですかー？」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「一番人気の炎の麻婆豆腐とー、オススメの<ruby>爆熱水煮牛肉<rt>ばくねつシュイジューニューロー</rt></ruby>とー……<ruby>赤龍毛血旺<rt>せきりゅうマオシュエワン</rt></ruby>っていうの、お願いしまーす」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "唐辛子マーク５つ付いてるんだけど！？"
translation = ""

[[dialogue]]
speaker = "unk"
original = "全部めちゃくちゃ辛そうなんだけど！？"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「だって、ここに来たからには、辛いのを食べなきゃ嘘じゃないですか」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ちゃんとあたしが残さず食べますから、心配しないでくださいっ！\u3000ねっ<emoji=heart04>」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "そして、ぐつぐつとマグマのような音を立てて、頼んだ料理たちが到着する。"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わぉ、アッツアツで美味しそー！\u3000結構量がありますねー！」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ほら、アツアツの内に食べましょ。いっただきまーす！\u3000あむっ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "俺たちは蓮華にすくった麻婆豆腐を口へと運ぶ。"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わ！\u3000超本格的な味！\u3000山椒が効いてて、ピリッとしてめちゃ美味し──」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "本当だ！\u3000すごく美味し──"
translation = ""

[[dialogue]]
speaker = "unk"
original = "あれ？\u3000思ったほどじゃ"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「……………………」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "！！？！？！！？"
translation = ""

[[dialogue]]
speaker = "unk"
original = "……………………"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ッッッ～～～～～～～～！！！？！？！！？」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「時間差！\u3000時間差でキたぁっ！\u3000かっ、辛っ、辛い辛い辛い辛い辛い辛～～～いッッッ！？！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "喉が焼けるーーっ！"
translation = ""

[[dialogue]]
speaker = "unk"
original = "舌が燃えるーーっ！"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「お水っ！\u3000お水くだひゃいっ！」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ごくごくごくごくごく……んぴゃーーーっ！？\u3000お水飲んだらもっと辛くなったーーーーっ！！？」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「な、なんで、あっちのおねーひゃん、おんなじ料理、涼ひい顔で食べてんのー！？」"
translation = ""

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「はむ、はふはふはふ。やはりここの中華は絶品だ」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "セドナさん！？"
translation = ""

[[dialogue]]
speaker = "unk"
original = "セドナさんは魔女の組織であるネビュラの司令官だ。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "辛い物が好きだということは知っていたのだが……"
translation = ""

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「ん？\u3000貴様たちは……このような所で会うなど奇遇だな。この店にはよく来るのか？」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はじめてれふ……」"
translation = ""

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「そうか。流星学園附属校の生徒だと見受けるが……この店を選ぶとはセンスがある。どうだ？\u3000刺激的で美味いだろう」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「お、おいひーれふけどぉ……」"
translation = ""

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「なかなか良いチョイスだが、火鍋もオススメだぞ。ああ、店主、追い唐辛子をいただけるか？」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「まだ辛くするんですかー！？」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "セドナさんの食べっぷりに呆気に取られながらも、俺たちは頼んだ料理を汗かきかき食べ続ける。"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うぅ……おいひい……おいひいけど、やっぱ辛ぁい……！」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「でもでも、ご飯を残すのは絶対ダメれふ！\u3000会長ひゃんは無理しないでくらひゃい！」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしが誘って、あたしが頼んだんれふから……最後まで責任取って食べるんれふ……！」"
translation = ""

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「ふむ……その責任感はとても素晴らしいが、無茶な背伸びをするものではない。どうしても無理そうならば私が手伝うが……どうだ？」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「セドナひゃん……！\u3000お……お願いしまひゅ……！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "救世主の登場により、俺たちの胃腸は守られたのだった。"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ごちひょうさまれひたー……うぅぅ、辛いのが得意とか言ってたの恥ずかしい……あたしなんて井戸の中の蛙どころか、オタマジャクシでした……反省です」"
translation = ""

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「でも、あんなに辛い料理をパクパクと涼しい顔で食べられるなんて……セドナさん、すごかったですね……！」"
translation = ""

[[dialogue]]
speaker = "unk"
original = "『焔の魔女』の二つ名は伊達じゃない"
translation = ""

[[dialogue]]
speaker = "unk"
original = "あの人は激辛に強いから……"
translation = "그 사람은 매운 걸 잘 먹으니까……"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「オトナの女になれば、セドナさんみたいに激辛料理も平気で食べられるようになるのかな……」"
translation = "「어른 여자가 되면, 세도나 씨처럼 매운 요리도 아무렇지 않게 먹을 수 있게 되는 걸까……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「よし、次の目標を決めました！\u3000あたし、激辛も平気で食べられる格好いい女になります！\u3000明日から特訓だー！」"
translation = "「좋아, 다음 목표를 정했어요! 나, 매운 것도 아무렇지 않게 먹을 수 있는 멋진 여자가 되겠어요! 내일부터 특훈이다―!」"

[[dialogue]]
speaker = "unk"
original = "こうしてセナリィに続いて、ヒマワリの憧れる女性像が増えてしまったわけだが。"
translation = ""

[[dialogue]]
speaker = "unk"
original = "影響を受けやすくて惚れっぽいヒマワリの方向性は、ちょっと正した方がいいのかもしれない。"
translation = "영향을 받기 쉽고 금방 반하는 히마와리의 방향성은, 조금 바로잡아 주는 편이 좋을지도 모른다."

