[[dialogue]]
speaker = "unk"
original = "第２話,召しませ、爆熱四川料理,P"
translation = "제2화, 드시지요, 폭열 사천요리, P"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「へへー、会長さんとアキバデートだー<emoji=heart04>\u3000何回来てもいいですよね、アキバ！\u3000空気が肌に馴染むー」"
translation = "「헤헤─ 회장님이랑 아키바 데이트다─<emoji=heart04> 몇 번을 와도 좋네요, 아키바! 공기가 피부에 착 감겨요─」"

[[dialogue]]
speaker = "unk"
original = "なんで、その格好……？"
translation = "왜 그런 차림이야……?"

[[dialogue]]
speaker = "unk"
original = "デートはいいんだけど"
translation = "데이트는 좋은데"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「アキバならこーゆーコンセプトカフェもありますし！\u3000悪目立ちしないなら、着るチャンスかなって！」"
translation = "「아키바라면 이런 컨셉 카페도 있고요! 눈총받지 않는다면 입어볼 기회일까 해서요!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「それに今日のお店は、もぐログ評価☆４．５の中華料理ですから！\u3000行く場所に合わせたコーディネートって大事じゃないですか？」"
translation = "「게다가 오늘 갈 가게는 모그로그 평점 ☆4.5인 중화요리점이니까요! 가는 장소에 맞춘 코디네이트라는 건 중요하잖아요?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「んー、地図によると、たぶんこの辺……穴場みたいだから……あっ、ここ！\u3000ここの四川料理です！」"
translation = "「음─ 지도로 볼 때 아마 이쯤…… 숨은 맛집 같으니까…… 아, 여기! 여기 사천요리점이에요!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「めっちゃ辛そうですけど、あたし、濃いのと辛いのは得意なんで！\u3000任せてください！」"
translation = "「엄청 매워 보이지만, 저 매운 거랑 간 센 거 잘 먹으니까요! 맡겨만 주세요!」"

[[dialogue]]
speaker = "unk"
original = "ヒマワリに背中を押され、覚悟を決めて店に踏み入る。"
translation = "히마와리가 등 뒤를 밀어주어, 각오를 다지고 가게 안으로 들어선다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うわー！\u3000お店に入っただけで本格的ないい匂い！\u3000食欲が刺激されますねー！\u3000うーん、ど・れ・に・し・よ・う・か・なー。会長さんは何にします？」"
translation = "「우와─! 가게에 들어선 것만으로도 본격적인 좋은 냄새! 식욕이 자극되네요─! 음─ 무・엇・으・로・할・까・나─. 회장님은 뭘로 하실래요?」"

[[dialogue]]
speaker = "unk"
original = "ほどほどな辛さのヤツで……"
translation = "적당히 매운 걸로……"

[[dialogue]]
speaker = "unk"
original = "ヒマワリのお任せで"
translation = "히마와리가 알아서 골라줘"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ほどほどですねー。すみませーん、注文いいですかー？」"
translation = "「적당히네요─. 저기요─ 주문 좀 할게요─」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「一番人気の炎の麻婆豆腐とー、オススメの<ruby>爆熱水煮牛肉<rt>ばくねつシュイジューニューロー</rt></ruby>とー……<ruby>赤龍毛血旺<rt>せきりゅうマオシュエワン</rt></ruby>っていうの、お願いしまーす」"
translation = "「가장 인기 있는 화염 마보두부랑ー, 추천하는 <ruby>폭열수주육<rt>바쿠네츠 슈이지유 뉴로</rt></ruby>랑ー……<ruby>적룡모혈왕<rt>세키류 마오슈에완</rt></ruby>이라는 거, 부탁해요ー」"

[[dialogue]]
speaker = "unk"
original = "唐辛子マーク５つ付いてるんだけど！？"
translation = "고추 표시가 5개나 붙어있는데!?"

[[dialogue]]
speaker = "unk"
original = "全部めちゃくちゃ辛そうなんだけど！？"
translation = "전부 엄청나게 매워 보이는데!?"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「だって、ここに来たからには、辛いのを食べなきゃ嘘じゃないですか」"
translation = "「그치만 여기까지 온 이상 매운 걸 먹지 않으면 거짓말이잖아요」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ちゃんとあたしが残さず食べますから、心配しないでくださいっ！\u3000ねっ<emoji=heart04>」"
translation = "「제가 남기지 않고 다 먹을 테니까 걱정하지 마세요! 네?<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そして、ぐつぐつとマグマのような音を立てて、頼んだ料理たちが到着する。"
translation = "그리고 보글보글 마그마 같은 소리를 내며 주문한 요리들이 도착한다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わぉ、アッツアツで美味しそー！\u3000結構量がありますねー！」"
translation = "「와오, 뜨끈뜨끈해서 맛있겠다─! 양이 제법 되네요─!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ほら、アツアツの内に食べましょ。いっただきまーす！\u3000あむっ」"
translation = "「자, 뜨거울 때 먹어요. 잘 먹겠습니다─! 얌」"

[[dialogue]]
speaker = "unk"
original = "俺たちは蓮華にすくった麻婆豆腐を口へと運ぶ。"
translation = "우리들은 숟가락으로 뜬 마파두부를 입으로 가져간다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「わ！\u3000超本格的な味！\u3000山椒が効いてて、ピリッとしてめちゃ美味し──」"
translation = "「와! 엄청 본격적인 맛! 산초가 잘 들어있어서 맵싸하니 엄청 맛있──」"

[[dialogue]]
speaker = "unk"
original = "本当だ！\u3000すごく美味し──"
translation = "정말이다! 너무 맛있──"

[[dialogue]]
speaker = "unk"
original = "あれ？\u3000思ったほどじゃ"
translation = "어라? 생각했던 것만큼은"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「……………………」"
translation = "「……………………」"

[[dialogue]]
speaker = "unk"
original = "！！？！？！！？"
translation = "!!?!?!!?"

[[dialogue]]
speaker = "unk"
original = "……………………"
translation = "……………………"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ッッッ～～～～～～～～！！！？！？！！？」"
translation = "「읏읏읏~~~~~~~~~~~~~~~~~!!!?!?!!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「時間差！\u3000時間差でキたぁっ！\u3000かっ、辛っ、辛い辛い辛い辛い辛い辛～～～いッッッ！？！」"
translation = "「시차! 시간차로 왔다아앗! 매, 매워, 매워매워매워매워 매~~~~워읏읏읏!!?」"

[[dialogue]]
speaker = "unk"
original = "喉が焼けるーーっ！"
translation = "목구멍이 탄다──앗!"

[[dialogue]]
speaker = "unk"
original = "舌が燃えるーーっ！"
translation = "혀가 타들어 간다──앗!"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「お水っ！\u3000お水くだひゃいっ！」"
translation = "「물! 물 댸듀셰요!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ごくごくごくごくごく……んぴゃーーーっ！？\u3000お水飲んだらもっと辛くなったーーーーっ！！？」"
translation = "「꿀꺽꿀꺽꿀꺽꿀꺽…… 앰뺘───앗!? 물 마시니까 더 매워졌다─────앗!!?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「な、なんで、あっちのおねーひゃん、おんなじ料理、涼ひい顔で食べてんのー！？」"
translation = "「왜, 왜 저쪽 언니눈 같은 요리 태연한 얼굴로 먹고 있눈 거야─!?」"

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「はむ、はふはふはふ。やはりここの中華は絶品だ」"
translation = "「하무, 하후하후하후. 역시 여기 중화요리는 으뜸이군」"

[[dialogue]]
speaker = "unk"
original = "セドナさん！？"
translation = "세도나 씨!?"

[[dialogue]]
speaker = "unk"
original = "セドナさんは魔女の組織であるネビュラの司令官だ。"
translation = "세도나 씨는 마녀 조직인 네뷸라의 사령관이다."

[[dialogue]]
speaker = "unk"
original = "辛い物が好きだということは知っていたのだが……"
translation = "매운 것을 좋아한다는 건 알고 있었지만……"

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「ん？\u3000貴様たちは……このような所で会うなど奇遇だな。この店にはよく来るのか？」"
translation = "「음? 너희는…… 이런 곳에서 만나다니 기이한 인연이군. 이 가게에는 자주 오나?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「はじめてれふ……」"
translation = "「처음 와봐요……」"

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「そうか。流星学園附属校の生徒だと見受けるが……この店を選ぶとはセンスがある。どうだ？\u3000刺激的で美味いだろう」"
translation = "「그런가. 유성학원 부속교의 학생으로 보이는데…… 이 가게를 고르다니 안목이 있군. 어떠냐? 자극적이고 맛있지」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「お、おいひーれふけどぉ……」"
translation = "「마, 맛있기는 한데요……」"

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「なかなか良いチョイスだが、火鍋もオススメだぞ。ああ、店主、追い唐辛子をいただけるか？」"
translation = "「꽤 괜찮은 선택이지만, 훠궈도 추천한다네. 아아, 점주, 고춧가루를 더 받을 수 있겠나?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「まだ辛くするんですかー！？」"
translation = "「열매 매워지는데요ー!?」"

[[dialogue]]
speaker = "unk"
original = "セドナさんの食べっぷりに呆気に取られながらも、俺たちは頼んだ料理を汗かきかき食べ続ける。"
translation = "세도나 씨의 엄청난 먹성에 어리둥절해하면서도, 우리들은 주문한 요리를 땀을 뻘뻘 흘리며 계속 먹었다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「うぅ……おいひい……おいひいけど、やっぱ辛ぁい……！」"
translation = "「우으…… 마시써…… 마시찌만, 역시 매우어어……!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「でもでも、ご飯を残すのは絶対ダメれふ！\u3000会長ひゃんは無理しないでくらひゃい！」"
translation = "「하지만 하지만, 밥을 남기는 건 절대 안 돼흐! 회장향은 무리하지 마시하요!」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「あたしが誘って、あたしが頼んだんれふから……最後まで責任取って食べるんれふ……！」"
translation = "「내가 가자고 했고, 내가 시킨 거라흐…… 끝까지 책임지고 먹는 거라흐……!」"

[[dialogue]]
speaker_original = "セドナ"
speaker_translation = "세드나"
original = "「ふむ……その責任感はとても素晴らしいが、無茶な背伸びをするものではない。どうしても無理そうならば私が手伝うが……どうだ？」"
translation = "「흠…… 그 책임감은 아주 훌륭하다만, 무리하게 허세를 부릴 건 없다. 아무래도 무리일 것 같다면 내가 도와주겠다만…… 어떠냐?」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「セドナひゃん……！\u3000お……お願いしまひゅ……！」"
translation = "「세도나향……! 부…… 부탁드려휴……!」"

[[dialogue]]
speaker = "unk"
original = "救世主の登場により、俺たちの胃腸は守られたのだった。"
translation = "구세주의 등장으로 우리들의 위장은 지켜진 것이었다."

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「ごちひょうさまれひたー……うぅぅ、辛いのが得意とか言ってたの恥ずかしい……あたしなんて井戸の中の蛙どころか、オタマジャクシでした……反省です」"
translation = "「잘 먹었습니하…… 우으으, 매운 거 잘 먹는다고 말했던 게 창피해…… 나 따위는 우물 안 개구리는커녕, 올챙이였어요…… 반성입니다」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「でも、あんなに辛い料理をパクパクと涼しい顔で食べられるなんて……セドナさん、すごかったですね……！」"
translation = "「하지만, 그렇게 매운 요리를 덥석덥석 태연한 얼굴로 먹을 수 있다니…… 세도나 씨, 대단했죠……!」"

[[dialogue]]
speaker = "unk"
original = "『焔の魔女』の二つ名は伊達じゃない"
translation = "『염의 마녀』라는 별명은 허세가 아니었다."

[[dialogue]]
speaker = "unk"
original = "あの人は激辛に強いから……"
translation = "그 사람은 매운 걸 잘 먹으니까……"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「オトナの女になれば、セドナさんみたいに激辛料理も平気で食べられるようになるのかな……」"
translation = "「어른 여자가 되면, 세도나 씨처럼 매운 요리도 아무렇지 않게 먹을 수 있게 되는 걸까……」"

[[dialogue]]
speaker_original = "ヒマワリ"
speaker_translation = "히마와리"
original = "「よし、次の目標を決めました！\u3000あたし、激辛も平気で食べられる格好いい女になります！\u3000明日から特訓だー！」"
translation = "「좋아, 다음 목표를 정했어요! 나, 매운 것도 아무렇지 않게 먹을 수 있는 멋진 여자가 되겠어요! 내일부터 특훈이다―!」"

[[dialogue]]
speaker = "unk"
original = "こうしてセナリィに続いて、ヒマワリの憧れる女性像が増えてしまったわけだが。"
translation = "이렇게 세나리에 이어, 히마와리가 동경하는 여성상이 늘어나 버린 셈이지만."

[[dialogue]]
speaker = "unk"
original = "影響を受けやすくて惚れっぽいヒマワリの方向性は、ちょっと正した方がいいのかもしれない。"
translation = "영향을 받기 쉽고 금방 반하는 히마와리의 방향성은, 조금 바로잡아 주는 편이 좋을지도 모른다."

