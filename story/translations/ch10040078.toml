[[dialogue]]
speaker = "unk"
original = "とある週末のことだった。"
translation = "어느 주말의 일이었다."

[[dialogue]]
speaker = "unk"
original = "恋人のアポロを自宅に招いて一緒に遊ぶのが、ここ最近の定番になっていた。"
translation = "연인인 아폴로를 집으로 초대해 함께 노는 것이, 최근 들어 정례가 되어 있었다."

[[dialogue]]
speaker = "unk"
original = "この日も遅くまでアポロと過ごして……そこまでは記憶している。"
translation = "이날도 늦게까지 아폴로와 보내고…… 거기까지는 기억하고 있다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ううっ……なんだ、この感触……」"
translation = "「으으…… 뭐야, 이 감촉은……」"

[[dialogue]]
speaker = "unk"
original = "股間が熱い。朝勃ちとは少し異なる、ペニスの膨張感。"
translation = "가랑이가 뜨겁다. 아침 발기와는 조금 다른, 페니스의 팽창감."

[[dialogue]]
speaker = "unk"
original = "そして俺の気のせいでなければ、クチュクチュと音がしていた。"
translation = "그리고 내 기분 탓이 아니라면, 쿠츄쿠츄 소리가 나고 있었다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んぁ……ふぁっ……はぁっ……んんっ……」"
translation = "「응아…… 화아…… 하아…… 응응……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「あ、アポロ！？\u3000何してるんだ？」"
translation = "「아, 아폴로!? 무슨 짓을 하는 거야?」"

[[dialogue]]
speaker = "unk"
original = "目を開けると、メイドになったアポロが俺の上に馬乗りになっていた。"
translation = "눈을 뜨자, 메이드 복장을 한 아폴로가 내 위에 올라타 있었다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あ、起きちゃった……おはよー、魔王<emoji=heart04>」"
translation = "「아, 깨어났네…… 안녕, 마왕<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「何してるのかって……見てわかるだろ……んぅ……素股してるんだ<emoji=heart04>」"
translation = "「무슨 짓을 하냐니…… 보면 알잖아…… 응으…… 스마타하고 있는 거라고<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "まさに素股だった。俺のペニスはむき出しになっていて、アポロの割れ目にクチュクチュされている。"
translation = "그야말로 스마타였다. 내 페니스는 노출되어 있었고, 아폴로의 갈라진 틈에 쿠츄쿠츄 문질러지고 있다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「えへへ～、寝起きから気持ちいいだろ～<emoji=heart04>\u3000はぁ……う……メイドさんはこうやってご主人様を起こすんだってさ……」"
translation = "「에헤헤～, 잠에서 깨자마자 기분 좋지～<emoji=heart04> 하아…… 으…… 메이드 씨는 이렇게 주인님을 깨우는 거래……」"

[[dialogue]]
speaker = "unk"
original = "とんだ誤情報だ。でもアポロのぷにまんでシコられて、俺の理性を快感が上書きしようとしている。"
translation = "터무니없는 잘못된 정보다. 하지만 아폴로의 부드러운 보지로 자위당해서, 내 이성을 쾌감이 새로 고쳐쓰려 하고 있다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ご主人様の下半身のお世話をするのも……んんっ……メイドの大事な仕事のうち……なんだって……」"
translation = "「주인님의 하반신을 수발하는 것도…… 응응…… 메이드의 중요한 일 중 하나…… 라나 봐……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「いったい誰に聞いたんだ？」"
translation = "「도대체 누구한테 들은 거야?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「忘れちゃった。でも……魔王は喜んでくれてるみたいだな……<emoji=heart04>」"
translation = "「잊어버렸어. 하지만…… 마왕은 기뻐해 주는 것 같네……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロは嬉しそうに微笑みながら、俺のペニスを割れ目で愛撫していく。"
translation = "아폴로는 기쁜 듯 미소 지으며, 내 페니스를 갈라진 틈으로 애무해 간다."

[[dialogue]]
speaker = "unk"
original = "素股を始めてからどのくらい経過したのかわからないが、パンパンに張り詰めた肉棒は既にアポロの愛液でべっとりだ。"
translation = "스마타를 시작하고 어느 정도 시간이 지났는지 모르겠지만, 팽팽하게 부풀어 오른 육봉은 이미 아폴로의 애액으로 흠뻑 젖어 있다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「はぁ……はぁ……すごぃ……魔王のおち○ちん、もうバキバキだぁ<emoji=heart04>\u3000あたしのおま○こに入りたいよ～って……ビクビクしてる<emoji=heart04>」"
translation = "「하아…… 하아…… 대단해…… 마왕의 자지, 벌써 꼿꼿해졌어<emoji=heart04> 내 보지에 들어가고 싶어～라며…… 파르르 떨고 있어<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んんっ……おち○ちん、気持ちいいな～<emoji=heart04>\u3000あたしも……入れたくなってきちゃった……はぁ、あ……<emoji=heart04>」"
translation = "「응응…… 자지, 기분 좋다～<emoji=heart04> 나도…… 넣고 싶어졌어…… 하아, 아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「昨日あれだけしたのに、まだ足りないのか？」"
translation = "「어제 그렇게나 했는데, 아직도 부족한 거야?」"

[[dialogue]]
speaker = "unk"
original = "アポロがうちにお泊まりする時は、だいたいセックスがセットだ。"
translation = "아폴로가 우리 집에 자고 갈 때는, 대개 섹스가 세트다."

[[dialogue]]
speaker = "unk"
original = "昨夜も散々愛し合って、もう十分ってくらいアポロの膣内に精液を注いであげたはずなんだけど。"
translation = "어젯밤에도 한참을 사랑을 나누고, 이제 충분하다 싶을 정도로 아폴로의 질 안에 정액을 쏟아부어 주었을 텐데."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「うん……起きたら、魔王に入れてもらった……ザーメンをおなかに感じちゃって<emoji=heart04>\u3000せーしがここでうじゃうじゃ泳いでるんだな～って思ったら、もう<emoji=heart04>」"
translation = "「응…… 일어나니까, 마왕이 넣어 준…… 정액을 배에 느껴버려서<emoji=heart04> 정자가 여기서 꼬물꼬물 헤엄치고 있구나～ 하고 생각했더니, 그만<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「はぁ、あ……おなかが変な感じになって……ダメなんだ……。勝手なことしてごめんって思ったけど、我慢できなくて……んんっ……」"
translation = "「하아, 아…… 배가 이상한 느낌이 돼서…… 안 되겠어……. 제맘대로 해서 미안하다고 생각했지만, 참을 수 없어서…… 응응……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「それで勝手に人のち○ちん使ってたのか」"
translation = "「그래서 마음대로 남의 자지를 쓰고 있었던 건가」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「わ、悪かったって……。でも……んんっ……魔王だって悪いんだぞ……」"
translation = "「자, 잘못했다니까…… 하지만…… 응응…… 마왕도 나쁘다고……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしのおま○こに……何度もち○ちん入れて……はぁ、あっ……気持ちいいこと覚えさせたんだから<emoji=heart04>」"
translation = "「내 보지에…… 몇 번이고 자지 넣어서…… 하아, 앗…… 기분 좋은 걸 가르쳐 줬으니까<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「彼氏として、責任取って……んんっ……あたしのムズムズを治してくれよ……」"
translation = "「남자친구로서, 책임지고…… 응응…… 내 쑤심을 고쳐줘……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んっ、う……もう……んんっ……入れちゃうからな……いいだろ、魔王……なぁ……<emoji=heart04>」"
translation = "「응, 으…… 정말…… 응응…… 넣어 버릴 테니까…… 괜찮지, 마왕…… 응……<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んふっ……<emoji=heart04>\u3000んんっ、入ってきたぁぁっ<emoji=heart04>」"
translation = "「응후……<emoji=heart04> 응응, 들어왔어어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロは器用に腰を浮かすと、あっさり怒張を割れ目に飲み込んでしまう。"
translation = "아폴로는 능숙하게 허리를 띄우더니, 능청스럽게 팽창한 육봉을 갈라진 틈으로 삼켜 버린다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「ううっ、朝からアポロのおま○こ、気持ちよすぎる……」"
translation = "「으으, 아침부터 아폴로의 보지, 너무 기분 좋아……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んふぅ……んっ……えへへ……最高の、寝起きだろ？\u3000毎日、こうやって……起こしてあげたくなっちゃうな<emoji=heart04>」"
translation = "「응후…… 응…… 에헤헤…… 최고의 기상이치? 매일, 이렇게…… 깨워주고 싶어지네<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "毎朝セックスで起きるなんて最高の贅沢だ。"
translation = "매일 아침 섹스로 깨어나다니 최고의 사치다."

[[dialogue]]
speaker = "unk"
original = "しかも今俺にまたがっているのは恋人で、しかもメイドのアポロだ。それだけでいつも以上に興奮してしまう。"
translation = "게다가 지금 나에게 올라타 있는 것은 연인이자 메이드인 아폴로다. 그것만으로 평소 이상으로 흥분해 버린다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んふふ～、おち○ちんでっかいぞ……魔王<emoji=heart04>\u3000昨日より……んぅっ、バキバキになってるんじゃないか？」"
translation = "「응후후～, 자지 커다랗네…… 마왕<emoji=heart04> 어제보다…… 응읏, 더 꼿꼿해진 거 아니야?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「昨日だって、このかっこで散々エッチなことしたのに……あはっ……そうかそうか、魔王はこういうシチュエーションが好きなんだな……<emoji=heart04>」"
translation = "「어제도, 이 자세로 한참 에치한 짓을 했는데…… 아핫…… 그렇구나 그렇구나, 마왕은 이런 시추에이션을 좋아하는구나……<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「おまえのメイドさんが……今、おま○こで……気持ちよ～くしてやるからな<emoji=heart04>\u3000んっ……<emoji=heart04>」"
translation = "「너의 메이드 씨가…… 지금, 보지로…… 기분 좋아~게 해줄 테니까<emoji=heart04> 응……<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ふあっ……あぁっ、はぁんっ<emoji=heart04>」"
translation = "「후앗…… 아아앗, 하앙읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「気持ちいい……んっ、あっ……あぁあ……声、がっ、勝手に、出ちゃうぞっ……<emoji=heart04>」"
translation = "「기분 좋아…… 응, 앗…… 아아아…… 목소리가, 제멋대로, 나와버려……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロは早くも甘い声を漏らしながら、俺の上で腰を揺らし始めていた。"
translation = "아폴로는 벌써부터 달콤한 목소리를 새어나가게 하며, 내 위에서 허리를 흔들기 시작했다."

[[dialogue]]
speaker = "unk"
original = "決して激しい動きではないけれど、どう動けば気持ちよくなるかとわかっている的確な腰使いに成長を感じる。"
translation = "결코 격렬한 움직임은 아니지만, 어떻게 움직이면 기분이 좋아지는지 알고 있는 정확한 허리놀림에 성장을 느낀다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「こんなエッチな腰使いして……クラスメイトが知ったらビックリするぞ」"
translation = "「이런 에치한 허리놀림을 하다니…… 반 친구들이 알면 깜짝 놀라겠어」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「はぁ、あ……言っても、わかんないだろ……。んんっ……たぶん、せっくすしてるのあたしだけだから……」"
translation = "「하아, 아…… 말해도, 모를 걸…… 응응…… 아마, 섹스하는 거 나뿐이니까……」"

[[dialogue]]
speaker = "unk"
original = "クラスの中でアポロだけがセックスの気持ちよさを知っている。そんな冷静に考えれば当たり前の情報に、ペニスがいきり立つ。"
translation = "반 중에서 아폴로만이 섹스의 기쁨을 알고 있다. 그런 냉정하게 생각하면 당연한 정보에, 페니스가 솟구친다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「やぁんっ<emoji=heart04>\u3000あっ、魔王？\u3000どうした？\u3000んんっ、今ので興奮したのか？」"
translation = "「야앙읏<emoji=heart04> 앗, 마왕? 왜 그래? 응응, 지금 걸로 흥분한 거야?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「はぁ、あっ……あ……ご奉仕するの、難しくなっちゃうから……あんまり、おち○ちん……んんっ……動かさないでくれよぅ<emoji=heart04>」"
translation = "「하아, 앗…… 아…… 봉사하는 거, 어려워져 버리니까…… 너무, 자지…… 응응…… 움직이지 말아줘<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロは可愛い小尻を押しつけて、暴れるペニスを制御しようとする。"
translation = "아폴로는 귀여운 엉덩이를 눌러 붙이며, 날뛰는 페니스를 제어하려 한다."

[[dialogue]]
speaker = "unk"
original = "以前は根元まで入らなかったのに、今ではすっかり俺の全てを飲み込めるようになっていた。"
translation = "전에는 뿌리까지 들어가지 않았는데, 지금은 완전히 나의 모든 것을 삼킬 수 있게 되어 있었다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んんぅ～～っ<emoji=heart04>\u3000奥がムズムズするよぉ……んっ、ん、はぁっ、あ……あぁあ……<emoji=heart04>」"
translation = "「응응～～읏<emoji=heart04> 안쪽이 쑤셔와…… 응, 응, 하앗, 아…… 아아아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「昨日たくさんセックスしたせいで、子宮口が敏感になってるのかな？」"
translation = "「어제 섹스를 많이 한 탓에, 자궁구가 민감해진 걸까?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そう、かも……<emoji=heart04>\u3000たぶん、おなかギュッて押したら……んんっ、は、あぁ……昨日のせーし、出てきちゃいそうだし<emoji=heart04>」"
translation = "「그럴, 지도……<emoji=heart04> 아마, 배 꾹 누르면…… 응응, 하, 아아…… 어제의 정자, 나와버릴 것 같고<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あっ！\u3000んんっ、待って……！\u3000出したくないから、絶対押さないで……」"
translation = "「앗! 응응, 잠깐만……! 내보내기 싫으니까, 절대 누르지 마……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「はぁ、あ……今は、追加でせーしもらうから……<emoji=heart04>\u3000魔王は、あたしのおま○こで……はぁ、あ……気持ちよくなってるだけでいいんだ<emoji=heart04>」"
translation = "「하아, 아…… 지금은, 추가로 정자 받을 테니까……<emoji=heart04> 마왕은, 내 보지로…… 하아, 아…… 기분 좋아지고만 있으면 돼<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロは俺を制止して、自分主導のセックスを始める。"
translation = "아폴로는 나를 제지하고, 자신 주도의 섹스를 시작한다."

[[dialogue]]
speaker = "unk"
original = "快楽を味わうための動きから、搾精するための腰使いへ変わっていく。"
translation = "쾌락을 맛보기 위한 움직임에서, 착정하기 위한 허리놀림으로 바뀌어 간다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あぁん<emoji=heart04>\u3000あっ<emoji=heart04>\u3000ふぁぁんっ<emoji=heart04>\u3000魔王～、気持ちいい？\u3000あたしのセックスでち○ちん気持ちよくなってる？」"
translation = "「아앙<emoji=heart04> 앗<emoji=heart04> 후아앙읏<emoji=heart04> 마왕～, 기분 좋아? 내 섹스로 자지 기분 좋아지고 있어?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「最高だよ。よければこのまま続けて」"
translation = "「최고야. 괜찮다면 이대로 계속해줘」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「えへへ～、わかった……んんっ<emoji=heart04>\u3000じゃあ、もっともっと、頑張ってジュボジュボするからな……あっ、んっ、ああんっ……<emoji=heart04>」"
translation = "「에헤헤～, 알았어…… 응응<emoji=heart04> 그럼, 더욱더, 힘내서 쥬보쥬보 할 테니까…… 앗, 응, 아앙읏……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "跳ねるように腰をバウンドさせて、粘膜同士を擦れ合わせる。"
translation = "튀어 오르듯 허리를 바운드시키며, 점막끼리 마찰시킨다."

[[dialogue]]
speaker = "unk"
original = "通常はきつすぎるアポロの膣だけど、最近はうまく力を抜く方法を覚えてくれた。"
translation = "보통은 너무 죄여오는 아폴로의 질이지만, 최근에는 요령껏 힘을 빼는 방법을 배워 주었다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んふぅ……はぁんっ<emoji=heart04>\u3000おち○ちんのくびれたとこ……んんっ、うっ……あたしのに引っかかって気持ちいいぞ……<emoji=heart04>」"
translation = "「응후…… 하앙읏<emoji=heart04> 자지의 오목한 부분…… 응응, 으읏…… 내 걸에 걸려서 기분 좋아……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「頑張りすぎなくていいよ。アポロが好きなように動いて」"
translation = "「너무 힘내지 않아도 돼. 아폴로가 하고 싶은 대로 움직여」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「はぁ、う、んんっ……<emoji=heart04>\u3000で、でも……あたしはメイドだし……」"
translation = "「하아, 으, 응응……<emoji=heart04> 하, 하지만…… 나는 메이드고……」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「アポロが気持ちよくなってくれるのが、１番嬉しいんだ」"
translation = "「아폴로가 기분 좋아지는 게, 가장 기뻐」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んっ……ぅ……わかった……<emoji=heart04>\u3000じゃあ……んあぁぁっ<emoji=heart04>\u3000あぁっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000ああぁっっ<emoji=heart04>」"
translation = "「응…… 으…… 알았어……<emoji=heart04> 그럼…… 응아아앗<emoji=heart04> 아앗<emoji=heart04> 앙읏<emoji=heart04> 앙읏<emoji=heart04> 아아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロの腰使いがわかりやすく変化した。"
translation = "아폴로의 허리놀림이 알기 쉽게 변화했다."

[[dialogue]]
speaker = "unk"
original = "上下に動きながら、腰を回すようにくねらせる。根元まで押し込んだ後は、クリトリスを刺激するようにグリッと動かしてきた。"
translation = "위아래로 움직이면서, 허리를 돌리듯 요동치게 한다. 뿌리까지 밀어 넣은 후에는, 클리토리스를 자극하듯 구부려 움직여왔다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あぁっ<emoji=heart04>\u3000あんっ<emoji=heart04>\u3000き、気持ちいいぞ、魔王<emoji=heart04>\u3000やっぱりこれ好きだ<emoji=heart04>\u3000魔王のおち○ちん、こうやってするの……大好きっっ<emoji=heart04>」"
translation = "「아앗<emoji=heart04> 앙읏<emoji=heart04> 기, 기분 좋아, 마왕<emoji=heart04> 역시 이거 좋아<emoji=heart04> 마왕의 자지, 이렇게 하는 거…… 너무 좋아<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「メイドさんなのに……エッチでごめんっっ<emoji=heart04>\u3000でもっ、でもあたしっっ<emoji=heart04>\u3000んんんっ、やっ、やだぁぁぁ～っ、昨日のせーし出てきちゃうっっ<emoji=heart04>」"
translation = "「메이드 씨인데…… 에치해서 미안해<emoji=heart04> 하지만읏, 하지만 나읏<emoji=heart04> 응응응읏, 싫, 싫어어어～읏, 어제의 정자 나와버려어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "見た目ではわからないけど、微かに精液の臭いが漂っている。"
translation = "겉보기로는 모르겠지만, 미미하게 정액 냄새가 감돌고 있다."

[[dialogue]]
speaker = "unk"
original = "アポロから出ているのか、シーツに染み付いたものかわからないけど、昨夜の激しいまぐわいを想起させて、更に興奮を煽っていく。"
translation = "아폴로에게서 나오는 건지, 시트에 배어든 것인지 모르겠지만, 어젯밤의 격렬한 관계를 떠올리게 해서, 한층 더 흥분을 부추겨 간다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王っ……魔王～～っ<emoji=heart04>\u3000あたしっ、あたしっ<emoji=heart04>\u3000おかしくなっちゃいそうだ<emoji=heart04>\u3000こんなのダメなのにっ<emoji=heart04>\u3000せーしのにおいさせる子になっちゃって……<emoji=heart04>」"
translation = "「마왕읏…… 마왕～～읏<emoji=heart04> 나읏, 나읏<emoji=heart04> 이상해져 버릴 것 같아<emoji=heart04> 이런 거 안 되는데읏<emoji=heart04> 정자 냄새나게 하는 아이가 되어버려서……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロの興奮に比例して、腰の速度も上がっていく。"
translation = "아폴로의 흥분에 비례해서, 허리의 속도도 올라간다."

[[dialogue]]
speaker = "unk"
original = "ペニスが深々と埋没したアポロの膣内は、粘つく本気汁に満たされ、ぬっちょぬっちょと卑猥な音を奏でていた。"
translation = ""

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あぁんっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000はあぁぁぁ～～っ<emoji=heart04>\u3000やぁっ、奥っ、ずぶぅって<emoji=heart04>\u3000魔王のさきっぽ<emoji=heart04>\u3000気持ちいいっ<emoji=heart04>\u3000気持ちいいよぉ<emoji=heart04>」"
translation = "「아앙읏<emoji=heart04> 앗<emoji=heart04> 하아아아아～～읏<emoji=heart04> 야앗, 안쪽읏, 푹하고<emoji=heart04> 마왕의 끝부분<emoji=heart04> 기분 좋아읏<emoji=heart04> 기분 좋아아<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロが気持ちよさそうに乱れるたび、むき出しになっているおっぱいが可愛く揺れる。"
translation = "아폴로가 기분 좋은 듯 흐트러질 때마다, 노출되어 있는 가슴이 귀엽게 흔들린다."

[[dialogue]]
speaker = "unk"
original = "普段は滅多に揺れないから、これはアポロが本気で感じてる証だ。"
translation = "평소에는 좀처럼 흔들리지 않으니까, 이것은 아폴로가 진심으로 느끼고 있다는 증거다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あ、あたしっ、もうっっ<emoji=heart04>」"
translation = "「아, 나읏, 이제읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「俺も気持ちいいから。アポロも好きにしていいからなっ」"
translation = "「나도 기분 좋으니까. 아폴로도 하고 싶은 대로 해도 돼!」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「うんっ……うんっ……ありがと、魔王<emoji=heart04>\u3000じゃあ、あたしも……本気でセックスするな……あぁあっ……<emoji=heart04>」"
translation = "「응읏…… 응읏…… 고마워, 마왕<emoji=heart04> 그럼, 나도…… 진심으로 섹스할게…… 아아앗……<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ふあぁぁあぁあぁ～～～～っ<emoji=heart04>\u3000はぁんっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000あっ<emoji=heart04>\u3000うあぁぁっ<emoji=heart04>」"
translation = "「후아아아아아아～～～～읏<emoji=heart04> 하앙읏<emoji=heart04> 앗<emoji=heart04> 앗<emoji=heart04> 우아앗<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "喘ぎ声のトーンが一段上がる。"
translation = "신음소리의 톤이 한 단계 올라간다."

[[dialogue]]
speaker = "unk"
original = "さっきまでの腰使いが遊びだったかと思うくらい、激しく腰を上下に動かし始めた。"
translation = "조금 전까지의 허리놀림이 장난이었나 싶을 정도로, 격렬하게 허리를 위아래로 움직이기 시작했다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「すごいっ<emoji=heart04>\u3000すごいよぉぉっ<emoji=heart04>\u3000ち○ちん<emoji=heart04>\u3000ち○ちんグリグリ～って<emoji=heart04>\u3000壊れちゃう<emoji=heart04>\u3000こんなのおま○こ壊れちゃうからあぁっ<emoji=heart04>」"
translation = "「대단해읏<emoji=heart04> 대단해에읏<emoji=heart04> 자지<emoji=heart04> 자지 꾹꾹~하고<emoji=heart04> 망가져 버려<emoji=heart04> 이런 거 보지 망가져 버리니까아앗<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んあっ<emoji=heart04>\u3000あああぁぁっ<emoji=heart04>\u3000魔王っ<emoji=heart04>\u3000魔王ぅ～～～っ<emoji=heart04>\u3000んぐっ<emoji=heart04>\u3000ううっ<emoji=heart04>\u3000ふううぅ～～～っ<emoji=heart04>」"
translation = "「응앗<emoji=heart04> 아아아앗<emoji=heart04> 마왕읏<emoji=heart04> 마왕으～～～읏<emoji=heart04> 응긋<emoji=heart04> 으으읏<emoji=heart04> 후우우우～～～읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロは髪を振り乱しながら、俺の上で淫らに跳ね、踊った。"
translation = "아폴로는 머리를 휘날리며, 내 위에서 음란하게 튀어 오르고 춤추었다."

[[dialogue]]
speaker = "unk"
original = "おしりを叩きつけるようなピストンで性器同士の結合を楽しんでいく。"
translation = "엉덩이를 부딪치는 듯한 피스톤으로 성기 끼리의 결합을 즐겨 간다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ぶちゅっ、ぶちゅっ、ってエッチな音してるよぉ<emoji=heart04>\u3000んんっ、あっ<emoji=heart04>\u3000こんな……昨日よりスケベなセックスしちゃってる……<emoji=heart04>」"
translation = "「부츄, 부츄, 하고 에치한 소리 나고 있어어<emoji=heart04> 응응, 앗<emoji=heart04> 이런…… 어제보다 야한 섹스 해버리고 있어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "かなり濃度の高い淫液があちこちに乱れ飛び、汚していく。"
translation = "상당히 농도 높은 음액이 여기저기 튀어 오르며 럽혀 간다."

[[dialogue]]
speaker = "unk"
original = "アポロのメイド服にもはしたない性の証が付着していた。"
translation = "아폴로의 메이드복에도 음란한 성의 증거가 묻어 있었다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「メイド服こんなに汚しちゃってるけど、大丈夫かな？」"
translation = "「메이드복 이렇게 더럽혀 버렸는데, 괜찮을까?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「わ、わかんないっ<emoji=heart04>\u3000んんっ、あっ<emoji=heart04>\u3000でも、せーしには注意しなさいって、言われててっっ<emoji=heart04>」"
translation = "「모, 모르겠어읏<emoji=heart04> 응응, 앗<emoji=heart04> 하지만, 정자에는 조심하라고, 들었어서읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "いったい誰に！？\u3000ていうか、気付かれてたのか！"
translation = "대체 누구한테!? 그보다, 들키고 있었던 건가!"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王が、出したのがっ……んんっ、あっ……<emoji=heart04>\u3000パンツについてて、それでぇっ……<emoji=heart04>」"
translation = "「마왕이, 싼 게읏…… 응응, 앗……<emoji=heart04> 팬티에 묻어있어서, 그래서어……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "みんなには恋人同士として認知されてるけど、ち○ちんハメて中出ししまくってるのは知られてないと思ってたのに。"
translation = "다들 연인 사이로 인지하고 있지만, 자지를 꽂아서 질내사정 엄청 하고 있는 건 모를 줄 알았는데."

[[dialogue]]
speaker = "unk"
original = "アポロは言いながら興奮しているのか、膣内をきゅんきゅんと収縮させている。"
translation = "아폴로는 말하면서 흥분하는지, 질 안을 큥큥하고 수축시키고 있다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「こんどーむ……っていうの、使わなきゃダメなんだけどっっ、あたしっ、魔王にびゅーってしてもらうの大好きだからっっ<emoji=heart04>」"
translation = "「콘돔……이라는 거, 쓰지 않으면 안 되는데읏, 나읏, 마왕이 뷰-하고 해주는 거 너무 좋아하니까읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「もっと魔王のザーメンっっ、ごくごくって飲ませて欲しいっ<emoji=heart04>\u3000昨日みたいに、おなかポコってなるまで、あたしにいっぱい出して出して出しまくってぇぇっ<emoji=heart04>」"
translation = "「더 마왕의 정액읏, 꿀꺽꿀꺽하고 마시게 해줬으면 좋겠어읏<emoji=heart04> 어제처럼, 배 툭 튀어나올 때까지, 나한테 잔뜩 내보내고 내보내고 맘껏 내보내줘어어읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "アポロのピストンが最高潮に達していく。"
translation = "아폴로의 피스톤이 최고조에 달해 간다."

[[dialogue]]
speaker = "unk"
original = "中出し以外の選択肢はないと言わんばかりに結合は深く、膣肉が絡みついてくる。"
translation = "질내사정 외의 선택지는 없다는 듯 결합은 깊어졌고, 질 주름이 얽혀온다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王っ<emoji=heart04>\u3000魔王～～っ<emoji=heart04>\u3000好きっ<emoji=heart04>\u3000好きぃ～～っ<emoji=heart04>\u3000あたしっ<emoji=heart04>\u3000もうダメっっ<emoji=heart04>\u3000魔王のち○ちん気持ちよすぎてバカになっちゃうっっ<emoji=heart04>」"
translation = "「마왕읏<emoji=heart04> 마왕～～읏<emoji=heart04> 좋아해<emoji=heart04> 좋아해에～～읏<emoji=heart04> 나읏<emoji=heart04> 이제 안 돼읏<emoji=heart04> 마왕의 자지 너무 기분 좋아서 바보가 되어버려어읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「はあっ<emoji=heart04>\u3000あぁぁんっ<emoji=heart04>\u3000やあっ<emoji=heart04>\u3000イっちゃいそう<emoji=heart04>\u3000イく<emoji=heart04>\u3000んんぅぅ～～～っ<emoji=heart04>」"
translation = "「하앗<emoji=heart04> 아아앙읏<emoji=heart04> 야앗<emoji=heart04> 가버릴 것 같아<emoji=heart04> 가<emoji=heart04> 응응우우～～～읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「あたしがっ、魔王を気持ちよくしなきゃダメなのにっっ<emoji=heart04>\u3000自分ばっか気持ちよくなってごめんっっ」"
translation = "「내가읏, 마왕을 기분 좋게 해주지 않으면 안 되는데읏<emoji=heart04> 자기만 기분 좋아져서 미안해읏」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王も気持ちよくなって<emoji=heart04>\u3000せーしびゅるーってしてっ<emoji=heart04>\u3000あぁっ<emoji=heart04>\u3000せーし欲しい<emoji=heart04>\u3000中出しっ<emoji=heart04>\u3000魔王のせーしでおなかのムズムズ治してぇぇっ<emoji=heart04>」"
translation = "「마왕도 기분 좋아져줘<emoji=heart04> 정자 뷰르르-하고 해줘읏<emoji=heart04> 아앗<emoji=heart04> 정자 원해<emoji=heart04> 질내사정읏<emoji=heart04> 마왕의 정자로 배의 쑤심을 고쳐줘어어읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "激しく喘ぎまくるアポロは、子宮で俺のザーメンを求め、甘えるような声でおねだりしてくる。"
translation = "격렬하게 신음하는 아폴로는, 자궁으로 내 정액을 요구하며 조르는 듯한 목소리로 졸라댄다."

[[dialogue]]
speaker = "unk"
original = "同時に腰を高速で上下させ、すっかり発情しきったプリプリの膣襞で肉棒全体をしごき続けた。"
translation = "동시에 허리를 고속으로 위아래로 움직여, 완전히 발정해 버린 탱탱한 질 주름으로 육봉 전체를 계속 쥐어짜냈다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「魔王っ<emoji=heart04>\u3000あたしもうっっ<emoji=heart04>\u3000我慢できないからぁぁっ<emoji=heart04>\u3000はぁぁっ、イく<emoji=heart04>\u3000イっちゃうっっ<emoji=heart04>」"
translation = "「마왕읏<emoji=heart04> 나 이제읏<emoji=heart04> 못 참겠으니까아아읏<emoji=heart04> 하아아읏, 가<emoji=heart04> 가버려어읏<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "既に小刻みに震え、小さい絶頂を何度も繰り返している。"
translation = "이미 미세하게 떨며, 작은 절정을 몇 번이고 반복하고 있다."

[[dialogue]]
speaker = "unk"
original = "そんなアポロの反応に、昨日散々射精しまくった俺のペニスもついに限界を迎えていく。"
translation = "그런 아폴로의 반응에, 어제 한참 사정해 댔던 내 페니스도 마침내 한계를 맞이해 간다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「もうダメぇぇっ<emoji=heart04>\u3000イく<emoji=heart04>\u3000イくぅぅっっ<emoji=heart04>\u3000んああぁぁあ～～～～～っ<emoji=heart04>」"
translation = "「이제 안 돼애읏<emoji=heart04> 가<emoji=heart04> 가버려어어읏<emoji=heart04> 응아아아아아～～～～～읏<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「イっっ……くうううぅ～～～～～～～～っっっ<emoji=heart04><emoji=heart04><emoji=heart04>」"
translation = "「가아아…… 버어어어어～～～～～～～～읏<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んあぁっ……あぁぁあっ……うあぁっ……」"
translation = "「응아앗…… 아아아앗…… 우아앗……」"

[[dialogue]]
speaker = "unk"
original = "呂律の回らない声で、アポロは激しい絶頂を迎えた。"
translation = "혀가 꼬인 목소리로, 아폴로는 격렬한 절정을 맞이했다."

[[dialogue]]
speaker = "unk"
original = "俺もイキま○この強烈な締め付けに屈して、欲望を解き放っていく。"
translation = "나도 사정 보지의 강렬한 죄임에 굴복해, 욕망을 해방해 간다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「んぅっ……びゅう～～～って……出てる……魔王のせーし……いっぱい……<emoji=heart04>」"
translation = "「응앗…… 뷰우우～～하고…… 나오고 있어…… 마왕의 정자…… 잔뜩……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "種付けを受け入れるようにアポロは腰を静止させ、ペニスの先端を最奥に密着させる。"
translation = "교배를 받아들이듯 아폴로는 허리를 정지시키고, 페니스의 끝을 가장 안쪽에 밀착시킨다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「こーすると……せーしを全部おなかでごっくん出来るからな……」"
translation = "「이렇게 하면…… 정자를 전부 배로 꿀꺽할 수 있으니까……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「えへへ……あたしも中出ししてもらうの上手になっただろ<emoji=heart04>」"
translation = "「에헤헤…… 나도 질내사정 받는 거 잘하게 됐지<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "はにかみながら中出しセックスの上達を告げるアポロがあり得ないくらいに可愛い。"
translation = "수줍어하며 질내사정 섹스의 실력 향상을 고하는 아폴로가 말도 안 되게 귀엽다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「にしてもすごいな……んんっ<emoji=heart04>\u3000昨日あんだけあたしに注いだのに、もうこんなに出せるのか……」"
translation = "「그나저나 대단하네…… 응응<emoji=heart04> 어제 그렇게나 나한테 쏟아부었는데, 벌써 이렇게 낼 수 있는 거야……」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「最後の方はちょろっとしか出なくなってたのにな。ううっ、おなかがずしっと重いぞ<emoji=heart04>」"
translation = "「마지막 쯤에는 조금밖에 안 나오게 됐었는데. 으으, 배가 묵직하게 묵직해<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "小さな子宮に充填されていく精液に困惑しながらも、アポロは全てを笑顔で受け止めてくれた。"
translation = "작은 자궁에 충전되어 가는 정액에 당황해하면서도, 아폴로는 모든 것을 미소로 받아들여 주었다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「ううっ……これで全部だな……」"
translation = "「으으…… 이걸로 전부네……」"

[[dialogue]]
speaker = "unk"
original = "長い射精を終え、ずるりと肉棒を抜き取った。"
translation = "긴 사정을 마치고, 스르륵 육봉을 빼냈다."

[[dialogue]]
speaker = "unk"
original = "その拍子にどろぉ～～っと白濁汁が引きずり出され、赤く充血したアポロの膣口から溢れてしまう。"
translation = "그 박자에 스르륵 백탁액이 끌려 나와, 붉게 충혈된 아폴로의 질구에서 흘러넘쳐 버린다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「やだぁっ、せっかく魔王が出してくれたのに……<emoji=heart04>」"
translation = "「싫어어, 어렵게 마왕이 내보내 줬는데……<emoji=heart04>」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「でも、おなかに入った分は残ってるだろ？」"
translation = "「하지만, 배에 들어간 양은 남아있잖아?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そ、そうだけどさー、もったいないだろ……」"
translation = "「그, 그렇지만 말이야, 아깝잖아……」"

[[dialogue]]
speaker = "unk"
original = "自ら排泄したばかりのぺとっとしたザーメンを見下ろしながら、処置に迷うアポロだった。"
translation = "스스로 배출한 지 얼마 안 된 끈적거리는 정액을 내려다보며, 처리에 망설이는 아폴로였다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「やっぱり飲んだ方がいい？」"
translation = "「역시 마시는 게 좋아?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「やめなさい、ばっちいから」"
translation = "「하지 마, 더러우니까」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「そうか？\u3000でもふぇらちおしたときはいつも飲んでるぞ？」"
translation = "「그래? 하지만 펠라치오했을 때는 항상 마시고 있는데?」"

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「直接だったらいいのっ」"
translation = "「직접이라면 괜찮아」"

[[dialogue]]
speaker = "unk"
original = "都合のいい発言だけど、フェラチオのときはごっくんして欲しいものだ。"
translation = "제 좋을 대로의 발언이지만, 펠라치오 때는 꿀꺽 마셔주었으면 하는 법이다."

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「それにしても……いっぱい出たな……<emoji=heart04>」"
translation = "「그나저나…… 잔뜩 나왔네……<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「なのに魔王のおち○ちんは、まだまだ元気いっぱいだし<emoji=heart04>」"
translation = "「그런데도 마왕의 자지는, 아직도 쌩쌩하고<emoji=heart04>」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「どうする？\u3000夜するときは、ふにゃふにゃになるまでエッチしてるけど<emoji=heart04>」"
translation = "「어떡할래? 밤에 할 때는, 흐물흐물해질 때까지 에치하고 있지만<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "こっちの意思を問うくせして、腰をクイクイと動かし、硬さの抜けないペニスを刺激してくる。"
translation = "이쪽의 의사를 물어보면서도, 허리를 쿡쿡 움직이며, 강도가 빠지지 않는 페니스를 자극해 온다."

[[dialogue]]
speaker_original = "クロト"
speaker_translation = "쿠로토"
original = "「エッチだなぁ、俺のメイドさんは」"
translation = "「에치하네, 내 메이드 씨는」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「でも、魔王はエッチなメイドさんの方が好きだろ？」"
translation = "「하지만, 마왕은 에치한 메이드 씨를 더 좋아하지?」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「恋人なんだから、全部お見通しだぞ。あたしも……おまえと同じくらい、エッチになっちゃったしな」"
translation = "「연인이니까, 전부 꿰뚫어 보고 있다고. 나도…… 너만큼이나, 에치하게 돼버렸고 말이야」"

[[dialogue]]
speaker_original = "アポロ"
speaker_translation = "아폴로"
original = "「だから……続き、しよ？\u3000あたしも、もっとおまえと気持ちいいことしたい<emoji=heart04>」"
translation = "「그러니까…… 계속, 할까? 나도, 너랑 더 기분 좋은 짓 하고 싶어<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
original = "そんなアポロのあまあまおねだりに抵抗できるはずもなく、俺たちは再び激しく繋がり合うのだった。"
translation = "그런 아폴로의 애교 섞인 조르기에 저항할 수 있을 리 만무하여, 우리들은 다시금 격렬하게 이어지는 것이었다."

