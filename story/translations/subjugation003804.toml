[[dialogue]]
speaker = "unk"
original = "リゾート結界は広いので、何組かに分かれてフライドチキンマシンを探すことになった。"
translation = "리조트 결계는 넓기 때문에 몇 조로 나누어 프라이드치킨 머신을 찾기로 했다."

[[dialogue]]
speaker = "unk"
original = "今は俺とシルヴィ先輩、コハルコさんとアニマ先輩でコンビを組んでいる。"
translation = "지금은 나와 실비 선배, 코하루코 씨와 아니마 선배가 콤비를 이루고 있다."

[[dialogue]]
speaker = "unk"
original = "他にもトリュファイナさんとシュティレも探してくれているらしい。"
translation = "그 외에도 트리파이나 씨와 슈틸레도 찾고 있는 모양이다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「会長くんも水着フォームあるんだ！\u3000海パンで飛べるのなんかウケる！」"
translation = "「회장 군도 수영복 폼이 있구나! 삼각팬티로 날아다니는 거 왠지 웃겨!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「はー、リゾート結界って本当にどこまで行っても海なんだね。すごいな～」"
translation = "「하아~ 리조트 결계는 정말 어디까지 가도 바다네. 대단하다~」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「……そもそもリゾート結界って何？\u3000いつの間に学園に出来たの？」"
translation = "「……애초에 리조트 결계가 뭐야? 언제 학원에 생긴 거야?」"

[[dialogue]]
speaker = "unk"
original = "俺たちにはリゾート結界が学園にあるのが当たり前になっていたけど、シルヴィ先輩にとっては驚きの連続のようだ。リゾート結界が誕生した経緯をかいつまんで伝える。"
translation = "우리에게는 리조트 결계가 학원에 있는 것이 당연했지만 실비 선배에게는 놀라움의 연속인 듯하다. 리조트 결계가 탄생한 경위를 간략하게 전달한다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「……へぇ～。長い間、眠りに就いていた古代天使が作った結界……さらに、結界内の疑似守護星によって水着フォームが覚醒した、と」"
translation = "「……헤에. 오랫동안 잠들어 있던 고대 천사가 만든 결계…… 게다가 결계 내의 의사 수호성에 의해 수영복 폼이 각성했다, 이거지」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あたしがいない間にいろんなことがあったんだねぇ」"
translation = "「내가 없는 사이에 별별 일이 다 있었네」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩は故郷を守るため、一時期、天界に帰っていた。"
translation = "실비 선배는 고향을 지키기 위해 한동안 천계에 돌아가 있었다."

[[dialogue]]
speaker = "unk"
original = "その間に、こちらでも様々な出会いや事件があった。"
translation = "그사이에 이곳에서도 다양한 만남과 사건이 있었다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ちなみに古代天使って……あ、分かった。リップルちゃんでしょ。いつも水着の子。寮でも賑やかで楽しいんだ」"
translation = "「그나저나 고대 천사라는 건…… 아, 알겠다. 리플짱이지? 항상 수영복 차림인 애. 기숙사에서도 떠들썩해서 즐거워」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「リップルちゃん、不思議な子だと思ったけど、古代天使だったんだ」"
translation = "「리플짱, 신기한 아이라고 생각했는데 고대 천사였구나」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「──いや、いつも水着なのは古代と関係ないよね！？」"
translation = "「──아니, 항상 수영복인 건 고대랑 상관없잖아!?」"

[[dialogue]]
speaker = "unk"
original = "ないですね"
translation = "상관없죠"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「だよねー。個性的な子も増えたよね。ま、<ruby>３年生<rt>あたしたち</rt></ruby>が言うことじゃないけどさ」"
translation = "「그치~ 개성적인 애들도 늘었네. 뭐, <ruby>3학년<rt>우리들</rt></ruby>이 할 말은 아니지만 말야」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「アニマっちとか、マムとか初めて会ったときは驚いたよ。アニマっちは何考えてるかマジ分かんないし、マムはあんなだし！\u3000畏怖！」"
translation = "「아니마치라든가 마님이라든가 처음 만났을 때는 놀랐어. 아니마치는 무슨 생각 하는지 진짜 모르겠고 마님은 저 모양이고! 경외감!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「右も左も楽しい子ばっかりで、学園に来てから退屈なんかしたことないよ」"
translation = "「이쪽도 저쪽도 즐거운 애들뿐이라 학원에 온 뒤로 지루할 틈이 없어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「学園のみんなだけじゃなくて、人間界も初めて見るものだらけでさ。カラオケでしょ、ゲーセンでしょ、映画館でしょ……挙げたらきりがないや」"
translation = "「학원 사람들뿐만 아니라 인간계도 처음 보는 것투성이라서. 가라오케라든가 게임 센터라든가 영화관이라든가…… 꼽자면 끝이 없네」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「天界にはないものばっかりで、めっちゃくちゃ楽しかった！\u3000今でも楽しいけど、初めてのときは格別だったなぁ……」"
translation = "「천계에는 없는 것들뿐이라서 엄~청나게 즐거웠어! 지금도 즐겁지만 처음이었을 때는 각별했지……」"

[[dialogue]]
speaker = "unk"
original = "先輩の故郷はどんなところですか？"
translation = "선배의 고향은 어떤 곳인가요?"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あたしの故郷？\u3000そうだなぁ……改めて聞かれると、説明するの難しいかも」"
translation = "「내 고향? 글쎄…… 새삼스레 질문받으니까 설명하기 어려울지도」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「う～ん……人間界で言うと、すごい田舎？\u3000みたいな感じかな。小さな町でね、外は見渡す限り原っぱで、大きな湖があって……」"
translation = "「으음…… 인간계로 치면 엄청난 시골? 같은 느낌일까. 작은 마을인데 밖은 보이는 곳마다 들판이고 커다란 호수가 있고……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「かけっこしたり、釣りしたり、素潜りしたり、そんな毎日だったな。流星市国みたいになんでもあるわけじゃないけど、楽しかったよ！」"
translation = "「달리기하고, 낚시하고, 잠수하고, 그런 매일이었어. 유성시국처럼 뭐든 다 있는 건 아니지만 즐거웠어!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「…………うずうず」"
translation = "「…………근질근질」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩が何か言いたそうだ。"
translation = "실비 선배가 뭔가 말하고 싶은 눈치다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ねぇねぇ、ずいぶん探したけど、マシンもモンスターも見付からないし、ちょっと休憩しようよ」"
translation = "「저기 저기, 한참 찾았지만 머신도 몬스터도 안 보이고, 잠깐 쉬자」"

[[dialogue]]
speaker = "unk"
original = "ちょっとくらいならいいですよ"
translation = "잠깐 정도라면 괜찮아요"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「やったぁ！\u3000会長くん話が分かるぅ！」"
translation = "「앗싸! 회장군 말귀가 통하네~!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「本当に綺麗な海だね。リゾート結界だから、本物の海じゃないんだろうけど、それでも、綺麗なのは本当だよ」"
translation = "「정말 예쁜 바다네. 리조트 결계니까 진짜 바다는 아니겠지만, 그래도 예쁜 건 사실이야」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「結界の中ってリップルちゃんのイメージなんだっけ？\u3000じゃあ、リップルちゃんは心の底から海が好きなんだね。すごく素敵」"
translation = "「결계 안은 리플짱의 이미지라고 했었나? 그럼 리플짱은 마음속 깊이 바다를 좋아하는구나. 정말 멋져」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「さ～て、どうしよっかな。あたし、実は海は初心者なんだよね。会長くんは海といえば、何で遊ぶ？」"
translation = "「자~ 그럼 어떡할까. 나 사실 바다는 초보거든. 회장군은 바다 하면 뭐 하고 놀아?」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「ふんふん……まずは泳いだり、潜ったり？\u3000じゃあ泳ごう！」"
translation = "「흠흠…… 우선은 수영하거나 잠수하기? 그럼 수영하자!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「とりゃああぁっ！」"
translation = "「토랴아아아앗!」"

[[dialogue]]
speaker = "unk"
original = "激しく水しぶきを上げながら、シルヴィ先輩が泳いでいる。泳ぎ方まで賑やかだ。"
translation = "격하게 물보라를 일으키며 실비 선배가 수영하고 있다. 수영하는 법까지 시끌벅적하다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「んで潜る！」"
translation = "「그리고 잠수!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「すごいすごーい！\u3000おさかないっぱいいたー！\u3000キレイなのとかヘンなんとかいろいろいるよ！」"
translation = "「굉장해 굉장해~! 물고기 잔뜩 있었어~! 예쁜 거랑 이상한 거랑 여러 가지 있어!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「学園の中なのに海で遊べるなんて、マジで楽しすぎる！\u3000学園に来る前はこんなことが起きるなんて想像もできなかったよ！」"
translation = "「학원 안인데 바다에서 놀 수 있다니, 진짜 너무 즐거워! 학원에 오기 전에는 이런 일이 생길 거라곤 상상도 못 했어!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「……いやぁ、懐かしいな」"
translation = "「……이야, 그립네」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「会長くんにも話したことあったかな？\u3000あたしの故郷はある日突然、モンスターに襲われて滅茶苦茶になっちゃったんだ」"
translation = "「회장군한테도 얘기한 적 있었나? 내 고향은 어느 날 갑자기 몬스터의 습격을 받아서 엉망진창이 되어버렸어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「その時、モンスターを倒してくれたお姉さんに憧れて、星騎士になるために、あたしはこの学園に来た」"
translation = "「그때 몬스터를 물리쳐준 언니를 동경해서, 성기사가 되기 위해 나는 이 학원에 왔어」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「星騎士になるための学園だから、苦しいことや辛いことがたくさんあるって覚悟してたけど、違ったんだ。そりゃ楽しいことばかりじゃないけど、さ」"
translation = "「성기사가 되기 위한 학원이니까 고통스럽고 힘든 일이 많을 거라 각오했지만, 아니었어. 물론 즐거운 일만 있는 건 아니지만 말야」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「優しい先輩、面白い友達、可愛い後輩、何でもある街…………いっぱいいっぱい、楽しいこと、いっぱいあった！」"
translation = "「상냥한 선배, 재미있는 친구, 귀여운 후배, 뭐든 다 있는 거리………… 가득가득, 즐거운 일들이 잔뜩 있었어!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「あたし、この学園が好き！\u3000この学園にいるあたしが好きー！」"
translation = "「나, 이 학원이 좋아! 이 학원에 있는 내가 좋아~!」"

[[dialogue]]
speaker = "unk"
original = "シルヴィ先輩の叫びが海に溶けていく。潮騒はどこまでも優しい。"
translation = "실비 선배의 외침이 바다에 녹아든다. 파도 소리는 더없이 상냥하다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「もう３年生だから、卒業後のことも考えないといけないのにね。最初は天界に帰るつもりだったけど、今はどうしよっか考えてる」"
translation = "「벌써 3학년이라 졸업 후의 일도 생각해야 하는데 말이지. 처음엔 천계로 돌아갈 생각이었지만, 지금은 어떡할지 고민 중이야」"

[[dialogue]]
speaker_original = "モンスター"
speaker_translation = "몬스터"
original = "「チキチキー！！」"
translation = "「치키치키!!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「うわっ！\u3000チキン飛んできたー！」"
translation = "「우와! 치킨 날아왔다~!」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「動いて小腹が空いてたからちょうどいいね！\u3000スクリューウェーブジャベリン！」"
translation = "「움직여서 출출했는데 딱 좋네! 스크류 웨이브 자벨린!」"

[[dialogue]]
speaker = "unk"
original = "水流をまとった銛が、瞬く間にモンスターを蹴散らした。"
translation = "수류를 두른 작살이 순식간에 몬스터를 격퇴했다."

[[dialogue]]
speaker = "unk"
original = "さすがシルヴィ先輩だ。さっき水着戦闘服を着たばかりなのに、すでに星術を使いこなしている。"
translation = "역시 실비 선배다. 방금 수영복 전투복을 입었을 뿐인데 벌써 성술을 능숙하게 다루고 있다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「チキンゲット！\u3000うまっ！\u3000あ、会長くんも食べていいよ」"
translation = "「치킨 겟! 맛있다! 아, 회장군도 먹어도 돼」"

[[dialogue]]
speaker = "unk"
original = "さっきまでモンスターだったチキンを食べるのは抵抗はあるが、シルヴィ先輩にならってかぶりつく。もちろん美味い。"
translation = "방금까지 몬스터였던 치킨을 먹는 것에 저항은 있지만, 실비 선배를 따라 베어 문다. 물론 맛있다."

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「うん、いい食べっぷり！\u3000購買のチキンも美味しくなったよね」"
translation = "「응, 잘 먹네! 매점 치킨도 맛있어졌지」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「<ruby>ＧＦＣ<rt>ガルスフライドチキン</rt></ruby>に、ボスチキン、購買やコンビニのチキン、人間界には美味しいチキンがいっぱいあるのです……」"
translation = "「<ruby>GFC<rt>갈스 프라이드 치킨</rt></ruby>에 보스 치킨, 매점이나 편의점 치킨, 인간계에는 맛있는 치킨이 잔뜩 있는 것이에요……」"

[[dialogue]]
speaker_original = "シルヴィ"
speaker_translation = "실비"
original = "「フライドチキン、天界にはないからねぇ……。実は帰るの迷ってるんだよね。あっはっは！」"
translation = "「프라이드 치킨, 천계에는 없으니까 말야……. 사실 돌아갈지 고민하고 있어. 앗하하!」"

[[dialogue]]
speaker = "unk"
original = "明るく笑うシルヴィ先輩は、夏の太陽みたいだった。"
translation = "밝게 웃는 실비 선배는 여름의 태양 같았다."

