[[dialogue]]
speaker = "unk"
# 変わるものがあり、変わらないものもある。
line = "変わるものがあり、変わらないものもある。"

[[dialogue]]
speaker = "unk"
# それは気付きにくくて、だからこそ、わかったとき嬉しくなるんだ。
line = "それは気付きにくくて、だからこそ、わかったとき嬉しくなるんだ。"

[[dialogue]]
speaker = "unk"
# 平和だなぁ
line = "平和だなぁ"

[[dialogue]]
speaker = "unk"
# 偶然見つけたオアシスのような、何事もない日常だった。
line = "偶然見つけたオアシスのような、何事もない日常だった。"

[[dialogue]]
speaker = "unk"
# このまま何も起きなければ……なんて考えるとフラグになってしまう。そんな経験があるんだ。
line = "このまま何も起きなければ……なんて考えるとフラグになってしまう。そんな経験があるんだ。"

[[dialogue]]
speaker = "女生徒"
# 「た、大変です緋宮会長！　アリーナに来て下さい！」
line = "「た、大変です緋宮会長！　アリーナに来て下さい！」"

[[dialogue]]
speaker = "unk"
# ……はい、平和終了。
line = "……はい、平和終了。"

[[dialogue]]
speaker = "unk"
# デジャブを感じるけど、いつも大体こんなものだ。
line = "デジャブを感じるけど、いつも大体こんなものだ。"

[[dialogue]]
speaker = "クーシェン"
# 「今日は本気で行くよ！　アポロ！」
line = "「今日は本気で行くよ！　アポロ！」"

[[dialogue]]
speaker = "アポロ"
# 「望むところだ！　あたしの強さをおまえの体に刻み込んでやるぞ！」
line = "「望むところだ！　あたしの強さをおまえの体に刻み込んでやるぞ！」"

[[dialogue]]
speaker = "クーシェン"
# 「伸びろ、如意棒！」
line = "「伸びろ、如意棒！」"

[[dialogue]]
speaker = "アポロ"
# 「唸れ鉄拳！　流星の力を今ここに！」
line = "「唸れ鉄拳！　流星の力を今ここに！」"

[[dialogue]]
speaker = "unk"
# 大丈夫かなぁ？
line = "大丈夫かなぁ？"

[[dialogue]]
speaker = "unk"
# 今度は間に合ったけど
line = "今度は間に合ったけど"

[[dialogue]]
speaker = "フィオナ"
# 「……わかりません。ですが、見守りましょう。予約時間をオーバーしたらその時は……」
line = "「……わかりません。ですが、見守りましょう。予約時間をオーバーしたらその時は……」"

[[dialogue]]
speaker = "マリオン"
# 「そうなったら、また私がなんとかしますよ。でも、心配はないと思いますけれどね」
line = "「そうなったら、また私がなんとかしますよ。でも、心配はないと思いますけれどね」"

[[dialogue]]
speaker = "unk"
# 俺たちの他にも大勢の星騎士たちが、クーシェンとアポロの模擬戦闘を息を殺して見守る。
line = "俺たちの他にも大勢の星騎士たちが、クーシェンとアポロの模擬戦闘を息を殺して見守る。"

[[dialogue]]
speaker = "unk"
# 攻防は一進一退。お互いの戦闘スタイルを熟知しているからこそ、均衡はそう簡単には崩れない。
line = "攻防は一進一退。お互いの戦闘スタイルを熟知しているからこそ、均衡はそう簡単には崩れない。"

[[dialogue]]
speaker = "アポロ"
# 「よーし！　次はでかいのお見舞いするからな！」
line = "「よーし！　次はでかいのお見舞いするからな！」"

[[dialogue]]
speaker = "クーシェン"
# 「ウキキ♪　やっぱアポロと戦うのはめちゃくちゃ楽しいな～！」
line = "「ウキキ♪　やっぱアポロと戦うのはめちゃくちゃ楽しいな～！」"

[[dialogue]]
speaker = "アポロ"
# 「そうか、実はあたしも同じだ！」
line = "「そうか、実はあたしも同じだ！」"

[[dialogue]]
speaker = "クーシェン"
# 「自分と同じくらい強いやつじゃないと、戦ってもつまんないしな！　強くてありがとな、アポロ！」
line = "「自分と同じくらい強いやつじゃないと、戦ってもつまんないしな！　強くてありがとな、アポロ！」"

[[dialogue]]
speaker = "アポロ"
# 「こっちこそ！　全力を出せる相手がいてくれてうれしいぞ！」
line = "「こっちこそ！　全力を出せる相手がいてくれてうれしいぞ！」"

[[dialogue]]
speaker = "クーシェン"
# 「戦うのって楽しいな！」
line = "「戦うのって楽しいな！」"

[[dialogue]]
speaker = "アポロ"
# 「ああ！」
line = "「ああ！」"

[[dialogue]]
speaker = "unk"
# 両者とも、とっておきの技をお見舞いするつもりのようだ。
line = "両者とも、とっておきの技をお見舞いするつもりのようだ。"

[[dialogue]]
speaker = "unk"
# 機を窺いながら、その瞬間に全神経を集中する。
line = "機を窺いながら、その瞬間に全神経を集中する。"

[[dialogue]]
speaker = "クーシェン"
# 「――今だ！！」
line = "「――今だ！！」"

[[dialogue]]
speaker = "マリオン"
# 「時間です！」
line = "「時間です！」"

[[dialogue]]
speaker = "unk"
# 終了を告げる合図が鳴った。
line = "終了を告げる合図が鳴った。"

[[dialogue]]
speaker = "unk"
# クーシェンとアポロの拳は……激突することなく、静止している。
line = "クーシェンとアポロの拳は……激突することなく、静止している。"

[[dialogue]]
speaker = "クーシェン"
# 「ちぇ～、また時間切れか～」
line = "「ちぇ～、また時間切れか～」"

[[dialogue]]
speaker = "アポロ"
# 「残念だけど引き分けだ」
line = "「残念だけど引き分けだ」"

[[dialogue]]
speaker = "クーシェン"
# 「次こそ絶対勝つ！」
line = "「次こそ絶対勝つ！」"

[[dialogue]]
speaker = "アポロ"
# 「それはこっちのセリフだ！」
line = "「それはこっちのセリフだ！」"

[[dialogue]]
speaker = "unk"
# 戦闘を中止したものの、２人はまだ一触即発。
line = "戦闘を中止したものの、２人はまだ一触即発。"

[[dialogue]]
speaker = "unk"
# きっかけがあれば、すぐにでも戦い始めそうな勢いだ。
line = "きっかけがあれば、すぐにでも戦い始めそうな勢いだ。"

[[dialogue]]
speaker = "クーシェン"
# 「あっ、にーにーだ！」
line = "「あっ、にーにーだ！」"

[[dialogue]]
speaker = "アポロ"
# 「フィオナとマリオンも……心配で見てたのか？」
line = "「フィオナとマリオンも……心配で見てたのか？」"

[[dialogue]]
speaker = "クーシェン"
# 「でも、ボク達はもう大丈夫だよ。メイドの心を教わったからさ」
line = "「でも、ボク達はもう大丈夫だよ。メイドの心を教わったからさ」"

[[dialogue]]
speaker = "アポロ"
# 「ルールは守る！　ヒーローもメイドも、そこは同じだぜ！」
line = "「ルールは守る！　ヒーローもメイドも、そこは同じだぜ！」"

[[dialogue]]
speaker = "クーシェン"
# 「それともう１つ。ボク達は女の子だから、常にエレガントを忘れずに……ってね♪」
line = "「それともう１つ。ボク達は女の子だから、常にエレガントを忘れずに……ってね♪」"

[[dialogue]]
speaker = "unk"
# 清々しい笑顔を浮かべながら、固い握手を交わす。
line = "清々しい笑顔を浮かべながら、固い握手を交わす。"

[[dialogue]]
speaker = "unk"
# その姿は、２人がメイド修行を経て、ひと回りもふた回りも成長したことを感じさせるものだった。
line = "その姿は、２人がメイド修行を経て、ひと回りもふた回りも成長したことを感じさせるものだった。"
