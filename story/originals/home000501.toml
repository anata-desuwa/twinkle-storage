[[dialogue]]
speaker = "ヘレナ（原作）"
# 「はぁい♪　『九浄ヘレナよ』♪」
line = "「はぁい♪　『九浄ヘレナよ』♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「『俺の知ってるヘレナちゃんと違う！』ってなった方は初めまして♪」
line = "「『俺の知ってるヘレナちゃんと違う！』ってなった方は初めまして♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「知ってるって人は、お久しぶり～♪」
line = "「知ってるって人は、お久しぶり～♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「私は『流星クルセイダース』の――」
line = "「私は『流星クルセイダース』の――」"

[[dialogue]]
speaker = "リア"
# 「――私、『九浄リア』のお姉ちゃんなんだ～♪」
line = "「――私、『九浄リア』のお姉ちゃんなんだ～♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そういうこと<emoji=heart04>　――えいっ<emoji=heart04>」
line = "「そういうこと<emoji=heart04>　――えいっ<emoji=heart04>」"

[[dialogue]]
speaker = "リア"
# 「きゃっ！？」
line = "「きゃっ！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ<emoji=heart04>　今日もリアの大きなおっぱいは柔らかくて、癒やされるわね～<emoji=heart04>」
line = "「ふふっ<emoji=heart04>　今日もリアの大きなおっぱいは柔らかくて、癒やされるわね～<emoji=heart04>」"

[[dialogue]]
speaker = "リア"
# 「ちょっとお姉ちゃん！　恥ずかしいから、イタズラで胸を触るのはやめて～！」
line = "「ちょっとお姉ちゃん！　恥ずかしいから、イタズラで胸を触るのはやめて～！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――とまぁ、こんな感じで、私たち２人は『流星町』の九浄家仲良し姉妹なのよ～♪」
line = "「――とまぁ、こんな感じで、私たち２人は『流星町』の九浄家仲良し姉妹なのよ～♪」"

[[dialogue]]
speaker = "リア"
# 「仲良しでも、胸を触っていいわけじゃないからね！？　もうっ！　ぷんぷん！」
line = "「仲良しでも、胸を触っていいわけじゃないからね！？　もうっ！　ぷんぷん！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あ～ん<emoji=heart04>　リアったら、頬を膨らませちゃって可愛いんだから～<emoji=heart04>」
line = "「あ～ん<emoji=heart04>　リアったら、頬を膨らませちゃって可愛いんだから～<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「それで、私がこうして顔出ししている以上、もうわかっちゃうとは思うんだけど――」
line = "「それで、私がこうして顔出ししている以上、もうわかっちゃうとは思うんだけど――」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「今回！　ついに、私も『ティンクルスターナイツ』の世界へお邪魔させてもらうことになったのよ～♪」
line = "「今回！　ついに、私も『ティンクルスターナイツ』の世界へお邪魔させてもらうことになったのよ～♪」"

[[dialogue]]
speaker = "リア"
# 「わ～♪　ぱちぱちぱち～♪」
line = "「わ～♪　ぱちぱちぱち～♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「それで、イベントの舞台となる場所は～」
line = "「それで、イベントの舞台となる場所は～」"

[[dialogue]]
speaker = "ルネア"
# 「ここは女神である、私の出番ね！　――それっ♪」
line = "「ここは女神である、私の出番ね！　――それっ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――夏の海が広がる『リゾート結界』よ～♪」
line = "「――夏の海が広がる『リゾート結界』よ～♪」"

[[dialogue]]
speaker = "リア"
# 「イェ～イっ♪」
line = "「イェ～イっ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そして、夏といえば、やっぱり水着よね！　というわけで～」
line = "「そして、夏といえば、やっぱり水着よね！　というわけで～」"

[[dialogue]]
speaker = "リア"
# 「水着フォームに、チェ～ンジっ♪」
line = "「水着フォームに、チェ～ンジっ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「元クルセイダースの私も、時を経て、ついにプレイアブルで参戦よ♪」
line = "「元クルセイダースの私も、時を経て、ついにプレイアブルで参戦よ♪」"

[[dialogue]]
speaker = "聖沙"
# 「もちろん、お姉様たちだけじゃないわ！」
line = "「もちろん、お姉様たちだけじゃないわ！」"

[[dialogue]]
speaker = "聖沙"
# 「私も水着フォームで登場するわよ！」
line = "「私も水着フォームで登場するわよ！」"

[[dialogue]]
speaker = "ナナカ"
# 「いやいや、同じ流星生徒会のメンバーとして、あたしたち２人も忘れてもらっちゃ困るよ～」
line = "「いやいや、同じ流星生徒会のメンバーとして、あたしたち２人も忘れてもらっちゃ困るよ～」"

[[dialogue]]
speaker = "ロロット"
# 「そうですよ～。だって今回は――」
line = "「そうですよ～。だって今回は――」"

[[dialogue]]
speaker = "ロロット"
# 「私たちクルセイダースが、４人揃って登場するのですから♪」
line = "「私たちクルセイダースが、４人揃って登場するのですから♪」"

[[dialogue]]
speaker = "ナナカ"
# 「そうそう♪　って、シンのことを忘れてない？」
line = "「そうそう♪　って、シンのことを忘れてない？」"

[[dialogue]]
speaker = "ロロット"
# 「あっ、いけません、そうでした～♪」
line = "「あっ、いけません、そうでした～♪」"

[[dialogue]]
speaker = "聖沙"
# 「そういえば、咲良クンの姿が見当たらないけど、どうしたのかしら？」
line = "「そういえば、咲良クンの姿が見当たらないけど、どうしたのかしら？」"

[[dialogue]]
speaker = "パッキー"
# 「シン様なら、ちょっと遅れてから来るって言ってたぜ」
line = "「シン様なら、ちょっと遅れてから来るって言ってたぜ」"

[[dialogue]]
speaker = "ロロット"
# 「会長さん、相変わらず間の悪い人ですね～」
line = "「会長さん、相変わらず間の悪い人ですね～」"

[[dialogue]]
speaker = "パッキー"
# 「あっ、もちろんこの俺様――大賢者パッキーも登場するぜ！」
line = "「あっ、もちろんこの俺様――大賢者パッキーも登場するぜ！」"

[[dialogue]]
speaker = "ルネア"
# 「私もこの『ルネアリゾート結界』を創造した女神として、華麗に降臨するわよ♪」
line = "「私もこの『ルネアリゾート結界』を創造した女神として、華麗に降臨するわよ♪」"

[[dialogue]]
speaker = "リア"
# 「というわけで――今回は私たち『流星クルセイダース』が揃ってお届けする水着イベント♪」
line = "「というわけで――今回は私たち『流星クルセイダース』が揃ってお届けする水着イベント♪」"

[[dialogue]]
speaker = "ロロット"
# 「ティンクルスターナイツ×ティンクル☆くるせいだーすコラボ、第３弾！」
line = "「ティンクルスターナイツ×ティンクル☆くるせいだーすコラボ、第３弾！」"

[[dialogue]]
speaker = "ナナカ"
# 「タイトルは、名づけて『<ruby=クロッシング>ＣＲＯＳＳＩＮＧ</ruby>　<ruby=サマー>ＳＵＭＭＥＲ</ruby>　<ruby=スターズ>ＳＴＡＲＳ</ruby>！！』」
line = "「タイトルは、名づけて『<ruby>ＣＲＯＳＳＩＮＧ<rt>クロッシング</rt></ruby>　<ruby>ＳＵＭＭＥＲ<rt>サマー</rt></ruby>　<ruby>ＳＴＡＲＳ<rt>スターズ</rt></ruby>！！』」"

[[dialogue]]
speaker = "聖沙"
# 「まもなくスタートよ！」
line = "「まもなくスタートよ！」"

[[dialogue]]
speaker = "４人"
# 「お楽しみに～♪」
line = "「お楽しみに～♪」"
