[[dialogue]]
speaker = "unk"
# 第３話,『ありのママに』,B
line = "第３話,『ありのママに』,B"

[[dialogue]]
speaker = "unk"
# その後、星徒会室を後にした一行は、シノの案内で広々とした会議室へやってくる。
line = "その後、星徒会室を後にした一行は、シノの案内で広々とした会議室へやってくる。"

[[dialogue]]
speaker = "unk"
# そこには聖庭園よりやってきた使節団の他に、警護役としてケイティ、ナターシャが随行していた。
line = "そこには聖庭園よりやってきた使節団の他に、警護役としてケイティ、ナターシャが随行していた。"

[[dialogue]]
speaker = "紅明"
# 「ほえー、聖庭園から来た議員さんってあの人たちかあ。めちゃめちゃ大人っぽい☆　綺麗だし華やかだし、いかにも天使って感じ～！」
line = "「ほえー、聖庭園から来た議員さんってあの人たちかあ。めちゃめちゃ大人っぽい☆　綺麗だし華やかだし、いかにも天使って感じ～！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「みんな和やかね。あの雰囲気なら、会談もうまくいきそうだわ」
line = "「みんな和やかね。あの雰囲気なら、会談もうまくいきそうだわ」"

[[dialogue]]
speaker = "unk"
# やがて会談が始まると紅明、セシアは会議室を退室する。
line = "やがて会談が始まると紅明、セシアは会議室を退室する。"

[[dialogue]]
speaker = "unk"
# するとケイティ、ナターシャら、先方の警護を担当していた者たちも一緒に廊下へと出てきた。
line = "するとケイティ、ナターシャら、先方の警護を担当していた者たちも一緒に廊下へと出てきた。"

[[dialogue]]
speaker = "紅明"
# 「あ、そうだセッシー☆　あの人たちはどうどう？　おしとやかで大人っぽいし、おっぱいも大きいし！」
line = "「あ、そうだセッシー☆　あの人たちはどうどう？　おしとやかで大人っぽいし、おっぱいも大きいし！」"

[[dialogue]]
speaker = "unk"
# 紅明が指し示したのはケイティだった。
line = "紅明が指し示したのはケイティだった。"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「……ここからじゃ少し遠いけれど、とても魅力的な人物に見えるわ」
line = "「……ここからじゃ少し遠いけれど、とても魅力的な人物に見えるわ」"

[[dialogue]]
speaker = "紅明"
# 「うっしっし♪　セッシーのママにもなってくれるんじゃない？」
line = "「うっしっし♪　セッシーのママにもなってくれるんじゃない？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それはわからないわ。とっても立派なお胸をしているけれど、大きいことが必ずしもバブみに繋がるとは限らないのよ。もちろん紅明ママのお胸は素晴らしいけれど」
line = "「それはわからないわ。とっても立派なお胸をしているけれど、大きいことが必ずしもバブみに繋がるとは限らないのよ。もちろん紅明ママのお胸は素晴らしいけれど」"

[[dialogue]]
speaker = "紅明"
# 「ま、セッシーのママ判定はあくまで話しかけるとっかかりってだけで、アタシ的には聖庭園の人たちとも友達になってみたいなってだけなんだけど☆」
line = "「ま、セッシーのママ判定はあくまで話しかけるとっかかりってだけで、アタシ的には聖庭園の人たちとも友達になってみたいなってだけなんだけど☆」"

[[dialogue]]
speaker = "unk"
# ２人が話しているところへ、輪から外れたケイティが歩み寄る。
line = "２人が話しているところへ、輪から外れたケイティが歩み寄る。"

[[dialogue]]
speaker = "紅明"
# 「お、セッシー！　こっちに来てくれたよ♪」
line = "「お、セッシー！　こっちに来てくれたよ♪」"

[[dialogue]]
speaker = "紅明"
# 「聖庭園の天使さん！　初めまして、アタシ牛紅明☆　新星学園の２年生だぜ！」
line = "「聖庭園の天使さん！　初めまして、アタシ牛紅明☆　新星学園の２年生だぜ！」"

[[dialogue]]
speaker = "ケイティ"
# 「ご丁寧にありがとうございます。はじめまして。聖庭園より参りました、ケイティと申します。どうぞよろしくお願いしますね～」
line = "「ご丁寧にありがとうございます。はじめまして。聖庭園より参りました、ケイティと申します。どうぞよろしくお願いしますね～」"

[[dialogue]]
speaker = "紅明"
# 「ケイティさん！　──じゃ、ケイちーさんですね☆」
line = "「ケイティさん！　──じゃ、ケイちーさんですね☆」"

[[dialogue]]
speaker = "ケイティ"
# 「ふふっ。ニックネームということでしょうか……親愛の情を深めるという意味であれば、大歓迎です～♪」
line = "「ふふっ。ニックネームということでしょうか……親愛の情を深めるという意味であれば、大歓迎です～♪」"

[[dialogue]]
speaker = "紅明"
# 「ありがとうございま～す☆　んで、こっちがアタシが仲良くしてる、守護天使のセッシー♪」
line = "「ありがとうございま～す☆　んで、こっちがアタシが仲良くしてる、守護天使のセッシー♪」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「守護天使のセシアよ。よろしくお願いするわ」
line = "「守護天使のセシアよ。よろしくお願いするわ」"

[[dialogue]]
speaker = "ケイティ"
# 「ええ、よろしくお願いします、セシア様。先だってのデネブでの戦いでは、ご挨拶もできず申し訳ございませんでした」
line = "「ええ、よろしくお願いします、セシア様。先だってのデネブでの戦いでは、ご挨拶もできず申し訳ございませんでした」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「じー……」
line = "「じー……」"

[[dialogue]]
speaker = "ケイティ"
# 「？」
line = "「？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「じーーーーーっ……」
line = "「じーーーーーっ……」"

[[dialogue]]
speaker = "ケイティ"
# 「あの、私がどうかしましたか？」
line = "「あの、私がどうかしましたか？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「いえ……なんでもないわ」
line = "「いえ……なんでもないわ」"

[[dialogue]]
speaker = "紅明"
# 「ありゃ、思ったより普通！？　おっとり優しそうな雰囲気に胸も大きい……てっきりママ判定待ったなしかと思ったのに」
line = "「ありゃ、思ったより普通！？　おっとり優しそうな雰囲気に胸も大きい……てっきりママ判定待ったなしかと思ったのに」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「確かにケイティからは器の大きさを感じるわ。でも、そこに無条件の肯定を感じないの。わかるかしら」
line = "「確かにケイティからは器の大きさを感じるわ。でも、そこに無条件の肯定を感じないの。わかるかしら」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「彼女の器は、他者を受け入れるのではなく、あくまで正しき道へ導くような……」
line = "「彼女の器は、他者を受け入れるのではなく、あくまで正しき道へ導くような……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それは母性というより、<ruby=しせい>姉性</ruby>というべき素質よ。もちろん、それもまた類まれなる天性の資質なのだけれど」
line = "「それは母性というより、<ruby>姉性<rt>しせい</rt></ruby>というべき素質よ。もちろん、それもまた類まれなる天性の資質なのだけれど」"

[[dialogue]]
speaker = "紅明"
# 「ウーン？　つまりはバブみオギャみより、お姉ちゃん属性が勝っているってこと？」
line = "「ウーン？　つまりはバブみオギャみより、お姉ちゃん属性が勝っているってこと？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「さすが紅明ママね！　まさにそういうことよ！」
line = "「さすが紅明ママね！　まさにそういうことよ！」"

[[dialogue]]
speaker = "ケイティ"
# 「確かに私はナターシャちゃん達からお姉ちゃんと呼ばれていますけれど……会ったばかりでそれを見抜くなんて！」
line = "「確かに私はナターシャちゃん達からお姉ちゃんと呼ばれていますけれど……会ったばかりでそれを見抜くなんて！」"

[[dialogue]]
speaker = "ケイティ"
# 「今日はお仕事ですから、そんな雰囲気は出していなかったはずなのに……」
line = "「今日はお仕事ですから、そんな雰囲気は出していなかったはずなのに……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふふふ。わたくしの眼には真実の姿が見えてしまうのよ」
line = "「ふふふ。わたくしの眼には真実の姿が見えてしまうのよ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ただ、今でこそケイティはお姉さんの属性が強いけれど、将来性は大したものよ。そこは誇っていいわ♪」
line = "「ただ、今でこそケイティはお姉さんの属性が強いけれど、将来性は大したものよ。そこは誇っていいわ♪」"

[[dialogue]]
speaker = "ケイティ"
# 「え、え～っと……？」
line = "「え、え～っと……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「紅明、さっきから何をわいわいやってるの？」
line = "「紅明、さっきから何をわいわいやってるの？」"

[[dialogue]]
speaker = "紅明"
# 「おっ。ナタりん！　チャオっす☆」
line = "「おっ。ナタりん！　チャオっす☆」"

[[dialogue]]
speaker = "ナターシャ"
# 「ナタりんって……まぁいいけど」
line = "「ナタりんって……まぁいいけど」"

[[dialogue]]
speaker = "紅明"
# 「ルヴィっち達の話し合いが終わるまで暇だからさ。友好を深めようかな～って☆」
line = "「ルヴィっち達の話し合いが終わるまで暇だからさ。友好を深めようかな～って☆」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そして、新しいママも探しているの。よろしくお願いするわね」
line = "「そして、新しいママも探しているの。よろしくお願いするわね」"

[[dialogue]]
speaker = "ナターシャ"
# 「またおかしなことをしてるね……で、ケイティ姉さんはお眼鏡に叶わなかったと」
line = "「またおかしなことをしてるね……で、ケイティ姉さんはお眼鏡に叶わなかったと」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「今はまだ、というだけよ。ママの将来性は十二分に感じられたわ♪　これからに期待ね」
line = "「今はまだ、というだけよ。ママの将来性は十二分に感じられたわ♪　これからに期待ね」"

[[dialogue]]
speaker = "ケイティ"
# 「ふふ。守護天使様のお墨付きですか。よくわかりませんが、ありがとうございます～♪」
line = "「ふふ。守護天使様のお墨付きですか。よくわかりませんが、ありがとうございます～♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「本当にそうなのかなー？」
line = "「本当にそうなのかなー？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「まあ。どういうことかしら？」
line = "「まあ。どういうことかしら？」"

[[dialogue]]
speaker = "ナターシャ"
# 「姉さんって、おっとりしててすごく優しそうに見えるけど……見た目に騙されない方がいいよ？　この人ほど怒らせたら怖い人はいないからさ」
line = "「姉さんって、おっとりしててすごく優しそうに見えるけど……見た目に騙されない方がいいよ？　この人ほど怒らせたら怖い人はいないからさ」"

[[dialogue]]
speaker = "ケイティ"
# 「そんなことありませんよ～。この世で１番大切なものは平和ですから。だからみんなで平和に仲良くしましょうね」
line = "「そんなことありませんよ～。この世で１番大切なものは平和ですから。だからみんなで平和に仲良くしましょうね」"

[[dialogue]]
speaker = "ナターシャ"
# 「まあ、姉さんが平和主義なのはその通りなんだけどね、ひとたびその平和を乱そうものならもう大変なことになるんだから」
line = "「まあ、姉さんが平和主義なのはその通りなんだけどね、ひとたびその平和を乱そうものならもう大変なことになるんだから」"

[[dialogue]]
speaker = "ナターシャ"
# 「単身で敵に突っ込んでいって、容赦なく壊滅させてくるんだ。それで、ついたあだ名が『制圧天使』」
line = "「単身で敵に突っ込んでいって、容赦なく壊滅させてくるんだ。それで、ついたあだ名が『制圧天使』」"

[[dialogue]]
speaker = "紅明"
# 「制圧天使！！　かっこいいぜ☆」
line = "「制圧天使！！　かっこいいぜ☆」"

[[dialogue]]
speaker = "ケイティ"
# 「もう、ナターシャちゃんったら……いつもそうやってお姉ちゃんのことをからかうんですから。お恥ずかしいです」
line = "「もう、ナターシャちゃんったら……いつもそうやってお姉ちゃんのことをからかうんですから。お恥ずかしいです」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「なるほど。ケイティの内に秘めた闘志が、ママに不釣り合いかもと言いたいのね？」
line = "「なるほど。ケイティの内に秘めた闘志が、ママに不釣り合いかもと言いたいのね？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「けれどそれは杞憂というものよ。ママというのは魂の形。大きな愛で包み込む包容力こそが肝要なの」
line = "「けれどそれは杞憂というものよ。ママというのは魂の形。大きな愛で包み込む包容力こそが肝要なの」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ケイティの大きな慈愛の心は、ママを構成するうえで必要不可欠なもの。わたくしのママセンサーは誤らないわ♪」
line = "「ケイティの大きな慈愛の心は、ママを構成するうえで必要不可欠なもの。わたくしのママセンサーは誤らないわ♪」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それはそれとして……わたくし、あなたの方も気になるわね」
line = "「それはそれとして……わたくし、あなたの方も気になるわね」"

[[dialogue]]
speaker = "ナターシャ"
# 「……私？」
line = "「……私？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「わたくしの背丈に合わせて、少しかがんで握手を求める気配り……ふふ、いいわね」
line = "「わたくしの背丈に合わせて、少しかがんで握手を求める気配り……ふふ、いいわね」"

[[dialogue]]
speaker = "紅明"
# 「およ？　もしかしてセッシー、むしろナタりんのほうにバブみを感じてる？」
line = "「およ？　もしかしてセッシー、むしろナタりんのほうにバブみを感じてる？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「同級生の紅明ママと、お姉ちゃん的存在であるケイティと、小さなわたくし……それぞれに柔軟に対応を変えられる細やかな気遣いの精神……」
line = "「同級生の紅明ママと、お姉ちゃん的存在であるケイティと、小さなわたくし……それぞれに柔軟に対応を変えられる細やかな気遣いの精神……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「まだ立場が伴っていない感じはあるけれど、これはプラス１ポイントね♪」
line = "「まだ立場が伴っていない感じはあるけれど、これはプラス１ポイントね♪」"

[[dialogue]]
speaker = "紅明"
# 「すごい！　いきなりのポイントゲットだぜ☆」
line = "「すごい！　いきなりのポイントゲットだぜ☆」"

[[dialogue]]
speaker = "ナターシャ"
# 「何が？」
line = "「何が？」"

[[dialogue]]
speaker = "紅明"
# 「ママポイントだぜ☆」
line = "「ママポイントだぜ☆」"

[[dialogue]]
speaker = "ナターシャ"
# 「もっと何が、なんだけど……」
line = "「もっと何が、なんだけど……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あなたのうちに宿る潜在ママ力のことよ。残念ながら即ママ判定とはならなかったけれど、ケイティと同じく、あなたからもポテンシャルを感じるわ！」
line = "「あなたのうちに宿る潜在ママ力のことよ。残念ながら即ママ判定とはならなかったけれど、ケイティと同じく、あなたからもポテンシャルを感じるわ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「潜在ママ力……一度も聞いたことのない単語が……」
line = "「潜在ママ力……一度も聞いたことのない単語が……」"

[[dialogue]]
speaker = "ケイティ"
# 「言われてみればナターシャちゃんはとっても面倒見がいいし、年下の女の子に好かれることが多かったわね」
line = "「言われてみればナターシャちゃんはとっても面倒見がいいし、年下の女の子に好かれることが多かったわね」"

[[dialogue]]
speaker = "ナターシャ"
# 「そ、そうだったっけ？」
line = "「そ、そうだったっけ？」"

[[dialogue]]
speaker = "紅明"
# 「隠そうとしても無駄だぜ！　セッシーはヒトの母性をすぐに見抜いちゃうからな☆」
line = "「隠そうとしても無駄だぜ！　セッシーはヒトの母性をすぐに見抜いちゃうからな☆」"

[[dialogue]]
speaker = "紅明"
# 「セッシーが反応したってことは、ナタりんは十分ママの素質ありってことだ」
line = "「セッシーが反応したってことは、ナタりんは十分ママの素質ありってことだ」"

[[dialogue]]
speaker = "ナターシャ"
# 「う～ん……自分じゃ全然ピンとは来ないけど」
line = "「う～ん……自分じゃ全然ピンとは来ないけど」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ママというのは理屈ではないわ。いつか時がくれば、きっとあなたも解るはずよ」
line = "「ママというのは理屈ではないわ。いつか時がくれば、きっとあなたも解るはずよ」"

[[dialogue]]
speaker = "ナターシャ"
# （守護天使じゃなかったら、完全に不審者だね。いや、守護天使であったとしても不審者であることには変わりないんだけど）
line = "（守護天使じゃなかったら、完全に不審者だね。いや、守護天使であったとしても不審者であることには変わりないんだけど）"

[[dialogue]]
speaker = "紅明"
# 「そだ、ナタりん☆　他にママっぽい人知らない？　セッシー、今日はたくさんママを探すぞって意気込んでるんだよ」
line = "「そだ、ナタりん☆　他にママっぽい人知らない？　セッシー、今日はたくさんママを探すぞって意気込んでるんだよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ママっぽい人ねぇ……先輩とか先生が思い浮かんじゃうけど、そういうことじゃないんでしょ？」
line = "「ママっぽい人ねぇ……先輩とか先生が思い浮かんじゃうけど、そういうことじゃないんでしょ？」"

[[dialogue]]
speaker = "紅明"
# 「だねえ。セッシー曰く、重要なのはその人の本質らしいから」
line = "「だねえ。セッシー曰く、重要なのはその人の本質らしいから」"

[[dialogue]]
speaker = "ナターシャ"
# 「……あ。そう言われたら、ちょっと思い当たる人がいるかも」
line = "「……あ。そう言われたら、ちょっと思い当たる人がいるかも」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「本当！？」
line = "「本当！？」"

[[dialogue]]
speaker = "ケイティ"
# 「聖庭園の子かしら？」
line = "「聖庭園の子かしら？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ううん、違うよ。ほら、選挙管理委員会の──」
line = "「ううん、違うよ。ほら、選挙管理委員会の──」"

[[dialogue]]
speaker = "ケイティ"
# 「ああ！　あの子ね～♪」
line = "「ああ！　あの子ね～♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「こっちが甘えちゃいたくなる母性？　みたいなのは持ってる気がするなぁ。別に私は甘えたりしないけど」
line = "「こっちが甘えちゃいたくなる母性？　みたいなのは持ってる気がするなぁ。別に私は甘えたりしないけど」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「話を聞いているだけでも口元が緩んでしまうわ！　ぜひその子を紹介してほしいのだけれど……！」
line = "「話を聞いているだけでも口元が緩んでしまうわ！　ぜひその子を紹介してほしいのだけれど……！」"

[[dialogue]]
speaker = "ナターシャ"
# 「んー、紹介してあげたいのはやまやまなんだけど、デネブの子だからね。つい最近まで新星学園に通ってたけど、今はこっちにいないんだ」
line = "「んー、紹介してあげたいのはやまやまなんだけど、デネブの子だからね。つい最近まで新星学園に通ってたけど、今はこっちにいないんだ」"

[[dialogue]]
speaker = "紅明"
# 「んー、残念☆」
line = "「んー、残念☆」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふ～む。ルヴィネさまがデネブに戻るのはいつ頃なのかしら？　向こうに戻る時も、案内と護衛の仕事を継続できないかしら？」
line = "「ふ～む。ルヴィネさまがデネブに戻るのはいつ頃なのかしら？　向こうに戻る時も、案内と護衛の仕事を継続できないかしら？」"

[[dialogue]]
speaker = "ナターシャ"
# （職権乱用では？　……今のデネブの守護天使は休眠中だから、一応移動の問題は解決してるんだっけ？）
line = "（職権乱用では？　……今のデネブの守護天使は休眠中だから、一応移動の問題は解決してるんだっけ？）"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「もっと詳しい話を聞きたいわ。その子はいったい──」
line = "「もっと詳しい話を聞きたいわ。その子はいったい──」"

[[dialogue]]
speaker = "unk"
# 目を輝かせるセシアだったが──会議室での会談が終わったのか、天界の使節団の人たちと、ルヴィネ、シノが出てくる。
line = "目を輝かせるセシアだったが──会議室での会談が終わったのか、天界の使節団の人たちと、ルヴィネ、シノが出てくる。"

[[dialogue]]
speaker = "ケイティ"
# 「あ──お話はここまでのようですね。短い時間でしたが楽しかったです」
line = "「あ──お話はここまでのようですね。短い時間でしたが楽しかったです」"

[[dialogue]]
speaker = "紅明"
# 「アタシらも楽しかったぜ☆　ありがとな、２人とも♪」
line = "「アタシらも楽しかったぜ☆　ありがとな、２人とも♪」"

[[dialogue]]
speaker = "ケイティ"
# 「私もしばらくは人間界に留まることになります。また会ってお話ができるといいですね～」
line = "「私もしばらくは人間界に留まることになります。また会ってお話ができるといいですね～」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そうね。また会いましょう」
line = "「そうね。また会いましょう」"

[[dialogue]]
speaker = "ナターシャ"
# 「じゃあね、２人とも」
line = "「じゃあね、２人とも」"

[[dialogue]]
speaker = "unk"
# ケイティとナターシャは使節団の所に向かう。
line = "ケイティとナターシャは使節団の所に向かう。"

[[dialogue]]
speaker = "ルヴィネ"
# 「さて、次は九浄家に向かうわ」
line = "「さて、次は九浄家に向かうわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「学園を離れるのね。了解よ、ルヴィネさま」
line = "「学園を離れるのね。了解よ、ルヴィネさま」"
