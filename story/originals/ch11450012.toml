[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「魔王……実は最近、悩んでいることがあるのだが……聞いてもらえるだろうか？」
line = "「魔王……実は最近、悩んでいることがあるのだが……聞いてもらえるだろうか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「その悩みというのは他でもない、今のこの私の姿についてなのだが……」
line = "「その悩みというのは他でもない、今のこの私の姿についてなのだが……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「知っての通り、この姿はアニマ殿からいただいた義体が、ルヴィネ様と契約することで変化したものだ」
line = "「知っての通り、この姿はアニマ殿からいただいた義体が、ルヴィネ様と契約することで変化したものだ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「新たな女神と深く繋がることで、我々守護天使にも何らかの変化が起こる可能性はあると予想はしていたものの……」
line = "「新たな女神と深く繋がることで、我々守護天使にも何らかの変化が起こる可能性はあると予想はしていたものの……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「まさかこんな姿になってしまうとは……」
line = "「まさかこんな姿になってしまうとは……」"

[[dialogue]]
speaker = "unk"
# でも、元の姿にも戻れるんだよね？
line = "でも、元の姿にも戻れるんだよね？"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ああ、自分の意思で元の姿と、この新しい姿を切り替えることが出来る」
line = "「ああ、自分の意思で元の姿と、この新しい姿を切り替えることが出来る」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「小さくなってしまったが、守護天使としての役目に支障はない」
line = "「小さくなってしまったが、守護天使としての役目に支障はない」"

[[dialogue]]
speaker = "unk"
# だったら何も問題ないのでは？
line = "だったら何も問題ないのでは？"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ん……そうなの、だが……」
line = "「ん……そうなの、だが……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「魔王よ。あなたはそれでいいのか？」
line = "「魔王よ。あなたはそれでいいのか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「私たちはつい先日、男女としてのお付き合いを始めたばかりではないか」
line = "「私たちはつい先日、男女としてのお付き合いを始めたばかりではないか」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そんな折、恋人がこんな姿になってしまったら……」
line = "「そんな折、恋人がこんな姿になってしまったら……」"

[[dialogue]]
speaker = "unk"
# 小さいヒメも可愛いよ
line = "小さいヒメも可愛いよ"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そうか、そうなのだろうな……そう思ってくれていることはわかってはいた……」
line = "「そうか、そうなのだろうな……そう思ってくれていることはわかってはいた……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「何しろこの姿の私と２人きりになると、決まってこうやってお膝の上に乗せようとする」
line = "「何しろこの姿の私と２人きりになると、決まってこうやってお膝の上に乗せようとする」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「口調も心なしか柔らかくなり、常に私の頭や羽を優しく撫でてくれている」
line = "「口調も心なしか柔らかくなり、常に私の頭や羽を優しく撫でてくれている」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「この姿の私のことを可愛いと思ってくれているから、そのようにしているのだとわかっている……」
line = "「この姿の私のことを可愛いと思ってくれているから、そのようにしているのだとわかっている……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「だからこそ心配なのだ！」
line = "「だからこそ心配なのだ！」"

[[dialogue]]
speaker = "unk"
# ……？　何が？
line = "……？　何が？"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「もしかしたら私は、魔王の性癖を歪めてしまったのではないか、と……」
line = "「もしかしたら私は、魔王の性癖を歪めてしまったのではないか、と……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「魔王だって最初は私が小さくなってしまった事に多少なりとも戸惑っていた。しかし、今は一切そんな気配がない」
line = "「魔王だって最初は私が小さくなってしまった事に多少なりとも戸惑っていた。しかし、今は一切そんな気配がない」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「それどころか私がこの姿で現れた瞬間、両手を広げて満面の笑顔で迎え、抱っこしてくれるようになった！」
line = "「それどころか私がこの姿で現れた瞬間、両手を広げて満面の笑顔で迎え、抱っこしてくれるようになった！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「このままでは魔王は小さい子にしか反応しない、そっちの趣味の持ち主になってしまうのではないか！？」
line = "「このままでは魔王は小さい子にしか反応しない、そっちの趣味の持ち主になってしまうのではないか！？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「しかも……しかもだ……」
line = "「しかも……しかもだ……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「私もどんどん慣れ始めている。魔王が両手を広げている姿を見ると、当たり前のようにお膝の上に乗ってしまっているのだ」
line = "「私もどんどん慣れ始めている。魔王が両手を広げている姿を見ると、当たり前のようにお膝の上に乗ってしまっているのだ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そして頭をよしよしされていると、もっともっとして欲しくて……魔王に甘えたくなってしまう……」
line = "「そして頭をよしよしされていると、もっともっとして欲しくて……魔王に甘えたくなってしまう……」"

[[dialogue]]
speaker = "unk"
# こんな風に？
line = "こんな風に？"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「うん……えへへ……<emoji=heart04>」
line = "「うん……えへへ……<emoji=heart04>」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「って違う！　撫でて欲しくて言ったわけではない！」
line = "「って違う！　撫でて欲しくて言ったわけではない！」"

[[dialogue]]
speaker = "unk"
# 違うの？
line = "違うの？"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「う……いや……撫でて欲しい、のは……いつだって撫でて欲しいのだが……」
line = "「う……いや……撫でて欲しい、のは……いつだって撫でて欲しいのだが……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「とにかく私もこの姿でいると魔王に甘えてしまうのだ！　大人の姿でいる時は、自分から甘えることが出来ないというのに！」
line = "「とにかく私もこの姿でいると魔王に甘えてしまうのだ！　大人の姿でいる時は、自分から甘えることが出来ないというのに！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「このままではいけない！　とてもではないが健全な関係とは言えない！」
line = "「このままではいけない！　とてもではないが健全な関係とは言えない！」"

[[dialogue]]
speaker = "unk"
# それがヒメの悩みか
line = "それがヒメの悩みか"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そうなのだ。私もどうにかこの循環を断ち切ろうと努力してみた……」
line = "「そうなのだ。私もどうにかこの循環を断ち切ろうと努力してみた……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「魔王に甘えたくなっても懸命に我慢した。だが愛する者の姿が目に入れば、甘えたい気持ちが湧き出てきてしまう」
line = "「魔王に甘えたくなっても懸命に我慢した。だが愛する者の姿が目に入れば、甘えたい気持ちが湧き出てきてしまう」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「けれど、大人の私では甘えることができない。でも甘えたい。心が揺れる──」
line = "「けれど、大人の私では甘えることができない。でも甘えたい。心が揺れる──」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そして気付けばこの姿になって、魔王の胸に飛び込んでしまっているのだ！　ああ魔王、守護天使でありながら私は何と弱いのだろう！」
line = "「そして気付けばこの姿になって、魔王の胸に飛び込んでしまっているのだ！　ああ魔王、守護天使でありながら私は何と弱いのだろう！」"

[[dialogue]]
speaker = "unk"
# 大人のヒメだって抱っこするよ？
line = "大人のヒメだって抱っこするよ？"

[[dialogue]]
speaker = "unk"
# 我慢しなくてもいいと思うけど
line = "我慢しなくてもいいと思うけど"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「っ……！！」
line = "「っ……！！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そ、それは……嬉しいが……少々はしたない行為ではないだろうか……？」
line = "「そ、それは……嬉しいが……少々はしたない行為ではないだろうか……？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「だが、そうだな……。魔王を特殊な趣味に堕としてしまうわけにはいかない……」
line = "「だが、そうだな……。魔王を特殊な趣味に堕としてしまうわけにはいかない……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「わかった。今度甘えたくなった時には、この姿に頼らず甘えさせてもらうことにしよう」
line = "「わかった。今度甘えたくなった時には、この姿に頼らず甘えさせてもらうことにしよう」"

[[dialogue]]
speaker = "unk"
# 決意を固めるヒメだった。
line = "決意を固めるヒメだった。"

[[dialogue]]
speaker = "unk"
# しかし──
line = "しかし──"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ま……魔王……」
line = "「ま……魔王……」"

[[dialogue]]
speaker = "unk"
# 勇気が出なかったか～
line = "勇気が出なかったか～"

[[dialogue]]
speaker = "unk"
# 顔を真っ赤にしたヒメは、小さい姿のままだった。
line = "顔を真っ赤にしたヒメは、小さい姿のままだった。"

[[dialogue]]
speaker = "unk"
# おいで、と両手を広げると、ヒメはベソをかきながら俺の胸に飛び込んできたのだった。
line = "おいで、と両手を広げると、ヒメはベソをかきながら俺の胸に飛び込んできたのだった。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「魔王ーーーっ！　不甲斐ない私を許してくれーーーっ！！」
line = "「魔王ーーーっ！　不甲斐ない私を許してくれーーーっ！！」"
