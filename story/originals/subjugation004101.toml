[[dialogue]]
speaker = "unk"
# ――とある平日の昼下がり。
line = "――とある平日の昼下がり。"

[[dialogue]]
speaker = "unk"
# 大小様々な厄介事が押し寄せる新星学園星徒会だが、その日は珍しく平穏だった。
line = "大小様々な厄介事が押し寄せる新星学園星徒会だが、その日は珍しく平穏だった。"

[[dialogue]]
speaker = "unk"
# 平和だなぁ
line = "平和だなぁ"

[[dialogue]]
speaker = "unk"
# 平和すぎてすることがないから、マトイ達には先に帰ってもらった。
line = "平和すぎてすることがないから、マトイ達には先に帰ってもらった。"

[[dialogue]]
speaker = "unk"
# たまにはこんな日があってもいい、などと考えていると……
line = "たまにはこんな日があってもいい、などと考えていると……"

[[dialogue]]
speaker = "女生徒"
# 「た、大変です緋宮会長！　アリーナに来て下さい！」
line = "「た、大変です緋宮会長！　アリーナに来て下さい！」"

[[dialogue]]
speaker = "unk"
# ……はい、平和終了。
line = "……はい、平和終了。"

[[dialogue]]
speaker = "unk"
# こうして、何事もない日常はあっけなく、いつもの刺激的な日常に戻るのだった。
line = "こうして、何事もない日常はあっけなく、いつもの刺激的な日常に戻るのだった。"

[[dialogue]]
speaker = "クーシェン"
# 「あっ、にーにーだ！」
line = "「あっ、にーにーだ！」"

[[dialogue]]
speaker = "アポロ"
# 「魔王！　おまえも来たのか！」
line = "「魔王！　おまえも来たのか！」"

[[dialogue]]
speaker = "unk"
# アリーナに駆けつけると、当事者と思しき２名が拘束されていた。
line = "アリーナに駆けつけると、当事者と思しき２名が拘束されていた。"

[[dialogue]]
speaker = "unk"
# クーシェンは孫悟空の生まれ変わりで、マリオンさんの案内で人間界にやって来た。現在は流星学園附属に通っている。
line = "クーシェンは孫悟空の生まれ変わりで、マリオンさんの案内で人間界にやって来た。現在は流星学園附属に通っている。"

[[dialogue]]
speaker = "unk"
# 一方のアポロも戦闘好きで、２人は仲良く模擬戦をしていたということだが……
line = "一方のアポロも戦闘好きで、２人は仲良く模擬戦をしていたということだが……"

[[dialogue]]
speaker = "クーシェン"
# 「ボクは何も悪くないよ！　アポロと戦ってただけだし」
line = "「ボクは何も悪くないよ！　アポロと戦ってただけだし」"

[[dialogue]]
speaker = "アポロ"
# 「そうだそうだー！　ここを使う予約だってしてるしなっ」
line = "「そうだそうだー！　ここを使う予約だってしてるしなっ」"

[[dialogue]]
speaker = "クーシェン"
# 「なのにマリオンがボク達をグルグル巻きにしてさぁ」
line = "「なのにマリオンがボク達をグルグル巻きにしてさぁ」"

[[dialogue]]
speaker = "マリオン"
# 「ごきげんよう、会長様♪　本日はお騒がせして申し訳ありません」
line = "「ごきげんよう、会長様♪　本日はお騒がせして申し訳ありません」"

[[dialogue]]
speaker = "unk"
# ２人を拘束したのは星見家メイド隊のマリオン・ネイマールさんだ。凄腕の人形遣いで、１０００体以上を同時に操ることが出来る。
line = "２人を拘束したのは星見家メイド隊のマリオン・ネイマールさんだ。凄腕の人形遣いで、１０００体以上を同時に操ることが出来る。"

[[dialogue]]
speaker = "フィオナ"
# 「マリオンさんがいてくれて助かったわ。私１人じゃ姉さんとクーシェンさんの戦闘を止めきれなかったもの」
line = "「マリオンさんがいてくれて助かったわ。私１人じゃ姉さんとクーシェンさんの戦闘を止めきれなかったもの」"

[[dialogue]]
speaker = "unk"
# いったい何があったの？
line = "いったい何があったの？"

[[dialogue]]
speaker = "unk"
# ただの模擬戦じゃないの？
line = "ただの模擬戦じゃないの？"

[[dialogue]]
speaker = "フィオナ"
# 「模擬戦自体は問題ないんですが、アリーナの利用時間を大幅にオーバーしていたので、他の利用者が使えずに困っていたんです」
line = "「模擬戦自体は問題ないんですが、アリーナの利用時間を大幅にオーバーしていたので、他の利用者が使えずに困っていたんです」"

[[dialogue]]
speaker = "マリオン"
# 「速やかに終了するようにフィオナお嬢様が再三警告しましたが、聞く耳持たずでしたので、強制的に拘束させて頂きました」
line = "「速やかに終了するようにフィオナお嬢様が再三警告しましたが、聞く耳持たずでしたので、強制的に拘束させて頂きました」"

[[dialogue]]
speaker = "クーシェン"
# 「くっそー！　こいつをほどけ～！　バトルの決着がまだついてないんだからさぁ！」
line = "「くっそー！　こいつをほどけ～！　バトルの決着がまだついてないんだからさぁ！」"

[[dialogue]]
speaker = "マリオン"
# 「うふふっ、駄目です♪」
line = "「うふふっ、駄目です♪」"

[[dialogue]]
speaker = "アポロ"
# 「……そっか、あたしはいけないことしちゃったのか……」
line = "「……そっか、あたしはいけないことしちゃったのか……」"

[[dialogue]]
speaker = "クーシェン"
# 「アポロ、なに反省しちゃってるのさ！　ボクとのバトル、すっごく楽しかったでしょ？」
line = "「アポロ、なに反省しちゃってるのさ！　ボクとのバトル、すっごく楽しかったでしょ？」"

[[dialogue]]
speaker = "アポロ"
# 「楽しかったけど、ルールは守んなきゃダメだ。悪役の怪人みたいなこと、あたしは絶対イヤだからな」
line = "「楽しかったけど、ルールは守んなきゃダメだ。悪役の怪人みたいなこと、あたしは絶対イヤだからな」"

[[dialogue]]
speaker = "フィオナ"
# 「さすが姉さん……まさに正義のヒーローです」
line = "「さすが姉さん……まさに正義のヒーローです」"

[[dialogue]]
speaker = "マリオン"
# 「それに比べてクーシェン様は反省の色なしですね。そもそも悪いことをしたという認識がなさそうですけれど」
line = "「それに比べてクーシェン様は反省の色なしですね。そもそも悪いことをしたという認識がなさそうですけれど」"

[[dialogue]]
speaker = "マリオン"
# 「彼女をこちらに連れてきたのは私ですから、責任を感じてしまいますね……」
line = "「彼女をこちらに連れてきたのは私ですから、責任を感じてしまいますね……」"

[[dialogue]]
speaker = "unk"
# 指導してあげるのはどうかな？
line = "指導してあげるのはどうかな？"

[[dialogue]]
speaker = "unk"
# マリオンさんが責任を持って
line = "マリオンさんが責任を持って"

[[dialogue]]
speaker = "マリオン"
# 「指導？　それはつまり、星見家メイド隊として？」
line = "「指導？　それはつまり、星見家メイド隊として？」"

[[dialogue]]
speaker = "マリオン"
# 「うふふふふっ、会長様、ナイスアイデアです。これを機にクーシェン様にはお淑やかさを学んで頂きましょう」
line = "「うふふふふっ、会長様、ナイスアイデアです。これを機にクーシェン様にはお淑やかさを学んで頂きましょう」"

[[dialogue]]
speaker = "フィオナ"
# 「大丈夫なの？　うちのメイド隊の指導はかなりハードだって聞いてるんだけど」
line = "「大丈夫なの？　うちのメイド隊の指導はかなりハードだって聞いてるんだけど」"

[[dialogue]]
speaker = "マリオン"
# 「問題ありません♪　ハードでなければ星見家の名に恥じぬメイドにはなれませんから」
line = "「問題ありません♪　ハードでなければ星見家の名に恥じぬメイドにはなれませんから」"

[[dialogue]]
speaker = "クーシェン"
# 「マリオンの顔が恐いってば！　ほんとにボクをメイドにするつもり？　そんなの絶対お断りだって！」
line = "「マリオンの顔が恐いってば！　ほんとにボクをメイドにするつもり？　そんなの絶対お断りだって！」"

[[dialogue]]
speaker = "アポロ"
# 「……あきらめるんだ、クーシェン。あたしは学んだんだ。うちのメイドがこうなったら、もう誰にも止められない」
line = "「……あきらめるんだ、クーシェン。あたしは学んだんだ。うちのメイドがこうなったら、もう誰にも止められない」"

[[dialogue]]
speaker = "クーシェン"
# 「アポロ？　あっさり諦めちゃうのか？　アポロ～～～～っ！」
line = "「アポロ？　あっさり諦めちゃうのか？　アポロ～～～～っ！」"

[[dialogue]]
speaker = "unk"
# こうしてクーシェンは星見家メイド隊のハードな修行を受けることになるのだった。
line = "こうしてクーシェンは星見家メイド隊のハードな修行を受けることになるのだった。"

[[dialogue]]
speaker = "unk"
# ――数日後、星見家にて。
line = "――数日後、星見家にて。"

[[dialogue]]
speaker = "フィオナ"
# 「来てくれてありがとうございます。発案者の緋宮会長には是非とも見届けて欲しかったので」
line = "「来てくれてありがとうございます。発案者の緋宮会長には是非とも見届けて欲しかったので」"

[[dialogue]]
speaker = "キリカ"
# 「急ごしらえにしては、なかなかよく出来たと言えるでしょう」
line = "「急ごしらえにしては、なかなかよく出来たと言えるでしょう」"

[[dialogue]]
speaker = "マリオン"
# 「うふふふっ、出てきなさい、見習いメイドとしてのお披露目ですよ」
line = "「うふふふっ、出てきなさい、見習いメイドとしてのお披露目ですよ」"

[[dialogue]]
speaker = "クーシェン"
# 「ま、待ってって。こんな格好で人前に出るの、恥ずかしいってば」
line = "「ま、待ってって。こんな格好で人前に出るの、恥ずかしいってば」"

[[dialogue]]
speaker = "アポロ"
# 「恥ずかしくないって！　めちゃくちゃ似合ってるぞ！」
line = "「恥ずかしくないって！　めちゃくちゃ似合ってるぞ！」"

[[dialogue]]
speaker = "クーシェン"
# 「こら、押すなっ」
line = "「こら、押すなっ」"

[[dialogue]]
speaker = "クーシェン"
# 「な、なんだよー、変なもの見たって顔しちゃってさ～」
line = "「な、なんだよー、変なもの見たって顔しちゃってさ～」"

[[dialogue]]
speaker = "unk"
# すごく可愛い
line = "すごく可愛い"

[[dialogue]]
speaker = "unk"
# クーシェンがメイドになってる
line = "クーシェンがメイドになってる"

[[dialogue]]
speaker = "クーシェン"
# 「ちょっ、にーにー……もう、なに言ってんのさ」
line = "「ちょっ、にーにー……もう、なに言ってんのさ」"

[[dialogue]]
speaker = "マリオン"
# 「胸を張りなさい。臨時の見習いとはいえ、あなたも星見家メイド隊の一員ですよ」
line = "「胸を張りなさい。臨時の見習いとはいえ、あなたも星見家メイド隊の一員ですよ」"

[[dialogue]]
speaker = "キリカ"
# 「背筋が曲がっていると、余計にみっともなく見えるものです」
line = "「背筋が曲がっていると、余計にみっともなく見えるものです」"

[[dialogue]]
speaker = "アポロ"
# 「ほら！　こんな感じにすればいいんだぞ！」
line = "「ほら！　こんな感じにすればいいんだぞ！」"

[[dialogue]]
speaker = "フィオナ"
# 「っっ！！！？　ね、姉さん……」
line = "「っっ！！！？　ね、姉さん……」"

[[dialogue]]
speaker = "フィオナ"
# 「あぁああっ<emoji=heart04>　メイド姿の姉さん、とってもとっても可愛すぎますっ<emoji=heart04>」
line = "「あぁああっ<emoji=heart04>　メイド姿の姉さん、とってもとっても可愛すぎますっ<emoji=heart04>」"

[[dialogue]]
speaker = "キリカ"
# 「フィオナお嬢様、出てはいけないものが漏れてらっしゃいますよ？」
line = "「フィオナお嬢様、出てはいけないものが漏れてらっしゃいますよ？」"

[[dialogue]]
speaker = "フィオナ"
# 「……はっ、ご、ごめんなさい、姉さんのメイド服姿が可愛すぎて、つい我を忘れてしまったわ」
line = "「……はっ、ご、ごめんなさい、姉さんのメイド服姿が可愛すぎて、つい我を忘れてしまったわ」"

[[dialogue]]
speaker = "フィオナ"
# 「こほん！　改めて、クーシェンさんと姉さんには、これから星見家メイド隊の見習いとして、厳しい修行を受けて頂きます」
line = "「こほん！　改めて、クーシェンさんと姉さんには、これから星見家メイド隊の見習いとして、厳しい修行を受けて頂きます」"

[[dialogue]]
speaker = "フィオナ"
# 「２人とも、しっかり励んで下さいね」
line = "「２人とも、しっかり励んで下さいね」"

[[dialogue]]
speaker = "unk"
# アポロもメイド修行するんだ？
line = "アポロもメイド修行するんだ？"

[[dialogue]]
speaker = "unk"
# クーシェンだけだと思ってたけど
line = "クーシェンだけだと思ってたけど"

[[dialogue]]
speaker = "アポロ"
# 「そうだぞ！」
line = "「そうだぞ！」"

[[dialogue]]
speaker = "クーシェン"
# 「てっきりボクだけに与えられた罰だと思ってたんだけどね～」
line = "「てっきりボクだけに与えられた罰だと思ってたんだけどね～」"

[[dialogue]]
speaker = "アポロ"
# 「それじゃふこーへーだろ？　アリーナの時間を守んなかったのはあたしも同じだしな」
line = "「それじゃふこーへーだろ？　アリーナの時間を守んなかったのはあたしも同じだしな」"

[[dialogue]]
speaker = "クーシェン"
# 「そうかもしんないけど、嫌じゃないの？」
line = "「そうかもしんないけど、嫌じゃないの？」"

[[dialogue]]
speaker = "アポロ"
# 「あはは、ちょびっと嫌だぞ。でも、修行は楽しみにしてる！」
line = "「あはは、ちょびっと嫌だぞ。でも、修行は楽しみにしてる！」"

[[dialogue]]
speaker = "クーシェン"
# 「ふうん……ボクはそこまで割り切れないや。メイド修行なんて、つまんなそうだしね」
line = "「ふうん……ボクはそこまで割り切れないや。メイド修行なんて、つまんなそうだしね」"

[[dialogue]]
speaker = "アポロ"
# 「やってみなきゃわかんないぞ！　それに、つらい修行も２人でやれば頑張れそうだろ？」
line = "「やってみなきゃわかんないぞ！　それに、つらい修行も２人でやれば頑張れそうだろ？」"

[[dialogue]]
speaker = "クーシェン"
# 「それは……うん、そうかも。だから助かるよ。ありがと、アポロ」
line = "「それは……うん、そうかも。だから助かるよ。ありがと、アポロ」"

[[dialogue]]
speaker = "アポロ"
# 「おう！　一緒に頑張ろうな！」
line = "「おう！　一緒に頑張ろうな！」"
