[[dialogue]]
speaker = "unk"
# 第４話,『守護天使と友情』,B
line = "第４話,『守護天使と友情』,B"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「まったく、オオヒメがいきなりコケたからビックリしたのだ！」
line = "「まったく、オオヒメがいきなりコケたからビックリしたのだ！」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「ふふ……小さくなってもオオヒメはオオヒメですね」
line = "「ふふ……小さくなってもオオヒメはオオヒメですね」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「うぐぐ……その事はもう掘り返さないでくれ」
line = "「うぐぐ……その事はもう掘り返さないでくれ」"

[[dialogue]]
speaker = "unk"
# 休憩時間になると、オオヒメのところにマグダレナとアルモタヘルがやってきた。
line = "休憩時間になると、オオヒメのところにマグダレナとアルモタヘルがやってきた。"

[[dialogue]]
speaker = "unk"
# ３人が同じクラスになるよう、ヘレナが手配したのだ。
line = "３人が同じクラスになるよう、ヘレナが手配したのだ。"

[[dialogue]]
speaker = "ナミエル"
# 「ヒメさんは守護天使ですから、お２人と知り合いなのは当然ですよね」
line = "「ヒメさんは守護天使ですから、お２人と知り合いなのは当然ですよね」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ああ。附属校に通うことにしたのもマグダレナに説得されたからだ」
line = "「ああ。附属校に通うことにしたのもマグダレナに説得されたからだ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ところで……ママダレナ？　アルモたん？　２人はナミエル殿に、そのような呼び方をさせているのか？」
line = "「ところで……ママダレナ？　アルモたん？　２人はナミエル殿に、そのような呼び方をさせているのか？」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「ええ、そうですよ～」
line = "「ええ、そうですよ～」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「オオヒメもアルモたんと呼んでいいのだ！」
line = "「オオヒメもアルモたんと呼んでいいのだ！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そんな気の抜ける呼び方はお断りだ」
line = "「そんな気の抜ける呼び方はお断りだ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ナミエル殿、２人が迷惑をかけている様で……私からも謝罪させて頂きたい」
line = "「ナミエル殿、２人が迷惑をかけている様で……私からも謝罪させて頂きたい」"

[[dialogue]]
speaker = "ナミエル"
# 「ええと……問題ありません。色々あってのこの呼び方ですから」
line = "「ええと……問題ありません。色々あってのこの呼び方ですから」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「そういうオオヒメも、ナミエルに『ヒメさん』と呼ばせているのだ！」
line = "「そういうオオヒメも、ナミエルに『ヒメさん』と呼ばせているのだ！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「オオヒメ様、では堅苦しいと思ったからだ。私をヒメと略すのは別段不自然ではあるまい」
line = "「オオヒメ様、では堅苦しいと思ったからだ。私をヒメと略すのは別段不自然ではあるまい」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「アルモたんだって不自然ではないのだ！」
line = "「アルモたんだって不自然ではないのだ！」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「ママダレナだって不自然ではありませんよ？」
line = "「ママダレナだって不自然ではありませんよ？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「いや、アルモたんはともかくママダレナはおかしいだろう」
line = "「いや、アルモたんはともかくママダレナはおかしいだろう」"

[[dialogue]]
speaker = "ナミエル"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ん？　どうかしたか、ナミエル殿？」
line = "「ん？　どうかしたか、ナミエル殿？」"

[[dialogue]]
speaker = "ナミエル"
# 「あっ……申し訳ありません。皆様が話している様子を見ていると、不思議な気持ちになってしまいました」
line = "「あっ……申し訳ありません。皆様が話している様子を見ていると、不思議な気持ちになってしまいました」"

[[dialogue]]
speaker = "ナミエル"
# 「守護天使様と言えば世界の摂理を司る畏れ多き存在。それなのにまるで私と同年代の者が集まって話しているような錯覚を覚えてしまって……」
line = "「守護天使様と言えば世界の摂理を司る畏れ多き存在。それなのにまるで私と同年代の者が集まって話しているような錯覚を覚えてしまって……」"

[[dialogue]]
speaker = "ナミエル"
# 「と……これは失礼な発言でしたね。申し訳ありませんでした……」
line = "「と……これは失礼な発言でしたね。申し訳ありませんでした……」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「今ここにいる私たちは守護天使である前に、１人の附属生ですから、ナミエルの感想は間違っていませんよ」
line = "「今ここにいる私たちは守護天使である前に、１人の附属生ですから、ナミエルの感想は間違っていませんよ」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「何を言うのだ！　アルモたんはいつだって威厳たっぷりの畏れ多き存在なのだ！」
line = "「何を言うのだ！　アルモたんはいつだって威厳たっぷりの畏れ多き存在なのだ！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「最近のあなたは元の姿の時も、威厳があるかどうか甚だ怪しいが……いや、それを言うならマグダレナもセシアもそうか」
line = "「最近のあなたは元の姿の時も、威厳があるかどうか甚だ怪しいが……いや、それを言うならマグダレナもセシアもそうか」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「さっき盛大にすっころんで尊厳大破したオオヒメが何か言ってるのだ」
line = "「さっき盛大にすっころんで尊厳大破したオオヒメが何か言ってるのだ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ほ、掘り返さないでくれと言っているだろう！！」
line = "「ほ、掘り返さないでくれと言っているだろう！！」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「ところで今日はセシアがやってきませんね」
line = "「ところで今日はセシアがやってきませんね」"

[[dialogue]]
speaker = "ナミエル"
# 「そうですね。休憩時間になるとよく遊びにいらっしゃるのですが」
line = "「そうですね。休憩時間になるとよく遊びにいらっしゃるのですが」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ああ、セシアはおそらくルヴィネ様の面倒を見ているのだろう」
line = "「ああ、セシアはおそらくルヴィネ様の面倒を見ているのだろう」"

[[dialogue]]
speaker = "ナミエル"
# 「ルヴィネと言うと……極星学園の星徒会長ですか？　彼女がなぜ？」
line = "「ルヴィネと言うと……極星学園の星徒会長ですか？　彼女がなぜ？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「極星学園の附属校設立を計画しているそうだ。そのための視察として期間限定でこちらの附属校に通う事になったのだ」
line = "「極星学園の附属校設立を計画しているそうだ。そのための視察として期間限定でこちらの附属校に通う事になったのだ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「これも私の時と同じく、マグダレナのごり押しだったのだがな」
line = "「これも私の時と同じく、マグダレナのごり押しだったのだがな」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「ふふっ♪　ルヴィネさまにも附属校の雰囲気を体験してもらいたかったんです～」
line = "「ふふっ♪　ルヴィネさまにも附属校の雰囲気を体験してもらいたかったんです～」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「それじゃあルヴィネさまは、セシアのクラスに入った、ということなのだ？」
line = "「それじゃあルヴィネさまは、セシアのクラスに入った、ということなのだ？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ええ」
line = "「ええ」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「む～、つまんないのだ！　どうせならみんな同じクラスに転入してきた方が楽しかったのだ！」
line = "「む～、つまんないのだ！　どうせならみんな同じクラスに転入してきた方が楽しかったのだ！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「『今回の編入は楽しむことが目的ではない』『附属校への編入はあくまで視察のためだから』と、何度も念押しして主張していたからな」
line = "「『今回の編入は楽しむことが目的ではない』『附属校への編入はあくまで視察のためだから』と、何度も念押しして主張していたからな」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「守護天使率の高いこのクラスに編入しなかったのも、その姿勢を崩したくなかったから、とのことだ」
line = "「守護天使率の高いこのクラスに編入しなかったのも、その姿勢を崩したくなかったから、とのことだ」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「ルヴィネさまもオオヒメと同じで、少し頭が固い気がするのだ」
line = "「ルヴィネさまもオオヒメと同じで、少し頭が固い気がするのだ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「私にはお前たちが少し緩すぎるように思うがな」
line = "「私にはお前たちが少し緩すぎるように思うがな」"

[[dialogue]]
speaker = "先生"
# 「では授業を始めます。教科書を開いてください」
line = "「では授業を始めます。教科書を開いてください」"

[[dialogue]]
speaker = "ナミエル"
# 「ヒメさんはまだ教科書をお持ちでないのですよね？　机を寄せていただけますか？」
line = "「ヒメさんはまだ教科書をお持ちでないのですよね？　机を寄せていただけますか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「こ、こうか？」
line = "「こ、こうか？」"

[[dialogue]]
speaker = "ナミエル"
# 「はい。では教科書、一緒に見ましょう」
line = "「はい。では教科書、一緒に見ましょう」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「感謝する、ナミエル殿」
line = "「感謝する、ナミエル殿」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （机を寄せ合って教科書を見せてもらう……やはりこれは王道の主人公とヒロイン展開だな）
line = "（机を寄せ合って教科書を見せてもらう……やはりこれは王道の主人公とヒロイン展開だな）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （いや、我々は女性同士であるのだから、友情を育むルートと言った方が正しいか？）
line = "（いや、我々は女性同士であるのだから、友情を育むルートと言った方が正しいか？）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （友情…………友情、か……）
line = "（友情…………友情、か……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （マグダレナやアルモタヘル、セシアにパテルにラクシャ……）
line = "（マグダレナやアルモタヘル、セシアにパテルにラクシャ……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （彼女らは共に女神を支える仲間であったが、果たしてそこに流れる感情は友情と呼ぶべきものなのか──）
line = "（彼女らは共に女神を支える仲間であったが、果たしてそこに流れる感情は友情と呼ぶべきものなのか──）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （それは分からない。今までそのようなこと、考えもしなかった……）
line = "（それは分からない。今までそのようなこと、考えもしなかった……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （実際に学園で生活を送ることで、そういった感情についても知ることが出来るのだろうか？）
line = "（実際に学園で生活を送ることで、そういった感情についても知ることが出来るのだろうか？）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （そしてナミエル殿や他のクラスメイトたちと、友情を感じ合える関係になることも……）
line = "（そしてナミエル殿や他のクラスメイトたちと、友情を感じ合える関係になることも……）"

[[dialogue]]
speaker = "ナミエル"
# 「ヒメさん？　もしかして何か分からないことがありますか？」
line = "「ヒメさん？　もしかして何か分からないことがありますか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ああ、いや……今のところは大丈夫だ、何とかついていけている」
line = "「ああ、いや……今のところは大丈夫だ、何とかついていけている」"

[[dialogue]]
speaker = "ナミエル"
# 「そうですか……分からない所がありましたらおっしゃってください、お教えしますので」
line = "「そうですか……分からない所がありましたらおっしゃってください、お教えしますので」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ありがとう。文系科目は問題ないと思うが、理数系にはやや自信がない。その時は助けて貰えるだろうか？」
line = "「ありがとう。文系科目は問題ないと思うが、理数系にはやや自信がない。その時は助けて貰えるだろうか？」"

[[dialogue]]
speaker = "ナミエル"
# 「はい、お任せください」
line = "「はい、お任せください」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （ナミエル殿は……本当に良い子だな）
line = "（ナミエル殿は……本当に良い子だな）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （確か星見家にメイドとして仕えているのだったな……それで普段から言葉遣いが丁寧なのか）
line = "（確か星見家にメイドとして仕えているのだったな……それで普段から言葉遣いが丁寧なのか）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （淡々とはしているが言葉に温かみがある。私のことを気遣ってくれている、その気持ちが伝わってくる……）
line = "（淡々とはしているが言葉に温かみがある。私のことを気遣ってくれている、その気持ちが伝わってくる……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （……なれるだろうか、私は……ナミエル殿と、友達に……）
line = "（……なれるだろうか、私は……ナミエル殿と、友達に……）"
