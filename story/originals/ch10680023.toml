[[dialogue]]
speaker = "unk"
# 第３話,３年生の邂逅と絵日記,P
line = "第３話,３年生の邂逅と絵日記,P"

[[dialogue]]
speaker = "unk"
# その日、リゾート結界で過ごしているリア先輩が、なにやらノートを広げて書き込んでいるのを見かけた。
line = "その日、リゾート結界で過ごしているリア先輩が、なにやらノートを広げて書き込んでいるのを見かけた。"

[[dialogue]]
speaker = "リア"
# 「――ふんふんふふ～ん♪」
line = "「――ふんふんふふ～ん♪」"

[[dialogue]]
speaker = "unk"
# リア先輩、何を書いているんですか？
line = "リア先輩、何を書いているんですか？"

[[dialogue]]
speaker = "リア"
# 「あっ、会長くん！　実はね～」
line = "「あっ、会長くん！　実はね～」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「おーっほっほっほ！　見つけましてよ♪」
line = "「おーっほっほっほ！　見つけましてよ♪」"

[[dialogue]]
speaker = "マハムート"
# 「少し邪魔をするわよ」
line = "「少し邪魔をするわよ」"

[[dialogue]]
speaker = "リア"
# 「え？　あなたたちは……？」
line = "「え？　あなたたちは……？」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「私は、流星寮の寮長を務めている流星学園３年生、<ruby=せんおんじ>千園寺</ruby>ヒルディオーネですわ！」
line = "「私は、流星寮の寮長を務めている流星学園３年生、<ruby>千園寺<rt>せんおんじ</rt></ruby>ヒルディオーネですわ！」"

[[dialogue]]
speaker = "マハムート"
# 「同じく、新星学園の３年生で、新星寮の寮長。<ruby=きりゅういん>妃竜院</ruby>マハムートよ」
line = "「同じく、新星学園の３年生で、新星寮の寮長。<ruby>妃竜院<rt>きりゅういん</rt></ruby>マハムートよ」"

[[dialogue]]
speaker = "リア"
# 「確か、こっちの学園の寮長さん２人って……」
line = "「確か、こっちの学園の寮長さん２人って……」"

[[dialogue]]
speaker = "unk"
# 星騎士として、学園最強クラスのお２人です
line = "星騎士として、学園最強クラスのお２人です"

[[dialogue]]
speaker = "unk"
# 星徒会には所属してませんが
line = "星徒会には所属してませんが"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ですわ♪　本日ここへ来たのは――」
line = "「ですわ♪　本日ここへ来たのは――」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「異世界でリ・クリエを阻止したという、流星クルセイダースの３年生、九浄リア」
line = "「異世界でリ・クリエを阻止したという、流星クルセイダースの３年生、九浄リア」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「あなたの力を、この目で確かめに来ましたの」
line = "「あなたの力を、この目で確かめに来ましたの」"

[[dialogue]]
speaker = "マハムート"
# 「まあ、私の方は半分付き添いみたいなものだけどね」
line = "「まあ、私の方は半分付き添いみたいなものだけどね」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「そういうわけで、九浄リア。単刀直入に申し上げますわ――」
line = "「そういうわけで、九浄リア。単刀直入に申し上げますわ――」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「私たちと、戦闘で勝負ですわ！」
line = "「私たちと、戦闘で勝負ですわ！」"

[[dialogue]]
speaker = "リア"
# 「えっ！？　勝負……！？」
line = "「えっ！？　勝負……！？」"

[[dialogue]]
speaker = "unk"
# そうして、リア先輩は２人と順番に手合わせを行った。
line = "そうして、リア先輩は２人と順番に手合わせを行った。"

[[dialogue]]
speaker = "マハムート"
# 「――さすが、会長たちが強いと言っていただけあるわね」
line = "「――さすが、会長たちが強いと言っていただけあるわね」"

[[dialogue]]
speaker = "リア"
# 「いやいや！　２人の方こそすっごく強くて、さすが日々モンスターと戦ってる星騎士だなって思ったよ～」
line = "「いやいや！　２人の方こそすっごく強くて、さすが日々モンスターと戦ってる星騎士だなって思ったよ～」"

[[dialogue]]
speaker = "リア"
# 「でも、千園寺さんがバニー衣装に変身したのは、ビックリしちゃったな～」
line = "「でも、千園寺さんがバニー衣装に変身したのは、ビックリしちゃったな～」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「おーっほっほっほ♪　私は残念ながら、まだ水着フォームを持ってませんから、代わりにバニーフォームを使わせてもらいましたの♪」
line = "「おーっほっほっほ♪　私は残念ながら、まだ水着フォームを持ってませんから、代わりにバニーフォームを使わせてもらいましたの♪」"

[[dialogue]]
speaker = "マハムート"
# 「ミーティアフォームを使えばいいのに……」
line = "「ミーティアフォームを使えばいいのに……」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ふふっ、わかってませんわね、マム。相手に合わせるのが、淑女のドレスコードというものですわ♪」
line = "「ふふっ、わかってませんわね、マム。相手に合わせるのが、淑女のドレスコードというものですわ♪」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「それにしても、守護天使の霊力を引き出して戦うクルセイダースの力……実に見事でしたわ！」
line = "「それにしても、守護天使の霊力を引き出して戦うクルセイダースの力……実に見事でしたわ！」"

[[dialogue]]
speaker = "リア"
# 「ありがとう♪　最初は勝負を挑まれて驚いちゃったけど、手合わせできてよかったよ。強い人と戦うと、自分ももっと頑張ろうって思えるよね♪」
line = "「ありがとう♪　最初は勝負を挑まれて驚いちゃったけど、手合わせできてよかったよ。強い人と戦うと、自分ももっと頑張ろうって思えるよね♪」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「リア、私たちはもう、戦って力を認め合った仲。同じ３年生ですし、愛称で『ヒルディー』と呼んでくれて構いませんわ」
line = "「リア、私たちはもう、戦って力を認め合った仲。同じ３年生ですし、愛称で『ヒルディー』と呼んでくれて構いませんわ」"

[[dialogue]]
speaker = "マハムート"
# 「私のことも畏怖を込めて、マムと呼びなさい。ちなみに返事は『イエス・マム』よ」
line = "「私のことも畏怖を込めて、マムと呼びなさい。ちなみに返事は『イエス・マム』よ」"

[[dialogue]]
speaker = "リア"
# 「い、イエス・マム……？」
line = "「い、イエス・マム……？」"

[[dialogue]]
speaker = "unk"
# マムに返事する時、そう言ってるんだ
line = "マムに返事する時、そう言ってるんだ"

[[dialogue]]
speaker = "unk"
# 新星寮の寮生たちは
line = "新星寮の寮生たちは"

[[dialogue]]
speaker = "リア"
# 「そうなんだ。じゃあ――」
line = "「そうなんだ。じゃあ――」"

[[dialogue]]
speaker = "リア"
# 「イエス・マム～♪　ヒルディーちゃん、マムちゃん、改めてよろしくね♪」
line = "「イエス・マム～♪　ヒルディーちゃん、マムちゃん、改めてよろしくね♪」"

[[dialogue]]
speaker = "マハムート"
# 「畏怖が少し足りてない気がするけど……まあ、いいわ。よろしく、リア」
line = "「畏怖が少し足りてない気がするけど……まあ、いいわ。よろしく、リア」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「おーっほっほっほ♪　世界は違っても同志として、歓迎致しますわよ、リア♪」
line = "「おーっほっほっほ♪　世界は違っても同志として、歓迎致しますわよ、リア♪」"

[[dialogue]]
speaker = "unk"
# それから、流れでお茶会をすることになり、俺たちはビーチのテーブル席に４人で座っていた。
line = "それから、流れでお茶会をすることになり、俺たちはビーチのテーブル席に４人で座っていた。"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「――リア？　それは何を書いてますの？」
line = "「――リア？　それは何を書いてますの？」"

[[dialogue]]
speaker = "リア"
# 「あっ、これ？　実は、絵日記なんだ～」
line = "「あっ、これ？　実は、絵日記なんだ～」"

[[dialogue]]
speaker = "unk"
# リア先輩は再びノートを取り出して、色鉛筆を使い分けながら書き込んでいた。
line = "リア先輩は再びノートを取り出して、色鉛筆を使い分けながら書き込んでいた。"

[[dialogue]]
speaker = "マハムート"
# 「絵日記？」
line = "「絵日記？」"

[[dialogue]]
speaker = "リア"
# 「そう♪　子供の頃から続けてる、私の趣味なの～♪」
line = "「そう♪　子供の頃から続けてる、私の趣味なの～♪」"

[[dialogue]]
speaker = "リア"
# 「向こうの世界でも毎日書いてるんだけど、異世界に来てるでしょ？　だから思い出を忘れないように、いつもよりたくさん、スペシャル仕様で書いてるんだ～」
line = "「向こうの世界でも毎日書いてるんだけど、異世界に来てるでしょ？　だから思い出を忘れないように、いつもよりたくさん、スペシャル仕様で書いてるんだ～」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「素敵な趣味ですわね♪　よろしければ見せてもらっても？」
line = "「素敵な趣味ですわね♪　よろしければ見せてもらっても？」"

[[dialogue]]
speaker = "リア"
# 「うん、いいよ～♪　今ちょうど、ヒルディーちゃんとマムちゃんと知り合ったってことを書いてたの。ほら♪」
line = "「うん、いいよ～♪　今ちょうど、ヒルディーちゃんとマムちゃんと知り合ったってことを書いてたの。ほら♪」"

[[dialogue]]
speaker = "unk"
# そう言って、リア先輩は絵日記をテーブルの上に置き、俺たちに見せてくれる。
line = "そう言って、リア先輩は絵日記をテーブルの上に置き、俺たちに見せてくれる。"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「！　これは……！」
line = "「！　これは……！」"

[[dialogue]]
speaker = "マハムート"
# 「どれどれ……えっ」
line = "「どれどれ……えっ」"

[[dialogue]]
speaker = "unk"
# ここに描かれてる絵って……
line = "ここに描かれてる絵って……"

[[dialogue]]
speaker = "リア"
# 「ヒルディーちゃんと、マムちゃんだよ～♪」
line = "「ヒルディーちゃんと、マムちゃんだよ～♪」"

[[dialogue]]
speaker = "マハムート"
# 「…………どっちが？」
line = "「…………どっちが？」"

[[dialogue]]
speaker = "リア"
# 「あっ、わかりにくかったかな？　こっちがマムちゃん♪」
line = "「あっ、わかりにくかったかな？　こっちがマムちゃん♪」"

[[dialogue]]
speaker = "マハムート"
# 「これが……私……？」
line = "「これが……私……？」"

[[dialogue]]
speaker = "リア"
# 「うん♪　ちょっと可愛くアレンジしながら描いてみたんだ～♪」
line = "「うん♪　ちょっと可愛くアレンジしながら描いてみたんだ～♪」"

[[dialogue]]
speaker = "マハムート"
# 「ちょっと……？」
line = "「ちょっと……？」"

[[dialogue]]
speaker = "unk"
# マムが珍しく、引きつった表情を浮かべている。
line = "マムが珍しく、引きつった表情を浮かべている。"

[[dialogue]]
speaker = "unk"
# （こ、コメントしづらい……！）
line = "（こ、コメントしづらい……！）"

[[dialogue]]
speaker = "unk"
# ――その絵は、一言で言うなら。
line = "――その絵は、一言で言うなら。"

[[dialogue]]
speaker = "unk"
# センスが大変に『奇抜』であった。
line = "センスが大変に『奇抜』であった。"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「……リア、あなた――」
line = "「……リア、あなた――」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「絵のセンスが天才的ですわね……！」
line = "「絵のセンスが天才的ですわね……！」"

[[dialogue]]
speaker = "マハムート"
# 「えっ」
line = "「えっ」"

[[dialogue]]
speaker = "リア"
# 「そ、そうかな？　えへへ……♪」
line = "「そ、そうかな？　えへへ……♪」"

[[dialogue]]
speaker = "リア"
# 「自分ではよくわからなくて、周りからも絵柄が独特だって言われちゃうんだけどね～」
line = "「自分ではよくわからなくて、周りからも絵柄が独特だって言われちゃうんだけどね～」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「確かに独特ですけれど……これは本当に素晴らしいですわ！」
line = "「確かに独特ですけれど……これは本当に素晴らしいですわ！」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「私の父は芸術が好きで、私も幼い頃からよく、美術館に連れて行ってもらっておりましたの」
line = "「私の父は芸術が好きで、私も幼い頃からよく、美術館に連れて行ってもらっておりましたの」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ですから私、絵の知識は多少あるのですが……この絵には、解体と再構築――キュビズム的発想を感じますわ！」
line = "「ですから私、絵の知識は多少あるのですが……この絵には、解体と再構築――キュビズム的発想を感じますわ！」"

[[dialogue]]
speaker = "マハムート"
# （そうなの……！？）
line = "（そうなの……！？）"

[[dialogue]]
speaker = "リア"
# 「実はね、向こうの世界でも私の描いた絵をお姉ちゃんが勝手にコンクールに出して、それで賞をもらっちゃったりすることがあって……」
line = "「実はね、向こうの世界でも私の描いた絵をお姉ちゃんが勝手にコンクールに出して、それで賞をもらっちゃったりすることがあって……」"

[[dialogue]]
speaker = "マハムート"
# （本当に……！？）
line = "（本当に……！？）"

[[dialogue]]
speaker = "リア"
# 「私は好きに描いてるだけだから、自信があるわけじゃなくて、ちょっと恥ずかしくなっちゃうんだけどね～」
line = "「私は好きに描いてるだけだから、自信があるわけじゃなくて、ちょっと恥ずかしくなっちゃうんだけどね～」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「リア、自信を持ちなさいな！　この千園寺ヒルディオーネが断言致しますわ――」
line = "「リア、自信を持ちなさいな！　この千園寺ヒルディオーネが断言致しますわ――」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「あなたの絵のセンスは、天才ですの！」
line = "「あなたの絵のセンスは、天才ですの！」"

[[dialogue]]
speaker = "リア"
# 「ヒルディーちゃん……！　ありがとう♪」
line = "「ヒルディーちゃん……！　ありがとう♪」"

[[dialogue]]
speaker = "リア"
# 「私、もう少し絵を勉強して、頑張ってみようかな♪」
line = "「私、もう少し絵を勉強して、頑張ってみようかな♪」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ええ！　磨けば必ず光る、宝石の原石ですわ♪　ねぇ、マムや会長もそう思いますでしょう？」
line = "「ええ！　磨けば必ず光る、宝石の原石ですわ♪　ねぇ、マムや会長もそう思いますでしょう？」"

[[dialogue]]
speaker = "マハムート"
# 「えっ」
line = "「えっ」"

[[dialogue]]
speaker = "マハムート"
# 「…………そ、そうね」
line = "「…………そ、そうね」"

[[dialogue]]
speaker = "マハムート"
# 「いいと思うわ……うん。コンクールで実際に賞を取るくらいだもの」
line = "「いいと思うわ……うん。コンクールで実際に賞を取るくらいだもの」"

[[dialogue]]
speaker = "unk"
# ヒルディオーネ先輩が褒めるくらいですし！
line = "ヒルディオーネ先輩が褒めるくらいですし！"

[[dialogue]]
speaker = "unk"
# そ、そうですね！
line = "そ、そうですね！"

[[dialogue]]
speaker = "リア"
# 「えへへ<emoji=heart04>　２人とも、ありがとう♪」
line = "「えへへ<emoji=heart04>　２人とも、ありがとう♪」"

[[dialogue]]
speaker = "マハムート"
# （わからないけど……見栄を張ってしまったわ……）
line = "（わからないけど……見栄を張ってしまったわ……）"

[[dialogue]]
speaker = "unk"
# 俺とマムは１度視線を見合わせてから、リア先輩の描いた絵とにらめっこしつつ――
line = "俺とマムは１度視線を見合わせてから、リア先輩の描いた絵とにらめっこしつつ――"

[[dialogue]]
speaker = "unk"
# 芸術って、奥が深いな……としみじみ思うのだった。
line = "芸術って、奥が深いな……としみじみ思うのだった。"
