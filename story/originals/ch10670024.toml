[[dialogue]]
speaker = "unk"
# 第４話,また勝負する日まで,P
line = "第４話,また勝負する日まで,P"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースが元の世界へ帰る前日。
line = "流星クルセイダースが元の世界へ帰る前日。"

[[dialogue]]
speaker = "unk"
# 聖沙は、今回仲良くなった梨緒のもとを訪ねていた。
line = "聖沙は、今回仲良くなった梨緒のもとを訪ねていた。"

[[dialogue]]
speaker = "梨緒"
# 「――そうか。もう帰ってしまうんだな」
line = "「――そうか。もう帰ってしまうんだな」"

[[dialogue]]
speaker = "聖沙"
# 「ええ。せっかく仲良くなれたのに、残念だけど……」
line = "「ええ。せっかく仲良くなれたのに、残念だけど……」"

[[dialogue]]
speaker = "梨緒"
# 「……聖沙、実は、聞いておきたかったことがあるんだ」
line = "「……聖沙、実は、聞いておきたかったことがあるんだ」"

[[dialogue]]
speaker = "聖沙"
# 「なにかしら……？」
line = "「なにかしら……？」"

[[dialogue]]
speaker = "梨緒"
# 「キミは私と同じで、よく相手に『勝負』を挑むだろう？」
line = "「キミは私と同じで、よく相手に『勝負』を挑むだろう？」"

[[dialogue]]
speaker = "梨緒"
# 「それは聖沙にとってなんの為に勝負をしているのか、知りたかったんだ」
line = "「それは聖沙にとってなんの為に勝負をしているのか、知りたかったんだ」"

[[dialogue]]
speaker = "聖沙"
# 「そっか……私たちが似た者同士だからこそ、そこは気になるわよね」
line = "「そっか……私たちが似た者同士だからこそ、そこは気になるわよね」"

[[dialogue]]
speaker = "聖沙"
# 「……私がよく勝負を挑むのは、もともとは両親に誇れるような自分になりたかったからなの」
line = "「……私がよく勝負を挑むのは、もともとは両親に誇れるような自分になりたかったからなの」"

[[dialogue]]
speaker = "聖沙"
# 「私の両親は共働きで、帰りが遅いことが多くて……」
line = "「私の両親は共働きで、帰りが遅いことが多くて……」"

[[dialogue]]
speaker = "聖沙"
# 「だから、１人でもちゃんとやれてるって、心配させないようにしたかった」
line = "「だから、１人でもちゃんとやれてるって、心配させないようにしたかった」"

[[dialogue]]
speaker = "聖沙"
# 「成績とか、何かで１位を取るとか……そういう形で、『私は大丈夫よ』って、安心してもらいたかったのよ」
line = "「成績とか、何かで１位を取るとか……そういう形で、『私は大丈夫よ』って、安心してもらいたかったのよ」"

[[dialogue]]
speaker = "聖沙"
# 「まあ、もちろん、私の気質が『負けず嫌い』だっていうのはあるけど――」
line = "「まあ、もちろん、私の気質が『負けず嫌い』だっていうのはあるけど――」"

[[dialogue]]
speaker = "聖沙"
# 「でも、それ以上に……私が勝負を挑むのは――きっと、不器用だからなんだと思うわ」
line = "「でも、それ以上に……私が勝負を挑むのは――きっと、不器用だからなんだと思うわ」"

[[dialogue]]
speaker = "聖沙"
# 「異世界の魔王――咲良クンに、私が勝負を挑み続けているのも……」
line = "「異世界の魔王――咲良クンに、私が勝負を挑み続けているのも……」"

[[dialogue]]
speaker = "聖沙"
# 「今まで男の子と仲良く接する機会があまりなくて……気恥ずかしかったから」
line = "「今まで男の子と仲良く接する機会があまりなくて……気恥ずかしかったから」"

[[dialogue]]
speaker = "聖沙"
# 「でも、勝負をしていると……上手く言葉が交わせなくても、相手のことが少しずつ見えてくるでしょ？」
line = "「でも、勝負をしていると……上手く言葉が交わせなくても、相手のことが少しずつ見えてくるでしょ？」"

[[dialogue]]
speaker = "聖沙"
# 「あっ、いや！　だからって別に、咲良クンと仲良くなりたかったとか、そういうわけじゃないんだけどね！？」
line = "「あっ、いや！　だからって別に、咲良クンと仲良くなりたかったとか、そういうわけじゃないんだけどね！？」"

[[dialogue]]
speaker = "梨緒"
# 「ふふっ……そうか」
line = "「ふふっ……そうか」"

[[dialogue]]
speaker = "聖沙"
# 「り、梨緒ったら、なに笑ってるのよ、もうっ……！」
line = "「り、梨緒ったら、なに笑ってるのよ、もうっ……！」"

[[dialogue]]
speaker = "聖沙"
# 「……コホン。つ、つまるところ――」
line = "「……コホン。つ、つまるところ――」"

[[dialogue]]
speaker = "聖沙"
# 「私にとって『勝負』は……相手と分かり合うための『魔法』みたいなものなのよ」
line = "「私にとって『勝負』は……相手と分かり合うための『魔法』みたいなものなのよ」"

[[dialogue]]
speaker = "梨緒"
# 「魔法……か」
line = "「魔法……か」"

[[dialogue]]
speaker = "梨緒"
# 「……ふふっ。確かに、そうかもしれないな」
line = "「……ふふっ。確かに、そうかもしれないな」"

[[dialogue]]
speaker = "梨緒"
# 「この前泊まった時に、ジグの話はしたと思うが……」
line = "「この前泊まった時に、ジグの話はしたと思うが……」"

[[dialogue]]
speaker = "梨緒"
# 「私も諦めずに、彼女と勝負をし続けたことで、私はリクリエから彼女を救い出すことができた」
line = "「私も諦めずに、彼女と勝負をし続けたことで、私はリクリエから彼女を救い出すことができた」"

[[dialogue]]
speaker = "梨緒"
# 「それに、会長との御前試合や、新星星徒会と選挙管理委員会で競ったクイズ大会……」
line = "「それに、会長との御前試合や、新星星徒会と選挙管理委員会で競ったクイズ大会……」"

[[dialogue]]
speaker = "梨緒"
# 「そういう勝負があったからこそ、仲間としての絆を得られたような気がする」
line = "「そういう勝負があったからこそ、仲間としての絆を得られたような気がする」"

[[dialogue]]
speaker = "梨緒"
# 「聖沙、キミとも――勝負することで、お互いがアナザーステラだと分かり合えたしな」
line = "「聖沙、キミとも――勝負することで、お互いがアナザーステラだと分かり合えたしな」"

[[dialogue]]
speaker = "聖沙"
# 「ええ。勝負して、正解だったわね♪」
line = "「ええ。勝負して、正解だったわね♪」"

[[dialogue]]
speaker = "梨緒"
# 「ああ。ポエムの勝負も……とても楽しかった」
line = "「ああ。ポエムの勝負も……とても楽しかった」"

[[dialogue]]
speaker = "梨緒"
# 「ありがとう、聖沙。私にとっても、『勝負』が大切なものだと再認識できたよ」
line = "「ありがとう、聖沙。私にとっても、『勝負』が大切なものだと再認識できたよ」"

[[dialogue]]
speaker = "聖沙"
# 「ふふっ、それならよかったわ♪　まあ、私も――」
line = "「ふふっ、それならよかったわ♪　まあ、私も――」"

[[dialogue]]
speaker = "聖沙"
# 「自分がどうして勝負したいのか、ちゃんと考えられるようになったのは最近になってからなんだけどね」
line = "「自分がどうして勝負したいのか、ちゃんと考えられるようになったのは最近になってからなんだけどね」"

[[dialogue]]
speaker = "梨緒"
# 「そうなのか？」
line = "「そうなのか？」"

[[dialogue]]
speaker = "聖沙"
# 「ええ。それもきっと、勝負し続けてきたから気づけたこと」
line = "「ええ。それもきっと、勝負し続けてきたから気づけたこと」"

[[dialogue]]
speaker = "梨緒"
# 「……異世界の魔王との勝負か？」
line = "「……異世界の魔王との勝負か？」"

[[dialogue]]
speaker = "聖沙"
# 「ま、まあね……！」
line = "「ま、まあね……！」"

[[dialogue]]
speaker = "聖沙"
# 「あ、でも言っとくけど、咲良クンとは、あくまで同じ生徒会の仲間として、少し分かり合えてきたってだけだからね！？」
line = "「あ、でも言っとくけど、咲良クンとは、あくまで同じ生徒会の仲間として、少し分かり合えてきたってだけだからね！？」"

[[dialogue]]
speaker = "聖沙"
# 「そ、そういう梨緒こそ……会長とはどうなの？　フィオナさんに聞いたけど、今も勝負を挑み続けているんでしょう？」
line = "「そ、そういう梨緒こそ……会長とはどうなの？　フィオナさんに聞いたけど、今も勝負を挑み続けているんでしょう？」"

[[dialogue]]
speaker = "梨緒"
# 「えっ！？　そ、それは……！　彼が魔王として暴走してしまった時に、それを止められるよう、同じくらい強くなっておく必要があるからで……！」
line = "「えっ！？　そ、それは……！　彼が魔王として暴走してしまった時に、それを止められるよう、同じくらい強くなっておく必要があるからで……！」"

[[dialogue]]
speaker = "梨緒"
# 「た、確かに今では信頼はしている……！　だがそれでも、彼が私を信じてくれているからこそ、それに応え続けたいというか……！」
line = "「た、確かに今では信頼はしている……！　だがそれでも、彼が私を信じてくれているからこそ、それに応え続けたいというか……！」"

[[dialogue]]
speaker = "梨緒"
# 「と、とにかく！　彼との勝負は、これからも必要なものなんだ……！」
line = "「と、とにかく！　彼との勝負は、これからも必要なものなんだ……！」"

[[dialogue]]
speaker = "聖沙"
# 「ふふっ♪　そう――」
line = "「ふふっ♪　そう――」"

[[dialogue]]
speaker = "聖沙"
# 「なら、応援してるわ。負けないように、頑張りなさい♪」
line = "「なら、応援してるわ。負けないように、頑張りなさい♪」"

[[dialogue]]
speaker = "梨緒"
# 「ああ、キミもな――異世界の魔王に勝てるように」
line = "「ああ、キミもな――異世界の魔王に勝てるように」"

[[dialogue]]
speaker = "聖沙"
# 「ええ、もちろん！」
line = "「ええ、もちろん！」"

[[dialogue]]
speaker = "unk"
# ――そして、聖沙が元の世界へ帰る当日。
line = "――そして、聖沙が元の世界へ帰る当日。"

[[dialogue]]
speaker = "梨緒"
# 「聖沙。よかった、間に合った」
line = "「聖沙。よかった、間に合った」"

[[dialogue]]
speaker = "聖沙"
# 「梨緒！　会いに来てくれたの？」
line = "「梨緒！　会いに来てくれたの？」"

[[dialogue]]
speaker = "梨緒"
# 「ああ。餞別を渡したくてな」
line = "「ああ。餞別を渡したくてな」"

[[dialogue]]
speaker = "聖沙"
# 「えっ……これって……！」
line = "「えっ……これって……！」"

[[dialogue]]
speaker = "梨緒"
# 「ぶちゃ猫のぬいぐるみポーチだ。気に入って、何度も見ていただろう？」
line = "「ぶちゃ猫のぬいぐるみポーチだ。気に入って、何度も見ていただろう？」"

[[dialogue]]
speaker = "聖沙"
# 「で、でも……！　それ、簡単には手に入らないって言ってたじゃない！」
line = "「で、でも……！　それ、簡単には手に入らないって言ってたじゃない！」"

[[dialogue]]
speaker = "梨緒"
# 「ああ。でも、手に入れようと思えば、今時はネットでも探せるし、なんとでもなる」
line = "「ああ。でも、手に入れようと思えば、今時はネットでも探せるし、なんとでもなる」"

[[dialogue]]
speaker = "梨緒"
# 「だが、キミの世界には……ぶちゃ猫は存在していないんだろう？」
line = "「だが、キミの世界には……ぶちゃ猫は存在していないんだろう？」"

[[dialogue]]
speaker = "梨緒"
# 「だから、これをキミにプレゼントしたいと思ったんだ」
line = "「だから、これをキミにプレゼントしたいと思ったんだ」"

[[dialogue]]
speaker = "聖沙"
# 「梨緒……いいの？」
line = "「梨緒……いいの？」"

[[dialogue]]
speaker = "梨緒"
# 「ああ。私たちはアナザーステラ――いや、それ以上に……」
line = "「ああ。私たちはアナザーステラ――いや、それ以上に……」"

[[dialogue]]
speaker = "梨緒"
# 「大切な友人だからな」
line = "「大切な友人だからな」"

[[dialogue]]
speaker = "聖沙"
# 「……梨緒！」
line = "「……梨緒！」"

[[dialogue]]
speaker = "聖沙"
# 「ありがとう……！　大切にするわ♪」
line = "「ありがとう……！　大切にするわ♪」"

[[dialogue]]
speaker = "梨緒"
# 「次に会えたら、また勝負しよう」
line = "「次に会えたら、また勝負しよう」"

[[dialogue]]
speaker = "聖沙"
# 「ええ、約束よ♪」
line = "「ええ、約束よ♪」"

[[dialogue]]
speaker = "unk"
# そうして２人は、最初の時よりも固く握手を交わすのだった。
line = "そうして２人は、最初の時よりも固く握手を交わすのだった。"
