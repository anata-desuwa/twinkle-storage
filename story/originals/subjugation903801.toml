[[dialogue]]
speaker = "unk"
# その日、俺は聖沙からリゾート結界に呼び出されていた。
line = "その日、俺は聖沙からリゾート結界に呼び出されていた。"

[[dialogue]]
speaker = "聖沙"
# 「ついに、この時がやって来たわ……」
line = "「ついに、この時がやって来たわ……」"

[[dialogue]]
speaker = "聖沙"
# 「再び異世界に来て、会長へのリベンジを果たす時が！」
line = "「再び異世界に来て、会長へのリベンジを果たす時が！」"

[[dialogue]]
speaker = "聖沙"
# 「今回は新しい力、水着フォームもあるから負けないわよ！」
line = "「今回は新しい力、水着フォームもあるから負けないわよ！」"

[[dialogue]]
speaker = "unk"
# ならば、俺も同じ力で受けて立とう！
line = "ならば、俺も同じ力で受けて立とう！"

[[dialogue]]
speaker = "聖沙"
# 「いいわ！　正々堂々――」
line = "「いいわ！　正々堂々――」"

[[dialogue]]
speaker = "聖沙"
# 「って、えっ！？　同じ力……！？」
line = "「って、えっ！？　同じ力……！？」"

[[dialogue]]
speaker = "unk"
# この『海パン』が、俺の水着フォームだ！！
line = "この『海パン』が、俺の水着フォームだ！！"

[[dialogue]]
speaker = "聖沙"
# 「なっ……！？　会長も水着フォームに変身できたの！？」
line = "「なっ……！？　会長も水着フォームに変身できたの！？」"

[[dialogue]]
speaker = "聖沙"
# 「くっ……やるわね……！」
line = "「くっ……やるわね……！」"

[[dialogue]]
speaker = "聖沙"
# 「けれど、同じ力を持っているなら、なおさら負けるわけにはいかないわ！」
line = "「けれど、同じ力を持っているなら、なおさら負けるわけにはいかないわ！」"

[[dialogue]]
speaker = "聖沙"
# 「同じ水着フォーム同士――いざ尋常に勝負よ！」
line = "「同じ水着フォーム同士――いざ尋常に勝負よ！」"
