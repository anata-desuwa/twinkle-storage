[[dialogue]]
speaker = "unk"
# 次の日。
line = "次の日。"

[[dialogue]]
speaker = "unk"
# ヨミは料理が苦手で指導できない為、代役が立つことになった。
line = "ヨミは料理が苦手で指導できない為、代役が立つことになった。"

[[dialogue]]
speaker = "蘭美"
# 「――というわけで、メイド長である私の出番よ！」
line = "「――というわけで、メイド長である私の出番よ！」"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ♪　よろしくお願いするであります、蘭美メイド長！」
line = "「ばうわふっ♪　よろしくお願いするであります、蘭美メイド長！」"

[[dialogue]]
speaker = "蘭美"
# 「任せなさい！　狛里が最速で最強の料理ができるように指導してあげるわ！」
line = "「任せなさい！　狛里が最速で最強の料理ができるように指導してあげるわ！」"

[[dialogue]]
speaker = "蘭美"
# 「ヨミ、あなたもそのうち自分で料理を教えられるように、ちゃんと見ておきなさい！」
line = "「ヨミ、あなたもそのうち自分で料理を教えられるように、ちゃんと見ておきなさい！」"

[[dialogue]]
speaker = "ヨミ"
# 「はいっ、学ばせて頂きます！」
line = "「はいっ、学ばせて頂きます！」"

[[dialogue]]
speaker = "ヘレナ"
# 「ヨミヨミ、狛里の様子はどうだ？」
line = "「ヨミヨミ、狛里の様子はどうだ？」"

[[dialogue]]
speaker = "ヨミ"
# 「あっ。ご当主様、お疲れ様です」
line = "「あっ。ご当主様、お疲れ様です」"

[[dialogue]]
speaker = "ヨミ"
# 「狛里さんはやる気があって、頑張っていると思います。今は煮物――『肉じゃが』を作っているところなんですが……」
line = "「狛里さんはやる気があって、頑張っていると思います。今は煮物――『肉じゃが』を作っているところなんですが……」"

[[dialogue]]
speaker = "蘭美"
# 「狛里、具材の切り方が雑よ！　速いのはいいことだけど、最初は丁寧に切ることから意識なさい！」
line = "「狛里、具材の切り方が雑よ！　速いのはいいことだけど、最初は丁寧に切ることから意識なさい！」"

[[dialogue]]
speaker = "狛里"
# 「はいっ！　かしこまりましたであります！」
line = "「はいっ！　かしこまりましたであります！」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふむ……」
line = "「ふむ……」"

[[dialogue]]
speaker = "ヘレナ"
# 「ヨミよ、少し耳を貸せ」
line = "「ヨミよ、少し耳を貸せ」"

[[dialogue]]
speaker = "ヨミ"
# 「はい、なんでしょうか？」
line = "「はい、なんでしょうか？」"

[[dialogue]]
speaker = "unk"
# ヨミがヘレナに近づき、耳を口元に寄せると……
line = "ヨミがヘレナに近づき、耳を口元に寄せると……"

[[dialogue]]
speaker = "ヘレナ"
# 「……狛里は作業スピードを上げすぎていて、今の自分の<ruby=キャパシティー>処理能力</ruby>を超える仕事をやろうとしてしまっている」
line = "「……狛里は作業スピードを上げすぎていて、今の自分の<ruby>処理能力<rt>キャパシティー</rt></ruby>を超える仕事をやろうとしてしまっている」"

[[dialogue]]
speaker = "ヨミ"
# 「……！」
line = "「……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「頑張るのはよいことだが、その結果、処理が追い付かずに小さなミスが発生してしまっている、であろう？」
line = "「頑張るのはよいことだが、その結果、処理が追い付かずに小さなミスが発生してしまっている、であろう？」"

[[dialogue]]
speaker = "unk"
# ヘレナの言葉に、ヨミは小さくうなずく。
line = "ヘレナの言葉に、ヨミは小さくうなずく。"

[[dialogue]]
speaker = "unk"
# どうやらヘレナは、ヨミがその問題点に気づきつつも、先輩として上手く指導しきれていないことまで見抜いているようだった。
line = "どうやらヘレナは、ヨミがその問題点に気づきつつも、先輩として上手く指導しきれていないことまで見抜いているようだった。"

[[dialogue]]
speaker = "ヘレナ"
# 「それが癖づいてしまうと、後々大きなミスに繋がってしまう可能性も、あるだろうな」
line = "「それが癖づいてしまうと、後々大きなミスに繋がってしまう可能性も、あるだろうな」"

[[dialogue]]
speaker = "ヨミ"
# 「やっぱり……そう、ですよね」
line = "「やっぱり……そう、ですよね」"

[[dialogue]]
speaker = "ヘレナ"
# 「だからヨミよ。教育係として、『それは良くないことだ』とちゃんと伝えておいてもらえるか？」
line = "「だからヨミよ。教育係として、『それは良くないことだ』とちゃんと伝えておいてもらえるか？」"

[[dialogue]]
speaker = "ヨミ"
# 「はい、わかりました！」
line = "「はい、わかりました！」"

[[dialogue]]
speaker = "ヘレナ"
# 「頼んだぞ」
line = "「頼んだぞ」"

[[dialogue]]
speaker = "unk"
# そう言ってヘレナはヨミの肩をポンと叩くと、柔らかく微笑んで、その場を去ってゆくのだった。
line = "そう言ってヘレナはヨミの肩をポンと叩くと、柔らかく微笑んで、その場を去ってゆくのだった。"

[[dialogue]]
speaker = "ヨミ"
# 「狛里さん、少しいいですか？」
line = "「狛里さん、少しいいですか？」"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ♪　ヨミ先輩、なんでありますか？」
line = "「ばうわふっ♪　ヨミ先輩、なんでありますか？」"

[[dialogue]]
speaker = "unk"
# 肉じゃがの調理が終わったタイミングを見計らい、ヨミは狛里に声をかける。
line = "肉じゃがの調理が終わったタイミングを見計らい、ヨミは狛里に声をかける。"

[[dialogue]]
speaker = "ヨミ"
# 「メイド長と料理を作っている様子を見させてもらっていたんですが……ちょっと気になることがありまして」
line = "「メイド長と料理を作っている様子を見させてもらっていたんですが……ちょっと気になることがありまして」"

[[dialogue]]
speaker = "狛里"
# 「気になること？」
line = "「気になること？」"

[[dialogue]]
speaker = "ヨミ"
# 「はい。狛里さんは……目の前の仕事を早く終わらせて、次の仕事に移ろうという意識が強いように思います」
line = "「はい。狛里さんは……目の前の仕事を早く終わらせて、次の仕事に移ろうという意識が強いように思います」"

[[dialogue]]
speaker = "ヨミ"
# 「その結果、小さなミスが出てしまっているのは……良くない傾向だと思うんです」
line = "「その結果、小さなミスが出てしまっているのは……良くない傾向だと思うんです」"

[[dialogue]]
speaker = "ヨミ"
# 「頑張ろうとしているのは伝わってきます」
line = "「頑張ろうとしているのは伝わってきます」"

[[dialogue]]
speaker = "ヨミ"
# 「でも、急ぎ過ぎているようにも見えて……」
line = "「でも、急ぎ過ぎているようにも見えて……」"

[[dialogue]]
speaker = "狛里"
# 「ごめんなさいなのです！」
line = "「ごめんなさいなのです！」"

[[dialogue]]
speaker = "狛里"
# 「でも――狛里、新人さんなのです。だから、誰よりもいっぱい頑張らなきゃって思うのです！」
line = "「でも――狛里、新人さんなのです。だから、誰よりもいっぱい頑張らなきゃって思うのです！」"

[[dialogue]]
speaker = "ヨミ"
# 「えっ……」
line = "「えっ……」"

[[dialogue]]
speaker = "狛里"
# 「もちろん、ミスは減らせるように頑張るのです！」
line = "「もちろん、ミスは減らせるように頑張るのです！」"

[[dialogue]]
speaker = "狛里"
# 「今ミスが多いのは、まだまだ狛里の頑張りが足らないからなのです！　頑張って頑張って、頑張れば！　狛里はもっとできるようになるのであります！」
line = "「今ミスが多いのは、まだまだ狛里の頑張りが足らないからなのです！　頑張って頑張って、頑張れば！　狛里はもっとできるようになるのであります！」"

[[dialogue]]
speaker = "ヨミ"
# 「……そう、ですね」
line = "「……そう、ですね」"

[[dialogue]]
speaker = "ヨミ"
# 「その気持ちは、とても大切だと思います」
line = "「その気持ちは、とても大切だと思います」"

[[dialogue]]
speaker = "ヨミ"
# 「だけど……その……」
line = "「だけど……その……」"

[[dialogue]]
speaker = "ヨミ"
# 「ミスだけは、気を付けて下さいね」
line = "「ミスだけは、気を付けて下さいね」"

[[dialogue]]
speaker = "狛里"
# 「はいっ、かしこまりましたであります！」
line = "「はいっ、かしこまりましたであります！」"

[[dialogue]]
speaker = "unk"
# 狛里は元気よく、ビシッと敬礼をしながら答えてみせるのだった。
line = "狛里は元気よく、ビシッと敬礼をしながら答えてみせるのだった。"

[[dialogue]]
speaker = "unk"
# 蘭美による料理指導が終わった後。
line = "蘭美による料理指導が終わった後。"

[[dialogue]]
speaker = "ヨミ"
# 「はあぁあぁ……」
line = "「はあぁあぁ……」"

[[dialogue]]
speaker = "蘭美"
# 「珍しく大きなため息じゃない！　どうかしたの、ヨミ？」
line = "「珍しく大きなため息じゃない！　どうかしたの、ヨミ？」"

[[dialogue]]
speaker = "ヨミ"
# 「あっ、メイド長」
line = "「あっ、メイド長」"

[[dialogue]]
speaker = "蘭美"
# 「料理指導の途中で狛里に声をかけていたみたいだけど……何かあったのかしら？」
line = "「料理指導の途中で狛里に声をかけていたみたいだけど……何かあったのかしら？」"

[[dialogue]]
speaker = "ヨミ"
# 「はい、実は……」
line = "「はい、実は……」"

[[dialogue]]
speaker = "unk"
# ヨミは先程の狛里とのやり取りを説明する。
line = "ヨミは先程の狛里とのやり取りを説明する。"

[[dialogue]]
speaker = "ヨミ"
# 「狛里さんは悪気があったわけじゃないと思うんです」
line = "「狛里さんは悪気があったわけじゃないと思うんです」"

[[dialogue]]
speaker = "ヨミ"
# 「でも私の言葉は、ちゃんと伝わっていない気がして……」
line = "「でも私の言葉は、ちゃんと伝わっていない気がして……」"

[[dialogue]]
speaker = "ヨミ"
# 「それなのに私、そこで強く言えませんでした」
line = "「それなのに私、そこで強く言えませんでした」"

[[dialogue]]
speaker = "蘭美"
# 「どうして？」
line = "「どうして？」"

[[dialogue]]
speaker = "ヨミ"
# 「その……もしかしたら、間違っているのは私なのかもって……」
line = "「その……もしかしたら、間違っているのは私なのかもって……」"

[[dialogue]]
speaker = "ヨミ"
# 「自分の言葉に自信が持てなくなっちゃったから、だと思います」
line = "「自分の言葉に自信が持てなくなっちゃったから、だと思います」"

[[dialogue]]
speaker = "ヨミ"
# 「元々、狛里さんに言わなくちゃって思ったのも、ご当主様から言われてのことでしたし……」
line = "「元々、狛里さんに言わなくちゃって思ったのも、ご当主様から言われてのことでしたし……」"

[[dialogue]]
speaker = "ヨミ"
# 「教育係なのに、情けないですよね……」
line = "「教育係なのに、情けないですよね……」"

[[dialogue]]
speaker = "蘭美"
# 「ふぅん……」
line = "「ふぅん……」"

[[dialogue]]
speaker = "蘭美"
# （ここで、ヨミにこうしなさいって、私が最速で具体案を提示してしまうのは可能だけれど……）
line = "（ここで、ヨミにこうしなさいって、私が最速で具体案を提示してしまうのは可能だけれど……）"

[[dialogue]]
speaker = "蘭美"
# （でもそれじゃ、ヨミの為にはならないわね）
line = "（でもそれじゃ、ヨミの為にはならないわね）"

[[dialogue]]
speaker = "蘭美"
# 「――なら、次はどうしたら伝わるか考えて、また挑戦してみなさい！」
line = "「――なら、次はどうしたら伝わるか考えて、また挑戦してみなさい！」"

[[dialogue]]
speaker = "蘭美"
# 「成功っていうのは何度も失敗して、それでも挑戦してこそ得られるものなんだから！」
line = "「成功っていうのは何度も失敗して、それでも挑戦してこそ得られるものなんだから！」"

[[dialogue]]
speaker = "蘭美"
# 「私が今日までメイドとして、最速で腕を磨き続けてきた上での持論だけどね♪」
line = "「私が今日までメイドとして、最速で腕を磨き続けてきた上での持論だけどね♪」"

[[dialogue]]
speaker = "unk"
# そう言って、若くして世界ナンバー２の実力を持つメイド長は、ヨミにウィンクをしてみせるのだった。
line = "そう言って、若くして世界ナンバー２の実力を持つメイド長は、ヨミにウィンクをしてみせるのだった。"
