line = "「息はある……みたいだけど。かなり危ない状況だね」"

[[dialogue]]
speaker = "メルエル"
# 「こんな、ひどい……絶対に許さない！」
line = "「こんな、ひどい……絶対に許さない！」"

[[dialogue]]
speaker = "ケイティ"
# 「天界を荒らす輩を見過ごすわけにはまいりません──制圧させていただきます！！」
line = "「天界を荒らす輩を見過ごすわけにはまいりません──制圧させていただきます！！」"
