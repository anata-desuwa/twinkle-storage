[[dialogue]]
speaker = "unk"
# 第１話,彼ピとお家デート,P
line = "第１話,彼ピとお家デート,P"

[[dialogue]]
speaker = "unk"
# 休日のとある昼下がり。恋人であるシュティレを俺の家へ招いた──
line = "休日のとある昼下がり。恋人であるシュティレを俺の家へ招いた──"

[[dialogue]]
speaker = "シュティレ"
# 「会長のお部屋に来るのは、これで何度目でしょうか。ふふふ、いつ来てもテンションが上がりますね。ぶいぶい」
line = "「会長のお部屋に来るのは、これで何度目でしょうか。ふふふ、いつ来てもテンションが上がりますね。ぶいぶい」"

[[dialogue]]
speaker = "unk"
# ゆっくりしていってくれ
line = "ゆっくりしていってくれ"

[[dialogue]]
speaker = "シュティレ"
# 「はい。そうさせていただきます。休日のお家デート。カップルの王道の過ごし方と言えましょう」
line = "「はい。そうさせていただきます。休日のお家デート。カップルの王道の過ごし方と言えましょう」"

[[dialogue]]
speaker = "unk"
# ところでちょっと気になるんだけど……
line = "ところでちょっと気になるんだけど……"

[[dialogue]]
speaker = "シュティレ"
# 「どうやらシュティレのこの衣装が気になるようですね。ぴょんぴょん」
line = "「どうやらシュティレのこの衣装が気になるようですね。ぴょんぴょん」"

[[dialogue]]
speaker = "シュティレ"
# 「なぜわざわざ変身したのか。その理由は──」
line = "「なぜわざわざ変身したのか。その理由は──」"

[[dialogue]]
speaker = "シュティレ"
# 「──気分です」
line = "「──気分です」"

[[dialogue]]
speaker = "unk"
# 気分なら仕方ないな
line = "気分なら仕方ないな"

[[dialogue]]
speaker = "シュティレ"
# 「はい。会長も、シュティレのノリに慣れてきたようですね。嬉しい限りです。ぶいぶい。あーんど、ぴょんぴょん、ぴょーん」
line = "「はい。会長も、シュティレのノリに慣れてきたようですね。嬉しい限りです。ぶいぶい。あーんど、ぴょんぴょん、ぴょーん」"

[[dialogue]]
speaker = "unk"
# ダッチとの共闘の際に獲得したという、シュティレの和風バニーフォーム。
line = "ダッチとの共闘の際に獲得したという、シュティレの和風バニーフォーム。"

[[dialogue]]
speaker = "unk"
# 普段のメカメカしい戦闘服とは雰囲気が大きく違う。恋人の色々な姿が見られるのは、彼氏冥利に尽きるというものだ。
line = "普段のメカメカしい戦闘服とは雰囲気が大きく違う。恋人の色々な姿が見られるのは、彼氏冥利に尽きるというものだ。"

[[dialogue]]
speaker = "シュティレ"
# 「会長、今日はバニーのシュティレとまったり過ごすとしましょう」
line = "「会長、今日はバニーのシュティレとまったり過ごすとしましょう」"

[[dialogue]]
speaker = "シュティレ"
# 「せっかくのバニーフォーム。なんなりとリクエストをください」
line = "「せっかくのバニーフォーム。なんなりとリクエストをください」"

[[dialogue]]
speaker = "シュティレ"
# 「写真撮影でも、膝枕で耳かきでも。一家に一台、閃光のシュティレはどんなおねだりでもばっちりお請けいたします」
line = "「写真撮影でも、膝枕で耳かきでも。一家に一台、閃光のシュティレはどんなおねだりでもばっちりお請けいたします」"

[[dialogue]]
speaker = "unk"
# じゃあ、写真を……！！
line = "じゃあ、写真を……！！"

[[dialogue]]
speaker = "シュティレ"
# 「イエス。ドリル和傘を構えますので、シュティレの可憐な勇姿でカメラロールを太らせてくださいませ」
line = "「イエス。ドリル和傘を構えますので、シュティレの可憐な勇姿でカメラロールを太らせてくださいませ」"

[[dialogue]]
speaker = "unk"
# ありがとう！！
line = "ありがとう！！"

[[dialogue]]
speaker = "unk"
# バニーのシュティレに向かって、夢中でＤＩＳＣのシャッターを切っていると──
line = "バニーのシュティレに向かって、夢中でＤＩＳＣのシャッターを切っていると──"

[[dialogue]]
speaker = "リノ"
# 「ただいま～。クロト、お腹すいてる？　職場でケーキの差し入れ貰っちゃって──」
line = "「ただいま～。クロト、お腹すいてる？　職場でケーキの差し入れ貰っちゃって──」"

[[dialogue]]
speaker = "unk"
# （まずい、シュティレはバニー姿だ……！）
line = "（まずい、シュティレはバニー姿だ……！）"

[[dialogue]]
speaker = "unk"
# 母さん！？
line = "母さん！？"

[[dialogue]]
speaker = "シュティレ"
# 「どうも。お邪魔しております、リノさん」
line = "「どうも。お邪魔しております、リノさん」"

[[dialogue]]
speaker = "リノ"
# 「あら？　シュティレちゃん、来てたのね。こんにちは～♪　シュティレちゃんもケーキ食べる？」
line = "「あら？　シュティレちゃん、来てたのね。こんにちは～♪　シュティレちゃんもケーキ食べる？」"

[[dialogue]]
speaker = "シュティレ"
# 「いただきます。ありがとうございます」
line = "「いただきます。ありがとうございます」"

[[dialogue]]
speaker = "リノ"
# 「うんうん。ちょっと待っててね～♪」
line = "「うんうん。ちょっと待っててね～♪」"

[[dialogue]]
speaker = "unk"
# いつのまに変身を……？
line = "いつのまに変身を……？"

[[dialogue]]
speaker = "シュティレ"
# 「リノさんにさっきの状況を見咎められると、会長がお叱りを受けるのではと判断したのです」
line = "「リノさんにさっきの状況を見咎められると、会長がお叱りを受けるのではと判断したのです」"

[[dialogue]]
speaker = "シュティレ"
# 「年下の、附属生の恋人にハレンチな衣装を着させているという疑いをもたれては不憫だなと。瞬時に変身を解きました」
line = "「年下の、附属生の恋人にハレンチな衣装を着させているという疑いをもたれては不憫だなと。瞬時に変身を解きました」"

[[dialogue]]
speaker = "シュティレ"
# 「シュティレは気配りもできる天使なのです。ぶいぶい」
line = "「シュティレは気配りもできる天使なのです。ぶいぶい」"

[[dialogue]]
speaker = "unk"
# ありがとう……！
line = "ありがとう……！"

[[dialogue]]
speaker = "シュティレ"
# 「では嬉し恥ずかしドキドキの撮影タイム、再開いたしましょう」
line = "「では嬉し恥ずかしドキドキの撮影タイム、再開いたしましょう」"

[[dialogue]]
speaker = "リノ"
# 「ごめんなさい、聞き忘れちゃった。シュティレちゃん、コーヒーと紅茶、どっちがいいかしら～？」
line = "「ごめんなさい、聞き忘れちゃった。シュティレちゃん、コーヒーと紅茶、どっちがいいかしら～？」"

[[dialogue]]
speaker = "シュティレ"
# 「コーヒーでお願いします。砂糖とミルクもいただけると幸いです」
line = "「コーヒーでお願いします。砂糖とミルクもいただけると幸いです」"

[[dialogue]]
speaker = "リノ"
# 「は～い。ありがと～♪」
line = "「は～い。ありがと～♪」"

[[dialogue]]
speaker = "unk"
# 変身の解除、早すぎない？？？
line = "変身の解除、早すぎない？？？"

[[dialogue]]
speaker = "シュティレ"
# 「スピードには自信がある星騎士ですので。ぶい」
line = "「スピードには自信がある星騎士ですので。ぶい」"

[[dialogue]]
speaker = "シュティレ"
# 「では会長。今度こそいちゃらぶタイム、再開です」
line = "「では会長。今度こそいちゃらぶタイム、再開です」"

[[dialogue]]
speaker = "unk"
# 母さんから貰ったケーキを食べた後も、俺はシュティレと楽しいひと時を過ごした。
line = "母さんから貰ったケーキを食べた後も、俺はシュティレと楽しいひと時を過ごした。"

[[dialogue]]
speaker = "unk"
# ギガンドムのアニメを一緒に見たり、今度遊びに行くイベント情報をチェックしたり……そして。
line = "ギガンドムのアニメを一緒に見たり、今度遊びに行くイベント情報をチェックしたり……そして。"

[[dialogue]]
speaker = "シュティレ"
# 「ふふふ。いかがでしょう、シュティレの膝枕と、この日のために作った特製のドリル耳かきは」
line = "「ふふふ。いかがでしょう、シュティレの膝枕と、この日のために作った特製のドリル耳かきは」"

[[dialogue]]
speaker = "unk"
# 見た目は怖いけど気持ちいい
line = "見た目は怖いけど気持ちいい"

[[dialogue]]
speaker = "シュティレ"
# 「そうでしょう。耳の穴を一切傷つけず、耳垢を的確にからめとる螺旋機構を搭載しています。ぶい」
line = "「そうでしょう。耳の穴を一切傷つけず、耳垢を的確にからめとる螺旋機構を搭載しています。ぶい」"

[[dialogue]]
speaker = "シュティレ"
# 「シュティレのダウナーボイスはＡＳＭＲとしても機能するはずです。どうぞ日頃の疲れを癒やしてくださいませ」
line = "「シュティレのダウナーボイスはＡＳＭＲとしても機能するはずです。どうぞ日頃の疲れを癒やしてくださいませ」"

[[dialogue]]
speaker = "unk"
# うとうと…………
line = "うとうと…………"

[[dialogue]]
speaker = "リノ"
# 「２人とも～。そろそろお夕飯の時間だけど──」
line = "「２人とも～。そろそろお夕飯の時間だけど──」"

[[dialogue]]
speaker = "シュティレ"
# 「──あ」
line = "「──あ」"

[[dialogue]]
speaker = "リノ"
# 「…………。ごめんなさい、間違えました～♪」
line = "「…………。ごめんなさい、間違えました～♪」"

[[dialogue]]
speaker = "シュティレ"
# 「……油断しました」
line = "「……油断しました」"

[[dialogue]]
speaker = "unk"
# 見られたーーーー！？！？
line = "見られたーーーー！？！？"

[[dialogue]]
speaker = "リノ"
# 「２人とも～。そろそろお夕飯の時間だけど、どうする～？」
line = "「２人とも～。そろそろお夕飯の時間だけど、どうする～？」"

[[dialogue]]
speaker = "シュティレ"
# 「どうも。お邪魔でなければ、ご一緒したいです」
line = "「どうも。お邪魔でなければ、ご一緒したいです」"

[[dialogue]]
speaker = "リノ"
# 「そう？　わかったわ、用意するわね！」
line = "「そう？　わかったわ、用意するわね！」"

[[dialogue]]
speaker = "リノ"
# 「あ～、びっくりした。まさか息子が、お付き合いしてる附属生の彼女に、バニー服を着させてるのかと思っちゃったわ……！」
line = "「あ～、びっくりした。まさか息子が、お付き合いしてる附属生の彼女に、バニー服を着させてるのかと思っちゃったわ……！」"

[[dialogue]]
speaker = "シュティレ"
# 「はっはっは。そんなはずないでしょう」
line = "「はっはっは。そんなはずないでしょう」"

[[dialogue]]
speaker = "unk"
# うんうん、そんなはずないから！
line = "うんうん、そんなはずないから！"

[[dialogue]]
speaker = "リノ"
# 「──なんて言うわけないでしょー！？　クロト、あなたね～～～！！」
line = "「──なんて言うわけないでしょー！？　クロト、あなたね～～～！！」"

[[dialogue]]
speaker = "unk"
# やっぱり誤魔化せなかったー！？
line = "やっぱり誤魔化せなかったー！？"

[[dialogue]]
speaker = "unk"
# いくらお付き合いしているからと言って節度を知りなさい、と俺は母さんにこんこんとお説教をされることになり……
line = "いくらお付き合いしているからと言って節度を知りなさい、と俺は母さんにこんこんとお説教をされることになり……"

[[dialogue]]
speaker = "シュティレ"
# 「今回の反省を生かし、次こそは完璧に誤魔化してみせましょう。ぶい」
line = "「今回の反省を生かし、次こそは完璧に誤魔化してみせましょう。ぶい」"

[[dialogue]]
speaker = "unk"
# マイペースなシュティレは、また違った方向に決意を固めているのだった──
line = "マイペースなシュティレは、また違った方向に決意を固めているのだった──"
