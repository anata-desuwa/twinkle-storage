line = "「今日はいつもより多いよ……んもぉ、会長さんってばミウに見られてたからって興奮しすぎぃ……ほらぁ、床にまで垂れちゃって──」"

[[dialogue]]
speaker = "ミウ"
# 「あっ！　カーペットに垂れたらシミがついちゃうっ！　セナリィ社長にバレちゃうよ！」
line = "「あっ！　カーペットに垂れたらシミがついちゃうっ！　セナリィ社長にバレちゃうよ！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「それはマズーいっ！　あぅぅ、腰抜けちゃって、動けないよーっ！」
line = "「それはマズーいっ！　あぅぅ、腰抜けちゃって、動けないよーっ！」"

[[dialogue]]
speaker = "unk"
# 余韻を味わう間もなく、俺たちは性行為の証拠隠滅を図る。
line = "余韻を味わう間もなく、俺たちは性行為の証拠隠滅を図る。"

[[dialogue]]
speaker = "ヒマワリ"
# 「壁にまで汁が飛んじゃってるーっ！　こんなに飛ぶんだねー」
line = "「壁にまで汁が飛んじゃってるーっ！　こんなに飛ぶんだねー」"

[[dialogue]]
speaker = "ミウ"
# 「セナリィ社長にバレないように綺麗にしておかなきゃ……くんくん……えっちな臭いもしちゃってるかも……」
line = "「セナリィ社長にバレないように綺麗にしておかなきゃ……くんくん……えっちな臭いもしちゃってるかも……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あんまり嗅がないでよー！　よし、消臭剤撒いておこう！　トイレの取ってくるー！」
line = "「あんまり嗅がないでよー！　よし、消臭剤撒いておこう！　トイレの取ってくるー！」"

[[dialogue]]
speaker = "unk"
# 我を忘れて、没頭していた後の事後処理に追われる俺たちだったが──
line = "我を忘れて、没頭していた後の事後処理に追われる俺たちだったが──"

[[dialogue]]
speaker = "ミウ"
# 「あの、会長さん……２人のセックス、とても刺激的でしたけど……」
line = "「あの、会長さん……２人のセックス、とても刺激的でしたけど……」"

[[dialogue]]
speaker = "ミウ"
# 「やっぱり実際に経験してみないとわからないことってあると思うんです。良かったら、私にもおち○ちん貸してもらえると──」
line = "「やっぱり実際に経験してみないとわからないことってあると思うんです。良かったら、私にもおち○ちん貸してもらえると──」"

[[dialogue]]
speaker = "クロト"
# 「ええぇっ！？」
line = "「ええぇっ！？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「こら、ミウーっ！　いきなり誘惑しないで！」
line = "「こら、ミウーっ！　いきなり誘惑しないで！」"

[[dialogue]]
speaker = "ミウ"
# 「あはは、冗談。こんなにラブラブな２人の間に割って入ろうとは思わないよ」
line = "「あはは、冗談。こんなにラブラブな２人の間に割って入ろうとは思わないよ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「だ、だったらいいんだけど……」
line = "「だ、だったらいいんだけど……」"

[[dialogue]]
speaker = "unk"
# そんな話をしながら、丹念に証拠を隠滅していく。
line = "そんな話をしながら、丹念に証拠を隠滅していく。"

[[dialogue]]
speaker = "unk"
# やがて、元々綺麗だったゴールデングースの事務所は一層きれいに片付いたのだった。
line = "やがて、元々綺麗だったゴールデングースの事務所は一層きれいに片付いたのだった。"
