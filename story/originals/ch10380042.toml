[[dialogue]]
speaker = "unk"
# 第２話,類は友を呼ぶ？,P
line = "第２話,類は友を呼ぶ？,P"

[[dialogue]]
speaker = "unk"
# イクシリオンとフロレンシアが保健委員会の活動日誌をつけていると、保健室にノックの音が響いた。
line = "イクシリオンとフロレンシアが保健委員会の活動日誌をつけていると、保健室にノックの音が響いた。"

[[dialogue]]
speaker = "イクシリオン"
# 「はい、どうぞ。お入りください」
line = "「はい、どうぞ。お入りください」"

[[dialogue]]
speaker = "ミヤハル"
# 「たのもー」
line = "「たのもー」"

[[dialogue]]
speaker = "シズル"
# 「お邪魔しますー」
line = "「お邪魔しますー」"

[[dialogue]]
speaker = "フロレンシア"
# 「え？　え？　どなたですか……？」
line = "「え？　え？　どなたですか……？」"

[[dialogue]]
speaker = "ミヤハル"
# 「うちは流星学園２年生の安倍野ミヤハルといいます。こう見えて、『陰陽師』の『選星者』やってます～。よろしゅう～」
line = "「うちは流星学園２年生の安倍野ミヤハルといいます。こう見えて、『陰陽師』の『選星者』やってます～。よろしゅう～」"

[[dialogue]]
speaker = "シズル"
# 「紫桜の里から参りました、せつなの師で鵜飼シズルと申します。いつもせつながお世話になってます」
line = "「紫桜の里から参りました、せつなの師で鵜飼シズルと申します。いつもせつながお世話になってます」"

[[dialogue]]
speaker = "イクシリオン"
# 「これはどうも。私は保健委員のイクシリオン・グレゴールです」
line = "「これはどうも。私は保健委員のイクシリオン・グレゴールです」"

[[dialogue]]
speaker = "イクシリオン"
# 「おふたりともお怪我や体調不良ではなさそうですが、保健室にどういったご用事でしょうか？」
line = "「おふたりともお怪我や体調不良ではなさそうですが、保健室にどういったご用事でしょうか？」"

[[dialogue]]
speaker = "フロレンシア"
# （多分ろくなことじゃないんだろうな……）
line = "（多分ろくなことじゃないんだろうな……）"

[[dialogue]]
speaker = "ミヤハル"
# 「ふっふっふ～。うちらはな、保健室やのうて、イクシリオンはんに用があるんや」
line = "「ふっふっふ～。うちらはな、保健室やのうて、イクシリオンはんに用があるんや」"

[[dialogue]]
speaker = "シズル"
# 「この『淫』の気……間違いありません。ずばり、あなたが『色欲』の魔将ですね？」
line = "「この『淫』の気……間違いありません。ずばり、あなたが『色欲』の魔将ですね？」"

[[dialogue]]
speaker = "イクシリオン"
# 「えぇ！？　どちらでそのことを！？」
line = "「えぇ！？　どちらでそのことを！？」"

[[dialogue]]
speaker = "ミヤハル"
# 「うちはこの前、街中で戦ってるんを見かけたで～」
line = "「うちはこの前、街中で戦ってるんを見かけたで～」"

[[dialogue]]
speaker = "シズル"
# 「私はヘレナさんからお聞きしました。ヘレナさんは新星学園の理事長ですし、深淵書庫のことも重要課題として心配されておられます」
line = "「私はヘレナさんからお聞きしました。ヘレナさんは新星学園の理事長ですし、深淵書庫のことも重要課題として心配されておられます」"

[[dialogue]]
speaker = "イクシリオン"
# 「な、なるほど……？　それで、おふたりは『色欲』の魔将である私に何のご用でしょうか？」
line = "「な、なるほど……？　それで、おふたりは『色欲』の魔将である私に何のご用でしょうか？」"

[[dialogue]]
speaker = "ミヤハル"
# 「それはな～……イクシリオンはんを応援しに来たんや！」
line = "「それはな～……イクシリオンはんを応援しに来たんや！」"

[[dialogue]]
speaker = "イクシリオン"
# 「へ？」
line = "「へ？」"

[[dialogue]]
speaker = "ミヤハル"
# 「イクシリオンはん、うちのあだ名は知ってる？」
line = "「イクシリオンはん、うちのあだ名は知ってる？」"

[[dialogue]]
speaker = "イクシリオン"
# 「ミヤハルさんのあだ名、ですか？　あ、待ってください……聞いたことがあります。流星学園にはそれはそれはスケベェな星騎士がいると」
line = "「ミヤハルさんのあだ名、ですか？　あ、待ってください……聞いたことがあります。流星学園にはそれはそれはスケベェな星騎士がいると」"

[[dialogue]]
speaker = "イクシリオン"
# 「人呼んで『歩く１８禁』！　流星新星両校の風紀委員から危険視される変態だと！　それがあなたなのですね、安倍野ミヤハルさん！」
line = "「人呼んで『歩く１８禁』！　流星新星両校の風紀委員から危険視される変態だと！　それがあなたなのですね、安倍野ミヤハルさん！」"

[[dialogue]]
speaker = "ミヤハル"
# 「ご名答～！　もっと言うて～！」
line = "「ご名答～！　もっと言うて～！」"

[[dialogue]]
speaker = "フロレンシア"
# （変態さんが保健室に来ちゃった……）
line = "（変態さんが保健室に来ちゃった……）"

[[dialogue]]
speaker = "イクシリオン"
# 「シズルさんはせつなさんの忍術の師匠と伺っています。そして……房中術の師匠でもあるとか！」
line = "「シズルさんはせつなさんの忍術の師匠と伺っています。そして……房中術の師匠でもあるとか！」"

[[dialogue]]
speaker = "フロレンシア"
# （防虫術？　虫を寄せ付けないのかな……。感染症予防には効果ありそう）
line = "（防虫術？　虫を寄せ付けないのかな……。感染症予防には効果ありそう）"

[[dialogue]]
speaker = "シズル"
# 「あ、ちなみに房中術というのは、簡単に言うと、男女の営みの技術のことですね～。棒とちゅっちゅする房中術と覚えてください」
line = "「あ、ちなみに房中術というのは、簡単に言うと、男女の営みの技術のことですね～。棒とちゅっちゅする房中術と覚えてください」"

[[dialogue]]
speaker = "フロレンシア"
# （このひとも変態さんだった……）
line = "（このひとも変態さんだった……）"

[[dialogue]]
speaker = "ミヤハル"
# 「魔将と呼ばれる強力な星騎士の噂は聞いてたんや。魔将には冠する『大罪』があることも。なら『色欲』の魔将も存在するはずやって思うてたんよ」
line = "「魔将と呼ばれる強力な星騎士の噂は聞いてたんや。魔将には冠する『大罪』があることも。なら『色欲』の魔将も存在するはずやって思うてたんよ」"

[[dialogue]]
speaker = "ミヤハル"
# 「うち、密かに『色欲』の魔将の座を狙うてたんや。そしたら、いつの間にか決まってもうてて……」
line = "「うち、密かに『色欲』の魔将の座を狙うてたんや。そしたら、いつの間にか決まってもうてて……」"

[[dialogue]]
speaker = "イクシリオン"
# 「そ、それはすみません……」
line = "「そ、それはすみません……」"

[[dialogue]]
speaker = "ミヤハル"
# 「ええんよ、謝らんといて。戦ってるイクシリオンはんを見て、うちはもう納得したんや」
line = "「ええんよ、謝らんといて。戦ってるイクシリオンはんを見て、うちはもう納得したんや」"

[[dialogue]]
speaker = "ミヤハル"
# 「気持ちよさそうに戦うイクシリオンはん、えろうスケベぇやったで。イキイキしてて、お尻もスベスベで、お腹もビカビカやし、言うことなしや」
line = "「気持ちよさそうに戦うイクシリオンはん、えろうスケベぇやったで。イキイキしてて、お尻もスベスベで、お腹もビカビカやし、言うことなしや」"

[[dialogue]]
speaker = "ミヤハル"
# 「この『歩く１８禁』も太鼓判を押すで。今日はそれを伝えたかったんや」
line = "「この『歩く１８禁』も太鼓判を押すで。今日はそれを伝えたかったんや」"

[[dialogue]]
speaker = "イクシリオン"
# 「ミヤハルさん……ありがとうございます！」
line = "「ミヤハルさん……ありがとうございます！」"

[[dialogue]]
speaker = "シズル"
# 「実は私もヘレナさんから『色欲』の魔将を試してみないかと打診されていたんです。学生さんに『色欲』の二文字は恥ずかしいでしょうから」
line = "「実は私もヘレナさんから『色欲』の魔将を試してみないかと打診されていたんです。学生さんに『色欲』の二文字は恥ずかしいでしょうから」"

[[dialogue]]
speaker = "シズル"
# 「ですが、杞憂だったようですね。イクシリオンさんなら、立派な『色欲』の魔将になれると思います」
line = "「ですが、杞憂だったようですね。イクシリオンさんなら、立派な『色欲』の魔将になれると思います」"

[[dialogue]]
speaker = "シズル"
# 「もし、私の房中術が必要になったら言ってください。いつでも伝授しに来ますからね」
line = "「もし、私の房中術が必要になったら言ってください。いつでも伝授しに来ますからね」"

[[dialogue]]
speaker = "イクシリオン"
# 「シズルさんも、ありがとうございます！　そのときは頼りにさせていただきます！」
line = "「シズルさんも、ありがとうございます！　そのときは頼りにさせていただきます！」"

[[dialogue]]
speaker = "イクシリオン"
# 「あの……私、仲のいい人からはイクシーと呼ばれているんです。よかったらおふたりもそう呼んでください」
line = "「あの……私、仲のいい人からはイクシーと呼ばれているんです。よかったらおふたりもそう呼んでください」"

[[dialogue]]
speaker = "ミヤハル"
# 「もちろんや、イクシーはん♪」
line = "「もちろんや、イクシーはん♪」"

[[dialogue]]
speaker = "シズル"
# 「はい、わかりました。イクシーさん」
line = "「はい、わかりました。イクシーさん」"

[[dialogue]]
speaker = "イクシリオン"
# 「あ、ところで、さっきシズルさんが仰っていた『淫』の気とは……？」
line = "「あ、ところで、さっきシズルさんが仰っていた『淫』の気とは……？」"

[[dialogue]]
speaker = "シズル"
# 「いわゆる『溜まってる』というやつですね～。普通の人なら１日１回で済むのが、１日に３回とかしちゃいませんか？　房中術を極めれば分かるようになりますよ～」
line = "「いわゆる『溜まってる』というやつですね～。普通の人なら１日１回で済むのが、１日に３回とかしちゃいませんか？　房中術を極めれば分かるようになりますよ～」"

[[dialogue]]
speaker = "イクシリオン"
# 「なるほど～！　じゃあ、確かに私、『淫』強めです！」
line = "「なるほど～！　じゃあ、確かに私、『淫』強めです！」"

[[dialogue]]
speaker = "フロレンシア"
# 「１日１回が１日３回……？　どういうこと……？」
line = "「１日１回が１日３回……？　どういうこと……？」"

[[dialogue]]
speaker = "ミヤハル"
# 「分からへんかったら分からへんでええんやで……そのままでいてや～」
line = "「分からへんかったら分からへんでええんやで……そのままでいてや～」"

[[dialogue]]
speaker = "エリス"
# 「失礼します。人を探しているのですが──」
line = "「失礼します。人を探しているのですが──」"

[[dialogue]]
speaker = "エリス"
# 「ここにいたんですか、ミヤハルさん」
line = "「ここにいたんですか、ミヤハルさん」"

[[dialogue]]
speaker = "ミヤハル"
# 「あちゃ～、見付かってもうた。エリスはんはうちのこと大好きやねぇ」
line = "「あちゃ～、見付かってもうた。エリスはんはうちのこと大好きやねぇ」"

[[dialogue]]
speaker = "エリス"
# 「ええ、片時も目を離したくないくらいです。今日こそ学園内で猥談を繰り広げたことに対する反省文を書いてもらいますからね」
line = "「ええ、片時も目を離したくないくらいです。今日こそ学園内で猥談を繰り広げたことに対する反省文を書いてもらいますからね」"

[[dialogue]]
speaker = "ミヤハル"
# 「エリスはんのいけず～」
line = "「エリスはんのいけず～」"

[[dialogue]]
speaker = "エリス"
# 「はいはい。では行きますよ。保健室までお邪魔してすみませんでした。この人で何かあったら私を呼んでください」
line = "「はいはい。では行きますよ。保健室までお邪魔してすみませんでした。この人で何かあったら私を呼んでください」"

[[dialogue]]
speaker = "ミヤハル"
# 「ほなさいなら～」
line = "「ほなさいなら～」"

[[dialogue]]
speaker = "unk"
# ミヤハルはエリスに引きずられ、手を振りながら去っていった。
line = "ミヤハルはエリスに引きずられ、手を振りながら去っていった。"

[[dialogue]]
speaker = "せつな"
# 「師匠、ようやく見付けたでござる～！」
line = "「師匠、ようやく見付けたでござる～！」"

[[dialogue]]
speaker = "シズル"
# 「おや、私もお迎えが来たようですね」
line = "「おや、私もお迎えが来たようですね」"

[[dialogue]]
speaker = "せつな"
# 「こっちにいる間は勝手にいなくならないでと何度言ったら分かってもらえるでござるか～。心配するこっちの身にもなって欲しいでござる」
line = "「こっちにいる間は勝手にいなくならないでと何度言ったら分かってもらえるでござるか～。心配するこっちの身にもなって欲しいでござる」"

[[dialogue]]
speaker = "シズル"
# 「ごめんなさい、せつな。でも気が付くと知らないところにいるんですよ～。不思議ですねぇ」
line = "「ごめんなさい、せつな。でも気が付くと知らないところにいるんですよ～。不思議ですねぇ」"

[[dialogue]]
speaker = "せつな"
# 「なんでのほほんとしてるでござる！？　とにかく帰るでござるよ。イクシー殿、フロレンシア殿、失礼するでござる」
line = "「なんでのほほんとしてるでござる！？　とにかく帰るでござるよ。イクシー殿、フロレンシア殿、失礼するでござる」"

[[dialogue]]
speaker = "シズル"
# 「さようなら～」
line = "「さようなら～」"

[[dialogue]]
speaker = "unk"
# シズルもまた手を振りながら去っていった。せつなの小脇に抱えられながら。
line = "シズルもまた手を振りながら去っていった。せつなの小脇に抱えられながら。"

[[dialogue]]
speaker = "フロレンシア"
# 「行っちゃいましたね。なんだったんでしょう……」
line = "「行っちゃいましたね。なんだったんでしょう……」"

[[dialogue]]
speaker = "フロレンシア"
# 「…………あ、１日１回とか３回ってそういう……？　え？　え？」
line = "「…………あ、１日１回とか３回ってそういう……？　え？　え？」"

[[dialogue]]
speaker = "イクシリオン"
# 「あぁ、そんなにじっと見ないでください。照れてしまいます……。えっと、ちなみに、多い日だともっとする日もあります……」
line = "「あぁ、そんなにじっと見ないでください。照れてしまいます……。えっと、ちなみに、多い日だともっとする日もあります……」"

[[dialogue]]
speaker = "フロレンシア"
# 「え？　えぇ～～～～～～～！？」
line = "「え？　えぇ～～～～～～～！？」"

[[dialogue]]
speaker = "unk"
# ひたすら騒がしい保健室の一日。利用者がいないのはせめてもの幸いだった。
line = "ひたすら騒がしい保健室の一日。利用者がいないのはせめてもの幸いだった。"
