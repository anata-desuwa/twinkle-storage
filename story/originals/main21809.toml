[[dialogue]]
speaker = "unk"
# 第９話,魔王になんてならない,B
line = "第９話,魔王になんてならない,B"

[[dialogue]]
speaker = "ラストナンバー"
# 「お父様。待っていてください。過去の改変は目前です」
line = "「お父様。待っていてください。過去の改変は目前です」"

[[dialogue]]
speaker = "ラストナンバー"
# 「強力な使徒を手中に収めた後は、聖庭園を陥落させましょう。そして次は魔界──」
line = "「強力な使徒を手中に収めた後は、聖庭園を陥落させましょう。そして次は魔界──」"

[[dialogue]]
speaker = "ラストナンバー"
# 「『星の再会』の増援を全て叩き潰せば、緋宮クロトに勝ち目はありません」
line = "「『星の再会』の増援を全て叩き潰せば、緋宮クロトに勝ち目はありません」"

[[dialogue]]
speaker = "ラストナンバー"
# 「ディザスターハンドとの融合も起きない……厄災の右腕を操る魔王が存在する未来は否定され、お父様の存在は不動のものに──」
line = "「ディザスターハンドとの融合も起きない……厄災の右腕を操る魔王が存在する未来は否定され、お父様の存在は不動のものに──」"

[[dialogue]]
speaker = "ケイティ"
# 「……させ、ません」
line = "「……させ、ません」"

[[dialogue]]
speaker = "ラストナンバー"
# 「あら──まだ立ちあがれるだなんて。誤算だったかしら」
line = "「あら──まだ立ちあがれるだなんて。誤算だったかしら」"

[[dialogue]]
speaker = "ケイティ"
# 「ふふ……未来を視ることが、できるのでしょう？　確認が、足らないのでは、ないですか……？」
line = "「ふふ……未来を視ることが、できるのでしょう？　確認が、足らないのでは、ないですか……？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「星眼の使用は疲れるのよ。もう使う必要もないでしょう？　武器を持つこともやっとの状態で、私を脅かせるとでも？」
line = "「星眼の使用は疲れるのよ。もう使う必要もないでしょう？　武器を持つこともやっとの状態で、私を脅かせるとでも？」"

[[dialogue]]
speaker = "ケイティ"
# 「無理、でしょうね……私では……」
line = "「無理、でしょうね……私では……」"

[[dialogue]]
speaker = "ケイティ"
# 「でも、メルエルちゃんは……きっと立ち上がり、ますよ……。あの子は、とても強い子、ですから……」
line = "「でも、メルエルちゃんは……きっと立ち上がり、ますよ……。あの子は、とても強い子、ですから……」"

[[dialogue]]
speaker = "ケイティ"
# 「私が……お姉ちゃんが……妹を信じなくてどうします？　抵抗をやめるつもりは、ありません……！」
line = "「私が……お姉ちゃんが……妹を信じなくてどうします？　抵抗をやめるつもりは、ありません……！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「馬鹿らしい。あれだけの濃度の瘴気に包まれて、精神を保てるわけがない」
line = "「馬鹿らしい。あれだけの濃度の瘴気に包まれて、精神を保てるわけがない」"

[[dialogue]]
speaker = "ラストナンバー"
# 「次に立ち上がった時は、２０００年前の再来となるわ。リクリエによって作り替えられ、お父様に付き従う忠実な使徒としてね」
line = "「次に立ち上がった時は、２０００年前の再来となるわ。リクリエによって作り替えられ、お父様に付き従う忠実な使徒としてね」"

[[dialogue]]
speaker = "ケイティ"
# 「それこそ……あり得ません。あの子は全てを跳ねのける……」
line = "「それこそ……あり得ません。あの子は全てを跳ねのける……」"

[[dialogue]]
speaker = "ケイティ"
# 「貴女は知らないのでしょう……聖庭園が生み出したアルケインコードを。リガルタ様の一族が生み出した、あの輝きの力を……！」
line = "「貴女は知らないのでしょう……聖庭園が生み出したアルケインコードを。リガルタ様の一族が生み出した、あの輝きの力を……！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「囀っていなさい。ここからの挽回などあり得ないのよ」
line = "「囀っていなさい。ここからの挽回などあり得ないのよ」"

[[dialogue]]
speaker = "メルエル"
# 「……ぁ、ぁっ…………！！」
line = "「……ぁ、ぁっ…………！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「そろそろ瘴気に呑まれる頃ね？　お姫様の最期の言葉を噛み締めるといいわ」
line = "「そろそろ瘴気に呑まれる頃ね？　お姫様の最期の言葉を噛み締めるといいわ」"

[[dialogue]]
speaker = "メルエル"
# 「アル…………ケイン…………」
line = "「アル…………ケイン…………」"

[[dialogue]]
speaker = "ラストナンバー"
# 「……っ！？」
line = "「……っ！？」"

[[dialogue]]
speaker = "メルエル"
# 「カオス──クエーサー────！！！」
line = "「カオス──クエーサー────！！！」"

[[dialogue]]
speaker = "テルル"
# 『……リガルタの娘、メルエル。侵食する瘴気を跳ね除け、よくぞアルケインコードを唱えてくれました』
line = "『……リガルタの娘、メルエル。侵食する瘴気を跳ね除け、よくぞアルケインコードを唱えてくれました』"

[[dialogue]]
speaker = "ラストナンバー"
# 「テルル！？　そんなっ……馬鹿な──！？」
line = "「テルル！？　そんなっ……馬鹿な──！？」"

[[dialogue]]
speaker = "テルル"
# 『ラストナンバーと言いましたか。まさか時を渡り、過去を変えようと画策するとは……』
line = "『ラストナンバーと言いましたか。まさか時を渡り、過去を変えようと画策するとは……』"

[[dialogue]]
speaker = "ラストナンバー"
# 「未来は確認していた……！　お前が干渉してこないことは、数多の未来を視て、確かめていた……な、なぜ──！？」
line = "「未来は確認していた……！　お前が干渉してこないことは、数多の未来を視て、確かめていた……な、なぜ──！？」"

[[dialogue]]
speaker = "テルル"
# 『ええ、そうでしょう──だからこそ私も、貴女の存在を感知したその時から、決断していました』
line = "『ええ、そうでしょう──だからこそ私も、貴女の存在を感知したその時から、決断していました』"

[[dialogue]]
speaker = "テルル"
# 『一切の干渉をしないと。ヒトの子を信じ、何も手を出さないと』
line = "『一切の干渉をしないと。ヒトの子を信じ、何も手を出さないと』"

[[dialogue]]
speaker = "ラストナンバー"
# 「……っ！！？？」
line = "「……っ！！？？」"

[[dialogue]]
speaker = "テルル"
# 『“私が干渉しないことを決めた未来”を、貴女は星眼で視続けた……』
line = "『“私が干渉しないことを決めた未来”を、貴女は星眼で視続けた……』"

[[dialogue]]
speaker = "テルル"
# 『そしてどれだけ確認しても未来が揺らがないことを知れば、星眼を使わない瞬間が訪れるはず……』
line = "『そしてどれだけ確認しても未来が揺らがないことを知れば、星眼を使わない瞬間が訪れるはず……』"

[[dialogue]]
speaker = "テルル"
# 『その一瞬の隙に乗じて干渉する。未来視の能力を持つ貴女を出し抜くには、これしか方法がありません』
line = "『その一瞬の隙に乗じて干渉する。未来視の能力を持つ貴女を出し抜くには、これしか方法がありません』"

[[dialogue]]
speaker = "ラストナンバー"
# 「こ、のぉおおっ────！？」
line = "「こ、のぉおおっ────！？」"

[[dialogue]]
speaker = "テルル"
# 『過去への跳躍により、因果の糸がかき乱れた今──世界の修正力が働くまでの、この一時だけならば──』
line = "『過去への跳躍により、因果の糸がかき乱れた今──世界の修正力が働くまでの、この一時だけならば──』"

[[dialogue]]
speaker = "テルル"
# 『天使メルエル。貴女が近い未来、手に入れるであろう──絆の力を引き寄せましょう』
line = "『天使メルエル。貴女が近い未来、手に入れるであろう──絆の力を引き寄せましょう』"

[[dialogue]]
speaker = "ラストナンバー"
# 「ふ、ふざけるな……ふざけるな、ふざけるな！！　死にぞこないが──どこまでお父様の邪魔をすれば──！！！」
line = "「ふ、ふざけるな……ふざけるな、ふざけるな！！　死にぞこないが──どこまでお父様の邪魔をすれば──！！！」"

[[dialogue]]
speaker = "テルル"
# 『私が力を貸せるのはここまで──さあ、受け取りなさい！！』
line = "『私が力を貸せるのはここまで──さあ、受け取りなさい！！』"

[[dialogue]]
speaker = "メルエル"
# 「はいっ……女神様！！」
line = "「はいっ……女神様！！」"

[[dialogue]]
speaker = "メルエル"
# 「チェンジ──ノヴァフォーム！！！」
line = "「チェンジ──ノヴァフォーム！！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「そ──そんな──こんなこと、あっていいわけが──！？」
line = "「そ──そんな──こんなこと、あっていいわけが──！？」"

[[dialogue]]
speaker = "メルエル（覚醒）"
# 「女神テルル様……ありがとうございます」
line = "「女神テルル様……ありがとうございます」"

[[dialogue]]
speaker = "メルエル（覚醒）"
# 「会長くんとの絆の力で……必ず！　私たちの勝利する未来を掴んでみせます！！」
line = "「会長くんとの絆の力で……必ず！　私たちの勝利する未来を掴んでみせます！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「認められるわけがない──消えろ！！」
line = "「認められるわけがない──消えろ！！」"

[[dialogue]]
speaker = "メルエル（覚醒）"
# 「はぁあぁぁぁっ──！！」
line = "「はぁあぁぁぁっ──！！」"

[[dialogue]]
speaker = "unk"
# メルエルが操るレイピアによって、ラストナンバーの撃ちだす光の羽根が全て叩き斬られていく。
line = "メルエルが操るレイピアによって、ラストナンバーの撃ちだす光の羽根が全て叩き斬られていく。"

[[dialogue]]
speaker = "ラストナンバー"
# （星力総量が、計測できない！？　──ならば！　未来を視て、今この時から──最上の結末を引き寄せる！！）
line = "（星力総量が、計測できない！？　──ならば！　未来を視て、今この時から──最上の結末を引き寄せる！！）"

[[dialogue]]
speaker = "unk"
# オリジナル以上の精度を持つ『天機の星眼』を起動する──
line = "オリジナル以上の精度を持つ『天機の星眼』を起動する──"

[[dialogue]]
speaker = "ラストナンバー"
# 「…………っ！？」
line = "「…………っ！？」"

[[dialogue]]
speaker = "unk"
# 視える未来は──数多。
line = "視える未来は──数多。"

[[dialogue]]
speaker = "unk"
# しかし待ち受ける結末は──たったの１つ。
line = "しかし待ち受ける結末は──たったの１つ。"

[[dialogue]]
speaker = "ラストナンバー"
# 「私が……滅びる！？　そんな、そんな、そんなそんなそんな──！？！？」
line = "「私が……滅びる！？　そんな、そんな、そんなそんなそんな──！？！？」"

[[dialogue]]
speaker = "unk"
# どれだけ観測しても。行動を変えても。何を企んでも──
line = "どれだけ観測しても。行動を変えても。何を企んでも──"

[[dialogue]]
speaker = "unk"
# この３人の天使に、滅ぼされる未来しか……観測できない。
line = "この３人の天使に、滅ぼされる未来しか……観測できない。"

[[dialogue]]
speaker = "unk"
# ラストナンバーは、期せずして体験していた──かつてレナーテ・<ruby=ジグ>Ｚ</ruby>・サイフリートが抱き続けた絶望を。
line = "ラストナンバーは、期せずして体験していた──かつてレナーテ・<ruby>Ｚ<rt>ジグ</rt></ruby>・サイフリートが抱き続けた絶望を。"

[[dialogue]]
speaker = "unk"
# 何をしても変えられない、破滅の未来を──
line = "何をしても変えられない、破滅の未来を──"

[[dialogue]]
speaker = "ケイティ"
# 「──メルエルちゃん！！」
line = "「──メルエルちゃん！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「──メルエルッ！！」
line = "「──メルエルッ！！」"

[[dialogue]]
speaker = "メルエル（覚醒）"
# 「うん、行こう──みんなっ！！」
line = "「うん、行こう──みんなっ！！」"

[[dialogue]]
speaker = "３人"
# 『ユニゾン！！！』
line = "『ユニゾン！！！』"

[[dialogue]]
speaker = "メルエル（覚醒）"
# 「エゴイスティック──シンフォニー！！！」
line = "「エゴイスティック──シンフォニー！！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「ぁああ──ぁあ、ぁぁぁあっ──！？！？！？」
line = "「ぁああ──ぁあ、ぁぁぁあっ──！？！？！？」"

[[dialogue]]
speaker = "unk"
# 聖庭園の天使たちが放つユニゾンアタックにより、ラストナンバーは貯蔵していた全ての霊力を消し飛ばされ──
line = "聖庭園の天使たちが放つユニゾンアタックにより、ラストナンバーは貯蔵していた全ての霊力を消し飛ばされ──"

[[dialogue]]
speaker = "ラストナンバー"
# 「そん、なっ……」
line = "「そん、なっ……」"

[[dialogue]]
speaker = "ラストナンバー"
# 「お父様っ……申し訳、ございま──せっ……！」
line = "「お父様っ……申し訳、ございま──せっ……！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「ああぁぁああっ…………！！！」
line = "「ああぁぁああっ…………！！！」"

[[dialogue]]
speaker = "メルエル（覚醒）"
# 「…………なんとか、倒せたね」
line = "「…………なんとか、倒せたね」"

[[dialogue]]
speaker = "ケイティ"
# 「ええ。メルエルちゃん、その姿は──」
line = "「ええ。メルエルちゃん、その姿は──」"

[[dialogue]]
speaker = "メルエル（覚醒）"
# 「う、うん。女神様が、今だけの力を貸すって……あっ──」
line = "「う、うん。女神様が、今だけの力を貸すって……あっ──」"

[[dialogue]]
speaker = "ナターシャ"
# 「戻った……？」
line = "「戻った……？」"

[[dialogue]]
speaker = "メルエル"
# 「……うん。因果の糸が乱れた、一時の力だって聞いてたから」
line = "「……うん。因果の糸が乱れた、一時の力だって聞いてたから」"

[[dialogue]]
speaker = "メルエル"
# （でも……予感があるよ。近い未来、また会長くんから、受け取れる力なんだよね？）
line = "（でも……予感があるよ。近い未来、また会長くんから、受け取れる力なんだよね？）"

[[dialogue]]
speaker = "ケイティ"
# 「想定外の襲撃だったけれど……何とかなったね。みんな無事で、よかった……」
line = "「想定外の襲撃だったけれど……何とかなったね。みんな無事で、よかった……」"

[[dialogue]]
speaker = "ナターシャ"
# 「そうだね。ケイティ姉さん……これで全部終わり。一件落着かな」
line = "「そうだね。ケイティ姉さん……これで全部終わり。一件落着かな」"

[[dialogue]]
speaker = "メルエル"
# 「──ううん、ナターシャちゃん。まだ１つ、やり残してることがあるよ」
line = "「──ううん、ナターシャちゃん。まだ１つ、やり残してることがあるよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「……？」
line = "「……？」"

[[dialogue]]
speaker = "unk"
# メルエルはコントロールルームの最奥に進む。
line = "メルエルはコントロールルームの最奥に進む。"

[[dialogue]]
speaker = "unk"
# リクリエの瘴気によって見せられた、過去の記憶を頼りに操作を行い、１つの宝玉を取り出した。
line = "リクリエの瘴気によって見せられた、過去の記憶を頼りに操作を行い、１つの宝玉を取り出した。"

[[dialogue]]
speaker = "ケイティ"
# 「メルエルちゃん、それは……？」
line = "「メルエルちゃん、それは……？」"

[[dialogue]]
speaker = "メルエル"
# 「２０００年前に、はぐれ魔女さんに協力してもらって作った魔道具だよ。魔王因子を外部から削り取って、悪い魔王を弱らせるための宝玉……」
line = "「２０００年前に、はぐれ魔女さんに協力してもらって作った魔道具だよ。魔王因子を外部から削り取って、悪い魔王を弱らせるための宝玉……」"

[[dialogue]]
speaker = "メルエル"
# 「女神の神殿にある、魔王因子に働きかけて弱らせる機能も、この魔道具を介して行われてるみたい。……全部、見てきたから」
line = "「女神の神殿にある、魔王因子に働きかけて弱らせる機能も、この魔道具を介して行われてるみたい。……全部、見てきたから」"

[[dialogue]]
speaker = "ナターシャ"
# 「……何をするつもり、メルエル？」
line = "「……何をするつもり、メルエル？」"

[[dialogue]]
speaker = "メルエル"
# 「うん。これ……私に使おうかなって思うんだ」
line = "「うん。これ……私に使おうかなって思うんだ」"

[[dialogue]]
speaker = "ナターシャ"
# 「……っ！？」
line = "「……っ！？」"

[[dialogue]]
speaker = "メルエル"
# 「前世のことを知って、ナターシャちゃんが悩んでたことも知ることができて。その上で、私が出した結論だよ」
line = "「前世のことを知って、ナターシャちゃんが悩んでたことも知ることができて。その上で、私が出した結論だよ」"

[[dialogue]]
speaker = "メルエル"
# 「私は──魔王になんてならない！　天界の魔王様は、リガルタ様で終わり！」
line = "「私は──魔王になんてならない！　天界の魔王様は、リガルタ様で終わり！」"

[[dialogue]]
speaker = "メルエル"
# 「世界を救う本当の魔王は、会長くんがいる。私は彼の傍に立つ、１人の星騎士。それ以上でも、それ以下でもない」
line = "「世界を救う本当の魔王は、会長くんがいる。私は彼の傍に立つ、１人の星騎士。それ以上でも、それ以下でもない」"

[[dialogue]]
speaker = "メルエル"
# 「その意思の証として、この魔道具を全力で起動する。私の中の魔王因子を全部、消しちゃうつもり」
line = "「その意思の証として、この魔道具を全力で起動する。私の中の魔王因子を全部、消しちゃうつもり」"

[[dialogue]]
speaker = "ナターシャ"
# 「本気で言ってるの？　だって魔王因子がなくなったら、メルエル──もう、魔王の力も、アルケインコードも、使えなくなるのに──」
line = "「本気で言ってるの？　だって魔王因子がなくなったら、メルエル──もう、魔王の力も、アルケインコードも、使えなくなるのに──」"

[[dialogue]]
speaker = "メルエル"
# 「うん！　だって魔王因子があると、ナターシャちゃんと仲直りできないんだもん。だから、いらないかなって！」
line = "「うん！　だって魔王因子があると、ナターシャちゃんと仲直りできないんだもん。だから、いらないかなって！」"

[[dialogue]]
speaker = "ナターシャ"
# 「は──はぁあっ！？　そんな自分勝手な理由で、簡単に……！？」
line = "「は──はぁあっ！？　そんな自分勝手な理由で、簡単に……！？」"

[[dialogue]]
speaker = "メルエル"
# 「ご先祖様の行いも、三界を壊した罪も……私は絶対に忘れないよ」
line = "「ご先祖様の行いも、三界を壊した罪も……私は絶対に忘れないよ」"

[[dialogue]]
speaker = "メルエル"
# 「でもね、リガルタ様が魔王の血族に求めたものは──リクリエを退けるための切り札だと思うの」
line = "「でもね、リガルタ様が魔王の血族に求めたものは──リクリエを退けるための切り札だと思うの」"

[[dialogue]]
speaker = "メルエル"
# 「リクリエは、会長くんが──魔王・緋宮クロトが止めるよ！」
line = "「リクリエは、会長くんが──魔王・緋宮クロトが止めるよ！」"

[[dialogue]]
speaker = "メルエル"
# 「だから魔王も、英雄も、２人はいらない……」
line = "「だから魔王も、英雄も、２人はいらない……」"

[[dialogue]]
speaker = "メルエル"
# 「私は姫咲メルエル──お姫様でもないし、魔王でもない。会長くんの下で戦う、ただの天使の星騎士だよ！」
line = "「私は姫咲メルエル──お姫様でもないし、魔王でもない。会長くんの下で戦う、ただの天使の星騎士だよ！」"

[[dialogue]]
speaker = "メルエル"
# 「──どうかな、ナターシャちゃん？」
line = "「──どうかな、ナターシャちゃん？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ど、どうって……」
line = "「ど、どうって……」"

[[dialogue]]
speaker = "メルエル"
# 「私は全部を知って、『何も知らない小娘』じゃなくなった上で、『天界の魔王であること』を捨てるよ」
line = "「私は全部を知って、『何も知らない小娘』じゃなくなった上で、『天界の魔王であること』を捨てるよ」"

[[dialogue]]
speaker = "メルエル"
# 「これでナターシャちゃんの中にあった矛盾やモヤモヤ、解消できたかな？　──仲直り、できるかな？」
line = "「これでナターシャちゃんの中にあった矛盾やモヤモヤ、解消できたかな？　──仲直り、できるかな？」"

[[dialogue]]
speaker = "ナターシャ"
# （ああ、本当に……本当にこのバカ女は……！！）
line = "（ああ、本当に……本当にこのバカ女は……！！）"

[[dialogue]]
speaker = "ナターシャ"
# （でも……私は『メルエルの強さ』を、見誤っていたのかもしれない……）
line = "（でも……私は『メルエルの強さ』を、見誤っていたのかもしれない……）"

[[dialogue]]
speaker = "ナターシャ"
# （私は、『メルエルの強さ』がいつか、メルエルを殺してしまうんじゃないかって、怖かった……）
line = "（私は、『メルエルの強さ』がいつか、メルエルを殺してしまうんじゃないかって、怖かった……）"

[[dialogue]]
speaker = "ナターシャ"
# （でもきっと、今の『メルエルの強さ』は、メルエルのことを殺さない）
line = "（でもきっと、今の『メルエルの強さ』は、メルエルのことを殺さない）"

[[dialogue]]
speaker = "ナターシャ"
# （それはきっと、会長さんっていう『本物の魔王』と出会えたことで変わったんだと思うけど……）
line = "（それはきっと、会長さんっていう『本物の魔王』と出会えたことで変わったんだと思うけど……）"

[[dialogue]]
speaker = "ナターシャ"
# （でも……私は、強いメルエルのことを、もう少しだけ信じてもいいかもしれない。嫌わなくても、いいかもしれない）
line = "（でも……私は、強いメルエルのことを、もう少しだけ信じてもいいかもしれない。嫌わなくても、いいかもしれない）"

[[dialogue]]
speaker = "ナターシャ"
# （……ま、私がそんなことを考えたなんて、メルエルには一生、内緒なんだけど）
line = "（……ま、私がそんなことを考えたなんて、メルエルには一生、内緒なんだけど）"

[[dialogue]]
speaker = "メルエル"
# 「それにね、これならナターシャちゃんを嫌いなお仕事から解放できるよ！」
line = "「それにね、これならナターシャちゃんを嫌いなお仕事から解放できるよ！」"

[[dialogue]]
speaker = "メルエル"
# 「私が魔王じゃなくなれば、護衛の任務も必要なくなるよね！？」
line = "「私が魔王じゃなくなれば、護衛の任務も必要なくなるよね！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「はあ……やっぱりメルエルのこと、好きになれないや。こんな大ごとを、あっさり決めちゃってさ──」
line = "「はあ……やっぱりメルエルのこと、好きになれないや。こんな大ごとを、あっさり決めちゃってさ──」"

[[dialogue]]
speaker = "メルエル"
# 「あ──『嫌い』からちょっぴり昇格した？　昇格したよね、今っ！」
line = "「あ──『嫌い』からちょっぴり昇格した？　昇格したよね、今っ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「～～～～～～っ！！」
line = "「～～～～～～っ！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「────だいっきらい！！！」
line = "「────だいっきらい！！！」"

[[dialogue]]
speaker = "メルエル"
# 「えぇぇえっ！？　なんで～～～っ！？」
line = "「えぇぇえっ！？　なんで～～～っ！？」"

[[dialogue]]
speaker = "unk"
# ──こうして２度目となる天界防衛は見事、果たされ。
line = "──こうして２度目となる天界防衛は見事、果たされ。"

[[dialogue]]
speaker = "unk"
# 創造神『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』の最期のあがきは、メルエルたちの活躍によって阻止されたのだった──
line = "創造神『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』の最期のあがきは、メルエルたちの活躍によって阻止されたのだった──"
