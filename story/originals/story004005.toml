[[dialogue]]
speaker = "蘭美"
# 「『支配』のロストアイテム……！？」
line = "「『支配』のロストアイテム……！？」"

[[dialogue]]
speaker = "シュティレ"
# 「ダッチの……妹！？」
line = "「ダッチの……妹！？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「そしてダッチ様よりも、強い！？」
line = "「そしてダッチ様よりも、強い！？」"

[[dialogue]]
speaker = "ダッチ"
# 「ええ。あの子は我ら『七彩のアイテムズ』の中でも、最強と言って差し支えありません」
line = "「ええ。あの子は我ら『七彩のアイテムズ』の中でも、最強と言って差し支えありません」"

[[dialogue]]
speaker = "ダッチ"
# 「兄として不甲斐ない限りですが、事実です。『獅子舞』の兄上でも、こてんぱんにされてしまうでしょうねぇ」
line = "「兄として不甲斐ない限りですが、事実です。『獅子舞』の兄上でも、こてんぱんにされてしまうでしょうねぇ」"

[[dialogue]]
speaker = "ヘレナ"
# 「──ほう。そこまでの相手か」
line = "「──ほう。そこまでの相手か」"

[[dialogue]]
speaker = "シュティレ"
# 「会長とマスターを<ruby=かどわかす>拐かす</ruby>ほどの相手です。説得力はありますが……どうします、ヘレナ理事長？」
line = "「会長とマスターを<ruby>拐かす<rt>かどわかす</rt></ruby>ほどの相手です。説得力はありますが……どうします、ヘレナ理事長？」"

[[dialogue]]
speaker = "ヘレナ"
# 「このヘンタイ紳士と共に協力して、解決にあたる。それも一考ではあるが──」
line = "「このヘンタイ紳士と共に協力して、解決にあたる。それも一考ではあるが──」"

[[dialogue]]
speaker = "蘭美"
# 「危険すぎます！　こいつが信用に足る相手ですか！？」
line = "「危険すぎます！　こいつが信用に足る相手ですか！？」"

[[dialogue]]
speaker = "ダッチ"
# 「フゥ～～～♪」
line = "「フゥ～～～♪」"

[[dialogue]]
speaker = "蘭美"
# 「見るからに頭がおかしいです！　私たちを騙そうとしているのかも！」
line = "「見るからに頭がおかしいです！　私たちを騙そうとしているのかも！」"

[[dialogue]]
speaker = "ダッチ"
# 「ヌフフフ。では私の行動で、信頼を得ていくとしましょうか？」
line = "「ヌフフフ。では私の行動で、信頼を得ていくとしましょうか？」"

[[dialogue]]
speaker = "ダッチ"
# 「まず第一にシエスタの居場所──これは当たりがついています。ロストアイテム同士、マイナスエネルギーの感知はお手の物ですので」
line = "「まず第一にシエスタの居場所──これは当たりがついています。ロストアイテム同士、マイナスエネルギーの感知はお手の物ですので」"

[[dialogue]]
speaker = "ダッチ"
# 「貴方がたは、敵がどこにいるのかすら不明瞭のはず。違いますか？」
line = "「貴方がたは、敵がどこにいるのかすら不明瞭のはず。違いますか？」"

[[dialogue]]
speaker = "蘭美"
# 「む、むむむ……！」
line = "「む、むむむ……！」"

[[dialogue]]
speaker = "シュティレ"
# 「ドリルで口を割らせますか？　ぎゅいんぎゅいん」
line = "「ドリルで口を割らせますか？　ぎゅいんぎゅいん」"

[[dialogue]]
speaker = "ダッチ"
# 「オゥフ！　あれは痛かったですからねぇ、ご遠慮願いたい！　協力し合えるのならば、すぐにでもお教えいたしますよ？」
line = "「オゥフ！　あれは痛かったですからねぇ、ご遠慮願いたい！　協力し合えるのならば、すぐにでもお教えいたしますよ？」"

[[dialogue]]
speaker = "ダッチ"
# 「さらに続いて、シエスタの能力のネタバラシもいたしましょう！」
line = "「さらに続いて、シエスタの能力のネタバラシもいたしましょう！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「……どうやら、協力して事に当たりたいというのは、本心のようですね。ヘレナ様」
line = "「……どうやら、協力して事に当たりたいというのは、本心のようですね。ヘレナ様」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむ。申してみよ、ダッチ」
line = "「うむ。申してみよ、ダッチ」"

[[dialogue]]
speaker = "ダッチ"
# 「シエスタの司る能力は『支配』。簡単に言うと、あの子はあらゆる事象やエネルギーに対して、支配権を持つのです」
line = "「シエスタの司る能力は『支配』。簡単に言うと、あの子はあらゆる事象やエネルギーに対して、支配権を持つのです」"

[[dialogue]]
speaker = "ダッチ"
# 「故に敵対する星騎士から、星力を奪い取ることなど朝飯前。さらに、その奪った力を自身に取り込むことも可能！」
line = "「故に敵対する星騎士から、星力を奪い取ることなど朝飯前。さらに、その奪った力を自身に取り込むことも可能！」"

[[dialogue]]
speaker = "マトイ"
# 「そんなっ！？　それじゃあ本当に最強だよ！？」
line = "「そんなっ！？　それじゃあ本当に最強だよ！？」"

[[dialogue]]
speaker = "アナ"
# 「なるほど。うちの会長がなぜ遅れをとっているのか不思議でしたが……」
line = "「なるほど。うちの会長がなぜ遅れをとっているのか不思議でしたが……」"

[[dialogue]]
speaker = "ダッチ"
# 「シエスタは理論上『相手が強ければ強いほど、強敵となるロストアイテム』なのですよ。ご理解いただけましたか？」
line = "「シエスタは理論上『相手が強ければ強いほど、強敵となるロストアイテム』なのですよ。ご理解いただけましたか？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「信じられません……そんなの、無敵ではないですか！？」
line = "「信じられません……そんなの、無敵ではないですか！？」"

[[dialogue]]
speaker = "ダッチ"
# 「ええ。だから言ったでしょう、私も手をこまねいていたと」
line = "「ええ。だから言ったでしょう、私も手をこまねいていたと」"

[[dialogue]]
speaker = "ヘレナ"
# 「……ふむ。相分かった、協力しなければ解決できぬ。そのことは確かなようだな」
line = "「……ふむ。相分かった、協力しなければ解決できぬ。そのことは確かなようだな」"

[[dialogue]]
speaker = "ヘレナ"
# 「一時的な共闘──了承しようではないか、ダッチよ！」
line = "「一時的な共闘──了承しようではないか、ダッチよ！」"

[[dialogue]]
speaker = "ダッチ"
# 「フゥ！　ご理解いただき感謝いたしますよ、九浄ヘレナ様！」
line = "「フゥ！　ご理解いただき感謝いたしますよ、九浄ヘレナ様！」"

[[dialogue]]
speaker = "シュティレ"
# 「ですが話を聞いていると、ダッチと協力したところで何とかなる相手にも思えませんが？」
line = "「ですが話を聞いていると、ダッチと協力したところで何とかなる相手にも思えませんが？」"

[[dialogue]]
speaker = "ダッチ"
# 「そんなことはありません。私も『七彩のアイテムズ』です！　実力差こそあれど、抵抗することはできるのですよッ！」
line = "「そんなことはありません。私も『七彩のアイテムズ』です！　実力差こそあれど、抵抗することはできるのですよッ！」"

[[dialogue]]
speaker = "ダッチ"
# 「私の能力は欲望の実現──この力でシールドを張り、シエスタの『支配』の干渉を拒めばよいのです！」
line = "「私の能力は欲望の実現──この力でシールドを張り、シエスタの『支配』の干渉を拒めばよいのです！」"

[[dialogue]]
speaker = "ダッチ"
# 「……まぁそれでも、味方が大勢いては効果も目減りします」
line = "「……まぁそれでも、味方が大勢いては効果も目減りします」"

[[dialogue]]
speaker = "ダッチ"
# 「緋宮クロト様、並びにアニマ様奪還のための救出チームは、私を除いて３名。このくらいが限界でしょう」
line = "「緋宮クロト様、並びにアニマ様奪還のための救出チームは、私を除いて３名。このくらいが限界でしょう」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふむ……ならば、ノヴァフォーム持ちのアナたちは留守番だな」
line = "「ふむ……ならば、ノヴァフォーム持ちのアナたちは留守番だな」"

[[dialogue]]
speaker = "ダッチ"
# 「賢明な判断ですね。さらに救出チームの３名は全員、バニーガールにしていただきたい！！！」
line = "「賢明な判断ですね。さらに救出チームの３名は全員、バニーガールにしていただきたい！！！」"

[[dialogue]]
speaker = "蘭美"
# 「それ、本当に必要なことなの！？　バニーガールを侍らせたいだけじゃない！」
line = "「それ、本当に必要なことなの！？　バニーガールを侍らせたいだけじゃない！」"

[[dialogue]]
speaker = "ダッチ"
# 「何を仰いますか！　私の力は欲望ですよ！？」
line = "「何を仰いますか！　私の力は欲望ですよ！？」"

[[dialogue]]
speaker = "ダッチ"
# 「奪われてなるものかッ！　渡してなるものかッ！　心の底から想える相手でなければ、強く願えない！　これは譲れません！！」
line = "「奪われてなるものかッ！　渡してなるものかッ！　心の底から想える相手でなければ、強く願えない！　これは譲れません！！」"

[[dialogue]]
speaker = "ヘレナ"
# 「ダッチの<ruby=ヘンタイ>欲望</ruby>シールドを十全に発揮するためには、バニーガールでなければダメ、か……」
line = "「ダッチの<ruby>欲望<rt>ヘンタイ</rt></ruby>シールドを十全に発揮するためには、バニーガールでなければダメ、か……」"

[[dialogue]]
speaker = "ヘレナ"
# 「──蘭美。救出チームの１名はお前だ！　任せたぞ！！」
line = "「──蘭美。救出チームの１名はお前だ！　任せたぞ！！」"

[[dialogue]]
speaker = "蘭美"
# 「そんな、当主様っ！？」
line = "「そんな、当主様っ！？」"

[[dialogue]]
speaker = "ダッチ"
# 「ヌッフフフフ！　事件解決まで一心同体ということですねぇ、蘭美様！　フゥゥ～～～！！」
line = "「ヌッフフフフ！　事件解決まで一心同体ということですねぇ、蘭美様！　フゥゥ～～～！！」"

[[dialogue]]
speaker = "蘭美"
# 「帰りたいぴょん……」
line = "「帰りたいぴょん……」"

[[dialogue]]
speaker = "ヘレナ"
# 「残り２名の人選はどうする。先ほどのバニーたちを招集するか？」
line = "「残り２名の人選はどうする。先ほどのバニーたちを招集するか？」"

[[dialogue]]
speaker = "ダッチ"
# 「それもアリですが────フゥッ！！」
line = "「それもアリですが────フゥッ！！」"

[[dialogue]]
speaker = "シュティレ"
# 「む。シュティレとトリュファイナさんに、いやらしい視線を感じます」
line = "「む。シュティレとトリュファイナさんに、いやらしい視線を感じます」"

[[dialogue]]
speaker = "トリュファイナ"
# 「わ、私たちですか……！？」
line = "「わ、私たちですか……！？」"

[[dialogue]]
speaker = "ダッチ"
# 「セナリィ様たちのバニー姿は、すでに拝見しましたからねぇ……こういう機会とあらば、新たなバニーを望むのが筋でしょうッ！」
line = "「セナリィ様たちのバニー姿は、すでに拝見しましたからねぇ……こういう機会とあらば、新たなバニーを望むのが筋でしょうッ！」"

[[dialogue]]
speaker = "シュティレ"
# 「やりたい放題ですね。流石はヘンタイ紳士」
line = "「やりたい放題ですね。流石はヘンタイ紳士」"

[[dialogue]]
speaker = "ダッチ"
# 「褒め言葉として受け取りましょう。ではお２人とも、自己紹介をお願いします」
line = "「褒め言葉として受け取りましょう。ではお２人とも、自己紹介をお願いします」"

[[dialogue]]
speaker = "ダッチ"
# 「チームを組むのですから、人となりを把握することは大切です。ヌフフ、貴女たちのことをよく知った上で、最も似合うバニーを贈りましょう！」
line = "「チームを組むのですから、人となりを把握することは大切です。ヌフフ、貴女たちのことをよく知った上で、最も似合うバニーを贈りましょう！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「じ、自己紹介と言われましても……私は先代・光の魔女。トリュファイナと申します……」
line = "「じ、自己紹介と言われましても……私は先代・光の魔女。トリュファイナと申します……」"

[[dialogue]]
speaker = "ダッチ"
# 「ほう！　光の魔女！　いいですねぇ。私、魔女様にバニーを着せたことはまだありません。滾ってまいりましたよぉ～！！」
line = "「ほう！　光の魔女！　いいですねぇ。私、魔女様にバニーを着せたことはまだありません。滾ってまいりましたよぉ～！！」"

[[dialogue]]
speaker = "トリュファイナ"
# （ちょ、ちょっと……気持ち悪いです……）
line = "（ちょ、ちょっと……気持ち悪いです……）"

[[dialogue]]
speaker = "シュティレ"
# 「どうも。天才錬金術師アニマ先輩の一番弟子にして、購買部の美少女看板娘２号──」
line = "「どうも。天才錬金術師アニマ先輩の一番弟子にして、購買部の美少女看板娘２号──」"

[[dialogue]]
speaker = "シュティレ"
# 「さらに煌炎の超天使アナちゃんと姉妹の契りを交わし、第７代・光の魔女様ともズッ友の間柄──」
line = "「さらに煌炎の超天使アナちゃんと姉妹の契りを交わし、第７代・光の魔女様ともズッ友の間柄──」"

[[dialogue]]
speaker = "シュティレ"
# 「超機動武神ギガンドムをこよなく愛する精錬の機甲天使──その名も！」
line = "「超機動武神ギガンドムをこよなく愛する精錬の機甲天使──その名も！」"

[[dialogue]]
speaker = "シュティレ"
# 「流星附属校の『<ruby=ライトニング・モーメント>紫電一閃</ruby>』──閃光のシュティレと申します。ぶい」
line = "「流星附属校の『<ruby>紫電一閃<rt>ライトニング・モーメント</rt></ruby>』──閃光のシュティレと申します。ぶい」"

[[dialogue]]
speaker = "アナ"
# 「シュティレさん。自己紹介のよくばりセットに磨きがかかってきましたね」
line = "「シュティレさん。自己紹介のよくばりセットに磨きがかかってきましたね」"

[[dialogue]]
speaker = "ダッチ"
# 「フフフ、素晴らしい！！！　私、欲望の強い御方にはシンパシーを覚えてしまうタチでして……随分と愉快な少女のご様子！！」
line = "「フフフ、素晴らしい！！！　私、欲望の強い御方にはシンパシーを覚えてしまうタチでして……随分と愉快な少女のご様子！！」"

[[dialogue]]
speaker = "シュティレ"
# 「はい。常におもしれー女を目指しています。ぶいぶい」
line = "「はい。常におもしれー女を目指しています。ぶいぶい」"

[[dialogue]]
speaker = "ダッチ"
# 「フゥ～！　よろしくお願いいたしますよぉシュティレ様！　ぶいぶいっ！」
line = "「フゥ～！　よろしくお願いいたしますよぉシュティレ様！　ぶいぶいっ！」"

[[dialogue]]
speaker = "ダッチ"
# 「では──チェンジ、バニーフォームッ！！！」
line = "「では──チェンジ、バニーフォームッ！！！」"

[[dialogue]]
speaker = "シュティレ"
# 「……おや。てっきり蘭美先輩と同じような、ザ・バニーな感じの衣装になるとばかり思っていたのですが」
line = "「……おや。てっきり蘭美先輩と同じような、ザ・バニーな感じの衣装になるとばかり思っていたのですが」"

[[dialogue]]
speaker = "トリュファイナ"
# 「は、はい。ウサギの耳はついておりますが、何だか趣が異なりますね……？」
line = "「は、はい。ウサギの耳はついておりますが、何だか趣が異なりますね……？」"

[[dialogue]]
speaker = "ヘレナ"
# 「ほう──和風バニー！　敵ながらあっぱれ。見事な意匠ではないか！！」
line = "「ほう──和風バニー！　敵ながらあっぱれ。見事な意匠ではないか！！」"

[[dialogue]]
speaker = "ダッチ"
# 「何を仰いますか、ヘレナ様。貴女様が仕立てた蘭美様のバニー服もまた素晴らしい！　あのクオリティに負けぬよう気合いをいれたのです！」
line = "「何を仰いますか、ヘレナ様。貴女様が仕立てた蘭美様のバニー服もまた素晴らしい！　あのクオリティに負けぬよう気合いをいれたのです！」"

[[dialogue]]
speaker = "ヘレナ"
# 「見る目があるではないか。蘭美の衣装は、夜も寝ないで昼寝して作った一品なのだ♪」
line = "「見る目があるではないか。蘭美の衣装は、夜も寝ないで昼寝して作った一品なのだ♪」"

[[dialogue]]
speaker = "マトイ"
# 「な、なんか意気投合しちゃってるんだけど……」
line = "「な、なんか意気投合しちゃってるんだけど……」"

[[dialogue]]
speaker = "アナ"
# 「出会ってはならない２人が出会ってしまった可能性がありますね」
line = "「出会ってはならない２人が出会ってしまった可能性がありますね」"

[[dialogue]]
speaker = "ダッチ"
# 「さぁ、お２人とも。準備はよろしいですか？」
line = "「さぁ、お２人とも。準備はよろしいですか？」"

[[dialogue]]
speaker = "シュティレ"
# 「はい。着心地は良好。問題ありません」
line = "「はい。着心地は良好。問題ありません」"

[[dialogue]]
speaker = "トリュファイナ"
# 「私も、いつもと変わらず魔力を行使できそうです。この衣装でついていけばよろしいのですね、ダッチ様？」
line = "「私も、いつもと変わらず魔力を行使できそうです。この衣装でついていけばよろしいのですね、ダッチ様？」"

[[dialogue]]
speaker = "ダッチ"
# 「ンン～……ダメですねぇ。バニーガールに最も必要なアレを忘れているではありませんか！」
line = "「ンン～……ダメですねぇ。バニーガールに最も必要なアレを忘れているではありませんか！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「アレ……ですか？」
line = "「アレ……ですか？」"

[[dialogue]]
speaker = "シュティレ"
# 「ふむ。ダッチにやる気を出してもらわなければ、マスターたちの救援は望めない……となれば、徹底しなくてはいけませんね」
line = "「ふむ。ダッチにやる気を出してもらわなければ、マスターたちの救援は望めない……となれば、徹底しなくてはいけませんね」"

[[dialogue]]
speaker = "シュティレ"
# 「和風バニー天使、シュティレ。救援チームとして奮闘いたします。ぴょんぴょん、ぴょーん」
line = "「和風バニー天使、シュティレ。救援チームとして奮闘いたします。ぴょんぴょん、ぴょーん」"

[[dialogue]]
speaker = "ダッチ"
# 「フゥゥウ！！　シュティレ様はノリがいいですねぇ！　素晴らしいッ！！」
line = "「フゥゥウ！！　シュティレ様はノリがいいですねぇ！　素晴らしいッ！！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「え、えっと……語尾に、ぴょんを付けなくてはいけない、ということですか？」
line = "「え、えっと……語尾に、ぴょんを付けなくてはいけない、ということですか？」"

[[dialogue]]
speaker = "ダッチ"
# 「当然でしょう！　貴女たちは今、私の可愛い子ウサギたちっ！　ウサギになりきらなければバニーになったとは言えません！」
line = "「当然でしょう！　貴女たちは今、私の可愛い子ウサギたちっ！　ウサギになりきらなければバニーになったとは言えません！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ほえぇ～……勉強になりますっ。では──私も！」
line = "「ほえぇ～……勉強になりますっ。では──私も！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ダッチ様！　よろしくお願いいたします！　癒しの魔法ならばお任せくださいませ！　ぴょん、ぴょんっ♪」
line = "「ダッチ様！　よろしくお願いいたします！　癒しの魔法ならばお任せくださいませ！　ぴょん、ぴょんっ♪」"

[[dialogue]]
speaker = "ダッチ"
# 「ンンン～～～♪　光の魔女様の、ぴょん！　最高ですねぇ、気合いがノってきましたよぉ～！」
line = "「ンンン～～～♪　光の魔女様の、ぴょん！　最高ですねぇ、気合いがノってきましたよぉ～！」"

[[dialogue]]
speaker = "蘭美"
# 「うう……ふざけてる感じなのに、本当に戦闘力が跳ね上がってるわ……何なのコイツ……」
line = "「うう……ふざけてる感じなのに、本当に戦闘力が跳ね上がってるわ……何なのコイツ……」"

[[dialogue]]
speaker = "ダッチ"
# 「では皆さん、シエスタのところに乗り込むとしましょう！」
line = "「では皆さん、シエスタのところに乗り込むとしましょう！」"

[[dialogue]]
speaker = "ダッチ"
# 「可憐な子ウサギたちの安全は──私が守るッ！！！」
line = "「可憐な子ウサギたちの安全は──私が守るッ！！！」"

[[dialogue]]
speaker = "unk"
# ──流星市国内、某所にある遊園地。
line = "──流星市国内、某所にある遊園地。"

[[dialogue]]
speaker = "unk"
# 偶然発生したアステラの内部はすでに『支配』のシエスタにより改造され、星騎士たちのアラートシステムにも感知できない、天然の城となっていた。
line = "偶然発生したアステラの内部はすでに『支配』のシエスタにより改造され、星騎士たちのアラートシステムにも感知できない、天然の城となっていた。"

[[dialogue]]
speaker = "シエスタ"
# 「ふふふふふっ<emoji=heart04>　お兄ちゃん、次はあれ！　シス、あのジェットコースターに乗りたいの～<emoji=heart04>」
line = "「ふふふふふっ<emoji=heart04>　お兄ちゃん、次はあれ！　シス、あのジェットコースターに乗りたいの～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# よーし、行こう！
line = "よーし、行こう！"

[[dialogue]]
speaker = "unk"
# すでに緋宮クロトは『支配』の能力によって記憶を改竄されていた。
line = "すでに緋宮クロトは『支配』の能力によって記憶を改竄されていた。"

[[dialogue]]
speaker = "unk"
# 目の前のシエスタを『愛しい妹』と思い込んでいる──手を繋ぎながら、クロトは遊園地の中をむつまじく歩く。
line = "目の前のシエスタを『愛しい妹』と思い込んでいる──手を繋ぎながら、クロトは遊園地の中をむつまじく歩く。"

[[dialogue]]
speaker = "モンスター"
# 「イ～～～～♪」
line = "「イ～～～～♪」"

[[dialogue]]
speaker = "unk"
# シエスタの周囲には『支配』の能力によって無力化されたモンスターたちの姿もあった。全員が、ペットのように後をついていく。
line = "シエスタの周囲には『支配』の能力によって無力化されたモンスターたちの姿もあった。全員が、ペットのように後をついていく。"

[[dialogue]]
speaker = "シエスタ"
# 「嬉しいの、嬉しいのっ♪　シス、ずっとずっと優しいお兄ちゃんが欲しかったの♪」
line = "「嬉しいの、嬉しいのっ♪　シス、ずっとずっと優しいお兄ちゃんが欲しかったの♪」"

[[dialogue]]
speaker = "シエスタ"
# 「お兄ちゃん、もう安心なの。ずーっとこの世界で遊んで暮らしていいの♪」
line = "「お兄ちゃん、もう安心なの。ずーっとこの世界で遊んで暮らしていいの♪」"

[[dialogue]]
speaker = "シエスタ"
# 「危ないことはしなくていいし、大変なお仕事も全部ほっぽり出しちゃっていいの……！」
line = "「危ないことはしなくていいし、大変なお仕事も全部ほっぽり出しちゃっていいの……！」"

[[dialogue]]
speaker = "シエスタ"
# 「何があっても……お兄ちゃんのこと。シスが絶対、守ってみせるの～♪」
line = "「何があっても……お兄ちゃんのこと。シスが絶対、守ってみせるの～♪」"
