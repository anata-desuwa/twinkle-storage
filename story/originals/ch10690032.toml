[[dialogue]]
speaker = "unk"
# 第２話,欲しかった言葉,P
line = "第２話,欲しかった言葉,P"

[[dialogue]]
speaker = "unk"
# 最近の新星星徒会は、いつもに増して多忙を極めていた。
line = "最近の新星星徒会は、いつもに増して多忙を極めていた。"

[[dialogue]]
speaker = "unk"
# セシアともなかなか会えずじまいの日々が続いている……
line = "セシアともなかなか会えずじまいの日々が続いている……"

[[dialogue]]
speaker = "セシア"
# 「お、お邪魔するわ」
line = "「お、お邪魔するわ」"

[[dialogue]]
speaker = "セシア"
# 「あら、会長。今は１人なの？　ふふ、ちょうどよかった。最近は会えてなかったから、どうしているものかと思って」
line = "「あら、会長。今は１人なの？　ふふ、ちょうどよかった。最近は会えてなかったから、どうしているものかと思って」"

[[dialogue]]
speaker = "unk"
# 俺もセシアに会いたかった
line = "俺もセシアに会いたかった"

[[dialogue]]
speaker = "unk"
# 久しぶりに会えて嬉しい
line = "久しぶりに会えて嬉しい"

[[dialogue]]
speaker = "セシア"
# 「……！　そ、そう。わたくしもなのよ。なにせわたくし達は今や『恋人関係』だもの。お互いを欲するのは自然なことだわ」
line = "「……！　そ、そう。わたくしもなのよ。なにせわたくし達は今や『恋人関係』だもの。お互いを欲するのは自然なことだわ」"

[[dialogue]]
speaker = "セシア"
# 「もちろん忙しければ、わたくしもすぐに出ていくのだけど……」
line = "「もちろん忙しければ、わたくしもすぐに出ていくのだけど……」"

[[dialogue]]
speaker = "セシア"
# 「問題ない？　そう。良かったわ。うん。じゃあ、もう少しここに居させてもらうとして……」
line = "「問題ない？　そう。良かったわ。うん。じゃあ、もう少しここに居させてもらうとして……」"

[[dialogue]]
speaker = "unk"
# セシアの様子は、どことなくぎこちないように感じられた。
line = "セシアの様子は、どことなくぎこちないように感じられた。"

[[dialogue]]
speaker = "セシア"
# 「どうかしたかって？　べ、別になんでもないのよ。ただ、その……久しぶりだから？　だわ、きっと」
line = "「どうかしたかって？　べ、別になんでもないのよ。ただ、その……久しぶりだから？　だわ、きっと」"

[[dialogue]]
speaker = "セシア"
# 「それにしても……今日はいい天気ね！　今にも羽ばたきたくなるような、絶好の飛翔日和よ！」
line = "「それにしても……今日はいい天気ね！　今にも羽ばたきたくなるような、絶好の飛翔日和よ！」"

[[dialogue]]
speaker = "unk"
# あんまりよくない……
line = "あんまりよくない……"

[[dialogue]]
speaker = "unk"
# 曇りだけど……
line = "曇りだけど……"

[[dialogue]]
speaker = "セシア"
# 「………………雨の日に比べればいい天気という意味よ！　雲の向こうから陽が差し込んでいるもの」
line = "「………………雨の日に比べればいい天気という意味よ！　雲の向こうから陽が差し込んでいるもの」"

[[dialogue]]
speaker = "セシア"
# 「後は……そうそう。えっと。今日は会長に見てほしいものがあって来たのよ。それというのはね……」
line = "「後は……そうそう。えっと。今日は会長に見てほしいものがあって来たのよ。それというのはね……」"

[[dialogue]]
speaker = "セシア"
# 「……えっと……ほら、これよ。わたくし、ジャンプから３回転できるようになったの。すごいでしょう？」
line = "「……えっと……ほら、これよ。わたくし、ジャンプから３回転できるようになったの。すごいでしょう？」"

[[dialogue]]
speaker = "セシア"
# 「ふふふ、そんなに褒めなくてもいいわ。妖精の羽がなせる技かしら？」
line = "「ふふふ、そんなに褒めなくてもいいわ。妖精の羽がなせる技かしら？」"

[[dialogue]]
speaker = "セシア"
# （さ……さっきから何をしているのかしら、わたくし。紅明ママに送り出されて、会長に新しい姿を見せるはずだったのに……）
line = "（さ……さっきから何をしているのかしら、わたくし。紅明ママに送り出されて、会長に新しい姿を見せるはずだったのに……）"

[[dialogue]]
speaker = "セシア"
# （会長の顔を見たら……なんだか体が強張ってしまって……本題を切り出せないわ）
line = "（会長の顔を見たら……なんだか体が強張ってしまって……本題を切り出せないわ）"

[[dialogue]]
speaker = "セシア"
# （こんな関係ない話を続けている場合ではないというのに……）
line = "（こんな関係ない話を続けている場合ではないというのに……）"

[[dialogue]]
speaker = "unk"
# ……セシア？
line = "……セシア？"

[[dialogue]]
speaker = "セシア"
# 「──はっ。いけない。わたくしとしたことが、こんなことではいけないわ」
line = "「──はっ。いけない。わたくしとしたことが、こんなことではいけないわ」"

[[dialogue]]
speaker = "セシア"
# 「実はね、会長。あなたに見てもらいたいものがあるの。あなたは何もしなくていいわ。そのままでいて」
line = "「実はね、会長。あなたに見てもらいたいものがあるの。あなたは何もしなくていいわ。そのままでいて」"

[[dialogue]]
speaker = "セシア"
# 「ふぅ……せーの……変身！」
line = "「ふぅ……せーの……変身！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「──じゃーん！　どうかしら？　これがわたくしの新たなフォルムよ！」
line = "「──じゃーん！　どうかしら？　これがわたくしの新たなフォルムよ！」"

[[dialogue]]
speaker = "unk"
# セシアは、衣装を隅々まで披露するように、その場でくるりと回った。
line = "セシアは、衣装を隅々まで披露するように、その場でくるりと回った。"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「わたくし達守護天使が１対１で、ルヴィネさまと新たに<ruby=パス>経路</ruby>を結び直しているということは知っているかしら？」
line = "「わたくし達守護天使が１対１で、ルヴィネさまと新たに<ruby>経路<rt>パス</rt></ruby>を結び直しているということは知っているかしら？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「わたくしもその契約を結び直したのですけど──その結果、わたくしは元の姿、《万成》のアウクセシアの力を一部だけど取り戻したの」
line = "「わたくしもその契約を結び直したのですけど──その結果、わたくしは元の姿、《万成》のアウクセシアの力を一部だけど取り戻したの」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そうして芽生えたのがこの姿よ！　この姿を会長にもひと目見てほしかったの！」
line = "「そうして芽生えたのがこの姿よ！　この姿を会長にもひと目見てほしかったの！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「えと……その……どうかしら！？」
line = "「えと……その……どうかしら！？」"

[[dialogue]]
speaker = "unk"
# すごく似合ってる
line = "すごく似合ってる"

[[dialogue]]
speaker = "unk"
# 可愛いよ
line = "可愛いよ"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「……！　可愛い──ほ、本当かしら！？」
line = "「……！　可愛い──ほ、本当かしら！？」"

[[dialogue]]
speaker = "unk"
# セシアは勢いよくこちらに抱きついてきた。
line = "セシアは勢いよくこちらに抱きついてきた。"

[[dialogue]]
speaker = "unk"
# 彼女を撫でつつ、何度も何度も可愛いと言ってやる。
line = "彼女を撫でつつ、何度も何度も可愛いと言ってやる。"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あ、あう……わたくしが……可愛い……そ、そう。ええ、会長がそう思ってくれていることは知っているけど……知っているはずなのに……」
line = "「あ、あう……わたくしが……可愛い……そ、そう。ええ、会長がそう思ってくれていることは知っているけど……知っているはずなのに……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「不思議だわ……今までたくさんのママに、可愛い可愛いと褒められてきたわたくしが……会長のたったひと言だけで、ここまで<ruby=たか>昂</ruby>ぶってしまうなんて……」
line = "「不思議だわ……今までたくさんのママに、可愛い可愛いと褒められてきたわたくしが……会長のたったひと言だけで、ここまで<ruby>昂<rt>たか</rt></ruby>ぶってしまうなんて……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふふっ！　今は素直に喜ぶことにするわ！　素直なわたくしが１番だって、紅明ママも言ってくれていたものね！」
line = "「ふふっ！　今は素直に喜ぶことにするわ！　素直なわたくしが１番だって、紅明ママも言ってくれていたものね！」"

[[dialogue]]
speaker = "unk"
# 様子が変だったの？
line = "様子が変だったの？"

[[dialogue]]
speaker = "unk"
# にしてもどうして……
line = "にしてもどうして……"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それについては、わたくしにもわからないのよ」
line = "「それについては、わたくしにもわからないのよ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「この衣装に芽生えてから連日、会長のことを考えていたわ。そうしたら……なかなか会うに会えなくて」
line = "「この衣装に芽生えてから連日、会長のことを考えていたわ。そうしたら……なかなか会うに会えなくて」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「おかしいでしょう？　アウクセシアの力が戻るにつれて……蓄積されていた知識も増えたはずなのに……うまく踏み出せなくなるなんて」
line = "「おかしいでしょう？　アウクセシアの力が戻るにつれて……蓄積されていた知識も増えたはずなのに……うまく踏み出せなくなるなんて」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「わたくしらしくないと、自分でも思っていたのよ。でも、なぜか、胸がずっとトクントクンしていたの」
line = "「わたくしらしくないと、自分でも思っていたのよ。でも、なぜか、胸がずっとトクントクンしていたの」"

[[dialogue]]
speaker = "unk"
# ドキドキしてるセシアも可愛いよ
line = "ドキドキしてるセシアも可愛いよ"

[[dialogue]]
speaker = "unk"
# そんな風に思ってもらえて嬉しい
line = "そんな風に思ってもらえて嬉しい"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「～～～～っ……！　会長ってば……もう、ふふっ！　なんだか、さっきまでの悩みがちっぽけに思えてきたわ」
line = "「～～～～っ……！　会長ってば……もう、ふふっ！　なんだか、さっきまでの悩みがちっぽけに思えてきたわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あなたの『可愛い』をもらうために……セシア、またデートに行きたいわ！」
line = "「あなたの『可愛い』をもらうために……セシア、またデートに行きたいわ！」"

[[dialogue]]
speaker = "unk"
# 何かから解き放たれたかのように無邪気に喜ぶセシアの姿に、こちらの心まで弾んでしまうのだった。
line = "何かから解き放たれたかのように無邪気に喜ぶセシアの姿に、こちらの心まで弾んでしまうのだった。"
