[[dialogue]]
speaker = "unk"
# 第１話,異世界の九浄ヘレナ,P
line = "第１話,異世界の九浄ヘレナ,P"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「出張版！　おしえて、理事長さ～ん♪」
line = "「出張版！　おしえて、理事長さ～ん♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「今回は、世界の枠を越えた『ダブルヘレナ』でお送りするぞ♪」
line = "「今回は、世界の枠を越えた『ダブルヘレナ』でお送りするぞ♪」"

[[dialogue]]
speaker = "unk"
# なんか急に始まった！？
line = "なんか急に始まった！？"

[[dialogue]]
speaker = "unk"
# 呼び出されたと思ったら
line = "呼び出されたと思ったら"

[[dialogue]]
speaker = "unk"
# リゾート結界の一件の後――異世界の『流星クルセイダース』の一行は、元の世界へ戻るまでの間、しばらくこちらの世界で過ごすことになった。
line = "リゾート結界の一件の後――異世界の『流星クルセイダース』の一行は、元の世界へ戻るまでの間、しばらくこちらの世界で過ごすことになった。"

[[dialogue]]
speaker = "unk"
# そんな中、俺は異世界のヘレナさんに呼び出され、再びリゾート結界へとやって来ていた。
line = "そんな中、俺は異世界のヘレナさんに呼び出され、再びリゾート結界へとやって来ていた。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ、せっかくだし、こっちの世界の魔王ちゃんと、改めて仲良くなりたいと思ってね～♪」
line = "「ふふっ、せっかくだし、こっちの世界の魔王ちゃんと、改めて仲良くなりたいと思ってね～♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「それに、世界を越えて２人のヘレナが揃ったのだ。ちゃんとファンサービスをしておかねばな」
line = "「それに、世界を越えて２人のヘレナが揃ったのだ。ちゃんとファンサービスをしておかねばな」"

[[dialogue]]
speaker = "unk"
# ファンサービスって何！？
line = "ファンサービスって何！？"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「というわけで、私が異世界の『九浄ヘレナ』よ～♪」
line = "「というわけで、私が異世界の『九浄ヘレナ』よ～♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「流星クルセイダースの『九浄リア』のお姉ちゃんをやっているわ♪」
line = "「流星クルセイダースの『九浄リア』のお姉ちゃんをやっているわ♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「そして、私がお馴染み、こちらの世界のプリティーでゴージャスな『ヘレナちゃん』であるぞ♪」
line = "「そして、私がお馴染み、こちらの世界のプリティーでゴージャスな『ヘレナちゃん』であるぞ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「それじゃあヘレナちゃん、まずはアレからやるわよ～！」
line = "「それじゃあヘレナちゃん、まずはアレからやるわよ～！」"

[[dialogue]]
speaker = "ヘレナ"
# 「ああ。もう１人の私よ、プリティーに合わせてゆくぞ」
line = "「ああ。もう１人の私よ、プリティーに合わせてゆくぞ」"

[[dialogue]]
speaker = "unk"
# すると、異世界のヘレナさんは静かに目を閉じ、詠唱を開始する。
line = "すると、異世界のヘレナさんは静かに目を閉じ、詠唱を開始する。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――主を照らすは、十字架の鏡に映りし九浄の守護星……デネブ・アルゲディ！」
line = "「――主を照らすは、十字架の鏡に映りし九浄の守護星……デネブ・アルゲディ！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ばばーん☆　ヘレナちゃんと同じ守護星の加護を受けて、私も星騎士に変身よ～♪」
line = "「ばばーん☆　ヘレナちゃんと同じ守護星の加護を受けて、私も星騎士に変身よ～♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「さあ、スクショタイムだ！　存分にゴージャスなツーショットを撮るがよいぞ♪」
line = "「さあ、スクショタイムだ！　存分にゴージャスなツーショットを撮るがよいぞ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「いぇ～い☆　お姉さんたちからのサービスよ<emoji=heart04>」
line = "「いぇ～い☆　お姉さんたちからのサービスよ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# スクショタイムって何です！？
line = "スクショタイムって何です！？"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 『ええい！　男なら細かいことは気にするな！　前を向いて進み続けろ！』
line = "『ええい！　男なら細かいことは気にするな！　前を向いて進み続けろ！』"

[[dialogue]]
speaker = "unk"
# 突然、芝居がかった男口調で言い放つヘレナさん。
line = "突然、芝居がかった男口調で言い放つヘレナさん。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――さあ、魔王ちゃん、お姉さんになんでも質問をカモンよ！」
line = "「――さあ、魔王ちゃん、お姉さんになんでも質問をカモンよ！」"

[[dialogue]]
speaker = "unk"
# 今の喋り方は一体……？
line = "今の喋り方は一体……？"

[[dialogue]]
speaker = "unk"
# ええっと、じゃあ……
line = "ええっと、じゃあ……"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ♪　好きな洋画に出てくる『オジサマ軍曹』のリスペクトよ♪」
line = "「ふふっ♪　好きな洋画に出てくる『オジサマ軍曹』のリスペクトよ♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「異世界の私は『洋画好き』ということでな」
line = "「異世界の私は『洋画好き』ということでな」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 『そういうことだ！　わかったか、少年！　わかったら、さっさと次の質問をぶつけてこい！』
line = "『そういうことだ！　わかったか、少年！　わかったら、さっさと次の質問をぶつけてこい！』"

[[dialogue]]
speaker = "unk"
# ヘレナさんは元クルセイダースなんですよね？
line = "ヘレナさんは元クルセイダースなんですよね？"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ええ♪　妹のリアに守護天使の宿ったロザリオを渡す前は、私が向こうの世界の流星学園で、生徒会長として魔族と戦っていたの」
line = "「ええ♪　妹のリアに守護天使の宿ったロザリオを渡す前は、私が向こうの世界の流星学園で、生徒会長として魔族と戦っていたの」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「それで『リ・クリエ』との戦いでは、もう変身できなくなっちゃってたから、リア達の後方支援に回っていたけど……」
line = "「それで『リ・クリエ』との戦いでは、もう変身できなくなっちゃってたから、リア達の後方支援に回っていたけど……」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「でもまさか、異世界に来てまた戦えるようになる日が来るなんて、夢にも思わなかったわ～♪」
line = "「でもまさか、異世界に来てまた戦えるようになる日が来るなんて、夢にも思わなかったわ～♪」"

[[dialogue]]
speaker = "unk"
# 異世界での九浄家の役目って……？
line = "異世界での九浄家の役目って……？"

[[dialogue]]
speaker = "unk"
# 前から気になってたんですけど
line = "前から気になってたんですけど"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「いい質問ね！　向こうの世界での九浄家は、古くから『フィーニスの塔』の管理を任されてきた一族なの」
line = "「いい質問ね！　向こうの世界での九浄家は、古くから『フィーニスの塔』の管理を任されてきた一族なの」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「それと同時に流星学園を運営して、霊力適正のある子にロザリオを渡し、クルセイダースの役目を継承していく」
line = "「それと同時に流星学園を運営して、霊力適正のある子にロザリオを渡し、クルセイダースの役目を継承していく」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そうして代々、『リ・クリエ』を防ぐ為の活動を密かに行ってきたって感じね」
line = "「そうして代々、『リ・クリエ』を防ぐ為の活動を密かに行ってきたって感じね」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「で、現在は私が九浄家の当主を引き継いで、学園の理事長を務めているわ。こちらの世界のヘレナちゃんと同じくね♪」
line = "「で、現在は私が九浄家の当主を引き継いで、学園の理事長を務めているわ。こちらの世界のヘレナちゃんと同じくね♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「正確には、私の方が魂の導きに従って、もう１人の私の在り方を真似たのだがな」
line = "「正確には、私の方が魂の導きに従って、もう１人の私の在り方を真似たのだがな」"

[[dialogue]]
speaker = "ヘレナ"
# 「向こうでの九浄家は、役割的にはこちらの世界での『星見家』の方が近いと言えるだろう」
line = "「向こうでの九浄家は、役割的にはこちらの世界での『星見家』の方が近いと言えるだろう」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そうそう！　星見家といえば、ご当主様が流星市国の教皇様なんでしょう？」
line = "「そうそう！　星見家といえば、ご当主様が流星市国の教皇様なんでしょう？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ヘレナちゃんに写真を見せてもらったけど、とっても渋くてダンディーなオジサマで、素敵だったわ～<emoji=heart04>」
line = "「ヘレナちゃんに写真を見せてもらったけど、とっても渋くてダンディーなオジサマで、素敵だったわ～<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あ～あ、既婚者じゃなければ、猛烈にアタックしてたのに～♪」
line = "「あ～あ、既婚者じゃなければ、猛烈にアタックしてたのに～♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふふっ、男性の好みに関しては、私とは鏡映しで見事に反転した感じであるな」
line = "「ふふっ、男性の好みに関しては、私とは鏡映しで見事に反転した感じであるな」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「残念ね～。ヘレナちゃんも同じ『年上のオジサマ好き』だったら、お酒を飲みながら、とことん語り明かしたかったのに～」
line = "「残念ね～。ヘレナちゃんも同じ『年上のオジサマ好き』だったら、お酒を飲みながら、とことん語り明かしたかったのに～」"

[[dialogue]]
speaker = "ヘレナ"
# 「ほう？　私としては、たとえ好みにズレがあったとしても、じっくりと盃を交わしたいと思っていたがな」
line = "「ほう？　私としては、たとえ好みにズレがあったとしても、じっくりと盃を交わしたいと思っていたがな」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あははっ、冗談よ～♪　せっかくこうして出会うことができたんだから、仲良く飲むに決まってるじゃな～い！」
line = "「あははっ、冗談よ～♪　せっかくこうして出会うことができたんだから、仲良く飲むに決まってるじゃな～い！」"

[[dialogue]]
speaker = "unk"
# 異世界のヘレナさんは、ヘレナちゃんと仲良さそうに肩を組みながら笑う。
line = "異世界のヘレナさんは、ヘレナちゃんと仲良さそうに肩を組みながら笑う。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「さて、改めて自己紹介も済んだところで、魔王ちゃんにはこれをあげるわ。――はいっ♪」
line = "「さて、改めて自己紹介も済んだところで、魔王ちゃんにはこれをあげるわ。――はいっ♪」"

[[dialogue]]
speaker = "unk"
# と、ヘレナさんがどこからともなく取り出してみせたのは、謎の『トロフィー』であった。
line = "と、ヘレナさんがどこからともなく取り出してみせたのは、謎の『トロフィー』であった。"

[[dialogue]]
speaker = "unk"
# 一体、なんのトロフィーなのかと首を傾げる俺に、ヘレナさんは答える。
line = "一体、なんのトロフィーなのかと首を傾げる俺に、ヘレナさんは答える。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「名づけて――『異世界のヘレナと知り合ったで賞』よ♪」
line = "「名づけて――『異世界のヘレナと知り合ったで賞』よ♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「そういえば、もう１人の私は、向こうの世界の魔王が実績を達成するたびに、トロフィーを与えていたのだったな」
line = "「そういえば、もう１人の私は、向こうの世界の魔王が実績を達成するたびに、トロフィーを与えていたのだったな」"

[[dialogue]]
speaker = "unk"
# トロフィーを集めると、何かあるんですか？
line = "トロフィーを集めると、何かあるんですか？"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ♪　それは～、集めた時のヒ・ミ・ツよ<emoji=heart04>」
line = "「ふふっ♪　それは～、集めた時のヒ・ミ・ツよ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 異世界のヘレナさんはそう言って、唇に指を当て、悪戯っぽくウインクしてみせるのだった。
line = "異世界のヘレナさんはそう言って、唇に指を当て、悪戯っぽくウインクしてみせるのだった。"
