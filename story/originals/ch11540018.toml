line = "「僕も……男としてヘレナさんのこと、もっと気持ちよくしたいです……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「じゃあ……ここからは一緒に<emoji=heart04>」
line = "「じゃあ……ここからは一緒に<emoji=heart04>」"

[[dialogue]]
