line = "「ヘレナさんの好みが、年上の男性だっていうのはわかってます。でも――」"

[[dialogue]]
speaker = "シン"
# 「今はダメでも、将来ヘレナさんの好みに合うオジサマになれるように、僕……頑張りますから！」
line = "「今はダメでも、将来ヘレナさんの好みに合うオジサマになれるように、僕……頑張りますから！」"

[[dialogue]]
speaker = "ヘレナ"
# 「シンちゃん……<emoji=heart04>」
line = "「シンちゃん……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
