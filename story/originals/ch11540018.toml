[[dialogue]]
speaker = "シン"
# 「ヘレナさん、すごく気持ち良さそうで、エッチな顔してますよ」
line = "「ヘレナさん、すごく気持ち良さそうで、エッチな顔してますよ」"

[[dialogue]]
speaker = "ヘレナ"
# 「やぁん<emoji=heart04>　こんな顔……シンちゃんに見られちゃうなんて……<emoji=heart04>　恥ずかしいわ……<emoji=heart04>」
line = "「やぁん<emoji=heart04>　こんな顔……シンちゃんに見られちゃうなんて……<emoji=heart04>　恥ずかしいわ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「でも……気持ち良くて、腰が止められないの……<emoji=heart04>　あっ……んっ<emoji=heart04>　んふぅっ……<emoji=heart04>」
line = "「でも……気持ち良くて、腰が止められないの……<emoji=heart04>　あっ……んっ<emoji=heart04>　んふぅっ……<emoji=heart04>」"

[[dialogue]]
speaker = "シン"
# 「大丈夫です。感じてるヘレナさん……すごく可愛いです」
line = "「大丈夫です。感じてるヘレナさん……すごく可愛いです」"

[[dialogue]]
speaker = "ヘレナ"
# 「んっ<emoji=heart04>　お姉さんに可愛いだなんて……そんなこと言っちゃダメよ<emoji=heart04>」
line = "「んっ<emoji=heart04>　お姉さんに可愛いだなんて……そんなこと言っちゃダメよ<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「胸がドキドキして……おま○こキュンってなっちゃうからぁ……<emoji=heart04>　あっ<emoji=heart04>　あんっ<emoji=heart04>　んうぅっ……<emoji=heart04>」
line = "「胸がドキドキして……おま○こキュンってなっちゃうからぁ……<emoji=heart04>　あっ<emoji=heart04>　あんっ<emoji=heart04>　んうぅっ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「でも……これが本当のエッチなのね……<emoji=heart04>　はあぁっ……んっ<emoji=heart04>　あっ……はぁんっ……<emoji=heart04>」
line = "「でも……これが本当のエッチなのね……<emoji=heart04>　はあぁっ……んっ<emoji=heart04>　あっ……はぁんっ……<emoji=heart04>」"

[[dialogue]]
speaker = "シン"
