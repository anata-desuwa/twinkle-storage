line = "「んっ<emoji=heart04>　そんなこと言われたら……余計にドキドキして、おま○こ興奮してきちゃう<emoji=heart04>　あっ<emoji=heart04>　んっ……はぁんっ<emoji=heart04>」"

[[dialogue]]
speaker = "シン"
