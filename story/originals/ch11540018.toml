[[dialogue]]
speaker = "unk"
# リゾート結界の事件が解決してから、しばらく経ったある休日。
line = "リゾート結界の事件が解決してから、しばらく経ったある休日。"

[[dialogue]]
speaker = "unk"
# 僕――『<ruby=さくら>咲良</ruby>シン』は、ヘレナさんから呼び出されて、流星学園の生徒会室から繋がるリゾート結界へと再びやって来ていた。
line = "僕――『<ruby>咲良<rt>さくら</rt></ruby>シン』は、ヘレナさんから呼び出されて、流星学園の生徒会室から繋がるリゾート結界へと再びやって来ていた。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――シンちゃん。お姉さんのデートに付き合ってくれてありがと<emoji=heart04>」
line = "「――シンちゃん。お姉さんのデートに付き合ってくれてありがと<emoji=heart04>」"

[[dialogue]]
speaker = "シン"
# 「いえ……でも、ヘレナさんから誘ってくれるなんて、今日はどうしたんですか？」
line = "「いえ……でも、ヘレナさんから誘ってくれるなんて、今日はどうしたんですか？」"

[[dialogue]]
speaker = "unk"
# ２人きりのデートだと言って誘われた為、男としてはやはりどうしてもドキドキしてしまう。
line = "２人きりのデートだと言って誘われた為、男としてはやはりどうしてもドキドキしてしまう。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ、まだ何もしてないのに、もう顔が赤くなってるわよ？」
line = "「ふふっ、まだ何もしてないのに、もう顔が赤くなってるわよ？」"

[[dialogue]]
speaker = "unk"
# そう言って、ヘレナさんはそっと僕に顔を近づけて――耳元で吐息を吹きかけるように囁く。
line = "そう言って、ヘレナさんはそっと僕に顔を近づけて――耳元で吐息を吹きかけるように囁く。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「シンちゃんが期待している通り――」
line = "「シンちゃんが期待している通り――」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「今日はお姉さんが、海で特別な『ご褒美』をあげるわ<emoji=heart04>」
line = "「今日はお姉さんが、海で特別な『ご褒美』をあげるわ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# そうして、ヘレナさんに手を引かれて移動した場所は、海辺の桟橋の先にある、開放的な『水上コテージ』だった。
line = "そうして、ヘレナさんに手を引かれて移動した場所は、海辺の桟橋の先にある、開放的な『水上コテージ』だった。"

[[dialogue]]
speaker = "ヘレナ"
# 「よいしょっと……<emoji=heart04>　ん……ふうぅ……<emoji=heart04>」
line = "「よいしょっと……<emoji=heart04>　ん……ふうぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ヘレナさんに言われるままベッドに仰向けになると、ヘレナさんがそのまま僕の上に跨ってくる。
line = "ヘレナさんに言われるままベッドに仰向けになると、ヘレナさんがそのまま僕の上に跨ってくる。"

[[dialogue]]
speaker = "シン"
# 「へ、ヘレナさん……！？　この体勢って……」
line = "「へ、ヘレナさん……！？　この体勢って……」"

[[dialogue]]
speaker = "ヘレナ"
# 「……シンちゃんには前から、頑張るたびにトロフィーをあげてたでしょ？　それで集めたら、ご褒美でエッチなことをしてあげていたけど――」
line = "「……シンちゃんには前から、頑張るたびにトロフィーをあげてたでしょ？　それで集めたら、ご褒美でエッチなことをしてあげていたけど――」"

[[dialogue]]
speaker = "ヘレナ"
# 「でも、本番はずっとお預けだったわよね。シンちゃんは世界を救うくらい頑張ってくれてたのに……さすがにいい加減、私も悪いなって思ったのよ」
line = "「でも、本番はずっとお預けだったわよね。シンちゃんは世界を救うくらい頑張ってくれてたのに……さすがにいい加減、私も悪いなって思ったのよ」"

[[dialogue]]
speaker = "ヘレナ"
# 「だから今日は――シンちゃんに私の初めてをあげるわ<emoji=heart04>」
line = "「だから今日は――シンちゃんに私の初めてをあげるわ<emoji=heart04>」"

[[dialogue]]
speaker = "シン"
# 「えぇっ……！？　そ、それって……」
line = "「えぇっ……！？　そ、それって……」"

[[dialogue]]
speaker = "ヘレナ"
# 「それとも、年上のお姉さんの『処女』なんて、面倒でイヤかしら……？」
line = "「それとも、年上のお姉さんの『処女』なんて、面倒でイヤかしら……？」"

[[dialogue]]
speaker = "unk"
# ちょっと不安げな視線を向けるヘレナさんに、僕は慌てて首を振る。
line = "ちょっと不安げな視線を向けるヘレナさんに、僕は慌てて首を振る。"

[[dialogue]]
speaker = "シン"
# 「いやいやいや！　そんなわけないじゃないですか！」
line = "「いやいやいや！　そんなわけないじゃないですか！」"

[[dialogue]]
speaker = "シン"
# 「ただ……ヘレナさんは『年上のオジサマ』が好みのタイプだから、これまで初めてを取っておいたんじゃ……」
line = "「ただ……ヘレナさんは『年上のオジサマ』が好みのタイプだから、これまで初めてを取っておいたんじゃ……」"

[[dialogue]]
speaker = "ヘレナ"
# 「そうね。確かに私は、年下の男の子がタイプってわけじゃなかったわ。でも――」
line = "「そうね。確かに私は、年下の男の子がタイプってわけじゃなかったわ。でも――」"

[[dialogue]]
speaker = "ヘレナ"
# 「一生懸命頑張ってるシンちゃんの姿を見ていたら……少しずつ気持ちが変わって、ちゃんとエッチしてあげたいなって思ったのよ」
line = "「一生懸命頑張ってるシンちゃんの姿を見ていたら……少しずつ気持ちが変わって、ちゃんとエッチしてあげたいなって思ったのよ」"

[[dialogue]]
speaker = "シン"
# 「ヘレナさん……」
line = "「ヘレナさん……」"

[[dialogue]]
speaker = "ヘレナ"
# 「だから嫌じゃなかったら、ご褒美として受け取って欲しいわ<emoji=heart04>　んっ……<emoji=heart04>」
line = "「だから嫌じゃなかったら、ご褒美として受け取って欲しいわ<emoji=heart04>　んっ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ヘレナさんはゆっくりと腰を動かし、熱を帯びた秘部をペニスに擦りつけてくる。
line = "ヘレナさんはゆっくりと腰を動かし、熱を帯びた秘部をペニスに擦りつけてくる。"

[[dialogue]]
speaker = "ヘレナ"
# 「あんっ……<emoji=heart04>　シンちゃんのおち○ぽ、もうこんなに固くなってるわ……<emoji=heart04>」
line = "「あんっ……<emoji=heart04>　シンちゃんのおち○ぽ、もうこんなに固くなってるわ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「お姉さんのおま○こも、これから本番エッチしちゃうと思ったら、すごく熱くなってきて……<emoji=heart04>　んうぅ……ふうぅ……<emoji=heart04>」
line = "「お姉さんのおま○こも、これから本番エッチしちゃうと思ったら、すごく熱くなってきて……<emoji=heart04>　んうぅ……ふうぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「愛液溢れてきちゃう……<emoji=heart04>　あっ……んんっ……<emoji=heart04>」
line = "「愛液溢れてきちゃう……<emoji=heart04>　あっ……んんっ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「シンちゃんのおち○ぽも、もうぬるぬるになってるから、そろそろ挿れちゃうわね……<emoji=heart04>　はあぁ……ふうぅ……<emoji=heart04>」
line = "「シンちゃんのおち○ぽも、もうぬるぬるになってるから、そろそろ挿れちゃうわね……<emoji=heart04>　はあぁ……ふうぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ヘレナさんは僕のペニスをそっと膣穴に当てると、１度深呼吸をする。
line = "ヘレナさんは僕のペニスをそっと膣穴に当てると、１度深呼吸をする。"

[[dialogue]]
speaker = "ヘレナ"
# 「じゃあ……行くわよ？　んっ……<emoji=heart04>」
line = "「じゃあ……行くわよ？　んっ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# そのまま覚悟を決めたように、腰をぐっと下ろして――
line = "そのまま覚悟を決めたように、腰をぐっと下ろして――"

[[dialogue]]
speaker = "ヘレナ"
# 「あっ――ふあああぁ～っ……<emoji=heart04>」
line = "「あっ――ふあああぁ～っ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 僕のペニスはヘレナさんの熱く柔らかな感触に包み込まれた。
line = "僕のペニスはヘレナさんの熱く柔らかな感触に包み込まれた。"

[[dialogue]]
speaker = "ヘレナ"
# 「んっ……はああぁっ……<emoji=heart04>　シンちゃんのおち○ぽで、初めてを奪われちゃったぁ……<emoji=heart04>」
line = "「んっ……はああぁっ……<emoji=heart04>　シンちゃんのおち○ぽで、初めてを奪われちゃったぁ……<emoji=heart04>」"

[[dialogue]]
speaker = "シン"
# 「ヘレナさん、大丈夫ですか……？」
line = "「ヘレナさん、大丈夫ですか……？」"

[[dialogue]]
speaker = "ヘレナ"
# 「ええ……処女膜が破れる瞬間はちょっと痛かったけど、大丈夫よ<emoji=heart04>」
line = "「ええ……処女膜が破れる瞬間はちょっと痛かったけど、大丈夫よ<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「それより……想像してたよりずっと……<emoji=heart04>　んっ……ふうぅ……<emoji=heart04>」
line = "「それより……想像してたよりずっと……<emoji=heart04>　んっ……ふうぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「これ……幸せな気分で……気持ちいいかも<emoji=heart04>　んん――っ<emoji=heart04>」
line = "「これ……幸せな気分で……気持ちいいかも<emoji=heart04>　んん――っ<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「あっ――んああぁんっ<emoji=heart04>　んっ<emoji=heart04>　あっ<emoji=heart04>　ふあぁっ<emoji=heart04>　はああぁんっ<emoji=heart04>　あっ<emoji=heart04>　あんっ<emoji=heart04>　んあぁっ<emoji=heart04>　はあぁっ……ふああぁんっ<emoji=heart04>」
line = "「あっ――んああぁんっ<emoji=heart04>　んっ<emoji=heart04>　あっ<emoji=heart04>　ふあぁっ<emoji=heart04>　はああぁんっ<emoji=heart04>　あっ<emoji=heart04>　あんっ<emoji=heart04>　んあぁっ<emoji=heart04>　はあぁっ……ふああぁんっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ヘレナさんは僕の手をぎゅっと握りながら、ゆっくりと腰を動かし始めた。
line = "ヘレナさんは僕の手をぎゅっと握りながら、ゆっくりと腰を動かし始めた。"

[[dialogue]]
speaker = "ヘレナ"
# 「んんぅっ……！　すごいっ……<emoji=heart04>　初めてなのに、おま○こもう気持ちいいっ<emoji=heart04>　んっ<emoji=heart04>　はあぁっ<emoji=heart04>　ふああぁんっ<emoji=heart04>」
line = "「んんぅっ……！　すごいっ……<emoji=heart04>　初めてなのに、おま○こもう気持ちいいっ<emoji=heart04>　んっ<emoji=heart04>　はあぁっ<emoji=heart04>　ふああぁんっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# なんでもこなせるヘレナさんは、初めてとは思えないほど、セックスの快感もすぐに掴んでいるようだった。
line = "なんでもこなせるヘレナさんは、初めてとは思えないほど、セックスの快感もすぐに掴んでいるようだった。"

[[dialogue]]
speaker = "ヘレナ"
# 「んっ<emoji=heart04>　シンちゃん……今、私のこと、エッチだって考えてたでしょ<emoji=heart04>」
line = "「んっ<emoji=heart04>　シンちゃん……今、私のこと、エッチだって考えてたでしょ<emoji=heart04>」"

[[dialogue]]
speaker = "シン"
# 「っ……！　ば、バレました……？」
line = "「っ……！　ば、バレました……？」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふふっ<emoji=heart04>　シンちゃんは素直だから、考えてることすぐわかっちゃうんだからっ……<emoji=heart04>」
line = "「ふふっ<emoji=heart04>　シンちゃんは素直だから、考えてることすぐわかっちゃうんだからっ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「シンちゃんも私のおま○こで気持ちよく感じてくれてるって<emoji=heart04>　んっ……あっ<emoji=heart04>　あんっ<emoji=heart04>」
line = "「シンちゃんも私のおま○こで気持ちよく感じてくれてるって<emoji=heart04>　んっ……あっ<emoji=heart04>　あんっ<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「シンちゃんの気持ち良さそうな顔見ると、おま○こもっと熱くなってきちゃう<emoji=heart04>　はあぁっ……<emoji=heart04>」
line = "「シンちゃんの気持ち良さそうな顔見ると、おま○こもっと熱くなってきちゃう<emoji=heart04>　はあぁっ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# そう言いながら、ヘレナさんは腰の動きを変える。
line = "そう言いながら、ヘレナさんは腰の動きを変える。"

[[dialogue]]
speaker = "ヘレナ"
# 「んっ<emoji=heart04>　見ていて<emoji=heart04>　シンちゃんのおち○ぽ、お姉さんがこうして……気持ちよくしてあげる<emoji=heart04>」
line = "「んっ<emoji=heart04>　見ていて<emoji=heart04>　シンちゃんのおち○ぽ、お姉さんがこうして……気持ちよくしてあげる<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ヘレナさんは上下の動きに加えて、円を描くようにゆっくりと膣壁をペニスに擦りつけてくる。
line = "ヘレナさんは上下の動きに加えて、円を描くようにゆっくりと膣壁をペニスに擦りつけてくる。"

[[dialogue]]
speaker = "シン"
# 「くぅっ……ヘレナさん、これ、すごいですっ……！」
line = "「くぅっ……ヘレナさん、これ、すごいですっ……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「これ、思ったより……私も気持ちいいわっ……<emoji=heart04>」
line = "「これ、思ったより……私も気持ちいいわっ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「んっ……ふうぅっ<emoji=heart04>　んうぅっ……あっ<emoji=heart04>　あんっ……<emoji=heart04>」
line = "「んっ……ふうぅっ<emoji=heart04>　んうぅっ……あっ<emoji=heart04>　あんっ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
