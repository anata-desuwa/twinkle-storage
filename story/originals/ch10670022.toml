[[dialogue]]
speaker = "unk"
# 第２話,２人のクリステレス,P
line = "第２話,２人のクリステレス,P"

[[dialogue]]
speaker = "unk"
# 今回、梨緒と初めて顔を合わせることになった聖沙。
line = "今回、梨緒と初めて顔を合わせることになった聖沙。"

[[dialogue]]
speaker = "unk"
# 聖沙の提案によって、２人は勝負をすることになった。
line = "聖沙の提案によって、２人は勝負をすることになった。"

[[dialogue]]
speaker = "聖沙"
# 「それじゃあ、勝負の方法だけど……リゾート結界の『ボスバトルモード』で、どっちが早くボスを倒せるかどうかで決めましょう」
line = "「それじゃあ、勝負の方法だけど……リゾート結界の『ボスバトルモード』で、どっちが早くボスを倒せるかどうかで決めましょう」"

[[dialogue]]
speaker = "梨緒"
# 「以前の『サバイバルモード』の後に追加された、短時間向けのモードだな」
line = "「以前の『サバイバルモード』の後に追加された、短時間向けのモードだな」"

[[dialogue]]
speaker = "聖沙"
# 「ええ。会長から聞いて、向こうの世界に帰る前に、一度試してみたかったの」
line = "「ええ。会長から聞いて、向こうの世界に帰る前に、一度試してみたかったの」"

[[dialogue]]
speaker = "梨緒"
# 「わかった。その方法で勝負しよう」
line = "「わかった。その方法で勝負しよう」"

[[dialogue]]
speaker = "unk"
# そうして、２人が勝負を開始してから、少し経って。
line = "そうして、２人が勝負を開始してから、少し経って。"

[[dialogue]]
speaker = "ボスモンスター"
# 「――グオオオオオオォォ～～ッ！！！」
line = "「――グオオオオオオォォ～～ッ！！！」"

[[dialogue]]
speaker = "聖沙"
# 「ちょっ……サメのモンスターを倒したと思ったら、今度はクジラ！？」
line = "「ちょっ……サメのモンスターを倒したと思ったら、今度はクジラ！？」"

[[dialogue]]
speaker = "梨緒"
# 「私もサバイバルモードの時は、連戦でコイツに苦戦させられた」
line = "「私もサバイバルモードの時は、連戦でコイツに苦戦させられた」"

[[dialogue]]
speaker = "聖沙"
# 「だからさっき、私が先にサメを倒そうとしても、梨緒さんは落ち着いていたのね……！」
line = "「だからさっき、私が先にサメを倒そうとしても、梨緒さんは落ち着いていたのね……！」"

[[dialogue]]
speaker = "梨緒"
# 「ああ、勝負だからな。知っていても、あえて言わずにいさせてもらった」
line = "「ああ、勝負だからな。知っていても、あえて言わずにいさせてもらった」"

[[dialogue]]
speaker = "聖沙"
# 「ええ、もちろん構わないわ。だけど……負けない！　このクジラも、私が先に倒してみせるわ！」
line = "「ええ、もちろん構わないわ。だけど……負けない！　このクジラも、私が先に倒してみせるわ！」"

[[dialogue]]
speaker = "梨緒"
# 「ならば私も――全力で行くぞ！」
line = "「ならば私も――全力で行くぞ！」"

[[dialogue]]
speaker = "unk"
# それから、クジラのモンスターを先に倒したのは――
line = "それから、クジラのモンスターを先に倒したのは――"

[[dialogue]]
speaker = "梨緒"
# 「最後の一撃、ギリギリ間に合った……！」
line = "「最後の一撃、ギリギリ間に合った……！」"

[[dialogue]]
speaker = "unk"
# わずかな差で梨緒の方だった。
line = "わずかな差で梨緒の方だった。"

[[dialogue]]
speaker = "聖沙"
# 「くっ……私の負けだわ……！」
line = "「くっ……私の負けだわ……！」"

[[dialogue]]
speaker = "聖沙"
# 「梨緒さん、やるわね……！」
line = "「梨緒さん、やるわね……！」"

[[dialogue]]
speaker = "梨緒"
# 「いや、そちらこそ。初見のボスとの連戦でもここまでやれるとは、異世界を救ったクルセイダースの力、伊達ではないな」
line = "「いや、そちらこそ。初見のボスとの連戦でもここまでやれるとは、異世界を救ったクルセイダースの力、伊達ではないな」"

[[dialogue]]
speaker = "聖沙"
# 「でも、負けたままじゃ終われないわ！　梨緒さん、もう１回よ！」
line = "「でも、負けたままじゃ終われないわ！　梨緒さん、もう１回よ！」"

[[dialogue]]
speaker = "梨緒"
# 「えっ……休息なしで、すぐにか？」
line = "「えっ……休息なしで、すぐにか？」"

[[dialogue]]
speaker = "聖沙"
# 「ええ、私はまだまだやれるわ！」
line = "「ええ、私はまだまだやれるわ！」"

[[dialogue]]
speaker = "梨緒"
# 「そうだな……確かに、ボスに関しての情報差があった。いいだろう」
line = "「そうだな……確かに、ボスに関しての情報差があった。いいだろう」"

[[dialogue]]
speaker = "聖沙"
# 「やった……！　今度は私の勝ちよ！」
line = "「やった……！　今度は私の勝ちよ！」"

[[dialogue]]
speaker = "梨緒"
# 「くっ……同条件で負けるとは……私は、やはり弱い……」
line = "「くっ……同条件で負けるとは……私は、やはり弱い……」"

[[dialogue]]
speaker = "梨緒"
# 「私は所詮、有利な条件下でなければ、勝てない女なんだ……」
line = "「私は所詮、有利な条件下でなければ、勝てない女なんだ……」"

[[dialogue]]
speaker = "聖沙"
# 「ちょ、ちょっと待って！？　急にどうしたの！？」
line = "「ちょ、ちょっと待って！？　急にどうしたの！？」"

[[dialogue]]
speaker = "unk"
# 梨緒は気分の浮き沈みが激しいというか……
line = "梨緒は気分の浮き沈みが激しいというか……"

[[dialogue]]
speaker = "聖沙"
# 「な、なんかさっきまでのクールな印象が崩れていくんだけど……」
line = "「な、なんかさっきまでのクールな印象が崩れていくんだけど……」"

[[dialogue]]
speaker = "聖沙"
# 「だ、だったらもう１回よ！　今ので１対１だもの！」
line = "「だ、だったらもう１回よ！　今ので１対１だもの！」"

[[dialogue]]
speaker = "梨緒"
# 「はは……いいんだ。そんな気を遣わなくて……私の完敗だ……」
line = "「はは……いいんだ。そんな気を遣わなくて……私の完敗だ……」"

[[dialogue]]
speaker = "聖沙"
# 「何を言ってるの！　それじゃあ、私が納得できないわ！　ほら、梨緒さん！　気合いを入れ直して、もう１回よ！」
line = "「何を言ってるの！　それじゃあ、私が納得できないわ！　ほら、梨緒さん！　気合いを入れ直して、もう１回よ！」"

[[dialogue]]
speaker = "梨緒"
# 「そ、そこまで言ってくれるなら……」
line = "「そ、そこまで言ってくれるなら……」"

[[dialogue]]
speaker = "unk"
# そして、３度目の勝負の行方は、果たして……。
line = "そして、３度目の勝負の行方は、果たして……。"

[[dialogue]]
speaker = "聖沙"
# 「くっ……また負けたわ……！」
line = "「くっ……また負けたわ……！」"

[[dialogue]]
speaker = "聖沙"
# 「完全な同時撃破……でも、私は先に決めるつもりだった。なのに、梨緒さんが逆転の一撃を決めてきて、私はそれを読み切れていなかった……！」
line = "「完全な同時撃破……でも、私は先に決めるつもりだった。なのに、梨緒さんが逆転の一撃を決めてきて、私はそれを読み切れていなかった……！」"

[[dialogue]]
speaker = "聖沙"
# 「だから悔しいけど……梨緒さん、あなたの勝ちよ！」
line = "「だから悔しいけど……梨緒さん、あなたの勝ちよ！」"

[[dialogue]]
speaker = "梨緒"
# 「いや……今回も私の負けだ……」
line = "「いや……今回も私の負けだ……」"

[[dialogue]]
speaker = "聖沙"
# 「えっ、なんで！？」
line = "「えっ、なんで！？」"

[[dialogue]]
speaker = "梨緒"
# 「途中まで私の劣勢。それで私は逆転を狙ったが、結果は及ばずに同時撃破。ならば、決めきれなかった私の方が負けだろう……」
line = "「途中まで私の劣勢。それで私は逆転を狙ったが、結果は及ばずに同時撃破。ならば、決めきれなかった私の方が負けだろう……」"

[[dialogue]]
speaker = "聖沙"
# 「いやいや、私の負けでいいわよ！」
line = "「いやいや、私の負けでいいわよ！」"

[[dialogue]]
speaker = "梨緒"
# 「そんな気を遣わなくていい。私の負けだ……」
line = "「そんな気を遣わなくていい。私の負けだ……」"

[[dialogue]]
speaker = "聖沙"
# 「あなた、意外と面倒臭いわね！？」
line = "「あなた、意外と面倒臭いわね！？」"

[[dialogue]]
speaker = "梨緒"
# 「面倒臭い！？」
line = "「面倒臭い！？」"

[[dialogue]]
speaker = "unk"
# なんか負けを取り合ってるんだけど……
line = "なんか負けを取り合ってるんだけど……"

[[dialogue]]
speaker = "フィオナ"
# 「あはは……お２人とも、勝負に関しては自分に厳しいですよね……」
line = "「あはは……お２人とも、勝負に関しては自分に厳しいですよね……」"

[[dialogue]]
speaker = "フィオナ"
# 「聖沙さん、梨緒さん――それならここは、引き分けということでどうでしょう？」
line = "「聖沙さん、梨緒さん――それならここは、引き分けということでどうでしょう？」"

[[dialogue]]
speaker = "聖沙"
# 「……そうね。全力勝負して、同時だったんだもの」
line = "「……そうね。全力勝負して、同時だったんだもの」"

[[dialogue]]
speaker = "聖沙"
# 「梨緒さん、ここは引き分けってことにしましょう。あなたの実力、すごかったわ」
line = "「梨緒さん、ここは引き分けってことにしましょう。あなたの実力、すごかったわ」"

[[dialogue]]
speaker = "梨緒"
# 「そ、そうか？　キミがそれでいいと言ってくれるなら……」
line = "「そ、そうか？　キミがそれでいいと言ってくれるなら……」"

[[dialogue]]
speaker = "聖沙"
# 「ねぇ、ところで……ひとつ聞いてもいいかしら？」
line = "「ねぇ、ところで……ひとつ聞いてもいいかしら？」"

[[dialogue]]
speaker = "聖沙"
# 「実は勝負の前から気になってたんだけど……梨緒さんのバケットの中から覗いてる、それって……？」
line = "「実は勝負の前から気になってたんだけど……梨緒さんのバケットの中から覗いてる、それって……？」"

[[dialogue]]
speaker = "梨緒"
# 「ん？　ああ、これか？　これは『ぶちゃ猫』というキャラクターのぬいぐるみポーチだ」
line = "「ん？　ああ、これか？　これは『ぶちゃ猫』というキャラクターのぬいぐるみポーチだ」"

[[dialogue]]
speaker = "聖沙"
# 「ぶ、ぶちゃ猫さんというのね……」
line = "「ぶ、ぶちゃ猫さんというのね……」"

[[dialogue]]
speaker = "聖沙"
# 「可愛くて、素敵……<emoji=heart04>」
line = "「可愛くて、素敵……<emoji=heart04>」"

[[dialogue]]
speaker = "梨緒"
# 「え？」
line = "「え？」"

[[dialogue]]
speaker = "unk"
# 聖沙はそういう可愛いものが好きなんだ
line = "聖沙はそういう可愛いものが好きなんだ"

[[dialogue]]
speaker = "梨緒"
# 「そうなのか……！？」
line = "「そうなのか……！？」"

[[dialogue]]
speaker = "フィオナ"
# 「ええ。だから、お２人はきっと気が合うんじゃないかと思ってたんです」
line = "「ええ。だから、お２人はきっと気が合うんじゃないかと思ってたんです」"

[[dialogue]]
speaker = "聖沙"
# 「ね、ねぇ……ぶちゃ猫さん、近くで見せてもらってもいいかしら？」
line = "「ね、ねぇ……ぶちゃ猫さん、近くで見せてもらってもいいかしら？」"

[[dialogue]]
speaker = "梨緒"
# 「あ、ああ。もちろんだ」
line = "「あ、ああ。もちろんだ」"

[[dialogue]]
speaker = "聖沙"
# 「はあぁっ……可愛い……<emoji=heart04>　これ、今も売っているものなのかしら？」
line = "「はあぁっ……可愛い……<emoji=heart04>　これ、今も売っているものなのかしら？」"

[[dialogue]]
speaker = "梨緒"
# 「それが……残念なことに、あまり人気がなくてな……」
line = "「それが……残念なことに、あまり人気がなくてな……」"

[[dialogue]]
speaker = "聖沙"
# 「そうなの！？　こんなに可愛いのに……！」
line = "「そうなの！？　こんなに可愛いのに……！」"

[[dialogue]]
speaker = "梨緒"
# 「ああ、私もそう思う……」
line = "「ああ、私もそう思う……」"

[[dialogue]]
speaker = "聖沙"
# 「ねぇ、あなたのこと――『梨緒』って呼んでもいいかしら？」
line = "「ねぇ、あなたのこと――『梨緒』って呼んでもいいかしら？」"

[[dialogue]]
speaker = "梨緒"
# 「構わない。私も既に、聖沙と呼んでいるしな」
line = "「構わない。私も既に、聖沙と呼んでいるしな」"

[[dialogue]]
speaker = "聖沙"
# 「どうやら私たち、確かに似ているみたいね♪」
line = "「どうやら私たち、確かに似ているみたいね♪」"

[[dialogue]]
speaker = "梨緒"
# 「ああ、そのようだ――」
line = "「ああ、そのようだ――」"

[[dialogue]]
speaker = "梨緒"
# 「聖沙、改めてよろしく頼む」
line = "「聖沙、改めてよろしく頼む」"

[[dialogue]]
speaker = "聖沙"
# 「ええ。よろしくね、梨緒」
line = "「ええ。よろしくね、梨緒」"

[[dialogue]]
speaker = "unk"
# そう言って、握手を交わす２人。
line = "そう言って、握手を交わす２人。"

[[dialogue]]
speaker = "unk"
# 思ってた通り、２人は仲良くなれそうだな
line = "思ってた通り、２人は仲良くなれそうだな"

[[dialogue]]
speaker = "フィオナ"
# 「はい♪　ところで、ニャリオンとパッキーさんは……」
line = "「はい♪　ところで、ニャリオンとパッキーさんは……」"

[[dialogue]]
speaker = "ニャリオン"
# 「お……おのれエロパンダ……また、してやられたニャ……！」
line = "「お……おのれエロパンダ……また、してやられたニャ……！」"

[[dialogue]]
speaker = "パッキー"
# 「くっ……俺様が、こんなニャン公と相打ちとは……！」
line = "「くっ……俺様が、こんなニャン公と相打ちとは……！」"

[[dialogue]]
speaker = "unk"
# 思い出して見やると、２人とも砂浜の上で潰れたぬいぐるみのように倒れ伏していた。
line = "思い出して見やると、２人とも砂浜の上で潰れたぬいぐるみのように倒れ伏していた。"

[[dialogue]]
speaker = "フィオナ"
# 「えっと……仲良くなれたんでしょうか？」
line = "「えっと……仲良くなれたんでしょうか？」"

[[dialogue]]
speaker = "ニャリオン"
# 「いや、どう見たらそうなるニャン！？」
line = "「いや、どう見たらそうなるニャン！？」"

[[dialogue]]
speaker = "パッキー"
# 「そうだ！　俺様はコイツとアナザーステラだなんて認めないからなーっ！？」
line = "「そうだ！　俺様はコイツとアナザーステラだなんて認めないからなーっ！？」"

[[dialogue]]
speaker = "unk"
# 喧嘩するほど、仲がいいって感じ？
line = "喧嘩するほど、仲がいいって感じ？"

[[dialogue]]
speaker = "２人"
# 「違ぁ～～うっ！！」
line = "「違ぁ～～うっ！！」"

[[dialogue]]
speaker = "unk"
# そう言って共に叫ぶ、パッキーとニャリオンなのであった。
line = "そう言って共に叫ぶ、パッキーとニャリオンなのであった。"
