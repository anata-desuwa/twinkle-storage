[[dialogue]]
speaker = "unk"
# 第９話,『長くて短い時間の終わり』,B
line = "第９話,『長くて短い時間の終わり』,B"

[[dialogue]]
speaker = "unk"
# オオヒメとルヴィネが流星学園附属校に通い始めて、早くも２週間が過ぎた。
line = "オオヒメとルヴィネが流星学園附属校に通い始めて、早くも２週間が過ぎた。"

[[dialogue]]
speaker = "unk"
# それはルヴィネが予定していた視察の期間の終わりも意味していた。
line = "それはルヴィネが予定していた視察の期間の終わりも意味していた。"

[[dialogue]]
speaker = "ルヴィネ"
# 「実りの多い２週間だったわ」
line = "「実りの多い２週間だったわ」"

[[dialogue]]
speaker = "unk"
# オオヒメたちがルヴィネに視察の感想を訊ねると、ルヴィネは朗らかな笑顔を浮かべてそう答えた。
line = "オオヒメたちがルヴィネに視察の感想を訊ねると、ルヴィネは朗らかな笑顔を浮かべてそう答えた。"

[[dialogue]]
speaker = "ルヴィネ"
# 「<ruby=ここ>流星学園附属校</ruby>で学んだ知見と経験は、きっと極星学園の附属校設立の際に活かされるわ」
line = "「<ruby>流星学園附属校<rt>ここ</rt></ruby>で学んだ知見と経験は、きっと極星学園の附属校設立の際に活かされるわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「けれど、様々な問題点も見えてきた。もっと慎重に、十分な時間をかけて取り組まなければならない事だということも見えてきたわ」
line = "「けれど、様々な問題点も見えてきた。もっと慎重に、十分な時間をかけて取り組まなければならない事だということも見えてきたわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「開校にこぎつけるまで、１０年以上の歳月がかかってしまうかもしれないわね……」
line = "「開校にこぎつけるまで、１０年以上の歳月がかかってしまうかもしれないわね……」"

[[dialogue]]
speaker = "ルヴィネ"
# 「けれど、それでもいつか必ず実現させてみせるわ」
line = "「けれど、それでもいつか必ず実現させてみせるわ」"

[[dialogue]]
speaker = "unk"
# 熱を帯びた口調で、ルヴィネは決意を語ったのだった。
line = "熱を帯びた口調で、ルヴィネは決意を語ったのだった。"

[[dialogue]]
speaker = "unk"
# そして一方、オオヒメは──
line = "そして一方、オオヒメは──"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「毎週の地域清掃の分担を巡って１班と２班の空気がギスギスしているのだな？」
line = "「毎週の地域清掃の分担を巡って１班と２班の空気がギスギスしているのだな？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「わかった。それぞれの班長に私のところへ来るよう伝えてくれ。一度、３人で話をしよう」
line = "「わかった。それぞれの班長に私のところへ来るよう伝えてくれ。一度、３人で話をしよう」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「放課後の戦闘訓練に参加したかったが、家庭の事情で難しくなってしまった？」
line = "「放課後の戦闘訓練に参加したかったが、家庭の事情で難しくなってしまった？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「それは残念だな。どれだけ力になれるかわからないが、私でよければ相手になるぞ」
line = "「それは残念だな。どれだけ力になれるかわからないが、私でよければ相手になるぞ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「なになに？　隣の家に住んでいる幼なじみの男の子に告白されたのだけど、どうすればいいかだと？」
line = "「なになに？　隣の家に住んでいる幼なじみの男の子に告白されたのだけど、どうすればいいかだと？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ななな……わ、私にそんなことを聞かれても困る！　分かるわけがないだろう！　何でも相談に乗るとは言ったが、恋愛相談だけは勘弁してくれ！」
line = "「ななな……わ、私にそんなことを聞かれても困る！　分かるわけがないだろう！　何でも相談に乗るとは言ったが、恋愛相談だけは勘弁してくれ！」"

[[dialogue]]
speaker = "unk"
# ……と、生来の委員長気質を発揮し、クラスでもすっかり頼られる存在になっていた。
line = "……と、生来の委員長気質を発揮し、クラスでもすっかり頼られる存在になっていた。"

[[dialogue]]
speaker = "ナミエル"
# 「ヒメさんがここまで頼られる存在になるとは思いませんでした」
line = "「ヒメさんがここまで頼られる存在になるとは思いませんでした」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「む……何やら含みのある物言いのように聞こえるが？」
line = "「む……何やら含みのある物言いのように聞こえるが？」"

[[dialogue]]
speaker = "ナミエル"
# 「いえ、最初の印象が大転倒でしたから。よくここまで回復できたものだなと」
line = "「いえ、最初の印象が大転倒でしたから。よくここまで回復できたものだなと」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ううっ……！！」
line = "「ううっ……！！」"

[[dialogue]]
speaker = "ナミエル"
# 「誉め言葉ですよ。ヒメさんはいつも真面目で、一生懸命で、何事に対しても全力です」
line = "「誉め言葉ですよ。ヒメさんはいつも真面目で、一生懸命で、何事に対しても全力です」"

[[dialogue]]
speaker = "ナミエル"
# 「だからこそクラスの皆もヒメさんに心を開き、ここまで頼られる存在になったのだと思います」
line = "「だからこそクラスの皆もヒメさんに心を開き、ここまで頼られる存在になったのだと思います」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そ、そうだろうか？　ふふ、認められるというのは嬉しいものだな……」
line = "「そ、そうだろうか？　ふふ、認められるというのは嬉しいものだな……」"

[[dialogue]]
speaker = "ナミエル"
# 「同時にそのチョロすぎる性格も知れ渡ってしまいましたが……」
line = "「同時にそのチョロすぎる性格も知れ渡ってしまいましたが……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「私は別に、チョロいわけでは……！」
line = "「私は別に、チョロいわけでは……！」"

[[dialogue]]
speaker = "ナミエル"
# 「しかも天然ですし……立派に愛されキャラクターの座を獲得していますよ」
line = "「しかも天然ですし……立派に愛されキャラクターの座を獲得していますよ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「うぅぅ……私は守護天使なのにあんまりな評価だ。いっそ掃除道具入れの中に閉じこもってしまおうか……」
line = "「うぅぅ……私は守護天使なのにあんまりな評価だ。いっそ掃除道具入れの中に閉じこもってしまおうか……」"

[[dialogue]]
speaker = "ナミエル"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "ナミエル"
# 「こんなやり取りも、今日で最後かもしれないのですね……」
line = "「こんなやり取りも、今日で最後かもしれないのですね……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ナミエル殿……」
line = "「ナミエル殿……」"

[[dialogue]]
speaker = "ナミエル"
# 「こんな愛され守護天使に毎日会えなくなると思うと、きっと寂しがるでしょう……みんなも、私も……」
line = "「こんな愛され守護天使に毎日会えなくなると思うと、きっと寂しがるでしょう……みんなも、私も……」"

[[dialogue]]
speaker = "ナミエル"
# 「ふふ……らしくありませんね。少し感傷的な気持ちになっていたかもしれません」
line = "「ふふ……らしくありませんね。少し感傷的な気持ちになっていたかもしれません」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そうだな。感傷的になる必要は無い。二度と会えなくなるわけではないのだから！」
line = "「そうだな。感傷的になる必要は無い。二度と会えなくなるわけではないのだから！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「毎日とはいかないが、時間が出来たらまた登校する。必ず、約束しよう」
line = "「毎日とはいかないが、時間が出来たらまた登校する。必ず、約束しよう」"

[[dialogue]]
speaker = "ナミエル"
# 「ええ、お願いします……」
line = "「ええ、お願いします……」"

[[dialogue]]
speaker = "unk"
# こうして守護天使たちの、集中登校週間は終わりを告げた。
line = "こうして守護天使たちの、集中登校週間は終わりを告げた。"

[[dialogue]]
speaker = "unk"
# 守護天使たちにとっては一瞬とも言える短い時間。
line = "守護天使たちにとっては一瞬とも言える短い時間。"

[[dialogue]]
speaker = "unk"
# だが、きっと──今、ここで得たこの経験は、何ものにも代えがたい天恵である。
line = "だが、きっと──今、ここで得たこの経験は、何ものにも代えがたい天恵である。"

[[dialogue]]
speaker = "unk"
# 陽の差し陰る流星学園附属の校舎を背にしながら、オオヒメは強く感じていたのだった。
line = "陽の差し陰る流星学園附属の校舎を背にしながら、オオヒメは強く感じていたのだった。"
