[[dialogue]]
speaker = "unk"
# 魔王の力が復活し、流星クルセイダースはザタナーンとの最終決戦へ突入していた。
line = "魔王の力が復活し、流星クルセイダースはザタナーンとの最終決戦へ突入していた。"

[[dialogue]]
speaker = "unk"
# アビスブレイカー！
line = "アビスブレイカー！"

[[dialogue]]
speaker = "ザタナーン"
# 「ぐっ……！　やはりリ・クリエの力に匹敵するか、魔王の力……！」
line = "「ぐっ……！　やはりリ・クリエの力に匹敵するか、魔王の力……！」"

[[dialogue]]
speaker = "リア"
# 「魔王の力に共鳴して、私たちの霊力もパワーアップしている今なら！」
line = "「魔王の力に共鳴して、私たちの霊力もパワーアップしている今なら！」"

[[dialogue]]
speaker = "聖沙"
# 「リ・クリエの強大な力にも、負けたりしないわ！」
line = "「リ・クリエの強大な力にも、負けたりしないわ！」"

[[dialogue]]
speaker = "ザタナーン"
# 「ぬうぅっ！　クルセイダース……邪魔だ！」
line = "「ぬうぅっ！　クルセイダース……邪魔だ！」"

[[dialogue]]
speaker = "unk"
# ザタナーンは衝撃波を放つが、バリアーが展開されて、それを防ぐ。
line = "ザタナーンは衝撃波を放つが、バリアーが展開されて、それを防ぐ。"

[[dialogue]]
speaker = "ロロット"
# 「会長さんパワーで無敵になった、カチカチバリアーなのです♪」
line = "「会長さんパワーで無敵になった、カチカチバリアーなのです♪」"

[[dialogue]]
speaker = "ナナカ"
# 「あたしも全力でぶちかますよ！　ヴォルケインマリンシュトローム！」
line = "「あたしも全力でぶちかますよ！　ヴォルケインマリンシュトローム！」"

[[dialogue]]
speaker = "ザタナーン"
# 「――ぐおおぉっ！？　ならば……！」
line = "「――ぐおおぉっ！？　ならば……！」"

[[dialogue]]
speaker = "複製魔族"
# 「イ～～～！！！」
line = "「イ～～～！！！」"

[[dialogue]]
speaker = "unk"
# ザタナーンは自身の足元から影を広げ、魔族の大群を作り出す。
line = "ザタナーンは自身の足元から影を広げ、魔族の大群を作り出す。"

[[dialogue]]
speaker = "パッキー"
# 「げっ！　野郎、堪らず数に訴えてきやがった！」
line = "「げっ！　野郎、堪らず数に訴えてきやがった！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「一対多数なら、私たちの方が適任でしょ！」
line = "「一対多数なら、私たちの方が適任でしょ！」"

[[dialogue]]
speaker = "ヘレナ"
# 「いいだろう。付き合うぞ、もう１人の私よ」
line = "「いいだろう。付き合うぞ、もう１人の私よ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ここは私たちに任せて、先に行けってね♪」
line = "「ここは私たちに任せて、先に行けってね♪」"

[[dialogue]]
speaker = "マトイ"
# 「なら、私も一緒にやります！」
line = "「なら、私も一緒にやります！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ヒュー♪　マトイちゃんも二刀流とはおあつらえ向きね～、だったら！」
line = "「ヒュー♪　マトイちゃんも二刀流とはおあつらえ向きね～、だったら！」"

[[dialogue]]
speaker = "３人"
# 「――ユニゾン！！」
line = "「――ユニゾン！！」"

[[dialogue]]
speaker = "リア"
# 「お姉ちゃんたちが魔族を止めてくれている間に、私たちも！」
line = "「お姉ちゃんたちが魔族を止めてくれている間に、私たちも！」"

[[dialogue]]
speaker = "ルネア"
# 「私の霊力も全て、あなたたちに託すわ！　だから、お願い！」
line = "「私の霊力も全て、あなたたちに託すわ！　だから、お願い！」"

[[dialogue]]
speaker = "ロロット"
# 「はいなのです！」
line = "「はいなのです！」"

[[dialogue]]
speaker = "聖沙"
# 「これで勝負を決めるわよ！」
line = "「これで勝負を決めるわよ！」"

[[dialogue]]
speaker = "unk"
# 行くよ、みんな！
line = "行くよ、みんな！"

[[dialogue]]
speaker = "ナナカ"
# 「それじゃあ――せ～のっ！！！」
line = "「それじゃあ――せ～のっ！！！」"

[[dialogue]]
speaker = "unk"
# 声を合わせて、叫ぶ。
line = "声を合わせて、叫ぶ。"

[[dialogue]]
speaker = "５人"
# 「――フルユニゾン！！！」
line = "「――フルユニゾン！！！」"

[[dialogue]]
speaker = "ザタナーン"
# 「ぐううぅーーーっ！？」
line = "「ぐううぅーーーっ！？」"

[[dialogue]]
speaker = "unk"
# ザタナーンに５人で連携攻撃を叩き込んで行く――そして。
line = "ザタナーンに５人で連携攻撃を叩き込んで行く――そして。"

[[dialogue]]
speaker = "聖沙"
# 「トドメは譲ってあげるわ！　決めなさい！」
line = "「トドメは譲ってあげるわ！　決めなさい！」"

[[dialogue]]
speaker = "unk"
# みんなとルネアの霊力を束ね、魔王の力と合わせて、解き放つ。
line = "みんなとルネアの霊力を束ね、魔王の力と合わせて、解き放つ。"

[[dialogue]]
speaker = "unk"
# アルケインメテオストリーム！！！
line = "アルケインメテオストリーム！！！"

[[dialogue]]
speaker = "ザタナーン"
# 「ぐっ……ぬおおおぉぉぉーーーーーーーーーッ！！？」
line = "「ぐっ……ぬおおおぉぉぉーーーーーーーーーッ！！？」"

[[dialogue]]
speaker = "unk"
# 全力の一撃がザタナーンに直撃し、パキン、と砕けたような音が響く。
line = "全力の一撃がザタナーンに直撃し、パキン、と砕けたような音が響く。"

[[dialogue]]
speaker = "unk"
# ザタナーンの体から砕けたリ・クリエ玉が抜け出て、砂浜に転がり落ちた。
line = "ザタナーンの体から砕けたリ・クリエ玉が抜け出て、砂浜に転がり落ちた。"

[[dialogue]]
speaker = "ザタナーン"
# 「おのれ……魔王……クルセイダース……またしても……」
line = "「おのれ……魔王……クルセイダース……またしても……」"

[[dialogue]]
speaker = "unk"
# その姿が次第に黒い影へと戻り、崩壊していく。
line = "その姿が次第に黒い影へと戻り、崩壊していく。"

[[dialogue]]
speaker = "ザタナーン"
# 「だが……今回の目的は果たした……」
line = "「だが……今回の目的は果たした……」"

[[dialogue]]
speaker = "ルネア"
# 「目的……？」
line = "「目的……？」"

[[dialogue]]
speaker = "ザタナーン"
# 「我はここで消滅するが……リ・クリエ玉はこの１つだけではない」
line = "「我はここで消滅するが……リ・クリエ玉はこの１つだけではない」"

[[dialogue]]
speaker = "ルネア"
# 「……！」
line = "「……！」"

[[dialogue]]
speaker = "ザタナーン"
# 「堕天使――グリゴリは、我１人だけではないからだ……」
line = "「堕天使――グリゴリは、我１人だけではないからだ……」"

[[dialogue]]
speaker = "ザタナーン"
# 「世界には……必ず対となる力が現れる。リ・クリエの抑止力として、魔王が現れるように……」
line = "「世界には……必ず対となる力が現れる。リ・クリエの抑止力として、魔王が現れるように……」"

[[dialogue]]
speaker = "ザタナーン"
# 「完璧でない神が存在し続ける限り、必ずそれに反逆する者が現れる。それが我々……『グリゴリ』だ」
line = "「完璧でない神が存在し続ける限り、必ずそれに反逆する者が現れる。それが我々……『グリゴリ』だ」"

[[dialogue]]
speaker = "unk"
# 何度だって現れるはずだよ
line = "何度だって現れるはずだよ"

[[dialogue]]
speaker = "unk"
# だとしても、それを止めようとする人たちが
line = "だとしても、それを止めようとする人たちが"

[[dialogue]]
speaker = "リア"
# 「そう。それが私たち――」
line = "「そう。それが私たち――」"

[[dialogue]]
speaker = "聖沙"
# 「クルセイダースよ！」
line = "「クルセイダースよ！」"

[[dialogue]]
speaker = "ナナカ"
# 「完璧でなくたって、あたしたちはここに生きているんだから！」
line = "「完璧でなくたって、あたしたちはここに生きているんだから！」"

[[dialogue]]
speaker = "ロロット"
# 「みなさんが生きるキラキラな毎日を、あなたたちの自分勝手な考えで奪わせたりしません！」
line = "「みなさんが生きるキラキラな毎日を、あなたたちの自分勝手な考えで奪わせたりしません！」"

[[dialogue]]
speaker = "ザタナーン"
# 「だとしても……『再生』こそが世界の摂理――」
line = "「だとしても……『再生』こそが世界の摂理――」"

[[dialogue]]
speaker = "ザタナーン"
# 「忘れるな……完璧な世界が存在しない限り……リ・クリエは必ず存在し続ける……」
line = "「忘れるな……完璧な世界が存在しない限り……リ・クリエは必ず存在し続ける……」"

[[dialogue]]
speaker = "unk"
# ザタナーンはそこまで言って――完全に消滅するのだった。
line = "ザタナーンはそこまで言って――完全に消滅するのだった。"
