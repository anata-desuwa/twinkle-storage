[[dialogue]]
speaker = "unk"
# 第８話,『ママをたずねて三世界』,B
line = "第８話,『ママをたずねて三世界』,B"

[[dialogue]]
speaker = "unk"
# 後日──
line = "後日──"

[[dialogue]]
speaker = "unk"
# 再びルヴィネがアルタイルにやってくることになった。
line = "再びルヴィネがアルタイルにやってくることになった。"

[[dialogue]]
speaker = "紅明"
# 「ルヴィっちがまたお仕事に来るっていうならさ、やっぱアタシらでお出迎えしなくちゃじゃん？」
line = "「ルヴィっちがまたお仕事に来るっていうならさ、やっぱアタシらでお出迎えしなくちゃじゃん？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「今回もわたくしたち２人で、見事に案内役を務めてみせるわ！」
line = "「今回もわたくしたち２人で、見事に案内役を務めてみせるわ！」"

[[dialogue]]
speaker = "ルヴィネ"
# 「──失礼するわ」
line = "「──失礼するわ」"

[[dialogue]]
speaker = "unk"
# 教室のドアが開いてルヴィネが入ってくる。
line = "教室のドアが開いてルヴィネが入ってくる。"

[[dialogue]]
speaker = "ルヴィネ"
# 「数日ぶりね。セシアに紅明、またお願いするわ」
line = "「数日ぶりね。セシアに紅明、またお願いするわ」"

[[dialogue]]
speaker = "紅明"
# 「どーってことないって☆　ルヴィっちがこっちに来る時は、いつでもアタシたちがサポートするからさ♪」
line = "「どーってことないって☆　ルヴィっちがこっちに来る時は、いつでもアタシたちがサポートするからさ♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「それじゃあ、２人に紹介するわね」
line = "「それじゃあ、２人に紹介するわね」"

[[dialogue]]
speaker = "ベアトリス"
# 「こんにちは～。お邪魔します！」
line = "「こんにちは～。お邪魔します！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「！！！！！」
line = "「！！！！！」"

[[dialogue]]
speaker = "ベアトリス"
# 「ルヴィに紹介したいヒトがいるって言われて来たんだけど……」
line = "「ルヴィに紹介したいヒトがいるって言われて来たんだけど……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ほわあああああああぁぁぁぁ～～～～！？！？！？！？」
line = "「ほわあああああああぁぁぁぁ～～～～！？！？！？！？」"

[[dialogue]]
speaker = "紅明"
# 「セッシーが壊れた！」
line = "「セッシーが壊れた！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ベアトママ～～～！！！！」
line = "「ベアトママ～～～！！！！」"

[[dialogue]]
speaker = "unk"
# セシアは開口一番、ベアトリスの胸元に飛び込んでいった。
line = "セシアは開口一番、ベアトリスの胸元に飛び込んでいった。"

[[dialogue]]
speaker = "ベアトリス"
# 「えええええええ～～～～っ！？」
line = "「えええええええ～～～～っ！？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「思った以上に喜んでもらえたわね……」
line = "「思った以上に喜んでもらえたわね……」"

[[dialogue]]
speaker = "紅明"
# 「お、ベアちー久しぶり☆　セッシーのママになりにきてくれたカンジ？」
line = "「お、ベアちー久しぶり☆　セッシーのママになりにきてくれたカンジ？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ママになりにきたってなにぃ！？」
line = "「ママになりにきたってなにぃ！？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「そういうつもりでは無かったのだけれど、セシアがとても会いたがっていたから連れて来たわ」
line = "「そういうつもりでは無かったのだけれど、セシアがとても会いたがっていたから連れて来たわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「デネブでの決戦や『リベレーション・ペンタグラム』の直前、同じ九浄家の中で行動はしていたけれど……個別に挨拶する機会はなかったものね」
line = "「デネブでの決戦や『リベレーション・ペンタグラム』の直前、同じ九浄家の中で行動はしていたけれど……個別に挨拶する機会はなかったものね」"

[[dialogue]]
speaker = "ルヴィネ"
# 「セシアに挨拶をしてあげて、ベアト」
line = "「セシアに挨拶をしてあげて、ベアト」"

[[dialogue]]
speaker = "ベアトリス"
# 「う、うん。ベアトリス・シェイドです。えっと……よろしくね！」
line = "「う、うん。ベアトリス・シェイドです。えっと……よろしくね！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「……！　アルタイルの摂理『蓄積』を司る守護天使、《万成》のセシアよ！　よろしくお願いするわ、ベアトママ！！」
line = "「……！　アルタイルの摂理『蓄積』を司る守護天使、《万成》のセシアよ！　よろしくお願いするわ、ベアトママ！！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「この控えめな佇まいの奥に感じる繊細な優しさ！　ただそこに在るだけで伝わる世話焼き気質！　聞きしに勝るバブみの権化──これは、問答無用のママよ！」
line = "「この控えめな佇まいの奥に感じる繊細な優しさ！　ただそこに在るだけで伝わる世話焼き気質！　聞きしに勝るバブみの権化──これは、問答無用のママよ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「ひゃぁああっ！？」
line = "「ひゃぁああっ！？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「なんて温かく大きなお胸……ああ、会えて嬉しいわ。バブみが溢れて……溺れてしまいそうだわ……ママ～～～<emoji=heart04><emoji=heart04><emoji=heart04>」
line = "「なんて温かく大きなお胸……ああ、会えて嬉しいわ。バブみが溢れて……溺れてしまいそうだわ……ママ～～～<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "ベアトリス"
# 「バブみ！？　ママ！？　どういうことなんですかぁ！？」
line = "「バブみ！？　ママ！？　どういうことなんですかぁ！？」"

[[dialogue]]
speaker = "紅明"
# 「セッシーは本能的にママを求めてるんだぜ☆　特に彼女の心に響いた人は、すぐママ判定しちゃうんだ」
line = "「セッシーは本能的にママを求めてるんだぜ☆　特に彼女の心に響いた人は、すぐママ判定しちゃうんだ」"

[[dialogue]]
speaker = "ベアトリス"
# 「きゅ、急にそんなこと言われても……！　私なんて、どこにでもいる普通の吸血鬼で──」
line = "「きゅ、急にそんなこと言われても……！　私なんて、どこにでもいる普通の吸血鬼で──」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「謙遜しなくていいわ。その控えめな態度に隠された、海のようにおおらかな心……何より、惜しみない優しさがにじみ出ているのよ♪」
line = "「謙遜しなくていいわ。その控えめな態度に隠された、海のようにおおらかな心……何より、惜しみない優しさがにじみ出ているのよ♪」"

[[dialogue]]
speaker = "紅明"
# 「うんうん。アタシにもなんとなくわかるなー、セッシーじゃなくても甘えたくなる何かを感じるぜ☆」
line = "「うんうん。アタシにもなんとなくわかるなー、セッシーじゃなくても甘えたくなる何かを感じるぜ☆」"

[[dialogue]]
speaker = "ベアトリス"
# 「そ、そうなんでしょうか……？　でも、褒めてもらえているなら嬉しい……かも！　いっぱいナデナデしてあげたらいいのかな……？」
line = "「そ、そうなんでしょうか……？　でも、褒めてもらえているなら嬉しい……かも！　いっぱいナデナデしてあげたらいいのかな……？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「嬉しいわ、ベアトママ<emoji=heart04>」
line = "「嬉しいわ、ベアトママ<emoji=heart04>」"

[[dialogue]]
speaker = "紅明"
# 「おっと、こうなるとなんだかアタシも負けてられない気分。ほーらセッシー、紅明ママも甘やかしてあげちゃうぞ～？」
line = "「おっと、こうなるとなんだかアタシも負けてられない気分。ほーらセッシー、紅明ママも甘やかしてあげちゃうぞ～？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「２人のママがセシアのために……こんなに幸せなことはないわ！」
line = "「２人のママがセシアのために……こんなに幸せなことはないわ！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「紅明ママ～♪　ベアトママ～♪　ああ、代わりばんこに頭を撫でてくれるなんて……まさにヘブンね！」
line = "「紅明ママ～♪　ベアトママ～♪　ああ、代わりばんこに頭を撫でてくれるなんて……まさにヘブンね！」"

[[dialogue]]
speaker = "unk"
# 紅明とベアトリス──
line = "紅明とベアトリス──"

[[dialogue]]
speaker = "unk"
# ２人のママに挟まれて、存分にママみを補充したセシアは、満悦の表情を浮かべていた。
line = "２人のママに挟まれて、存分にママみを補充したセシアは、満悦の表情を浮かべていた。"

[[dialogue]]
speaker = "unk"
# そうしてセシアは、最後までたっぷりママみを摂取するのだった……
line = "そうしてセシアは、最後までたっぷりママみを摂取するのだった……"

[[dialogue]]
speaker = "ルヴィネ"
# 「……それにしてもあれ、いつ終わるのかしら」
line = "「……それにしてもあれ、いつ終わるのかしら」"

[[dialogue]]
speaker = "unk"
# ３人の様子を見守りながらも、１人そう冷静に突っ込むルヴィネなのであった。
line = "３人の様子を見守りながらも、１人そう冷静に突っ込むルヴィネなのであった。"
