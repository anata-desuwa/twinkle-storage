[[dialogue]]
speaker = "unk"
# 第１話,『ルヴィネのお仕事』,B
line = "第１話,『ルヴィネのお仕事』,B"

[[dialogue]]
speaker = "ルヴィネ"
# 「セシア、あなたに聞きたいことがあるのだけれど……女神として最も大切なものは何だと思う？」
line = "「セシア、あなたに聞きたいことがあるのだけれど……女神として最も大切なものは何だと思う？」"

[[dialogue]]
speaker = "セシア"
# 「あら、突然どうしたのかしら？」
line = "「あら、突然どうしたのかしら？」"

[[dialogue]]
speaker = "unk"
# 次代の女神であるルヴィネから突然投げかけられた質問に、『蓄積』を司る守護天使のセシアは考える。
line = "次代の女神であるルヴィネから突然投げかけられた質問に、『蓄積』を司る守護天使のセシアは考える。"

[[dialogue]]
speaker = "セシア"
# 「──もしかして、不安になってしまっているの？」
line = "「──もしかして、不安になってしまっているの？」"

[[dialogue]]
speaker = "セシア"
# 「あなたはよくやっているわ。どうしても不安が拭えないなら、わたくしがよしよししてあげるわよ」
line = "「あなたはよくやっているわ。どうしても不安が拭えないなら、わたくしがよしよししてあげるわよ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「いえ、そういうわけではないのだけれど……」
line = "「いえ、そういうわけではないのだけれど……」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ふと気になってしまったのよ。女神というものに対して、皆が何を求めているのか」
line = "「ふと気になってしまったのよ。女神というものに対して、皆が何を求めているのか」"

[[dialogue]]
speaker = "ルヴィネ"
# 「セシア、あなたはどう思うかしら？」
line = "「セシア、あなたはどう思うかしら？」"

[[dialogue]]
speaker = "セシア"
# 「そうね……女神に求められるもの、それは色々あると思うわ。けれどわたくしの考えはたった１つ──」
line = "「そうね……女神に求められるもの、それは色々あると思うわ。けれどわたくしの考えはたった１つ──」"

[[dialogue]]
speaker = "セシア"
# 「それは『愛』よ！」
line = "「それは『愛』よ！」"

[[dialogue]]
speaker = "ルヴィネ"
# 「あ、あい……！！」
line = "「あ、あい……！！」"

[[dialogue]]
speaker = "ルヴィネ"
# 「そうね……。世界を見守る女神にとって、それは１番大切なことかもしれないわ」
line = "「そうね……。世界を見守る女神にとって、それは１番大切なことかもしれないわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「創造神との戦いを通じて、私も……『愛』というもののかけがえのなさを知ることができた」
line = "「創造神との戦いを通じて、私も……『愛』というもののかけがえのなさを知ることができた」"

[[dialogue]]
speaker = "ルヴィネ"
# 「けれど、生きとし生ける命の数だけ、愛という言葉の定義もまた存在する気がしているわ。私の『愛』の解釈と、セシアの『愛』の解釈も違うかもしれない」
line = "「けれど、生きとし生ける命の数だけ、愛という言葉の定義もまた存在する気がしているわ。私の『愛』の解釈と、セシアの『愛』の解釈も違うかもしれない」"

[[dialogue]]
speaker = "セシア"
# 「ええ。そう思うわ。ルヴィネさまの抱く『愛』の形によって、これから先の世界は形を変えていくはずよ」
line = "「ええ。そう思うわ。ルヴィネさまの抱く『愛』の形によって、これから先の世界は形を変えていくはずよ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「……だったら、私は女神として知る必要があるわね。様々な形の『愛』について──」
line = "「……だったら、私は女神として知る必要があるわね。様々な形の『愛』について──」"

[[dialogue]]
speaker = "unk"
# そんな言葉を交わした数日後のこと、再びルヴィネはアルタイルへやってきた。
line = "そんな言葉を交わした数日後のこと、再びルヴィネはアルタイルへやってきた。"

[[dialogue]]
speaker = "unk"
# デネブとアルタイル間の行き来ができるようになり、ルヴィネは精力的にアルタイルを訪れては様々な仕事を行っていた。
line = "デネブとアルタイル間の行き来ができるようになり、ルヴィネは精力的にアルタイルを訪れては様々な仕事を行っていた。"

[[dialogue]]
speaker = "ルヴィネ"
# 「では魔王、さっそくだけれど、あなたの話を聞かせてもらうわ。まずは──」
line = "「では魔王、さっそくだけれど、あなたの話を聞かせてもらうわ。まずは──」"

[[dialogue]]
speaker = "unk"
# 今回の目的は、アルタイルの要人と会合を持ち、今後の世界について話し合うこと。
line = "今回の目的は、アルタイルの要人と会合を持ち、今後の世界について話し合うこと。"

[[dialogue]]
speaker = "unk"
# アルタイルを訪れたルヴィネは、まず新星学園星徒会長にして魔王である緋宮クロトとの会合を持った。
line = "アルタイルを訪れたルヴィネは、まず新星学園星徒会長にして魔王である緋宮クロトとの会合を持った。"

[[dialogue]]
speaker = "unk"
# 彼こそ星騎士たちの先頭に立ってリクリエや『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』といった脅威に立ち向かい、それを退けた立役者である。
line = "彼こそ星騎士たちの先頭に立ってリクリエや『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』といった脅威に立ち向かい、それを退けた立役者である。"

[[dialogue]]
speaker = "unk"
# そんな彼とルヴィネは、今後の世界について大いに語り合っている。そこから少し離れた星徒会室の隅で──
line = "そんな彼とルヴィネは、今後の世界について大いに語り合っている。そこから少し離れた星徒会室の隅で──"

[[dialogue]]
speaker = "紅明"
# 「あのちっちゃくて可愛い星徒会長さんが、次の女神様になる予定の女の子だなんて驚きだぜ☆」
line = "「あのちっちゃくて可愛い星徒会長さんが、次の女神様になる予定の女の子だなんて驚きだぜ☆」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「紅明ママ、ルヴィネさまが次代の女神ということは、くれぐれも秘密でお願いよ？」
line = "「紅明ママ、ルヴィネさまが次代の女神ということは、くれぐれも秘密でお願いよ？」"

[[dialogue]]
speaker = "紅明"
# 「ああ、分かってるって。無用な混乱を生まないように、ルヴィっちの正体については出来るだけ秘密ってね」
line = "「ああ、分かってるって。無用な混乱を生まないように、ルヴィっちの正体については出来るだけ秘密ってね」"

[[dialogue]]
speaker = "紅明"
# 「でも、アルタイルでも限られた人しか知らないんしょ？　そんな大変な秘密をアタシが知っちゃってもよかったのかね～？」
line = "「でも、アルタイルでも限られた人しか知らないんしょ？　そんな大変な秘密をアタシが知っちゃってもよかったのかね～？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「紅明ママなら問題ないわ。といっても、わたくしの独断というわけじゃなくて、会長が決めたのだけれど」
line = "「紅明ママなら問題ないわ。といっても、わたくしの独断というわけじゃなくて、会長が決めたのだけれど」"

[[dialogue]]
speaker = "紅明"
# 「つまりアタシのこと、セッシーとダーリンは信頼してくれてるってことね？　ありがとうだぜ☆」
line = "「つまりアタシのこと、セッシーとダーリンは信頼してくれてるってことね？　ありがとうだぜ☆」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「お礼を言うのはわたくしの方だわ。ルヴィネさまの案内とヒトの手配、紅明ママが一緒に手伝ってくれて、本当に助かったわ！」
line = "「お礼を言うのはわたくしの方だわ。ルヴィネさまの案内とヒトの手配、紅明ママが一緒に手伝ってくれて、本当に助かったわ！」"

[[dialogue]]
speaker = "unk"
# ここ数日、ルヴィネの要望を叶えるため、セシアを通じて紅明が色々な人にかけあってくれたのだった。
line = "ここ数日、ルヴィネの要望を叶えるため、セシアを通じて紅明が色々な人にかけあってくれたのだった。"

[[dialogue]]
speaker = "紅明"
# 「うしし♪　いいってことよ！！　それにしてもルヴィっち、最近よくアルタイルに来て、いろいろやってるみたいだね～」
line = "「うしし♪　いいってことよ！！　それにしてもルヴィっち、最近よくアルタイルに来て、いろいろやってるみたいだね～」"

[[dialogue]]
speaker = "紅明"
# 「附属校に編入してみたり、ハロウィンのことについて学んでみたりしてたって聞いてたけど」
line = "「附属校に編入してみたり、ハロウィンのことについて学んでみたりしてたって聞いてたけど」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それは『この世界に生きる天使として、いろいろなことに主観的に関わるため』よ」
line = "「それは『この世界に生きる天使として、いろいろなことに主観的に関わるため』よ」"

[[dialogue]]
speaker = "紅明"
# 「ん、どゆこと？」
line = "「ん、どゆこと？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ルヴィネさまが今、天使として生きているこの時間は、先代の女神様であるテルルさまが与えた『修行』の時間なの」
line = "「ルヴィネさまが今、天使として生きているこの時間は、先代の女神様であるテルルさまが与えた『修行』の時間なの」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「修行といっても女神の力を高めるために厳しい修練を積ませよう、といったことではなくて──」
line = "「修行といっても女神の力を高めるために厳しい修練を積ませよう、といったことではなくて──」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「女神となる前に、ひとりの天使として生きる時間を楽しんでもらいたい、というテルルさまの温情ね」
line = "「女神となる前に、ひとりの天使として生きる時間を楽しんでもらいたい、というテルルさまの温情ね」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「けれど、ルヴィネさまは真面目な方だから……この時間に何か目標や目的が欲しいと考えたの」
line = "「けれど、ルヴィネさまは真面目な方だから……この時間に何か目標や目的が欲しいと考えたの」"

[[dialogue]]
speaker = "紅明"
# 「なぁるほど☆　それで、いろんなことを積極的に経験しようとしてるってワケなんだな♪」
line = "「なぁるほど☆　それで、いろんなことを積極的に経験しようとしてるってワケなんだな♪」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ええ。だから紅明ママも、ルヴィネさまがいろいろな経験をできるように、手伝ってあげてほしいわ」
line = "「ええ。だから紅明ママも、ルヴィネさまがいろいろな経験をできるように、手伝ってあげてほしいわ」"

[[dialogue]]
speaker = "紅明"
# 「わかったぜ☆　いい機会だし、ルヴィっちとも仲良くなりたいからな！　この牛紅明の元気、おすそ分けしてやるってもんよ！」
line = "「わかったぜ☆　いい機会だし、ルヴィっちとも仲良くなりたいからな！　この牛紅明の元気、おすそ分けしてやるってもんよ！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふふっ、紅明ママのことはルヴィネさまに紹介したかったの♪　わたくしの大好きなママよって♪」
line = "「ふふっ、紅明ママのことはルヴィネさまに紹介したかったの♪　わたくしの大好きなママよって♪」"

[[dialogue]]
speaker = "紅明"
# 「あはは、いきなりそんなこと言ったらルヴィっちが混乱しちまわないかい？」
line = "「あはは、いきなりそんなこと言ったらルヴィっちが混乱しちまわないかい？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そんなこと言っても、紅明ママはわたくしのママなんだから。ママ～っ<emoji=heart04>」
line = "「そんなこと言っても、紅明ママはわたくしのママなんだから。ママ～っ<emoji=heart04>」"

[[dialogue]]
speaker = "紅明"
# 「お～、よしよし。まったくセッシーは甘えん坊だな～♪」
line = "「お～、よしよし。まったくセッシーは甘えん坊だな～♪」"

[[dialogue]]
speaker = "unk"
# セシアは紅明のことを『ママ』と呼んで慕っているが、当然、本当のママではない。
line = "セシアは紅明のことを『ママ』と呼んで慕っているが、当然、本当のママではない。"

[[dialogue]]
speaker = "unk"
# あふれんばかりの紅明の母性に、セシアが一方的にママ判定しているだけだ。
line = "あふれんばかりの紅明の母性に、セシアが一方的にママ判定しているだけだ。"

[[dialogue]]
speaker = "unk"
# セシアは他にも、そこかしこで『ママ判定』を行い、甘えられる相手を作っていっている。
line = "セシアは他にも、そこかしこで『ママ判定』を行い、甘えられる相手を作っていっている。"

[[dialogue]]
speaker = "unk"
# そんなセシアを紅明も受け入れて、こうして甘えてくるセシアを存分に可愛がっているのだった。
line = "そんなセシアを紅明も受け入れて、こうして甘えてくるセシアを存分に可愛がっているのだった。"

[[dialogue]]
speaker = "紅明"
# 「ちなみにだけど、ルヴィっちはセッシー的にママだったりする感じ？」
line = "「ちなみにだけど、ルヴィっちはセッシー的にママだったりする感じ？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ルヴィネさまのママ成分……そうね……」
line = "「ルヴィネさまのママ成分……そうね……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「器の広さ、包容力は感じるけれど……母性とは少し違うように感じるわね」
line = "「器の広さ、包容力は感じるけれど……母性とは少し違うように感じるわね」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「もう少しバブみがあって、オギャりたくなって、あと、紅明ママほどでなくとも、お胸がふくよかなら……」
line = "「もう少しバブみがあって、オギャりたくなって、あと、紅明ママほどでなくとも、お胸がふくよかなら……」"

[[dialogue]]
speaker = "紅明"
# 「残念☆　新しいママにはならなかったか～」
line = "「残念☆　新しいママにはならなかったか～」"

[[dialogue]]
speaker = "紅明"
# 「って、セッシー。おっぱいの大きさとママか否かは関係ないって、前に言ってなかったっけ～？」
line = "「って、セッシー。おっぱいの大きさとママか否かは関係ないって、前に言ってなかったっけ～？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「お胸の大きさが、ママか否かのすべてを決めるわけではない、というだけよ。紅明ママのようなお胸が、大きな包容力を生み出すことは間違いないわ」
line = "「お胸の大きさが、ママか否かのすべてを決めるわけではない、というだけよ。紅明ママのようなお胸が、大きな包容力を生み出すことは間違いないわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「つまり、なかなか紅明ママのような、素敵なママには出会えないってことね」
line = "「つまり、なかなか紅明ママのような、素敵なママには出会えないってことね」"

[[dialogue]]
speaker = "unk"
# そんな話をしているうちに、ルヴィネと緋宮クロトの会談は終わりを迎える。
line = "そんな話をしているうちに、ルヴィネと緋宮クロトの会談は終わりを迎える。"

[[dialogue]]
speaker = "ルヴィネ"
# 「──ありがとう、魔王。有意義な意見交換をすることができたわ」
line = "「──ありがとう、魔王。有意義な意見交換をすることができたわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「デネブとアルタイル、今後も積極的に協力し合って、１日も早い世界の復興を目指していきましょう」
line = "「デネブとアルタイル、今後も積極的に協力し合って、１日も早い世界の復興を目指していきましょう」"

[[dialogue]]
speaker = "unk"
# 満足そうな笑顔を浮かべながら、ルヴィネはクロトと握手を交わし、セシアたちの方へ振り返った。
line = "満足そうな笑顔を浮かべながら、ルヴィネはクロトと握手を交わし、セシアたちの方へ振り返った。"

[[dialogue]]
speaker = "ルヴィネ"
# 「さて、この後は新星学園の学園長である十六夜シノと合流して、聖庭園から人間界を訪問している使節団と会う予定になっているけれど……」
line = "「さて、この後は新星学園の学園長である十六夜シノと合流して、聖庭園から人間界を訪問している使節団と会う予定になっているけれど……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「エスコート役はお任せよ。今日１日、わたくしたちがルヴィネさまのお供をするわ」
line = "「エスコート役はお任せよ。今日１日、わたくしたちがルヴィネさまのお供をするわ」"

[[dialogue]]
speaker = "紅明"
# 「初めまして！　アタシは<ruby=ぎゅうこうめい>牛紅明</ruby>だぜ、よろしくなっ☆」
line = "「初めまして！　アタシは<ruby>牛紅明<rt>ぎゅうこうめい</rt></ruby>だぜ、よろしくなっ☆」"

[[dialogue]]
speaker = "ルヴィネ"
# 「セシアに紅明、２人ともよろしくお願いするわ」
line = "「セシアに紅明、２人ともよろしくお願いするわ」"

[[dialogue]]
speaker = "紅明"
# 「おっ、そーだ。お近づきの印に、はいこれっ☆」
line = "「おっ、そーだ。お近づきの印に、はいこれっ☆」"

[[dialogue]]
speaker = "ルヴィネ"
# 「！　えっと、これは……？」
line = "「！　えっと、これは……？」"

[[dialogue]]
speaker = "紅明"
# 「元気みなぎる、ホルスタミン！　我が<ruby=ぜんざいにゅうぎょう>善哉乳業</ruby>の製造する、流星市国ナンバーワンのエナジードリンクさ☆」
line = "「元気みなぎる、ホルスタミン！　我が<ruby>善哉乳業<rt>ぜんざいにゅうぎょう</rt></ruby>の製造する、流星市国ナンバーワンのエナジードリンクさ☆」"

[[dialogue]]
speaker = "ルヴィネ"
# 「あ、ありがとう……でも、今日は仕事で来たのに、いいのかしら」
line = "「あ、ありがとう……でも、今日は仕事で来たのに、いいのかしら」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「もちろんよ。むしろ、ホルスタミンの味は積極的に体験すべきだわ」
line = "「もちろんよ。むしろ、ホルスタミンの味は積極的に体験すべきだわ」"

[[dialogue]]
speaker = "紅明"
# 「そーそー、遠慮せずにグイッといきな☆」
line = "「そーそー、遠慮せずにグイッといきな☆」"

[[dialogue]]
speaker = "ルヴィネ"
# 「そうね……なら、いただくことにするわ」
line = "「そうね……なら、いただくことにするわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「……おいしいわ。それに、何だか元気が出てきたような……」
line = "「……おいしいわ。それに、何だか元気が出てきたような……」"

[[dialogue]]
speaker = "紅明"
# 「気のせいじゃなくて、ホルスタミンは体力回復に効果抜群だからな！　疲れた時にはホルスタミンってね♪」
