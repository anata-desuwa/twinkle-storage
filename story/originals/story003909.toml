line = "「ふう……これにて一件落着、ですわね」"

[[dialogue]]
speaker = "セナリィ"
# 「さすがにゴールデングースを抜けて、九浄家で働く、という流れになった時は驚きましたけど」
line = "「さすがにゴールデングースを抜けて、九浄家で働く、という流れになった時は驚きましたけど」"

[[dialogue]]
speaker = "ネーゼマイン"
