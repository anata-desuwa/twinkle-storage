line = "「ずいぶん心配してたもんね～、２人が本当に九浄家に引き抜かれるんじゃないかって」"

[[dialogue]]
speaker = "セナリィ"
# 「マイン！？　帰ったんじゃなかったんですの！？　余計なことは言わなくて結構ですわ！」
line = "「マイン！？　帰ったんじゃなかったんですの！？　余計なことは言わなくて結構ですわ！」"

[[dialogue]]
speaker = "ミウ"
