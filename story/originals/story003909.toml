[[dialogue]]
speaker = "セナリィ"
# 「とまぁ、結果オーライでしたけど、勇み足で勝手に依頼を受けたのはマイナス査定ですわね」
line = "「とまぁ、結果オーライでしたけど、勇み足で勝手に依頼を受けたのはマイナス査定ですわね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「う……ごめんなさい……」
line = "「う……ごめんなさい……」"

[[dialogue]]
speaker = "ミウ"
# 「申し訳ありません……でも、何も知らない私たちが上手くやれていなかったら、途中でプランが崩壊していたのでは……？」
line = "「申し訳ありません……でも、何も知らない私たちが上手くやれていなかったら、途中でプランが崩壊していたのでは……？」"

[[dialogue]]
speaker = "セナリィ"
# 「その時はその時でフレキシブルに対応しましたわ。実際、プランの変更は何度もおこなわれていましたの。あなたたちが想定していたよりも優秀だったお陰でね」
line = "「その時はその時でフレキシブルに対応しましたわ。実際、プランの変更は何度もおこなわれていましたの。あなたたちが想定していたよりも優秀だったお陰でね」"

[[dialogue]]
speaker = "セナリィ"
# 「まったく……黙って依頼を受けたりせず、ちゃんと私に相談していれば満点でしたのに。会社組織では報・連・相が大事と教えてきましたわよね？」
line = "「まったく……黙って依頼を受けたりせず、ちゃんと私に相談していれば満点でしたのに。会社組織では報・連・相が大事と教えてきましたわよね？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「はい……次からは気をつけます」
line = "「はい……次からは気をつけます」"

[[dialogue]]
speaker = "ミウ"
# 「反省です……」
line = "「反省です……」"

[[dialogue]]
speaker = "セナリィ"
# 「でも、あなたたちはちゃんと仕事をしてくれた。私の元でちゃんと成長してくれてるのを実感しました。とても嬉しく思いますわ」
line = "「でも、あなたたちはちゃんと仕事をしてくれた。私の元でちゃんと成長してくれてるのを実感しました。とても嬉しく思いますわ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「し、社長～～っ！　ありがとうございます！」
line = "「し、社長～～っ！　ありがとうございます！」"

[[dialogue]]
speaker = "ミウ"
# 「やっぱり私たちにはセナリィ社長が必要不可欠です！」
line = "「やっぱり私たちにはセナリィ社長が必要不可欠です！」"

[[dialogue]]
speaker = "セナリィ"
# （ヒマワリとミウの勇み足も、ヘレナ様の計算の内だったそうですけど……）
line = "（ヒマワリとミウの勇み足も、ヘレナ様の計算の内だったそうですけど……）"

[[dialogue]]
speaker = "セナリィ"
# （あの方の掌の上で踊らされているようではまだまだ未熟ですわね。もっと成長していただきませんと）
line = "（あの方の掌の上で踊らされているようではまだまだ未熟ですわね。もっと成長していただきませんと）"

[[dialogue]]
speaker = "エルデリーゼ"
# 「あのー……ご指導は終わりましたですの？」
line = "「あのー……ご指導は終わりましたですの？」"

[[dialogue]]
speaker = "セナリィ"
# 「ええ。エルデリーゼ様、協力してくださってありがとうございます」
line = "「ええ。エルデリーゼ様、協力してくださってありがとうございます」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「私、事情を全然知りませんでしたの！　でも、とってもドキドキしましたの」
line = "「私、事情を全然知りませんでしたの！　でも、とってもドキドキしましたの」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ヒマワリ様にミウ様、事情も知らず、思いっきり攻撃を仕掛けてしまい申し訳ありませんでしたわ」
line = "「ヒマワリ様にミウ様、事情も知らず、思いっきり攻撃を仕掛けてしまい申し訳ありませんでしたわ」"

[[dialogue]]
speaker = "ミウ"
# 「それはお互いさまです。私たちも何も知らなかったですし」
line = "「それはお互いさまです。私たちも何も知らなかったですし」"

[[dialogue]]
speaker = "ヒマワリ"
# 「こっちこそごめんなさいっ！　へへ……なんか今回のあたしたち、謝ってばっかだね」
line = "「こっちこそごめんなさいっ！　へへ……なんか今回のあたしたち、謝ってばっかだね」"

[[dialogue]]
speaker = "エルデリーゼ"
