line = "「私たちを馬鹿にしていたのはそちらでしょう？　ウチの可愛い社員を<ruby>囮<rt>デコイ</rt></ruby>に使おうだなんて小癪な真似を」"

[[dialogue]]
speaker = "セナリィ"
# 「そもそも九浄家のお屋敷に、危険をはらんだ新たな人工戦闘服など存在していない──ですわよね？」
