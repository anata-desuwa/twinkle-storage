[[dialogue]]
speaker = "unk"
# 第４話,エルデリーゼ、初めてのお泊り,P
line = "第４話,エルデリーゼ、初めてのお泊り,P"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ついに今日……この時が来てしまいましたのね……！」
line = "「ついに今日……この時が来てしまいましたのね……！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「会長様のお家でのお泊り……！　前々より約束していましたけれども、いざとなると、すごく緊張しますわ……」
line = "「会長様のお家でのお泊り……！　前々より約束していましたけれども、いざとなると、すごく緊張しますわ……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「事前にしっかり調べて、お泊りする準備は整えてきましたの。お着替えも用意しましたのよ」
line = "「事前にしっかり調べて、お泊りする準備は整えてきましたの。お着替えも用意しましたのよ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「外泊のための口実もきちんと……アムのお家にお泊りすると口裏を合わせてもらうようお伝えしましたわ」
line = "「外泊のための口実もきちんと……アムのお家にお泊りすると口裏を合わせてもらうようお伝えしましたわ」"

[[dialogue]]
speaker = "アム"
# 「か、会長のお家にお泊り～！？　それであたしの家に泊まることにするって……」
line = "「か、会長のお家にお泊り～！？　それであたしの家に泊まることにするって……」"

[[dialogue]]
speaker = "アム"
# 「エルゼ……ライバルのあたしをダシにするなんて、いい度胸してるよね」
line = "「エルゼ……ライバルのあたしをダシにするなんて、いい度胸してるよね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「申し訳ありませんですわ。ですが、他にどうしてもいい口実が思いつかず、アムしか頼れる人がいなかったものですから……」
line = "「申し訳ありませんですわ。ですが、他にどうしてもいい口実が思いつかず、アムしか頼れる人がいなかったものですから……」"

[[dialogue]]
speaker = "アム"
# 「責めてるわけじゃないから、別にいいけど。エルゼ、会長に惚れてからすっかり変わったよね。いい意味で」
line = "「責めてるわけじゃないから、別にいいけど。エルゼ、会長に惚れてからすっかり変わったよね。いい意味で」"

[[dialogue]]
speaker = "アム"
# 「これでエルゼに貸し１つだからね。いつか絶対に返してもらうから、忘れないでよ？」
line = "「これでエルゼに貸し１つだからね。いつか絶対に返してもらうから、忘れないでよ？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「アムには大きな借りを作ってしまいましたわね」
line = "「アムには大きな借りを作ってしまいましたわね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「お泊りの準備は、万全に整ってますわ。忘れてはいけない大切なものもきちんと持ってきていますのよ」
line = "「お泊りの準備は、万全に整ってますわ。忘れてはいけない大切なものもきちんと持ってきていますのよ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ここが会長様のお家……普通のお住まいとはこういうものなのですわね」
line = "「ここが会長様のお家……普通のお住まいとはこういうものなのですわね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「お邪魔いたしますわ……お母様はご不在ですのよね……？」
line = "「お邪魔いたしますわ……お母様はご不在ですのよね……？」"

[[dialogue]]
speaker = "unk"
# 帰ってくるのは明日かな
line = "帰ってくるのは明日かな"

[[dialogue]]
speaker = "unk"
# 仕事が忙しいみたいでね
line = "仕事が忙しいみたいでね"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そ、そうですのね。せっかくの機会ですし、ご挨拶させていただこうかとも思っていたのですけど……」
line = "「そ、そうですのね。せっかくの機会ですし、ご挨拶させていただこうかとも思っていたのですけど……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「す、すみません！　どこを見て良いかわからなくて、ついキョロキョロとしてしまいまして……」
line = "「す、すみません！　どこを見て良いかわからなくて、ついキョロキョロとしてしまいまして……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「寮の部屋ともずいぶん違っていて……会長様のお家にお邪魔してるんだなーって……」
line = "「寮の部屋ともずいぶん違っていて……会長様のお家にお邪魔してるんだなーって……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「私、明日の朝まで、ここで会長様と２人きりで過ごしますのね……」
line = "「私、明日の朝まで、ここで会長様と２人きりで過ごしますのね……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「っっっ～～！！！　も、申し訳ありません！　変なことを口走ってしまいましたわ！　忘れてくださいませっ！」
line = "「っっっ～～！！！　も、申し訳ありません！　変なことを口走ってしまいましたわ！　忘れてくださいませっ！」"

[[dialogue]]
speaker = "unk"
# 初めてのお泊りということで、緊張のあまり挙動が変になってしまっているエルゼだった。
line = "初めてのお泊りということで、緊張のあまり挙動が変になってしまっているエルゼだった。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「まあ、これはビーフシチュー？　とっても美味しそうですわ……！」
line = "「まあ、これはビーフシチュー？　とっても美味しそうですわ……！」"

[[dialogue]]
speaker = "unk"
# 夕飯に俺の手料理を振る舞うと、エルゼはぱぁっと顔を輝かせた。
line = "夕飯に俺の手料理を振る舞うと、エルゼはぱぁっと顔を輝かせた。"

[[dialogue]]
speaker = "unk"
# たくさん用意したから、いっぱい食べて
line = "たくさん用意したから、いっぱい食べて"

[[dialogue]]
speaker = "unk"
# エルゼのために作ったんだ
line = "エルゼのために作ったんだ"

[[dialogue]]
speaker = "エルデリーゼ"
# 「はむ、はむ……会長様の手作りお料理、とっても美味しいですわ……当家のシェフに勝るとも劣らぬ──」
line = "「はむ、はむ……会長様の手作りお料理、とっても美味しいですわ……当家のシェフに勝るとも劣らぬ──」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「いえ、愛情の分だけ会長様に軍配が上がりますわ。毎日でも食べたいくらいですの」
line = "「いえ、愛情の分だけ会長様に軍配が上がりますわ。毎日でも食べたいくらいですの」"

[[dialogue]]
speaker = "unk"
# まるで同棲のような幸せな時間を過ごした。
line = "まるで同棲のような幸せな時間を過ごした。"

[[dialogue]]
speaker = "unk"
# 次第に夜も更ける。
line = "次第に夜も更ける。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ここが会長様のお部屋……男性のお部屋にお邪魔するのは、初めてですわ……」
line = "「ここが会長様のお部屋……男性のお部屋にお邪魔するのは、初めてですわ……」"

[[dialogue]]
speaker = "unk"
# 物珍しそうに俺の部屋を見回す。
line = "物珍しそうに俺の部屋を見回す。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「すんすん……お部屋中から会長様の匂いがしますわ……私の大好きな匂い……」
line = "「すんすん……お部屋中から会長様の匂いがしますわ……私の大好きな匂い……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「はっ！　私、またはしたない真似を！」
line = "「はっ！　私、またはしたない真似を！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「申し訳ありません……ここで毎日、会長様が寝起きしていると思うと、なんだかドキドキしてしまって……」
line = "「申し訳ありません……ここで毎日、会長様が寝起きしていると思うと、なんだかドキドキしてしまって……」"

[[dialogue]]
speaker = "unk"
# もっと近くに来たら？
line = "もっと近くに来たら？"

[[dialogue]]
speaker = "unk"
# そんな遠くにいなくても
line = "そんな遠くにいなくても"

[[dialogue]]
speaker = "エルデリーゼ"
# 「は、はい……では、失礼して……」
line = "「は、はい……では、失礼して……」"

[[dialogue]]
speaker = "unk"
# ベッドに腰かける俺の横に、少しだけ距離を置いて座る。この期に及んで、エルゼに警戒されているのだろうか。
line = "ベッドに腰かける俺の横に、少しだけ距離を置いて座る。この期に及んで、エルゼに警戒されているのだろうか。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「この上なく、ドキドキしていますわ……お顔が燃えそうに熱くて……心臓が口から飛び出てしまいそうですの……」
line = "「この上なく、ドキドキしていますわ……お顔が燃えそうに熱くて……心臓が口から飛び出てしまいそうですの……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「会長様はドキドキしてませんの……？」
line = "「会長様はドキドキしてませんの……？」"

[[dialogue]]
speaker = "unk"
# もちろんドキドキしてるよ
line = "もちろんドキドキしてるよ"

[[dialogue]]
speaker = "unk"
# 緊張で胸が張り裂けそうだが、年上の俺がリードするべきだろう。エルゼの緊張を解きほぐそうと、気の利いた言葉を探す。
line = "緊張で胸が張り裂けそうだが、年上の俺がリードするべきだろう。エルゼの緊張を解きほぐそうと、気の利いた言葉を探す。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「会長様？　もし、私を落ち着かせようとしてくださっているなら、お気遣いなく……」
line = "「会長様？　もし、私を落ち着かせようとしてくださっているなら、お気遣いなく……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「お互い、ドキドキしたままで構いませんわ」
line = "「お互い、ドキドキしたままで構いませんわ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「きっとこのドキドキも、会長様と過ごすこれからの日々の中で大切な思い出になると思っていますの」
line = "「きっとこのドキドキも、会長様と過ごすこれからの日々の中で大切な思い出になると思っていますの」"

[[dialogue]]
speaker = "unk"
# エルゼは一言発する度、少しずつ少しずつ距離を詰めてくる。
line = "エルゼは一言発する度、少しずつ少しずつ距離を詰めてくる。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「恋人のお家にお邪魔するのに、一番大切なものはちゃんと持ってきましたから」
line = "「恋人のお家にお邪魔するのに、一番大切なものはちゃんと持ってきましたから」"

[[dialogue]]
speaker = "unk"
# それって……？
line = "それって……？"

[[dialogue]]
speaker = "エルデリーゼ"
# 「貴方様に全てを捧げる覚悟ですわ」
line = "「貴方様に全てを捧げる覚悟ですわ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「会長様……心よりお慕い申し上げております。大好きですわ……<emoji=heart04>」
line = "「会長様……心よりお慕い申し上げております。大好きですわ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# エルゼは目を閉じると、唇をそっと差し出してくる。
line = "エルゼは目を閉じると、唇をそっと差し出してくる。"

[[dialogue]]
speaker = "unk"
# その意を察して、優しく唇を重ねる。
line = "その意を察して、優しく唇を重ねる。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ふふ、会長様とキスしてしまいました……ますますドキドキしてきましたわ……でも、とても嬉しいドキドキ……」
line = "「ふふ、会長様とキスしてしまいました……ますますドキドキしてきましたわ……でも、とても嬉しいドキドキ……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「会長様にまで聞こえてしまいそう……私の鼓動、感じてくださいませ……<emoji=heart04>」
line = "「会長様にまで聞こえてしまいそう……私の鼓動、感じてくださいませ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# キスのおかわりを望むエルゼの唇に再び唇を重ねる。
line = "キスのおかわりを望むエルゼの唇に再び唇を重ねる。"

[[dialogue]]
speaker = "unk"
# 緊張に震える身体を押し殺しながら、俺を受け止めようとしてくれるエルゼがどこまでも愛おしかった。
line = "緊張に震える身体を押し殺しながら、俺を受け止めようとしてくれるエルゼがどこまでも愛おしかった。"
