speaker = "unk"
# その日、ヨミは俺の家に遊びに来ており、２人でのんびりとした時間を過ごしていた。
line = "その日、ヨミは俺の家に遊びに来ており、２人でのんびりとした時間を過ごしていた。"

[[dialogue]]
speaker = "ヨミ"
# 「――えっ？　アニマ先輩が『分裂薬』を……！？」
line = "「――えっ？　アニマ先輩が『分裂薬』を……！？」"

[[dialogue]]
speaker = "unk"
# 俺は笑い話として、アニマ先輩が新たに開発した『分裂薬』の実験に付き合った時のことをヨミに話していた。
line = "俺は笑い話として、アニマ先輩が新たに開発した『分裂薬』の実験に付き合った時のことをヨミに話していた。"

[[dialogue]]
speaker = "クロト"
# 「それで、よかったらまた試してみてくれって予備の薬を渡されたんだけど、正直どう使えばいいのか分からなくてさ」
line = "「それで、よかったらまた試してみてくれって予備の薬を渡されたんだけど、正直どう使えばいいのか分からなくてさ」"

[[dialogue]]
speaker = "ヨミ"
# 「か、会長の体が分裂しちゃうなんて……こやや……<emoji=heart04>」
