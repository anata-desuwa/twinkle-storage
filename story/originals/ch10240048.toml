# 「んっ――はああぁ～っ<emoji=heart04><emoji=heart04>　体の内側も外側も、ご主人様の熱いのかけられてますぅ～～っ<emoji=heart04><emoji=heart04>」
line = "「んっ――はああぁ～っ<emoji=heart04><emoji=heart04>　体の内側も外側も、ご主人様の熱いのかけられてますぅ～～っ<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# やがて、射精の勢いも少しずつ収まり、激しかった時間は余韻へと変わっていって――
line = "やがて、射精の勢いも少しずつ収まり、激しかった時間は余韻へと変わっていって――"

[[dialogue]]
speaker = "ヨミ"
# 「はあぁっ……んっ……ふうぅ……<emoji=heart04>」
line = "「はあぁっ……んっ……ふうぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 射精が止まった後、ヨミは熱っぽい吐息を漏らしながら、うっとりとした表情を浮かべていた。
line = "射精が止まった後、ヨミは熱っぽい吐息を漏らしながら、うっとりとした表情を浮かべていた。"

[[dialogue]]
speaker = "ヨミ"
# 「精液お恵み、ありがとうございますぅ……<emoji=heart04>　体中ご主人様の匂いに包まれて、幸せですぅ……<emoji=heart04>」
line = "「精液お恵み、ありがとうございますぅ……<emoji=heart04>　体中ご主人様の匂いに包まれて、幸せですぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「ふああぁ……<emoji=heart04>　ご主人様との４Ｐエッチ、すごかったです……<emoji=heart04>　気持ち良くて……頭の中、とろとろになっちゃいましたぁ……<emoji=heart04>」
line = "「ふああぁ……<emoji=heart04>　ご主人様との４Ｐエッチ、すごかったです……<emoji=heart04>　気持ち良くて……頭の中、とろとろになっちゃいましたぁ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ――と、その時。
line = "――と、その時。"

[[dialogue]]
speaker = "クロト"
# 「ん……あれ……？　俺……どうして分裂して……」
line = "「ん……あれ……？　俺……どうして分裂して……」"

[[dialogue]]
speaker = "unk"
# 『俺』の意識は、夢から目覚めるようにはっきりと起き上がってきた。
line = "『俺』の意識は、夢から目覚めるようにはっきりと起き上がってきた。"

[[dialogue]]
speaker = "ヨミ"
# 「あっ……会長、お目覚めになりましたか……？」
line = "「あっ……会長、お目覚めになりましたか……？」"

[[dialogue]]
speaker = "ヨミ"
# 「その……破邪の鈴が、私がエッチなことを考えていたのを、勝手に叶えてしまったというか……」
line = "「その……破邪の鈴が、私がエッチなことを考えていたのを、勝手に叶えてしまったというか……」"

[[dialogue]]
speaker = "クロト"
# 「そうか……それで俺、分裂してヨミを囲んで……」
line = "「そうか……それで俺、分裂してヨミを囲んで……」"

[[dialogue]]
speaker = "ヨミ"
# 「ごめんなさい……会長にご迷惑をおかけして……」
line = "「ごめんなさい……会長にご迷惑をおかけして……」"

[[dialogue]]
speaker = "クロト"
# 「いや、そういうことなら――」
line = "「いや、そういうことなら――」"

[[dialogue]]
speaker = "unk"
# エッチしていた時の記憶が戻った俺は、ヨミの秘部に手を伸ばして、指で触れた。
line = "エッチしていた時の記憶が戻った俺は、ヨミの秘部に手を伸ばして、指で触れた。"

[[dialogue]]
speaker = "ヨミ"
# 「こやっ<emoji=heart04>　か、会長……！？」
line = "「こやっ<emoji=heart04>　か、会長……！？」"

[[dialogue]]
speaker = "unk"
# 秘部を愛撫しながら、俺は彼女の耳元で囁く。
line = "秘部を愛撫しながら、俺は彼女の耳元で囁く。"

[[dialogue]]
speaker = "クロト"
# 「ヨミ……ご主人様を自分の欲望に付き合わせておいて、１人で満足してちゃダメだろう？」
line = "「ヨミ……ご主人様を自分の欲望に付き合わせておいて、１人で満足してちゃダメだろう？」"

[[dialogue]]
speaker = "クロト"
# 「だって――俺は今、３人に分裂してるんだぞ？」
line = "「だって――俺は今、３人に分裂してるんだぞ？」"

[[dialogue]]
speaker = "ヨミ"
# 「……！」
line = "「……！」"

[[dialogue]]
speaker = "ヨミ"
# 「は、はい……ごめんなさい<emoji=heart04>」
line = "「は、はい……ごめんなさい<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ヨミは頬を赤く染めながら、言う。
line = "ヨミは頬を赤く染めながら、言う。"

[[dialogue]]
speaker = "ヨミ"
# 「どうか、３人分のおち○ぽ様が満足するまで、ヨミのメイドおま○こをお使い下さい<emoji=heart04>」
line = "「どうか、３人分のおち○ぽ様が満足するまで、ヨミのメイドおま○こをお使い下さい<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「――あっ<emoji=heart04>　ご主人様ぁ……<emoji=heart04>」
line = "「――あっ<emoji=heart04>　ご主人様ぁ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「こやぁん……<emoji=heart04>」
line = "「こやぁん……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# その後も分裂した俺は、何度も３人の位置を入れ替えながら、ヨミを白濁色に染め続けてしまうのだった。
line = "その後も分裂した俺は、何度も３人の位置を入れ替えながら、ヨミを白濁色に染め続けてしまうのだった。"
