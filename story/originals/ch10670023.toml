[[dialogue]]
speaker = "unk"
# 第３話,聖沙と内緒の趣味,P
line = "第３話,聖沙と内緒の趣味,P"

[[dialogue]]
speaker = "unk"
# 梨緒と知り合ったその日。聖沙はフィオナに誘われ、星見家に泊まることになった。
line = "梨緒と知り合ったその日。聖沙はフィオナに誘われ、星見家に泊まることになった。"

[[dialogue]]
speaker = "フィオナ"
# 「それでは紹介しますね。こちらが私の姉さん――星見アポロです」
line = "「それでは紹介しますね。こちらが私の姉さん――星見アポロです」"

[[dialogue]]
speaker = "アポロ"
# 「おう！　お前が流星クルセイダースの聖沙か。フィオナから話は聞いているぜ！」
line = "「おう！　お前が流星クルセイダースの聖沙か。フィオナから話は聞いているぜ！」"

[[dialogue]]
speaker = "聖沙"
# 「お邪魔しております。聖沙・<ruby=ブリジッタ>Ｂ</ruby>・クリステレスです。本日はよろしくお願い致します♪」
line = "「お邪魔しております。聖沙・<ruby>Ｂ<rt>ブリジッタ</rt></ruby>・クリステレスです。本日はよろしくお願い致します♪」"

[[dialogue]]
speaker = "アポロ"
# 「ん？　なんで敬語なんだ？」
line = "「ん？　なんで敬語なんだ？」"

[[dialogue]]
speaker = "聖沙"
# 「えっ？　アポロさんは私よりも年上ですし……」
line = "「えっ？　アポロさんは私よりも年上ですし……」"

[[dialogue]]
speaker = "アポロ"
# 「あー、そういうことか！　あははっ、聖沙は真面目だな♪」
line = "「あー、そういうことか！　あははっ、聖沙は真面目だな♪」"

[[dialogue]]
speaker = "アポロ"
# 「でも、敬語は別に要らないぜ！　あたしも気にせず話すからさ♪」
line = "「でも、敬語は別に要らないぜ！　あたしも気にせず話すからさ♪」"

[[dialogue]]
speaker = "梨緒"
# 「私もアポロとは、そういうのは気にせずに話しているしな」
line = "「私もアポロとは、そういうのは気にせずに話しているしな」"

[[dialogue]]
speaker = "聖沙"
# 「アポロさんがいいなら――わかったわ。じゃあ、普通に話させてもらうわね♪」
line = "「アポロさんがいいなら――わかったわ。じゃあ、普通に話させてもらうわね♪」"

[[dialogue]]
speaker = "アポロ"
# 「おう！　よろしくな、聖沙♪」
line = "「おう！　よろしくな、聖沙♪」"

[[dialogue]]
speaker = "unk"
# それから、聖沙は梨緒の部屋を訪れていた。
line = "それから、聖沙は梨緒の部屋を訪れていた。"

[[dialogue]]
speaker = "梨緒"
# 「ここが星見家で間借りさせてもらっている私の部屋だ。見たいと言っていた『ぶちゃ猫』のグッズは、そこの棚に並べてある」
line = "「ここが星見家で間借りさせてもらっている私の部屋だ。見たいと言っていた『ぶちゃ猫』のグッズは、そこの棚に並べてある」"

[[dialogue]]
speaker = "聖沙"
# 「わあっ、可愛い<emoji=heart04>　それに、他の素敵なぬいぐるみさん達もいっぱい……<emoji=heart04>」
line = "「わあっ、可愛い<emoji=heart04>　それに、他の素敵なぬいぐるみさん達もいっぱい……<emoji=heart04>」"

[[dialogue]]
speaker = "梨緒"
# 「ああ……その、外ではあまり言えないが、趣味で集めていてな。街で可愛いと思ったものを見かけると、つい買ってきてしまう」
line = "「ああ……その、外ではあまり言えないが、趣味で集めていてな。街で可愛いと思ったものを見かけると、つい買ってきてしまう」"

[[dialogue]]
speaker = "聖沙"
# 「ふふっ、私も同じよ♪　部屋に沢山ぬいぐるみが置いてあるの♪」
line = "「ふふっ、私も同じよ♪　部屋に沢山ぬいぐるみが置いてあるの♪」"

[[dialogue]]
speaker = "梨緒"
# 「……そうか」
line = "「……そうか」"

[[dialogue]]
speaker = "梨緒"
# 「不思議だな。今日会ったばかりなのに、聖沙には見せてもいいと思えた」
line = "「不思議だな。今日会ったばかりなのに、聖沙には見せてもいいと思えた」"

[[dialogue]]
speaker = "聖沙"
# 「私も同じよ。恥ずかしくて、なかなか言えないわよね。だから、部屋を見せてくれてありがとう♪」
line = "「私も同じよ。恥ずかしくて、なかなか言えないわよね。だから、部屋を見せてくれてありがとう♪」"

[[dialogue]]
speaker = "聖沙"
# 「って……あれ？　この可愛い表紙のノートって……？」
line = "「って……あれ？　この可愛い表紙のノートって……？」"

[[dialogue]]
speaker = "梨緒"
# 「っ、それは……！」
line = "「っ、それは……！」"

[[dialogue]]
speaker = "unk"
# 梨緒は慌てて駆け寄って、ノートの上に手を置いて押さえる。
line = "梨緒は慌てて駆け寄って、ノートの上に手を置いて押さえる。"

[[dialogue]]
speaker = "梨緒"
# 「こ、これは勉強用ので、表紙が可愛いから使っているだけなんだ」
line = "「こ、これは勉強用ので、表紙が可愛いから使っているだけなんだ」"

[[dialogue]]
speaker = "聖沙"
# 「……ねぇ」
line = "「……ねぇ」"

[[dialogue]]
speaker = "聖沙"
# 「その……私たちの趣味が似てるって前提の上で……直感みたいなものなんだけど……」
line = "「その……私たちの趣味が似てるって前提の上で……直感みたいなものなんだけど……」"

[[dialogue]]
speaker = "聖沙"
# 「それって……もしかして、『ポエムノート』だったりする……？」
line = "「それって……もしかして、『ポエムノート』だったりする……？」"

[[dialogue]]
speaker = "梨緒"
# 「なっ……！　待ってくれ……まさか……」
line = "「なっ……！　待ってくれ……まさか……」"

[[dialogue]]
speaker = "梨緒"
# 「聖沙も……ポエムを書くのか……？」
line = "「聖沙も……ポエムを書くのか……？」"

[[dialogue]]
speaker = "聖沙"
# 「え、ええ……それに、雑誌やラジオのポエムコーナーに、密かに投稿してたり……」
line = "「え、ええ……それに、雑誌やラジオのポエムコーナーに、密かに投稿してたり……」"

[[dialogue]]
speaker = "梨緒"
# 「なん……だと……？」
line = "「なん……だと……？」"

[[dialogue]]
speaker = "聖沙"
# 「それも……一緒？」
line = "「それも……一緒？」"

[[dialogue]]
speaker = "梨緒"
# 「ああ……そうだ」
line = "「ああ……そうだ」"

[[dialogue]]
speaker = "聖沙"
# 「……わ、私ね？　今までポエムが趣味の人って、周りにいなくて……」
line = "「……わ、私ね？　今までポエムが趣味の人って、周りにいなくて……」"

[[dialogue]]
speaker = "梨緒"
# 「私もだ……」
line = "「私もだ……」"

[[dialogue]]
speaker = "聖沙"
# 「だから、今こうして同じ趣味仲間と出会うことができて、閃いちゃったんだけど……」
line = "「だから、今こうして同じ趣味仲間と出会うことができて、閃いちゃったんだけど……」"

[[dialogue]]
speaker = "聖沙"
# 「ポエムで勝負って……どうかしら？」
line = "「ポエムで勝負って……どうかしら？」"

[[dialogue]]
speaker = "梨緒"
# 「……奇遇だな。私も、同じことを考えていた――」
line = "「……奇遇だな。私も、同じことを考えていた――」"

[[dialogue]]
speaker = "unk"
# そうして、２人は初めて、ポエムで勝負をすることになった。
line = "そうして、２人は初めて、ポエムで勝負をすることになった。"

[[dialogue]]
speaker = "聖沙"
# 「じゃ、じゃあ……私から……」
line = "「じゃ、じゃあ……私から……」"

[[dialogue]]
speaker = "梨緒"
# 「あ、ああ……」
line = "「あ、ああ……」"

[[dialogue]]
speaker = "聖沙"
# 「すぅ～……はあぁ～……」
line = "「すぅ～……はあぁ～……」"

[[dialogue]]
speaker = "聖沙"
# 『遠く離れた空の下、同じ星を見上げていた。出会うはずのない光が、いま胸の奥で重なっていく。アナザークルセイダース……<emoji=heart04>』
line = "『遠く離れた空の下、同じ星を見上げていた。出会うはずのない光が、いま胸の奥で重なっていく。アナザークルセイダース……<emoji=heart04>』"

[[dialogue]]
speaker = "梨緒"
# 「……！」
line = "「……！」"

[[dialogue]]
speaker = "梨緒"
# 「コホン……」
line = "「コホン……」"

[[dialogue]]
speaker = "梨緒"
# 『交わらないはずの軌道が、いま重なり合う奇跡。ＡとＢ、違うはずの私たち、２人は隣り合う。アナザースターナイツ……☆』
line = "『交わらないはずの軌道が、いま重なり合う奇跡。ＡとＢ、違うはずの私たち、２人は隣り合う。アナザースターナイツ……☆』"

[[dialogue]]
speaker = "聖沙"
# 「……！　す……」
line = "「……！　す……」"

[[dialogue]]
speaker = "聖沙"
# 「素敵な詩ね、梨緒……♪」
line = "「素敵な詩ね、梨緒……♪」"

[[dialogue]]
speaker = "梨緒"
# 「キミもだ、聖沙……今こそ、確信した」
line = "「キミもだ、聖沙……今こそ、確信した」"

[[dialogue]]
speaker = "聖沙"
# 「ええ、私もよ――」
line = "「ええ、私もよ――」"

[[dialogue]]
speaker = "梨緒"
# 「私たちは……」
line = "「私たちは……」"

[[dialogue]]
speaker = "聖沙"
# 「アナザーステラね<emoji=heart04>」
line = "「アナザーステラね<emoji=heart04>」"

[[dialogue]]
speaker = "梨緒"
# 「ああ――」
line = "「ああ――」"

[[dialogue]]
speaker = "梨緒"
# 「ふっ……ふふっ……」
line = "「ふっ……ふふっ……」"

[[dialogue]]
speaker = "聖沙"
# 「ふふふっ……♪」
line = "「ふふふっ……♪」"

[[dialogue]]
speaker = "unk"
# ――その後。
line = "――その後。"

[[dialogue]]
speaker = "梨緒"
# 『同じ心が、違う言葉で、同じ想いを紡いでいく☆』
line = "『同じ心が、違う言葉で、同じ想いを紡いでいく☆』"

[[dialogue]]
speaker = "聖沙"
# 『響き合う鼓動が新しい言葉を生み出していく<emoji=heart04>』
line = "『響き合う鼓動が新しい言葉を生み出していく<emoji=heart04>』"

[[dialogue]]
speaker = "梨緒"
# 『重なり合う感情が、境界を越えて共鳴して☆』
line = "『重なり合う感情が、境界を越えて共鳴して☆』"

[[dialogue]]
speaker = "聖沙"
# 『２つの光が溶け合って、ひとつの輝きへ変わっていくの<emoji=heart04>』
line = "『２つの光が溶け合って、ひとつの輝きへ変わっていくの<emoji=heart04>』"

[[dialogue]]
speaker = "聖沙"
# 「――すごい<emoji=heart04>　どんどん言葉が溢れてくるわ♪」
line = "「――すごい<emoji=heart04>　どんどん言葉が溢れてくるわ♪」"

[[dialogue]]
speaker = "梨緒"
# 「ああ……！　こんな感覚、初めてだ……！」
line = "「ああ……！　こんな感覚、初めてだ……！」"

[[dialogue]]
speaker = "聖沙"
# 「もっと聞かせて、梨緒<emoji=heart04>」
line = "「もっと聞かせて、梨緒<emoji=heart04>」"

[[dialogue]]
speaker = "梨緒"
# 「キミもだ――聖沙☆」
line = "「キミもだ――聖沙☆」"

[[dialogue]]
speaker = "聖沙"
# 「ふふっ、ふふふっ<emoji=heart04>」
line = "「ふふっ、ふふふっ<emoji=heart04>」"

[[dialogue]]
speaker = "梨緒"
# 「ははっ、はははっ☆」
line = "「ははっ、はははっ☆」"

[[dialogue]]
speaker = "フィオナ"
# 「えっと……これは……」
line = "「えっと……これは……」"

[[dialogue]]
speaker = "アポロ"
# 「お前ら、何してんだ……？」
line = "「お前ら、何してんだ……？」"

[[dialogue]]
speaker = "梨緒"
# 「なっ……フィオナとアポロ！？　どうしてここに！？」
line = "「なっ……フィオナとアポロ！？　どうしてここに！？」"

[[dialogue]]
speaker = "アポロ"
# 「いや、あたしたちも後から部屋に遊びに行くって言ってただろ？」
line = "「いや、あたしたちも後から部屋に遊びに行くって言ってただろ？」"

[[dialogue]]
speaker = "フィオナ"
# 「ご、ごめんなさい！　一応ノックしたんですが、楽しそうな声が聞こえて来てるのに、返事がなくて……」
line = "「ご、ごめんなさい！　一応ノックしたんですが、楽しそうな声が聞こえて来てるのに、返事がなくて……」"

[[dialogue]]
speaker = "アポロ"
# 「で、２人で楽しそうに、何を書いてたんだ？」
line = "「で、２人で楽しそうに、何を書いてたんだ？」"

[[dialogue]]
speaker = "梨緒"
# 「～～っ！　み――」
line = "「～～っ！　み――」"

[[dialogue]]
speaker = "聖沙"
# 「見ないでぇぇぇ～～っ！！！」
line = "「見ないでぇぇぇ～～っ！！！」"

[[dialogue]]
speaker = "unk"
# ２人は仲良く顔を真っ赤にして、叫んでしまうのであった。
line = "２人は仲良く顔を真っ赤にして、叫んでしまうのであった。"
