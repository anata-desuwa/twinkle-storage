[[dialogue]]
speaker = "unk"
# 第３話,エルデリーゼの恋人感謝祭,P
line = "第３話,エルデリーゼの恋人感謝祭,P"

[[dialogue]]
speaker = "エルデリーゼ"
# 「はぁぁ……今日もアイドル様は尊みに溢れていましたわ……心が幸せに満ちていますわ……<emoji=heart04>」
line = "「はぁぁ……今日もアイドル様は尊みに溢れていましたわ……心が幸せに満ちていますわ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# エルゼの推している地下アイドルのライブを一緒に見に行ったその帰り、俺たちはスイーツ店で今日のライブの感想を語り合っていた。
line = "エルゼの推している地下アイドルのライブを一緒に見に行ったその帰り、俺たちはスイーツ店で今日のライブの感想を語り合っていた。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ファンの気持ちを１００％理解っているセットリストでしたの。欲しいタイミングで欲しい曲が来るのは、たまりませんですわ♪」
line = "「ファンの気持ちを１００％理解っているセットリストでしたの。欲しいタイミングで欲しい曲が来るのは、たまりませんですわ♪」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「今日はいつも以上にファンサが多くて、絶対に視線も合ってましたし、指ハートまで作ってもらっちゃいましたわ……<emoji=heart04>」
line = "「今日はいつも以上にファンサが多くて、絶対に視線も合ってましたし、指ハートまで作ってもらっちゃいましたわ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# いつもより目立ってたのかも
line = "いつもより目立ってたのかも"

[[dialogue]]
speaker = "unk"
# エルゼもメイド服だったしね
line = "エルゼもメイド服だったしね"

[[dialogue]]
speaker = "エルデリーゼ"
# 「あっ、なるほどですわ！　嬉しすぎて、昂りがまるで治まりませんの。次のライブも絶対に足を運ばなくては──」
line = "「あっ、なるほどですわ！　嬉しすぎて、昂りがまるで治まりませんの。次のライブも絶対に足を運ばなくては──」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「あっ……申し訳ありません、会長様。せっかくのデートですのに、私ばかり盛り上がってしまって……」
line = "「あっ……申し訳ありません、会長様。せっかくのデートですのに、私ばかり盛り上がってしまって……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「退屈ではありませんでしたか……？」
line = "「退屈ではありませんでしたか……？」"

[[dialogue]]
speaker = "unk"
# 君の喜んでる姿が一番の幸せだから
line = "君の喜んでる姿が一番の幸せだから"

[[dialogue]]
speaker = "unk"
# 同じくらい、俺も楽しんだよ
line = "同じくらい、俺も楽しんだよ"

[[dialogue]]
speaker = "エルデリーゼ"
# 「まあ……会長様はお優しすぎます。こうやって終わった後に感想を言える相手がいるだけでも、私は嬉しすぎてたまりませんのに……」
line = "「まあ……会長様はお優しすぎます。こうやって終わった後に感想を言える相手がいるだけでも、私は嬉しすぎてたまりませんのに……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ですが、施されてばかりでは桜十路家の名が廃ってしまいますの」
line = "「ですが、施されてばかりでは桜十路家の名が廃ってしまいますの」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ギブ・アンド・テイクですわ。私が会長様にして差し上げられることは何かありませんの？」
line = "「ギブ・アンド・テイクですわ。私が会長様にして差し上げられることは何かありませんの？」"

[[dialogue]]
speaker = "unk"
# じゃあ俺にもファンサしてくれる？
line = "じゃあ俺にもファンサしてくれる？"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ファンサ、ですの？」
line = "「ファンサ、ですの？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「私はアイドルではありませんし、会長様は私のファンではなく……大切な……かけがえのない恋人ですわ」
line = "「私はアイドルではありませんし、会長様は私のファンではなく……大切な……かけがえのない恋人ですわ」"

[[dialogue]]
speaker = "unk"
# 俺にとって一番のアイドルはエルゼだから
line = "俺にとって一番のアイドルはエルゼだから"

[[dialogue]]
speaker = "unk"
# それでもお願い
line = "それでもお願い"

[[dialogue]]
speaker = "エルデリーゼ"
# 「はぅんっ<emoji=heart04>　もう、会長様が私を胸キュンさせたらアベコベではありませんの……」
line = "「はぅんっ<emoji=heart04>　もう、会長様が私を胸キュンさせたらアベコベではありませんの……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そんなあなた様だからこそ、私は好きになってしまったのですけど……♪」
line = "「そんなあなた様だからこそ、私は好きになってしまったのですけど……♪」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「わ、わかりましたわ。本職のアイドル様のような胸キュンファンサはできませんけど……」
line = "「わ、わかりましたわ。本職のアイドル様のような胸キュンファンサはできませんけど……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「私が浴びてきたファンサを、会長様にお返ししますわ。受け止めてくださいませ」
line = "「私が浴びてきたファンサを、会長様にお返ししますわ。受け止めてくださいませ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「恥ずかしいですけど……んぅー……ちゅっ<emoji=heart04>　い、いかがでしょう？　投げキッスですわ<emoji=heart04>」
line = "「恥ずかしいですけど……んぅー……ちゅっ<emoji=heart04>　い、いかがでしょう？　投げキッスですわ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# すごく良いけどもう一声！
line = "すごく良いけどもう一声！"

[[dialogue]]
speaker = "エルデリーゼ"
# 「な、投げキッスでは足りませんの？　会長様は欲張りさんですわ。これ以上、何をすれば──」
line = "「な、投げキッスでは足りませんの？　会長様は欲張りさんですわ。これ以上、何をすれば──」"

[[dialogue]]
speaker = "ウェイトレス"
# 「お待たせしましたー。生ホイップもりもりパンケーキとウルトラギガジャンボパフェになりまーす」
line = "「お待たせしましたー。生ホイップもりもりパンケーキとウルトラギガジャンボパフェになりまーす」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ちょうど頼んでいたメニューが届きましたわ。せっかくですから先にいただきましょう」
line = "「ちょうど頼んでいたメニューが届きましたわ。せっかくですから先にいただきましょう」"

[[dialogue]]
speaker = "unk"
# スイーツでファンサしてもらおうかな
line = "スイーツでファンサしてもらおうかな"

[[dialogue]]
speaker = "エルデリーゼ"
# 「えっ……では、お写真を──申し訳ありません、ウェイトレス様。私と会長様を一緒に撮っていただけますか？」
line = "「えっ……では、お写真を──申し訳ありません、ウェイトレス様。私と会長様を一緒に撮っていただけますか？」"

[[dialogue]]
speaker = "ウェイトレス"
# 「いいですよー。それじゃ、もっと近づいて、肩を寄せてくださいねー」
line = "「いいですよー。それじゃ、もっと近づいて、肩を寄せてくださいねー」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「会長様、右手をこう……ハートの半分にできますか？　私もこう、手を添えて──」
line = "「会長様、右手をこう……ハートの半分にできますか？　私もこう、手を添えて──」"

[[dialogue]]
speaker = "ウェイトレス"
# 「あー、いいですねー。上手にハートが作れてますよー。はい、チーズ！」
line = "「あー、いいですねー。上手にハートが作れてますよー。はい、チーズ！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ふふ、いかがですか、会長様。ラブラブ手ハートですわ♪　こちらの画像は後ほどお送りしますわね」
line = "「ふふ、いかがですか、会長様。ラブラブ手ハートですわ♪　こちらの画像は後ほどお送りしますわね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「え？　会長様からもファンサを？　何をしてくださるのでしょう？」
line = "「え？　会長様からもファンサを？　何をしてくださるのでしょう？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「食べさせてくださいますの……？　周りの皆様がこちらを見てます……少し恥ずかしいですわ……」
line = "「食べさせてくださいますの……？　周りの皆様がこちらを見てます……少し恥ずかしいですわ……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「では、そちらのパンケーキをいただきますわ……あーん……か、会長様、ちょっと大きくないですの……？　ぱくっ」
line = "「では、そちらのパンケーキをいただきますわ……あーん……か、会長様、ちょっと大きくないですの……？　ぱくっ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「むぐむぐ……はぅうん……クリームたっぷり……ふわふわのしゅわしゅわでお口の中で溶けるパンケーキですわ」
line = "「むぐむぐ……はぅうん……クリームたっぷり……ふわふわのしゅわしゅわでお口の中で溶けるパンケーキですわ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「いつもより美味しく感じるのは、きっと会長様の『あーん』のおかげですわね<emoji=heart04>」
line = "「いつもより美味しく感じるのは、きっと会長様の『あーん』のおかげですわね<emoji=heart04>」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「では、今度は私から……会長様、お口を開けてくださいませ♪」
line = "「では、今度は私から……会長様、お口を開けてくださいませ♪」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「まあ、大きなお口。私の指まで食べられてしまいそうですわ。はい、あーん♪」
line = "「まあ、大きなお口。私の指まで食べられてしまいそうですわ。はい、あーん♪」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ぱくっ♪　ふふ、お上手お上手……あら？　お鼻にクリームがついてしまいましたわね」
line = "「ぱくっ♪　ふふ、お上手お上手……あら？　お鼻にクリームがついてしまいましたわね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「会長様、クリームを取りますので、動かないでくださいませ」
line = "「会長様、クリームを取りますので、動かないでくださいませ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ちょいちょいっと……はい、綺麗になりましたわ。お鼻についてたクリームは……舐め取ってしまいますわね」
line = "「ちょいちょいっと……はい、綺麗になりましたわ。お鼻についてたクリームは……舐め取ってしまいますわね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ぺろっ、ちゅ、ちゅぱっ……ふふ、会長様のクリーム、甘ぁくて美味しいですわ♪　もっとぺろぺろしたくなってしまいますの♪」
line = "「ぺろっ、ちゅ、ちゅぱっ……ふふ、会長様のクリーム、甘ぁくて美味しいですわ♪　もっとぺろぺろしたくなってしまいますの♪」"

[[dialogue]]
speaker = "unk"
# このくらいにしておこうか！
line = "このくらいにしておこうか！"

[[dialogue]]
speaker = "unk"
# ストップストーップ！
line = "ストップストーップ！"

[[dialogue]]
speaker = "エルデリーゼ"
# 「あら、私、まだ会長様へのファンサし足りませんわ。やっと乗ってきたところですのに」
line = "「あら、私、まだ会長様へのファンサし足りませんわ。やっと乗ってきたところですのに」"

[[dialogue]]
speaker = "unk"
# すっかり注目の的だ。これ以上はふたりきりの場所じゃないとマズい。
line = "すっかり注目の的だ。これ以上はふたりきりの場所じゃないとマズい。"

[[dialogue]]
speaker = "unk"
# ますますエスカレートしてしまいそうなエルゼのファンサに『待った』をかけたのだった。
line = "ますますエスカレートしてしまいそうなエルゼのファンサに『待った』をかけたのだった。"
