[[dialogue]]
speaker = "unk"
# 第３話,会長ＶＳ副会長インサマー,P
line = "第３話,会長ＶＳ副会長インサマー,P"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩が水着戦闘服に慣れるため、リゾート結界で模擬戦をすることになった。そして、その相手は──
line = "シルヴィ先輩が水着戦闘服に慣れるため、リゾート結界で模擬戦をすることになった。そして、その相手は──"

[[dialogue]]
speaker = "サーシャ"
# 「シルヴィと戦うなんていつ以来かしら。本当に久しぶりね～」
line = "「シルヴィと戦うなんていつ以来かしら。本当に久しぶりね～」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしも覚えてないや。あははっ、ウズウズしてきたー！」
line = "「あたしも覚えてないや。あははっ、ウズウズしてきたー！」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩が星徒会副会長だった時の会長であり、先んじて水着フォームを手に入れているサーシャさんだ。
line = "シルヴィ先輩が星徒会副会長だった時の会長であり、先んじて水着フォームを手に入れているサーシャさんだ。"

[[dialogue]]
speaker = "セーラ"
# 「会長さんはシルヴィの付き添い？　彼氏も大変だねぇ」
line = "「会長さんはシルヴィの付き添い？　彼氏も大変だねぇ」"

[[dialogue]]
speaker = "セーラ"
# 「え、うち？　うちは野次馬かな。２人が模擬戦やるって聞いて見に来ただけ」
line = "「え、うち？　うちは野次馬かな。２人が模擬戦やるって聞いて見に来ただけ」"

[[dialogue]]
speaker = "シルヴィ"
# 「会長くーん！　いいとこ見せてあげるから、見逃さないでねー！」
line = "「会長くーん！　いいとこ見せてあげるから、見逃さないでねー！」"

[[dialogue]]
speaker = "サーシャ"
# 「あらあら～、自分が負けるところ、会長くんに見られちゃうわよ～？」
line = "「あらあら～、自分が負けるところ、会長くんに見られちゃうわよ～？」"

[[dialogue]]
speaker = "シルヴィ"
# 「負ーけーまーせーん。サーシャこそ、お隣の星徒会にかっこ悪いとこ見られないようにね！」
line = "「負ーけーまーせーん。サーシャこそ、お隣の星徒会にかっこ悪いとこ見られないようにね！」"

[[dialogue]]
speaker = "サーシャ"
# 「うふふっ、言われるまでもないわ～」
line = "「うふふっ、言われるまでもないわ～」"

[[dialogue]]
speaker = "シルヴィ"
# 「ふっふっふ。今日のあたしは自信あるからね！」
line = "「ふっふっふ。今日のあたしは自信あるからね！」"

[[dialogue]]
speaker = "サーシャ"
# 「ふぅん？　理由を聞かせてもらおうかしら？」
line = "「ふぅん？　理由を聞かせてもらおうかしら？」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしの水着戦闘服はこの間、手に入れたばかり。まだサーシャと一緒に戦ったことないし、あたしの水着の戦い方をサーシャは知らないはず！」
line = "「あたしの水着戦闘服はこの間、手に入れたばかり。まだサーシャと一緒に戦ったことないし、あたしの水着の戦い方をサーシャは知らないはず！」"

[[dialogue]]
speaker = "サーシャ"
# 「なるほど～、私は手の内が知れてる分だけ不利ということね」
line = "「なるほど～、私は手の内が知れてる分だけ不利ということね」"

[[dialogue]]
speaker = "サーシャ"
# 「……って、あれ？　私、シルヴィと一緒に水着で戦ったことあったかしら～？」
line = "「……って、あれ？　私、シルヴィと一緒に水着で戦ったことあったかしら～？」"

[[dialogue]]
speaker = "シルヴィ"
# 「そうだった～～～～！？　あたしも水着のサーシャの戦い方わかんないや！」
line = "「そうだった～～～～！？　あたしも水着のサーシャの戦い方わかんないや！」"

[[dialogue]]
speaker = "サーシャ"
# 「うふふ。相変わらず詰めが甘いわね、シルヴィ。じゃあ使い込んでる分、私の方が有利ね～」
line = "「うふふ。相変わらず詰めが甘いわね、シルヴィ。じゃあ使い込んでる分、私の方が有利ね～」"

[[dialogue]]
speaker = "シルヴィ"
# 「うぅ……でも負けないもん！」
line = "「うぅ……でも負けないもん！」"

[[dialogue]]
speaker = "セーラ"
# 「あははっ、子どもか。やっぱシルヴィってノリで生きてるわ～」
line = "「あははっ、子どもか。やっぱシルヴィってノリで生きてるわ～」"

[[dialogue]]
speaker = "unk"
# セーラさんとシルヴィ先輩って仲いいんですか？
line = "セーラさんとシルヴィ先輩って仲いいんですか？"

[[dialogue]]
speaker = "セーラ"
# 「まぁノリが合うからね～。シルヴィが星徒会だった頃も、現場で会ったことあったし」
line = "「まぁノリが合うからね～。シルヴィが星徒会だった頃も、現場で会ったことあったし」"

[[dialogue]]
speaker = "セーラ"
# 「あっ、そろそろ始まりそ」
line = "「あっ、そろそろ始まりそ」"

[[dialogue]]
speaker = "シルヴィ"
# 「よっしゃー、行くよ！」
line = "「よっしゃー、行くよ！」"

[[dialogue]]
speaker = "サーシャ"
# 「かかって来なさい！」
line = "「かかって来なさい！」"

[[dialogue]]
speaker = "unk"
# ２人の星術がぶつかり合い、大きく波が立つ。
line = "２人の星術がぶつかり合い、大きく波が立つ。"

[[dialogue]]
speaker = "サーシャ"
# 「ここのところフライドチキンばっかりだったから、カロリー消費に付き合ってもらうわ～！　ナイトレイドハグ！」
line = "「ここのところフライドチキンばっかりだったから、カロリー消費に付き合ってもらうわ～！　ナイトレイドハグ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「くっ……お返し！　ディープペネトレイター！」
line = "「くっ……お返し！　ディープペネトレイター！」"

[[dialogue]]
speaker = "シルヴィ"
# 「よし！　手応えあり……ってシャチのフロート！？」
line = "「よし！　手応えあり……ってシャチのフロート！？」"

[[dialogue]]
speaker = "サーシャ"
# 「隙あり～。シャドウストローク！」
line = "「隙あり～。シャドウストローク！」"

[[dialogue]]
speaker = "シルヴィ"
# 「海の中から！？　うぎゃぁーーー！」
line = "「海の中から！？　うぎゃぁーーー！」"

[[dialogue]]
speaker = "サーシャ"
# 「ふふっ、どうかしら。やっぱり水着戦闘服なら私の方が先輩ね♪」
line = "「ふふっ、どうかしら。やっぱり水着戦闘服なら私の方が先輩ね♪」"

[[dialogue]]
speaker = "シルヴィ"
# 「むぅ……さすがサーシャ。でも、負けないったら負けないんだから！　この妖怪『誰にでもお姉ちゃん』め！」
line = "「むぅ……さすがサーシャ。でも、負けないったら負けないんだから！　この妖怪『誰にでもお姉ちゃん』め！」"

[[dialogue]]
speaker = "サーシャ"
# 「…………はい？」
line = "「…………はい？」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしが天界から戻ってきたら、誰にでも姉ぶりたがる不審者になっててびっくりしたよね。元からその気はあったけど、酷くなってたし」
line = "「あたしが天界から戻ってきたら、誰にでも姉ぶりたがる不審者になっててびっくりしたよね。元からその気はあったけど、酷くなってたし」"

[[dialogue]]
speaker = "シルヴィ"
# 「ソフィアちゃんと離れてるから寂しいのかなと思ってたけど、ソフィアちゃんも流星市国に来てるのにこれなんだから、こいつ根っからなんだなって！」
line = "「ソフィアちゃんと離れてるから寂しいのかなと思ってたけど、ソフィアちゃんも流星市国に来てるのにこれなんだから、こいつ根っからなんだなって！」"

[[dialogue]]
speaker = "サーシャ"
# 「えぇ～～～っ！？　シルヴィ、そんな風に思ってたの！？」
line = "「えぇ～～～っ！？　シルヴィ、そんな風に思ってたの！？」"

[[dialogue]]
speaker = "セーラ"
# 「ぷっ、あはははははっ！　身も蓋もなさすぎ～！」
line = "「ぷっ、あはははははっ！　身も蓋もなさすぎ～！」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩はサーシャさんには一切遠慮がない。傍から見ていて冷や冷やするときもあるくらいだ。
line = "シルヴィ先輩はサーシャさんには一切遠慮がない。傍から見ていて冷や冷やするときもあるくらいだ。"

[[dialogue]]
speaker = "サーシャ"
# 「シルヴィこそ、フライドチキンジャンキーのくせにぃ～～～～！」
line = "「シルヴィこそ、フライドチキンジャンキーのくせにぃ～～～～！」"

[[dialogue]]
speaker = "サーシャ"
# 「ふぅ……いいわ、じゃあこうしましょう。私が勝ったら、シルヴィは私のことをお姉ちゃんと呼びなさい。１週間くらい！」
line = "「ふぅ……いいわ、じゃあこうしましょう。私が勝ったら、シルヴィは私のことをお姉ちゃんと呼びなさい。１週間くらい！」"

[[dialogue]]
speaker = "シルヴィ"
# 「マジで開き直ったね、サーシャ！　じゃあ、あたしが勝ったらサーシャの奢りでフライドチキン食べ放題、１週間ね！」
line = "「マジで開き直ったね、サーシャ！　じゃあ、あたしが勝ったらサーシャの奢りでフライドチキン食べ放題、１週間ね！」"

[[dialogue]]
speaker = "サーシャ"
# 「はぁぁぁぁ──！」
line = "「はぁぁぁぁ──！」"

[[dialogue]]
speaker = "シルヴィ"
# 「うおぉぉぉっ！」
line = "「うおぉぉぉっ！」"

[[dialogue]]
speaker = "unk"
# 両者ともに星力が高まる。次が決着の一撃となるだろう。
line = "両者ともに星力が高まる。次が決着の一撃となるだろう。"

[[dialogue]]
speaker = "サーシャ"
# 「シャドウストロークっ！！」
line = "「シャドウストロークっ！！」"

[[dialogue]]
speaker = "シルヴィ"
# 「スクリューウェーブジャベリンっ！！」
line = "「スクリューウェーブジャベリンっ！！」"

[[dialogue]]
speaker = "サーシャ"
# 「きゃああぁぁぁっ！」
line = "「きゃああぁぁぁっ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「うわあぁぁぁぁっ！」
line = "「うわあぁぁぁぁっ！」"

[[dialogue]]
speaker = "unk"
# 星力が激しく激突し、爆発。２人ともそろって吹っ飛ばされるのだった。
line = "星力が激しく激突し、爆発。２人ともそろって吹っ飛ばされるのだった。"

[[dialogue]]
speaker = "蛍火"
# 「お疲れ様です。おふたりが模擬戦をしていると聞いて、差し入れを持ってきたのですが…………サーシャ先輩とシルヴィ先輩は？」
line = "「お疲れ様です。おふたりが模擬戦をしていると聞いて、差し入れを持ってきたのですが…………サーシャ先輩とシルヴィ先輩は？」"

[[dialogue]]
speaker = "セーラ"
# 「仲良く砂浜に打ち上げられてるよ～」
line = "「仲良く砂浜に打ち上げられてるよ～」"

[[dialogue]]
speaker = "蛍火"
# 「……またですか」
line = "「……またですか」"

[[dialogue]]
speaker = "unk"
# またなの？
line = "またなの？"

[[dialogue]]
speaker = "蛍火"
# 「はい。サーシャ先輩とシルヴィ先輩が模擬戦をすると、だいたいこうなりますね。途中で子どものようなケンカに発展することもしばしばです」
line = "「はい。サーシャ先輩とシルヴィ先輩が模擬戦をすると、だいたいこうなりますね。途中で子どものようなケンカに発展することもしばしばです」"

[[dialogue]]
speaker = "セーラ"
# 「ケンカするほど仲がいいってことかなー？　見てる分にはおもしろいよね～」
line = "「ケンカするほど仲がいいってことかなー？　見てる分にはおもしろいよね～」"

[[dialogue]]
speaker = "蛍火"
# 「それはまぁ…………はい」
line = "「それはまぁ…………はい」"

[[dialogue]]
speaker = "サーシャ"
# 「…………ぷっ」
line = "「…………ぷっ」"

[[dialogue]]
speaker = "シルヴィ"
# 「…………ふふっ、んふっ」
line = "「…………ふふっ、んふっ」"

[[dialogue]]
speaker = "２人"
# 「あはははははははははっ！！」
line = "「あはははははははははっ！！」"

[[dialogue]]
speaker = "シルヴィ"
# 「あー、楽しかった。またやろうね！」
line = "「あー、楽しかった。またやろうね！」"

[[dialogue]]
speaker = "サーシャ"
# 「ええ、次こそ私が勝ってお姉ちゃんになってみせるわ～」
line = "「ええ、次こそ私が勝ってお姉ちゃんになってみせるわ～」"

[[dialogue]]
speaker = "シルヴィ"
# 「へへっ、妖怪め～」
line = "「へへっ、妖怪め～」"

[[dialogue]]
speaker = "unk"
# 一週間後、丸い焼き菓子の呼び名をめぐって激突することになるのだが、それはまた別の話──
line = "一週間後、丸い焼き菓子の呼び名をめぐって激突することになるのだが、それはまた別の話──"
