[[dialogue]]
speaker = "unk"
# 第１話,『守護天使会議』,B
line = "第１話,『守護天使会議』,B"

[[dialogue]]
speaker = "オオヒメ"
# 「皆、招集に応じてよくぞ集まってくれた。此度の会合の場を用意してくださった九浄ヘレナ殿にも感謝を」
line = "「皆、招集に応じてよくぞ集まってくれた。此度の会合の場を用意してくださった九浄ヘレナ殿にも感謝を」"

[[dialogue]]
speaker = "ヘレナ"
# 「お安い御用だ。守護天使の方々の重要な会談ともなれば、相応の場を用意する必要があるだろうからな」
line = "「お安い御用だ。守護天使の方々の重要な会談ともなれば、相応の場を用意する必要があるだろうからな」"

[[dialogue]]
speaker = "ヘレナ"
# 「九浄の屋敷内であれば、盗み聞きされる恐れもない。存分に話し合われるが良かろう」
line = "「九浄の屋敷内であれば、盗み聞きされる恐れもない。存分に話し合われるが良かろう」"

[[dialogue]]
speaker = "マグダレナ"
# 「ありがとうございます。では、始めましょうか……守護天使会議を」
line = "「ありがとうございます。では、始めましょうか……守護天使会議を」"

[[dialogue]]
speaker = "unk"
# 女神を補佐する上位の天使であり、世界の摂理を司る存在。
line = "女神を補佐する上位の天使であり、世界の摂理を司る存在。"

[[dialogue]]
speaker = "unk"
# 《境界》のマグダレナ、《命脈》のアルモタヘル、《万成》のセシア──
line = "《境界》のマグダレナ、《命脈》のアルモタヘル、《万成》のセシア──"

[[dialogue]]
speaker = "unk"
# 《試練》のパテル、《天恵》のオオヒメ、そして《円環》のラクシャ──
line = "《試練》のパテル、《天恵》のオオヒメ、そして《円環》のラクシャ──"

[[dialogue]]
speaker = "unk"
# この６柱こそが、現在のアルタイルを守る守護天使だ。
line = "この６柱こそが、現在のアルタイルを守る守護天使だ。"

[[dialogue]]
speaker = "unk"
# ちなみに、現在の『デネブの守護天使』たちは消耗が激しく、現在もコアの状態のまま、デネブのフィーニスの塔で療養している。
line = "ちなみに、現在の『デネブの守護天使』たちは消耗が激しく、現在もコアの状態のまま、デネブのフィーニスの塔で療養している。"

[[dialogue]]
speaker = "unk"
# コアの状態でも摂理の維持は可能だが、守護天使として再び万全の状態で活動するには、数年の時間を要する。
line = "コアの状態でも摂理の維持は可能だが、守護天使として再び万全の状態で活動するには、数年の時間を要する。"

[[dialogue]]
speaker = "オオヒメ"
# 「まず先だって皆に周知しておきたいことがある。それはラクシャについてだ」
line = "「まず先だって皆に周知しておきたいことがある。それはラクシャについてだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「担当する世界の配置換えの話、だよね？」
line = "「担当する世界の配置換えの話、だよね？」"

[[dialogue]]
speaker = "オオヒメ"
# 「ああ。すでに知っている者も多いだろうが、全体での告知はしておきたい」
line = "「ああ。すでに知っている者も多いだろうが、全体での告知はしておきたい」"

[[dialogue]]
speaker = "ラクシャ"
# 「りょーかい！」
line = "「りょーかい！」"

[[dialogue]]
speaker = "ラクシャ"
# 「ここにいるみんなは知っての通り、ここにいるボクは、元々デネブのラクシャだ」
line = "「ここにいるみんなは知っての通り、ここにいるボクは、元々デネブのラクシャだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「魔王とバイト仲間である市倉環の正体は、『デネブのラクシャだったボク』で、アルタイルのラクシャは魔王との縁は薄い」
line = "「魔王とバイト仲間である市倉環の正体は、『デネブのラクシャだったボク』で、アルタイルのラクシャは魔王との縁は薄い」"

[[dialogue]]
speaker = "ラクシャ"
# 「生き残った魔王──緋宮クロトはアルタイルの所属だし、今後もアルタイルを中心に活動することになる」
line = "「生き残った魔王──緋宮クロトはアルタイルの所属だし、今後もアルタイルを中心に活動することになる」"

[[dialogue]]
speaker = "ラクシャ"
# 「だから、今後の連携も考えて、『デネブのラクシャだったボク』こと市倉環が、これからはアルタイルを担当することにしたよ」
line = "「だから、今後の連携も考えて、『デネブのラクシャだったボク』こと市倉環が、これからはアルタイルを担当することにしたよ」"

[[dialogue]]
speaker = "セシア"
# 「『元アルタイルのラクシャ』は、もうデネブにいるのかしら？」
line = "「『元アルタイルのラクシャ』は、もうデネブにいるのかしら？」"

[[dialogue]]
speaker = "ラクシャ"
# 「そうだね。彼女もまだ消耗していたから、他のデネブの守護天使と同じように、フィーニスの塔で療養してもらってるよ」
line = "「そうだね。彼女もまだ消耗していたから、他のデネブの守護天使と同じように、フィーニスの塔で療養してもらってるよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「制御する摂理の管理権も交換済みだ。だからもう、今はボクが『アルタイルのラクシャ』になってるよ」
line = "「制御する摂理の管理権も交換済みだ。だからもう、今はボクが『アルタイルのラクシャ』になってるよ」"

[[dialogue]]
speaker = "セシア"
# 「ちょっとややこしいわね。今後は向こうのラクシャと呼び分ける時は、わたくしたちも『市倉環』と呼ぶべきかしら？」
line = "「ちょっとややこしいわね。今後は向こうのラクシャと呼び分ける時は、わたくしたちも『市倉環』と呼ぶべきかしら？」"

[[dialogue]]
speaker = "ラクシャ"
# 「その辺はお任せするよ。まあ、よほどの大事件でもなければ、２世界の守護天使がそろい踏みになることもないだろうけど」
line = "「その辺はお任せするよ。まあ、よほどの大事件でもなければ、２世界の守護天使がそろい踏みになることもないだろうけど」"

[[dialogue]]
speaker = "オオヒメ"
# 「他の者も、異論や懸念はないだろうか？」
line = "「他の者も、異論や懸念はないだろうか？」"

[[dialogue]]
speaker = "マグダレナ"
# 「はい。問題ございません」
line = "「はい。問題ございません」"

[[dialogue]]
speaker = "unk"
# マグダレナの言葉に、アルモタヘルもパテルもうなずいて見せた。
line = "マグダレナの言葉に、アルモタヘルもパテルもうなずいて見せた。"

[[dialogue]]
speaker = "オオヒメ"
# 「では本日をもって正式に、彼女を『アルタイルのラクシャ』として迎えることにする」
line = "「では本日をもって正式に、彼女を『アルタイルのラクシャ』として迎えることにする」"

[[dialogue]]
speaker = "マグダレナ"
# 「ふふ……何だか不思議な感じですけど、これからもよろしくお願いしますね」
line = "「ふふ……何だか不思議な感じですけど、これからもよろしくお願いしますね」"

[[dialogue]]
speaker = "ラクシャ"
# 「こちらこそ、あらためてよろしくー♪」
line = "「こちらこそ、あらためてよろしくー♪」"

[[dialogue]]
speaker = "オオヒメ"
# 「さて、本題はここからなのだが──」
line = "「さて、本題はここからなのだが──」"

[[dialogue]]
speaker = "オオヒメ"
# 「皆も知っての通り、先日の『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』との戦いを通じて、永きに渡るリクリエとの戦いに決着がついた」
line = "「皆も知っての通り、先日の『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』との戦いを通じて、永きに渡るリクリエとの戦いに決着がついた」"

[[dialogue]]
speaker = "オオヒメ"
# 「しかし、払った犠牲も大きかった。我々の主である女神テルル様も、戦いの中で亡くなられてしまったが……」
line = "「しかし、払った犠牲も大きかった。我々の主である女神テルル様も、戦いの中で亡くなられてしまったが……」"

[[dialogue]]
speaker = "オオヒメ"
# 「テルル様は最後に、次代の女神であるルヴィネ様へ全てを託し、その役目を継承してくださった。その時に──」
line = "「テルル様は最後に、次代の女神であるルヴィネ様へ全てを託し、その役目を継承してくださった。その時に──」"

[[dialogue]]
speaker = "セシア"
# 「わたくしたちと女神様の関係も一緒に移譲されているということね？」
line = "「わたくしたちと女神様の関係も一緒に移譲されているということね？」"

[[dialogue]]
speaker = "アルモタヘル"
# 「うむ……しかしそれについては我も、ここにいる皆もテルル様が亡くなる直前に送られた思念を受け取り知っているが？」
line = "「うむ……しかしそれについては我も、ここにいる皆もテルル様が亡くなる直前に送られた思念を受け取り知っているが？」"

[[dialogue]]
speaker = "オオヒメ"
# 「そう……既に新たに女神となられるルヴィネ様と、私たちの間には主従の関係が結ばれている」
line = "「そう……既に新たに女神となられるルヴィネ様と、私たちの間には主従の関係が結ばれている」"

[[dialogue]]
speaker = "オオヒメ"
# 「しかし私たちがより力を発揮するためには、強固な繋がりをルヴィネ様との間に作っておく必要があるだろう」
line = "「しかし私たちがより力を発揮するためには、強固な繋がりをルヴィネ様との間に作っておく必要があるだろう」"

[[dialogue]]
speaker = "オオヒメ"
# 「その為にも皆にはルヴィネ様と、１対１であらためて契約を結び直してもらいたい」
line = "「その為にも皆にはルヴィネ様と、１対１であらためて契約を結び直してもらいたい」"

[[dialogue]]
speaker = "マグダレナ"
# 「そういうことでしたか……」
line = "「そういうことでしたか……」"

[[dialogue]]
speaker = "マグダレナ"
# 「私は異存ありませんよ。関係性を明らかにし、私たちの意思を明確に示しておいた方が、ルヴィネ様の心も安らぐことでしょう」
line = "「私は異存ありませんよ。関係性を明らかにし、私たちの意思を明確に示しておいた方が、ルヴィネ様の心も安らぐことでしょう」"

[[dialogue]]
speaker = "オオヒメ"
# 「他の皆も異存はないだろうか？」
line = "「他の皆も異存はないだろうか？」"

[[dialogue]]
speaker = "unk"
# オオヒメの言葉に守護天使たち全員が頷く。
line = "オオヒメの言葉に守護天使たち全員が頷く。"

[[dialogue]]
speaker = "オオヒメ"
# 「では、決まりだな」
line = "「では、決まりだな」"

[[dialogue]]
speaker = "オオヒメ"
# 「ルヴィネ様は現在デネブに戻られているが、今後も定期的にアルタイルにいらっしゃるそうだ。その際に契約を結んでくれ」
line = "「ルヴィネ様は現在デネブに戻られているが、今後も定期的にアルタイルにいらっしゃるそうだ。その際に契約を結んでくれ」"

[[dialogue]]
speaker = "ラクシャ"
# 「タイミングは各々に任せる感じ？」
line = "「タイミングは各々に任せる感じ？」"

[[dialogue]]
speaker = "オオヒメ"
# 「全体で事務的に更新するよりも、各々が１対１でルヴィネ様と話し、改めて契約を結ぶ方がいいだろう。よって、タイミングは各々に任せたい」
line = "「全体で事務的に更新するよりも、各々が１対１でルヴィネ様と話し、改めて契約を結ぶ方がいいだろう。よって、タイミングは各々に任せたい」"

[[dialogue]]
speaker = "オオヒメ"
# 「とはいえ、タイミングを気にするとは。ラクシャは何か懸念があるのか？」
line = "「とはいえ、タイミングを気にするとは。ラクシャは何か懸念があるのか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「ボク、あの戦いで消耗しすぎちゃってさ。新しい契約を交わすにしても、その傷が癒えてからにしたいんだよね」
line = "「ボク、あの戦いで消耗しすぎちゃってさ。新しい契約を交わすにしても、その傷が癒えてからにしたいんだよね」"

[[dialogue]]
speaker = "マグダレナ"
# 「大丈夫なのですか？」
line = "「大丈夫なのですか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「ふふ、そんな心配そうな顔をしなくてもいいよ。復調にそれほど時間はかからないと思うからさ」
line = "「ふふ、そんな心配そうな顔をしなくてもいいよ。復調にそれほど時間はかからないと思うからさ」"

[[dialogue]]
speaker = "オオヒメ"
# 「承知した。タイミングは任せるので、ラクシャは十分回復してからルヴィネ様に声をかけてくれ」
line = "「承知した。タイミングは任せるので、ラクシャは十分回復してからルヴィネ様に声をかけてくれ」"

[[dialogue]]
speaker = "オオヒメ"
# 「では他の皆も、宜しく頼んだぞ」
line = "「では他の皆も、宜しく頼んだぞ」"

[[dialogue]]
speaker = "unk"
# 世界は変化しつつある。
line = "世界は変化しつつある。"

[[dialogue]]
speaker = "unk"
# 永きに渡り人々を脅かしていたリクリエの脅威は、『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』の打倒により消え去った。
line = "永きに渡り人々を脅かしていたリクリエの脅威は、『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』の打倒により消え去った。"

[[dialogue]]
speaker = "unk"
# 世界中の人々の信仰の対象であった女神は失われたが、彼女の想いを託された次代の女神が誕生する。
line = "世界中の人々の信仰の対象であった女神は失われたが、彼女の想いを託された次代の女神が誕生する。"

[[dialogue]]
speaker = "unk"
# 希望に満ちた時代──
line = "希望に満ちた時代──"

[[dialogue]]
speaker = "unk"
# 多くの犠牲の上に掴み取られたこの平和が失われないように──
line = "多くの犠牲の上に掴み取られたこの平和が失われないように──"

[[dialogue]]
speaker = "unk"
# 世界の摂理を守る６柱の守護天使たちは、新たな時代を護るべく決意を固めるのだった。
line = "世界の摂理を守る６柱の守護天使たちは、新たな時代を護るべく決意を固めるのだった。"
