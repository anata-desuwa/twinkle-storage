[[dialogue]]
speaker = "unk"
# 第３話,使徒の目的,B
line = "第３話,使徒の目的,B"

[[dialogue]]
speaker = "ナターシャ"
# 「──ストリクス・エッジ！！」
line = "「──ストリクス・エッジ！！」"

[[dialogue]]
speaker = "ジグ"
# 「踏み込みが甘いね。君、暗殺者だろう？　不意打ち、奇襲が本領のはずだ。下がっていた方がいいんじゃないかな？」
line = "「踏み込みが甘いね。君、暗殺者だろう？　不意打ち、奇襲が本領のはずだ。下がっていた方がいいんじゃないかな？」"

[[dialogue]]
speaker = "ナターシャ"
# 「本音を言うならそうしたいけどね──」
line = "「本音を言うならそうしたいけどね──」"

[[dialogue]]
speaker = "ナターシャ"
# （……使徒ジグのシャドウ、本物よりずっと動きは鈍い。けれど……！）
line = "（……使徒ジグのシャドウ、本物よりずっと動きは鈍い。けれど……！）"

[[dialogue]]
speaker = "unk"
# 前回の戦いで傍にいた、緋宮クロト率いる新星星徒会や、選挙管理委員会の仲間がいない。
line = "前回の戦いで傍にいた、緋宮クロト率いる新星星徒会や、選挙管理委員会の仲間がいない。"

[[dialogue]]
speaker = "unk"
# 大規模な天界襲撃の直後の、人員の足りない天使たちだけで、この手練れが倒せるのか──
line = "大規模な天界襲撃の直後の、人員の足りない天使たちだけで、この手練れが倒せるのか──"

[[dialogue]]
speaker = "ケイティ"
# 「メルエルちゃん！　タイミングを合わせて！」
line = "「メルエルちゃん！　タイミングを合わせて！」"

[[dialogue]]
speaker = "メルエル"
# 「うんっ──ケイティお姉ちゃん！　はぁぁあああっ！！」
line = "「うんっ──ケイティお姉ちゃん！　はぁぁあああっ！！」"

[[dialogue]]
speaker = "ジグ"
# 「魔王の血統も、血が薄い──リクリエの力を制御した緋宮クロトの足元にも及ばない。けれど……」
line = "「魔王の血統も、血が薄い──リクリエの力を制御した緋宮クロトの足元にも及ばない。けれど……」"

[[dialogue]]
speaker = "ケイティ"
# 「砕けなさい──双鉄塊！！」
line = "「砕けなさい──双鉄塊！！」"

[[dialogue]]
speaker = "ジグ"
# 「……君は賞賛に値するね。流石は聖庭園が擁する衛兵隊長だ」
line = "「……君は賞賛に値するね。流石は聖庭園が擁する衛兵隊長だ」"

[[dialogue]]
speaker = "ジグ"
# 「受けた剣ごと、腕まで折れてしまいそうだったよ──はははっ！」
line = "「受けた剣ごと、腕まで折れてしまいそうだったよ──はははっ！」"

[[dialogue]]
speaker = "ケイティ"
# （只者ではありませんね、この『影』……！　武器ごと本体を叩き潰すつもりだったのに……いなされた！！）
line = "（只者ではありませんね、この『影』……！　武器ごと本体を叩き潰すつもりだったのに……いなされた！！）"

[[dialogue]]
speaker = "unk"
# ナターシャから伝え聞いた、使徒ジグの能力──『天機の星眼』。
line = "ナターシャから伝え聞いた、使徒ジグの能力──『天機の星眼』。"

[[dialogue]]
speaker = "unk"
# 対象の持つ可能性を明らかにする未来視。いかなる剛力を持った一撃も、太刀筋が全て筒抜けであれば、致命の一撃を奪うことは困難だ。
line = "対象の持つ可能性を明らかにする未来視。いかなる剛力を持った一撃も、太刀筋が全て筒抜けであれば、致命の一撃を奪うことは困難だ。"

[[dialogue]]
speaker = "ジグ"
# 「あまり遊んでばかりもいられないのでね──行け、極星従騎！」
line = "「あまり遊んでばかりもいられないのでね──行け、極星従騎！」"

[[dialogue]]
speaker = "スレイプニル"
# 「──ヒヒィィインンッ！！」
line = "「──ヒヒィィインンッ！！」"

[[dialogue]]
speaker = "ケイティ"
# 「くっ……衛兵隊！　各個撃破します！　続きなさい！！」
line = "「くっ……衛兵隊！　各個撃破します！　続きなさい！！」"

[[dialogue]]
speaker = "ジグ"
# 「さてと。馬鹿力の天使はこれでしばらくおとなしくなるだろう」
line = "「さてと。馬鹿力の天使はこれでしばらくおとなしくなるだろう」"

[[dialogue]]
speaker = "ジグ"
# 「脅威が少ないとはいえ、魔王の血統は不確定要素が多すぎる──変身できなくなるくらいに、痛めつけさせてもらおうかな？」
line = "「脅威が少ないとはいえ、魔王の血統は不確定要素が多すぎる──変身できなくなるくらいに、痛めつけさせてもらおうかな？」"

[[dialogue]]
speaker = "メルエル"
# 「くぅううっ……！！」
line = "「くぅううっ……！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「──させるかっ！！」
line = "「──させるかっ！！」"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃん……あ、ありがとうっ！！」
line = "「ナターシャちゃん……あ、ありがとうっ！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「お喋りは後！　集中して、メルエル！！」
line = "「お喋りは後！　集中して、メルエル！！」"

[[dialogue]]
speaker = "ジグ"
# 「お姫様を守る影──ふふ。私も『真なる神』に仕える騎士だ。どちらの忠義がより上か、試してみるかな──！？」
line = "「お姫様を守る影──ふふ。私も『真なる神』に仕える騎士だ。どちらの忠義がより上か、試してみるかな──！？」"

[[dialogue]]
speaker = "ナターシャ"
# （……忠義？　そんなもの、あるわけないでしょ）
line = "（……忠義？　そんなもの、あるわけないでしょ）"

[[dialogue]]
speaker = "ナターシャ"
# （これは仕事。好きでやってるわけじゃない──！）
line = "（これは仕事。好きでやってるわけじゃない──！）"

[[dialogue]]
speaker = "ナターシャ"
# （──って。誰に言い訳してるんだろ、私……！）
line = "（──って。誰に言い訳してるんだろ、私……！）"

[[dialogue]]
speaker = "梨緒"
# 「影に生きる暗殺者の家系……ということか」
line = "「影に生きる暗殺者の家系……ということか」"

[[dialogue]]
speaker = "梨緒"
# 「……私は君のことをよく知っているわけではない。あまり感情を見せない君のことだから、なんとも思っていないのかもしれない」
line = "「……私は君のことをよく知っているわけではない。あまり感情を見せない君のことだから、なんとも思っていないのかもしれない」"

[[dialogue]]
speaker = "梨緒"
# 「だが……不愉快だ」
line = "「だが……不愉快だ」"

[[dialogue]]
speaker = "梨緒"
# 「だって、自分の意志で命を懸けるのと、人に命を捨てさせられるのは違うだろう……！」
line = "「だって、自分の意志で命を懸けるのと、人に命を捨てさせられるのは違うだろう……！」"

[[dialogue]]
speaker = "梨緒"
# 「だから……不愉快だ。たとえ君がそれを良しとしていても」
line = "「だから……不愉快だ。たとえ君がそれを良しとしていても」"

[[dialogue]]
speaker = "ナターシャ"
# （確かにムカつくよ、梨緒）
line = "（確かにムカつくよ、梨緒）"

[[dialogue]]
speaker = "ナターシャ"
# （でも──だからって無視するわけにもいかないんだよね）
line = "（でも──だからって無視するわけにもいかないんだよね）"

[[dialogue]]
speaker = "ナターシャ"
# （これが私に定められた生き方だから。これ以外の生き方を、私は知らない──）
line = "（これが私に定められた生き方だから。これ以外の生き方を、私は知らない──）"

[[dialogue]]
speaker = "ナターシャ"
# （今さら変えられない……それだけ！　メルエルに忠義の心なんて、持ってない──！！）
line = "（今さら変えられない……それだけ！　メルエルに忠義の心なんて、持ってない──！！）"

[[dialogue]]
speaker = "unk"
# 執拗にメルエルを付け狙う使徒の斬撃を、ナターシャは弾き続ける。
line = "執拗にメルエルを付け狙う使徒の斬撃を、ナターシャは弾き続ける。"

[[dialogue]]
speaker = "ジグ"
# 「おや。面白い未来だね──試してみようか！！」
line = "「おや。面白い未来だね──試してみようか！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「……ぐぅっ！？」
line = "「……ぐぅっ！？」"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃんっ！！」
line = "「ナターシャちゃんっ！！」"

[[dialogue]]
speaker = "unk"
# ジグが突如、標的をナターシャの方へ絞ってきた──
line = "ジグが突如、標的をナターシャの方へ絞ってきた──"

[[dialogue]]
speaker = "ナターシャ"
# （まずいっ……何か、都合の良い未来を視たの！？）
line = "（まずいっ……何か、都合の良い未来を視たの！？）"

[[dialogue]]
speaker = "ジグ"
# 「ひとつ、ふたつ、みっつ──さあ、もうすぐだ！」
line = "「ひとつ、ふたつ、みっつ──さあ、もうすぐだ！」"

[[dialogue]]
speaker = "ナターシャ"
# （防御が破られるっ──！！）
line = "（防御が破られるっ──！！）"

[[dialogue]]
speaker = "ナターシャ"
# 「あっ──」
line = "「あっ──」"

[[dialogue]]
speaker = "unk"
# 両の手に持つ得物を弾かれ、がら空きとなるナターシャの胴体に向かって、大剣を奔らせるジグ──
line = "両の手に持つ得物を弾かれ、がら空きとなるナターシャの胴体に向かって、大剣を奔らせるジグ──"

[[dialogue]]
speaker = "メルエル"
# 「危ない！！　ナターシャちゃん！！」
line = "「危ない！！　ナターシャちゃん！！」"

[[dialogue]]
speaker = "unk"
# メルエルがナターシャを庇うために、その必殺の間合いに自ら飛び込んできた。
line = "メルエルがナターシャを庇うために、その必殺の間合いに自ら飛び込んできた。"

[[dialogue]]
speaker = "ナターシャ"
# 「──馬鹿っ！？？」
line = "「──馬鹿っ！？？」"

[[dialogue]]
speaker = "ジグ"
# 「ははっ！　星眼で視た通りのビジョンだ──！！」
line = "「ははっ！　星眼で視た通りのビジョンだ──！！」"

[[dialogue]]
speaker = "unk"
# ぞっとするほどにナターシャの心臓が冷え込む──自分をエサに、メルエルを釣りだされた。
line = "ぞっとするほどにナターシャの心臓が冷え込む──自分をエサに、メルエルを釣りだされた。"

[[dialogue]]
speaker = "unk"
# この未来をなぞると使徒が決めた。それはすなわち、メルエルに刃が食い込むことも織り込み済みの行動に他ならない──
line = "この未来をなぞると使徒が決めた。それはすなわち、メルエルに刃が食い込むことも織り込み済みの行動に他ならない──"

[[dialogue]]
speaker = "ナターシャ"
# 「やめろ────！！！！」
line = "「やめろ────！！！！」"

[[dialogue]]
speaker = "ケイティ"
# 「そのような戦い方──とても騎士のものとは思えません！！」
line = "「そのような戦い方──とても騎士のものとは思えません！！」"

[[dialogue]]
speaker = "ジグ"
# 「なっ……！？」
line = "「なっ……！？」"

[[dialogue]]
speaker = "unk"
# ケイティの鉄塊のごとき双剣が、逆にジグの得物を弾き、体勢を崩していた。
line = "ケイティの鉄塊のごとき双剣が、逆にジグの得物を弾き、体勢を崩していた。"

[[dialogue]]
speaker = "unk"
# そしてこの状況は、聖域の制圧天使の、絶対の間合い──
line = "そしてこの状況は、聖域の制圧天使の、絶対の間合い──"

[[dialogue]]
speaker = "ケイティ"
# 「爆ぜなさい！　断雲の剛撃ッ──！！！」
line = "「爆ぜなさい！　断雲の剛撃ッ──！！！」"

[[dialogue]]
speaker = "ジグ"
# 「ぐっ──あぁあぁあああっ！！」
line = "「ぐっ──あぁあぁあああっ！！」"

[[dialogue]]
speaker = "unk"
# 目にも止まらない鉄塊の斬撃が、使徒のシャドウに深く食い込む。
line = "目にも止まらない鉄塊の斬撃が、使徒のシャドウに深く食い込む。"

[[dialogue]]
speaker = "ジグ"
# 「はは……この未来は、視えていなかった……お姫様に深手を負わせられる、はずだったんだけどね……」
line = "「はは……この未来は、視えていなかった……お姫様に深手を負わせられる、はずだったんだけどね……」"

[[dialogue]]
speaker = "ジグ"
# 「やはり模造品の私では、完全な星眼は使えない、か──」
line = "「やはり模造品の私では、完全な星眼は使えない、か──」"

[[dialogue]]
speaker = "ケイティ"
# 「……殲滅完了。２人とも、怪我はない？」
line = "「……殲滅完了。２人とも、怪我はない？」"

[[dialogue]]
speaker = "メルエル"
# 「う、うんっ……ありがとう、ケイティお姉ちゃん。ナターシャちゃんも──」
line = "「う、うんっ……ありがとう、ケイティお姉ちゃん。ナターシャちゃんも──」"

[[dialogue]]
speaker = "ナターシャ"
# 「どういうつもり、メルエル！？」
line = "「どういうつもり、メルエル！？」"

[[dialogue]]
speaker = "メルエル"
# 「えっ……」
line = "「えっ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「どうしてあんな危ないことをしたの！？」
line = "「どうしてあんな危ないことをしたの！？」"

[[dialogue]]
speaker = "メルエル"
# 「で、でもっ……あのままじゃ、ナターシャちゃんが──」
line = "「で、でもっ……あのままじゃ、ナターシャちゃんが──」"

[[dialogue]]
speaker = "ナターシャ"
# 「誰も頼んでないでしょ！？　自分が魔王の血統だって自覚はないわけ！？」
line = "「誰も頼んでないでしょ！？　自分が魔王の血統だって自覚はないわけ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「自分の出自を知って、それを受け止めるんだって偉そうに言うのなら──」
line = "「自分の出自を知って、それを受け止めるんだって偉そうに言うのなら──」"

[[dialogue]]
speaker = "ナターシャ"
# 「二度とあんなこと、しないで！！」
line = "「二度とあんなこと、しないで！！」"

[[dialogue]]
speaker = "メルエル"
# 「ご……ごめん、なさい……」
line = "「ご……ごめん、なさい……」"

[[dialogue]]
speaker = "ケイティ"
# 「──２人とも。喧嘩をしている場合じゃないでしょう？」
line = "「──２人とも。喧嘩をしている場合じゃないでしょう？」"

[[dialogue]]
speaker = "ナターシャ"
# 「姉さん、でも──！」
line = "「姉さん、でも──！」"

[[dialogue]]
speaker = "ケイティ"
# 「それにナターシャちゃん。危ないところを庇ってもらったのだから、ちゃんとお礼は言わないとダメよ。──ね？」
line = "「それにナターシャちゃん。危ないところを庇ってもらったのだから、ちゃんとお礼は言わないとダメよ。──ね？」"

[[dialogue]]
speaker = "unk"
# 嗜めるように促され、ナターシャは大きく息を吐く。
line = "嗜めるように促され、ナターシャは大きく息を吐く。"

[[dialogue]]
speaker = "ナターシャ"
# 「…………ごめん、メルエル」
line = "「…………ごめん、メルエル」"

[[dialogue]]
speaker = "メルエル"
# 「う、ううん。私の方こそ……」
line = "「う、ううん。私の方こそ……」"

[[dialogue]]
speaker = "ケイティ"
# 「ひとまずの脅威は退けました。早急に人間界にいらっしゃる、会長さんに連絡を取らなくてはなりませんね」
line = "「ひとまずの脅威は退けました。早急に人間界にいらっしゃる、会長さんに連絡を取らなくてはなりませんね」"

[[dialogue]]
speaker = "ケイティ"
# 「人間界も攻撃を受けているかもしれませんし……魔女様の容態は？」
line = "「人間界も攻撃を受けているかもしれませんし……魔女様の容態は？」"

[[dialogue]]
speaker = "衛兵隊の天使"
# 「一命はとりとめていますが、意識が戻られないご様子です……！」
line = "「一命はとりとめていますが、意識が戻られないご様子です……！」"

[[dialogue]]
speaker = "ケイティ"
# 「そうですか──わかりました。至急、聖庭園に魔女様を運んで治療をお願いします」
line = "「そうですか──わかりました。至急、聖庭園に魔女様を運んで治療をお願いします」"

[[dialogue]]
speaker = "ケイティ"
# 「ひとまず私たちも帰りましょう。今後の事態に備えなければ──」
line = "「ひとまず私たちも帰りましょう。今後の事態に備えなければ──」"

[[dialogue]]
speaker = "メルエル"
# 「また──緊急連絡！？」
line = "「また──緊急連絡！？」"

[[dialogue]]
speaker = "ケイティ"
# 「……私です。何が起きました？」
line = "「……私です。何が起きました？」"

[[dialogue]]
speaker = "衛兵隊の天使"
# 『ケイティ隊長！　女神の神殿が……仮面を被った星騎士の攻撃を受けています！！』
line = "『ケイティ隊長！　女神の神殿が……仮面を被った星騎士の攻撃を受けています！！』"

[[dialogue]]
speaker = "衛兵隊の天使"
# 『すでに神殿内部への侵入も許してしまっていますっ！　至急、応援を──きゃぁぁああっ！？』
line = "『すでに神殿内部への侵入も許してしまっていますっ！　至急、応援を──きゃぁぁああっ！？』"

[[dialogue]]
speaker = "ケイティ"
# 「……ゆっくりお茶会をする暇はなさそうですね！」
line = "「……ゆっくりお茶会をする暇はなさそうですね！」"

[[dialogue]]
speaker = "ナターシャ"
# （また、女神の神殿に攻撃を……？　敵の目的は一体──）
line = "（また、女神の神殿に攻撃を……？　敵の目的は一体──）"

[[dialogue]]
speaker = "ケイティ"
# 「女神の神殿を落とされては、天界は壊滅します！　行きますよ、みなさん！！」
line = "「女神の神殿を落とされては、天界は壊滅します！　行きますよ、みなさん！！」"
