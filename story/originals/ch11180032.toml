[[dialogue]]
speaker = "unk"
# 第２話,吸血鬼よりも吸血鬼らしく,P
line = "第２話,吸血鬼よりも吸血鬼らしく,P"

[[dialogue]]
speaker = "unk"
# 『会長さん、夜、こっそり抜け出せる？　誰にも見つからないようにここに来てよ』
line = "『会長さん、夜、こっそり抜け出せる？　誰にも見つからないようにここに来てよ』"

[[dialogue]]
speaker = "unk"
# ナターシャに手渡された紙に書かれていた指定先は、深夜のカフェテリアだった。
line = "ナターシャに手渡された紙に書かれていた指定先は、深夜のカフェテリアだった。"

[[dialogue]]
speaker = "ナターシャ"
# 「ふふっ……よくぞ我が元に馳せ参じたな、魔王よ」
line = "「ふふっ……よくぞ我が元に馳せ参じたな、魔王よ」"

[[dialogue]]
speaker = "ナターシャ"
# 「我が呼びかけに応えたということは、眷属へと堕ちる心づもりはできたのかえ？」
line = "「我が呼びかけに応えたということは、眷属へと堕ちる心づもりはできたのかえ？」"

[[dialogue]]
speaker = "unk"
# ナターシャ！？
line = "ナターシャ！？"

[[dialogue]]
speaker = "ナターシャ"
# 「そう、我が名はナターシャ。ナターシャ・チルノ。夜の眷属を統べる絶対なる王、ヴァンパイアなり！」
line = "「そう、我が名はナターシャ。ナターシャ・チルノ。夜の眷属を統べる絶対なる王、ヴァンパイアなり！」"

[[dialogue]]
speaker = "ナターシャ"
# 「──なーんてね」
line = "「──なーんてね」"

[[dialogue]]
speaker = "ナターシャ"
# 「私のキャラじゃないけど、せっかく手に入れたハロウィンフォームだし、演出込みでお披露目しようかと思ってさ」
line = "「私のキャラじゃないけど、せっかく手に入れたハロウィンフォームだし、演出込みでお披露目しようかと思ってさ」"

[[dialogue]]
speaker = "ナターシャ"
# 「私なりのイタズラ。びっくりした？」
line = "「私なりのイタズラ。びっくりした？」"

[[dialogue]]
speaker = "ナターシャ"
# 「本来の吸血鬼ってこういうものでしょ。日の光も、ニンニクも平気なベアトが例外すぎるんだって」
line = "「本来の吸血鬼ってこういうものでしょ。日の光も、ニンニクも平気なベアトが例外すぎるんだって」"

[[dialogue]]
speaker = "ベアトリス"
# 「くっちゅんっ！」
line = "「くっちゅんっ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「あれれ、風邪ひいちゃったかな……？　私、吸血鬼なのに～……」
line = "「あれれ、風邪ひいちゃったかな……？　私、吸血鬼なのに～……」"

[[dialogue]]
speaker = "ナターシャ"
# 「まあ、今はベアトの話は置いといて。この戦闘服、似合ってるかな？」
line = "「まあ、今はベアトの話は置いといて。この戦闘服、似合ってるかな？」"

[[dialogue]]
speaker = "unk"
# ポーズ、大胆すぎない……？
line = "ポーズ、大胆すぎない……？"

[[dialogue]]
speaker = "unk"
# 似合ってる、けど……
line = "似合ってる、けど……"

[[dialogue]]
speaker = "ナターシャ"
# 「こういう衣装は、自分の魅力を見せつけるためのモノでしょ？」
line = "「こういう衣装は、自分の魅力を見せつけるためのモノでしょ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「吸血鬼どうこうは冗談にしても、魔王は強い力を持っているし、監視下に置いておかなきゃいけないのは相変わらずなわけ」
line = "「吸血鬼どうこうは冗談にしても、魔王は強い力を持っているし、監視下に置いておかなきゃいけないのは相変わらずなわけ」"

[[dialogue]]
speaker = "ナターシャ"
# 「手っ取り早く、会長さんをモノにしておきたいってのは、まあまあ本気なんだよね」
line = "「手っ取り早く、会長さんをモノにしておきたいってのは、まあまあ本気なんだよね」"

[[dialogue]]
speaker = "ナターシャ"
# 「いい機会だし聞いちゃおうかな」
line = "「いい機会だし聞いちゃおうかな」"

[[dialogue]]
speaker = "ナターシャ"
# 「ね、会長さんはどうしたら私のモノになってくれる？　あなたをモノにするために、私は何をしたらいいのかな？」
line = "「ね、会長さんはどうしたら私のモノになってくれる？　あなたをモノにするために、私は何をしたらいいのかな？」"

[[dialogue]]
speaker = "unk"
# 何をされても堕ちない！
line = "何をされても堕ちない！"

[[dialogue]]
speaker = "unk"
# 誰のモノにもならない！
line = "誰のモノにもならない！"

[[dialogue]]
speaker = "ナターシャ"
# 「おやおや、強情だね。会長さんが私の虜になってくれたら、なんでもしてあげるのに」
line = "「おやおや、強情だね。会長さんが私の虜になってくれたら、なんでもしてあげるのに」"

[[dialogue]]
speaker = "ナターシャ"
# 「<ruby=うぶ>初心</ruby>なメルエルやベアトには絶対できないような、あーんなことやこーんなこともしてあげる<emoji=heart04>」
line = "「<ruby>初心<rt>うぶ</rt></ruby>なメルエルやベアトには絶対できないような、あーんなことやこーんなこともしてあげる<emoji=heart04>」"

[[dialogue]]
speaker = "ナターシャ"
# 「一晩中……ううん、じ～っくり時間をかけて……１滴残らず搾り取ってあげちゃう<emoji=heart04>」
line = "「一晩中……ううん、じ～っくり時間をかけて……１滴残らず搾り取ってあげちゃう<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 何を搾り取る気！？
line = "何を搾り取る気！？"

[[dialogue]]
speaker = "ナターシャ"
# 「あはは、顔真っ赤。血が上っちゃってる？」
line = "「あはは、顔真っ赤。血が上っちゃってる？」"

[[dialogue]]
speaker = "ナターシャ"
# 「他にも～……血がいっぱい巡っちゃってるところ、あるんじゃないかな？」
line = "「他にも～……血がいっぱい巡っちゃってるところ、あるんじゃないかな？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ほら、早く教えて。さもないと……時間切れになっちゃうよ」
line = "「ほら、早く教えて。さもないと……時間切れになっちゃうよ」"

[[dialogue]]
speaker = "unk"
# もう朝……？
line = "もう朝……？"

[[dialogue]]
speaker = "unk"
# 時間切れ……？
line = "時間切れ……？"

[[dialogue]]
speaker = "メルエル"
# 「ナ、ナ、ナターシャちゃんっ、会長くんと何してるのーっ！？」
line = "「ナ、ナ、ナターシャちゃんっ、会長くんと何してるのーっ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「はい、残念。タイムアーップ」
line = "「はい、残念。タイムアーップ」"

[[dialogue]]
speaker = "unk"
# どうして、ここに！？
line = "どうして、ここに！？"

[[dialogue]]
speaker = "unk"
# メルエル！？
line = "メルエル！？"

[[dialogue]]
speaker = "メルエル"
# 「私のＤＩＳＣにメッセージが来たのっ！　会長くんを襲ってほしくなかったら、すぐにここに来なさいって！」
line = "「私のＤＩＳＣにメッセージが来たのっ！　会長くんを襲ってほしくなかったら、すぐにここに来なさいって！」"

[[dialogue]]
speaker = "ナターシャ"
# 「もちろん、送信したのは私。私からメルエルへのイタズラ。どう？　楽しんでもらえた？」
line = "「もちろん、送信したのは私。私からメルエルへのイタズラ。どう？　楽しんでもらえた？」"

[[dialogue]]
speaker = "メルエル"
# 「楽しくないよ！　ドッキドキだったよ！　こういうのはイタズラを超えちゃってるからよくないよっ！」
line = "「楽しくないよ！　ドッキドキだったよ！　こういうのはイタズラを超えちゃってるからよくないよっ！」"

[[dialogue]]
speaker = "メルエル"
# 「私じゃなかったら、もっと怒られてるよっ！　『メッ！』じゃ済まないからねっ」
line = "「私じゃなかったら、もっと怒られてるよっ！　『メッ！』じゃ済まないからねっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「うーん、そうなんだ。匙加減が難しいね。相手がメルエルと会長さんで良かったよ」
line = "「うーん、そうなんだ。匙加減が難しいね。相手がメルエルと会長さんで良かったよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「あれれ？　会長さん、名残惜しそうな顔してる。私にしてほしいことでもあった？」
line = "「あれれ？　会長さん、名残惜しそうな顔してる。私にしてほしいことでもあった？」"

[[dialogue]]
speaker = "ナターシャ"
# 「物事はなんでも即断即決がオススメだよ。優柔不断だと、もたもたしてる隙に指の隙間から逃げちゃうからね」
line = "「物事はなんでも即断即決がオススメだよ。優柔不断だと、もたもたしてる隙に指の隙間から逃げちゃうからね」"

[[dialogue]]
speaker = "ナターシャ"
# 「うん、面白かった。それじゃ、吸血鬼は吸血鬼らしくドロンと消えるね。２人とも、おやすみ～」
line = "「うん、面白かった。それじゃ、吸血鬼は吸血鬼らしくドロンと消えるね。２人とも、おやすみ～」"

[[dialogue]]
speaker = "メルエル"
# 「消えちゃったっ！？　もうナターシャちゃんってばーっ！」
line = "「消えちゃったっ！？　もうナターシャちゃんってばーっ！」"

[[dialogue]]
speaker = "unk"
# 勝手気ままなイタズラに翻弄されたメルエルと俺だけが、深夜のカフェテリアに残されたのであった。
line = "勝手気ままなイタズラに翻弄されたメルエルと俺だけが、深夜のカフェテリアに残されたのであった。"

[[dialogue]]
speaker = "メルエル"
# 「もうナターシャちゃんってば…………。帰ろっか、会長くん」
line = "「もうナターシャちゃんってば…………。帰ろっか、会長くん」"

[[dialogue]]
speaker = "メルエル"
# 「それで、その、会長くん……襲われちゃった？」
line = "「それで、その、会長くん……襲われちゃった？」"

[[dialogue]]
speaker = "unk"
# 襲われてないっ！
line = "襲われてないっ！"

[[dialogue]]
speaker = "unk"
# 未遂だよっ！？
line = "未遂だよっ！？"

[[dialogue]]
speaker = "unk"
# 俺は無事、吸血鬼の牙にかかることなく帰路に就いた──
line = "俺は無事、吸血鬼の牙にかかることなく帰路に就いた──"
