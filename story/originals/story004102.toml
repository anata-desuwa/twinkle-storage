[[dialogue]]
speaker = "シャルレーヌ"
# 「『千年に一度の英雄』ウィステリアさんに、謎の転入生と噂のリィベル先輩じゃないですか。お近づきになれて光栄です」
line = "「『千年に一度の英雄』ウィステリアさんに、謎の転入生と噂のリィベル先輩じゃないですか。お近づきになれて光栄です」"

[[dialogue]]
speaker = "ウィステリア"
# 「うっ……またそのあだ名……」
line = "「うっ……またそのあだ名……」"

[[dialogue]]
speaker = "リィベル"
# 「謎の転入生ってなに？」
line = "「謎の転入生ってなに？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「竜の魔族は希少ですから、流星学園や附属の魔族の間で噂になっているんです。竜の魔族、しかもとても神秘的な女の子が突然現れたって」
line = "「竜の魔族は希少ですから、流星学園や附属の魔族の間で噂になっているんです。竜の魔族、しかもとても神秘的な女の子が突然現れたって」"

[[dialogue]]
speaker = "リィベル"
# 「そう……」
line = "「そう……」"

[[dialogue]]
speaker = "モネ"
# 「ええと、シャルレーヌさんをお呼びした理由なんですけど……」
line = "「ええと、シャルレーヌさんをお呼びした理由なんですけど……」"

[[dialogue]]
speaker = "unk"
# モネは以前に深淵書庫で起きた事件と、書庫の現状と魔将について説明した。
line = "モネは以前に深淵書庫で起きた事件と、書庫の現状と魔将について説明した。"

[[dialogue]]
speaker = "シャルレーヌ"
# 「なるほど……わかりました。私も現代に生きる魔族として、可能な限り協力させていただきます」
line = "「なるほど……わかりました。私も現代に生きる魔族として、可能な限り協力させていただきます」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「……くふ♪　つまり私に魔将になれってことですよね♪」
line = "「……くふ♪　つまり私に魔将になれってことですよね♪」"

[[dialogue]]
speaker = "リィベル"
# 「それは魔本たち次第ね。……モネ、どうして彼女を連れてきたの？」
line = "「それは魔本たち次第ね。……モネ、どうして彼女を連れてきたの？」"

[[dialogue]]
speaker = "モネ"
# 「シャルレーヌさんはサキュバスの魔族だと聞きました。ならば『色欲』の魔本に適合できるのではと……」
line = "「シャルレーヌさんはサキュバスの魔族だと聞きました。ならば『色欲』の魔本に適合できるのではと……」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「んー……確かにディアーブルはサキュバス、インキュバスの一族です。劣情を煽る術には長けていますが……それでいいなら、うちの一族はみんな魔将になってしまいますよ」
line = "「んー……確かにディアーブルはサキュバス、インキュバスの一族です。劣情を煽る術には長けていますが……それでいいなら、うちの一族はみんな魔将になってしまいますよ」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「話を聞く限り、魔将ってそういうものではないですよね？」
line = "「話を聞く限り、魔将ってそういうものではないですよね？」"

[[dialogue]]
speaker = "リィベル"
# 「そうね。あくまで魔本に適合するかどうかだけど、モネが傲慢、ウィステリアが怠惰の魔将になったように、一面的に決まるものではないわ」
line = "「そうね。あくまで魔本に適合するかどうかだけど、モネが傲慢、ウィステリアが怠惰の魔将になったように、一面的に決まるものではないわ」"

[[dialogue]]
speaker = "モネ"
# 「そういえば……私も傲慢の魔本を貸し出されて、最初戸惑ったような……」
line = "「そういえば……私も傲慢の魔本を貸し出されて、最初戸惑ったような……」"

[[dialogue]]
speaker = "モネ"
# 「すみません、シャルレーヌさん。先入観で声をかけてしまって」
line = "「すみません、シャルレーヌさん。先入観で声をかけてしまって」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「いえいえ、気にしていませんよ。それにお呼びいただいたこと自体は嬉しいです。頼りにされているということですから」
line = "「いえいえ、気にしていませんよ。それにお呼びいただいたこと自体は嬉しいです。頼りにされているということですから」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「何より、大きな力を手にする機会ですし……くふふ♪」
line = "「何より、大きな力を手にする機会ですし……くふふ♪」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「私は『色欲』より『強欲』に興味があります。そちらが適合するか、見ていただけませんか？」
line = "「私は『色欲』より『強欲』に興味があります。そちらが適合するか、見ていただけませんか？」"

[[dialogue]]
speaker = "リィベル"
# 「いいわよ。出なさい」
line = "「いいわよ。出なさい」"

[[dialogue]]
speaker = "unk"
# リィベルがシャルレーヌの前で手をかざすと、また魔本が現れる。
line = "リィベルがシャルレーヌの前で手をかざすと、また魔本が現れる。"

[[dialogue]]
speaker = "リィベル"
# 「ふむ……確かに、『色欲』より『強欲』の方が反応が強いわね。魔将になるほどではないようだけど」
line = "「ふむ……確かに、『色欲』より『強欲』の方が反応が強いわね。魔将になるほどではないようだけど」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「そうですか、残念です。これからのことを考えると、強い力が欲しかったのですが」
line = "「そうですか、残念です。これからのことを考えると、強い力が欲しかったのですが」"

[[dialogue]]
speaker = "モネ"
# 「これから、ですか？」
line = "「これから、ですか？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ええ。魔界のシャリオン地方のことはご存知ですか？」
line = "「ええ。魔界のシャリオン地方のことはご存知ですか？」"

[[dialogue]]
speaker = "モネ"
# 「はい。本で読んだことがあります。１０の大貴族が治める土地で、風情は人間界でいうと、中世ヨーロッパに近いとか」
line = "「はい。本で読んだことがあります。１０の大貴族が治める土地で、風情は人間界でいうと、中世ヨーロッパに近いとか」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「さすがモネ先輩、博識ですね。我がディアーブル家もその十貴族の一角です」
line = "「さすがモネ先輩、博識ですね。我がディアーブル家もその十貴族の一角です」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「リクリエが落ち着いた以上、今まで水面下で行われていた貴族間の勢力争いが激しくなるでしょう。そのための用意として力を付けておきたいんです」
line = "「リクリエが落ち着いた以上、今まで水面下で行われていた貴族間の勢力争いが激しくなるでしょう。そのための用意として力を付けておきたいんです」"

[[dialogue]]
speaker = "リィベル"
# 「魔将の力は、リクリエと戦うための力よ。権力争いなんかに使うものじゃないわ」
line = "「魔将の力は、リクリエと戦うための力よ。権力争いなんかに使うものじゃないわ」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ええ、承知しています。あくまで領地や領民を守るためですよ。くふふ♪」
line = "「ええ、承知しています。あくまで領地や領民を守るためですよ。くふふ♪」"

[[dialogue]]
speaker = "リィベル"
# 「本当かしら……？」
line = "「本当かしら……？」"

[[dialogue]]
speaker = "カティア"
# （シャルレーヌ──様もリィベルと何か話してる……）
line = "（シャルレーヌ──様もリィベルと何か話してる……）"

[[dialogue]]
speaker = "カティア"
# （まさか、シャルレーヌ様も魔将になるつもり？）
line = "（まさか、シャルレーヌ様も魔将になるつもり？）"

[[dialogue]]
speaker = "カティア"
# （うぅ～……附属生でもうプリマステラなのに、さらに魔将になるなんて、そんなのズルくない？　シャルレーヌ様に魔将の力は渡さないぞ！）
line = "（うぅ～……附属生でもうプリマステラなのに、さらに魔将になるなんて、そんなのズルくない？　シャルレーヌ様に魔将の力は渡さないぞ！）"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ところで、さっきから視線を感じませんか？」
line = "「ところで、さっきから視線を感じませんか？」"

[[dialogue]]
speaker = "カティア"
# （うそっ、気付かれてた！？）
line = "（うそっ、気付かれてた！？）"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ね、イクシリオン先輩？」
line = "「ね、イクシリオン先輩？」"

[[dialogue]]
speaker = "モネ"
# 「イクシーさん！？」
line = "「イクシーさん！？」"

[[dialogue]]
speaker = "イクシリオン"
# 「…………えっと、あのぉ……」
line = "「…………えっと、あのぉ……」"

[[dialogue]]
speaker = "unk"
# シャルレーヌが視線の先。そこにいたのは、口をパクパクさせるイクシリオンだった。
line = "シャルレーヌが視線の先。そこにいたのは、口をパクパクさせるイクシリオンだった。"
