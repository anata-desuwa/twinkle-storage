[[dialogue]]
speaker = "カティア"
# 「これが魔将の力……っ！　今ならどこまでも走れそう！！」
line = "「これが魔将の力……っ！　今ならどこまでも走れそう！！」"

[[dialogue]]
speaker = "unk"
# 力を噛みしめるように、カティアが肉球グローブをぎゅっぎゅっと握る。
line = "力を噛みしめるように、カティアが肉球グローブをぎゅっぎゅっと握る。"

[[dialogue]]
speaker = "サラン"
# 「すごいすご～い♪　カティアちゃんが魔将になっちゃった～♪」
line = "「すごいすご～い♪　カティアちゃんが魔将になっちゃった～♪」"

[[dialogue]]
speaker = "イクシリオン"
# 「元の戦闘服から露出こそ減りましたが、チラ見せするおへそがグッド！　実にグッドです！」
line = "「元の戦闘服から露出こそ減りましたが、チラ見せするおへそがグッド！　実にグッドです！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「どこから目線のレビューなんですか、それ……」
line = "「どこから目線のレビューなんですか、それ……」"

[[dialogue]]
speaker = "カティア"
# 「サラン先輩、お待たせしました！　私も戦います！」
line = "「サラン先輩、お待たせしました！　私も戦います！」"

[[dialogue]]
speaker = "サラン"
# 「うん、一緒にがんばろ～♪」
line = "「うん、一緒にがんばろ～♪」"

[[dialogue]]
speaker = "モンスター"
# 「ガアァァァァッ！！！」
line = "「ガアァァァァッ！！！」"

[[dialogue]]
speaker = "unk"
# カティアの新たな力を脅威と感じたのか、モンスターがカティアに迫る。
line = "カティアの新たな力を脅威と感じたのか、モンスターがカティアに迫る。"

[[dialogue]]
speaker = "unk"
# だが──
line = "だが──"

[[dialogue]]
speaker = "カティア"
# 「遅い！」
line = "「遅い！」"

[[dialogue]]
speaker = "カティア"
# 「遅い遅ーい！　モンスターが止まって見える！」
line = "「遅い遅ーい！　モンスターが止まって見える！」"

[[dialogue]]
speaker = "unk"
# モンスターの攻撃を縫うようにかわすカティア。
line = "モンスターの攻撃を縫うようにかわすカティア。"

[[dialogue]]
speaker = "unk"
# 元より快速自慢の彼女だったが、魔将の力によって更なるスピードを獲得した。
line = "元より快速自慢の彼女だったが、魔将の力によって更なるスピードを獲得した。"

[[dialogue]]
speaker = "unk"
# そしてもちろん、得たのは早さだけではない。
line = "そしてもちろん、得たのは早さだけではない。"

[[dialogue]]
speaker = "カティア"
# 「じゃあ今度はこっちから行くぞーっ！　グリーディークロウ！」
line = "「じゃあ今度はこっちから行くぞーっ！　グリーディークロウ！」"

[[dialogue]]
speaker = "unk"
# 魔力を伴った斬撃が、モンスターの胴体を深々と切り裂く。攻撃力も今までと段違いだ。
line = "魔力を伴った斬撃が、モンスターの胴体を深々と切り裂く。攻撃力も今までと段違いだ。"

[[dialogue]]
speaker = "カティア"
# 「まだまだぁーっ！！　ポチ、ゴン！」
line = "「まだまだぁーっ！！　ポチ、ゴン！」"

[[dialogue]]
speaker = "unk"
# カティアから鎖で繋がれた２頭の犬が宙を駆ける。魔将の力によって具現化した使い魔だ。
line = "カティアから鎖で繋がれた２頭の犬が宙を駆ける。魔将の力によって具現化した使い魔だ。"

[[dialogue]]
speaker = "カティア"
# 「せーの！　トライヘッドバイト！」
line = "「せーの！　トライヘッドバイト！」"

[[dialogue]]
speaker = "unk"
# ポチとゴン、そしてカティア自身の両手。３つの<ruby=アギト>顎</ruby>がモンスターを同時に捉えた。断末魔を上げる隙すら与えず、モンスターを消滅させる。
line = "ポチとゴン、そしてカティア自身の両手。３つの<ruby>顎<rt>アギト</rt></ruby>がモンスターを同時に捉えた。断末魔を上げる隙すら与えず、モンスターを消滅させる。"

[[dialogue]]
speaker = "イクシリオン"
# 「凄まじい力です。瞬く間にモンスターを倒してしまいました！」
line = "「凄まじい力です。瞬く間にモンスターを倒してしまいました！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「でも瘴気をなんとかしないと……！」
line = "「でも瘴気をなんとかしないと……！」"

[[dialogue]]
speaker = "カティア"
# 「大丈夫！　種はまいたから！」
line = "「大丈夫！　種はまいたから！」"

[[dialogue]]
speaker = "サラン"
# 「たね～？」
line = "「たね～？」"

[[dialogue]]
speaker = "モンスター"
# 「ガァァ！！」
line = "「ガァァ！！」"

[[dialogue]]
speaker = "unk"
# 力では勝てないと判断したのか、モンスターが一斉に瘴気を吐き出した。
line = "力では勝てないと判断したのか、モンスターが一斉に瘴気を吐き出した。"

[[dialogue]]
speaker = "unk"
# だが、もうカティアは動じない。
line = "だが、もうカティアは動じない。"

[[dialogue]]
speaker = "カティア"
# 「もうお前たちには何ひとつくれてやらない！　雑草一本だってやるもんか！」
line = "「もうお前たちには何ひとつくれてやらない！　雑草一本だってやるもんか！」"

[[dialogue]]
speaker = "カティア"
# 「さぁ、芽吹けぇーーーっ！！」
line = "「さぁ、芽吹けぇーーーっ！！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「リクリエに侵食された土地から、花が咲いた……！？」
line = "「リクリエに侵食された土地から、花が咲いた……！？」"

[[dialogue]]
speaker = "イクシリオン"
# 「それだけではありません。草花が瘴気を押し返しています！」
line = "「それだけではありません。草花が瘴気を押し返しています！」"

[[dialogue]]
speaker = "unk"
# リクリエによって変貌した大地が、カティアの花畑によって本来の法則を取り戻す。
line = "リクリエによって変貌した大地が、カティアの花畑によって本来の法則を取り戻す。"

[[dialogue]]
speaker = "unk"
# さらに、咲いた花は淡く光を帯びて、瘴気をはじき返した。
line = "さらに、咲いた花は淡く光を帯びて、瘴気をはじき返した。"

[[dialogue]]
speaker = "サラン"
# 「んん～～♪　いい香り～♪」
line = "「んん～～♪　いい香り～♪」"

[[dialogue]]
speaker = "unk"
# 不浄を優しく払う、花の香り。穏やかで、けれど確かに大地を染めていく。
line = "不浄を優しく払う、花の香り。穏やかで、けれど確かに大地を染めていく。"

[[dialogue]]
speaker = "カティア"
# 「花が咲いたところは、もう私の領地だ！　瘴気なんてもう効かない！　魔王様の領地、返してもらうぞー！」
line = "「花が咲いたところは、もう私の領地だ！　瘴気なんてもう効かない！　魔王様の領地、返してもらうぞー！」"

[[dialogue]]
speaker = "カティア"
# 「あっ、その前に……ポチ、ゴン！」
line = "「あっ、その前に……ポチ、ゴン！」"

[[dialogue]]
speaker = "ポチ"
# 「ワン！」
line = "「ワン！」"

[[dialogue]]
speaker = "ゴン"
# 「キャゥン！」
line = "「キャゥン！」"

[[dialogue]]
speaker = "unk"
# ポチとゴンが器用に口を使って、カティアの領地から草を引っこ抜く。すると──
line = "ポチとゴンが器用に口を使って、カティアの領地から草を引っこ抜く。すると──"

[[dialogue]]
speaker = "犬の使い魔"
# 「ワンワン！　ワウゥ！」
line = "「ワンワン！　ワウゥ！」"

[[dialogue]]
speaker = "イクシリオン"
# 「なんと！　新しいワンちゃんが地中から現れました！」
line = "「なんと！　新しいワンちゃんが地中から現れました！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「増えた犬がまた犬を収穫して……数がどんどん増えていくわ！」
line = "「増えた犬がまた犬を収穫して……数がどんどん増えていくわ！」"

[[dialogue]]
speaker = "unk"
# 最初は２頭だった使い魔犬もみるみる増殖し、あっという間に犬がひしめき合う。
line = "最初は２頭だった使い魔犬もみるみる増殖し、あっという間に犬がひしめき合う。"

[[dialogue]]
speaker = "カティア"
# 「ふっふっふ、名付けてワンワンアーミー！　どうだモンスターども！　地獄の番犬の群れが怖いだろ～！」
line = "「ふっふっふ、名付けてワンワンアーミー！　どうだモンスターども！　地獄の番犬の群れが怖いだろ～！」"

[[dialogue]]
speaker = "サラン"
# 「かわいい～～♪　食べちゃいたいくら～い<emoji=heart04>」
line = "「かわいい～～♪　食べちゃいたいくら～い<emoji=heart04>」"

[[dialogue]]
speaker = "カティア"
# 「かわいい！？　こんなに強そうなのに！？　あと食べないでー！」
line = "「かわいい！？　こんなに強そうなのに！？　あと食べないでー！」"

[[dialogue]]
speaker = "イクシリオン"
# 「私もとってもかわいいと思います！」
line = "「私もとってもかわいいと思います！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「カティア先輩に似て、とってもお可愛らしいですよ～♪」
line = "「カティア先輩に似て、とってもお可愛らしいですよ～♪」"

[[dialogue]]
speaker = "カティア"
# 「うぅ～、なら目にもの見せてやる！」
line = "「うぅ～、なら目にもの見せてやる！」"

[[dialogue]]
speaker = "カティア"
# 「征服の時間だ！　いっけぇ～～、バウバンキッシュマーチ！」
line = "「征服の時間だ！　いっけぇ～～、バウバンキッシュマーチ！」"

[[dialogue]]
speaker = "ワンちゃん"
# 「ワオオン！　ワンワン！」
line = "「ワオオン！　ワンワン！」"

[[dialogue]]
speaker = "unk"
# カティアの号令に従い、使い魔犬の群れがモンスターに襲い掛かる。行進は種を撒き散らし、さらに草花を生い茂らせていく。
line = "カティアの号令に従い、使い魔犬の群れがモンスターに襲い掛かる。行進は種を撒き散らし、さらに草花を生い茂らせていく。"

[[dialogue]]
speaker = "カティア"
# 「はーっはっはっは！　もっともっと、私の領地にしてやるんだ！　魔王様に献上だー！　世界は私たちのものだー！」
line = "「はーっはっはっは！　もっともっと、私の領地にしてやるんだ！　魔王様に献上だー！　世界は私たちのものだー！」"

[[dialogue]]
speaker = "unk"
# 調子に乗って高笑いを上げるカティア。
line = "調子に乗って高笑いを上げるカティア。"

[[dialogue]]
speaker = "unk"
# 普段は小動物的な雰囲気さえあるが、これもまた彼女の本性だ。世界を自分で染める快楽に酔いしれている。
line = "普段は小動物的な雰囲気さえあるが、これもまた彼女の本性だ。世界を自分で染める快楽に酔いしれている。"

[[dialogue]]
speaker = "イクシリオン"
# （ああ……カティアさん、本当はこんな方だったのですね。心からイキイキしていて、羨ましい……）
line = "（ああ……カティアさん、本当はこんな方だったのですね。心からイキイキしていて、羨ましい……）"

[[dialogue]]
speaker = "イクシリオン"
# （私も、嘘偽りなく自分をさらけ出せたら…………）
line = "（私も、嘘偽りなく自分をさらけ出せたら…………）"

[[dialogue]]
speaker = "イクシリオン"
# （いえ、違います。今日がその日、今がその時なんです！）
line = "（いえ、違います。今日がその日、今がその時なんです！）"

[[dialogue]]
speaker = "イクシリオン"
# 「みなさん、戦いながら聞いてください！」
line = "「みなさん、戦いながら聞いてください！」"

[[dialogue]]
speaker = "イクシリオン"
# 「私は今まで、偽りの姿で生きてきました……。どこに出しても恥ずかしくない優等生とか、品行方正とか、憧れのプリマステラとかいろいろ言われておりますが……」
line = "「私は今まで、偽りの姿で生きてきました……。どこに出しても恥ずかしくない優等生とか、品行方正とか、憧れのプリマステラとかいろいろ言われておりますが……」"

[[dialogue]]
speaker = "イクシリオン"
# 「私は、本当は、本当は────」
line = "「私は、本当は、本当は────」"

[[dialogue]]
speaker = "イクシリオン"
# 「むっっっつりドスケベなんです～～～～～～っ！！！」
line = "「むっっっつりドスケベなんです～～～～～～っ！！！」"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～？」
line = "「ぽよ～？」"

[[dialogue]]
speaker = "カティア"
# 「はぁ！？」
line = "「はぁ！？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「…………は？」
line = "「…………は？」"

[[dialogue]]
speaker = "リィベル"
# 『何を言っているの、あなた……錯乱して──いいえ、あなたにとっては大事なことなのね。分かったわ。言ってみなさい』
line = "『何を言っているの、あなた……錯乱して──いいえ、あなたにとっては大事なことなのね。分かったわ。言ってみなさい』"

[[dialogue]]
speaker = "イクシリオン"
# 「はい！　ありがとうございます！」
line = "「はい！　ありがとうございます！」"

[[dialogue]]
speaker = "イクシリオン"
# 「……私は、天界で《命脈》のアルモタヘル様を祀る家系に生を受けました」
line = "「……私は、天界で《命脈》のアルモタヘル様を祀る家系に生を受けました」"

[[dialogue]]
speaker = "イクシリオン"
# 「命脈とは、命から命へと受け継がれるもの。命の営みそのものです」
line = "「命脈とは、命から命へと受け継がれるもの。命の営みそのものです」"

[[dialogue]]
speaker = "イクシリオン"
# 「人はもちろん、動物や虫、草木にいたるまで、それを紡いできたのです。はるかな昔から、ずっとずっとずっと……それらの行為を、私は神聖なものと教えられてきました」
line = "「人はもちろん、動物や虫、草木にいたるまで、それを紡いできたのです。はるかな昔から、ずっとずっとずっと……それらの行為を、私は神聖なものと教えられてきました」"

[[dialogue]]
speaker = "イクシリオン"
# 「ですが、ですが……っ！　人間界に来た時、私は出会ってしまったんです──」
line = "「ですが、ですが……っ！　人間界に来た時、私は出会ってしまったんです──」"

[[dialogue]]
speaker = "イクシリオン"
# 「エッチな漫画に！！！」
line = "「エッチな漫画に！！！」"

[[dialogue]]
speaker = "イクシリオン"
# 「ああいえ、それが主題の漫画ではなかったのですが！　ちょっと肌色が多いだけでちゃんとした恋愛漫画でしたが！」
line = "「ああいえ、それが主題の漫画ではなかったのですが！　ちょっと肌色が多いだけでちゃんとした恋愛漫画でしたが！」"

[[dialogue]]
speaker = "イクシリオン"
# 「でもそれが私には衝撃で……雷に打たれたかのような思いでした」
line = "「でもそれが私には衝撃で……雷に打たれたかのような思いでした」"

[[dialogue]]
speaker = "イクシリオン"
# 「それから気が付けば、そんな描写のある漫画ばかり読んで、エッチなことをいつも考えるように…………」
line = "「それから気が付けば、そんな描写のある漫画ばかり読んで、エッチなことをいつも考えるように…………」"

[[dialogue]]
speaker = "イクシリオン"
# 「命の営みとは神聖なもの。それを娯楽として消費するなんて、悪いことだと思っていました。いえ、今もそうです。いけないことだと思っています」
line = "「命の営みとは神聖なもの。それを娯楽として消費するなんて、悪いことだと思っていました。いえ、今もそうです。いけないことだと思っています」"

[[dialogue]]
speaker = "イクシリオン"
# 「それでも、この心を止めることはできません。たとえそれが悪だとしても……」
line = "「それでも、この心を止めることはできません。たとえそれが悪だとしても……」"

[[dialogue]]
speaker = "イクシリオン"
# 「いえ、悪いからこそ気持ちいいこともあるのです！！　むしろ背徳感が……イイ！！」
line = "「いえ、悪いからこそ気持ちいいこともあるのです！！　むしろ背徳感が……イイ！！」"

[[dialogue]]
speaker = "イクシリオン"
# 「魔将になりたかったのも、本当は過激でムフフな本を読みたかったからなのです。決して使命感とかではありません！」
line = "「魔将になりたかったのも、本当は過激でムフフな本を読みたかったからなのです。決して使命感とかではありません！」"

[[dialogue]]
speaker = "イクシリオン"
# 「カティアさんを見て思い知りました。自分に正直にならなければ、欲しいものなど手に入らないのだと！　あと、おへそがベリーグッドですっ！」
line = "「カティアさんを見て思い知りました。自分に正直にならなければ、欲しいものなど手に入らないのだと！　あと、おへそがベリーグッドですっ！」"

[[dialogue]]
speaker = "カティア"
# 「それさっき聞いた！　何度も言わなくていいから！」
line = "「それさっき聞いた！　何度も言わなくていいから！」"

[[dialogue]]
speaker = "イクシリオン"
# 「──！　リィベルさんから預かった魔本が光っている……？」
line = "「──！　リィベルさんから預かった魔本が光っている……？」"

[[dialogue]]
speaker = "リィベル"
# 『もう言うまでもないでしょう。魔本があなたを認めたの。後は手を伸ばすだけよ』
line = "『もう言うまでもないでしょう。魔本があなたを認めたの。後は手を伸ばすだけよ』"

[[dialogue]]
speaker = "イクシリオン"
# 「はい！　『色欲』の魔本よ……禁忌禁断のムフフをどうか私に授けて！」
line = "「はい！　『色欲』の魔本よ……禁忌禁断のムフフをどうか私に授けて！」"

[[dialogue]]
speaker = "unk"
# イクシリオンが持つ魔本の光が強くなり、ピンク色の波動がイクシリオンを包む。
line = "イクシリオンが持つ魔本の光が強くなり、ピンク色の波動がイクシリオンを包む。"

[[dialogue]]
speaker = "イクシリオン"
# 「ああ、覚えがあります……肌色が多い漫画を書店で見かけた時、手を伸ばしかけてやめたことを」
line = "「ああ、覚えがあります……肌色が多い漫画を書店で見かけた時、手を伸ばしかけてやめたことを」"

[[dialogue]]
speaker = "イクシリオン"
# 「きっと誰しも経験があるでしょう。『これ読んでるのバレたらエッチなやつだと思われるのでは』──と」
line = "「きっと誰しも経験があるでしょう。『これ読んでるのバレたらエッチなやつだと思われるのでは』──と」"

[[dialogue]]
speaker = "イクシリオン"
# 「そのせいでネットをよく利用するようになりました。でもこの手で直接取らなければ、手に入らないものもあるのです！」
line = "「そのせいでネットをよく利用するようになりました。でもこの手で直接取らなければ、手に入らないものもあるのです！」"

