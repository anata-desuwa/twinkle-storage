speaker = "イクシリオン"
# 「申し訳ありません、アルモタヘル様、私は罪を背負って堕ちます。《命脈》を崇拝する私が愛欲に耽るなんて、あってはならないことだと理解していますが──」
line = "「申し訳ありません、アルモタヘル様、私は罪を背負って堕ちます。《命脈》を崇拝する私が愛欲に耽るなんて、あってはならないことだと理解していますが──」"

[[dialogue]]
speaker = "イクシリオン"
# 「だからこそ気持ちイイですよね<emoji=heart04>」
line = "「だからこそ気持ちイイですよね<emoji=heart04>」"

[[dialogue]]
