[[dialogue]]
speaker = "unk"
# 第４話,完璧で究極のギガンドム,P
line = "第４話,完璧で究極のギガンドム,P"

[[dialogue]]
speaker = "シュティレ"
# 「──祝。サイコギガンドムのプラモデル、入手いたしました！」
line = "「──祝。サイコギガンドムのプラモデル、入手いたしました！」"

[[dialogue]]
speaker = "シュティレ"
# 「惜しむらくは、私の予約した１点しか手に入らなかったことですが……」
line = "「惜しむらくは、私の予約した１点しか手に入らなかったことですが……」"

[[dialogue]]
speaker = "unk"
# シュティレの愛が届いたな
line = "シュティレの愛が届いたな"

[[dialogue]]
speaker = "シュティレ"
# 「ええ。予約抽選は、１０倍以上の倍率だったそうです。今後、どこかで再販もされるとは思います」
line = "「ええ。予約抽選は、１０倍以上の倍率だったそうです。今後、どこかで再販もされるとは思います」"

[[dialogue]]
speaker = "シュティレ"
# 「ですが最新型ギガンドムを入手できたのは、会長がアルバイトを紹介してくれたおかげでもあります」
line = "「ですが最新型ギガンドムを入手できたのは、会長がアルバイトを紹介してくれたおかげでもあります」"

[[dialogue]]
speaker = "シュティレ"
# 「いかがでしょう。このプラモデル、２人で一緒に組み立てませんか？」
line = "「いかがでしょう。このプラモデル、２人で一緒に組み立てませんか？」"

[[dialogue]]
speaker = "unk"
# いいのか？　楽しみにしてたんじゃ……
line = "いいのか？　楽しみにしてたんじゃ……"

[[dialogue]]
speaker = "シュティレ"
# 「喜びと幸せは、分かち合ってこそ。それが不動家の教えです」
line = "「喜びと幸せは、分かち合ってこそ。それが不動家の教えです」"

[[dialogue]]
speaker = "シュティレ"
# 「それにファーストギガンドム第２４話でも、似たような教訓があるでしょう。ここで独り占めしては、ギガンドムに叱られてしまいます」
line = "「それにファーストギガンドム第２４話でも、似たような教訓があるでしょう。ここで独り占めしては、ギガンドムに叱られてしまいます」"

[[dialogue]]
speaker = "シュティレ"
# 「ニッパーやヤスリなど、工具はすべて２人分用意してあります。遠慮はいりませんよ」
line = "「ニッパーやヤスリなど、工具はすべて２人分用意してあります。遠慮はいりませんよ」"

[[dialogue]]
speaker = "unk"
# そういうことなら！
line = "そういうことなら！"

[[dialogue]]
speaker = "シュティレ"
# 「ふふふ。彼ピと初の共同作業ですね。楽しみです」
line = "「ふふふ。彼ピと初の共同作業ですね。楽しみです」"

[[dialogue]]
speaker = "シュティレ"
# 「そうです、各パーツは少し離れたところを切り落として……驚きです。会長、かなり手馴れていますね」
line = "「そうです、各パーツは少し離れたところを切り落として……驚きです。会長、かなり手馴れていますね」"

[[dialogue]]
speaker = "unk"
# 模型店でアルバイトしてたから
line = "模型店でアルバイトしてたから"

[[dialogue]]
speaker = "シュティレ"
# 「流石です。腕に覚えのある者が２人。きっと素晴らしいギガンドムが完成することでしょう」
line = "「流石です。腕に覚えのある者が２人。きっと素晴らしいギガンドムが完成することでしょう」"

[[dialogue]]
speaker = "シュティレ"
# 「シュティレはまず、脚部から組み立てます。会長は腕の方をお願いできますか？」
line = "「シュティレはまず、脚部から組み立てます。会長は腕の方をお願いできますか？」"

[[dialogue]]
speaker = "unk"
# 了解だ！
line = "了解だ！"

[[dialogue]]
speaker = "unk"
# プラモデルを作るだなんて、いつ以来だろう──それこそ模型店のアルバイトをやめてからご無沙汰だった。
line = "プラモデルを作るだなんて、いつ以来だろう──それこそ模型店のアルバイトをやめてからご無沙汰だった。"

[[dialogue]]
speaker = "unk"
# パーツを丁寧に切り取り、シュティレとお互いに進捗を見せあいながら、作業を進めていく。
line = "パーツを丁寧に切り取り、シュティレとお互いに進捗を見せあいながら、作業を進めていく。"

[[dialogue]]
speaker = "unk"
# それはまるで、ジグソーパズルを少しずつ埋めていくような──とても穏やかで楽しいひと時だった。
line = "それはまるで、ジグソーパズルを少しずつ埋めていくような──とても穏やかで楽しいひと時だった。"

[[dialogue]]
speaker = "unk"
# そうして、陽が傾き始めた頃──
line = "そうして、陽が傾き始めた頃──"

[[dialogue]]
speaker = "シュティレ"
# 「よし……最後のサブアーム、装着完了……！」
line = "「よし……最後のサブアーム、装着完了……！」"

[[dialogue]]
speaker = "シュティレ"
# 「完成しました、会長！　ぶいっ」
line = "「完成しました、会長！　ぶいっ」"

[[dialogue]]
speaker = "unk"
# か、かっこよすぎる……！！
line = "か、かっこよすぎる……！！"

[[dialogue]]
speaker = "シュティレ"
# 「ええ。アニメで見たサイコギガンドム……惚れ惚れするディテールです……夕陽を反射して、実に映える機体となりました……！」
line = "「ええ。アニメで見たサイコギガンドム……惚れ惚れするディテールです……夕陽を反射して、実に映える機体となりました……！」"

[[dialogue]]
speaker = "シュティレ"
# 「さっそく撮影しなくては──」
line = "「さっそく撮影しなくては──」"

[[dialogue]]
speaker = "unk"
# シュティレはぴょんぴょんはしゃぎながら、あらゆる角度でサイコギガンドムを撮影していく。
line = "シュティレはぴょんぴょんはしゃぎながら、あらゆる角度でサイコギガンドムを撮影していく。"

[[dialogue]]
speaker = "unk"
# 自撮りが趣味なだけあって、シュティレの切り取るギガンドムは、写真に収めることでさらにかっこよさを増しているように見えた。
line = "自撮りが趣味なだけあって、シュティレの切り取るギガンドムは、写真に収めることでさらにかっこよさを増しているように見えた。"

[[dialogue]]
speaker = "シュティレ"
# 「……会長、今日は本当にありがとうございました」
line = "「……会長、今日は本当にありがとうございました」"

[[dialogue]]
speaker = "シュティレ"
# 「その、すごく……すごくすごく、楽しかったです」
line = "「その、すごく……すごくすごく、楽しかったです」"

[[dialogue]]
speaker = "シュティレ"
# 「ロボットアニメや模型製作……同好の士が周りにいないので、シュティレはいつも１人で遊んでいました」
line = "「ロボットアニメや模型製作……同好の士が周りにいないので、シュティレはいつも１人で遊んでいました」"

[[dialogue]]
speaker = "シュティレ"
# 「もちろん楽しんではいました。疑問を持ったこともありませんでした。でも──」
line = "「もちろん楽しんではいました。疑問を持ったこともありませんでした。でも──」"

[[dialogue]]
speaker = "シュティレ"
# 「誰かと一緒に趣味の時間を過ごすことが、こんなにも素敵だなんて。今日は、本当に最高でした」
line = "「誰かと一緒に趣味の時間を過ごすことが、こんなにも素敵だなんて。今日は、本当に最高でした」"

[[dialogue]]
speaker = "シュティレ"
# 「好きな人と趣味の時間を共に過ごせて、ハッピーです」
line = "「好きな人と趣味の時間を共に過ごせて、ハッピーです」"

[[dialogue]]
speaker = "unk"
# また、やろう
line = "また、やろう"

[[dialogue]]
speaker = "unk"
# 俺も最高に楽しかったよ
line = "俺も最高に楽しかったよ"

[[dialogue]]
speaker = "シュティレ"
# 「はい……！　あ、そうです。機体の撮影だけでは、片手落ちというもの──」
line = "「はい……！　あ、そうです。機体の撮影だけでは、片手落ちというもの──」"

[[dialogue]]
speaker = "シュティレ"
# 「シュティレと並んで、ＤＩＳＣへ目線をお願いします。背景にギガンドムを収めて……」
line = "「シュティレと並んで、ＤＩＳＣへ目線をお願いします。背景にギガンドムを収めて……」"

[[dialogue]]
speaker = "unk"
# ポーズは、いつものアレだな
line = "ポーズは、いつものアレだな"

[[dialogue]]
speaker = "シュティレ"
# 「ええ。準備は良いですか？」
line = "「ええ。準備は良いですか？」"

[[dialogue]]
speaker = "シュティレ"
# 「では──２人の合作。完璧で究極のギガンドムと、大好きな会長と一緒に──」
line = "「では──２人の合作。完璧で究極のギガンドムと、大好きな会長と一緒に──」"

[[dialogue]]
speaker = "シュティレ"
# 「……ぶいっ♪」
line = "「……ぶいっ♪」"

[[dialogue]]
speaker = "unk"
# こうして撮影された１枚は、その日以降、俺とシュティレのＤＩＳＣの待ち受け画面になるのだった──
line = "こうして撮影された１枚は、その日以降、俺とシュティレのＤＩＳＣの待ち受け画面になるのだった──"
