[[dialogue]]
speaker = "unk"
# 第４話,３年生の悩み相談,P
line = "第４話,３年生の悩み相談,P"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースの一行が元の世界へと帰る前日――
line = "流星クルセイダースの一行が元の世界へと帰る前日――"

[[dialogue]]
speaker = "unk"
# リアは今回の滞在で親しくなった寮長２人を訪ねていた。
line = "リアは今回の滞在で親しくなった寮長２人を訪ねていた。"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「――そうですの……明日にはもう帰ってしまいますのね……」
line = "「――そうですの……明日にはもう帰ってしまいますのね……」"

[[dialogue]]
speaker = "リア"
# 「うん、そうなんだ。だから、帰る前に２人と話しておきたいなって思って……」
line = "「うん、そうなんだ。だから、帰る前に２人と話しておきたいなって思って……」"

[[dialogue]]
speaker = "マハムート"
# 「リア、あなた……」
line = "「リア、あなた……」"

[[dialogue]]
speaker = "マハムート"
# 「私たちに、何か相談したいことがあるんじゃない？」
line = "「私たちに、何か相談したいことがあるんじゃない？」"

[[dialogue]]
speaker = "リア"
# 「え？」
line = "「え？」"

[[dialogue]]
speaker = "マハムート"
# 「あなた、私のところへ相談に来る寮生と、同じ顔をしているわよ」
line = "「あなた、私のところへ相談に来る寮生と、同じ顔をしているわよ」"

[[dialogue]]
speaker = "リア"
# 「すごい……わかっちゃうんだ」
line = "「すごい……わかっちゃうんだ」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「さすがマムですわね♪　マムには、私もよく相談に乗って頂いてますの」
line = "「さすがマムですわね♪　マムには、私もよく相談に乗って頂いてますの」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ですから、リア。もし悩んでいることがあるなら、話してみると気持ちが楽になるかもしれませんわよ？」
line = "「ですから、リア。もし悩んでいることがあるなら、話してみると気持ちが楽になるかもしれませんわよ？」"

[[dialogue]]
speaker = "リア"
# 「……うん」
line = "「……うん」"

[[dialogue]]
speaker = "リア"
# 「あのね、実は私……向こうの世界で、もうすぐ学園を卒業する時期なんだ」
line = "「あのね、実は私……向こうの世界で、もうすぐ学園を卒業する時期なんだ」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「……！　そうでしたのね……」
line = "「……！　そうでしたのね……」"

[[dialogue]]
speaker = "リア"
# 「それで私は、進学するのが決まっているんだけど……」
line = "「それで私は、進学するのが決まっているんだけど……」"

[[dialogue]]
speaker = "リア"
# 「なんとなく、この先どういう将来を歩めばいいのか、不安で……」
line = "「なんとなく、この先どういう将来を歩めばいいのか、不安で……」"

[[dialogue]]
speaker = "リア"
# 「……私ね、本当は――」
line = "「……私ね、本当は――」"

[[dialogue]]
speaker = "リア"
# 「流星学園を、まだ卒業したくないって気持ちがあるんだ……」
line = "「流星学園を、まだ卒業したくないって気持ちがあるんだ……」"

[[dialogue]]
speaker = "リア"
# 「向こうの生徒会では、私だけ３年生で……どうして私だけ１年早く生まれたんだろうって、そんなことも考えちゃったりして……」
line = "「向こうの生徒会では、私だけ３年生で……どうして私だけ１年早く生まれたんだろうって、そんなことも考えちゃったりして……」"

[[dialogue]]
speaker = "リア"
# 「２人も３年生でしょ？　だから……２人は学園を卒業したら、その先どうするのかなって聞いてみたかったんだ」
line = "「２人も３年生でしょ？　だから……２人は学園を卒業したら、その先どうするのかなって聞いてみたかったんだ」"

[[dialogue]]
speaker = "マハムート"
# 「……なるほどね」
line = "「……なるほどね」"

[[dialogue]]
speaker = "マハムート"
# 「私は、妃竜院家の次期当主として、魔界にある本家へ戻るつもりよ」
line = "「私は、妃竜院家の次期当主として、魔界にある本家へ戻るつもりよ」"

[[dialogue]]
speaker = "リア"
# 「そっか……私のお姉ちゃんと同じ感じだね……」
line = "「そっか……私のお姉ちゃんと同じ感じだね……」"

[[dialogue]]
speaker = "マハムート"
# 「そして、くだらない身内の権力争いを、さっさと終わらせる」
line = "「そして、くだらない身内の権力争いを、さっさと終わらせる」"

[[dialogue]]
speaker = "リア"
# 「あ～……そういうのがあるんだ……」
line = "「あ～……そういうのがあるんだ……」"

[[dialogue]]
speaker = "マハムート"
# 「面倒なことにね。でも、それが終わって、私が当主になったら――」
line = "「面倒なことにね。でも、それが終わって、私が当主になったら――」"

[[dialogue]]
speaker = "マハムート"
# 「魔界に、学園都市を作るわ」
line = "「魔界に、学園都市を作るわ」"

[[dialogue]]
speaker = "リア"
# 「えっ、学園都市……？」
line = "「えっ、学園都市……？」"

[[dialogue]]
speaker = "マハムート"
# 「そう。魔界を人間界のように発展させるために、魔族の子たちが集まって知識を学べる……そんな都市規模の教育機関をね」
line = "「そう。魔界を人間界のように発展させるために、魔族の子たちが集まって知識を学べる……そんな都市規模の教育機関をね」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ふふっ、つまりはマムも『学園が好き』ということですわね♪」
line = "「ふふっ、つまりはマムも『学園が好き』ということですわね♪」"

[[dialogue]]
speaker = "マハムート"
# 「……学園寮の寮長をやっているのに、嫌いなわけないでしょう？」
line = "「……学園寮の寮長をやっているのに、嫌いなわけないでしょう？」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ちなみに私は、卒業後も星力が続く限り、最強の星騎士を目指して走り続けますわ♪♪」
line = "「ちなみに私は、卒業後も星力が続く限り、最強の星騎士を目指して走り続けますわ♪♪」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「そして、学園のＯＧとして、後輩たちの為にできることは喜んで協力致しましてよ♪」
line = "「そして、学園のＯＧとして、後輩たちの為にできることは喜んで協力致しましてよ♪」"

[[dialogue]]
speaker = "リア"
# 「そっか……２人共、卒業しても学園と関わり続けるんだね」
line = "「そっか……２人共、卒業しても学園と関わり続けるんだね」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ええ。ですからリア、卒業は必ずしも『終わり』ではありませんのよ」
line = "「ええ。ですからリア、卒業は必ずしも『終わり』ではありませんのよ」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「もしもリアが、学園を好きだというのならば、そこへ関わる為の道を選べばいいのですわ」
line = "「もしもリアが、学園を好きだというのならば、そこへ関わる為の道を選べばいいのですわ」"

[[dialogue]]
speaker = "マハムート"
# 「幸い、そっちの世界でも、九浄家は学園を運営しているようだしね」
line = "「幸い、そっちの世界でも、九浄家は学園を運営しているようだしね」"

[[dialogue]]
speaker = "リア"
# 「そっか……優秀なお姉ちゃんが理事長だし、私にできることはあるのかなって思っちゃってたけど……」
line = "「そっか……優秀なお姉ちゃんが理事長だし、私にできることはあるのかなって思っちゃってたけど……」"

[[dialogue]]
speaker = "リア"
# 「……うん。そうだよね。好きなら、諦めずに挑戦してみなくちゃ」
line = "「……うん。そうだよね。好きなら、諦めずに挑戦してみなくちゃ」"

[[dialogue]]
speaker = "リア"
# 「私、向こうの世界に帰ったら、お姉ちゃんに自分の気持ちを話してみるよ」
line = "「私、向こうの世界に帰ったら、お姉ちゃんに自分の気持ちを話してみるよ」"

[[dialogue]]
speaker = "リア"
# 「私も、大好きな学園と関わり続けたいから」
line = "「私も、大好きな学園と関わり続けたいから」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ふふっ、私たち、やはり気の合う仲ですわね♪」
line = "「ふふっ、私たち、やはり気の合う仲ですわね♪」"

[[dialogue]]
speaker = "マハムート"
# 「困ったことがあれば、また相談なさい」
line = "「困ったことがあれば、また相談なさい」"

[[dialogue]]
speaker = "リア"
# 「ありがとう、２人とも。またこの世界に来れるかわからないのが、ちょっと寂しいけど……」
line = "「ありがとう、２人とも。またこの世界に来れるかわからないのが、ちょっと寂しいけど……」"

[[dialogue]]
speaker = "マハムート"
# 「……今回来たのは初めてじゃなくて、これで２度目なんでしょう？」
line = "「……今回来たのは初めてじゃなくて、これで２度目なんでしょう？」"

[[dialogue]]
speaker = "マハムート"
# 「だったら、２度と会えないなんてことはないでしょ」
line = "「だったら、２度と会えないなんてことはないでしょ」"

[[dialogue]]
speaker = "マハムート"
# 「少なくとも――あなたがそう思っていればね」
line = "「少なくとも――あなたがそう思っていればね」"

[[dialogue]]
speaker = "リア"
# 「マムちゃん……！」
line = "「マムちゃん……！」"

[[dialogue]]
speaker = "マハムート"
# 「ちょっ、なにいきなり抱き着いてるのよ……！」
line = "「ちょっ、なにいきなり抱き着いてるのよ……！」"

[[dialogue]]
speaker = "リア"
# 「マムちゃんって、すごくいい子だね……！」
line = "「マムちゃんって、すごくいい子だね……！」"

[[dialogue]]
speaker = "マハムート"
# 「はあ！？　なに言ってるのよ、もう……」
line = "「はあ！？　なに言ってるのよ、もう……」"

[[dialogue]]
speaker = "unk"
# マハムートは、ふっと口元を緩め、リアの背中をポンと叩く。
line = "マハムートは、ふっと口元を緩め、リアの背中をポンと叩く。"

[[dialogue]]
speaker = "マハムート"
# 「やれやれ、仕方のない子ね……」
line = "「やれやれ、仕方のない子ね……」"

[[dialogue]]
speaker = "リア"
# 「ヒルディーちゃんも、ありがとう！」
line = "「ヒルディーちゃんも、ありがとう！」"

[[dialogue]]
speaker = "unk"
# リアはヒルディオーネとも抱擁を交わす。
line = "リアはヒルディオーネとも抱擁を交わす。"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ええ。リア、また会えると、私も信じておりますわ」
line = "「ええ。リア、また会えると、私も信じておりますわ」"

[[dialogue]]
speaker = "リア"
# 「うん……！」
line = "「うん……！」"

[[dialogue]]
speaker = "unk"
# その日の夜。
line = "その日の夜。"

[[dialogue]]
speaker = "リア"
# 「――これでよしっと♪」
line = "「――これでよしっと♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「あら？　リアお姉ちゃん、また絵日記を書いてたの？」
line = "「あら？　リアお姉ちゃん、また絵日記を書いてたの？」"

[[dialogue]]
speaker = "リア"
# 「うん、そうなの♪」
line = "「うん、そうなの♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「？　この絵ってなに？」
line = "「？　この絵ってなに？」"

[[dialogue]]
speaker = "リア"
# 「これは、ヒルディーちゃんとマムちゃんと、私だよ♪」
line = "「これは、ヒルディーちゃんとマムちゃんと、私だよ♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ふ～ん、なんだかよくわからないけど……とっても仲良そうで、素敵な絵ね♪」
line = "「ふ～ん、なんだかよくわからないけど……とっても仲良そうで、素敵な絵ね♪」"

[[dialogue]]
speaker = "リア"
# 「えっへん♪　自信作なの♪」
line = "「えっへん♪　自信作なの♪」"

[[dialogue]]
speaker = "unk"
# そう言ってリアは、自分の描いた絵を見つめながら微笑むのだった。
line = "そう言ってリアは、自分の描いた絵を見つめながら微笑むのだった。"
