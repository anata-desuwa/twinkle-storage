[[dialogue]]
speaker = "unk"
# 第３話,『附属生としての新生活』,B
line = "第３話,『附属生としての新生活』,B"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「いよいよ、だな……」
line = "「いよいよ、だな……」"

[[dialogue]]
speaker = "unk"
# これから学園生活を送ることになる教室の前に立って、大きく深呼吸する。
line = "これから学園生活を送ることになる教室の前に立って、大きく深呼吸する。"

[[dialogue]]
speaker = "unk"
# ちなみに、ルヴィネはオオヒメとは別のクラスの転入となっており、頼ることはできない。
line = "ちなみに、ルヴィネはオオヒメとは別のクラスの転入となっており、頼ることはできない。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （いよいよここから私の学園生活が始まるのか）
line = "（いよいよここから私の学園生活が始まるのか）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （私にとって初めての経験──）
line = "（私にとって初めての経験──）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （守護天使として恥ずかしくないよう、上手く立ち回るために予習をしてきた……完璧に！）
line = "（守護天使として恥ずかしくないよう、上手く立ち回るために予習をしてきた……完璧に！）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （学園生活恐るるに足らず、いざ！）
line = "（学園生活恐るるに足らず、いざ！）"

[[dialogue]]
speaker = "unk"
# オオヒメは先生の後に続いて教室に入る。
line = "オオヒメは先生の後に続いて教室に入る。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （さて……ここが最初の関門、自己紹介だが……）
line = "（さて……ここが最初の関門、自己紹介だが……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （接しやすい印象を与えるために、１番大事なのは笑顔だ）
line = "（接しやすい印象を与えるために、１番大事なのは笑顔だ）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （声が小さかったり、聞き取りづらかったりしてはいけない。歯切れの良い明朗な挨拶をする）
line = "（声が小さかったり、聞き取りづらかったりしてはいけない。歯切れの良い明朗な挨拶をする）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （そして内容……必要以上に自分語りをしてはいけない。だが、あまりに無個性な自己紹介になってしまってもいけない）
line = "（そして内容……必要以上に自分語りをしてはいけない。だが、あまりに無個性な自己紹介になってしまってもいけない）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （なぜならその後の会話の糸口が無くなってしまうからだ）
line = "（なぜならその後の会話の糸口が無くなってしまうからだ）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （会話の糸口が無ければ、クラスメイト達は私に話しかけづらくなってしまう）
line = "（会話の糸口が無ければ、クラスメイト達は私に話しかけづらくなってしまう）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （結果、１人ぼっちの寂しい自由時間を過ごすという未来が待っているわけだ。そのような愚を犯してはならない）
line = "（結果、１人ぼっちの寂しい自由時間を過ごすという未来が待っているわけだ。そのような愚を犯してはならない）"

[[dialogue]]
speaker = "先生"
# 「ではオオヒメさん。自己紹介をお願いします」
line = "「ではオオヒメさん。自己紹介をお願いします」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「うむ……私はオオヒメ。このような姿をしているが、この世界の摂理を司る守護天使の１柱である」
line = "「うむ……私はオオヒメ。このような姿をしているが、この世界の摂理を司る守護天使の１柱である」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「芸術や芸能の分野に特に関心を持っている。特にお笑いが好きだ。古典的な落語から、現代の芸人たちの披露するコントまで」
line = "「芸術や芸能の分野に特に関心を持っている。特にお笑いが好きだ。古典的な落語から、現代の芸人たちの披露するコントまで」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「同じ趣味の者がいれば、是非語り合いたいと思っている。どうぞよろしくお願いします」
line = "「同じ趣味の者がいれば、是非語り合いたいと思っている。どうぞよろしくお願いします」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （……キマった。長すぎず短すぎず、的確に自身のことを伝えきった。これで私の学園生活は好スタートを切ることが出来るだろう）
line = "（……キマった。長すぎず短すぎず、的確に自身のことを伝えきった。これで私の学園生活は好スタートを切ることが出来るだろう）"

[[dialogue]]
speaker = "先生"
# 「ありがとうございます。では、オオヒメさん、席についてください」
line = "「ありがとうございます。では、オオヒメさん、席についてください」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「私の席は、あちらの席で良いのだな？」
line = "「私の席は、あちらの席で良いのだな？」"

[[dialogue]]
speaker = "unk"
# 後列の窓際寄りに空席があった。
line = "後列の窓際寄りに空席があった。"

[[dialogue]]
speaker = "unk"
# そこが自分に割り当てられた席だと判断し、オオヒメはそこに向かって歩いていく。
line = "そこが自分に割り当てられた席だと判断し、オオヒメはそこに向かって歩いていく。"

[[dialogue]]
speaker = "unk"
# しかし、自己紹介という大仕事を終えたオオヒメの中に、わずかな油断があった──
line = "しかし、自己紹介という大仕事を終えたオオヒメの中に、わずかな油断があった──"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ぐはっ！！！！！」
line = "「ぐはっ！！！！！」"

[[dialogue]]
speaker = "先生"
# 「お、オオヒメさん！？」
line = "「お、オオヒメさん！？」"

[[dialogue]]
speaker = "unk"
# 足がもつれて思いきり転んでしまっていた。
line = "足がもつれて思いきり転んでしまっていた。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "先生"
# 「あ、あの……大丈夫、ですか……オオヒメさん？」
line = "「あ、あの……大丈夫、ですか……オオヒメさん？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （うぅうううっ！！！　失敗した！　失敗した！　失敗したっ！　やらかしてしまったぁっ！！）
line = "（うぅうううっ！！！　失敗した！　失敗した！　失敗したっ！　やらかしてしまったぁっ！！）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （せっかく完璧に自己紹介を決めたというのに、なんというベタな失敗を！　<ruby=がりょうてんせい>画竜点睛</ruby>を欠くとはこのことだ！）
line = "（せっかく完璧に自己紹介を決めたというのに、なんというベタな失敗を！　<ruby>画竜点睛<rt>がりょうてんせい</rt></ruby>を欠くとはこのことだ！）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （これではもう『ドジっ子守護天使』という印象以外は吹き飛んでしまったに違いないっ！　くぅうううううっ！！！！）
line = "（これではもう『ドジっ子守護天使』という印象以外は吹き飛んでしまったに違いないっ！　くぅうううううっ！！！！）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （だが、いつまでも顔を伏せてはいられぬ。何事も無かったように立ち上がり席に向かうのだ）
line = "（だが、いつまでも顔を伏せてはいられぬ。何事も無かったように立ち上がり席に向かうのだ）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「大丈夫だ、心配には及ばない。皆も驚かせてしまい済まなかったな」
line = "「大丈夫だ、心配には及ばない。皆も驚かせてしまい済まなかったな」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ふっ……ふふ……」
line = "「ふっ……ふふ……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （消えて無くなりたいっ！！！！！）
line = "（消えて無くなりたいっ！！！！！）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （はぁ……もういやだ……今すぐ神殿に逃げ帰って扉の奥に閉じこもりたい……）
line = "（はぁ……もういやだ……今すぐ神殿に逃げ帰って扉の奥に閉じこもりたい……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （転んでしまったのは実は、皆に親しみを持ってもらうためのパフォーマンスだった、ということに出来ないだろうか？）
line = "（転んでしまったのは実は、皆に親しみを持ってもらうためのパフォーマンスだった、ということに出来ないだろうか？）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （いや、それはあまりに苦しい！　それに、そんな誤魔化しをしたところで何の意味があろうか……）
line = "（いや、それはあまりに苦しい！　それに、そんな誤魔化しをしたところで何の意味があろうか……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （こんな時……<b>彼ら</b>はどうしていたか……）
line = "（こんな時……<b>彼ら</b>はどうしていたか……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （学園生活を送るに当たって、私が調べた文献の<b>主人公</b>たちが取った行動……ここで私が取るべき最適解は……）
line = "（学園生活を送るに当たって、私が調べた文献の<b>主人公</b>たちが取った行動……ここで私が取るべき最適解は……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （────そうだ！　モブになるのだ！）
line = "（────そうだ！　モブになるのだ！）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （転校生ということで物珍しさから関心を持たれているが、数日もすればその熱も冷めてくるだろう）
line = "（転校生ということで物珍しさから関心を持たれているが、数日もすればその熱も冷めてくるだろう）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （これから２週間、私は決して目立たぬよう気配を消し、クラスのモブとなることに徹するのだ）
line = "（これから２週間、私は決して目立たぬよう気配を消し、クラスのモブとなることに徹するのだ）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （そうすれば今の私の失態も、皆の記憶から忘れられてゆくはず……）
line = "（そうすれば今の私の失態も、皆の記憶から忘れられてゆくはず……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （本来の目的を考えれば積極的に交流を持つべきところなのだが、これは不測の事態であるから仕方がない！）
line = "（本来の目的を考えれば積極的に交流を持つべきところなのだが、これは不測の事態であるから仕方がない！）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （私はモブ……私はモブ……何の特徴もないただの守護天使……）
line = "（私はモブ……私はモブ……何の特徴もないただの守護天使……）"

[[dialogue]]
speaker = "ナミエル"
# 「あの……」
line = "「あの……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ひゃいっ！？」
line = "「ひゃいっ！？」"

[[dialogue]]
speaker = "ナミエル"
# 「あ、すみません……急に声をかけてしまって……」
line = "「あ、すみません……急に声をかけてしまって……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「い、いや……少々考えごとをしていたのだ……。私のようなモブ守護天使に何か御用か？」
line = "「い、いや……少々考えごとをしていたのだ……。私のようなモブ守護天使に何か御用か？」"

[[dialogue]]
speaker = "ナミエル"
# 「先ほど転んだ時にどこか痛めたのではないかと心配になりまして……大丈夫でしたか？」
line = "「先ほど転んだ時にどこか痛めたのではないかと心配になりまして……大丈夫でしたか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ああ、大丈夫だ……どこも怪我はしていない……」
line = "「ああ、大丈夫だ……どこも怪我はしていない……」"

[[dialogue]]
speaker = "ナミエル"
# 「そうですか。なら安心です……」
line = "「そうですか。なら安心です……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「気遣い感謝する。あなたの名を教えてもらえるだろうか？」
line = "「気遣い感謝する。あなたの名を教えてもらえるだろうか？」"

[[dialogue]]
speaker = "ナミエル"
# 「ナミエル・クレシェンテと申します。よろしくお願いします、オオヒメ様」
line = "「ナミエル・クレシェンテと申します。よろしくお願いします、オオヒメ様」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （無様な姿をさらした私を笑うでもなく……それどころか心配をしてくれている……何と心優しい娘だろうか……）
line = "（無様な姿をさらした私を笑うでもなく……それどころか心配をしてくれている……何と心優しい娘だろうか……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （ナミエル・クレシェンテ……偶然、席が隣になった彼女があまりにも天使すぎるのだが！？　私はむしろ運がいいのかもしれない……）
line = "（ナミエル・クレシェンテ……偶然、席が隣になった彼女があまりにも天使すぎるのだが！？　私はむしろ運がいいのかもしれない……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （はっ……待て！？　モブとして気配を消して過ごそうと決めたばかりなのに、この展開はまるで……）
line = "（はっ……待て！？　モブとして気配を消して過ごそうと決めたばかりなのに、この展開はまるで……）"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# （主人公とヒロイン、運命の出会いではないか！　この場合、私はどう振る舞えばいいのだ？）
line = "（主人公とヒロイン、運命の出会いではないか！　この場合、私はどう振る舞えばいいのだ？）"

[[dialogue]]
speaker = "unk"
# 突然の状況に混乱するオオヒメ。とりあえず──
line = "突然の状況に混乱するオオヒメ。とりあえず──"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「クラスメイトなのだから私のことは気軽にヒメとでも呼んでくれ。まあ、私にはいささか可愛すぎる響きではあるが……」
line = "「クラスメイトなのだから私のことは気軽にヒメとでも呼んでくれ。まあ、私にはいささか可愛すぎる響きではあるが……」"

[[dialogue]]
speaker = "unk"
# 余所行きでない、いつもの自己紹介をしておくことにしたのだった。
line = "余所行きでない、いつもの自己紹介をしておくことにしたのだった。"
