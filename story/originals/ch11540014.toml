[[dialogue]]
speaker = "unk"
# 第４話,またいつか会いましょう,P
line = "第４話,またいつか会いましょう,P"

[[dialogue]]
speaker = "unk"
# クルセイダース一行が元の世界へと帰る、その前日。
line = "クルセイダース一行が元の世界へと帰る、その前日。"

[[dialogue]]
speaker = "unk"
# ２人のヘレナは、一緒に並んで街へと出かけていた。
line = "２人のヘレナは、一緒に並んで街へと出かけていた。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「聞いていた通り、こっちの世界は私たちの世界よりも技術が進んでるのね～」
line = "「聞いていた通り、こっちの世界は私たちの世界よりも技術が進んでるのね～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「映画もＣＧ技術がすごくて、テンションが上がっちゃったわ♪」
line = "「映画もＣＧ技術がすごくて、テンションが上がっちゃったわ♪」"

[[dialogue]]
speaker = "unk"
# 異世界のヘレナの希望で、２人は映画館へ行ってきたところだった。
line = "異世界のヘレナの希望で、２人は映画館へ行ってきたところだった。"

[[dialogue]]
speaker = "ヘレナ"
# 「どうやら、主演の『オジサマ』も気に入ったようだな」
line = "「どうやら、主演の『オジサマ』も気に入ったようだな」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そりゃあね！　まさか『テム・クリアーズ』がこっちにもいて、しかもあんなに渋いオジサマに進化してるなんて思わないじゃな～い♪」
line = "「そりゃあね！　まさか『テム・クリアーズ』がこっちにもいて、しかもあんなに渋いオジサマに進化してるなんて思わないじゃな～い♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「『ミッション・アンタッチャブル』シリーズも、こっちだと最終作……！　くぅ～、元星騎士とはいえ、力も使えないのにあのスタントは痺れるわ～<emoji=heart04>」
line = "「『ミッション・アンタッチャブル』シリーズも、こっちだと最終作……！　くぅ～、元星騎士とはいえ、力も使えないのにあのスタントは痺れるわ～<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ"
# 「こっちの洋画で気になるものがあれば、土産として好きなだけ買って、持って行くといい。金なら私がいくらでも出そう」
line = "「こっちの洋画で気になるものがあれば、土産として好きなだけ買って、持って行くといい。金なら私がいくらでも出そう」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ほんと！？　ヘレナちゃん、ありがと～！　大好き～♪」
line = "「ほんと！？　ヘレナちゃん、ありがと～！　大好き～♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふふっ、よいよい♪　金とはこういう時の為に使うものだ」
line = "「ふふっ、よいよい♪　金とはこういう時の為に使うものだ」"

[[dialogue]]
speaker = "unk"
# それから、異世界のヘレナが見たいという場所を巡っていく。
line = "それから、異世界のヘレナが見たいという場所を巡っていく。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――こっちの世界のことはリアから聞いていたけど、実際に見ると、やっぱり素敵ね」
line = "「――こっちの世界のことはリアから聞いていたけど、実際に見ると、やっぱり素敵ね」"

[[dialogue]]
speaker = "ヘレナ"
# 「それは、人間、天使、魔族の三種族が共に暮らしていることが……か？」
line = "「それは、人間、天使、魔族の三種族が共に暮らしていることが……か？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そう。もちろん、私たちの世界にはいない『モンスター』って存在がいるわけだし、大変なことも多いでしょうけど……」
line = "「そう。もちろん、私たちの世界にはいない『モンスター』って存在がいるわけだし、大変なことも多いでしょうけど……」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「それでも、三種族が手を取り合って一緒に暮らしているこの世界の在り方は、すごく素敵なものだって、私には思えるわ」
line = "「それでも、三種族が手を取り合って一緒に暮らしているこの世界の在り方は、すごく素敵なものだって、私には思えるわ」"

[[dialogue]]
speaker = "ヘレナ"
# 「そちらの世界では、天使や魔族は、一般に広く認知されているわけではないのだったな」
line = "「そちらの世界では、天使や魔族は、一般に広く認知されているわけではないのだったな」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ええ。少し前までは、私もそれでいいと思っていた。過去に三種族が争った結果、ルネアちゃんは世界を３つに分けたわけだし……」
line = "「ええ。少し前までは、私もそれでいいと思っていた。過去に三種族が争った結果、ルネアちゃんは世界を３つに分けたわけだし……」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「でもね、最近は……うちの世界の魔王、『シンちゃん』の姿を見ていて、考え方が変わったの」
line = "「でもね、最近は……うちの世界の魔王、『シンちゃん』の姿を見ていて、考え方が変わったの」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あの子を中心に、魔族や天使たちは仲良く手を取り合って、一緒に今を生きている」
line = "「あの子を中心に、魔族や天使たちは仲良く手を取り合って、一緒に今を生きている」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「それを見ていると、私たちの世界でも――この世界と同じように、三種族が手を取り合って共に発展していける未来があるんじゃないかって」
line = "「それを見ていると、私たちの世界でも――この世界と同じように、三種族が手を取り合って共に発展していける未来があるんじゃないかって」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「もちろん色々な問題があるでしょうけど……それでも」
line = "「もちろん色々な問題があるでしょうけど……それでも」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「こうして実際に存在している光景を見たら――やっぱり頑張ってみたくなっちゃうわよね」
line = "「こうして実際に存在している光景を見たら――やっぱり頑張ってみたくなっちゃうわよね」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「九浄家の当主として、三種族が一緒に暮らせる世界を作っていけるように」
line = "「九浄家の当主として、三種族が一緒に暮らせる世界を作っていけるように」"

[[dialogue]]
speaker = "ヘレナ"
# 「できるとも」
line = "「できるとも」"

[[dialogue]]
speaker = "ヘレナ"
# 「何故なら、私たちは魂の『鏡映し』。ならば――私にできて、そなたにできないことは何もないのだから」
line = "「何故なら、私たちは魂の『鏡映し』。ならば――私にできて、そなたにできないことは何もないのだから」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ……もう１人の自分にそう言ってもらえると、俄然やる気が湧いてくるわ♪」
line = "「ふふっ……もう１人の自分にそう言ってもらえると、俄然やる気が湧いてくるわ♪」"

[[dialogue]]
speaker = "unk"
# それから日が落ちるまで街を巡り、２人は学園へと戻ってきた。
line = "それから日が落ちるまで街を巡り、２人は学園へと戻ってきた。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あ～あ、もうちょっと色んなところ見て回りたかったけど、時間切れね」
line = "「あ～あ、もうちょっと色んなところ見て回りたかったけど、時間切れね」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――今日までありがとね、ヘレナちゃん。おかげで、すごく楽しかったわ♪」
line = "「――今日までありがとね、ヘレナちゃん。おかげで、すごく楽しかったわ♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「礼など不要だ」
line = "「礼など不要だ」"

[[dialogue]]
speaker = "ヘレナ"
# 「私とお前は双子の姉妹のようなもの……そうであろう？」
line = "「私とお前は双子の姉妹のようなもの……そうであろう？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ええ。短い間だったけど……本当の家族みたいに思ってるわ。だから――」
line = "「ええ。短い間だったけど……本当の家族みたいに思ってるわ。だから――」"

[[dialogue]]
speaker = "unk"
# 言葉の続きを紡ぐ前に、ヘレナはもう１人の自分へと歩み寄り――抱きしめる。
line = "言葉の続きを紡ぐ前に、ヘレナはもう１人の自分へと歩み寄り――抱きしめる。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「今回だけじゃなく、またいつか会いましょう」
line = "「今回だけじゃなく、またいつか会いましょう」"

[[dialogue]]
speaker = "ヘレナ"
# 「……ふふっ。それは、今日観た映画の台詞か？」
line = "「……ふふっ。それは、今日観た映画の台詞か？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そうね。言いたくなっちゃったの♪」
line = "「そうね。言いたくなっちゃったの♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「奇遇だな。私も同じことを、明日言うつもりだった」
line = "「奇遇だな。私も同じことを、明日言うつもりだった」"

[[dialogue]]
speaker = "unk"
# そう言って、こちらの世界のヘレナもまた、静かに抱きしめ返す。
line = "そう言って、こちらの世界のヘレナもまた、静かに抱きしめ返す。"

[[dialogue]]
speaker = "ヘレナ"
# 「鏡映しだからわかるのだ。明日、妹のリアの前でこういう姿を見せるのは――少し照れくさいのであろう？」
line = "「鏡映しだからわかるのだ。明日、妹のリアの前でこういう姿を見せるのは――少し照れくさいのであろう？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あはは♪　そりゃそうよ～。リアの前では、カッコいい大人のお姉さんでいたいもの♪」
line = "「あはは♪　そりゃそうよ～。リアの前では、カッコいい大人のお姉さんでいたいもの♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「ならば、普段のイタズラな振る舞いも、少しは自重した方がよいぞ？」
line = "「ならば、普段のイタズラな振る舞いも、少しは自重した方がよいぞ？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「は～い。善処しま～す♪　ふふっ♪」
line = "「は～い。善処しま～す♪　ふふっ♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「……帰ったら、今夜はもう少し酒でも飲みながら話すか？」
line = "「……帰ったら、今夜はもう少し酒でも飲みながら話すか？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「おっ、いいわね～♪　今夜はとことん語り明かしましょ♪」
line = "「おっ、いいわね～♪　今夜はとことん語り明かしましょ♪」"

[[dialogue]]
speaker = "unk"
# 肩を並べながら――２人のヘレナはゆっくりと、九浄家へと歩き出す。
line = "肩を並べながら――２人のヘレナはゆっくりと、九浄家へと歩き出す。"

[[dialogue]]
speaker = "unk"
# いつか再び出会う、その日を信じて。
line = "いつか再び出会う、その日を信じて。"
