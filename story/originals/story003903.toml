[[dialogue]]
speaker = "unk"
# 時は、少しだけ遡り──
line = "時は、少しだけ遡り──"

[[dialogue]]
speaker = "ヒマワリ"
# 「それにしても九浄家に潜入することになるとはね～」
line = "「それにしても九浄家に潜入することになるとはね～」"

[[dialogue]]
speaker = "ヒマワリ"
# 「今までで１番難しいミッションかも？　ミウ、何か気をつけた方がいいことってある？」
line = "「今までで１番難しいミッションかも？　ミウ、何か気をつけた方がいいことってある？」"

[[dialogue]]
speaker = "ミウ"
# 「情報が少ないから、わからないことだらけだよ。五名門のお屋敷だし、とりあえず監視や護衛は最高難易度を想定しといて」
line = "「情報が少ないから、わからないことだらけだよ。五名門のお屋敷だし、とりあえず監視や護衛は最高難易度を想定しといて」"

[[dialogue]]
speaker = "ミウ"
# 「あとお抱えの九浄家メイド隊は強敵かつ曲者揃いだから、戦闘はできるだけ避けたいかな。もし見つかっちゃったら、逃げの一手だからね」
line = "「あとお抱えの九浄家メイド隊は強敵かつ曲者揃いだから、戦闘はできるだけ避けたいかな。もし見つかっちゃったら、逃げの一手だからね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「つまり、マッピングも罠探知もされてないお屋敷の中を、即死級つよつよボスに出会わないように探索するってこと？　かなり無理ゲーっぽくなーい？」
line = "「つまり、マッピングも罠探知もされてないお屋敷の中を、即死級つよつよボスに出会わないように探索するってこと？　かなり無理ゲーっぽくなーい？」"

[[dialogue]]
speaker = "ミウ"
# 「そうだね、普通の人なら。でも、ヒマワリちゃんはクリアが難しいゲームほど楽しくなるタイプでしょ？」
line = "「そうだね、普通の人なら。でも、ヒマワリちゃんはクリアが難しいゲームほど楽しくなるタイプでしょ？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「へへっ、そうだねっ♪　それにミウなら勝ち目のない勝負には挑まないだろうし、対応できないことはないって感じなんでしょ？」
line = "「へへっ、そうだねっ♪　それにミウなら勝ち目のない勝負には挑まないだろうし、対応できないことはないって感じなんでしょ？」"

[[dialogue]]
speaker = "ミウ"
# 「そうだね。私たちなら大丈夫だって思ってるよ」
line = "「そうだね。私たちなら大丈夫だって思ってるよ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「よーし、やっちゃうぞーっ！」
line = "「よーし、やっちゃうぞーっ！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「九浄家の中庭に侵入成功」
line = "「九浄家の中庭に侵入成功」"

[[dialogue]]
speaker = "ミウ"
# 「半径２０ｍ内、動体反応なし。監視カメラや警備ドローンにも発見されてないよ」
line = "「半径２０ｍ内、動体反応なし。監視カメラや警備ドローンにも発見されてないよ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「順調、順調。このチーパオ、動きやすくていいねー。それにお揃いコーデだと、ザ・バディって感じでテンション上がる～♪」
line = "「順調、順調。このチーパオ、動きやすくていいねー。それにお揃いコーデだと、ザ・バディって感じでテンション上がる～♪」"

[[dialogue]]
speaker = "ミウ"
# 「身も心もギュッと引き締まる感じだよね──よし、この周辺の警備システムの無力化、成功したよ」
line = "「身も心もギュッと引き締まる感じだよね──よし、この周辺の警備システムの無力化、成功したよ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「もう！？　すごいね、ミウ、また腕上げたんじゃないの！？」
line = "「もう！？　すごいね、ミウ、また腕上げたんじゃないの！？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「でも、随分と簡単に潜入出来ちゃったね～、てっきりゲキヤバなビーム撃ってきたり、もっと手強いと思ってたのに」
line = "「でも、随分と簡単に潜入出来ちゃったね～、てっきりゲキヤバなビーム撃ってきたり、もっと手強いと思ってたのに」"

[[dialogue]]
speaker = "ヒマワリ"
# 「もしかしてあたしたち、ゴールデングースに入っていろんな修羅場を乗り越えてるうちに、めっちゃ強くなっちゃったのかも？」
line = "「もしかしてあたしたち、ゴールデングースに入っていろんな修羅場を乗り越えてるうちに、めっちゃ強くなっちゃったのかも？」"

[[dialogue]]
speaker = "ミウ"
# 「そうかな……そうかも？」
line = "「そうかな……そうかも？」"

[[dialogue]]
speaker = "ミウ"
# （でも、このセキュリティはいくらなんでも穴だらけすぎる……私たちじゃなくても、簡単に侵入できたんじゃないかな）
line = "（でも、このセキュリティはいくらなんでも穴だらけすぎる……私たちじゃなくても、簡単に侵入できたんじゃないかな）"

[[dialogue]]
speaker = "ミウ"
# （お屋敷まで目と鼻の先……まるで侵入者に対して、お膳立てでもしてくれてるみたいに……でも、だとしたら、何のために……？）
line = "（お屋敷まで目と鼻の先……まるで侵入者に対して、お膳立てでもしてくれてるみたいに……でも、だとしたら、何のために……？）"

[[dialogue]]
speaker = "ヒマワリ"
# 「ミウ？」
line = "「ミウ？」"

[[dialogue]]
speaker = "ミウ"
# 「あ──ごめんね、ヒマワリちゃん。ちょっと考えごとしてた。もしかしたら油断させておいて、急に難易度を上げてくる仕掛けかも、って」
line = "「あ──ごめんね、ヒマワリちゃん。ちょっと考えごとしてた。もしかしたら油断させておいて、急に難易度を上げてくる仕掛けかも、って」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あ～、よくあるパターンだね」
line = "「あ～、よくあるパターンだね」"

[[dialogue]]
speaker = "ミウ"
# 「特に九浄家メイド隊は要注意人物だらけだから、警戒は怠らないようにね」
line = "「特に九浄家メイド隊は要注意人物だらけだから、警戒は怠らないようにね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「うん、気を付けるよ。一番おっかないのが、メイド長の蘭美さんだよね？」
line = "「うん、気を付けるよ。一番おっかないのが、メイド長の蘭美さんだよね？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「それから閃さんに、せつなさんに、美鶴さん、他には──」
line = "「それから閃さんに、せつなさんに、美鶴さん、他には──」"

[[dialogue]]
speaker = "ヨミ"
# 「こやぁーん！？　私にも荷が重いです！　メイドのことならメイド長に聞くのが一番では──」
line = "「こやぁーん！？　私にも荷が重いです！　メイドのことならメイド長に聞くのが一番では──」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あの人は、ヨミさんだよね」
line = "「あの人は、ヨミさんだよね」"

[[dialogue]]
speaker = "ヨミ"
# 「ん？　そこの茂み、ちょっと動きませんでしたか？」
line = "「ん？　そこの茂み、ちょっと動きませんでしたか？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ぎくっ」
line = "「ぎくっ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そこにいらっしゃるのは──どなたですのっ！？」
line = "「そこにいらっしゃるのは──どなたですのっ！？」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃん、避けて！」
line = "「ヒマワリちゃん、避けて！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ひゃあっ！？　あ、危なかったぁ！」
line = "「ひゃあっ！？　あ、危なかったぁ！」"

[[dialogue]]
speaker = "ミウ"
# 「エルデリーゼ先輩……！？　桜十路のお嬢様が、どうして九浄家に……！？」
line = "「エルデリーゼ先輩……！？　桜十路のお嬢様が、どうして九浄家に……！？」"

[[dialogue]]
speaker = "美鶴"
# 「お、キャワワな子２名発見～。でもお忍びでお客様が来るなんて言ってたっけ？」
line = "「お、キャワワな子２名発見～。でもお忍びでお客様が来るなんて言ってたっけ？」"

[[dialogue]]
speaker = "ヨミ"
# 「特に聞いてないですよ！」
line = "「特に聞いてないですよ！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ということはやはり曲者ですのね！　私がひっ捕らえて差し上げますわ！」
line = "「ということはやはり曲者ですのね！　私がひっ捕らえて差し上げますわ！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ええっ！？　なんでエルゼ先輩がここに！？　しかもメイド服なんか着ちゃってるし！」
line = "「ええっ！？　なんでエルゼ先輩がここに！？　しかもメイド服なんか着ちゃってるし！」"

[[dialogue]]
speaker = "ミウ"
# 「エルデリーゼ先輩は『流星学園附属校、最強の矛』って言われる槍の名手……下手するとメイド隊よりも危険かもだよ？」
line = "「エルデリーゼ先輩は『流星学園附属校、最強の矛』って言われる槍の名手……下手するとメイド隊よりも危険かもだよ？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ここまでイージーモードだったけど、世の中そう上手くはいかないね……」
line = "「ここまでイージーモードだったけど、世の中そう上手くはいかないね……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ところでエルゼ先輩の着てるメイド服、あれってそういう事かな？」
line = "「ところでエルゼ先輩の着てるメイド服、あれってそういう事かな？」"

[[dialogue]]
speaker = "ミウ"
# 「そうだね。多分、あれが依頼人の言ってた新しく開発された人工戦闘服だと思う」
line = "「そうだね。多分、あれが依頼人の言ってた新しく開発された人工戦闘服だと思う」"
