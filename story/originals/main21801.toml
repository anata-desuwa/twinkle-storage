[[dialogue]]
speaker = "unk"
# 第１話,天使のお茶会,B
line = "第１話,天使のお茶会,B"

[[dialogue]]
speaker = "ケイティ"
# 「はい、お茶をどうぞ～。２人ともゆっくりしていってね」
line = "「はい、お茶をどうぞ～。２人ともゆっくりしていってね」"

[[dialogue]]
speaker = "メルエル"
# 「ありがとう、ケイティお姉ちゃん♪　えへへ、こうやって３人でお茶をするの、すっごく久しぶりかも！」
line = "「ありがとう、ケイティお姉ちゃん♪　えへへ、こうやって３人でお茶をするの、すっごく久しぶりかも！」"

[[dialogue]]
speaker = "ケイティ"
# 「そうだね～。メルエルちゃんが新星学園に入学してから、ずっとご無沙汰だったから」
line = "「そうだね～。メルエルちゃんが新星学園に入学してから、ずっとご無沙汰だったから」"

[[dialogue]]
speaker = "ケイティ"
# 「それにしても、訪ねてくれたのは２人だけ？　まだ後からお客さんが来るんだったら、準備をしておくけれど～」
line = "「それにしても、訪ねてくれたのは２人だけ？　まだ後からお客さんが来るんだったら、準備をしておくけれど～」"

[[dialogue]]
speaker = "ナターシャ"
# 「ううん、今回は私たちだけ。まぁ一応、ネビュラの魔女も同行してたんだけどさ」
line = "「ううん、今回は私たちだけ。まぁ一応、ネビュラの魔女も同行してたんだけどさ」"

[[dialogue]]
speaker = "メルエル"
# 「聖庭園でおもてなししますよって言ったんだけど……『世界樹の傍を離れるわけにはいきません』って言われちゃって」
line = "「聖庭園でおもてなししますよって言ったんだけど……『世界樹の傍を離れるわけにはいきません』って言われちゃって」"

[[dialogue]]
speaker = "unk"
# メルエルとナターシャは、先の天界襲撃の時と同様に、世界樹のうろを用いて天界へやってきた。
line = "メルエルとナターシャは、先の天界襲撃の時と同様に、世界樹のうろを用いて天界へやってきた。"

[[dialogue]]
speaker = "unk"
# その移動をサポートしてくれた魔女は現在、天界の世界樹のうろで待機している。
line = "その移動をサポートしてくれた魔女は現在、天界の世界樹のうろで待機している。"

[[dialogue]]
speaker = "ケイティ"
# 「あら。それじゃあ後でご挨拶に行かないと……でもまずは、可愛い妹分のおもてなしからかな～♪」
line = "「あら。それじゃあ後でご挨拶に行かないと……でもまずは、可愛い妹分のおもてなしからかな～♪」"

[[dialogue]]
speaker = "ケイティ"
# 「はい、ナターシャちゃんの分のお菓子も用意したから、いっぱい食べてね～♪　ふふふ♪」
line = "「はい、ナターシャちゃんの分のお菓子も用意したから、いっぱい食べてね～♪　ふふふ♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「ケイティ姉さん。食べる分は自分で取るからさ。そんなにたくさん皿に乗せなくていいってば……」
line = "「ケイティ姉さん。食べる分は自分で取るからさ。そんなにたくさん皿に乗せなくていいってば……」"

[[dialogue]]
speaker = "ケイティ"
# 「だーめ。ナターシャちゃん、いつも遠慮するんだもの。はい、どうぞ～♪　これも、これも、これもー♪」
line = "「だーめ。ナターシャちゃん、いつも遠慮するんだもの。はい、どうぞ～♪　これも、これも、これもー♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「……相変わらず強引なんだから。てゆーかすっごく自然にお茶会始まっちゃったけど、衛兵隊への指示はいいの？」
line = "「……相変わらず強引なんだから。てゆーかすっごく自然にお茶会始まっちゃったけど、衛兵隊への指示はいいの？」"

[[dialogue]]
speaker = "ケイティ"
# 「ちょうど休憩の時間だったから大丈夫だよ～」
line = "「ちょうど休憩の時間だったから大丈夫だよ～」"

[[dialogue]]
speaker = "ケイティ"
# 「この前は戦い続きでゆっくりお喋りもできなかったし、学園のこととか、たくさんお話を聞かせてね？」
line = "「この前は戦い続きでゆっくりお喋りもできなかったし、学園のこととか、たくさんお話を聞かせてね？」"

[[dialogue]]
speaker = "メルエル"
# 「うん！　──あっ、ナターシャちゃん。カップが空だね。お茶のお代わり、いる？」
line = "「うん！　──あっ、ナターシャちゃん。カップが空だね。お茶のお代わり、いる？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ううん。いらない。ありがと」
line = "「ううん。いらない。ありがと」"

[[dialogue]]
speaker = "メルエル"
# 「そ、そっかぁ。うん……」
line = "「そ、そっかぁ。うん……」"

[[dialogue]]
speaker = "ケイティ"
# 「…………？」
line = "「…………？」"

[[dialogue]]
speaker = "ナターシャ"
# 「──ケイティ姉さん？　どうかしたの」
line = "「──ケイティ姉さん？　どうかしたの」"

[[dialogue]]
speaker = "ケイティ"
# 「……２人とも、喧嘩でもしてるの？　なんだかいつもと雰囲気が違うような……」
line = "「……２人とも、喧嘩でもしてるの？　なんだかいつもと雰囲気が違うような……」"

[[dialogue]]
speaker = "メルエル"
# 「えっ。そ、そんなにわかりやすかった、かな……？」
line = "「えっ。そ、そんなにわかりやすかった、かな……？」"

[[dialogue]]
speaker = "ケイティ"
# 「伊達に２人のお姉ちゃんをやってないから～。それで原因は？　悪いことをしたら、ちゃんと謝らないとダメだよ～？」
line = "「伊達に２人のお姉ちゃんをやってないから～。それで原因は？　悪いことをしたら、ちゃんと謝らないとダメだよ～？」"

[[dialogue]]
speaker = "メルエル"
# 「え、えっと……そのぉ……」
line = "「え、えっと……そのぉ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「別に隠すようなことじゃないよ。ていうか、喧嘩もしてない。あるべきところに戻った、って感じ？」
line = "「別に隠すようなことじゃないよ。ていうか、喧嘩もしてない。あるべきところに戻った、って感じ？」"

[[dialogue]]
speaker = "ケイティ"
# 「んん？」
line = "「んん？」"

[[dialogue]]
speaker = "ナターシャ"
# 「──バレちゃったんだよね、この前の戦いで。メルエルがリガルタ様の娘で、魔王の血統だってことまで全部」
line = "「──バレちゃったんだよね、この前の戦いで。メルエルがリガルタ様の娘で、魔王の血統だってことまで全部」"

[[dialogue]]
speaker = "ケイティ"
# 「あ、あら……まあ……」
line = "「あ、あら……まあ……」"

[[dialogue]]
speaker = "メルエル"
# 「な、ナターシャちゃんっ！？　言っちゃって大丈夫なの……！？」
line = "「な、ナターシャちゃんっ！？　言っちゃって大丈夫なの……！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「構わないよ。ケイティ姉さんも知ってることだから」
line = "「構わないよ。ケイティ姉さんも知ってることだから」"

[[dialogue]]
speaker = "メルエル"
# 「ケイティお姉ちゃんも知ってる……そ、そうだったんだ。じゃあ、ナターシャちゃんの家族のことも……？」
line = "「ケイティお姉ちゃんも知ってる……そ、そうだったんだ。じゃあ、ナターシャちゃんの家族のことも……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そりゃそうでしょ。聖庭園直属の、衛兵隊長様だよ？　知らない方がおかしいってば」
line = "「そりゃそうでしょ。聖庭園直属の、衛兵隊長様だよ？　知らない方がおかしいってば」"

[[dialogue]]
speaker = "ケイティ"
# 「まあ、まあ。そんなことになって……だから２人とも、様子がおかしかったのね」
line = "「まあ、まあ。そんなことになって……だから２人とも、様子がおかしかったのね」"

[[dialogue]]
speaker = "メルエル"
# 「そ、そっかぁ。ケイティお姉ちゃんも知ってるんだ……。その、いつから……？」
line = "「そ、そっかぁ。ケイティお姉ちゃんも知ってるんだ……。その、いつから……？」"

[[dialogue]]
speaker = "ケイティ"
# 「初めて聞いたのは、衛兵隊に入る直前だったかな？　お父さまから、内密にと口止めをされて。メルエルちゃんの出自の秘密を聞いたの」
line = "「初めて聞いたのは、衛兵隊に入る直前だったかな？　お父さまから、内密にと口止めをされて。メルエルちゃんの出自の秘密を聞いたの」"

[[dialogue]]
speaker = "メルエル"
# 「そうだったんだ……」
line = "「そうだったんだ……」"

[[dialogue]]
speaker = "ケイティ"
# 「すごく驚いたな～、あの時は。まさか妹のように接してきた幼なじみが、魔王の血を引く人だったなんて、夢にも思わなかったから」
line = "「すごく驚いたな～、あの時は。まさか妹のように接してきた幼なじみが、魔王の血を引く人だったなんて、夢にも思わなかったから」"

[[dialogue]]
speaker = "ナターシャ"
# 「私は、メルエルの秘密を知った後の、ケイティ姉さんの自然さにも驚いたけどね」
line = "「私は、メルエルの秘密を知った後の、ケイティ姉さんの自然さにも驚いたけどね」"

[[dialogue]]
speaker = "ナターシャ"
# 「絶対に態度に出ると思ってたから。姉さん、隠し事とか苦手なタイプだし」
line = "「絶対に態度に出ると思ってたから。姉さん、隠し事とか苦手なタイプだし」"

[[dialogue]]
speaker = "ケイティ"
# 「うーん。だって急に魔王だなんて言われても～。私にとってメルエルちゃんは、小さい頃からよく知ってる、可愛い妹分でしかないし……」
line = "「うーん。だって急に魔王だなんて言われても～。私にとってメルエルちゃんは、小さい頃からよく知ってる、可愛い妹分でしかないし……」"

[[dialogue]]
speaker = "メルエル"
# 「ケイティお姉ちゃん……！」
line = "「ケイティお姉ちゃん……！」"

[[dialogue]]
speaker = "ケイティ"
# 「今まで知らないふりをしていたのは、ごめんね？　でもこれはメルエルちゃんの安全を守るためでもあったから、仕方なかったの」
line = "「今まで知らないふりをしていたのは、ごめんね？　でもこれはメルエルちゃんの安全を守るためでもあったから、仕方なかったの」"

[[dialogue]]
speaker = "ナターシャ"
# 「そういうこと。聖庭園も一枚岩じゃないからね。メルエルの正体が広く知られたら、何があるかわかったものじゃない」
line = "「そういうこと。聖庭園も一枚岩じゃないからね。メルエルの正体が広く知られたら、何があるかわかったものじゃない」"

[[dialogue]]
speaker = "メルエル"
# 「今さらだけど……そんなに私の出自って、秘密にしなきゃいけないことなの？」
line = "「今さらだけど……そんなに私の出自って、秘密にしなきゃいけないことなの？」"

[[dialogue]]
speaker = "ナターシャ"
# 「当然。聖庭園の政治がどんな形か──それくらいは知ってるでしょ？」
line = "「当然。聖庭園の政治がどんな形か──それくらいは知ってるでしょ？」"

[[dialogue]]
speaker = "メルエル"
# 「え、えっと……天界の<ruby=まつりごと>政</ruby>は、聖庭園の議会で決まるんだよね？」
line = "「え、えっと……天界の<ruby>政<rt>まつりごと</rt></ruby>は、聖庭園の議会で決まるんだよね？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そう。議会制の民主主義。リガルタ老を入れて全部で１２の議席と、いつくかの派閥に分かれてる」
line = "「そう。議会制の民主主義。リガルタ老を入れて全部で１２の議席と、いつくかの派閥に分かれてる」"

[[dialogue]]
speaker = "ケイティ"
# 「それぞれの派閥ごとに、スタンスが違うの。保守派に改革派……色々あって～」
line = "「それぞれの派閥ごとに、スタンスが違うの。保守派に改革派……色々あって～」"

[[dialogue]]
speaker = "ナターシャ"
# 「で、中には『魔王の血族による王政を復活させるべきだ』っていう派閥もある。うちの一族の後ろ盾がここだね」
line = "「で、中には『魔王の血族による王政を復活させるべきだ』っていう派閥もある。うちの一族の後ろ盾がここだね」"

[[dialogue]]
speaker = "メルエル"
# 「じゃあ、リガルタ様も……？」
line = "「じゃあ、リガルタ様も……？」"

[[dialogue]]
speaker = "ケイティ"
# 「そこは少しややこしくて……。リガルタ様個人は、天界の王政統治に反対の立場だったから」
line = "「そこは少しややこしくて……。リガルタ様個人は、天界の王政統治に反対の立場だったから」"

[[dialogue]]
speaker = "ケイティ"
# 「この世界の平和のために『天界の魔王』の力が必要になる、と考えていらっしゃったから、『魔王の血族』を残すことには注力されていたけれど……」
line = "「この世界の平和のために『天界の魔王』の力が必要になる、と考えていらっしゃったから、『魔王の血族』を残すことには注力されていたけれど……」"

[[dialogue]]
speaker = "ケイティ"
# 「ただ、リガルタ様ご本人のカリスマもあって、派閥の中で『天界の魔王を復権すべき』という論調が高まっていってしまったというか……」
line = "「ただ、リガルタ様ご本人のカリスマもあって、派閥の中で『天界の魔王を復権すべき』という論調が高まっていってしまったというか……」"

[[dialogue]]
speaker = "ナターシャ"
# 「長い年月の中で、魔王の血族の世話になった天使も多い。だけど同時に、２０００年前の災厄をもたらしたのも、間違いなく天界の魔王だった」
line = "「長い年月の中で、魔王の血族の世話になった天使も多い。だけど同時に、２０００年前の災厄をもたらしたのも、間違いなく天界の魔王だった」"

[[dialogue]]
speaker = "メルエル"
# 「『太陽の壁画』に描かれた事件……だったよね」
line = "「『太陽の壁画』に描かれた事件……だったよね」"

[[dialogue]]
speaker = "ナターシャ"
# 「そう。だから魔王による天界統治なんてとんでもないって派閥も、当然ある」
line = "「そう。だから魔王による天界統治なんてとんでもないって派閥も、当然ある」"

[[dialogue]]
speaker = "ナターシャ"
# 「その派閥と直接の関係は証明されていないけど、天界の魔王の命を狙う暗殺者組織もあった」
line = "「その派閥と直接の関係は証明されていないけど、天界の魔王の命を狙う暗殺者組織もあった」"

[[dialogue]]
speaker = "メルエル"
# 「あ、暗殺……！？」
line = "「あ、暗殺……！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「一旦壊滅させてはいるけど、この手の組織は定期的に登場するんだ」
line = "「一旦壊滅させてはいるけど、この手の組織は定期的に登場するんだ」"

[[dialogue]]
speaker = "ナターシャ"
# 「彼らにとっては、リガルタ老もその血族も、隙あらば亡き者にするべきターゲットだからね」
line = "「彼らにとっては、リガルタ老もその血族も、隙あらば亡き者にするべきターゲットだからね」"

[[dialogue]]
speaker = "ナターシャ"
# 「リガルタ老としては、自分の身は自分で守れるけど──」
line = "「リガルタ老としては、自分の身は自分で守れるけど──」"

[[dialogue]]
speaker = "ナターシャ"
# 「自分の後継者が、護衛も連れずにそこらへんをほっつき歩いてたら、たまったもんじゃないってワケ」
line = "「自分の後継者が、護衛も連れずにそこらへんをほっつき歩いてたら、たまったもんじゃないってワケ」"

[[dialogue]]
speaker = "ケイティ"
# 「まだ幼かったメルエルちゃんに重荷を背負わせたくないって気持ちも、あったんだと思うの……」
line = "「まだ幼かったメルエルちゃんに重荷を背負わせたくないって気持ちも、あったんだと思うの……」"

[[dialogue]]
speaker = "ケイティ"
# 「むしろ王政復権を成し遂げて、守りを固める選択肢もあったそうよ。でも結局、その選択肢は取られなかった」
line = "「むしろ王政復権を成し遂げて、守りを固める選択肢もあったそうよ。でも結局、その選択肢は取られなかった」"

[[dialogue]]
speaker = "ケイティ"
# 「だから、メルエルちゃんの正体はごく一部の人しか知らないトップシークレットになったの」
line = "「だから、メルエルちゃんの正体はごく一部の人しか知らないトップシークレットになったの」"

[[dialogue]]
speaker = "メルエル"
# （やっぱり私、ナターシャちゃんの言う通り、何にも知らずに生きてきたんだな──）
line = "（やっぱり私、ナターシャちゃんの言う通り、何にも知らずに生きてきたんだな──）"

[[dialogue]]
speaker = "メルエル"
# （でも──ちゃんと受け止めなきゃ。知ってしまった以上、ちゃんとしなくちゃ……！）
line = "（でも──ちゃんと受け止めなきゃ。知ってしまった以上、ちゃんとしなくちゃ……！）"

[[dialogue]]
speaker = "ナターシャ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "ケイティ"
# 「まさかこんなお話をすることになるだなんて……２人とも、今回の天界訪問は、このお話をメルエルちゃんとするために？」
line = "「まさかこんなお話をすることになるだなんて……２人とも、今回の天界訪問は、このお話をメルエルちゃんとするために？」"

[[dialogue]]
speaker = "メルエル"
# 「──ううん。違うの。私とナターシャちゃんは、学園のお仕事で来たんだよ」
line = "「──ううん。違うの。私とナターシャちゃんは、学園のお仕事で来たんだよ」"

[[dialogue]]
speaker = "メルエル"
# 「これから訪れるであろう決戦のために。天使のみんなの力を貸してほしいの……！」
line = "「これから訪れるであろう決戦のために。天使のみんなの力を貸してほしいの……！」"

[[dialogue]]
speaker = "unk"
# ──メルエルは、緋宮クロトから言付かっていたことをケイティに伝えた。
line = "──メルエルは、緋宮クロトから言付かっていたことをケイティに伝えた。"

[[dialogue]]
speaker = "unk"
# 女神テルルよりも高位に位置する創造神『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』の存在。<ruby=か>彼</ruby>の神によって、リクリエの使徒は生み出されていたこと──
line = "女神テルルよりも高位に位置する創造神『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』の存在。<ruby>彼<rt>か</rt></ruby>の神によって、リクリエの使徒は生み出されていたこと──"

[[dialogue]]
speaker = "unk"
# 先日の極星学園生による襲撃にも『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』は関与している。創造神との決着のために、１人でも多くの星騎士の力が必要であることも──
line = "先日の極星学園生による襲撃にも『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』は関与している。創造神との決着のために、１人でも多くの星騎士の力が必要であることも──"

[[dialogue]]
speaker = "ケイティ"
# 「あらまあ……それは大変そうね～」
line = "「あらまあ……それは大変そうね～」"

[[dialogue]]
speaker = "ナターシャ"
# 「流石はケイティ姉さん。想像通りの呑気なリアクション」
line = "「流石はケイティ姉さん。想像通りの呑気なリアクション」"

[[dialogue]]
speaker = "ケイティ"
# 「もう。どういう意味～？　これでも驚いてるのに～」
line = "「もう。どういう意味～？　これでも驚いてるのに～」"

[[dialogue]]
speaker = "メルエル"
# （あんまり驚いてるように見えないよぉ……！？）
line = "（あんまり驚いてるように見えないよぉ……！？）"

[[dialogue]]
speaker = "ケイティ"
# 「なるほど。だからメルエルちゃんたちがやってきたんだね～」
line = "「なるほど。だからメルエルちゃんたちがやってきたんだね～」"

[[dialogue]]
speaker = "メルエル"
# 「う、うん。リガルタ様の娘なら、なんとかなるんじゃないかって会長くんが……」
line = "「う、うん。リガルタ様の娘なら、なんとかなるんじゃないかって会長くんが……」"

[[dialogue]]
speaker = "ナターシャ"
# 「とは言っても、メルエルの正体を天界全土に明らかにしたら、それこそめちゃくちゃだから。あくまで政治的な搦め手を使うけどね」
line = "「とは言っても、メルエルの正体を天界全土に明らかにしたら、それこそめちゃくちゃだから。あくまで政治的な搦め手を使うけどね」"

[[dialogue]]
speaker = "ナターシャ"
# 「ケイティ姉さん。議会の王政派と保守派に働きかけられる？　この人たちには、メルエル直々の命令ってことでいけると思う」
line = "「ケイティ姉さん。議会の王政派と保守派に働きかけられる？　この人たちには、メルエル直々の命令ってことでいけると思う」"

[[dialogue]]
speaker = "ケイティ"
# 「うん。それは問題ないよ～」
line = "「うん。それは問題ないよ～」"

[[dialogue]]
speaker = "ナターシャ"
# 「で、改革派とかの面倒な連中には、エサをぶら下げて交渉したいかな」
line = "「で、改革派とかの面倒な連中には、エサをぶら下げて交渉したいかな」"

[[dialogue]]
speaker = "メルエル"
# 「……えさ？」
line = "「……えさ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そ。リクリエの危機だから手伝って、だけじゃ弱いからね。戦力を借りるための旨味がないと」
line = "「そ。リクリエの危機だから手伝って、だけじゃ弱いからね。戦力を借りるための旨味がないと」"

[[dialogue]]
speaker = "ナターシャ"
# 「襲撃された天界の復興を、流星市国が全力でサポートする──流星教皇庁からの書簡もあるよ」
line = "「襲撃された天界の復興を、流星市国が全力でサポートする──流星教皇庁からの書簡もあるよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「会長さんから星見家のお嬢様に交渉してもらったから、準備は簡単だったよ。で──どうかな、姉さん？」
line = "「会長さんから星見家のお嬢様に交渉してもらったから、準備は簡単だったよ。で──どうかな、姉さん？」"

[[dialogue]]
speaker = "ケイティ"
# 「うん。問題ないと思うよ～。流星市国と良好な関係を築きたいっていうのは、どこの派閥も変わらないと思うから」
line = "「うん。問題ないと思うよ～。流星市国と良好な関係を築きたいっていうのは、どこの派閥も変わらないと思うから」"

[[dialogue]]
speaker = "ケイティ"
# 「それじゃあ早速、連絡を──」
line = "「それじゃあ早速、連絡を──」"

[[dialogue]]
speaker = "メルエル"
# 「……っ！？」
line = "「……っ！？」"

[[dialogue]]
speaker = "ケイティ"
# 「緊急事態の、アラート──！？」
line = "「緊急事態の、アラート──！？」"

[[dialogue]]
speaker = "unk"
# ケイティに連絡を飛ばしたのは、衛兵隊の隊員だった。
line = "ケイティに連絡を飛ばしたのは、衛兵隊の隊員だった。"

[[dialogue]]
speaker = "ケイティ"
# 「一体何が……えっ！？　敵襲──！？　そんな、場所はどこですか！？」
line = "「一体何が……えっ！？　敵襲──！？　そんな、場所はどこですか！？」"

[[dialogue]]
speaker = "スレイプニル"
# 「──ブルルルッ！！」
line = "「──ブルルルッ！！」"

[[dialogue]]
speaker = "ネビュラの魔女"
# 「くっ……何者です、貴女は！！」
line = "「くっ……何者です、貴女は！！」"

[[dialogue]]
speaker = "ジグ"
# 「……これから死ぬ者に、名乗る必要などないだろう？」
line = "「……これから死ぬ者に、名乗る必要などないだろう？」"

[[dialogue]]
speaker = "unk"
# 世界樹を守護するネビュラの魔女に、極星従騎と使徒のシャドウが、一斉に襲い掛かる──
line = "世界樹を守護するネビュラの魔女に、極星従騎と使徒のシャドウが、一斉に襲い掛かる──"
