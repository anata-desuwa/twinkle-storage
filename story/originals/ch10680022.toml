[[dialogue]]
speaker = "unk"
# 第２話,えっへん、リアお姉ちゃんだゾ♪,P
line = "第２話,えっへん、リアお姉ちゃんだゾ♪,P"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースの一行が九浄家に泊まった翌日――リゾート結界のビーチにて。
line = "流星クルセイダースの一行が九浄家に泊まった翌日――リゾート結界のビーチにて。"

[[dialogue]]
speaker = "リア"
# 「はい、ヴィーナスちゃん、あ～ん<emoji=heart04>」
line = "「はい、ヴィーナスちゃん、あ～ん<emoji=heart04>」"

[[dialogue]]
speaker = "ヴィーナス"
# 「あ～ん♪」
line = "「あ～ん♪」"

[[dialogue]]
speaker = "リア"
# 「ふふっ、どう？　かき氷、美味しい？」
line = "「ふふっ、どう？　かき氷、美味しい？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「うんっ♪　とっても美味しいわ、リアお姉ちゃん♪」
line = "「うんっ♪　とっても美味しいわ、リアお姉ちゃん♪」"

[[dialogue]]
speaker = "unk"
# ２人がすごく仲良くなっててビックリしたよ
line = "２人がすごく仲良くなっててビックリしたよ"

[[dialogue]]
speaker = "unk"
# 昨日、九浄家にいなかった俺は、今日になって２人の距離が急激に縮まっていることに驚きを隠せなかった。
line = "昨日、九浄家にいなかった俺は、今日になって２人の距離が急激に縮まっていることに驚きを隠せなかった。"

[[dialogue]]
speaker = "リア"
# 「ふふっ、九浄リアはヴィーナスちゃんのお姉ちゃんに進化したんだよ～♪　えっへん♪」
line = "「ふふっ、九浄リアはヴィーナスちゃんのお姉ちゃんに進化したんだよ～♪　えっへん♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「私もお姉ちゃんが２人もできて、妹になったわ！　えっへん♪」
line = "「私もお姉ちゃんが２人もできて、妹になったわ！　えっへん♪」"

[[dialogue]]
speaker = "unk"
# こうして見ると、リア先輩とヴィーナスは似たところがあって、気が合うのかもしれない――そんなことを俺が考えていると。
line = "こうして見ると、リア先輩とヴィーナスは似たところがあって、気が合うのかもしれない――そんなことを俺が考えていると。"

[[dialogue]]
speaker = "聖沙"
# 「じ～っ……」
line = "「じ～っ……」"

[[dialogue]]
speaker = "unk"
# 少し離れた物陰から、聖沙がじっとこちらを見つめているのが目に入った。
line = "少し離れた物陰から、聖沙がじっとこちらを見つめているのが目に入った。"

[[dialogue]]
speaker = "聖沙"
# 「ぐぬぬ……」
line = "「ぐぬぬ……」"

[[dialogue]]
speaker = "unk"
# しかも、どこか葛藤しているような表情だ。
line = "しかも、どこか葛藤しているような表情だ。"

[[dialogue]]
speaker = "unk"
# なんでわざわざ隠れて見てるんだ？
line = "なんでわざわざ隠れて見てるんだ？"

[[dialogue]]
speaker = "unk"
# えっと……聖沙？
line = "えっと……聖沙？"

[[dialogue]]
speaker = "聖沙"
# 「ハッ……！？　しまった、つい身を乗り出して……！」
line = "「ハッ……！？　しまった、つい身を乗り出して……！」"

[[dialogue]]
speaker = "リア"
# 「あれ、聖沙ちゃん？　どうしたの？」
line = "「あれ、聖沙ちゃん？　どうしたの？」"

[[dialogue]]
speaker = "聖沙"
# 「こ、これはそのぉ……」
line = "「こ、これはそのぉ……」"

[[dialogue]]
speaker = "聖沙"
# 「リア先輩がヴィーナスさんとすごく楽しそうにしてるから……邪魔しちゃ悪いと思いつつも、ちょっと羨ましくなっちゃって……」
line = "「リア先輩がヴィーナスさんとすごく楽しそうにしてるから……邪魔しちゃ悪いと思いつつも、ちょっと羨ましくなっちゃって……」"

[[dialogue]]
speaker = "聖沙"
# 「私は先輩に――リアお姉様に、あ～んをしてもらったことなんて、１度もないから……」
line = "「私は先輩に――リアお姉様に、あ～んをしてもらったことなんて、１度もないから……」"

[[dialogue]]
speaker = "リア"
# 「！　そっか……そうだよね……」
line = "「！　そっか……そうだよね……」"

[[dialogue]]
speaker = "リア"
# 「ごめんね、聖沙ちゃん。今まで、聖沙ちゃんが私のことをお姉様って呼んで慕ってくれてたのに、ちゃんと向き合えてなかったよね……」
line = "「ごめんね、聖沙ちゃん。今まで、聖沙ちゃんが私のことをお姉様って呼んで慕ってくれてたのに、ちゃんと向き合えてなかったよね……」"

[[dialogue]]
speaker = "聖沙"
# 「い、いえ！　私が一方的に押し付けていたようなものなので……」
line = "「い、いえ！　私が一方的に押し付けていたようなものなので……」"

[[dialogue]]
speaker = "リア"
# 「でも……これからは大丈夫だよ！　私、ちゃんと受け止めるから！」
line = "「でも……これからは大丈夫だよ！　私、ちゃんと受け止めるから！」"

[[dialogue]]
speaker = "聖沙"
# 「え？　それってどういう……」
line = "「え？　それってどういう……」"

[[dialogue]]
speaker = "リア"
# 「私ね……『お姉ちゃん』って呼んでもらえるのが、すごく嬉しいって気づいたの！」
line = "「私ね……『お姉ちゃん』って呼んでもらえるのが、すごく嬉しいって気づいたの！」"

[[dialogue]]
speaker = "リア"
# 「だからこれからは、『先輩』としてだけじゃなくて――みんなの『お姉ちゃん』としても頑張るね！」
line = "「だからこれからは、『先輩』としてだけじゃなくて――みんなの『お姉ちゃん』としても頑張るね！」"

[[dialogue]]
speaker = "リア"
# 「聖沙ちゃんがお姉様って呼んでくれるなら、それにちゃんと応えるよ♪」
line = "「聖沙ちゃんがお姉様って呼んでくれるなら、それにちゃんと応えるよ♪」"

[[dialogue]]
speaker = "リア"
# 「さあ、おいで♪　今まで我慢させちゃってた分、遠慮しないで甘えていいよ、聖沙ちゃん♪」
line = "「さあ、おいで♪　今まで我慢させちゃってた分、遠慮しないで甘えていいよ、聖沙ちゃん♪」"

[[dialogue]]
speaker = "聖沙"
# 「！　お、お姉様……<emoji=heart04>」
line = "「！　お、お姉様……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# そう言って歩み寄ってきた聖沙の頭に、リア先輩はそっと手を置く。
line = "そう言って歩み寄ってきた聖沙の頭に、リア先輩はそっと手を置く。"

[[dialogue]]
speaker = "リア"
# 「は～い、なでなで～<emoji=heart04>」
line = "「は～い、なでなで～<emoji=heart04>」"

[[dialogue]]
speaker = "聖沙"
# 「！？　ふ、ふわああぁ～～っ<emoji=heart04><emoji=heart04>」
line = "「！？　ふ、ふわああぁ～～っ<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "聖沙"
# 「お、お姉様に頭を撫でられて、頭の中に百合の花が咲き乱れちゃう……<emoji=heart04>」
line = "「お、お姉様に頭を撫でられて、頭の中に百合の花が咲き乱れちゃう……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ――と、その時だった。
line = "――と、その時だった。"

[[dialogue]]
speaker = "パッキー"
# 「――クックック、確かに聞いたぜ……！　リアちゃんがお姉ちゃんとして頑張ると！」
line = "「――クックック、確かに聞いたぜ……！　リアちゃんがお姉ちゃんとして頑張ると！」"

[[dialogue]]
speaker = "リア"
# 「あっ、パーちゃん……？」
line = "「あっ、パーちゃん……？」"

[[dialogue]]
speaker = "パッキー"
# 「なら――俺様もリアちゃんの弟になって甘えたいぜ<emoji=heart04>　お姉ちゃ～ん<emoji=heart04>」
line = "「なら――俺様もリアちゃんの弟になって甘えたいぜ<emoji=heart04>　お姉ちゃ～ん<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# そう言ってパッキーは、リア先輩に向かって突撃ダイブをかまそうとする。
line = "そう言ってパッキーは、リア先輩に向かって突撃ダイブをかまそうとする。"

[[dialogue]]
speaker = "聖沙"
# 「ダメよ、パッキーさん！　お姉様は私が守るわ！」
line = "「ダメよ、パッキーさん！　お姉様は私が守るわ！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「そうよ！　スケベなことを考えてるの、見え見えなんだから！」
line = "「そうよ！　スケベなことを考えてるの、見え見えなんだから！」"

[[dialogue]]
speaker = "パッキー"
# 「邪魔するんじゃねぇ、ヒスとナス！　俺様だってリアちゃんに甘えたいんだ！」
line = "「邪魔するんじゃねぇ、ヒスとナス！　俺様だってリアちゃんに甘えたいんだ！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ナスって私のこと！？　でも不思議としっくり来るわね！」
line = "「ナスって私のこと！？　でも不思議としっくり来るわね！」"

[[dialogue]]
speaker = "パッキー"
# 「ククク！　油断したな！　これが俺様の華麗なステップ技――『デビルパンダゴースト』だぜ！」
line = "「ククク！　油断したな！　これが俺様の華麗なステップ技――『デビルパンダゴースト』だぜ！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「なっ！？　足の間をすり抜けて……！？」
line = "「なっ！？　足の間をすり抜けて……！？」"

[[dialogue]]
speaker = "聖沙"
# 「いけない！　お姉様が危ないわ！」
line = "「いけない！　お姉様が危ないわ！」"

[[dialogue]]
speaker = "パッキー"
# 「リアお姉ちゃ～ん<emoji=heart04>」
line = "「リアお姉ちゃ～ん<emoji=heart04>」"

[[dialogue]]
speaker = "サーシャ"
# 「は～い♪　パッキーちゃん、オイタはダメよ～？」
line = "「は～い♪　パッキーちゃん、オイタはダメよ～？」"

[[dialogue]]
speaker = "パッキー"
# 「ハッ！？　――冷たぁっ！？」
line = "「ハッ！？　――冷たぁっ！？」"

[[dialogue]]
speaker = "unk"
# 突如放たれた星術によって、パッキーの体は首から下が氷に包まれ、その場で固まってしまった。
line = "突如放たれた星術によって、パッキーの体は首から下が氷に包まれ、その場で固まってしまった。"

[[dialogue]]
speaker = "リア"
# 「サーシャ<b>ちゃん</b>！」
line = "「サーシャ<b>ちゃん</b>！」"

[[dialogue]]
speaker = "サーシャ"
# 「ふふっ、リアちゃんもついに『お姉ちゃん』の道に目覚めたのね～♪」
line = "「ふふっ、リアちゃんもついに『お姉ちゃん』の道に目覚めたのね～♪」"

[[dialogue]]
speaker = "パッキー"
# 「さ、サーシャちゃん、冷たいぜ……！　俺様としては、お姉ちゃんたちに挟んでもらって温めてもらえると……」
line = "「さ、サーシャちゃん、冷たいぜ……！　俺様としては、お姉ちゃんたちに挟んでもらって温めてもらえると……」"

[[dialogue]]
speaker = "サーシャ"
# 「う～ん、お姉ちゃんって呼んでもらえるのは嬉しいんだけど～」
line = "「う～ん、お姉ちゃんって呼んでもらえるのは嬉しいんだけど～」"

[[dialogue]]
speaker = "サーシャ"
# 「な～んか、パッキーちゃんは甘やかしちゃダメな気がするのよね～。お姉ちゃんとして」
line = "「な～んか、パッキーちゃんは甘やかしちゃダメな気がするのよね～。お姉ちゃんとして」"

[[dialogue]]
speaker = "パッキー"
# 「何故に！？」
line = "「何故に！？」"

[[dialogue]]
speaker = "リア"
# 「あはは……パーちゃんは素直なのはいいんだけど、悪いこと考えてる時も素直すぎるせいかな～……」
line = "「あはは……パーちゃんは素直なのはいいんだけど、悪いこと考えてる時も素直すぎるせいかな～……」"

[[dialogue]]
speaker = "サーシャ"
# 「本当のお姉ちゃんは、ダメな時はちゃんとダメだって叱るものよ～？　だから～」
line = "「本当のお姉ちゃんは、ダメな時はちゃんとダメだって叱るものよ～？　だから～」"

[[dialogue]]
speaker = "サーシャ"
# 「パッキーちゃん、エッチなことはしちゃ――めっ♪」
line = "「パッキーちゃん、エッチなことはしちゃ――めっ♪」"

[[dialogue]]
speaker = "リア"
# 「そうだよ、パーちゃん。私からも――めっ、だゾ<emoji=heart04>」
line = "「そうだよ、パーちゃん。私からも――めっ、だゾ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# そう言って２人は同時に、パッキーのおでこを人差し指で、ツンと突いた。
line = "そう言って２人は同時に、パッキーのおでこを人差し指で、ツンと突いた。"

[[dialogue]]
speaker = "パッキー"
# 「はうっ！？　２人にツンってされて……！　俺様は――俺様はぁ～～っ！？」
line = "「はうっ！？　２人にツンってされて……！　俺様は――俺様はぁ～～っ！？」"

[[dialogue]]
speaker = "パッキー"
# 「ぬおおおおおおぉ～～っ！！？」
line = "「ぬおおおおおおぉ～～っ！！？」"

[[dialogue]]
speaker = "パッキー"
# 「――ハァ……ハァ……<emoji=heart04>　こうやって怒られるのも、これはこれで……<emoji=heart04>」
line = "「――ハァ……ハァ……<emoji=heart04>　こうやって怒られるのも、これはこれで……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# パッキー、お前……
line = "パッキー、お前……"

[[dialogue]]
speaker = "パッキー"
# 「フッ……異世界の魔王様よ、これぞまさに賢者タイムというやつだぜ……」
line = "「フッ……異世界の魔王様よ、これぞまさに賢者タイムというやつだぜ……」"

[[dialogue]]
speaker = "ヴィーナス"
# 「賢者タイムって、何？」
line = "「賢者タイムって、何？」"

[[dialogue]]
speaker = "聖沙"
# 「えっ！？　さ、さあ？　私にはわからないわ！」
line = "「えっ！？　さ、さあ？　私にはわからないわ！」"

[[dialogue]]
speaker = "サーシャ"
# 「ふふっ、リアちゃん、私たちもっと仲良くなれそうね～♪」
line = "「ふふっ、リアちゃん、私たちもっと仲良くなれそうね～♪」"

[[dialogue]]
speaker = "リア"
# 「うん♪　『お姉ちゃん同盟』を結成だね♪」
line = "「うん♪　『お姉ちゃん同盟』を結成だね♪」"

[[dialogue]]
speaker = "unk"
# こうして、リア先輩はサーシャさんと握手し、改めて親交を深めるのだった。
line = "こうして、リア先輩はサーシャさんと握手し、改めて親交を深めるのだった。"
