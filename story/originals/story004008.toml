[[dialogue]]
speaker = "蘭美"
# 「──はあぁぁぁあっ！！」
line = "「──はあぁぁぁあっ！！」"

[[dialogue]]
speaker = "シエスタ"
# 「そんな攻撃、いくらしたって無駄なの！　シスの『支配』の力の前では、無意味なの！」
line = "「そんな攻撃、いくらしたって無駄なの！　シスの『支配』の力の前では、無意味なの！」"

[[dialogue]]
speaker = "蘭美"
# （くぅっ……！　能力の射程距離は短い──それがシエスタの弱点だって、ダッチは言っていたけれど！）
line = "（くぅっ……！　能力の射程距離は短い──それがシエスタの弱点だって、ダッチは言っていたけれど！）"

[[dialogue]]
speaker = "蘭美"
# （裏を返せばそれって──接近するほど力が増すってことじゃない！！）
line = "（裏を返せばそれって──接近するほど力が増すってことじゃない！！）"

[[dialogue]]
speaker = "シュティレ"
# 「まずいですね。ドリルの有効範囲まで近づくと、ダッチの欲望シールドも貫通されてしまうようです」
line = "「まずいですね。ドリルの有効範囲まで近づくと、ダッチの欲望シールドも貫通されてしまうようです」"

[[dialogue]]
speaker = "トリュファイナ"
# 「くぅっ、ダメです！　遠距離から狙撃しても、魔弾が直撃するまでに、その力を吸われてしまいますっ！」
line = "「くぅっ、ダメです！　遠距離から狙撃しても、魔弾が直撃するまでに、その力を吸われてしまいますっ！」"

[[dialogue]]
speaker = "蘭美"
# 「どういうことよダッチ！　欲望のシールドで拮抗はできるって言ってたじゃない！？」
line = "「どういうことよダッチ！　欲望のシールドで拮抗はできるって言ってたじゃない！？」"

[[dialogue]]
speaker = "ダッチ"
# 「ふぅむ。私と会わないうちに、シスはより高みへと登ったのでしょうか……計算外ですねぇ～！」
line = "「ふぅむ。私と会わないうちに、シスはより高みへと登ったのでしょうか……計算外ですねぇ～！」"

[[dialogue]]
speaker = "ダッチ"
# 「ですがやることは変わりません！　皆様を守るシールドをより強固にいたします。ヒットアンドアウェーでじりじり削っていきましょう！！」
line = "「ですがやることは変わりません！　皆様を守るシールドをより強固にいたします。ヒットアンドアウェーでじりじり削っていきましょう！！」"

[[dialogue]]
speaker = "蘭美"
# 「あぁもうっ──了解よ！　じゃないっ……了解ぴょんっ！」
line = "「あぁもうっ──了解よ！　じゃないっ……了解ぴょんっ！」"

[[dialogue]]
speaker = "シエスタ"
# 「いくら粘ったところで無駄なの！　この空間は全てシスの支配下！！　行くの、モンスターたちっ！！」
line = "「いくら粘ったところで無駄なの！　この空間は全てシスの支配下！！　行くの、モンスターたちっ！！」"

[[dialogue]]
speaker = "モンスター"
# 「イィィィィイ～～～！！！」
line = "「イィィィィイ～～～！！！」"

[[dialogue]]
speaker = "蘭美"
# 「さらに敵がっ！？」
line = "「さらに敵がっ！？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「シエスタ様の能力で、限界以上の力が引き出されているようです！　皆様、ご注意を！」
line = "「シエスタ様の能力で、限界以上の力が引き出されているようです！　皆様、ご注意を！」"

[[dialogue]]
speaker = "シエスタ"
# 「モンスターたち！　メイドのウサギと魔女は後回しでいいの！　あのヘンタイ馬鹿と……錬金術師の弟子から仕留めるの！！」
line = "「モンスターたち！　メイドのウサギと魔女は後回しでいいの！　あのヘンタイ馬鹿と……錬金術師の弟子から仕留めるの！！」"

[[dialogue]]
speaker = "シュティレ"
# 「がーん。ダッチはともかく、シュティレまで名指しで恨まれています。なぜでしょう？」
line = "「がーん。ダッチはともかく、シュティレまで名指しで恨まれています。なぜでしょう？」"

[[dialogue]]
speaker = "シエスタ"
# 「不動シュティレ！　お前は、あの錬金術師と同じ！　お兄ちゃんを困らせる悪者なのっ！！」
line = "「不動シュティレ！　お前は、あの錬金術師と同じ！　お兄ちゃんを困らせる悪者なのっ！！」"

[[dialogue]]
speaker = "シュティレ"
# 「…………？」
line = "「…………？」"

[[dialogue]]
speaker = "シエスタ"
# 「ここまで戦って、実力差はわかったはずなの！　シスには敵わない。メイドのウサギ、そして魔女。お前たちはとっとと帰るといいの！」
line = "「ここまで戦って、実力差はわかったはずなの！　シスには敵わない。メイドのウサギ、そして魔女。お前たちはとっとと帰るといいの！」"

[[dialogue]]
speaker = "シエスタ"
# 「お前たちに恨みはないの……今すぐ帰るなら、特別に見逃してあげるの！」
line = "「お前たちに恨みはないの……今すぐ帰るなら、特別に見逃してあげるの！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ど、どういうことでしょう？　私と蘭美様だけ……情けをかけられている？」
line = "「ど、どういうことでしょう？　私と蘭美様だけ……情けをかけられている？」"

[[dialogue]]
speaker = "ダッチ"
# 「シスにしかわからない優先順位があるのかもしれませんねぇ！　はてさていったいどういうことやら──」
line = "「シスにしかわからない優先順位があるのかもしれませんねぇ！　はてさていったいどういうことやら──」"

[[dialogue]]
speaker = "モンスター"
# 「──イイイィィ！！！」
line = "「──イイイィィ！！！」"

[[dialogue]]
speaker = "ダッチ"
# 「オゥフッ──！？！？」
line = "「オゥフッ──！？！？」"

[[dialogue]]
speaker = "蘭美"
# 「ダッチへの攻撃は容赦がカケラもないわ！？」
line = "「ダッチへの攻撃は容赦がカケラもないわ！？」"

[[dialogue]]
speaker = "シエスタ"
# 「そいつのしぶとさはゴキブリ並みなの！　畳みかけるの！！」
line = "「そいつのしぶとさはゴキブリ並みなの！　畳みかけるの！！」"

[[dialogue]]
speaker = "モンスター"
# 「──サァァァアァァァモン！！」
line = "「──サァァァアァァァモン！！」"

[[dialogue]]
speaker = "ダッチ"
# 「アゥチ！　容赦がありませんねぇ、シス！！」
line = "「アゥチ！　容赦がありませんねぇ、シス！！」"

[[dialogue]]
speaker = "unk"
# 大型モンスターに四方八方から飛び掛かられ、タコ殴りにされるダッチ。
line = "大型モンスターに四方八方から飛び掛かられ、タコ殴りにされるダッチ。"

[[dialogue]]
speaker = "シュティレ"
# 「ダッチだけではありません。なぜかシュティレも執拗に狙われています。困りました……！」
line = "「ダッチだけではありません。なぜかシュティレも執拗に狙われています。困りました……！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「数が膨大ですっ……逆転の一手を打たなくては！」
line = "「数が膨大ですっ……逆転の一手を打たなくては！」"

[[dialogue]]
speaker = "蘭美"
# 「ええ。そのためには──まずダッチを救うわよ！！」
line = "「ええ。そのためには──まずダッチを救うわよ！！」"

[[dialogue]]
speaker = "モンスター"
# 「シャーッ！！」
line = "「シャーッ！！」"

[[dialogue]]
speaker = "蘭美"
# 「光になりなさいっ──ブリリアント・ブレイカー！」
line = "「光になりなさいっ──ブリリアント・ブレイカー！」"

[[dialogue]]
speaker = "モンスター"
# 「──シャーーーク！？！？」
line = "「──シャーーーク！？！？」"

[[dialogue]]
speaker = "ダッチ"
# 「オーゥ蘭美様！　私を助けに来てくださるとは！」
line = "「オーゥ蘭美様！　私を助けに来てくださるとは！」"

[[dialogue]]
speaker = "蘭美"
# 「貴方に倒れられたら困るのよ！　長期戦は不利……何とかしてシエスタに渾身の一撃を叩きこまなきゃ勝機はないわ！」
line = "「貴方に倒れられたら困るのよ！　長期戦は不利……何とかしてシエスタに渾身の一撃を叩きこまなきゃ勝機はないわ！」"

[[dialogue]]
speaker = "蘭美"
# 「ハンマーの有効射程まで近づいても星力を吸われない──そんなシールドを出せないかしら！？」
line = "「ハンマーの有効射程まで近づいても星力を吸われない──そんなシールドを出せないかしら！？」"

[[dialogue]]
speaker = "ダッチ"
# 「むぅ……私もできる限り強い欲望を抱いてはいるのですが。どうしても出力負けしてしまうようですねぇ！」
line = "「むぅ……私もできる限り強い欲望を抱いてはいるのですが。どうしても出力負けしてしまうようですねぇ！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ぴょ、ぴょんぴょんっ！　ぴょーん、ぴょんっ！　ダッチ様、頑張ってくださいぴょんっ！」
line = "「ぴょ、ぴょんぴょんっ！　ぴょーん、ぴょんっ！　ダッチ様、頑張ってくださいぴょんっ！」"

[[dialogue]]
speaker = "ダッチ"
# 「おぅふ……光の魔女ウサギ様、申し訳ございません。ちょっぴり元気にはなりましたが、やはりこのままでは──」
line = "「おぅふ……光の魔女ウサギ様、申し訳ございません。ちょっぴり元気にはなりましたが、やはりこのままでは──」"

[[dialogue]]
speaker = "シュティレ"
# 「トリュファイナさんにここまで体を張らせているのに。なんて贅沢な……ぴょんぴょん」
line = "「トリュファイナさんにここまで体を張らせているのに。なんて贅沢な……ぴょんぴょん」"

[[dialogue]]
speaker = "蘭美"
# 「貴方ね！？　ヘンタイなのが取り柄なのに、こんな時に役に立たなくてどうするんだぴょんっ！？」
line = "「貴方ね！？　ヘンタイなのが取り柄なのに、こんな時に役に立たなくてどうするんだぴょんっ！？」"

[[dialogue]]
speaker = "ダッチ"
# 「子ウサギのエールは沁みますが、やはり才能というのは残酷ですねぇ。シスは本当に強い……」
line = "「子ウサギのエールは沁みますが、やはり才能というのは残酷ですねぇ。シスは本当に強い……」"

[[dialogue]]
speaker = "シエスタ"
# 「当然なの。シスは、『七彩のアイテムズ』の中でも最強。舐めてもらっちゃ困るの」
line = "「当然なの。シスは、『七彩のアイテムズ』の中でも最強。舐めてもらっちゃ困るの」"

[[dialogue]]
speaker = "シエスタ"
# 「ほら。早くメイドと魔女はここから消えるの。これ以上ここにいたら、もう容赦しないの！」
line = "「ほら。早くメイドと魔女はここから消えるの。これ以上ここにいたら、もう容赦しないの！」"

[[dialogue]]
speaker = "ダッチ"
# 「……致し方ありません。最後の手段です」
line = "「……致し方ありません。最後の手段です」"

[[dialogue]]
speaker = "ダッチ"
# 「子ウサギの皆様、ちょっとウサ耳を貸してください。ごにょごにょ……」
line = "「子ウサギの皆様、ちょっとウサ耳を貸してください。ごにょごにょ……」"

[[dialogue]]
speaker = "蘭美"
# 「──はぁ！？　ふ、ふざけてるでしょ貴方！？　ぶっ飛ばされたいぴょん！？」
line = "「──はぁ！？　ふ、ふざけてるでしょ貴方！？　ぶっ飛ばされたいぴょん！？」"

[[dialogue]]
speaker = "シュティレ"
# 「しかし、光明はあります。シエスタを下すには、ダッチの策に乗るしかありません」
line = "「しかし、光明はあります。シエスタを下すには、ダッチの策に乗るしかありません」"

[[dialogue]]
speaker = "トリュファイナ"
# 「……承知いたしました。私もやりますっ！」
line = "「……承知いたしました。私もやりますっ！」"

[[dialogue]]
speaker = "ダッチ"
# 「だそうですが、蘭美様？　この作戦、貴女が最後の切り札なのですよ」
line = "「だそうですが、蘭美様？　この作戦、貴女が最後の切り札なのですよ」"

[[dialogue]]
speaker = "蘭美"
# 「くぅぅう……！　やればいいんでしょ、やれば！」
line = "「くぅぅう……！　やればいいんでしょ、やれば！」"

[[dialogue]]
speaker = "シエスタ"
# 「無駄話はそこまでなの！　そっちが逃げないなら……こっちから行くの！！」
line = "「無駄話はそこまでなの！　そっちが逃げないなら……こっちから行くの！！」"

[[dialogue]]
speaker = "シュティレ"
# 「不動シュティレ、突撃します──！」
line = "「不動シュティレ、突撃します──！」"

[[dialogue]]
speaker = "シエスタ"
# 「お前じゃシスには勝てないの──マリオネット・ネスト！！」
line = "「お前じゃシスには勝てないの──マリオネット・ネスト！！」"

[[dialogue]]
speaker = "unk"
# シエスタの『支配』の力で強化されたモンスターたちが、一斉にシュティレに襲い掛かる。
line = "シエスタの『支配』の力で強化されたモンスターたちが、一斉にシュティレに襲い掛かる。"

[[dialogue]]
speaker = "シュティレ"
# 「螺旋機構、展開──シャイニング・キャノピー！」
line = "「螺旋機構、展開──シャイニング・キャノピー！」"

[[dialogue]]
speaker = "シエスタ"
# 「ドリルの傘を開いて……攻撃を防いだの！？　意外と器用なの……！」
line = "「ドリルの傘を開いて……攻撃を防いだの！？　意外と器用なの……！」"

[[dialogue]]
speaker = "シュティレ"
# 「応用が利くのです。ぶい」
line = "「応用が利くのです。ぶい」"

[[dialogue]]
speaker = "シエスタ"
# 「だけどそんな防御、すぐに破って──あっ！？」
line = "「だけどそんな防御、すぐに破って──あっ！？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「──魔弾、装填完了。狙撃します！！」
line = "「──魔弾、装填完了。狙撃します！！」"

[[dialogue]]
speaker = "unk"
# シュティレの傘の影に隠れていたトリュファイナが銃杖を向ける──その相手は。
line = "シュティレの傘の影に隠れていたトリュファイナが銃杖を向ける──その相手は。"

[[dialogue]]
speaker = "トリュファイナ"
# 「魔王様。申し訳ございません──シュート！！」
line = "「魔王様。申し訳ございません──シュート！！」"

[[dialogue]]
speaker = "シエスタ"
# 「お兄ちゃんに攻撃っ！？　な、何をしてるの！？」
line = "「お兄ちゃんに攻撃っ！？　な、何をしてるの！？」"

[[dialogue]]
speaker = "unk"
# トリュファイナの魔弾が、遠方で気絶していた緋宮クロトに直撃する──
line = "トリュファイナの魔弾が、遠方で気絶していた緋宮クロトに直撃する──"

[[dialogue]]
speaker = "シエスタ"
# 「っ！？　回復の……魔弾！？」
line = "「っ！？　回復の……魔弾！？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「魔王様、お目覚めください！！」
line = "「魔王様、お目覚めください！！」"

[[dialogue]]
speaker = "unk"
# う、うーん……？
line = "う、うーん……？"

[[dialogue]]
speaker = "ダッチ"
# 「ありがとうございます、ウサギの魔女様！　これぞ最後の一押し！！」
line = "「ありがとうございます、ウサギの魔女様！　これぞ最後の一押し！！」"

[[dialogue]]
speaker = "ダッチ"
# 「さぁ──私のやる気をブーストしてください！！　現れろッ、女体化バニークロトッ！！」
line = "「さぁ──私のやる気をブーストしてください！！　現れろッ、女体化バニークロトッ！！」"

[[dialogue]]
speaker = "unk"
# なんだ、この格好！？！？
line = "なんだ、この格好！？！？"

[[dialogue]]
speaker = "unk"
# うわあぁぁああ！？
line = "うわあぁぁああ！？"

[[dialogue]]
speaker = "シエスタ"
# 「お、お兄ちゃんが女の子にー！？　よ、よくもよくも！　なんてことをしてくれるの、ダッチ！？！？」
line = "「お、お兄ちゃんが女の子にー！？　よ、よくもよくも！　なんてことをしてくれるの、ダッチ！？！？」"

[[dialogue]]
speaker = "ダッチ"
# 「フオォオォォォォオオ────！！　理想のバニィィィィ────欲望シールド、フルスロットルッ！！！」
line = "「フオォオォォォォオオ────！！　理想のバニィィィィ────欲望シールド、フルスロットルッ！！！」"

[[dialogue]]
speaker = "ダッチ"
# 「これが最後のチャンスです！　シールドが破られる前に、シスに攻撃を撃ち込んでください、蘭美様！！」
line = "「これが最後のチャンスです！　シールドが破られる前に、シスに攻撃を撃ち込んでください、蘭美様！！」"

[[dialogue]]
speaker = "蘭美"
# 「ええ──これで決めるわっ！！」
line = "「ええ──これで決めるわっ！！」"

[[dialogue]]
speaker = "unk"
# ダッチの欲望シールドを纏った蘭美が、モンスターの軍勢に守られているシエスタに突撃する。
line = "ダッチの欲望シールドを纏った蘭美が、モンスターの軍勢に守られているシエスタに突撃する。"

[[dialogue]]
speaker = "シエスタ"
# 「許さない、許さないの！　手加減してあげてたのに！　もう本気でいくの！！」
line = "「許さない、許さないの！　手加減してあげてたのに！　もう本気でいくの！！」"

[[dialogue]]
speaker = "蘭美"
# 「はぁああぁあああッ────！！」
line = "「はぁああぁあああッ────！！」"

[[dialogue]]
speaker = "シエスタ"
# （ダッチはシスのこと、なんにもわかっちゃいないの……！）
line = "（ダッチはシスのこと、なんにもわかっちゃいないの……！）"

[[dialogue]]
speaker = "シエスタ"
# （シスが本気になれば、いくら『欲望』で願ったところで無駄なの！）
line = "（シスが本気になれば、いくら『欲望』で願ったところで無駄なの！）"

[[dialogue]]
speaker = "シエスタ"
# （近づけば近づくほどに、シスの『支配』の圏内に入る。何枚防壁を重ねても、ぜんぶ壊して力を吸い取るだけなの！）
line = "（近づけば近づくほどに、シスの『支配』の圏内に入る。何枚防壁を重ねても、ぜんぶ壊して力を吸い取るだけなの！）"

[[dialogue]]
speaker = "蘭美"
# 「邪魔よ、モンスター！」
line = "「邪魔よ、モンスター！」"

[[dialogue]]
speaker = "unk"
# 分厚く配置しているモンスターをなぎ倒し、わずかな隙間を狙って、蘭美は光のように地を駆ける──
line = "分厚く配置しているモンスターをなぎ倒し、わずかな隙間を狙って、蘭美は光のように地を駆ける──"

[[dialogue]]
speaker = "unk"
# シエスタに接近するたび、ダッチのシールドは次々に破られていく──しかし。
line = "シエスタに接近するたび、ダッチのシールドは次々に破られていく──しかし。"

[[dialogue]]
speaker = "シエスタ"
# （な……何なの、こいつ──！？）
line = "（な……何なの、こいつ──！？）"

[[dialogue]]
speaker = "蘭美"
# 「反動加速ッ──！」
line = "「反動加速ッ──！」"

[[dialogue]]
speaker = "unk"
# シエスタの『支配』によって、ダッチのシールドが剥ぎ取られるよりも速く接近する蘭美は──まるで地面を疾走する稲妻。
line = "シエスタの『支配』によって、ダッチのシールドが剥ぎ取られるよりも速く接近する蘭美は──まるで地面を疾走する稲妻。"

[[dialogue]]
speaker = "unk"
# あんな重たい得物を持っているとは到底思えないほどの、光速メイドスター。
line = "あんな重たい得物を持っているとは到底思えないほどの、光速メイドスター。"

[[dialogue]]
speaker = "シエスタ"
# （信じられないの……破壊が間に合わないの！？）
line = "（信じられないの……破壊が間に合わないの！？）"

[[dialogue]]
speaker = "蘭美"
# 「これでっ──トドメ！！」
line = "「これでっ──トドメ！！」"

[[dialogue]]
speaker = "シエスタ"
# （こいつ────光より速いの！！！）
line = "（こいつ────光より速いの！！！）"

[[dialogue]]
speaker = "蘭美"
# 「リコイル・ショーストッパー！！！」
line = "「リコイル・ショーストッパー！！！」"

[[dialogue]]
speaker = "シエスタ"
# 「きゃあぁぁああぁああっ────！？」
line = "「きゃあぁぁああぁああっ────！？」"

[[dialogue]]
speaker = "unk"
# 『支配』の星力奪取よりも速く肉薄した蘭美が、ガンハンマーの重たい一撃をシエスタに叩きこんだのだった。
line = "『支配』の星力奪取よりも速く肉薄した蘭美が、ガンハンマーの重たい一撃をシエスタに叩きこんだのだった。"
