[[dialogue]]
speaker = "unk"
# 第３話,にーにーの専属メイドさん,P
line = "第３話,にーにーの専属メイドさん,P"

[[dialogue]]
speaker = "unk"
# 放課後、用事があって星見家に行くと、メイド服姿のクーシェンがいた。
line = "放課後、用事があって星見家に行くと、メイド服姿のクーシェンがいた。"

[[dialogue]]
speaker = "クーシェン"
# 「あ！　にーにーだ！」
line = "「あ！　にーにーだ！」"

[[dialogue]]
speaker = "キリカ"
# 「待ちなさい。今のあなたは星見家のメイドですよ」
line = "「待ちなさい。今のあなたは星見家のメイドですよ」"

[[dialogue]]
speaker = "クーシェン"
# 「いっけない、そうだったそうだった」
line = "「いっけない、そうだったそうだった」"

[[dialogue]]
speaker = "クーシェン"
# 「いらっしゃいませ、お客様。ご用があればお伺いします」
line = "「いらっしゃいませ、お客様。ご用があればお伺いします」"

[[dialogue]]
speaker = "キリカ"
# 「……ふむ」
line = "「……ふむ」"

[[dialogue]]
speaker = "クーシェン"
# 「ど、どうだった……ですか、メイド長？」
line = "「ど、どうだった……ですか、メイド長？」"

[[dialogue]]
speaker = "キリカ"
# 「指摘を受けて速やかに修正した点は評価しましょう」
line = "「指摘を受けて速やかに修正した点は評価しましょう」"

[[dialogue]]
speaker = "クーシェン"
# 「やった！」
line = "「やった！」"

[[dialogue]]
speaker = "キリカ"
# 「喜ぶのは早いですよ。見習いとしても、あなたの振る舞いはまだまだメイドには程遠いです」
line = "「喜ぶのは早いですよ。見習いとしても、あなたの振る舞いはまだまだメイドには程遠いです」"

[[dialogue]]
speaker = "unk"
# メイド修行は終わったはずじゃ？
line = "メイド修行は終わったはずじゃ？"

[[dialogue]]
speaker = "unk"
# どうしてクーシェンがメイドしてるの？
line = "どうしてクーシェンがメイドしてるの？"

[[dialogue]]
speaker = "クーシェン"
# 「うん！　メイドの修行で学ぶことも多かったからさ～。続けてもいいかなって」
line = "「うん！　メイドの修行で学ぶことも多かったからさ～。続けてもいいかなって」"

[[dialogue]]
speaker = "マリオン"
# 「うふふふ、クーシェン様も正式に星見家メイド隊の仲間入りでしょうか？」
line = "「うふふふ、クーシェン様も正式に星見家メイド隊の仲間入りでしょうか？」"

[[dialogue]]
speaker = "キリカ"
# 「クーシェンが望むのであれば、フィオナお嬢様に打診しても構いませんが」
line = "「クーシェンが望むのであれば、フィオナお嬢様に打診しても構いませんが」"

[[dialogue]]
speaker = "クーシェン"
# 「待って待って！　さすがにボクも本気でメイドになるつもりはないってば」
line = "「待って待って！　さすがにボクも本気でメイドになるつもりはないってば」"

[[dialogue]]
speaker = "クーシェン"
# 「ほら、アポロだってそうでしょ？　メイド修行自体は、ボクにとってもプラスになるからってだけで」
line = "「ほら、アポロだってそうでしょ？　メイド修行自体は、ボクにとってもプラスになるからってだけで」"

[[dialogue]]
speaker = "クーシェン"
# 「こうしてたま～にお稽古つけてくれたらうれしいなって」
line = "「こうしてたま～にお稽古つけてくれたらうれしいなって」"

[[dialogue]]
speaker = "キリカ"
# 「なるほど、でしたら不定期参加の見習いメイドとして、あなたを遇しましょう」
line = "「なるほど、でしたら不定期参加の見習いメイドとして、あなたを遇しましょう」"

[[dialogue]]
speaker = "マリオン"
# 「改めてよろしくお願いしますね、クーシェン様」
line = "「改めてよろしくお願いしますね、クーシェン様」"

[[dialogue]]
speaker = "クーシェン"
# 「うん！　……じゃなかった、はい！　こちらこそご指導よろしくお願いします！」
line = "「うん！　……じゃなかった、はい！　こちらこそご指導よろしくお願いします！」"

[[dialogue]]
speaker = "キリカ"
# 「少しはよくなったようですね。ただクーシェン、あなたはまだメイド道の入り口に立ったに過ぎません。ここで学んだことをいつでも忘れず精進なさい」
line = "「少しはよくなったようですね。ただクーシェン、あなたはまだメイド道の入り口に立ったに過ぎません。ここで学んだことをいつでも忘れず精進なさい」"

[[dialogue]]
speaker = "クーシェン"
# 「わかりました！」
line = "「わかりました！」"

[[dialogue]]
speaker = "マリオン"
# 「じゃあ、修行の続きをしましょう。せっかく会長様もいらっしゃいますから、クーシェン様もやる気が出るでしょうし」
line = "「じゃあ、修行の続きをしましょう。せっかく会長様もいらっしゃいますから、クーシェン様もやる気が出るでしょうし」"

[[dialogue]]
speaker = "キリカ"
# 「そう言えば、アポロ様から伺いましたが、クーシェンは緋宮会長と交際を始めたとか」
line = "「そう言えば、アポロ様から伺いましたが、クーシェンは緋宮会長と交際を始めたとか」"

[[dialogue]]
speaker = "クーシェン"
# 「ウキキ♪　そうだよ～、ボクのカレシになってもらったの」
line = "「ウキキ♪　そうだよ～、ボクのカレシになってもらったの」"

[[dialogue]]
speaker = "キリカ"
# 「クーシェンが正式なメイドでしたら、浮ついたことをするなとたしなめるところですが……おめでとうございます」
line = "「クーシェンが正式なメイドでしたら、浮ついたことをするなとたしなめるところですが……おめでとうございます」"

[[dialogue]]
speaker = "マリオン"
# 「よかったですね、クーシェン様。メイド修行で培った技は、きっと会長様との将来に役立ちますよ」
line = "「よかったですね、クーシェン様。メイド修行で培った技は、きっと会長様との将来に役立ちますよ」"

[[dialogue]]
speaker = "クーシェン"
# 「……そ、そうなの？」
line = "「……そ、そうなの？」"

[[dialogue]]
speaker = "キリカ"
# 「緋宮会長は責任感の強い方ですから、男女交際をするなら、その先も考えているでしょう」
line = "「緋宮会長は責任感の強い方ですから、男女交際をするなら、その先も考えているでしょう」"

[[dialogue]]
speaker = "マリオン"
# 「うふふ、でしたら修行も特別メニューを加えた方がよさそうですね」
line = "「うふふ、でしたら修行も特別メニューを加えた方がよさそうですね」"

[[dialogue]]
speaker = "クーシェン"
# 「ん？　なんだかよくわかんないけど、特別メニューってのは気になるかも！」
line = "「ん？　なんだかよくわかんないけど、特別メニューってのは気になるかも！」"

[[dialogue]]
speaker = "マリオン"
# 「頑張って下さいね。クーシェン様が星見家メイド隊のスペシャルテクニックを会得したら、会長様もきっと喜んじゃうはずですから」
line = "「頑張って下さいね。クーシェン様が星見家メイド隊のスペシャルテクニックを会得したら、会長様もきっと喜んじゃうはずですから」"

[[dialogue]]
speaker = "クーシェン"
# 「にーにーも……喜ぶの？」
line = "「にーにーも……喜ぶの？」"

[[dialogue]]
speaker = "マリオン"
# 「はい、あなたの大好きなにーにーを、これでもかってくらい喜ばせちゃいましょう♪」
line = "「はい、あなたの大好きなにーにーを、これでもかってくらい喜ばせちゃいましょう♪」"

[[dialogue]]
speaker = "unk"
# ドキドキしてしまうんだけど？
line = "ドキドキしてしまうんだけど？"

[[dialogue]]
speaker = "unk"
# だ、大丈夫なの？
line = "だ、大丈夫なの？"

[[dialogue]]
speaker = "キリカ"
# 「何やら誤解を与えてしまっているようですが、あくまで健全な修行ですので。マリオンさんも自重してください」
line = "「何やら誤解を与えてしまっているようですが、あくまで健全な修行ですので。マリオンさんも自重してください」"

[[dialogue]]
speaker = "マリオン"
# 「うふふ、ごめんなさい♪」
line = "「うふふ、ごめんなさい♪」"

[[dialogue]]
speaker = "マリオン"
# 「でも、特別メニューでメイドの技術に更に磨きをかければ、未来の旦那様にも喜んでもらえますよ」
line = "「でも、特別メニューでメイドの技術に更に磨きをかければ、未来の旦那様にも喜んでもらえますよ」"

[[dialogue]]
speaker = "クーシェン"
# 「そうだよね、ボクがもっと頑張って、大人ゲージを上げたらきっとにーにーも……」
line = "「そうだよね、ボクがもっと頑張って、大人ゲージを上げたらきっとにーにーも……」"

[[dialogue]]
speaker = "マリオン"
# 「きっと喜んで頂けます。大好きな彼女の大好きなメイドご奉仕ですから♪」
line = "「きっと喜んで頂けます。大好きな彼女の大好きなメイドご奉仕ですから♪」"

[[dialogue]]
speaker = "クーシェン"
# 「そうだね！　にーにーはボクがこの服着てると、いっつもうれしそうに見てるもん」
line = "「そうだね！　にーにーはボクがこの服着てると、いっつもうれしそうに見てるもん」"

[[dialogue]]
speaker = "キリカ"
# 「……緋宮会長は、自制心をもっと養わねばならないようですね」
line = "「……緋宮会長は、自制心をもっと養わねばならないようですね」"

[[dialogue]]
speaker = "マリオン"
# 「まあまあ、いいじゃないですか。自分の彼女をエッチな目で見てしまうのは当然のことですよ」
line = "「まあまあ、いいじゃないですか。自分の彼女をエッチな目で見てしまうのは当然のことですよ」"

[[dialogue]]
speaker = "クーシェン"
# 「ウキキ♪　ボクも全然オッケーだよ。にーにーにもっと見て欲しいな♪」
line = "「ウキキ♪　ボクも全然オッケーだよ。にーにーにもっと見て欲しいな♪」"

[[dialogue]]
speaker = "クーシェン"
# 「ねぇ、にーにー……ボクのこと好きなら……もっといっぱい見て……いつもボクのことだけ考えてて欲しいの……<emoji=heart04>」
line = "「ねぇ、にーにー……ボクのこと好きなら……もっといっぱい見て……いつもボクのことだけ考えてて欲しいの……<emoji=heart04>」"

[[dialogue]]
speaker = "クーシェン"
# 「ボクもにーにーだけの可愛いメイドさんになるから<emoji=heart04>　ねっ<emoji=heart04>」
line = "「ボクもにーにーだけの可愛いメイドさんになるから<emoji=heart04>　ねっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 可愛すぎるよ！
line = "可愛すぎるよ！"

[[dialogue]]
speaker = "unk"
# クーシェン……！
line = "クーシェン……！"

[[dialogue]]
speaker = "クーシェン"
# 「わわっ、にーにー！？　抱きついちゃうくらい興奮したの？」
line = "「わわっ、にーにー！？　抱きついちゃうくらい興奮したの？」"

[[dialogue]]
speaker = "クーシェン"
# 「ダメだってばぁ。メイド長たちが見てるんだし。むむぅ～～、ぎゅってしすぎぃ～～」
line = "「ダメだってばぁ。メイド長たちが見てるんだし。むむぅ～～、ぎゅってしすぎぃ～～」"

[[dialogue]]
speaker = "キリカ"
# 「メイドの護身術で容易に引き剥がせるはずですが……」
line = "「メイドの護身術で容易に引き剥がせるはずですが……」"

[[dialogue]]
speaker = "マリオン"
# 「恋する女の子ですから、離れたくないですよね～」
line = "「恋する女の子ですから、離れたくないですよね～」"

[[dialogue]]
speaker = "クーシェン"
# 「う、ううっ……否定出来ない～」
line = "「う、ううっ……否定出来ない～」"

[[dialogue]]
speaker = "クーシェン"
# 「にーにーは、ボクのことぎゅうってしたいくらい好きになっちゃったんだよね……」
line = "「にーにーは、ボクのことぎゅうってしたいくらい好きになっちゃったんだよね……」"

[[dialogue]]
speaker = "クーシェン"
# 「だったら……いいよ、にーにーが満足するまでボクのことぎゅってして……」
line = "「だったら……いいよ、にーにーが満足するまでボクのことぎゅってして……」"

[[dialogue]]
speaker = "unk"
# このまま持ち帰りたい
line = "このまま持ち帰りたい"

[[dialogue]]
speaker = "unk"
# ずっと抱き締めてたい
line = "ずっと抱き締めてたい"

[[dialogue]]
speaker = "クーシェン"
# 「にーにーってば大胆だ～<emoji=heart04>」
line = "「にーにーってば大胆だ～<emoji=heart04>」"

[[dialogue]]
speaker = "キリカ"
# 「いくら恋人同士と言えど、ある程度は自重して頂きたいですね」
line = "「いくら恋人同士と言えど、ある程度は自重して頂きたいですね」"

[[dialogue]]
speaker = "マリオン"
# 「ええ～、ちょっとくらいいいじゃない」
line = "「ええ～、ちょっとくらいいいじゃない」"

[[dialogue]]
speaker = "キリカ"
# 「今のクーシェンはメイド修行中の身。であれば、星見家のメイドとしての応対をすべきでしょう」
line = "「今のクーシェンはメイド修行中の身。であれば、星見家のメイドとしての応対をすべきでしょう」"

[[dialogue]]
speaker = "クーシェン"
# 「そ、そうだった。じゃあ改めて、にーにーの専属メイドさんとして……」
line = "「そ、そうだった。じゃあ改めて、にーにーの専属メイドさんとして……」"

[[dialogue]]
speaker = "クーシェン"
# 「ご主人様<emoji=heart04>　ボクにいっぱいご奉仕させて下さい<emoji=heart04>」
line = "「ご主人様<emoji=heart04>　ボクにいっぱいご奉仕させて下さい<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# こうして、可愛い専属メイドのクーシェンにご奉仕してもらうという最高の体験をするのだった。
line = "こうして、可愛い専属メイドのクーシェンにご奉仕してもらうという最高の体験をするのだった。"
