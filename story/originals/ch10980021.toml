[[dialogue]]
speaker = "unk"
# 第１話,ヒマワリの告白,P
line = "第１話,ヒマワリの告白,P"

[[dialogue]]
speaker = "セナリィ"
# 「むむぅ……」
line = "「むむぅ……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「これでよしっと。セナリィ社長、昨晩のモンスター捕獲大作戦の報告書完成しました。確認をお願いしま～す」
line = "「これでよしっと。セナリィ社長、昨晩のモンスター捕獲大作戦の報告書完成しました。確認をお願いしま～す」"

[[dialogue]]
speaker = "セナリィ"
# 「相変わらず仕事がチョッパヤですわね。確認しますわ」
line = "「相変わらず仕事がチョッパヤですわね。確認しますわ」"

[[dialogue]]
speaker = "セナリィ"
# 「ふむふむ……要点は完璧に抑えてますし、記載内容にも不備なし。問題ありませんわ、ヒマワリ。ご苦労様」
line = "「ふむふむ……要点は完璧に抑えてますし、記載内容にも不備なし。問題ありませんわ、ヒマワリ。ご苦労様」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ありがとうございまーす！　えへへ、褒められたー」
line = "「ありがとうございまーす！　えへへ、褒められたー」"

[[dialogue]]
speaker = "セナリィ"
# 「ところでヒマワリ。仕事に打ち込んでくれるのはとても有難いし、助かってますけど、プライベートはどうなっていますの？」
line = "「ところでヒマワリ。仕事に打ち込んでくれるのはとても有難いし、助かってますけど、プライベートはどうなっていますの？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「プライベート、ですか？　ご心配なく！」
line = "「プライベート、ですか？　ご心配なく！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ちゃんとゲームもやってますし、アニメも見てますし、プラモも作って、毎日遊んでますよ！　今期はロボアニメが不作なのが残念なんですけどね」
line = "「ちゃんとゲームもやってますし、アニメも見てますし、プラモも作って、毎日遊んでますよ！　今期はロボアニメが不作なのが残念なんですけどね」"

[[dialogue]]
speaker = "セナリィ"
# （学園に真面目に通って、日々の任務もこなしながら、どうやってそれだけの遊びの時間を捻出してるんですの？　ヒマワリだけ１日５０時間あるんですの？）
line = "（学園に真面目に通って、日々の任務もこなしながら、どうやってそれだけの遊びの時間を捻出してるんですの？　ヒマワリだけ１日５０時間あるんですの？）"

[[dialogue]]
speaker = "セナリィ"
# 「そういったプライベートではなく……えー、どう尋ねればいいのかしら……上司からのセクハラになってしまわないかしら……」
line = "「そういったプライベートではなく……えー、どう尋ねればいいのかしら……上司からのセクハラになってしまわないかしら……」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃん、セナリィ社長が聞きたいプライベートはそこじゃないと思うよ」
line = "「ヒマワリちゃん、セナリィ社長が聞きたいプライベートはそこじゃないと思うよ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「んん？　そこじゃないなら、どこ？」
line = "「んん？　そこじゃないなら、どこ？」"

[[dialogue]]
speaker = "ミウ"
# 「社長が聞きたいのは、会長さんとのプライベート、ですよね？」
line = "「社長が聞きたいのは、会長さんとのプライベート、ですよね？」"

[[dialogue]]
speaker = "ミウ"
# 「会長さんとヒマワリちゃんがお付き合いを始めたことはもっぱらの噂ですけど、２人の様子は以前と変わりなく、付き合っているようには見えない」
line = "「会長さんとヒマワリちゃんがお付き合いを始めたことはもっぱらの噂ですけど、２人の様子は以前と変わりなく、付き合っているようには見えない」"

[[dialogue]]
speaker = "ミウ"
# 「ちゃんと会ってるのか、恋人らしくデートしてるのか。社長はその辺が気になっているんだと思うよ」
line = "「ちゃんと会ってるのか、恋人らしくデートしてるのか。社長はその辺が気になっているんだと思うよ」"

[[dialogue]]
speaker = "セナリィ"
# 「心を読んだかのように代弁してくれましたわね！　そう、そこなんですのよ。ヒマワリの口から会長様の名が出たこともほとんどありませんし」
line = "「心を読んだかのように代弁してくれましたわね！　そう、そこなんですのよ。ヒマワリの口から会長様の名が出たこともほとんどありませんし」"

[[dialogue]]
speaker = "セナリィ"
# 「ヒマワリは本当に、会長様とお付き合いされてるんですの？」
line = "「ヒマワリは本当に、会長様とお付き合いされてるんですの？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あー、そこでしたかー。もっと気軽に聞いてくれても全然良かったのにー」
line = "「あー、そこでしたかー。もっと気軽に聞いてくれても全然良かったのにー」"

[[dialogue]]
speaker = "ヒマワリ"
# 「はい、もちろん！　会長さんとお付き合いしてますよー！」
line = "「はい、もちろん！　会長さんとお付き合いしてますよー！」"

[[dialogue]]
speaker = "ミウ"
# 「どんな風にお付き合いが始まったのか、セナリィ社長は興味ありそうだよ」
line = "「どんな風にお付き合いが始まったのか、セナリィ社長は興味ありそうだよ」"

[[dialogue]]
speaker = "セナリィ"
# 「べ、別に？　人様の恋愛事情に興味なんてありませんけど？　あまり踏み込むのも野暮ですし？　いつ？　どこで？　どちらから告白しましたの？」
line = "「べ、別に？　人様の恋愛事情に興味なんてありませんけど？　あまり踏み込むのも野暮ですし？　いつ？　どこで？　どちらから告白しましたの？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あはは、めっちゃ興味津々じゃないですか。隠すことでもないですし、お話ししますよ？」
line = "「あはは、めっちゃ興味津々じゃないですか。隠すことでもないですし、お話ししますよ？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「と言っても、ラブレターを渡したりーとか校舎裏に呼び出したりーとか少女漫画みたいなロマンチックな話でもないんですよね」
line = "「と言っても、ラブレターを渡したりーとか校舎裏に呼び出したりーとか少女漫画みたいなロマンチックな話でもないんですよね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「会長さんとはしょっちゅう秋葉原に行ってた遊び仲間だったんですよ。プラモ買ったり、ゲーセンで対戦したり、アニメとコラボしてるコンカフェに行ったり」
line = "「会長さんとはしょっちゅう秋葉原に行ってた遊び仲間だったんですよ。プラモ買ったり、ゲーセンで対戦したり、アニメとコラボしてるコンカフェに行ったり」"

[[dialogue]]
speaker = "ヒマワリ"
# 「最初は年下のあたしに合わせてくれてるだけなのかなーって思ってたんですけど、あたしと会長さんの趣味、バッチリ噛み合ってたんですよね」
line = "「最初は年下のあたしに合わせてくれてるだけなのかなーって思ってたんですけど、あたしと会長さんの趣味、バッチリ噛み合ってたんですよね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あたしの欲しいところにズバーンと刺さること言ってくれたり、話してるだけでもすっごく楽しいし」
line = "「あたしの欲しいところにズバーンと刺さること言ってくれたり、話してるだけでもすっごく楽しいし」"

[[dialogue]]
speaker = "ヒマワリ"
# 「年上ですごく偉い人なのに、遠慮のいらない関係っていうか……あ、いい意味でですよ？　いい意味で」
line = "「年上ですごく偉い人なのに、遠慮のいらない関係っていうか……あ、いい意味でですよ？　いい意味で」"

[[dialogue]]
speaker = "ヒマワリ"
# 「でも、会長さんって、いざっていう時、めっちゃ頼りになるじゃないですか」
line = "「でも、会長さんって、いざっていう時、めっちゃ頼りになるじゃないですか」"

[[dialogue]]
speaker = "セナリィ"
# 「……わかりますわ」
line = "「……わかりますわ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「モンスターに襲われて、大ピンチだったとこを助けてもらった時なんて、すっごくカッコよくて！　ヒーローじゃん！　って！　キュンってしちゃって！」
line = "「モンスターに襲われて、大ピンチだったとこを助けてもらった時なんて、すっごくカッコよくて！　ヒーローじゃん！　って！　キュンってしちゃって！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「だから、こう……勢いで告白したとかじゃなくて、ちゃんとした要因が積み重なってるんですよね」
line = "「だから、こう……勢いで告白したとかじゃなくて、ちゃんとした要因が積み重なってるんですよね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あたし相場的に下落要素ゼロ！　あとは上昇傾向だけ！　みたいな？」
line = "「あたし相場的に下落要素ゼロ！　あとは上昇傾向だけ！　みたいな？」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃんって感覚型だけど、そういうとこはしっかりしてるよね」
line = "「ヒマワリちゃんって感覚型だけど、そういうとこはしっかりしてるよね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「そう決まったら、あたし、会長さんのこと好き好き大好き！　ってなっちゃったんで──」
line = "「そう決まったら、あたし、会長さんのこと好き好き大好き！　ってなっちゃったんで──」"

[[dialogue]]
speaker = "ヒマワリ"
# 「会長さん、あたしと付き合ってください！」
line = "「会長さん、あたしと付き合ってください！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「──って感じに、あたしから告白したら、その場でＯＫしてもらえたんです。それで今に至ってます」
line = "「──って感じに、あたしから告白したら、その場でＯＫしてもらえたんです。それで今に至ってます」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あはは、映画みたいにドラマチックじゃなくてごめんなさい。あんまり面白くないですよねー」
line = "「あはは、映画みたいにドラマチックじゃなくてごめんなさい。あんまり面白くないですよねー」"

[[dialogue]]
speaker = "セナリィ"
# 「そ、そんなことありませんわよ。むしろ生々しいというか……真実味がありましたわね」
line = "「そ、そんなことありませんわよ。むしろ生々しいというか……真実味がありましたわね」"

[[dialogue]]
speaker = "ミウ"
# 「でも、ヒマワリちゃん、結構最初から会長さんに好き好きオーラ出してなかった？」
line = "「でも、ヒマワリちゃん、結構最初から会長さんに好き好きオーラ出してなかった？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「そ、そうだったー？　ミウから見て、あたし、そんなだったー？」
line = "「そ、そうだったー？　ミウから見て、あたし、そんなだったー？」"

[[dialogue]]
speaker = "ミウ"
# 「例えばだけど……会長さん相手だとボディタッチが多かったと思うよ。ハイタッチしたり、抱きついたり」
line = "「例えばだけど……会長さん相手だとボディタッチが多かったと思うよ。ハイタッチしたり、抱きついたり」"

[[dialogue]]
speaker = "ヒマワリ"
# 「えー？　そんなこと……あれ？　あった、かも……？　他の男の子にはしないのに……」
line = "「えー？　そんなこと……あれ？　あった、かも……？　他の男の子にはしないのに……」"

[[dialogue]]
speaker = "ミウ"
# 「だよね。他の男の人とはちょっと違うんだなって伝わってたよ」
line = "「だよね。他の男の人とはちょっと違うんだなって伝わってたよ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「そこまでー！？」
line = "「そこまでー！？」"

[[dialogue]]
speaker = "ミウ"
# 「会長さんと秋葉原デートの話をしてる時も、ヒマワリちゃん、ずっとニコニコで、女の子の顔になってたもん」
line = "「会長さんと秋葉原デートの話をしてる時も、ヒマワリちゃん、ずっとニコニコで、女の子の顔になってたもん」"

[[dialogue]]
speaker = "ヒマワリ"
# 「うぁー！　ほんとに！？　あたし、昔っから会長さんのこと好きすぎだったんじゃーん！？」
line = "「うぁー！　ほんとに！？　あたし、昔っから会長さんのこと好きすぎだったんじゃーん！？」"

[[dialogue]]
speaker = "セナリィ"
# 「ふふ、お付き合いに至った今となっては、微笑ましいだけですわね」
line = "「ふふ、お付き合いに至った今となっては、微笑ましいだけですわね」"

[[dialogue]]
speaker = "セナリィ"
# 「有難いことにゴールデングースの知名度も上がったお陰で、引っ張りだこ。休みらしい休みもありませんでしたわよね？」
line = "「有難いことにゴールデングースの知名度も上がったお陰で、引っ張りだこ。休みらしい休みもありませんでしたわよね？」"

[[dialogue]]
speaker = "セナリィ"
# 「それがあなたの負担になっているのだとしたら、私の望むところではありませんわ」
line = "「それがあなたの負担になっているのだとしたら、私の望むところではありませんわ」"

[[dialogue]]
speaker = "セナリィ"
# 「あなたは私の社員である前に、青春を謳歌するべき少女なのですから」
line = "「あなたは私の社員である前に、青春を謳歌するべき少女なのですから」"

[[dialogue]]
speaker = "ヒマワリ"
# 「だ、大丈夫です！　お気遣いなく！　ちゃんとデートもしてますし……うぁー、あたし、そんなんだったんだー……」
line = "「だ、大丈夫です！　お気遣いなく！　ちゃんとデートもしてますし……うぁー、あたし、そんなんだったんだー……」"

[[dialogue]]
speaker = "セナリィ"
# 「それで？　お、おふたりの関係はどこまで進んでいるのかしら？　いえ、野暮な話ではなくて、そう、私の社員として、聞いておかねば業務に支障が出かねませんから！」
line = "「それで？　お、おふたりの関係はどこまで進んでいるのかしら？　いえ、野暮な話ではなくて、そう、私の社員として、聞いておかねば業務に支障が出かねませんから！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「──ってことが事務所でありましてねー。セナリィ社長に根掘り葉掘り聞かれたんですよー」
line = "「──ってことが事務所でありましてねー。セナリィ社長に根掘り葉掘り聞かれたんですよー」"

[[dialogue]]
speaker = "unk"
# なんて答えたの？
line = "なんて答えたの？"

[[dialogue]]
speaker = "ヒマワリ"
# 「いろいろ話しちゃいましたよ。セナリィ社長に隠すことでもないですし」
line = "「いろいろ話しちゃいましたよ。セナリィ社長に隠すことでもないですし」"

[[dialogue]]
speaker = "unk"
# もしや、あんなことやこんなことまで！？
line = "もしや、あんなことやこんなことまで！？"

[[dialogue]]
speaker = "unk"
# いろいろ！？
line = "いろいろ！？"

[[dialogue]]
speaker = "ヒマワリ"
# 「んもー、会長さんってば何を慌ててるんですー？　心配しないでくださいよー」
line = "「んもー、会長さんってば何を慌ててるんですー？　心配しないでくださいよー」"

[[dialogue]]
speaker = "ヒマワリ"
# 「いくらあたしでも、深～いとこまで言うわけないじゃないですか～」
line = "「いくらあたしでも、深～いとこまで言うわけないじゃないですか～」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あんなことやこんなことはー……ミウにしか話してないですよ」
line = "「あんなことやこんなことはー……ミウにしか話してないですよ」"

[[dialogue]]
speaker = "unk"
# 話したの！？
line = "話したの！？"

[[dialogue]]
speaker = "unk"
# えっ……！？
line = "えっ……！？"

[[dialogue]]
speaker = "ヒマワリ"
# 「やー、親友には隠しておけないっていうか……言うまでもなく、ミウにはすぐバレちゃったんですよねー」
line = "「やー、親友には隠しておけないっていうか……言うまでもなく、ミウにはすぐバレちゃったんですよねー」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あたし、そんなに顔に出るのかなー。ミウが鋭すぎるんだと思うんですけどー。ま、ミウなら口は堅いですし問題ないですよ」
line = "「あたし、そんなに顔に出るのかなー。ミウが鋭すぎるんだと思うんですけどー。ま、ミウなら口は堅いですし問題ないですよ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「というわけで、すっかり会社公認の仲なんで。会長さん、これからも末永く、よろしくお願いしますねっ<emoji=heart04>」
line = "「というわけで、すっかり会社公認の仲なんで。会長さん、これからも末永く、よろしくお願いしますねっ<emoji=heart04>」"
