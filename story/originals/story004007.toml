[[dialogue]]
speaker = "ダッチ"
# 「シス！　お久しぶりですねぇ！！」
line = "「シス！　お久しぶりですねぇ！！」"

[[dialogue]]
speaker = "シエスタ"
# 「……ちっ。邪魔者が来たの」
line = "「……ちっ。邪魔者が来たの」"

[[dialogue]]
speaker = "unk"
# ……シスの知り合いか？
line = "……シスの知り合いか？"

[[dialogue]]
speaker = "シエスタ"
# 「ぜーんぜん♪　知らないヤツなの♪」
line = "「ぜーんぜん♪　知らないヤツなの♪」"

[[dialogue]]
speaker = "蘭美"
# 「会長。何だか目が虚ろというか……」
line = "「会長。何だか目が虚ろというか……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「……ダッチ様が仰っていた『支配』の影響でしょうか？」
line = "「……ダッチ様が仰っていた『支配』の影響でしょうか？」"

[[dialogue]]
speaker = "シュティレ"
# 「ええ。記憶が改竄されているようですね」
line = "「ええ。記憶が改竄されているようですね」"

[[dialogue]]
speaker = "unk"
# …………お前は？
line = "…………お前は？"

[[dialogue]]
speaker = "ダッチ"
# 「悲しいですねぇ、緋宮クロト様！　私のことを思い出してもいただけないとは！」
line = "「悲しいですねぇ、緋宮クロト様！　私のことを思い出してもいただけないとは！」"

[[dialogue]]
speaker = "ダッチ"
# 「ヌッフフフ。しかしご安心を！　すぐに貴方を呪縛から解き放ち──可憐なバニー服が似合う爆乳美少女に変身させてさしあげますよッ！！」
line = "「ヌッフフフ。しかしご安心を！　すぐに貴方を呪縛から解き放ち──可憐なバニー服が似合う爆乳美少女に変身させてさしあげますよッ！！」"

[[dialogue]]
speaker = "unk"
# なんだかすごく……嫌な気分だ……
line = "なんだかすごく……嫌な気分だ……"

[[dialogue]]
speaker = "unk"
# ……あんたとは初対面のはずだけど
line = "……あんたとは初対面のはずだけど"

[[dialogue]]
speaker = "蘭美"
# 「会長、目を覚まして！！　貴方はそのロストアイテムに操られてるのよ！」
line = "「会長、目を覚まして！！　貴方はそのロストアイテムに操られてるのよ！」"

[[dialogue]]
speaker = "unk"
# ……きみ、は？
line = "……きみ、は？"

[[dialogue]]
speaker = "蘭美"
# 「九浄家メイド隊の羽宮蘭美よ！　学園のリーダーなんでしょう、しゃんとしなさい！！」
line = "「九浄家メイド隊の羽宮蘭美よ！　学園のリーダーなんでしょう、しゃんとしなさい！！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「魔王様！　私たちと共に帰りましょう！」
line = "「魔王様！　私たちと共に帰りましょう！」"

[[dialogue]]
speaker = "シュティレ"
# 「そうです会長。皆、心配しています……！」
line = "「そうです会長。皆、心配しています……！」"

[[dialogue]]
speaker = "unk"
# 学園……星騎士……？
line = "学園……星騎士……？"

[[dialogue]]
speaker = "unk"
# …………魔王？
line = "…………魔王？"

[[dialogue]]
speaker = "シエスタ"
# 「……ごめんなさいなの、お兄ちゃん。ちょっとだけ、眠っててなの」
line = "「……ごめんなさいなの、お兄ちゃん。ちょっとだけ、眠っててなの」"

[[dialogue]]
speaker = "蘭美"
# 「あっ……！！」
line = "「あっ……！！」"

[[dialogue]]
speaker = "unk"
# 緋宮クロトの膝から力が抜け、その場にくずれ落ちる。
line = "緋宮クロトの膝から力が抜け、その場にくずれ落ちる。"

[[dialogue]]
speaker = "モンスター"
# 「イ～～～～♪」
line = "「イ～～～～♪」"

[[dialogue]]
speaker = "unk"
# 気を失った緋宮クロトを、シエスタの傀儡のモンスターたちが丁重に運び、安全なところまで移動させた──
line = "気を失った緋宮クロトを、シエスタの傀儡のモンスターたちが丁重に運び、安全なところまで移動させた──"

[[dialogue]]
speaker = "シエスタ"
# 「これで気兼ねなく、お前たちをぶちのめせるの」
line = "「これで気兼ねなく、お前たちをぶちのめせるの」"

[[dialogue]]
speaker = "シエスタ"
# 「頭のおかしいヘンタイアイテム……そしてその眷属！　手加減しないのっ！！」
line = "「頭のおかしいヘンタイアイテム……そしてその眷属！　手加減しないのっ！！」"

[[dialogue]]
speaker = "蘭美"
# 「待ちなさい！　誰が誰の眷属ですって！？」
line = "「待ちなさい！　誰が誰の眷属ですって！？」"

[[dialogue]]
speaker = "シエスタ"
# 「ダッチと一緒にいて、『欲望』の壁でシスの力を弾いてるの！　眷属でなくてなんなのっ！」
line = "「ダッチと一緒にいて、『欲望』の壁でシスの力を弾いてるの！　眷属でなくてなんなのっ！」"

[[dialogue]]
speaker = "蘭美"
# 「屈辱だわっ。こんな奴の手下だと思われてるの、私！？」
line = "「屈辱だわっ。こんな奴の手下だと思われてるの、私！？」"

[[dialogue]]
speaker = "ダッチ"
# 「寂しいことを言わないでください、シス！　久しぶりの兄妹の再会だというのに……」
line = "「寂しいことを言わないでください、シス！　久しぶりの兄妹の再会だというのに……」"

[[dialogue]]
speaker = "シエスタ"
# 「うるさいの！　ヘンタイは喋るんじゃないの！　お前なんかお兄ちゃんじゃないの！！　死ねなの！！！」
line = "「うるさいの！　ヘンタイは喋るんじゃないの！　お前なんかお兄ちゃんじゃないの！！　死ねなの！！！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ず、随分と嫌われているのですね、ダッチ様……？」
line = "「ず、随分と嫌われているのですね、ダッチ様……？」"

[[dialogue]]
speaker = "ダッチ"
# 「フフフ、反抗期なのですよ！　そういうところも可愛いのですがね！！」
line = "「フフフ、反抗期なのですよ！　そういうところも可愛いのですがね！！」"

[[dialogue]]
speaker = "シエスタ"
# 「ここで会ったが１００年目……八つ裂きにして、二度とその口利けないようにしてやるの！！！」
line = "「ここで会ったが１００年目……八つ裂きにして、二度とその口利けないようにしてやるの！！！」"

[[dialogue]]
speaker = "蘭美"
# 「反抗期ってレベルじゃないくらい嫌われてるじゃない！？　貴方、何をしたのよ！？」
line = "「反抗期ってレベルじゃないくらい嫌われてるじゃない！？　貴方、何をしたのよ！？」"

[[dialogue]]
speaker = "シュティレ"
# 「兄妹仲は劣悪のようですが、やることは変わりません。ドリルのサビにしてさしあげましょう。ぴょんぴょん」
line = "「兄妹仲は劣悪のようですが、やることは変わりません。ドリルのサビにしてさしあげましょう。ぴょんぴょん」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ええ。容赦は致しません！　ぴょんぴょん！」
line = "「ええ。容赦は致しません！　ぴょんぴょん！」"

[[dialogue]]
speaker = "蘭美"
# 「スピードで圧倒するわ……ぴょんっ！」
line = "「スピードで圧倒するわ……ぴょんっ！」"

[[dialogue]]
speaker = "ダッチ"
# 「フフフゥ！　子ウサギたちのぴょんぴょんエールで、欲望シールドもギンギンですッ！　行きますよ、皆様！！」
line = "「フフフゥ！　子ウサギたちのぴょんぴょんエールで、欲望シールドもギンギンですッ！　行きますよ、皆様！！」"

[[dialogue]]
speaker = "シエスタ"
# 「邪魔はさせないの……ようやく、ようやく理想のお兄ちゃんを手に入れたの！」
line = "「邪魔はさせないの……ようやく、ようやく理想のお兄ちゃんを手に入れたの！」"

[[dialogue]]
speaker = "シエスタ"
# 「シスは──『妹』のロストアイテム！　自分の世界を守るためにも、負けられないの！！」
line = "「シスは──『妹』のロストアイテム！　自分の世界を守るためにも、負けられないの！！」"

[[dialogue]]
speaker = "シュティレ"
# 「……『妹』？　『支配』ではないのですか」
line = "「……『妹』？　『支配』ではないのですか」"

[[dialogue]]
speaker = "ダッチ"
# 「はて？　私も初耳ですねぇ」
line = "「はて？　私も初耳ですねぇ」"

[[dialogue]]
speaker = "蘭美"
# 「お喋りは後にしなさい！　来るわよっ！！」
line = "「お喋りは後にしなさい！　来るわよっ！！」"

[[dialogue]]
speaker = "シエスタ"
# 「ウサギ狂いのヘンタイとその眷属──容赦しないの！！！」
line = "「ウサギ狂いのヘンタイとその眷属──容赦しないの！！！」"
