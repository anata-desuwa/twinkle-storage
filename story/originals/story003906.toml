[[dialogue]]
speaker = "エルデリーゼ"
# 「ヒマワリ様、ミウ様、先日は大変失礼しましたわ」
line = "「ヒマワリ様、ミウ様、先日は大変失礼しましたわ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「エルゼ先輩が謝ることないですよ！　お屋敷に忍び込んだあたしたちが悪いんですから」
line = "「エルゼ先輩が謝ることないですよ！　お屋敷に忍び込んだあたしたちが悪いんですから」"

[[dialogue]]
speaker = "ミウ"
# 「そうですよ。むしろ私たちこそ申し訳ありませんでした」
line = "「そうですよ。むしろ私たちこそ申し訳ありませんでした」"

[[dialogue]]
speaker = "ミウ"
# 「ところでエルデリーゼ先輩は今日もこちらのお屋敷にいらっしゃるんですね？」
line = "「ところでエルデリーゼ先輩は今日もこちらのお屋敷にいらっしゃるんですね？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「はい。他の場所では人の目を気にしなければなりませんが、ここなら思う存分メイド服を着られますの♪」
line = "「はい。他の場所では人の目を気にしなければなりませんが、ここなら思う存分メイド服を着られますの♪」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ヘレナ様からも好きに遊びに来てよいという許可を頂きましたし、本日はおふたりが立派にお役目を果たすところを見学させてもらいますわ！」
line = "「ヘレナ様からも好きに遊びに来てよいという許可を頂きましたし、本日はおふたりが立派にお役目を果たすところを見学させてもらいますわ！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「えへへ、あんまり見られてると恥ずかしいですけどね……」
line = "「えへへ、あんまり見られてると恥ずかしいですけどね……」"

[[dialogue]]
speaker = "ミウ"
# （でも、エルデリーゼ先輩が近くにいてくれるのは好都合……人工戦闘服の能力を見るチャンスがあるかもしれない）
line = "（でも、エルデリーゼ先輩が近くにいてくれるのは好都合……人工戦闘服の能力を見るチャンスがあるかもしれない）"

[[dialogue]]
speaker = "閃"
# 「指導係の閃です。よろしくお願いします」
line = "「指導係の閃です。よろしくお願いします」"

[[dialogue]]
speaker = "せつな"
# 「同じくせつなでござる。よろしくお願いするでござる！」
line = "「同じくせつなでござる。よろしくお願いするでござる！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「よろしくお願いしまーす♪」
line = "「よろしくお願いしまーす♪」"

[[dialogue]]
speaker = "ミウ"
# 「よろしくお願いします」
line = "「よろしくお願いします」"

[[dialogue]]
speaker = "閃"
# 「では、さっそく指導を始めさせて頂きます」
line = "「では、さっそく指導を始めさせて頂きます」"

[[dialogue]]
speaker = "閃"
# 「まずは家人の心得について……家人の仕事とは、主が望み、喜ぶこと全てにお応えする……それに尽きます」
line = "「まずは家人の心得について……家人の仕事とは、主が望み、喜ぶこと全てにお応えする……それに尽きます」"

[[dialogue]]
speaker = "閃"
# 「主の健康のため、チリひとつない空間を提供する掃除。清潔なお召し物を身に着けていただく洗濯。美味なのは当然、完璧な栄養バランスをも兼ね備えた料理」
line = "「主の健康のため、チリひとつない空間を提供する掃除。清潔なお召し物を身に着けていただく洗濯。美味なのは当然、完璧な栄養バランスをも兼ね備えた料理」"

[[dialogue]]
speaker = "閃"
# 「常に安全に気を配り、危険があれば速やかに排除し、陰ながら主の行動をサポートする……」
line = "「常に安全に気を配り、危険があれば速やかに排除し、陰ながら主の行動をサポートする……」"

[[dialogue]]
speaker = "閃"
# 「絶対的な奉仕の心を胸に忠誠を尽くす、それが九浄家にお仕えする者の心得なのです！」
line = "「絶対的な奉仕の心を胸に忠誠を尽くす、それが九浄家にお仕えする者の心得なのです！」"

[[dialogue]]
speaker = "せつな"
# 「あ～、閃殿のお嬢様に対する忠誠心は、私情が入っててちょっと極端なのでござる」
line = "「あ～、閃殿のお嬢様に対する忠誠心は、私情が入っててちょっと極端なのでござる」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ええと、要するに何でもやる、ってことですかね？」
line = "「ええと、要するに何でもやる、ってことですかね？」"

[[dialogue]]
speaker = "ミウ"
# 「であればゴールデングースでやっていることとおよそ同じですね」
line = "「であればゴールデングースでやっていることとおよそ同じですね」"

[[dialogue]]
speaker = "せつな"
# 「メイド隊メンバーはお屋敷で働きつつも、当主様からの勅命を受け、隠密・戦闘要員として外部での活動も多くおこなっているでござる」
line = "「メイド隊メンバーはお屋敷で働きつつも、当主様からの勅命を受け、隠密・戦闘要員として外部での活動も多くおこなっているでござる」"

[[dialogue]]
speaker = "せつな"
# 「お仕事は多岐にわたるでござるよ。まさに『何でもやらなきゃいけない』でござる」
line = "「お仕事は多岐にわたるでござるよ。まさに『何でもやらなきゃいけない』でござる」"

[[dialogue]]
speaker = "閃"
# 「新星学園のスポンサーである九浄家は、新星学園・流星学園を始めとして、様々な現場に人材を派遣しています」
line = "「新星学園のスポンサーである九浄家は、新星学園・流星学園を始めとして、様々な現場に人材を派遣しています」"

[[dialogue]]
speaker = "ミウ"
# 「五名門のひとつである九浄家は、流星市国の『人材』を司ってますものね」
line = "「五名門のひとつである九浄家は、流星市国の『人材』を司ってますものね」"

[[dialogue]]
speaker = "閃"
# 「よくご存じで。その人材派遣の中には、ボディガードや用心棒といった仕事もありまして」
line = "「よくご存じで。その人材派遣の中には、ボディガードや用心棒といった仕事もありまして」"

[[dialogue]]
speaker = "せつな"
# 「現場でモノになるか、まずは実力の程を見せていただきたいでござるよ。手合わせ、お願いいたしまする！」
line = "「現場でモノになるか、まずは実力の程を見せていただきたいでござるよ。手合わせ、お願いいたしまする！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「わかりました！　あたしたち、どっちかって言うと家事よりそっちの方が得意ですから！」
line = "「わかりました！　あたしたち、どっちかって言うと家事よりそっちの方が得意ですから！」"

[[dialogue]]
speaker = "ミウ"
# 「こう見えて結構な数の修羅場、潜っているんですよ？」
line = "「こう見えて結構な数の修羅場、潜っているんですよ？」"

[[dialogue]]
speaker = "閃"
# 「それは楽しみです。せつな、迎え撃ちますよ」
line = "「それは楽しみです。せつな、迎え撃ちますよ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「では、皆様、準備はよろしいですの？　ドキドキのタッグバトル、スタートですわーっ！」
line = "「では、皆様、準備はよろしいですの？　ドキドキのタッグバトル、スタートですわーっ！」"

[[dialogue]]
speaker = "ミウ"
# 「やぁああああっ！！！」
line = "「やぁああああっ！！！」"

[[dialogue]]
speaker = "閃"
# 「ミウさんの武器……ふふ、可愛い顔にそぐわず、物騒な武器をお持ちですね？」
line = "「ミウさんの武器……ふふ、可愛い顔にそぐわず、物騒な武器をお持ちですね？」"

[[dialogue]]
speaker = "ミウ"
# 「ヘレナさんにもらったこの人工戦闘服の武器ですよ」
line = "「ヘレナさんにもらったこの人工戦闘服の武器ですよ」"

[[dialogue]]
speaker = "閃"
# 「ですが……あまり慣れていないようですね。大きさに振り回されているように見えますが？」
line = "「ですが……あまり慣れていないようですね。大きさに振り回されているように見えますが？」"

[[dialogue]]
speaker = "ミウ"
# 「今日が初めてですから。それに私は、そもそも近接戦は得意ではないんです」
line = "「今日が初めてですから。それに私は、そもそも近接戦は得意ではないんです」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そういえば……私と戦った時はヒマワリ様が前衛でしたわ」
line = "「そういえば……私と戦った時はヒマワリ様が前衛でしたわ」"

[[dialogue]]
speaker = "せつな"
# 「どうして役目を交換したのでござる？」
line = "「どうして役目を交換したのでござる？」"

[[dialogue]]
speaker = "ミウ"
# 「それはヘレナさんに聞いてください。人工戦闘服の武器を決めたのはヘレナさんなんですから」
line = "「それはヘレナさんに聞いてください。人工戦闘服の武器を決めたのはヘレナさんなんですから」"

[[dialogue]]
speaker = "ミウ"
# 「ですが──新しい発見です。このフォーメーションも悪くないかもしれません」
line = "「ですが──新しい発見です。このフォーメーションも悪くないかもしれません」"

[[dialogue]]
speaker = "ヒマワリ"
# 「シュートっ！」
line = "「シュートっ！」"

[[dialogue]]
speaker = "せつな"
# 「させないでござるよっ！」
line = "「させないでござるよっ！」"

[[dialogue]]
speaker = "せつな"
# 「大ぶりで目立つ武器で注意を集めつつ、本命の一撃はヒマワリ殿の弓でござる」
line = "「大ぶりで目立つ武器で注意を集めつつ、本命の一撃はヒマワリ殿の弓でござる」"

[[dialogue]]
speaker = "せつな"
# 「さすれば、その弓を防ぎかく乱するのが、忍であるせつなのお役目！　ヒマワリ殿、せつなに当てられるでござるか？」
line = "「さすれば、その弓を防ぎかく乱するのが、忍であるせつなのお役目！　ヒマワリ殿、せつなに当てられるでござるか？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「わっ、せつなさん速すぎっ！　狙いが定まんないよー！　ズルいなー忍者ズルいっ！」
line = "「わっ、せつなさん速すぎっ！　狙いが定まんないよー！　ズルいなー忍者ズルいっ！」"

[[dialogue]]
speaker = "せつな"
# 「ズルくないでござる！　勝負の世界は、非情なのでござるよ！」
line = "「ズルくないでござる！　勝負の世界は、非情なのでござるよ！」"

[[dialogue]]
speaker = "ミウ"
# 「でも、ヒマワリちゃんにばかり気を取られていると──私もいるんですよ？」
line = "「でも、ヒマワリちゃんにばかり気を取られていると──私もいるんですよ？」"

[[dialogue]]
speaker = "せつな"
# 「っ！　ミウ殿、いつの間に接近を！？」
line = "「っ！　ミウ殿、いつの間に接近を！？」"

[[dialogue]]
speaker = "ミウ"
# 「せつなさん、これで１本です！」
line = "「せつなさん、これで１本です！」"

[[dialogue]]
speaker = "せつな"
# 「ふっふっふ、それはどうでござるかな？」
line = "「ふっふっふ、それはどうでござるかな？」"

[[dialogue]]
speaker = "ミウ"
# 「手応えがないっ！？」
line = "「手応えがないっ！？」"

[[dialogue]]
speaker = "せつな"
# 「ふっふっふ、残念でござったな、そっちのせつなは影分身っ！　ミウ殿、その首、いただきでござる！」
line = "「ふっふっふ、残念でござったな、そっちのせつなは影分身っ！　ミウ殿、その首、いただきでござる！」"

[[dialogue]]
speaker = "ミウ"
# 「──なーんて。わかってますよ。ヒマワリちゃん、８時方向！」
line = "「──なーんて。わかってますよ。ヒマワリちゃん、８時方向！」"

[[dialogue]]
speaker = "せつな"
# 「なっ！？」
line = "「なっ！？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「せつなさんはミウが抑えて、その隙にあたしが閃さんを撃ーつ！」
line = "「せつなさんはミウが抑えて、その隙にあたしが閃さんを撃ーつ！」"

[[dialogue]]
speaker = "閃"
# 「くっ……！」
line = "「くっ……！」"

[[dialogue]]
speaker = "閃"
# 「さすがですね、見事なコンビネーションでした……」
line = "「さすがですね、見事なコンビネーションでした……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「うーん、さすが……ごめんミウ、奇襲失敗だよ。しっかり防がれちゃった」
line = "「うーん、さすが……ごめんミウ、奇襲失敗だよ。しっかり防がれちゃった」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「いつからこんな作戦を考えていたのですか？」
line = "「いつからこんな作戦を考えていたのですか？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「えーと、作戦っていうか……その場のノリ、みたいな感じですよ？」
line = "「えーと、作戦っていうか……その場のノリ、みたいな感じですよ？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あたしはミウの動きに合わせて動いただけっていうか……」
line = "「あたしはミウの動きに合わせて動いただけっていうか……」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃんなら私の狙いをすぐに汲み取ってくれると信頼していますから」
line = "「ヒマワリちゃんなら私の狙いをすぐに汲み取ってくれると信頼していますから」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「まあ、完全に即興のコンビネーションでしたの！？」
line = "「まあ、完全に即興のコンビネーションでしたの！？」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃんとお揃いの戦闘服だからでしょうか。お互いの体が繋がっているみたいで、自然と動きがリンクしていたんです」
line = "「ヒマワリちゃんとお揃いの戦闘服だからでしょうか。お互いの体が繋がっているみたいで、自然と動きがリンクしていたんです」"

[[dialogue]]
speaker = "ヒマワリ"
# 「せつなさんのスピードに追いつけたのも、この戦闘服のおかげかな？　いつもより体が軽くて、飛んでるみたいだったよ」
line = "「せつなさんのスピードに追いつけたのも、この戦闘服のおかげかな？　いつもより体が軽くて、飛んでるみたいだったよ」"

[[dialogue]]
speaker = "ミウ"
# 「九浄家の誇る人工戦闘服……使ってみて実感しました。本当にすごいです」
line = "「九浄家の誇る人工戦闘服……使ってみて実感しました。本当にすごいです」"

[[dialogue]]
speaker = "せつな"
# 「しからばその戦闘服の力、今一度、使ってもらうでござるよ」
line = "「しからばその戦闘服の力、今一度、使ってもらうでござるよ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ふぇ？」
line = "「ふぇ？」"

[[dialogue]]
speaker = "閃"
# 「ここからが本番です。私たちと一緒に来てください」
line = "「ここからが本番です。私たちと一緒に来てください」"

[[dialogue]]
speaker = "ミウ"
# 「それで私たちは何をすればいいですか？」
line = "「それで私たちは何をすればいいですか？」"

[[dialogue]]
speaker = "せつな"
# 「他でもござらん。犯罪グループの調査でござる」
line = "「他でもござらん。犯罪グループの調査でござる」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「犯罪グループ！　それだけで危険な香りがしますの……」
line = "「犯罪グループ！　それだけで危険な香りがしますの……」"

[[dialogue]]
speaker = "閃"
# 「ここ最近、複数人で家に押し入り、金品を強奪するという事件が頻発しているんです」
line = "「ここ最近、複数人で家に押し入り、金品を強奪するという事件が頻発しているんです」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ひっどいなー！　そんなの絶対許せないよー！」
line = "「ひっどいなー！　そんなの絶対許せないよー！」"

[[dialogue]]
speaker = "ミウ"
# 「だよね……犯人を見つけ次第、全身のありとあらゆる穴という穴にアッツ～～いお灸を据えようね」
line = "「だよね……犯人を見つけ次第、全身のありとあらゆる穴という穴にアッツ～～いお灸を据えようね」"

[[dialogue]]
speaker = "せつな"
# 「うひぃ！？　ミウ殿の言い回し、想像しただけでおっかないでござるな！？」
line = "「うひぃ！？　ミウ殿の言い回し、想像しただけでおっかないでござるな！？」"

[[dialogue]]
speaker = "閃"
# 「この近隣が過去の犯行現場です。なかなか尻尾を見せないので、地道にパトロールをしているのですが……」
line = "「この近隣が過去の犯行現場です。なかなか尻尾を見せないので、地道にパトロールをしているのですが……」"

[[dialogue]]
speaker = "せつな"
# 「前回は未然に防げたのでござるが、取り逃がしてしまい……イタチごっこなのでござる」
line = "「前回は未然に防げたのでござるが、取り逃がしてしまい……イタチごっこなのでござる」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「敵の居場所を突き止めるよい手段があれば良いのですが……」
line = "「敵の居場所を突き止めるよい手段があれば良いのですが……」"

[[dialogue]]
speaker = "ミウ"
# 「うーん……遠く離れた地方で類似の事件はなく、同様の犯行が流星市国内で繰り返し起きているのでしたら、犯人は流星市国内の個人情報を大量に入手している……」
line = "「うーん……遠く離れた地方で類似の事件はなく、同様の犯行が流星市国内で繰り返し起きているのでしたら、犯人は流星市国内の個人情報を大量に入手している……」"

[[dialogue]]
speaker = "ミウ"
# 「犯罪グループは流星市国内に潜伏しているのは間違いないと思います」
line = "「犯罪グループは流星市国内に潜伏しているのは間違いないと思います」"

[[dialogue]]
speaker = "ミウ"
# 「狙われるのは、<b>それなりに</b>お金を持っている層ですね。警察や配送業者を装い、貯蓄額や金目の物の有無を事前に調査しているのでしょう」
line = "「狙われるのは、<b>それなりに</b>お金を持っている層ですね。警察や配送業者を装い、貯蓄額や金目の物の有無を事前に調査しているのでしょう」"

[[dialogue]]
speaker = "ヒマワリ"
# 「『それなりに』？　この辺は大きいお屋敷も多いし、お金持ちがいっぱい住んでるよ」
line = "「『それなりに』？　この辺は大きいお屋敷も多いし、お金持ちがいっぱい住んでるよ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そうですわ！　どうせ襲うならお金持ちを狙った方が良いのではありませんか？」
line = "「そうですわ！　どうせ襲うならお金持ちを狙った方が良いのではありませんか？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「エルゼ先輩の実家のお屋敷みたいな？」
line = "「エルゼ先輩の実家のお屋敷みたいな？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ええ。……まあ我が家はセキュリティが厳しいですから、お薦めは致しませんが」
line = "「ええ。……まあ我が家はセキュリティが厳しいですから、お薦めは致しませんが」"

[[dialogue]]
speaker = "ミウ"
# 「まさにそれが、<b>それなりに</b>、な理由ですよ」
line = "「まさにそれが、<b>それなりに</b>、な理由ですよ」"

[[dialogue]]
speaker = "ミウ"
# 「大きなお屋敷は監視カメラやセキュリティがしっかりしてて防犯意識が高いですからね、潜入に５分以上かかるような家は最初からターゲットにしないんです」
line = "「大きなお屋敷は監視カメラやセキュリティがしっかりしてて防犯意識が高いですからね、潜入に５分以上かかるような家は最初からターゲットにしないんです」"

[[dialogue]]
speaker = "閃"
# 「被害者宅の１軒目はここ、２軒目はここです。位置情報から、ある程度の法則性を見出せないでしょうか」
line = "「被害者宅の１軒目はここ、２軒目はここです。位置情報から、ある程度の法則性を見出せないでしょうか」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃん、何か気づかない？　私は次に狙われるのはこの付近だと思うんだけど──」
line = "「ヒマワリちゃん、何か気づかない？　私は次に狙われるのはこの付近だと思うんだけど──」"

[[dialogue]]
speaker = "ヒマワリ"
# 「何回も繰り返しているなら、そろそろ足が付きそうだと警戒するよね。犯人は『予想されるような家』は避けるんじゃないかな」
line = "「何回も繰り返しているなら、そろそろ足が付きそうだと警戒するよね。犯人は『予想されるような家』は避けるんじゃないかな」"

[[dialogue]]
speaker = "ミウ"
# 「じゃ、今回は逆張りだね。どこだと思う？」
line = "「じゃ、今回は逆張りだね。どこだと思う？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あー……お金の消える気配がするのは、この家かな？　なんとなく、イヤ～な臭いがするんだよね」
line = "「あー……お金の消える気配がするのは、この家かな？　なんとなく、イヤ～な臭いがするんだよね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ここは……被害にあった１軒目の隣ではありませんの？　まさか、そんな大胆に──」
line = "「ここは……被害にあった１軒目の隣ではありませんの？　まさか、そんな大胆に──」"

[[dialogue]]
speaker = "ミウ"
# 「同じ価格帯の家ですから、同レベルの資産を抱えているでしょう。ほとぼりが冷めた頃、ウチには来ないだろうという『まさか』の盲点を突く可能性はあります」
line = "「同じ価格帯の家ですから、同レベルの資産を抱えているでしょう。ほとぼりが冷めた頃、ウチには来ないだろうという『まさか』の盲点を突く可能性はあります」"

[[dialogue]]
speaker = "せつな"
# 「なんだか、すごい説得力があるでござる……！」
line = "「なんだか、すごい説得力があるでござる……！」"

[[dialogue]]
speaker = "閃"
# 「いいですね。ミウさんの判断と、ヒマワリさんの嗅覚を信じましょう」
line = "「いいですね。ミウさんの判断と、ヒマワリさんの嗅覚を信じましょう」"

[[dialogue]]
speaker = "せつな"
# 「スモークガラスに、真っ黒なナンバープレートのワゴン……如何にも怪しい車が来たでござる……！」
line = "「スモークガラスに、真っ黒なナンバープレートのワゴン……如何にも怪しい車が来たでござる……！」"

[[dialogue]]
speaker = "閃"
# 「間違いないでしょう……あっ、家の前に停まりました」
line = "「間違いないでしょう……あっ、家の前に停まりました」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「いよいよ悪党を成敗ですわね！　腕が鳴りますわ！」
line = "「いよいよ悪党を成敗ですわね！　腕が鳴りますわ！」"

[[dialogue]]
speaker = "閃"
# 「あ……エルデリーゼ様はここまでで。ここからは桜十路家のお嬢様にはお見せできない世界ですので」
line = "「あ……エルデリーゼ様はここまでで。ここからは桜十路家のお嬢様にはお見せできない世界ですので」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「えーーーっ！　そんな事言わずに、私も連れて行って欲しいですの……」
line = "「えーーーっ！　そんな事言わずに、私も連れて行って欲しいですの……」"

[[dialogue]]
speaker = "閃"
# 「もうしわけありません……」
line = "「もうしわけありません……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「仕方ありませんの……ミウ様、ヒマワリ様！　どうぞお気をつけて！」
line = "「仕方ありませんの……ミウ様、ヒマワリ様！　どうぞお気をつけて！」"

[[dialogue]]
speaker = "ミウ"
# 「ありがとうございます」
line = "「ありがとうございます」"

[[dialogue]]
speaker = "ヒマワリ"
# 「頑張ってきますねっ！」
line = "「頑張ってきますねっ！」"

[[dialogue]]
speaker = "閃"
# 「では、制圧します！」
line = "「では、制圧します！」"

[[dialogue]]
speaker = "せつな"
# 「不埒な輩は、まとめて成敗でござるっ！」
line = "「不埒な輩は、まとめて成敗でござるっ！」"

[[dialogue]]
speaker = "強盗"
# 「な、なんだ、てめぇら！？」
line = "「な、なんだ、てめぇら！？」"

[[dialogue]]
speaker = "unk"
# こうして４人の活躍により、強盗事件は未然に防ぐことができたのだった。
line = "こうして４人の活躍により、強盗事件は未然に防ぐことができたのだった。"

[[dialogue]]
speaker = "閃"
# 「おふたりとも、お手柄でした。ですが、彼らは犯罪グループの末端の構成員でしかないようですね」
line = "「おふたりとも、お手柄でした。ですが、彼らは犯罪グループの末端の構成員でしかないようですね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ボスをやっつけない限り、雑魚モンスターがわらわら出てきちゃうみたいなー？」
line = "「ボスをやっつけない限り、雑魚モンスターがわらわら出てきちゃうみたいなー？」"

[[dialogue]]
speaker = "ミウ"
# 「焦げ臭いならば、火元から断たないと、ですね」
line = "「焦げ臭いならば、火元から断たないと、ですね」"

[[dialogue]]
speaker = "ミウ"
# 「せつなさん、捕まえた犯人に聞いてみましょう。１人、連れてきてください」
line = "「せつなさん、捕まえた犯人に聞いてみましょう。１人、連れてきてください」"

[[dialogue]]
speaker = "せつな"
# 「そんな簡単に口を割るとも思えないでござるが」
line = "「そんな簡単に口を割るとも思えないでござるが」"

[[dialogue]]
speaker = "ミウ"
# 「はい、私も簡単に割ってくれるとは思ってませんよ。なので、簡単ではない方法で尋ねてみましょう♪」
line = "「はい、私も簡単に割ってくれるとは思ってませんよ。なので、簡単ではない方法で尋ねてみましょう♪」"

[[dialogue]]
speaker = "ミウ"
# 「全部なくなっちゃう前に、話してくれるといいんですけどね」
line = "「全部なくなっちゃう前に、話してくれるといいんですけどね」"

[[dialogue]]
speaker = "閃"
# 「『全部なくなっちゃう前』……？　あの、ミウさん？　その大きな剃刀で、何をするつもりなんです……？」
line = "「『全部なくなっちゃう前』……？　あの、ミウさん？　その大きな剃刀で、何をするつもりなんです……？」"

[[dialogue]]
speaker = "強盗"
# 「んぎゃああああぁぁぁぁっ！！？　わかった話す！　知ってること全部話すからもうやめ、やめてくれぇえええぇえぇっ！」
line = "「んぎゃああああぁぁぁぁっ！！？　わかった話す！　知ってること全部話すからもうやめ、やめてくれぇえええぇえぇっ！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ん……この野太い悲鳴は何の悲鳴ですの？」
line = "「ん……この野太い悲鳴は何の悲鳴ですの？」"

[[dialogue]]
speaker = "unk"
# 最初は強情だった構成員の絶叫が響く。
line = "最初は強情だった構成員の絶叫が響く。"

[[dialogue]]
speaker = "unk"
# ミウの尋問が始まってから約１０分ほどで、犯罪グループの指示役の潜入するアジトが明らかになった。
line = "ミウの尋問が始まってから約１０分ほどで、犯罪グループの指示役の潜入するアジトが明らかになった。"

[[dialogue]]
speaker = "せつな"
# 「ガクガクブルブル……ミウ殿、恐ろしい子でござる……！」
line = "「ガクガクブルブル……ミウ殿、恐ろしい子でござる……！」"

[[dialogue]]
speaker = "閃"
# 「お、お手柄です、ミウさん」
line = "「お、お手柄です、ミウさん」"

[[dialogue]]
speaker = "ミウ"
# 「ありがとうございます♪　ゴールデングースで培った技術が活かせました」
line = "「ありがとうございます♪　ゴールデングースで培った技術が活かせました」"

[[dialogue]]
speaker = "ヒマワリ"
# 「うんうん、あたしたちを育ててくれたセナリィ社長のおかげ！　感謝感謝だね！」
line = "「うんうん、あたしたちを育ててくれたセナリィ社長のおかげ！　感謝感謝だね！」"

[[dialogue]]
speaker = "せつな"
# 「……おや？　せつなの記憶が確かならば、ヒマワリ殿はセナリィ殿に嫌気が差していたのではござらぬか？　主殿との面接の時──」
line = "「……おや？　せつなの記憶が確かならば、ヒマワリ殿はセナリィ殿に嫌気が差していたのではござらぬか？　主殿との面接の時──」"

[[dialogue]]
speaker = "ヒマワリ"
# 「そ、そうだった、そうでした！　セナリィ社長に感謝なんて、これっぽっちもしてないよーだ！」
line = "「そ、そうだった、そうでした！　セナリィ社長に感謝なんて、これっぽっちもしてないよーだ！」"

[[dialogue]]
speaker = "unk"
# その数日後、続けざまに強盗事件を起こしていた犯罪グループは壊滅。
line = "その数日後、続けざまに強盗事件を起こしていた犯罪グループは壊滅。"

[[dialogue]]
speaker = "unk"
# 首謀者は海外に逃亡する前に捕縛され、法の裁きを受けることとなった。
line = "首謀者は海外に逃亡する前に捕縛され、法の裁きを受けることとなった。"
