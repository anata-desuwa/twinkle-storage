[[dialogue]]
speaker = "unk"
# 第５話,『思うがママに』,B
line = "第５話,『思うがママに』,B"

[[dialogue]]
speaker = "unk"
# ルヴィネ率いる一行が次に向かったのは、星見家だった。
line = "ルヴィネ率いる一行が次に向かったのは、星見家だった。"

[[dialogue]]
speaker = "unk"
# 教皇庁の前で待っていたフィオナが、丁寧に挨拶を交わす。
line = "教皇庁の前で待っていたフィオナが、丁寧に挨拶を交わす。"

[[dialogue]]
speaker = "unk"
# それから、２人は流星教皇のもとへ向かうこととなった。
line = "それから、２人は流星教皇のもとへ向かうこととなった。"

[[dialogue]]
speaker = "紅明"
# 「ルヴィっちとフィオナっち、教皇さんのとこまで行くみたいだ」
line = "「ルヴィっちとフィオナっち、教皇さんのとこまで行くみたいだ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それじゃあ、わたくし達はここで待っていましょうか」
line = "「それじゃあ、わたくし達はここで待っていましょうか」"

[[dialogue]]
speaker = "ラクシャ"
# 「──お、セシアじゃん」
line = "「──お、セシアじゃん」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あら、ラクシャ。ここで会うとは奇遇ね」
line = "「あら、ラクシャ。ここで会うとは奇遇ね」"

[[dialogue]]
speaker = "ラクシャ"
# 「まったくだね。ルヴィネさまがアルタイルの要人の元を回ってるってのは聞いてたけど、今回は２人が付き添いなんだ？」
line = "「まったくだね。ルヴィネさまがアルタイルの要人の元を回ってるってのは聞いてたけど、今回は２人が付き添いなんだ？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ええ、そうよ。つい先ほどまで九浄家にいて、その前は新星学園にいたわ」
line = "「ええ、そうよ。つい先ほどまで九浄家にいて、その前は新星学園にいたわ」"

[[dialogue]]
speaker = "ラクシャ"
# 「へえ、なんか結構楽しそうだね。ボクもついてっちゃおっかな～？」
line = "「へえ、なんか結構楽しそうだね。ボクもついてっちゃおっかな～？」"

[[dialogue]]
speaker = "紅明"
# 「んん？　環っちがラクシャ？　ってどゆこと……？」
line = "「んん？　環っちがラクシャ？　ってどゆこと……？」"

[[dialogue]]
speaker = "ラクシャ"
# 「あ、うん。実はボクね、セシアと同じ守護天使だったりするんだよね～」
line = "「あ、うん。実はボクね、セシアと同じ守護天使だったりするんだよね～」"

[[dialogue]]
speaker = "紅明"
# 「ええええええっ！！！」
line = "「ええええええっ！！！」"

[[dialogue]]
speaker = "紅明"
# 「そ、そーだったんだ……。さすがにこいつは驚きだぜ……！」
line = "「そ、そーだったんだ……。さすがにこいつは驚きだぜ……！」"

[[dialogue]]
speaker = "ラクシャ"
# 「呼び方は環でもラクシャでも任せるよ。好きなように呼んで」
line = "「呼び方は環でもラクシャでも任せるよ。好きなように呼んで」"

[[dialogue]]
speaker = "紅明"
# 「わかった。ま、慣れてるからね。今まで通り環っちって呼ばせてもらうことにするぜ☆」
line = "「わかった。ま、慣れてるからね。今まで通り環っちって呼ばせてもらうことにするぜ☆」"

[[dialogue]]
speaker = "ラクシャ"
# 「オッケー♪　ん……？」
line = "「オッケー♪　ん……？」"

[[dialogue]]
speaker = "ラクシャ"
# 「なーんか昔のセシアを思わせるみたいなその格好……もしかして、ルヴィネさまと新しい契約を結んで覚醒した？」
line = "「なーんか昔のセシアを思わせるみたいなその格好……もしかして、ルヴィネさまと新しい契約を結んで覚醒した？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ええ、まだ以前の力には遠く及ばないけれど、《万成》のアウクセシアの力が蘇ったわ」
line = "「ええ、まだ以前の力には遠く及ばないけれど、《万成》のアウクセシアの力が蘇ったわ」"

[[dialogue]]
speaker = "ラクシャ"
# 「へぇ～そうなんだ！　おめでとう！」
line = "「へぇ～そうなんだ！　おめでとう！」"

[[dialogue]]
speaker = "紅明"
# 「新しい契約……話の感じだと環っちもルヴィっちと契約したの？」
line = "「新しい契約……話の感じだと環っちもルヴィっちと契約したの？」"

[[dialogue]]
speaker = "ラクシャ"
# 「うん。守護天使たちはみんな１対１で、ルヴィネさまと新たに<ruby=パス>経路</ruby>を繋いだんだ」
line = "「うん。守護天使たちはみんな１対１で、ルヴィネさまと新たに<ruby>経路<rt>パス</rt></ruby>を繋いだんだ」"

[[dialogue]]
speaker = "紅明"
# 「ごくり……アタシには想像もつかない世界だなぁ。守護天使と女神様の契約──聞いてるだけでもすごそうだ」
line = "「ごくり……アタシには想像もつかない世界だなぁ。守護天使と女神様の契約──聞いてるだけでもすごそうだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「といっても、そんなに壮大で荘厳なことをしてるわけじゃないよ」
line = "「といっても、そんなに壮大で荘厳なことをしてるわけじゃないよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「例えるなら、テルル社長からルヴィネ社長に代わるから、個人面談を受けてお互いを理解し合った、みたいな感じ？」
line = "「例えるなら、テルル社長からルヴィネ社長に代わるから、個人面談を受けてお互いを理解し合った、みたいな感じ？」"

[[dialogue]]
speaker = "紅明"
# 「それはそれでノリが軽すぎない！？　分かりやすくて助かるけどさ～」
line = "「それはそれでノリが軽すぎない！？　分かりやすくて助かるけどさ～」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あ、そうだ。ラクシャに聞きたいことがあったの」
line = "「あ、そうだ。ラクシャに聞きたいことがあったの」"

[[dialogue]]
speaker = "ラクシャ"
# 「セシアがボクに？　いいんだけど、もしかして真面目な話？」
line = "「セシアがボクに？　いいんだけど、もしかして真面目な話？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「もちろん真剣な話よ」
line = "「もちろん真剣な話よ」"

[[dialogue]]
speaker = "ラクシャ"
# 「ふぅん……今は特に、差し迫った深刻な話なんてなかったと思うけど。何だろ、聞かせてよ」
line = "「ふぅん……今は特に、差し迫った深刻な話なんてなかったと思うけど。何だろ、聞かせてよ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「新しい、ママのことよ」
line = "「新しい、ママのことよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "ラクシャ"
# 「シリアスに受け取ったボクが馬鹿だったよ」
line = "「シリアスに受け取ったボクが馬鹿だったよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「で？　なにさ、そのママのことって」
line = "「で？　なにさ、そのママのことって」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「デネブにそれはそれは母性あふれるママがいるらしいの。あなた、心当たりないかしら？」
line = "「デネブにそれはそれは母性あふれるママがいるらしいの。あなた、心当たりないかしら？」"

[[dialogue]]
speaker = "ラクシャ"
# 「デネブのママ～？　んー、ちょっとそれだけじゃ分からないかな～。他に何か情報はないの？」
line = "「デネブのママ～？　んー、ちょっとそれだけじゃ分からないかな～。他に何か情報はないの？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ええと、ナターシャに聞いた話によると……選挙管理委員会にいると言っていたかしら」
line = "「ええと、ナターシャに聞いた話によると……選挙管理委員会にいると言っていたかしら」"

[[dialogue]]
speaker = "ラクシャ"
# 「……ああ、あの子のことかな？」
line = "「……ああ、あの子のことかな？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「──知っているのね！？」
line = "「──知っているのね！？」"

[[dialogue]]
speaker = "ラクシャ"
# 「うん。ちょうどこっちにいた頃は、梨緒といっしょに会長の監視をしてたからね」
line = "「うん。ちょうどこっちにいた頃は、梨緒といっしょに会長の監視をしてたからね」"

[[dialogue]]
speaker = "ラクシャ"
# 「あの子かあ……確かにセシアの好きそうな母性あふれる感じかもね。うん」
line = "「あの子かあ……確かにセシアの好きそうな母性あふれる感じかもね。うん」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ぜひ会いたいわ！　セッティングしてちょうだい♪」
line = "「ぜひ会いたいわ！　セッティングしてちょうだい♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「そう簡単に言わないでよ。相手はデネブ人。平行世界をまたいだところにいる存在なんだよ？」
line = "「そう簡単に言わないでよ。相手はデネブ人。平行世界をまたいだところにいる存在なんだよ？」"

[[dialogue]]
speaker = "紅明"
# 「なんか平行世界を移動する門が開通したとかって話、なかったっけ？」
line = "「なんか平行世界を移動する門が開通したとかって話、なかったっけ？」"

[[dialogue]]
speaker = "ラクシャ"
# 「以前に比べれば全然現実的にはなったけど……同一存在のこととか、事前に準備がいるからね。気軽には使えないんだよ」
line = "「以前に比べれば全然現実的にはなったけど……同一存在のこととか、事前に準備がいるからね。気軽には使えないんだよ」"

[[dialogue]]
speaker = "紅明"
# 「そっか～。残念だったね、セッシー」
line = "「そっか～。残念だったね、セッシー」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そんな……諦めきれないわ！　せっかくまだ見ぬママに出会える、千載一遇のチャンスだというのに！」
line = "「そんな……諦めきれないわ！　せっかくまだ見ぬママに出会える、千載一遇のチャンスだというのに！」"

[[dialogue]]
speaker = "ラクシャ"
# 「他の子を探すんじゃダメなの？」
line = "「他の子を探すんじゃダメなの？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ダメではないけれど、隠れママの情報を聞いてしまった以上、会わずには終われないのよ」
line = "「ダメではないけれど、隠れママの情報を聞いてしまった以上、会わずには終われないのよ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ママみを宿しているのに、ママであると知らぬまま生活しているなんて……そんなにもったいないことはないの！」
line = "「ママみを宿しているのに、ママであると知らぬまま生活しているなんて……そんなにもったいないことはないの！」"

[[dialogue]]
speaker = "ラクシャ"
# 「うーん、困ったなあ……あ、そうだ」
line = "「うーん、困ったなあ……あ、そうだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「デネブのママで思い出したけど──<ruby=こっち>アルタイル</ruby>にだってママみを持った人物がいるかもしれないよ？」
line = "「デネブのママで思い出したけど──<ruby>アルタイル<rt>こっち</rt></ruby>にだってママみを持った人物がいるかもしれないよ？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「えっ！　本当？」
line = "「えっ！　本当？」"

[[dialogue]]
speaker = "ラクシャ"
# 「その人物は優しくて、世話を焼いてくれて、時にやんわりたしなめてもくれるような……それはそれは溢れんばかりの母性を持った子なんだ！」
line = "「その人物は優しくて、世話を焼いてくれて、時にやんわりたしなめてもくれるような……それはそれは溢れんばかりの母性を持った子なんだ！」"

[[dialogue]]
speaker = "紅明"
# 「へー、そんな子いるんだ☆　紅明ママも負けてらんないかも？」
