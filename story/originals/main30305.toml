[[dialogue]]
speaker = "セシア（覚醒）"
# 「ご、ごくり……なんて素敵そうな方なの。話を聞いているだけでも、ママ判定を出してしまいそうだわ」
line = "「ご、ごくり……なんて素敵そうな方なの。話を聞いているだけでも、ママ判定を出してしまいそうだわ」"

[[dialogue]]
speaker = "ラクシャ"
# 「しかもその人物は……今、この教皇庁にいる！」
line = "「しかもその人物は……今、この教皇庁にいる！」"

[[dialogue]]
speaker = "紅明"
# 「──えぇっ！？」
line = "「──えぇっ！？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「いったい誰なの、それは……！？」
line = "「いったい誰なの、それは……！？」"

[[dialogue]]
speaker = "ラクシャ"
# 「ふふ。ずばり──あの子さ」
line = "「ふふ。ずばり──あの子さ」"

