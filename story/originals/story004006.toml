[[dialogue]]
speaker = "トリュファイナ"
# 「はいっ！　援護はお任せください！」
line = "「はいっ！　援護はお任せください！」"

[[dialogue]]
speaker = "ダッチ"
# 「２人とも──ですか。悲しいですねぇ！　私も仲間の一員ですのに！！」
line = "「２人とも──ですか。悲しいですねぇ！　私も仲間の一員ですのに！！」"

[[dialogue]]
speaker = "蘭美"
# 「一気に決めるわっ！　フォトン・スマッシュ！！」
line = "「一気に決めるわっ！　フォトン・スマッシュ！！」"

[[dialogue]]
speaker = "モンスター"
# 「イーッ！？」
line = "「イーッ！？」"

[[dialogue]]
speaker = "シュティレ"
# 「お見事ですね。シュティレも負けていられません」
line = "「お見事ですね。シュティレも負けていられません」"

[[dialogue]]
speaker = "シュティレ"
# 「本日入手したてのコレの出番──螺旋機構、起動！　唸れギガンドリル！」
line = "「本日入手したてのコレの出番──螺旋機構、起動！　唸れギガンドリル！」"

[[dialogue]]
speaker = "シュティレ"
