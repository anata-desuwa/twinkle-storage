[[dialogue]]
speaker = "蘭美"
# 「ここが『支配』のロストアイテム……シエスタがいるアステラね！」
line = "「ここが『支配』のロストアイテム……シエスタがいるアステラね！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「……普通のアステラとは雰囲気が全く違いますね？」
line = "「……普通のアステラとは雰囲気が全く違いますね？」"

[[dialogue]]
speaker = "モンスター"
# 「イ～～～～♪」
line = "「イ～～～～♪」"

[[dialogue]]
speaker = "シュティレ"
# 「遠目に敵影を発見……ですが、呑気に散歩をしているようです。あのようなふるまいのモンスターは初めて見ますね」
line = "「遠目に敵影を発見……ですが、呑気に散歩をしているようです。あのようなふるまいのモンスターは初めて見ますね」"

[[dialogue]]
speaker = "ダッチ"
# 「これらも全て、シエスタの力によるものですよ」
line = "「これらも全て、シエスタの力によるものですよ」"

[[dialogue]]
speaker = "ダッチ"
# 「お伝えしたでしょう？　シエスタは、あらゆる事象やエネルギーに対して支配権を持つ、と」
line = "「お伝えしたでしょう？　シエスタは、あらゆる事象やエネルギーに対して支配権を持つ、と」"

[[dialogue]]
speaker = "ダッチ"
# 「その力を応用すれば、アステラの改造など造作もないこと」
line = "「その力を応用すれば、アステラの改造など造作もないこと」"

[[dialogue]]
speaker = "ダッチ"
# 「ほかにも記憶の改竄、モンスターの傀儡化……対象を支配するという概念の延長にあるものは、あの子は何でも行えます」
line = "「ほかにも記憶の改竄、モンスターの傀儡化……対象を支配するという概念の延長にあるものは、あの子は何でも行えます」"

[[dialogue]]
speaker = "ダッチ"
# 「弱点と呼べるのは、能力の射程が短いことくらいでしょうか」
line = "「弱点と呼べるのは、能力の射程が短いことくらいでしょうか」"

[[dialogue]]
speaker = "トリュファイナ"
# 「……聞けば聞くほどに、恐ろしいお相手ですね」
line = "「……聞けば聞くほどに、恐ろしいお相手ですね」"

[[dialogue]]
speaker = "蘭美"
# 「だからって臆してなんていられないわ！　会長たちがどんな目に遭ってるか……光速で解決するわよ！」
line = "「だからって臆してなんていられないわ！　会長たちがどんな目に遭ってるか……光速で解決するわよ！」"

[[dialogue]]
speaker = "ダッチ"
# 「その意気です、蘭美様。さぁ──敵が我々に気づいたようですよ！？」
line = "「その意気です、蘭美様。さぁ──敵が我々に気づいたようですよ！？」"

[[dialogue]]
speaker = "モンスター"
# 「イィィイ～～～！！」
line = "「イィィイ～～～！！」"

[[dialogue]]
speaker = "蘭美"
# 「向かってきたわね！　迎撃するわ！！」
line = "「向かってきたわね！　迎撃するわ！！」"

[[dialogue]]
speaker = "蘭美"
# 「行くわよ、２人とも！」
line = "「行くわよ、２人とも！」"

[[dialogue]]
speaker = "シュティレ"
