[[dialogue]]
speaker = "ダッチ"
# 「ムフフフ。ギガンドムがお好きと聞きましたのでね？　ドリルはロマン──お気に召していただけましたか？」
line = "「ムフフフ。ギガンドムがお好きと聞きましたのでね？　ドリルはロマン──お気に召していただけましたか？」"

[[dialogue]]
