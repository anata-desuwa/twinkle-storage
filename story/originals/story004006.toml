speaker = "シュティレ"
# 「マスター！！」
line = "「マスター！！」"

[[dialogue]]
speaker = "アニマ"
# 「おお、シュティレ！　助けに来てくれたのカ！！」
line = "「おお、シュティレ！　助けに来てくれたのカ！！」"

[[dialogue]]
speaker = "シュティレ"
# 「一掃します！　ギガンドリル・プレッシャー！！」
line = "「一掃します！　ギガンドリル・プレッシャー！！」"

[[dialogue]]
speaker = "モンスター"
# 「イ～～～～！？！？」
line = "「イ～～～～！？！？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「危ないところでしたね。もう大丈夫ですよ、アニマ様！」
line = "「危ないところでしたね。もう大丈夫ですよ、アニマ様！」"

[[dialogue]]
speaker = "アニマ"
