# 「素晴らしいです。気に入りました。ぶい」
line = "「素晴らしいです。気に入りました。ぶい」"

[[dialogue]]
speaker = "トリュファイナ"
# 「私も普段の杖が変化して、魔弾を発射できる銃杖になっているようです」
line = "「私も普段の杖が変化して、魔弾を発射できる銃杖になっているようです」"

[[dialogue]]
speaker = "トリュファイナ"
# 「銃の扱いは私、ロボットアニメで勉強済みです。戦闘に問題はございません！」
line = "「銃の扱いは私、ロボットアニメで勉強済みです。戦闘に問題はございません！」"

[[dialogue]]
speaker = "蘭美"
# 「敵から受け取った戦闘服──心配していたけれど、今のところは大丈夫そうね！」
line = "「敵から受け取った戦闘服──心配していたけれど、今のところは大丈夫そうね！」"

[[dialogue]]
speaker = "ダッチ"
# 「ひどいですねぇ。まだ信用していただけないのですか？」
line = "「ひどいですねぇ。まだ信用していただけないのですか？」"

[[dialogue]]
speaker = "蘭美"
# 「するわけないでしょ！　今までの自分の行いを考えてごらんなさい！」
line = "「するわけないでしょ！　今までの自分の行いを考えてごらんなさい！」"

[[dialogue]]
speaker = "モンスター"
# 「イイイィィイイ──！！」
line = "「イイイィィイイ──！！」"

[[dialogue]]
speaker = "蘭美"
# 「大型モンスター……くぅっ！？」
line = "「大型モンスター……くぅっ！？」"

[[dialogue]]
speaker = "蘭美"
# 「星力が急に吸われている感覚っ……これが『支配』の力！？」
