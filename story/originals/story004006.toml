speaker = "シュティレ"
# 「おお。一気に体が軽くなりました」
line = "「おお。一気に体が軽くなりました」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ええ！　魔力の減衰が止まりました……！」
line = "「ええ！　魔力の減衰が止まりました……！」"

[[dialogue]]
speaker = "蘭美"
# 「ちょ、ちょっと待ちなさいっ！　ぐ、ぅ……！　どうして私は星力を吸われたままなの！？」
line = "「ちょ、ちょっと待ちなさいっ！　ぐ、ぅ……！　どうして私は星力を吸われたままなの！？」"

[[dialogue]]
speaker = "ダッチ"
# 「だって蘭美様、ぴょんを付けてくださらないではないですか？」
line = "「だって蘭美様、ぴょんを付けてくださらないではないですか？」"

[[dialogue]]
speaker = "蘭美"
# 「こんのっ──！　後で絶対ぶっ飛ばすぴょんっ！！！」
line = "「こんのっ──！　後で絶対ぶっ飛ばすぴょんっ！！！」"

[[dialogue]]
speaker = "ダッチ"
# 「──オッホォォオォ！！　ぴょん、キターーーーッ！！！」
line = "「──オッホォォオォ！！　ぴょん、キターーーーッ！！！」"

[[dialogue]]
speaker = "蘭美"
# 「ほ、本当に星力の略奪が止まった……くぅぅうう！！」
line = "「ほ、本当に星力の略奪が止まった……くぅぅうう！！」"

[[dialogue]]
speaker = "シュティレ"
# 「腹に据えかねるのはわかりますが、今が好機です。シュティレは右側から攻撃するぴょん」
line = "「腹に据えかねるのはわかりますが、今が好機です。シュティレは右側から攻撃するぴょん」"

[[dialogue]]
speaker = "トリュファイナ"
# 「私は後方より狙撃いたしますぴょんっ！」
line = "「私は後方より狙撃いたしますぴょんっ！」"

[[dialogue]]
speaker = "蘭美"
# 「正面からねじ伏せるわ、行くわよ──！！」
line = "「正面からねじ伏せるわ、行くわよ──！！」"

[[dialogue]]
speaker = "ダッチ"
# 「ンンン～～～～？？？」
line = "「ンンン～～～～？？？」"

[[dialogue]]
speaker = "蘭美"
# 「正面から行く『ぴょん』っ！！！！　あー、もうっ！！」
line = "「正面から行く『ぴょん』っ！！！！　あー、もうっ！！」"

[[dialogue]]
speaker = "unk"
# シエスタによって差し向けられる大型モンスターを次々に撃破し、蘭美たち救出チームはアステラ遊園地の奥へと突き進む。
line = "シエスタによって差し向けられる大型モンスターを次々に撃破し、蘭美たち救出チームはアステラ遊園地の奥へと突き進む。"

[[dialogue]]
speaker = "unk"
# そして──
line = "そして──"

[[dialogue]]
speaker = "アニマ"
# 「ぜぇっ……ぜぇっ！　も、もう勘弁してくれたまえヨ……！！」
line = "「ぜぇっ……ぜぇっ！　も、もう勘弁してくれたまえヨ……！！」"

[[dialogue]]
speaker = "モンスター"
# 「イ～！　イ～～！！」
line = "「イ～！　イ～～！！」"

[[dialogue]]
speaker = "アニマ"
# 「いタっ、いたタっ！　小突くのはやめたまエ……！」
line = "「いタっ、いたタっ！　小突くのはやめたまエ……！」"

[[dialogue]]
speaker = "unk"
