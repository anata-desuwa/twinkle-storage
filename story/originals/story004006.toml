line = "「むむム？　九浄家のメイド長に──お前ハ……！？」"

[[dialogue]]
speaker = "シュティレ"
# 「……と、こんな経緯がありまして」
line = "「……と、こんな経緯がありまして」"

[[dialogue]]
speaker = "アニマ"
# 「ふム。ロストアイテムと協力しての救出チーム……随分と面白いことになっているみたいダナ！」
line = "「ふム。ロストアイテムと協力しての救出チーム……随分と面白いことになっているみたいダナ！」"

[[dialogue]]
speaker = "アニマ"
# 「敵の能力のからくりもわかったヨ。なぜ変身できないのか、ずっと疑問だったんダ」
line = "「敵の能力のからくりもわかったヨ。なぜ変身できないのか、ずっと疑問だったんダ」"

[[dialogue]]
speaker = "アニマ"
# 「アニマはなぜかひどく敵視されていてネ。さっきみたいにフワッチにどつきまわされて大変だったヨ……トリュファイナ、治療感謝するゾ！」
line = "「アニマはなぜかひどく敵視されていてネ。さっきみたいにフワッチにどつきまわされて大変だったヨ……トリュファイナ、治療感謝するゾ！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「礼には及びません。しかしよく３日も耐えられましたね、アニマ様」
line = "「礼には及びません。しかしよく３日も耐えられましたね、アニマ様」"

[[dialogue]]
speaker = "アニマ"
# 「んン？　いや、そんなに長い時間は逃げられなイ。アニマがここに来て、まだ半日くらいだガ……」
line = "「んン？　いや、そんなに長い時間は逃げられなイ。アニマがここに来て、まだ半日くらいだガ……」"

[[dialogue]]
speaker = "ダッチ"
# 「時間の流れもおかしくなっているようですねぇ！　早急にシエスタを倒し、現実に帰還しなくては！」
line = "「時間の流れもおかしくなっているようですねぇ！　早急にシエスタを倒し、現実に帰還しなくては！」"

[[dialogue]]
speaker = "蘭美"
# 「ええ！　アニマ、会長の救出は私たちに任せて。貴女は先にここから脱出するのよ！」
line = "「ええ！　アニマ、会長の救出は私たちに任せて。貴女は先にここから脱出するのよ！」"

[[dialogue]]
speaker = "アニマ"
# 「む……確かにアニマがついていっても、敵を強化してしまうだけカ。了解だヨ」
line = "「む……確かにアニマがついていっても、敵を強化してしまうだけカ。了解だヨ」"

[[dialogue]]
speaker = "アニマ"
# 「シエスタは会長と一緒に遊園地内を遊びまわっている。すぐに見つけられるはずダ！」
line = "「シエスタは会長と一緒に遊園地内を遊びまわっている。すぐに見つけられるはずダ！」"

[[dialogue]]
speaker = "シュティレ"
# 「承知いたしました。また後で会いましょう、マスター！」
line = "「承知いたしました。また後で会いましょう、マスター！」"

[[dialogue]]
speaker = "unk"
# アニマをアステラの外に送って、再度アステラ遊園地の探索を進める一行。
line = "アニマをアステラの外に送って、再度アステラ遊園地の探索を進める一行。"

[[dialogue]]
speaker = "unk"
# ダッチの案内で、遊園地の一画にたどり着いた蘭美たちが目にしたのは──
line = "ダッチの案内で、遊園地の一画にたどり着いた蘭美たちが目にしたのは──"

[[dialogue]]
speaker = "シエスタ"
# 「お兄ちゃん、お兄ちゃんっ♪　シス、お兄ちゃんとアイスの食べさせっこがしたいの～♪」
line = "「お兄ちゃん、お兄ちゃんっ♪　シス、お兄ちゃんとアイスの食べさせっこがしたいの～♪」"

[[dialogue]]
speaker = "unk"
# ははは。シスは甘えん坊だなあ
line = "ははは。シスは甘えん坊だなあ"

[[dialogue]]
speaker = "蘭美"
# 「な、なななっ──何が起こってるぴょんっ！？！？」
line = "「な、なななっ──何が起こってるぴょんっ！？！？」"
