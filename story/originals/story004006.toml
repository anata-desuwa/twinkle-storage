[[dialogue]]
speaker = "シュティレ"
# 「……耐久力に自信があるようですね」
line = "「……耐久力に自信があるようですね」"

[[dialogue]]
speaker = "トリュファイナ"
# 「トドメはお任せを！　魔弾装填──レプス・イルミナーレ！！」
line = "「トドメはお任せを！　魔弾装填──レプス・イルミナーレ！！」"

[[dialogue]]
speaker = "モンスター"
# 「イイイイ～～～！？」
line = "「イイイイ～～～！？」"

[[dialogue]]
speaker = "ダッチ"
# 「フゥ！　私の出番はなかったようですねぇ。新フォームの武装も、操れているようで何よりです」
line = "「フゥ！　私の出番はなかったようですねぇ。新フォームの武装も、操れているようで何よりです」"

[[dialogue]]
speaker = "シュティレ"
# 「感無量です。まさかドリルを扱えるようになるとは」
