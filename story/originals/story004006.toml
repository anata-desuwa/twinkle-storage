[[dialogue]]
speaker = "ダッチ"
# 「ご安心ください！　私の欲望シールドを起動します！！　──さぁ、皆様ご一緒に！」
line = "「ご安心ください！　私の欲望シールドを起動します！！　──さぁ、皆様ご一緒に！」"

[[dialogue]]
speaker = "シュティレ"
