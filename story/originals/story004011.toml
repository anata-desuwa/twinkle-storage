[[dialogue]]
speaker = "unk"
# 『支配』のロストアイテム、シエスタによる誘拐騒動から数日が経った──
line = "『支配』のロストアイテム、シエスタによる誘拐騒動から数日が経った──"

[[dialogue]]
speaker = "アナ"
# 「しかしまさか、ヒトならざる『妹』まで増えるとは。流石は会長」
line = "「しかしまさか、ヒトならざる『妹』まで増えるとは。流石は会長」"

[[dialogue]]
speaker = "マトイ"
# 「昔はモンスターを惹き寄せる体質だって騒がれてたのに……今はもう、妹を惹き寄せる体質に変わってるんじゃない……？」
line = "「昔はモンスターを惹き寄せる体質だって騒がれてたのに……今はもう、妹を惹き寄せる体質に変わってるんじゃない……？」"

[[dialogue]]
speaker = "unk"
# 怖いことを言わないでくれ
line = "怖いことを言わないでくれ"

[[dialogue]]
speaker = "蘭美"
# 「失礼するわ！　会長、調子はどうかしら！？」
line = "「失礼するわ！　会長、調子はどうかしら！？」"

[[dialogue]]
speaker = "unk"
# やあ、みんな。元気だよ
line = "やあ、みんな。元気だよ"

[[dialogue]]
speaker = "蘭美"
# 「当主様から、会長の仕事の手伝いをしろと仰せつかっているわ！　困ってる事があったら何でも言いなさい！」
line = "「当主様から、会長の仕事の手伝いをしろと仰せつかっているわ！　困ってる事があったら何でも言いなさい！」"

[[dialogue]]
speaker = "シュティレ"
# 「こちら、錬金術同好会からの差し入れです。副作用はなし、一発キメると体力が全回復するスペシャルドリンクです」
line = "「こちら、錬金術同好会からの差し入れです。副作用はなし、一発キメると体力が全回復するスペシャルドリンクです」"

[[dialogue]]
speaker = "トリュファイナ"
# 「魔王様。お疲れでしたらいつでも申し付けてくださいね。癒しの魔法をお届けいたします！」
line = "「魔王様。お疲れでしたらいつでも申し付けてくださいね。癒しの魔法をお届けいたします！」"

[[dialogue]]
speaker = "マトイ"
# 「わわわ。最近多いね、差し入れとか……」
line = "「わわわ。最近多いね、差し入れとか……」"

[[dialogue]]
speaker = "アナ"
# 「先日のシエスタの一件で、会長の激務を少しでも減らそうという心配りでしょうか。ありがたく受け取っておきましょう」
line = "「先日のシエスタの一件で、会長の激務を少しでも減らそうという心配りでしょうか。ありがたく受け取っておきましょう」"

[[dialogue]]
speaker = "unk"
# ところで、２人はなんでバニーに？
line = "ところで、２人はなんでバニーに？"

[[dialogue]]
speaker = "シュティレ"
# 「せっかくダッチから衣装を手に入れたので。最近、不定期でこの格好にて購買部の店番をしております」
line = "「せっかくダッチから衣装を手に入れたので。最近、不定期でこの格好にて購買部の店番をしております」"

[[dialogue]]
speaker = "トリュファイナ"
# 「はい！　大盛況なのですよ、魔王様♪　ぴょん、ぴょん♪」
line = "「はい！　大盛況なのですよ、魔王様♪　ぴょん、ぴょん♪」"

[[dialogue]]
speaker = "unk"
# 蘭美はもうバニーガール着ないの？
line = "蘭美はもうバニーガール着ないの？"

[[dialogue]]
speaker = "蘭美"
# 「着るわけないぴょんっ！　あんなの、もうあれっきりなんだから！！」
line = "「着るわけないぴょんっ！　あんなの、もうあれっきりなんだから！！」"

[[dialogue]]
speaker = "unk"
# にぎやかな放課後の星徒会室。ようやく、日常が帰ってきたって感じだ──
line = "にぎやかな放課後の星徒会室。ようやく、日常が帰ってきたって感じだ──"

[[dialogue]]
speaker = "unk"
# ──あの騒動以降、シエスタは俺の前に姿を現さない。
line = "──あの騒動以降、シエスタは俺の前に姿を現さない。"

[[dialogue]]
speaker = "unk"
# 少し寂しいなと思いながら、俺は執務机の引き出しを開くと──
line = "少し寂しいなと思いながら、俺は執務机の引き出しを開くと──"

[[dialogue]]
speaker = "unk"
# ……手紙？
line = "……手紙？"

[[dialogue]]
speaker = "unk"
# たどたどしい筆跡で、俺宛ての──『妹』からの手紙が入っていた。
line = "たどたどしい筆跡で、俺宛ての──『妹』からの手紙が入っていた。"

[[dialogue]]
speaker = "シエスタ"
# 『お兄ちゃんへ』
line = "『お兄ちゃんへ』"

[[dialogue]]
speaker = "シエスタ"
# 『自分のしたこと、しっかり反省できたら、その時に会いに行くの』
line = "『自分のしたこと、しっかり反省できたら、その時に会いに行くの』"

[[dialogue]]
speaker = "シエスタ"
# 『だから……またね、なの！　お兄ちゃん！』
line = "『だから……またね、なの！　お兄ちゃん！』"

[[dialogue]]
speaker = "unk"
# ……待ってるよ、シス
line = "……待ってるよ、シス"

[[dialogue]]
speaker = "unk"
# 俺は手紙を丁寧に畳んで、元にあったところへしまって。
line = "俺は手紙を丁寧に畳んで、元にあったところへしまって。"

[[dialogue]]
speaker = "unk"
# いつか実現するであろう、ロストアイテムの『妹』との再会を心待ちにするのだった──
line = "いつか実現するであろう、ロストアイテムの『妹』との再会を心待ちにするのだった──"
