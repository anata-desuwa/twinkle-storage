[[dialogue]]
speaker = "unk"
# 第２話,流星市国最強チキン決定戦,P
line = "第２話,流星市国最強チキン決定戦,P"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩に呼び出され、俺はカフェテリアにやってきた。
line = "シルヴィ先輩に呼び出され、俺はカフェテリアにやってきた。"

[[dialogue]]
speaker = "蛍火"
# 「お疲れ様です、師匠」
line = "「お疲れ様です、師匠」"

[[dialogue]]
speaker = "サーシャ"
# 「もしかして、会長くんもシルヴィに呼び出されたの～？」
line = "「もしかして、会長くんもシルヴィに呼び出されたの～？」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩はサーシャさんが星徒会長だった代の副会長で、蛍火も星徒会のその代の役員だった。
line = "シルヴィ先輩はサーシャさんが星徒会長だった代の副会長で、蛍火も星徒会のその代の役員だった。"

[[dialogue]]
speaker = "unk"
# この２人まで一緒とは、いったいこれから何が起こるのだろうか。
line = "この２人まで一緒とは、いったいこれから何が起こるのだろうか。"

[[dialogue]]
speaker = "シルヴィ"
# 「お待たせ～！」
line = "「お待たせ～！」"

[[dialogue]]
speaker = "サーシャ"
# 「今日はどうしたの？　用件くらい教えてほしいわ～」
line = "「今日はどうしたの？　用件くらい教えてほしいわ～」"

[[dialogue]]
speaker = "蛍火"
# 「それに、大きな袋を抱えて……何が入っているんですか？」
line = "「それに、大きな袋を抱えて……何が入っているんですか？」"

[[dialogue]]
speaker = "シルヴィ"
# 「ふっふっふ……欲するなら教えて進ぜよう！」
line = "「ふっふっふ……欲するなら教えて進ぜよう！」"

[[dialogue]]
speaker = "シルヴィ"
# 「名付けて！　『流星市国最強チキン決定戦』！！」
line = "「名付けて！　『流星市国最強チキン決定戦』！！」"

[[dialogue]]
speaker = "サーシャ"
# 「りゅうせいしこく……」
line = "「りゅうせいしこく……」"

[[dialogue]]
speaker = "蛍火"
# 「さいきょうチキン……」
line = "「さいきょうチキン……」"

[[dialogue]]
speaker = "unk"
# けっていせん……？
line = "けっていせん……？"

[[dialogue]]
speaker = "シルヴィ"
# 「そう！　流星市国で最強の美味しいフライドチキンを決める戦いだよ！　ほら、これ！」
line = "「そう！　流星市国で最強の美味しいフライドチキンを決める戦いだよ！　ほら、これ！」"

[[dialogue]]
speaker = "蛍火"
# 「これは……ＧＦＣのフライドチキンとボスチキンですね」
line = "「これは……ＧＦＣのフライドチキンとボスチキンですね」"

[[dialogue]]
speaker = "サーシャ"
# 「しかも大量に……これ、私たちで食べるの？」
line = "「しかも大量に……これ、私たちで食べるの？」"

[[dialogue]]
speaker = "unk"
# ＧＦＣはガルスフライドチキンの略で、人間界で世界的に展開されているフライドチキンのチェーン店だ。
line = "ＧＦＣはガルスフライドチキンの略で、人間界で世界的に展開されているフライドチキンのチェーン店だ。"

[[dialogue]]
speaker = "unk"
# ボスチキンはハンバーガーチェーン『ボスバーガー』で販売されているフライドチキン。米粉を使ったサクサクの衣が特徴で、根強いファンがいる。
line = "ボスチキンはハンバーガーチェーン『ボスバーガー』で販売されているフライドチキン。米粉を使ったサクサクの衣が特徴で、根強いファンがいる。"

[[dialogue]]
speaker = "unk"
# どちらも流星市国にいくつか店舗があり、俺もバイトしたことがある。
line = "どちらも流星市国にいくつか店舗があり、俺もバイトしたことがある。"

[[dialogue]]
speaker = "シルヴィ"
# 「そう！　でも、これだけじゃないよ！　チキン、カモン！」
line = "「そう！　でも、これだけじゃないよ！　チキン、カモン！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「はーい、ただいま。購買部のデリバリーです」
line = "「はーい、ただいま。購買部のデリバリーです」"

[[dialogue]]
speaker = "unk"
# めちゃくちゃいい音の指パッチンと同時、大きな袋を持ったトリュファイナさんが現れた。中身は当然──
line = "めちゃくちゃいい音の指パッチンと同時、大きな袋を持ったトリュファイナさんが現れた。中身は当然──"

[[dialogue]]
speaker = "トリュファイナ"
# 「はい、フライドチキンの盛り合わせです。プレーン、ピリ辛、旨塩、黒ごまガーリック、ブラックペッパー……なんでもありますよ」
line = "「はい、フライドチキンの盛り合わせです。プレーン、ピリ辛、旨塩、黒ごまガーリック、ブラックペッパー……なんでもありますよ」"

[[dialogue]]
speaker = "シルヴィ"
# 「ありがとうございます！　さぁ食べよ食べよ！　そして最強チキンを決めよう！！」
line = "「ありがとうございます！　さぁ食べよ食べよ！　そして最強チキンを決めよう！！」"

[[dialogue]]
speaker = "サーシャ"
# 「また思い付きで行動して……」
line = "「また思い付きで行動して……」"

[[dialogue]]
speaker = "？？？"
# 「ちょーっと待ったーー！」
line = "「ちょーっと待ったーー！」"

[[dialogue]]
speaker = "シルヴィ"
# 「この声は！？」
line = "「この声は！？」"

[[dialogue]]
speaker = "グレイス"
# 「我が名はグレイス・オベロニア！　流星市国のチキンを愛する者！」
line = "「我が名はグレイス・オベロニア！　流星市国のチキンを愛する者！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「グレイス様！」
line = "「グレイス様！」"

[[dialogue]]
speaker = "サーシャ"
# 「あら～。グレイスちゃん、久しぶり～」
line = "「あら～。グレイスちゃん、久しぶり～」"

[[dialogue]]
speaker = "unk"
# 彼女は平行世界デネブにある極星学園の星徒会役員だ。かつては敵対していたが、今はともに世界を救うために戦った仲間だ。
line = "彼女は平行世界デネブにある極星学園の星徒会役員だ。かつては敵対していたが、今はともに世界を救うために戦った仲間だ。"

[[dialogue]]
speaker = "グレイス"
# 「やぁやぁみなさん、お久しぶりです！　面白そうな話が聞こえて、つい声をかけてしまいました！」
line = "「やぁやぁみなさん、お久しぶりです！　面白そうな話が聞こえて、つい声をかけてしまいました！」"

[[dialogue]]
speaker = "グレイス"
# 「ちなみに、<ruby=こちら>アルタイル</ruby>のグレイスちゃんは今ごろ家族でデネブ旅行です！」
line = "「ちなみに、<ruby>アルタイル<rt>こちら</rt></ruby>のグレイスちゃんは今ごろ家族でデネブ旅行です！」"

[[dialogue]]
speaker = "unk"
# 並行世界から同一人物がやってくると、その世界の住人は昏睡状態に陥ってしまう。
line = "並行世界から同一人物がやってくると、その世界の住人は昏睡状態に陥ってしまう。"

[[dialogue]]
speaker = "unk"
# だが同一人物同士で入れ替わるとそれを防げるのだ。
line = "だが同一人物同士で入れ替わるとそれを防げるのだ。"

[[dialogue]]
speaker = "グレイス"
# 「ふっふっふ～、チキン最強決定戦とは聞き捨てなりませんね！　私も混ぜてください！」
line = "「ふっふっふ～、チキン最強決定戦とは聞き捨てなりませんね！　私も混ぜてください！」"

[[dialogue]]
speaker = "シルヴィ"
# 「もちろん！　グレイスちゃんもチキン大好きなんだね、大歓迎だよ！」
line = "「もちろん！　グレイスちゃんもチキン大好きなんだね、大歓迎だよ！」"

[[dialogue]]
speaker = "グレイス"
# 「ありがとうございます！　ではでは～！」
line = "「ありがとうございます！　ではでは～！」"

[[dialogue]]
speaker = "シルヴィ"
# 「いただきまーす！　まずは王道のＧＦＣから！」
line = "「いただきまーす！　まずは王道のＧＦＣから！」"

[[dialogue]]
speaker = "シルヴィ"
# 「もぐもぐもぐ…………おいっしい！　皮がパリパリでお肉もジューシー！　そしてやっぱりこのスパイスだよね！　マネできない美味しさ！」
line = "「もぐもぐもぐ…………おいっしい！　皮がパリパリでお肉もジューシー！　そしてやっぱりこのスパイスだよね！　マネできない美味しさ！」"

[[dialogue]]
speaker = "グレイス"
# 「私はボスチキンをいただきますね！　ん～、衣がサクサクですね！　味付けは醤油ベースで優しい美味しさです！」
line = "「私はボスチキンをいただきますね！　ん～、衣がサクサクですね！　味付けは醤油ベースで優しい美味しさです！」"

[[dialogue]]
speaker = "サーシャ"
# 「じゃあ、私は購買の旨塩チキンを……はむはむ……あ、バジルかしら？　後を引く香りで美味しいわ」
line = "「じゃあ、私は購買の旨塩チキンを……はむはむ……あ、バジルかしら？　後を引く香りで美味しいわ」"

[[dialogue]]
speaker = "蛍火"
# 「気付いていただき、ありがとうございます。実は、購買のチキンの味付けは私たち給食委員会で開発したものなんです」
line = "「気付いていただき、ありがとうございます。実は、購買のチキンの味付けは私たち給食委員会で開発したものなんです」"

[[dialogue]]
speaker = "蛍火"
# 「委員会のみんなでいろんなフライドチキンを食べ歩いて研究しました。販売数も増えているようで嬉しいです。購買部のみなさんにはご負担をおかけしますが……」
line = "「委員会のみんなでいろんなフライドチキンを食べ歩いて研究しました。販売数も増えているようで嬉しいです。購買部のみなさんにはご負担をおかけしますが……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「いえいえ、お気になさらないでください。それだけチキンが美味しいということです」
line = "「いえいえ、お気になさらないでください。それだけチキンが美味しいということです」"

[[dialogue]]
speaker = "シルヴィ"
# 「そっかー。天界から帰ってきたら、購買のチキンが美味しくなってたのは蛍火ちゃんたちのおかげだったんだね。ありがとう！」
line = "「そっかー。天界から帰ってきたら、購買のチキンが美味しくなってたのは蛍火ちゃんたちのおかげだったんだね。ありがとう！」"

[[dialogue]]
speaker = "グレイス"
# 「私からもありがとうございます！　購買のチキン、とっても美味しいです！」
line = "「私からもありがとうございます！　購買のチキン、とっても美味しいです！」"

[[dialogue]]
speaker = "蛍火"
# 「いえ、その……こちらこそ、ありがとうございます。食べてくれる人の笑顔が、私たち料理人の一番の報酬ですから」
line = "「いえ、その……こちらこそ、ありがとうございます。食べてくれる人の笑顔が、私たち料理人の一番の報酬ですから」"

[[dialogue]]
speaker = "シルヴィ"
# 「うん、いつもありがとう。美味しいごはんがみんなの支えになってるよ」
line = "「うん、いつもありがとう。美味しいごはんがみんなの支えになってるよ」"

[[dialogue]]
speaker = "シルヴィ"
# 「ささ、会長くんも食べて食べて。トリュファイナさんも時間あったら一緒にどうぞ！」
line = "「ささ、会長くんも食べて食べて。トリュファイナさんも時間あったら一緒にどうぞ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「ご馳走さまでした！　チキン美味しかったね！」
line = "「ご馳走さまでした！　チキン美味しかったね！」"

[[dialogue]]
speaker = "グレイス"
# 「ご馳走さまでしたー！」
line = "「ご馳走さまでしたー！」"

[[dialogue]]
speaker = "サーシャ"
# 「うぅ……少し食べすぎたわ。で、シルヴィ。最強チキンとやらは決まったの？」
line = "「うぅ……少し食べすぎたわ。で、シルヴィ。最強チキンとやらは決まったの？」"

[[dialogue]]
speaker = "シルヴィ"
# 「う～ん、どのチキンも美味しかったからなぁ……会長くんはどうだった？」
line = "「う～ん、どのチキンも美味しかったからなぁ……会長くんはどうだった？」"

[[dialogue]]
speaker = "unk"
# 俺も同じ感想です
line = "俺も同じ感想です"

[[dialogue]]
speaker = "unk"
# どのチキンにも良さがある。一番なんて決められない。
line = "どのチキンにも良さがある。一番なんて決められない。"

[[dialogue]]
speaker = "グレイス"
# 「賛成です！　チキン美味しいです！」
line = "「賛成です！　チキン美味しいです！」"

[[dialogue]]
speaker = "シルヴィ"
# 「というわけで、今日はみんな最強！　みんな違ってみんないい！」
line = "「というわけで、今日はみんな最強！　みんな違ってみんないい！」"

[[dialogue]]
speaker = "サーシャ"
# 「そう……」
line = "「そう……」"

[[dialogue]]
speaker = "シルヴィ"
# 「あれ？　サーシャ……なんであたしの腕をつかむのかな？」
line = "「あれ？　サーシャ……なんであたしの腕をつかむのかな？」"

[[dialogue]]
speaker = "サーシャ"
# 「チキンは美味しかったけど～、いきなり呼びつけられてチキンたくさん食べさせられて、しかもあんまり意味がなかったから────お・し・お・き<emoji=heart04>」
line = "「チキンは美味しかったけど～、いきなり呼びつけられてチキンたくさん食べさせられて、しかもあんまり意味がなかったから────お・し・お・き<emoji=heart04>」"

[[dialogue]]
speaker = "シルヴィ"
# 「んぎゃーーーーーー！！」
line = "「んぎゃーーーーーー！！」"

[[dialogue]]
speaker = "グレイス"
# 「さすがサーシャさん、見事なアームロックです！」
line = "「さすがサーシャさん、見事なアームロックです！」"

[[dialogue]]
speaker = "蛍火"
# 「久しぶりに見ました。変わらぬ技の冴えですね」
line = "「久しぶりに見ました。変わらぬ技の冴えですね」"

[[dialogue]]
speaker = "トリュファイナ"
# 「シルヴィ様～！？　お気を確かにー！」
line = "「シルヴィ様～！？　お気を確かにー！」"

[[dialogue]]
speaker = "unk"
# 久々にサーシャさんのアームロックが炸裂。シルヴィ先輩にお灸を据えたのだった。
line = "久々にサーシャさんのアームロックが炸裂。シルヴィ先輩にお灸を据えたのだった。"
