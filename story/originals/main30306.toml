# 「おお～！　やったねセッシー☆　新しいママ発見♪　紅明ママとしても負けてらんないな～」
line = "「おお～！　やったねセッシー☆　新しいママ発見♪　紅明ママとしても負けてらんないな～」"

[[dialogue]]
speaker = "アポロ"
