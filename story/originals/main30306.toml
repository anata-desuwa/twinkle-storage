[[dialogue]]
speaker = "アポロ"
# 「あたしもだ！　数年後の自分がそんなになるなんて、これっぽっちも想像できないぞ！」
line = "「あたしもだ！　数年後の自分がそんなになるなんて、これっぽっちも想像できないぞ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「まあ、アルタイルとデネブではこの先１０年で起こることが全然違っていくだろうから。こっちのアポロが同じようになるとは決まってないけどね♪」
line = "「まあ、アルタイルとデネブではこの先１０年で起こることが全然違っていくだろうから。こっちのアポロが同じようになるとは決まってないけどね♪」"

[[dialogue]]
speaker = "ラクシャ"
