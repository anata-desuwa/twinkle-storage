[[dialogue]]
speaker = "セシア（覚醒）"
# 「まさに可能性の塊だわ！　ラクシャの言う通り、アポロママはママになるべくしてなる存在よ！」
line = "「まさに可能性の塊だわ！　ラクシャの言う通り、アポロママはママになるべくしてなる存在よ！」"

[[dialogue]]
