line = "「そうそう。ほら、えーっと──女の子を抱きかかえてる姿ってヒーローっぽいじゃん？　いつかそういうシチュエーションだって来るかもしれないよ？」"

[[dialogue]]
speaker = "アポロ"
# 「む！　確かに……爆発の中からヒロインを助け出すってのは、まさにヒーローの定番──その練習くらいにはなるか！」
line = "「む！　確かに……爆発の中からヒロインを助け出すってのは、まさにヒーローの定番──その練習くらいにはなるか！」"

