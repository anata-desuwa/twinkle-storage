line = "「……ちなみに、その『アポロママ』っていうのは止められるか？」"

[[dialogue]]
speaker = "unk"
# その後、セシアはだいぶ粘ったが──結局『アポロママ』の許諾は得られなかったのだった。
line = "その後、セシアはだいぶ粘ったが──結局『アポロママ』の許諾は得られなかったのだった。"
