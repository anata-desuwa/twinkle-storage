# 「なるほど。友達として接していたはずが、いつのまにかママとして意識し始めてしまう……そんなルートもあるものね？」
line = "「なるほど。友達として接していたはずが、いつのまにかママとして意識し始めてしまう……そんなルートもあるものね？」"

