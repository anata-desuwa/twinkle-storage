line = "「平行世界のアポロっち……！　それがもしかしてバブみに溢れてたってこと！？」"

[[dialogue]]
speaker = "ラクシャ"
# 「その通り。向こうのアポロは、このちんちくりんが嘘のような我がままボディに成長して、それこそ包み込む優しさに満ち満ちていたんだ」
line = "「その通り。向こうのアポロは、このちんちくりんが嘘のような我がままボディに成長して、それこそ包み込む優しさに満ち満ちていたんだ」"

[[dialogue]]
speaker = "アポロ"
# 「ちんちくりんは余計だ！」
line = "「ちんちくりんは余計だ！」"

[[dialogue]]
