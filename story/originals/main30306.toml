line = "「ふふふ。だーから言ったでしょ。アポロは才能の原石──まさに未来のママってわけさ！」"

[[dialogue]]
speaker = "アポロ"
# 「あたしが一番の置いてけぼりだぞ！　紅明、まずママってなんなのか説明してくれ！」
line = "「あたしが一番の置いてけぼりだぞ！　紅明、まずママってなんなのか説明してくれ！」"

[[dialogue]]
speaker = "紅明"
# 「セッシーは世界中のママを探してるんだ。心から甘えられるような、包み込む優しさと愛情を持った相手をね☆」
line = "「セッシーは世界中のママを探してるんだ。心から甘えられるような、包み込む優しさと愛情を持った相手をね☆」"

[[dialogue]]
speaker = "アポロ"
# 「それがあたし？　ってことか？」
line = "「それがあたし？　ってことか？」"

[[dialogue]]
speaker = "アポロ"
# 「つってもあたし、ママっぽいことなんて全然してないぞ。料理もできないし、他の家事だって……」
line = "「つってもあたし、ママっぽいことなんて全然してないぞ。料理もできないし、他の家事だって……」"

[[dialogue]]
speaker = "ラクシャ"
# 「ふふ……実はね。ボクは見てきてるんだよ。平行世界デネブの、１０年後のアポロをね！」
line = "「ふふ……実はね。ボクは見てきてるんだよ。平行世界デネブの、１０年後のアポロをね！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「まあ！」
line = "「まあ！」"

[[dialogue]]
speaker = "紅明"
