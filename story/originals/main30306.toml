line = "「ああいけない、わたくしったらはしたない。でも許してほしいの。これもあなたがバブみに溢れているからいけないのよ？」"

[[dialogue]]
speaker = "アポロ"
# 「な、なんだとー！？」
line = "「な、なんだとー！？」"

[[dialogue]]
speaker = "アポロ"
# 「ていうか、あたしと同じくらいのちんちくりんじゃないか！　それなのにあたしのことをママ呼ばわりってどういうことだ！？」
line = "「ていうか、あたしと同じくらいのちんちくりんじゃないか！　それなのにあたしのことをママ呼ばわりってどういうことだ！？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あら……？　確かに。よく見ればまだ小さいわ。包み込むようなママみに惑わされて、わからなかったけれど」
line = "「あら……？　確かに。よく見ればまだ小さいわ。包み込むようなママみに惑わされて、わからなかったけれど」"

[[dialogue]]
speaker = "unk"
# セシアはアポロから離れると、首を傾げた。
line = "セシアはアポロから離れると、首を傾げた。"

[[dialogue]]
speaker = "紅明"
# 「そーそー。アポロっちは同じ附属生なんだしさ。さすがにママってことはないんじゃない？」
line = "「そーそー。アポロっちは同じ附属生なんだしさ。さすがにママってことはないんじゃない？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そう……そうね。常識的に考えればそうなのだけど」
line = "「そう……そうね。常識的に考えればそうなのだけど」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「うーん……なぜかしら？　それでもこの子からは隠しきれないバブみを感じるのよ」
line = "「うーん……なぜかしら？　それでもこの子からは隠しきれないバブみを感じるのよ」"

[[dialogue]]
speaker = "ラクシャ"
