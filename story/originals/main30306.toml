line = "「なるほど……そういうことだったのね。わたくしはアポロに眠る潜在ママ力を察知してしまったのね」"

[[dialogue]]
speaker = "アポロ"
# 「よくわかんねーけど……あたしが将来、ママっぽい立派な女になるってことか？」
line = "「よくわかんねーけど……あたしが将来、ママっぽい立派な女になるってことか？」"

