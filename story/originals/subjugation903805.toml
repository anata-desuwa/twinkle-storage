[[dialogue]]
speaker = "聖沙"
# 「キャ～～～～～～っ！！？」
line = "「キャ～～～～～～っ！！？」"

[[dialogue]]
speaker = "聖沙"
# 「つ、強い……！」
line = "「つ、強い……！」"

[[dialogue]]
speaker = "聖沙"
# 「そのハイレグの海パン、一体どうなってるのよ！？」
line = "「そのハイレグの海パン、一体どうなってるのよ！？」"

[[dialogue]]
speaker = "unk"
# 更に出力が１．５倍になっているのだ！
line = "更に出力が１．５倍になっているのだ！"

[[dialogue]]
speaker = "unk"
# この海パンは、通常の海パンから
line = "この海パンは、通常の海パンから"

[[dialogue]]
speaker = "聖沙"
# 「つまり、通常フォームから２倍×１．５倍で、『３倍』の出力ってこと！？」
line = "「つまり、通常フォームから２倍×１．５倍で、『３倍』の出力ってこと！？」"

[[dialogue]]
speaker = "聖沙"
# 「くっ……なんてハイレグなの……！」
line = "「くっ……なんてハイレグなの……！」"

[[dialogue]]
speaker = "聖沙"
# 「私の水着とは、着用の練度が違う……！」
line = "「私の水着とは、着用の練度が違う……！」"

[[dialogue]]
speaker = "聖沙"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "unk"
# もう諦めてしまうのか？
line = "もう諦めてしまうのか？"

[[dialogue]]
speaker = "unk"
# 聖沙は……その水着では勝てないと
line = "聖沙は……その水着では勝てないと"

[[dialogue]]
speaker = "聖沙"
# 「……！」
line = "「……！」"

[[dialogue]]
speaker = "聖沙"
# 「いいえ。そんなことないわ……」
line = "「いいえ。そんなことないわ……」"

[[dialogue]]
speaker = "聖沙"
# 「この水着は、リア先輩が――お姉様が、すっごく可愛くて素敵だって、褒めてくれたのよ！」
line = "「この水着は、リア先輩が――お姉様が、すっごく可愛くて素敵だって、褒めてくれたのよ！」"

[[dialogue]]
speaker = "聖沙"
# 「だから、そう簡単に諦めることなんてできない！」
line = "「だから、そう簡単に諦めることなんてできない！」"

[[dialogue]]
speaker = "聖沙"
# 「会長――もう１度勝負よ！」
line = "「会長――もう１度勝負よ！」"
