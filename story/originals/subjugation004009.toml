[[dialogue]]
speaker = "ナターシャ"
# 「ハロウィンデコレーション、完了っと」
line = "「ハロウィンデコレーション、完了っと」"

[[dialogue]]
speaker = "ベアトリス"
# 「お菓子とお料理も揃ったね。サランさん、蛍火さん、手伝ってくれてありがとうございましたっ」
line = "「お菓子とお料理も揃ったね。サランさん、蛍火さん、手伝ってくれてありがとうございましたっ」"

[[dialogue]]
speaker = "サラン"
# 「ううん、サランも役に立てて嬉しい～♪」
line = "「ううん、サランも役に立てて嬉しい～♪」"

[[dialogue]]
speaker = "蛍火"
# 「ですが、私たちも参加してよろしいのですか？　選挙管理委員会の皆さんのハロウィンパーティーだったのでは？」
line = "「ですが、私たちも参加してよろしいのですか？　選挙管理委員会の皆さんのハロウィンパーティーだったのでは？」"

[[dialogue]]
speaker = "ベアトリス"
# 「いいんです、いいんです。おふたりには協力してもらったお礼もしたいですし、みんなで盛り上がった方が楽しいですからっ」
line = "「いいんです、いいんです。おふたりには協力してもらったお礼もしたいですし、みんなで盛り上がった方が楽しいですからっ」"

[[dialogue]]
speaker = "アポロ"
# 「おー、パーティー会場はここだなー！　あ、カボチャのランタンがある！　カッコイイなこれ！」
line = "「おー、パーティー会場はここだなー！　あ、カボチャのランタンがある！　カッコイイなこれ！」"

[[dialogue]]
speaker = "梨緒"
# 「ベアト、ナターシャ、お疲れさま。見事に場を整えてくれたな。君たちに任せてよかったよ」
line = "「ベアト、ナターシャ、お疲れさま。見事に場を整えてくれたな。君たちに任せてよかったよ」"

[[dialogue]]
speaker = "ジグ"
# 「私たちじゃこうはできなかったね。さて、捕まえたイタズラお化けたちはここで放しちゃっていいのかな？」
line = "「私たちじゃこうはできなかったね。さて、捕まえたイタズラお化けたちはここで放しちゃっていいのかな？」"

[[dialogue]]
speaker = "ベアトリス"
# 「はい、ゴーストさんたちも一緒に、みんなでパーティーを楽しみましょうっ！」
line = "「はい、ゴーストさんたちも一緒に、みんなでパーティーを楽しみましょうっ！」"

[[dialogue]]
speaker = "梨緒"
# 「では……ハロウィンパーティーの始まりだ！　皆、グラスは持ったか？」
line = "「では……ハロウィンパーティーの始まりだ！　皆、グラスは持ったか？」"

[[dialogue]]
speaker = "アポロ"
# 「飲んで歌って踊って騒げーっ！　かんぱーーーいっ！」
line = "「飲んで歌って踊って騒げーっ！　かんぱーーーいっ！」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「カンパーイ！　お前たちもパーティーを楽しむゆー！」
line = "「カンパーイ！　お前たちもパーティーを楽しむゆー！」"

[[dialogue]]
speaker = "ゴースト"
# 「キャッキャッキャーーッ！」
line = "「キャッキャッキャーーッ！」"

[[dialogue]]
speaker = "サラン"
# 「とってもにぎやか～♪　サランたちもカンパ～イ♪」
line = "「とってもにぎやか～♪　サランたちもカンパ～イ♪」"

[[dialogue]]
speaker = "蛍火"
# 「では私も……乾杯」
line = "「では私も……乾杯」"

[[dialogue]]
speaker = "アポロ"
# 「今日はお腹がパンパンになるまで食べるぞー！　ん？　この真っ赤なスパゲティ、美味そうだ！　ナポリタンか？」
line = "「今日はお腹がパンパンになるまで食べるぞー！　ん？　この真っ赤なスパゲティ、美味そうだ！　ナポリタンか？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナポリタンじゃなくって暗殺者のパスタっていうんだよっ。私たちの自信作っ！　ね、ナターシャちゃん♪」
line = "「ナポリタンじゃなくって暗殺者のパスタっていうんだよっ。私たちの自信作っ！　ね、ナターシャちゃん♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「もぐもぐ……ニンニクもこのくらいなら、アポロでも大丈夫じゃない？」
line = "「もぐもぐ……ニンニクもこのくらいなら、アポロでも大丈夫じゃない？」"

[[dialogue]]
speaker = "アポロ"
# 「なっ……！？　ナターシャがニンニクマシマシのを食べてる！？」
line = "「なっ……！？　ナターシャがニンニクマシマシのを食べてる！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「食べられるようになったんだよね。情報はアップデートしなきゃだよ」
line = "「食べられるようになったんだよね。情報はアップデートしなきゃだよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ニャははっ♪　アポロちゃんもどうぞ」
line = "「ニャははっ♪　アポロちゃんもどうぞ」"

[[dialogue]]
speaker = "アポロ"
# 「暗殺者のパスタ……？　ちょっと怖い名前だけど、ナターシャが食べるくらい美味いのか？　どれどれ……ずずずっ」
line = "「暗殺者のパスタ……？　ちょっと怖い名前だけど、ナターシャが食べるくらい美味いのか？　どれどれ……ずずずっ」"

[[dialogue]]
speaker = "アポロ"
# 「んっ！？　ほんとだ！　これ美味いぞ！　ちょっとニンニクキツいけど！」
line = "「んっ！？　ほんとだ！　これ美味いぞ！　ちょっとニンニクキツいけど！」"

[[dialogue]]
speaker = "梨緒"
# 「いやいや、ちょっとどころじゃないだろう。ここからでもわかるくらいに匂いが強いぞ」
line = "「いやいや、ちょっとどころじゃないだろう。ここからでもわかるくらいに匂いが強いぞ」"

[[dialogue]]
speaker = "アポロ"
# 「いいから梨緒も食ってみろって！　ほら、ジグも！」
line = "「いいから梨緒も食ってみろって！　ほら、ジグも！」"

[[dialogue]]
speaker = "梨緒"
# 「そ、そうだな、２人の自信作というなら……いただきます……あむっ……！」
line = "「そ、そうだな、２人の自信作というなら……いただきます……あむっ……！」"

[[dialogue]]
speaker = "梨緒"
# 「んんっ……！？　確かに匂いは強いが、なかなか癖になる味かもしれないな……！」
line = "「んんっ……！？　確かに匂いは強いが、なかなか癖になる味かもしれないな……！」"

[[dialogue]]
speaker = "ジグ"
# 「うん、パンチが効いていて刺激的だね」
line = "「うん、パンチが効いていて刺激的だね」"

[[dialogue]]
speaker = "アポロ"
# 「だろっ！？　２人ともいい仕事するじゃないか！」
line = "「だろっ！？　２人ともいい仕事するじゃないか！」"

[[dialogue]]
speaker = "ベアトリス"
# 「大好評だよっ、ナターシャちゃんっ♪」
line = "「大好評だよっ、ナターシャちゃんっ♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「ま、蛍火先生の教えが良かったからだよ。ありがとうございます」
line = "「ま、蛍火先生の教えが良かったからだよ。ありがとうございます」"

[[dialogue]]
speaker = "蛍火"
# 「いえ、私もいい学びになりました。いつか私も、ナターシャさんに美味しいと言わせてみせます」
line = "「いえ、私もいい学びになりました。いつか私も、ナターシャさんに美味しいと言わせてみせます」"

[[dialogue]]
speaker = "梨緒"
# 「ベアトとナターシャの様子を見る限り、パーティーの準備を介して２人の仲が深まったようだな」
line = "「ベアトとナターシャの様子を見る限り、パーティーの準備を介して２人の仲が深まったようだな」"

[[dialogue]]
speaker = "ジグ"
# 「みたいだね。いい采配だったんじゃないかな」
line = "「みたいだね。いい采配だったんじゃないかな」"

[[dialogue]]
speaker = "梨緒"
# 「その口ぶり……ジグには最初から可能性が見えていたのか？」
line = "「その口ぶり……ジグには最初から可能性が見えていたのか？」"

[[dialogue]]
speaker = "ジグ"
# 「さぁね、それを言うのは野暮というものだよ。２人が仲良くなったのは、２人が腹を割って歩み寄った結果さ」
line = "「さぁね、それを言うのは野暮というものだよ。２人が仲良くなったのは、２人が腹を割って歩み寄った結果さ」"

[[dialogue]]
speaker = "梨緒"
# 「そうだな──ん？　んん？　なんだかさっきよりもゴーストが増えてやしないか？」
line = "「そうだな──ん？　んん？　なんだかさっきよりもゴーストが増えてやしないか？」"

[[dialogue]]
speaker = "ジグ"
# 「捕まえ損ねていたやつかな？　パーティーの盛り上がりを嗅ぎつけてきたのかもしれないね」
line = "「捕まえ損ねていたやつかな？　パーティーの盛り上がりを嗅ぎつけてきたのかもしれないね」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「ゆーゆっゆっゆっ！　お前たちもパーティーを盛り上げるゆーっ！」
line = "「ゆーゆっゆっゆっ！　お前たちもパーティーを盛り上げるゆーっ！」"

[[dialogue]]
speaker = "ゴースト"
# 「キャッキャッキャーーーッ！！！」
line = "「キャッキャッキャーーーッ！！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「うわ、はちゃめちゃだね。どう収拾つけるの、これ」
line = "「うわ、はちゃめちゃだね。どう収拾つけるの、これ」"

[[dialogue]]
speaker = "ベアトリス"
# 「大丈夫だよっ。どんな楽しいパーティーだって、永遠には続かない。ちゃんと終わりが来るんだから」
line = "「大丈夫だよっ。どんな楽しいパーティーだって、永遠には続かない。ちゃんと終わりが来るんだから」"

[[dialogue]]
speaker = "ベアトリス"
# 「だからナターシャちゃん、世界は平和になったんだし、せっかく仮装までしてるんだし、もっともっと楽しもうニャン♪」
line = "「だからナターシャちゃん、世界は平和になったんだし、せっかく仮装までしてるんだし、もっともっと楽しもうニャン♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「はいはい。吸血鬼同士、夜通し踊り続けるっていうのも悪くないかもね」
line = "「はいはい。吸血鬼同士、夜通し踊り続けるっていうのも悪くないかもね」"

[[dialogue]]
speaker = "ベアトリス"
# 「うんっ、ナイスアイデアっ！　踊ろ、ナターシャちゃんっ！」
line = "「うんっ、ナイスアイデアっ！　踊ろ、ナターシャちゃんっ！」"

[[dialogue]]
speaker = "unk"
# ２人は手を取り合い、自分たちで手に入れた平和を享受する。
line = "２人は手を取り合い、自分たちで手に入れた平和を享受する。"

[[dialogue]]
speaker = "unk"
# それは死を迎え入れるまで続くのか、瞬きのような束の間でしかないのかは、まだわからないけれど──
line = "それは死を迎え入れるまで続くのか、瞬きのような束の間でしかないのかは、まだわからないけれど──"

[[dialogue]]
speaker = "ナターシャ"
# 「世界は平和になったけど、選管の仕事はあくまで監視だからね」
line = "「世界は平和になったけど、選管の仕事はあくまで監視だからね」"

[[dialogue]]
speaker = "ナターシャ"
# 「星徒会がいつ変なことをやらかすかわからないし、監視は依然継続」
line = "「星徒会がいつ変なことをやらかすかわからないし、監視は依然継続」"

[[dialogue]]
speaker = "ナターシャ"
# 「だから、ベアト。選管の仲間として──」
line = "「だから、ベアト。選管の仲間として──」"

[[dialogue]]
speaker = "ベアトリス"
# 「友達としてっ！」
line = "「友達としてっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「これからも、よろしく」
line = "「これからも、よろしく」"

[[dialogue]]
speaker = "ベアトリス"
# 「うんっ！」
line = "「うんっ！」"
