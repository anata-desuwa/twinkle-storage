[[dialogue]]
speaker = "シュティレ"
# 「流石は新星学園最速の星騎士……凄まじいスピードでした、蘭美先輩」
line = "「流石は新星学園最速の星騎士……凄まじいスピードでした、蘭美先輩」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ええ。蘭美様がいなかったら、どうなっていたことか……！」
line = "「ええ。蘭美様がいなかったら、どうなっていたことか……！」"

[[dialogue]]
speaker = "蘭美"
# 「全員で勝ち取った勝利よ！　２人ともお疲れ様……いいえ。ダッチ、貴方も。作戦自体は褒められたものではなかったけれど、うまくいったわね！！」
line = "「全員で勝ち取った勝利よ！　２人ともお疲れ様……いいえ。ダッチ、貴方も。作戦自体は褒められたものではなかったけれど、うまくいったわね！！」"

[[dialogue]]
speaker = "ダッチ"
# 「ヌフフ！　蘭美様のスピードありきの作戦でしたが、上手くいきましたねぇ！！」
line = "「ヌフフ！　蘭美様のスピードありきの作戦でしたが、上手くいきましたねぇ！！」"

[[dialogue]]
speaker = "シエスタ"
# 「う……うぅう……！」
line = "「う……うぅう……！」"

[[dialogue]]
speaker = "蘭美"
# 「『支配』のシエスタ。もう抵抗は無駄よ。諦めてお縄につきなさい！」
line = "「『支配』のシエスタ。もう抵抗は無駄よ。諦めてお縄につきなさい！」"

[[dialogue]]
speaker = "unk"
# みんな──待ってくれ！！
line = "みんな──待ってくれ！！"

[[dialogue]]
speaker = "蘭美"
# 「ぴょんっ！？　会長っ……どうして止めるのよ！？　こいつは貴方を──いいえ、あ、貴女？　を誘拐したのよ！」
line = "「ぴょんっ！？　会長っ……どうして止めるのよ！？　こいつは貴方を──いいえ、あ、貴女？　を誘拐したのよ！」"

[[dialogue]]
speaker = "シュティレ"
# 「女体化していると何だか調子が狂いますね。ぴょんぴょん。まだ操られているのでしょうか」
line = "「女体化していると何だか調子が狂いますね。ぴょんぴょん。まだ操られているのでしょうか」"

[[dialogue]]
speaker = "unk"
# 話を聞いて欲しいんだ！！
line = "話を聞いて欲しいんだ！！"

[[dialogue]]
speaker = "unk"
# 蘭美、シュティレ、トリュファイナさん！
line = "蘭美、シュティレ、トリュファイナさん！"

[[dialogue]]
speaker = "トリュファイナ"
# 「私たちの名を……！？」
line = "「私たちの名を……！？」"

[[dialogue]]
speaker = "ダッチ"
# 「ふむ。シスの『支配』の力が弱まったからでしょう。ようやく正気を取り戻してくれたみたいですねぇ！」
line = "「ふむ。シスの『支配』の力が弱まったからでしょう。ようやく正気を取り戻してくれたみたいですねぇ！」"

[[dialogue]]
speaker = "unk"
# 彼女は俺のために、この誘拐騒ぎを……！
line = "彼女は俺のために、この誘拐騒ぎを……！"

[[dialogue]]
speaker = "unk"
# シエスタを許してやってくれ！
line = "シエスタを許してやってくれ！"

[[dialogue]]
speaker = "シュティレ"
# 「……いったい、どういうことなのです？」
line = "「……いったい、どういうことなのです？」"

[[dialogue]]
speaker = "シエスタ"
# 「…………お兄ちゃん」
line = "「…………お兄ちゃん」"

[[dialogue]]
speaker = "unk"
# シス、みんなに説明するんだ
line = "シス、みんなに説明するんだ"

[[dialogue]]
speaker = "蘭美"
# 「ここまで来たからには、話を聞かせなさい！　私たちは、それを聞く権利があるわ！」
line = "「ここまで来たからには、話を聞かせなさい！　私たちは、それを聞く権利があるわ！」"

[[dialogue]]
speaker = "シエスタ"
# 「…………わかった、の」
line = "「…………わかった、の」"

[[dialogue]]
speaker = "unk"
# 『支配』のロストアイテム──シエスタ。
line = "『支配』のロストアイテム──シエスタ。"

[[dialogue]]
speaker = "unk"
# 彼女はリクリエすらも超える永き時を生き続け、他の兄弟たちと同じく自我を持つに至った。
line = "彼女はリクリエすらも超える永き時を生き続け、他の兄弟たちと同じく自我を持つに至った。"

[[dialogue]]
speaker = "unk"
# 『七彩のアイテムズ』は、自身の他に６つ。全員が自我を持っており、末娘であるシエスタの自我の芽生えを祝福してくれた。
line = "『七彩のアイテムズ』は、自身の他に６つ。全員が自我を持っており、末娘であるシエスタの自我の芽生えを祝福してくれた。"

[[dialogue]]
speaker = "unk"
# だがシエスタ本人は、己の境遇を呪った……なぜか？
line = "だがシエスタ本人は、己の境遇を呪った……なぜか？"

[[dialogue]]
speaker = "unk"
# それは実に単純明快で、救いのない事実──彼女の兄弟は、頭のおかしいやつしかいなかったからだ。
line = "それは実に単純明快で、救いのない事実──彼女の兄弟は、頭のおかしいやつしかいなかったからだ。"

[[dialogue]]
speaker = "unk"
# 長兄の獅子舞は、堅物そうに見えてその実、女性に晴れ着を与えて喜ぶ性癖を持つ変なやつ。
line = "長兄の獅子舞は、堅物そうに見えてその実、女性に晴れ着を与えて喜ぶ性癖を持つ変なやつ。"

[[dialogue]]
speaker = "unk"
# 次兄のダッチは、シエスタにとって汚点でしかなかった──ウサギ狂いが高じて、妹に着脱不可能なうさ耳カチューシャまで贈りつけるような輩。
line = "次兄のダッチは、シエスタにとって汚点でしかなかった──ウサギ狂いが高じて、妹に着脱不可能なうさ耳カチューシャまで贈りつけるような輩。"

[[dialogue]]
speaker = "unk"
# ──長兄と次兄で、これなのだ。三男以降の連中もまともなわけがない。
line = "──長兄と次兄で、これなのだ。三男以降の連中もまともなわけがない。"

[[dialogue]]
speaker = "unk"
# シエスタは自我を獲得してから『優しくてかっこいい素敵なお兄ちゃん』が欲しいと思い続けた……
line = "シエスタは自我を獲得してから『優しくてかっこいい素敵なお兄ちゃん』が欲しいと思い続けた……"

[[dialogue]]
speaker = "unk"
# それから永き時が過ぎ──森羅歴３００２年。
line = "それから永き時が過ぎ──森羅歴３００２年。"

[[dialogue]]
speaker = "unk"
# シエスタは人間界で運命の相手に出会った。
line = "シエスタは人間界で運命の相手に出会った。"

[[dialogue]]
speaker = "unk"
# 学園中の女の子から『お兄ちゃん』と慕われる存在──
line = "学園中の女の子から『お兄ちゃん』と慕われる存在──"

[[dialogue]]
speaker = "unk"
# ──緋宮クロト。
line = "──緋宮クロト。"

[[dialogue]]
speaker = "シエスタ"
# （…………！！）
line = "（…………！！）"

[[dialogue]]
speaker = "unk"
# 血が繋がっていなくても、彼は自分に甘えてくる女生徒たちを『妹』として扱い、優しく接していた。
line = "血が繋がっていなくても、彼は自分に甘えてくる女生徒たちを『妹』として扱い、優しく接していた。"

[[dialogue]]
speaker = "シエスタ"
# （シスの……理想のお兄ちゃんなのっ！！）
line = "（シスの……理想のお兄ちゃんなのっ！！）"

[[dialogue]]
speaker = "unk"
# 自分もあの輪に入りたい。そう幾度、願ったか。
line = "自分もあの輪に入りたい。そう幾度、願ったか。"

[[dialogue]]
speaker = "unk"
# しかしそのたびに、シエスタは自分の身体を見て──諦めた。
line = "しかしそのたびに、シエスタは自分の身体を見て──諦めた。"

[[dialogue]]
speaker = "シエスタ"
# （……シスは人間じゃないの。天使でもない。魔族でもない。言葉が喋れるだけの、モンスターと変わらないの……）
line = "（……シスは人間じゃないの。天使でもない。魔族でもない。言葉が喋れるだけの、モンスターと変わらないの……）"

[[dialogue]]
speaker = "unk"
# こんな異形が近づいたらびっくりさせてしまう。
line = "こんな異形が近づいたらびっくりさせてしまう。"

[[dialogue]]
speaker = "unk"
# 『お兄ちゃん』なんて呼んだところで──気味悪がられるに決まっている。
line = "『お兄ちゃん』なんて呼んだところで──気味悪がられるに決まっている。"

[[dialogue]]
speaker = "unk"
# だからシエスタは『理想のお兄ちゃん』を、影から見るだけで満足しようと心に決めた──
line = "だからシエスタは『理想のお兄ちゃん』を、影から見るだけで満足しようと心に決めた──"

[[dialogue]]
speaker = "unk"
# しかし、クロトの日々を観察していくうちに、シエスタはどんどん不安になっていった。
line = "しかし、クロトの日々を観察していくうちに、シエスタはどんどん不安になっていった。"

[[dialogue]]
speaker = "unk"
# 彼は学園中の生徒から頼られ、寝る間もなく活動していた。
line = "彼は学園中の生徒から頼られ、寝る間もなく活動していた。"

[[dialogue]]
speaker = "unk"
# 朝も昼も夜もなく、みんなのために忙しく働き続けて……いつか倒れるんじゃないか、とシエスタは心配と不安を抱くようになった。
line = "朝も昼も夜もなく、みんなのために忙しく働き続けて……いつか倒れるんじゃないか、とシエスタは心配と不安を抱くようになった。"

[[dialogue]]
speaker = "unk"
# 特にシエスタが目の敵にしたのは、錬金術同好会の存在だった。あの優しいお兄ちゃんを実験台にして、アヤシイ薬を日夜飲ませて、苦しめていた。
line = "特にシエスタが目の敵にしたのは、錬金術同好会の存在だった。あの優しいお兄ちゃんを実験台にして、アヤシイ薬を日夜飲ませて、苦しめていた。"

[[dialogue]]
speaker = "unk"
# アニマの薬を飲んだクロトは、女の子になったり、翼が生えたり……
line = "アニマの薬を飲んだクロトは、女の子になったり、翼が生えたり……"

[[dialogue]]
speaker = "unk"
# ある日、新薬を飲んだクロトが、四足歩行をしながら山奥に消え、一晩中遠吠えをしているのを見た時に、シエスタの我慢は限界を迎えた。
line = "ある日、新薬を飲んだクロトが、四足歩行をしながら山奥に消え、一晩中遠吠えをしているのを見た時に、シエスタの我慢は限界を迎えた。"

[[dialogue]]
speaker = "シエスタ"
# 「もう見てられないの……お兄ちゃん、このままじゃ死んじゃうの！！」
line = "「もう見てられないの……お兄ちゃん、このままじゃ死んじゃうの！！」"

[[dialogue]]
speaker = "unk"
# その時、生まれて初めて、シスは己の能力を我欲のために使うことを決意し──
line = "その時、生まれて初めて、シスは己の能力を我欲のために使うことを決意し──"

[[dialogue]]
speaker = "unk"
# 今回の誘拐騒ぎを、引き起こしたのだった。
line = "今回の誘拐騒ぎを、引き起こしたのだった。"
