[[dialogue]]
speaker = "unk"
# 第１話,アポロの真意,P
line = "第１話,アポロの真意,P"

[[dialogue]]
speaker = "unk"
# 星見家メイド隊のメイド長であるキリカは、突然訪れた難題に困惑していた。
line = "星見家メイド隊のメイド長であるキリカは、突然訪れた難題に困惑していた。"

[[dialogue]]
speaker = "キリカ"
# 「アポロ様が……メイド修行、ですか？」
line = "「アポロ様が……メイド修行、ですか？」"

[[dialogue]]
speaker = "アポロ"
# 「うん！」
line = "「うん！」"

[[dialogue]]
speaker = "アポロ"
# 「めーわくをかけたのはあたしもなのに、クーシェンだけ罰を受けるのはよくないぞ！」
line = "「めーわくをかけたのはあたしもなのに、クーシェンだけ罰を受けるのはよくないぞ！」"

[[dialogue]]
speaker = "アポロ"
# 「あたしもちゃんと罰を受けたい！　それがあたしの正義だ！」
line = "「あたしもちゃんと罰を受けたい！　それがあたしの正義だ！」"

[[dialogue]]
speaker = "キリカ"
# 「正義、ですか……そう言われてしまうと、駄目とは言いづらいですね……」
line = "「正義、ですか……そう言われてしまうと、駄目とは言いづらいですね……」"

[[dialogue]]
speaker = "マリオン"
# 「フィオナお嬢様は何と？」
line = "「フィオナお嬢様は何と？」"

[[dialogue]]
speaker = "キリカ"
# 「アポロ様の好きにさせてあげて欲しいと」
line = "「アポロ様の好きにさせてあげて欲しいと」"

[[dialogue]]
speaker = "アポロ"
# 「フィオナがオッケーなら、何も問題ないな！」
line = "「フィオナがオッケーなら、何も問題ないな！」"

[[dialogue]]
speaker = "キリカ"
# 「問題大ありです。我ら星見家メイド隊は、星見家の皆さまにお仕えする身。であるのに、主であるアポロ様に同じことをさせるなど……」
line = "「問題大ありです。我ら星見家メイド隊は、星見家の皆さまにお仕えする身。であるのに、主であるアポロ様に同じことをさせるなど……」"

[[dialogue]]
speaker = "マリオン"
# 「ちょ～っと気まずいですよねぇ」
line = "「ちょ～っと気まずいですよねぇ」"

[[dialogue]]
speaker = "アポロ"
# 「そっか……あたしのわがままでみんなに迷惑かけちゃうのは、よくないよな」
line = "「そっか……あたしのわがままでみんなに迷惑かけちゃうのは、よくないよな」"

[[dialogue]]
speaker = "キリカ"
# 「いえ、我々の迷惑などお気になさらないで下さい。何より優先すべきは、アポロ様のお気持ちですから」
line = "「いえ、我々の迷惑などお気になさらないで下さい。何より優先すべきは、アポロ様のお気持ちですから」"

[[dialogue]]
speaker = "アポロ"
# 「つまり、あたしの真意を問う！　ってことだな？　確かに、いきなりあたしがメイド修行したいなんて言っても、遊びだと思われて当然だ」
line = "「つまり、あたしの真意を問う！　ってことだな？　確かに、いきなりあたしがメイド修行したいなんて言っても、遊びだと思われて当然だ」"

[[dialogue]]
speaker = "アポロ"
# 「真剣にメイドをしてるみんなに失礼なことだと思う。でも、安心してくれ、決して遊びじゃないぞ」
line = "「真剣にメイドをしてるみんなに失礼なことだと思う。でも、安心してくれ、決して遊びじゃないぞ」"

[[dialogue]]
speaker = "キリカ"
# 「……と仰いますと？」
line = "「……と仰いますと？」"

[[dialogue]]
speaker = "アポロ"
# 「あたしも同じ罰を受けるって言ったけど、それは理由の半分なんだ」
line = "「あたしも同じ罰を受けるって言ったけど、それは理由の半分なんだ」"

[[dialogue]]
speaker = "アポロ"
# 「もう半分は……クーシェンのためだ。いきなりメイドって言われたら戸惑うだろ。だから、あたしが一緒にいてやるんだ」
line = "「もう半分は……クーシェンのためだ。いきなりメイドって言われたら戸惑うだろ。だから、あたしが一緒にいてやるんだ」"

[[dialogue]]
speaker = "キリカ"
# 「そんなお優しい考えがあったのですね……アポロ様には」
line = "「そんなお優しい考えがあったのですね……アポロ様には」"

[[dialogue]]
speaker = "キリカ"
# 「感服致しました。アポロ様のそのお気持ちを決して無駄には致しません。我ら星見家メイド隊一丸となってお２人のメイド修行をお支えしましょう」
line = "「感服致しました。アポロ様のそのお気持ちを決して無駄には致しません。我ら星見家メイド隊一丸となってお２人のメイド修行をお支えしましょう」"

[[dialogue]]
speaker = "キリカ"
# 「全メイドに通達、これより星見家メイド隊は特別モードに移行。アポロ様、クーシェン様の両名を見習いメイドとしてお迎えします」
line = "「全メイドに通達、これより星見家メイド隊は特別モードに移行。アポロ様、クーシェン様の両名を見習いメイドとしてお迎えします」"

[[dialogue]]
speaker = "マリオン"
# 「了解です～」
line = "「了解です～」"

[[dialogue]]
speaker = "アポロ"
# 「ちょ、ちょっと大袈裟じゃないか？」
line = "「ちょ、ちょっと大袈裟じゃないか？」"

[[dialogue]]
speaker = "アポロ"
# 「ふつーでいいんだよ、ふつーで。受け入れ態勢バッチリだと、クーシェンもビビっちゃうし……」
line = "「ふつーでいいんだよ、ふつーで。受け入れ態勢バッチリだと、クーシェンもビビっちゃうし……」"

[[dialogue]]
speaker = "アポロ"
# 「あたしだって……修行にちょっぴりワクワクしてるの、なんか悪いだろ」
line = "「あたしだって……修行にちょっぴりワクワクしてるの、なんか悪いだろ」"

[[dialogue]]
speaker = "キリカ"
# 「ふふっ、存じておりますよ。メイド修行と言っても修行は修行。アポロ様の琴線にも触れるものがあるのでしょう」
line = "「ふふっ、存じておりますよ。メイド修行と言っても修行は修行。アポロ様の琴線にも触れるものがあるのでしょう」"

[[dialogue]]
speaker = "アポロ"
# 「しょうがないだろ。流星ライダーだって、強敵と戦う前には修行してるしな」
line = "「しょうがないだろ。流星ライダーだって、強敵と戦う前には修行してるしな」"

[[dialogue]]
speaker = "キリカ"
# 「メイド修行は、戦闘訓練だけではありませんよ？」
line = "「メイド修行は、戦闘訓練だけではありませんよ？」"

[[dialogue]]
speaker = "アポロ"
# 「あたしだってそのくらいわかってるよ。でもさ、知らないことを教わって、それでもっとすごい自分になるんだ、それだけでワクワクしちゃうだろ」
line = "「あたしだってそのくらいわかってるよ。でもさ、知らないことを教わって、それでもっとすごい自分になるんだ、それだけでワクワクしちゃうだろ」"

[[dialogue]]
speaker = "キリカ"
# 「素晴らしい向上心です。であれば、私から申し上げることは何も御座いません」
line = "「素晴らしい向上心です。であれば、私から申し上げることは何も御座いません」"

[[dialogue]]
speaker = "キリカ"
# 「ビシバシしごきますので、お覚悟を、アポロ様」
line = "「ビシバシしごきますので、お覚悟を、アポロ様」"

[[dialogue]]
speaker = "アポロ"
# 「うん！　遠慮なくやっちゃってくれよな！」
line = "「うん！　遠慮なくやっちゃってくれよな！」"

[[dialogue]]
speaker = "unk"
# こうしてアポロはメイド見習いとして修行を受けることを、正式に許可されたのだった。
line = "こうしてアポロはメイド見習いとして修行を受けることを、正式に許可されたのだった。"

[[dialogue]]
speaker = "unk"
# 星見家から招待を受け、やってきた俺の前に現れたのは──
line = "星見家から招待を受け、やってきた俺の前に現れたのは──"

[[dialogue]]
speaker = "アポロ"
# 「い、いらっしゃい、魔王」
line = "「い、いらっしゃい、魔王」"

[[dialogue]]
speaker = "unk"
# め、メイド服だ……
line = "め、メイド服だ……"

[[dialogue]]
speaker = "unk"
# アポロ！？
line = "アポロ！？"

[[dialogue]]
speaker = "アポロ"
# 「うん、メイド服もらったんだけど……ど、どうかな？」
line = "「うん、メイド服もらったんだけど……ど、どうかな？」"

[[dialogue]]
speaker = "アポロ"
# 「こういうひらひらした感じの服は、動きづらくて好きじゃないんだけど……」
line = "「こういうひらひらした感じの服は、動きづらくて好きじゃないんだけど……」"

[[dialogue]]
speaker = "アポロ"
# 「……フィオナが、魔王はこういうの絶対好きだって言うんだ」
line = "「……フィオナが、魔王はこういうの絶対好きだって言うんだ」"

[[dialogue]]
speaker = "アポロ"
# 「ほんとのところ？　どうなんだ？　おまえはメイド服のあたし、好きか？」
line = "「ほんとのところ？　どうなんだ？　おまえはメイド服のあたし、好きか？」"

[[dialogue]]
speaker = "unk"
# めっちゃ可愛い！　最高！
line = "めっちゃ可愛い！　最高！"

[[dialogue]]
speaker = "unk"
# 大好き！
line = "大好き！"

[[dialogue]]
speaker = "アポロ"
# 「お、おうっ……そこまでとは思わなかったから、ちょっとビックリしたぞ」
line = "「お、おうっ……そこまでとは思わなかったから、ちょっとビックリしたぞ」"

[[dialogue]]
speaker = "アポロ"
# 「でもよかった！　魔王が気に入ってくれたなら、あたしも大丈夫だ！」
line = "「でもよかった！　魔王が気に入ってくれたなら、あたしも大丈夫だ！」"

[[dialogue]]
speaker = "unk"
# 応援してるよ
line = "応援してるよ"

[[dialogue]]
speaker = "unk"
# メイド修行、頑張ってね
line = "メイド修行、頑張ってね"

[[dialogue]]
speaker = "アポロ"
# 「えへへ～、すぐに可愛いメイドさんになっちゃうから、期待していいぞ」
line = "「えへへ～、すぐに可愛いメイドさんになっちゃうから、期待していいぞ」"

[[dialogue]]
speaker = "アポロ"
# 「魔王があたしのこと欲しくなっちゃうくらい、最高のメイドさんになるぞ～！」
line = "「魔王があたしのこと欲しくなっちゃうくらい、最高のメイドさんになるぞ～！」"

[[dialogue]]
speaker = "unk"
# こうして、アポロはメイド修行にやる気を漲らせるのだった。
line = "こうして、アポロはメイド修行にやる気を漲らせるのだった。"
