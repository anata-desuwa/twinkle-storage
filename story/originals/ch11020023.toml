[[dialogue]]
speaker = "unk"
# 第３話,最新型ギガンドムをゲットせよ,P
line = "第３話,最新型ギガンドムをゲットせよ,P"

[[dialogue]]
speaker = "パイロット１"
# 「よぉ。てめぇがこのギガンドム部隊のエースらしいが、音楽の趣味は平凡だな？　ガッカリだぜ！」
line = "「よぉ。てめぇがこのギガンドム部隊のエースらしいが、音楽の趣味は平凡だな？　ガッカリだぜ！」"

[[dialogue]]
speaker = "パイロット２"
# 「今度会った時はこうはいかない……次は必ず俺が勝つ！！」
line = "「今度会った時はこうはいかない……次は必ず俺が勝つ！！」"

[[dialogue]]
speaker = "シュティレ"
# 「……これは見事な引きの１話ですね。続きが気になります、わくわく」
line = "「……これは見事な引きの１話ですね。続きが気になります、わくわく」"

[[dialogue]]
speaker = "シュティレ"
# 「今季からスタートした、新しいギガンドムシリーズ……いかがでしたか会長？」
line = "「今季からスタートした、新しいギガンドムシリーズ……いかがでしたか会長？」"

[[dialogue]]
speaker = "unk"
# めちゃくちゃ面白い……！
line = "めちゃくちゃ面白い……！"

[[dialogue]]
speaker = "シュティレ"
# 「ええ。主人公の機体も、ライバルの機体も見事なデザインです。これは是非とも組み立てたいところ……！」
line = "「ええ。主人公の機体も、ライバルの機体も見事なデザインです。これは是非とも組み立てたいところ……！」"

[[dialogue]]
speaker = "シュティレ"
# 「──む。見てください会長。ＳＮＳで急報です。新型ギガンドムのプラモデルが、予約の抽選を開始したと……！」
line = "「──む。見てください会長。ＳＮＳで急報です。新型ギガンドムのプラモデルが、予約の抽選を開始したと……！」"

[[dialogue]]
speaker = "unk"
# さっそく申し込もう！
line = "さっそく申し込もう！"

[[dialogue]]
speaker = "シュティレ"
# 「ええ……しかし、むむむ。ずいぶんとお高いですね……」
line = "「ええ……しかし、むむむ。ずいぶんとお高いですね……」"

[[dialogue]]
speaker = "シュティレ"
# 「主人公機のサイコギガンドム……武装が多岐にわたるため、ある程度の高値は予測していましたが──」
line = "「主人公機のサイコギガンドム……武装が多岐にわたるため、ある程度の高値は予測していましたが──」"

[[dialogue]]
speaker = "シュティレ"
# 「がーん。シュティレのお小遣い、完全に予算オーバーです。このままでは抽選に勝ち抜いても購入できません」
line = "「がーん。シュティレのお小遣い、完全に予算オーバーです。このままでは抽選に勝ち抜いても購入できません」"

[[dialogue]]
speaker = "unk"
# 俺も少し厳しいかもしれない……
line = "俺も少し厳しいかもしれない……"

[[dialogue]]
speaker = "シュティレ"
# 「そういえば会長は、かつてアルバイト戦士であったとか。いかがでしょう、短期のバイトで資金を稼ぐというのは」
line = "「そういえば会長は、かつてアルバイト戦士であったとか。いかがでしょう、短期のバイトで資金を稼ぐというのは」"

[[dialogue]]
speaker = "シュティレ"
# 「……古いツテを使っていただける？　感謝いたします」
line = "「……古いツテを使っていただける？　感謝いたします」"

[[dialogue]]
speaker = "シュティレ"
# 「最新型ギガンドムのためならば、粉骨砕身。励ませていただきます。ぶい」
line = "「最新型ギガンドムのためならば、粉骨砕身。励ませていただきます。ぶい」"

[[dialogue]]
speaker = "unk"
# 自慢ではないが、俺は数多のアルバイトを経験してきた。だからこそ短期で集中して稼げる仕事先にもツテはたくさんある。
line = "自慢ではないが、俺は数多のアルバイトを経験してきた。だからこそ短期で集中して稼げる仕事先にもツテはたくさんある。"

[[dialogue]]
speaker = "unk"
# しかし、いきなり短期の増員を２名も認めてくれるところとなると……
line = "しかし、いきなり短期の増員を２名も認めてくれるところとなると……"

[[dialogue]]
speaker = "メイドさん"
# 「にゃ～ん♪　今日はよろしくにゃん、２人とも！」
line = "「にゃ～ん♪　今日はよろしくにゃん、２人とも！」"

[[dialogue]]
speaker = "シュティレ"
# 「なんと、意外な場所ですね。猫耳メイド喫茶とは……」
line = "「なんと、意外な場所ですね。猫耳メイド喫茶とは……」"

[[dialogue]]
speaker = "unk"
# ここしか選択肢がなかった……
line = "ここしか選択肢がなかった……"

[[dialogue]]
speaker = "メイドさん"
# 「短期のアルバイトってスタッフの調整が難しいから、普通はお断りにゃんだけど～」
line = "「短期のアルバイトってスタッフの調整が難しいから、普通はお断りにゃんだけど～」"

[[dialogue]]
speaker = "メイドさん"
# 「かつてのナンバーワン、クロトくんたってのお願いなら！　店長、聞いてあげちゃうにゃん♪」
line = "「かつてのナンバーワン、クロトくんたってのお願いなら！　店長、聞いてあげちゃうにゃん♪」"

[[dialogue]]
speaker = "unk"
# すみません、お世話になります
line = "すみません、お世話になります"

[[dialogue]]
speaker = "メイドさん"
# 「気にしないで～。それよりそれよりっ。彼女さん、めーっちゃ可愛いね～♪」
line = "「気にしないで～。それよりそれよりっ。彼女さん、めーっちゃ可愛いね～♪」"

[[dialogue]]
speaker = "シュティレ"
# 「どうも。『閃光』のプリティー天使、不動シュティレです。しかしよろしいのでしょうか、このウサギの衣装のままで」
line = "「どうも。『閃光』のプリティー天使、不動シュティレです。しかしよろしいのでしょうか、このウサギの衣装のままで」"

[[dialogue]]
speaker = "メイドさん"
# 「いいにゃん、いいにゃん♪　新しい動物メイドさんが期間限定で入りました～ってことにしてるから！」
line = "「いいにゃん、いいにゃん♪　新しい動物メイドさんが期間限定で入りました～ってことにしてるから！」"

[[dialogue]]
speaker = "シュティレ"
# 「承知いたしました。ではお客様──いいえ。ご主人様を全力でおもてなしいたします。ぴょんぴょん」
line = "「承知いたしました。ではお客様──いいえ。ご主人様を全力でおもてなしいたします。ぴょんぴょん」"

[[dialogue]]
speaker = "メイドさん"
# 「うんうん、いい感じ～♪　けっこう大変だと思うけど、クロにゃんにサポートは任せてるから。安心して欲しいにゃん♪」
line = "「うんうん、いい感じ～♪　けっこう大変だと思うけど、クロにゃんにサポートは任せてるから。安心して欲しいにゃん♪」"

[[dialogue]]
speaker = "シュティレ"
# 「それは超安心ですね。にゃんにゃん」
line = "「それは超安心ですね。にゃんにゃん」"

[[dialogue]]
speaker = "unk"
# もうウサギか猫かわからなくなってる……！
line = "もうウサギか猫かわからなくなってる……！"

[[dialogue]]
speaker = "シュティレ"
# 「ふふ、今日は面白いです。会長の新たな一面を知ることが出来ました。まさか猫耳メイド喫茶でも働いていただなんて」
line = "「ふふ、今日は面白いです。会長の新たな一面を知ることが出来ました。まさか猫耳メイド喫茶でも働いていただなんて」"

[[dialogue]]
speaker = "unk"
# 恋人に女装姿も見せたくなかった……
line = "恋人に女装姿も見せたくなかった……"

[[dialogue]]
speaker = "unk"
# ……本当は、内緒にしたかった
line = "……本当は、内緒にしたかった"

[[dialogue]]
speaker = "シュティレ"
# 「急なアルバイトのお願いをねじこめる、そんな我儘を言える職場がここしかなかったのでしょう？」
line = "「急なアルバイトのお願いをねじこめる、そんな我儘を言える職場がここしかなかったのでしょう？」"

[[dialogue]]
speaker = "シュティレ"
# 「シュティレのために恥を忍んでいただき、感謝します。さぁ会長、シュティレを立派なメイドに教育してください。ぴょんぴょん」
line = "「シュティレのために恥を忍んでいただき、感謝します。さぁ会長、シュティレを立派なメイドに教育してください。ぴょんぴょん」"

[[dialogue]]
speaker = "シュティレ"
# 「あ──早速の来客ですね。お帰りなさいませ、ご主人様。ぴょーんぴょん」
line = "「あ──早速の来客ですね。お帰りなさいませ、ご主人様。ぴょーんぴょん」"

[[dialogue]]
speaker = "若い男"
# 「お、今日は変わったメイドさんがいるな……って。あれ、キミは！？」
line = "「お、今日は変わったメイドさんがいるな……って。あれ、キミは！？」"

[[dialogue]]
speaker = "シュティレ"
# 「あ──貴方は！　以前、限定版ギガンドムのプラモデルを譲っていただいた、倉庫バイトの御方……！」
line = "「あ──貴方は！　以前、限定版ギガンドムのプラモデルを譲っていただいた、倉庫バイトの御方……！」"

[[dialogue]]
speaker = "若い男"
# 「世間は狭いなあ。ここで働いてるんだ？」
line = "「世間は狭いなあ。ここで働いてるんだ？」"

[[dialogue]]
speaker = "シュティレ"
# 「はい。最新型ギガンドムのためのお小遣い稼ぎです。ぶい」
line = "「はい。最新型ギガンドムのためのお小遣い稼ぎです。ぶい」"

[[dialogue]]
speaker = "若い男"
# 「ははは。気持ちはわかるよ、あれは絶対に手に入れたいよな！　頑張ってくれよ──ってぇ！？」
line = "「ははは。気持ちはわかるよ、あれは絶対に手に入れたいよな！　頑張ってくれよ──ってぇ！？」"

[[dialogue]]
speaker = "unk"
# お、お帰りなさいませにゃんっ♪
line = "お、お帰りなさいませにゃんっ♪"

[[dialogue]]
speaker = "若い男"
# 「え、何だこの子……めっちゃ可愛い……トゥンク……」
line = "「え、何だこの子……めっちゃ可愛い……トゥンク……」"

[[dialogue]]
speaker = "シュティレ"
# （おや……内緒にしているのですか、ご友人には）
line = "（おや……内緒にしているのですか、ご友人には）"

[[dialogue]]
speaker = "unk"
# （言えるわけないだろ……！？）
line = "（言えるわけないだろ……！？）"

[[dialogue]]
speaker = "シュティレ"
# （承知いたしました。ではシュティレが接客いたしましょう。何かありましたらサポートお願いします、クロにゃん先輩）
line = "（承知いたしました。ではシュティレが接客いたしましょう。何かありましたらサポートお願いします、クロにゃん先輩）"

[[dialogue]]
speaker = "unk"
# こうして俺とシュティレは、猫耳メイド喫茶で短期のアルバイトを行った。
line = "こうして俺とシュティレは、猫耳メイド喫茶で短期のアルバイトを行った。"

[[dialogue]]
speaker = "unk"
# シュティレは笑顔こそ少し苦手だけれど、気配り上手で物覚えも早い。あっという間に立派なメイドとして立ち回るのだった──
line = "シュティレは笑顔こそ少し苦手だけれど、気配り上手で物覚えも早い。あっという間に立派なメイドとして立ち回るのだった──"
