[[dialogue]]
speaker = "unk"
# ３日ぶりにクーシェン達のメイド修行の様子を見に来た。
line = "３日ぶりにクーシェン達のメイド修行の様子を見に来た。"

[[dialogue]]
speaker = "クーシェン"
# 「にーにー！」
line = "「にーにー！」"

[[dialogue]]
speaker = "クーシェン"
# 「っとと、いけないいけない。いきなり走り出すなんてメイド失格だよね」
line = "「っとと、いけないいけない。いきなり走り出すなんてメイド失格だよね」"

[[dialogue]]
speaker = "クーシェン"
# 「スカートのすそを動かさないように……よし、出来たっ」
line = "「スカートのすそを動かさないように……よし、出来たっ」"

[[dialogue]]
speaker = "クーシェン"
# 「ということで改めまして……ごきげんよう、にーにー。今日はボクたちの修行を見に来てくれてありがとう」
line = "「ということで改めまして……ごきげんよう、にーにー。今日はボクたちの修行を見に来てくれてありがとう」"

[[dialogue]]
speaker = "unk"
# びっくりしたよ
line = "びっくりしたよ"

[[dialogue]]
speaker = "unk"
# ……クーシェン？
line = "……クーシェン？"

[[dialogue]]
speaker = "クーシェン"
# 「もー、にーにーってば失礼だなぁ。これでも先輩メイドのみんなに厳しく指導してもらってるんだからね」
line = "「もー、にーにーってば失礼だなぁ。これでも先輩メイドのみんなに厳しく指導してもらってるんだからね」"

[[dialogue]]
speaker = "アポロ"
# 「そうだぞー、魔王。クーシェンもあたしも、かなり上達してるんだから」
line = "「そうだぞー、魔王。クーシェンもあたしも、かなり上達してるんだから」"

[[dialogue]]
speaker = "マリオン"
# 「まだまだ見習いレベルですけれど、日々の訓練が結果に表われていると思います」
line = "「まだまだ見習いレベルですけれど、日々の訓練が結果に表われていると思います」"

[[dialogue]]
speaker = "クーシェン"
# 「やった！　マリオンに褒められた～」
line = "「やった！　マリオンに褒められた～」"

[[dialogue]]
speaker = "アポロ"
# 「魔王もあたし達のこと褒めていいんだぞー」
line = "「魔王もあたし達のこと褒めていいんだぞー」"

[[dialogue]]
speaker = "unk"
# 頑張ったね
line = "頑張ったね"

[[dialogue]]
speaker = "unk"
# ２人ともえらい
line = "２人ともえらい"

[[dialogue]]
speaker = "クーシェン"
# 「えへへ～、にーにーにも褒められちゃった～」
line = "「えへへ～、にーにーにも褒められちゃった～」"

[[dialogue]]
speaker = "アポロ"
# 「最高のご褒美だな！」
line = "「最高のご褒美だな！」"

[[dialogue]]
speaker = "クーシェン"
# 「お礼にメイドのボクがにーにーにご奉仕しちゃおうかな♪」
line = "「お礼にメイドのボクがにーにーにご奉仕しちゃおうかな♪」"

[[dialogue]]
speaker = "アポロ"
# 「あたしも一緒にするぞ」
line = "「あたしも一緒にするぞ」"

[[dialogue]]
speaker = "クーシェン"
# 「でも、具体的に何をするのがいいんだろ……？」
line = "「でも、具体的に何をするのがいいんだろ……？」"

[[dialogue]]
speaker = "ナミエル"
# 「でしたら、緋宮会長をご主人様に見立てて、身だしなみを整えて差し上げるのはどうですか？」
line = "「でしたら、緋宮会長をご主人様に見立てて、身だしなみを整えて差し上げるのはどうですか？」"

[[dialogue]]
speaker = "クーシェン"
# 「昨日やったやつだね！　それなら楽勝だよ～」
line = "「昨日やったやつだね！　それなら楽勝だよ～」"

[[dialogue]]
speaker = "アポロ"
# 「あたし達の手にかかれば、魔王も数倍かっこよくなっちゃうぞ」
line = "「あたし達の手にかかれば、魔王も数倍かっこよくなっちゃうぞ」"

[[dialogue]]
speaker = "unk"
# 楽しみだ
line = "楽しみだ"

[[dialogue]]
speaker = "unk"
# じゃあ、お願いしようかな
line = "じゃあ、お願いしようかな"

[[dialogue]]
speaker = "クーシェン"
# 「ボクは前をやるから、アポロは後ろを頼む！」
line = "「ボクは前をやるから、アポロは後ろを頼む！」"

[[dialogue]]
speaker = "アポロ"
# 「わかった！　ふふ、魔王の頭のとこ、寝癖ついてるぞ。ぴょこんってしてる」
line = "「わかった！　ふふ、魔王の頭のとこ、寝癖ついてるぞ。ぴょこんってしてる」"

[[dialogue]]
speaker = "クーシェン"
# 「ウキキ♪　にーにーも見えないところは油断してるみたいだね」
line = "「ウキキ♪　にーにーも見えないところは油断してるみたいだね」"

[[dialogue]]
speaker = "クーシェン"
# 「見えるところはちゃんとしてるけど……ここ、キュッと締めた方がいいんだって」
line = "「見えるところはちゃんとしてるけど……ここ、キュッと締めた方がいいんだって」"

[[dialogue]]
speaker = "アポロ"
# 「うう～、魔王の寝癖がしつこい～。マリオン、これどうやったら直るんだ？」
line = "「うう～、魔王の寝癖がしつこい～。マリオン、これどうやったら直るんだ？」"

[[dialogue]]
speaker = "マリオン"
# 「整髪料の力を借りましょう～。常に持ち歩くようにしておくと便利ですよ」
line = "「整髪料の力を借りましょう～。常に持ち歩くようにしておくと便利ですよ」"

[[dialogue]]
speaker = "クーシェン"
# 「うわ、この飾りどうなってるの？　引っ張ったら取れちゃいそうなんだけど」
line = "「うわ、この飾りどうなってるの？　引っ張ったら取れちゃいそうなんだけど」"

[[dialogue]]
speaker = "フェニエル"
# 「あ、それは引っ張っちゃダメです！」
line = "「あ、それは引っ張っちゃダメです！」"

[[dialogue]]
speaker = "unk"
# 首が絞まる……
line = "首が絞まる……"

[[dialogue]]
speaker = "unk"
# く、苦しい～
line = "く、苦しい～"

[[dialogue]]
speaker = "クーシェン"
# 「ごめん、にーにー！　えっと、ボクは他のことするね」
line = "「ごめん、にーにー！　えっと、ボクは他のことするね」"

[[dialogue]]
speaker = "ナミエル"
# 「慌てると余計に失敗しますよ」
line = "「慌てると余計に失敗しますよ」"

[[dialogue]]
speaker = "クーシェン"
# 「そ、そうだった。落ち着け～、落ち着け～」
line = "「そ、そうだった。落ち着け～、落ち着け～」"

[[dialogue]]
speaker = "アポロ"
# 「スプレーしゅっしゅ～」
line = "「スプレーしゅっしゅ～」"

[[dialogue]]
speaker = "クーシェン"
# 「うぎゃ！　目潰し食らったぁ～！」
line = "「うぎゃ！　目潰し食らったぁ～！」"

[[dialogue]]
speaker = "アポロ"
# 「わ、悪い、そっちにかかっちゃったか？」
line = "「わ、悪い、そっちにかかっちゃったか？」"

[[dialogue]]
speaker = "クーシェン"
# 「目がシパシパするよ～」
line = "「目がシパシパするよ～」"

[[dialogue]]
speaker = "フェニエル"
# 「ああ、こすると余計に染みるから……」
line = "「ああ、こすると余計に染みるから……」"

[[dialogue]]
speaker = "クーシェン"
# 「うわああぁぁ～～、そういうのはもっと早く言ってよ～」
line = "「うわああぁぁ～～、そういうのはもっと早く言ってよ～」"

[[dialogue]]
speaker = "クーシェン"
# 「にーにー、ごめんなさぁい」
line = "「にーにー、ごめんなさぁい」"

[[dialogue]]
speaker = "アポロ"
# 「ごめんな、魔王。あたし達、メイドとしてはまだまだだったみたいだ」
line = "「ごめんな、魔王。あたし達、メイドとしてはまだまだだったみたいだ」"

[[dialogue]]
speaker = "unk"
# 努力賞をあげよう
line = "努力賞をあげよう"

[[dialogue]]
speaker = "unk"
# 気持ちは伝わったよ
line = "気持ちは伝わったよ"

[[dialogue]]
speaker = "クーシェン"
# 「えへへ～、にーにーってばやさしいご主人様だね～」
line = "「えへへ～、にーにーってばやさしいご主人様だね～」"

[[dialogue]]
speaker = "アポロ"
# 「でも、それに甘えちゃダメだ。全部あたし達に任せてもらえるくらいにならなきゃ」
line = "「でも、それに甘えちゃダメだ。全部あたし達に任せてもらえるくらいにならなきゃ」"

[[dialogue]]
speaker = "クーシェン"
# 「わかってるって。メイド修行は始まったばっかりだし、いっぱい努力して最強のメイドさんになっちゃうんだから」
line = "「わかってるって。メイド修行は始まったばっかりだし、いっぱい努力して最強のメイドさんになっちゃうんだから」"

[[dialogue]]
speaker = "アポロ"
# 「あたしもっ……クーシェンと同じだ！」
line = "「あたしもっ……クーシェンと同じだ！」"

[[dialogue]]
speaker = "クーシェン"
# 「もー、真似っこするなよ～」
line = "「もー、真似っこするなよ～」"

[[dialogue]]
speaker = "アポロ"
# 「クーシェンが先に言っただけだ。あたしはもっとずっと前から思ってたぞ」
line = "「クーシェンが先に言っただけだ。あたしはもっとずっと前から思ってたぞ」"

[[dialogue]]
speaker = "クーシェン"
# 「嘘だぁ」
line = "「嘘だぁ」"

[[dialogue]]
speaker = "アポロ"
# 「嘘じゃない！」
line = "「嘘じゃない！」"

[[dialogue]]
speaker = "クーシェン"
# 「だったら、どっちが正しいか……勝負だ！」
line = "「だったら、どっちが正しいか……勝負だ！」"

[[dialogue]]
speaker = "unk"
# メイドらしくないよ
line = "メイドらしくないよ"

[[dialogue]]
speaker = "unk"
# ２人ともストップ！
line = "２人ともストップ！"

[[dialogue]]
speaker = "クーシェン"
# 「うぎゅっ、そうだった……今のボクは星見家のメイド見習いだったね……」
line = "「うぎゅっ、そうだった……今のボクは星見家のメイド見習いだったね……」"

[[dialogue]]
speaker = "アポロ"
# 「すぐ戦いたくなっちゃうのは、あたしとクーシェンの悪いクセだな」
line = "「すぐ戦いたくなっちゃうのは、あたしとクーシェンの悪いクセだな」"

[[dialogue]]
speaker = "クーシェン"
# 「失礼しました、にーにー。もう乱暴なことしないから許してね」
line = "「失礼しました、にーにー。もう乱暴なことしないから許してね」"

[[dialogue]]
speaker = "アポロ"
# 「あたしも悪かった。メイド服を着てる時は大人しくしとくよ」
line = "「あたしも悪かった。メイド服を着てる時は大人しくしとくよ」"

[[dialogue]]
speaker = "クーシェン"
# 「今はメイドだけど、いつまでもずっとメイドってわけじゃないから、それまでの辛抱だね」
line = "「今はメイドだけど、いつまでもずっとメイドってわけじゃないから、それまでの辛抱だね」"

[[dialogue]]
speaker = "アポロ"
# 「うん……でもメイド修行をしてるのは、ぜったい無駄じゃない」
line = "「うん……でもメイド修行をしてるのは、ぜったい無駄じゃない」"

[[dialogue]]
speaker = "クーシェン"
# 「もちろん！」
line = "「もちろん！」"

[[dialogue]]
speaker = "unk"
# こうして２人は未来を見据えながら、引き続きメイド修行に励むのだった。
line = "こうして２人は未来を見据えながら、引き続きメイド修行に励むのだった。"
