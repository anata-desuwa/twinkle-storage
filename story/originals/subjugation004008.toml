[[dialogue]]
speaker = "unk"
# カフェテリアを訪れたベアトリスとナターシャ。
line = "カフェテリアを訪れたベアトリスとナターシャ。"

[[dialogue]]
speaker = "unk"
# ２人はハロウィンの準備をしていたサランと蛍火に事情を説明し、協力してもらうことになった。
line = "２人はハロウィンの準備をしていたサランと蛍火に事情を説明し、協力してもらうことになった。"

[[dialogue]]
speaker = "サラン"
# 「ふんふん……とっておきのハロウィンパーティーにしたいんだね～。サランも応援するよ～」
line = "「ふんふん……とっておきのハロウィンパーティーにしたいんだね～。サランも応援するよ～」"

[[dialogue]]
speaker = "サラン"
# 「ハロウィンパーティー用のお菓子なら、カボチャのモンブランを作るのはどうかな～？」
line = "「ハロウィンパーティー用のお菓子なら、カボチャのモンブランを作るのはどうかな～？」"

[[dialogue]]
speaker = "ベアトリス"
# 「モンブラン！？　すっごく繊細そうな気がしますけど、私たちにできるかなぁ……？」
line = "「モンブラン！？　すっごく繊細そうな気がしますけど、私たちにできるかなぁ……？」"

[[dialogue]]
speaker = "サラン"
# 「だいじょうぶ～♪　作るって言っても、タルト生地とカボチャクリームはできてるから～」
line = "「だいじょうぶ～♪　作るって言っても、タルト生地とカボチャクリームはできてるから～」"

[[dialogue]]
speaker = "サラン"
# 「タルト生地に生クリームを載せて、カボチャクリームをにゅるにゅる～って搾るだけ～。簡単でしょ～？」
line = "「タルト生地に生クリームを載せて、カボチャクリームをにゅるにゅる～って搾るだけ～。簡単でしょ～？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ん、そのくらいならできそうかな」
line = "「ん、そのくらいならできそうかな」"

[[dialogue]]
speaker = "ベアトリス"
# 「じゃあやってみますっ」
line = "「じゃあやってみますっ」"

[[dialogue]]
speaker = "unk"
# サランに準備をしてもらって、モンブラン作りを始めるベアトリスとナターシャ。
line = "サランに準備をしてもらって、モンブラン作りを始めるベアトリスとナターシャ。"

[[dialogue]]
speaker = "ベアトリス"
# 「あれ、あれれれれ？　にゅるにゅる搾るの、思ったより難しいですニャ～……」
line = "「あれ、あれれれれ？　にゅるにゅる搾るの、思ったより難しいですニャ～……」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアト、力入れすぎだし焦りすぎ。もっとゆっくりでいいんだよ。ほら、こうやって──」
line = "「ベアト、力入れすぎだし焦りすぎ。もっとゆっくりでいいんだよ。ほら、こうやって──」"

[[dialogue]]
speaker = "ベアトリス"
# 「わ、わ、ナターシャちゃん、やっぱり器用だねっ！　とっても綺麗っ！」
line = "「わ、わ、ナターシャちゃん、やっぱり器用だねっ！　とっても綺麗っ！」"

[[dialogue]]
speaker = "サラン"
# 「初めてとは思えないくらい上手だね～♪」
line = "「初めてとは思えないくらい上手だね～♪」"

[[dialogue]]
speaker = "蛍火"
# 「確かに。見事な手際です。試食していかれますか？」
line = "「確かに。見事な手際です。試食していかれますか？」"

[[dialogue]]
speaker = "ベアトリス"
# 「はいっ！　ちゃんと美味しいか、確認しないとですよねっ。いただきま～すっ、あむっ♪」
line = "「はいっ！　ちゃんと美味しいか、確認しないとですよねっ。いただきま～すっ、あむっ♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「べースはサランたちが作ってるんだから、大丈夫に決まってるでしょ。……あむ」
line = "「べースはサランたちが作ってるんだから、大丈夫に決まってるでしょ。……あむ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ん～～っ♪　ナターシャちゃんのモンブラン美味しいニャ～っ！」
line = "「ん～～っ♪　ナターシャちゃんのモンブラン美味しいニャ～っ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアトのモンブランは……うん、私のと変わんないね。タルト生地とクリームは同じだしそりゃそうか」
line = "「ベアトのモンブランは……うん、私のと変わんないね。タルト生地とクリームは同じだしそりゃそうか」"

[[dialogue]]
speaker = "ベアトリス"
# 「美味しくない？」
line = "「美味しくない？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ん～……私、美味しいってのがよくわからないからね」
line = "「ん～……私、美味しいってのがよくわからないからね」"

[[dialogue]]
speaker = "蛍火"
# 「ナターシャさんは味蕾が目覚めてないのでしょうか？」
line = "「ナターシャさんは味蕾が目覚めてないのでしょうか？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ミライ？　時を超える能力とか……？」
line = "「ミライ？　時を超える能力とか……？」"

[[dialogue]]
speaker = "蛍火"
# 「『未来』ではなく『味蕾』です。舌にある味を感じ取る器官です」
line = "「『未来』ではなく『味蕾』です。舌にある味を感じ取る器官です」"

[[dialogue]]
speaker = "ナターシャ"
# 「や、味はわかるよ。甘いとかしょっぱいとかは判別できるし。嗅覚も機能してる」
line = "「や、味はわかるよ。甘いとかしょっぱいとかは判別できるし。嗅覚も機能してる」"

[[dialogue]]
speaker = "ナターシャ"
# 「仕事柄、心を殺す訓練ってのをやったせいか、味はわかっても美味しいって思わないんだよね」
line = "「仕事柄、心を殺す訓練ってのをやったせいか、味はわかっても美味しいって思わないんだよね」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃん……」
line = "「ナターシャちゃん……」"

[[dialogue]]
speaker = "蛍火"
# 「それは……相当過酷な訓練だったのですね」
line = "「それは……相当過酷な訓練だったのですね」"

[[dialogue]]
speaker = "ベアトリス"
# 「私……ナターシャちゃんにも『美味しい』って気持ちを知ってほしい」
line = "「私……ナターシャちゃんにも『美味しい』って気持ちを知ってほしい」"

[[dialogue]]
speaker = "ベアトリス"
# 「私は吸血鬼だけど、食べるのが好き。美味しいものを食べると幸せな気持ちになる」
line = "「私は吸血鬼だけど、食べるのが好き。美味しいものを食べると幸せな気持ちになる」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃんにも、その幸せを知ってほしいよ！」
line = "「ナターシャちゃんにも、その幸せを知ってほしいよ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「気持ちはありがたいけど、別に不便してるわけじゃないしね。ベアトが気にしなくてもいいんじゃない」
line = "「気持ちはありがたいけど、別に不便してるわけじゃないしね。ベアトが気にしなくてもいいんじゃない」"

[[dialogue]]
speaker = "ベアトリス"
# 「それでも、ナターシャちゃんに知ってもらいたいの！　私の気持ち！」
line = "「それでも、ナターシャちゃんに知ってもらいたいの！　私の気持ち！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアト……」
line = "「ベアト……」"

[[dialogue]]
speaker = "ナターシャ"
# 「確かにベアトはわがままかもね。お人好しなわがままだ」
line = "「確かにベアトはわがままかもね。お人好しなわがままだ」"

[[dialogue]]
speaker = "ベアトリス"
# 「あの……蛍火さん。私、作りたい料理があるんです。ごにょごにょごにょ……」
line = "「あの……蛍火さん。私、作りたい料理があるんです。ごにょごにょごにょ……」"

[[dialogue]]
speaker = "蛍火"
# 「なるほど。それでしたら材料は揃っていますので、用意しましょう」
line = "「なるほど。それでしたら材料は揃っていますので、用意しましょう」"

[[dialogue]]
speaker = "unk"
# 蛍火に材料を準備してもらい、ベアトリスが厨房に立つ。
line = "蛍火に材料を準備してもらい、ベアトリスが厨房に立つ。"

[[dialogue]]
speaker = "ベアトリス"
# 「というわけで、ナターシャちゃんにちなんで『暗殺者のパスタ』を作りますっ」
line = "「というわけで、ナターシャちゃんにちなんで『暗殺者のパスタ』を作りますっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「物騒な名前だね。それ、本当にある料理？　ベアトの創作じゃなくて？」
line = "「物騒な名前だね。それ、本当にある料理？　ベアトの創作じゃなくて？」"

[[dialogue]]
speaker = "蛍火"
# 「安心してください。実在する料理です。トマトソースとニンニクを使って、フライパンで直接炒めて作るパスタです」
line = "「安心してください。実在する料理です。トマトソースとニンニクを使って、フライパンで直接炒めて作るパスタです」"

[[dialogue]]
speaker = "ベアトリス"
# 「私の大好物ニャんですっ」
line = "「私の大好物ニャんですっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「暗殺者にニンニクとか匂いの強い食べ物はタブーなんだけどな。ガーリックハラスメント、ガリハラだよ？」
line = "「暗殺者にニンニクとか匂いの強い食べ物はタブーなんだけどな。ガーリックハラスメント、ガリハラだよ？」"

[[dialogue]]
speaker = "ベアトリス"
# 「でも今は任務がないんだし、暗殺者がお休みなら、食べてみてもいいんじゃニャい？」
line = "「でも今は任務がないんだし、暗殺者がお休みなら、食べてみてもいいんじゃニャい？」"

[[dialogue]]
speaker = "ベアトリス"
# 「それに吸血鬼の格好してるなら、血のように赤いパスタはピッタリだよ！」
line = "「それに吸血鬼の格好してるなら、血のように赤いパスタはピッタリだよ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「そういうものかな～？」
line = "「そういうものかな～？」"

[[dialogue]]
speaker = "蛍火"
# 「ニンニク料理でしたら、サランさんよりも私の領分。私がお手伝いしましょう」
line = "「ニンニク料理でしたら、サランさんよりも私の領分。私がお手伝いしましょう」"

[[dialogue]]
speaker = "ベアトリス"
# 「蛍火さん、よろしくお願いしますっ」
line = "「蛍火さん、よろしくお願いしますっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「完成～～～っ！」
line = "「完成～～～っ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「え、もう？　１５分しか経ってないよ」
line = "「え、もう？　１５分しか経ってないよ」"

[[dialogue]]
speaker = "蛍火"
# 「材料も簡単に揃うものですし、手早く作れるのが利点の料理ですから」
line = "「材料も簡単に揃うものですし、手早く作れるのが利点の料理ですから」"

[[dialogue]]
speaker = "蛍火"
# 「ただ、こちらの暗殺者のパスタ、従来のレシピの約１０倍のニンニクを使用しています。味を調えるのに一苦労でした」
line = "「ただ、こちらの暗殺者のパスタ、従来のレシピの約１０倍のニンニクを使用しています。味を調えるのに一苦労でした」"

[[dialogue]]
speaker = "ベアトリス"
# 「大丈夫ですよっ。ニンニクは使えば使うほど美味しいんですからっ。ナターシャちゃん、召し上がれ」
line = "「大丈夫ですよっ。ニンニクは使えば使うほど美味しいんですからっ。ナターシャちゃん、召し上がれ」"

[[dialogue]]
speaker = "ナターシャ"
# 「うわ！？　すっごい匂い……鼻が利かなくなりそう……。これ、食べても大丈夫なやつなの？」
line = "「うわ！？　すっごい匂い……鼻が利かなくなりそう……。これ、食べても大丈夫なやつなの？」"

[[dialogue]]
speaker = "ベアトリス"
# 「一口だけ！　一口だけでもいいから食べてみて！」
line = "「一口だけ！　一口だけでもいいから食べてみて！」"

[[dialogue]]
speaker = "ナターシャ"
# 「まぁ、そこまで言うなら、一口だけは食べるかな」
line = "「まぁ、そこまで言うなら、一口だけは食べるかな」"

[[dialogue]]
speaker = "ナターシャ"
# 「フォークでくるくるくるっと……あむっ」
line = "「フォークでくるくるくるっと……あむっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「んぅむーーーっ！！？　けほっ！　けほっ！」
line = "「んぅむーーーっ！！？　けほっ！　けほっ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「大丈夫、ナターシャちゃん！？」
line = "「大丈夫、ナターシャちゃん！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「けほ、けほ……食べさせたのベアトでしょ。一瞬死ぬかと思った……暗殺者が暗殺されるところだったよ」
line = "「けほ、けほ……食べさせたのベアトでしょ。一瞬死ぬかと思った……暗殺者が暗殺されるところだったよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ニンニクに慣れてないのに、これはさすがにキツいかも。私を苦しめるなんて、よっぽどだよ」
line = "「ニンニクに慣れてないのに、これはさすがにキツいかも。私を苦しめるなんて、よっぽどだよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「そ、そう……ごめん、残りは私が食べるね……」
line = "「そ、そう……ごめん、残りは私が食べるね……」"

[[dialogue]]
speaker = "ナターシャ"
# 「あ、ちょっと待って」
line = "「あ、ちょっと待って」"

[[dialogue]]
speaker = "ベアトリス"
# 「え？」
line = "「え？」"

[[dialogue]]
speaker = "ナターシャ"
# 「どうしてかわからないけど、自分でも変な気分だけど……もう一口だけなら食べていい気がした」
line = "「どうしてかわからないけど、自分でも変な気分だけど……もう一口だけなら食べていい気がした」"

[[dialogue]]
speaker = "ナターシャ"
# 「癖になるってやつ？　これが『美味しい』なのかわからないけど、一周回ってアリな気がする」
line = "「癖になるってやつ？　これが『美味しい』なのかわからないけど、一周回ってアリな気がする」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃん……！」
line = "「ナターシャちゃん……！」"

[[dialogue]]
speaker = "ナターシャ"
# 「さすがに完食は無理だけどね。だから一緒に食べよ、ベアト」
line = "「さすがに完食は無理だけどね。だから一緒に食べよ、ベアト」"

[[dialogue]]
speaker = "ベアトリス"
# 「うん！」
line = "「うん！」"

[[dialogue]]
speaker = "ベアトリス"
# 「じゃあ私が食べさせてあげるね！　あ～ん」
line = "「じゃあ私が食べさせてあげるね！　あ～ん」"

[[dialogue]]
speaker = "ナターシャ"
# 「や、それはいらない」
line = "「や、それはいらない」"

[[dialogue]]
speaker = "ベアトリス"
# 「え～～っ！？」
line = "「え～～っ！？」"

[[dialogue]]
speaker = "蛍火"
# 「どうやらうまくいった……みたいですね」
line = "「どうやらうまくいった……みたいですね」"

[[dialogue]]
speaker = "サラン"
# 「うん、２人とも仲良しでよかった～♪」
line = "「うん、２人とも仲良しでよかった～♪」"
