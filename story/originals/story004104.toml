[[dialogue]]
speaker = "モネ"
# 「サランさん！？」
line = "「サランさん！？」"

[[dialogue]]
speaker = "サラン"
# 「モネちゃんこんにちは～。借りてた絵本を返しに来たら、不思議な匂いがしたから、つい声をかけちゃった～」
line = "「モネちゃんこんにちは～。借りてた絵本を返しに来たら、不思議な匂いがしたから、つい声をかけちゃった～」"

[[dialogue]]
speaker = "リィベル"
# 「不思議な匂い……？　本の匂いしかしないはずだけど……」
line = "「不思議な匂い……？　本の匂いしかしないはずだけど……」"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～？　そうなの～？　でも、甘くてスパイスの混じった、すご～くいい匂いがするよ～？」
line = "「ぽよ～？　そうなの～？　でも、甘くてスパイスの混じった、すご～くいい匂いがするよ～？」"

[[dialogue]]
speaker = "リィベル"
# 「魔本に惹かれているということかしら。サラン、少しじっとしていなさい」
line = "「魔本に惹かれているということかしら。サラン、少しじっとしていなさい」"

[[dialogue]]
speaker = "サラン"
# 「ぽよ？」
line = "「ぽよ？」"

[[dialogue]]
speaker = "unk"
# サランの頭の上に魔本をかざすと、激しく明滅した。
line = "サランの頭の上に魔本をかざすと、激しく明滅した。"

[[dialogue]]
speaker = "サラン"
# 「すごいすご～い！　光るお本だ～♪」
line = "「すごいすご～い！　光るお本だ～♪」"

[[dialogue]]
speaker = "モネ"
# 「サランさん、実は……」
line = "「サランさん、実は……」"

[[dialogue]]
speaker = "unk"
# モネは先ほどシャルレーヌにしたのと同じように、深淵書庫と魔将について説明した。
line = "モネは先ほどシャルレーヌにしたのと同じように、深淵書庫と魔将について説明した。"

[[dialogue]]
speaker = "サラン"
# 「わかった～。サラン、その魔将っていうのになればいいんだね～？」
line = "「わかった～。サラン、その魔将っていうのになればいいんだね～？」"

[[dialogue]]
speaker = "ウィステリア"
# 「こっちからお願いしておいてなんだけど、本当に大丈夫？　魔将になるということは、魔本に呪われるということ。危険と隣り合わせなのよ」
line = "「こっちからお願いしておいてなんだけど、本当に大丈夫？　魔将になるということは、魔本に呪われるということ。危険と隣り合わせなのよ」"

[[dialogue]]
speaker = "サラン"
# 「だいじょうぶ～。サランも星騎士だから、危険は慣れっこだもん～」
line = "「だいじょうぶ～。サランも星騎士だから、危険は慣れっこだもん～」"

[[dialogue]]
speaker = "サラン"
# 「それに、むか～しむか～しの魔族さんのことが書かれたお本なら、もう誰も知らないお菓子のレシピが見付かるかも～。ワクワクする～♪」
line = "「それに、むか～しむか～しの魔族さんのことが書かれたお本なら、もう誰も知らないお菓子のレシピが見付かるかも～。ワクワクする～♪」"

[[dialogue]]
speaker = "リィベル"
# 「決まりね。もうすぐ図書館も閉館時間だし、閉めたら深淵書庫へ行きましょう」
line = "「決まりね。もうすぐ図書館も閉館時間だし、閉めたら深淵書庫へ行きましょう」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ここが深淵書庫……空気が重いですね」
line = "「ここが深淵書庫……空気が重いですね」"

[[dialogue]]
speaker = "unk"
# 初めて深淵書庫を訪れたシャルレーヌ。その一方で、イクシリオンは別の感情を抱いていた。
line = "初めて深淵書庫を訪れたシャルレーヌ。その一方で、イクシリオンは別の感情を抱いていた。"

[[dialogue]]
speaker = "イクシリオン"
# 「久しぶりにお邪魔します。……防衛システムは本当に反応しなくなったんですね。驚きです」
line = "「久しぶりにお邪魔します。……防衛システムは本当に反応しなくなったんですね。驚きです」"

[[dialogue]]
speaker = "ウィステリア"
# 「システムの大元がこっちにいるしね。まぁ防衛システムが動いてても蹴散らすだけだけど」
line = "「システムの大元がこっちにいるしね。まぁ防衛システムが動いてても蹴散らすだけだけど」"

[[dialogue]]
speaker = "リィベル"
# 「そこ、うるさい。ウィステリアだけには反応するように設定するわよ」
line = "「そこ、うるさい。ウィステリアだけには反応するように設定するわよ」"

[[dialogue]]
speaker = "unk"
# イクシリオンはモネと深淵書庫に迷い込み、防衛システムと戦闘になったことがある。ウィステリアが強力な星騎士だと知ったのもそのときだ。
line = "イクシリオンはモネと深淵書庫に迷い込み、防衛システムと戦闘になったことがある。ウィステリアが強力な星騎士だと知ったのもそのときだ。"

[[dialogue]]
speaker = "サラン"
# 「そうだ～。さっきは図書館だから出せなかったけど、よかったらクッキーどうぞ～」
line = "「そうだ～。さっきは図書館だから出せなかったけど、よかったらクッキーどうぞ～」"

[[dialogue]]
speaker = "イクシリオン"
# 「ええと、深淵書庫内って飲食をしてもよいのでしょうか？」
line = "「ええと、深淵書庫内って飲食をしてもよいのでしょうか？」"

[[dialogue]]
speaker = "リィベル"
# 「構わないわ。魔本はそれくらいじゃ汚れないし、魔法で綺麗にできるもの」
line = "「構わないわ。魔本はそれくらいじゃ汚れないし、魔法で綺麗にできるもの」"

[[dialogue]]
speaker = "イクシリオン"
# 「でしたら頂きます。あむ。……ん～っ、さすがサランさん、クッキーも絶品です！」
line = "「でしたら頂きます。あむ。……ん～っ、さすがサランさん、クッキーも絶品です！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「小麦とバターの香りが調和した、シンプルながらも素晴らしい一品です。これほどのものはディアーブル家お抱えの菓子職人でも作れませんよ」
line = "「小麦とバターの香りが調和した、シンプルながらも素晴らしい一品です。これほどのものはディアーブル家お抱えの菓子職人でも作れませんよ」"

[[dialogue]]
speaker = "モネ"
# 「とっても美味しいです♪　このクッキーがあれば、読書ももっと進みそうですね」
line = "「とっても美味しいです♪　このクッキーがあれば、読書ももっと進みそうですね」"

[[dialogue]]
speaker = "サラン"
# 「えへへ～♪　みんなが喜んでくれてうれし～♪」
line = "「えへへ～♪　みんなが喜んでくれてうれし～♪」"

[[dialogue]]
speaker = "カティア"
# （いいな～！　サラン先輩のクッキー、私も食べたいな～！）
line = "（いいな～！　サラン先輩のクッキー、私も食べたいな～！）"

[[dialogue]]
speaker = "カティア"
# （でも、移動する時になんとか潜り込んだけど、勝手に入って怒られないかな……。うぅ、なんか怖いんだけど、ここ…………）
line = "（でも、移動する時になんとか潜り込んだけど、勝手に入って怒られないかな……。うぅ、なんか怖いんだけど、ここ…………）"

[[dialogue]]
speaker = "カティア"
# （ううんっ、ここまで来たからには絶対、魔将になって強くなってやるっ！）
line = "（ううんっ、ここまで来たからには絶対、魔将になって強くなってやるっ！）"

[[dialogue]]
speaker = "リィベル"
# 「……ふぅん。そういうことね」
line = "「……ふぅん。そういうことね」"

[[dialogue]]
speaker = "リィベル"
# 「それじゃサラン、前へ出てちょうだい」
line = "「それじゃサラン、前へ出てちょうだい」"

[[dialogue]]
speaker = "サラン"
# 「は～い」
line = "「は～い」"

[[dialogue]]
speaker = "unk"
# リィベルが手にした魔本がまた光を放つ。『暴食』の力を宿した魔本だ。
line = "リィベルが手にした魔本がまた光を放つ。『暴食』の力を宿した魔本だ。"

[[dialogue]]
speaker = "サラン"
# 「ふふふ～、やっぱりいい匂～い♪」
line = "「ふふふ～、やっぱりいい匂～い♪」"

[[dialogue]]
speaker = "リィベル"
# 「呪いの本を開く覚悟はいいかしら？」
line = "「呪いの本を開く覚悟はいいかしら？」"

[[dialogue]]
speaker = "サラン"
# 「いつでもどうぞ～」
line = "「いつでもどうぞ～」"

[[dialogue]]
speaker = "リィベル"
# 「……軽い返事ね。まぁ、それくらい豪胆な方がいいでしょう。じゃあ始めるわよ」
line = "「……軽い返事ね。まぁ、それくらい豪胆な方がいいでしょう。じゃあ始めるわよ」"

[[dialogue]]
speaker = "リィベル"
# 「対象者『桜十路サラン』、適合罪科『暴食』。……魔本、貸出承認」
line = "「対象者『桜十路サラン』、適合罪科『暴食』。……魔本、貸出承認」"

[[dialogue]]
speaker = "unk"
# リィベルの宣告とともに、魔本がサランの頭上へと飛び立つ。
line = "リィベルの宣告とともに、魔本がサランの頭上へと飛び立つ。"

[[dialogue]]
speaker = "unk"
# するとページが開き、魔力がサランへと降り注いだ。
line = "するとページが開き、魔力がサランへと降り注いだ。"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～？　すごいすご～い。力が溢れてきちゃう～」
line = "「ぽよ～？　すごいすご～い。力が溢れてきちゃう～」"

[[dialogue]]
speaker = "サラン"
# 「ふわ～。体がなんだかぽかぽかするの～。これが魔将の力なのかな～」
line = "「ふわ～。体がなんだかぽかぽかするの～。これが魔将の力なのかな～」"

[[dialogue]]
speaker = "サラン"
# 「ふふっ、ふふふ～<emoji=heart04>」
line = "「ふふっ、ふふふ～<emoji=heart04>」"

[[dialogue]]
speaker = "イクシリオン"
# 「これが『暴食』の魔将となったサランさんのお姿……すごく、その…………これで『暴食』なんですか？」
line = "「これが『暴食』の魔将となったサランさんのお姿……すごく、その…………これで『暴食』なんですか？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「イクシリオンせんぱ～い？　言いたいことは分かりますけど、それ以上はダメですよ～」
line = "「イクシリオンせんぱ～い？　言いたいことは分かりますけど、それ以上はダメですよ～」"

[[dialogue]]
speaker = "リィベル"
# 「サラン。なぜあなたが魔将に選ばれたのか、理解できたわ」
line = "「サラン。なぜあなたが魔将に選ばれたのか、理解できたわ」"

[[dialogue]]
speaker = "リィベル"
# 「さっきもクッキーを持ってきていたけど、あなたはお菓子作りが得意なのよね？」
line = "「さっきもクッキーを持ってきていたけど、あなたはお菓子作りが得意なのよね？」"

[[dialogue]]
speaker = "サラン"
# 「うん、そうだよ～」
line = "「うん、そうだよ～」"

[[dialogue]]
speaker = "リィベル"
# 「暴食とは、いくら食べても満たされぬ飢えとされている。けれど、飢えているなら食べるのは当然のことだわ」
line = "「暴食とは、いくら食べても満たされぬ飢えとされている。けれど、飢えているなら食べるのは当然のことだわ」"

[[dialogue]]
speaker = "リィベル"
# 「でもお菓子は飢えを満たすものではない。満たされた上でなお食べるもの」
line = "「でもお菓子は飢えを満たすものではない。満たされた上でなお食べるもの」"

[[dialogue]]
speaker = "リィベル"
# 「命を繋ぐはずの食を娯楽とし、甘美を極めんとするその姿勢──まさに暴食の魔将に相応しいわ」
line = "「命を繋ぐはずの食を娯楽とし、甘美を極めんとするその姿勢──まさに暴食の魔将に相応しいわ」"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～？　むずかしくてよくわかんないよ～？」
line = "「ぽよ～？　むずかしくてよくわかんないよ～？」"

[[dialogue]]
speaker = "リィベル"
# 「つまり、お菓子は贅沢品で、欲望の塊ということよ」
line = "「つまり、お菓子は贅沢品で、欲望の塊ということよ」"

[[dialogue]]
speaker = "サラン"
# 「あは～♪　お菓子は夢の結晶だからね～♪」
line = "「あは～♪　お菓子は夢の結晶だからね～♪」"

[[dialogue]]
speaker = "サラン"
# 「ところで、リィベルちゃんはどんなお菓子が好き～？　今度、作ってきてあげる～♪」
line = "「ところで、リィベルちゃんはどんなお菓子が好き～？　今度、作ってきてあげる～♪」"

[[dialogue]]
speaker = "リィベル"
# 「私は甘いものはあまり好きじゃな……いえ、私の好みなんてどうでもいいでしょ」
line = "「私は甘いものはあまり好きじゃな……いえ、私の好みなんてどうでもいいでしょ」"

[[dialogue]]
speaker = "サラン"
# 「せっかくだからリィベルちゃんのこと知りたいな～♪」
line = "「せっかくだからリィベルちゃんのこと知りたいな～♪」"

[[dialogue]]
speaker = "リィベル"
# 「ちょ、ちょっと、ひっつかないでっ」
line = "「ちょ、ちょっと、ひっつかないでっ」"

[[dialogue]]
speaker = "ウィステリア"
# （サランさん、ちょっと様子がおかしくない？）
line = "（サランさん、ちょっと様子がおかしくない？）"

[[dialogue]]
speaker = "モネ"
# （噂に聞く美食酔いではないでしょうか？　サランさんの体質の）
line = "（噂に聞く美食酔いではないでしょうか？　サランさんの体質の）"

[[dialogue]]
speaker = "ウィステリア"
# （ええと……本当に美味しいものを食べると、酔っぱらったみたいになるんだったっけ。でも今は何も食べてないわよ？）
line = "（ええと……本当に美味しいものを食べると、酔っぱらったみたいになるんだったっけ。でも今は何も食べてないわよ？）"

[[dialogue]]
speaker = "モネ"
# （魔将になった影響かもしれません。何せ背負う大罪は『暴食』ですから）
line = "（魔将になった影響かもしれません。何せ背負う大罪は『暴食』ですから）"

[[dialogue]]
speaker = "カティア"
# （サラン先輩、本当に魔将になっちゃった……。すごく強そう……遠くから見てるだけでも、なんかこう、力が伝わってくる……これが魔力なんだ）
line = "（サラン先輩、本当に魔将になっちゃった……。すごく強そう……遠くから見てるだけでも、なんかこう、力が伝わってくる……これが魔力なんだ）"

[[dialogue]]
speaker = "カティア"
# （ああ～～～～いいなぁ～～～～。私ももっともっと強くなりたいなぁ～～～～。うぅ～～）
line = "（ああ～～～～いいなぁ～～～～。私ももっともっと強くなりたいなぁ～～～～。うぅ～～）"

[[dialogue]]
speaker = "カティア"
# （なになになに～～～～！？　見付かっちゃった～～！？）
line = "（なになになに～～～～！？　見付かっちゃった～～！？）"
