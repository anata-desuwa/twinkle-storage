[[dialogue]]
speaker = "unk"
# 第１話,もじもじセッシー,P
line = "第１話,もじもじセッシー,P"

[[dialogue]]
speaker = "紅明"
# 「いや～、それにしてもその衣装はセッシーにぴったりだね☆　妖精さん味が増してるっていうか、よりファンシーってゆーか♪」
line = "「いや～、それにしてもその衣装はセッシーにぴったりだね☆　妖精さん味が増してるっていうか、よりファンシーってゆーか♪」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふふっ、ありがとう。紅明ママ♪　紅明ママに褒めてもらえると心が浮ついてしまうわ♪」
line = "「ふふっ、ありがとう。紅明ママ♪　紅明ママに褒めてもらえると心が浮ついてしまうわ♪」"

[[dialogue]]
speaker = "紅明"
# 「こっちに来てよ、セッシー♪　この可愛さ、たまらないね～！　無限に撫でてあげたくなっちゃうぜ！」
line = "「こっちに来てよ、セッシー♪　この可愛さ、たまらないね～！　無限に撫でてあげたくなっちゃうぜ！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふふふ、ママ～♪　セシアも紅明ママにずーっと甘えたいの～♪　たくさん甘えさせて～<emoji=heart04>」
line = "「ふふふ、ママ～♪　セシアも紅明ママにずーっと甘えたいの～♪　たくさん甘えさせて～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 紅明とセシアはいつものようにじゃれ合っていた。
line = "紅明とセシアはいつものようにじゃれ合っていた。"

[[dialogue]]
speaker = "unk"
# そんなやり取りもしばらくして……
line = "そんなやり取りもしばらくして……"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "紅明"
# 「どうしたのセッシー？　もしかしてアタシの撫で方、激しすぎたかい？」
line = "「どうしたのセッシー？　もしかしてアタシの撫で方、激しすぎたかい？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あ、いいえ！　紅明ママのせいではないのよ。ママに甘えることはわたくしにとって至高の喜び……それは変わらないのだけど……」
line = "「あ、いいえ！　紅明ママのせいではないのよ。ママに甘えることはわたくしにとって至高の喜び……それは変わらないのだけど……」"

[[dialogue]]
speaker = "紅明"
# 「セッシーらしくない浮かない表情しちゃって……何があったの？」
line = "「セッシーらしくない浮かない表情しちゃって……何があったの？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「実は、その……会長のことで……」
line = "「実は、その……会長のことで……」"

[[dialogue]]
speaker = "紅明"
# 「ダーリンのこと？　ラブラブだって思ってたけど何かあったのかい？」
line = "「ダーリンのこと？　ラブラブだって思ってたけど何かあったのかい？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「何かあったというわけではないのだけど……この衣装を、会長にまだ見せられていないのよ」
line = "「何かあったというわけではないのだけど……この衣装を、会長にまだ見せられていないのよ」"

[[dialogue]]
speaker = "紅明"
# 「えっ、まだ見せてなかったのかい？　ああ、そっかあ……星徒会、最近ずっと忙しそうだったもんな～」
line = "「えっ、まだ見せてなかったのかい？　ああ、そっかあ……星徒会、最近ずっと忙しそうだったもんな～」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そうなの。本当ならルヴィネさまと契約して、この姿になったその日に見せに行きたかったのだけど……なかなかタイミングが合わなくて」
line = "「そうなの。本当ならルヴィネさまと契約して、この姿になったその日に見せに行きたかったのだけど……なかなかタイミングが合わなくて」"

[[dialogue]]
speaker = "紅明"
# 「まだ会えてないんだ」
line = "「まだ会えてないんだ」"

[[dialogue]]
speaker = "紅明"
# 「でも、それならすぐ見せにいっちゃえば？　今なら星徒会室にいると思うよ。ダーリン優しいし、絶対喜んでくれるって！」
line = "「でも、それならすぐ見せにいっちゃえば？　今なら星徒会室にいると思うよ。ダーリン優しいし、絶対喜んでくれるって！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "紅明"
# 「ありゃ？　そうでもない感じ？」
line = "「ありゃ？　そうでもない感じ？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「言葉にするのが難しいわ。紅明ママの言う通り、確かにこのまま訪ねればいいだけなのだけど」
line = "「言葉にするのが難しいわ。紅明ママの言う通り、確かにこのまま訪ねればいいだけなのだけど」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「せっかく新しい姿のわたくしだもの。どうせなら会長に喜んでもらえるようなお披露目の仕方ができないかしら、と思って……」
line = "「せっかく新しい姿のわたくしだもの。どうせなら会長に喜んでもらえるようなお披露目の仕方ができないかしら、と思って……」"

[[dialogue]]
speaker = "紅明"
# 「なるほど～。普通に会うんじゃ味気ないってことか」
line = "「なるほど～。普通に会うんじゃ味気ないってことか」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そうなのよ。そのためのちょうどいい機会があればいいのだけれど……なかなか来なくって……」
line = "「そうなのよ。そのためのちょうどいい機会があればいいのだけれど……なかなか来なくって……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「以前までのわたくしなら、そのまま会長を訪ねるだけで済んだはずなのに」
line = "「以前までのわたくしなら、そのまま会長を訪ねるだけで済んだはずなのに」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「なぜかしら。力の一部を取り戻して……知識は前よりも蓄積されているはずなのに……及び腰になってしまうのは」
line = "「なぜかしら。力の一部を取り戻して……知識は前よりも蓄積されているはずなのに……及び腰になってしまうのは」"

[[dialogue]]
speaker = "紅明"
# 「わかるよ、その気持ち！　せっかくのおめかしだったらとっておきの披露をしたい──女の子たるものそう思っちゃうよな！」
line = "「わかるよ、その気持ち！　せっかくのおめかしだったらとっておきの披露をしたい──女の子たるものそう思っちゃうよな！」"

[[dialogue]]
speaker = "紅明"
# （ん？　でも、これってセッシーにそういう『女の子』な感情がちゃんと芽生えてるってこと……？）
line = "（ん？　でも、これってセッシーにそういう『女の子』な感情がちゃんと芽生えてるってこと……？）"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「わかってくれるのね、紅明ママ！」
line = "「わかってくれるのね、紅明ママ！」"

[[dialogue]]
speaker = "紅明"
# 「ふむふむ……なるほど……」
line = "「ふむふむ……なるほど……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「どうかしら、紅明ママ」
line = "「どうかしら、紅明ママ」"

[[dialogue]]
speaker = "紅明"
# 「事態は把握したぜい☆　でもねセッシー、アタシはやっぱりセッシーらしく、素直にぶつかっていくべきだと思うんだ」
line = "「事態は把握したぜい☆　でもねセッシー、アタシはやっぱりセッシーらしく、素直にぶつかっていくべきだと思うんだ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あら……そう？」
line = "「あら……そう？」"

[[dialogue]]
speaker = "紅明"
# 「うん！　だってセッシーは、いつだって素直に行動してきたっしょ。だからダーリンも、素直なセッシーを期待してるんじゃないかなって♪」
line = "「うん！　だってセッシーは、いつだって素直に行動してきたっしょ。だからダーリンも、素直なセッシーを期待してるんじゃないかなって♪」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「！　そう……そうかもしれないわ。紅明ママに言われたら、なんだかそんな気がしてきたわ」
line = "「！　そう……そうかもしれないわ。紅明ママに言われたら、なんだかそんな気がしてきたわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ありのままのわたくしを会長に見てもらう。それが１番なのかも。紅明ママのおかげで決心が固まったわ」
line = "「ありのままのわたくしを会長に見てもらう。それが１番なのかも。紅明ママのおかげで決心が固まったわ」"

[[dialogue]]
speaker = "紅明"
# 「うんうん、いつだってセッシーらしく、な♪　きっとダーリンもそのままのセッシーが好きなはずだからさ♪」
line = "「うんうん、いつだってセッシーらしく、な♪　きっとダーリンもそのままのセッシーが好きなはずだからさ♪」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ん～、ありがとう紅明ママ！　わたくし、思わずバブみが溢れちゃうわ～♪」
line = "「ん～、ありがとう紅明ママ！　わたくし、思わずバブみが溢れちゃうわ～♪」"

[[dialogue]]
speaker = "紅明"
# 「もう、こーら。今、甘えるのはアタシじゃなくてダーリンでしょー？」
line = "「もう、こーら。今、甘えるのはアタシじゃなくてダーリンでしょー？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「はっ、それもそうね！」
line = "「はっ、それもそうね！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「じゃあ、さっそく会長のもとへ行ってくるわ。じゃあね紅明ママ、また後で会いましょう♪」
line = "「じゃあ、さっそく会長のもとへ行ってくるわ。じゃあね紅明ママ、また後で会いましょう♪」"

[[dialogue]]
speaker = "紅明"
# 「ん！　いってこいセッシー！」
line = "「ん！　いってこいセッシー！」"

[[dialogue]]
speaker = "紅明"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "紅明"
# 「せっかくの新衣装……恋人のために特別な披露をしたい……か……」
line = "「せっかくの新衣装……恋人のために特別な披露をしたい……か……」"

[[dialogue]]
speaker = "紅明"
# 「ん～♪　これはなんともまた──いい傾向だねえ♪」
line = "「ん～♪　これはなんともまた──いい傾向だねえ♪」"

[[dialogue]]
speaker = "unk"
# しみじみと漏らす紅明の様子は、まさしく娘を持つ<ruby=ママ>母</ruby>のようだったとか……。
line = "しみじみと漏らす紅明の様子は、まさしく娘を持つ<ruby>母<rt>ママ</rt></ruby>のようだったとか……。"
