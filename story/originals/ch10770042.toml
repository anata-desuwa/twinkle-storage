[[dialogue]]
speaker = "シュティレ"
# 「機械工作同好会では、学園生から制作依頼を受けることがあるのです。このお掃除ロボットはそのプロトタイプ」
line = "「機械工作同好会では、学園生から制作依頼を受けることがあるのです。このお掃除ロボットはそのプロトタイプ」"

[[dialogue]]
speaker = "unk"
# ウサギの耳みたいなのがついてる
