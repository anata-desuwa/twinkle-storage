line = "「ウサギは綺麗好きな動物のため、お掃除ロボットのアイコンとして最適かなと……なかなか可愛いデフォルメになっているでしょう」"

[[dialogue]]
speaker = "シュティレ"
# 「先日のロストアイテム騒動の折、バニーフォームに目覚めたこともあり、その時のインスピレーションをふんだんに盛り込んでみました。ぶい」
line = "「先日のロストアイテム騒動の折、バニーフォームに目覚めたこともあり、その時のインスピレーションをふんだんに盛り込んでみました。ぶい」"

[[dialogue]]
speaker = "アナ"
# 「ソファの下なんかを掃除する時、うさ耳が邪魔になりそうですが……」
line = "「ソファの下なんかを掃除する時、うさ耳が邪魔になりそうですが……」"

[[dialogue]]
speaker = "シュティレ"
# 「折り畳み式で状況に応じて変形します。ウサギをモチーフにしたお掃除ロボなので、耳は外せません。これもまたロマンです」
line = "「折り畳み式で状況に応じて変形します。ウサギをモチーフにしたお掃除ロボなので、耳は外せません。これもまたロマンです」"

[[dialogue]]
speaker = "アナ"
