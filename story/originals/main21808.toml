[[dialogue]]
speaker = "unk"
# 第８話,真相,B
line = "第８話,真相,B"

[[dialogue]]
speaker = "ナターシャ"
# （…………ここ、は？）
line = "（…………ここ、は？）"

[[dialogue]]
speaker = "unk"
# ──深い、深い暗闇。
line = "──深い、深い暗闇。"

[[dialogue]]
speaker = "unk"
# どこまでも沈んでいく錯覚を覚えるような、底なしの深淵の中で、ナターシャはもがく。
line = "どこまでも沈んでいく錯覚を覚えるような、底なしの深淵の中で、ナターシャはもがく。"

[[dialogue]]
speaker = "ナターシャ"
# （メルエルは……いる……）
line = "（メルエルは……いる……）"

[[dialogue]]
speaker = "unk"
# 先ほど繋いだ掌の感触だけは、どうにか感じられる──けれど、姿は見えない。
line = "先ほど繋いだ掌の感触だけは、どうにか感じられる──けれど、姿は見えない。"

[[dialogue]]
speaker = "unk"
# 壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ──
line = "壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ──"

[[dialogue]]
speaker = "ナターシャ"
# （……うるっさ）
line = "（……うるっさ）"

[[dialogue]]
speaker = "unk"
# 滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ──
line = "滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ──"

[[dialogue]]
speaker = "unk"
# 頭の中でこだまする声と共に、ここではない、今でもない記憶が雪崩れ込んでくる──
line = "頭の中でこだまする声と共に、ここではない、今でもない記憶が雪崩れ込んでくる──"

[[dialogue]]
speaker = "ナターシャ"
# （……鏡界の湖？）
line = "（……鏡界の湖？）"

[[dialogue]]
speaker = "ナターシャ"
# （現代の……森羅歴３００２年の、じゃない──）
line = "（現代の……森羅歴３００２年の、じゃない──）"

[[dialogue]]
speaker = "unk"
# 湖のほとりに佇んでいる、２人の天使の少女──彼女たちの服装が、現代のものではなかった。
line = "湖のほとりに佇んでいる、２人の天使の少女──彼女たちの服装が、現代のものではなかった。"

[[dialogue]]
speaker = "ナターシャ"
# （……何これ。悪い冗談？　だって、あの２人……）
line = "（……何これ。悪い冗談？　だって、あの２人……）"

[[dialogue]]
speaker = "unk"
# 彼女たちは、あまりにも──ナターシャとメルエルに似ていた。
line = "彼女たちは、あまりにも──ナターシャとメルエルに似ていた。"

[[dialogue]]
speaker = "？？？"
# 「姫様……もう、おやめ下さい。綺麗だった羽が、こんなにも黒く染まって……」
line = "「姫様……もう、おやめ下さい。綺麗だった羽が、こんなにも黒く染まって……」"

[[dialogue]]
speaker = "？？？"
# 「でも誰かがやらないと、世界が滅んじゃうもの──それにこれは、魔王の血を受け継ぐ私にしかできないことだから！」
line = "「でも誰かがやらないと、世界が滅んじゃうもの──それにこれは、魔王の血を受け継ぐ私にしかできないことだから！」"

[[dialogue]]
speaker = "？？？"
# 「……例の『霧』が、また魔界で生まれちゃったみたい。ついてきてくれる？」
line = "「……例の『霧』が、また魔界で生まれちゃったみたい。ついてきてくれる？」"

[[dialogue]]
speaker = "？？？"
# 「…………仰せのままに。姫様」
line = "「…………仰せのままに。姫様」"

[[dialogue]]
speaker = "？？？"
# 「うん、ありがとう。その……」
line = "「うん、ありがとう。その……」"

[[dialogue]]
speaker = "？？？"
# 「いつも心配かけて、ごめんね──？」
line = "「いつも心配かけて、ごめんね──？」"

[[dialogue]]
speaker = "unk"
# それは約２０００年前の出来事──
line = "それは約２０００年前の出来事──"

[[dialogue]]
speaker = "unk"
# 魔王ラクシスがいなくなり、世界から霊力が跡形もなく消え失せ、人々が新しく星の力を継承した、黎明の時。
line = "魔王ラクシスがいなくなり、世界から霊力が跡形もなく消え失せ、人々が新しく星の力を継承した、黎明の時。"

[[dialogue]]
speaker = "unk"
# ナターシャは途切れ途切れに映される光景を見て、情報を得ていく──
line = "ナターシャは途切れ途切れに映される光景を見て、情報を得ていく──"

[[dialogue]]
speaker = "？？？"
# 「はぁっ……はぁっ……！　これで、おわ、り……っ」
line = "「はぁっ……はぁっ……！　これで、おわ、り……っ」"

[[dialogue]]
speaker = "unk"
# この時代のリクリエの脅威は、森羅歴３００２年のものとは大きく異なっていた。
line = "この時代のリクリエの脅威は、森羅歴３００２年のものとは大きく異なっていた。"

[[dialogue]]
speaker = "unk"
# アステラも、モンスターも、リクリエの使徒もいない。
line = "アステラも、モンスターも、リクリエの使徒もいない。"

[[dialogue]]
speaker = "unk"
# あるのは、世界を作り替える『リクリエの霧』。散発的に発生する霧の内部からは、異形の怪物が現れる。
line = "あるのは、世界を作り替える『リクリエの霧』。散発的に発生する霧の内部からは、異形の怪物が現れる。"

[[dialogue]]
speaker = "unk"
# 霧から生まれた怪物を倒すと、リクリエの瘴気が飛散し、近くにいる者を汚染していくのだ──
line = "霧から生まれた怪物を倒すと、リクリエの瘴気が飛散し、近くにいる者を汚染していくのだ──"

[[dialogue]]
speaker = "unk"
# それはきっと『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』が試していた、再創生のためのプログラムの１つ。
line = "それはきっと『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』が試していた、再創生のためのプログラムの１つ。"

[[dialogue]]
speaker = "unk"
# リクリエの使徒やアステラモンスターを作り上げる前の、いわば実験段階だったのかもしれない。
line = "リクリエの使徒やアステラモンスターを作り上げる前の、いわば実験段階だったのかもしれない。"

[[dialogue]]
speaker = "？？？"
# 「姫様っ……しっかり──」
line = "「姫様っ……しっかり──」"

[[dialogue]]
speaker = "？？？"
# 「う、うん……大丈夫……大丈夫、だから……」
line = "「う、うん……大丈夫……大丈夫、だから……」"

[[dialogue]]
speaker = "unk"
# リクリエの瘴気は、捉えたものを再構築する。
line = "リクリエの瘴気は、捉えたものを再構築する。"

[[dialogue]]
speaker = "unk"
# 星騎士たちは、星力で編んだ戦闘服によってそれを弾くが──
line = "星騎士たちは、星力で編んだ戦闘服によってそれを弾くが──"

[[dialogue]]
speaker = "？？？"
# （２０００年前は、星力の研究も不十分。鍛錬するための専門機関もなかった……）
line = "（２０００年前は、星力の研究も不十分。鍛錬するための専門機関もなかった……）"

[[dialogue]]
speaker = "unk"
# 魔王の血を引く天界の姫は、人々を守るために戦い、そのたびに瘴気に汚染されていく。
line = "魔王の血を引く天界の姫は、人々を守るために戦い、そのたびに瘴気に汚染されていく。"

[[dialogue]]
speaker = "unk"
# 天界の姫は、誰よりも多くの怪物を斃した。
line = "天界の姫は、誰よりも多くの怪物を斃した。"

[[dialogue]]
speaker = "unk"
# 三界を渡り歩き、霧から生まれる異形を切り捨て……日を追うごとに姫の羽はどす黒く染まっていく。
line = "三界を渡り歩き、霧から生まれる異形を切り捨て……日を追うごとに姫の羽はどす黒く染まっていく。"

[[dialogue]]
speaker = "unk"
# しかし彼女は止まらなかった。魔王ラクシスの守ったこの世界を、後世に遺すために戦い続けた。
line = "しかし彼女は止まらなかった。魔王ラクシスの守ったこの世界を、後世に遺すために戦い続けた。"

[[dialogue]]
speaker = "unk"
# そして──
line = "そして──"

[[dialogue]]
speaker = "？？？"
# 「…………世界を、ほろ、ぼす──」
line = "「…………世界を、ほろ、ぼす──」"

[[dialogue]]
speaker = "unk"
# 羽が完全に黒く染まったその時、彼女の人格は乗っ取られた。
line = "羽が完全に黒く染まったその時、彼女の人格は乗っ取られた。"

[[dialogue]]
speaker = "unk"
# 従者が何よりも好きだった姫の外見は、変貌していた。
line = "従者が何よりも好きだった姫の外見は、変貌していた。"

[[dialogue]]
speaker = "unk"
# 亜麻色の髪は白く染まり、慈しみに満ちた瞳は紅く輝き、誰もが見とれた純白の羽は、見る影もない墨色へ。
line = "亜麻色の髪は白く染まり、慈しみに満ちた瞳は紅く輝き、誰もが見とれた純白の羽は、見る影もない墨色へ。"

[[dialogue]]
speaker = "unk"
# 誰よりも平和を願い、誰よりも優しくまっすぐだった少女は、世界の再創生を願う殺戮の天使となってしまった。
line = "誰よりも平和を願い、誰よりも優しくまっすぐだった少女は、世界の再創生を願う殺戮の天使となってしまった。"

[[dialogue]]
speaker = "unk"
# 人間界で、魔界で、天界で──堕天使の少女は暴虐の限りを尽くした。
line = "人間界で、魔界で、天界で──堕天使の少女は暴虐の限りを尽くした。"

[[dialogue]]
speaker = "unk"
# のちの時代に『太陽の壁画』として遺されるほどの恐怖を、振りまき続けた……
line = "のちの時代に『太陽の壁画』として遺されるほどの恐怖を、振りまき続けた……"

[[dialogue]]
speaker = "unk"
# そして──殺戮の魔王は、天界の神殿内で最期を遂げた。
line = "そして──殺戮の魔王は、天界の神殿内で最期を遂げた。"

[[dialogue]]
speaker = "unk"
# 人間と天使と魔族が手を取った連合軍が、とうとう仕留めたのだ。
line = "人間と天使と魔族が手を取った連合軍が、とうとう仕留めたのだ。"

[[dialogue]]
speaker = "unk"
# 魔女の助力を得て完成させた、魔王因子を削り取る宝玉を用いて、弱体化させ──
line = "魔女の助力を得て完成させた、魔王因子を削り取る宝玉を用いて、弱体化させ──"

[[dialogue]]
speaker = "？？？"
# 「だから……言ったのに……」
line = "「だから……言ったのに……」"

[[dialogue]]
speaker = "unk"
# 悪に堕ちた天使の心臓を貫いたのは、従者の剣だった。
line = "悪に堕ちた天使の心臓を貫いたのは、従者の剣だった。"

[[dialogue]]
speaker = "？？？"
# 「魔王の血統だなんて、意識しないでって……」
line = "「魔王の血統だなんて、意識しないでって……」"

[[dialogue]]
speaker = "？？？"
# 「自分のこと、もっと大事にしてって……」
line = "「自分のこと、もっと大事にしてって……」"

[[dialogue]]
speaker = "？？？"
# 「姫様の……まっすぐで、ひたむきなところ……」
line = "「姫様の……まっすぐで、ひたむきなところ……」"

[[dialogue]]
speaker = "？？？"
# 「だいっきらい…………」
line = "「だいっきらい…………」"

[[dialogue]]
speaker = "unk"
# 忌むべき魔王が息を引き取った神殿は、天界でも場所を秘匿され。
line = "忌むべき魔王が息を引き取った神殿は、天界でも場所を秘匿され。"

[[dialogue]]
speaker = "unk"
# 魔王因子に働きかける宝玉は、その最奥に安置され、神殿の機能そのものを担った──
line = "魔王因子に働きかける宝玉は、その最奥に安置され、神殿の機能そのものを担った──"

[[dialogue]]
speaker = "メルエル"
# 「……ナターシャちゃんにも、見えた？」
line = "「……ナターシャちゃんにも、見えた？」"

[[dialogue]]
speaker = "ナターシャ"
# 「うん。どうやら２０００年前からの腐れ縁だったみたいだね、私たち」
line = "「うん。どうやら２０００年前からの腐れ縁だったみたいだね、私たち」"

[[dialogue]]
speaker = "ナターシャ"
# 「それにしても、ここまで似てるだなんてね。そりゃあ私が、メルエルのことを嫌いになるわけだよ」
line = "「それにしても、ここまで似てるだなんてね。そりゃあ私が、メルエルのことを嫌いになるわけだよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエルは、自分が魔王の血を引く天使だなんて、知らないはずなのに……高貴なる者の精神ってやつ？　あるいは王の器ってやつなのかな？」
line = "「メルエルは、自分が魔王の血を引く天使だなんて、知らないはずなのに……高貴なる者の精神ってやつ？　あるいは王の器ってやつなのかな？」"

[[dialogue]]
speaker = "ナターシャ"
# 「誰かのためなら、世界のためなら……自分の命だってあっさり<ruby=か>懸</ruby>けちゃいそうな、そんな危うさがあった……」
line = "「誰かのためなら、世界のためなら……自分の命だってあっさり<ruby>懸<rt>か</rt></ruby>けちゃいそうな、そんな危うさがあった……」"

[[dialogue]]
speaker = "ナターシャ"
# 「まさか、私のご先祖様まで同じ悩みを持ってただなんてね」
line = "「まさか、私のご先祖様まで同じ悩みを持ってただなんてね」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエルの『強いところ』が、私は嫌い……」
line = "「メルエルの『強いところ』が、私は嫌い……」"

[[dialogue]]
speaker = "ナターシャ"
# 「その『強さ』は、いつかメルエル自身を殺してしまう。ずっとそう思ってた……」
line = "「その『強さ』は、いつかメルエル自身を殺してしまう。ずっとそう思ってた……」"

[[dialogue]]
speaker = "ナターシャ"
# 「で──やっぱり、そうなってたわけじゃん。２０００年も前にさ」
line = "「で──やっぱり、そうなってたわけじゃん。２０００年も前にさ」"

[[dialogue]]
speaker = "ナターシャ"
# 「……最悪だよ。世界のために戦ってたのに。世界中から恨まれる悪の魔王になって、壁画にまで残されて……」
line = "「……最悪だよ。世界のために戦ってたのに。世界中から恨まれる悪の魔王になって、壁画にまで残されて……」"

[[dialogue]]
speaker = "メルエル"
# 「じゃ、じゃあ、ナターシャちゃんが私を『嫌い』って言ってたのは、私のためを思って……！？」
line = "「じゃ、じゃあ、ナターシャちゃんが私を『嫌い』って言ってたのは、私のためを思って……！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ううん。『何も知らない小娘』を護衛をさせられてることも、シンプルにムカついてたよ？」
line = "「ううん。『何も知らない小娘』を護衛をさせられてることも、シンプルにムカついてたよ？」"

[[dialogue]]
speaker = "メルエル"
# 「えぇえええっ……！？」
line = "「えぇえええっ……！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そりゃ、いい気持ちするわけないじゃん。同い年の女の子を四六時中、年中無休で護衛するんだよ？」
line = "「そりゃ、いい気持ちするわけないじゃん。同い年の女の子を四六時中、年中無休で護衛するんだよ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「しかも、守られてることにも気づいてもいないし。仕事中なのに呑気に話しかけて来るし」
line = "「しかも、守られてることにも気づいてもいないし。仕事中なのに呑気に話しかけて来るし」"

[[dialogue]]
speaker = "メルエル"
# 「で、でも……！　ナターシャちゃんは、私が無自覚に天界の姫のように振舞うのが『嫌い』、だったんだよね？」
line = "「で、でも……！　ナターシャちゃんは、私が無自覚に天界の姫のように振舞うのが『嫌い』、だったんだよね？」"

[[dialogue]]
speaker = "ナターシャ"
# 「『天界の姫のように振舞うメルエル』のことが嫌いだし、『何も知らない小娘のメルエル』にもイラついてたよ」
line = "「『天界の姫のように振舞うメルエル』のことが嫌いだし、『何も知らない小娘のメルエル』にもイラついてたよ」"

[[dialogue]]
speaker = "メルエル"
# 「そ、それは矛盾って言うんじゃないかなぁ！？」
line = "「そ、それは矛盾って言うんじゃないかなぁ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そう矛盾だよ。私はメルエルに対して、矛盾した気持ちを持ってる」
line = "「そう矛盾だよ。私はメルエルに対して、矛盾した気持ちを持ってる」"

[[dialogue]]
speaker = "ナターシャ"
# 「『何も知らない小娘のメルエル』のことも、『天界の姫のように振舞うメルエル』のことも、どっちも嫌い」
line = "「『何も知らない小娘のメルエル』のことも、『天界の姫のように振舞うメルエル』のことも、どっちも嫌い」"

[[dialogue]]
speaker = "ナターシャ"
# 「どっちに寄せても大嫌いなわけで、こんなの、メルエル側でどうこうできないでしょ？　だから言ったじゃん。私たちは仲直りなんてできないよ」
line = "「どっちに寄せても大嫌いなわけで、こんなの、メルエル側でどうこうできないでしょ？　だから言ったじゃん。私たちは仲直りなんてできないよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「これは私の中にある矛盾で、全部、私が自分勝手な感情でメルエルにイライラしてるだけなんだから」
line = "「これは私の中にある矛盾で、全部、私が自分勝手な感情でメルエルにイライラしてるだけなんだから」"

[[dialogue]]
speaker = "メルエル"
# （ナターシャちゃんは冗談めかして言ってくれるけど……これはきっと、ナターシャちゃんの本音）
line = "（ナターシャちゃんは冗談めかして言ってくれるけど……これはきっと、ナターシャちゃんの本音）"

[[dialogue]]
speaker = "メルエル"
# （今まで誰にも言えず、かと言って逃げることもできないで……そんなナターシャちゃんに、私が付けてきた傷なんだ……）
line = "（今まで誰にも言えず、かと言って逃げることもできないで……そんなナターシャちゃんに、私が付けてきた傷なんだ……）"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃん……」
line = "「ナターシャちゃん……」"

[[dialogue]]
speaker = "ナターシャ"
# 「──あは。そういう顔は、好き。本当に大好きだったなぁ」
line = "「──あは。そういう顔は、好き。本当に大好きだったなぁ」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエルが泣いてるとさ、『ああ、この子にも弱いところがあるんだな』って、安心できた……」
line = "「メルエルが泣いてるとさ、『ああ、この子にも弱いところがあるんだな』って、安心できた……」"

[[dialogue]]
speaker = "ナターシャ"
# 「ずっとこのまま泣いててくれたら、いっそ心なんて折れちゃえば。危ない目になんて遭わないのにって──」
line = "「ずっとこのまま泣いててくれたら、いっそ心なんて折れちゃえば。危ない目になんて遭わないのにって──」"

[[dialogue]]
speaker = "メルエル"
# 「私の泣いてるところが好き……そ、そういう意味、だったんだ……？」
line = "「私の泣いてるところが好き……そ、そういう意味、だったんだ……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ま、単純な嗜好の面でも好きだけどね？」
line = "「ま、単純な嗜好の面でも好きだけどね？」"

[[dialogue]]
speaker = "メルエル"
# 「えっ」
line = "「えっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「私……メルエルの『顔』、好きなんだよねぇ」
line = "「私……メルエルの『顔』、好きなんだよねぇ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ほんと──顔と体だけは最高だよ、メルエル」
line = "「ほんと──顔と体だけは最高だよ、メルエル」"

[[dialogue]]
speaker = "メルエル"
# 「ええっ！？」
line = "「ええっ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「でさ、好みの顔の女が泣いてるのって──凄く興奮するんだよね。ゾクゾクするっていうかさ」
line = "「でさ、好みの顔の女が泣いてるのって──凄く興奮するんだよね。ゾクゾクするっていうかさ」"

[[dialogue]]
speaker = "メルエル"
# 「ど、どういうことぉ！？」
line = "「ど、どういうことぉ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「──ふふっ。冗談だよ、じょーだん」
line = "「──ふふっ。冗談だよ、じょーだん」"

[[dialogue]]
speaker = "ナターシャ"
# 「あ～あ。こんなこと、一生喋るつもりなかったのになぁ……」
line = "「あ～あ。こんなこと、一生喋るつもりなかったのになぁ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「でも、もういいよね？　だって私たち、ここで仲良く揃って死んじゃうみたいだし」
line = "「でも、もういいよね？　だって私たち、ここで仲良く揃って死んじゃうみたいだし」"

[[dialogue]]
speaker = "メルエル"
# 「ううん！　まだだよ。ナターシャちゃんも私も、絶対に無事で、生きて戻るんだから！！」
line = "「ううん！　まだだよ。ナターシャちゃんも私も、絶対に無事で、生きて戻るんだから！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「だからさ……メルエルのそういうところが、嫌いだって言ってるんだけど？」
line = "「だからさ……メルエルのそういうところが、嫌いだって言ってるんだけど？」"

[[dialogue]]
speaker = "unk"
# ──人々は、お前の献身を忘れた。
line = "──人々は、お前の献身を忘れた。"

[[dialogue]]
speaker = "unk"
# ──２０００年前のお前は、自らが守った者たちに、滅ぼされた。
line = "──２０００年前のお前は、自らが守った者たちに、滅ぼされた。"

[[dialogue]]
speaker = "unk"
# ──我が身可愛さのあまり、恩を仇で返す。ヒトは不完全な生き物だ。
line = "──我が身可愛さのあまり、恩を仇で返す。ヒトは不完全な生き物だ。"

[[dialogue]]
speaker = "unk"
# ──不完全を、完全なものへ近づける。
line = "──不完全を、完全なものへ近づける。"

[[dialogue]]
speaker = "unk"
# ──そのためにこそ、滅びからの再創生は必要なのだ。
line = "──そのためにこそ、滅びからの再創生は必要なのだ。"

[[dialogue]]
speaker = "ナターシャ"
# 「マジでうるさいね、これ。ずっと聞こえてる……これを何とかしないと、私たちも消えちゃうよ」
line = "「マジでうるさいね、これ。ずっと聞こえてる……これを何とかしないと、私たちも消えちゃうよ」"

[[dialogue]]
speaker = "メルエル"
# 「……うん。でも、さっきと今じゃ、状況が違うから」
line = "「……うん。でも、さっきと今じゃ、状況が違うから」"

[[dialogue]]
speaker = "メルエル"
# 「１人だけじゃ、とても耐えきれなかった。自我を塗りつぶされて、立ち上がる余裕もなかったけど……今は違うよ」
line = "「１人だけじゃ、とても耐えきれなかった。自我を塗りつぶされて、立ち上がる余裕もなかったけど……今は違うよ」"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃんが、手をつないでくれてる──だから、これを起動することができる！」
line = "「ナターシャちゃんが、手をつないでくれてる──だから、これを起動することができる！」"

[[dialogue]]
speaker = "unk"
# メルエルが取り出したのは、先日緋宮クロトも触れた『アルケインカオスクエーサー』の刻まれた宝玉。
line = "メルエルが取り出したのは、先日緋宮クロトも触れた『アルケインカオスクエーサー』の刻まれた宝玉。"

[[dialogue]]
speaker = "メルエル"
# 「ご先祖様の過去も、私たちの前世も。太陽の壁画の真相も、全てを知ることができた……」
line = "「ご先祖様の過去も、私たちの前世も。太陽の壁画の真相も、全てを知ることができた……」"

[[dialogue]]
speaker = "メルエル"
# 「過去の過ちは繰り返さない。きっと跳ねのけてみせる──だからナターシャちゃん」
line = "「過去の過ちは繰り返さない。きっと跳ねのけてみせる──だからナターシャちゃん」"

[[dialogue]]
speaker = "メルエル"
# 「アルケインコードを唱える私を……支えてくれる？」
line = "「アルケインコードを唱える私を……支えてくれる？」"

[[dialogue]]
speaker = "ナターシャ"
# 「…………仕方ないね。ま、前世からのよしみってことで」
line = "「…………仕方ないね。ま、前世からのよしみってことで」"

[[dialogue]]
speaker = "unk"
# ナターシャは、メルエルの持つ宝玉にその手を重ねた。
line = "ナターシャは、メルエルの持つ宝玉にその手を重ねた。"

[[dialogue]]
speaker = "メルエル"
# 「ありがとう、ナターシャちゃん。いくよ──」
line = "「ありがとう、ナターシャちゃん。いくよ──」"

[[dialogue]]
speaker = "ナターシャ"
# （リクリエの瘴気……本当に不愉快だから。とっとと出てってよ）
line = "（リクリエの瘴気……本当に不愉快だから。とっとと出てってよ）"

[[dialogue]]
speaker = "ナターシャ"
# （私のメルエルに──これ以上、入ってくるな！！！）
line = "（私のメルエルに──これ以上、入ってくるな！！！）"

[[dialogue]]
speaker = "メルエル"
# 「アルケイン──カオスクエーサー！！」
line = "「アルケイン──カオスクエーサー！！」"
