[[dialogue]]
speaker = "unk"
# 第３話,君は君のままで,P
line = "第３話,君は君のままで,P"

[[dialogue]]
speaker = "ヒマワリ"
# 「会長さんは今期のアニメ、何観てますか？　たまには違ったジャンルも観てみようと思ってるんですけど」
line = "「会長さんは今期のアニメ、何観てますか？　たまには違ったジャンルも観てみようと思ってるんですけど」"

[[dialogue]]
speaker = "ヒマワリ"
# 「また詰みプラモ増えちゃったんですよね。会長さん、今度一緒に作りましょう♪」
line = "「また詰みプラモ増えちゃったんですよね。会長さん、今度一緒に作りましょう♪」"

[[dialogue]]
speaker = "ヒマワリ"
# 「そうだ、週末アキバ行きましょ！　音ゲーがアニメとコラボしてるんですよー！　１回叩いておきたいんで！　会長さんとやりたいこといっぱいだー！」
line = "「そうだ、週末アキバ行きましょ！　音ゲーがアニメとコラボしてるんですよー！　１回叩いておきたいんで！　会長さんとやりたいこといっぱいだー！」"

[[dialogue]]
speaker = "女学生"
# 「あっ、ヒマワリ。会長さんとランチデート？」
line = "「あっ、ヒマワリ。会長さんとランチデート？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「へへー、いいでしょー」
line = "「へへー、いいでしょー」"

[[dialogue]]
speaker = "unk"
# 友達？
line = "友達？"

[[dialogue]]
speaker = "ヒマワリ"
# 「はい！　会長さんとお付き合いしてるのはフルオープンなんで！　別に隠さなくてもいいかなって！」
line = "「はい！　会長さんとお付き合いしてるのはフルオープンなんで！　別に隠さなくてもいいかなって！」"

[[dialogue]]
speaker = "女学生"
# 「楽しんでるとこ邪魔してごめんだけど、午後イチは移動教室だよー。そろそろ準備しないと」
line = "「楽しんでるとこ邪魔してごめんだけど、午後イチは移動教室だよー。そろそろ準備しないと」"

[[dialogue]]
speaker = "ヒマワリ"
# 「そうだった！　じゃ、会長さん、また後でー！」
line = "「そうだった！　じゃ、会長さん、また後でー！」"

[[dialogue]]
speaker = "unk"
# 気兼ねなく、学園内でヒマワリと２人で過ごす時間も増えていった。
line = "気兼ねなく、学園内でヒマワリと２人で過ごす時間も増えていった。"

[[dialogue]]
speaker = "unk"
# オープンにデートを重ねていた、とある日。
line = "オープンにデートを重ねていた、とある日。"

[[dialogue]]
speaker = "ヒマワリ"
# 「あいたたた……うぅ、ポカしちゃったなー」
line = "「あいたたた……うぅ、ポカしちゃったなー」"

[[dialogue]]
speaker = "unk"
# ヒマワリが怪我したって！？
line = "ヒマワリが怪我したって！？"

[[dialogue]]
speaker = "unk"
# ヒマワリがゴールデングースでの任務中、不注意で怪我を負ってしまったと聞き、事務所に駆け付けた。
line = "ヒマワリがゴールデングースでの任務中、不注意で怪我を負ってしまったと聞き、事務所に駆け付けた。"

[[dialogue]]
speaker = "セナリィ"
# 「申し訳ありません、会長様。ヒマワリに手傷を負わせてしまいましたわ」
line = "「申し訳ありません、会長様。ヒマワリに手傷を負わせてしまいましたわ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「社長が謝らないでください！　あたしの不注意だったんで」
line = "「社長が謝らないでください！　あたしの不注意だったんで」"

[[dialogue]]
speaker = "セナリィ"
# 「確かに注意力散漫な部分が見受けられましたわ。ヒマワリ、会長様に伝えたいことがあるのではなくて？」
line = "「確かに注意力散漫な部分が見受けられましたわ。ヒマワリ、会長様に伝えたいことがあるのではなくて？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「はい……」
line = "「はい……」"

[[dialogue]]
speaker = "unk"
# なんでも話してくれ
line = "なんでも話してくれ"

[[dialogue]]
speaker = "unk"
# そうなのか？
line = "そうなのか？"

[[dialogue]]
speaker = "セナリィ"
# 「では、私は席を外しますわね」
line = "「では、私は席を外しますわね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「うーーーーん……」
line = "「うーーーーん……」"

[[dialogue]]
speaker = "unk"
# 珍しく考えごと？
line = "珍しく考えごと？"

[[dialogue]]
speaker = "unk"
# どうした、ヒマワリ？
line = "どうした、ヒマワリ？"

[[dialogue]]
speaker = "ヒマワリ"
# 「会長さん……あたしたちってカップルですよね？　恋人同士ですよね！？　パートナーですよね！？　伴侶ですよね！？」
line = "「会長さん……あたしたちってカップルですよね？　恋人同士ですよね！？　パートナーですよね！？　伴侶ですよね！？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あたしと会長さん、こんなに仲良くって、よくふたりきりでもいるのに……」
line = "「あたしと会長さん、こんなに仲良くって、よくふたりきりでもいるのに……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「クラスの子たちにちっとも付き合っている風に見えないって……仲の良い兄妹みたいって言われたんです」
line = "「クラスの子たちにちっとも付き合っている風に見えないって……仲の良い兄妹みたいって言われたんです」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あたしは会長さんが大好きです。お話しするの楽しいし、一緒にいるだけで幸せだし、それでいいと思ってたんですけど……」
line = "「あたしは会長さんが大好きです。お話しするの楽しいし、一緒にいるだけで幸せだし、それでいいと思ってたんですけど……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「これだけじゃダメなんですかね……？　もっと、恋人っぽい感じにした方がいいんでしょうか？」
line = "「これだけじゃダメなんですかね……？　もっと、恋人っぽい感じにした方がいいんでしょうか？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「それよりも、デート先もアキバばっかりだし、アニメとゲームとホビーの話ばかりだし……」
line = "「それよりも、デート先もアキバばっかりだし、アニメとゲームとホビーの話ばかりだし……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あたしが振り回してばっかりのお付き合いで、会長さんは満足してないんじゃないかって……」
line = "「あたしが振り回してばっかりのお付き合いで、会長さんは満足してないんじゃないかって……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「会長さんは無理してあたしに合わせてくれてるのかなって……本当はもっと大人っぽいデートをしたいのかなって……」
line = "「会長さんは無理してあたしに合わせてくれてるのかなって……本当はもっと大人っぽいデートをしたいのかなって……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「いろいろ考えてたら、頭ん中、グルグルしちゃって……夜も眠れなくなっちゃって……セナリィ社長とミウにも心配されちゃいました」
line = "「いろいろ考えてたら、頭ん中、グルグルしちゃって……夜も眠れなくなっちゃって……セナリィ社長とミウにも心配されちゃいました」"

[[dialogue]]
speaker = "unk"
# 君にはいつもの君のままでいてほしい
line = "君にはいつもの君のままでいてほしい"

[[dialogue]]
speaker = "unk"
# 周りのことなんて気にしないで
line = "周りのことなんて気にしないで"

[[dialogue]]
speaker = "ヒマワリ"
# 「本当に、本当ですか……？」
line = "「本当に、本当ですか……？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「オシャレなデートスポットより、アキバショッピングの方が好きな女ですよ……？」
line = "「オシャレなデートスポットより、アキバショッピングの方が好きな女ですよ……？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ブランド品なんかより、スペシャルグレードのプラモで喜んじゃう女ですよ……？」
line = "「ブランド品なんかより、スペシャルグレードのプラモで喜んじゃう女ですよ……？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ちんちくりんだし……ううん、いつかはスラッとしてナイスバディでカッコいい女性になりますけど！」
line = "「ちんちくりんだし……ううん、いつかはスラッとしてナイスバディでカッコいい女性になりますけど！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「今のままで、本当にいいんですね？　大好きな会長さんの言うことだから信じちゃいますよ？」
line = "「今のままで、本当にいいんですね？　大好きな会長さんの言うことだから信じちゃいますよ？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あはっ……ありがとうございます。会長さんの口から聞けたら、元気出てきました！」
line = "「あはっ……ありがとうございます。会長さんの口から聞けたら、元気出てきました！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「よーし、こんな怪我、すぐに治して現場復帰するぞー！」
line = "「よーし、こんな怪我、すぐに治して現場復帰するぞー！」"

[[dialogue]]
speaker = "unk"
# やっぱり、まっすぐで元気なヒマワリが一番可愛い。
line = "やっぱり、まっすぐで元気なヒマワリが一番可愛い。"

[[dialogue]]
speaker = "セナリィ"
# 「まったく、何に悩んでいるのかと思えば……」
line = "「まったく、何に悩んでいるのかと思えば……」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃん、基本的にオープンなのに、会長さんのことになると抱え込みがちですよね」
line = "「ヒマワリちゃん、基本的にオープンなのに、会長さんのことになると抱え込みがちですよね」"

[[dialogue]]
speaker = "セナリィ"
# 「あの２人、この上なくお似合いですのに、何を気にしているのやら。恋する乙女は複雑ですわね」
line = "「あの２人、この上なくお似合いですのに、何を気にしているのやら。恋する乙女は複雑ですわね」"

[[dialogue]]
speaker = "セナリィ"
# 「もうしばらく、ふたりきりにしておきましょうか。あの空気の間に入るのは、甘すぎて胃もたれしてしまいそうですわ」
line = "「もうしばらく、ふたりきりにしておきましょうか。あの空気の間に入るのは、甘すぎて胃もたれしてしまいそうですわ」"
