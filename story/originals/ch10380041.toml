[[dialogue]]
speaker = "unk"
# 第１話,新たなる剣,P
line = "第１話,新たなる剣,P"

[[dialogue]]
speaker = "unk"
# 魔将になった件の一部始終を、イクシーから聞かせてもらった。
line = "魔将になった件の一部始終を、イクシーから聞かせてもらった。"

[[dialogue]]
speaker = "イクシリオン"
# 「あんなに可愛らしい方なのに、小さな体に見合わない強欲さには感服しました」
line = "「あんなに可愛らしい方なのに、小さな体に見合わない強欲さには感服しました」"

[[dialogue]]
speaker = "イクシリオン"
# 「そして、人目を気にして本性を解き放てない自分を顧みた時、気付いたのです」
line = "「そして、人目を気にして本性を解き放てない自分を顧みた時、気付いたのです」"

[[dialogue]]
speaker = "イクシリオン"
# 「この流れなら、エッチなこと大好きって明かしちゃってもいいのでは……明かしちゃいたい、明かしちゃえ、と！」
line = "「この流れなら、エッチなこと大好きって明かしちゃってもいいのでは……明かしちゃいたい、明かしちゃえ、と！」"

[[dialogue]]
speaker = "unk"
# 明かしちゃったかぁ……
line = "明かしちゃったかぁ……"

[[dialogue]]
speaker = "unk"
# イクシーの本性は俺含め、ごく一部しか知らない（はず）。基本的には品行方正な優等生で通っている。
line = "イクシーの本性は俺含め、ごく一部しか知らない（はず）。基本的には品行方正な優等生で通っている。"

[[dialogue]]
speaker = "イクシリオン"
# 「ともあれ私は色欲の魔本に認められ、魔将として覚醒できたのです。私だけでは辿りつけなかった境地でした」
line = "「ともあれ私は色欲の魔本に認められ、魔将として覚醒できたのです。私だけでは辿りつけなかった境地でした」"

[[dialogue]]
speaker = "イクシリオン"
# 「ああ……あの時の、全身に電流が迸るような、炎が血管を流れるような感覚……思い出しただけでうっとりしてしまいますぅ～<emoji=heart04>」
line = "「ああ……あの時の、全身に電流が迸るような、炎が血管を流れるような感覚……思い出しただけでうっとりしてしまいますぅ～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 恍惚としながら体をくねらせるイクシー。イクシーらしいけど目に毒だ。
line = "恍惚としながら体をくねらせるイクシー。イクシーらしいけど目に毒だ。"

[[dialogue]]
speaker = "unk"
# 感想を一言で表現すると？
line = "感想を一言で表現すると？"

[[dialogue]]
speaker = "イクシリオン"
# 「気持ちよかったです！　とても！！」
line = "「気持ちよかったです！　とても！！」"

[[dialogue]]
speaker = "イクシリオン"
# 「煩悩まみれの自分をさらけ出して、蔑みの視線を受けた時、お腹の奥がきゅんとして……<emoji=heart04>　こんな興奮もあるんだって目覚めてしまいそうでしたぁ……<emoji=heart04>」
line = "「煩悩まみれの自分をさらけ出して、蔑みの視線を受けた時、お腹の奥がきゅんとして……<emoji=heart04>　こんな興奮もあるんだって目覚めてしまいそうでしたぁ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# すでに目覚めているとは思うけど、もはや言うまい。これがイクシーだ。
line = "すでに目覚めているとは思うけど、もはや言うまい。これがイクシーだ。"

[[dialogue]]
speaker = "イクシリオン"
# 「ですが、シャルレーヌさんやリィベルさん、魔将のみなさんに私の本性が知れ渡ってしまいました。望み通りのこととはいえ、恥ずかしくって……私、もうお嫁にいけません」
line = "「ですが、シャルレーヌさんやリィベルさん、魔将のみなさんに私の本性が知れ渡ってしまいました。望み通りのこととはいえ、恥ずかしくって……私、もうお嫁にいけません」"

[[dialogue]]
speaker = "unk"
# 大丈夫、俺がいるから
line = "大丈夫、俺がいるから"

[[dialogue]]
speaker = "イクシリオン"
# 「会長……」
line = "「会長……」"

[[dialogue]]
speaker = "イクシリオン"
# 「こんな、こんな……むっつりドスケベでもいいんですか？」
line = "「こんな、こんな……むっつりドスケベでもいいんですか？」"

[[dialogue]]
speaker = "unk"
# そんなイクシーも大好きだ
line = "そんなイクシーも大好きだ"

[[dialogue]]
speaker = "イクシリオン"
# 「はわわっ！　ありがとうございます！　私も会長が大好きです～！」
line = "「はわわっ！　ありがとうございます！　私も会長が大好きです～！」"

[[dialogue]]
speaker = "unk"
# エッチなことに興味津々なのもイクシーの一面だ。むしろその一面があるからこそ、イクシーは可愛いと思う。
line = "エッチなことに興味津々なのもイクシーの一面だ。むしろその一面があるからこそ、イクシーは可愛いと思う。"

[[dialogue]]
speaker = "イクシリオン"
# 「大好きな会長にお願いがあります」
line = "「大好きな会長にお願いがあります」"

[[dialogue]]
speaker = "イクシリオン"
# 「星騎士の力は破滅を退け、世界を守るためのものです。扱いの上達を喜ぶことはあっても、力を振るうことそのものを楽しむことはありませんでした」
line = "「星騎士の力は破滅を退け、世界を守るためのものです。扱いの上達を喜ぶことはあっても、力を振るうことそのものを楽しむことはありませんでした」"

[[dialogue]]
speaker = "イクシリオン"
# 「ですが魔将の力は違います。魔将の力は私の心身を昂らせ、直接的に快楽を与えるのです。ただでさえ強力な力ですから、暴走しないように自分を律しないといけません」
line = "「ですが魔将の力は違います。魔将の力は私の心身を昂らせ、直接的に快楽を与えるのです。ただでさえ強力な力ですから、暴走しないように自分を律しないといけません」"

[[dialogue]]
speaker = "イクシリオン"
# 「会長には、時間がある時に訓練に付き合っていただきたいのです。快楽の力を、正しく使うことができるように」
line = "「会長には、時間がある時に訓練に付き合っていただきたいのです。快楽の力を、正しく使うことができるように」"

[[dialogue]]
speaker = "unk"
# もちろん。いくらでも付き合うよ
line = "もちろん。いくらでも付き合うよ"

[[dialogue]]
speaker = "イクシリオン"
# 「ありがとうございます。会長にそう言っていただけたら百人力です」
line = "「ありがとうございます。会長にそう言っていただけたら百人力です」"

[[dialogue]]
speaker = "unk"
# イクシーは人を守ることにもエッチにも真面目だ。やっぱり星騎士としてのイクシーはどこに出しても恥ずかしくないと思う。
line = "イクシーは人を守ることにもエッチにも真面目だ。やっぱり星騎士としてのイクシーはどこに出しても恥ずかしくないと思う。"

[[dialogue]]
speaker = "イクシリオン"
# 「──！　モンスターです！　会長、行きましょう！」
line = "「──！　モンスターです！　会長、行きましょう！」"

[[dialogue]]
speaker = "イクシリオン"
# 「機械型モンスター……こんな市街地に現れるとは。速攻で仕留めます！　会長は一般の方の保護をお願いします！」
line = "「機械型モンスター……こんな市街地に現れるとは。速攻で仕留めます！　会長は一般の方の保護をお願いします！」"

[[dialogue]]
speaker = "イクシリオン"
# 「魔本よ、私に力を！」
line = "「魔本よ、私に力を！」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「はあぁ<emoji=heart04>　『色欲』の魔将イクシリオン、参ります！」
line = "「はあぁ<emoji=heart04>　『色欲』の魔将イクシリオン、参ります！」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「ラストクレイモア！」
line = "「ラストクレイモア！」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「やった？　──いえ」
line = "「やった？　──いえ」"

[[dialogue]]
speaker = "モンスター"
# 「グラァアア！」
line = "「グラァアア！」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「不届きな輩はまだいるようですね」
line = "「不届きな輩はまだいるようですね」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「どれだけいようと全て切り伏せるのみです。魔将の力なら──それができます！」
line = "「どれだけいようと全て切り伏せるのみです。魔将の力なら──それができます！」"

[[dialogue]]
speaker = "unk"
# イクシリオンの下腹部で文様が妖しく輝く。有機的な、まるで生物の器官のような模様が鼓動するように明滅する。
line = "イクシリオンの下腹部で文様が妖しく輝く。有機的な、まるで生物の器官のような模様が鼓動するように明滅する。"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「星力と魔力が、あっ、交わって……はぁ、はぁ……あっ、んんっ！」
line = "「星力と魔力が、あっ、交わって……はぁ、はぁ……あっ、んんっ！」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「あぁ、感じます……私のお腹の奥で、大きな力が生まれるのを……あ、はぁっ……<emoji=heart04>」
line = "「あぁ、感じます……私のお腹の奥で、大きな力が生まれるのを……あ、はぁっ……<emoji=heart04>」"

[[dialogue]]
speaker = "モンスター"
# 「グオォッ！！」
line = "「グオォッ！！」"

[[dialogue]]
speaker = "unk"
# モンスターが吐いた爆炎がイクシリオンに迫るが──
line = "モンスターが吐いた爆炎がイクシリオンに迫るが──"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「ふふふ……<emoji=heart04>　メガリビドーディヴァイダー！」
line = "「ふふふ……<emoji=heart04>　メガリビドーディヴァイダー！」"

[[dialogue]]
speaker = "unk"
# 禍々しい呪いを帯びた大剣が爆炎ごと全て切り裂いた。斬撃の波動が雲を散らし、一面の青空をもたらす。
line = "禍々しい呪いを帯びた大剣が爆炎ごと全て切り裂いた。斬撃の波動が雲を散らし、一面の青空をもたらす。"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「会長、見ていただけましたか？　私の新しい剣を」
line = "「会長、見ていただけましたか？　私の新しい剣を」"

[[dialogue]]
speaker = "unk"
# かっこよかった！
line = "かっこよかった！"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「ふふっ、ありがとうございますっ」
line = "「ふふっ、ありがとうございますっ」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「あの、ところで…………このフォームに変身すると、身体が熱くなってしまって……汗を流したいんですけど、今から会長のお宅にお邪魔してもよろしいでしょうか？」
line = "「あの、ところで…………このフォームに変身すると、身体が熱くなってしまって……汗を流したいんですけど、今から会長のお宅にお邪魔してもよろしいでしょうか？」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「……え？　今日はお母様はご不在？」
line = "「……え？　今日はお母様はご不在？」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「じゃあ、早く……私、もう我慢できませんっ<emoji=heart04>」
line = "「じゃあ、早く……私、もう我慢できませんっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 事後処理は駆け付けた美化委員に任せ、俺たちは足早に帰路に就いたのだった。
line = "事後処理は駆け付けた美化委員に任せ、俺たちは足早に帰路に就いたのだった。"
