[[dialogue]]
speaker = "unk"
# 第１話,光の魔女の落とし方,P
line = "第１話,光の魔女の落とし方,P"

[[dialogue]]
speaker = "unk"
# 現代に再誕した、先代・光の魔女のトリュファイナさん。
line = "現代に再誕した、先代・光の魔女のトリュファイナさん。"

[[dialogue]]
speaker = "unk"
# これは、彼女と俺がまだ交際を始める前の話だ──
line = "これは、彼女と俺がまだ交際を始める前の話だ──"

[[dialogue]]
speaker = "unk"
# トリュファイナさんに告白しようと思う
line = "トリュファイナさんに告白しようと思う"

[[dialogue]]
speaker = "アナ"
# 「なんと……！」
line = "「なんと……！」"

[[dialogue]]
speaker = "マトイ"
# 「とうとう覚悟を決めたんだね、会長！　応援してるよ！」
line = "「とうとう覚悟を決めたんだね、会長！　応援してるよ！」"

[[dialogue]]
speaker = "unk"
# でも悩んでることがあって……
line = "でも悩んでることがあって……"

[[dialogue]]
speaker = "unk"
# ２人とも、ありがとう！
line = "２人とも、ありがとう！"

[[dialogue]]
speaker = "アナ"
# 「ふむ……？　永き時を生きる、魔女の中でもとびきり格の高い『光の魔女様』に、どのようにアプローチすれば良いのかわからない、と」
line = "「ふむ……？　永き時を生きる、魔女の中でもとびきり格の高い『光の魔女様』に、どのようにアプローチすれば良いのかわからない、と」"

[[dialogue]]
speaker = "マトイ"
# 「確かに私たちとは生きてきた時代も違うし、ずっと年上の魔女さんだけれど……」
line = "「確かに私たちとは生きてきた時代も違うし、ずっと年上の魔女さんだけれど……」"

[[dialogue]]
speaker = "unk"
# アイデアが欲しい！
line = "アイデアが欲しい！"

[[dialogue]]
speaker = "unk"
# 絶対に失敗したくないんだ
line = "絶対に失敗したくないんだ"

[[dialogue]]
speaker = "アナ"
# 「特に奇をてらった作戦などいらないと思いますが。傍目から見て、光の魔女様は会長にぞっこんに見えます」
line = "「特に奇をてらった作戦などいらないと思いますが。傍目から見て、光の魔女様は会長にぞっこんに見えます」"

[[dialogue]]
speaker = "マトイ"
# 「うん。会長が告白したら、二つ返事でＯＫしてくれそうだよね……」
line = "「うん。会長が告白したら、二つ返事でＯＫしてくれそうだよね……」"

[[dialogue]]
speaker = "アナ"
# 「しかしオーダーは把握しました。トリュファイナさんが告白をＯＫしたくなるようなアプローチのアイデアを出せばいいのですね」
line = "「しかしオーダーは把握しました。トリュファイナさんが告白をＯＫしたくなるようなアプローチのアイデアを出せばいいのですね」"

[[dialogue]]
speaker = "アナ"
# 「んー。やはり王道がよいのでは？　放課後に校舎裏に呼び出して、愚直に『あいらぶゆー』とアタックです」
line = "「んー。やはり王道がよいのでは？　放課後に校舎裏に呼び出して、愚直に『あいらぶゆー』とアタックです」"

[[dialogue]]
speaker = "マトイ"
# 「別のパターンだったら……ラブレターとか！　形に残るものだったら、喜んでくれるかも！」
line = "「別のパターンだったら……ラブレターとか！　形に残るものだったら、喜んでくれるかも！」"

[[dialogue]]
speaker = "unk"
# ２人とも、楽しそうだなあ……
line = "２人とも、楽しそうだなあ……"

[[dialogue]]
speaker = "アナ"
# 「楽しいですね。会長のコイバナですよ？」
line = "「楽しいですね。会長のコイバナですよ？」"

[[dialogue]]
speaker = "マトイ"
# 「うん！　すっごく楽しい！　でも悩むなあ、どんなアプローチがいいかなぁ……！」
line = "「うん！　すっごく楽しい！　でも悩むなあ、どんなアプローチがいいかなぁ……！」"

[[dialogue]]
speaker = "シュティレ"
# 「──盛り上がっておりますね、先輩方」
line = "「──盛り上がっておりますね、先輩方」"

[[dialogue]]
speaker = "マトイ"
# 「あ、あなたは──『閃光』のシュティレちゃん！？」
line = "「あ、あなたは──『閃光』のシュティレちゃん！？」"

[[dialogue]]
speaker = "シュティレ"
# 「はい。『閃光』のシュティレです。話は聞かせていただきましたよ」
line = "「はい。『閃光』のシュティレです。話は聞かせていただきましたよ」"

[[dialogue]]
speaker = "シュティレ"
# 「僭越ながら、トリュファイナさんへのアプローチでアイデアがございます。シュティレは光の魔女様とズッ友の間柄ですので。ぶい」
line = "「僭越ながら、トリュファイナさんへのアプローチでアイデアがございます。シュティレは光の魔女様とズッ友の間柄ですので。ぶい」"

[[dialogue]]
speaker = "アナ"
# 「おお。購買部で一緒に過ごすことが多いですものね。会長、貴重な意見が貰えそうですよ」
line = "「おお。購買部で一緒に過ごすことが多いですものね。会長、貴重な意見が貰えそうですよ」"

[[dialogue]]
speaker = "シュティレ"
# 「これは先日の話です。購買部の休憩時間に、シュティレのタブレットで、トリュファイナさんと漫画を読んでおりました──」
line = "「これは先日の話です。購買部の休憩時間に、シュティレのタブレットで、トリュファイナさんと漫画を読んでおりました──」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ほぇえ～……これが現代の『少女漫画』というものなのですねっ。勉強になりますっ……！」
line = "「ほぇえ～……これが現代の『少女漫画』というものなのですねっ。勉強になりますっ……！」"

[[dialogue]]
speaker = "シュティレ"
# 「はい。クラスメイトからオススメされて購入したのですが、なかなかどうして読ませますね」
line = "「はい。クラスメイトからオススメされて購入したのですが、なかなかどうして読ませますね」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ふふ。シュティレ様は、ロボットの出てくる漫画ばかり読んでいらっしゃいますものね」
line = "「ふふ。シュティレ様は、ロボットの出てくる漫画ばかり読んでいらっしゃいますものね」"

[[dialogue]]
speaker = "シュティレ"
# 「ええ。ギガンドムのコミカライズは余さずチェックしていますが、少女漫画は新鮮です」
line = "「ええ。ギガンドムのコミカライズは余さずチェックしていますが、少女漫画は新鮮です」"

[[dialogue]]
speaker = "シュティレ"
# 「あ──とうとうイケメン君が、ヒロインに告白するみたいですね。少女漫画の山場と言えましょう」
line = "「あ──とうとうイケメン君が、ヒロインに告白するみたいですね。少女漫画の山場と言えましょう」"

[[dialogue]]
speaker = "トリュファイナ"
# 「……ほ、ほぇっ！？　この情熱的なアプローチはいったい！？」
line = "「……ほ、ほぇっ！？　この情熱的なアプローチはいったい！？」"

[[dialogue]]
speaker = "シュティレ"
# 「壁ドンというやつですね。主に俺様系の男子が、内気な女子に向かって行う、逃げ場を封じる告白シチュエーションです」
line = "「壁ドンというやつですね。主に俺様系の男子が、内気な女子に向かって行う、逃げ場を封じる告白シチュエーションです」"

[[dialogue]]
speaker = "トリュファイナ"
# 「か、壁ドン……！？　こ、ここ、こんな距離で逃げ場をなくされて、意中の殿方から見つめられては、ひとたまりも……！！」
line = "「か、壁ドン……！？　こ、ここ、こんな距離で逃げ場をなくされて、意中の殿方から見つめられては、ひとたまりも……！！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「し、しかも──『俺の女になれ』！？　ひゃぁ！？　顎をクイって持ち上げて──そんな、口づけまで！？　ほぇぇえ～……！」
line = "「し、しかも──『俺の女になれ』！？　ひゃぁ！？　顎をクイって持ち上げて──そんな、口づけまで！？　ほぇぇえ～……！」"

[[dialogue]]
speaker = "シュティレ"
# 「現代の恋愛アプローチは多様です。いかがですか、トリュファイナさん」
line = "「現代の恋愛アプローチは多様です。いかがですか、トリュファイナさん」"

[[dialogue]]
speaker = "トリュファイナ"
# 「３０００年前には、このような文化はありませんでした……壁ドン……す、少しっ……憧れてしまうかも、しれません……」
line = "「３０００年前には、このような文化はありませんでした……壁ドン……す、少しっ……憧れてしまうかも、しれません……」"

[[dialogue]]
speaker = "シュティレ"
# 「──以上です。ご清聴ありがとうございました。ぶい」
line = "「──以上です。ご清聴ありがとうございました。ぶい」"

[[dialogue]]
speaker = "アナ"
# 「これは強力な情報ですね。会長、壁ドンでいきましょう」
line = "「これは強力な情報ですね。会長、壁ドンでいきましょう」"

[[dialogue]]
speaker = "マトイ"
# 「やるしかないよ会長！　善は急げ！　今日の放課後、早速決行しよう！！」
line = "「やるしかないよ会長！　善は急げ！　今日の放課後、早速決行しよう！！」"

[[dialogue]]
speaker = "unk"
# えぇええぇえぇえぇ！？！？！？
line = "えぇええぇえぇえぇ！？！？！？"

[[dialogue]]
speaker = "unk"
# みんなに背中を押された勢いで、俺はトリュファイナさんを空き教室に呼びだした──
line = "みんなに背中を押された勢いで、俺はトリュファイナさんを空き教室に呼びだした──"

[[dialogue]]
speaker = "トリュファイナ"
# 「ま、魔王様。お待たせいたしました。私に何かご用事があると……」
line = "「ま、魔王様。お待たせいたしました。私に何かご用事があると……」"

[[dialogue]]
speaker = "トリュファイナ"
# （放課後の空き教室……な、なんだかドキドキしてしまいますっ……！　先日読んだ少女漫画と、まったく同じ状況……！）
line = "（放課後の空き教室……な、なんだかドキドキしてしまいますっ……！　先日読んだ少女漫画と、まったく同じ状況……！）"

[[dialogue]]
speaker = "トリュファイナ"
# （い、いけませんいけませんっ。魔王様はとても真面目なお顔をしていらっしゃいます。浮ついた気持ちは封じなければ……！）
line = "（い、いけませんいけませんっ。魔王様はとても真面目なお顔をしていらっしゃいます。浮ついた気持ちは封じなければ……！）"

[[dialogue]]
speaker = "トリュファイナ"
# 「それで魔王様。お話とは、いったい──」
line = "「それで魔王様。お話とは、いったい──」"

[[dialogue]]
speaker = "unk"
# 俺はトリュファイナさんを壁際に追い詰めた──壁ドンである。
line = "俺はトリュファイナさんを壁際に追い詰めた──壁ドンである。"

[[dialogue]]
speaker = "トリュファイナ"
# 「──ほぇっ！？」
line = "「──ほぇっ！？」"

[[dialogue]]
speaker = "unk"
# ……トリュファイナ
line = "……トリュファイナ"

[[dialogue]]
speaker = "トリュファイナ"
# 「は、はいぃっ！？」
line = "「は、はいぃっ！？」"

[[dialogue]]
speaker = "unk"
# ……俺の女になれ
line = "……俺の女になれ"

[[dialogue]]
speaker = "トリュファイナ"
# 「ほぇえぇぇぇえぇえ～～～～～っ！？！？！？」
line = "「ほぇえぇぇぇえぇえ～～～～～っ！？！？！？」"

[[dialogue]]
speaker = "トリュファイナ"
# （こ、告白っ！？　私、告白されています！？！？　しかも壁ドン！！　あの壁ドンです～っ！？！？）
line = "（こ、告白っ！？　私、告白されています！？！？　しかも壁ドン！！　あの壁ドンです～っ！？！？）"

[[dialogue]]
speaker = "unk"
# 返事、聞かせろよ？
line = "返事、聞かせろよ？"

[[dialogue]]
speaker = "トリュファイナ"
# 「ぁ……あの！　あのあのっ……そのぉっ……！！」
line = "「ぁ……あの！　あのあのっ……そのぉっ……！！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「つ、謹んで……お、お受け、いたします……<emoji=heart04>」
line = "「つ、謹んで……お、お受け、いたします……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# （成功したあぁぁぁぁッッッ！？！？）
line = "（成功したあぁぁぁぁッッッ！？！？）"

[[dialogue]]
speaker = "トリュファイナ"
# （こ、この後は……顎クイがあって、それでそれで……！）
line = "（こ、この後は……顎クイがあって、それでそれで……！）"

[[dialogue]]
speaker = "トリュファイナ"
# 「じ……じぃ～…………<emoji=heart04>」
line = "「じ……じぃ～…………<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# （顎クイとキスを待ってる────！？！？）
line = "（顎クイとキスを待ってる────！？！？）"

[[dialogue]]
speaker = "トリュファイナ"
# （あ、あれれ？　見つめてキスをおねだりしたの、間違っていたでしょうか……！？　はしたないって、思われたでしょうか！？）
line = "（あ、あれれ？　見つめてキスをおねだりしたの、間違っていたでしょうか……！？　はしたないって、思われたでしょうか！？）"

[[dialogue]]
speaker = "unk"
# トリュファイナさん、ジッとして
line = "トリュファイナさん、ジッとして"

[[dialogue]]
speaker = "unk"
# （最後まで、しっかりやらなきゃ……！）
line = "（最後まで、しっかりやらなきゃ……！）"

[[dialogue]]
speaker = "トリュファイナ"
# 「あ……魔王様──<emoji=heart04>」
line = "「あ……魔王様──<emoji=heart04>」"

[[dialogue]]
speaker = "トリュファイナ"
# 「んぅ────ちゅっ<emoji=heart04>」
line = "「んぅ────ちゅっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# トリュファイナさんの顎をそっと持ち上げて、俺はキスをした。
line = "トリュファイナさんの顎をそっと持ち上げて、俺はキスをした。"

[[dialogue]]
speaker = "unk"
# こうして俺とトリュファイナさんは、恋人同士になったのだった──
line = "こうして俺とトリュファイナさんは、恋人同士になったのだった──"

[[dialogue]]
speaker = "アナ"
# 「……わーぉ」
line = "「……わーぉ」"

[[dialogue]]
speaker = "マトイ"
# 「心配でついてきたけどっ……みみみ、見ちゃいけないものまで見ちゃったかも！？」
line = "「心配でついてきたけどっ……みみみ、見ちゃいけないものまで見ちゃったかも！？」"

[[dialogue]]
speaker = "シュティレ"
# 「そうですね。無粋なギャラリーはクールに去るとしましょう」
line = "「そうですね。無粋なギャラリーはクールに去るとしましょう」"

[[dialogue]]
speaker = "シュティレ"
# 「……よかったですね。トリュファイナさん」
line = "「……よかったですね。トリュファイナさん」"
