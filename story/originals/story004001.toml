[[dialogue]]
speaker = "unk"
# その日、俺はアニマ先輩と共に、夜の流星市国をパトロールしていた。
line = "その日、俺はアニマ先輩と共に、夜の流星市国をパトロールしていた。"

[[dialogue]]
speaker = "アニマ"
# 「悪いネ会長。『ロストレーダー』の有効範囲はあまり広くなイ。今夜はたっぷり歩かせることになりそうだヨ」
line = "「悪いネ会長。『ロストレーダー』の有効範囲はあまり広くなイ。今夜はたっぷり歩かせることになりそうだヨ」"

[[dialogue]]
speaker = "unk"
# 問題ありません。付き合いますよ
line = "問題ありません。付き合いますよ"

[[dialogue]]
speaker = "アニマ"
# 「そう言ってくれるならありがたイ！　フヒヒ、それじゃあのんびり夜の散歩を楽しむとしようカ？」
line = "「そう言ってくれるならありがたイ！　フヒヒ、それじゃあのんびり夜の散歩を楽しむとしようカ？」"

[[dialogue]]
speaker = "unk"
# 通常、モンスターの探知には、流星市国と両学園が共同開発したアラートシステムが用いられる。
line = "通常、モンスターの探知には、流星市国と両学園が共同開発したアラートシステムが用いられる。"

[[dialogue]]
speaker = "unk"
# しかし俺とアニマ先輩が探している相手は、普通のモンスターではない──
line = "しかし俺とアニマ先輩が探している相手は、普通のモンスターではない──"

[[dialogue]]
speaker = "unk"
# 探しているのは……自我を持って行動する、悪意のあるロストアイテム。
line = "探しているのは……自我を持って行動する、悪意のあるロストアイテム。"

[[dialogue]]
speaker = "unk"
# 例のアステラカジノで、『欲望』のダッチを取り逃してから、しばらくの月日が流れてしまった。
line = "例のアステラカジノで、『欲望』のダッチを取り逃してから、しばらくの月日が流れてしまった。"

[[dialogue]]
speaker = "unk"
# 創造神『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』がいなくなり、リクリエの活動が沈静化に向かい始めた今、自我を持ったロストアイテムへの対策は<ruby=きっきん>喫緊</ruby>の課題と言えた──
line = "創造神『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』がいなくなり、リクリエの活動が沈静化に向かい始めた今、自我を持ったロストアイテムへの対策は<ruby>喫緊<rt>きっきん</rt></ruby>の課題と言えた──"

[[dialogue]]
speaker = "アニマ"
# 「会長から例の変態紳士の情報を聞いた時は驚いたヨ」
line = "「会長から例の変態紳士の情報を聞いた時は驚いたヨ」"

[[dialogue]]
speaker = "アニマ"
# 「抱いた欲望を具現化し、周囲を意のままに操る力なド、滅茶苦茶にもほどがあル！」
line = "「抱いた欲望を具現化し、周囲を意のままに操る力なド、滅茶苦茶にもほどがあル！」"

[[dialogue]]
speaker = "unk"
# ええ。野放しにするわけにはいきません
line = "ええ。野放しにするわけにはいきません"

[[dialogue]]
speaker = "アニマ"
# 「うム。そのために開発したのが、この『ロストレーダー』ダ！」
line = "「うム。そのために開発したのが、この『ロストレーダー』ダ！」"

[[dialogue]]
speaker = "アニマ"
# 「潜水艦のソナーのようニ、周囲で発生するマイナスエネルギーの波動を検知できる仕組みダ。期待してくれたまエ？」
line = "「潜水艦のソナーのようニ、周囲で発生するマイナスエネルギーの波動を検知できる仕組みダ。期待してくれたまエ？」"

[[dialogue]]
speaker = "アニマ"
# 「……それにしても会長。今回の件、いつになく張り切っているネ？」
line = "「……それにしても会長。今回の件、いつになく張り切っているネ？」"

[[dialogue]]
speaker = "unk"
# ダッチは俺を狙っていますからね
line = "ダッチは俺を狙っていますからね"

[[dialogue]]
speaker = "アニマ"
# 「惜しいことをしたヨ。なんでも九浄家のカジノで、会長のとんでもない格好がお披露目されて大混乱だったそうじゃないカ♪」
line = "「惜しいことをしたヨ。なんでも九浄家のカジノで、会長のとんでもない格好がお披露目されて大混乱だったそうじゃないカ♪」"

[[dialogue]]
speaker = "unk"
# その件は緘口令を敷いていたはず！？
line = "その件は緘口令を敷いていたはず！？"

[[dialogue]]
speaker = "アニマ"
# 「ヒトの口に戸は立てられないヨ、フヒヒヒ♪　まあ気にしなくてもいいだろウ、よくあることダ♪」
line = "「ヒトの口に戸は立てられないヨ、フヒヒヒ♪　まあ気にしなくてもいいだろウ、よくあることダ♪」"

[[dialogue]]
speaker = "アニマ"
# 「そうダ、今夜の調査が終わったら、また新薬の実験に付き合ってくれるかナ？」
line = "「そうダ、今夜の調査が終わったら、また新薬の実験に付き合ってくれるかナ？」"

[[dialogue]]
speaker = "unk"
# もしかしてダッチを討伐しても意味がない？
line = "もしかしてダッチを討伐しても意味がない？"

[[dialogue]]
speaker = "unk"
# また女の子になるんですか、俺……
line = "また女の子になるんですか、俺……"

[[dialogue]]
speaker = "アニマ"
# 「まぁまァ、どんな副作用が出るかはお楽しミ──ムム！？」
line = "「まぁまァ、どんな副作用が出るかはお楽しミ──ムム！？」"

[[dialogue]]
speaker = "アニマ"
# 「レーダーが反応したゾ！　この近くに、ロストアイテムがいル！！」
line = "「レーダーが反応したゾ！　この近くに、ロストアイテムがいル！！」"

[[dialogue]]
speaker = "unk"
# ダッチ──今日こそケリをつけてやる！！
line = "ダッチ──今日こそケリをつけてやる！！"

[[dialogue]]
speaker = "アニマ（覚醒）"
# 「来るゾ会長、前方からダ……！」
line = "「来るゾ会長、前方からダ……！」"

[[dialogue]]
speaker = "unk"
# 前回の騒動での辱めは忘れていない。何としても今夜、ヤツを倒す。
line = "前回の騒動での辱めは忘れていない。何としても今夜、ヤツを倒す。"

[[dialogue]]
speaker = "unk"
# そう思っていたのに──
line = "そう思っていたのに──"

[[dialogue]]
speaker = "？？？"
# 「……もう見ていられないの」
line = "「……もう見ていられないの」"

[[dialogue]]
speaker = "unk"
# 俺たちの前に現れたのは──ダッチでは、なかった。
line = "俺たちの前に現れたのは──ダッチでは、なかった。"

[[dialogue]]
speaker = "？？？"
# 「だから……助けに来たの♪」
line = "「だから……助けに来たの♪」"

[[dialogue]]
speaker = "？？？"
# 「シスの────お兄ちゃん<emoji=heart04>」
line = "「シスの────お兄ちゃん<emoji=heart04>」"
