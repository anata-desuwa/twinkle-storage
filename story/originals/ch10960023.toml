[[dialogue]]
speaker = "unk"
# 第３話,波に踊る強者たち,P
line = "第３話,波に踊る強者たち,P"

[[dialogue]]
speaker = "リーリア"
# 「アナちゃん、ルルカちゃん、そっち行ったよ！」
line = "「アナちゃん、ルルカちゃん、そっち行ったよ！」"

[[dialogue]]
speaker = "アナ"
# 「らじゃー。攻撃開始」
line = "「らじゃー。攻撃開始」"

[[dialogue]]
speaker = "ルルカ"
# 「よーし、挟み撃ち～！　逃がさないよ！」
line = "「よーし、挟み撃ち～！　逃がさないよ！」"

[[dialogue]]
speaker = "レイラ"
# 「あばばばばば！　たくさん食べると胸が大きくなるって言っただけなのになんで狙われてるんですか私！？」
line = "「あばばばばば！　たくさん食べると胸が大きくなるって言っただけなのになんで狙われてるんですか私！？」"

[[dialogue]]
speaker = "unk"
# レイラが水鉄砲で集中砲火されているかと思えば──
line = "レイラが水鉄砲で集中砲火されているかと思えば──"

[[dialogue]]
speaker = "キサナ"
# 「おっ、流星の会長サマじゃねえか。アタシと遊んでくれや」
line = "「おっ、流星の会長サマじゃねえか。アタシと遊んでくれや」"

[[dialogue]]
speaker = "フィオナ"
# 「ええ、受けて立ちます。コラプサーの方と戦うのは初めてですね。よろしくお願いします」
line = "「ええ、受けて立ちます。コラプサーの方と戦うのは初めてですね。よろしくお願いします」"

[[dialogue]]
speaker = "unk"
# 意外な組み合わせの対決もあった。そこかしこで水着の星騎士たちが戦いを繰り広げている。
line = "意外な組み合わせの対決もあった。そこかしこで水着の星騎士たちが戦いを繰り広げている。"

[[dialogue]]
speaker = "unk"
# イングリットの次の相手は──
line = "イングリットの次の相手は──"

[[dialogue]]
speaker = "ヴィーナス"
# 「見つけたわよ、イングリット！」
line = "「見つけたわよ、イングリット！」"

[[dialogue]]
speaker = "イングリット"
# 「待ちわびたぞ、ヴィーナス！」
line = "「待ちわびたぞ、ヴィーナス！」"

[[dialogue]]
speaker = "unk"
# 昔からの友人みたいに楽しそうで、この前初めて話したとは思えない。
line = "昔からの友人みたいに楽しそうで、この前初めて話したとは思えない。"

[[dialogue]]
speaker = "イングリット"
# 「感謝しよう。貴様のおかげで夏の最強を決めるにふさわしい舞台が整った」
line = "「感謝しよう。貴様のおかげで夏の最強を決めるにふさわしい舞台が整った」"

[[dialogue]]
speaker = "ヴィーナス"
# 「お礼を言うのはこっちだわ。あなたが夏の最強なんて言い出さなければ、この大会はなかったんだし」
line = "「お礼を言うのはこっちだわ。あなたが夏の最強なんて言い出さなければ、この大会はなかったんだし」"

[[dialogue]]
speaker = "ヴィーナス"
# 「じゃあ、始めましょう！」
line = "「じゃあ、始めましょう！」"

[[dialogue]]
speaker = "イングリット"
# 「夏の最強を決める戦いを！」
line = "「夏の最強を決める戦いを！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「まずは足を止めるわよ、フィクサーチェーン！」
line = "「まずは足を止めるわよ、フィクサーチェーン！」"

[[dialogue]]
speaker = "イングリット"
# 「なんの、ブレイドクロスシザー！」
line = "「なんの、ブレイドクロスシザー！」"

[[dialogue]]
speaker = "unk"
# 四方から伸びる鎖。イングリットは剣を交差させ、力ずくで切り裂いていく。
line = "四方から伸びる鎖。イングリットは剣を交差させ、力ずくで切り裂いていく。"

[[dialogue]]
speaker = "ヴィーナス"
# 「やるわね、これならどうかしら？　サマーモーニンスター！」
line = "「やるわね、これならどうかしら？　サマーモーニンスター！」"

[[dialogue]]
speaker = "イングリット"
# 「ぬぅっ！」
line = "「ぬぅっ！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「さらに、もう一発！」
line = "「さらに、もう一発！」"

[[dialogue]]
speaker = "イングリット"
# 「ぐはあぁっ！」
line = "「ぐはあぁっ！」"

[[dialogue]]
speaker = "unk"
# ヴィーナスのビームを受け、イングリットが水面に叩きつけられた。
line = "ヴィーナスのビームを受け、イングリットが水面に叩きつけられた。"

[[dialogue]]
speaker = "イングリット"
# 「ククク。強いな、ヴィーナス。いいぞ、私はお前のような強者を求めていた！」
line = "「ククク。強いな、ヴィーナス。いいぞ、私はお前のような強者を求めていた！」"

[[dialogue]]
speaker = "イングリット"
# 「体が燃えるように熱い！　私の魂が、肉体が、戦うことを悦んでいる！」
line = "「体が燃えるように熱い！　私の魂が、肉体が、戦うことを悦んでいる！」"

[[dialogue]]
speaker = "unk"
# まるで酒にでも酔ったかのようだ。イングリットの恍惚が見ているこちらにまで伝わってくる。
line = "まるで酒にでも酔ったかのようだ。イングリットの恍惚が見ているこちらにまで伝わってくる。"

[[dialogue]]
speaker = "ヴィーナス"
# 「あなた、本当に戦うのが好きなのね」
line = "「あなた、本当に戦うのが好きなのね」"

[[dialogue]]
speaker = "イングリット"
# 「当然だ。私はそのために生まれ、生きてきた。武を極めるためにこそ、この命はある」
line = "「当然だ。私はそのために生まれ、生きてきた。武を極めるためにこそ、この命はある」"

[[dialogue]]
speaker = "イングリット"
# 「だがな。私とて、いつまでも戦士でいられるとは限らない。戦いで命を落とすか、病で戦えぬ体となるか、老いて戦えなくなるか」
line = "「だがな。私とて、いつまでも戦士でいられるとは限らない。戦いで命を落とすか、病で戦えぬ体となるか、老いて戦えなくなるか」"

[[dialogue]]
speaker = "イングリット"
# 「あるいは、戦いそのものがなくなるかだ。ならば、今、目の前にある戦いに全霊を懸け、全身を捧げる。それが生きるということだ！」
line = "「あるいは、戦いそのものがなくなるかだ。ならば、今、目の前にある戦いに全霊を懸け、全身を捧げる。それが生きるということだ！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「すごいわあなた！　ただ戦うのが好きなだけだと思ってたけど……本当に、本当に、そうなのね！」
line = "「すごいわあなた！　ただ戦うのが好きなだけだと思ってたけど……本当に、本当に、そうなのね！」"

[[dialogue]]
speaker = "イングリット"
# 「そうとも。それが、イングリットという戦士。私という魂だ！」
line = "「そうとも。それが、イングリットという戦士。私という魂だ！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ふふ、ふふふ！　私もね、心がかーっと燃えてるわ。今、すごくあなたに勝ちたい！」
line = "「ふふ、ふふふ！　私もね、心がかーっと燃えてるわ。今、すごくあなたに勝ちたい！」"

[[dialogue]]
speaker = "イングリット"
# 「私もだ、ヴィーナス！　貴様は私が倒す！」
line = "「私もだ、ヴィーナス！　貴様は私が倒す！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「次の一撃、全力でいくわ！」
line = "「次の一撃、全力でいくわ！」"

[[dialogue]]
speaker = "イングリット"
# 「ああ、来い！」
line = "「ああ、来い！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「はあぁぁ……必殺奥義！　コスモブレイクカリバー！！」
line = "「はあぁぁ……必殺奥義！　コスモブレイクカリバー！！」"

[[dialogue]]
speaker = "unk"
# さながら巨大な光の槍のような、極太のビームが迫る。
line = "さながら巨大な光の槍のような、極太のビームが迫る。"

[[dialogue]]
speaker = "イングリット"
# 「クハハハ！　敵に不足なし！　その光、斬る！」
line = "「クハハハ！　敵に不足なし！　その光、斬る！」"

[[dialogue]]
speaker = "イングリット"
# 「──ザンブレイクセイバーッ！！」
line = "「──ザンブレイクセイバーッ！！」"

[[dialogue]]
speaker = "unk"
# 星力で編まれた大剣がビームを迎え撃つ。一瞬、拮抗しているように見えたが──
line = "星力で編まれた大剣がビームを迎え撃つ。一瞬、拮抗しているように見えたが──"

[[dialogue]]
speaker = "ヴィーナス"
# 「行っけー！」
line = "「行っけー！」"

[[dialogue]]
speaker = "unk"
# 星力の出力はヴィーナスの方が上だ。コラプサーの星力吸収もほとんど機能していない以上、勝敗は決しただろう。
line = "星力の出力はヴィーナスの方が上だ。コラプサーの星力吸収もほとんど機能していない以上、勝敗は決しただろう。"

[[dialogue]]
speaker = "イングリット"
# 「クク、クハハハハ！　これだ、これこそ私の欲していたものだ！」
line = "「クク、クハハハハ！　これだ、これこそ私の欲していたものだ！」"

[[dialogue]]
speaker = "unk"
# だが、イングリットの眼に諦めの色はない。むしろ嬉々として輝く。
line = "だが、イングリットの眼に諦めの色はない。むしろ嬉々として輝く。"

[[dialogue]]
speaker = "イングリット"
# 「はああああぁっ！！」
line = "「はああああぁっ！！」"

[[dialogue]]
speaker = "unk"
# 刹那、大剣が形を変え、細く薄い１本の刀となった。
line = "刹那、大剣が形を変え、細く薄い１本の刀となった。"

[[dialogue]]
speaker = "unk"
# 星力はより濃く、鋭く研ぎ澄まされ、光の槍を切り裂く。
line = "星力はより濃く、鋭く研ぎ澄まされ、光の槍を切り裂く。"

[[dialogue]]
speaker = "ヴィーナス"
# 「きゃあっ！？」
line = "「きゃあっ！？」"

[[dialogue]]
speaker = "イングリット"
# 「隙は見逃さんっ！！」
line = "「隙は見逃さんっ！！」"

[[dialogue]]
speaker = "unk"
# 執念の一撃がヴィーナスの不意を突き、イングリットが肉薄する。
line = "執念の一撃がヴィーナスの不意を突き、イングリットが肉薄する。"

[[dialogue]]
speaker = "unk"
# そして距離を取らせないまま執拗に攻め続け、とうとう押し勝った。イングリットの粘り勝ちだ。
line = "そして距離を取らせないまま執拗に攻め続け、とうとう押し勝った。イングリットの粘り勝ちだ。"

[[dialogue]]
speaker = "ヴィーナス"
# 「私の、負けね……」
line = "「私の、負けね……」"

[[dialogue]]
speaker = "イングリット"
# 「改めて感謝しよう、強き者よ。貴様のおかげで私はより強くなった」
line = "「改めて感謝しよう、強き者よ。貴様のおかげで私はより強くなった」"

[[dialogue]]
speaker = "unk"
# 予想を超える熱い戦いに、俺も自然と拳を強く握っていた──
line = "予想を超える熱い戦いに、俺も自然と拳を強く握っていた──"
