line = "──誰に？"

[[dialogue]]
speaker = "unk"
# 何もかもが、わからない。理解が出来ない。唐突すぎる。
line = "何もかもが、わからない。理解が出来ない。唐突すぎる。"

[[dialogue]]
speaker = "unk"
# どうして。どうしてどうして。どうしてどうしてどうして────
line = "どうして。どうしてどうして。どうしてどうしてどうして────"

[[dialogue]]
speaker = "unk"
# ────────。
line = "────────。"

[[dialogue]]
speaker = "クロト"
# （…………え？）
line = "（…………え？）"

[[dialogue]]
speaker = "unk"
# 衣擦れよりも小さい、今にも掻き消えてしまいそうな、誰かの声。
line = "衣擦れよりも小さい、今にも掻き消えてしまいそうな、誰かの声。"

[[dialogue]]
speaker = "unk"
# そして────
line = "そして────"

[[dialogue]]
speaker = "unk"
