[[dialogue]]
speaker = "unk"
# ──戻、
line = "──戻、"

[[dialogue]]
speaker = "？？？"
# 「すー…………すー…………」
line = "「すー…………すー…………」"

[[dialogue]]
speaker = "クロト"
# 「────！？！？」
line = "「────！？！？」"

[[dialogue]]
speaker = "unk"
# まぶしい朝陽が、目に沁みる。
line = "まぶしい朝陽が、目に沁みる。"

[[dialogue]]
speaker = "unk"
# ここは魔界の、キュリオス。滞在する間は好きに使えと、煌嶺によって手配された俺の寝室──
line = "ここは魔界の、キュリオス。滞在する間は好きに使えと、煌嶺によって手配された俺の寝室──"

[[dialogue]]
speaker = "クロト"
# 「なん……で？」
line = "「なん……で？」"

[[dialogue]]
speaker = "unk"
# 黒灯市場で何者かに襲われたのは、夜だった。
line = "黒灯市場で何者かに襲われたのは、夜だった。"

[[dialogue]]
speaker = "unk"
# そして俺の命を奪ったあの傷も、痛みも──何もない。
line = "そして俺の命を奪ったあの傷も、痛みも──何もない。"

[[dialogue]]
speaker = "クロト"
# 「夢……？　そんな、馬鹿な……」
line = "「夢……？　そんな、馬鹿な……」"

[[dialogue]]
speaker = "unk"
# 夢なわけがない。あんなにもリアルな夢があって、たまるか。
line = "夢なわけがない。あんなにもリアルな夢があって、たまるか。"

[[dialogue]]
speaker = "unk"
# そして何より、俺は──
line = "そして何より、俺は──"

[[dialogue]]
speaker = "unk"
# この光景を、この少女を──俺は<b>知っている</b>。
line = "この光景を、この少女を──俺は<b>知っている</b>。"

[[dialogue]]
speaker = "unk"
# 初めて出会ったはずなのに、この子の名前を、知っている……！
line = "初めて出会ったはずなのに、この子の名前を、知っている……！"

[[dialogue]]
speaker = "クロト"
# 「君、は……」
line = "「君、は……」"

[[dialogue]]
speaker = "？？？"
# 「…………ん、ぅ……？」
line = "「…………ん、ぅ……？」"

[[dialogue]]
speaker = "クロト"
# 「君はいったい……何者、なんだ……？」
line = "「君はいったい……何者、なんだ……？」"

[[dialogue]]
speaker = "？？？"
# 「…………はぁ。忘れたのですか、ご主人」
line = "「…………はぁ。忘れたのですか、ご主人」"

[[dialogue]]
speaker = "？？？"
# 「自己紹介──これで<b>２回目</b>。３回目は、させないでください」
line = "「自己紹介──これで<b>２回目</b>。３回目は、させないでください」"

[[dialogue]]
speaker = "unk"
# この子の名前は……
line = "この子の名前は……"

[[dialogue]]
speaker = "unk"
# ──ルーシィ。
line = "──ルーシィ。"

[[dialogue]]
speaker = "ルーシィ"
