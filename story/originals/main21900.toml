line = "──血。"

[[dialogue]]
speaker = "クロト"
# （なん、で────！？）
line = "（なん、で────！？）"

[[dialogue]]
speaker = "？？？"
# 「『神殺し』の魔王が相手。警戒していましたが──」
line = "「『神殺し』の魔王が相手。警戒していましたが──」"

[[dialogue]]
speaker = "クロト"
# 「…………ッ！？」
line = "「…………ッ！？」"

[[dialogue]]
speaker = "unk"
# 冷たい少女の声音が、背後から──
line = "冷たい少女の声音が、背後から──"

[[dialogue]]
speaker = "？？？"
# 「大したことなかったですね。隙だらけでした」
line = "「大したことなかったですね。隙だらけでした」"

[[dialogue]]
speaker = "unk"
# 指一本動かせない。誰に、俺は、襲われて──？
line = "指一本動かせない。誰に、俺は、襲われて──？"

[[dialogue]]
speaker = "クロト"
# 「──ぁ、ぅっ────」
line = "「──ぁ、ぅっ────」"

[[dialogue]]
speaker = "unk"
# 意識が……どんどん…………
line = "意識が……どんどん…………"

[[dialogue]]
speaker = "unk"
# 遠──のい────て──────
line = "遠──のい────て──────"

[[dialogue]]
speaker = "？？？"
# 「…………魔王・緋宮クロトの死亡を確認」
line = "「…………魔王・緋宮クロトの死亡を確認」"

[[dialogue]]
speaker = "？？？"
# 「これでこの宇宙は──安泰です」
line = "「これでこの宇宙は──安泰です」"

[[dialogue]]
speaker = "unk"
# ………………
line = "………………"

[[dialogue]]
speaker = "unk"
# …………
line = "…………"

[[dialogue]]
speaker = "unk"
# ……
line = "……"

[[dialogue]]
speaker = "unk"
