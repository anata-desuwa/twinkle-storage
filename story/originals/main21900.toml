[[dialogue]]
speaker = "unk"
# 終焉世界ベガにて、創造神『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』を討ち滅ぼした。
line = "終焉世界ベガにて、創造神『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』を討ち滅ぼした。"

[[dialogue]]
speaker = "unk"
# そしてアルタイル・デネブの星騎士たちが一同に集う祝勝会も終わり、しばらく経ったある日……
line = "そしてアルタイル・デネブの星騎士たちが一同に集う祝勝会も終わり、しばらく経ったある日……"

[[dialogue]]
speaker = "unk"
# 新星学園の理事でもある煌嶺が、星徒会室を訪ねてきた。
line = "新星学園の理事でもある煌嶺が、星徒会室を訪ねてきた。"

[[dialogue]]
speaker = "クロト"
# 「……今年から、修学旅行を復活させる？」
line = "「……今年から、修学旅行を復活させる？」"

[[dialogue]]
speaker = "煌嶺"
# 「うん♪　『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』もいなくなって、リクリエの危機は去ったでしょ？」
line = "「うん♪　『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』もいなくなって、リクリエの危機は去ったでしょ？」"

[[dialogue]]
speaker = "煌嶺"
# 「シノさんやヘレナさんから聞いたよ～？　ここ数年、新星学園は修学旅行をやってなかったって♪」
line = "「シノさんやヘレナさんから聞いたよ～？　ここ数年、新星学園は修学旅行をやってなかったって♪」"

[[dialogue]]
speaker = "クロト"
# 「えっと……そうなのか、みんな？」
line = "「えっと……そうなのか、みんな？」"

[[dialogue]]
speaker = "マトイ"
# 「そっか。思えば会長って、少し前に転入してきたんだったね」
line = "「そっか。思えば会長って、少し前に転入してきたんだったね」"

[[dialogue]]
speaker = "サーシャ"
# 「うふふ。転入してすぐ、ヴィーナスちゃんと御前試合をして……その後もずーっとバタバタしてたものね～」
line = "「うふふ。転入してすぐ、ヴィーナスちゃんと御前試合をして……その後もずーっとバタバタしてたものね～」"

[[dialogue]]
speaker = "アナ"
# 「使徒となったアポロさんに、魔神ギエルとの戦い。それからしばらくして、梨緒さんがアルタイルにやってきて……」
line = "「使徒となったアポロさんに、魔神ギエルとの戦い。それからしばらくして、梨緒さんがアルタイルにやってきて……」"

[[dialogue]]
speaker = "ヴィーナス"
# 「大忙しだったわね、クロト！」
line = "「大忙しだったわね、クロト！」"

[[dialogue]]
speaker = "サーシャ"
# 「会長くんが学園の行事に疎いのも仕方ないわね。煌嶺ちゃんの言う通りよ～」
line = "「会長くんが学園の行事に疎いのも仕方ないわね。煌嶺ちゃんの言う通りよ～」"

[[dialogue]]
speaker = "アナ"
# 「記録によると、新森羅歴２９９８年から、新星学園の修学旅行は見送りとなっていたようです」
line = "「記録によると、新森羅歴２９９８年から、新星学園の修学旅行は見送りとなっていたようです」"

[[dialogue]]
speaker = "アナ"
# 「これはやはり、リクリエの到来が近づいていたことが原因でしょうか？」
line = "「これはやはり、リクリエの到来が近づいていたことが原因でしょうか？」"

[[dialogue]]
speaker = "サーシャ"
# 「そうなのよ～。年を経るごとにアステラやモンスターの動きが活性化していたから。星騎士が流星市国を離れるわけにもいかなくって～」
line = "「そうなのよ～。年を経るごとにアステラやモンスターの動きが活性化していたから。星騎士が流星市国を離れるわけにもいかなくって～」"

[[dialogue]]
speaker = "サーシャ"
# 「私が星徒会長だった去年も見送りで、シルヴィががっかりしてたわ～」
line = "「私が星徒会長だった去年も見送りで、シルヴィががっかりしてたわ～」"

[[dialogue]]
speaker = "ヴィーナス"
# 「だったらちょうどいいじゃない！　修学旅行を復活させて、今年はパーッと盛り上げちゃいましょ♪」
line = "「だったらちょうどいいじゃない！　修学旅行を復活させて、今年はパーッと盛り上げちゃいましょ♪」"

[[dialogue]]
speaker = "unk"
# 俺たちは世界を救う役目を担う星騎士だが、同時に青春を謳歌する学生でもある。
line = "俺たちは世界を救う役目を担う星騎士だが、同時に青春を謳歌する学生でもある。"

[[dialogue]]
speaker = "unk"
# 『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』がいなくなり、アステラもモンスターも大幅にその出現が目減りした今、かつての行事を復活させるのはいい機会だ。
line = "『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』がいなくなり、アステラもモンスターも大幅にその出現が目減りした今、かつての行事を復活させるのはいい機会だ。"

[[dialogue]]
speaker = "サーシャ"
# 「新星学園の修学旅行は、その年の最後の大交流に合わせて行われるのよ、会長くん♪」
line = "「新星学園の修学旅行は、その年の最後の大交流に合わせて行われるのよ、会長くん♪」"

[[dialogue]]
speaker = "クロト"
# 「大交流……<ruby=ラーゴ・シエロ>鏡界の湖</ruby>を使うんですか？」
line = "「大交流……<ruby>鏡界の湖<rt>ラーゴ・シエロ</rt></ruby>を使うんですか？」"

[[dialogue]]
speaker = "サーシャ"
# 「ええ。人間界、天界、魔界……それらを繋ぐ<ruby=ラーゴ・シエロ>鏡界の湖</ruby>のゲートは、四半期ごとに開かれるでしょう？」
line = "「ええ。人間界、天界、魔界……それらを繋ぐ<ruby>鏡界の湖<rt>ラーゴ・シエロ</rt></ruby>のゲートは、四半期ごとに開かれるでしょう？」"

[[dialogue]]
speaker = "マトイ"
# 「大交流のゲートって、普段はすぐに閉じちゃうんだけどね。その年の最後の大交流だけは、特別なんだよ」
line = "「大交流のゲートって、普段はすぐに閉じちゃうんだけどね。その年の最後の大交流だけは、特別なんだよ」"

[[dialogue]]
speaker = "サーシャ"
# 「地脈の影響か、星々の巡りが関係しているか……詳細は不明なのだけれど。１年の最後に開かれるゲートは、２週間以上も開通するの♪」
line = "「地脈の影響か、星々の巡りが関係しているか……詳細は不明なのだけれど。１年の最後に開かれるゲートは、２週間以上も開通するの♪」"

[[dialogue]]
speaker = "クロト"
# 「そ、そんなに……！？」
line = "「そ、そんなに……！？」"

[[dialogue]]
speaker = "サーシャ"
# 「面白いでしょう？　その時期に合わせて、天界と魔界を訪問して異文化交流をするのが、星騎士の修学旅行。そう聞いているわ～♪」
line = "「面白いでしょう？　その時期に合わせて、天界と魔界を訪問して異文化交流をするのが、星騎士の修学旅行。そう聞いているわ～♪」"

[[dialogue]]
speaker = "アナ"
# 「おお。ＤＩＳＣで調べると、たくさん出てきますね。６年前──開校直後のデータですが……」
line = "「おお。ＤＩＳＣで調べると、たくさん出てきますね。６年前──開校直後のデータですが……」"

[[dialogue]]
speaker = "アナ"
# 「天界は聖庭園、私の故郷である学術都市ウル。ほかにも芸術都市イオルなどにも来訪したことがあるようです」
line = "「天界は聖庭園、私の故郷である学術都市ウル。ほかにも芸術都市イオルなどにも来訪したことがあるようです」"

[[dialogue]]
speaker = "サーシャ"
# 「魔界は広いから、たくさんの場所は巡れないの。<ruby=ラーゴ・シエロ>鏡界の湖</ruby>に近い、ズヴィエダ地方の都市がよく選ばれてたって聞いたかしら～」
line = "「魔界は広いから、たくさんの場所は巡れないの。<ruby>鏡界の湖<rt>ラーゴ・シエロ</rt></ruby>に近い、ズヴィエダ地方の都市がよく選ばれてたって聞いたかしら～」"

[[dialogue]]
speaker = "煌嶺"
# 「そうそう♪　で、行き先の決定は星徒会が行うってシノさんから聞いてね？　せっかくだから提案したいな～って♪」
line = "「そうそう♪　で、行き先の決定は星徒会が行うってシノさんから聞いてね？　せっかくだから提案したいな～って♪」"

[[dialogue]]
speaker = "煌嶺"
# 「ねぇ魔王さん。今年の修学旅行、魔界の行き先はキュリオスにしない？」
line = "「ねぇ魔王さん。今年の修学旅行、魔界の行き先はキュリオスにしない？」"

[[dialogue]]
speaker = "煌嶺"
# 「キュリオスはいいよ～？　魔界でも飛びぬけて発展してる都市だからね！　面白いものも、美味しい食べ物も盛りだくさん♪」
line = "「キュリオスはいいよ～？　魔界でも飛びぬけて発展してる都市だからね！　面白いものも、美味しい食べ物も盛りだくさん♪」"

[[dialogue]]
speaker = "煌嶺"
# 「おもてなしするから、おいでおいで♪　ねっ？」
line = "「おもてなしするから、おいでおいで♪　ねっ？」"

[[dialogue]]
speaker = "アナ"
# 「おもてなしと言いますが……たくさんの学生を招けば、それだけ経済が潤います。学園生にお金を落としてもらって大儲け、というのが本音では？」
line = "「おもてなしと言いますが……たくさんの学生を招けば、それだけ経済が潤います。学園生にお金を落としてもらって大儲け、というのが本音では？」"

[[dialogue]]
speaker = "煌嶺"
# 「アナちゃんってば鋭い！　それもあるよ～、もちろん♪」
line = "「アナちゃんってば鋭い！　それもあるよ～、もちろん♪」"

[[dialogue]]
speaker = "煌嶺"
# 「でも、交流したいって気持ちも本当だよ？　あとお国自慢もしたい！　私が治める魔界最大の都市だからね、<ruby=うち>キュリオス</ruby>は♪」
line = "「でも、交流したいって気持ちも本当だよ？　あとお国自慢もしたい！　私が治める魔界最大の都市だからね、<ruby>キュリオス<rt>うち</rt></ruby>は♪」"

[[dialogue]]
speaker = "煌嶺"
# 「それじゃあ検討よろしくね～♪　って言っても──」
line = "「それじゃあ検討よろしくね～♪　って言っても──」"

[[dialogue]]
speaker = "煌嶺"
# 「まさか私の『お誘い』を断るだなんて……カケラも思ってもないけどねっ♪」
line = "「まさか私の『お誘い』を断るだなんて……カケラも思ってもないけどねっ♪」"

[[dialogue]]
speaker = "フィオナ"
# 「なるほど……そんなことが」
line = "「なるほど……そんなことが」"

[[dialogue]]
speaker = "unk"
# 半ば脅しのような『お誘い』をした煌嶺が帰った後──俺はフィオナを呼び出して、事の顛末を伝えた。
line = "半ば脅しのような『お誘い』をした煌嶺が帰った後──俺はフィオナを呼び出して、事の顛末を伝えた。"

[[dialogue]]
speaker = "フィオナ"
# 「修学旅行を復活させよう、というのは私も賛成です。かつては流星学園も、新星学園と合同で修学旅行を執り行ったと聞いていますし」
line = "「修学旅行を復活させよう、というのは私も賛成です。かつては流星学園も、新星学園と合同で修学旅行を執り行ったと聞いていますし」"

[[dialogue]]
speaker = "フィオナ"
# 「しかし行き先にキュリオスを、というのは……少し不安がありますね……」
line = "「しかし行き先にキュリオスを、というのは……少し不安がありますね……」"

[[dialogue]]
speaker = "フィオナ"
# 「<ruby=たいはい>頽廃</ruby>都市キュリオスは、『煌嶺』の名を継ぐ女帝によって、永きに渡って統治されてきた都市です」
line = "「<ruby>頽廃<rt>たいはい</rt></ruby>都市キュリオスは、『煌嶺』の名を継ぐ女帝によって、永きに渡って統治されてきた都市です」"

[[dialogue]]
speaker = "フィオナ"
# 「『都市』と名前はついていますが、スケールとしては国をイメージしてください」
line = "「『都市』と名前はついていますが、スケールとしては国をイメージしてください」"

[[dialogue]]
speaker = "サーシャ"
# 「キュリオスがある魔界のジンルオ地方は、７つの都市国家が覇を競い合う地域なのよ。内紛や戦争も多くって～」
line = "「キュリオスがある魔界のジンルオ地方は、７つの都市国家が覇を競い合う地域なのよ。内紛や戦争も多くって～」"

[[dialogue]]
speaker = "フィオナ"
# 「ええ。ここ数年は、都市同士の武力が拮抗しているため、ある程度の治安は確保されているとは聞いていますが……」
line = "「ええ。ここ数年は、都市同士の武力が拮抗しているため、ある程度の治安は確保されているとは聞いていますが……」"

[[dialogue]]
speaker = "クロト"
# 「デネブでの決戦──『<ruby=スター・リユニオン>星の再会</ruby>』の時に助力に来てくれた星術使いも、その……濃いメンツばっかりだったしな」
line = "「デネブでの決戦──『<ruby>星の再会<rt>スター・リユニオン</rt></ruby>』の時に助力に来てくれた星術使いも、その……濃いメンツばっかりだったしな」"

[[dialogue]]
speaker = "フィオナ"
# 「はい。それにキュリオスは、魔界で随一の歓楽都市でもあります」
line = "「はい。それにキュリオスは、魔界で随一の歓楽都市でもあります」"

[[dialogue]]
speaker = "ヴィーナス"
# 「カンラク都市……沈んじゃってるの！？」
line = "「カンラク都市……沈んじゃってるの！？」"

[[dialogue]]
speaker = "マトイ"
# 「違うよヴィーナス、ええっとね……」
line = "「違うよヴィーナス、ええっとね……」"

[[dialogue]]
speaker = "アナ"
# 「少し調べただけでも、後ろ暗いところがたくさん出てきますね」
line = "「少し調べただけでも、後ろ暗いところがたくさん出てきますね」"

[[dialogue]]
speaker = "アナ"
# 「カジノに、賭け試合を行う闘技場に……盗品を売りさばくブラックマーケットもあるようです」
line = "「カジノに、賭け試合を行う闘技場に……盗品を売りさばくブラックマーケットもあるようです」"

[[dialogue]]
speaker = "アナ"
# 「魔界全土から合法非合法を問わず、あらゆるルートを通って、人材・金品・技術が流入する<ruby=るつぼ>坩堝</ruby>の都市……」
line = "「魔界全土から合法非合法を問わず、あらゆるルートを通って、人材・金品・技術が流入する<ruby>坩堝<rt>るつぼ</rt></ruby>の都市……」"

[[dialogue]]
speaker = "サーシャ"
# 「修学旅行の場所として適切かと言われると、疑問ね～」
line = "「修学旅行の場所として適切かと言われると、疑問ね～」"

[[dialogue]]
speaker = "マトイ"
# 「だけど、煌嶺さん直々の『お誘い』ですよ……？」
line = "「だけど、煌嶺さん直々の『お誘い』ですよ……？」"

[[dialogue]]
speaker = "アナ"
# 「ええ。提案を袖にしたら、後が大変そうです」
line = "「ええ。提案を袖にしたら、後が大変そうです」"

[[dialogue]]
speaker = "クロト"
# 「……よし。じゃあ、下見に行こう。俺がこの目で現地を視察して、適切かどうかを判断してくるよ」
line = "「……よし。じゃあ、下見に行こう。俺がこの目で現地を視察して、適切かどうかを判断してくるよ」"

[[dialogue]]
speaker = "クロト"
# 「もしも学園生のみんなに悪影響のある危険な都市なら、煌嶺には俺の方から断っておく」
line = "「もしも学園生のみんなに悪影響のある危険な都市なら、煌嶺には俺の方から断っておく」"

[[dialogue]]
speaker = "マトイ"
# 「うぅ。すごくシリアスな空気……！　旅行の行き先を決めるのって、もっと楽しい感じじゃないのかなぁ！？」
line = "「うぅ。すごくシリアスな空気……！　旅行の行き先を決めるのって、もっと楽しい感じじゃないのかなぁ！？」"

[[dialogue]]
speaker = "unk"
# もしも断るなら、<ruby=ローローハンテン>肉肉飯店</ruby>に負けないくらいの極上の手土産を持参して、何とか溜飲を下げてもらおう……
line = "もしも断るなら、<ruby>肉肉飯店<rt>ローローハンテン</rt></ruby>に負けないくらいの極上の手土産を持参して、何とか溜飲を下げてもらおう……"

[[dialogue]]
speaker = "ヴィーナス"
# 「修学旅行の下見、気合い入れていくわよ～！　みんなで早速、出発しましょう！」
line = "「修学旅行の下見、気合い入れていくわよ～！　みんなで早速、出発しましょう！」"

[[dialogue]]
speaker = "マトイ"
# 「待って待って！？　星徒会全員がいなくなっちゃうのはまずいよ！　普段の仕事だってあるんだから……！」
line = "「待って待って！？　星徒会全員がいなくなっちゃうのはまずいよ！　普段の仕事だってあるんだから……！」"

[[dialogue]]
speaker = "アナ"
# 「そうですね。下見は会長だけで十分でしょう。前会長、ステイ」
line = "「そうですね。下見は会長だけで十分でしょう。前会長、ステイ」"

[[dialogue]]
speaker = "ヴィーナス"
# 「え～っ！？　クロト１人じゃ心配だわ！？」
line = "「え～っ！？　クロト１人じゃ心配だわ！？」"

[[dialogue]]
speaker = "マトイ"
# 「ヴィーナスがそれを言う！？」
line = "「ヴィーナスがそれを言う！？」"

[[dialogue]]
speaker = "ニャリオン"
# 「ニャッニャッニャッ！　魔王を１人で向かわせるのが心配ニャら、ワガハイのような優秀な使い魔をつければいいのニャン！！」
line = "「ニャッニャッニャッ！　魔王を１人で向かわせるのが心配ニャら、ワガハイのような優秀な使い魔をつければいいのニャン！！」"

[[dialogue]]
speaker = "マトイ"
# 「あれ。いたんだ、ニャリオンさん」
line = "「あれ。いたんだ、ニャリオンさん」"

[[dialogue]]
speaker = "ニャリオン"
# 「あんまりニャ！？　ずっとフィオナ嬢のそばにいたニャ！！！」
line = "「あんまりニャ！？　ずっとフィオナ嬢のそばにいたニャ！！！」"

[[dialogue]]
speaker = "クロト"
# 「ニャリオン。俺の使い魔って、また急だな……」
line = "「ニャリオン。俺の使い魔って、また急だな……」"

[[dialogue]]
speaker = "ニャリオン"
# 「急じゃないニャ！　ワガハイ、ずっと思ってたニャン。緋宮クロトは魔王ニャのに、使い魔を使役していないのはいかがなものかニャと！」
line = "「急じゃないニャ！　ワガハイ、ずっと思ってたニャン。緋宮クロトは魔王ニャのに、使い魔を使役していないのはいかがなものかニャと！」"

[[dialogue]]
speaker = "ニャリオン"
# 「魔界の魔王が治める都市を訪ねるニャら、その土地の要人と会う機会も多いはずニャ。使い魔も使役していない魔王じゃ箔がつかないニャン！」
line = "「魔界の魔王が治める都市を訪ねるニャら、その土地の要人と会う機会も多いはずニャ。使い魔も使役していない魔王じゃ箔がつかないニャン！」"

[[dialogue]]
speaker = "クロト"
# 「そ、そういうものなのか……？」
line = "「そ、そういうものなのか……？」"

[[dialogue]]
speaker = "ニャリオン"
# 「そういうものニャン！！」
line = "「そういうものニャン！！」"

[[dialogue]]
speaker = "unk"
# 転入してから今日まで、戦いに次ぐ戦いの日々を送ってきた。
line = "転入してから今日まで、戦いに次ぐ戦いの日々を送ってきた。"

[[dialogue]]
speaker = "unk"
# フィオナのように使い魔を使役したいだなんて、そんなことを考える暇もなかったけれど──
line = "フィオナのように使い魔を使役したいだなんて、そんなことを考える暇もなかったけれど──"

[[dialogue]]
speaker = "クロト"
# 「フィオナ。ニャリオンは簡単そうに言うけれど、俺にもできるのかな？　使い魔の召喚って」
line = "「フィオナ。ニャリオンは簡単そうに言うけれど、俺にもできるのかな？　使い魔の召喚って」"

[[dialogue]]
speaker = "フィオナ"
# 「ええ、可能かと。魔王ラクシスはかつて、大賢者であったニャリオンを従えていたそうですから。素質という点で問題はないと思います」
line = "「ええ、可能かと。魔王ラクシスはかつて、大賢者であったニャリオンを従えていたそうですから。素質という点で問題はないと思います」"

[[dialogue]]
speaker = "ニャリオン"
# 「せっかくニャ！　フィオナ嬢、ワガハイの本を貸してあげたらどうニャ？」
line = "「せっかくニャ！　フィオナ嬢、ワガハイの本を貸してあげたらどうニャ？」"

[[dialogue]]
speaker = "フィオナ"
# 「うん、そうだね──」
line = "「うん、そうだね──」"

[[dialogue]]
speaker = "unk"
# フィオナは何もない空間に手を掲げ、一冊の本を取り出した──金色の装飾を施された魔導書だ。
line = "フィオナは何もない空間に手を掲げ、一冊の本を取り出した──金色の装飾を施された魔導書だ。"

[[dialogue]]
speaker = "マトイ"
# 「前にも見たことがありますね、それ。確かニャリオンさんをパワーアップする時に使っていた……」
line = "「前にも見たことがありますね、それ。確かニャリオンさんをパワーアップする時に使っていた……」"

[[dialogue]]
speaker = "フィオナ"
# 「ええ。己が従える、使い魔に関する秘術がたくさん記されているんです。もちろん呼び出す際の術式も載っていますよ」
line = "「ええ。己が従える、使い魔に関する秘術がたくさん記されているんです。もちろん呼び出す際の術式も載っていますよ」"

[[dialogue]]
speaker = "フィオナ"
# 「魔女のウェンディさんやアイリーンさんも使い魔を持っていますが……この本の術式は、彼女たち魔女が用いるものとは原理が根本から異なります」
line = "「魔女のウェンディさんやアイリーンさんも使い魔を持っていますが……この本の術式は、彼女たち魔女が用いるものとは原理が根本から異なります」"

[[dialogue]]
speaker = "unk"
# フィオナ曰く、通常の使い魔は『魂を通わせた生き物に対して術を施す』か、『星力や魔力によって疑似生命を生み出す』ものらしいが……
line = "フィオナ曰く、通常の使い魔は『魂を通わせた生き物に対して術を施す』か、『星力や魔力によって疑似生命を生み出す』ものらしいが……"

[[dialogue]]
speaker = "フィオナ"
# 「この魔導書は、今よりも過去の時代を生きていた『神獣』に対して、時を超えた主従の契約を依頼することができるものなんです」
line = "「この魔導書は、今よりも過去の時代を生きていた『神獣』に対して、時を超えた主従の契約を依頼することができるものなんです」"

[[dialogue]]
speaker = "マトイ"
# 「な、なんだかとんでもないことを言ってるような！？」
line = "「な、なんだかとんでもないことを言ってるような！？」"

[[dialogue]]
speaker = "フィオナ"
# 「あはは……そうですよね。この魔導書自体、ニャリオンによって私へもたらされたものなんです」
line = "「あはは……そうですよね。この魔導書自体、ニャリオンによって私へもたらされたものなんです」"

[[dialogue]]
speaker = "フィオナ"
# 「私とニャリオンの出会い自体は、本当に何気ない、初めての『召喚術』によって生まれた偶然の産物でした」
line = "「私とニャリオンの出会い自体は、本当に何気ない、初めての『召喚術』によって生まれた偶然の産物でした」"

[[dialogue]]
speaker = "ニャリオン"
# 「ニャニャ！　それだけ、フィオナ嬢の魔王としての素質がずば抜けていたということニャ！」
line = "「ニャニャ！　それだけ、フィオナ嬢の魔王としての素質がずば抜けていたということニャ！」"

[[dialogue]]
speaker = "unk"
# ニャリオンも３０００年前の俺──魔王ラクシスに仕えた大賢者だった。
line = "ニャリオンも３０００年前の俺──魔王ラクシスに仕えた大賢者だった。"

[[dialogue]]
speaker = "unk"
# かつてのフィヴォス流星群の折、魔界から人間界へと戻る時、フィーニスの塔の道中で、俺たちはそのことを知った。
line = "かつてのフィヴォス流星群の折、魔界から人間界へと戻る時、フィーニスの塔の道中で、俺たちはそのことを知った。"

[[dialogue]]
speaker = "unk"
# とは言っても、ニャリオンは３０００年前のことをほとんど覚えておらず、フィオナも当初は、魔導書の記載を眉唾だと思っていたらしい。
line = "とは言っても、ニャリオンは３０００年前のことをほとんど覚えておらず、フィオナも当初は、魔導書の記載を眉唾だと思っていたらしい。"

[[dialogue]]
speaker = "アナ"
# 「時を超えて行う、神獣への契約……凄まじいですね」
line = "「時を超えて行う、神獣への契約……凄まじいですね」"

[[dialogue]]
speaker = "フィオナ"
# 「ただ注意点もありまして。この術はあくまで、強い魂を持つ神獣に対して、話しかけることができるだけなんです」
line = "「ただ注意点もありまして。この術はあくまで、強い魂を持つ神獣に対して、話しかけることができるだけなんです」"

[[dialogue]]
speaker = "フィオナ"
# 「従者となった神獣は、その魂が主人と深く結ばれてしまうため、文字通り<ruby=いちれんたくしょう>一蓮托生</ruby>となります」
line = "「従者となった神獣は、その魂が主人と深く結ばれてしまうため、文字通り<ruby>一蓮托生<rt>いちれんたくしょう</rt></ruby>となります」"

[[dialogue]]
speaker = "フィオナ"
# 「そのため神獣の側が契約を了承しなくては、成立しません」
line = "「そのため神獣の側が契約を了承しなくては、成立しません」"

[[dialogue]]
speaker = "フィオナ"
# 「とてつもなく強い使い魔を呼び出す機会を得られますが、上手くいくかどうかは相手次第……というものでして」
line = "「とてつもなく強い使い魔を呼び出す機会を得られますが、上手くいくかどうかは相手次第……というものでして」"

[[dialogue]]
speaker = "ヴィーナス"
# 「それなら問題ないわね！　クロトは正真正銘の魔王だもの！！」
line = "「それなら問題ないわね！　クロトは正真正銘の魔王だもの！！」"

[[dialogue]]
speaker = "unk"
# 魔王である俺の、使い魔。
line = "魔王である俺の、使い魔。"

[[dialogue]]
speaker = "unk"
# 創造神との戦いは終わり、いま世界は平和そのもの。
line = "創造神との戦いは終わり、いま世界は平和そのもの。"

[[dialogue]]
speaker = "unk"
# 本来ならば、新たな力を求める必要もないのかもしれないが──
line = "本来ならば、新たな力を求める必要もないのかもしれないが──"

[[dialogue]]
speaker = "クロト"
# 「試してみてもいいかな、フィオナ？」
line = "「試してみてもいいかな、フィオナ？」"

[[dialogue]]
speaker = "フィオナ"
# 「ええ。もちろん」
line = "「ええ。もちろん」"

[[dialogue]]
speaker = "unk"
# 俺はフィオナに手ほどきされた通りに、詠唱を試みた。
line = "俺はフィオナに手ほどきされた通りに、詠唱を試みた。"

[[dialogue]]
speaker = "unk"
# 星力を魔導書に込めると、複雑な術式が足元に展開され──
line = "星力を魔導書に込めると、複雑な術式が足元に展開され──"

[[dialogue]]
speaker = "unk"
# 掲げた掌にも、温かな光と熱が集中し始めた──
line = "掲げた掌にも、温かな光と熱が集中し始めた──"

[[dialogue]]
speaker = "unk"
# 俺は魔王──緋宮クロト。
line = "俺は魔王──緋宮クロト。"

[[dialogue]]
speaker = "unk"
# この声を聴く、古き時代の神獣よ──
line = "この声を聴く、古き時代の神獣よ──"

[[dialogue]]
speaker = "unk"
# どうか俺と、主従の契約を──
line = "どうか俺と、主従の契約を──"

[[dialogue]]
speaker = "unk"
# ────────。
line = "────────。"

[[dialogue]]
speaker = "クロト"
# （……！？　今、声が────！）
line = "（……！？　今、声が────！）"

[[dialogue]]
speaker = "マトイ"
# 「え～っと……？」
line = "「え～っと……？」"

[[dialogue]]
speaker = "アナ"
# 「…………何も現れませんね」
line = "「…………何も現れませんね」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ぴかーって光ったのに。何も出てこないわ！？」
line = "「ぴかーって光ったのに。何も出てこないわ！？」"

[[dialogue]]
speaker = "サーシャ"
# 「これはもしかして～……」
line = "「これはもしかして～……」"

[[dialogue]]
speaker = "フィオナ"
# 「あ、あはは。失敗、みたいですね……」
line = "「あ、あはは。失敗、みたいですね……」"

[[dialogue]]
speaker = "クロト"
# 「そう──か。残念だ」
line = "「そう──か。残念だ」"

[[dialogue]]
speaker = "unk"
# フィオナに付き従う、ニャリオンみたいな使い魔。
line = "フィオナに付き従う、ニャリオンみたいな使い魔。"

[[dialogue]]
speaker = "unk"
# そんな特別な存在と出会えることを少し楽しみにしていたけれど……上手くいかなかったのなら仕方がない。
line = "そんな特別な存在と出会えることを少し楽しみにしていたけれど……上手くいかなかったのなら仕方がない。"

[[dialogue]]
speaker = "unk"
# 元より使い魔が必須の旅路ではないし……これ以上、別の方法を試す必要もないだろう。
line = "元より使い魔が必須の旅路ではないし……これ以上、別の方法を試す必要もないだろう。"

[[dialogue]]
speaker = "unk"
# それから数日後──
line = "それから数日後──"

[[dialogue]]
speaker = "unk"
# 俺は、キュリオスの下見に付いてきたがるヴィーナスをなんとかなだめて、学園を発った。
line = "俺は、キュリオスの下見に付いてきたがるヴィーナスをなんとかなだめて、学園を発った。"

[[dialogue]]
speaker = "unk"
# 行き先はネビュラの基地。世界樹のうろを使わせてもらうことで、今年最後の大交流よりも前に、キュリオスの下見を行うのだ。
line = "行き先はネビュラの基地。世界樹のうろを使わせてもらうことで、今年最後の大交流よりも前に、キュリオスの下見を行うのだ。"

[[dialogue]]
speaker = "unk"
# そうして俺は、人間界に滞在していた煌嶺やリーエンと共に、魔界はキュリオスの地へと赴いたのだった──
line = "そうして俺は、人間界に滞在していた煌嶺やリーエンと共に、魔界はキュリオスの地へと赴いたのだった──"

[[dialogue]]
speaker = "クロト"
# 「……魔界にも青い空があるんだなあ」
line = "「……魔界にも青い空があるんだなあ」"

[[dialogue]]
speaker = "unk"
# ７つの都市国家が鎬を削るジンルオ地方──<ruby=たいはい>頽廃</ruby>都市キュリオスの空を、俺は眺める。
line = "７つの都市国家が鎬を削るジンルオ地方──<ruby>頽廃<rt>たいはい</rt></ruby>都市キュリオスの空を、俺は眺める。"

[[dialogue]]
speaker = "unk"
# 不思議な感じだ。こうして都市の景観を収めずに空だけを見ると、人間界とそう変わらない──魔界の広大さを実感してしまう。
line = "不思議な感じだ。こうして都市の景観を収めずに空だけを見ると、人間界とそう変わらない──魔界の広大さを実感してしまう。"

[[dialogue]]
speaker = "リーエン"
# 「何を言っている、貴様。到着した昨日も、同じことを言っていたぞ」
line = "「何を言っている、貴様。到着した昨日も、同じことを言っていたぞ」"

[[dialogue]]
speaker = "リーエン"
# 「……現実逃避はそのくらいにしろ魔王。というか、説明しろ！　返答次第では斬る！！」
line = "「……現実逃避はそのくらいにしろ魔王。というか、説明しろ！　返答次第では斬る！！」"

[[dialogue]]
speaker = "煌嶺"
# 「ククク……ハハハハハ！　魔王よ。貴様、なかなか隅に置けぬではないか？　まさかまさか──」
line = "「ククク……ハハハハハ！　魔王よ。貴様、なかなか隅に置けぬではないか？　まさかまさか──」"

[[dialogue]]
speaker = "煌嶺"
# 「キュリオスに到着したその夜のうちに、<b>女を裸に剥いて寝所に連れ込む</b>とは！　魔王にそんな甲斐性があったとはな！！」
line = "「キュリオスに到着したその夜のうちに、<b>女を裸に剥いて寝所に連れ込む</b>とは！　魔王にそんな甲斐性があったとはな！！」"

[[dialogue]]
speaker = "クロト"
# 「だからそれは誤解なんだ！　朝起きたら、いつの間にか<b>あの子</b>が、隣で寝てて……！」
line = "「だからそれは誤解なんだ！　朝起きたら、いつの間にか<b>あの子</b>が、隣で寝てて……！」"

[[dialogue]]
speaker = "リーエン"
# 「人間界で試していた使い魔の召喚が、時間差で成功した──だったか？」
line = "「人間界で試していた使い魔の召喚が、時間差で成功した──だったか？」"

[[dialogue]]
speaker = "リーエン"
# 「そんなヘタクソな言い訳を信じるバカがどこにいる！？　報告を聞いた時は耳を疑ったぞ！？　あんな年端もいかない娘を……！」
line = "「そんなヘタクソな言い訳を信じるバカがどこにいる！？　報告を聞いた時は耳を疑ったぞ！？　あんな年端もいかない娘を……！」"

[[dialogue]]
speaker = "クロト"
# 「だから、あの子は俺の使い魔で……本人もそう言ってて……」
line = "「だから、あの子は俺の使い魔で……本人もそう言ってて……」"

[[dialogue]]
speaker = "リーエン"
# 「フン。あの小娘が魔王の使い魔？　何の力も感じなかったぞ！」
line = "「フン。あの小娘が魔王の使い魔？　何の力も感じなかったぞ！」"

[[dialogue]]
speaker = "リーエン"
# 「おおかた<ruby=こくとういちば>黒灯市場</ruby>で娼婦でも買って、口裏を合わせたのだろう！　くだらん嘘を吐くな！」
line = "「おおかた<ruby>黒灯市場<rt>こくとういちば</rt></ruby>で娼婦でも買って、口裏を合わせたのだろう！　くだらん嘘を吐くな！」"

[[dialogue]]
speaker = "煌嶺"
# 「なんだリーエン、随分と不機嫌ではないか？　こんなに面白いことはないだろうに──ククク！」
line = "「なんだリーエン、随分と不機嫌ではないか？　こんなに面白いことはないだろうに──ククク！」"

[[dialogue]]
speaker = "リーエン"
# 「……私はこの男を買っていたのです、陛下。志こそ違えど、己が譲れぬもののためなら、命を懸けられる武人であると！」
line = "「……私はこの男を買っていたのです、陛下。志こそ違えど、己が譲れぬもののためなら、命を懸けられる武人であると！」"

[[dialogue]]
speaker = "リーエン"
# 「しかし実態は違いました……この男は、近しい者の目がなくなった途端にハメを外す軟派な男だったのです！」
line = "「しかし実態は違いました……この男は、近しい者の目がなくなった途端にハメを外す軟派な男だったのです！」"

[[dialogue]]
speaker = "クロト"
# 「リーエン！　キュリオスの往来で誤解を広めないでくれっ！！」
line = "「リーエン！　キュリオスの往来で誤解を広めないでくれっ！！」"

[[dialogue]]
speaker = "煌嶺"
# 「件の娘には今、着替えをさせているのだろう？　昼過ぎにでも、妾のところへ連れて来い」
line = "「件の娘には今、着替えをさせているのだろう？　昼過ぎにでも、妾のところへ連れて来い」"

[[dialogue]]
speaker = "煌嶺"
# 「魔王の下手な言い訳は、その時にとっくりと聞かせてもらおうではないか」
line = "「魔王の下手な言い訳は、その時にとっくりと聞かせてもらおうではないか」"

[[dialogue]]
speaker = "煌嶺"
# 「行くぞ、リーエン。人間界へ赴いている間の雑事も溜まっている。皇帝の時間は有限だぞ？」
line = "「行くぞ、リーエン。人間界へ赴いている間の雑事も溜まっている。皇帝の時間は有限だぞ？」"

[[dialogue]]
speaker = "リーエン"
# 「はっ、承知いたしました……！」
line = "「はっ、承知いたしました……！」"

[[dialogue]]
speaker = "煌嶺"
# 「ではな、魔王。また後でその使い魔とやら……じっくり拝ませてもらうぞ！！」
line = "「ではな、魔王。また後でその使い魔とやら……じっくり拝ませてもらうぞ！！」"

[[dialogue]]
speaker = "クロト"
# 「…………何てことだ」
line = "「…………何てことだ」"

[[dialogue]]
speaker = "unk"
# キュリオスを訪れた矢先に、とんでもないトラブルが発生してしまった。
line = "キュリオスを訪れた矢先に、とんでもないトラブルが発生してしまった。"

[[dialogue]]
speaker = "unk"
# 修学旅行の下見をしなくちゃいけないのに、あの煌嶺に弱みを握られてしまった──いや、本当に誤解なのだけれど。
line = "修学旅行の下見をしなくちゃいけないのに、あの煌嶺に弱みを握られてしまった──いや、本当に誤解なのだけれど。"

[[dialogue]]
speaker = "クロト"
# （……俺のベッドに、いつの間にか潜り込んでいた、あの子）
line = "（……俺のベッドに、いつの間にか潜り込んでいた、あの子）"

[[dialogue]]
speaker = "クロト"
# （いったい、何者なんだ……？　使い魔だって、言ってたけれど──）
line = "（いったい、何者なんだ……？　使い魔だって、言ってたけれど──）"

[[dialogue]]
speaker = "クロト"
# 「……いいや、考えるのは後だ。今はできることをしよう」
line = "「……いいや、考えるのは後だ。今はできることをしよう」"

[[dialogue]]
speaker = "unk"
# 頽廃都市キュリオスを己の足で歩き、己の目で見て……修学旅行の場所として適切であるかを判断しなくては。
line = "頽廃都市キュリオスを己の足で歩き、己の目で見て……修学旅行の場所として適切であるかを判断しなくては。"

[[dialogue]]
speaker = "魔族の行商人１"
# 「ヒヒヒ！　ちょっといいかい、そこの兄サン？」
line = "「ヒヒヒ！　ちょっといいかい、そこの兄サン？」"

[[dialogue]]
speaker = "クロト"
# 「あ──俺、ですか？」
line = "「あ──俺、ですか？」"

[[dialogue]]
speaker = "魔族の行商人１"
# 「おうよ。兄サン、煌嶺陛下と話してたなァ？　身なりもちゃんとしてるし、アレだろ？　金持ちだろ！」
line = "「おうよ。兄サン、煌嶺陛下と話してたなァ？　身なりもちゃんとしてるし、アレだろ？　金持ちだろ！」"

[[dialogue]]
speaker = "魔族の行商人１"
# 「聞いたぜぇ？　女を連れ込んだとか。どうだい、夜のお供にこの強壮剤を１本──」
line = "「聞いたぜぇ？　女を連れ込んだとか。どうだい、夜のお供にこの強壮剤を１本──」"

[[dialogue]]
speaker = "クロト"
# 「え、遠慮しときます……」
line = "「え、遠慮しときます……」"

[[dialogue]]
speaker = "unk"
# 魔族の行商人をかわして、キュリオスの大通りを進む。
line = "魔族の行商人をかわして、キュリオスの大通りを進む。"

[[dialogue]]
speaker = "unk"
# この通りの名前は、<ruby=ばんしょうろう>万象廊</ruby>。
line = "この通りの名前は、<ruby>万象廊<rt>ばんしょうろう</rt></ruby>。"

[[dialogue]]
speaker = "unk"
# キュリオスの中でも、特に活気づく商店通りとのこと。
line = "キュリオスの中でも、特に活気づく商店通りとのこと。"

[[dialogue]]
speaker = "unk"
# リーエンが先ほど言っていた<ruby=こくとういちば>黒灯市場</ruby>（こちらはスラム街にあるブラックマーケットだ）とは違う、<b>正規</b>の市場と聞いているが……
line = "リーエンが先ほど言っていた<ruby>黒灯市場<rt>こくとういちば</rt></ruby>（こちらはスラム街にあるブラックマーケットだ）とは違う、<b>正規</b>の市場と聞いているが……"

[[dialogue]]
speaker = "魔族の行商人２"
# 「さぁこいつを見てくれよ！　レゾフから取り寄せた氷結ヨーグルト！　掘り出しモンだぜぇ！？」
line = "「さぁこいつを見てくれよ！　レゾフから取り寄せた氷結ヨーグルト！　掘り出しモンだぜぇ！？」"

[[dialogue]]
speaker = "魔族の星術使い"
# 「ヒャッハァー！　俺は氷結ヨーグルトに目がなくてよォ！　ってぇ、俺のサイフがねぇ！？」
line = "「ヒャッハァー！　俺は氷結ヨーグルトに目がなくてよォ！　ってぇ、俺のサイフがねぇ！？」"

[[dialogue]]
speaker = "魔族の行商人２"
# 「間抜けだなァ、やられちまったか。ケケッ！　金がねぇなら客じゃねえ！　失せな！！」
line = "「間抜けだなァ、やられちまったか。ケケッ！　金がねぇなら客じゃねえ！　失せな！！」"

[[dialogue]]
speaker = "クロト"
# 「本当に大丈夫かな、<ruby=うち>新星学園</ruby>の生徒を呼んで……」
line = "「本当に大丈夫かな、<ruby>新星学園<rt>うち</rt></ruby>の生徒を呼んで……」"

[[dialogue]]
speaker = "unk"
# 活気があるのは間違いない。しかし、能力のない者はすぐに食い物にされる、そんな弱肉強食な魔界の歓楽都市──キュリオス。
line = "活気があるのは間違いない。しかし、能力のない者はすぐに食い物にされる、そんな弱肉強食な魔界の歓楽都市──キュリオス。"

[[dialogue]]
speaker = "unk"
# 刺激はあるけれど危険な場所……それが俺の、現時点での印象だった。
line = "刺激はあるけれど危険な場所……それが俺の、現時点での印象だった。"

[[dialogue]]
speaker = "unk"
# その後、例のトラブルのタネとなった<b>あの子</b>と、煌嶺を引き合わせて──
line = "その後、例のトラブルのタネとなった<b>あの子</b>と、煌嶺を引き合わせて──"

[[dialogue]]
speaker = "unk"
# キュリオスの色々なところを練り歩き、見聞を深めて──
line = "キュリオスの色々なところを練り歩き、見聞を深めて──"

[[dialogue]]
speaker = "unk"
# その夜、俺はキュリオスの<ruby=こくとういちば>黒灯市場</ruby>──ブラックマーケットの一画を訪れていた。
line = "その夜、俺はキュリオスの<ruby>黒灯市場<rt>こくとういちば</rt></ruby>──ブラックマーケットの一画を訪れていた。"

[[dialogue]]
speaker = "クロト"
# （……見るからに怪しい見た目の奴らばかりだな）
line = "（……見るからに怪しい見た目の奴らばかりだな）"

[[dialogue]]
speaker = "unk"
# 饐えた臭いに、入り組んだ街並み。なるほど確かに、ここに比べれば万象廊は『表の市場』と言えるかもしれない。
line = "饐えた臭いに、入り組んだ街並み。なるほど確かに、ここに比べれば万象廊は『表の市場』と言えるかもしれない。"

[[dialogue]]
speaker = "クロト"
# （こんなところに呼び出すだなんて、いったい何の用事──）
line = "（こんなところに呼び出すだなんて、いったい何の用事──）"

[[dialogue]]
speaker = "クロト"
# （────────え？）
line = "（────────え？）"

[[dialogue]]
speaker = "unk"
# 背後から何かが──俺の体に触れた。
line = "背後から何かが──俺の体に触れた。"

[[dialogue]]
speaker = "クロト"
# （────あ、れ？）
line = "（────あ、れ？）"

[[dialogue]]
speaker = "unk"
