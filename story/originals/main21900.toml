line = "景色が歪み、世界がぐらつき──"

[[dialogue]]
speaker = "unk"
# スラムの冷たい地面に、俺は、倒れた──
line = "スラムの冷たい地面に、俺は、倒れた──"

[[dialogue]]
speaker = "クロト"
# 「ぁ────が…………ァッ…………！？」
line = "「ぁ────が…………ァッ…………！？」"

[[dialogue]]
speaker = "unk"
# どくどく、どくどくと──
line = "どくどく、どくどくと──"

[[dialogue]]
speaker = "unk"
