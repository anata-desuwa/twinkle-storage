line = "「ルーの名前は……ルーシィ」"

[[dialogue]]
speaker = "ルーシィ"
# 「ご主人が呼んだ────ご主人だけの、使い魔です」
line = "「ご主人が呼んだ────ご主人だけの、使い魔です」"

