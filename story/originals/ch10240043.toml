[[dialogue]]
speaker = "unk"
# 第３話,これからもずっと一緒に,P
line = "第３話,これからもずっと一緒に,P"

[[dialogue]]
speaker = "unk"
# その日、ヨミは俺の家で、以前の『花嫁修業』の続きを行っていた。
line = "その日、ヨミは俺の家で、以前の『花嫁修業』の続きを行っていた。"

[[dialogue]]
speaker = "ヨミ"
# 「――はいっ♪　『おいなりさん』できましたよ、会長♪」
line = "「――はいっ♪　『おいなりさん』できましたよ、会長♪」"

[[dialogue]]
speaker = "unk"
# うん……うまいっ！
line = "うん……うまいっ！"

[[dialogue]]
speaker = "unk"
# いただきます
line = "いただきます"

[[dialogue]]
speaker = "ヨミ"
# 「えへへっ♪　よかったです」
line = "「えへへっ♪　よかったです」"

[[dialogue]]
speaker = "ヨミ"
# 「少しずつですけど、前より料理もできるようになってきましたし……いいお嫁さんに近付けている気がします♪」
line = "「少しずつですけど、前より料理もできるようになってきましたし……いいお嫁さんに近付けている気がします♪」"

[[dialogue]]
speaker = "unk"
# 爆裂いいお嫁さんになれるよ
line = "爆裂いいお嫁さんになれるよ"

[[dialogue]]
speaker = "unk"
# ヨミは今のままでも
line = "ヨミは今のままでも"

[[dialogue]]
speaker = "ヨミ"
# 「こやんっ<emoji=heart04>　も、もう……会長はすぐそうやって褒めるんですから……<emoji=heart04>」
line = "「こやんっ<emoji=heart04>　も、もう……会長はすぐそうやって褒めるんですから……<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「でも……ありがとうございます♪」
line = "「でも……ありがとうございます♪」"

[[dialogue]]
speaker = "unk"
# ヨミは照れながらも嬉しそうに微笑む。
line = "ヨミは照れながらも嬉しそうに微笑む。"

[[dialogue]]
speaker = "unk"
# しばらく他愛もない話を続けていた時だった。
line = "しばらく他愛もない話を続けていた時だった。"

[[dialogue]]
speaker = "ヨミ"
# 「そういえば会長――卒業した後のことって考えていますか？」
line = "「そういえば会長――卒業した後のことって考えていますか？」"

[[dialogue]]
speaker = "unk"
# 卒業後？
line = "卒業後？"

[[dialogue]]
speaker = "ヨミ"
# 「はい。私たち、今は学園に通っていますけど……いつかは卒業しますよね？　……その後のことです」
line = "「はい。私たち、今は学園に通っていますけど……いつかは卒業しますよね？　……その後のことです」"

[[dialogue]]
speaker = "ヨミ"
# 「私は、星騎士としてのお役目を果たしたら……天ヶ崎神宮へ戻ろうと思っています」
line = "「私は、星騎士としてのお役目を果たしたら……天ヶ崎神宮へ戻ろうと思っています」"

[[dialogue]]
speaker = "unk"
# 実家に戻るんだね
line = "実家に戻るんだね"

[[dialogue]]
speaker = "ヨミ"
# 「はい。巫女として生まれ育ちましたし、天ヶ崎神宮は私にとって大切な場所ですから……」
line = "「はい。巫女として生まれ育ちましたし、天ヶ崎神宮は私にとって大切な場所ですから……」"

[[dialogue]]
speaker = "ヨミ"
# 「でも……その……会長のことも、もちろん大好きですし……<emoji=heart04>」
line = "「でも……その……会長のことも、もちろん大好きですし……<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「だから、その時になったら……会長はどうするのかなって、少し気になってしまって……」
line = "「だから、その時になったら……会長はどうするのかなって、少し気になってしまって……」"

[[dialogue]]
speaker = "ヨミ"
# 「天ヶ崎神宮は魔界にありますから、人間界との行き来も簡単ではありませんし……」
line = "「天ヶ崎神宮は魔界にありますから、人間界との行き来も簡単ではありませんし……」"

[[dialogue]]
speaker = "unk"
# もちろん付いていくよ
line = "もちろん付いていくよ"

[[dialogue]]
speaker = "ヨミ"
# 「――え？　いいんですか……！？」
line = "「――え？　いいんですか……！？」"

[[dialogue]]
speaker = "unk"
# 俺はヨミのことが好きだから
line = "俺はヨミのことが好きだから"

[[dialogue]]
speaker = "unk"
# 当たり前だよ
line = "当たり前だよ"

[[dialogue]]
speaker = "ヨミ"
# 「会長……！　えへへ……<emoji=heart04>　よかったぁ……」
line = "「会長……！　えへへ……<emoji=heart04>　よかったぁ……」"

[[dialogue]]
speaker = "ヨミ"
# 「実は少しだけ不安だったんです。もし会長が魔界へ行くのは嫌だったら、どうしようって……」
line = "「実は少しだけ不安だったんです。もし会長が魔界へ行くのは嫌だったら、どうしようって……」"

[[dialogue]]
speaker = "ヨミ"
# 「でも、ちゃんと聞けて安心しました<emoji=heart04>」
line = "「でも、ちゃんと聞けて安心しました<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ヨミは嬉しそうに俺の腕へ抱き付く。
line = "ヨミは嬉しそうに俺の腕へ抱き付く。"

[[dialogue]]
speaker = "ヨミ"
# 「私の故郷――天ヶ崎神宮のある『アマツミカ』地方は、とても自然が綺麗なんですよ♪」
line = "「私の故郷――天ヶ崎神宮のある『アマツミカ』地方は、とても自然が綺麗なんですよ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「小さい頃は、神社の近くの野原をよく走り回っていました♪」
line = "「小さい頃は、神社の近くの野原をよく走り回っていました♪」"

[[dialogue]]
speaker = "ヨミ"
# 「古い建物もたくさん残っていて、時代劇みたいな街並みなんです」
line = "「古い建物もたくさん残っていて、時代劇みたいな街並みなんです」"

[[dialogue]]
speaker = "ヨミ"
# 「いつか会長にも……私が育った景色を見てほしいです♪」
line = "「いつか会長にも……私が育った景色を見てほしいです♪」"

[[dialogue]]
speaker = "unk"
# 今から、行くのが楽しみだ
line = "今から、行くのが楽しみだ"

[[dialogue]]
speaker = "ヨミ"
# 「はいっ♪　それで……両親にも紹介して……」
line = "「はいっ♪　それで……両親にも紹介して……」"

[[dialogue]]
speaker = "ヨミ"
# 「せ、正式な婚約者になってもらえたら……<emoji=heart04>」
line = "「せ、正式な婚約者になってもらえたら……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ああ、もちろんだ
line = "ああ、もちろんだ"

[[dialogue]]
speaker = "ヨミ"
# 「えへへ……<emoji=heart04>」
line = "「えへへ……<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「なんだか不思議ですね。少し前までは、卒業したら天ヶ崎神宮へ戻るのが当たり前だと思っていたのに……」
line = "「なんだか不思議ですね。少し前までは、卒業したら天ヶ崎神宮へ戻るのが当たり前だと思っていたのに……」"

[[dialogue]]
speaker = "ヨミ"
# 「今は、その先のことまで考えてしまいます」
line = "「今は、その先のことまで考えてしまいます」"

[[dialogue]]
speaker = "ヨミ"
# 「会長とどんな家に住もうとか……どんな毎日を過ごそうとか……そんなことばかり考えてしまうんです<emoji=heart04>」
line = "「会長とどんな家に住もうとか……どんな毎日を過ごそうとか……そんなことばかり考えてしまうんです<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# それだけ真剣ってことだね
line = "それだけ真剣ってことだね"

[[dialogue]]
speaker = "ヨミ"
# 「はい<emoji=heart04>　だって私は――本気で会長のお嫁さんになるつもりですから<emoji=heart04>」
line = "「はい<emoji=heart04>　だって私は――本気で会長のお嫁さんになるつもりですから<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「だから……天ヶ崎神宮は私の故郷ですけど」
line = "「だから……天ヶ崎神宮は私の故郷ですけど」"

[[dialogue]]
speaker = "ヨミ"
# 「これから先は、会長がいる場所も、私の帰る場所になるんです<emoji=heart04>」
line = "「これから先は、会長がいる場所も、私の帰る場所になるんです<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# なら、俺も帰る場所を増やさないと
line = "なら、俺も帰る場所を増やさないと"

[[dialogue]]
speaker = "ヨミ"
# 「こやんっ♪」
line = "「こやんっ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「はいっ<emoji=heart04>　人間界にも、魔界にも、私たちの帰る場所を作りましょう♪」
line = "「はいっ<emoji=heart04>　人間界にも、魔界にも、私たちの帰る場所を作りましょう♪」"

[[dialogue]]
speaker = "ヨミ"
# 「そして何年経っても――おかえりなさいって言い合える夫婦になりたいです<emoji=heart04>」
line = "「そして何年経っても――おかえりなさいって言い合える夫婦になりたいです<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# きっとなれるよ
line = "きっとなれるよ"

[[dialogue]]
speaker = "ヨミ"
# 「えへへっ♪　はいっ！」
line = "「えへへっ♪　はいっ！」"

[[dialogue]]
speaker = "unk"
# ヨミは俺へ寄り添うと、嬉しそうに尻尾を擦り寄せる。
line = "ヨミは俺へ寄り添うと、嬉しそうに尻尾を擦り寄せる。"

[[dialogue]]
speaker = "ヨミ"
# 「これからもずっと、一緒ですから<emoji=heart04>」
line = "「これからもずっと、一緒ですから<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 故郷も。未来も。これから歩いていく人生も――その全部をヨミと一緒にしていく。
line = "故郷も。未来も。これから歩いていく人生も――その全部をヨミと一緒にしていく。"

[[dialogue]]
speaker = "unk"
# そんな将来を思い描きながら、俺は彼女の温もりを感じるのだった。
line = "そんな将来を思い描きながら、俺は彼女の温もりを感じるのだった。"
