[[dialogue]]
speaker = "unk"
# 第４話,過去の遠見,B
line = "第４話,過去の遠見,B"

[[dialogue]]
speaker = "アポロ"
# 「……どうした？　もう限界か、衛兵隊」
line = "「……どうした？　もう限界か、衛兵隊」"

[[dialogue]]
speaker = "衛兵隊の天使"
# 「ど、どうしてっ……どんどん星力が、なくなっていく……！？」
line = "「ど、どうしてっ……どんどん星力が、なくなっていく……！？」"

[[dialogue]]
speaker = "unk"
# かつて使徒であったアポロを模して造られた、シャドウによる『天蓋』。
line = "かつて使徒であったアポロを模して造られた、シャドウによる『天蓋』。"

[[dialogue]]
speaker = "unk"
# オリジナルほどではないが、星の力を用いる天使たちには圧倒的な足止めとなっていた──
line = "オリジナルほどではないが、星の力を用いる天使たちには圧倒的な足止めとなっていた──"

[[dialogue]]
speaker = "ケイティ"
# 「みなさん、よく耐えてくれました！」
line = "「みなさん、よく耐えてくれました！」"

[[dialogue]]
speaker = "衛兵隊の天使"
# 「──ケイティ隊長！！」
line = "「──ケイティ隊長！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「こっちはアポロのシャドウか……ルヴィネのやつ、趣味が悪すぎるね。切れる手札は全部切るつもりってこと？」
line = "「こっちはアポロのシャドウか……ルヴィネのやつ、趣味が悪すぎるね。切れる手札は全部切るつもりってこと？」"

[[dialogue]]
speaker = "衛兵隊の天使"
# 「気を付けてください！　あの仮面の少女は、星力を阻害することができるようで……！」
line = "「気を付けてください！　あの仮面の少女は、星力を阻害することができるようで……！」"

[[dialogue]]
speaker = "メルエル"
# 「『天蓋』──！？　そんな、まずいよ！」
line = "「『天蓋』──！？　そんな、まずいよ！」"

[[dialogue]]
speaker = "ケイティ"
# 「メルエルちゃん、天蓋というのは……？」
line = "「メルエルちゃん、天蓋というのは……？」"

[[dialogue]]
speaker = "メルエル"
# 「アポロちゃんが使徒だった頃に使っていた能力で……守護星とのリンクを妨害されちゃうの！」
line = "「アポロちゃんが使徒だった頃に使っていた能力で……守護星とのリンクを妨害されちゃうの！」"

[[dialogue]]
speaker = "メルエル"
# 「空全体を見えない幕が覆っていて……完全な『天蓋』の場合は、星力は完全に遮断されちゃう！」
line = "「空全体を見えない幕が覆っていて……完全な『天蓋』の場合は、星力は完全に遮断されちゃう！」"

[[dialogue]]
speaker = "ナターシャ"
# 「星騎士を弱体化させるための結界、みたいな感じ？　まずいね──」
line = "「星騎士を弱体化させるための結界、みたいな感じ？　まずいね──」"

[[dialogue]]
speaker = "ケイティ"
# 「確かに、守護星とのリンクが絞られて、細くなっているような感覚が……なるほど」
line = "「確かに、守護星とのリンクが絞られて、細くなっているような感覚が……なるほど」"

[[dialogue]]
speaker = "ケイティ"
# 「──メルエルちゃん。ナターシャちゃん。私が隙を作ります。２人は神殿内部を進み、侵入者を撃破して」
line = "「──メルエルちゃん。ナターシャちゃん。私が隙を作ります。２人は神殿内部を進み、侵入者を撃破して」"

[[dialogue]]
speaker = "メルエル"
# 「で、でも……ケイティお姉ちゃんは──」
line = "「で、でも……ケイティお姉ちゃんは──」"

[[dialogue]]
speaker = "ケイティ"
# 「私は衛兵隊として、この場で指揮をしなくてはなりません。それに、先ほどと同じく仮面の使徒が相手です」
line = "「私は衛兵隊として、この場で指揮をしなくてはなりません。それに、先ほどと同じく仮面の使徒が相手です」"

[[dialogue]]
speaker = "ケイティ"
# 「私がいなければ、この場の天使は全滅してしまうでしょう」
line = "「私がいなければ、この場の天使は全滅してしまうでしょう」"

[[dialogue]]
speaker = "ナターシャ"
# 「……了解。ケイティ姉さんたちがやられないうちに、侵入者を全て排除する。メルエル、四の五の言ってる場合じゃないよ」
line = "「……了解。ケイティ姉さんたちがやられないうちに、侵入者を全て排除する。メルエル、四の五の言ってる場合じゃないよ」"

[[dialogue]]
speaker = "メルエル"
# 「……わかった。ケイティお姉ちゃん、お願い！！」
line = "「……わかった。ケイティお姉ちゃん、お願い！！」"

[[dialogue]]
speaker = "ケイティ"
# 「ええ、任されました──破砕の乱撃ッッッ！！！」
line = "「ええ、任されました──破砕の乱撃ッッッ！！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「相変わらず、剣が出す音じゃないよね──行くよ、メルエル！！」
line = "「相変わらず、剣が出す音じゃないよね──行くよ、メルエル！！」"

[[dialogue]]
speaker = "メルエル"
# 「うん！　一気に奥まで──！！」
line = "「うん！　一気に奥まで──！！」"

[[dialogue]]
speaker = "unk"
# 神殿全体を揺るがすほどの衝撃と、舞い上がった砂塵に紛れ──メルエルたちが神殿内部へ侵入する。
line = "神殿全体を揺るがすほどの衝撃と、舞い上がった砂塵に紛れ──メルエルたちが神殿内部へ侵入する。"

[[dialogue]]
speaker = "unk"
# その様子を見届けたケイティは、使徒アポロと相対した。
line = "その様子を見届けたケイティは、使徒アポロと相対した。"

[[dialogue]]
speaker = "アポロ"
# 「オマエ、他の天使たちとは違うな……相当、強い。今まで戦う相手を探すのに苦労しただろ？」
line = "「オマエ、他の天使たちとは違うな……相当、強い。今まで戦う相手を探すのに苦労しただろ？」"

[[dialogue]]
speaker = "ケイティ"
# 「あいにく、戦いを楽しいと思ったことはありませんので。どこからでも来なさい」
line = "「あいにく、戦いを楽しいと思ったことはありませんので。どこからでも来なさい」"

[[dialogue]]
speaker = "ケイティ"
# （……妙ですね。使徒がメルエルちゃんたちを妨害しようとしたら、すぐに動く準備はしていましたが……）
line = "（……妙ですね。使徒がメルエルちゃんたちを妨害しようとしたら、すぐに動く準備はしていましたが……）"

[[dialogue]]
speaker = "ケイティ"
# （随分とあっさりと、侵入を許したような……？）
line = "（随分とあっさりと、侵入を許したような……？）"

[[dialogue]]
speaker = "ケイティ"
# （何か──嫌な胸騒ぎがします。急いで後を追わないと──！）
line = "（何か──嫌な胸騒ぎがします。急いで後を追わないと──！）"

[[dialogue]]
speaker = "ナターシャ"
# 「またこの神殿を攻略することになるだなんてね──メルエル、体調はどう？」
line = "「またこの神殿を攻略することになるだなんてね──メルエル、体調はどう？」"

[[dialogue]]
speaker = "unk"
# 女神の神殿内には、魔王の力を持つ者にのみ作用する機能が存在する。
line = "女神の神殿内には、魔王の力を持つ者にのみ作用する機能が存在する。"

[[dialogue]]
speaker = "unk"
# 魔王因子を通して星力を排出する機能──これによって、前回の神殿攻略は難航を極めた。
line = "魔王因子を通して星力を排出する機能──これによって、前回の神殿攻略は難航を極めた。"

[[dialogue]]
speaker = "メルエル"
# 「それなんだけど……全然、何ともない感じだよ？　どうしてだろ……」
line = "「それなんだけど……全然、何ともない感じだよ？　どうしてだろ……」"

[[dialogue]]
speaker = "unk"
# 先日の天界襲撃の折──あわや聖庭園にぶつかりかけた女神の神殿は、緋宮クロトが展開したカオスイージスによって受け止められた。
line = "先日の天界襲撃の折──あわや聖庭園にぶつかりかけた女神の神殿は、緋宮クロトが展開したカオスイージスによって受け止められた。"

[[dialogue]]
speaker = "ナターシャ"
# 「あの時、相当な衝撃があったし……故障でもしたのかな」
line = "「あの時、相当な衝撃があったし……故障でもしたのかな」"

[[dialogue]]
speaker = "メルエル"
# 「不幸中の幸いってやつかな。これなら戦えそうだよ！」
line = "「不幸中の幸いってやつかな。これなら戦えそうだよ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「それなら子守りの手間は省けそうだね。奥を目指すよ」
line = "「それなら子守りの手間は省けそうだね。奥を目指すよ」"

[[dialogue]]
speaker = "メルエル"
# 「うん！　ケイティお姉ちゃんたちが戦ってくれてる間に、コントロールルームを奪還しなきゃ！」
line = "「うん！　ケイティお姉ちゃんたちが戦ってくれてる間に、コントロールルームを奪還しなきゃ！」"

[[dialogue]]
speaker = "ガーディアン"
# 「────」
line = "「────」"

[[dialogue]]
speaker = "メルエル"
# 「ガーディアン……！」
line = "「ガーディアン……！」"

[[dialogue]]
speaker = "ガーディアン"
# 「────！！」
line = "「────！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「くっ……！？」
line = "「くっ……！？」"

[[dialogue]]
speaker = "unk"
# 行く手を阻むガーディアンが、侵入者を惑わせるための記憶喚起のプログラムを発動させた──
line = "行く手を阻むガーディアンが、侵入者を惑わせるための記憶喚起のプログラムを発動させた──"

[[dialogue]]
speaker = "ナターシャの母"
# 『ナターシャ。気を引き締めなさい。今日これから、あなたを姫様に会わせます』
line = "『ナターシャ。気を引き締めなさい。今日これから、あなたを姫様に会わせます』"

[[dialogue]]
speaker = "ナターシャの母"
# 『聖庭園の至宝であり、世界の未来を担う姫……本来なら、我ら一族は影を踏むことも許されない』
line = "『聖庭園の至宝であり、世界の未来を担う姫……本来なら、我ら一族は影を踏むことも許されない』"

[[dialogue]]
speaker = "ナターシャの母"
# 『けれどナターシャ、あなたは姫と歳が同じ、そして同性です。ゆえに、傍に置いても無用な警戒を招かないわ』
line = "『けれどナターシャ、あなたは姫と歳が同じ、そして同性です。ゆえに、傍に置いても無用な警戒を招かないわ』"

[[dialogue]]
speaker = "ナターシャの母"
# 『偶然を装って声をかけなさい。そして、必ず気に入られなさい。失敗は許されません』
line = "『偶然を装って声をかけなさい。そして、必ず気に入られなさい。失敗は許されません』"

[[dialogue]]
speaker = "ナターシャ"
# 「…………承知しました」
line = "「…………承知しました」"

[[dialogue]]
speaker = "メルエル"
# 「んー……ぅー……ぜんぜんうまく、できないよぅ……」
line = "「んー……ぅー……ぜんぜんうまく、できないよぅ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「……どうしたの？」
line = "「……どうしたの？」"

[[dialogue]]
speaker = "メルエル"
# 「ふぇっ……だ、だあれ？」
line = "「ふぇっ……だ、だあれ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「わたし、ナターシャ。あなた、こまってたみたいだから」
line = "「わたし、ナターシャ。あなた、こまってたみたいだから」"

[[dialogue]]
speaker = "メルエル"
# 「う、うん。お花をあんで、はなかんむり？　っていうの、作りたいなって……でも、うまくできなくて……」
line = "「う、うん。お花をあんで、はなかんむり？　っていうの、作りたいなって……でも、うまくできなくて……」"

[[dialogue]]
speaker = "ナターシャ"
# 「じゃあ、おしえてあげる。見てて──」
line = "「じゃあ、おしえてあげる。見てて──」"

[[dialogue]]
speaker = "unk"
# ──能天気なお姫様。
line = "──能天気なお姫様。"

[[dialogue]]
speaker = "unk"
# ──花を編んで、花冠も作れない、魔王の血統。
line = "──花を編んで、花冠も作れない、魔王の血統。"

[[dialogue]]
speaker = "ナターシャ"
# （どうしてわたしが、こんなやつを、まもらなくちゃいけないの──？）
line = "（どうしてわたしが、こんなやつを、まもらなくちゃいけないの──？）"

[[dialogue]]
speaker = "ナターシャ"
# 「消えろっ──！」
line = "「消えろっ──！」"

[[dialogue]]
speaker = "ガーディアン"
# 「ッ────！？」
line = "「ッ────！？」"

[[dialogue]]
speaker = "unk"
# 元凶となるガーディアンを撃破すると、２人の間に共有されていた過去の光景は瞬く間に消え失せた。
line = "元凶となるガーディアンを撃破すると、２人の間に共有されていた過去の光景は瞬く間に消え失せた。"

[[dialogue]]
speaker = "メルエル"
# 「今のって、私たちが初めて出会った時の……？」
line = "「今のって、私たちが初めて出会った時の……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そうだよ。懐かしいね、本当に」
line = "「そうだよ。懐かしいね、本当に」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエルは言ったよね。今まで知らなかったこと、たくさん知りたいってさ？」
line = "「メルエルは言ったよね。今まで知らなかったこと、たくさん知りたいってさ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「どうだった？　感想、聞かせてよ」
line = "「どうだった？　感想、聞かせてよ」"

[[dialogue]]
speaker = "メルエル"
# 「…………本当は『ごめんね』って言いたいけど、そんな資格……私には、ないから」
line = "「…………本当は『ごめんね』って言いたいけど、そんな資格……私には、ないから」"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃんを、小さい頃から苦しませてきたんだなって実感も出てきて、ただただ──申し訳ないな、って……」
line = "「ナターシャちゃんを、小さい頃から苦しませてきたんだなって実感も出てきて、ただただ──申し訳ないな、って……」"

[[dialogue]]
speaker = "ナターシャ"
# 「──それ。その目。ほんと嫌い」
line = "「──それ。その目。ほんと嫌い」"

[[dialogue]]
speaker = "メルエル"
# 「…………うん」
line = "「…………うん」"

[[dialogue]]
speaker = "ナターシャ"
# 「──ま、いいや。先に進もう、メルエル」
line = "「──ま、いいや。先に進もう、メルエル」"

[[dialogue]]
speaker = "メルエル"
# （…………辛いけど、ちゃんと、受け止めなきゃ。ナターシャちゃんと……仲直り、したいもん）
line = "（…………辛いけど、ちゃんと、受け止めなきゃ。ナターシャちゃんと……仲直り、したいもん）"

[[dialogue]]
speaker = "unk"
# その後もガーディアンは、次々に現れては──
line = "その後もガーディアンは、次々に現れては──"

[[dialogue]]
speaker = "unk"
# ナターシャが見せたくもない過去が、明らかにされていく──
line = "ナターシャが見せたくもない過去が、明らかにされていく──"

[[dialogue]]
speaker = "ナターシャ"
# 「どうしてわたしが、人間界なんかに……」
line = "「どうしてわたしが、人間界なんかに……」"

[[dialogue]]
speaker = "unk"
# ──当時、天界は水面下で荒れていた。
line = "──当時、天界は水面下で荒れていた。"

[[dialogue]]
speaker = "unk"
# リガルタ老には隠し子がいるのではという噂が広まりつつあり、それを知った過激派が行動を起こしていたのだ。
line = "リガルタ老には隠し子がいるのではという噂が広まりつつあり、それを知った過激派が行動を起こしていたのだ。"

[[dialogue]]
speaker = "unk"
# 魔王の王政復興を求める派閥や、現状維持の保守派の中にもスパイがいるかもしれない──そう考えたリガルタ老は、メルエルを一時的に人間界へ避難させた。
line = "魔王の王政復興を求める派閥や、現状維持の保守派の中にもスパイがいるかもしれない──そう考えたリガルタ老は、メルエルを一時的に人間界へ避難させた。"

[[dialogue]]
speaker = "unk"
# その護衛として、まだ幼いナターシャも、秘密裏に人間界の土を踏んだのだった。
line = "その護衛として、まだ幼いナターシャも、秘密裏に人間界の土を踏んだのだった。"

[[dialogue]]
speaker = "ナターシャ"
# 「さいあく。さいあく……どこに行ってもごみごみしてるし、大きい虫は出るし……」
line = "「さいあく。さいあく……どこに行ってもごみごみしてるし、大きい虫は出るし……」"

[[dialogue]]
speaker = "unk"
# ナターシャは聖庭園のエージェントとしての訓練も同時に課されていた。
line = "ナターシャは聖庭園のエージェントとしての訓練も同時に課されていた。"

[[dialogue]]
speaker = "unk"
# メルエルにバレないように護衛をする訓練を、この時から積まされていた。
line = "メルエルにバレないように護衛をする訓練を、この時から積まされていた。"

[[dialogue]]
speaker = "unk"
# 朝も昼も夜も、人間界を楽しむメルエルを陰から見守り続ける日々──
line = "朝も昼も夜も、人間界を楽しむメルエルを陰から見守り続ける日々──"

[[dialogue]]
speaker = "ナターシャ"
# 「……ほんと、いいゴミブンってやつだよね」
line = "「……ほんと、いいゴミブンってやつだよね」"

[[dialogue]]
speaker = "unk"
# 何も知らず屈託なく笑う幼なじみが、疎ましかった。
line = "何も知らず屈託なく笑う幼なじみが、疎ましかった。"

[[dialogue]]
speaker = "unk"
# ある日、イレギュラーが起こった。
line = "ある日、イレギュラーが起こった。"

[[dialogue]]
speaker = "unk"
# メルエルが、朝の礼拝に訪れた大聖堂で、１人の少年に出会ったのだ。
line = "メルエルが、朝の礼拝に訪れた大聖堂で、１人の少年に出会ったのだ。"

[[dialogue]]
speaker = "メルエル"
# 「こ、こんにちは……わたし、メルエル！」
line = "「こ、こんにちは……わたし、メルエル！」"

[[dialogue]]
speaker = "少年"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "unk"
# 感情の起伏に乏しいその少年は、小さな声で名乗った。
line = "感情の起伏に乏しいその少年は、小さな声で名乗った。"

[[dialogue]]
speaker = "unk"
# 『緋宮クロト』と──
line = "『緋宮クロト』と──"

[[dialogue]]
speaker = "unk"
# その日から、２人は大聖堂で顔を合わせるたびに、どんどん仲良くなっていった。
line = "その日から、２人は大聖堂で顔を合わせるたびに、どんどん仲良くなっていった。"

[[dialogue]]
speaker = "ナターシャ"
# （……メルエル、すごく──楽しそう）
line = "（……メルエル、すごく──楽しそう）"

[[dialogue]]
speaker = "unk"
# ──あんな男の子の何がいいのか。いつもぼーっとしていて、面白い話なんて全然できないのに。
line = "──あんな男の子の何がいいのか。いつもぼーっとしていて、面白い話なんて全然できないのに。"

[[dialogue]]
speaker = "unk"
# メルエルは顔を真っ赤にして、とても楽しそう。
line = "メルエルは顔を真っ赤にして、とても楽しそう。"

[[dialogue]]
speaker = "ナターシャ"
# （……いらいらする）
line = "（……いらいらする）"

[[dialogue]]
speaker = "unk"
# ──自分に向けたことのない顔を、感情を、その少年に惜しみなく注ぐのが、無性に腹立たしかった。
line = "──自分に向けたことのない顔を、感情を、その少年に惜しみなく注ぐのが、無性に腹立たしかった。"

[[dialogue]]
speaker = "unk"
# ──数ヶ月後。
line = "──数ヶ月後。"

[[dialogue]]
speaker = "unk"
# 天界での政争にひと段落がついたため、メルエルは天界へと戻ってきた。
line = "天界での政争にひと段落がついたため、メルエルは天界へと戻ってきた。"

[[dialogue]]
speaker = "メルエル"
# 「それでね、ナターシャちゃん！　クロトくんがね……！！」
line = "「それでね、ナターシャちゃん！　クロトくんがね……！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「へ～、そうなんだ」
line = "「へ～、そうなんだ」"

[[dialogue]]
speaker = "unk"
# メルエルは緋宮クロトのことばかりを喋った。ナターシャは初耳だというふりをして、笑顔を貼りつかせて、相槌を打った。
line = "メルエルは緋宮クロトのことばかりを喋った。ナターシャは初耳だというふりをして、笑顔を貼りつかせて、相槌を打った。"

[[dialogue]]
speaker = "ナターシャ"
# （……話、早く終わらないかな）
line = "（……話、早く終わらないかな）"

[[dialogue]]
speaker = "ナターシャ"
# （…………全部知ってるし。あんな冴えないヤツの話なんて、キョーミないし……）
line = "（…………全部知ってるし。あんな冴えないヤツの話なんて、キョーミないし……）"

[[dialogue]]
speaker = "ナターシャ"
# （…………あんな奴より、わたしの方がメルエルのこと、よく知ってるのに……）
line = "（…………あんな奴より、わたしの方がメルエルのこと、よく知ってるのに……）"

[[dialogue]]
speaker = "メルエル"
# 「それでね、お母さんが言ってたの！　おとなになる前に、仲よしになった友だちは、おさななじみって言うんだって……！」
line = "「それでね、お母さんが言ってたの！　おとなになる前に、仲よしになった友だちは、おさななじみって言うんだって……！」"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃんとおんなじだよ！　クロトくんもね、わたしの、おさななじみ！」
line = "「ナターシャちゃんとおんなじだよ！　クロトくんもね、わたしの、おさななじみ！」"

[[dialogue]]
speaker = "ナターシャ"
# （…………たった数ヶ月、一緒に遊んだだけじゃん）
line = "（…………たった数ヶ月、一緒に遊んだだけじゃん）"

[[dialogue]]
speaker = "ナターシャ"
# （……メルエルの幼なじみは、わたしでしょ？）
line = "（……メルエルの幼なじみは、わたしでしょ？）"

[[dialogue]]
speaker = "unk"
# そのイライラを発散するために、ナターシャはいつからか、ある想像をするようになった。
line = "そのイライラを発散するために、ナターシャはいつからか、ある想像をするようになった。"

[[dialogue]]
speaker = "ナターシャ"
# （メルエルは──あのクロトとかいうヤツのことが、好き）
line = "（メルエルは──あのクロトとかいうヤツのことが、好き）"

[[dialogue]]
speaker = "ナターシャ"
# （だったら──）
line = "（だったら──）"

[[dialogue]]
speaker = "ナターシャ"
# （わたしがあいつを取っちゃったら、どんな顔するかな？　きっと大泣きするだろうなぁ）
line = "（わたしがあいつを取っちゃったら、どんな顔するかな？　きっと大泣きするだろうなぁ）"

[[dialogue]]
speaker = "unk"
# それはあまりに甘美で、癖になる想像だった。
line = "それはあまりに甘美で、癖になる想像だった。"

[[dialogue]]
speaker = "ナターシャ"
# （わたし──メルエルが泣いている顔……好きかも）
line = "（わたし──メルエルが泣いている顔……好きかも）"

[[dialogue]]
speaker = "ナターシャ"
# 「……はぁ。こんなものまで見せなくていいのに」
line = "「……はぁ。こんなものまで見せなくていいのに」"

[[dialogue]]
speaker = "ナターシャ"
# 「どう？　いい加減、愛想がつきたんじゃない？」
line = "「どう？　いい加減、愛想がつきたんじゃない？」"

[[dialogue]]
speaker = "メルエル"
# 「ううん──そんなことないよ」
line = "「ううん──そんなことないよ」"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃんの立場からしたら、悪感情を抱くのも当然かなって思うし……」
line = "「ナターシャちゃんの立場からしたら、悪感情を抱くのも当然かなって思うし……」"

[[dialogue]]
speaker = "メルエル"
# 「それに、ナターシャちゃんが思ってたことは、全部聞きたい……お話がしたいから、ついて来て欲しいって言ったんだもん！」
line = "「それに、ナターシャちゃんが思ってたことは、全部聞きたい……お話がしたいから、ついて来て欲しいって言ったんだもん！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ブレないねえ、本当に。普通ならもう、修復不可能レベルだと思うんだけど……」
line = "「ブレないねえ、本当に。普通ならもう、修復不可能レベルだと思うんだけど……」"

[[dialogue]]
speaker = "メルエル"
# 「それでも私は──」
line = "「それでも私は──」"

[[dialogue]]
speaker = "ナターシャ"
