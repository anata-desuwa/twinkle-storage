[[dialogue]]
speaker = "シャルレーヌ"
# 「な、何言ってるのあなた……ここはディアーブル家の領地よ？」
line = "「な、何言ってるのあなた……ここはディアーブル家の領地よ？」"

[[dialogue]]
speaker = "カティア"
# 「今はそうだけど、関係ないよ」
line = "「今はそうだけど、関係ないよ」"

[[dialogue]]
speaker = "カティア"
# 「だって魔王様と私で世界征服して、三界は私たちのものになるんだから」
line = "「だって魔王様と私で世界征服して、三界は私たちのものになるんだから」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「は…………？」
line = "「は…………？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「はぁーーーーーーっ！！？」
line = "「はぁーーーーーーっ！！？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「世界征服なんて本気で言ってるの……？　正気？」
line = "「世界征服なんて本気で言ってるの……？　正気？」"

[[dialogue]]
speaker = "カティア"
# 「え、うん。魔族に生まれたからには、一生に一度は世界征服してみたくない？」
line = "「え、うん。魔族に生まれたからには、一生に一度は世界征服してみたくない？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「え……そんな、旅行に行くみたいなノリで言われても…………」
line = "「え……そんな、旅行に行くみたいなノリで言われても…………」"

[[dialogue]]
speaker = "カティア"
# 「それはシャルレーヌ……様が無欲なだけじゃないですか～？」
line = "「それはシャルレーヌ……様が無欲なだけじゃないですか～？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「私が無欲ぅ！？　生まれて初めて言われたわよ！？」
line = "「私が無欲ぅ！？　生まれて初めて言われたわよ！？」"

[[dialogue]]
speaker = "シャルレーヌ"
# （いや、確かに世界征服って言ってた魔族、他にもいたけど……普通、本気だと思わないでしょ！？）
line = "（いや、確かに世界征服って言ってた魔族、他にもいたけど……普通、本気だと思わないでしょ！？）"

[[dialogue]]
speaker = "カティア"
# 「私なんか、物心ついたときから世界征服したかったですよ？　ずっとずっと昔から……」
line = "「私なんか、物心ついたときから世界征服したかったですよ？　ずっとずっと昔から……」"

[[dialogue]]
speaker = "カティア"
# 「私が生まれたのはシャリオンでも片田舎で、本当に何もないところで……見渡す限りの空と山と、あと畑が私の始まりでした」
line = "「私が生まれたのはシャリオンでも片田舎で、本当に何もないところで……見渡す限りの空と山と、あと畑が私の始まりでした」"

[[dialogue]]
speaker = "カティア"
# 「昔はひいおじいちゃんも元気で、畑仕事によくついていきました。その時、聞いたんです。ご先祖様は、魔王っていう世界で一番強い人の配下だったんだって」
line = "「昔はひいおじいちゃんも元気で、畑仕事によくついていきました。その時、聞いたんです。ご先祖様は、魔王っていう世界で一番強い人の配下だったんだって」"

[[dialogue]]
speaker = "カティア"
# 「『世界で一番強い』……その言葉に胸が躍りました」
line = "「『世界で一番強い』……その言葉に胸が躍りました」"

[[dialogue]]
speaker = "カティア"
# 「世界一有名で、みんなが尊敬して、銅像もあちこちに建ってて、思わずははーってひれ伏しちゃうような人に、私もなりたいって思いました」
line = "「世界一有名で、みんなが尊敬して、銅像もあちこちに建ってて、思わずははーってひれ伏しちゃうような人に、私もなりたいって思いました」"

[[dialogue]]
speaker = "カティア"
# 「星力に目覚めて、新星学園に留学できたときは、このまま世界で一番強くなってやるんだって本気で思ってました」
line = "「星力に目覚めて、新星学園に留学できたときは、このまま世界で一番強くなってやるんだって本気で思ってました」"

[[dialogue]]
speaker = "カティア"
# 「でも全然強くなれなくて…………世界征服なんて夢のまた夢だって諦めかけて」
line = "「でも全然強くなれなくて…………世界征服なんて夢のまた夢だって諦めかけて」"

[[dialogue]]
speaker = "カティア"
# 「そんなとき、あの人に出会ったんです！」
line = "「そんなとき、あの人に出会ったんです！」"

[[dialogue]]
speaker = "カティア"
# 「そう、魔王様に！」
line = "「そう、魔王様に！」"

[[dialogue]]
speaker = "カティア"
# 「御前試合で見事に逆転勝利……本当にかっこよかったな～～～～！！」
line = "「御前試合で見事に逆転勝利……本当にかっこよかったな～～～～！！」"

[[dialogue]]
speaker = "カティア"
# 「昔話じゃなくて、魔王様が本当にいて、本当に、本当に強くて！　すっごくすっごく嬉しかった！」
line = "「昔話じゃなくて、魔王様が本当にいて、本当に、本当に強くて！　すっごくすっごく嬉しかった！」"

[[dialogue]]
speaker = "カティア"
# 「最初はただ、魔王様に近付いて、ビッグな魔族になりたかっただけでした。でもそのうち気付いたんです」
line = "「最初はただ、魔王様に近付いて、ビッグな魔族になりたかっただけでした。でもそのうち気付いたんです」"

[[dialogue]]
speaker = "カティア"
# 「この人なら世界征服できる……ううん、この人こそ世界征服すべきだって！！」
line = "「この人なら世界征服できる……ううん、この人こそ世界征服すべきだって！！」"

[[dialogue]]
speaker = "カティア"
# 「私は魔王様の配下として、世界征服をお手伝いするんだって張り切って……でもでも、やっぱり私は魔王様と並び立てるほど強くはなくて…………」
line = "「私は魔王様の配下として、世界征服をお手伝いするんだって張り切って……でもでも、やっぱり私は魔王様と並び立てるほど強くはなくて…………」"

[[dialogue]]
speaker = "カティア"
# 「だから私は強くなりたかった。魔王様の配下として相応しいように……魔王様と一緒に世界征服できるように！」
line = "「だから私は強くなりたかった。魔王様の配下として相応しいように……魔王様と一緒に世界征服できるように！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「は、はぁ……黙って聞いてたけど、何言ってるかよく分からないわ……」
line = "「は、はぁ……黙って聞いてたけど、何言ってるかよく分からないわ……」"

[[dialogue]]
speaker = "unk"
# 呆れ戸惑うシャルレーヌを尻目に、カティアはモンスターの群れをにらむ。
line = "呆れ戸惑うシャルレーヌを尻目に、カティアはモンスターの群れをにらむ。"

[[dialogue]]
speaker = "カティア"
# 「モンスターめ……よくも、よくも……未来の魔王様と私の領地をーーーーーーっ！！！」
line = "「モンスターめ……よくも、よくも……未来の魔王様と私の領地をーーーーーーっ！！！」"

[[dialogue]]
speaker = "カティア"
# 「許さない許さない許さない……私たちの領地を滅茶苦茶にしやがってぇーーーーっ！！！」
line = "「許さない許さない許さない……私たちの領地を滅茶苦茶にしやがってぇーーーーっ！！！」"

[[dialogue]]
speaker = "カティア"
# 「世界は私と魔王様が征服するんだ……モンスターやアステラなんかに私たちの<ruby=世界>領地</ruby>をくれてやるもんかーーーーっ！！」
line = "「世界は私と魔王様が征服するんだ……モンスターやアステラなんかに私たちの<ruby>領地<rt>世界</rt></ruby>をくれてやるもんかーーーーっ！！」"

[[dialogue]]
speaker = "unk"
# カティアの咆哮が空に轟き、それに応えるかのごとく、シャルレーヌが持っていた魔本が光り出す。
line = "カティアの咆哮が空に轟き、それに応えるかのごとく、シャルレーヌが持っていた魔本が光り出す。"

[[dialogue]]
speaker = "シャルレーヌ"
# 「え……？　『強欲』の魔本が反応してる……？」
line = "「え……？　『強欲』の魔本が反応してる……？」"

[[dialogue]]
speaker = "カティア"
# 「あ、そうだ魔本！　強くなりたいからそれちょうだい！　ていうかよこせ～っ！」
line = "「あ、そうだ魔本！　強くなりたいからそれちょうだい！　ていうかよこせ～っ！」"

[[dialogue]]
speaker = "カティア"
# 「星騎士として強くなれなくてもいい！　世界征服するためなら、どんな手を使ってでも強くなってやる！」
line = "「星騎士として強くなれなくてもいい！　世界征服するためなら、どんな手を使ってでも強くなってやる！」"

[[dialogue]]
speaker = "リィベル"
# 『ようやく通信魔法が繋がったわ。状況は視ていたけど、相当厳しいようね』
line = "『ようやく通信魔法が繋がったわ。状況は視ていたけど、相当厳しいようね』"

[[dialogue]]
speaker = "リィベル"
# 『魔本が反応したのはカティア、あなたよ』
line = "『魔本が反応したのはカティア、あなたよ』"

[[dialogue]]
speaker = "カティア"
# 「ホントに！？」
line = "「ホントに！？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「うそ～～っ！？　世界征服に反応したってこと！？」
line = "「うそ～～っ！？　世界征服に反応したってこと！？」"

[[dialogue]]
speaker = "リィベル"
# 『世界征服……子どもじみた夢かもしれないけど、あなたは本気でそれを欲するの？』
line = "『世界征服……子どもじみた夢かもしれないけど、あなたは本気でそれを欲するの？』"

[[dialogue]]
speaker = "カティア"
# 「もちろん！　逆に世界征服したくない理由ってあるのかな？」
line = "「もちろん！　逆に世界征服したくない理由ってあるのかな？」"

[[dialogue]]
speaker = "リィベル"
# 『ふっ……言うわね。それでこそ魔将よ。大罪を背負うにふさわしいわ』
line = "『ふっ……言うわね。それでこそ魔将よ。大罪を背負うにふさわしいわ』"

[[dialogue]]
speaker = "リィベル"
# 『分不相応な夢を抱く弱き者よ。大きな野望を持つちっぽけなあなたを、<ruby=わたし>魔本</ruby>たちは認めるわ』
line = "『分不相応な夢を抱く弱き者よ。大きな野望を持つちっぽけなあなたを、<ruby>魔本<rt>わたし</rt></ruby>たちは認めるわ』"

[[dialogue]]
speaker = "カティア"
# 「一言どころか二言ぐらい余計なんだけど！　でももらえるものはもらう！」
line = "「一言どころか二言ぐらい余計なんだけど！　でももらえるものはもらう！」"

[[dialogue]]
speaker = "リィベル"
# 『さぁ、本を手に取って……あなたの『強欲』を世界に見せつけてやりなさい』
line = "『さぁ、本を手に取って……あなたの『強欲』を世界に見せつけてやりなさい』"

[[dialogue]]
speaker = "カティア"
# 「うん！　魔本よ、来い！」
line = "「うん！　魔本よ、来い！」"

[[dialogue]]
speaker = "unk"
# カティアが手をかざすと、シャルレーヌが持っていた『強欲』の魔本がそこに収まり、強い光を放つ。
line = "カティアが手をかざすと、シャルレーヌが持っていた『強欲』の魔本がそこに収まり、強い光を放つ。"

[[dialogue]]
speaker = "リィベル"
# 『対象者『カティア・セルベラス』、適合罪科『強欲』。……魔本、貸出承認』
line = "『対象者『カティア・セルベラス』、適合罪科『強欲』。……魔本、貸出承認』"

[[dialogue]]
speaker = "カティア"
# 「うおおおぉぉーーーーーーっ！！！」
line = "「うおおおぉぉーーーーーーっ！！！」"

[[dialogue]]
speaker = "カティア"
# 「『強欲』の魔将カティア・セルベラス、ここに見参！　世界は私と魔王様のものだぁーーっ！！」
line = "「『強欲』の魔将カティア・セルベラス、ここに見参！　世界は私と魔王様のものだぁーーっ！！」"
