[[dialogue]]
speaker = "unk"
# 第４話,悪い子サラン,P
line = "第４話,悪い子サラン,P"

[[dialogue]]
speaker = "unk"
# 星徒会室で書類を片付けていると、来客があった。高そうなスーツを着た壮年の紳士だ。
line = "星徒会室で書類を片付けていると、来客があった。高そうなスーツを着た壮年の紳士だ。"

[[dialogue]]
speaker = "スーツの男性"
# 「こんにちは。突然、訪ねてしまって申し訳ない。君が星徒会長の緋宮クロト君だね？」
line = "「こんにちは。突然、訪ねてしまって申し訳ない。君が星徒会長の緋宮クロト君だね？」"

[[dialogue]]
speaker = "スーツの男性"
# 「私は桜十路の……いや、迂遠な言い方はよそう。サランの父です。初めまして、緋宮君。会えて嬉しいよ」
line = "「私は桜十路の……いや、迂遠な言い方はよそう。サランの父です。初めまして、緋宮君。会えて嬉しいよ」"

[[dialogue]]
speaker = "unk"
# ……初めまして！
line = "……初めまして！"

[[dialogue]]
speaker = "unk"
# 思わずがばっと頭を下げる。心の準備が全くできていない。
line = "思わずがばっと頭を下げる。心の準備が全くできていない。"

[[dialogue]]
speaker = "サラン父"
# 「ははっ、そう畏まらないで。まぁ、彼女の父親だとそうもいかないかな。私も経験があるから分かるよ」
line = "「ははっ、そう畏まらないで。まぁ、彼女の父親だとそうもいかないかな。私も経験があるから分かるよ」"

[[dialogue]]
speaker = "サラン父"
# 「今日はカフェテリアの視察に来ていたんだ。ついでで申し訳ないけど、こっちにも寄らせてもらったよ」
line = "「今日はカフェテリアの視察に来ていたんだ。ついでで申し訳ないけど、こっちにも寄らせてもらったよ」"

[[dialogue]]
speaker = "unk"
# いつもお世話になってます。
line = "いつもお世話になってます。"

[[dialogue]]
speaker = "unk"
# カフェテリアの食材はもちろん、学園で使う物資は桜十路家の流通ルートで賄われている。俺たちの学園生活はこの人たちに支えられているのだ。
line = "カフェテリアの食材はもちろん、学園で使う物資は桜十路家の流通ルートで賄われている。俺たちの学園生活はこの人たちに支えられているのだ。"

[[dialogue]]
speaker = "サラン父"
# 「ああ、ありがとう。学園もカフェテリアも、活気があって私も嬉しいよ。私たちの仕事は、いつも誰かのためにあるからね」
line = "「ああ、ありがとう。学園もカフェテリアも、活気があって私も嬉しいよ。私たちの仕事は、いつも誰かのためにあるからね」"

[[dialogue]]
speaker = "サラン父"
# 「ところで最近、サランの様子が少しおかしいような気がして……何か知らないかね？」
line = "「ところで最近、サランの様子が少しおかしいような気がして……何か知らないかね？」"

[[dialogue]]
speaker = "unk"
# ……いえ、分からないです。
line = "……いえ、分からないです。"

[[dialogue]]
speaker = "unk"
# 心当たりがない。俺の前ではいつものサランだから。
line = "心当たりがない。俺の前ではいつものサランだから。"

[[dialogue]]
speaker = "サラン父"
# 「そうか、ありがとう。変な質問をしてすまないね。仕事の邪魔をしてもいけないから私は失礼するよ。気が向いたら、家にも遊びに来てね」
line = "「そうか、ありがとう。変な質問をしてすまないね。仕事の邪魔をしてもいけないから私は失礼するよ。気が向いたら、家にも遊びに来てね」"

[[dialogue]]
speaker = "unk"
# そうにこやかに言って、紳士は去っていった。
line = "そうにこやかに言って、紳士は去っていった。"

[[dialogue]]
speaker = "unk"
# 下校しながら、今日あったことをサランに伝える。
line = "下校しながら、今日あったことをサランに伝える。"

[[dialogue]]
speaker = "サラン"
# 「お父様が会長ちゃんに～？　なんかごめんね～」
line = "「お父様が会長ちゃんに～？　なんかごめんね～」"

[[dialogue]]
speaker = "unk"
# お父さんとケンカしたとか？
line = "お父さんとケンカしたとか？"

[[dialogue]]
speaker = "サラン"
# 「ううん、してないよ～。……してないんだけど、う～～ん……なんて言ったらいいかなぁ……」
line = "「ううん、してないよ～。……してないんだけど、う～～ん……なんて言ったらいいかなぁ……」"

[[dialogue]]
speaker = "サラン"
# 「お父様に謝りたくて……サラン、悪い子になっちゃったから」
line = "「お父様に謝りたくて……サラン、悪い子になっちゃったから」"

[[dialogue]]
speaker = "サラン"
# 「桜十路のお仕事は、いつも誰かのためなの～。とても大きな力があるけど、自分のためだけに使っちゃいけないんだ～。昔からのお父様との約束なの～」
line = "「桜十路のお仕事は、いつも誰かのためなの～。とても大きな力があるけど、自分のためだけに使っちゃいけないんだ～。昔からのお父様との約束なの～」"

[[dialogue]]
speaker = "サラン"
# 「桜十路はすっごくお金持ちで、世界中に繋がりがあって……世界のどんなものでも、簡単に手に入れられて……貴重なものでも、その気になれば、ひとり占めできちゃう～」
line = "「桜十路はすっごくお金持ちで、世界中に繋がりがあって……世界のどんなものでも、簡単に手に入れられて……貴重なものでも、その気になれば、ひとり占めできちゃう～」"

[[dialogue]]
speaker = "サラン"
# 「それはダメなの～。みんな不幸になっちゃうから～」
line = "「それはダメなの～。みんな不幸になっちゃうから～」"

[[dialogue]]
speaker = "unk"
# 大きな力を持つがゆえに自制が求められる──それは俺にもよく分かる。もし俺が魔王の力を我欲のために使えば、大きな混乱と破滅を招くだろう。
line = "大きな力を持つがゆえに自制が求められる──それは俺にもよく分かる。もし俺が魔王の力を我欲のために使えば、大きな混乱と破滅を招くだろう。"

[[dialogue]]
speaker = "サラン"
# 「サランもね、ずっとそうしてきたんだ～。お菓子もお料理も、誰かに喜んでもらうのが大好き～」
line = "「サランもね、ずっとそうしてきたんだ～。お菓子もお料理も、誰かに喜んでもらうのが大好き～」"

[[dialogue]]
speaker = "サラン"
# 「でも、魔将になったとき、誰の顔も浮かばなくて……サランが楽しくて、気持ちよくなるためだけに戦っちゃったんだ～」
line = "「でも、魔将になったとき、誰の顔も浮かばなくて……サランが楽しくて、気持ちよくなるためだけに戦っちゃったんだ～」"

[[dialogue]]
speaker = "サラン"
# 「あんまりよく覚えてないけど、それだけは覚えてるの～。強い力は、みんなのために使わなくちゃいけないのに……だからお父様に謝りたいんだけど、恥ずかしくって……」
line = "「あんまりよく覚えてないけど、それだけは覚えてるの～。強い力は、みんなのために使わなくちゃいけないのに……だからお父様に謝りたいんだけど、恥ずかしくって……」"

[[dialogue]]
speaker = "サラン"
# 「うまくお父様とお話できなくて、心配かけちゃった……。会長ちゃんにもうちのことで迷惑かけてごめんね～」
line = "「うまくお父様とお話できなくて、心配かけちゃった……。会長ちゃんにもうちのことで迷惑かけてごめんね～」"

[[dialogue]]
speaker = "サラン"
# 「じゃあ、今日はこれでバイバイ……」
line = "「じゃあ、今日はこれでバイバイ……」"

[[dialogue]]
speaker = "サラン"
# 「──！　モンスターだ～！　行こう、会長ちゃん！」
line = "「──！　モンスターだ～！　行こう、会長ちゃん！」"

[[dialogue]]
speaker = "unk"
# いつもはのんびりなサランも、モンスターには反応が早い。ともに駆け出す。
line = "いつもはのんびりなサランも、モンスターには反応が早い。ともに駆け出す。"

[[dialogue]]
speaker = "モンスター"
# 「ガァアアアアアッ！！」
line = "「ガァアアアアアッ！！」"

[[dialogue]]
speaker = "サラン"
# 「いた、おっきなモンスター！」
line = "「いた、おっきなモンスター！」"

[[dialogue]]
speaker = "unk"
# リクリエの元凶であるＸＥＬＯＳを倒した後も、モンスターの出現は続いている。
line = "リクリエの元凶であるＸＥＬＯＳを倒した後も、モンスターの出現は続いている。"

[[dialogue]]
speaker = "サラン"
# 「強いモンスターだから、早く倒さなきゃ……」
line = "「強いモンスターだから、早く倒さなきゃ……」"

[[dialogue]]
speaker = "サラン"
# 「ふふふ～♪　全力でいくよ～♪」
line = "「ふふふ～♪　全力でいくよ～♪」"

[[dialogue]]
speaker = "サラン"
# 「そ～れ、ホイッパースマッシュ～！」
line = "「そ～れ、ホイッパースマッシュ～！」"

[[dialogue]]
speaker = "モンスター"
# 「ガッ！？」
line = "「ガッ！？」"

[[dialogue]]
speaker = "サラン"
# 「さらに～グラトニースイートディザスタ～♪　キャンディの流星群だよ～♪」
line = "「さらに～グラトニースイートディザスタ～♪　キャンディの流星群だよ～♪」"

[[dialogue]]
speaker = "モンスター"
# 「ガァ……」
line = "「ガァ……」"

[[dialogue]]
speaker = "サラン"
# 「ふふ～♪　楽しかった～♪　でもまだまだ試したいお菓子たくさんあるんだ～」
line = "「ふふ～♪　楽しかった～♪　でもまだまだ試したいお菓子たくさんあるんだ～」"

[[dialogue]]
speaker = "unk"
# 圧倒的な力でモンスターを倒したサラン。そこには人々を守った安堵はなく、力に酔った笑みを浮かべていた。
line = "圧倒的な力でモンスターを倒したサラン。そこには人々を守った安堵はなく、力に酔った笑みを浮かべていた。"

[[dialogue]]
speaker = "サラン"
# 「ふふっ♪　これが今のサランなの～♪　悪い子でしょ～？」
line = "「ふふっ♪　これが今のサランなの～♪　悪い子でしょ～？」"

[[dialogue]]
speaker = "サラン"
# 「どう、会長ちゃん……嫌いになっちゃった？」
line = "「どう、会長ちゃん……嫌いになっちゃった？」"

[[dialogue]]
speaker = "unk"
# ううん。嫌いになんかならないよ
line = "ううん。嫌いになんかならないよ"

[[dialogue]]
speaker = "サラン"
# 「ふふ～、よかった～♪　会長ちゃんに嫌われちゃったら悲しいよ～」
line = "「ふふ～、よかった～♪　会長ちゃんに嫌われちゃったら悲しいよ～」"

[[dialogue]]
speaker = "サラン"
# 「でも、でもね……誰に嫌われても、ダメだって言われても……サランが楽しいのは本当なんだ～」
line = "「でも、でもね……誰に嫌われても、ダメだって言われても……サランが楽しいのは本当なんだ～」"

[[dialogue]]
speaker = "サラン"
# 「だから、今のサランのこと、好きじゃなくてもいいから覚えててね……？」
line = "「だから、今のサランのこと、好きじゃなくてもいいから覚えててね……？」"

[[dialogue]]
speaker = "unk"
# うん。今の君も含めてサランだから
line = "うん。今の君も含めてサランだから"

[[dialogue]]
speaker = "サラン"
# 「ありがと～<emoji=heart04>　やっぱり会長ちゃん大好き～<emoji=heart04>」
line = "「ありがと～<emoji=heart04>　やっぱり会長ちゃん大好き～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# サランはいつも誰かのために微笑んでいた。だけどその裏で眠っていた欲望が、魔将となったことで解き放たれたんだ。
line = "サランはいつも誰かのために微笑んでいた。だけどその裏で眠っていた欲望が、魔将となったことで解き放たれたんだ。"

[[dialogue]]
speaker = "unk"
# この姿も、きっと本当のサランだ。
line = "この姿も、きっと本当のサランだ。"

[[dialogue]]
speaker = "サラン"
# 「ふわぁ～……ねむたくなっちゃった…………会長ちゃん、あとおねがいね～」
line = "「ふわぁ～……ねむたくなっちゃった…………会長ちゃん、あとおねがいね～」"

[[dialogue]]
speaker = "サラン"
# 「すぅ……すぅ……」
line = "「すぅ……すぅ……」"

[[dialogue]]
speaker = "unk"
# 立ったまま寝るサランを抱き留める。いつになく強い、甘い香りにちょっと驚く。
line = "立ったまま寝るサランを抱き留める。いつになく強い、甘い香りにちょっと驚く。"

[[dialogue]]
speaker = "サラン"
# 「……えへへ～……おっきなケーキぃ……すぅ……」
line = "「……えへへ～……おっきなケーキぃ……すぅ……」"

[[dialogue]]
speaker = "unk"
# 俺のお姫様は、どんな夢を見ているのだろう。いい夢だといいなと思いながら、そっとその頭を撫でた。
line = "俺のお姫様は、どんな夢を見ているのだろう。いい夢だといいなと思いながら、そっとその頭を撫でた。"
