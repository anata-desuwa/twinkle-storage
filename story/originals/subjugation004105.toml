[[dialogue]]
speaker = "unk"
# 次の日も、クーシェンはメイド服を着て立っていた。
line = "次の日も、クーシェンはメイド服を着て立っていた。"

[[dialogue]]
speaker = "クーシェン"
# 「いててて……メイド長は鬼かよ～」
line = "「いててて……メイド長は鬼かよ～」"

[[dialogue]]
speaker = "ナミエル"
# 「鬼です」
line = "「鬼です」"

[[dialogue]]
speaker = "フェニエル"
# 「鬼って言う人もいますね」
line = "「鬼って言う人もいますね」"

[[dialogue]]
speaker = "アポロ"
# 「鬼は鬼でも、キリカはいい鬼だぞ！」
line = "「鬼は鬼でも、キリカはいい鬼だぞ！」"

[[dialogue]]
speaker = "マリオン"
# 「うふふっ、それはフォローになっていないかもしれませんね」
line = "「うふふっ、それはフォローになっていないかもしれませんね」"

[[dialogue]]
speaker = "キリカ"
# 「アポロ様がいい鬼と言って下さったのですから、いい鬼と誇れる鬼になりましょう」
line = "「アポロ様がいい鬼と言って下さったのですから、いい鬼と誇れる鬼になりましょう」"

[[dialogue]]
speaker = "フィオナ"
# 「ほ、ほどほどにしてあげてね、キリカ」
line = "「ほ、ほどほどにしてあげてね、キリカ」"

[[dialogue]]
speaker = "unk"
# クーシェンとアポロ、２人の膝は仲良く赤くなっていた。
line = "クーシェンとアポロ、２人の膝は仲良く赤くなっていた。"

[[dialogue]]
speaker = "unk"
# 理由を訊ねても、２人は笑うだけだった。
line = "理由を訊ねても、２人は笑うだけだった。"

[[dialogue]]
speaker = "クーシェン"
# 「さーて、今日もメイド修行を頑張るぞ～！」
line = "「さーて、今日もメイド修行を頑張るぞ～！」"

[[dialogue]]
speaker = "クーシェン"
# 「ということでメイドの先輩たち、ボクにビシバシ指導してよねっ」
line = "「ということでメイドの先輩たち、ボクにビシバシ指導してよねっ」"

[[dialogue]]
speaker = "ナミエル"
# 「……急にやる気を出しましたね。朝食に好物でも出たのでしょうか？」
line = "「……急にやる気を出しましたね。朝食に好物でも出たのでしょうか？」"

[[dialogue]]
speaker = "フェニエル"
# 「うーん、なんとなくだけど違うんじゃないかな……」
line = "「うーん、なんとなくだけど違うんじゃないかな……」"

[[dialogue]]
speaker = "ナミエル"
# 「まあ、やる気を出してくれたのはよいことです。相手が見習いメイドとは言え、こちらは指導役に選ばれた先輩ですから、しっかり励みましょう」
line = "「まあ、やる気を出してくれたのはよいことです。相手が見習いメイドとは言え、こちらは指導役に選ばれた先輩ですから、しっかり励みましょう」"

[[dialogue]]
speaker = "クーシェン"
# 「よろしくお願いしますっ、ナミエル先輩！　フェニエル先輩！」
line = "「よろしくお願いしますっ、ナミエル先輩！　フェニエル先輩！」"

[[dialogue]]
speaker = "ナミエル"
# 「お、おお……ここまで素直にされると、なんだか可愛く感じてきましたね」
line = "「お、おお……ここまで素直にされると、なんだか可愛く感じてきましたね」"

[[dialogue]]
speaker = "アポロ"
# 「クーシェンばっかズルいぞ～！　あたしももっと厳しく教えてくれよな！」
line = "「クーシェンばっかズルいぞ～！　あたしももっと厳しく教えてくれよな！」"

[[dialogue]]
speaker = "ナミエル"
# 「お任せ下さい。さあ、フニさまもご一緒に」
line = "「お任せ下さい。さあ、フニさまもご一緒に」"

[[dialogue]]
speaker = "unk"
# こうして心を入れ替えたクーシェンは、メイド修行に邁進するのだった。
line = "こうして心を入れ替えたクーシェンは、メイド修行に邁進するのだった。"

[[dialogue]]
speaker = "ナミエル"
# 「クーシェンさんは基礎からやり直しましょう。ですよね、マリオンさん」
line = "「クーシェンさんは基礎からやり直しましょう。ですよね、マリオンさん」"

[[dialogue]]
speaker = "マリオン"
# 「そうですね、てんでダメダメでしたから……」
line = "「そうですね、てんでダメダメでしたから……」"

[[dialogue]]
speaker = "クーシェン"
# 「ボクってばそんなにダメダメだったの？」
line = "「ボクってばそんなにダメダメだったの？」"

[[dialogue]]
speaker = "マリオン"
# 「論より証拠、そうですね……フェニエルさん、少し歩いてみてもらえますか？」
line = "「論より証拠、そうですね……フェニエルさん、少し歩いてみてもらえますか？」"

[[dialogue]]
speaker = "フェニエル"
# 「は、はい。歩くだけでいいんですよね」
line = "「は、はい。歩くだけでいいんですよね」"

[[dialogue]]
speaker = "ナミエル"
# 「クーシェンさんはフニさまをよく見ていて下さい」
line = "「クーシェンさんはフニさまをよく見ていて下さい」"

[[dialogue]]
speaker = "クーシェン"
# 「う、うん……って……フェニエル先輩、なんかすごくない？　歩いてるだけなのに、オーラがあるっていうか……」
line = "「う、うん……って……フェニエル先輩、なんかすごくない？　歩いてるだけなのに、オーラがあるっていうか……」"

[[dialogue]]
speaker = "フェニエル"
# 「えへへ～、そうですかねぇ？」
line = "「えへへ～、そうですかねぇ？」"

[[dialogue]]
speaker = "ナミエル"
# 「星見家のメイドなら、このくらい出来て当たり前です」
line = "「星見家のメイドなら、このくらい出来て当たり前です」"

[[dialogue]]
speaker = "アポロ"
# 「あたしも出来るぞ！　ほらほら～」
line = "「あたしも出来るぞ！　ほらほら～」"

[[dialogue]]
speaker = "フィオナ"
# 「姉さんさすがです、バッチリですよ」
line = "「姉さんさすがです、バッチリですよ」"

[[dialogue]]
speaker = "アポロ"
# 「いや、あたしもまだまだだ。フェニエルのほうがずっときれいな歩き方だしな」
line = "「いや、あたしもまだまだだ。フェニエルのほうがずっときれいな歩き方だしな」"

[[dialogue]]
speaker = "クーシェン"
# 「それでもボクより全然かっこいいよ！　フェニエル先輩みたいには出来ないし、アポロに教えて欲しいな～って」
line = "「それでもボクより全然かっこいいよ！　フェニエル先輩みたいには出来ないし、アポロに教えて欲しいな～って」"

[[dialogue]]
speaker = "アポロ"
# 「じゃあ、一緒にやってみよう」
line = "「じゃあ、一緒にやってみよう」"

[[dialogue]]
speaker = "クーシェン"
# 「こ、こんな感じ？　意識して歩くのって結構ムズいな～」
line = "「こ、こんな感じ？　意識して歩くのって結構ムズいな～」"

[[dialogue]]
speaker = "アポロ"
# 「スカートのすそを気にするといいぞ。ぺろんってならないように足を動かすんだ」
line = "「スカートのすそを気にするといいぞ。ぺろんってならないように足を動かすんだ」"

[[dialogue]]
speaker = "クーシェン"
# 「な、なるほど……おー、確かにいい感じかも……」
line = "「な、なるほど……おー、確かにいい感じかも……」"

[[dialogue]]
speaker = "アポロ"
# 「すごいな！　一瞬でこんなによくなってる！」
line = "「すごいな！　一瞬でこんなによくなってる！」"

[[dialogue]]
speaker = "クーシェン"
# 「アポロのアドバイスのおかげだってば～」
line = "「アポロのアドバイスのおかげだってば～」"

[[dialogue]]
speaker = "アポロ"
# 「こいつはうかうかしてらんないな。のんびりしてたらあっという間に追い越されちゃいそうだ」
line = "「こいつはうかうかしてらんないな。のんびりしてたらあっという間に追い越されちゃいそうだ」"

[[dialogue]]
speaker = "クーシェン"
# 「ふっふーん、すぐに追い越す予定だから覚悟してよね～」
line = "「ふっふーん、すぐに追い越す予定だから覚悟してよね～」"

[[dialogue]]
speaker = "アポロ"
# 「どっちがすごいメイドになるか、勝負だ！」
line = "「どっちがすごいメイドになるか、勝負だ！」"

[[dialogue]]
speaker = "クーシェン"
# 「うん！」
line = "「うん！」"

[[dialogue]]
speaker = "unk"
# クーシェンがやる気を出し、アポロが触発される。互いを高め合う好循環が発生していた。
line = "クーシェンがやる気を出し、アポロが触発される。互いを高め合う好循環が発生していた。"
