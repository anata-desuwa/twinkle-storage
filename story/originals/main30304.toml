[[dialogue]]
speaker = "unk"
# 第４話,『ママならぬ存在』,B
line = "第４話,『ママならぬ存在』,B"

[[dialogue]]
speaker = "unk"
# ルヴィネが次に向かったのは九浄家だった。
line = "ルヴィネが次に向かったのは九浄家だった。"

[[dialogue]]
speaker = "unk"
# そこに集いしは当主ヘレナ、そして魔界・キュリオスの女帝である<ruby=こうれい>煌嶺</ruby>──
line = "そこに集いしは当主ヘレナ、そして魔界・キュリオスの女帝である<ruby>煌嶺<rt>こうれい</rt></ruby>──"

[[dialogue]]
speaker = "unk"
# 名だたる面々が、今後の世界について議論を交わしている。
line = "名だたる面々が、今後の世界について議論を交わしている。"

[[dialogue]]
speaker = "紅明"
# 「あれが<ruby=こうれい>煌嶺</ruby>さんか～☆　魔界での噂は聞いたことあったけど、噂以上におっかなさそうな人って雰囲気するねえ」
line = "「あれが<ruby>煌嶺<rt>こうれい</rt></ruby>さんか～☆　魔界での噂は聞いたことあったけど、噂以上におっかなさそうな人って雰囲気するねえ」"

[[dialogue]]
speaker = "紅明"
# 「大物揃い踏みって感じでいかにもヤバげ！　ルヴィっち、大丈夫かな～？」
line = "「大物揃い踏みって感じでいかにもヤバげ！　ルヴィっち、大丈夫かな～？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ルヴィネさまなら心配いらないと思うのだけど……むぅ」
line = "「ルヴィネさまなら心配いらないと思うのだけど……むぅ」"

[[dialogue]]
speaker = "紅明"
# 「？　どしたん、セッシー？」
line = "「？　どしたん、セッシー？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「なんでもないわ」
line = "「なんでもないわ」"

[[dialogue]]
speaker = "紅明"
# 「そう？　なんかセッシーにしては、眉間にシワ寄ってる気もするけど……あ、元気不足ならホルスタミン飲む？」
line = "「そう？　なんかセッシーにしては、眉間にシワ寄ってる気もするけど……あ、元気不足ならホルスタミン飲む？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふふっ、気遣いありがとう紅明ママ。でも大丈夫よ」
line = "「ふふっ、気遣いありがとう紅明ママ。でも大丈夫よ」"

[[dialogue]]
speaker = "unk"
# と、２人で遠巻きにその様子を見守っていると……。
line = "と、２人で遠巻きにその様子を見守っていると……。"

[[dialogue]]
speaker = "ヘレナ"
# 「──ふむ。紅明、それにセシアよ。貴殿らも来ていたのだな」
line = "「──ふむ。紅明、それにセシアよ。貴殿らも来ていたのだな」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あら、ヘレナちゃん」
line = "「あら、ヘレナちゃん」"

[[dialogue]]
speaker = "紅明"
# 「おーヘレナちゃんだ！　あっちは２人きりにしていいの？」
line = "「おーヘレナちゃんだ！　あっちは２人きりにしていいの？」"

[[dialogue]]
speaker = "ヘレナ"
# 「ルヴィネ殿であれば問題なかろう。万が一、不穏な気配を感じ取ったらば私が介入すればよい」
line = "「ルヴィネ殿であれば問題なかろう。万が一、不穏な気配を感じ取ったらば私が介入すればよい」"

[[dialogue]]
speaker = "ヘレナ"
# 「それよりもセシアよ……どうかな？」
line = "「それよりもセシアよ……どうかな？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「どうって？」
line = "「どうって？」"

[[dialogue]]
speaker = "ヘレナ"
# 「貴殿の求める『ママ』のことだ。煌嶺殿──いささかクセがあるとはいえ、ヒトとしての度量は超常の域に達している」
line = "「貴殿の求める『ママ』のことだ。煌嶺殿──いささかクセがあるとはいえ、ヒトとしての度量は超常の域に達している」"

[[dialogue]]
speaker = "ヘレナ"
# 「貴殿のお眼鏡にはかなわぬか？」
line = "「貴殿のお眼鏡にはかなわぬか？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ん～……残念だけれど、煌嶺はわたくしのママではないわ」
line = "「ん～……残念だけれど、煌嶺はわたくしのママではないわ」"

[[dialogue]]
speaker = "ヘレナ"
# 「ほう」
line = "「ほう」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「彼女はむしろ……ママとは対極にある存在のように感じるわね」
line = "「彼女はむしろ……ママとは対極にある存在のように感じるわね」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そもそもヘレナちゃんだって、本気で煌嶺がママだとは思っていないでしょう？」
line = "「そもそもヘレナちゃんだって、本気で煌嶺がママだとは思っていないでしょう？」"

[[dialogue]]
speaker = "ヘレナ"
# 「はっはっはっ、それはそうだ。ただ……セシアの審美眼には驚かされることも多いからな。貴殿の煌嶺評を聞いておきたかっただけだ」
line = "「はっはっはっ、それはそうだ。ただ……セシアの審美眼には驚かされることも多いからな。貴殿の煌嶺評を聞いておきたかっただけだ」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむ、どうやらママ成分が不足しているようだな」
line = "「うむ、どうやらママ成分が不足しているようだな」"

[[dialogue]]
speaker = "ヘレナ"
# 「ならば、この九浄ヘレナちゃんの胸に飛び込んできてくれてもいいのだぞ。何しろヴィーナスという娘を持つ、正真正銘のママだからな！」
line = "「ならば、この九浄ヘレナちゃんの胸に飛び込んできてくれてもいいのだぞ。何しろヴィーナスという娘を持つ、正真正銘のママだからな！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「う～ん……ヘレナちゃんは確かに器こそ大きいのだけれど、どこか安心できないのよ。何か企んでいそうで」
line = "「う～ん……ヘレナちゃんは確かに器こそ大きいのだけれど、どこか安心できないのよ。何か企んでいそうで」"

[[dialogue]]
speaker = "ヘレナ"
# 「あっはっは、なんと失礼な」
line = "「あっはっは、なんと失礼な」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ママに不可欠なのは『無償の愛』よ」
line = "「ママに不可欠なのは『無償の愛』よ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ヘレナちゃんの場合、愛の深さや多さは申し分ないけれど、それは『相手がもたらす成果への期待』という側面が大きいわ」
line = "「ヘレナちゃんの場合、愛の深さや多さは申し分ないけれど、それは『相手がもたらす成果への期待』という側面が大きいわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「新しい生命を迎え入れ、受け入れる……オギャりたくなるようなバブみとは、少々性質が違うわ」
line = "「新しい生命を迎え入れ、受け入れる……オギャりたくなるようなバブみとは、少々性質が違うわ」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふむ。奥が深いな。しかし実際、この疲れた現代社会に必要なものやもしれぬ。何か商売に活かせないだろうか……」
line = "「ふむ。奥が深いな。しかし実際、この疲れた現代社会に必要なものやもしれぬ。何か商売に活かせないだろうか……」"

[[dialogue]]
speaker = "紅明"
# 「やっぱりすぐ何か企むじゃん、ヘレナちゃん！」
line = "「やっぱりすぐ何か企むじゃん、ヘレナちゃん！」"

[[dialogue]]
speaker = "unk"
# と、そこで煌嶺がヘレナを呼ぶ声が聞こえてきた。
line = "と、そこで煌嶺がヘレナを呼ぶ声が聞こえてきた。"

[[dialogue]]
speaker = "unk"
# 煌嶺の声は、一度聞いただけでは、無邪気な少女のような声に聞こえる。
line = "煌嶺の声は、一度聞いただけでは、無邪気な少女のような声に聞こえる。"

[[dialogue]]
speaker = "unk"
# しかし、ヘレナの表情が瞬間、引き締まる。
line = "しかし、ヘレナの表情が瞬間、引き締まる。"

[[dialogue]]
speaker = "ヘレナ"
# 「──おっと、お呼びか。すまぬな、少々抜けるぞ」
line = "「──おっと、お呼びか。すまぬな、少々抜けるぞ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「紅明ママ～。わたくし、ちょっと疲れてしまったわ。お庭に出ましょう？」
line = "「紅明ママ～。わたくし、ちょっと疲れてしまったわ。お庭に出ましょう？」"

[[dialogue]]
speaker = "紅明"
# 「オッケー☆　じゃ、後でルヴィっちと合流しよっか」
line = "「オッケー☆　じゃ、後でルヴィっちと合流しよっか」"

[[dialogue]]
speaker = "unk"
# セシアと紅明はルヴィネを待つ間、２人だけの時間を楽しむ。
line = "セシアと紅明はルヴィネを待つ間、２人だけの時間を楽しむ。"

[[dialogue]]
speaker = "unk"
# そして──
line = "そして──"

[[dialogue]]
speaker = "ルヴィネ"
# 「──お待たせ、２人とも」
line = "「──お待たせ、２人とも」"

[[dialogue]]
speaker = "紅明"
# 「お、ルヴィっち。いいよー、アタシらはルヴィっちについてくのが今日の仕事だからね♪」
line = "「お、ルヴィっち。いいよー、アタシらはルヴィっちについてくのが今日の仕事だからね♪」"

[[dialogue]]
speaker = "紅明"
# 「にしても、これまでで一番時間かかったかな？　やっぱり、それだけ重要な話だったカンジ？」
line = "「にしても、これまでで一番時間かかったかな？　やっぱり、それだけ重要な話だったカンジ？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「重要かどうかというよりも、やっぱり煌嶺は一筋縄ではいかない相手だったから、かしら。多少は親しくなったような気がしていたのだけれどね」
line = "「重要かどうかというよりも、やっぱり煌嶺は一筋縄ではいかない相手だったから、かしら。多少は親しくなったような気がしていたのだけれどね」"

[[dialogue]]
speaker = "ルヴィネ"
# 「まあいいわ。気を取り直して次の目的地へ向かいましょう。残りのスケジュールもぎっちり詰まっているわ」
line = "「まあいいわ。気を取り直して次の目的地へ向かいましょう。残りのスケジュールもぎっちり詰まっているわ」"
