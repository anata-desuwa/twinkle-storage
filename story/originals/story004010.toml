[[dialogue]]
speaker = "蘭美"
# 「……そういうことだったのね」
line = "「……そういうことだったのね」"

[[dialogue]]
speaker = "シュティレ"
# 「合点がいきました。シュティレが特別恨まれていたのは……」
line = "「合点がいきました。シュティレが特別恨まれていたのは……」"

[[dialogue]]
speaker = "シエスタ"
# 「あの悪の親玉、アニマの弟子だから……！」
line = "「あの悪の親玉、アニマの弟子だから……！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「私と蘭美様を、無事に帰してやると言ったのも……」
line = "「私と蘭美様を、無事に帰してやると言ったのも……」"

[[dialogue]]
speaker = "シエスタ"
# 「メイドのウサギは、お兄ちゃんをお世話してたの。光の魔女も、疲れたお兄ちゃんを魔法で癒やしてたの。だから、敵じゃないの……」
line = "「メイドのウサギは、お兄ちゃんをお世話してたの。光の魔女も、疲れたお兄ちゃんを魔法で癒やしてたの。だから、敵じゃないの……」"

[[dialogue]]
speaker = "シエスタ"
# 「……ごめんなさい、お兄ちゃん。シスは、本当は……お兄ちゃんの妹じゃないの……」
line = "「……ごめんなさい、お兄ちゃん。シスは、本当は……お兄ちゃんの妹じゃないの……」"

[[dialogue]]
speaker = "シエスタ"
# 「それどころか、ヒトでもないの。『支配』の力で、悪いこともしたの……」
line = "「それどころか、ヒトでもないの。『支配』の力で、悪いこともしたの……」"

[[dialogue]]
speaker = "シエスタ"
# 「ごめんなさいなの……も、もう──クロトさんの、前には、現れないから……」
line = "「ごめんなさいなの……も、もう──クロトさんの、前には、現れないから……」"

[[dialogue]]
speaker = "unk"
# いつでもおいで、シス
line = "いつでもおいで、シス"

[[dialogue]]
speaker = "シエスタ"
# 「──────えっ？」
line = "「──────えっ？」"

[[dialogue]]
speaker = "unk"
# 妹のやったことだ、許してあげないとね
line = "妹のやったことだ、許してあげないとね"

[[dialogue]]
speaker = "unk"
# 誘拐は確かに悪いことだけど……
line = "誘拐は確かに悪いことだけど……"

[[dialogue]]
speaker = "シエスタ"
# 「い、いい……の……？」
line = "「い、いい……の……？」"

[[dialogue]]
speaker = "unk"
# 確かにシエスタの取った行動は、間違っていた。
line = "確かにシエスタの取った行動は、間違っていた。"

[[dialogue]]
speaker = "unk"
# けれど──この遊園地に囚われている間、俺が星徒会長の激務から解放されていたのも事実。
line = "けれど──この遊園地に囚われている間、俺が星徒会長の激務から解放されていたのも事実。"

[[dialogue]]
speaker = "unk"
# そのドタバタな感じも、嫌じゃないんだ
line = "そのドタバタな感じも、嫌じゃないんだ"

[[dialogue]]
speaker = "unk"
# 確かに大変な日々だけど……
line = "確かに大変な日々だけど……"

[[dialogue]]
speaker = "シエスタ"
# 「…………うん」
line = "「…………うん」"

[[dialogue]]
speaker = "unk"
# 今度は普通に会いに来なよ。歓迎するから
line = "今度は普通に会いに来なよ。歓迎するから"

[[dialogue]]
speaker = "シエスタ"
# 「……お、お兄ちゃん」
line = "「……お、お兄ちゃん」"

[[dialogue]]
speaker = "unk"
# お兄ちゃん、嬉しいよ
line = "お兄ちゃん、嬉しいよ"

[[dialogue]]
speaker = "unk"
# 心配してくれてありがとう、シス
line = "心配してくれてありがとう、シス"

[[dialogue]]
speaker = "シエスタ"
# 「う……うぅぅうう……！！」
line = "「う……うぅぅうう……！！」"

[[dialogue]]
speaker = "シエスタ"
# 「ありがとうなの……お兄ちゃん……」
line = "「ありがとうなの……お兄ちゃん……」"

[[dialogue]]
speaker = "ダッチ"
# 「フフフフ！　これにて一件落着ですねぇ！！」
line = "「フフフフ！　これにて一件落着ですねぇ！！」"

[[dialogue]]
speaker = "シュティレ"
# 「……大変な借りができてしまいましたね、ダッチに」
line = "「……大変な借りができてしまいましたね、ダッチに」"

[[dialogue]]
speaker = "unk"
# 何てことだ……
line = "何てことだ……"

[[dialogue]]
speaker = "ダッチ"
# 「ヌフフ！　無事に緋宮クロト様は救出でき、シスも無力化できた……！　私の邪魔立てをする相手はもはやいない！！」
line = "「ヌフフ！　無事に緋宮クロト様は救出でき、シスも無力化できた……！　私の邪魔立てをする相手はもはやいない！！」"

[[dialogue]]
speaker = "蘭美"
# 「ま、まさかっ！？」
line = "「ま、まさかっ！？」"

[[dialogue]]
speaker = "ダッチ"
# 「欲を言えば今すぐにでも、女体化バニークロト様をお持ち帰り。といきたいですが……流石に今は消耗も激しい。またの機会といたしましょう！」
line = "「欲を言えば今すぐにでも、女体化バニークロト様をお持ち帰り。といきたいですが……流石に今は消耗も激しい。またの機会といたしましょう！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ほっ……」
line = "「ほっ……」"

[[dialogue]]
speaker = "ダッチ"
# 「それでは皆様！　また会う日までッ！！」
line = "「それでは皆様！　また会う日までッ！！」"

[[dialogue]]
speaker = "ダッチ"
# 「おっと──忘れておりました。お別れの前に、今回の功労者である私を労ってはいただけませんか、緋宮クロト様？」
line = "「おっと──忘れておりました。お別れの前に、今回の功労者である私を労ってはいただけませんか、緋宮クロト様？」"

[[dialogue]]
speaker = "ダッチ"
# 「『ダッチ様、ありがとうぴょん♪』なぁんて言っていただけると嬉しいのですが！？」
line = "「『ダッチ様、ありがとうぴょん♪』なぁんて言っていただけると嬉しいのですが！？」"

[[dialogue]]
speaker = "unk"
# 言うわけないだろ！　この野郎！！
line = "言うわけないだろ！　この野郎！！"

[[dialogue]]
speaker = "ダッチ"
# 「フハハハハ！！　では、次の楽しみに取っておくとしましょうッ！」
line = "「フハハハハ！！　では、次の楽しみに取っておくとしましょうッ！」"

[[dialogue]]
speaker = "ダッチ"
# 「さらばです、子ウサギの皆様！　そしてシス！！　また会う日まで────！！」
line = "「さらばです、子ウサギの皆様！　そしてシス！！　また会う日まで────！！」"

[[dialogue]]
speaker = "unk"
# そうしてダッチは、姿を消して──
line = "そうしてダッチは、姿を消して──"

[[dialogue]]
speaker = "シュティレ"
# 「……！　シエスタの改造アステラが、解除された？」
line = "「……！　シエスタの改造アステラが、解除された？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「そのようですね。ああ、平和な日常の光景です！」
line = "「そのようですね。ああ、平和な日常の光景です！」"

[[dialogue]]
speaker = "蘭美"
# 「ぴょんっ！？　は、はやく変身を解かなきゃ！　遊園地のお客に見られちゃうぴょんっ！！」
line = "「ぴょんっ！？　は、はやく変身を解かなきゃ！　遊園地のお客に見られちゃうぴょんっ！！」"

[[dialogue]]
speaker = "シュティレ"
# 「む──会長の姿が……！！」
line = "「む──会長の姿が……！！」"

[[dialogue]]
speaker = "unk"
# あれ──俺、男に戻ってる！？
line = "あれ──俺、男に戻ってる！？"

[[dialogue]]
speaker = "シエスタ"
# 「……ダッチの好きにはさせないの。元の姿に戻しておいてあげたの、お兄ちゃん」
line = "「……ダッチの好きにはさせないの。元の姿に戻しておいてあげたの、お兄ちゃん」"

[[dialogue]]
speaker = "unk"
# シス！？　あれ、どこに……！？
line = "シス！？　あれ、どこに……！？"

[[dialogue]]
speaker = "シエスタ"
# 「お兄ちゃんが許してくれたのは嬉しいの。でも……悪いことしたのは、事実なの」
line = "「お兄ちゃんが許してくれたのは嬉しいの。でも……悪いことしたのは、事実なの」"

[[dialogue]]
speaker = "シエスタ"
# 「しばらく、ちゃんと反省するの。だから……」
line = "「しばらく、ちゃんと反省するの。だから……」"

[[dialogue]]
speaker = "シエスタ"
# 「……ばいばいなの、お兄ちゃん」
line = "「……ばいばいなの、お兄ちゃん」"
