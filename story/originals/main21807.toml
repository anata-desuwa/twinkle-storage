line = "「姫様──！！」"

[[dialogue]]
speaker = "？？？"
# 「壊す、壊す、壊す、壊す、壊す──」
line = "「壊す、壊す、壊す、壊す、壊す──」"

[[dialogue]]
speaker = "メルエル"
# （なに……今の……）
line = "（なに……今の……）"

[[dialogue]]
speaker = "unk"
# 数多の人々を襲い続けていたのは、誰？
line = "数多の人々を襲い続けていたのは、誰？"

[[dialogue]]
speaker = "unk"
# 瘴気に呑まれ、破滅を望んでいたのは──
line = "瘴気に呑まれ、破滅を望んでいたのは──"

[[dialogue]]
speaker = "メルエル"
# （わた、し……？）
line = "（わた、し……？）"

[[dialogue]]
speaker = "ケイティ"
# 「……ぅ、ぁっ……！！」
line = "「……ぅ、ぁっ……！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「──見事だったわ、衛兵隊長。使徒メルエルの駒として、お前の影を作ることも検討しましょうか」
line = "「──見事だったわ、衛兵隊長。使徒メルエルの駒として、お前の影を作ることも検討しましょうか」"

[[dialogue]]
speaker = "ケイティ"
# 「ごめん、ねっ……２人、とも……」
line = "「ごめん、ねっ……２人、とも……」"

[[dialogue]]
speaker = "ナターシャ"
# 「ケイティ、姉、さん……！」
line = "「ケイティ、姉、さん……！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「聖庭園最強の星騎士の実力、堪能させてもらったわ。模造品とはいえ、使徒たちを葬るだけはある」
line = "「聖庭園最強の星騎士の実力、堪能させてもらったわ。模造品とはいえ、使徒たちを葬るだけはある」"

[[dialogue]]
speaker = "ナターシャ"
# 「おぉおおっ──！！」
line = "「おぉおおっ──！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「まだ来るの？　鬱陶しいわね──」
line = "「まだ来るの？　鬱陶しいわね──」"

[[dialogue]]
speaker = "ナターシャ"
# 「ぁっ──ぐ、ぁっ…………！！」
line = "「ぁっ──ぐ、ぁっ…………！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「仕留めるつもりで放ったのだけど、よく耐えたわね？　星騎士の強さは精神力。そのことは知っているつもりだったけれど……」
line = "「仕留めるつもりで放ったのだけど、よく耐えたわね？　星騎士の強さは精神力。そのことは知っているつもりだったけれど……」"

[[dialogue]]
speaker = "ラストナンバー"
# 「本来なら、とうの昔に戦闘不能になっているはず……ふふ。貴女にも少し、興味が出てきたわ」
line = "「本来なら、とうの昔に戦闘不能になっているはず……ふふ。貴女にも少し、興味が出てきたわ」"

[[dialogue]]
speaker = "ナターシャ"
# 「何を、言ってるの……」
line = "「何を、言ってるの……」"

[[dialogue]]
speaker = "ラストナンバー"
# 「聞かせて頂戴？　貴女は、姫咲メルエルが嫌いだったのよね？」
line = "「聞かせて頂戴？　貴女は、姫咲メルエルが嫌いだったのよね？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「神殿にいる間、私にも貴女の過去は共有されていたわ。全て見せてもらった」
line = "「神殿にいる間、私にも貴女の過去は共有されていたわ。全て見せてもらった」"

[[dialogue]]
speaker = "ラストナンバー"
# 「あの能天気な魔王の血統さえいなければ、もっと自由に生きることができたのに──」
line = "「あの能天気な魔王の血統さえいなければ、もっと自由に生きることができたのに──」"

[[dialogue]]
speaker = "ラストナンバー"
# 「母さんとの仲だって、もっと真っ当だったかもしれないのに──」
line = "「母さんとの仲だって、もっと真っ当だったかもしれないのに──」"

[[dialogue]]
speaker = "ラストナンバー"
# 「いなくなれ。消えてしまえ──そう何度も思っていたのに……なぜ今は、命を懸けてまで抵抗するの？」
line = "「いなくなれ。消えてしまえ──そう何度も思っていたのに……なぜ今は、命を懸けてまで抵抗するの？」"

[[dialogue]]
speaker = "ナターシャ"
# 「何を、くだらないことを、グダグダと……！」
line = "「何を、くだらないことを、グダグダと……！」"

[[dialogue]]
speaker = "ナターシャ"
# 「知った風な口、利かないでくれる！？　勝手に覗き見て、勝手に決めつけて──不愉快なんだけど！？」
line = "「知った風な口、利かないでくれる！？　勝手に覗き見て、勝手に決めつけて──不愉快なんだけど！？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「気になるのよ。今の貴女はとても強い。だから不思議でならないの」
line = "「気になるのよ。今の貴女はとても強い。だから不思議でならないの」"

[[dialogue]]
speaker = "ラストナンバー"
# 「命を懸けてまで、嫌いな相手を守りたいだなんて……理解が出来ない」
line = "「命を懸けてまで、嫌いな相手を守りたいだなんて……理解が出来ない」"

[[dialogue]]
speaker = "ラストナンバー"
# 「私は新たな女神として、たくさんのことを学ばなければならない。理解できないものは、できる限り繙いて、知識としなくてはね？」
line = "「私は新たな女神として、たくさんのことを学ばなければならない。理解できないものは、できる限り繙いて、知識としなくてはね？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「貴女が命を懸ける理由……己の役割に、誇りを持っている？　これなら理解できる。私もお父様の命令は、命を捨ててでも叶えたいもの」
line = "「貴女が命を懸ける理由……己の役割に、誇りを持っている？　これなら理解できる。私もお父様の命令は、命を捨ててでも叶えたいもの」"

[[dialogue]]
speaker = "ナターシャ"
# 「はぁ！？　聖庭園の命令なんて、どうでもいい！　エージェントなんて、いつ辞めようかって思ってるくらいだよ！」
line = "「はぁ！？　聖庭園の命令なんて、どうでもいい！　エージェントなんて、いつ辞めようかって思ってるくらいだよ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエルだって嫌い！　母さんと同じくらい──大嫌い！！」
line = "「メルエルだって嫌い！　母さんと同じくらい──大嫌い！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「なら、どうして？　興味が尽きないわ。教えて頂戴？」
line = "「なら、どうして？　興味が尽きないわ。教えて頂戴？」"

[[dialogue]]
speaker = "ナターシャ"
# 「このぉっ──！！」
line = "「このぉっ──！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「見なさい、姫咲メルエルの顔を。瘴気に呑まれて、とても苦しんでいる」
line = "「見なさい、姫咲メルエルの顔を。瘴気に呑まれて、とても苦しんでいる」"

[[dialogue]]
speaker = "ラストナンバー"
# 「あの子の泣いている顔が好きだって、そう言っていたでしょう？」
line = "「あの子の泣いている顔が好きだって、そう言っていたでしょう？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「なのに散乃ナターシャ。今の貴女はなぜそんなにも、面白くなさそうな──辛そうな顔をしているのかしら？」
line = "「なのに散乃ナターシャ。今の貴女はなぜそんなにも、面白くなさそうな──辛そうな顔をしているのかしら？」"

[[dialogue]]
speaker = "ナターシャ"
# 「うっざ──今のメルエルを見たって、嫌な気分になるだけだっての！！」
line = "「うっざ──今のメルエルを見たって、嫌な気分になるだけだっての！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエルの泣いてる顔は好きだよ──せいせいするから！　ざまあみろって思えて、楽しいから！」
line = "「メルエルの泣いてる顔は好きだよ──せいせいするから！　ざまあみろって思えて、楽しいから！」"

[[dialogue]]
speaker = "ナターシャ"
# 「でもね──そんな捻くれた私でも……！」
line = "「でもね──そんな捻くれた私でも……！」"

[[dialogue]]
speaker = "ナターシャ"
# 「気に入る泣き顔と、気に入らない泣き顔ってのがあるの──！！」
line = "「気に入る泣き顔と、気に入らない泣き顔ってのがあるの──！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「──結論、ヒトは不可解。不完全な生命だもの、理屈で説明しろと言う方が無理な話だったわね」
line = "「──結論、ヒトは不可解。不完全な生命だもの、理屈で説明しろと言う方が無理な話だったわね」"

[[dialogue]]
speaker = "ラストナンバー"
# 「もういいわ──消えなさい」
line = "「もういいわ──消えなさい」"

[[dialogue]]
speaker = "unk"
# 極大の霊力が束となって、ナターシャの全身を直撃する──
line = "極大の霊力が束となって、ナターシャの全身を直撃する──"

[[dialogue]]
speaker = "unk"
# 神殿の床を滑るように転がって、瘴気に苦しむメルエルのすぐそばまで、ナターシャは吹き飛ばされた。
line = "神殿の床を滑るように転がって、瘴気に苦しむメルエルのすぐそばまで、ナターシャは吹き飛ばされた。"

[[dialogue]]
speaker = "メルエル"
# 「ナ、ターシャ、ちゃんっ……逃げ、てっ……」
line = "「ナ、ターシャ、ちゃんっ……逃げ、てっ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「……あん、た……こんな、時にね……」
line = "「……あん、た……こんな、時にね……」"

[[dialogue]]
speaker = "メルエル"
# 「ケイティ、お姉ちゃんと、一緒に……何とか、外に出てっ……人間界、に……」
line = "「ケイティ、お姉ちゃんと、一緒に……何とか、外に出てっ……人間界、に……」"

[[dialogue]]
speaker = "unk"
# ラストナンバーには敵わない。自分を見捨てて、緋宮クロトのもとへ。
