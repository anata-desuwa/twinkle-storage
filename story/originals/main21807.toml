[[dialogue]]
speaker = "ナターシャ"
# 「…………ほんっとうに……嫌い……」
line = "「…………ほんっとうに……嫌い……」"

[[dialogue]]
speaker = "ナターシャ"
# 「ヒトの気持ちも知らないで……危なっかしくて……自分のことは、いつも、後回し……」
line = "「ヒトの気持ちも知らないで……危なっかしくて……自分のことは、いつも、後回し……」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエルが……魔王なんかじゃ、なかったら……こんな風に、悩まなくて、すんだのに……」
line = "「メルエルが……魔王なんかじゃ、なかったら……こんな風に、悩まなくて、すんだのに……」"

[[dialogue]]
speaker = "ナターシャ"
# 「…………苦しい、でしょ……それ……？」
line = "「…………苦しい、でしょ……それ……？」"

[[dialogue]]
speaker = "メルエル"
# 「ぁ──だ、だめ──！」
line = "「ぁ──だ、だめ──！」"

[[dialogue]]
speaker = "unk"
# ナターシャが、メルエルの手をそっと握る──途端に、瘴気が繋いだ手を伝って、ナターシャをも呑み込みにかかる。
line = "ナターシャが、メルエルの手をそっと握る──途端に、瘴気が繋いだ手を伝って、ナターシャをも呑み込みにかかる。"

[[dialogue]]
speaker = "メルエル"
# 「ぁ、あぁっ……やめて……離、してっ……ナターシャちゃん……！」
line = "「ぁ、あぁっ……やめて……離、してっ……ナターシャちゃん……！」"

[[dialogue]]
speaker = "ナターシャ"
# 「──あは。良い顔……メルエルの辛そうな顔、やっぱサイコーだよね……」
line = "「──あは。良い顔……メルエルの辛そうな顔、やっぱサイコーだよね……」"

[[dialogue]]
speaker = "ナターシャ"
# 「やっぱり、メルエルの顔をゆがめるのは……自分でやらなきゃ、面白くないや……」
line = "「やっぱり、メルエルの顔をゆがめるのは……自分でやらなきゃ、面白くないや……」"

[[dialogue]]
speaker = "メルエル"
# （……嫌だ）
line = "（……嫌だ）"

[[dialogue]]
speaker = "unk"
# 自分だけでなく、大切な幼なじみまで──瘴気に呑まれていく。
line = "自分だけでなく、大切な幼なじみまで──瘴気に呑まれていく。"

[[dialogue]]
speaker = "メルエル"
# （……このまま死んじゃうだなんて、自分が消えちゃうだなんて、嫌だよ！！）
line = "（……このまま死んじゃうだなんて、自分が消えちゃうだなんて、嫌だよ！！）"

[[dialogue]]
speaker = "メルエル"
# （ずっと何も知らずに生きてきた……ナターシャちゃんや、ケイティお姉ちゃんに、知らずに守られて、生きてきた……！）
line = "（ずっと何も知らずに生きてきた……ナターシャちゃんや、ケイティお姉ちゃんに、知らずに守られて、生きてきた……！）"

[[dialogue]]
speaker = "unk"
# ──このまま瘴気に汚染され尽くしたら。
line = "──このまま瘴気に汚染され尽くしたら。"

[[dialogue]]
speaker = "unk"
# ──自分は、本当に何もできないまま。
line = "──自分は、本当に何もできないまま。"

[[dialogue]]
speaker = "unk"
# ──大好きな幼なじみの人生を歪めるだけ歪めて、逝くことになる。
line = "──大好きな幼なじみの人生を歪めるだけ歪めて、逝くことになる。"

[[dialogue]]
speaker = "メルエル"
# （それだけは、絶対に──嫌だよ──！！！）
line = "（それだけは、絶対に──嫌だよ──！！！）"

[[dialogue]]
speaker = "unk"
# その想いを強く、強く胸に抱くも……
line = "その想いを強く、強く胸に抱くも……"

[[dialogue]]
speaker = "unk"
# 瘴気の汚染は、止まらない──
line = "瘴気の汚染は、止まらない──"
