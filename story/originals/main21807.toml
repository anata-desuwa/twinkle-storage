line = "血のように紅く染まった、魔界の原野。"

[[dialogue]]
speaker = "unk"
# そこに降り立ったのは、漆黒の翼を持つ、１人の少女──
line = "そこに降り立ったのは、漆黒の翼を持つ、１人の少女──"

[[dialogue]]
speaker = "？？？"
