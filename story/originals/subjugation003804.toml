[[dialogue]]
speaker = "unk"
# リゾート結界は広いので、何組かに分かれてフライドチキンマシンを探すことになった。
line = "リゾート結界は広いので、何組かに分かれてフライドチキンマシンを探すことになった。"

[[dialogue]]
speaker = "unk"
# 今は俺とシルヴィ先輩、コハルコさんとアニマ先輩でコンビを組んでいる。
line = "今は俺とシルヴィ先輩、コハルコさんとアニマ先輩でコンビを組んでいる。"

[[dialogue]]
speaker = "unk"
# 他にもトリュファイナさんとシュティレも探してくれているらしい。
line = "他にもトリュファイナさんとシュティレも探してくれているらしい。"

[[dialogue]]
speaker = "シルヴィ"
# 「会長くんも水着フォームあるんだ！　海パンで飛べるのなんかウケる！」
line = "「会長くんも水着フォームあるんだ！　海パンで飛べるのなんかウケる！」"

[[dialogue]]
speaker = "シルヴィ"
# 「はー、リゾート結界って本当にどこまで行っても海なんだね。すごいな～」
line = "「はー、リゾート結界って本当にどこまで行っても海なんだね。すごいな～」"

[[dialogue]]
speaker = "シルヴィ"
# 「……そもそもリゾート結界って何？　いつの間に学園に出来たの？」
line = "「……そもそもリゾート結界って何？　いつの間に学園に出来たの？」"

[[dialogue]]
speaker = "unk"
# 俺たちにはリゾート結界が学園にあるのが当たり前になっていたけど、シルヴィ先輩にとっては驚きの連続のようだ。リゾート結界が誕生した経緯をかいつまんで伝える。
line = "俺たちにはリゾート結界が学園にあるのが当たり前になっていたけど、シルヴィ先輩にとっては驚きの連続のようだ。リゾート結界が誕生した経緯をかいつまんで伝える。"

[[dialogue]]
speaker = "シルヴィ"
# 「……へぇ～。長い間、眠りに就いていた古代天使が作った結界……さらに、結界内の疑似守護星によって水着フォームが覚醒した、と」
line = "「……へぇ～。長い間、眠りに就いていた古代天使が作った結界……さらに、結界内の疑似守護星によって水着フォームが覚醒した、と」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしがいない間にいろんなことがあったんだねぇ」
line = "「あたしがいない間にいろんなことがあったんだねぇ」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩は故郷を守るため、一時期、天界に帰っていた。
line = "シルヴィ先輩は故郷を守るため、一時期、天界に帰っていた。"

[[dialogue]]
speaker = "unk"
# その間に、こちらでも様々な出会いや事件があった。
line = "その間に、こちらでも様々な出会いや事件があった。"

[[dialogue]]
speaker = "シルヴィ"
# 「ちなみに古代天使って……あ、分かった。リップルちゃんでしょ。いつも水着の子。寮でも賑やかで楽しいんだ」
line = "「ちなみに古代天使って……あ、分かった。リップルちゃんでしょ。いつも水着の子。寮でも賑やかで楽しいんだ」"

[[dialogue]]
speaker = "シルヴィ"
# 「リップルちゃん、不思議な子だと思ったけど、古代天使だったんだ」
line = "「リップルちゃん、不思議な子だと思ったけど、古代天使だったんだ」"

[[dialogue]]
speaker = "シルヴィ"
# 「──いや、いつも水着なのは古代と関係ないよね！？」
line = "「──いや、いつも水着なのは古代と関係ないよね！？」"

[[dialogue]]
speaker = "unk"
# ないですね
line = "ないですね"

[[dialogue]]
speaker = "シルヴィ"
# 「だよねー。個性的な子も増えたよね。ま、<ruby=あたしたち>３年生</ruby>が言うことじゃないけどさ」
line = "「だよねー。個性的な子も増えたよね。ま、<ruby>３年生<rt>あたしたち</rt></ruby>が言うことじゃないけどさ」"

[[dialogue]]
speaker = "シルヴィ"
# 「アニマっちとか、マムとか初めて会ったときは驚いたよ。アニマっちは何考えてるかマジ分かんないし、マムはあんなだし！　畏怖！」
line = "「アニマっちとか、マムとか初めて会ったときは驚いたよ。アニマっちは何考えてるかマジ分かんないし、マムはあんなだし！　畏怖！」"

[[dialogue]]
speaker = "シルヴィ"
# 「右も左も楽しい子ばっかりで、学園に来てから退屈なんかしたことないよ」
line = "「右も左も楽しい子ばっかりで、学園に来てから退屈なんかしたことないよ」"

[[dialogue]]
speaker = "シルヴィ"
# 「学園のみんなだけじゃなくて、人間界も初めて見るものだらけでさ。カラオケでしょ、ゲーセンでしょ、映画館でしょ……挙げたらきりがないや」
line = "「学園のみんなだけじゃなくて、人間界も初めて見るものだらけでさ。カラオケでしょ、ゲーセンでしょ、映画館でしょ……挙げたらきりがないや」"

[[dialogue]]
speaker = "シルヴィ"
# 「天界にはないものばっかりで、めっちゃくちゃ楽しかった！　今でも楽しいけど、初めてのときは格別だったなぁ……」
line = "「天界にはないものばっかりで、めっちゃくちゃ楽しかった！　今でも楽しいけど、初めてのときは格別だったなぁ……」"

[[dialogue]]
speaker = "unk"
# 先輩の故郷はどんなところですか？
line = "先輩の故郷はどんなところですか？"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしの故郷？　そうだなぁ……改めて聞かれると、説明するの難しいかも」
line = "「あたしの故郷？　そうだなぁ……改めて聞かれると、説明するの難しいかも」"

[[dialogue]]
speaker = "シルヴィ"
# 「う～ん……人間界で言うと、すごい田舎？　みたいな感じかな。小さな町でね、外は見渡す限り原っぱで、大きな湖があって……」
line = "「う～ん……人間界で言うと、すごい田舎？　みたいな感じかな。小さな町でね、外は見渡す限り原っぱで、大きな湖があって……」"

[[dialogue]]
speaker = "シルヴィ"
# 「かけっこしたり、釣りしたり、素潜りしたり、そんな毎日だったな。流星市国みたいになんでもあるわけじゃないけど、楽しかったよ！」
line = "「かけっこしたり、釣りしたり、素潜りしたり、そんな毎日だったな。流星市国みたいになんでもあるわけじゃないけど、楽しかったよ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「…………うずうず」
line = "「…………うずうず」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩が何か言いたそうだ。
line = "シルヴィ先輩が何か言いたそうだ。"

[[dialogue]]
speaker = "シルヴィ"
# 「ねぇねぇ、ずいぶん探したけど、マシンもモンスターも見付からないし、ちょっと休憩しようよ」
line = "「ねぇねぇ、ずいぶん探したけど、マシンもモンスターも見付からないし、ちょっと休憩しようよ」"

[[dialogue]]
speaker = "unk"
# ちょっとくらいならいいですよ
line = "ちょっとくらいならいいですよ"

[[dialogue]]
speaker = "シルヴィ"
# 「やったぁ！　会長くん話が分かるぅ！」
line = "「やったぁ！　会長くん話が分かるぅ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「本当に綺麗な海だね。リゾート結界だから、本物の海じゃないんだろうけど、それでも、綺麗なのは本当だよ」
line = "「本当に綺麗な海だね。リゾート結界だから、本物の海じゃないんだろうけど、それでも、綺麗なのは本当だよ」"

[[dialogue]]
speaker = "シルヴィ"
# 「結界の中ってリップルちゃんのイメージなんだっけ？　じゃあ、リップルちゃんは心の底から海が好きなんだね。すごく素敵」
line = "「結界の中ってリップルちゃんのイメージなんだっけ？　じゃあ、リップルちゃんは心の底から海が好きなんだね。すごく素敵」"

[[dialogue]]
speaker = "シルヴィ"
# 「さ～て、どうしよっかな。あたし、実は海は初心者なんだよね。会長くんは海といえば、何で遊ぶ？」
line = "「さ～て、どうしよっかな。あたし、実は海は初心者なんだよね。会長くんは海といえば、何で遊ぶ？」"

[[dialogue]]
speaker = "シルヴィ"
# 「ふんふん……まずは泳いだり、潜ったり？　じゃあ泳ごう！」
line = "「ふんふん……まずは泳いだり、潜ったり？　じゃあ泳ごう！」"

[[dialogue]]
speaker = "シルヴィ"
# 「とりゃああぁっ！」
line = "「とりゃああぁっ！」"

[[dialogue]]
speaker = "unk"
# 激しく水しぶきを上げながら、シルヴィ先輩が泳いでいる。泳ぎ方まで賑やかだ。
line = "激しく水しぶきを上げながら、シルヴィ先輩が泳いでいる。泳ぎ方まで賑やかだ。"

[[dialogue]]
speaker = "シルヴィ"
# 「んで潜る！」
line = "「んで潜る！」"

[[dialogue]]
speaker = "シルヴィ"
# 「すごいすごーい！　おさかないっぱいいたー！　キレイなのとかヘンなんとかいろいろいるよ！」
line = "「すごいすごーい！　おさかないっぱいいたー！　キレイなのとかヘンなんとかいろいろいるよ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「学園の中なのに海で遊べるなんて、マジで楽しすぎる！　学園に来る前はこんなことが起きるなんて想像もできなかったよ！」
line = "「学園の中なのに海で遊べるなんて、マジで楽しすぎる！　学園に来る前はこんなことが起きるなんて想像もできなかったよ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「……いやぁ、懐かしいな」
line = "「……いやぁ、懐かしいな」"

[[dialogue]]
speaker = "シルヴィ"
# 「会長くんにも話したことあったかな？　あたしの故郷はある日突然、モンスターに襲われて滅茶苦茶になっちゃったんだ」
line = "「会長くんにも話したことあったかな？　あたしの故郷はある日突然、モンスターに襲われて滅茶苦茶になっちゃったんだ」"

[[dialogue]]
speaker = "シルヴィ"
# 「その時、モンスターを倒してくれたお姉さんに憧れて、星騎士になるために、あたしはこの学園に来た」
line = "「その時、モンスターを倒してくれたお姉さんに憧れて、星騎士になるために、あたしはこの学園に来た」"

[[dialogue]]
speaker = "シルヴィ"
# 「星騎士になるための学園だから、苦しいことや辛いことがたくさんあるって覚悟してたけど、違ったんだ。そりゃ楽しいことばかりじゃないけど、さ」
line = "「星騎士になるための学園だから、苦しいことや辛いことがたくさんあるって覚悟してたけど、違ったんだ。そりゃ楽しいことばかりじゃないけど、さ」"

[[dialogue]]
speaker = "シルヴィ"
# 「優しい先輩、面白い友達、可愛い後輩、何でもある街…………いっぱいいっぱい、楽しいこと、いっぱいあった！」
line = "「優しい先輩、面白い友達、可愛い後輩、何でもある街…………いっぱいいっぱい、楽しいこと、いっぱいあった！」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたし、この学園が好き！　この学園にいるあたしが好きー！」
line = "「あたし、この学園が好き！　この学園にいるあたしが好きー！」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩の叫びが海に溶けていく。潮騒はどこまでも優しい。
line = "シルヴィ先輩の叫びが海に溶けていく。潮騒はどこまでも優しい。"

[[dialogue]]
speaker = "シルヴィ"
# 「もう３年生だから、卒業後のことも考えないといけないのにね。最初は天界に帰るつもりだったけど、今はどうしよっか考えてる」
line = "「もう３年生だから、卒業後のことも考えないといけないのにね。最初は天界に帰るつもりだったけど、今はどうしよっか考えてる」"

[[dialogue]]
speaker = "モンスター"
# 「チキチキー！！」
line = "「チキチキー！！」"

[[dialogue]]
speaker = "シルヴィ"
# 「うわっ！　チキン飛んできたー！」
line = "「うわっ！　チキン飛んできたー！」"

[[dialogue]]
speaker = "シルヴィ"
# 「動いて小腹が空いてたからちょうどいいね！　スクリューウェーブジャベリン！」
line = "「動いて小腹が空いてたからちょうどいいね！　スクリューウェーブジャベリン！」"

[[dialogue]]
speaker = "unk"
# 水流をまとった銛が、瞬く間にモンスターを蹴散らした。
line = "水流をまとった銛が、瞬く間にモンスターを蹴散らした。"

[[dialogue]]
speaker = "unk"
# さすがシルヴィ先輩だ。さっき水着戦闘服を着たばかりなのに、すでに星術を使いこなしている。
line = "さすがシルヴィ先輩だ。さっき水着戦闘服を着たばかりなのに、すでに星術を使いこなしている。"

[[dialogue]]
speaker = "シルヴィ"
# 「チキンゲット！　うまっ！　あ、会長くんも食べていいよ」
line = "「チキンゲット！　うまっ！　あ、会長くんも食べていいよ」"

[[dialogue]]
speaker = "unk"
# さっきまでモンスターだったチキンを食べるのは抵抗はあるが、シルヴィ先輩にならってかぶりつく。もちろん美味い。
line = "さっきまでモンスターだったチキンを食べるのは抵抗はあるが、シルヴィ先輩にならってかぶりつく。もちろん美味い。"

[[dialogue]]
speaker = "シルヴィ"
# 「うん、いい食べっぷり！　購買のチキンも美味しくなったよね」
line = "「うん、いい食べっぷり！　購買のチキンも美味しくなったよね」"

[[dialogue]]
speaker = "シルヴィ"
# 「<ruby=ガルスフライドチキン>ＧＦＣ</ruby>に、ボスチキン、購買やコンビニのチキン、人間界には美味しいチキンがいっぱいあるのです……」
line = "「<ruby>ＧＦＣ<rt>ガルスフライドチキン</rt></ruby>に、ボスチキン、購買やコンビニのチキン、人間界には美味しいチキンがいっぱいあるのです……」"

[[dialogue]]
speaker = "シルヴィ"
# 「フライドチキン、天界にはないからねぇ……。実は帰るの迷ってるんだよね。あっはっは！」
line = "「フライドチキン、天界にはないからねぇ……。実は帰るの迷ってるんだよね。あっはっは！」"

[[dialogue]]
speaker = "unk"
# 明るく笑うシルヴィ先輩は、夏の太陽みたいだった。
line = "明るく笑うシルヴィ先輩は、夏の太陽みたいだった。"
