[[dialogue]]
speaker = "蘭美"
# 「当主様……言われた通り、人工戦闘服を着てきましたけれど！　こ、これは一体どういうことですかっ！？」
line = "「当主様……言われた通り、人工戦闘服を着てきましたけれど！　こ、これは一体どういうことですかっ！？」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむうむ♪　実にプリティーだ♪　この姿で街を練り歩けば、件のヘンタイをあぶりだせよう！」
line = "「うむうむ♪　実にプリティーだ♪　この姿で街を練り歩けば、件のヘンタイをあぶりだせよう！」"

[[dialogue]]
speaker = "アナ"
# 「なるほど。魚を釣り上げるにはエサが必要。相手がヘンタイならば、ヘンタイ用のエサを用意すればいいということですね」
line = "「なるほど。魚を釣り上げるにはエサが必要。相手がヘンタイならば、ヘンタイ用のエサを用意すればいいということですね」"

[[dialogue]]
speaker = "トリュファイナ"
# 「まあ……不思議ないでたちですね。あの衣装はいったい……？」
line = "「まあ……不思議ないでたちですね。あの衣装はいったい……？」"

[[dialogue]]
speaker = "シュティレ"
# 「あれはバニーガールというコスチュームです」
line = "「あれはバニーガールというコスチュームです」"

[[dialogue]]
speaker = "シュティレ"
# 「カジノの女性店員の王道スタイルであり、またアニメや漫画といったサブカルチャーでも大人気の服装……」
line = "「カジノの女性店員の王道スタイルであり、またアニメや漫画といったサブカルチャーでも大人気の服装……」"

[[dialogue]]
speaker = "シュティレ"
# 「一説によれば、ウサギの獣人が多く住む、魔界のラパン地方における伝統衣装なのだとか」
line = "「一説によれば、ウサギの獣人が多く住む、魔界のラパン地方における伝統衣装なのだとか」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ほぇ～っ……そうなのですね。勉強になりますっ」
line = "「ほぇ～っ……そうなのですね。勉強になりますっ」"

[[dialogue]]
speaker = "蘭美"
# 「待つぴょん！？　聞き捨てならないぴょん！！」
line = "「待つぴょん！？　聞き捨てならないぴょん！！」"

[[dialogue]]
speaker = "マトイ"
# 「ら、蘭美先輩。ラパン地方の方言が出ちゃってますよ！？」
line = "「ら、蘭美先輩。ラパン地方の方言が出ちゃってますよ！？」"

[[dialogue]]
speaker = "蘭美"
# 「地元の方言が出るのも無理ないぴょん！　言っておくけど、ラパン地方の伝統衣装はこんなハレンチ衣装じゃないぴょん！！」
line = "「地元の方言が出るのも無理ないぴょん！　言っておくけど、ラパン地方の伝統衣装はこんなハレンチ衣装じゃないぴょん！！」"

[[dialogue]]
speaker = "シュティレ"
# 「なんと。そうだったのですか？」
line = "「なんと。そうだったのですか？」"

[[dialogue]]
speaker = "蘭美"
# 「人間界に誤って伝わってる偏見だぴょん！　ウサギの獣人がいっぱいいるからって、それだけの理由で勘違いされてるんだぴょんっ！！」
line = "「人間界に誤って伝わってる偏見だぴょん！　ウサギの獣人がいっぱいいるからって、それだけの理由で勘違いされてるんだぴょんっ！！」"

[[dialogue]]
speaker = "シュティレ"
# 「大変失礼いたしました。情報をアップデートしておきます。トリュファイナさんも、誤った情報を渡してしまい申し訳ありません」
line = "「大変失礼いたしました。情報をアップデートしておきます。トリュファイナさんも、誤った情報を渡してしまい申し訳ありません」"

[[dialogue]]
speaker = "トリュファイナ"
# 「いえいえ。文化が積み重なれば、様々な解釈や行き違いが生まれるのも道理ですので」
line = "「いえいえ。文化が積み重なれば、様々な解釈や行き違いが生まれるのも道理ですので」"

[[dialogue]]
speaker = "アナ"
# 「……知っていましたか、マトイ先輩。ラパン地方では、バニーガールは伝統衣装ではないそうです」
line = "「……知っていましたか、マトイ先輩。ラパン地方では、バニーガールは伝統衣装ではないそうです」"

[[dialogue]]
speaker = "マトイ"
# 「し、知らなかった……私、ラパンの人たちは、みんなバニー服を着てるとばかり……！！」
line = "「し、知らなかった……私、ラパンの人たちは、みんなバニー服を着てるとばかり……！！」"

[[dialogue]]
speaker = "蘭美"
# 「あんまりだぴょん！！　いっつもこれぴょんっ！！　誤解されるたびに訂正してばっかり──！！」
line = "「あんまりだぴょん！！　いっつもこれぴょんっ！！　誤解されるたびに訂正してばっかり──！！」"

[[dialogue]]
speaker = "蘭美"
# 「当主様っ！　このような衣装を着なくとも、私はウサギの魔族です！」
line = "「当主様っ！　このような衣装を着なくとも、私はウサギの魔族です！」"

[[dialogue]]
speaker = "蘭美"
# 「敵がウサギに並々ならぬ執着を見せるのであれば、わざわざバニーガールにならなくても……！！」
line = "「敵がウサギに並々ならぬ執着を見せるのであれば、わざわざバニーガールにならなくても……！！」"

[[dialogue]]
speaker = "ヘレナ"
# 「何を言う。敵はバニーガールフェチが高じるあまり、誘拐騒ぎを起こすほどのヘンタイであるぞ？」
line = "「何を言う。敵はバニーガールフェチが高じるあまり、誘拐騒ぎを起こすほどのヘンタイであるぞ？」"

[[dialogue]]
speaker = "ヘレナ"
# 「お着替えは許可できん。ダッチをいぶりだすまで、その格好でいるのだ。これは九浄家当主の決定である！」
line = "「お着替えは許可できん。ダッチをいぶりだすまで、その格好でいるのだ。これは九浄家当主の決定である！」"

[[dialogue]]
speaker = "蘭美"
# 「そんなっ……！！　ひどい辱めです！！　耐えられません！！」
line = "「そんなっ……！！　ひどい辱めです！！　耐えられません！！」"

[[dialogue]]
speaker = "蘭美"
# 「人間界に来てからずっと、ラパン地方の偏見をなくそうと努力してたのにっ……！！」
line = "「人間界に来てからずっと、ラパン地方の偏見をなくそうと努力してたのにっ……！！」"

[[dialogue]]
speaker = "蘭美"
# 「私がこんな格好で外を出歩いたら『あ、やっぱり』って言われるに決まってるわ……今までの苦労が水の泡じゃない！！」
line = "「私がこんな格好で外を出歩いたら『あ、やっぱり』って言われるに決まってるわ……今までの苦労が水の泡じゃない！！」"

[[dialogue]]
speaker = "シュティレ"
# 「今は緊急事態です。会長のためにも、こらえてください」
line = "「今は緊急事態です。会長のためにも、こらえてください」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ふぁ、ふぁいとです蘭美様っ。魔王様のためにも！」
line = "「ふぁ、ふぁいとです蘭美様っ。魔王様のためにも！」"

[[dialogue]]
speaker = "蘭美"
# 「う、うぅっ──！　これは会長のため……会長のため……！」
line = "「う、うぅっ──！　これは会長のため……会長のため……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「そう落ち込むでない、蘭美よ。任務を任せるのはお前１人ではない」
line = "「そう落ち込むでない、蘭美よ。任務を任せるのはお前１人ではない」"

[[dialogue]]
speaker = "蘭美"
# 「…………え？」
line = "「…………え？」"

[[dialogue]]
speaker = "蘭美"
# 「また来客っ！？　ダ、ダメよ！　こんな格好、見られるわけには──！！」
line = "「また来客っ！？　ダ、ダメよ！　こんな格好、見られるわけには──！！」"

[[dialogue]]
speaker = "ヘレナ"
# 「待っていたぞ──入ってくるがよい！」
line = "「待っていたぞ──入ってくるがよい！」"

[[dialogue]]
speaker = "ユウリ"
# 「失礼します。なんでもあたしらの協力が必要だって……」
line = "「失礼します。なんでもあたしらの協力が必要だって……」"

[[dialogue]]
speaker = "セーラ"
# 「会長さんの捜索に人手がいるんだよね？　まっかせて～！」
line = "「会長さんの捜索に人手がいるんだよね？　まっかせて～！」"

[[dialogue]]
speaker = "セナリィ"
# 「トラブルはゴールデングースにお任せですわ！」
line = "「トラブルはゴールデングースにお任せですわ！」"

[[dialogue]]
speaker = "ネーゼマイン"
# 「はろはろ～♪　公安もお手伝いするよ～♪」
line = "「はろはろ～♪　公安もお手伝いするよ～♪」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「随分と変わった人選ですわね？　いったい何をすれば──」
line = "「随分と変わった人選ですわね？　いったい何をすれば──」"

[[dialogue]]
speaker = "ユウリ"
# 「……は？」
line = "「……は？」"

[[dialogue]]
speaker = "セナリィ"
# 「……えっ？」
line = "「……えっ？」"

[[dialogue]]
speaker = "ヒルディオーネ"
# 「ま、まさか──」
line = "「ま、まさか──」"

[[dialogue]]
speaker = "セーラ"
# 「あ～。そーゆーこと♪」
line = "「あ～。そーゆーこと♪」"

[[dialogue]]
speaker = "ネーゼマイン"
# 「なんでこの５人が呼ばれたのか、わかっちゃったかも♪」
line = "「なんでこの５人が呼ばれたのか、わかっちゃったかも♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「よく来てくれた。これで<b>バニーガールが全員</b>──集まったな♪」
line = "「よく来てくれた。これで<b>バニーガールが全員</b>──集まったな♪」"

[[dialogue]]
speaker = "セナリィ"
# 「じょっ、冗談じゃねぇですわ～っ！？」
line = "「じょっ、冗談じゃねぇですわ～っ！？」"
