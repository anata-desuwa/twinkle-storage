[[dialogue]]
speaker = "unk"
# 第１話,聖沙とアナザーステラ,P
line = "第１話,聖沙とアナザーステラ,P"

[[dialogue]]
speaker = "unk"
# リゾート結界の一件の後。
line = "リゾート結界の一件の後。"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースの一行は、元の世界へ戻るまでの数日間、流星市国に滞在することになった。
line = "流星クルセイダースの一行は、元の世界へ戻るまでの数日間、流星市国に滞在することになった。"

[[dialogue]]
speaker = "フィオナ"
# 「聖沙さん、お久しぶりです♪」
line = "「聖沙さん、お久しぶりです♪」"

[[dialogue]]
speaker = "聖沙"
# 「フィオナさん！　また会えて嬉しいわ♪」
line = "「フィオナさん！　また会えて嬉しいわ♪」"

[[dialogue]]
speaker = "フィオナ"
# 「私もです♪　それで、私を呼んだのは、もしかして……？」
line = "「私もです♪　それで、私を呼んだのは、もしかして……？」"

[[dialogue]]
speaker = "聖沙"
# 「ええ。あなたも流星学園の星徒会長だもの。だから――」
line = "「ええ。あなたも流星学園の星徒会長だもの。だから――」"

[[dialogue]]
speaker = "聖沙"
# 「フィオナさん、私と水着フォームの訓練も兼ねて、勝負よ！」
line = "「フィオナさん、私と水着フォームの訓練も兼ねて、勝負よ！」"

[[dialogue]]
speaker = "フィオナ"
# 「ふふっ♪　星騎士として、喜んでお受けします」
line = "「ふふっ♪　星騎士として、喜んでお受けします」"

[[dialogue]]
speaker = "聖沙"
# 「ありがとう♪　もちろん――」
line = "「ありがとう♪　もちろん――」"

[[dialogue]]
speaker = "unk"
# 聖沙は、俺の方にも視線を向けながら言う。
line = "聖沙は、俺の方にも視線を向けながら言う。"

[[dialogue]]
speaker = "聖沙"
# 「新星学園の星徒会長である、あなたもよ！」
line = "「新星学園の星徒会長である、あなたもよ！」"

[[dialogue]]
speaker = "unk"
# ああ。俺も受けて立つよ
line = "ああ。俺も受けて立つよ"

[[dialogue]]
speaker = "unk"
# 努力家でやる気に満ちた聖沙との勝負は、いい刺激になる。俺としても大歓迎だ。
line = "努力家でやる気に満ちた聖沙との勝負は、いい刺激になる。俺としても大歓迎だ。"

[[dialogue]]
speaker = "聖沙"
# 「と、ところで……」
line = "「と、ところで……」"

[[dialogue]]
speaker = "unk"
# ふと、急にそわそわした様子で聖沙は辺りを見回す。
line = "ふと、急にそわそわした様子で聖沙は辺りを見回す。"

[[dialogue]]
speaker = "聖沙"
# 「あの子は……一緒に来てないのかしら……？」
line = "「あの子は……一緒に来てないのかしら……？」"

[[dialogue]]
speaker = "フィオナ"
# 「ふふっ、そう言うと思って、ちゃんと呼んでありますよ♪」
line = "「ふふっ、そう言うと思って、ちゃんと呼んでありますよ♪」"

[[dialogue]]
speaker = "ニャリオン"
# 「フィオナ嬢～、使い魔として呼ばれて来たニャ～」
line = "「フィオナ嬢～、使い魔として呼ばれて来たニャ～」"

[[dialogue]]
speaker = "聖沙"
# 「あっ！　ニャリオンさん<emoji=heart04>」
line = "「あっ！　ニャリオンさん<emoji=heart04>」"

[[dialogue]]
speaker = "ニャリオン"
# 「って、ニャニャッ……！？　お前は異世界の……！　また来てたニャン！？」
line = "「って、ニャニャッ……！？　お前は異世界の……！　また来てたニャン！？」"

[[dialogue]]
speaker = "聖沙"
# 「はああぁ～～っ<emoji=heart04><emoji=heart04><emoji=heart04>　お久しぶり～っ<emoji=heart04><emoji=heart04><emoji=heart04>　やっぱり可愛い～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」
line = "「はああぁ～～っ<emoji=heart04><emoji=heart04><emoji=heart04>　お久しぶり～っ<emoji=heart04><emoji=heart04><emoji=heart04>　やっぱり可愛い～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "ニャリオン"
# 「ギニャあああぁ～～っ！？　ワガハイに抱きつくニャ～～っ！？」
line = "「ギニャあああぁ～～っ！？　ワガハイに抱きつくニャ～～っ！？」"

[[dialogue]]
speaker = "聖沙"
# 「会いたかったわ、ニャリオンさ～んっ<emoji=heart04><emoji=heart04>」
line = "「会いたかったわ、ニャリオンさ～んっ<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "パッキー"
# 「おいヒス、騒がしいけど何かあったのか？　って……お前！　いつかの喋るニャン公じゃねぇか！」
line = "「おいヒス、騒がしいけど何かあったのか？　って……お前！　いつかの喋るニャン公じゃねぇか！」"

[[dialogue]]
speaker = "ニャリオン"
# 「あっ、お前はいつかの喋るパンダ！？　よくもあの時はやってくれたニャ～！？」
line = "「あっ、お前はいつかの喋るパンダ！？　よくもあの時はやってくれたニャ～！？」"

[[dialogue]]
speaker = "パッキー"
# 「ちょっ、待て！　あん時は洗脳されててだな……あだだっ！？　猫パンチはやめろぉ～っ！？」
line = "「ちょっ、待て！　あん時は洗脳されててだな……あだだっ！？　猫パンチはやめろぉ～っ！？」"

[[dialogue]]
speaker = "聖沙"
# 「すごい<emoji=heart04>　可愛い２人がユニゾンね<emoji=heart04>」
line = "「すごい<emoji=heart04>　可愛い２人がユニゾンね<emoji=heart04>」"

[[dialogue]]
speaker = "パッキー"
# 「いや、ランブルだろ！？　というか、嬉しそうに見てないで、コイツをどうにかしてくれよっ！？」
line = "「いや、ランブルだろ！？　というか、嬉しそうに見てないで、コイツをどうにかしてくれよっ！？」"

[[dialogue]]
speaker = "ニャリオン"
# 「お前、何者ニャ！　名を名乗れニャ～～っ！！」
line = "「お前、何者ニャ！　名を名乗れニャ～～っ！！」"

[[dialogue]]
speaker = "パッキー"
# 「お、俺様は、大賢者パッキー様だっ！　お前こそ、なんなんだよ！？」
line = "「お、俺様は、大賢者パッキー様だっ！　お前こそ、なんなんだよ！？」"

[[dialogue]]
speaker = "ニャリオン"
# 「大賢者ニャと！？　それはワガハイの肩書きニャっ！！」
line = "「大賢者ニャと！？　それはワガハイの肩書きニャっ！！」"

[[dialogue]]
speaker = "パッキー"
# 「はぁ！？　なに言ってんだ、お前！」
line = "「はぁ！？　なに言ってんだ、お前！」"

[[dialogue]]
speaker = "ニャリオン"
# 「ワガハイこそは、３０００年前――魔王ラクシス様に仕えていた使い魔、大賢者ニャメニア・ワールフリオンだニャン！」
line = "「ワガハイこそは、３０００年前――魔王ラクシス様に仕えていた使い魔、大賢者ニャメニア・ワールフリオンだニャン！」"

[[dialogue]]
speaker = "聖沙"
# 「えっ！？　ニャリオンさんって、そうだったの！？」
line = "「えっ！？　ニャリオンさんって、そうだったの！？」"

[[dialogue]]
speaker = "パッキー"
# 「ちょ、ちょっと待て……こっちの世界の魔王に仕えていた大賢者……！？」
line = "「ちょ、ちょっと待て……こっちの世界の魔王に仕えていた大賢者……！？」"

[[dialogue]]
speaker = "パッキー"
# 「それじゃあ何か？　天使――ロロットの奴に、ルリエルって似た存在がいるみたいに……」
line = "「それじゃあ何か？　天使――ロロットの奴に、ルリエルって似た存在がいるみたいに……」"

[[dialogue]]
speaker = "聖沙"
# 「ニャリオンさんが、パッキーさんの『<ruby=アナザーステラ>平行同位体</ruby>』ってこと……！？」
line = "「ニャリオンさんが、パッキーさんの『<ruby>平行同位体<rt>アナザーステラ</rt></ruby>』ってこと……！？」"

[[dialogue]]
speaker = "ニャリオン"
# 「アナザーステラ？」
line = "「アナザーステラ？」"

[[dialogue]]
speaker = "パッキー"
# 「え、嘘だろ……俺様と、このアホそうなニャン公が……？」
line = "「え、嘘だろ……俺様と、このアホそうなニャン公が……？」"

[[dialogue]]
speaker = "ニャリオン"
# 「誰がアホにゃん！？　女の大きな胸にダイブしまくってたエロパンダに言われたくないニャ！」
line = "「誰がアホにゃん！？　女の大きな胸にダイブしまくってたエロパンダに言われたくないニャ！」"

[[dialogue]]
speaker = "聖沙"
# 「道理で２人共、私の琴線に触れる可愛さなわけね<emoji=heart04>」
line = "「道理で２人共、私の琴線に触れる可愛さなわけね<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# と、そこで俺は聖沙に声をかける。
line = "と、そこで俺は聖沙に声をかける。"

[[dialogue]]
speaker = "unk"
# そういえば、聖沙に会わせたい人がいるんだ
line = "そういえば、聖沙に会わせたい人がいるんだ"

[[dialogue]]
speaker = "聖沙"
# 「え？　私に会わせたい人……？」
line = "「え？　私に会わせたい人……？」"

[[dialogue]]
speaker = "フィオナ"
# 「以前から、もし次の機会があれば、聖沙さんに是非紹介したいと、緋宮会長と話していたんです」
line = "「以前から、もし次の機会があれば、聖沙さんに是非紹介したいと、緋宮会長と話していたんです」"

[[dialogue]]
speaker = "？？？"
# 「――会長、フィオナ」
line = "「――会長、フィオナ」"

[[dialogue]]
speaker = "梨緒"
# 「待たせたな。私に会わせたい人がいる、とのことだったが……」
line = "「待たせたな。私に会わせたい人がいる、とのことだったが……」"

[[dialogue]]
speaker = "フィオナ"
# 「はい、梨緒さん。こちらの方です」
line = "「はい、梨緒さん。こちらの方です」"

[[dialogue]]
speaker = "聖沙"
# 「あっ、ごきげんよう。私は『聖沙・<ruby=ブリジッタ>Ｂ</ruby>・クリステレス』と言います」
line = "「あっ、ごきげんよう。私は『聖沙・<ruby>Ｂ<rt>ブリジッタ</rt></ruby>・クリステレス』と言います」"

[[dialogue]]
speaker = "梨緒"
# 「クリステレス……？」
line = "「クリステレス……？」"

[[dialogue]]
speaker = "フィオナ"
# 「聖沙さん。こちらは私たちの同級生で、新星学園２年生の『梨緒・<ruby=アガサ>Ａ</ruby>・クリステレス』さんです」
line = "「聖沙さん。こちらは私たちの同級生で、新星学園２年生の『梨緒・<ruby>Ａ<rt>アガサ</rt></ruby>・クリステレス』さんです」"

[[dialogue]]
speaker = "聖沙"
# 「え……それって……」
line = "「え……それって……」"

[[dialogue]]
speaker = "聖沙"
# 「この世界での、私の……？」
line = "「この世界での、私の……？」"

[[dialogue]]
speaker = "梨緒"
# 「……なるほど。つまり聖沙は、異世界における私と似た存在――『アナザーステラ』かもしれないというわけか」
line = "「……なるほど。つまり聖沙は、異世界における私と似た存在――『アナザーステラ』かもしれないというわけか」"

[[dialogue]]
speaker = "聖沙"
# 「確かな証拠があるわけでもないから、正直、半信半疑だけれど……」
line = "「確かな証拠があるわけでもないから、正直、半信半疑だけれど……」"

[[dialogue]]
speaker = "聖沙"
# 「……いえ、でも、こういう時こそ――」
line = "「……いえ、でも、こういう時こそ――」"

[[dialogue]]
speaker = "聖沙"
# 「梨緒さん、私と勝負しましょう！」
line = "「梨緒さん、私と勝負しましょう！」"

[[dialogue]]
speaker = "梨緒"
# 「勝負……？」
line = "「勝負……？」"

[[dialogue]]
speaker = "聖沙"
# 「ええ。もし私たちが似た存在だというなら、勝負すれば何かわかるかもしれない」
line = "「ええ。もし私たちが似た存在だというなら、勝負すれば何かわかるかもしれない」"

[[dialogue]]
speaker = "梨緒"
# 「……そうか。勝負か」
line = "「……そうか。勝負か」"

[[dialogue]]
speaker = "梨緒"
# 「確かにそうだな……わかった。その勝負、受けて立とう」
line = "「確かにそうだな……わかった。その勝負、受けて立とう」"

[[dialogue]]
speaker = "unk"
# こうして、初めて対面した２人は、勝負を行うことになるのだった。
line = "こうして、初めて対面した２人は、勝負を行うことになるのだった。"
