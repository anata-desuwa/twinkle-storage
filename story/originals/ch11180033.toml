[[dialogue]]
speaker = "unk"
# 第３話,選管グルメバトル！,P
line = "第３話,選管グルメバトル！,P"

[[dialogue]]
speaker = "unk"
# 漫画を探しに秋葉原に立ち寄ると、新星学園の選挙管理委員会──通称選管の面々も秋葉原にやってきていた。
line = "漫画を探しに秋葉原に立ち寄ると、新星学園の選挙管理委員会──通称選管の面々も秋葉原にやってきていた。"

[[dialogue]]
speaker = "アポロ"
# 「んー、やっぱりアキバはいいなっ！　流星ライダーのレアグッズもいっぱい置いてるし！　プレミア付きのベルトもあるんだぞ！」
line = "「んー、やっぱりアキバはいいなっ！　流星ライダーのレアグッズもいっぱい置いてるし！　プレミア付きのベルトもあるんだぞ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「おー、賑やかな街だ」
line = "「おー、賑やかな街だ」"

[[dialogue]]
speaker = "unk"
# 選管のみんなは何をしてるところ？
line = "選管のみんなは何をしてるところ？"

[[dialogue]]
speaker = "梨緒"
# 「ああ、君か。無論、星徒会長である君の監視……と言いたいところだが、そうではない」
line = "「ああ、君か。無論、星徒会長である君の監視……と言いたいところだが、そうではない」"

[[dialogue]]
speaker = "ベアトリス"
# 「梨緒ちゃんとアポロちゃんと私で、ナターシャちゃんにアキバグルメをプレゼンするんですっ！」
line = "「梨緒ちゃんとアポロちゃんと私で、ナターシャちゃんにアキバグルメをプレゼンするんですっ！」"

[[dialogue]]
speaker = "unk"
# プレゼン？
line = "プレゼン？"

[[dialogue]]
speaker = "ナターシャ"
# 「うん。食に興味のない私に、みんなのオススメを紹介してくれるんだって」
line = "「うん。食に興味のない私に、みんなのオススメを紹介してくれるんだって」"

[[dialogue]]
speaker = "アポロ"
# 「アキバにはいろんなお店があるからな。美味しいものたくさんあるんだぞ！」
line = "「アキバにはいろんなお店があるからな。美味しいものたくさんあるんだぞ！」"

[[dialogue]]
speaker = "梨緒"
# 「いい加減、私のサンドイッチを奪うのはやめてもらわないとな。そのためにナターシャに好きなものを見つけてもらう」
line = "「いい加減、私のサンドイッチを奪うのはやめてもらわないとな。そのためにナターシャに好きなものを見つけてもらう」"

[[dialogue]]
speaker = "ナターシャ"
# 「ついでに、私に美味しいって言わせた人が勝ちなんだって」
line = "「ついでに、私に美味しいって言わせた人が勝ちなんだって」"

[[dialogue]]
speaker = "梨緒"
# 「今日は私が勝つ！」
line = "「今日は私が勝つ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「梨緒ってすぐにバトルしたがるよね。弱いのに」
line = "「梨緒ってすぐにバトルしたがるよね。弱いのに」"

[[dialogue]]
speaker = "梨緒"
# 「弱い！？」
line = "「弱い！？」"

[[dialogue]]
speaker = "梨緒"
# 「くっ……私なんて、シラスに混入した小エビのようにちっぽけな存在なんだ……」
line = "「くっ……私なんて、シラスに混入した小エビのようにちっぽけな存在なんだ……」"

[[dialogue]]
speaker = "ベアトリス"
# 「梨緒ちゃーんっ！？　気を確かに！　あとたとえが細かすぎるよ！」
line = "「梨緒ちゃーんっ！？　気を確かに！　あとたとえが細かすぎるよ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ま、そういうわけなんだ。これは選管内の勝負だから、会長さんは手出し無用だよ」
line = "「ま、そういうわけなんだ。これは選管内の勝負だから、会長さんは手出し無用だよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「勝負がどうなるのか、楽しみに見ててね。面白いグルメが飛びだしてくるかもよ？」
line = "「勝負がどうなるのか、楽しみに見ててね。面白いグルメが飛びだしてくるかもよ？」"

[[dialogue]]
speaker = "アポロ"
# 「まずは順番決めだ！　公平にじゃんけんで決めるぞ！　さーいしょはグーッ！　じゃーんけん！」
line = "「まずは順番決めだ！　公平にじゃんけんで決めるぞ！　さーいしょはグーッ！　じゃーんけん！」"

[[dialogue]]
speaker = "ベアトリス"
# 「ぽんっ！」
line = "「ぽんっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「……お、珍しい展開だね」
line = "「……お、珍しい展開だね」"

[[dialogue]]
speaker = "アポロ"
# 「くそー、あたしが２番かー」
line = "「くそー、あたしが２番かー」"

[[dialogue]]
speaker = "ベアトリス"
# 「私が最後だねっ」
line = "「私が最後だねっ」"

[[dialogue]]
speaker = "梨緒"
# 「勝った……！　私がナンバーワンだ……！」
line = "「勝った……！　私がナンバーワンだ……！」"

[[dialogue]]
speaker = "ナターシャ"
# 「や、嬉しそうだけど、順番決めのじゃんけんに勝っただけだから。本戦に勝ったわけじゃないからね」
line = "「や、嬉しそうだけど、順番決めのじゃんけんに勝っただけだから。本戦に勝ったわけじゃないからね」"

[[dialogue]]
speaker = "梨緒"
# 「しかしじゃんけんの勝利はグルメバトルの勝利に直結する。この勝負、私がもらった！」
line = "「しかしじゃんけんの勝利はグルメバトルの勝利に直結する。この勝負、私がもらった！」"

[[dialogue]]
speaker = "ナターシャ"
# 「もう勝利宣言？　随分と自信あるんだね」
line = "「もう勝利宣言？　随分と自信あるんだね」"

[[dialogue]]
speaker = "梨緒"
# 「ああ、それには根拠がある」
line = "「ああ、それには根拠がある」"

[[dialogue]]
speaker = "梨緒"
# 「最高の調味料……それは空腹。ならば一番手の私に有利だ」
line = "「最高の調味料……それは空腹。ならば一番手の私に有利だ」"

[[dialogue]]
speaker = "ナターシャ"
# 「あー……一理あるかも。満腹の時に豪華な料理を出されても食べられないもんね」
line = "「あー……一理あるかも。満腹の時に豪華な料理を出されても食べられないもんね」"

[[dialogue]]
speaker = "アポロ"
# 「でも、料理漫画って最初に出した方が負ける法則があるぞ」
line = "「でも、料理漫画って最初に出した方が負ける法則があるぞ」"

[[dialogue]]
speaker = "梨緒"
# 「なっ……！？　いや、漫画はあくまでフィクションだ。今回こそは私が勝つ！」
line = "「なっ……！？　いや、漫画はあくまでフィクションだ。今回こそは私が勝つ！」"

[[dialogue]]
speaker = "unk"
# 梨緒、アポロ、ベアトリスの３人は、秋葉原で見つけたグルメを持ち寄る。
line = "梨緒、アポロ、ベアトリスの３人は、秋葉原で見つけたグルメを持ち寄る。"

[[dialogue]]
speaker = "梨緒"
# 「というわけで、私がプレゼンするのは、出身のイギリスにちなんで──ローストビーフ丼だ！」
line = "「というわけで、私がプレゼンするのは、出身のイギリスにちなんで──ローストビーフ丼だ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「おー、まさに肉、って感じだねー」
line = "「おー、まさに肉、って感じだねー」"

[[dialogue]]
speaker = "unk"
# 肉々しくて見るからに美味しそう
line = "肉々しくて見るからに美味しそう"

[[dialogue]]
speaker = "梨緒"
# 「味は保証する。正直、故郷のローストビーフを凌駕するほどだ」
line = "「味は保証する。正直、故郷のローストビーフを凌駕するほどだ」"

[[dialogue]]
speaker = "ベアトリス"
# 「いただきまーす……はむっ……！　わ、美味しいっ！　トッピングのローストガーリックがお肉のおいしさを何倍にも高めてるよっ！」
line = "「いただきまーす……はむっ……！　わ、美味しいっ！　トッピングのローストガーリックがお肉のおいしさを何倍にも高めてるよっ！」"

[[dialogue]]
speaker = "アポロ"
# 「ベアトはとことんブレないな～……」
line = "「ベアトはとことんブレないな～……」"

[[dialogue]]
speaker = "梨緒"
# 「どうだ、ナターシャ」
line = "「どうだ、ナターシャ」"

[[dialogue]]
speaker = "ナターシャ"
# 「うん、まぁ、こういうのが美味しいんだ──って感じかな。ソースも胡椒が効いててパンチがあったし」
line = "「うん、まぁ、こういうのが美味しいんだ──って感じかな。ソースも胡椒が効いててパンチがあったし」"

[[dialogue]]
speaker = "梨緒"
# 「よし、なかなかの好感触だ。この勝負、もらった！」
line = "「よし、なかなかの好感触だ。この勝負、もらった！」"

[[dialogue]]
speaker = "アポロ"
# 「まだ勝負は始まったばかりだぜ！　次はあたしの番っ！　あたしのオススメは──鯛焼きだ！」
line = "「まだ勝負は始まったばかりだぜ！　次はあたしの番っ！　あたしのオススメは──鯛焼きだ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「鯛焼き？」
line = "「鯛焼き？」"

[[dialogue]]
speaker = "アポロ"
# 「ただの鯛焼きじゃないぞ！　クロワッサン鯛焼きだ！　しょっぱいやつの後だし、甘いのが欲しくなったろ？」
line = "「ただの鯛焼きじゃないぞ！　クロワッサン鯛焼きだ！　しょっぱいやつの後だし、甘いのが欲しくなったろ？」"

[[dialogue]]
speaker = "アポロ"
# 「定番のあんこもいいし、カスタードもいい。期間限定のカボチャあんもあるぜ！」
line = "「定番のあんこもいいし、カスタードもいい。期間限定のカボチャあんもあるぜ！」"

[[dialogue]]
speaker = "unk"
# 周りが餃子の羽みたいになってて美味しそう
line = "周りが餃子の羽みたいになってて美味しそう"

[[dialogue]]
speaker = "ナターシャ"
# 「私はカボチャにしようかな。いただきまーす。あむっ」
line = "「私はカボチャにしようかな。いただきまーす。あむっ」"

[[dialogue]]
speaker = "梨緒"
# 「んっ……！　パリっとしていて濃厚なバターの香りが……！　普通の鯛焼きとはまた別物だな」
line = "「んっ……！　パリっとしていて濃厚なバターの香りが……！　普通の鯛焼きとはまた別物だな」"

[[dialogue]]
speaker = "ベアトリス"
# 「う～～ん、カスタードもトロトロのアツアツでおいひぃ～♪」
line = "「う～～ん、カスタードもトロトロのアツアツでおいひぃ～♪」"

[[dialogue]]
speaker = "アポロ"
# 「だろー！　立派なスイーツだよな！」
line = "「だろー！　立派なスイーツだよな！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふんふん、なるほど……このカリカリサクサクが人気なのかな。好きになる人の気持ちもわかるかも」
line = "「ふんふん、なるほど……このカリカリサクサクが人気なのかな。好きになる人の気持ちもわかるかも」"

[[dialogue]]
speaker = "梨緒"
# 「くっ、アポロのクロワッサン鯛焼きも好印象か……だがまだ勝負はわからない……！」
line = "「くっ、アポロのクロワッサン鯛焼きも好印象か……だがまだ勝負はわからない……！」"

[[dialogue]]
speaker = "ベアトリス"
# 「私は……ニンニク爆盛りペペロンチーノだよっ！」
line = "「私は……ニンニク爆盛りペペロンチーノだよっ！」"

[[dialogue]]
speaker = "梨緒"
# 「そうだと思っていた！　離れていても漂ってくるすごい匂いだな……」
line = "「そうだと思っていた！　離れていても漂ってくるすごい匂いだな……」"

[[dialogue]]
speaker = "unk"
# 食欲をそそる匂いで美味しそう
line = "食欲をそそる匂いで美味しそう"

[[dialogue]]
speaker = "アポロ"
# 「魔王、さっきから『美味しそう』しか言ってないんじゃないか……？」
line = "「魔王、さっきから『美味しそう』しか言ってないんじゃないか……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふふ、ベアトならこうじゃなきゃ嘘だよね」
line = "「ふふ、ベアトならこうじゃなきゃ嘘だよね」"

[[dialogue]]
speaker = "unk"
# ナターシャってニンニクはダメなんじゃ？
line = "ナターシャってニンニクはダメなんじゃ？"

[[dialogue]]
speaker = "ナターシャ"
# 「あ～むっ」
line = "「あ～むっ」"

[[dialogue]]
speaker = "unk"
# ナターシャがニンニクを食べた！？
line = "ナターシャがニンニクを食べた！？"

[[dialogue]]
speaker = "ナターシャ"
# 「エージェントとしての大きな仕事は終わったから、解禁してみようと思ってね」
line = "「エージェントとしての大きな仕事は終わったから、解禁してみようと思ってね」"

[[dialogue]]
speaker = "ベアトリス"
# 「さ、みんなも食べて食べて～♪」
line = "「さ、みんなも食べて食べて～♪」"

[[dialogue]]
speaker = "梨緒"
# 「これは……人に会えなくなるニンニクの量だな……」
line = "「これは……人に会えなくなるニンニクの量だな……」"

[[dialogue]]
speaker = "アポロ"
# 「あたしは食べるぞ！　こんな匂い嗅がされて我慢できるか！」
line = "「あたしは食べるぞ！　こんな匂い嗅がされて我慢できるか！」"

[[dialogue]]
speaker = "ナターシャ"
# 「あはは、ニンニクの匂いヤバ。ま、どうせならみんなでニンニクくさくなろっか」
line = "「あはは、ニンニクの匂いヤバ。ま、どうせならみんなでニンニクくさくなろっか」"

[[dialogue]]
speaker = "アポロ"
# 「ぷふー、食べた食べた！　お腹ポンポンだな！」
line = "「ぷふー、食べた食べた！　お腹ポンポンだな！」"

[[dialogue]]
speaker = "梨緒"
# 「結局私もペペロンチーノを食べてしまった……刺激は強かったが、味は素晴らしかった」
line = "「結局私もペペロンチーノを食べてしまった……刺激は強かったが、味は素晴らしかった」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃんの一番のお気に入りはどれだった？」
line = "「ナターシャちゃんの一番のお気に入りはどれだった？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そうだね。私が一番気に入ったのは──」
line = "「そうだね。私が一番気に入ったのは──」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアトのかな」
line = "「ベアトのかな」"

[[dialogue]]
speaker = "梨緒"
# 「なにっ！？　以前はガリハラとまで言っていたのに！？」
line = "「なにっ！？　以前はガリハラとまで言っていたのに！？」"

[[dialogue]]
speaker = "アポロ"
# 「ははっ、ナターシャもニンニクに染まっちゃったのか！」
line = "「ははっ、ナターシャもニンニクに染まっちゃったのか！」"

[[dialogue]]
speaker = "ベアトリス"
# 「ニンニクは悪くないよっ！　でも、ナターシャちゃんが選んでくれて嬉しいなっ！」
line = "「ニンニクは悪くないよっ！　でも、ナターシャちゃんが選んでくれて嬉しいなっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアト基準だと刺激がヤバいけど、まぁ一周回ってそれもありかなって」
line = "「ベアト基準だと刺激がヤバいけど、まぁ一周回ってそれもありかなって」"

[[dialogue]]
speaker = "ナターシャ"
# 「私、味よりも刺激とかの方が興味を持てるのかもね」
line = "「私、味よりも刺激とかの方が興味を持てるのかもね」"

[[dialogue]]
speaker = "梨緒"
# 「くっ……またもや私は……！　ベアトに、ニンニクにまで負けてしまったというのか……！」
line = "「くっ……またもや私は……！　ベアトに、ニンニクにまで負けてしまったというのか……！」"

[[dialogue]]
speaker = "梨緒"
# 「だが……ナターシャにも食べ物の好みができたのは前進だな」
line = "「だが……ナターシャにも食べ物の好みができたのは前進だな」"

[[dialogue]]
speaker = "ベアトリス"
# 「うん！　これからももっと、美味しいものや好きなものを見つけようね！」
line = "「うん！　これからももっと、美味しいものや好きなものを見つけようね！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアト、梨緒、アポロ。私のためにいろいろ考えてくれてありがと。いい休日になったよ」
line = "「ベアト、梨緒、アポロ。私のためにいろいろ考えてくれてありがと。いい休日になったよ」"

[[dialogue]]
speaker = "アポロ"
# 「ああ、美味しくて楽しかった！　またやろーな！」
line = "「ああ、美味しくて楽しかった！　またやろーな！」"

[[dialogue]]
speaker = "梨緒"
# 「そう言ってくれるならよかった。ただ、今日、明日は人に会うのは控えておいた方がいいかもしれないな」
line = "「そう言ってくれるならよかった。ただ、今日、明日は人に会うのは控えておいた方がいいかもしれないな」"

[[dialogue]]
speaker = "ナターシャ"
# 「だね。ジグの呆れ顔が目に浮かぶよ」
line = "「だね。ジグの呆れ顔が目に浮かぶよ」"

[[dialogue]]
speaker = "unk"
# 秋葉原グルメバトルはベアトリスが勝利を飾ったが、同じ皿のニンニクを食った者の絆は、より一層深まるのだった。
line = "秋葉原グルメバトルはベアトリスが勝利を飾ったが、同じ皿のニンニクを食った者の絆は、より一層深まるのだった。"
