[[dialogue]]
speaker = "unk"
# 第１話,重罪に課される罰,P
line = "第１話,重罪に課される罰,P"

[[dialogue]]
speaker = "unk"
# 創造神『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』が滅され、世界に平穏が訪れてしばらく──
line = "創造神『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』が滅され、世界に平穏が訪れてしばらく──"

[[dialogue]]
speaker = "unk"
# ベアトリスは新星学園役員揃い踏みの星徒会室を訪れていた。
line = "ベアトリスは新星学園役員揃い踏みの星徒会室を訪れていた。"

[[dialogue]]
speaker = "アナ"
# 「ベアトリスさん、随分と神妙な顔をされていますね。どうされましたか？」
line = "「ベアトリスさん、随分と神妙な顔をされていますね。どうされましたか？」"

[[dialogue]]
speaker = "ベアトリス"
# 「皆さんに謝りたいことがあって、ここに足を運びました」
line = "「皆さんに謝りたいことがあって、ここに足を運びました」"

[[dialogue]]
speaker = "サーシャ"
# 「謝りたいこと～？」
line = "「謝りたいこと～？」"

[[dialogue]]
speaker = "ベアトリス"
# 「もう皆さんご存じですけど、うやむやにするのはいけないし、ちゃんとけじめを付けなきゃいけないと思うから……改めて、私の口から言わせてください」
line = "「もう皆さんご存じですけど、うやむやにするのはいけないし、ちゃんとけじめを付けなきゃいけないと思うから……改めて、私の口から言わせてください」"

[[dialogue]]
speaker = "ベアトリス"
# 「私──ベアトリス・シェイドは、魔界からの留学生じゃなくて……デネブから来た極星学園の副会長なんです」
line = "「私──ベアトリス・シェイドは、魔界からの留学生じゃなくて……デネブから来た極星学園の副会長なんです」"

[[dialogue]]
speaker = "ベアトリス"
# 「大事なことを黙ったまま、留学生だと偽って、この新星学園に入りました。皆さんを騙してごめんなさいっ！」
line = "「大事なことを黙ったまま、留学生だと偽って、この新星学園に入りました。皆さんを騙してごめんなさいっ！」"

[[dialogue]]
speaker = "unk"
# 深々と頭を下げるベアトリス。
line = "深々と頭を下げるベアトリス。"

[[dialogue]]
speaker = "unk"
# その姿勢からも真剣さが伺える。
line = "その姿勢からも真剣さが伺える。"

[[dialogue]]
speaker = "ヴィーナス"
# 「知ってはいたけど、改めて聞くと大胆なことしたわね！」
line = "「知ってはいたけど、改めて聞くと大胆なことしたわね！」"

[[dialogue]]
speaker = "サーシャ"
# 「私たちももう一度聞くけど……ベアトリスちゃんが嘘をついていたのは、アルタイルとデネブ、２つの世界を救うためなのよね～？」
line = "「私たちももう一度聞くけど……ベアトリスちゃんが嘘をついていたのは、アルタイルとデネブ、２つの世界を救うためなのよね～？」"

[[dialogue]]
speaker = "ベアトリス"
# 「はい……」
line = "「はい……」"

[[dialogue]]
speaker = "マトイ"
# 「目的は立派だし、おかげで世界は助かったわけだけど……不正は不正だよね。他に方法はなかったのかな？」
line = "「目的は立派だし、おかげで世界は助かったわけだけど……不正は不正だよね。他に方法はなかったのかな？」"

[[dialogue]]
speaker = "ベアトリス"
# 「もっと時間があればいい考えが思いついたかもしれないですけど……急を要する事態でしたし、咄嗟の状況ではこれ以外の手段を取れませんでした」
line = "「もっと時間があればいい考えが思いついたかもしれないですけど……急を要する事態でしたし、咄嗟の状況ではこれ以外の手段を取れませんでした」"

[[dialogue]]
speaker = "ベアトリス"
# 「星騎士の学び舎において、許されない罪を犯したのは紛れもない事実です。どんな処罰でも受け入れます」
line = "「星騎士の学び舎において、許されない罪を犯したのは紛れもない事実です。どんな処罰でも受け入れます」"

[[dialogue]]
speaker = "ヴィーナス"
# 「……だって。どうする、クロト？」
line = "「……だって。どうする、クロト？」"

[[dialogue]]
speaker = "unk"
# 本来なら退学レベルの重罪だ
line = "本来なら退学レベルの重罪だ"

[[dialogue]]
speaker = "ベアトリス"
# 「っ……はいっ……！」
line = "「っ……はいっ……！」"

[[dialogue]]
speaker = "unk"
# 本来ならね
line = "本来ならね"

[[dialogue]]
speaker = "ベアトリス"
# 「え……？」
line = "「え……？」"

[[dialogue]]
speaker = "アナ"
# 「ベアトリスさんはデネブとアルタイル、双方の世界を救うために尽力しました」
line = "「ベアトリスさんはデネブとアルタイル、双方の世界を救うために尽力しました」"

[[dialogue]]
speaker = "マトイ"
# 「世界を超えるほどの決意なんて、簡単にできることじゃないよね。私だったら諦めちゃってたと思うな」
line = "「世界を超えるほどの決意なんて、簡単にできることじゃないよね。私だったら諦めちゃってたと思うな」"

[[dialogue]]
speaker = "サーシャ"
# 「みんなに内緒で、誰にも相談できなかったのはつらかったわよね～。それでもすっごく頑張ったのよね～」
line = "「みんなに内緒で、誰にも相談できなかったのはつらかったわよね～。それでもすっごく頑張ったのよね～」"

[[dialogue]]
speaker = "ベアトリス"
# 「は、はいっ……え？　あの……怒られるつもりでここに来たんですけど……」
line = "「は、はいっ……え？　あの……怒られるつもりでここに来たんですけど……」"

[[dialogue]]
speaker = "アナ"
# 「情状酌量の余地あり……というやつです。今さらベアトリスさんを罰するつもりはありません」
line = "「情状酌量の余地あり……というやつです。今さらベアトリスさんを罰するつもりはありません」"

[[dialogue]]
speaker = "ヴィーナス"
# 「<ruby=あっち>デネブ</ruby>だったら重罪なのかもしれないけど、<ruby=こっち>アルタイル</ruby>じゃ大したことないってことよ！」
line = "「<ruby>デネブ<rt>あっち</rt></ruby>だったら重罪なのかもしれないけど、<ruby>アルタイル<rt>こっち</rt></ruby>じゃ大したことないってことよ！」"

[[dialogue]]
speaker = "マトイ"
# 「いやいや、こっちでも大したことなくはないよ？　ベアトリスさんじゃなかったら普通に退学だからね？」
line = "「いやいや、こっちでも大したことなくはないよ？　ベアトリスさんじゃなかったら普通に退学だからね？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ということは、つまり……？」
line = "「ということは、つまり……？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ベアトリス、あなたは世界を救った功労者のひとりなのよ」
line = "「ベアトリス、あなたは世界を救った功労者のひとりなのよ」"

[[dialogue]]
speaker = "ヴィーナス"
# 「せっかくみんなが頑張って平和を掴んだっていうのに、あなたばかり不幸になるわけにはいかないわ！」
line = "「せっかくみんなが頑張って平和を掴んだっていうのに、あなたばかり不幸になるわけにはいかないわ！」"

[[dialogue]]
speaker = "unk"
# これからもベアトリスは新星学園の生徒だよ
line = "これからもベアトリスは新星学園の生徒だよ"

[[dialogue]]
speaker = "ベアトリス"
# 「い、いいんですか……？」
line = "「い、いいんですか……？」"

[[dialogue]]
speaker = "アナ"
# 「良いも悪いもです。会長の裁きに異を唱える人はいません。満場一致で、無罪放免です」
line = "「良いも悪いもです。会長の裁きに異を唱える人はいません。満場一致で、無罪放免です」"

[[dialogue]]
speaker = "ベアトリス"
# 「でもそれは……あまりにも私に都合がよすぎるような……。せめて、何か償いをさせてくださいっ」
line = "「でもそれは……あまりにも私に都合がよすぎるような……。せめて、何か償いをさせてくださいっ」"

[[dialogue]]
speaker = "サーシャ"
# 「あらあら、困ったわね～」
line = "「あらあら、困ったわね～」"

[[dialogue]]
speaker = "マトイ"
# 「ベアトリスさんって真面目だから、悪いことをした後ろめたさで、自分を罰したいっていう気持ちはわからなくもないけど……」
line = "「ベアトリスさんって真面目だから、悪いことをした後ろめたさで、自分を罰したいっていう気持ちはわからなくもないけど……」"

[[dialogue]]
speaker = "ヴィーナス"
# 「そう。そこまで言うなら、私が厳し～い罰を与えてあげるわ！」
line = "「そう。そこまで言うなら、私が厳し～い罰を与えてあげるわ！」"

[[dialogue]]
speaker = "マトイ"
# 「ヴィーナス、お手柔らかにね？」
line = "「ヴィーナス、お手柔らかにね？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ベアトリス、あなたは今後──」
line = "「ベアトリス、あなたは今後──」"

[[dialogue]]
speaker = "ヴィーナス"
# 「デネブから来る時、必ず星徒会にお土産を持ってくること！　アルタイルにない珍しいお菓子がいいわ！」
line = "「デネブから来る時、必ず星徒会にお土産を持ってくること！　アルタイルにない珍しいお菓子がいいわ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「え……？　それが罰、ですか……？」
line = "「え……？　それが罰、ですか……？」"

[[dialogue]]
speaker = "アナ"
# 「ナイスアイデアです。デネブ産の和菓子、是非とも食べてみたいです。じゅるり」
line = "「ナイスアイデアです。デネブ産の和菓子、是非とも食べてみたいです。じゅるり」"

[[dialogue]]
speaker = "unk"
# 汝、お土産納品の罰に処す！
line = "汝、お土産納品の罰に処す！"

[[dialogue]]
speaker = "unk"
# うわー、なんて重すぎる罰だー（棒読み）
line = "うわー、なんて重すぎる罰だー（棒読み）"

[[dialogue]]
speaker = "ベアトリス"
# 「もう……皆さん、優しすぎるんですってばぁ……！」
line = "「もう……皆さん、優しすぎるんですってばぁ……！」"

[[dialogue]]
speaker = "サーシャ"
# 「この決定に不服や異議申し立てはあるかしら～？」
line = "「この決定に不服や異議申し立てはあるかしら～？」"

[[dialogue]]
speaker = "ベアトリス"
# 「いいえ、ありません。デネブから来た時は必ずお土産をお持ちしますっ」
line = "「いいえ、ありません。デネブから来た時は必ずお土産をお持ちしますっ」"

[[dialogue]]
speaker = "ヴィーナス"
# 「はい、これにて一件落着よ！」
line = "「はい、これにて一件落着よ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「会長さん、皆さんっ……これからも新星学園の一生徒として、よろしくお願いしますっ」
line = "「会長さん、皆さんっ……これからも新星学園の一生徒として、よろしくお願いしますっ」"

[[dialogue]]
speaker = "unk"
# 以降、星徒会のティータイムには珍しいおまんじゅうやおはぎがお茶菓子として並ぶようになった。
line = "以降、星徒会のティータイムには珍しいおまんじゅうやおはぎがお茶菓子として並ぶようになった。"

[[dialogue]]
speaker = "アナ"
# 「もちゃもちゃ……不可思議な形状のおまんじゅうですが、味はマーベラスですね。むふー♪」
line = "「もちゃもちゃ……不可思議な形状のおまんじゅうですが、味はマーベラスですね。むふー♪」"

[[dialogue]]
speaker = "unk"
# そして、ほくほく顔のアナを見かける機会が増えるのだった。
line = "そして、ほくほく顔のアナを見かける機会が増えるのだった。"
