line = "「ありがとうございます。ですがこれは『色欲』の大罪の名を持つもの。《命脈》の守護天使たるアルモタヘル様にお見せするようなものでは……」"

[[dialogue]]
speaker = "アルモタヘル"
# 「ふっ。そもそも『色欲』、すなわち性欲は生物が持つ本能……命の営みそのものだ。何を恥じらうことがあろう」
line = "「ふっ。そもそも『色欲』、すなわち性欲は生物が持つ本能……命の営みそのものだ。何を恥じらうことがあろう」"

[[dialogue]]
speaker = "アルモタヘル"
# 「性欲があるから、新しい命が生まれる。お前たちだって、そうやって生まれてきたのだ。そして、お前たちからもいずれ新しい命が生まれるだろう」
line = "「性欲があるから、新しい命が生まれる。お前たちだって、そうやって生まれてきたのだ。そして、お前たちからもいずれ新しい命が生まれるだろう」"

