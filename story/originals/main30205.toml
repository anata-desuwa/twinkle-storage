[[dialogue]]
speaker = "unk"
# 第５話,『ソウルだけじゃどうにもならないこともある』,B
line = "第５話,『ソウルだけじゃどうにもならないこともある』,B"

[[dialogue]]
speaker = "オオヒメ"
# 「練習場所まで確保しているとは……ラクシャ、見直したぞ」
line = "「練習場所まで確保しているとは……ラクシャ、見直したぞ」"

[[dialogue]]
speaker = "ラクシャ"
# 「学園長のシノさんにお願いして空いてるトレーニングルームの１室を貸してもらったんだ。防音設備もしっかりしてるよ」
line = "「学園長のシノさんにお願いして空いてるトレーニングルームの１室を貸してもらったんだ。防音設備もしっかりしてるよ」"

[[dialogue]]
speaker = "セシア"
# 「楽器もちゃんと用意されているのね」
line = "「楽器もちゃんと用意されているのね」"

[[dialogue]]
speaker = "マグダレナ"
# 「ところで……私たちはそれぞれどの楽器を担当するのでしょう？」
line = "「ところで……私たちはそれぞれどの楽器を担当するのでしょう？」"

[[dialogue]]
speaker = "ラクシャ"
# 「もちろんちゃーんと全員の担当を、ボクの独断と偏見で決めてるから♪」
line = "「もちろんちゃーんと全員の担当を、ボクの独断と偏見で決めてるから♪」"

[[dialogue]]
speaker = "オオヒメ"
# 「自慢げに言うことか？」
line = "「自慢げに言うことか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「どーせみんな未経験者だし、誰がどの担当になっても同じでしょ？」
line = "「どーせみんな未経験者だし、誰がどの担当になっても同じでしょ？」"

[[dialogue]]
speaker = "オオヒメ"
# 「それはそうだが……ぶつぶつ……」
line = "「それはそうだが……ぶつぶつ……」"

[[dialogue]]
speaker = "ラクシャ"
# 「それじゃ、発表するねー！　まずはボーカル担当がセシア！」
line = "「それじゃ、発表するねー！　まずはボーカル担当がセシア！」"

[[dialogue]]
speaker = "セシア"
# 「わかったわ」
line = "「わかったわ」"

[[dialogue]]
speaker = "パテル"
# 「まぁ、適任じゃないかな」
line = "「まぁ、適任じゃないかな」"

[[dialogue]]
speaker = "オオヒメ"
# 「異議なしだ」
line = "「異議なしだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「それからギターを担当するのがボクとオオヒメ！」
line = "「それからギターを担当するのがボクとオオヒメ！」"

[[dialogue]]
speaker = "オオヒメ"
# 「ギターか……責任重大だな。ラクシャ、知っているとは思うが、私は芸事が好きだが楽器が弾けるというわけではないぞ？」
line = "「ギターか……責任重大だな。ラクシャ、知っているとは思うが、私は芸事が好きだが楽器が弾けるというわけではないぞ？」"

[[dialogue]]
speaker = "ラクシャ"
# 「分かってるって。本番までにたくさん練習すれば、きっと弾けるようになるからさ」
line = "「分かってるって。本番までにたくさん練習すれば、きっと弾けるようになるからさ」"

[[dialogue]]
speaker = "オオヒメ"
# 「うむ……」
line = "「うむ……」"

[[dialogue]]
speaker = "ラクシャ"
# 「それからベースがアルモタヘル」
line = "「それからベースがアルモタヘル」"

[[dialogue]]
speaker = "アルモタヘル"
# 「べーす？　べーす、というのは……どれだ？」
line = "「べーす？　べーす、というのは……どれだ？」"

[[dialogue]]
speaker = "ラクシャ"
# 「これこれ」
line = "「これこれ」"

[[dialogue]]
speaker = "アルモタヘル"
# 「ラクシャやオオヒメの担当するギターという楽器と似ているが、違う楽器なのか？」
line = "「ラクシャやオオヒメの担当するギターという楽器と似ているが、違う楽器なのか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「うーん、似て非なるものって感じかな。メインのメロディを弾くっていうより、リズムを刻む感じだよ」
line = "「うーん、似て非なるものって感じかな。メインのメロディを弾くっていうより、リズムを刻む感じだよ」"

[[dialogue]]
speaker = "アルモタヘル"
# 「よく分からぬが……承知した」
line = "「よく分からぬが……承知した」"

[[dialogue]]
speaker = "マグダレナ"
# 「私の担当は何になるのでしょう？」
line = "「私の担当は何になるのでしょう？」"

[[dialogue]]
speaker = "ラクシャ"
# 「マグダレナにはドラムをお願いしようかな」
line = "「マグダレナにはドラムをお願いしようかな」"

[[dialogue]]
speaker = "マグダレナ"
# 「あら」
line = "「あら」"

[[dialogue]]
speaker = "オオヒメ"
# 「おっとりしているマグダレナにドラムとは、意外な担当だな」
line = "「おっとりしているマグダレナにドラムとは、意外な担当だな」"

[[dialogue]]
speaker = "ラクシャ"
# 「マグダレナみたいなおっとりお姉さんが、豪快にドラムを叩いてるのがカッコイイんだよ！」
line = "「マグダレナみたいなおっとりお姉さんが、豪快にドラムを叩いてるのがカッコイイんだよ！」"

[[dialogue]]
speaker = "マグダレナ"
# 「こちらのバチで叩けばいいのですね？」
line = "「こちらのバチで叩けばいいのですね？」"

[[dialogue]]
speaker = "ラクシャ"
# 「スティックって言ってね」
line = "「スティックって言ってね」"

[[dialogue]]
speaker = "マグダレナ"
# 「トントントン♪　ふふっ、何だか楽しそうですね♪」
line = "「トントントン♪　ふふっ、何だか楽しそうですね♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「最後にパテルは本人からの希望もあってキーボードをやってもらうよ」
line = "「最後にパテルは本人からの希望もあってキーボードをやってもらうよ」"

[[dialogue]]
speaker = "パテル"
# 「オッケー」
line = "「オッケー」"

[[dialogue]]
speaker = "オオヒメ"
# 「ちなみに何故、キーボードなのだ？　もしや経験者なのか？」
line = "「ちなみに何故、キーボードなのだ？　もしや経験者なのか？」"

[[dialogue]]
speaker = "パテル"
# 「違うよ。ボーカルとかギターとか、そういう花形なのは勘弁して欲しいだけ」
line = "「違うよ。ボーカルとかギターとか、そういう花形なのは勘弁して欲しいだけ」"

[[dialogue]]
speaker = "オオヒメ"
# 「成程、目立たずステージの後ろに居られる役割を選んだのだな」
line = "「成程、目立たずステージの後ろに居られる役割を選んだのだな」"

[[dialogue]]
speaker = "ラクシャ"
# 「これがボクの考えてきたパートだけど、みんな異論はないかな？」
line = "「これがボクの考えてきたパートだけど、みんな異論はないかな？」"

[[dialogue]]
speaker = "unk"
# ラクシャの言葉に全員が異論はないと頷く。
line = "ラクシャの言葉に全員が異論はないと頷く。"

[[dialogue]]
speaker = "unk"
# 納得したというより、よく分からないので流れに身を任せたといった様子だった。
line = "納得したというより、よく分からないので流れに身を任せたといった様子だった。"

[[dialogue]]
speaker = "オオヒメ"
# 「担当が決まったところで……ラクシャ、演奏する楽曲は決まっているのか？」
line = "「担当が決まったところで……ラクシャ、演奏する楽曲は決まっているのか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「抜かりはないよ。ちゃんと目星はつけてるから」
line = "「抜かりはないよ。ちゃんと目星はつけてるから」"

[[dialogue]]
speaker = "unk"
# ラクシャはＤＩＳＣを取り出すと、画面が見えるようにみんなの前に差し出す。
line = "ラクシャはＤＩＳＣを取り出すと、画面が見えるようにみんなの前に差し出す。"

[[dialogue]]
speaker = "ラクシャ"
# 「じゃあいくよ、動画再生、スタート！」
line = "「じゃあいくよ、動画再生、スタート！」"

[[dialogue]]
speaker = "マグダレナ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "アルモタヘル"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "セシア"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "パテル"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "オオヒメ"
# 「……随分と、激しい曲のようだが……」
line = "「……随分と、激しい曲のようだが……」"

[[dialogue]]
speaker = "ラクシャ"
# 「バリバリのロックだよ♪　フェスでこれの生演奏を見たことがあるんだけど、すごかったんだ～！　盛り上がること間違いなし！」
line = "「バリバリのロックだよ♪　フェスでこれの生演奏を見たことがあるんだけど、すごかったんだ～！　盛り上がること間違いなし！」"

[[dialogue]]
speaker = "オオヒメ"
# 「それはそうだが……このような激しい曲を、未経験者だらけの私たちに演奏できるのか？」
line = "「それはそうだが……このような激しい曲を、未経験者だらけの私たちに演奏できるのか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「大丈夫だよ！　なんたってボクらは守護天使バンド『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』だからね」
line = "「大丈夫だよ！　なんたってボクらは守護天使バンド『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』だからね」"

[[dialogue]]
speaker = "ラクシャ"
# 「ボクたちにはデネブの人々を励ましたいっていう熱いソウルがあるんだ！　普通なら不可能ってことも可能にできちゃったりするのさっ！」
line = "「ボクたちにはデネブの人々を励ましたいっていう熱いソウルがあるんだ！　普通なら不可能ってことも可能にできちゃったりするのさっ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「さあ、みんな！　楽器を持って！　『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』の初セッションだよ！」
line = "「さあ、みんな！　楽器を持って！　『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』の初セッションだよ！」"

[[dialogue]]
speaker = "オオヒメ"
# 「セッション！？　いきなり弾くとか、無理に決まっている！？」
line = "「セッション！？　いきなり弾くとか、無理に決まっている！？」"

[[dialogue]]
speaker = "ラクシャ"
# 「そんなことないさ！　ソウルの命じるままに奏でれば、相棒はきっと応えてくれる！　オーケー？」
line = "「そんなことないさ！　ソウルの命じるままに奏でれば、相棒はきっと応えてくれる！　オーケー？」"

[[dialogue]]
speaker = "オオヒメ"
# 「お。おーけー……」
line = "「お。おーけー……」"

[[dialogue]]
speaker = "ラクシャ"
# 「オーケー、いくよ～♪　ワーン、ツー、ワンツースリーフォーっ♪」
line = "「オーケー、いくよ～♪　ワーン、ツー、ワンツースリーフォーっ♪」"
