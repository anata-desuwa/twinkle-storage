[[dialogue]]
speaker = "unk"
# 果たして、ヨミと狛里の２人により、ライカンスウォームのボス個体は討伐された。
line = "果たして、ヨミと狛里の２人により、ライカンスウォームのボス個体は討伐された。"

[[dialogue]]
speaker = "unk"
# その後、増殖が止まった群れについても、学園の星騎士たちによって無事に全滅させることができた。
line = "その後、増殖が止まった群れについても、学園の星騎士たちによって無事に全滅させることができた。"

[[dialogue]]
speaker = "unk"
# それから数日後。
line = "それから数日後。"

[[dialogue]]
speaker = "狛里"
# 「ヨミ先輩！　頼まれていたお掃除、終わったのです！」
line = "「ヨミ先輩！　頼まれていたお掃除、終わったのです！」"

[[dialogue]]
speaker = "ヨミ"
# 「狛里、ありがとうございます」
line = "「狛里、ありがとうございます」"

[[dialogue]]
speaker = "ヨミ"
# 「……あっ、そこの隅っこの窓、拭き忘れがありますね」
line = "「……あっ、そこの隅っこの窓、拭き忘れがありますね」"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ！？」
line = "「ばうわふっ！？」"

[[dialogue]]
speaker = "狛里"
# 「ほ、本当なのです！　ごめんなさいなのです……」
line = "「ほ、本当なのです！　ごめんなさいなのです……」"

[[dialogue]]
speaker = "ヨミ"
# 「ですが、以前よりミスが減って、丁寧な仕事ができていると感じますよ！」
line = "「ですが、以前よりミスが減って、丁寧な仕事ができていると感じますよ！」"

[[dialogue]]
speaker = "狛里"
# 「えへへっ♪　本当でありますか……？　ヨミ先輩にそう言ってもらえると、嬉しいのです！」
line = "「えへへっ♪　本当でありますか……？　ヨミ先輩にそう言ってもらえると、嬉しいのです！」"

[[dialogue]]
speaker = "狛里"
# 「実は最近、お仕事が終わった後に『見直しの時間』を作るようにしているのです！」
line = "「実は最近、お仕事が終わった後に『見直しの時間』を作るようにしているのです！」"

[[dialogue]]
speaker = "ヨミ"
# 「なるほど。凄くいいことだと思います」
line = "「なるほど。凄くいいことだと思います」"

[[dialogue]]
speaker = "ヨミ"
# 「焦らなくても、狛里は十分頑張っていますから。この調子で行きましょう！」
line = "「焦らなくても、狛里は十分頑張っていますから。この調子で行きましょう！」"

[[dialogue]]
speaker = "狛里"
# 「はいなのですっ！」
line = "「はいなのですっ！」"

[[dialogue]]
speaker = "unk"
# 狛里は嬉しそうに尻尾を振る。
line = "狛里は嬉しそうに尻尾を振る。"

[[dialogue]]
speaker = "unk"
# その様子を見て、ヨミも少し嬉しくなるのだった。
line = "その様子を見て、ヨミも少し嬉しくなるのだった。"

[[dialogue]]
speaker = "unk"
# 昼休み。
line = "昼休み。"

[[dialogue]]
speaker = "unk"
# 俺が食事をしていると――
line = "俺が食事をしていると――"

[[dialogue]]
speaker = "狛里"
# 「魔王様、発見であります♪」
line = "「魔王様、発見であります♪」"

[[dialogue]]
speaker = "狛里"
# 「くんくん、くんくん♪」
line = "「くんくん、くんくん♪」"

[[dialogue]]
speaker = "unk"
# こ、狛里、人前だと恥ずかしいって！
line = "こ、狛里、人前だと恥ずかしいって！"

[[dialogue]]
speaker = "unk"
# 狛里は俺の隣へやって来ると、べったりと体をひっつけて頭や腋の匂いを嗅ぎ始めた。
line = "狛里は俺の隣へやって来ると、べったりと体をひっつけて頭や腋の匂いを嗅ぎ始めた。"

[[dialogue]]
speaker = "狛里"
# 「えへへっ、今日も魔王様はいい匂いがするのです♪」
line = "「えへへっ、今日も魔王様はいい匂いがするのです♪」"

[[dialogue]]
speaker = "ヨミ"
# 「こややっ！？　こ、狛里！　お昼休憩だからといって、会長にくっ付き過ぎです！」
line = "「こややっ！？　こ、狛里！　お昼休憩だからといって、会長にくっ付き過ぎです！」"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ♪　だって魔王様の匂い、大好きなんですもん♪」
line = "「ばうわふっ♪　だって魔王様の匂い、大好きなんですもん♪」"

[[dialogue]]
speaker = "ヨミ"
# 「め、メイドたるもの、節度は必要ですよ！」
line = "「め、メイドたるもの、節度は必要ですよ！」"

[[dialogue]]
speaker = "狛里"
# 「は～い♪」
line = "「は～い♪」"

[[dialogue]]
speaker = "ヨミ"
# 「返事だけは素直なんですから、もう……」
line = "「返事だけは素直なんですから、もう……」"

[[dialogue]]
speaker = "狛里"
# 「てへへ♪」
line = "「てへへ♪」"

[[dialogue]]
speaker = "unk"
# 狛里の尻尾が、楽しそうにパタパタと振られる。
line = "狛里の尻尾が、楽しそうにパタパタと振られる。"

[[dialogue]]
speaker = "unk"
# ヨミも狛里にすっかり懐かれてるな
line = "ヨミも狛里にすっかり懐かれてるな"

[[dialogue]]
speaker = "ヨミ"
# 「あはは……。威厳がなくて、いいのか悪いのか」
line = "「あはは……。威厳がなくて、いいのか悪いのか」"

[[dialogue]]
speaker = "ヨミ"
# 「それでは一緒に、本日の料理練習を始めましょう！」
line = "「それでは一緒に、本日の料理練習を始めましょう！」"

[[dialogue]]
speaker = "狛里"
# 「了解であります！」
line = "「了解であります！」"

[[dialogue]]
speaker = "狛里"
# 「今日は肉じゃがなのですね！」
line = "「今日は肉じゃがなのですね！」"

[[dialogue]]
speaker = "ヨミ"
# 「はい。メイド長から教わった内容を思い出して――」
line = "「はい。メイド長から教わった内容を思い出して――」"

[[dialogue]]
speaker = "ヨミ"
# 「……あれ？」
line = "「……あれ？」"

[[dialogue]]
speaker = "狛里"
# 「ヨミ先輩？」
line = "「ヨミ先輩？」"

[[dialogue]]
speaker = "ヨミ"
# 「そのぉ……じゃがいもって、先に入れるんでしたっけ？」
line = "「そのぉ……じゃがいもって、先に入れるんでしたっけ？」"

[[dialogue]]
speaker = "狛里"
# 「え？」
line = "「え？」"

[[dialogue]]
speaker = "ヨミ"
# 「お肉が先でしたっけ……？」
line = "「お肉が先でしたっけ……？」"

[[dialogue]]
speaker = "狛里"
# 「え？」
line = "「え？」"

[[dialogue]]
speaker = "ヨミ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "狛里"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "ヨミ"
# 「こやぁ～～っ！？」
line = "「こやぁ～～っ！？」"

[[dialogue]]
speaker = "ヨミ"
# 「わ、忘れてしまいました～～っ！！」
line = "「わ、忘れてしまいました～～っ！！」"

[[dialogue]]
speaker = "狛里"
# 「だ、大丈夫なのです！」
line = "「だ、大丈夫なのです！」"

[[dialogue]]
speaker = "狛里"
# 「狛里、ちゃんとメモしてあるのです！」
line = "「狛里、ちゃんとメモしてあるのです！」"

[[dialogue]]
speaker = "unk"
# 狛里は懐からメモ帳を取り出す。
line = "狛里は懐からメモ帳を取り出す。"

[[dialogue]]
speaker = "ヨミ"
# 「助かります……！」
line = "「助かります……！」"

[[dialogue]]
speaker = "狛里"
# 「先輩、できない時は狛里を頼ってくださいなのです」
line = "「先輩、できない時は狛里を頼ってくださいなのです」"

[[dialogue]]
speaker = "狛里"
# 「狛里も、できない時はヨミ先輩を頼るのですから！」
line = "「狛里も、できない時はヨミ先輩を頼るのですから！」"

[[dialogue]]
speaker = "ヨミ"
# 「……ふふっ」
line = "「……ふふっ」"

[[dialogue]]
speaker = "unk"
# ヨミは少し照れながら笑った。
line = "ヨミは少し照れながら笑った。"

[[dialogue]]
speaker = "ヨミ"
# 「そうですね」
line = "「そうですね」"

[[dialogue]]
speaker = "ヨミ"
# 「私も、まだまだ未熟です」
line = "「私も、まだまだ未熟です」"

[[dialogue]]
speaker = "ヨミ"
# 「でも――」
line = "「でも――」"

[[dialogue]]
speaker = "ヨミ"
# 「狛里が安心して頼れるような先輩になれるよう、これからも頑張ります」
line = "「狛里が安心して頼れるような先輩になれるよう、これからも頑張ります」"

[[dialogue]]
speaker = "狛里"
# 「はいっ！」
line = "「はいっ！」"

[[dialogue]]
speaker = "狛里"
# 「狛里も、そんな先輩を頼ってもらえるような、立派な後輩になるのです！」
line = "「狛里も、そんな先輩を頼ってもらえるような、立派な後輩になるのです！」"

[[dialogue]]
speaker = "unk"
# ２人は顔を見合わせる。そして――
line = "２人は顔を見合わせる。そして――"

[[dialogue]]
speaker = "ヨミ＆狛里"
# 「あははっ♪」
line = "「あははっ♪」"

[[dialogue]]
speaker = "unk"
# 楽しそうな笑い声が厨房に響く。
line = "楽しそうな笑い声が厨房に響く。"

[[dialogue]]
speaker = "ヘレナ"
# 「ふむ」
line = "「ふむ」"

[[dialogue]]
speaker = "ヘレナ"
# 「ヨミも、少しは先輩らしくなったようだな」
line = "「ヨミも、少しは先輩らしくなったようだな」"

[[dialogue]]
speaker = "蘭美"
# 「はい。まだまだ未熟ですけど……」
line = "「はい。まだまだ未熟ですけど……」"

[[dialogue]]
speaker = "蘭美"
# 「先輩は後輩に教えて、一緒に成長していくものですから♪」
line = "「先輩は後輩に教えて、一緒に成長していくものですから♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「であるな。狛里も一歩、良き方向へ進めたようだ」
line = "「であるな。狛里も一歩、良き方向へ進めたようだ」"

[[dialogue]]
speaker = "unk"
# ヨミと狛里を影から見守りながら、微笑む２人。
line = "ヨミと狛里を影から見守りながら、微笑む２人。"

[[dialogue]]
speaker = "ヨミ"
# 「狛里、次は買い出しの復習をしますよ」
line = "「狛里、次は買い出しの復習をしますよ」"

[[dialogue]]
speaker = "狛里"
# 「はいっ！　ちゃんとメモも持ってきたのです！」
line = "「はいっ！　ちゃんとメモも持ってきたのです！」"

[[dialogue]]
speaker = "ヨミ"
# 「バッチリですね♪　それでは一緒に行きましょう！」
line = "「バッチリですね♪　それでは一緒に行きましょう！」"

[[dialogue]]
speaker = "狛里"
# 「かしこまりましたであります！」
line = "「かしこまりましたであります！」"

[[dialogue]]
speaker = "unk"
# 以前より少しだけ先輩らしくなったヨミと、前より落ち着いて人を頼れるようになった狛里。
line = "以前より少しだけ先輩らしくなったヨミと、前より落ち着いて人を頼れるようになった狛里。"

[[dialogue]]
speaker = "unk"
# 九浄家メイド隊の２人は、仲良く並んで歩き出すのだった。
line = "九浄家メイド隊の２人は、仲良く並んで歩き出すのだった。"
