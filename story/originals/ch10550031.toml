[[dialogue]]
speaker = "unk"
# 第１話,推しのメイド姿が可愛すぎて無理,P
line = "第１話,推しのメイド姿が可愛すぎて無理,P"

[[dialogue]]
speaker = "美鶴"
# 「どうぞ、会長さーん。エルデリーゼ様がお待ちすよー」
line = "「どうぞ、会長さーん。エルデリーゼ様がお待ちすよー」"

[[dialogue]]
speaker = "unk"
# エルゼに呼び出された先は、なぜか九浄家のお屋敷だった。
line = "エルゼに呼び出された先は、なぜか九浄家のお屋敷だった。"

[[dialogue]]
speaker = "unk"
# 美鶴の案内の元、中庭へと足を運ぶと──
line = "美鶴の案内の元、中庭へと足を運ぶと──"

[[dialogue]]
speaker = "エルデリーゼ"
# 「お待ちしておりましたわ、会長様」
line = "「お待ちしておりましたわ、会長様」"

[[dialogue]]
speaker = "unk"
# メイド服のエルゼに出迎えられた。
line = "メイド服のエルゼに出迎えられた。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「やっと念願のメイド服を着ることが出来ましたわ。はぁあぁん……かわいい、かわいすぎます……かわいすぎて無理ですわ……<emoji=heart04>」
line = "「やっと念願のメイド服を着ることが出来ましたわ。はぁあぁん……かわいい、かわいすぎます……かわいすぎて無理ですわ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# その格好は！？
line = "その格好は！？"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ヘレナ様にメイド服をいただきましたの。私専用の特注品なのですわ」
line = "「ヘレナ様にメイド服をいただきましたの。私専用の特注品なのですわ」"

[[dialogue]]
speaker = "美鶴"
# 「縫製はいつも通りうちの仕事ー」
line = "「縫製はいつも通りうちの仕事ー」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「身体にぴったり、シンデレラフィットですわ。美鶴様はとても素晴らしいお仕事をなさいますのね。当家にも来ていただきたいくらいですわ」
line = "「身体にぴったり、シンデレラフィットですわ。美鶴様はとても素晴らしいお仕事をなさいますのね。当家にも来ていただきたいくらいですわ」"

[[dialogue]]
speaker = "unk"
# メイド服なんて見慣れてるんじゃ？
line = "メイド服なんて見慣れてるんじゃ？"

[[dialogue]]
speaker = "エルデリーゼ"
# 「見るのと着るのとでは全く別なのですわ」
line = "「見るのと着るのとでは全く別なのですわ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「以前、お屋敷で働いておりましたメイドに『メイド服を着てみたいので私の服と交換して欲しい』とお願いしたことがあるのですけど」
line = "「以前、お屋敷で働いておりましたメイドに『メイド服を着てみたいので私の服と交換して欲しい』とお願いしたことがあるのですけど」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「『お嬢様にこのような服を着せるなんて、とんでもございません！』と叱られてしまいましたの」
line = "「『お嬢様にこのような服を着せるなんて、とんでもございません！』と叱られてしまいましたの」"

[[dialogue]]
speaker = "美鶴"
# 「いくらデザインが可愛くても、あくまで使用人の服装っすからねー」
line = "「いくらデザインが可愛くても、あくまで使用人の服装っすからねー」"

[[dialogue]]
speaker = "美鶴"
# 「五名門のお嬢様が着るにゃ相応しくはないでしょうよ。うちが頼まれても、多分貸さなかったっすね」
line = "「五名門のお嬢様が着るにゃ相応しくはないでしょうよ。うちが頼まれても、多分貸さなかったっすね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「私も軽率な発言をしたと反省しましたわ……」
line = "「私も軽率な発言をしたと反省しましたわ……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そんなことがあって諦めていたところに今回のお話を頂いて……あぁ、ヘレナ様、本当にありがとうございます！」
line = "「そんなことがあって諦めていたところに今回のお話を頂いて……あぁ、ヘレナ様、本当にありがとうございます！」"

[[dialogue]]
speaker = "unk"
# どうしてメイド服に憧れてたの？
line = "どうしてメイド服に憧れてたの？"

[[dialogue]]
speaker = "エルデリーゼ"
# 「話せば長くなりますが──そう、あれはお忍びで推しの地下アイドルのライブを見に行った時のことですわ」
line = "「話せば長くなりますが──そう、あれはお忍びで推しの地下アイドルのライブを見に行った時のことですわ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「今日はどんなパフォーマンスを見せてくださるのでしょう──」
line = "「今日はどんなパフォーマンスを見せてくださるのでしょう──」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そんな風にドキドキしながら開演を待っていると、舞台袖から何人ものメイドさんが現れましたの」
line = "「そんな風にドキドキしながら開演を待っていると、舞台袖から何人ものメイドさんが現れましたの」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「いつもはメンバーカラーに合わせた色とりどりの衣装なのですけど、その日は特別イベントで全員メイド服を着ていましたわ」
line = "「いつもはメンバーカラーに合わせた色とりどりの衣装なのですけど、その日は特別イベントで全員メイド服を着ていましたわ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そのメイド衣装に身を包んだ推しの皆様を一目見た瞬間、私の全身にビビビと電気が走ったのですわ！」
line = "「そのメイド衣装に身を包んだ推しの皆様を一目見た瞬間、私の全身にビビビと電気が走ったのですわ！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「早鐘のような胸の高鳴り、血が沸き立つような昂揚……あのトキメキを何と表現していいのか、私には分かりませんでした」
line = "「早鐘のような胸の高鳴り、血が沸き立つような昂揚……あのトキメキを何と表現していいのか、私には分かりませんでした」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ですが、後に知りましたの！　あれこそが『好きすぎて無理』もしくは『てぇてぇ』と呼ばれることに……！」
line = "「ですが、後に知りましたの！　あれこそが『好きすぎて無理』もしくは『てぇてぇ』と呼ばれることに……！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「我に返った頃には、ステージは終了していて……手元にはいつの間にか購入していた全てのメイドさんのチェキが残っていましたわ……」
line = "「我に返った頃には、ステージは終了していて……手元にはいつの間にか購入していた全てのメイドさんのチェキが残っていましたわ……」"

[[dialogue]]
speaker = "美鶴"
# 「推しが尊すぎてマジヤバいってヤツすね」
line = "「推しが尊すぎてマジヤバいってヤツすね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「はい……それほどまでに推しのメイド姿は、私の胸に爪痕を残していったのです……」
line = "「はい……それほどまでに推しのメイド姿は、私の胸に爪痕を残していったのです……」"

[[dialogue]]
speaker = "unk"
# どうやらそれこそが、エルゼの中に眠っていた『メイド萌え』の覚醒めた瞬間だったらしい。ちっとも長い話ではなかったな。
line = "どうやらそれこそが、エルゼの中に眠っていた『メイド萌え』の覚醒めた瞬間だったらしい。ちっとも長い話ではなかったな。"

[[dialogue]]
speaker = "美鶴"
# 「エルデリーゼ様がぶっ飛んじゃうほどの尊み……気になるっすね。そのアイドルさんたちはどんなパフォーマンスしてたんです？」
line = "「エルデリーゼ様がぶっ飛んじゃうほどの尊み……気になるっすね。そのアイドルさんたちはどんなパフォーマンスしてたんです？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「どのような……ですか？　それはそれは大変可愛らしくて、踊りづらそうな衣装でありながら普段以上にキレのあるダンスで──」
line = "「どのような……ですか？　それはそれは大変可愛らしくて、踊りづらそうな衣装でありながら普段以上にキレのあるダンスで──」"

[[dialogue]]
speaker = "美鶴"
# 「んー、言葉だけじゃあんましわかんないっすね。エルデリーゼ様、再現できないすか？」
line = "「んー、言葉だけじゃあんましわかんないっすね。エルデリーゼ様、再現できないすか？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「さ、再現ですの！？　私程度に上手く再現できるかどうか……」
line = "「さ、再現ですの！？　私程度に上手く再現できるかどうか……」"

[[dialogue]]
speaker = "美鶴"
# 「上手くなくてもいいんすよ。うち、見てみたいな～。ね、会長さんも見てみたいすよね？」
line = "「上手くなくてもいいんすよ。うち、見てみたいな～。ね、会長さんも見てみたいすよね？」"

[[dialogue]]
speaker = "unk"
# もちろん見てみたい！
line = "もちろん見てみたい！"

[[dialogue]]
speaker = "エルデリーゼ"
# 「わ、わかりましたわ……！　本物の魅力には遠く及ばないと思いますが……ご<ruby=しょうらん>笑覧</ruby>くださいませ」
line = "「わ、わかりましたわ……！　本物の魅力には遠く及ばないと思いますが……ご<ruby>笑覧<rt>しょうらん</rt></ruby>くださいませ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「すぅー、はぁー、すぅー、はぁー……！」
line = "「すぅー、はぁー、すぅー、はぁー……！」"

[[dialogue]]
speaker = "unk"
# 覚悟を決めたエルゼは呼吸を整えると──
line = "覚悟を決めたエルゼは呼吸を整えると──"

[[dialogue]]
speaker = "エルデリーゼ"
# 「お帰りなさいませーっ！　ご・主・人・さーまっ♪」
line = "「お帰りなさいませーっ！　ご・主・人・さーまっ♪」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「美味しくな～れ、美味しくな～れっ、萌え・萌え・きゅーん☆　で・す・わ<emoji=heart04>」
line = "「美味しくな～れ、美味しくな～れっ、萌え・萌え・きゅーん☆　で・す・わ<emoji=heart04>」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ほら、後ろのご主人さまたちー！　ちゃーんと見えておりますのよー！　お声をくださいませー！」
line = "「ほら、後ろのご主人さまたちー！　ちゃーんと見えておりますのよー！　お声をくださいませー！」"

[[dialogue]]
speaker = "美鶴"
# 「うっわ、再現度たっか」
line = "「うっわ、再現度たっか」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「さぁ、皆様もご一緒にっ♪　キュンキュンキュキューン<emoji=heart04>」
line = "「さぁ、皆様もご一緒にっ♪　キュンキュンキュキューン<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# キュンキュンキュキューン！
line = "キュンキュンキュキューン！"

[[dialogue]]
speaker = "美鶴"
# 「きゅんきゅんきゅきゅーん……だんだんメイドじゃなくなってるすね」
line = "「きゅんきゅんきゅきゅーん……だんだんメイドじゃなくなってるすね」"

[[dialogue]]
speaker = "unk"
# そのままエルゼはまるっと１曲分の完コピダンスを披露した。
line = "そのままエルゼはまるっと１曲分の完コピダンスを披露した。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ふぅー……私のメイド愛、そしてメイドさんの素晴らしさ、伝わりました？」
line = "「ふぅー……私のメイド愛、そしてメイドさんの素晴らしさ、伝わりました？」"

[[dialogue]]
speaker = "美鶴"
# 「そりゃもう、充分に」
line = "「そりゃもう、充分に」"

[[dialogue]]
speaker = "unk"
# アイドルメイド・エルゼに俺たちのハートはすっかり持っていかれたのであった。
line = "アイドルメイド・エルゼに俺たちのハートはすっかり持っていかれたのであった。"
