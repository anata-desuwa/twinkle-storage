[[dialogue]]
speaker = "unk"
# 第２話,ハロウィンな守護天使,P
line = "第２話,ハロウィンな守護天使,P"

[[dialogue]]
speaker = "ラクシャ"
# 「じゃーん♪　見て見て、どうかなこの衣装？」
line = "「じゃーん♪　見て見て、どうかなこの衣装？」"

[[dialogue]]
speaker = "unk"
# すごい、似合ってる！
line = "すごい、似合ってる！"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、いいリアクションありがとー♪」
line = "「あはは、いいリアクションありがとー♪」"

[[dialogue]]
speaker = "unk"
# 呼び出されて大聖堂に向かうと、そこには見たことのない衣装に身を包んだ環が待っていた。
line = "呼び出されて大聖堂に向かうと、そこには見たことのない衣装に身を包んだ環が待っていた。"

[[dialogue]]
speaker = "unk"
# その服はどうしたのか、と訊ねると……
line = "その服はどうしたのか、と訊ねると……"

[[dialogue]]
speaker = "ラクシャ"
# 「実は<ruby=みんな>守護天使</ruby>との間で、次の女神のルヴィネさまと再契約しようって話になってるんだけどね」
line = "「実は<ruby>守護天使<rt>みんな</rt></ruby>との間で、次の女神のルヴィネさまと再契約しようって話になってるんだけどね」"

[[dialogue]]
speaker = "ラクシャ"
# 「その契約をするとボクたちの力にちょっとした影響があるみたいなんだよ」
line = "「その契約をするとボクたちの力にちょっとした影響があるみたいなんだよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「でさ、ボクもルヴィネさまと再契約して新しい力が発現したんだけど、こんな感じの衣装をゲットしちゃったんだ♪」
line = "「でさ、ボクもルヴィネさまと再契約して新しい力が発現したんだけど、こんな感じの衣装をゲットしちゃったんだ♪」"

[[dialogue]]
speaker = "unk"
# ハロウィン風？
line = "ハロウィン風？"

[[dialogue]]
speaker = "ラクシャ"
# 「そう♪　今ちょうど、ルヴィネさまがアルタイルに通ってハロウィンのことを勉強中なんだよね」
line = "「そう♪　今ちょうど、ルヴィネさまがアルタイルに通ってハロウィンのことを勉強中なんだよね」"

[[dialogue]]
speaker = "ラクシャ"
# 「たぶんその影響が出ちゃったんだと思うよ。申し訳なさそうにしてたけど、ボク的にはすっごい気に入ってるんだー♪」
line = "「たぶんその影響が出ちゃったんだと思うよ。申し訳なさそうにしてたけど、ボク的にはすっごい気に入ってるんだー♪」"

[[dialogue]]
speaker = "オオヒメ"
# 「そうか。忙しい身の魔王をわざわざ呼び出したのは、ルヴィネ様との契約のことを伝えるためだったか」
line = "「そうか。忙しい身の魔王をわざわざ呼び出したのは、ルヴィネ様との契約のことを伝えるためだったか」"

[[dialogue]]
speaker = "unk"
# 俺と環のやり取りを黙って見守っていたヒメ、こと守護天使のオオヒメが得心いったという風に頷いた。
line = "俺と環のやり取りを黙って見守っていたヒメ、こと守護天使のオオヒメが得心いったという風に頷いた。"

[[dialogue]]
speaker = "ラクシャ"
# 「え……違うよ？　ボクのこのカッコかわいい姿を会長に見てもらいたかっただけだよ？」
line = "「え……違うよ？　ボクのこのカッコかわいい姿を会長に見てもらいたかっただけだよ？」"

[[dialogue]]
speaker = "オオヒメ"
# 「なっ、それだけ！？　それだけのためにわざわざ呼び出したというのか？」
line = "「なっ、それだけ！？　それだけのためにわざわざ呼び出したというのか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「うん、そうだけど？」
line = "「うん、そうだけど？」"

[[dialogue]]
speaker = "オオヒメ"
# 「まったく……あなたと魔王がお付き合いしているという話は聞いていたが、恋人同士といえど少しは気を遣うべきなのではないか？」
line = "「まったく……あなたと魔王がお付き合いしているという話は聞いていたが、恋人同士といえど少しは気を遣うべきなのではないか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「ん～、そうなのかな？　ボク、会長のこと困らせちゃった？」
line = "「ん～、そうなのかな？　ボク、会長のこと困らせちゃった？」"

[[dialogue]]
speaker = "unk"
# カッコ可愛い環が見れて嬉しい
line = "カッコ可愛い環が見れて嬉しい"

[[dialogue]]
speaker = "unk"
# いや、全然
line = "いや、全然"

[[dialogue]]
speaker = "ラクシャ"
# 「あはっ、優しい～っ♪　そんな会長のことも大好きだよっ♪」
line = "「あはっ、優しい～っ♪　そんな会長のことも大好きだよっ♪」"

[[dialogue]]
speaker = "オオヒメ"
# 「くっ！　犬も食わぬとはこの事か……」
line = "「くっ！　犬も食わぬとはこの事か……」"

[[dialogue]]
speaker = "オオヒメ"
# 「というか、ワザとやっているだろう、ラクシャ！」
line = "「というか、ワザとやっているだろう、ラクシャ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「いやいや、ワザとなんかじゃないよ。これがボクと会長の自然体だもんねー<emoji=heart04>」
line = "「いやいや、ワザとなんかじゃないよ。これがボクと会長の自然体だもんねー<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# そう言うと、環は思いっきり抱きついてくる。
line = "そう言うと、環は思いっきり抱きついてくる。"

[[dialogue]]
speaker = "オオヒメ"
# 「むむ……確かにラクシャと魔王は、以前よりそのような距離感で接していた、ような気もするが……」
line = "「むむ……確かにラクシャと魔王は、以前よりそのような距離感で接していた、ような気もするが……」"

[[dialogue]]
speaker = "unk"
# 考え込んでしまうヒメ。
line = "考え込んでしまうヒメ。"

[[dialogue]]
speaker = "unk"
# 環が挑発するような行動をしているのは、それだけ彼女がからかい甲斐のある相手だからだろう。
line = "環が挑発するような行動をしているのは、それだけ彼女がからかい甲斐のある相手だからだろう。"

[[dialogue]]
speaker = "オオヒメ"
# 「時にラクシャよ、ルヴィネ様との契約によって、摂理の維持に支障は出ていないか？」
line = "「時にラクシャよ、ルヴィネ様との契約によって、摂理の維持に支障は出ていないか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「ううん、今のところ問題は起きてないよ。オオヒメはどうなの？」
line = "「ううん、今のところ問題は起きてないよ。オオヒメはどうなの？」"

[[dialogue]]
speaker = "オオヒメ"
# 「私の方も問題ない。これならルヴィネ様と他の守護天使たちとの契約を進めても良いかもしれないな」
line = "「私の方も問題ない。これならルヴィネ様と他の守護天使たちとの契約を進めても良いかもしれないな」"

[[dialogue]]
speaker = "ラクシャ"
# 「そうだね。今はハロウィンパーティーに向けて忙しそうだから難しいかもしれないけど」
line = "「そうだね。今はハロウィンパーティーに向けて忙しそうだから難しいかもしれないけど」"

[[dialogue]]
speaker = "unk"
# ハロウィンパーティー？
line = "ハロウィンパーティー？"

[[dialogue]]
speaker = "ラクシャ"
# 「ああうん、アルタイルのハロウィン有識者にいろいろ教えてもらって、デネブでもパーティーを開こうとしてるんだ」
line = "「ああうん、アルタイルのハロウィン有識者にいろいろ教えてもらって、デネブでもパーティーを開こうとしてるんだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「それでそのハロウィンパーティーでは、ボクたち守護天使がバンドを組んで演奏することになったんだよ」
line = "「それでそのハロウィンパーティーでは、ボクたち守護天使がバンドを組んで演奏することになったんだよ」"

[[dialogue]]
speaker = "unk"
# 面白そうだ！
line = "面白そうだ！"

[[dialogue]]
speaker = "unk"
# 守護天使バンド！？
line = "守護天使バンド！？"

[[dialogue]]
speaker = "ラクシャ"
# 「でしょ～？　会長にもぜひ見に来て欲しいんだけど……会場がデネブだからちょっと厳しいんだよね～」
line = "「でしょ～？　会長にもぜひ見に来て欲しいんだけど……会場がデネブだからちょっと厳しいんだよね～」"

[[dialogue]]
speaker = "オオヒメ"
# 「アルタイルでもハロウィンパーティーは開かれる。それに向けて魔王は魔王で忙しいだろうからな」
line = "「アルタイルでもハロウィンパーティーは開かれる。それに向けて魔王は魔王で忙しいだろうからな」"

[[dialogue]]
speaker = "unk"
# せめて会場がアルタイルであるならば何とかなったかもしれないが、デネブとなると難しい。
line = "せめて会場がアルタイルであるならば何とかなったかもしれないが、デネブとなると難しい。"

[[dialogue]]
speaker = "unk"
# ヒメの言う通り、俺は俺でいろいろ仕事を抱えているからだ。
line = "ヒメの言う通り、俺は俺でいろいろ仕事を抱えているからだ。"

[[dialogue]]
speaker = "ラクシャ"
# 「ボクもライブに向けてギターの練習をしなくちゃいけないし、会長も忙しいってなると……」
line = "「ボクもライブに向けてギターの練習をしなくちゃいけないし、会長も忙しいってなると……」"

[[dialogue]]
speaker = "ラクシャ"
# 「ハロウィンが終わるまであんまり会えなくなっちゃうかも？　ううぅ～、超寂しいんだけどーっ！」
line = "「ハロウィンが終わるまであんまり会えなくなっちゃうかも？　ううぅ～、超寂しいんだけどーっ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「でもボク、頑張るからね！　ライブを成功させて帰ってきたら、思いっきり褒めて甘えさせてよねっ？　約束だよ！」
line = "「でもボク、頑張るからね！　ライブを成功させて帰ってきたら、思いっきり褒めて甘えさせてよねっ？　約束だよ！」"

[[dialogue]]
speaker = "unk"
# 頑張れ！
line = "頑張れ！"

[[dialogue]]
speaker = "unk"
# 約束するよ
line = "約束するよ"

[[dialogue]]
speaker = "ラクシャ"
# 「うんっ、ありがとーっ<emoji=heart04>」
line = "「うんっ、ありがとーっ<emoji=heart04>」"

[[dialogue]]
speaker = "オオヒメ"
# 「また始まった……」
line = "「また始まった……」"

[[dialogue]]
speaker = "unk"
# 俺たちの様子を見て、ヒメがげんなりした顔になっていた。
line = "俺たちの様子を見て、ヒメがげんなりした顔になっていた。"

[[dialogue]]
speaker = "unk"
# せめて動画を撮っておいてくれないか？
line = "せめて動画を撮っておいてくれないか？"

[[dialogue]]
speaker = "unk"
# あ、そうだ……
line = "あ、そうだ……"

[[dialogue]]
speaker = "ラクシャ"
# 「あっ、そうだね！　だったら会長にも見てもらえる！」
line = "「あっ、そうだね！　だったら会長にも見てもらえる！」"

[[dialogue]]
speaker = "ラクシャ"
# 「任せといて！　会長が惚れ直しちゃうようなカッコいい雄姿を見せてあげるから、楽しみにしててよ♪」
line = "「任せといて！　会長が惚れ直しちゃうようなカッコいい雄姿を見せてあげるから、楽しみにしててよ♪」"

[[dialogue]]
speaker = "unk"
# 自信たっぷりに親指を立ててみせる環。
line = "自信たっぷりに親指を立ててみせる環。"

[[dialogue]]
speaker = "unk"
# ライブで声援を送れないのは残念だけど、これでハロウィンの楽しみが１つ増えたのだった。
line = "ライブで声援を送れないのは残念だけど、これでハロウィンの楽しみが１つ増えたのだった。"
