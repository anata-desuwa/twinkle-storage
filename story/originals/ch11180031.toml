[[dialogue]]
speaker = "unk"
# 第１話,両手に花と蜘蛛,P
line = "第１話,両手に花と蜘蛛,P"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃんに絶対に似合うお洋服見つけたんだっ。今日こそはお買い物に付き合ってよーっ」
line = "「ナターシャちゃんに絶対に似合うお洋服見つけたんだっ。今日こそはお買い物に付き合ってよーっ」"

[[dialogue]]
speaker = "unk"
# ナターシャとメルエルは幼なじみ……だと思っていたが、実はナターシャは護衛としてメルエルのそばにいた。
line = "ナターシャとメルエルは幼なじみ……だと思っていたが、実はナターシャは護衛としてメルエルのそばにいた。"

[[dialogue]]
speaker = "unk"
# ナターシャはメルエルに複雑な想いを抱いていたようだが、先日の天界行きの際に、関係は改善したらしい。
line = "ナターシャはメルエルに複雑な想いを抱いていたようだが、先日の天界行きの際に、関係は改善したらしい。"

[[dialogue]]
speaker = "ナターシャ"
# 「え～、なんで私がメルエルと……じゃ、そのお店、教えて。１人で行ってくるから」
line = "「え～、なんで私がメルエルと……じゃ、そのお店、教えて。１人で行ってくるから」"

[[dialogue]]
speaker = "メルエル"
# 「それじゃダメなのっ！　ナターシャちゃんと一緒に行きたいのっ！」
line = "「それじゃダメなのっ！　ナターシャちゃんと一緒に行きたいのっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「っていうか、私の胸、ちゃんと収まるの？　この前の試着の時みたいにボタン弾け飛ばない？」
line = "「っていうか、私の胸、ちゃんと収まるの？　この前の試着の時みたいにボタン弾け飛ばない？」"

[[dialogue]]
speaker = "メルエル"
# 「………………たぶん！」
line = "「………………たぶん！」"

[[dialogue]]
speaker = "ナターシャ"
# 「随分溜めたね。ま～、この前バスト測ったら、また少し成長してたみたいだし」
line = "「随分溜めたね。ま～、この前バスト測ったら、また少し成長してたみたいだし」"

[[dialogue]]
speaker = "メルエル"
# 「まだ成長してるのっ！？　ナターシャちゃん、どこまでセクシーになっちゃうのっ！？」
line = "「まだ成長してるのっ！？　ナターシャちゃん、どこまでセクシーになっちゃうのっ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「いや、メルエルには言われたくないから」
line = "「いや、メルエルには言われたくないから」"

[[dialogue]]
speaker = "unk"
# ……何の話してるの
line = "……何の話してるの"

[[dialogue]]
speaker = "ナターシャ"
# 「あ、会長さん。おっぱいの話だよ」
line = "「あ、会長さん。おっぱいの話だよ」"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃん！？　間違ってないといえば間違ってないけど、言い方ぁ～！？」
line = "「ナターシャちゃん！？　間違ってないといえば間違ってないけど、言い方ぁ～！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「こんなの重くてしょうがないだけなのに、メルエルってばまだおっぱい大きくなりたいんだって。充分立派なのがあるのにね」
line = "「こんなの重くてしょうがないだけなのに、メルエルってばまだおっぱい大きくなりたいんだって。充分立派なのがあるのにね」"

[[dialogue]]
speaker = "メルエル"
# 「そんな話してたかなっ！？　確かに、おっぱ──胸の話はしてたけど、ナターシャちゃんこそ立派すぎるよっ！」
line = "「そんな話してたかなっ！？　確かに、おっぱ──胸の話はしてたけど、ナターシャちゃんこそ立派すぎるよっ！」"

[[dialogue]]
speaker = "unk"
# メルエルをからかうナターシャだが、その言動に悪意は感じない。
line = "メルエルをからかうナターシャだが、その言動に悪意は感じない。"

[[dialogue]]
speaker = "unk"
# 誰もが想像するわかりやすい仲良しではないものの、これが２人なりの良好な関係なんだと思う。
line = "誰もが想像するわかりやすい仲良しではないものの、これが２人なりの良好な関係なんだと思う。"

[[dialogue]]
speaker = "ナターシャ"
# 「そうだ、会長さんも一緒にお出かけしない？　両手に花の放課後デートだよ」
line = "「そうだ、会長さんも一緒にお出かけしない？　両手に花の放課後デートだよ」"

[[dialogue]]
speaker = "メルエル"
# 「私とお買い物に行くのは渋ったのに、会長くんが一緒ならＯＫなの？」
line = "「私とお買い物に行くのは渋ったのに、会長くんが一緒ならＯＫなの？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ケンカになりがちだから、仲裁してくれる人が必要でしょ。その点、会長さんなら公平な目線で止めてくれそうだしね」
line = "「ケンカになりがちだから、仲裁してくれる人が必要でしょ。その点、会長さんなら公平な目線で止めてくれそうだしね」"

[[dialogue]]
speaker = "unk"
# いざという時のケンカの仲裁役として、俺は２人に挟まれ、腕を引かれながら街へと繰り出すことになった。
line = "いざという時のケンカの仲裁役として、俺は２人に挟まれ、腕を引かれながら街へと繰り出すことになった。"

[[dialogue]]
speaker = "unk"
# ケンカにならないことを祈るばかりだ。
line = "ケンカにならないことを祈るばかりだ。"

[[dialogue]]
speaker = "メルエル"
# 「ほら、この服！　絶対ナターシャちゃんに似合うと思ったんだっ」
line = "「ほら、この服！　絶対ナターシャちゃんに似合うと思ったんだっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふ～ん……ゆったりしてるから私の胸でも入るし、ベルトで締めれば太ってるようにも見えないね」
line = "「ふ～ん……ゆったりしてるから私の胸でも入るし、ベルトで締めれば太ってるようにも見えないね」"

[[dialogue]]
speaker = "メルエル"
# 「でしょ！　前にナターシャちゃん、こういう服ならいいのにって言ってたもんね。お買い上げしちゃう？」
line = "「でしょ！　前にナターシャちゃん、こういう服ならいいのにって言ってたもんね。お買い上げしちゃう？」"

[[dialogue]]
speaker = "ナターシャ"
# 「まあ……検討しとくよ。探してくれて、ありがと」
line = "「まあ……検討しとくよ。探してくれて、ありがと」"

[[dialogue]]
speaker = "ナターシャ"
# 「にしても……このお店、ハロウィンだらけだね。ハロウィンってもうすぐなんだっけ」
line = "「にしても……このお店、ハロウィンだらけだね。ハロウィンってもうすぐなんだっけ」"

[[dialogue]]
speaker = "メルエル"
# 「うんっ！　テンション上がっちゃうよねっ」
line = "「うんっ！　テンション上がっちゃうよねっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ん～……私は別にそんなことないけど。あ、仮装用のコスチュームとか、頭飾りなんかも置いてある……これ、ネコミミ？」
line = "「ん～……私は別にそんなことないけど。あ、仮装用のコスチュームとか、頭飾りなんかも置いてある……これ、ネコミミ？」"

[[dialogue]]
speaker = "メルエル"
# 「かわいいっ！　ナターシャちゃんつけてみて！」
line = "「かわいいっ！　ナターシャちゃんつけてみて！」"

[[dialogue]]
speaker = "ナターシャ"
# 「絶対ヤ」
line = "「絶対ヤ」"

[[dialogue]]
speaker = "メルエル"
# 「秒で拒否されたっ！？」
line = "「秒で拒否されたっ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「で、このヒモみたいなのは……サキュバスのコスチューム？　エッチだね、メルエル着てみて？」
line = "「で、このヒモみたいなのは……サキュバスのコスチューム？　エッチだね、メルエル着てみて？」"

[[dialogue]]
speaker = "メルエル"
# 「絶対着ないよっ！？　これで表に出たら通報されちゃうよっ！？」
line = "「絶対着ないよっ！？　これで表に出たら通報されちゃうよっ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「秒で拒否された」
line = "「秒で拒否された」"

[[dialogue]]
speaker = "メルエル"
# 「会長くんの前で、こんなの着れないよ～っ！　お尻なんてほとんど丸出しだし……」
line = "「会長くんの前で、こんなの着れないよ～っ！　お尻なんてほとんど丸出しだし……」"

[[dialogue]]
speaker = "ナターシャ"
# 「逆でしょ。これを着て会長さんを誘惑すれば、メルエルにメロメロだよ」
line = "「逆でしょ。これを着て会長さんを誘惑すれば、メルエルにメロメロだよ」"

[[dialogue]]
speaker = "メルエル"
# 「そんなの無理っ！　無理無理無理だよーっ！」
line = "「そんなの無理っ！　無理無理無理だよーっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「せっかくのチャンスなのに。そんな調子じゃ、メルエルが会長さんを落とすなんて夢のまた夢──ひぃっ！？」
line = "「せっかくのチャンスなのに。そんな調子じゃ、メルエルが会長さんを落とすなんて夢のまた夢──ひぃっ！？」"

[[dialogue]]
speaker = "メルエル"
# 「え？　今の可愛い悲鳴、ナターシャちゃん？」
line = "「え？　今の可愛い悲鳴、ナターシャちゃん？」"

[[dialogue]]
speaker = "unk"
# 蜘蛛の巣のステッカー？
line = "蜘蛛の巣のステッカー？"

[[dialogue]]
speaker = "unk"
# 何かあった？
line = "何かあった？"

[[dialogue]]
speaker = "ナターシャ"
# 「べ、別に？　不意に出てきたから、ちょっと驚いただけだよ」
line = "「べ、別に？　不意に出てきたから、ちょっと驚いただけだよ」"

[[dialogue]]
speaker = "メルエル"
# 「ナターシャちゃんの虫嫌いは知ってたけど、こんなのでもダメなんだ？　あ、こっちには蜘蛛のステッカーもある」
line = "「ナターシャちゃんの虫嫌いは知ってたけど、こんなのでもダメなんだ？　あ、こっちには蜘蛛のステッカーもある」"

[[dialogue]]
speaker = "ナターシャ"
# 「ぅひっ！？　や、ステッカーくらい平気だって……」
line = "「ぅひっ！？　や、ステッカーくらい平気だって……」"

[[dialogue]]
speaker = "メルエル"
# 「ほんとに？　ナターシャちゃん、腰が引けてるよ？」
line = "「ほんとに？　ナターシャちゃん、腰が引けてるよ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「あまり調子に乗ってるとメルエルの恥ずかしい秘密、会長さんの前でバラしちゃうよ」
line = "「あまり調子に乗ってるとメルエルの恥ずかしい秘密、会長さんの前でバラしちゃうよ」"

[[dialogue]]
speaker = "メルエル"
# 「それはズルいよっ！　私だってナターシャちゃんの恥ずかしい秘密のひとつやふたつあるもんっ！」
line = "「それはズルいよっ！　私だってナターシャちゃんの恥ずかしい秘密のひとつやふたつあるもんっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「いい度胸だね、メルエル。暴露をしていいのは、暴露される覚悟があるやつだけだよ？」
line = "「いい度胸だね、メルエル。暴露をしていいのは、暴露される覚悟があるやつだけだよ？」"

[[dialogue]]
speaker = "unk"
# ビークール、ビークール！
line = "ビークール、ビークール！"

[[dialogue]]
speaker = "unk"
# どうどうどうどう！
line = "どうどうどうどう！"

[[dialogue]]
speaker = "unk"
# こうして俺は暴露合戦を止め、２人の仲裁役の仕事を果たした。
line = "こうして俺は暴露合戦を止め、２人の仲裁役の仕事を果たした。"

[[dialogue]]
speaker = "unk"
# 今後も仲裁役の出番が増える……かもしれない。
line = "今後も仲裁役の出番が増える……かもしれない。"
