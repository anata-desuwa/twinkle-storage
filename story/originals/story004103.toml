[[dialogue]]
speaker = "イクシリオン"
# 「……み、みなさん、こんにちは……」
line = "「……み、みなさん、こんにちは……」"

[[dialogue]]
speaker = "モネ"
# 「イクシーさん？　どうしてそんなところに隠れていたんですか？」
line = "「イクシーさん？　どうしてそんなところに隠れていたんですか？」"

[[dialogue]]
speaker = "イクシリオン"
# 「なんと言いましょうか……出ていきづらくて……つい」
line = "「なんと言いましょうか……出ていきづらくて……つい」"

[[dialogue]]
speaker = "カティア"
# （なんでイクシーが？　イクシーも魔将狙いってこと？）
line = "（なんでイクシーが？　イクシーも魔将狙いってこと？）"

[[dialogue]]
speaker = "カティア"
# （うぅ～、ライバルが多いなぁ……）
line = "（うぅ～、ライバルが多いなぁ……）"

[[dialogue]]
speaker = "リィベル"
# 「ウィステリア。彼女は深淵書庫のことは聞いているのよね？」
line = "「ウィステリア。彼女は深淵書庫のことは聞いているのよね？」"

[[dialogue]]
speaker = "ウィステリア"
# 「ええ。あなたも知っての通り、イクシーさんは以前、紙屋敷さんと一緒に深淵書庫に落ちたことがあるから、書庫の正体や魔将のことは伝えてあるわ」
line = "「ええ。あなたも知っての通り、イクシーさんは以前、紙屋敷さんと一緒に深淵書庫に落ちたことがあるから、書庫の正体や魔将のことは伝えてあるわ」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「くふふ♪　イクシリオン先輩も実は『強欲』の力が目当てだったりして～♪」
line = "「くふふ♪　イクシリオン先輩も実は『強欲』の力が目当てだったりして～♪」"

[[dialogue]]
speaker = "イクシリオン"
# 「い、いえ、私はただ、いつもお世話になっているウィステリアさんやモネさんのお役に立ちたくて……」
line = "「い、いえ、私はただ、いつもお世話になっているウィステリアさんやモネさんのお役に立ちたくて……」"

[[dialogue]]
speaker = "イクシリオン"
# （ウソですごめんなさい！　私が気になっているのは『強欲』ではなくて別の…………）
line = "（ウソですごめんなさい！　私が気になっているのは『強欲』ではなくて別の…………）"

[[dialogue]]
speaker = "ウィステリア"
# 「じゃあ、もしかして『暴食』の魔本に興味があったり……？」
line = "「じゃあ、もしかして『暴食』の魔本に興味があったり……？」"

[[dialogue]]
speaker = "モネ"
# 「確かにイクシーさんは健啖家ですもんね。いつもご飯を美味しそうに食べていて、見てる方も幸せになります」
line = "「確かにイクシーさんは健啖家ですもんね。いつもご飯を美味しそうに食べていて、見てる方も幸せになります」"

[[dialogue]]
speaker = "イクシリオン"
# 「いえ、いえいえいえ…………」
line = "「いえ、いえいえいえ…………」"

[[dialogue]]
speaker = "ウィステリア"
# 「ふふっ、冗談よ。品行方正な優等生のイクシーさんに、大罪を背負う魔将は似合わないわ」
line = "「ふふっ、冗談よ。品行方正な優等生のイクシーさんに、大罪を背負う魔将は似合わないわ」"

[[dialogue]]
speaker = "モネ"
# 「そうですね。お気持ちはありがたいのですが、イクシーさんは無理をしなくていいんですよ。そのままのイクシーさんでいてください」
line = "「そうですね。お気持ちはありがたいのですが、イクシーさんは無理をしなくていいんですよ。そのままのイクシーさんでいてください」"

[[dialogue]]
speaker = "イクシリオン"
# 「はわ、はわわ…………恐縮です…………」
line = "「はわ、はわわ…………恐縮です…………」"

[[dialogue]]
speaker = "イクシリオン"
# （違うんです、違うんですぅっ！　私は本当は……っ）
line = "（違うんです、違うんですぅっ！　私は本当は……っ）"

[[dialogue]]
speaker = "イクシリオン"
# （エッチな本に興味があるだけなんです～～～～っ！！）
line = "（エッチな本に興味があるだけなんです～～～～っ！！）"

[[dialogue]]
speaker = "リィベル"
# 「そもそも魔本に収められているのは魔力──魔族の力よ。天使とは相性が悪いわ。魔将なら他をあたらせてもら──え、うそ？」
line = "「そもそも魔本に収められているのは魔力──魔族の力よ。天使とは相性が悪いわ。魔将なら他をあたらせてもら──え、うそ？」"

[[dialogue]]
speaker = "リィベル"
# 「『色欲』の魔本が反応しているわ……。イクシリオン、あなたに」
line = "「『色欲』の魔本が反応しているわ……。イクシリオン、あなたに」"

[[dialogue]]
speaker = "ウィステリア"
# 「えぇっ！？　本当に！？　あの真面目なイクシリオンさんに！？」
line = "「えぇっ！？　本当に！？　あの真面目なイクシリオンさんに！？」"

[[dialogue]]
speaker = "モネ"
# 「いつも勉強熱心で、保健委員の仕事にも真摯に取り組んでいるイクシーさんに！？」
line = "「いつも勉強熱心で、保健委員の仕事にも真摯に取り組んでいるイクシーさんに！？」"

[[dialogue]]
speaker = "イクシリオン"
# 「ひあ～～～っ！！」
line = "「ひあ～～～っ！！」"

[[dialogue]]
speaker = "カティア"
# （イクシーもプリマステラで、今でも強いのに、魔将の力でもっと強くなっちゃうのかな……？）
line = "（イクシーもプリマステラで、今でも強いのに、魔将の力でもっと強くなっちゃうのかな……？）"

[[dialogue]]
speaker = "カティア"
# （いいなぁ……私ももっともっと強くなりたい……）
line = "（いいなぁ……私ももっともっと強くなりたい……）"

[[dialogue]]
speaker = "カティア"
# （強い力……欲しいなぁ……）
line = "（強い力……欲しいなぁ……）"

[[dialogue]]
speaker = "イクシリオン"
# 「『色欲』の魔本が私に反応を……！？　本当ですか！？」
line = "「『色欲』の魔本が私に反応を……！？　本当ですか！？」"

[[dialogue]]
speaker = "イクシリオン"
# （そう、私が求めていたのは『色欲』の魔本。きっと、ムフフなことがたくさん書いてあるはず……ああ、気になって仕方がありません！）
line = "（そう、私が求めていたのは『色欲』の魔本。きっと、ムフフなことがたくさん書いてあるはず……ああ、気になって仕方がありません！）"

[[dialogue]]
speaker = "イクシリオン"
# （モネさんやウィステリアさんの力になりたいのもウソではないのです。ですが、ですが……！　私の本能が告げています。深淵書庫には『何か』があると！）
line = "（モネさんやウィステリアさんの力になりたいのもウソではないのです。ですが、ですが……！　私の本能が告げています。深淵書庫には『何か』があると！）"

[[dialogue]]
speaker = "リィベル"
# 「私も信じがたいけど、本当よ。ほら、この魔本をあなたに近付けると点滅するでしょう」
line = "「私も信じがたいけど、本当よ。ほら、この魔本をあなたに近付けると点滅するでしょう」"

[[dialogue]]
speaker = "イクシリオン"
# 「なんと！　まるで夜闇に浮かぶホタルのようです！」
line = "「なんと！　まるで夜闇に浮かぶホタルのようです！」"

[[dialogue]]
speaker = "ウィステリア"
# 「思ったより単純な仕組みね……」
line = "「思ったより単純な仕組みね……」"

[[dialogue]]
speaker = "リィベル"
# 「イクシリオン。これが読めるか試してみなさい」
line = "「イクシリオン。これが読めるか試してみなさい」"

[[dialogue]]
speaker = "イクシリオン"
# 「これが『色欲』の魔本……？　ただならない気配を感じます」
line = "「これが『色欲』の魔本……？　ただならない気配を感じます」"

[[dialogue]]
speaker = "リィベル"
# 「もしこれが読めるなら、魔将の適性があるということよ。もし読めなくて呪いが暴走しても、ウィステリアが肩代わりするから問題ないわ」
line = "「もしこれが読めるなら、魔将の適性があるということよ。もし読めなくて呪いが暴走しても、ウィステリアが肩代わりするから問題ないわ」"

[[dialogue]]
speaker = "ウィステリア"
# 「コラ、いつのまにそんな術式組んだのよ。はぁ……まぁいいわ。イクシーさんを危険に晒すわけにはいかないし」
line = "「コラ、いつのまにそんな術式組んだのよ。はぁ……まぁいいわ。イクシーさんを危険に晒すわけにはいかないし」"

[[dialogue]]
speaker = "ウィステリア"
# 「イクシーさんが魔将だなんて、何かの間違いだと思うから、試すだけ試してみて。読めなかったらこの話はおしまい、ね？」
line = "「イクシーさんが魔将だなんて、何かの間違いだと思うから、試すだけ試してみて。読めなかったらこの話はおしまい、ね？」"

[[dialogue]]
speaker = "イクシリオン"
# 「は、はい。では失礼して…………」
line = "「は、はい。では失礼して…………」"

[[dialogue]]
speaker = "unk"
# おそるおそる魔本を手に取るイクシリオン。
line = "おそるおそる魔本を手に取るイクシリオン。"

[[dialogue]]
speaker = "unk"
# 普段読んでいる本より、ずっしりと重い。
line = "普段読んでいる本より、ずっしりと重い。"

[[dialogue]]
speaker = "イクシリオン"
# 「よ、読め………………ません！」
line = "「よ、読め………………ません！」"

[[dialogue]]
speaker = "イクシリオン"
# 「何やら文字が書かれていることは理解できるのですが……一文字も読めず……うぅ、すみません……」
line = "「何やら文字が書かれていることは理解できるのですが……一文字も読めず……うぅ、すみません……」"

[[dialogue]]
speaker = "モネ"
# 「謝るようなことじゃないですよ。むしろ挑戦してくれてありがとうございます」
line = "「謝るようなことじゃないですよ。むしろ挑戦してくれてありがとうございます」"

[[dialogue]]
speaker = "ウィステリア"
# 「私からもありがとう、イクシーさん」
line = "「私からもありがとう、イクシーさん」"

[[dialogue]]
speaker = "イクシリオン"
# 「うぅ～、残念です……」
line = "「うぅ～、残念です……」"

[[dialogue]]
speaker = "リィベル"
# 「『強欲』も『色欲』も覚醒ならず、ね。『暴食』だけでも適合者を見付けたいところだけど──」
line = "「『強欲』も『色欲』も覚醒ならず、ね。『暴食』だけでも適合者を見付けたいところだけど──」"

[[dialogue]]
speaker = "リィベル"
# 「え、『暴食』も光った？」
line = "「え、『暴食』も光った？」"

[[dialogue]]
speaker = "？？？"
# 「こんにちは～」
line = "「こんにちは～」"

[[dialogue]]
speaker = "リィベル"
# 「あなたは──」
line = "「あなたは──」"

[[dialogue]]
speaker = "サラン"
# 「新星学園２年生の桜十路サランだよ～。あなたの持ってる本、すごくいい匂いがするね～」
line = "「新星学園２年生の桜十路サランだよ～。あなたの持ってる本、すごくいい匂いがするね～」"
