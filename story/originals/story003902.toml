[[dialogue]]
speaker = "エルデリーゼ"
# 「お帰りなさいませ、ご主人様……」
line = "「お帰りなさいませ、ご主人様……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「メイドのエルデリーゼでございます。ご主人様、私になんなりとお申し付けくださいませ──ですわ♪」
line = "「メイドのエルデリーゼでございます。ご主人様、私になんなりとお申し付けくださいませ──ですわ♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「実に見事な立ち振る舞いだな、エルデリーゼ嬢」
line = "「実に見事な立ち振る舞いだな、エルデリーゼ嬢」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ありがとうございます。それにしても……美鶴様が仕立てを担当されたこのメイド風の人工戦闘服、本当に素晴らしいですわ」
line = "「ありがとうございます。それにしても……美鶴様が仕立てを担当されたこのメイド風の人工戦闘服、本当に素晴らしいですわ」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむ、戦闘服としての機能面はいつも通りアニマに任せているが、服飾部分は美鶴の仕事だ。今回はいつも以上に良い仕事をしてくれた」
line = "「うむ、戦闘服としての機能面はいつも通りアニマに任せているが、服飾部分は美鶴の仕事だ。今回はいつも以上に良い仕事をしてくれた」"

[[dialogue]]
speaker = "美鶴"
# 「ありがとうございます。やー、我ながらめちゃカワに仕上がりましたわ」
line = "「ありがとうございます。やー、我ながらめちゃカワに仕上がりましたわ」"

[[dialogue]]
speaker = "美鶴"
# 「でも当主様、どういう心境の変化です？　うちらはみんな和風メイドなのに、いきなり洋風メイドだなんて。や、作ってて楽しかったすけど」
line = "「でも当主様、どういう心境の変化です？　うちらはみんな和風メイドなのに、いきなり洋風メイドだなんて。や、作ってて楽しかったすけど」"

[[dialogue]]
speaker = "ヘレナ"
# 「なぁに、いつもの気まぐれというやつだ。たまには洋風メイドも良かろうと思ってな」
line = "「なぁに、いつもの気まぐれというやつだ。たまには洋風メイドも良かろうと思ってな」"

[[dialogue]]
speaker = "ヘレナ"
# 「モデルとして思い浮かべていたのがエルデリーゼ嬢だったので、さっそく屋敷に呼んで着てもらうことにしたのだが……大正解であったな」
line = "「モデルとして思い浮かべていたのがエルデリーゼ嬢だったので、さっそく屋敷に呼んで着てもらうことにしたのだが……大正解であったな」"

[[dialogue]]
speaker = "美鶴"
# 「眼福ではありますけどね……恐れ多くも桜十路家のお嬢様にメイド服を着せようなんて、とんでもないこと考えるのたぶん当主様くらいっすよ……」
line = "「眼福ではありますけどね……恐れ多くも桜十路家のお嬢様にメイド服を着せようなんて、とんでもないこと考えるのたぶん当主様くらいっすよ……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「うふふ、私もこんなに可愛いメイド服を着ることができて本当に嬉しいですわ」
line = "「うふふ、私もこんなに可愛いメイド服を着ることができて本当に嬉しいですわ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「実は以前、お屋敷に帰った時、当家のメイドにお洋服を交換してもらおうとしたこともあったのですけど……」
line = "「実は以前、お屋敷に帰った時、当家のメイドにお洋服を交換してもらおうとしたこともあったのですけど……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「メイドからは『とんでもございません！』と拒否され、それがばれてお母様からはこっ酷く叱られてしまって……諦めざるを得ませんでしたの」
line = "「メイドからは『とんでもございません！』と拒否され、それがばれてお母様からはこっ酷く叱られてしまって……諦めざるを得ませんでしたの」"

[[dialogue]]
speaker = "美鶴"
# 「へぇ～、それじゃ念願のメイド服なんすね～」
line = "「へぇ～、それじゃ念願のメイド服なんすね～」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ええ、思いもよらぬところで夢が叶ってしまいましたわ。重ね重ね、素晴らしいお洋服をありがとうございます」
line = "「ええ、思いもよらぬところで夢が叶ってしまいましたわ。重ね重ね、素晴らしいお洋服をありがとうございます」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「それで私はどのようなお仕事をすればよろしいでしょう？　お掃除ですの？　お洗濯ですの？」
line = "「それで私はどのようなお仕事をすればよろしいでしょう？　お掃除ですの？　お洗濯ですの？」"

[[dialogue]]
speaker = "美鶴"
# 「え……働くつもり、なんすか？」
line = "「え……働くつもり、なんすか？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「もちろんですわ！　メイド服を着たからには、メイドのお仕事をしなくてはなりませんの！」
line = "「もちろんですわ！　メイド服を着たからには、メイドのお仕事をしなくてはなりませんの！」"

[[dialogue]]
speaker = "美鶴"
# 「っておっしゃってますけど、どうします？　当主様」
line = "「っておっしゃってますけど、どうします？　当主様」"

[[dialogue]]
speaker = "ヘレナ"
# 「着飾られるだけでは満足できぬというわけか。ふふ……さすがはエルデリーゼ嬢、私の目に狂いは無かったということだな」
line = "「着飾られるだけでは満足できぬというわけか。ふふ……さすがはエルデリーゼ嬢、私の目に狂いは無かったということだな」"

[[dialogue]]
speaker = "ヘレナ"
# 「よろしい、この際であるからメイドの仕事も体験して頂こう！　美鶴、屋敷を案内し、仕事を手伝ってもらうがいい」
line = "「よろしい、この際であるからメイドの仕事も体験して頂こう！　美鶴、屋敷を案内し、仕事を手伝ってもらうがいい」"

[[dialogue]]
speaker = "美鶴"
# 「うぃっす、了解しました」
line = "「うぃっす、了解しました」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ありがとうございます。では美鶴様、参りましょう」
line = "「ありがとうございます。では美鶴様、参りましょう」"

[[dialogue]]
speaker = "美鶴"
# 「──というわけでヨミー、協力よろ、ってことで」
line = "「──というわけでヨミー、協力よろ、ってことで」"

[[dialogue]]
speaker = "ヨミ"
# 「もー、そんなこと言って美鶴さん、またいつもの省エネモードに入るつもりじゃないんですか？」
line = "「もー、そんなこと言って美鶴さん、またいつもの省エネモードに入るつもりじゃないんですか？」"

[[dialogue]]
speaker = "美鶴"
# 「いやいや、まさか。そんな事しませんって」
line = "「いやいや、まさか。そんな事しませんって」"

[[dialogue]]
speaker = "ヨミ"
# 「あっ、失礼しました、エルデリーゼ様。私たちでお屋敷のご案内をさせていただきますね」
line = "「あっ、失礼しました、エルデリーゼ様。私たちでお屋敷のご案内をさせていただきますね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「よろしくお願いしますわ、ヨミ様」
line = "「よろしくお願いしますわ、ヨミ様」"

[[dialogue]]
speaker = "ヨミ"
# 「はいっ。……こや～、メイド服姿になってもお綺麗で、思わず見惚れてしまいます……」
line = "「はいっ。……こや～、メイド服姿になってもお綺麗で、思わず見惚れてしまいます……」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ありがとうございます。まるで生まれた時から着ていたかのようなシンデレラフィットですの」
line = "「ありがとうございます。まるで生まれた時から着ていたかのようなシンデレラフィットですの」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「きっと美鶴様の腕が、とてもよろしいのですわね」
line = "「きっと美鶴様の腕が、とてもよろしいのですわね」"

[[dialogue]]
speaker = "美鶴"
# 「嬉しいっすね～。でも、シンデレラフィットってのも当然と言えば当然なんすよ」
line = "「嬉しいっすね～。でも、シンデレラフィットってのも当然と言えば当然なんすよ」"

[[dialogue]]
speaker = "美鶴"
# 「だってそのメイド服はエルデリーゼ様のためのオーダーメイドっすからね」
line = "「だってそのメイド服はエルデリーゼ様のためのオーダーメイドっすからね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ヘレナ様が私をイメージして作ってくださったのですよね、本当に嬉しいです♪」
line = "「ヘレナ様が私をイメージして作ってくださったのですよね、本当に嬉しいです♪」"

[[dialogue]]
speaker = "美鶴"
# 「あー、それだけじゃなくてですね。これはちょっとした技術革新なんすよ」
line = "「あー、それだけじゃなくてですね。これはちょっとした技術革新なんすよ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「？　どういうことですの？」
line = "「？　どういうことですの？」"

[[dialogue]]
speaker = "美鶴"
# 「これまでの人工戦闘服はその力を引き出すために、その戦闘服に込められたテーマにアプローチする必要があったんすけど──」
line = "「これまでの人工戦闘服はその力を引き出すために、その戦闘服に込められたテーマにアプローチする必要があったんすけど──」"

[[dialogue]]
speaker = "美鶴"
# 「最近の研究で、着用する対象者をきっかり定めて調整すれば、テーマにアプローチしなくてもすぐに力を引き出せるようになったんす」
line = "「最近の研究で、着用する対象者をきっかり定めて調整すれば、テーマにアプローチしなくてもすぐに力を引き出せるようになったんす」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「まあ、そうなんですのね！」
line = "「まあ、そうなんですのね！」"

[[dialogue]]
speaker = "美鶴"
# 「起動するだけならって話っすけどね。本当にそのフォームを使いこなそうと思ったら、やっぱ習熟と理解を深めた方がいいんすけど」
line = "「起動するだけならって話っすけどね。本当にそのフォームを使いこなそうと思ったら、やっぱ習熟と理解を深めた方がいいんすけど」"

[[dialogue]]
speaker = "ヨミ"
# 「やっぱり訓練は必要ってことなんですね～」
line = "「やっぱり訓練は必要ってことなんですね～」"

[[dialogue]]
speaker = "美鶴"
# 「そそ」
line = "「そそ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「問題ありませんわ！　私、お勉強も訓練も大好物ですの！」
line = "「問題ありませんわ！　私、お勉強も訓練も大好物ですの！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「戦闘服の理解を深めるということは……メイドのなんたるかを知るのが大切ですわね！　ヨミ様、美鶴様、メイドの極意、ご教授くださいませ！」
line = "「戦闘服の理解を深めるということは……メイドのなんたるかを知るのが大切ですわね！　ヨミ様、美鶴様、メイドの極意、ご教授くださいませ！」"

[[dialogue]]
speaker = "美鶴"
# 「メイドの極意なんて大層なコト、うちに聞くのは間違ってますんで～。その辺はヨミー、よろしく～」
line = "「メイドの極意なんて大層なコト、うちに聞くのは間違ってますんで～。その辺はヨミー、よろしく～」"

[[dialogue]]
speaker = "ヨミ"
# 「こやぁーん！？　私にも荷が重いです！　メイドのことならメイド長に聞くのが１番では──」
line = "「こやぁーん！？　私にも荷が重いです！　メイドのことならメイド長に聞くのが１番では──」"

[[dialogue]]
speaker = "ヨミ"
# 「ん？　そこの茂み、ちょっと動きませんでしたか？」
line = "「ん？　そこの茂み、ちょっと動きませんでしたか？」"

[[dialogue]]
speaker = "？？？"
# 「ぎくっ」
line = "「ぎくっ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そこにいらっしゃるのは──どなたですのっ！？」
line = "「そこにいらっしゃるのは──どなたですのっ！？」"

[[dialogue]]
speaker = "？？？"
# 「ヒマワリちゃん、避けて！」
line = "「ヒマワリちゃん、避けて！」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ひゃあっ！？　あ、危なかったぁ！」
line = "「ひゃあっ！？　あ、危なかったぁ！」"

[[dialogue]]
speaker = "ミウ"
# 「エルデリーゼ先輩……！？　桜十路のお嬢様が、どうして九浄家に……！？」
line = "「エルデリーゼ先輩……！？　桜十路のお嬢様が、どうして九浄家に……！？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「あなたたち、何者ですの！？　曲者です！　皆の者、出合え出合えですわー！」
line = "「あなたたち、何者ですの！？　曲者です！　皆の者、出合え出合えですわー！」"

[[dialogue]]
speaker = "ヨミ"
# （ヒマワリ、と叫んでいたように思いましたけど……それじゃあの２人、ヒマワリさんとミウさん？）
line = "（ヒマワリ、と叫んでいたように思いましたけど……それじゃあの２人、ヒマワリさんとミウさん？）"
