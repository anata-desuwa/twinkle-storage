[[dialogue]]
speaker = "unk"
# 第１話,ミウの告白プラン,P
line = "第１話,ミウの告白プラン,P"

[[dialogue]]
speaker = "unk"
# これは──私、深沢ミウが会長さんと付き合うことになった時のことです。
line = "これは──私、深沢ミウが会長さんと付き合うことになった時のことです。"

[[dialogue]]
speaker = "ミウ"
# 「ふふふ～ん、ふんふんふふふ～ん♪」
line = "「ふふふ～ん、ふんふんふふふ～ん♪」"

[[dialogue]]
speaker = "ミウ"
# （浮かれるあまり、鼻歌が漏れてしまうのも仕方ないですよね）
line = "（浮かれるあまり、鼻歌が漏れてしまうのも仕方ないですよね）"

[[dialogue]]
speaker = "ミウ"
# （だって、今日は会長さんとデートなんですから♪）
line = "（だって、今日は会長さんとデートなんですから♪）"

[[dialogue]]
speaker = "ミウ"
# （デートではありますけど、私と会長さんは、まだ正式にお付き合いをしているわけではありません）
line = "（デートではありますけど、私と会長さんは、まだ正式にお付き合いをしているわけではありません）"

[[dialogue]]
speaker = "ミウ"
# （会長さんが『私好みの映画のチケットがたまたま手に入ったから』と誘ってくれたんです）
line = "（会長さんが『私好みの映画のチケットがたまたま手に入ったから』と誘ってくれたんです）"

[[dialogue]]
speaker = "ミウ"
# （ふふ、会長さんってば素直じゃないんですから♪）
line = "（ふふ、会長さんってば素直じゃないんですから♪）"

[[dialogue]]
speaker = "ミウ"
# （気になっている私を誘うために、自腹でチケットを購入したんですよね？）
line = "（気になっている私を誘うために、自腹でチケットを購入したんですよね？）"

[[dialogue]]
speaker = "ミウ"
# （『かわいいクマちゃん型ロボットが大量発生して、一般人を襲うパニック映画』なんて、普通はデートに誘う時に選ぶ映画じゃないですけど……）
line = "（『かわいいクマちゃん型ロボットが大量発生して、一般人を襲うパニック映画』なんて、普通はデートに誘う時に選ぶ映画じゃないですけど……）"

[[dialogue]]
speaker = "ミウ"
# （でも、私は違います。間違いなくＢ級映画だとわかりきってるんですけど、Ｗｅｂ予告の時から気になってて、観に行きたかったんです）
line = "（でも、私は違います。間違いなくＢ級映画だとわかりきってるんですけど、Ｗｅｂ予告の時から気になってて、観に行きたかったんです）"

[[dialogue]]
speaker = "ミウ"
# （さすがは会長さんです。私の好みを完璧に熟知しているなんて……私のこと、好きすぎじゃないですか？）
line = "（さすがは会長さんです。私の好みを完璧に熟知しているなんて……私のこと、好きすぎじゃないですか？）"

[[dialogue]]
speaker = "ミウ"
# （この映画に誘われてしまったら、断る理由なんてありません）
line = "（この映画に誘われてしまったら、断る理由なんてありません）"

[[dialogue]]
speaker = "ミウ"
# （いえ、会長さんに誘われたらどんなに甘々な恋愛映画でも、ＴＶシリーズを観ているのが前提のアニメ映画だったとしても観に行きますけどね）
line = "（いえ、会長さんに誘われたらどんなに甘々な恋愛映画でも、ＴＶシリーズを観ているのが前提のアニメ映画だったとしても観に行きますけどね）"

[[dialogue]]
speaker = "ミウ"
# （私の好みを理解してくれていて、これまでの私への態度や振る舞い、ヒマワリちゃんや社長と比べても特別扱い……）
line = "（私の好みを理解してくれていて、これまでの私への態度や振る舞い、ヒマワリちゃんや社長と比べても特別扱い……）"

[[dialogue]]
speaker = "ミウ"
# （私をわざわざ映画デートにまで誘ってくれるのですから、会長さんが私に好意を寄せているのは確実です）
line = "（私をわざわざ映画デートにまで誘ってくれるのですから、会長さんが私に好意を寄せているのは確実です）"

[[dialogue]]
speaker = "ミウ"
# （鯛焼き屋の前を通った時に、香ばしい良い匂いを嗅いだが最後、うっかり買っちゃうくらい確実です）
line = "（鯛焼き屋の前を通った時に、香ばしい良い匂いを嗅いだが最後、うっかり買っちゃうくらい確実です）"

[[dialogue]]
speaker = "ミウ"
# （今日で曖昧な関係には終止符を打ちましょう。覚悟してください、会長さん♪）
line = "（今日で曖昧な関係には終止符を打ちましょう。覚悟してください、会長さん♪）"

[[dialogue]]
speaker = "ミウ"
# （ムード満点の場所に誘いこめば、私が好きすぎて我慢できなくなった会長さんから告白してくれるはずです）
line = "（ムード満点の場所に誘いこめば、私が好きすぎて我慢できなくなった会長さんから告白してくれるはずです）"

[[dialogue]]
speaker = "ミウ"
# （我ながら完璧なプランですね。徹夜で考案しただけはあります。会長さん、今日こそあなたを私の恋人にしてみせますからね！）
line = "（我ながら完璧なプランですね。徹夜で考案しただけはあります。会長さん、今日こそあなたを私の恋人にしてみせますからね！）"

[[dialogue]]
speaker = "unk"
# そして、ついに決戦の日。デートの当日がやってきて──
line = "そして、ついに決戦の日。デートの当日がやってきて──"

[[dialogue]]
speaker = "ミウ"
# 「映画、期待通りでとても面白かったです♪　会長さんはどうしてこの映画を観ようと思ったんですか？」
line = "「映画、期待通りでとても面白かったです♪　会長さんはどうしてこの映画を観ようと思ったんですか？」"

[[dialogue]]
speaker = "ミウ"
# （ふふ、わかってますよ。私を誘うために、わざわざ購入されたことくらい）
line = "（ふふ、わかってますよ。私を誘うために、わざわざ購入されたことくらい）"

[[dialogue]]
speaker = "ミウ"
# （でも、あえて尋ねることで、会長さんの本音を引き出しやすく──）
line = "（でも、あえて尋ねることで、会長さんの本音を引き出しやすく──）"

[[dialogue]]
speaker = "ミウ"
# 「……え？　チケットは美鶴さんから頂いたんですか？　美鶴さんとはＢ級映画友達……あー、そうだったんですね」
line = "「……え？　チケットは美鶴さんから頂いたんですか？　美鶴さんとはＢ級映画友達……あー、そうだったんですね」"

[[dialogue]]
speaker = "ミウ"
# 「美鶴さんにそんな趣味があることも、会長さんと映画を観たりする仲だとも知りませんでした」
line = "「美鶴さんにそんな趣味があることも、会長さんと映画を観たりする仲だとも知りませんでした」"

[[dialogue]]
speaker = "ミウ"
# （美鶴さんって！？　聞いてないですよ、そんなの！）
line = "（美鶴さんって！？　聞いてないですよ、そんなの！）"

[[dialogue]]
speaker = "ミウ"
# （いえいえ、動揺してはいけません！　冷静に、状況を立て直さなくては……）
line = "（いえいえ、動揺してはいけません！　冷静に、状況を立て直さなくては……）"

[[dialogue]]
speaker = "ミウ"
# 「会長さん、私、行きたい場所があるんです。１人だとちょっと行きづらいところなので一緒にお願いできますか？」
line = "「会長さん、私、行きたい場所があるんです。１人だとちょっと行きづらいところなので一緒にお願いできますか？」"

[[dialogue]]
speaker = "ミウ"
# 「わぁ……イルミネーション、綺麗ですよね！　カップルが多いので、１人だと居づらくて」
line = "「わぁ……イルミネーション、綺麗ですよね！　カップルが多いので、１人だと居づらくて」"

[[dialogue]]
speaker = "ミウ"
# 「会長さんと一緒なら、不自然じゃないですよね♪」
line = "「会長さんと一緒なら、不自然じゃないですよね♪」"

[[dialogue]]
speaker = "ミウ"
# 「私たちの関係って周りからどう見られてるんでしょう……やっぱり、年頃の男女が２人でいたら、恋人同士に見られちゃうんですかね、なんて。えへへ♪」
line = "「私たちの関係って周りからどう見られてるんでしょう……やっぱり、年頃の男女が２人でいたら、恋人同士に見られちゃうんですかね、なんて。えへへ♪」"

[[dialogue]]
speaker = "ミウ"
# （おかしいですね。周りには恋人ばかりで、ムーディーな音楽もかかっています）
line = "（おかしいですね。周りには恋人ばかりで、ムーディーな音楽もかかっています）"

[[dialogue]]
speaker = "ミウ"
# （こんなにも出来上がっているシチュエーションなのに、会長さんの態度はいつもとまったく変わりません）
line = "（こんなにも出来上がっているシチュエーションなのに、会長さんの態度はいつもとまったく変わりません）"

[[dialogue]]
speaker = "ミウ"
# （刻一刻と時間は流れていきます）
line = "（刻一刻と時間は流れていきます）"

[[dialogue]]
speaker = "ミウ"
# （あれ？　あれあれあれ？　会長さん？　ここで告白しないでいいんですか？　大チャンスですよ？　二つ返事で『ＯＫ』する準備はできてますよ？）
line = "（あれ？　あれあれあれ？　会長さん？　ここで告白しないでいいんですか？　大チャンスですよ？　二つ返事で『ＯＫ』する準備はできてますよ？）"

[[dialogue]]
speaker = "ミウ"
# （このチャンスを逃すと、次に告白できるのはいつになるかわかりませんよ？　何もないまま、解散になっちゃいますよ？）
line = "（このチャンスを逃すと、次に告白できるのはいつになるかわかりませんよ？　何もないまま、解散になっちゃいますよ？）"

[[dialogue]]
speaker = "ミウ"
# （このまま、何もないまま、なんですか……？）
line = "（このまま、何もないまま、なんですか……？）"

[[dialogue]]
speaker = "ミウ"
# （会長さんは男女問わず、誰に対しても分け隔てなく優しい……そんな会長さんだからこそ、好きになったのですけど……）
line = "（会長さんは男女問わず、誰に対しても分け隔てなく優しい……そんな会長さんだからこそ、好きになったのですけど……）"

[[dialogue]]
speaker = "ミウ"
# （もしかして、私もただ親切にしてあげてるだけの……会長さんの周りにいる女の子の１人でしかないんですか……！？）
line = "（もしかして、私もただ親切にしてあげてるだけの……会長さんの周りにいる女の子の１人でしかないんですか……！？）"

[[dialogue]]
speaker = "ミウ"
# （そんなの……そんなの嫌です……！　私だけはあなたの特別でありたい……）
line = "（そんなの……そんなの嫌です……！　私だけはあなたの特別でありたい……）"

[[dialogue]]
speaker = "ミウ"
# （もっと冷静でいなくちゃいけないのに……さっきだって美鶴さんの名前が出ただけで動揺しちゃって……）
line = "（もっと冷静でいなくちゃいけないのに……さっきだって美鶴さんの名前が出ただけで動揺しちゃって……）"

[[dialogue]]
speaker = "ミウ"
# （会長さんの近くにいるだけで独占欲が爆発して……いつもの私じゃいられなくなっちゃう……）
line = "（会長さんの近くにいるだけで独占欲が爆発して……いつもの私じゃいられなくなっちゃう……）"

[[dialogue]]
speaker = "ミウ"
# （やだ、やだ……！　会長さんが他の子と付き合うなんて、私のものじゃないなんて、絶対にやだっ……！）
line = "（やだ、やだ……！　会長さんが他の子と付き合うなんて、私のものじゃないなんて、絶対にやだっ……！）"

[[dialogue]]
speaker = "ミウ"
# （言わなきゃ、今、私の口から言わなきゃ！　会長さんが好きだって！　私の恋人に、彼氏になってくださいって言わなきゃ……！）
line = "（言わなきゃ、今、私の口から言わなきゃ！　会長さんが好きだって！　私の恋人に、彼氏になってくださいって言わなきゃ……！）"

[[dialogue]]
speaker = "ミウ"
# 「あ、あのっ！　か、会長ひゃんっ！　わ、わたっ、わた、わた、しっ……！」
line = "「あ、あのっ！　か、会長ひゃんっ！　わ、わたっ、わた、わた、しっ……！」"

[[dialogue]]
speaker = "ミウ"
# （噛み噛みだよっ！　なんて言えばいいのかわからない。どう伝えれば、私の好きな気持ちが伝わるかもわからない……）
line = "（噛み噛みだよっ！　なんて言えばいいのかわからない。どう伝えれば、私の好きな気持ちが伝わるかもわからない……）"

[[dialogue]]
speaker = "ミウ"
# 「ふぅ……あ、あぁ、か、会長さん、私っ、わた──」
line = "「ふぅ……あ、あぁ、か、会長さん、私っ、わた──」"

[[dialogue]]
speaker = "ミウ"
# （言葉が、出てこない……続けられない……同じことばかり繰り返して……。みっともないよ、私──）
line = "（言葉が、出てこない……続けられない……同じことばかり繰り返して……。みっともないよ、私──）"

[[dialogue]]
speaker = "unk"
# 言葉を詰まらせて……顔も見られなくなって……私は俯いてしまった。
line = "言葉を詰まらせて……顔も見られなくなって……私は俯いてしまった。"

[[dialogue]]
speaker = "unk"
# 会長さんは黙って私の言葉を待ってくれていましたが、そんな私の様子を見て優しく肩に手を置いてくれました。
line = "会長さんは黙って私の言葉を待ってくれていましたが、そんな私の様子を見て優しく肩に手を置いてくれました。"

[[dialogue]]
speaker = "unk"
# そして──言ってくれたんです。
line = "そして──言ってくれたんです。"

[[dialogue]]
speaker = "unk"
# 俺もミウが好きだよ
line = "俺もミウが好きだよ"

[[dialogue]]
speaker = "unk"
# ありがとう、ミウ
line = "ありがとう、ミウ"

[[dialogue]]
speaker = "ミウ"
# 「え──？」
line = "「え──？」"

[[dialogue]]
speaker = "unk"
# 俺と付き合ってください
line = "俺と付き合ってください"

[[dialogue]]
speaker = "ミウ"
# 「ふぅ、うぁ、あぁぁ……ぅわあぁぁん！」
line = "「ふぅ、うぁ、あぁぁ……ぅわあぁぁん！」"

[[dialogue]]
speaker = "ミウ"
# 「人前で──ましてや大好きな人の目の前で泣くなんて、情けなくて、格好悪いのに……」
line = "「人前で──ましてや大好きな人の目の前で泣くなんて、情けなくて、格好悪いのに……」"

[[dialogue]]
speaker = "unk"
# 全然、思い通りにいかなかった告白のみっともなさと──
line = "全然、思い通りにいかなかった告白のみっともなさと──"

[[dialogue]]
speaker = "unk"
# 何も言うことが出来なくなってしまった自分への情けなさと──
line = "何も言うことが出来なくなってしまった自分への情けなさと──"

[[dialogue]]
speaker = "unk"
# 一番欲しかった言葉を、大好きな人に言ってもらえた、その嬉しさで私は──
line = "一番欲しかった言葉を、大好きな人に言ってもらえた、その嬉しさで私は──"

[[dialogue]]
speaker = "ミウ"
# 「うわぁああぁぁぁん！　わ、私も好きっ、好きですっ！　会長さんっ、かいちょぉさぁんっ……！」
line = "「うわぁああぁぁぁん！　わ、私も好きっ、好きですっ！　会長さんっ、かいちょぉさぁんっ……！」"

[[dialogue]]
speaker = "unk"
# もう、声を抑えることが出来なくなって泣きじゃくってしまいました。
line = "もう、声を抑えることが出来なくなって泣きじゃくってしまいました。"

[[dialogue]]
speaker = "unk"
# そんな私を会長さんは優しく抱きしめて……ずっと、ずっと……胸の中で気が済むまで泣かせてくれたのでした。
line = "そんな私を会長さんは優しく抱きしめて……ずっと、ずっと……胸の中で気が済むまで泣かせてくれたのでした。"
