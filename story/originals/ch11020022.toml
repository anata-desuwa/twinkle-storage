[[dialogue]]
speaker = "unk"
# 第２話,合体しましょう、ぶい,P
line = "第２話,合体しましょう、ぶい,P"

[[dialogue]]
speaker = "シュティレ"
# 「購買部へようこそ、アナお姉ちゃん。今日の昼食はこちらでお求めですか？」
line = "「購買部へようこそ、アナお姉ちゃん。今日の昼食はこちらでお求めですか？」"

[[dialogue]]
speaker = "アナ"
# 「ええ。何か軽食でもと思いまして」
line = "「ええ。何か軽食でもと思いまして」"

[[dialogue]]
speaker = "アナ"
# 「ところでシュティレさん。今日もその衣装で店番をしているのですね？」
line = "「ところでシュティレさん。今日もその衣装で店番をしているのですね？」"

[[dialogue]]
speaker = "シュティレ"
# 「イエス。ダッチから受け取ったバニーフォーム、これは客引きに最適なのです。おかげさまで購買部の売上も過去最高を記録中です。ぶい」
line = "「イエス。ダッチから受け取ったバニーフォーム、これは客引きに最適なのです。おかげさまで購買部の売上も過去最高を記録中です。ぶい」"

[[dialogue]]
speaker = "シュティレ"
# 「それに彼ピの会長も、シュティレのこの衣装をいたく気に入っているご様子──」
line = "「それに彼ピの会長も、シュティレのこの衣装をいたく気に入っているご様子──」"

[[dialogue]]
speaker = "シュティレ"
# 「あわよくば今日も見せつけて、可愛いと言ってもらいたい算段ですが……」
line = "「あわよくば今日も見せつけて、可愛いと言ってもらいたい算段ですが……」"

[[dialogue]]
speaker = "アナ"
# 「会長は今、星徒会室で大忙しです。会長のぶんのお昼も、私が買いに来たという感じで……」
line = "「会長は今、星徒会室で大忙しです。会長のぶんのお昼も、私が買いに来たという感じで……」"

[[dialogue]]
speaker = "シュティレ"
# 「なるほど。ではバニーのお披露目は放課後まで持ち越しですね」
line = "「なるほど。ではバニーのお披露目は放課後まで持ち越しですね」"

[[dialogue]]
speaker = "アニマ"
# 「フヒヒ！　だったらアナ、この薬もついでに会長の元へ届けてくれたまエ！」
line = "「フヒヒ！　だったらアナ、この薬もついでに会長の元へ届けてくれたまエ！」"

[[dialogue]]
speaker = "アナ"
# 「アニマ先輩、また新しいお薬ですか。そうやって会長を実験台にばかりしていると、またシエスタが騒ぎを起こすかもしれませんよ？」
line = "「アニマ先輩、また新しいお薬ですか。そうやって会長を実験台にばかりしていると、またシエスタが騒ぎを起こすかもしれませんよ？」"

[[dialogue]]
speaker = "アニマ"
# 「そうは言うがネ。やはり新薬は実験せねばデータが取れなイ。錬金術の発展のためにモ、付き合ってほしいんだヨ」
line = "「そうは言うがネ。やはり新薬は実験せねばデータが取れなイ。錬金術の発展のためにモ、付き合ってほしいんだヨ」"

[[dialogue]]
speaker = "シュティレ"
# 「一応マスターは、これでも少しだけ遠慮というものを覚えたのです。会長への投薬量も、以前に比べて３割ほどは減少しました」
line = "「一応マスターは、これでも少しだけ遠慮というものを覚えたのです。会長への投薬量も、以前に比べて３割ほどは減少しました」"

[[dialogue]]
speaker = "アナ"
# 「……そうでしたか。その理屈で、シエスタが納得してくれると良いのですが」
line = "「……そうでしたか。その理屈で、シエスタが納得してくれると良いのですが」"

[[dialogue]]
speaker = "シュティレ"
# 「会長も『ドタバタする日常は嫌いではない』とシエスタに伝えておりました」
line = "「会長も『ドタバタする日常は嫌いではない』とシエスタに伝えておりました」"

[[dialogue]]
speaker = "シュティレ"
# 「ですから、そこまで神経質にならなくても大丈夫でしょう」
line = "「ですから、そこまで神経質にならなくても大丈夫でしょう」"

[[dialogue]]
speaker = "アニマ"
# 「フヒヒヒ♪　それじゃあ頼んだヨ。このラブラブポーションボム２を会長に飲ませてくレ！」
line = "「フヒヒヒ♪　それじゃあ頼んだヨ。このラブラブポーションボム２を会長に飲ませてくレ！」"

[[dialogue]]
speaker = "アニマ"
# 「これを飲めばあら不思議、深層心理で一番愛している者へ、熱烈なスキンシップをしたくてしたくてたまらなくなるという一品ダ♪」
line = "「これを飲めばあら不思議、深層心理で一番愛している者へ、熱烈なスキンシップをしたくてしたくてたまらなくなるという一品ダ♪」"

[[dialogue]]
speaker = "アナ"
# 「これはまた、やばそうな惚れ薬を作りましたね」
line = "「これはまた、やばそうな惚れ薬を作りましたね」"

[[dialogue]]
speaker = "アニマ"
# 「フヒ。お得意様からの依頼でネ。依頼料もたっぷり貰っているから早く結果を出したいんだヨ」
line = "「フヒ。お得意様からの依頼でネ。依頼料もたっぷり貰っているから早く結果を出したいんだヨ」"

[[dialogue]]
speaker = "シュティレ"
# 「…………惚れ薬」
line = "「…………惚れ薬」"

[[dialogue]]
speaker = "シュティレ"
# 「マスター、提案なのですが。そのお薬の実験台。シュティレが立候補してはダメでしょうか？」
line = "「マスター、提案なのですが。そのお薬の実験台。シュティレが立候補してはダメでしょうか？」"

[[dialogue]]
speaker = "アナ"
# 「……大丈夫なのですか、そんな安請け合いをして」
line = "「……大丈夫なのですか、そんな安請け合いをして」"

[[dialogue]]
speaker = "シュティレ"
# 「ノープロブレムです。会長もお忙しいでしょうし、代わりを勤めるのもカノジョの役割というものです。ぶい」
line = "「ノープロブレムです。会長もお忙しいでしょうし、代わりを勤めるのもカノジョの役割というものです。ぶい」"

[[dialogue]]
speaker = "アニマ"
# 「さっきと言ってることが逆だゾ、シュティレ？　ははーン、もしかしテ……」
line = "「さっきと言ってることが逆だゾ、シュティレ？　ははーン、もしかしテ……」"

[[dialogue]]
speaker = "アナ"
# 「ええ。深層心理で一番好きな相手……会長が、もしも自分でない相手にアプローチをかけてしまったら嫌だと。そういうことでしょうか？」
line = "「ええ。深層心理で一番好きな相手……会長が、もしも自分でない相手にアプローチをかけてしまったら嫌だと。そういうことでしょうか？」"

[[dialogue]]
speaker = "シュティレ"
# 「む──鋭いですね、お２人とも。その通りです。実はシュティレ、ちょっぴり不安なのです」
line = "「む──鋭いですね、お２人とも。その通りです。実はシュティレ、ちょっぴり不安なのです」"

[[dialogue]]
speaker = "シュティレ"
# 「シュティレはこの通り不愛想なバニー天使なので。もしも会長が別の女の子にアプローチしてしまったら、ショックで寝込んでしまいます」
line = "「シュティレはこの通り不愛想なバニー天使なので。もしも会長が別の女の子にアプローチしてしまったら、ショックで寝込んでしまいます」"

[[dialogue]]
speaker = "アナ"
# 「杞憂だと思いますが……うちの会長はシュティレさん一筋ですよ？」
line = "「杞憂だと思いますが……うちの会長はシュティレさん一筋ですよ？」"

[[dialogue]]
speaker = "アニマ"
# 「フヒ。まぁデータが取れればアニマは誰でも構わないヨ。じゃあシュティレ、グビっと一発、キメてみたまエ！」
line = "「フヒ。まぁデータが取れればアニマは誰でも構わないヨ。じゃあシュティレ、グビっと一発、キメてみたまエ！」"

[[dialogue]]
speaker = "シュティレ"
# 「ラジャーです。では──」
line = "「ラジャーです。では──」"

[[dialogue]]
speaker = "unk"
# アニマから渡されたドドメ色のドリンクを、シュティレは一気に飲み干した──
line = "アニマから渡されたドドメ色のドリンクを、シュティレは一気に飲み干した──"

[[dialogue]]
speaker = "マトイ"
# 「アナってば、遅いね？」
line = "「アナってば、遅いね？」"

[[dialogue]]
speaker = "unk"
# 購買部が混んでるのかな
line = "購買部が混んでるのかな"

[[dialogue]]
speaker = "マトイ"
# 「ふふ。最近、シュティレちゃんバニー衣装で接客してるからかな。いつも大賑わいなんだって」
line = "「ふふ。最近、シュティレちゃんバニー衣装で接客してるからかな。いつも大賑わいなんだって」"

[[dialogue]]
speaker = "unk"
# むむむ……複雑だ
line = "むむむ……複雑だ"

[[dialogue]]
speaker = "マトイ"
# 「あはは。会長でも嫉妬ってするんだ。ちょっと新鮮かも」
line = "「あはは。会長でも嫉妬ってするんだ。ちょっと新鮮かも」"

[[dialogue]]
speaker = "シュティレ"
# 「────会長」
line = "「────会長」"

[[dialogue]]
speaker = "マトイ"
# 「あれ、シュティレちゃん？　星徒会室に何か用事でも──」
line = "「あれ、シュティレちゃん？　星徒会室に何か用事でも──」"

[[dialogue]]
speaker = "シュティレ"
# 「────シンメトリー・ドッキング！！！」
line = "「────シンメトリー・ドッキング！！！」"

[[dialogue]]
speaker = "unk"
# うわぁぁぁああぁ！？
line = "うわぁぁぁああぁ！？"

[[dialogue]]
speaker = "マトイ"
# 「──シュティレちゃんがいきなり会長に抱き着いたあぁー！？」
line = "「──シュティレちゃんがいきなり会長に抱き着いたあぁー！？」"

[[dialogue]]
speaker = "アナ"
# 「はぁ、はぁっ……お、遅かったようです。まさかこんなに急に効果が出るとは……」
line = "「はぁ、はぁっ……お、遅かったようです。まさかこんなに急に効果が出るとは……」"

[[dialogue]]
speaker = "シュティレ"
# 「会長。愛しています。熱いシンメトリー・ドッキング完了しました。もう何があっても離しません。ぶいぶいぶいのぶいっ」
line = "「会長。愛しています。熱いシンメトリー・ドッキング完了しました。もう何があっても離しません。ぶいぶいぶいのぶいっ」"

[[dialogue]]
speaker = "アナ"
# 「おお。コアラのように会長に抱き着いていますね。両足を背中に回して……あれではとても振りほどけません」
line = "「おお。コアラのように会長に抱き着いていますね。両足を背中に回して……あれではとても振りほどけません」"

[[dialogue]]
speaker = "マトイ"
# 「アナ、こ、これは一体どういう……！？」
line = "「アナ、こ、これは一体どういう……！？」"

[[dialogue]]
speaker = "アナ"
# 「実は、かくかくしかじか、な感じで……」
line = "「実は、かくかくしかじか、な感じで……」"

[[dialogue]]
speaker = "unk"
# またアニマ先輩か！？
line = "またアニマ先輩か！？"

[[dialogue]]
speaker = "シュティレ"
# 「──会長。今そのお口から、シュティレ以外のオンナの名前を出しましたね？　いけませんよ。彼ピの自覚がありません」
line = "「──会長。今そのお口から、シュティレ以外のオンナの名前を出しましたね？　いけませんよ。彼ピの自覚がありません」"

[[dialogue]]
speaker = "シュティレ"
# 「ふさがせていただきます。ズキュゥゥゥゥン」
line = "「ふさがせていただきます。ズキュゥゥゥゥン」"

[[dialogue]]
speaker = "unk"
# んむむむむーっ！？
line = "んむむむむーっ！？"

[[dialogue]]
speaker = "マトイ"
# 「うわぁぁあ！？　あ、あんなえぐりこむようにチューを──！？」
line = "「うわぁぁあ！？　あ、あんなえぐりこむようにチューを──！？」"

[[dialogue]]
speaker = "アナ"
# 「流石はドリルを愛するシュティレさんですね」
line = "「流石はドリルを愛するシュティレさんですね」"

[[dialogue]]
speaker = "マトイ"
# 「冷静に言ってる場合！？　まずいよアレ！！」
line = "「冷静に言ってる場合！？　まずいよアレ！！」"

[[dialogue]]
speaker = "シュティレ"
# 「──ぷは。熱いベーゼをいたしました。ぶいぶいっ。ぶいぶいぶいっ。ぴょんぴょん、ぴょーんっ<emoji=heart04>」
line = "「──ぷは。熱いベーゼをいたしました。ぶいぶいっ。ぶいぶいぶいっ。ぴょんぴょん、ぴょーんっ<emoji=heart04>」"

[[dialogue]]
speaker = "マトイ"
# 「大変だよ！　シュティレちゃんが壊れちゃった！？」
line = "「大変だよ！　シュティレちゃんが壊れちゃった！？」"

[[dialogue]]
speaker = "unk"
# アナ、マトイ！　助けてくれ──！
line = "アナ、マトイ！　助けてくれ──！"

[[dialogue]]
speaker = "シュティレ"
# 「またシュティレ以外のギャルの名前を出しましたね。悪いのはこのお口ですか。ズキュゥゥウゥン」
line = "「またシュティレ以外のギャルの名前を出しましたね。悪いのはこのお口ですか。ズキュゥゥウゥン」"

[[dialogue]]
speaker = "unk"
# んむむむむ～～～～っ！？
line = "んむむむむ～～～～っ！？"

[[dialogue]]
speaker = "マトイ"
# 「こ、これどうやったら治るの！？」
line = "「こ、これどうやったら治るの！？」"

[[dialogue]]
speaker = "アナ"
# 「……薬の効果がいつ切れるかは不明だそうです」
line = "「……薬の効果がいつ切れるかは不明だそうです」"

[[dialogue]]
speaker = "マトイ"
# 「そんな！？　もう昼休み終わるよ！？　授業始まっちゃうって！！」
line = "「そんな！？　もう昼休み終わるよ！？　授業始まっちゃうって！！」"

[[dialogue]]
speaker = "アナ"
# 「…………このまま出るしかないでしょう。星徒会長がさぼりだなんて示しがつきません……！」
line = "「…………このまま出るしかないでしょう。星徒会長がさぼりだなんて示しがつきません……！」"

[[dialogue]]
speaker = "unk"
# そ、そんな……！？！？
line = "そ、そんな……！？！？"

[[dialogue]]
speaker = "トワ先生"
# 「はーい、授業を始めま～す！」
line = "「はーい、授業を始めま～す！」"

[[dialogue]]
speaker = "トワ先生"
# 「ってぇ！？　会長くんと──シュティレちゃん！？　な、何をして……！？」
line = "「ってぇ！？　会長くんと──シュティレちゃん！？　な、何をして……！？」"

[[dialogue]]
speaker = "unk"
# すみません、トワ先生。実は……！
line = "すみません、トワ先生。実は……！"

[[dialogue]]
speaker = "シュティレ"
# 「反省が足りませんね、このお口は。熱いベーゼの刑です。ズッキュゥウウゥン」
line = "「反省が足りませんね、このお口は。熱いベーゼの刑です。ズッキュゥウウゥン」"

[[dialogue]]
speaker = "unk"
# むむむむぅう～～！？
line = "むむむむぅう～～！？"

[[dialogue]]
speaker = "トワ先生"
# 「ぎゃー！？　待って待って！　神聖な学び舎でそんな熱いキスを──ななな、なんでぇ～～～っ！？」
line = "「ぎゃー！？　待って待って！　神聖な学び舎でそんな熱いキスを──ななな、なんでぇ～～～っ！？」"

[[dialogue]]
speaker = "マトイ"
# 「すみません、すみませんっ……！　授業、始めてください……！」
line = "「すみません、すみませんっ……！　授業、始めてください……！」"

[[dialogue]]
speaker = "トワ先生"
# 「無理だよぉ！？　こんな状況で～～～っ！？」
line = "「無理だよぉ！？　こんな状況で～～～っ！？」"

[[dialogue]]
speaker = "unk"
# それから日が暮れるまで、俺はバニー姿のシュティレに抱き着かれながら過ごすことになるのだった……
line = "それから日が暮れるまで、俺はバニー姿のシュティレに抱き着かれながら過ごすことになるのだった……"

[[dialogue]]
speaker = "unk"
# アニマ先輩……覚えていてくださいよ……！！
line = "アニマ先輩……覚えていてくださいよ……！！"
