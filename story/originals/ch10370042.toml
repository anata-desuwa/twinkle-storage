[[dialogue]]
speaker = "unk"
# 第２話,魔界スイーツ研究,P
line = "第２話,魔界スイーツ研究,P"

[[dialogue]]
speaker = "unk"
# 放課後、カフェテリアに行くと、サランとリィベルが何やら話していた。
line = "放課後、カフェテリアに行くと、サランとリィベルが何やら話していた。"

[[dialogue]]
speaker = "サラン"
# 「こっちはどお～？　美味しくできたと思うんだけど～」
line = "「こっちはどお～？　美味しくできたと思うんだけど～」"

[[dialogue]]
speaker = "リィベル"
# 「ちょっと待って。そんなにたくさん食べられないわよ」
line = "「ちょっと待って。そんなにたくさん食べられないわよ」"

[[dialogue]]
speaker = "unk"
# 珍しい組み合わせだね？
line = "珍しい組み合わせだね？"

[[dialogue]]
speaker = "サラン"
# 「そ～お？　サランたち仲良しだよね～？」
line = "「そ～お？　サランたち仲良しだよね～？」"

[[dialogue]]
speaker = "リィベル"
# 「……別に仲良くなった覚えはないけど。まぁ、サランが魔将になった以上、ある程度の付き合いはあるわ」
line = "「……別に仲良くなった覚えはないけど。まぁ、サランが魔将になった以上、ある程度の付き合いはあるわ」"

[[dialogue]]
speaker = "サラン"
# 「えへへ、そうだね～♪　今日はね～、リィベルちゃんに新作スイーツの試食に付き合ってもらってるんだ～」
line = "「えへへ、そうだね～♪　今日はね～、リィベルちゃんに新作スイーツの試食に付き合ってもらってるんだ～」"

[[dialogue]]
speaker = "unk"
# テーブルにはケーキやクッキー、いろんなお菓子が所狭しと並べられている。
line = "テーブルにはケーキやクッキー、いろんなお菓子が所狭しと並べられている。"

[[dialogue]]
speaker = "unk"
# その見た目は、目玉みたいなものが乗ったパフェ、ガイコツ型のクッキー、クリーチャーチックなケーキなどかなり独特だ。
line = "その見た目は、目玉みたいなものが乗ったパフェ、ガイコツ型のクッキー、クリーチャーチックなケーキなどかなり独特だ。"

[[dialogue]]
speaker = "サラン"
# 「魔本に書いてあったお菓子をサランなりに再現してみたんだ～。可愛いでしょ～？」
line = "「魔本に書いてあったお菓子をサランなりに再現してみたんだ～。可愛いでしょ～？」"

[[dialogue]]
speaker = "リィベル"
# 「付き合ってるからって忖度しなくていいのよ。魔族って大昔から露悪的だから、不気味なのも多いし」
line = "「付き合ってるからって忖度しなくていいのよ。魔族って大昔から露悪的だから、不気味なのも多いし」"

[[dialogue]]
speaker = "unk"
# ハロウィンっぽくて可愛い
line = "ハロウィンっぽくて可愛い"

[[dialogue]]
speaker = "サラン"
# 「ふふっ、ありがと～♪　美味しさも自信ありだから、会長ちゃんも食べて食べて～」
line = "「ふふっ、ありがと～♪　美味しさも自信ありだから、会長ちゃんも食べて食べて～」"

[[dialogue]]
speaker = "サラン"
# 「あっ、そうだ。サランが食べさせてあげる～♪　あ～～ん」
line = "「あっ、そうだ。サランが食べさせてあげる～♪　あ～～ん」"

[[dialogue]]
speaker = "unk"
# サランがプリンらしきものをスプーンですくって、口に運んでくれるが──
line = "サランがプリンらしきものをスプーンですくって、口に運んでくれるが──"

[[dialogue]]
speaker = "リィベル"
# 「じーーー」
line = "「じーーー」"

[[dialogue]]
speaker = "unk"
# 横からリィベルの視線がナイフのように突き刺さってくる。
line = "横からリィベルの視線がナイフのように突き刺さってくる。"

[[dialogue]]
speaker = "リィベル"
# 「なに？　私のことは気にしないでいいから、早く食べなさいよ。サランに恥をかかせる気？」
line = "「なに？　私のことは気にしないでいいから、早く食べなさいよ。サランに恥をかかせる気？」"

[[dialogue]]
speaker = "サラン"
# 「あ～～～ん<emoji=heart04>」
line = "「あ～～～ん<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# サランが目を輝かせながら、俺を見ている。嬉しいけどちょっと恥ずかしい。
line = "サランが目を輝かせながら、俺を見ている。嬉しいけどちょっと恥ずかしい。"

[[dialogue]]
speaker = "unk"
# あ～～ん
line = "あ～～ん"

[[dialogue]]
speaker = "unk"
# 気まずさを感じながらも、サランのあーんを受け止める。
line = "気まずさを感じながらも、サランのあーんを受け止める。"

[[dialogue]]
speaker = "サラン"
# 「ど～お？　美味しい？」
line = "「ど～お？　美味しい？」"

[[dialogue]]
speaker = "unk"
# 甘辛くて美味しい！
line = "甘辛くて美味しい！"

[[dialogue]]
speaker = "unk"
# 甘さとしょっぱさ、ほのかな辛みが見事に調和している。強いて例えるなら、辛みのあるみたらしのような感じ。
line = "甘さとしょっぱさ、ほのかな辛みが見事に調和している。強いて例えるなら、辛みのあるみたらしのような感じ。"

[[dialogue]]
speaker = "サラン"
# 「ふふ～、よかった～♪　会長ちゃんの美味しいがいちばん嬉しい～♪」
line = "「ふふ～、よかった～♪　会長ちゃんの美味しいがいちばん嬉しい～♪」"

[[dialogue]]
speaker = "リィベル"
# 「ふぅん。バカップルって実在するのね」
line = "「ふぅん。バカップルって実在するのね」"

[[dialogue]]
speaker = "サラン"
# 「リィベルちゃんも食べてね～。感想を教えてくれたら嬉しいな～」
line = "「リィベルちゃんも食べてね～。感想を教えてくれたら嬉しいな～」"

[[dialogue]]
speaker = "リィベル"
# 「私、甘いものはいまいちだって言ってるでしょ」
line = "「私、甘いものはいまいちだって言ってるでしょ」"

[[dialogue]]
speaker = "サラン"
# 「まぁまぁ、そう言わずに食べて～。きっと気に入ると思うな～」
line = "「まぁまぁ、そう言わずに食べて～。きっと気に入ると思うな～」"

[[dialogue]]
speaker = "リィベル"
# 「そこまで言うなら、ひと口だけ…………ん！」
line = "「そこまで言うなら、ひと口だけ…………ん！」"

[[dialogue]]
speaker = "リィベル"
# 「香ばしい苦みの中に、わずかに甘みが隠れている。美味しいわ。確かに私の好みよ」
line = "「香ばしい苦みの中に、わずかに甘みが隠れている。美味しいわ。確かに私の好みよ」"

[[dialogue]]
speaker = "リィベル"
# 「……さすがね、サラン。正直、見くびっていたわ」
line = "「……さすがね、サラン。正直、見くびっていたわ」"

[[dialogue]]
speaker = "サラン"
# 「えへへ～。そんなに褒められると照れちゃう～♪　たくさんあるから、いっぱい食べてね～」
line = "「えへへ～。そんなに褒められると照れちゃう～♪　たくさんあるから、いっぱい食べてね～」"

[[dialogue]]
speaker = "リィベル"
# 「……いただくわ」
line = "「……いただくわ」"

[[dialogue]]
speaker = "unk"
# つれないことを言っていたくせに、リィベルは黙々とお菓子を口に運ぶ。サランのお菓子には抗えなかったようだ。
line = "つれないことを言っていたくせに、リィベルは黙々とお菓子を口に運ぶ。サランのお菓子には抗えなかったようだ。"

[[dialogue]]
speaker = "サラン"
# 「ふんふふ～ん♪」
line = "「ふんふふ～ん♪」"

[[dialogue]]
speaker = "unk"
# お菓子を頬張るリィベルを、サランが上機嫌で眺めるのだった。
line = "お菓子を頬張るリィベルを、サランが上機嫌で眺めるのだった。"

[[dialogue]]
speaker = "unk"
# 一週間後、サランとリィベルをまたカフェテリアで見かけた。
line = "一週間後、サランとリィベルをまたカフェテリアで見かけた。"

[[dialogue]]
speaker = "サラン"
# 「会長ちゃ～ん。今日も魔界スイーツ研究やってるよ～」
line = "「会長ちゃ～ん。今日も魔界スイーツ研究やってるよ～」"

[[dialogue]]
speaker = "リィベル"
# 「うぐぐぐ……」
line = "「うぐぐぐ……」"

[[dialogue]]
speaker = "unk"
# 何やら呻きながら、リィベルがお菓子を食べ続けている。しかも前に見た時より心なしかふっくらしているような……
line = "何やら呻きながら、リィベルがお菓子を食べ続けている。しかも前に見た時より心なしかふっくらしているような……"

[[dialogue]]
speaker = "リィベル"
# 「美味しい……どのお菓子も美味しい……食べるのが止まらない…………うぅっ」
line = "「美味しい……どのお菓子も美味しい……食べるのが止まらない…………うぅっ」"

[[dialogue]]
speaker = "サラン"
# 「リィベルちゃん、たくさん食べてくれて嬉しいな～。張り切っていっぱい作っちゃった～♪」
line = "「リィベルちゃん、たくさん食べてくれて嬉しいな～。張り切っていっぱい作っちゃった～♪」"

[[dialogue]]
speaker = "サラン"
# 「会長ちゃんもたくさん食べてね～。オススメはこの魔獣のケーキかな～。お腹を割ると、ベリーソースが溢れてくるの～」
line = "「会長ちゃんもたくさん食べてね～。オススメはこの魔獣のケーキかな～。お腹を割ると、ベリーソースが溢れてくるの～」"

[[dialogue]]
speaker = "unk"
# ケーキの魔獣の腹から、はらわたのように赤いソースがこぼれ出す。サランらしからぬグロテスクさだが、魔族センスなのだろう。
line = "ケーキの魔獣の腹から、はらわたのように赤いソースがこぼれ出す。サランらしからぬグロテスクさだが、魔族センスなのだろう。"

[[dialogue]]
speaker = "リィベル"
# 「もう止まらなきゃいけないのに、止まれない……誰か、私を止めて…………」
line = "「もう止まらなきゃいけないのに、止まれない……誰か、私を止めて…………」"

[[dialogue]]
speaker = "サラン"
# 「ふふふ～♪　お口に合ったみたいでよかった～♪」
line = "「ふふふ～♪　お口に合ったみたいでよかった～♪」"

[[dialogue]]
speaker = "unk"
# サラン自身もたくさん食べるけど、人にも暴食させてしまうのは、無自覚な大罪なのかもしれない。
line = "サラン自身もたくさん食べるけど、人にも暴食させてしまうのは、無自覚な大罪なのかもしれない。"

[[dialogue]]
speaker = "サラン"
# 「会長ちゃん、あ～～ん<emoji=heart04>」
line = "「会長ちゃん、あ～～ん<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# サランもあ～～ん
line = "サランもあ～～ん"

[[dialogue]]
speaker = "サラン"
# 「あ～～ん<emoji=heart04>　ん～～っ、会長ちゃんに食べさせてもらうと、もっと美味し～♪」
line = "「あ～～ん<emoji=heart04>　ん～～っ、会長ちゃんに食べさせてもらうと、もっと美味し～♪」"

[[dialogue]]
speaker = "unk"
# 嘆くリィベルの横で、お菓子を食べさせ合う俺たち。傍から見れば確かにバカップルだ。
line = "嘆くリィベルの横で、お菓子を食べさせ合う俺たち。傍から見れば確かにバカップルだ。"

[[dialogue]]
speaker = "シャルレーヌ"
# （何あれ、怖……やっぱり魔将には近づかないでおこうっと……）
line = "（何あれ、怖……やっぱり魔将には近づかないでおこうっと……）"
