[[dialogue]]
speaker = "unk"
# 第１話,２つのゲージ,P
line = "第１話,２つのゲージ,P"

[[dialogue]]
speaker = "unk"
# ――それは、クーシェンがメイド修行を始めるより前のこと。
line = "――それは、クーシェンがメイド修行を始めるより前のこと。"

[[dialogue]]
speaker = "unk"
# 遊園地デートを楽しんだ俺たちは、もっと仲良くなる……そのはずだった。
line = "遊園地デートを楽しんだ俺たちは、もっと仲良くなる……そのはずだった。"

[[dialogue]]
speaker = "クーシェン"
# 「この前から、なんかムズムズする……もう、なんなの、これぇ」
line = "「この前から、なんかムズムズする……もう、なんなの、これぇ」"

[[dialogue]]
speaker = "クーシェン"
# 「いつもなら、バトルしたらスカッとするのに、全然スカッとしないし……」
line = "「いつもなら、バトルしたらスカッとするのに、全然スカッとしないし……」"

[[dialogue]]
speaker = "クーシェン"
# 「………………にーにー……」
line = "「………………にーにー……」"

[[dialogue]]
speaker = "unk"
# 呼んだ？
line = "呼んだ？"

[[dialogue]]
speaker = "unk"
# クーシェン？
line = "クーシェン？"

[[dialogue]]
speaker = "クーシェン"
# 「ぴゃあっ！！？」
line = "「ぴゃあっ！！？」"

[[dialogue]]
speaker = "クーシェン"
# 「にーにー！？　い、い、いきなりなんなの！　ビックリしたでしょ！」
line = "「にーにー！？　い、い、いきなりなんなの！　ビックリしたでしょ！」"

[[dialogue]]
speaker = "クーシェン"
# 「不意打ちするなんてヒキョーだぞ！　ボクと勝負したいなら、正面から来てよね！」
line = "「不意打ちするなんてヒキョーだぞ！　ボクと勝負したいなら、正面から来てよね！」"

[[dialogue]]
speaker = "unk"
# 模擬戦でもしようか
line = "模擬戦でもしようか"

[[dialogue]]
speaker = "unk"
# じゃあせっかくだし
line = "じゃあせっかくだし"

[[dialogue]]
speaker = "クーシェン"
# 「え！？　ボクとバトルしてくれるの？　にーにーってば、いつも忙しいから誘ってもあんま乗ってくれなかったのに」
line = "「え！？　ボクとバトルしてくれるの？　にーにーってば、いつも忙しいから誘ってもあんま乗ってくれなかったのに」"

[[dialogue]]
speaker = "クーシェン"
# 「あ、でも……やっぱ今日はなしで。この前からボク、なんか調子悪いんだよね」
line = "「あ、でも……やっぱ今日はなしで。この前からボク、なんか調子悪いんだよね」"

[[dialogue]]
speaker = "クーシェン"
# 「ケガとか病気じゃないから、心配しないでよ。ていうか、今ボクのおでこ触ろうとしたでしょ？　熱なんてないからね」
line = "「ケガとか病気じゃないから、心配しないでよ。ていうか、今ボクのおでこ触ろうとしたでしょ？　熱なんてないからね」"

[[dialogue]]
speaker = "クーシェン"
# 「もう、にーにーってば心配性だなぁ。そんなにボクのことが気になるの？」
line = "「もう、にーにーってば心配性だなぁ。そんなにボクのことが気になるの？」"

[[dialogue]]
speaker = "unk"
# 当たり前だろ
line = "当たり前だろ"

[[dialogue]]
speaker = "unk"
# 気になるよ
line = "気になるよ"

[[dialogue]]
speaker = "クーシェン"
# 「そ、そーなんだ……もう、相変わらずやさしいんだから。でも……ありがと。気にしてくれて、うれしかった」
line = "「そ、そーなんだ……もう、相変わらずやさしいんだから。でも……ありがと。気にしてくれて、うれしかった」"

[[dialogue]]
speaker = "クーシェン"
# 「ううっ、またおっぱいのとこがムズムズしてきた……なんなの、これ……ほんと迷惑なんだけど」
line = "「ううっ、またおっぱいのとこがムズムズしてきた……なんなの、これ……ほんと迷惑なんだけど」"

[[dialogue]]
speaker = "クーシェン"
# 「……はっ！　もしかして、おっぱいが進化しかかってるとか？　ボクの『大人ゲージ』が貯まってきた証拠なのかも」
line = "「……はっ！　もしかして、おっぱいが進化しかかってるとか？　ボクの『大人ゲージ』が貯まってきた証拠なのかも」"

[[dialogue]]
speaker = "unk"
# 『大人ゲージ』とはクーシェンが提唱する『謎ゲージ理論』である。
line = "『大人ゲージ』とはクーシェンが提唱する『謎ゲージ理論』である。"

[[dialogue]]
speaker = "unk"
# 大人ゲージが貯まっていくことによって身体の成長──おっぱいが大きくなると信じているらしい。
line = "大人ゲージが貯まっていくことによって身体の成長──おっぱいが大きくなると信じているらしい。"

[[dialogue]]
speaker = "クーシェン"
# 「せーちょーつう、ってやつ？　そういうの聞いたことある」
line = "「せーちょーつう、ってやつ？　そういうの聞いたことある」"

[[dialogue]]
speaker = "クーシェン"
# 「やった！　これでボクもボンキュッボンになっちゃうぞ～！」
line = "「やった！　これでボクもボンキュッボンになっちゃうぞ～！」"

[[dialogue]]
speaker = "unk"
# この時のクーシェンは、いつもの元気を取り戻したように見えた。
line = "この時のクーシェンは、いつもの元気を取り戻したように見えた。"

[[dialogue]]
speaker = "unk"
# しかし、それは１日も経たずに覆されることになる。
line = "しかし、それは１日も経たずに覆されることになる。"

[[dialogue]]
speaker = "クーシェン"
# 「にーにー、助けて！」
line = "「にーにー、助けて！」"

[[dialogue]]
speaker = "クーシェン"
# 「夜なのに来ちゃってごめん。でもボク、あれからもっとおかしくなって……」
line = "「夜なのに来ちゃってごめん。でもボク、あれからもっとおかしくなって……」"

[[dialogue]]
speaker = "クーシェン"
# 「大人に進化するのかなってウキウキしてたけど、全然進化しないし、それどころかおっぱいのところがもっとギュ～～ってなって……」
line = "「大人に進化するのかなってウキウキしてたけど、全然進化しないし、それどころかおっぱいのところがもっとギュ～～ってなって……」"

[[dialogue]]
speaker = "クーシェン"
# 「ボクを助けてくれるのはにーにーしかいないって……来ちゃったけど……」
line = "「ボクを助けてくれるのはにーにーしかいないって……来ちゃったけど……」"

[[dialogue]]
speaker = "クーシェン"
# 「ううっ、走ってきたせいかなぁ、またおっぱいがバクハツしそうになってきた……ボク、このままハレツして死んじゃうのかなぁ」
line = "「ううっ、走ってきたせいかなぁ、またおっぱいがバクハツしそうになってきた……ボク、このままハレツして死んじゃうのかなぁ」"

[[dialogue]]
speaker = "クーシェン"
# 「普通にしてたらおっぱいもギュッてならないんだよ。でもね……この前の遊園地デートのこと、思い出すと苦しくなってきて……」
line = "「普通にしてたらおっぱいもギュッてならないんだよ。でもね……この前の遊園地デートのこと、思い出すと苦しくなってきて……」"

[[dialogue]]
speaker = "クーシェン"
# 「今も、にーにーの顔を見てると、おんなじ風になっちゃって……ボクどうすればいいかわかんないよ……」
line = "「今も、にーにーの顔を見てると、おんなじ風になっちゃって……ボクどうすればいいかわかんないよ……」"

[[dialogue]]
speaker = "クーシェン"
# 「きっとこれは大人ゲージを貯める前に、『好きゲージ』を貯めなきゃいけないっていうルールを破ったボクへの罰なんだ……」
line = "「きっとこれは大人ゲージを貯める前に、『好きゲージ』を貯めなきゃいけないっていうルールを破ったボクへの罰なんだ……」"

[[dialogue]]
speaker = "unk"
# クーシェンによると、本来は大人ゲージが貯まった後に、好きゲージが貯まっていくものらしい。
line = "クーシェンによると、本来は大人ゲージが貯まった後に、好きゲージが貯まっていくものらしい。"

[[dialogue]]
speaker = "unk"
# けれどクーシェンは大人ゲージを貯めきっていないのに、俺のことを意識してしまったため、好きゲージがどんどん貯まり始めてしまっている。
line = "けれどクーシェンは大人ゲージを貯めきっていないのに、俺のことを意識してしまったため、好きゲージがどんどん貯まり始めてしまっている。"

[[dialogue]]
speaker = "unk"
# だからこんなにも胸が苦しくなってしまうのだ──と、そう思っているようだ。けれど……
line = "だからこんなにも胸が苦しくなってしまうのだ──と、そう思っているようだ。けれど……"

[[dialogue]]
speaker = "unk"
# 恋をすると誰しもが経験するものだよ
line = "恋をすると誰しもが経験するものだよ"

[[dialogue]]
speaker = "unk"
# その苦しさは罰じゃない
line = "その苦しさは罰じゃない"

[[dialogue]]
speaker = "クーシェン"
# 「そうなの？　みんな、こんな苦しい思いをしてるの？」
line = "「そうなの？　みんな、こんな苦しい思いをしてるの？」"

[[dialogue]]
speaker = "unk"
# 俺もクーシェンを想うと胸が苦しい
line = "俺もクーシェンを想うと胸が苦しい"

[[dialogue]]
speaker = "unk"
# そうだよ
line = "そうだよ"

[[dialogue]]
speaker = "クーシェン"
# 「え？　にーにーも？」
line = "「え？　にーにーも？」"

[[dialogue]]
speaker = "クーシェン"
# 「そっか、おんなじなんだ……にーにーも進化する前にボクへの好きゲージが貯まり始めちゃったんだね」
line = "「そっか、おんなじなんだ……にーにーも進化する前にボクへの好きゲージが貯まり始めちゃったんだね」"

[[dialogue]]
speaker = "unk"
# 俺の好きゲージはもうＭＡＸだけどね
line = "俺の好きゲージはもうＭＡＸだけどね"

[[dialogue]]
speaker = "unk"
# 貯まり始めちゃったどころか……
line = "貯まり始めちゃったどころか……"

[[dialogue]]
speaker = "クーシェン"
# 「ええっ！？　もういっぱいまで貯まっちゃってたの！？」
line = "「ええっ！？　もういっぱいまで貯まっちゃってたの！？」"

[[dialogue]]
speaker = "クーシェン"
# 「それじゃボクなんかより、ずっと苦しい思いをしてきたんじゃ……ねえ、大丈夫なの？」
line = "「それじゃボクなんかより、ずっと苦しい思いをしてきたんじゃ……ねえ、大丈夫なの？」"

[[dialogue]]
speaker = "unk"
# 本気で心配そうな表情を浮かべるクーシェンを安心させるように笑顔を見せる。
line = "本気で心配そうな表情を浮かべるクーシェンを安心させるように笑顔を見せる。"

[[dialogue]]
speaker = "unk"
# 好きだよ、クーシェン
line = "好きだよ、クーシェン"

[[dialogue]]
speaker = "クーシェン"
# 「ぁ……」
line = "「ぁ……」"

[[dialogue]]
speaker = "unk"
# どんなに苦しくても、この気持ちは抑えられない──そう、クーシェンに伝えた。
line = "どんなに苦しくても、この気持ちは抑えられない──そう、クーシェンに伝えた。"

[[dialogue]]
speaker = "クーシェン"
# 「ぅぅ……そんなこと言われたら……ボクの好きゲージも、どんどん上がっちゃう……」
line = "「ぅぅ……そんなこと言われたら……ボクの好きゲージも、どんどん上がっちゃう……」"

[[dialogue]]
speaker = "クーシェン"
# 「だけど、だけど……何でだろ……さっきまであんなに苦しかったのに……嬉しい気持ちでいっぱいで……」
line = "「だけど、だけど……何でだろ……さっきまであんなに苦しかったのに……嬉しい気持ちでいっぱいで……」"

[[dialogue]]
speaker = "クーシェン"
# 「ねえ、にーにー、どうして？　どうしてだと思う？」
line = "「ねえ、にーにー、どうして？　どうしてだと思う？」"

[[dialogue]]
speaker = "unk"
# クーシェンが自分の気持ちに気付いたから
line = "クーシェンが自分の気持ちに気付いたから"

[[dialogue]]
speaker = "unk"
# きっと大人ゲージも一緒に貯まったからだよ
line = "きっと大人ゲージも一緒に貯まったからだよ"

[[dialogue]]
speaker = "クーシェン"
# 「ボクの、気持ち……」
line = "「ボクの、気持ち……」"

[[dialogue]]
speaker = "クーシェン"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "クーシェン"
# 「ボクも……にーにーのことが好き……」
line = "「ボクも……にーにーのことが好き……」"

[[dialogue]]
speaker = "クーシェン"
# 「にーにーに好きって告白してもらって……ボクもそうだって気が付いて……」
line = "「にーにーに好きって告白してもらって……ボクもそうだって気が付いて……」"

[[dialogue]]
speaker = "クーシェン"
# 「そっか……だからボクの大人ゲージが上がったんだ……」
line = "「そっか……だからボクの大人ゲージが上がったんだ……」"

[[dialogue]]
speaker = "クーシェン"
# 「ありがと、にーにー……ボクに好きって言ってくれて……それから、ボクに好きって気付かせてくれて……」
line = "「ありがと、にーにー……ボクに好きって言ってくれて……それから、ボクに好きって気付かせてくれて……」"

[[dialogue]]
speaker = "クーシェン"
# 「えへへ、今までで１番、大人ゲージが上がった気がするよ……相変わらず、おっぱいは小さいままだけど」
line = "「えへへ、今までで１番、大人ゲージが上がった気がするよ……相変わらず、おっぱいは小さいままだけど」"

[[dialogue]]
speaker = "クーシェン"
# 「でも、にーにーとこうやって気持ちを伝え合えば、大人ゲージもいっぱい上がっていくのかな？」
line = "「でも、にーにーとこうやって気持ちを伝え合えば、大人ゲージもいっぱい上がっていくのかな？」"

[[dialogue]]
speaker = "unk"
# そうかもな
line = "そうかもな"

[[dialogue]]
speaker = "クーシェン"
# 「だったらさ……これからも手伝ってよ」
line = "「だったらさ……これからも手伝ってよ」"

[[dialogue]]
speaker = "クーシェン"
# 「にーにーも大人ゲージを貯めなくちゃでしょ？　だから、それと一緒にボクの大人ゲージを貯めるの、手伝って欲しいな……」
line = "「にーにーも大人ゲージを貯めなくちゃでしょ？　だから、それと一緒にボクの大人ゲージを貯めるの、手伝って欲しいな……」"

[[dialogue]]
speaker = "unk"
# 一緒に貯めよう！
line = "一緒に貯めよう！"

[[dialogue]]
speaker = "unk"
# ああ
line = "ああ"

[[dialogue]]
speaker = "クーシェン"
# 「うん、よろしくねっ！　大好きだよ、にーにー<emoji=heart04>」
line = "「うん、よろしくねっ！　大好きだよ、にーにー<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# しっかりと抱き合いながら、互いのゲージを貯め合う約束をする。
line = "しっかりと抱き合いながら、互いのゲージを貯め合う約束をする。"

[[dialogue]]
speaker = "unk"
# それが俺とクーシェンの恋愛関係のスタートになったのだった。
line = "それが俺とクーシェンの恋愛関係のスタートになったのだった。"
