[[dialogue]]
speaker = "シルヴィ"
# 「へ？」
line = "「へ？」"

[[dialogue]]
speaker = "コハルコ"
# 「いや、だから……私、泳げないの！」
line = "「いや、だから……私、泳げないの！」"

[[dialogue]]
speaker = "シルヴィ"
# 「もしかして、水着を着るの渋ってたの、それが本当の理由？」
line = "「もしかして、水着を着るの渋ってたの、それが本当の理由？」"

[[dialogue]]
speaker = "コハルコ"
# 「…………………………うん」
line = "「…………………………うん」"

[[dialogue]]
speaker = "シルヴィ"
# 「……ぷっ、あはははははっ！」
line = "「……ぷっ、あはははははっ！」"

[[dialogue]]
speaker = "コハルコ"
# 「ちょっ、笑わないでっ！」
line = "「ちょっ、笑わないでっ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「ごめんごめん。コハルコって何でもできるイメージだったから、まさか泳げないなんて思わなくて」
line = "「ごめんごめん。コハルコって何でもできるイメージだったから、まさか泳げないなんて思わなくて」"

[[dialogue]]
speaker = "コハルコ"
# 「そりゃあ機械関係なら大体のことはできるけど、体を動かすのはダメなの！」
line = "「そりゃあ機械関係なら大体のことはできるけど、体を動かすのはダメなの！」"

[[dialogue]]
speaker = "コハルコ"
# 「ボール投げは１０メートルもいかないし、反復横跳びも足がもつれて転ぶし…………うぅ、自分で言ってて悲しくなってきた……」
line = "「ボール投げは１０メートルもいかないし、反復横跳びも足がもつれて転ぶし…………うぅ、自分で言ってて悲しくなってきた……」"

[[dialogue]]
speaker = "シルヴィ"
# 「……もしかしてコハルコって運動音痴？」
line = "「……もしかしてコハルコって運動音痴？」"

[[dialogue]]
speaker = "コハルコ"
# 「もう、はっきり言わないでっ！」
line = "「もう、はっきり言わないでっ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「あははっ、大丈夫大丈夫。誰でも苦手なことのひとつやふたつあるもんだよ。あたしだって星徒会だったのに書類仕事とか苦手だったし！」
line = "「あははっ、大丈夫大丈夫。誰でも苦手なことのひとつやふたつあるもんだよ。あたしだって星徒会だったのに書類仕事とか苦手だったし！」"

[[dialogue]]
speaker = "コハルコ"
# 「それについてはサーシャに怒られなさい」
line = "「それについてはサーシャに怒られなさい」"

[[dialogue]]
speaker = "シルヴィ"
# 「ははっ！　よし、じゃあ、やることは決まったね！」
line = "「ははっ！　よし、じゃあ、やることは決まったね！」"

[[dialogue]]
speaker = "コハルコ"
# 「あ…………なんか嫌な予感」
line = "「あ…………なんか嫌な予感」"

[[dialogue]]
speaker = "シルヴィ"
# 「泳げるように！　なろう！」
line = "「泳げるように！　なろう！」"

[[dialogue]]
speaker = "unk"
# リゾート結界に場所を移して、コハルコの特訓が始まった。
line = "リゾート結界に場所を移して、コハルコの特訓が始まった。"

[[dialogue]]
speaker = "シルヴィ"
# 「まずは水に親しむところから！　その場で海に潜ってみよう！」
line = "「まずは水に親しむところから！　その場で海に潜ってみよう！」"

[[dialogue]]
speaker = "コハルコ"
# 「イヤです。顔を水につけたくないです」
line = "「イヤです。顔を水につけたくないです」"

[[dialogue]]
speaker = "シルヴィ"
# 「えぇっ！？　そこから！？」
line = "「えぇっ！？　そこから！？」"

[[dialogue]]
speaker = "コハルコ"
# 「やっぱり泳げなくていいよ！　何かあっても星騎士だから飛べるし！」
line = "「やっぱり泳げなくていいよ！　何かあっても星騎士だから飛べるし！」"

[[dialogue]]
speaker = "シルヴィ"
# 「星力は大人になったらなくなっちゃうでしょっ！」
line = "「星力は大人になったらなくなっちゃうでしょっ！」"

[[dialogue]]
speaker = "コハルコ"
# 「いや、でも私、魔女だからっ！　魔力は一生ものでずっと使えるし！」
line = "「いや、でも私、魔女だからっ！　魔力は一生ものでずっと使えるし！」"

[[dialogue]]
speaker = "シルヴィ"
# 「詳しくは知らないけど、コハルコは魔女でもちょっと特殊なんでしょ？　ずっと魔力が使える保証なんてないんじゃない？」
line = "「詳しくは知らないけど、コハルコは魔女でもちょっと特殊なんでしょ？　ずっと魔力が使える保証なんてないんじゃない？」"

[[dialogue]]
speaker = "コハルコ"
# 「それは…………確かに」
line = "「それは…………確かに」"

[[dialogue]]
speaker = "unk"
# かつての事件で、コハルコは魔女の生まれだと判明した。
line = "かつての事件で、コハルコは魔女の生まれだと判明した。"

[[dialogue]]
speaker = "unk"
# その際に数百年の寿命を喪失し、今では普通の人間並みの寿命となっている。魔力もまた影響を受ける可能性は否定できない。
line = "その際に数百年の寿命を喪失し、今では普通の人間並みの寿命となっている。魔力もまた影響を受ける可能性は否定できない。"

[[dialogue]]
speaker = "シルヴィ"
# 「はい、というわけで特訓再開！」
line = "「はい、というわけで特訓再開！」"

[[dialogue]]
speaker = "コハルコ"
# 「うぅ……シルヴィの鬼、悪魔！」
line = "「うぅ……シルヴィの鬼、悪魔！」"

[[dialogue]]
speaker = "シルヴィ"
# 「ん？　あたし天使だよ？」
line = "「ん？　あたし天使だよ？」"

[[dialogue]]
speaker = "コハルコ"
# 「そうじゃない……そうだけど、そうじゃないんだよ……」
line = "「そうじゃない……そうだけど、そうじゃないんだよ……」"

[[dialogue]]
speaker = "チキン？"
# 「チキチキー！」
line = "「チキチキー！」"

[[dialogue]]
speaker = "コハルコ"
# 「なにこれ！？」
line = "「なにこれ！？」"

[[dialogue]]
speaker = "シルヴィ"
# 「フライドチキンだよ！　いや、飛んでるからフライングチキンかな？」
line = "「フライドチキンだよ！　いや、飛んでるからフライングチキンかな？」"

[[dialogue]]
speaker = "コハルコ"
# 「そこはどっちでもいいけど、なんでチキンが飛んでるの！？」
line = "「そこはどっちでもいいけど、なんでチキンが飛んでるの！？」"

[[dialogue]]
speaker = "チキン？"
# 「チキー！」
line = "「チキー！」"

[[dialogue]]
speaker = "コハルコ"
# 「攻撃してきた！？　迎撃するよ、シルヴィ！」
line = "「攻撃してきた！？　迎撃するよ、シルヴィ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「おっけー！　じゃあ……」
line = "「おっけー！　じゃあ……」"

[[dialogue]]
speaker = "シルヴィ"
# 「我が守護星アヴィオールよ……」
line = "「我が守護星アヴィオールよ……」"

[[dialogue]]
speaker = "シルヴィ"
# 「よし、なんか出た！　この辺りは普通の戦闘服と同じだね！」
line = "「よし、なんか出た！　この辺りは普通の戦闘服と同じだね！」"

[[dialogue]]
speaker = "コハルコ"
# 「シルヴィは相変わらず感覚派だなぁ。まぁいいや、私もやってみよ」
line = "「シルヴィは相変わらず感覚派だなぁ。まぁいいや、私もやってみよ」"

[[dialogue]]
speaker = "コハルコ"
# 「星力、魔力同調──ファミリア・ドローン再起動！」
line = "「星力、魔力同調──ファミリア・ドローン再起動！」"

[[dialogue]]
speaker = "コハルコ"
# 「ドルフィンドローン、ゴー！」
line = "「ドルフィンドローン、ゴー！」"

[[dialogue]]
speaker = "コハルコ"
# 「エコーノイズショット！」
line = "「エコーノイズショット！」"

[[dialogue]]
speaker = "シルヴィ"
# 「ハープーンストライク！」
line = "「ハープーンストライク！」"

[[dialogue]]
speaker = "チキン？"
# 「チキィ……」
line = "「チキィ……」"

[[dialogue]]
speaker = "シルヴィ"
# 「倒したら普通のフライドチキンになった！　うまっ！」
line = "「倒したら普通のフライドチキンになった！　うまっ！」"

[[dialogue]]
speaker = "コハルコ"
# 「食べていいのそれ！？」
line = "「食べていいのそれ！？」"

[[dialogue]]
speaker = "シルヴィ"
# 「え、美味しいよ？　でもこの味付け、どこかで……あ、購買のフライドチキンだ！」
line = "「え、美味しいよ？　でもこの味付け、どこかで……あ、購買のフライドチキンだ！」"

[[dialogue]]
speaker = "コハルコ"
# 「味付けまで把握してるなんて、さすがシルヴィ……。フライドチキン大好きだもんね」
line = "「味付けまで把握してるなんて、さすがシルヴィ……。フライドチキン大好きだもんね」"

[[dialogue]]
speaker = "コハルコ"
# 「それにしても、購買のチキンの味がするってどういうこと……？」
line = "「それにしても、購買のチキンの味がするってどういうこと……？」"

[[dialogue]]
speaker = "チキン？"
# 「チキチキチー！！」
line = "「チキチキチー！！」"

[[dialogue]]
speaker = "シルヴィ"
# 「やった、いっぱい出た！　チキン食べ放題だー！」
line = "「やった、いっぱい出た！　チキン食べ放題だー！」"

[[dialogue]]
speaker = "コハルコ"
# 「もうなんなのこれー！？」
line = "「もうなんなのこれー！？」"
