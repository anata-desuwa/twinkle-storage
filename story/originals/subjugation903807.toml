[[dialogue]]
speaker = "聖沙"
# 「――パッションサマーストリーム！！！」
line = "「――パッションサマーストリーム！！！」"

[[dialogue]]
speaker = "unk"
# …………
line = "…………"

[[dialogue]]
speaker = "リア"
# 「あ……会長くんの体が、仰向けに倒れて……！」
line = "「あ……会長くんの体が、仰向けに倒れて……！」"

[[dialogue]]
speaker = "unk"
# 見事……！
line = "見事……！"

[[dialogue]]
speaker = "聖沙"
# 「か……勝った……！　会長のハイレグに……！」
line = "「か……勝った……！　会長のハイレグに……！」"

[[dialogue]]
speaker = "リア"
# 「聖沙ちゃんの水着の勝ちだよ～～～っ！！　やったぁ～～～っ♪」
line = "「聖沙ちゃんの水着の勝ちだよ～～～っ！！　やったぁ～～～っ♪」"

[[dialogue]]
speaker = "聖沙"
# 「は、はいっ♪　数え切れないくらい負けた内の１勝ですけど、勝ちました……！」
line = "「は、はいっ♪　数え切れないくらい負けた内の１勝ですけど、勝ちました……！」"

[[dialogue]]
speaker = "unk"
# 俺のハイレグの弱点を
line = "俺のハイレグの弱点を"

[[dialogue]]
speaker = "unk"
# よくぞ見抜いたな
line = "よくぞ見抜いたな"

[[dialogue]]
speaker = "聖沙"
# 「ええ。会長のハイレグは、３倍もの大出力を発揮できる代わりに、星力の消耗が激しい――そうよね？」
line = "「ええ。会長のハイレグは、３倍もの大出力を発揮できる代わりに、星力の消耗が激しい――そうよね？」"

[[dialogue]]
speaker = "聖沙"
# 「だから、諦めずに勝負を挑み続ければ、私の水着フォームよりも先にエネルギー切れを起こしてしまう」
line = "「だから、諦めずに勝負を挑み続ければ、私の水着フォームよりも先にエネルギー切れを起こしてしまう」"

[[dialogue]]
speaker = "unk"
# 聖沙の粘り勝ちだ
line = "聖沙の粘り勝ちだ"

[[dialogue]]
speaker = "聖沙"
# 「ええ。でも、たったの１勝よ」
line = "「ええ。でも、たったの１勝よ」"

[[dialogue]]
speaker = "聖沙"
# 「だから、認めるわ。会長の海パンの強さを」
line = "「だから、認めるわ。会長の海パンの強さを」"

[[dialogue]]
speaker = "聖沙"
# 「――ナイスハイレグだったわ！」
line = "「――ナイスハイレグだったわ！」"

[[dialogue]]
speaker = "聖沙"
# 「会長の海パンが回復したら、また勝負よ！」
line = "「会長の海パンが回復したら、また勝負よ！」"

[[dialogue]]
speaker = "聖沙"
# 「私の水着も、もっと鍛えて強くなってみせるんだから♪」
line = "「私の水着も、もっと鍛えて強くなってみせるんだから♪」"

[[dialogue]]
speaker = "unk"
# こうして、俺たちはお互いに強くなる為、それからも水着で勝負をし続けるのだった。
line = "こうして、俺たちはお互いに強くなる為、それからも水着で勝負をし続けるのだった。"
