[[dialogue]]
speaker = "モネ"
# 「いったい何事ですか……！？」
line = "「いったい何事ですか……！？」"

[[dialogue]]
speaker = "リィベル"
# 「深淵書庫は、魔界と流星市国内ならモンスターの出現を感知できるわ。リクリエは仇敵だもの」
line = "「深淵書庫は、魔界と流星市国内ならモンスターの出現を感知できるわ。リクリエは仇敵だもの」"

[[dialogue]]
speaker = "リィベル"
# 「映像、出すわ」
line = "「映像、出すわ」"

[[dialogue]]
speaker = "モンスター"
# 「コォォオッ！」
line = "「コォォオッ！」"

[[dialogue]]
speaker = "リィベル"
# 「幸い、すぐに居住地には到達しそうにないわね。でも見過ごすわけにはいかないわ」
line = "「幸い、すぐに居住地には到達しそうにないわね。でも見過ごすわけにはいかないわ」"

[[dialogue]]
speaker = "ウィステリア"
# 「こんな機能があったとは知らなかったわ。映像まであるなんて……正確には遠見の魔法なんでしょうけど」
line = "「こんな機能があったとは知らなかったわ。映像まであるなんて……正確には遠見の魔法なんでしょうけど」"

[[dialogue]]
speaker = "リィベル"
# 「今までは感知しても手出しできなかっただけよ。あと、アラームと映像はアニメで見ていいなと思って……こほん、実用性を考慮して実装したわ」
line = "「今までは感知しても手出しできなかっただけよ。あと、アラームと映像はアニメで見ていいなと思って……こほん、実用性を考慮して実装したわ」"

[[dialogue]]
speaker = "イクシリオン"
# （リィベルさん、もしや深夜アニメなど嗜んでいたり……特に肌色の多いムフフなものとか……）
line = "（リィベルさん、もしや深夜アニメなど嗜んでいたり……特に肌色の多いムフフなものとか……）"

[[dialogue]]
speaker = "リィベル"
# 「特に騒いでいるのは……書架１７１８番、来なさい」
line = "「特に騒いでいるのは……書架１７１８番、来なさい」"

[[dialogue]]
speaker = "unk"
# リィベルが命令すると、目の前に本棚がせり出した。その中の一冊を手に取る。
line = "リィベルが命令すると、目の前に本棚がせり出した。その中の一冊を手に取る。"

[[dialogue]]
speaker = "リィベル"
# 「モネ。あなたなら、この魔本の声が聞こえるでしょう」
line = "「モネ。あなたなら、この魔本の声が聞こえるでしょう」"

[[dialogue]]
speaker = "モネ"
# 「……はい。地獄の炎のような怒りと憎しみを感じます。厄災の化身を滅ぼしたいと、そう叫んでいます」
line = "「……はい。地獄の炎のような怒りと憎しみを感じます。厄災の化身を滅ぼしたいと、そう叫んでいます」"

[[dialogue]]
speaker = "イクシリオン"
# 「でもどうやって魔界まで行けばいいんでしょう？」
line = "「でもどうやって魔界まで行けばいいんでしょう？」"

[[dialogue]]
speaker = "イクシリオン"
# 「大交流はまだ先ですし、ネビュラの世界樹を借りるにしても、都合よくモンスターのところまで行けるでしょうか？」
line = "「大交流はまだ先ですし、ネビュラの世界樹を借りるにしても、都合よくモンスターのところまで行けるでしょうか？」"

[[dialogue]]
speaker = "リィベル"
# 「問題ないわ。その魔本があれば、魔界なら距離を無視して転送できるから。ウィステリアをフィーニスの塔に送り込んだのに比べれば簡単よ」
line = "「問題ないわ。その魔本があれば、魔界なら距離を無視して転送できるから。ウィステリアをフィーニスの塔に送り込んだのに比べれば簡単よ」"

[[dialogue]]
speaker = "サラン"
# 「すご～い、ウィステリアさん、フィーニスの塔に入ったことあるんだ～♪」
line = "「すご～い、ウィステリアさん、フィーニスの塔に入ったことあるんだ～♪」"

[[dialogue]]
speaker = "ウィステリア"
# 「ま、まぁね。入りたくて入ったわけじゃないけど……」
line = "「ま、まぁね。入りたくて入ったわけじゃないけど……」"

[[dialogue]]
speaker = "リィベル"
# 「モネ。行ってくれるかしら？」
line = "「モネ。行ってくれるかしら？」"

[[dialogue]]
speaker = "モネ"
# 「もちろんです。任せてください」
line = "「もちろんです。任せてください」"

[[dialogue]]
speaker = "ウィステリア"
# 「待って、私も行くわ。紙屋敷さんだけ危ない目に遭わせるわけにはいかないもの」
line = "「待って、私も行くわ。紙屋敷さんだけ危ない目に遭わせるわけにはいかないもの」"

[[dialogue]]
speaker = "リィベル"
# 「ウィステリアは強制的に送るから聞かなかっただけよ。当然、行ってもらうわ」
line = "「ウィステリアは強制的に送るから聞かなかっただけよ。当然、行ってもらうわ」"

[[dialogue]]
speaker = "ウィステリア"
# 「あなた本当に私のこと嫌いよね！？」
line = "「あなた本当に私のこと嫌いよね！？」"

[[dialogue]]
speaker = "リィベル"
# 「じゃあ転送するわ。回収には時間がかかるから、モンスターを倒したら魔本を読んで時間をつぶしておいて」
line = "「じゃあ転送するわ。回収には時間がかかるから、モンスターを倒したら魔本を読んで時間をつぶしておいて」"

[[dialogue]]
speaker = "モネ"
# 「はい、分かりました。では行ってきます！」
line = "「はい、分かりました。では行ってきます！」"

[[dialogue]]
speaker = "ウィステリア"
# 「ちょっ、私の話を聞きな──」
line = "「ちょっ、私の話を聞きな──」"

[[dialogue]]
speaker = "モネ（覚醒）"
# 「魔本よ、汝の仇敵のもとへ我らを導きたまえ！」
line = "「魔本よ、汝の仇敵のもとへ我らを導きたまえ！」"

[[dialogue]]
speaker = "イクシリオン"
# （一瞬だけでしたが、モネさんの魔将のお姿も……大変えっっっで素敵でした……）
line = "（一瞬だけでしたが、モネさんの魔将のお姿も……大変えっっっで素敵でした……）"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～？　サランは行かなくてもよかったの～？」
line = "「ぽよ～？　サランは行かなくてもよかったの～？」"

[[dialogue]]
speaker = "リィベル"
# 「あなたは魔将の力に目覚めたばかりでしょう。まだ実戦は早いわ」
line = "「あなたは魔将の力に目覚めたばかりでしょう。まだ実戦は早いわ」"

[[dialogue]]
speaker = "リィベル"
# 「それにあの２人なら十分よ。それは私が保証するわ」
line = "「それにあの２人なら十分よ。それは私が保証するわ」"

[[dialogue]]
speaker = "リィベル"
# 「……っ！」
line = "「……っ！」"

[[dialogue]]
speaker = "イクシリオン"
# 「またモンスターですか！？」
line = "「またモンスターですか！？」"

[[dialogue]]
speaker = "リィベル"
# 「そのようね。──書架３１７番、起動。反応しているのはこの魔本よ」
line = "「そのようね。──書架３１７番、起動。反応しているのはこの魔本よ」"

[[dialogue]]
speaker = "unk"
# 本棚から抜き出した一冊が、鼓動するかのように光を放っている。暖かな光ではない。禍々しい、憎悪の火だ。
line = "本棚から抜き出した一冊が、鼓動するかのように光を放っている。暖かな光ではない。禍々しい、憎悪の火だ。"

[[dialogue]]
speaker = "リィベル"
# 「現地の様子を見てみましょう」
line = "「現地の様子を見てみましょう」"

[[dialogue]]
speaker = "モンスター"
# 「グガァアアアッ！」
line = "「グガァアアアッ！」"

[[dialogue]]
speaker = "モンスター"
# 「ガルルルッ！！」
line = "「ガルルルッ！！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「もしかしてここ、シャリオン……！？　しかもディアーブル領じゃないですか！？　見覚えがあります！」
line = "「もしかしてここ、シャリオン……！？　しかもディアーブル領じゃないですか！？　見覚えがあります！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「強力なモンスターがあんなにっ……！　くっ……このままじゃ、<ruby=うち>ディアーブル領</ruby>が……」
line = "「強力なモンスターがあんなにっ……！　くっ……このままじゃ、<ruby>ディアーブル領<rt>うち</rt></ruby>が……」"

[[dialogue]]
speaker = "リィベル"
# 「私が行こうにも、私が出撃したらモネたちを回収できなくなる……それ以前に、私じゃ戦力としても足りない……」
line = "「私が行こうにも、私が出撃したらモネたちを回収できなくなる……それ以前に、私じゃ戦力としても足りない……」"

[[dialogue]]
speaker = "unk"
# 書庫の中ではヴィライアの力を行使できるリィベルだが、外では星騎士１人分の戦力でしかない。外からでは書庫の魔力を十全に使えないからだ。
line = "書庫の中ではヴィライアの力を行使できるリィベルだが、外では星騎士１人分の戦力でしかない。外からでは書庫の魔力を十全に使えないからだ。"

[[dialogue]]
speaker = "サラン"
# 「じゃあサランが行く～」
line = "「じゃあサランが行く～」"

[[dialogue]]
speaker = "リィベル"
# 「魔将としては、これが初陣になるのよ。暴走の可能性だってある。その危険性が分かっているのかしら？」
line = "「魔将としては、これが初陣になるのよ。暴走の可能性だってある。その危険性が分かっているのかしら？」"

[[dialogue]]
speaker = "サラン"
# 「それは分かんないけど～……でもサランは美味しいものと、美味しいものを食べる人たちが大好きなの～」
line = "「それは分かんないけど～……でもサランは美味しいものと、美味しいものを食べる人たちが大好きなの～」"

[[dialogue]]
speaker = "サラン"
# 「だから、大好きを守るためならなんでもするよ～」
line = "「だから、大好きを守るためならなんでもするよ～」"

[[dialogue]]
speaker = "イクシリオン"
# 「私もです。生きとし生けるものを守ることこそ、星騎士の使命。お供いたします！」
line = "「私もです。生きとし生けるものを守ることこそ、星騎士の使命。お供いたします！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「サラン先輩、イクシリオン先輩、ありがとうございます……！　私も参ります。ディアーブルの名に懸けて！」
line = "「サラン先輩、イクシリオン先輩、ありがとうございます……！　私も参ります。ディアーブルの名に懸けて！」"

[[dialogue]]
speaker = "リィベル"
# 「……止めても無駄なようね。あなたたち星騎士は、みんな無茶が好きみたい」
line = "「……止めても無駄なようね。あなたたち星騎士は、みんな無茶が好きみたい」"

[[dialogue]]
speaker = "リィベル"
# 「イクシリオン。シャルレーヌ。この本を預けるわ」
line = "「イクシリオン。シャルレーヌ。この本を預けるわ」"

[[dialogue]]
speaker = "イクシリオン"
# 「これは……『色欲』の魔本？」
line = "「これは……『色欲』の魔本？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「こちらは『強欲』の魔本……私たちは魔将に適合しなかったんじゃないですか？」
line = "「こちらは『強欲』の魔本……私たちは魔将に適合しなかったんじゃないですか？」"

[[dialogue]]
speaker = "リィベル"
# 「素質はあるようだから、覚醒する可能性はゼロではないわ。もしもの時は役に立つかもしれないから持っておきなさい」
line = "「素質はあるようだから、覚醒する可能性はゼロではないわ。もしもの時は役に立つかもしれないから持っておきなさい」"

[[dialogue]]
speaker = "リィベル"
# 「サランはこの本を使いなさい。念じればモンスターのところまで連れて行ってくれるわ」
line = "「サランはこの本を使いなさい。念じればモンスターのところまで連れて行ってくれるわ」"

[[dialogue]]
speaker = "サラン"
# 「わかった～。魔本さん、よろしくお願いしま～すっ」
line = "「わかった～。魔本さん、よろしくお願いしま～すっ」"

[[dialogue]]
speaker = "unk"
# サランが魔本を掲げると、ページが風もないのにめくれ、黒く波打つ魔力を撒き散らす。
line = "サランが魔本を掲げると、ページが風もないのにめくれ、黒く波打つ魔力を撒き散らす。"

[[dialogue]]
speaker = "サラン"
# 「それじゃあ、行ってきま～す♪」
line = "「それじゃあ、行ってきま～す♪」"

[[dialogue]]
speaker = "カティア"
# （モネ先輩とウィステリアさんが出撃したと思ったら、今度はサラン先輩たちも行くんだ……）
line = "（モネ先輩とウィステリアさんが出撃したと思ったら、今度はサラン先輩たちも行くんだ……）"

[[dialogue]]
speaker = "カティア"
# （会話まで聞こえなかったけど、さっき見えたの、シャリオンの山だよね？　強そうなモンスターがあんなに……どうしよう、私なんかじゃ役に立たないし……）
line = "（会話まで聞こえなかったけど、さっき見えたの、シャリオンの山だよね？　強そうなモンスターがあんなに……どうしよう、私なんかじゃ役に立たないし……）"

[[dialogue]]
speaker = "カティア"
# （ううぅ～～～～っ、やっぱり行かなくちゃ！　私だって星騎士なんだ！）
line = "（ううぅ～～～～っ、やっぱり行かなくちゃ！　私だって星騎士なんだ！）"

[[dialogue]]
speaker = "カティア"
# 「うおおぉぉーーっ！　待ってください、私も行きます！」
line = "「うおおぉぉーーっ！　待ってください、私も行きます！」"

[[dialogue]]
speaker = "unk"
# 魔界行きの光に飛び込むカティア。次の瞬間には星騎士たちの姿はかき消えていた。
line = "魔界行きの光に飛び込むカティア。次の瞬間には星騎士たちの姿はかき消えていた。"
