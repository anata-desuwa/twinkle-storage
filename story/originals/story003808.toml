[[dialogue]]
speaker = "unk"
# リ・クリエの力を操る堕天使ザタナーンと、戦闘を開始した俺たち。
line = "リ・クリエの力を操る堕天使ザタナーンと、戦闘を開始した俺たち。"

[[dialogue]]
speaker = "ザタナーン"
# 「これが今のクルセイダースの力か。だが――やはりリ・クリエの力には及ばない」
line = "「これが今のクルセイダースの力か。だが――やはりリ・クリエの力には及ばない」"

[[dialogue]]
speaker = "ナナカ"
# 「くっ……めちゃくちゃ強い……！　分厚い壁に守られてるみたいに、攻撃が全然通らない……！」
line = "「くっ……めちゃくちゃ強い……！　分厚い壁に守られてるみたいに、攻撃が全然通らない……！」"

[[dialogue]]
speaker = "ロロット"
# 「私のバリアーは逆に、薄い氷みたいにすぐ割られてしまうのです……！」
line = "「私のバリアーは逆に、薄い氷みたいにすぐ割られてしまうのです……！」"

[[dialogue]]
speaker = "マトイ（覚醒）"
# 「私の盾も気休めくらいにしかならない……！」
line = "「私の盾も気休めくらいにしかならない……！」"

[[dialogue]]
speaker = "聖沙"
# 「それでも、負けないわ！　決して諦めたりしない！」
line = "「それでも、負けないわ！　決して諦めたりしない！」"

[[dialogue]]
speaker = "聖沙"
# 「――はああぁっ！」
line = "「――はああぁっ！」"

[[dialogue]]
speaker = "ザタナーン"
# 「無駄だ」
line = "「無駄だ」"

[[dialogue]]
speaker = "unk"
# そう言って手で払いのけるように、ザタナーンは凄まじい衝撃波を放つ。
line = "そう言って手で払いのけるように、ザタナーンは凄まじい衝撃波を放つ。"

[[dialogue]]
speaker = "聖沙"
# 「きゃああぁっ！？」
line = "「きゃああぁっ！？」"

[[dialogue]]
speaker = "unk"
# 吹き飛ばされた聖沙を、リア先輩が受け止める。
line = "吹き飛ばされた聖沙を、リア先輩が受け止める。"

[[dialogue]]
speaker = "リア"
# 「聖沙ちゃん！　大丈夫！？」
line = "「聖沙ちゃん！　大丈夫！？」"

[[dialogue]]
speaker = "聖沙"
# 「リア先輩、ありがとうございます……！」
line = "「リア先輩、ありがとうございます……！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「マズいわね……根本的な出力の差が圧倒的すぎる……！」
line = "「マズいわね……根本的な出力の差が圧倒的すぎる……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「ああ、私の魂も危険を囁き続けている。気を抜けば、一瞬で全滅しかねないと……！」
line = "「ああ、私の魂も危険を囁き続けている。気を抜けば、一瞬で全滅しかねないと……！」"

[[dialogue]]
speaker = "ザタナーン"
# 「当然だ。リ・クリエの力は、神でも制御できぬ力」
line = "「当然だ。リ・クリエの力は、神でも制御できぬ力」"

[[dialogue]]
speaker = "ザタナーン"
# 「魔王の力がなければ、敵うはずもない」
line = "「魔王の力がなければ、敵うはずもない」"

[[dialogue]]
speaker = "unk"
# 俺が戦うことができれば……！
line = "俺が戦うことができれば……！"

[[dialogue]]
speaker = "ルネア"
# 「ダメよ、会長！　力が使えない状態で、リ・クリエの力を受けたら、一瞬で消し飛ばされてしまうわ！」
line = "「ダメよ、会長！　力が使えない状態で、リ・クリエの力を受けたら、一瞬で消し飛ばされてしまうわ！」"

[[dialogue]]
speaker = "パッキー"
# 「リ・クリエの力を前に、魔王様が未だ戦えないこの状況、いよいよマズいぜ……！」
line = "「リ・クリエの力を前に、魔王様が未だ戦えないこの状況、いよいよマズいぜ……！」"

[[dialogue]]
speaker = "ザタナーン"
# 「貴様たちの力は、我が脅威とはならないと判断した。故に……そろそろ終わらせよう」
line = "「貴様たちの力は、我が脅威とはならないと判断した。故に……そろそろ終わらせよう」"

[[dialogue]]
speaker = "ザタナーン"
# 「――女神に再生を」
line = "「――女神に再生を」"

[[dialogue]]
speaker = "unk"
# 次の瞬間、ルネアの足元に黒い影が広がる。
line = "次の瞬間、ルネアの足元に黒い影が広がる。"

[[dialogue]]
speaker = "ルネア"
# 「！　足が影から離れない……！」
line = "「！　足が影から離れない……！」"

[[dialogue]]
speaker = "パッキー"
# 「やべぇ！　全員、ルネアを守れっ！」
line = "「やべぇ！　全員、ルネアを守れっ！」"

[[dialogue]]
speaker = "マトイ（覚醒）"
# 「させない！　ディバイドシールド！」
line = "「させない！　ディバイドシールド！」"

[[dialogue]]
speaker = "ロロット"
# 「全力バリアーなのです！」
line = "「全力バリアーなのです！」"

[[dialogue]]
speaker = "unk"
# マトイとロロットがルネアの前に何重にも、防御壁を展開する。
line = "マトイとロロットがルネアの前に何重にも、防御壁を展開する。"

[[dialogue]]
speaker = "ザタナーン"
# 「その強度は既に見極めている」
line = "「その強度は既に見極めている」"

[[dialogue]]
speaker = "ザタナーン"
# 「――無意味だ」
line = "「――無意味だ」"

[[dialogue]]
speaker = "unk"
# ザタナーンがリ・クリエの力を収束させた強大な閃光を撃ち放つ。
line = "ザタナーンがリ・クリエの力を収束させた強大な閃光を撃ち放つ。"

[[dialogue]]
speaker = "ナナカ"
# 「一瞬で盾もバリアーも、全部消し飛ばされて……！？」
line = "「一瞬で盾もバリアーも、全部消し飛ばされて……！？」"

[[dialogue]]
speaker = "リア"
# 「ルネアちゃん、避けて！」
line = "「ルネアちゃん、避けて！」"

[[dialogue]]
speaker = "ルネア"
# 「くっ……！」
line = "「くっ……！」"

[[dialogue]]
speaker = "unk"
# ルネアが霊力を最大にして、防御フィールドを展開。そこへザタナーンの放った閃光が衝突する。
line = "ルネアが霊力を最大にして、防御フィールドを展開。そこへザタナーンの放った閃光が衝突する。"

[[dialogue]]
speaker = "unk"
# うあっ――！？
line = "うあっ――！？"

[[dialogue]]
speaker = "unk"
# 爆風のような衝撃波が辺りに広がり、俺は吹き飛ばされて砂浜を転がる。
line = "爆風のような衝撃波が辺りに広がり、俺は吹き飛ばされて砂浜を転がる。"

[[dialogue]]
speaker = "ルネア"
# 「ふ、防ぎきれない……！」
line = "「ふ、防ぎきれない……！」"

[[dialogue]]
speaker = "unk"
# わずか数秒で、ルネアの防御フィールドに亀裂が走る。
line = "わずか数秒で、ルネアの防御フィールドに亀裂が走る。"

[[dialogue]]
speaker = "聖沙"
# 「っ……諦めない！」
line = "「っ……諦めない！」"

[[dialogue]]
speaker = "聖沙"
# 「ザタナーン！　ルネアさんに攻撃するのをやめなさい！　――はああぁっ！」
line = "「ザタナーン！　ルネアさんに攻撃するのをやめなさい！　――はああぁっ！」"

[[dialogue]]
speaker = "ヘレナ"
# 「聖沙、助太刀するぞ！　ふっ――！」
line = "「聖沙、助太刀するぞ！　ふっ――！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ザタナーン！　こっちよ！」
line = "「ザタナーン！　こっちよ！」"

[[dialogue]]
speaker = "unk"
# ザタナーンの背後に回り、３人が攻撃を仕掛ける。
line = "ザタナーンの背後に回り、３人が攻撃を仕掛ける。"

[[dialogue]]
speaker = "ザタナーン"
# 「通らぬ。もはや貴様らでは止められぬ」
line = "「通らぬ。もはや貴様らでは止められぬ」"

[[dialogue]]
speaker = "unk"
# しかし、ザタナーンは微動だにせず、リ・クリエの防御フィールドの前に、攻撃はかき消されてしまう。
line = "しかし、ザタナーンは微動だにせず、リ・クリエの防御フィールドの前に、攻撃はかき消されてしまう。"

[[dialogue]]
speaker = "ザタナーン"
# 「終わりだ、女神よ」
line = "「終わりだ、女神よ」"

[[dialogue]]
speaker = "リア"
# 「ダメ！　ルネアちゃんを消さないで！」
line = "「ダメ！　ルネアちゃんを消さないで！」"

[[dialogue]]
speaker = "聖沙"
# 「やめて！　やめなさいよ！」
line = "「やめて！　やめなさいよ！」"

[[dialogue]]
speaker = "ナナカ"
# 「ルネアーーっ！！　逃げてぇーーーっ！！！」
line = "「ルネアーーっ！！　逃げてぇーーーっ！！！」"

[[dialogue]]
speaker = "ロロット"
# 「お願いですっ！　誰か！　ルネアさんをっ！！」
line = "「お願いですっ！　誰か！　ルネアさんをっ！！」"

[[dialogue]]
speaker = "unk"
# みんなが必死に叫んでいる、その中で。
line = "みんなが必死に叫んでいる、その中で。"

[[dialogue]]
speaker = "unk"
# 俺は地面に着いた手で、砂を握り締めながら、立ち上がる。
line = "俺は地面に着いた手で、砂を握り締めながら、立ち上がる。"

[[dialogue]]
speaker = "パッキー"
# 「おい、魔王様、何を……！？」
line = "「おい、魔王様、何を……！？」"

[[dialogue]]
speaker = "ルネア"
# 「ダメ！　会長、こっちに来ちゃ……！」
line = "「ダメ！　会長、こっちに来ちゃ……！」"

[[dialogue]]
speaker = "unk"
# 大丈夫、俺は――
line = "大丈夫、俺は――"

[[dialogue]]
speaker = "unk"
# 俺はルネアの方へと、迷わずに全力で走り出す。
line = "俺はルネアの方へと、迷わずに全力で走り出す。"

[[dialogue]]
speaker = "unk"
# 俺たちは――
line = "俺たちは――"

[[dialogue]]
speaker = "unk"
# 体の内側から上がる、その『声』を信じて。
line = "体の内側から上がる、その『声』を信じて。"

[[dialogue]]
speaker = "unk"
# 『魔王』だ！！
line = "『魔王』だ！！"

[[dialogue]]
speaker = "unk"
# 心を合わせて、告げる。
line = "心を合わせて、告げる。"

[[dialogue]]
speaker = "unk"
# 主を導くは――
line = "主を導くは――"

[[dialogue]]
speaker = "聖沙"
# 「この力は……！」
line = "「この力は……！」"

[[dialogue]]
speaker = "ロロット"
# 「知っているのです！」
line = "「知っているのです！」"

[[dialogue]]
speaker = "unk"
# 古の盟約によりて降り立つ漆黒の天使
line = "古の盟約によりて降り立つ漆黒の天使"

[[dialogue]]
speaker = "リア"
# 「うん。包み込むように温かくて、キラキラとした――」
line = "「うん。包み込むように温かくて、キラキラとした――」"

[[dialogue]]
speaker = "ナナカ"
# 「シンの……！」
line = "「シンの……！」"

[[dialogue]]
speaker = "unk"
# ――アヴァンシェル！！！
line = "――アヴァンシェル！！！"

[[dialogue]]
speaker = "unk"
# その瞬間、俺の体の中から力が湧き上がり、輝きとなって一気に広がる。
line = "その瞬間、俺の体の中から力が湧き上がり、輝きとなって一気に広がる。"

[[dialogue]]
speaker = "ザタナーン"
# 「何……！？」
line = "「何……！？」"

[[dialogue]]
speaker = "unk"
# その輝きはルネアを守り、ザタナーンの攻撃を吹き飛ばした。
line = "その輝きはルネアを守り、ザタナーンの攻撃を吹き飛ばした。"

[[dialogue]]
speaker = "マトイ（覚醒）"
# 「会長……その戦闘服は……！？」
line = "「会長……その戦闘服は……！？」"

[[dialogue]]
speaker = "ヘレナ"
# 「白い髪に、赤い瞳……目覚めたか……！」
line = "「白い髪に、赤い瞳……目覚めたか……！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「シンちゃんと同じ、黒い戦闘服……！」
line = "「シンちゃんと同じ、黒い戦闘服……！」"

[[dialogue]]
speaker = "ルネア"
# 「武器も、シンと同じ杖……！」
line = "「武器も、シンと同じ杖……！」"

[[dialogue]]
speaker = "unk"
# ――みんな、遅くなってごめん
line = "――みんな、遅くなってごめん"

[[dialogue]]
speaker = "ナナカ"
# 「……！」
line = "「……！」"

[[dialogue]]
speaker = "unk"
# 一瞬、ナナカは驚いたように目を丸くしてから、ふっと笑顔を浮かべて。
line = "一瞬、ナナカは驚いたように目を丸くしてから、ふっと笑顔を浮かべて。"

[[dialogue]]
speaker = "ナナカ"
# 「ははっ♪　遅刻し過ぎでしょ、全く！」
line = "「ははっ♪　遅刻し過ぎでしょ、全く！」"

[[dialogue]]
speaker = "聖沙"
# 「……もうっ！　遅いわよ！　間一髪だったじゃない！」
line = "「……もうっ！　遅いわよ！　間一髪だったじゃない！」"

[[dialogue]]
speaker = "リア"
# 「ふふっ♪　だけど、やっぱり魔王様だね♪　こうしてちゃんと駆け付けてくれた」
line = "「ふふっ♪　だけど、やっぱり魔王様だね♪　こうしてちゃんと駆け付けてくれた」"

[[dialogue]]
speaker = "ロロット"
# 「えへへっ♪　会長さんが一緒なら、一騎当千確実なのですよ！」
line = "「えへへっ♪　会長さんが一緒なら、一騎当千確実なのですよ！」"

[[dialogue]]
speaker = "ザタナーン"
# 「魔王……やはり、リ・クリエの抑止力として、立ちはだかるか……！」
line = "「魔王……やはり、リ・クリエの抑止力として、立ちはだかるか……！」"

[[dialogue]]
speaker = "パッキー"
# 「そうだぜ、ザタナーン」
line = "「そうだぜ、ザタナーン」"

[[dialogue]]
speaker = "パッキー"
# 「魔王様は――これまで１度だって、リ・クリエを許したことはないんだからな！」
line = "「魔王様は――これまで１度だって、リ・クリエを許したことはないんだからな！」"

[[dialogue]]
speaker = "unk"
# 一緒に行くよ、みんな！
line = "一緒に行くよ、みんな！"

[[dialogue]]
speaker = "ロロット"
# 「はい♪　なら、アレをやりましょ～！」
line = "「はい♪　なら、アレをやりましょ～！」"

[[dialogue]]
speaker = "リア"
# 「ふふっ♪　そうだね、決めちゃおう！」
line = "「ふふっ♪　そうだね、決めちゃおう！」"

[[dialogue]]
speaker = "ナナカ"
# 「よっしゃ♪　気合入れ直しで、やりますか！」
line = "「よっしゃ♪　気合入れ直しで、やりますか！」"

[[dialogue]]
speaker = "聖沙"
# 「仕方ないわね……やってあげるわ！」
line = "「仕方ないわね……やってあげるわ！」"

[[dialogue]]
speaker = "ロロット"
# 「生徒会書記、ロロット・ローゼンクロイツ！」
line = "「生徒会書記、ロロット・ローゼンクロイツ！」"

[[dialogue]]
speaker = "ナナカ"
# 「生徒会会計、夕霧ナナカ！」
line = "「生徒会会計、夕霧ナナカ！」"

[[dialogue]]
speaker = "聖沙"
# 「生徒会<size=20>副</size>会長、聖沙・<ruby=ブリジッタ>Ｂ</ruby>・クリステレス！」
line = "「生徒会<size=20>副</size>会長、聖沙・<ruby>Ｂ<rt>ブリジッタ</rt></ruby>・クリステレス！」"

[[dialogue]]
speaker = "リア"
# 「生徒会相談役、九浄リア！」
line = "「生徒会相談役、九浄リア！」"

[[dialogue]]
speaker = "unk"
# そして、会長として自分も名乗ってから、全員で声を合わせる。
line = "そして、会長として自分も名乗ってから、全員で声を合わせる。"

[[dialogue]]
speaker = "５人"
# 「キラキラの学園生活は、流星クルセイダースにガッチリお任せ！」
line = "「キラキラの学園生活は、流星クルセイダースにガッチリお任せ！」"

[[dialogue]]
speaker = "unk"
# こうして、復活した魔王の力と共に、流星クルセイダースはザタナーンへ再び勝負を挑むのだった。
line = "こうして、復活した魔王の力と共に、流星クルセイダースはザタナーンへ再び勝負を挑むのだった。"
