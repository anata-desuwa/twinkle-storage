[[dialogue]]
speaker = "unk"
# 俺たちがバーベキューをしていたところへ突如出現した、謎の魔族たち。
line = "俺たちがバーベキューをしていたところへ突如出現した、謎の魔族たち。"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースの４人が新たな『水着フォーム』で次々とダウンさせていく――が、しかし。
line = "流星クルセイダースの４人が新たな『水着フォーム』で次々とダウンさせていく――が、しかし。"

[[dialogue]]
speaker = "ナナカ"
# 「水着フォームの方は絶好調って感じだけど……これ、いくらなんでも数が多すぎない！？」
line = "「水着フォームの方は絶好調って感じだけど……これ、いくらなんでも数が多すぎない！？」"

[[dialogue]]
speaker = "魔族たち"
# 「イ～～～！！」
line = "「イ～～～！！」"

[[dialogue]]
speaker = "ロロット"
# 「しかも、どんどん増え続けているのですよ～！」
line = "「しかも、どんどん増え続けているのですよ～！」"

[[dialogue]]
speaker = "聖沙"
# 「だからって、諦めて手を止めたら、そこで負けよ！」
line = "「だからって、諦めて手を止めたら、そこで負けよ！」"

[[dialogue]]
speaker = "リア"
# 「ルネアちゃん、大丈夫！？」
line = "「ルネアちゃん、大丈夫！？」"

[[dialogue]]
speaker = "ルネア"
# 「くっ……エグザエルを置いてきたのは失敗だったわ……！」
line = "「くっ……エグザエルを置いてきたのは失敗だったわ……！」"

[[dialogue]]
speaker = "ルネア"
# 「魔族たちが襲撃してきた瞬間から、私の女神の力を抑え込む為の妨害術式が発動しているのを感じる……！」
line = "「魔族たちが襲撃してきた瞬間から、私の女神の力を抑え込む為の妨害術式が発動しているのを感じる……！」"

[[dialogue]]
speaker = "マトイ"
# 「それってやっぱり、誰かが私たちを狙ってるってこと……！？」
line = "「それってやっぱり、誰かが私たちを狙ってるってこと……！？」"

[[dialogue]]
speaker = "ヘレナ"
# 「マトイ、この場はクルセイダースとお前に任せていいか？」
line = "「マトイ、この場はクルセイダースとお前に任せていいか？」"

[[dialogue]]
speaker = "ヘレナ"
# 「私は魔王たちを守りに行く！」
line = "「私は魔王たちを守りに行く！」"

[[dialogue]]
speaker = "unk"
# 俺とヘレナさんとパッキーは、力が使えない為、後退しつつ戦っていた。
line = "俺とヘレナさんとパッキーは、力が使えない為、後退しつつ戦っていた。"

[[dialogue]]
speaker = "魔族たち"
# 「イ～～～！！」
line = "「イ～～～！！」"

[[dialogue]]
speaker = "パッキー"
# 「こいつら、次から次へと、キリがねぇぜ……！」
line = "「こいつら、次から次へと、キリがねぇぜ……！」"

[[dialogue]]
speaker = "unk"
# しかし、魔族は足元の影から次々と湧いて来て、俺たちのことも狙ってくる。
line = "しかし、魔族は足元の影から次々と湧いて来て、俺たちのことも狙ってくる。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「魔王ちゃん、さすが鍛えてるわね！」
line = "「魔王ちゃん、さすが鍛えてるわね！」"

[[dialogue]]
speaker = "unk"
# ヘレナさん、後ろです！
line = "ヘレナさん、後ろです！"

[[dialogue]]
speaker = "魔族"
# 「イ～！」
line = "「イ～！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「おっと、危ない！」
line = "「おっと、危ない！」"

[[dialogue]]
speaker = "unk"
# ヘレナさんは素早く身を交わして、『手刀』で魔族にカウンターをくらわせる。
line = "ヘレナさんは素早く身を交わして、『手刀』で魔族にカウンターをくらわせる。"

[[dialogue]]
speaker = "魔族"
# 「イ～～！？」
line = "「イ～～！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「う～ん、やっぱり霊力なしじゃ、大したダメージにはならないわね……」
line = "「う～ん、やっぱり霊力なしじゃ、大したダメージにはならないわね……」"

[[dialogue]]
speaker = "unk"
# でも、すごい身のこなしですよ
line = "でも、すごい身のこなしですよ"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ありがと♪　これでも私、元クルセイダースだからね」
line = "「ありがと♪　これでも私、元クルセイダースだからね」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「リアにルミエルのロザリオを引き継ぐまでは、私が魔族と戦ってたのよ」
line = "「リアにルミエルのロザリオを引き継ぐまでは、私が魔族と戦ってたのよ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「だけど、こういうリア達もピンチな状況になると、やっぱりもどかしく感じちゃうわよね……」
line = "「だけど、こういうリア達もピンチな状況になると、やっぱりもどかしく感じちゃうわよね……」"

[[dialogue]]
speaker = "ヘレナ"
# 「力を望むならば、方法はあるぞ。もう１人の私よ」
line = "「力を望むならば、方法はあるぞ。もう１人の私よ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ヘレナちゃん！」
line = "「ヘレナちゃん！」"

[[dialogue]]
speaker = "unk"
# 近くの魔族たちを、二刀流の斬撃で蹴散らしながら駆け付けたヘレナちゃんが言う。
line = "近くの魔族たちを、二刀流の斬撃で蹴散らしながら駆け付けたヘレナちゃんが言う。"

[[dialogue]]
speaker = "ヘレナ"
# 「私はそなたの鏡映し。ならば、私にできて、そなたが力を使えないはずがない」
line = "「私はそなたの鏡映し。ならば、私にできて、そなたが力を使えないはずがない」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「！　それって、まさか……」
line = "「！　それって、まさか……」"

[[dialogue]]
speaker = "ヘレナ"
# 「ヘレナよ、お前が望むのなら――」
line = "「ヘレナよ、お前が望むのなら――」"

[[dialogue]]
speaker = "ヘレナ"
# 「私と同じ『守護星』が、きっと加護を与えるはずだ」
line = "「私と同じ『守護星』が、きっと加護を与えるはずだ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「守護星が、私に……？」
line = "「守護星が、私に……？」"

[[dialogue]]
speaker = "unk"
# と、その時だった。
line = "と、その時だった。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「これは……空から――星の力が、私の中に流れ込んで来るのを感じる……！」
line = "「これは……空から――星の力が、私の中に流れ込んで来るのを感じる……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「さあ、もう１人の私よ。己が魂の囁くままに！」
line = "「さあ、もう１人の私よ。己が魂の囁くままに！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「すぅ……」
line = "「すぅ……」"

[[dialogue]]
speaker = "unk"
# ヘレナさんは目を瞑り……そして。
line = "ヘレナさんは目を瞑り……そして。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――主を照らすは、十字架の鏡に映りし九浄の守護星、デネブ・アルゲディ！」
line = "「――主を照らすは、十字架の鏡に映りし九浄の守護星、デネブ・アルゲディ！」"

[[dialogue]]
speaker = "unk"
# 次の瞬間、桜吹雪のように、疾風がビーチを駆け抜けた。
line = "次の瞬間、桜吹雪のように、疾風がビーチを駆け抜けた。"

[[dialogue]]
speaker = "魔族たち"
# 「イ～～！？」
line = "「イ～～！？」"

[[dialogue]]
speaker = "unk"
# クルセイダースの近くにいた魔族たちが、一瞬で吹き飛ばされてノックアウトされてしまう。
line = "クルセイダースの近くにいた魔族たちが、一瞬で吹き飛ばされてノックアウトされてしまう。"

[[dialogue]]
speaker = "リア"
# 「えっ……何が……！？」
line = "「えっ……何が……！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 『ハッハー！　待たせたな、生徒会諸君！』
line = "『ハッハー！　待たせたな、生徒会諸君！』"

[[dialogue]]
speaker = "リア"
# 「お姉ちゃん……！？」
line = "「お姉ちゃん……！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――リア、私も参戦しに来たわよ♪」
line = "「――リア、私も参戦しに来たわよ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「流星学園理事長、九浄ヘレナ！　守護星の力を得て、流星クルセイダースに復帰するわ！」
line = "「流星学園理事長、九浄ヘレナ！　守護星の力を得て、流星クルセイダースに復帰するわ！」"

[[dialogue]]
speaker = "聖沙"
# 「守護星ってことは、まさかヘレナさんが星騎士に……！？」
line = "「守護星ってことは、まさかヘレナさんが星騎士に……！？」"

[[dialogue]]
speaker = "ナナカ"
# 「マジか……！」
line = "「マジか……！」"

[[dialogue]]
speaker = "ロロット"
# 「ビックリもも引きなのです！」
line = "「ビックリもも引きなのです！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「さ～て、久しぶりに大暴れするわよ～！」
line = "「さ～て、久しぶりに大暴れするわよ～！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――はああぁっ！」
line = "「――はああぁっ！」"

[[dialogue]]
speaker = "unk"
# 再びヘレナさんが疾風のように駆け抜け、二刀流で魔族たちを蹴散らしていく。
line = "再びヘレナさんが疾風のように駆け抜け、二刀流で魔族たちを蹴散らしていく。"

[[dialogue]]
speaker = "unk"
# その動きのキレは、魔族はもちろん、俺たちの目も追い切れないほど。
line = "その動きのキレは、魔族はもちろん、俺たちの目も追い切れないほど。"

[[dialogue]]
speaker = "ナナカ"
# 「す、すご……！」
line = "「す、すご……！」"

[[dialogue]]
speaker = "聖沙"
# 「これだけの数をものともしないなんて……！」
line = "「これだけの数をものともしないなんて……！」"

[[dialogue]]
speaker = "ロロット"
# 「ほぇ～」
line = "「ほぇ～」"

[[dialogue]]
speaker = "マトイ"
# 「あの剣捌き、普通じゃない……！」
line = "「あの剣捌き、普通じゃない……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「もう１人の私よ。手伝うぞ」
line = "「もう１人の私よ。手伝うぞ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「おっ、いいわね～♪　なら、ヘレナちゃん、合わせて行きましょうか！」
line = "「おっ、いいわね～♪　なら、ヘレナちゃん、合わせて行きましょうか！」"

[[dialogue]]
speaker = "ヘレナ"
# 「ああ。２つの魂を共鳴させよう――」
line = "「ああ。２つの魂を共鳴させよう――」"

[[dialogue]]
speaker = "unk"
# そして、２人は同時に告げる。
line = "そして、２人は同時に告げる。"

[[dialogue]]
speaker = "ダブルヘレナ"
# 「――ユニゾン！！」
line = "「――ユニゾン！！」"

[[dialogue]]
speaker = "ヘレナ"
# 「九浄ヘレナ、奥義！」
line = "「九浄ヘレナ、奥義！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「サムラ～イ！」
line = "「サムラ～イ！」"

[[dialogue]]
speaker = "ダブルヘレナ"
# 「――二千本桜！！！」
line = "「――二千本桜！！！」"

[[dialogue]]
speaker = "unk"
# ――果たして、星騎士へと覚醒したヘレナさんの力も加わり、俺たちは魔族の大群を倒し切ることができた。
line = "――果たして、星騎士へと覚醒したヘレナさんの力も加わり、俺たちは魔族の大群を倒し切ることができた。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふぅ……スッキリ♪　ひとまず、なんとかなったみたいね」
line = "「ふぅ……スッキリ♪　ひとまず、なんとかなったみたいね」"

[[dialogue]]
speaker = "リア"
# 「倒した魔族、影みたいに消えちゃったけど……何だったんだろう」
line = "「倒した魔族、影みたいに消えちゃったけど……何だったんだろう」"

[[dialogue]]
speaker = "ルネア"
# 「どうやら、本物の魔族ではなかったみたいね」
line = "「どうやら、本物の魔族ではなかったみたいね」"

[[dialogue]]
speaker = "ロロット"
# 「作られた偽物ってことですか？」
line = "「作られた偽物ってことですか？」"

[[dialogue]]
speaker = "ルネア"
# 「ええ。戦いながら分析していたけど……おそらく、あの魔族たちは――」
line = "「ええ。戦いながら分析していたけど……おそらく、あの魔族たちは――」"

[[dialogue]]
speaker = "ルネア"
# 「『リ・クリエ』の力で作り出されたものよ」
line = "「『リ・クリエ』の力で作り出されたものよ」"

[[dialogue]]
speaker = "unk"
# なっ……！？
line = "なっ……！？"

[[dialogue]]
speaker = "聖沙"
# 「リ・クリエですって……！？」
line = "「リ・クリエですって……！？」"

[[dialogue]]
speaker = "ナナカ"
# 「どういうこと……！？」
line = "「どういうこと……！？」"

[[dialogue]]
speaker = "unk"
# 『リ・クリエ』という言葉が突然飛び出してきて、俺たちは思わず驚いてしまうのだった。
line = "『リ・クリエ』という言葉が突然飛び出してきて、俺たちは思わず驚いてしまうのだった。"
