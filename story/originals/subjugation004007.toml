[[dialogue]]
speaker = "unk"
# 飾りを作り終えたベアトリスとナターシャは、パーティーのためのお菓子と料理を用意するため、カフェテリアへと向かう。
line = "飾りを作り終えたベアトリスとナターシャは、パーティーのためのお菓子と料理を用意するため、カフェテリアへと向かう。"

[[dialogue]]
speaker = "ナターシャ"
# 「おー、お化け、いなくなってるね。梨緒たち、いい仕事してる」
line = "「おー、お化け、いなくなってるね。梨緒たち、いい仕事してる」"

[[dialogue]]
speaker = "ベアトリス"
# 「あと……メルエルさんとはどうなったか、聞いてもいい？」
line = "「あと……メルエルさんとはどうなったか、聞いてもいい？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ん～……別にどうもなってないよ。好きになったりとかもしてないし」
line = "「ん～……別にどうもなってないよ。好きになったりとかもしてないし」"

[[dialogue]]
speaker = "ナターシャ"
# 「嫌いって言っても、まるで気にしてないんだよね。あのお気楽さは誰に似たんだろ」
line = "「嫌いって言っても、まるで気にしてないんだよね。あのお気楽さは誰に似たんだろ」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエルと付き合ってると、呆れることばかりでさ。開いた口が塞がらないよ」
line = "「メルエルと付き合ってると、呆れることばかりでさ。開いた口が塞がらないよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ふ～ん？」
line = "「ふ～ん？」"

[[dialogue]]
speaker = "ナターシャ"
# 「なに、ふ～んって。何か言いたそうだね」
line = "「なに、ふ～んって。何か言いたそうだね」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃん、嫌いな人のことを話す時って、苦虫を噛み潰したみたいにもっと嫌～な顔をするものだよ？」
line = "「ナターシャちゃん、嫌いな人のことを話す時って、苦虫を噛み潰したみたいにもっと嫌～な顔をするものだよ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「……してるでしょ。あと、しれっと気色悪いたとえを絡めてこないで」
line = "「……してるでしょ。あと、しれっと気色悪いたとえを絡めてこないで」"

[[dialogue]]
speaker = "ベアトリス"
# 「ごめんごめん、えへへ」
line = "「ごめんごめん、えへへ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ま、メルエルの護衛の任は解かれたから、せいせいしたよ」
line = "「ま、メルエルの護衛の任は解かれたから、せいせいしたよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「任務がなくなったっていうことは……ナターシャちゃん、天界に帰っちゃうのかニャ？」
line = "「任務がなくなったっていうことは……ナターシャちゃん、天界に帰っちゃうのかニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ううん。今後のことは保留で未定。もうしばらくはこっちにいる感じ」
line = "「ううん。今後のことは保留で未定。もうしばらくはこっちにいる感じ」"

[[dialogue]]
speaker = "ベアトリス"
# 「せっかく平和になったんだし、ナターシャちゃんも任務とか忘れてゆっくりすればいいよっ」
line = "「せっかく平和になったんだし、ナターシャちゃんも任務とか忘れてゆっくりすればいいよっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「だといいんだけど。平和になったらなったでいろいろ起きるんだよね。リガルタが死んだ影響で、天界で政争が起こるかもだし」
line = "「だといいんだけど。平和になったらなったでいろいろ起きるんだよね。リガルタが死んだ影響で、天界で政争が起こるかもだし」"

[[dialogue]]
speaker = "ナターシャ"
# 「そういう時は、私たちエージェントの出番かな」
line = "「そういう時は、私たちエージェントの出番かな」"

[[dialogue]]
speaker = "ベアトリス"
# 「そういうお仕事、嫌じゃないの？　怖くないのかニャ？」
line = "「そういうお仕事、嫌じゃないの？　怖くないのかニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「怖くはないけど、楽しくもないね。でもやらなきゃいけない。仕事だから」
line = "「怖くはないけど、楽しくもないね。でもやらなきゃいけない。仕事だから」"

[[dialogue]]
speaker = "ベアトリス"
# 「もし……もしもの話なんだけどっ！」
line = "「もし……もしもの話なんだけどっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「うん？」
line = "「うん？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃんが聖庭園の任務が嫌になって、逃げたくても行く場所がなかったら……デネブに来るっていうのはどうかニャ？」
line = "「ナターシャちゃんが聖庭園の任務が嫌になって、逃げたくても行く場所がなかったら……デネブに来るっていうのはどうかニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「……ベアトの世界に？」
line = "「……ベアトの世界に？」"

[[dialogue]]
speaker = "ベアトリス"
# 「そうっ！　こういう組織を抜ける時って、簡単にはいかニャいでしょ？　組織の追手につきまとわれたりするんじゃニャいの？」
line = "「そうっ！　こういう組織を抜ける時って、簡単にはいかニャいでしょ？　組織の追手につきまとわれたりするんじゃニャいの？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ま、そういうのを専門にしてるチームもいるね」
line = "「ま、そういうのを専門にしてるチームもいるね」"

[[dialogue]]
speaker = "ベアトリス"
# 「でもさすがに、世界を超えてまではなかなか追ってこれニャいでしょ」
line = "「でもさすがに、世界を超えてまではなかなか追ってこれニャいでしょ」"

[[dialogue]]
speaker = "ベアトリス"
# 「無理にとは言わニャいけどっ、ナターシャちゃんがデネブに来るなら歓迎するよ」
line = "「無理にとは言わニャいけどっ、ナターシャちゃんがデネブに来るなら歓迎するよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃんが選管のみんなを守ってくれてたみたいに、何かあっても私と極星のみんなでナターシャちゃんを守るから。ねっ！」
line = "「ナターシャちゃんが選管のみんなを守ってくれてたみたいに、何かあっても私と極星のみんなでナターシャちゃんを守るから。ねっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃん？」
line = "「ナターシャちゃん？」"

[[dialogue]]
speaker = "ナターシャ"
# 「いや、ベアトは人<ruby=たら>誑</ruby>しだな～と思って。私が女だったら好きになっちゃってるよ」
line = "「いや、ベアトは人<ruby>誑<rt>たら</rt></ruby>しだな～と思って。私が女だったら好きになっちゃってるよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃん、女の子だよねっ！？　え、っていうことは、つまり……！？」
line = "「ナターシャちゃん、女の子だよねっ！？　え、っていうことは、つまり……！？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナ、ナターシャちゃんのことは好きだけどっ！　そ、そういう好きとはちょっと違うかもだよ～っ！」
line = "「ナ、ナターシャちゃんのことは好きだけどっ！　そ、そういう好きとはちょっと違うかもだよ～っ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「なに顔真っ赤にしてんの。ふふ、ベアトはホント見てて退屈しないよね」
line = "「なに顔真っ赤にしてんの。ふふ、ベアトはホント見てて退屈しないよね」"

[[dialogue]]
speaker = "ベアトリス"
# 「またからかったのっ！？　冗談ばかり言ってたら、いつか信用してもらえなくニャっちゃうよっ！」
line = "「またからかったのっ！？　冗談ばかり言ってたら、いつか信用してもらえなくニャっちゃうよっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「それでも、ベアトは私を信じてくれるでしょ」
line = "「それでも、ベアトは私を信じてくれるでしょ」"

[[dialogue]]
speaker = "ベアトリス"
# 「そ、それは……うん」
line = "「そ、それは……うん」"

[[dialogue]]
speaker = "ナターシャ"
# 「世界を超えての逃避行、ね。そんな方法もあるんだ」
line = "「世界を超えての逃避行、ね。そんな方法もあるんだ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアトの気持ちはありがたく受け取っておく。いざという時の手段として考えとくね」
line = "「ベアトの気持ちはありがたく受け取っておく。いざという時の手段として考えとくね」"

[[dialogue]]
speaker = "ベアトリス"
# 「……うんっ！　いつでも言ってねっ！」
line = "「……うんっ！　いつでも言ってねっ！」"
