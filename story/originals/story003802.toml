[[dialogue]]
speaker = "unk"
# リゾート結界で、異世界の『流星クルセイダース』と再会した俺たち。
line = "リゾート結界で、異世界の『流星クルセイダース』と再会した俺たち。"

[[dialogue]]
speaker = "unk"
# 一体何が起きて世界が繋がったのか、ひとまず話し合うことになった。
line = "一体何が起きて世界が繋がったのか、ひとまず話し合うことになった。"

[[dialogue]]
speaker = "リア"
# 「――なるほど。マトイちゃんたちもちょうど、リゾート結界へ遊びに来てたところだったんだね」
line = "「――なるほど。マトイちゃんたちもちょうど、リゾート結界へ遊びに来てたところだったんだね」"

[[dialogue]]
speaker = "マトイ"
# 「はい。私と会長、それにヴィーナス、アナ、サーシャさんの新星星徒会メンバーと、ヘレナさんで来ていました」
line = "「はい。私と会長、それにヴィーナス、アナ、サーシャさんの新星星徒会メンバーと、ヘレナさんで来ていました」"

[[dialogue]]
speaker = "ヘレナ"
# 「今朝、『魂の囁き』が聞こえてな。皆でリゾート結界で休日を過ごさないかと、私が声をかけたのだ」
line = "「今朝、『魂の囁き』が聞こえてな。皆でリゾート結界で休日を過ごさないかと、私が声をかけたのだ」"

[[dialogue]]
speaker = "unk"
# そうしたら、突然空間の穴が開いて……
line = "そうしたら、突然空間の穴が開いて……"

[[dialogue]]
speaker = "ヘレナ"
# 「気づけば、マトイとここにいて……ヴィーナス、アナ、サーシャの姿はなかった」
line = "「気づけば、マトイとここにいて……ヴィーナス、アナ、サーシャの姿はなかった」"

[[dialogue]]
speaker = "ヘレナ"
# 「他に誰かいないか探していたところ、魔王と一緒にいるそなたたちを見つけた、というわけだ」
line = "「他に誰かいないか探していたところ、魔王と一緒にいるそなたたちを見つけた、というわけだ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「なるほどね～」
line = "「なるほどね～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「それで、ルネアちゃん。何が起こったのか、わかりそうかしら？」
line = "「それで、ルネアちゃん。何が起こったのか、わかりそうかしら？」"

[[dialogue]]
speaker = "ルネア"
# 「ええ。私の力で、少し結界内を調べてみたんだけど……」
line = "「ええ。私の力で、少し結界内を調べてみたんだけど……」"

[[dialogue]]
speaker = "ルネア"
# 「どうやら私たちは――このリゾート結界に閉じ込められてしまっているみたいね」
line = "「どうやら私たちは――このリゾート結界に閉じ込められてしまっているみたいね」"

[[dialogue]]
speaker = "聖沙"
# 「えっ！？　それって、外に出られないってこと……！？」
line = "「えっ！？　それって、外に出られないってこと……！？」"

[[dialogue]]
speaker = "ルネア"
# 「ええ。何が原因なのかは、まだわからないけれど……」
line = "「ええ。何が原因なのかは、まだわからないけれど……」"

[[dialogue]]
speaker = "ルネア"
# 「あと、ちょっと調べてわかったのは、このリゾート結界は、私が作ったものではなくて――」
line = "「あと、ちょっと調べてわかったのは、このリゾート結界は、私が作ったものではなくて――」"

[[dialogue]]
speaker = "ルネア"
# 「どうやら、<b>流星市国の方</b>にあるリゾート結界の『プライベートビーチ』みたいね」
line = "「どうやら、<b>流星市国の方</b>にあるリゾート結界の『プライベートビーチ』みたいね」"

[[dialogue]]
speaker = "ロロット"
# 「……？　どういうことなのです？」
line = "「……？　どういうことなのです？」"

[[dialogue]]
speaker = "リア"
# 「それって……会長くんたちが、私たちの世界へ飛ばされて来たんじゃなくて……」
line = "「それって……会長くんたちが、私たちの世界へ飛ばされて来たんじゃなくて……」"

[[dialogue]]
speaker = "聖沙"
# 「私たちの方が、あの空間の穴に吸い込まれて、異世界へ転移してきちゃった、ってこと……！？」
line = "「私たちの方が、あの空間の穴に吸い込まれて、異世界へ転移してきちゃった、ってこと……！？」"

[[dialogue]]
speaker = "ルネア"
# 「そうなるわね」
line = "「そうなるわね」"

[[dialogue]]
speaker = "ナナカ"
# 「それじゃあ、シンは１人だけ穴に吸い込まれずに、向こうの世界に残ってるってことなのかな……？」
line = "「それじゃあ、シンは１人だけ穴に吸い込まれずに、向こうの世界に残ってるってことなのかな……？」"

[[dialogue]]
speaker = "unk"
# なんとなくだけど、俺の中にいる気がする……
line = "なんとなくだけど、俺の中にいる気がする……"

[[dialogue]]
speaker = "unk"
# いや、それが……
line = "いや、それが……"

[[dialogue]]
speaker = "ナナカ"
# 「え？　それって、どういう……？」
line = "「え？　それって、どういう……？」"

[[dialogue]]
speaker = "ルネア"
# 「……！　本当だわ……！　会長の中に、確かにシンの気配を感じる……！」
line = "「……！　本当だわ……！　会長の中に、確かにシンの気配を感じる……！」"

[[dialogue]]
speaker = "ルネア"
# 「これは……会長とシンが、１つに『融合』した状態になってしまっているんだわ……！」
line = "「これは……会長とシンが、１つに『融合』した状態になってしまっているんだわ……！」"

[[dialogue]]
speaker = "マトイ"
# 「えぇっ！？　融合って、そんなことあるの……！？」
line = "「えぇっ！？　融合って、そんなことあるの……！？」"

[[dialogue]]
speaker = "ルネア"
# 「私も信じられないけど……事実よ」
line = "「私も信じられないけど……事実よ」"

[[dialogue]]
speaker = "パッキー"
# 「おいおい、マジかよ……！」
line = "「おいおい、マジかよ……！」"

[[dialogue]]
speaker = "ロロット"
# 「つまり、２人の会長さんが『超会長』さんにフュージョンして、パワーアップ魔王さんになったということですか！？」
line = "「つまり、２人の会長さんが『超会長』さんにフュージョンして、パワーアップ魔王さんになったということですか！？」"

[[dialogue]]
speaker = "聖沙"
# 「そ、それって……咲良クンは大丈夫なの……！？」
line = "「そ、それって……咲良クンは大丈夫なの……！？」"

[[dialogue]]
speaker = "ルネア"
# 「今のところ、会長の中でシンの『魂』が眠りについているような状態ね……」
line = "「今のところ、会長の中でシンの『魂』が眠りについているような状態ね……」"

[[dialogue]]
speaker = "リア"
# 「ルネアちゃんの力で、シンくんを目覚めさせて、２人を分離させることはできないのかな？」
line = "「ルネアちゃんの力で、シンくんを目覚めさせて、２人を分離させることはできないのかな？」"

[[dialogue]]
speaker = "ルネア"
# 「そうしたいのはやまやまだけど……このリゾート結界が、私たちの世界じゃなくて、異世界側にあるっていうのが問題ね」
line = "「そうしたいのはやまやまだけど……このリゾート結界が、私たちの世界じゃなくて、異世界側にあるっていうのが問題ね」"

[[dialogue]]
speaker = "マトイ"
# 「そういえば前に、ルネアさんが私たちの世界へ来た時、『力が制限される』って……」
line = "「そういえば前に、ルネアさんが私たちの世界へ来た時、『力が制限される』って……」"

[[dialogue]]
speaker = "ルネア"
# 「そう。ここは私が管理する世界じゃないから、好き勝手には力を振るえないのよ」
line = "「そう。ここは私が管理する世界じゃないから、好き勝手には力を振るえないのよ」"

[[dialogue]]
speaker = "unk"
# あと、俺も今は『力』が使えないみたいだ
line = "あと、俺も今は『力』が使えないみたいだ"

[[dialogue]]
speaker = "unk"
# 先程目を覚ました時から、俺は『魔王の力』を始めとした、あらゆる能力が使えなくなっていた。
line = "先程目を覚ました時から、俺は『魔王の力』を始めとした、あらゆる能力が使えなくなっていた。"

[[dialogue]]
speaker = "ルネア"
# 「――会長とシンの２人の間には、流れる時間に『捻じれ』があるのよ」
line = "「――会長とシンの２人の間には、流れる時間に『捻じれ』があるのよ」"

[[dialogue]]
speaker = "ルネア"
# 「おそらく、２人が同時に存在することに問題が起きて、１つの存在へ融合してしまっているんだと思うわ」
line = "「おそらく、２人が同時に存在することに問題が起きて、１つの存在へ融合してしまっているんだと思うわ」"

[[dialogue]]
speaker = "リア"
# 「それじゃあ、シンくんを元に戻すには……？」
line = "「それじゃあ、シンくんを元に戻すには……？」"

[[dialogue]]
speaker = "ルネア"
# 「このリゾート結界に閉じ込められている原因を解決して、私たちの世界に戻るのが、一番早いでしょうね」
line = "「このリゾート結界に閉じ込められている原因を解決して、私たちの世界に戻るのが、一番早いでしょうね」"

[[dialogue]]
speaker = "ナナカ"
# 「シン……大丈夫かな……」
line = "「シン……大丈夫かな……」"

[[dialogue]]
speaker = "ロロット"
# 「会長さんがこんなふうになってしまうのは、初めてなのです……」
line = "「会長さんがこんなふうになってしまうのは、初めてなのです……」"

[[dialogue]]
speaker = "聖沙"
# 「咲良クン……」
line = "「咲良クン……」"

[[dialogue]]
speaker = "unk"
# みんな、シンのことが心配なんだろう。不安そうな表情を浮かべていた。
line = "みんな、シンのことが心配なんだろう。不安そうな表情を浮かべていた。"

[[dialogue]]
speaker = "リア"
# 「……でも、暗いままで過ごしてたら、ダメだよね」
line = "「……でも、暗いままで過ごしてたら、ダメだよね」"

[[dialogue]]
speaker = "聖沙"
# 「リア先輩……？」
line = "「リア先輩……？」"

[[dialogue]]
speaker = "リア"
# 「私たちがもし暗くなってたら、シンくんならきっと、こう言うはず――」
line = "「私たちがもし暗くなってたら、シンくんならきっと、こう言うはず――」"

[[dialogue]]
speaker = "リア"
# 「『もっと前向きに考えて行こうよ』って」
line = "「『もっと前向きに考えて行こうよ』って」"

[[dialogue]]
speaker = "聖沙"
# 「……！　そうですね。先輩の言う通り、咲良クンなら、ポジティブに解決方法を考えるはず」
line = "「……！　そうですね。先輩の言う通り、咲良クンなら、ポジティブに解決方法を考えるはず」"

[[dialogue]]
speaker = "ナナカ"
# 「確かに、そうだね……シンなら大丈夫だって信じて、あたしたちで頑張らなきゃ！」
line = "「確かに、そうだね……シンなら大丈夫だって信じて、あたしたちで頑張らなきゃ！」"

[[dialogue]]
speaker = "ロロット"
# 「はい！　私たちが明るい気持ちで信じていれば、会長さんはきっと何事もなかったように目覚めるはずなのです！」
line = "「はい！　私たちが明るい気持ちで信じていれば、会長さんはきっと何事もなかったように目覚めるはずなのです！」"

[[dialogue]]
speaker = "ルネア"
# 「ええ。シンならきっと大丈夫……だって、私を救ってくれた『魔王』なんだから！」
line = "「ええ。シンならきっと大丈夫……だって、私を救ってくれた『魔王』なんだから！」"

[[dialogue]]
speaker = "ルネア"
# 「私も、早く元の世界へ戻れるように原因を調べてみるわ」
line = "「私も、早く元の世界へ戻れるように原因を調べてみるわ」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふふっ……これがそなたたちの世界で『リ・クリエ』を止め、世界を救ってみせたクルセイダースか」
line = "「ふふっ……これがそなたたちの世界で『リ・クリエ』を止め、世界を救ってみせたクルセイダースか」"

[[dialogue]]
speaker = "ヘレナ"
# 「実に明るく、心の強き者たちであるな」
line = "「実に明るく、心の強き者たちであるな」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ええ。自慢の子たちよ♪」
line = "「ええ。自慢の子たちよ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「シンちゃんが引っ張れない状況でも、『希望』を信じて諦めたりしない」
line = "「シンちゃんが引っ張れない状況でも、『希望』を信じて諦めたりしない」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「みんな、成長してるわね♪」
line = "「みんな、成長してるわね♪」"

[[dialogue]]
speaker = "unk"
# 俺たちも、もちろん手伝います
line = "俺たちも、もちろん手伝います"

[[dialogue]]
speaker = "マトイ"
# 「世界は違っても、私たちは仲間だもんね！」
line = "「世界は違っても、私たちは仲間だもんね！」"

[[dialogue]]
speaker = "リア"
# 「２人とも、ありがとう♪　前みたいに協力すれば、今回もきっと大丈夫だよ！」
line = "「２人とも、ありがとう♪　前みたいに協力すれば、今回もきっと大丈夫だよ！」"

[[dialogue]]
speaker = "聖沙"
# 「<size=20>副</size>会長として、私が咲良クンの代わりに、みんなを引っ張るわ♪」
line = "「<size=20>副</size>会長として、私が咲良クンの代わりに、みんなを引っ張るわ♪」"

[[dialogue]]
speaker = "ナナカ"
# 「よ～し！　ナナカちゃんも、シンの分まで元気に明るく行くよ～！」
line = "「よ～し！　ナナカちゃんも、シンの分まで元気に明るく行くよ～！」"

[[dialogue]]
speaker = "ロロット"
# 「流星クルセイダース＆スターナイツ、ふぁいおー、なのです♪」
line = "「流星クルセイダース＆スターナイツ、ふぁいおー、なのです♪」"

[[dialogue]]
speaker = "みんな"
# 「お～っ♪」
line = "「お～っ♪」"

[[dialogue]]
speaker = "unk"
# 俺たちはリゾート結界から脱出する為、協力して行動を開始するのだった。
line = "俺たちはリゾート結界から脱出する為、協力して行動を開始するのだった。"
