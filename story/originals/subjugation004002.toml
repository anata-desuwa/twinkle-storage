[[dialogue]]
speaker = "unk"
# ベアトリスとナターシャが変身を遂げた後、ジャクリーヌはもらったお菓子を持っていつの間にか去っていた。
line = "ベアトリスとナターシャが変身を遂げた後、ジャクリーヌはもらったお菓子を持っていつの間にか去っていた。"

[[dialogue]]
speaker = "ベアトリス"
# 「私のこの衣装は、黒猫……ニャン？　梨緒ちゃんのぶちゃ猫の影響かニャ？」
line = "「私のこの衣装は、黒猫……ニャン？　梨緒ちゃんのぶちゃ猫の影響かニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「吸血鬼の羽も生えたままだし、吸血鬼の使い魔って感じかな？」
line = "「吸血鬼の羽も生えたままだし、吸血鬼の使い魔って感じかな？」"

[[dialogue]]
speaker = "ベアトリス"
# 「私、本物の吸血鬼なんだけどニャー？」
line = "「私、本物の吸血鬼なんだけどニャー？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ちなみにその語尾は？」
line = "「ちなみにその語尾は？」"

[[dialogue]]
speaker = "ベアトリス"
# 「戦闘服のせいか、勝手に出ちゃうんニャ！」
line = "「戦闘服のせいか、勝手に出ちゃうんニャ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「で、ナターシャちゃんのそれは……？」
line = "「で、ナターシャちゃんのそれは……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアトに引っ張られて吸血鬼になっちゃったみたい。マントもあるし、吸血鬼の貴族って感じ？」
line = "「ベアトに引っ張られて吸血鬼になっちゃったみたい。マントもあるし、吸血鬼の貴族って感じ？」"

[[dialogue]]
speaker = "ベアトリス"
# 「じゃあ今の私は、ナターシャちゃんの使い魔なのかニャ？」
line = "「じゃあ今の私は、ナターシャちゃんの使い魔なのかニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「いいね。かわいがってあげるよ、ベアトニャン」
line = "「いいね。かわいがってあげるよ、ベアトニャン」"

[[dialogue]]
speaker = "ベアトリス"
# 「えへへ～、ご主人様～♪」
line = "「えへへ～、ご主人様～♪」"

[[dialogue]]
speaker = "unk"
# ナターシャに顎を撫でられ、ベアトリスが機嫌良さそうな声を出す。
line = "ナターシャに顎を撫でられ、ベアトリスが機嫌良さそうな声を出す。"

[[dialogue]]
speaker = "ベアトリス"
# 「でも……でも～……うーん……」
line = "「でも……でも～……うーん……」"

[[dialogue]]
speaker = "ナターシャ"
# 「なに、人の胸元じろじろ見たりして。見られるのは慣れてるけど、そうも露骨だとさすがに気になるかな」
line = "「なに、人の胸元じろじろ見たりして。見られるのは慣れてるけど、そうも露骨だとさすがに気になるかな」"

[[dialogue]]
speaker = "ベアトリス"
# 「その衣装……確かに吸血鬼っぽいけど……なんていうか……エッチすぎないかニャ」
line = "「その衣装……確かに吸血鬼っぽいけど……なんていうか……エッチすぎないかニャ」"

[[dialogue]]
speaker = "ナターシャ"
# 「吸血鬼ってそういうものじゃない？　普段のベアトの戦闘服もなかなか煽情的だと思うし」
line = "「吸血鬼ってそういうものじゃない？　普段のベアトの戦闘服もなかなか煽情的だと思うし」"

[[dialogue]]
speaker = "ベアトリス"
# 「私吸血鬼だけどエッチじゃないよ！？　そもそも吸血鬼はエッチじゃないからっ！」
line = "「私吸血鬼だけどエッチじゃないよ！？　そもそも吸血鬼はエッチじゃないからっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「そうかな～？　今のベアトの衣装も相当エッチだと思うけど」
line = "「そうかな～？　今のベアトの衣装も相当エッチだと思うけど」"

[[dialogue]]
speaker = "ベアトリス"
# 「やっぱりっ！？　露出度高い人に見慣れちゃってたからか、これくらいなら普通かなって思ってたけど……」
line = "「やっぱりっ！？　露出度高い人に見慣れちゃってたからか、これくらいなら普通かなって思ってたけど……」"

[[dialogue]]
speaker = "ナターシャ"
# 「わかる。ここにいると肌色面積の感覚が麻痺するよね」
line = "「わかる。ここにいると肌色面積の感覚が麻痺するよね」"

[[dialogue]]
speaker = "ベアトリス"
# 「でも、ナターシャちゃんは平気そうだね……？　恥ずかしがってるの私だけニャの……？」
line = "「でも、ナターシャちゃんは平気そうだね……？　恥ずかしがってるの私だけニャの……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「これでもエージェントだからね。ハニートラップだって仕掛けるし、この程度の露出でいちいち恥ずかしがってられないって」
line = "「これでもエージェントだからね。ハニートラップだって仕掛けるし、この程度の露出でいちいち恥ずかしがってられないって」"

[[dialogue]]
speaker = "ベアトリス"
# 「ひええ……ナターシャちゃんオトナすぎるニャ～……」
line = "「ひええ……ナターシャちゃんオトナすぎるニャ～……」"

[[dialogue]]
speaker = "ベアトリス"
# 「でも、これがジャクリーヌさんのハロウィンパワーなんだね。すごい……」
line = "「でも、これがジャクリーヌさんのハロウィンパワーなんだね。すごい……」"

[[dialogue]]
speaker = "ナターシャ"
# 「いつもいつもハロウィンの度に騒動を起こしてたとは聞いてたけど、噂通りだね」
line = "「いつもいつもハロウィンの度に騒動を起こしてたとは聞いてたけど、噂通りだね」"

[[dialogue]]
speaker = "ナターシャ"
# 「ま、これで仮装はＯＫ。ジャクリーヌに会った目的は果たせたんじゃない？」
line = "「ま、これで仮装はＯＫ。ジャクリーヌに会った目的は果たせたんじゃない？」"

[[dialogue]]
speaker = "ベアトリス"
# 「そうだね……こんなにハロウィンフォームがセクシーとは思わなかったけど……」
line = "「そうだね……こんなにハロウィンフォームがセクシーとは思わなかったけど……」"

[[dialogue]]
speaker = "ナターシャ"
# 「──ベアト、ストップ」
line = "「──ベアト、ストップ」"

[[dialogue]]
speaker = "ベアトリス"
# 「えっ、何！？　どこかはみ出しちゃってる！？」
line = "「えっ、何！？　どこかはみ出しちゃってる！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そうじゃなくて、怪しい気配を感じたよ。ひとつ、ふたつ、みっつ……ううん、それどころじゃない」
line = "「そうじゃなくて、怪しい気配を感じたよ。ひとつ、ふたつ、みっつ……ううん、それどころじゃない」"

[[dialogue]]
speaker = "ベアトリス"
# 「ニャッ！？　ナターシャちゃん、あそこ見て！　あんなにいっぱい！」
line = "「ニャッ！？　ナターシャちゃん、あそこ見て！　あんなにいっぱい！」"

[[dialogue]]
speaker = "ゴースト"
# 「キャッキャッ！　キャッキャッ！」
line = "「キャッキャッ！　キャッキャッ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「お化けの団体さん？　さっきまではあんなのいなかったよね？　あれだけの数、気づかないわけがないし」
line = "「お化けの団体さん？　さっきまではあんなのいなかったよね？　あれだけの数、気づかないわけがないし」"

[[dialogue]]
speaker = "ベアトリス"
# 「いつの間に出てきたのかな。石をひっくり返したら、わさわさ出てくるダンゴムシみたいだね」
line = "「いつの間に出てきたのかな。石をひっくり返したら、わさわさ出てくるダンゴムシみたいだね」"

[[dialogue]]
speaker = "ナターシャ"
# 「ひっ！？　なんでそんなたとえ出したの！？　私が虫嫌いなこと知ってるよね！？」
line = "「ひっ！？　なんでそんなたとえ出したの！？　私が虫嫌いなこと知ってるよね！？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ごめんニャさいっ、咄嗟にいいたとえが思いつかなくって……」
line = "「ごめんニャさいっ、咄嗟にいいたとえが思いつかなくって……」"

[[dialogue]]
speaker = "ナターシャ"
# 「そもそもたとえなくてよくない？　とりあえず、あのお化けたち対処しよっか」
line = "「そもそもたとえなくてよくない？　とりあえず、あのお化けたち対処しよっか」"
