[[dialogue]]
speaker = "unk"
# 第９話,『ハロウィンのあとに』,B
line = "第９話,『ハロウィンのあとに』,B"

[[dialogue]]
speaker = "unk"
# ライブの後も、ハロウィンパーティーは大盛況だった。
line = "ライブの後も、ハロウィンパーティーは大盛況だった。"

[[dialogue]]
speaker = "unk"
# デネブの人々は、久しぶりに開かれた大々的な饗宴を楽しみ、笑顔を浮かべ──
line = "デネブの人々は、久しぶりに開かれた大々的な饗宴を楽しみ、笑顔を浮かべ──"

[[dialogue]]
speaker = "unk"
# やがて、お祭り騒ぎの時間は終わりを迎えた。
line = "やがて、お祭り騒ぎの時間は終わりを迎えた。"

[[dialogue]]
speaker = "マグダレナ"
# 「ルヴィネ様、こちらの飾りの取り外しは終わりました」
line = "「ルヴィネ様、こちらの飾りの取り外しは終わりました」"

[[dialogue]]
speaker = "アルモタヘル"
# 「もぐもぐ……こちらも片付け終わったぞ」
line = "「もぐもぐ……こちらも片付け終わったぞ」"

[[dialogue]]
speaker = "マグダレナ"
# 「行儀が悪いですよ、アルモタヘル。お肉を食べながら喋らない」
line = "「行儀が悪いですよ、アルモタヘル。お肉を食べながら喋らない」"

[[dialogue]]
speaker = "アルモタヘル"
# 「ふぐぅ……」
line = "「ふぐぅ……」"

[[dialogue]]
speaker = "ルヴィネ"
# 「みんな、片付けまで手伝ってくれて、ありがとう」
line = "「みんな、片付けまで手伝ってくれて、ありがとう」"

[[dialogue]]
speaker = "ラクシャ"
# 「主であるルヴィネさまが頑張ってるんだから、ボクたちが頑張るのは当然だよ」
line = "「主であるルヴィネさまが頑張ってるんだから、ボクたちが頑張るのは当然だよ」"

[[dialogue]]
speaker = "unk"
# 星徒会室の飾り付けが全て外され、非日常の景色はすっかり日常の景色へと変わっていた。
line = "星徒会室の飾り付けが全て外され、非日常の景色はすっかり日常の景色へと変わっていた。"

[[dialogue]]
speaker = "ルヴィネ"
# 「……今日のパーティーは大成功だったわ。みんなはその盛り上がりにひと役もふた役も買ってくれた」
line = "「……今日のパーティーは大成功だったわ。みんなはその盛り上がりにひと役もふた役も買ってくれた」"

[[dialogue]]
speaker = "ルヴィネ"
# 「それについても改めてお礼を言わせて、ありがとう」
line = "「それについても改めてお礼を言わせて、ありがとう」"

[[dialogue]]
speaker = "オオヒメ"
# 「ルヴィネ様はご満足いただけましたか？」
line = "「ルヴィネ様はご満足いただけましたか？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ええ、とっても楽しかったわ」
line = "「ええ、とっても楽しかったわ」"

[[dialogue]]
speaker = "マグダレナ"
# 「私たちにとっても貴重な体験になりました」
line = "「私たちにとっても貴重な体験になりました」"

[[dialogue]]
speaker = "マグダレナ"
# 「ハロウィンに向けて皆が一丸となって努力すること。その結実であるハロウィンパーティーを楽しむこと──」
line = "「ハロウィンに向けて皆が一丸となって努力すること。その結実であるハロウィンパーティーを楽しむこと──」"

[[dialogue]]
speaker = "マグダレナ"
# 「それらをこの身で感じることができたことを、心より嬉しく思います」
line = "「それらをこの身で感じることができたことを、心より嬉しく思います」"

[[dialogue]]
speaker = "ルヴィネ"
# 「それは私も同じよ」
line = "「それは私も同じよ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「お祭りという非日常が、過酷な日々を過ごすデネブの人々の心の癒しになる……」
line = "「お祭りという非日常が、過酷な日々を過ごすデネブの人々の心の癒しになる……」"

[[dialogue]]
speaker = "ルヴィネ"
# 「理屈で知っていたつもりになっていたけれど……みんなを楽しませるために色々な準備をして、それが実際に喜ばれて」
line = "「理屈で知っていたつもりになっていたけれど……みんなを楽しませるために色々な準備をして、それが実際に喜ばれて」"

[[dialogue]]
speaker = "ルヴィネ"
# 「お祭りそのものだけじゃない、お祭りの準備まで含めたそのすべてがイベントであり……その中で得た感情のひとつひとつが、明日への活力へと繋がっている」
line = "「お祭りそのものだけじゃない、お祭りの準備まで含めたそのすべてがイベントであり……その中で得た感情のひとつひとつが、明日への活力へと繋がっている」"

[[dialogue]]
speaker = "ルヴィネ"
# 「そんな光景を見て、祭というものの必要性をよりはっきりと理解できたわ。……『主体的に参加する』というのは、こういうことなのね」
line = "「そんな光景を見て、祭というものの必要性をよりはっきりと理解できたわ。……『主体的に参加する』というのは、こういうことなのね」"

[[dialogue]]
speaker = "unk"
# ルヴィネは噛みしめるように学びを語ったのだった。
line = "ルヴィネは噛みしめるように学びを語ったのだった。"

[[dialogue]]
speaker = "ラクシャ"
# 「うーん……何とか無事に終わったね～」
line = "「うーん……何とか無事に終わったね～」"

[[dialogue]]
speaker = "オオヒメ"
# 「結果的にはな。無事に終えることが出来た。だが本当に綱渡りの連続だっただろう」
line = "「結果的にはな。無事に終えることが出来た。だが本当に綱渡りの連続だっただろう」"

[[dialogue]]
speaker = "ラクシャ"
# 「いや～、いろいろ迷惑をかけちゃってごめんね～」
line = "「いや～、いろいろ迷惑をかけちゃってごめんね～」"

[[dialogue]]
speaker = "マグダレナ"
# 「でも、ラクシャの提案のおかげで私たちも、より主観的にハロウィンというものを実感し、楽しむことが出来ました」
line = "「でも、ラクシャの提案のおかげで私たちも、より主観的にハロウィンというものを実感し、楽しむことが出来ました」"

[[dialogue]]
speaker = "アルモタヘル"
# 「そうだな。何もかもが得難い経験ではあった」
line = "「そうだな。何もかもが得難い経験ではあった」"

[[dialogue]]
speaker = "オオヒメ"
# 「最初に話を聞いた時には、全く意味が分からなかったが……提案してくれたこと、感謝している」
line = "「最初に話を聞いた時には、全く意味が分からなかったが……提案してくれたこと、感謝している」"

[[dialogue]]
speaker = "ラクシャ"
# 「お～、そうなんだ。まさか感謝の言葉が貰えるとは思ってなかったよ～」
line = "「お～、そうなんだ。まさか感謝の言葉が貰えるとは思ってなかったよ～」"

[[dialogue]]
speaker = "ラクシャ"
# 「あ、そうだ。せっかく結成した『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』だし、ハロウィン１日で終わりにするのももったいないよね？」
line = "「あ、そうだ。せっかく結成した『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』だし、ハロウィン１日で終わりにするのももったいないよね？」"

[[dialogue]]
speaker = "ラクシャ"
# 「この際だからさ、定期的にライブをするっていうのはどう？　ほら、デネブではライブしたけど、アルタイルではしてないわけだし」
line = "「この際だからさ、定期的にライブをするっていうのはどう？　ほら、デネブではライブしたけど、アルタイルではしてないわけだし」"

[[dialogue]]
speaker = "パテル"
# 「絶対反対っ！！！！！！」
line = "「絶対反対っ！！！！！！」"

[[dialogue]]
speaker = "ラクシャ"
# 「え～」
line = "「え～」"

[[dialogue]]
speaker = "パテル"
# 「今回はおまけで参加してあげただけって言ったよね？　だからこれで終わり！　絶対あり得ない！」
line = "「今回はおまけで参加してあげただけって言ったよね？　だからこれで終わり！　絶対あり得ない！」"

[[dialogue]]
speaker = "アルモタヘル"
# 「パテルは何をプリプリと怒っている？」
line = "「パテルは何をプリプリと怒っている？」"

[[dialogue]]
speaker = "ラクシャ"
# 「ライブの最後のＭＣの時、無理やりスポットライトを当てちゃったから……ちょっと拗ねてるんだよね」
line = "「ライブの最後のＭＣの時、無理やりスポットライトを当てちゃったから……ちょっと拗ねてるんだよね」"

[[dialogue]]
speaker = "アルモタヘル"
# 「成程。それでライブの後からやけに静かだったのか」
line = "「成程。それでライブの後からやけに静かだったのか」"

[[dialogue]]
speaker = "セシア"
# 「それを言うならわたくしの紹介も酷かったんじゃないかしら？」
line = "「それを言うならわたくしの紹介も酷かったんじゃないかしら？」"

[[dialogue]]
speaker = "オオヒメ"
# 「というか全員酷かっただろう」
line = "「というか全員酷かっただろう」"

[[dialogue]]
speaker = "ラクシャ"
# 「ちょっと弄る感じにした方がオイシイかな～って」
line = "「ちょっと弄る感じにした方がオイシイかな～って」"

[[dialogue]]
speaker = "アルモタヘル"
# 「ラクシャ。終わったことよりも、我らにとってもっと重大なことがまだ残っているだろう」
line = "「ラクシャ。終わったことよりも、我らにとってもっと重大なことがまだ残っているだろう」"

[[dialogue]]
speaker = "マグダレナ"
# 「はいはい、焼肉ですね」
line = "「はいはい、焼肉ですね」"

[[dialogue]]
speaker = "アルモタヘル"
# 「うむ。ライブ後の定番は焼肉なのであろう？　ずっと楽しみにしていたのだ」
line = "「うむ。ライブ後の定番は焼肉なのであろう？　ずっと楽しみにしていたのだ」"

[[dialogue]]
speaker = "オオヒメ"
# 「あなたは会場の片付けの際にもずっと食べていただろう……」
line = "「あなたは会場の片付けの際にもずっと食べていただろう……」"

[[dialogue]]
speaker = "アルモタヘル"
# 「無論、打ち上げは別腹だ」
line = "「無論、打ち上げは別腹だ」"

[[dialogue]]
speaker = "ラクシャ"
# 「んじゃ打ち上げの焼き肉屋で、『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』の今後についてじっくり話そうか」
line = "「んじゃ打ち上げの焼き肉屋で、『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』の今後についてじっくり話そうか」"

[[dialogue]]
speaker = "パテル"
# 「だからやらないって！　ぜーったいやらないっ！」
line = "「だからやらないって！　ぜーったいやらないっ！」"

[[dialogue]]
speaker = "unk"
# 断固拒否するパテルの声が夜空に響く。
line = "断固拒否するパテルの声が夜空に響く。"

[[dialogue]]
speaker = "unk"
# こうしてハロウィンパーティーのために結成されたバンド、『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』はハロウィンの終わりと共に解散が決定したのだった。
line = "こうしてハロウィンパーティーのために結成されたバンド、『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』はハロウィンの終わりと共に解散が決定したのだった。"
