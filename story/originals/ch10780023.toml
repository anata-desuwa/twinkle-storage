[[dialogue]]
speaker = "unk"
# 第３話,癒し系カノジョ,P
line = "第３話,癒し系カノジョ,P"

[[dialogue]]
speaker = "トリュファイナ"
# 「あっ、魔王様！　ようやく見つけました♪　よかったら午後のお茶でも、一緒に──」
line = "「あっ、魔王様！　ようやく見つけました♪　よかったら午後のお茶でも、一緒に──」"

[[dialogue]]
speaker = "unk"
# すみません、星徒会の仕事中でして！
line = "すみません、星徒会の仕事中でして！"

[[dialogue]]
speaker = "トリュファイナ"
# 「あ……そ、そうでしたか。申し訳ございません、お忙しいところを呼び止めてしまって……」
line = "「あ……そ、そうでしたか。申し訳ございません、お忙しいところを呼び止めてしまって……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ふむふむ……？　薙刀部とスポーツチャンバラ部が、練習場所を取り合って大騒ぎ……？」
line = "「ふむふむ……？　薙刀部とスポーツチャンバラ部が、練習場所を取り合って大騒ぎ……？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「た、大変なのですね。星徒会はそのような場合の仲裁にもお出かけするのですか」
line = "「た、大変なのですね。星徒会はそのような場合の仲裁にもお出かけするのですか」"

[[dialogue]]
speaker = "unk"
# お茶はまたの機会に！
line = "お茶はまたの機会に！"

[[dialogue]]
speaker = "unk"
# 早く止めないと学園の施設が……！
line = "早く止めないと学園の施設が……！"

[[dialogue]]
speaker = "トリュファイナ"
# 「ああ……魔王様。あっという間に見えなくなってしまいました……」
line = "「ああ……魔王様。あっという間に見えなくなってしまいました……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「珍しい茶葉が手に入ったから、味わっていただきたかったのですが……またの機会ですね──」
line = "「珍しい茶葉が手に入ったから、味わっていただきたかったのですが……またの機会ですね──」"

[[dialogue]]
speaker = "unk"
# ──数日後。
line = "──数日後。"

[[dialogue]]
speaker = "トリュファイナ"
# 「魔王様、お疲れ様です♪　本日のご予定はいかがでしょう？　よろしければ──」
line = "「魔王様、お疲れ様です♪　本日のご予定はいかがでしょう？　よろしければ──」"

[[dialogue]]
speaker = "unk"
# すみません。今日も仕事が……！
line = "すみません。今日も仕事が……！"

[[dialogue]]
speaker = "トリュファイナ"
# 「あ──またタイミングが悪かったようですね……」
line = "「あ──またタイミングが悪かったようですね……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ふむふむ……？　騎馬戦部と人間ピラミッド部が、どちらがより高くヒトを積み上げられるかで競っている……？」
line = "「ふむふむ……？　騎馬戦部と人間ピラミッド部が、どちらがより高くヒトを積み上げられるかで競っている……？」"

[[dialogue]]
speaker = "unk"
# 急いで止めに行かないと……！！
line = "急いで止めに行かないと……！！"

[[dialogue]]
speaker = "unk"
# すでに校舎より高いらしくて……！
line = "すでに校舎より高いらしくて……！"

[[dialogue]]
speaker = "トリュファイナ"
# 「ご、ご苦労様です。いってらっしゃいませ……」
line = "「ご、ご苦労様です。いってらっしゃいませ……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「……しょんぼりです。魔王様とまた予定が合いませんでした……」
line = "「……しょんぼりです。魔王様とまた予定が合いませんでした……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「知ってはいましたが、やはり星徒会長は激務なのですね……魔王様、お身体を壊さなければよいのですが……」
line = "「知ってはいましたが、やはり星徒会長は激務なのですね……魔王様、お身体を壊さなければよいのですが……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「それにせっかくお付き合いしているというのに、恋人の時間もなかなか作れていません……」
line = "「それにせっかくお付き合いしているというのに、恋人の時間もなかなか作れていません……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「い、いえ！　落ち込んでいる場合ではありませんっ。こんな時だからこそ、彼女の私が！　お癒やししなくては──！！」
line = "「い、いえ！　落ち込んでいる場合ではありませんっ。こんな時だからこそ、彼女の私が！　お癒やししなくては──！！」"

[[dialogue]]
speaker = "unk"
# ……今日もトリュファイナさんとの時間が取れなかった。そして、目の前には書類の山。どうして人生とは、こうもままならないのか。
line = "……今日もトリュファイナさんとの時間が取れなかった。そして、目の前には書類の山。どうして人生とは、こうもままならないのか。"

[[dialogue]]
speaker = "unk"
# お腹も減った……
line = "お腹も減った……"

[[dialogue]]
speaker = "unk"
# クタクタだ……
line = "クタクタだ……"

[[dialogue]]
speaker = "？？？"
# 「──貴方の苦労をずっと見ていましたよ。本当によく頑張りましたね？」
line = "「──貴方の苦労をずっと見ていましたよ。本当によく頑張りましたね？」"

[[dialogue]]
speaker = "unk"
# 頭の中に声が直接……！？
line = "頭の中に声が直接……！？"

[[dialogue]]
speaker = "unk"
# ──なんだ！？
line = "──なんだ！？"

[[dialogue]]
speaker = "？？？"
# 「遂にその我慢は報われ、莫大な癒やしを得ます──♪」
line = "「遂にその我慢は報われ、莫大な癒やしを得ます──♪」"

[[dialogue]]
speaker = "unk"
# トリュファイナさん、どうして……！？
line = "トリュファイナさん、どうして……！？"

[[dialogue]]
speaker = "トリュファイナ"
# 「ふふ、お仕事で大忙しの魔王様を労うために。お癒やしに参ったのです♪」
line = "「ふふ、お仕事で大忙しの魔王様を労うために。お癒やしに参ったのです♪」"

[[dialogue]]
speaker = "トリュファイナ"
# 「いかがでしたか、今の登場の仕方は♪　先日、動画サイトで拝見した、黄金のライオン様のものを参考にしてみたのですが！」
line = "「いかがでしたか、今の登場の仕方は♪　先日、動画サイトで拝見した、黄金のライオン様のものを参考にしてみたのですが！」"

[[dialogue]]
speaker = "unk"
# か、回復魔法、ありがとうございます！
line = "か、回復魔法、ありがとうございます！"

[[dialogue]]
speaker = "unk"
# （悪いインターネッツに毒されてる……！）
line = "（悪いインターネッツに毒されてる……！）"

[[dialogue]]
speaker = "トリュファイナ"
# 「ふふ、お癒やしは魔法だけにあらず。お夜食のケーキに、淹れたての紅茶もポットで持参しております♪」
line = "「ふふ、お癒やしは魔法だけにあらず。お夜食のケーキに、淹れたての紅茶もポットで持参しております♪」"

[[dialogue]]
speaker = "トリュファイナ"
# 「お仕事の励みになればと思いまして、あの、和風バニーの衣装も着てまいりました。以前、可愛いと仰っていただけたので……」
line = "「お仕事の励みになればと思いまして、あの、和風バニーの衣装も着てまいりました。以前、可愛いと仰っていただけたので……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ここのところ大変かと存じますが、ふぁいとですよ魔王様！　ぴょーん、ぴょんっ<emoji=heart04>」
line = "「ここのところ大変かと存じますが、ふぁいとですよ魔王様！　ぴょーん、ぴょんっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 疲れが吹っ飛びました！
line = "疲れが吹っ飛びました！"

[[dialogue]]
speaker = "トリュファイナ"
# 「ふふ、喜んでいただけて何よりです♪」
line = "「ふふ、喜んでいただけて何よりです♪」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ですが、あまり根を詰めても捗らないのでは？　このあたりで小休止、いかがでしょう？」
line = "「ですが、あまり根を詰めても捗らないのでは？　このあたりで小休止、いかがでしょう？」"

[[dialogue]]
speaker = "unk"
# そうですね。ちょっと休憩します
line = "そうですね。ちょっと休憩します"

[[dialogue]]
speaker = "トリュファイナ"
# 「はい♪　ではでは、まず紅茶からどうぞ！」
line = "「はい♪　ではでは、まず紅茶からどうぞ！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「お疲れでしょうから、少し甘めの味付けにしております。リラックスできると思いますよ」
line = "「お疲れでしょうから、少し甘めの味付けにしております。リラックスできると思いますよ」"

[[dialogue]]
speaker = "トリュファイナ"
# 「あ、お好みで木苺のジャムもどうぞ。ふふふ、私が手作りした自信作です♪」
line = "「あ、お好みで木苺のジャムもどうぞ。ふふふ、私が手作りした自信作です♪」"

[[dialogue]]
speaker = "unk"
# 恋人の手作りと思うと格別です
line = "恋人の手作りと思うと格別です"

[[dialogue]]
speaker = "トリュファイナ"
# 「あ……<emoji=heart04>　そ、そう言っていただけると、頑張った甲斐があります……<emoji=heart04>」
line = "「あ……<emoji=heart04>　そ、そう言っていただけると、頑張った甲斐があります……<emoji=heart04>」"

[[dialogue]]
speaker = "トリュファイナ"
# 「そうです、こちらのケーキも！　給食委員会の方々に習ったので、味は確かですよ！」
line = "「そうです、こちらのケーキも！　給食委員会の方々に習ったので、味は確かですよ！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「お菓子作りは奥が深く、なかなか大変でした……ちょっと手順を誤るだけで、出来栄えがすごく変わってしまって……」
line = "「お菓子作りは奥が深く、なかなか大変でした……ちょっと手順を誤るだけで、出来栄えがすごく変わってしまって……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ですが、ようやく納得できるものができました。お試しくださいませ<emoji=heart04>」
line = "「ですが、ようやく納得できるものができました。お試しくださいませ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# わざわざ時間を作って会いに来てくれて、心を尽くした差し入れをしてくれるトリュファイナさん。
line = "わざわざ時間を作って会いに来てくれて、心を尽くした差し入れをしてくれるトリュファイナさん。"

[[dialogue]]
speaker = "unk"
# 俺なんかにはもったいない恋人への感謝を抱くとともに、近いうちに必ずデートの時間を取ろうと心に決めるのだった──
line = "俺なんかにはもったいない恋人への感謝を抱くとともに、近いうちに必ずデートの時間を取ろうと心に決めるのだった──"
