[[dialogue]]
speaker = "unk"
# とある休日、俺の家にヒメが遊びに来ていた。
line = "とある休日、俺の家にヒメが遊びに来ていた。"

[[dialogue]]
speaker = "unk"
# 部屋に招き入れると、もはや何も言わなくても膝の上に乗ってくる。
line = "部屋に招き入れると、もはや何も言わなくても膝の上に乗ってくる。"

[[dialogue]]
speaker = "unk"
# すっかり定位置だね
line = "すっかり定位置だね"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「はっ……！　す、すまない……この姿になると条件反射のように甘えてしまう……」
line = "「はっ……！　す、すまない……この姿になると条件反射のように甘えてしまう……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「けれど親しき仲にも礼儀あり、きちんと許しをもらってから座るべきだったな」
line = "「けれど親しき仲にも礼儀あり、きちんと許しをもらってから座るべきだったな」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「事後承諾になってしまったが……魔王、いいだろうか？」
line = "「事後承諾になってしまったが……魔王、いいだろうか？」"

[[dialogue]]
speaker = "unk"
# もちろん大歓迎だ
line = "もちろん大歓迎だ"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そうか……感謝する」
line = "「そうか……感謝する」"

[[dialogue]]
speaker = "unk"
# 小さい姿になっても生真面目なところは変わらないんだな、と微笑ましい気持ちになってしまう。
line = "小さい姿になっても生真面目なところは変わらないんだな、と微笑ましい気持ちになってしまう。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ん、どうした？　何かおかしかったか？」
line = "「ん、どうした？　何かおかしかったか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「私を抱っこしているときは、まあ大概笑顔だが……笑みが抑えられないといった様子だ」
line = "「私を抱っこしているときは、まあ大概笑顔だが……笑みが抑えられないといった様子だ」"

[[dialogue]]
speaker = "unk"
# ヒメは可愛いなと思って
line = "ヒメは可愛いなと思って"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「なっ……！　急に何を言うんだ！　からかっているのか……？」
line = "「なっ……！　急に何を言うんだ！　からかっているのか……？」"

[[dialogue]]
speaker = "unk"
# とんでもない、本心から出た言葉だ。
line = "とんでもない、本心から出た言葉だ。"

[[dialogue]]
speaker = "unk"
# 込み上げる気持ちを抑えきれずヒメを抱きしめると、何も言わずにあやすように頭を撫でる。
line = "込み上げる気持ちを抑えきれずヒメを抱きしめると、何も言わずにあやすように頭を撫でる。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「むぅぅ……」
line = "「むぅぅ……」"

[[dialogue]]
speaker = "unk"
# やはりからかわれているのだと思ったのか、ヒメは少し不満げな表情を浮かべた。
line = "やはりからかわれているのだと思ったのか、ヒメは少し不満げな表情を浮かべた。"

[[dialogue]]
speaker = "unk"
# ごめんごめん
line = "ごめんごめん"

[[dialogue]]
speaker = "unk"
# どこまでも真面目なヒメのことを可愛いと思った、と謝罪しつつ伝える。
line = "どこまでも真面目なヒメのことを可愛いと思った、と謝罪しつつ伝える。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「複雑だな……魔王は誉め言葉として、私のことを真面目と評してくれたようだ」
line = "「複雑だな……魔王は誉め言葉として、私のことを真面目と評してくれたようだ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「けれど私は、自身の融通の利かない性質が、時に欠点になりうるということも知っている」
line = "「けれど私は、自身の融通の利かない性質が、時に欠点になりうるということも知っている」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「となると、真面目であるというのは果たして誉め言葉なのかどうなのか……」
line = "「となると、真面目であるというのは果たして誉め言葉なのかどうなのか……」"

[[dialogue]]
speaker = "unk"
# 言ったそばから難しい顔をして考え込み始める。
line = "言ったそばから難しい顔をして考え込み始める。"

[[dialogue]]
speaker = "unk"
# けれど……
line = "けれど……"

[[dialogue]]
speaker = "unk"
# （背中の羽がパタパタしてる……）
line = "（背中の羽がパタパタしてる……）"

[[dialogue]]
speaker = "unk"
# 口ではそう言いつつも、自身の真面目さを評価されるのはやっぱり嬉しいのかもしれない。
line = "口ではそう言いつつも、自身の真面目さを評価されるのはやっぱり嬉しいのかもしれない。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「あっ……」
line = "「あっ……」"

[[dialogue]]
speaker = "unk"
# 羽を優しく撫でると、少し驚いたような声を漏らした。
line = "羽を優しく撫でると、少し驚いたような声を漏らした。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ん……魔王は……本当に私のことを撫でるのが好きなのだな」
line = "「ん……魔王は……本当に私のことを撫でるのが好きなのだな」"

[[dialogue]]
speaker = "unk"
# だって可愛いから
line = "だって可愛いから"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「またそんな事を言う……もういい、今は素直に受け取っておくことにしよう」
line = "「またそんな事を言う……もういい、今は素直に受け取っておくことにしよう」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「遠慮はいらない、魔王の気が済むまで思う存分撫でるといい」
line = "「遠慮はいらない、魔王の気が済むまで思う存分撫でるといい」"

[[dialogue]]
speaker = "unk"
# お許しが出たので、思う存分撫でまわさせてもらうことにする。
line = "お許しが出たので、思う存分撫でまわさせてもらうことにする。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「んっ、その下から羽をクシャクシャされる感じ……気持ちよくて、いいな……」
line = "「んっ、その下から羽をクシャクシャされる感じ……気持ちよくて、いいな……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「撫でられるのも好きだが……それも、好きかもしれない……」
line = "「撫でられるのも好きだが……それも、好きかもしれない……」"

[[dialogue]]
speaker = "unk"
# 表情を緩めながら、されるがままになってくれるヒメ。
line = "表情を緩めながら、されるがままになってくれるヒメ。"

[[dialogue]]
speaker = "unk"
# リラックスしてくれてる顔だ
line = "リラックスしてくれてる顔だ"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「魔王が上手なのだ。その優しい手つきはいつだって私の緊張を<ruby=ほど>解</ruby>いてくれる……」
line = "「魔王が上手なのだ。その優しい手つきはいつだって私の緊張を<ruby>解<rt>ほど</rt></ruby>いてくれる……」"

[[dialogue]]
speaker = "unk"
# その発言、ちょっとエッチか
line = "その発言、ちょっとエッチか"

[[dialogue]]
speaker = "unk"
# …………
line = "…………"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「っ！？　な、何故そうなる！」
line = "「っ！？　な、何故そうなる！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「いや……確かに破廉恥な発言に聞こえなくもないかもしれない、か……？」
line = "「いや……確かに破廉恥な発言に聞こえなくもないかもしれない、か……？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「だが仕方がないだろう、本当にそう思ったのだから……」
line = "「だが仕方がないだろう、本当にそう思ったのだから……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「あぁ、そう言っている間にも……魔王の指が……私をどんどん気持ちよくしてくる……うぅう……」
line = "「あぁ、そう言っている間にも……魔王の指が……私をどんどん気持ちよくしてくる……うぅう……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そうしたら……どんどん顔が緩んでしまって……」
line = "「そうしたら……どんどん顔が緩んでしまって……」"

[[dialogue]]
speaker = "unk"
# 俺だけに見せてくれる一面ってことで
line = "俺だけに見せてくれる一面ってことで"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そうだな……私と魔王は恋人同士なのだから……２人だけの時は気を緩めても……」
line = "「そうだな……私と魔王は恋人同士なのだから……２人だけの時は気を緩めても……」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「だが、他の者にはこんな姿は見せられぬ……くれぐれも秘密にしておいてくれ……ふにゅぅ……<emoji=heart04>」
line = "「だが、他の者にはこんな姿は見せられぬ……くれぐれも秘密にしておいてくれ……ふにゅぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# <ruby=とろ>蕩</ruby>けきった声を上げながら、全身から力を抜いて身を預けてくる。
line = "<ruby>蕩<rt>とろ</rt></ruby>けきった声を上げながら、全身から力を抜いて身を預けてくる。"

[[dialogue]]
speaker = "unk"
# その後も、俺はヒメがフニャフニャにふやけるまで、彼女を撫でまわし続けたのだった。
line = "その後も、俺はヒメがフニャフニャにふやけるまで、彼女を撫でまわし続けたのだった。"
