[[dialogue]]
speaker = "unk"
# ザタナーンの消滅後、リゾート結界の封印術式が解かれたことが確認され、俺たちは流星市国へと戻ってきた。
line = "ザタナーンの消滅後、リゾート結界の封印術式が解かれたことが確認され、俺たちは流星市国へと戻ってきた。"

[[dialogue]]
speaker = "マトイ"
# 「戻って来れた～♪」
line = "「戻って来れた～♪」"

[[dialogue]]
speaker = "ロロット"
# 「脱出成功なのです～♪」
line = "「脱出成功なのです～♪」"

[[dialogue]]
speaker = "ルネア"
# 「――どうやら、ザタナーンが異世界転移を実行したことで、空間の繋がりに歪みが発生しているみたいね」
line = "「――どうやら、ザタナーンが異世界転移を実行したことで、空間の繋がりに歪みが発生しているみたいね」"

[[dialogue]]
speaker = "リア"
# 「じゃあ……前の時みたいに空間の歪みが修復されるまで、少し時間がかかる感じかな？」
line = "「じゃあ……前の時みたいに空間の歪みが修復されるまで、少し時間がかかる感じかな？」"

[[dialogue]]
speaker = "ルネア"
# 「ええ。早くても数日はかかると思うわ」
line = "「ええ。早くても数日はかかると思うわ」"

[[dialogue]]
speaker = "聖沙"
# 「――咲良クン、また会長の中で眠っちゃっている感じかしら？」
line = "「――咲良クン、また会長の中で眠っちゃっている感じかしら？」"

[[dialogue]]
speaker = "unk"
# 残念ながら、そうみたいだ
line = "残念ながら、そうみたいだ"

[[dialogue]]
speaker = "ナナカ"
# 「異世界に行ってみたい！　って言ってたけど、またお預けか～」
line = "「異世界に行ってみたい！　って言ってたけど、またお預けか～」"

[[dialogue]]
speaker = "unk"
# でも、何かお土産を渡したいな
line = "でも、何かお土産を渡したいな"

[[dialogue]]
speaker = "ロロット"
# 「それ、きっと会長さん、喜ぶのです！」
line = "「それ、きっと会長さん、喜ぶのです！」"

[[dialogue]]
speaker = "リア"
# 「そうだね♪　何がいいか、一緒に考えよっか」
line = "「そうだね♪　何がいいか、一緒に考えよっか」"

[[dialogue]]
speaker = "聖沙"
# 「まあ、咲良クンも頑張ってくれたし、お土産選びで１番いいものを用意してあげるわ！」
line = "「まあ、咲良クンも頑張ってくれたし、お土産選びで１番いいものを用意してあげるわ！」"

[[dialogue]]
speaker = "パッキー"
# 「ククク……！　異世界の魔王様よ。同じ男として、秘蔵の本をプレゼントしてやるのはどうだ……？」
line = "「ククク……！　異世界の魔王様よ。同じ男として、秘蔵の本をプレゼントしてやるのはどうだ……？」"

[[dialogue]]
speaker = "ナナカ"
# 「それは却下」
line = "「それは却下」"

[[dialogue]]
speaker = "ロロット"
# 「秘蔵の本とは、どんな本なのです？」
line = "「秘蔵の本とは、どんな本なのです？」"

[[dialogue]]
speaker = "聖沙"
# 「さ、さあ！？　私にはわからないわ！」
line = "「さ、さあ！？　私にはわからないわ！」"

[[dialogue]]
speaker = "リア"
# 「と、とりあえず、それ以外で考えようか～？」
line = "「と、とりあえず、それ以外で考えようか～？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あと、せっかくこっちに滞在するなら、異世界も楽しまないとね！」
line = "「あと、せっかくこっちに滞在するなら、異世界も楽しまないとね！」"

[[dialogue]]
speaker = "ヘレナ"
# 「九浄家に部屋を用意しよう。流星クルセイダース一行、歓迎するぞ」
line = "「九浄家に部屋を用意しよう。流星クルセイダース一行、歓迎するぞ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「本当！？　ヘレナちゃん、ありがと～♪」
line = "「本当！？　ヘレナちゃん、ありがと～♪」"

[[dialogue]]
speaker = "unk"
# こうして、流星クルセイダースは数日の間、流星市国へ滞在することになるのだった。
line = "こうして、流星クルセイダースは数日の間、流星市国へ滞在することになるのだった。"

[[dialogue]]
speaker = "unk"
# それから、数日後。
line = "それから、数日後。"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースが元の世界に戻る時がやって来た。
line = "流星クルセイダースが元の世界に戻る時がやって来た。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――じゃあ、ヘレナちゃん、またね」
line = "「――じゃあ、ヘレナちゃん、またね」"

[[dialogue]]
speaker = "ヘレナ"
# 「ああ。離れても魂はいつも共にある。壮健でな、もう１人の私よ」
line = "「ああ。離れても魂はいつも共にある。壮健でな、もう１人の私よ」"

[[dialogue]]
speaker = "unk"
# ２人のヘレナさんは、握手を交わす。
line = "２人のヘレナさんは、握手を交わす。"

[[dialogue]]
speaker = "マトイ"
# 「聖沙お姉様も、元気でね♪」
line = "「聖沙お姉様も、元気でね♪」"

[[dialogue]]
speaker = "聖沙"
# 「ええ、マトイも♪　また勝負しましょう」
line = "「ええ、マトイも♪　また勝負しましょう」"

[[dialogue]]
speaker = "unk"
# シンにもよろしくね
line = "シンにもよろしくね"

[[dialogue]]
speaker = "ナナカ"
# 「オッケー、会長。伝えとくよ♪」
line = "「オッケー、会長。伝えとくよ♪」"

[[dialogue]]
speaker = "ロロット"
# 「またきっと、お会いしましょ～♪」
line = "「またきっと、お会いしましょ～♪」"

[[dialogue]]
speaker = "リア"
# 「ヴィーナスちゃんたちにもよろしくね♪」
line = "「ヴィーナスちゃんたちにもよろしくね♪」"

[[dialogue]]
speaker = "パッキー"
# 「頑張れよ、異世界の魔王様！」
line = "「頑張れよ、異世界の魔王様！」"

[[dialogue]]
speaker = "ルネア"
# 「それじゃあ、元の世界に戻るわよ」
line = "「それじゃあ、元の世界に戻るわよ」"

[[dialogue]]
speaker = "リア"
# 「またね、マトイちゃん、会長くん！」
line = "「またね、マトイちゃん、会長くん！」"

[[dialogue]]
speaker = "聖沙"
# 「ヘレナさんも、ごきげんよう♪」
line = "「ヘレナさんも、ごきげんよう♪」"

[[dialogue]]
speaker = "ナナカ"
# 「じゃあね！」
line = "「じゃあね！」"

[[dialogue]]
speaker = "ロロット"
# 「さよならなのです～！」
line = "「さよならなのです～！」"

[[dialogue]]
speaker = "パッキー"
# 「あばよ！」
line = "「あばよ！」"

[[dialogue]]
speaker = "ルネア"
# 「また会いに来るわ♪」
line = "「また会いに来るわ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「魔王ちゃん、マトイちゃん、星徒会頑張ってね♪　それから――」
line = "「魔王ちゃん、マトイちゃん、星徒会頑張ってね♪　それから――」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ヘレナちゃん、愛してるわよ～<emoji=heart04>　――チュッ<emoji=heart04>」
line = "「ヘレナちゃん、愛してるわよ～<emoji=heart04>　――チュッ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 最後にヘレナさんが投げキッスをして。
line = "最後にヘレナさんが投げキッスをして。"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースは光に包まれ、元の世界へと戻って行った。
line = "流星クルセイダースは光に包まれ、元の世界へと戻って行った。"

[[dialogue]]
speaker = "マトイ"
# 「……行っちゃったね」
line = "「……行っちゃったね」"

[[dialogue]]
speaker = "unk"
# ちょっと寂しくなるな
line = "ちょっと寂しくなるな"

[[dialogue]]
speaker = "ヘレナ"
# 「ああ。だが、またきっと会えるだろう」
line = "「ああ。だが、またきっと会えるだろう」"

[[dialogue]]
speaker = "マトイ"
# 「シンくんも、元の世界へ戻れたのかな？」
line = "「シンくんも、元の世界へ戻れたのかな？」"

[[dialogue]]
speaker = "unk"
# 俺の中からは、もういなくなってる
line = "俺の中からは、もういなくなってる"

[[dialogue]]
speaker = "マトイ"
# 「会えなくて残念だったね」
line = "「会えなくて残念だったね」"

[[dialogue]]
speaker = "unk"
# そうでもないよ
line = "そうでもないよ"

[[dialogue]]
speaker = "unk"
# だって、会えなくたって――共に過ごした友達だと、そう思えるから。
line = "だって、会えなくたって――共に過ごした友達だと、そう思えるから。"

[[dialogue]]
speaker = "マトイ"
# 「……そっか♪」
line = "「……そっか♪」"

[[dialogue]]
speaker = "unk"
# 俺の言葉に、マトイは微笑むのだった。
line = "俺の言葉に、マトイは微笑むのだった。"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースが元の世界へ戻って、少しして。
line = "流星クルセイダースが元の世界へ戻って、少しして。"

[[dialogue]]
speaker = "パッキー"
# 「――おっ、魔王様、どうやら起きたみたいだぜ～！」
line = "「――おっ、魔王様、どうやら起きたみたいだぜ～！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「おはよう、シンちゃん♪」
line = "「おはよう、シンちゃん♪」"

[[dialogue]]
speaker = "ナナカ"
# 「あっ、シン！　起きた？　よっ、元気～？」
line = "「あっ、シン！　起きた？　よっ、元気～？」"

[[dialogue]]
speaker = "リア"
# 「シンくん、よかった～♪　それで、どこまで覚えてるかな？」
line = "「シンくん、よかった～♪　それで、どこまで覚えてるかな？」"

[[dialogue]]
speaker = "ロロット"
# 「――夢を見てた感じだけど、なんとなく海で遊んだりした気がする……ですか？　それは夢じゃないですよ～♪」
line = "「――夢を見てた感じだけど、なんとなく海で遊んだりした気がする……ですか？　それは夢じゃないですよ～♪」"

[[dialogue]]
speaker = "聖沙"
# 「はいこれ、お土産よ」
line = "「はいこれ、お土産よ」"

[[dialogue]]
speaker = "聖沙"
# 「一体何かって？　咲良クンが寝たまんまだったから、会長が何か渡したいって言って、用意したのよ♪」
line = "「一体何かって？　咲良クンが寝たまんまだったから、会長が何か渡したいって言って、用意したのよ♪」"

[[dialogue]]
speaker = "ロロット"
# 「みんなで何がいいか、一緒に考えたのですよ～」
line = "「みんなで何がいいか、一緒に考えたのですよ～」"

[[dialogue]]
speaker = "ナナカ"
# 「中身はなんと――『トンテキ弁当』だよ♪」
line = "「中身はなんと――『トンテキ弁当』だよ♪」"

[[dialogue]]
speaker = "ルネア"
# 「私が女神の力で、出来たて熱々のままで保管しておいたわ♪」
line = "「私が女神の力で、出来たて熱々のままで保管しておいたわ♪」"

[[dialogue]]
speaker = "ロロット"
# 「異世会長さんの手作りなのですよ～♪」
line = "「異世会長さんの手作りなのですよ～♪」"

[[dialogue]]
speaker = "ナナカ"
# 「さあ、冷めないうちに、食いねぇ！」
line = "「さあ、冷めないうちに、食いねぇ！」"

[[dialogue]]
speaker = "unk"
# そうして間もなく――青い空に「うまいっ！！！」という元気な声が響いて。
line = "そうして間もなく――青い空に「うまいっ！！！」という元気な声が響いて。"

[[dialogue]]
speaker = "聖沙"
# 「ふふっ、どうやら、会長の勝ちみたいね♪」
line = "「ふふっ、どうやら、会長の勝ちみたいね♪」"

[[dialogue]]
speaker = "リア"
# 「キラキラの笑顔、いただきました～♪」
line = "「キラキラの笑顔、いただきました～♪」"

[[dialogue]]
speaker = "ナナカ"
# 「イェ～イ♪」
line = "「イェ～イ♪」"

[[dialogue]]
speaker = "ロロット"
# 「なのです～♪」
line = "「なのです～♪」"

[[dialogue]]
speaker = "unk"
# 流星学園の生徒会室に、いつもの賑やかな日常が戻ってくるのだった。
line = "流星学園の生徒会室に、いつもの賑やかな日常が戻ってくるのだった。"
