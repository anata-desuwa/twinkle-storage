[[dialogue]]
speaker = "unk"
# 第４話,これからも,P
line = "第４話,これからも,P"

[[dialogue]]
speaker = "unk"
# 星徒会の仕事を終える頃には、すっかり日も暮れてしまい、夜になっていた。
line = "星徒会の仕事を終える頃には、すっかり日も暮れてしまい、夜になっていた。"

[[dialogue]]
speaker = "unk"
# っ！？
line = "っ！？"

[[dialogue]]
speaker = "unk"
# 校門を出た俺は、背後に気配を感じて振り返る。
line = "校門を出た俺は、背後に気配を感じて振り返る。"

[[dialogue]]
speaker = "unk"
# そこには──
line = "そこには──"

[[dialogue]]
speaker = "ナターシャ"
# 「いい反応だね。でも気づくのがちょっと遅かったかな、会長さん」
line = "「いい反応だね。でも気づくのがちょっと遅かったかな、会長さん」"

[[dialogue]]
speaker = "ナターシャ"
# 「私が本物の吸血鬼だったら、とっくに首筋をガブリとやられてるよ？」
line = "「私が本物の吸血鬼だったら、とっくに首筋をガブリとやられてるよ？」"

[[dialogue]]
speaker = "unk"
# 吸血鬼を模したハロウィンフォームに身を包むナターシャが、背後に忍び寄っていた。
line = "吸血鬼を模したハロウィンフォームに身を包むナターシャが、背後に忍び寄っていた。"

[[dialogue]]
speaker = "unk"
# 何の用？
line = "何の用？"

[[dialogue]]
speaker = "ナターシャ"
# 「用ってわけでもないんだけど。美味しそうな血を飲みたくなるのは吸血鬼の本能でしょ？」
line = "「用ってわけでもないんだけど。美味しそうな血を飲みたくなるのは吸血鬼の本能でしょ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「会長さんの血をチューチュー吸って、私の眷属にしようかなって。会長さんを私の手駒にしたら、便利に使えそうだからね」
line = "「会長さんの血をチューチュー吸って、私の眷属にしようかなって。会長さんを私の手駒にしたら、便利に使えそうだからね」"

[[dialogue]]
speaker = "ナターシャ"
# 「──なーんて、冗談、冗談。どこかのニンニク大好き吸血鬼じゃないんだし、ハロウィンフォームの私にそんな能力はないよ」
line = "「──なーんて、冗談、冗談。どこかのニンニク大好き吸血鬼じゃないんだし、ハロウィンフォームの私にそんな能力はないよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「むしろ、私に聞きたいことがあるのは、会長さんの方じゃないの？　顔に出てるよ」
line = "「むしろ、私に聞きたいことがあるのは、会長さんの方じゃないの？　顔に出てるよ」"

[[dialogue]]
speaker = "unk"
# メルエルとは和解したんだよね？
line = "メルエルとは和解したんだよね？"

[[dialogue]]
speaker = "ナターシャ"
# 「なんだ、そのこと。もう少し色っぽい話題かと思って期待したのに」
line = "「なんだ、そのこと。もう少し色っぽい話題かと思って期待したのに」"

[[dialogue]]
speaker = "ナターシャ"
# 「和解……ま、そうだね。前ほどギスギスした感じではなくなったかな」
line = "「和解……ま、そうだね。前ほどギスギスした感じではなくなったかな」"

[[dialogue]]
speaker = "ナターシャ"
# 「でも勘違いしないでほしいんだけど、別にメルエルのことを好きになったわけでもないからね」
line = "「でも勘違いしないでほしいんだけど、別にメルエルのことを好きになったわけでもないからね」"

[[dialogue]]
speaker = "ナターシャ"
# 「彼女のお気楽な性格を受け入れるのは正直無理」
line = "「彼女のお気楽な性格を受け入れるのは正直無理」"

[[dialogue]]
speaker = "ナターシャ"
# 「でも、ずっと意地張ってケンカ腰なのも子どもみたいだからね。大人の対応をしてるだけだよ。納得した？」
line = "「でも、ずっと意地張ってケンカ腰なのも子どもみたいだからね。大人の対応をしてるだけだよ。納得した？」"

[[dialogue]]
speaker = "ナターシャ"
# 「……なに。そのニヤニヤ笑い、気になるんだけど」
line = "「……なに。そのニヤニヤ笑い、気になるんだけど」"

[[dialogue]]
speaker = "ナターシャ"
# 「というわけで、メルエルの護衛はなくなって手隙になったんだ」
line = "「というわけで、メルエルの護衛はなくなって手隙になったんだ」"

[[dialogue]]
speaker = "ナターシャ"
# 「だからといって、私の仕事が全部なくなったわけじゃない」
line = "「だからといって、私の仕事が全部なくなったわけじゃない」"

[[dialogue]]
speaker = "ナターシャ"
# 「魔王である会長さんの監視は、これからも続けさせてもらうよ。私なりの方法でね」
line = "「魔王である会長さんの監視は、これからも続けさせてもらうよ。私なりの方法でね」"

[[dialogue]]
speaker = "ナターシャ"
# 「つきまとわれて迷惑だろうけど、つまり『これからもよろしく』ってことで」
line = "「つきまとわれて迷惑だろうけど、つまり『これからもよろしく』ってことで」"

[[dialogue]]
speaker = "ナターシャ"
# 「ちゅっ」
line = "「ちゅっ」"

[[dialogue]]
speaker = "unk"
# ……っ！？
line = "……っ！？"

[[dialogue]]
speaker = "unk"
# 首筋に牙を突き立てられる代わりに、唇が触れ、ぺろりと舐められる。
line = "首筋に牙を突き立てられる代わりに、唇が触れ、ぺろりと舐められる。"

[[dialogue]]
speaker = "ナターシャ"
# 「ふふ、会長さんの汗、しょっぱいね」
line = "「ふふ、会長さんの汗、しょっぱいね」"

[[dialogue]]
speaker = "ナターシャ"
# 「こんな格好だし、ちょっとくらい吸血鬼らしくしといた方がいいかなって──あ」
line = "「こんな格好だし、ちょっとくらい吸血鬼らしくしといた方がいいかなって──あ」"

[[dialogue]]
speaker = "unk"
# まだ何か……？
line = "まだ何か……？"

[[dialogue]]
speaker = "ナターシャ"
# 「会長さんの、こ・こ」
line = "「会長さんの、こ・こ」"

[[dialogue]]
speaker = "unk"
# ナターシャが細い指で、俺の首筋を指差す。
line = "ナターシャが細い指で、俺の首筋を指差す。"

[[dialogue]]
speaker = "unk"
# 研ぎ澄まされた刃を思わせる、綺麗な指で。
line = "研ぎ澄まされた刃を思わせる、綺麗な指で。"

[[dialogue]]
speaker = "ナターシャ"
# 「痕、残っちゃった」
line = "「痕、残っちゃった」"

[[dialogue]]
speaker = "ナターシャ"
# 「絆創膏か何かで隠しておいた方がいいかも。目聡い誰かさんに見つかったら誤解されるからね」
line = "「絆創膏か何かで隠しておいた方がいいかも。目聡い誰かさんに見つかったら誤解されるからね」"

[[dialogue]]
speaker = "ナターシャ"
# 「あ、でも、あからさまに隠してても疑われちゃうか」
line = "「あ、でも、あからさまに隠してても疑われちゃうか」"

[[dialogue]]
speaker = "unk"
# ──っ！？
line = "──っ！？"

[[dialogue]]
speaker = "ナターシャ"
# 「ふふ、いい顔。その顔が見れただけでも、会長さんを待ってた甲斐があるよ」
line = "「ふふ、いい顔。その顔が見れただけでも、会長さんを待ってた甲斐があるよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「じゃ、またね。少し暇になったから、たまには遊びにも付き合ってくれると嬉しいな」
line = "「じゃ、またね。少し暇になったから、たまには遊びにも付き合ってくれると嬉しいな」"

[[dialogue]]
speaker = "unk"
# ナターシャがコウモリの翼のようにヒラヒラと手を振る。
line = "ナターシャがコウモリの翼のようにヒラヒラと手を振る。"

[[dialogue]]
speaker = "unk"
# 次の瞬間、またも彼女は闇に溶け込むように姿を消す。
line = "次の瞬間、またも彼女は闇に溶け込むように姿を消す。"

[[dialogue]]
speaker = "unk"
# ナターシャのイタズラに弄ばれる日々はまだ続くらしい。
line = "ナターシャのイタズラに弄ばれる日々はまだ続くらしい。"

[[dialogue]]
speaker = "unk"
# 彼女に吸われた首筋は、仄かな熱を持っていた。
line = "彼女に吸われた首筋は、仄かな熱を持っていた。"
