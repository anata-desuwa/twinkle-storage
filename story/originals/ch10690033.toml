# 「隣にあなたがいてくれることが、なんだか自然になっていて……今、言われるまですっかり忘れていたわ」
line = "「隣にあなたがいてくれることが、なんだか自然になっていて……今、言われるまですっかり忘れていたわ」"

[[dialogue]]
speaker = "unk"
# セシアは元々、俺に『恋人体験』を頼んで今の関係になった。
line = "セシアは元々、俺に『恋人体験』を頼んで今の関係になった。"

[[dialogue]]
speaker = "unk"
# しかし最近の彼女は、恋愛とはこうするものだ、なんて、いちいち訊ねてくることもなくなっていた。
line = "しかし最近の彼女は、恋愛とはこうするものだ、なんて、いちいち訊ねてくることもなくなっていた。"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あなたはどうかしら、会長？　わたくし、今の関係のほうが……自分らしくいられるのだけど」
line = "「あなたはどうかしら、会長？　わたくし、今の関係のほうが……自分らしくいられるのだけど」"

[[dialogue]]
speaker = "unk"
