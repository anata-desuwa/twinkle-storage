line = "セシアはまたも、歩きながら腕を組んできた。"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふふ。ここにはこうしているカップルがたくさんいるわ。わたくし達も、郷に入っては郷に従いましょう？」
line = "「ふふ。ここにはこうしているカップルがたくさんいるわ。わたくし達も、郷に入っては郷に従いましょう？」"

[[dialogue]]
speaker = "unk"
# こうして俺とセシアは、幸せに包まれた１日を満喫したのだった。
line = "こうして俺とセシアは、幸せに包まれた１日を満喫したのだった。"
