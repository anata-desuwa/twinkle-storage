line = "俺もそう思う"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふふ、ありがとう。いいのよね、これで」
line = "「ふふ、ありがとう。いいのよね、これで」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「無理に肩肘を張って、恋人ぶろうとしなくても……素直な心から、あなたと触れ合いたいって思うもの。こうやって──」
line = "「無理に肩肘を張って、恋人ぶろうとしなくても……素直な心から、あなたと触れ合いたいって思うもの。こうやって──」"

[[dialogue]]
