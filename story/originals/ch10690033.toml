[[dialogue]]
speaker = "unk"
# 後日──
line = "後日──"

[[dialogue]]
speaker = "unk"
# 星徒会の仕事もひと段落ついた頃、俺とセシアは改めてデートをすることになった。
line = "星徒会の仕事もひと段落ついた頃、俺とセシアは改めてデートをすることになった。"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「──あ！　会長、こっちよ。ふふ、わたくしも今来たところなのだわ」
line = "「──あ！　会長、こっちよ。ふふ、わたくしも今来たところなのだわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「え？　わざわざ待ち合わせをしなくても学園で会えた？　でも、こうするのがデートの流儀と、紅明ママも言っていたわ♪」
line = "「え？　わざわざ待ち合わせをしなくても学園で会えた？　でも、こうするのがデートの流儀と、紅明ママも言っていたわ♪」"

[[dialogue]]
speaker = "unk"
# 行き先を聞いてない
line = "行き先を聞いてない"

[[dialogue]]
speaker = "unk"
# 今日はどこに行くの？
line = "今日はどこに行くの？"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ふふ、よい質問だわ。今日は行きたい場所があるのよ。前回とは違うデートスポットなの」
line = "「ふふ、よい質問だわ。今日は行きたい場所があるのよ。前回とは違うデートスポットなの」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「さあ、行きましょう会長。わたくし、とっても楽しみにしていたのよ！」
line = "「さあ、行きましょう会長。わたくし、とっても楽しみにしていたのよ！」"

[[dialogue]]
speaker = "unk"
# セシアに腕を組まれて、俺たちは目的地へと向かった……
line = "セシアに腕を組まれて、俺たちは目的地へと向かった……"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ここよ！」
line = "「ここよ！」"

[[dialogue]]
speaker = "unk"
# セシアが行きたかった場所というのは遊園地だった。
line = "セシアが行きたかった場所というのは遊園地だった。"

[[dialogue]]
speaker = "unk"
# 初めての遊園地体験？
line = "初めての遊園地体験？"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「いいえ。実はつい最近来たことがあるわ」
line = "「いいえ。実はつい最近来たことがあるわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「でもその時は別な目的があって楽しむことが出来なかったの。だから、次は会長と一緒に来たいと思っていたわ」
line = "「でもその時は別な目的があって楽しむことが出来なかったの。だから、次は会長と一緒に来たいと思っていたわ」"

[[dialogue]]
speaker = "unk"
# 気になるアトラクションはある？
line = "気になるアトラクションはある？"

[[dialogue]]
speaker = "unk"
# 思いっきり楽しもう！
line = "思いっきり楽しもう！"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そうね、どれも楽しそうで目を引くのだけれど、１番興味があるのはジェットコースターよ！」
line = "「そうね、どれも楽しそうで目を引くのだけれど、１番興味があるのはジェットコースターよ！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ものすごいスピードで走って揺られるなんて、どんな体験になるのかしら……」
line = "「ものすごいスピードで走って揺られるなんて、どんな体験になるのかしら……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「意外かしら？　わたくしは未知への興味は強いほうなのよ」
line = "「意外かしら？　わたくしは未知への興味は強いほうなのよ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「でも、最初からメインディッシュにかぶりつくような無粋はしないわ。まず、軽いアトラクションからならしていくものだと、紅明ママも言っていたもの」
line = "「でも、最初からメインディッシュにかぶりつくような無粋はしないわ。まず、軽いアトラクションからならしていくものだと、紅明ママも言っていたもの」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「──あ！　わたくし、あの回るティーカップが気になるわ！　会長、きてきてっ♪」
line = "「──あ！　わたくし、あの回るティーカップが気になるわ！　会長、きてきてっ♪」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「──ああ、楽しい！　遊園地って、こんなに愉快なところなのね。初めてのことばかりで、まったく飽きないわ！」
line = "「──ああ、楽しい！　遊園地って、こんなに愉快なところなのね。初めてのことばかりで、まったく飽きないわ！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「メリーゴーランドも、小舟のアトラクションも大満足。メイプル味のポップコーンもおいしくて……これは人気になるのも頷けるわ！」
line = "「メリーゴーランドも、小舟のアトラクションも大満足。メイプル味のポップコーンもおいしくて……これは人気になるのも頷けるわ！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「学園でも、楽しそうに遊園地について話している子がいたけれど、今なら理解できる気がするわ」
line = "「学園でも、楽しそうに遊園地について話している子がいたけれど、今なら理解できる気がするわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それにしても……メルヘンな格好をした人の子がずいぶんいるのね。あれはキャストというの？　ふふ、仕事熱心ね」
line = "「それにしても……メルヘンな格好をした人の子がずいぶんいるのね。あれはキャストというの？　ふふ、仕事熱心ね」"

[[dialogue]]
speaker = "unk"
# 彼女のファンシーな新衣装も、ここではさほど違和感がない。
line = "彼女のファンシーな新衣装も、ここではさほど違和感がない。"

[[dialogue]]
speaker = "unk"
# それどころか……
line = "それどころか……"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あら？　写真？　わたくしと撮りたいの？　別に構わないけれど……ふふ、そんな風に言われるのは珍しいわ」
line = "「あら？　写真？　わたくしと撮りたいの？　別に構わないけれど……ふふ、そんな風に言われるのは珍しいわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あなたも？　構わないわよ。ふふ、せっかくだから、お望みのポーズをとってあげる♪」
line = "「あなたも？　構わないわよ。ふふ、せっかくだから、お望みのポーズをとってあげる♪」"

[[dialogue]]
speaker = "unk"
# セシアは道行く女の子たちから『可愛い』としきりに声をかけられ、ツーショットなんかを要求されていた。
line = "セシアは道行く女の子たちから『可愛い』としきりに声をかけられ、ツーショットなんかを要求されていた。"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「なぜかしら。先ほどから、初めて会う人たちが、わたくしと写真を撮りたいと言ってくるのだけど……」
line = "「なぜかしら。先ほどから、初めて会う人たちが、わたくしと写真を撮りたいと言ってくるのだけど……」"

[[dialogue]]
speaker = "unk"
# コスプレと思われてる？
