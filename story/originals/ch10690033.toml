# 「いつか会長とジェットコースターに乗るのよ。ふふ、やっぱりごちそうは取っておいたほうが、うんとおいしく感じるものね♪」
line = "「いつか会長とジェットコースターに乗るのよ。ふふ、やっぱりごちそうは取っておいたほうが、うんとおいしく感じるものね♪」"

[[dialogue]]
speaker = "unk"
# 元の姿も小さかったらどうしよう。一瞬、そう思いかけたが、言及するのはよしておいた。
line = "元の姿も小さかったらどうしよう。一瞬、そう思いかけたが、言及するのはよしておいた。"

[[dialogue]]
speaker = "セシア（覚醒）"
