line = "「わたくしも『キャスト』と思われているのかしら？　想像もしていなかったわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「でも、みんなに可愛いと褒められるのは、悪くないわね♪」
line = "「でも、みんなに可愛いと褒められるのは、悪くないわね♪」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「さあ。そろそろわたくしの大本命──ジェットコースターへ向かいましょう？　わたくし、もう期待で胸がいっぱいよ」
line = "「さあ。そろそろわたくしの大本命──ジェットコースターへ向かいましょう？　わたくし、もう期待で胸がいっぱいよ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「絶叫系だから、怖いかも？　ふふ。問題ないわ。そういうのも含めて、スリルある体験を楽しめるのでしょう？　予習済みよ」
line = "「絶叫系だから、怖いかも？　ふふ。問題ないわ。そういうのも含めて、スリルある体験を楽しめるのでしょう？　予習済みよ」"

[[dialogue]]
