[[dialogue]]
speaker = "unk"
# アニマ先輩の分裂薬を使って、久しぶりに附属教室に登校してみた。
line = "アニマ先輩の分裂薬を使って、久しぶりに附属教室に登校してみた。"

[[dialogue]]
speaker = "unk"
# 『女子アバター』にはどうしても抵抗があるが、今はクラスメイトとしてヒメがいる。
line = "『女子アバター』にはどうしても抵抗があるが、今はクラスメイトとしてヒメがいる。"

[[dialogue]]
speaker = "unk"
# 彼女から「クラスメイトとして一緒に過ごしてみたい」とお願いされると、どうしても拒否しきれなかった。
line = "彼女から「クラスメイトとして一緒に過ごしてみたい」とお願いされると、どうしても拒否しきれなかった。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「これが……魔王……ちゃん……」
line = "「これが……魔王……ちゃん……」"

[[dialogue]]
speaker = "unk"
# ちゃん、はやめてね
line = "ちゃん、はやめてね"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そ、そうか……では、普段通り魔王、と」
line = "「そ、そうか……では、普段通り魔王、と」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「しかし、噂には聞いていたが……本当に可愛らしい女の子なのだな……」
line = "「しかし、噂には聞いていたが……本当に可愛らしい女の子なのだな……」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「恋人がこんな可愛い女の子になってショックを受けましたか？」
line = "「恋人がこんな可愛い女の子になってショックを受けましたか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「いや、驚きはしたが何も問題ない」
line = "「いや、驚きはしたが何も問題ない」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「この姿の魔王は素直に可愛いが、それでも魔王が魔王であることには変わりない」
line = "「この姿の魔王は素直に可愛いが、それでも魔王が魔王であることには変わりない」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「だから私の愛は何一つ変わることはない。小さい姿になった私を受け入れてくれた魔王の気持ちと同じくな」
line = "「だから私の愛は何一つ変わることはない。小さい姿になった私を受け入れてくれた魔王の気持ちと同じくな」"

[[dialogue]]
speaker = "unk"
# ヒメ……ありがとう……
line = "ヒメ……ありがとう……"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「それにしても久しぶりだな！」
line = "「それにしても久しぶりだな！」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「そうですよ。久しぶりの登校なのですから、分からないことがあったら何でも言ってくださいね。ママダレナが優しく教えてあげます♪」
line = "「そうですよ。久しぶりの登校なのですから、分からないことがあったら何でも言ってくださいね。ママダレナが優しく教えてあげます♪」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ああ、いや……そういったことは私に任せて欲しいのだが」
line = "「ああ、いや……そういったことは私に任せて欲しいのだが」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「あら、オオヒメだって<ruby=ここ>附属校</ruby>に通い始めたのはつい先日のことじゃないですか」
line = "「あら、オオヒメだって<ruby>附属校<rt>ここ</rt></ruby>に通い始めたのはつい先日のことじゃないですか」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「そうだぞ、学校生活についてなら、アルモたんやマグダレナの方がセンパイなのだ！」
line = "「そうだぞ、学校生活についてなら、アルモたんやマグダレナの方がセンパイなのだ！」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「恋人だからって会長を独り占めしようとするのはずるいのだ！」
line = "「恋人だからって会長を独り占めしようとするのはずるいのだ！」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「そんなつもりは……私は純粋に１人のクラスメイトとして魔王の力になりたいと……」
line = "「そんなつもりは……私は純粋に１人のクラスメイトとして魔王の力になりたいと……」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「だったらアルモたんも１人のクラスメイトとして、会長の力になりたいぞ！」
line = "「だったらアルモたんも１人のクラスメイトとして、会長の力になりたいぞ！」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「ええ、私も１人のママとして会長さまのお力になりたいです♪」
line = "「ええ、私も１人のママとして会長さまのお力になりたいです♪」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「う……ぐ……確かに２人の言う通り……私が魔王を独占していい道理はない……」
line = "「う……ぐ……確かに２人の言う通り……私が魔王を独占していい道理はない……」"

[[dialogue]]
speaker = "ナミエル"
# 「ママダレナもアルモたんもそこまでにしてあげてはいかがですか？　ヒメさんが可愛そうです」
line = "「ママダレナもアルモたんもそこまでにしてあげてはいかがですか？　ヒメさんが可愛そうです」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「っ！　ナミエル殿……」
line = "「っ！　ナミエル殿……」"

[[dialogue]]
speaker = "ナミエル"
# 「緋宮会長が久しぶりに登校する気になったのは、ヒメさんが働きかけてくれたからです」
line = "「緋宮会長が久しぶりに登校する気になったのは、ヒメさんが働きかけてくれたからです」"

[[dialogue]]
speaker = "ナミエル"
# 「であれば、会長の面倒をヒメさんが見るのは自然なことだと思いますよ」
line = "「であれば、会長の面倒をヒメさんが見るのは自然なことだと思いますよ」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「確かに、ナミエルの言う通りですね。では会長さまのお世話はオオヒメにお任せします」
line = "「確かに、ナミエルの言う通りですね。では会長さまのお世話はオオヒメにお任せします」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「その代わりオオヒメに分からないことがあったら遠慮なくアルモたんを頼るのだ！」
line = "「その代わりオオヒメに分からないことがあったら遠慮なくアルモたんを頼るのだ！」"

[[dialogue]]
speaker = "ナミエル"
# 「もちろん、ママダレナや私のことも頼ってください」
line = "「もちろん、ママダレナや私のことも頼ってください」"

[[dialogue]]
speaker = "unk"
# ３人ともありがとう
line = "３人ともありがとう"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ありがとう、みんな……（特にナミエル殿……）」
line = "「ありがとう、みんな……（特にナミエル殿……）」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ではでは、早速１限目の授業の準備にかかろう。教科書は持ってきているな？　ノートは？　筆記用具は？」
line = "「ではでは、早速１限目の授業の準備にかかろう。教科書は持ってきているな？　ノートは？　筆記用具は？」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「オオヒメ、すごい張り切りようなのだ……」
line = "「オオヒメ、すごい張り切りようなのだ……」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「ふふっ、張り切り過ぎて空回りしてしまわなければいいのですが」
line = "「ふふっ、張り切り過ぎて空回りしてしまわなければいいのですが」"

[[dialogue]]
speaker = "ナミエル"
# 「ヒメさんが失敗しそうになった時は、私たちで影からサポートしましょう」
line = "「ヒメさんが失敗しそうになった時は、私たちで影からサポートしましょう」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「それではみんな、また明日」
line = "「それではみんな、また明日」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「はい、それではまた明日です」
line = "「はい、それではまた明日です」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「会長もまた登校して来い、待ってるのだ♪」
line = "「会長もまた登校して来い、待ってるのだ♪」"

[[dialogue]]
speaker = "unk"
# 久しぶりの附属生としての１日は、大きな問題に出くわすことなく終わった。
line = "久しぶりの附属生としての１日は、大きな問題に出くわすことなく終わった。"

[[dialogue]]
speaker = "unk"
# それというのもヒメが細かく俺の面倒を見てくれ、他のクラスメイトたちもそれをバックアップしてくれたからだろう。
line = "それというのもヒメが細かく俺の面倒を見てくれ、他のクラスメイトたちもそれをバックアップしてくれたからだろう。"

[[dialogue]]
speaker = "unk"
# さて、ここからはいつも通り男の俺に戻って、緋宮クロトとして行動を──
line = "さて、ここからはいつも通り男の俺に戻って、緋宮クロトとして行動を──"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "unk"
# あれ……？
line = "あれ……？"

[[dialogue]]
speaker = "unk"
# 教室からずっとヒメが一緒についてきている。
line = "教室からずっとヒメが一緒についてきている。"

[[dialogue]]
speaker = "unk"
# それはまあ、いいのだけど──
line = "それはまあ、いいのだけど──"

[[dialogue]]
speaker = "unk"
# ヒメは大きい姿にならないの？
line = "ヒメは大きい姿にならないの？"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「ええ、まあ……何というか……もう少し……」
line = "「ええ、まあ……何というか……もう少し……」"

[[dialogue]]
speaker = "unk"
# 俺が男に戻るタイミングで、ヒメも大人の姿に戻るのかと思っていた。
line = "俺が男に戻るタイミングで、ヒメも大人の姿に戻るのかと思っていた。"

[[dialogue]]
speaker = "unk"
# けれどヒメは少し頬を赤らめながら、ときどき俺の方に目をやりつつ何かを言いたそうにモジモジしている。
line = "けれどヒメは少し頬を赤らめながら、ときどき俺の方に目をやりつつ何かを言いたそうにモジモジしている。"

[[dialogue]]
speaker = "unk"
# どうしたの──？
line = "どうしたの──？"

[[dialogue]]
speaker = "unk"
# と、訊ねようとして気が付いた。
line = "と、訊ねようとして気が付いた。"

[[dialogue]]
speaker = "unk"
# 教室ではずっとしっかり者のヒメとして俺の世話を焼きっぱなしだった。
line = "教室ではずっとしっかり者のヒメとして俺の世話を焼きっぱなしだった。"

[[dialogue]]
speaker = "unk"
# だからきっと、今日は１日中ずっと我慢してたんだな……
line = "だからきっと、今日は１日中ずっと我慢してたんだな……"

[[dialogue]]
speaker = "unk"
# ヒメ、手を
line = "ヒメ、手を"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「あ……」
line = "「あ……」"

[[dialogue]]
speaker = "unk"
# 俺が手を差し出すと、目をキラキラと輝かせながらしっかり握ってくる。
line = "俺が手を差し出すと、目をキラキラと輝かせながらしっかり握ってくる。"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「えへへ……♪　では、手を繋いで星徒会室に向かおう♪」
line = "「えへへ……♪　では、手を繋いで星徒会室に向かおう♪」"

[[dialogue]]
speaker = "unk"
# 嬉しそうなヒメの声に俺まで嬉しくなりながら、手を繋いで星徒会室へと向かったのだった。
line = "嬉しそうなヒメの声に俺まで嬉しくなりながら、手を繋いで星徒会室へと向かったのだった。"
