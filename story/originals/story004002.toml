[[dialogue]]
speaker = "アナ"
# 「……由々しき事態です」
line = "「……由々しき事態です」"

[[dialogue]]
speaker = "マトイ"
# 「まさか、こんなことになるだなんて……」
line = "「まさか、こんなことになるだなんて……」"

[[dialogue]]
speaker = "unk"
# 新星学園の星徒会長、魔王・緋宮クロト。
line = "新星学園の星徒会長、魔王・緋宮クロト。"

[[dialogue]]
speaker = "unk"
# そして天才錬金術師・アニマが行方不明となってはや３日──
line = "そして天才錬金術師・アニマが行方不明となってはや３日──"

[[dialogue]]
speaker = "ヘレナ"
# 「事態は深刻。解決は迅速に行わなくてはならぬな……」
line = "「事態は深刻。解決は迅速に行わなくてはならぬな……」"

[[dialogue]]
speaker = "アナ"
# 「理事長、方々への情報統制、感謝いたします」
line = "「理事長、方々への情報統制、感謝いたします」"

[[dialogue]]
speaker = "ヘレナ"
# 「礼には及ばぬ。魔王と錬金術師が行方不明などと、外部に漏れれば大事件だ」
line = "「礼には及ばぬ。魔王と錬金術師が行方不明などと、外部に漏れれば大事件だ」"

[[dialogue]]
speaker = "ヘレナ"
# 「魔王が不在と知られれば、星術犯罪組織の動きまで活発になるのは火を見るよりも明らかだからな」
line = "「魔王が不在と知られれば、星術犯罪組織の動きまで活発になるのは火を見るよりも明らかだからな」"

[[dialogue]]
speaker = "マトイ"
# 「えっと……ヴィーナスはどうしてますか？」
line = "「えっと……ヴィーナスはどうしてますか？」"

[[dialogue]]
speaker = "ヘレナ"
# 「パパを探すと言ってひと時もじっとしておらん。あちらにはサーシャと九浄家メイド隊がついている。心配は無用だ」
line = "「パパを探すと言ってひと時もじっとしておらん。あちらにはサーシャと九浄家メイド隊がついている。心配は無用だ」"

[[dialogue]]
speaker = "ヘレナ"
# 「ヴィーナスはあれでなかなか鼻が利く娘だ。魔王の失踪に関わっているのが、ただの犯罪組織であればじきに見つかるであろう」
line = "「ヴィーナスはあれでなかなか鼻が利く娘だ。魔王の失踪に関わっているのが、ただの犯罪組織であればじきに見つかるであろう」"

[[dialogue]]
speaker = "アナ"
# 「しかし……それは考えにくいです。うちの会長とアニマ先輩が、ただの反社会組織に後れを取るとは思えません」
line = "「しかし……それは考えにくいです。うちの会長とアニマ先輩が、ただの反社会組織に後れを取るとは思えません」"

[[dialogue]]
speaker = "ヘレナ"
# 「道理であるな。だからこそ我々は、別のアプローチを行う──そこでこの２人の出番というわけだ！」
line = "「道理であるな。だからこそ我々は、別のアプローチを行う──そこでこの２人の出番というわけだ！」"

[[dialogue]]
speaker = "シュティレ"
# 「どうも、アナお姉ちゃん。今回の事件、私たちにも協力させてください」
line = "「どうも、アナお姉ちゃん。今回の事件、私たちにも協力させてください」"

[[dialogue]]
speaker = "トリュファイナ"
# 「はい。魔王様とアニマ様の窮地とあっては、ジッとしていられません！」
line = "「はい。魔王様とアニマ様の窮地とあっては、ジッとしていられません！」"

[[dialogue]]
speaker = "ヘレナ"
# 「この２人は失踪した者たちと関係が深い。情報統制も難しいと判断し、事情を話した」
line = "「この２人は失踪した者たちと関係が深い。情報統制も難しいと判断し、事情を話した」"

[[dialogue]]
speaker = "マトイ"
# 「アニマ先輩の弟子のシュティレちゃんと……あ、そっか。トリュファイナさんは、会長に引っ張られて現代に再誕したから──」
line = "「アニマ先輩の弟子のシュティレちゃんと……あ、そっか。トリュファイナさんは、会長に引っ張られて現代に再誕したから──」"

[[dialogue]]
speaker = "トリュファイナ"
# 「はい。私の魂と、魔王様の魂には繋がりがございます。だからこそ断言できます──魔王様は、存命です」
line = "「はい。私の魂と、魔王様の魂には繋がりがございます。だからこそ断言できます──魔王様は、存命です」"

[[dialogue]]
speaker = "マトイ"
# 「よ、よかった……！」
line = "「よ、よかった……！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「しかし、申し訳ございません。繋がりがあり、距離はそう離れていない気もするのですが、場所が特定できないのです……」
line = "「しかし、申し訳ございません。繋がりがあり、距離はそう離れていない気もするのですが、場所が特定できないのです……」"

[[dialogue]]
speaker = "アナ"
# 「……そうですか。つまり会長は──」
line = "「……そうですか。つまり会長は──」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむ。人間界の流星市国にはいるが……どこぞの異空間にでも迷い込んでいる。そう考えるのが妥当であろう」
line = "「うむ。人間界の流星市国にはいるが……どこぞの異空間にでも迷い込んでいる。そう考えるのが妥当であろう」"

[[dialogue]]
speaker = "シュティレ"
# 「マスターは失踪される直前、とあるレーダーを開発しておりました」
line = "「マスターは失踪される直前、とあるレーダーを開発しておりました」"

[[dialogue]]
speaker = "シュティレ"
# 「シュティレも開発に関わったので、内容を知っています。あれは、マイナスエネルギーの揺らぎを感知するレーダー」
line = "「シュティレも開発に関わったので、内容を知っています。あれは、マイナスエネルギーの揺らぎを感知するレーダー」"

[[dialogue]]
speaker = "シュティレ"
# 「つまり、ロストアイテムの居場所を探る機械です」
line = "「つまり、ロストアイテムの居場所を探る機械です」"

[[dialogue]]
speaker = "アナ"
# 「……ロストアイテム！」
line = "「……ロストアイテム！」"

[[dialogue]]
speaker = "マトイ"
# 「ということは……ま、まさかっ！？」
line = "「ということは……ま、まさかっ！？」"

[[dialogue]]
speaker = "ヘレナ"
# 「そうだ。例の変態バニーフェチ──『欲望』のダッチが絡んでいる。私はそう睨んでいる」
line = "「そうだ。例の変態バニーフェチ──『欲望』のダッチが絡んでいる。私はそう睨んでいる」"

[[dialogue]]
speaker = "シュティレ"
# 「『欲望』のダッチ……アナお姉ちゃんから聞いています。相当おかしな輩だとか」
line = "「『欲望』のダッチ……アナお姉ちゃんから聞いています。相当おかしな輩だとか」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ロストアイテムについての情報も、ヘレナ様から伝え聞いております。とても驚きました……」
line = "「ロストアイテムについての情報も、ヘレナ様から伝え聞いております。とても驚きました……」"

[[dialogue]]
speaker = "アナ"
# 「……ダッチの行方を探るとなると、骨が折れそうですね」
line = "「……ダッチの行方を探るとなると、骨が折れそうですね」"

[[dialogue]]
speaker = "ヘレナ"
# 「その点は問題ない。敵はロストアイテム……強大な相手だが、それゆえに弱点も見えている」
line = "「その点は問題ない。敵はロストアイテム……強大な相手だが、それゆえに弱点も見えている」"

[[dialogue]]
speaker = "ヘレナ"
# 「このヘレナちゃんに策がある。さぁ出番だ──蘭美！！」
line = "「このヘレナちゃんに策がある。さぁ出番だ──蘭美！！」"

[[dialogue]]
speaker = "蘭美"
# 「…………し、失礼いたします」
line = "「…………し、失礼いたします」"

[[dialogue]]
speaker = "マトイ"
# 「そ、その格好は──！？」
line = "「そ、その格好は──！？」"
