[[dialogue]]
speaker = "unk"
# 第１話,新人メイドＶＳ魔王のしもべ,P
line = "第１話,新人メイドＶＳ魔王のしもべ,P"

[[dialogue]]
speaker = "unk"
# 九浄家メイド隊に『新人』が加わってから、しばらく経ったある日のこと。
line = "九浄家メイド隊に『新人』が加わってから、しばらく経ったある日のこと。"

[[dialogue]]
speaker = "unk"
# 俺はこの前出現した狼型モンスターの記録を確認しようと、大聖堂カフェテリアにある『任務管轄係』を訪ねていた。
line = "俺はこの前出現した狼型モンスターの記録を確認しようと、大聖堂カフェテリアにある『任務管轄係』を訪ねていた。"

[[dialogue]]
speaker = "狛里"
# 「あっ、魔王様～～っ！」
line = "「あっ、魔王様～～っ！」"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ♪　こんにちはであります！」
line = "「ばうわふっ♪　こんにちはであります！」"

[[dialogue]]
speaker = "unk"
# メイドの仕事中か？
line = "メイドの仕事中か？"

[[dialogue]]
speaker = "unk"
# 狛里、こんにちは
line = "狛里、こんにちは"

[[dialogue]]
speaker = "狛里"
# 「はいっ♪　ヨミ先輩と一緒に『任務管轄係』のお仕事中なのです！」
line = "「はいっ♪　ヨミ先輩と一緒に『任務管轄係』のお仕事中なのです！」"

[[dialogue]]
speaker = "unk"
# ぴしっと敬礼してみせる彼女こそ、先日、九浄家メイド隊へ加わった新人メイドの『<ruby=こまり>狛里</ruby>』。
line = "ぴしっと敬礼してみせる彼女こそ、先日、九浄家メイド隊へ加わった新人メイドの『<ruby>狛里<rt>こまり</rt></ruby>』。"

[[dialogue]]
speaker = "unk"
# 流星学園附属校へ転入してきた３年生で、現在はヨミの部下として働いている。
line = "流星学園附属校へ転入してきた３年生で、現在はヨミの部下として働いている。"

[[dialogue]]
speaker = "unk"
# 仕事にはもう慣れた？
line = "仕事にはもう慣れた？"

[[dialogue]]
speaker = "狛里"
# 「はいっ♪　ヨミ先輩がすっごく親身に教えてくれるので、とっても感謝なのです♪」
line = "「はいっ♪　ヨミ先輩がすっごく親身に教えてくれるので、とっても感謝なのです♪」"

[[dialogue]]
speaker = "unk"
# ふと、その時。
line = "ふと、その時。"

[[dialogue]]
speaker = "カティア"
# 「じ～っ……」
line = "「じ～っ……」"

[[dialogue]]
speaker = "unk"
# カフェテリアのテーブルの影に隠れて、こちらの様子を伺っている視線に気づく。
line = "カフェテリアのテーブルの影に隠れて、こちらの様子を伺っている視線に気づく。"

[[dialogue]]
speaker = "unk"
# カティア、どうしたんだ？
line = "カティア、どうしたんだ？"

[[dialogue]]
speaker = "カティア"
# 「……私と同じ犬系獣人の魔族で、魔王様と仲良くしている転入生のことを観察していたんですワン！」
line = "「……私と同じ犬系獣人の魔族で、魔王様と仲良くしている転入生のことを観察していたんですワン！」"

[[dialogue]]
speaker = "unk"
# そう言って、ひょこっと顔を出したのは、新星学園１年生の『カティア・セルベラス』であった。
line = "そう言って、ひょこっと顔を出したのは、新星学園１年生の『カティア・セルベラス』であった。"

[[dialogue]]
speaker = "カティア"
# 「最近、みんな狛里って子の話ばっかりしてるワン！」
line = "「最近、みんな狛里って子の話ばっかりしてるワン！」"

[[dialogue]]
speaker = "カティア"
# 「だから、どんな子なのか気になったんだガオ！」
line = "「だから、どんな子なのか気になったんだガオ！」"

[[dialogue]]
speaker = "狛里"
# 「初めましてなのです！　九浄家メイド所属、附属校３年生の狛里なのです！」
line = "「初めましてなのです！　九浄家メイド所属、附属校３年生の狛里なのです！」"

[[dialogue]]
speaker = "カティア"
# 「私は魔王様の第一のしもべ、新星学園１年生のカティアだワン！」
line = "「私は魔王様の第一のしもべ、新星学園１年生のカティアだワン！」"

[[dialogue]]
speaker = "狛里"
# 「カティア先輩！！」
line = "「カティア先輩！！」"

[[dialogue]]
speaker = "unk"
# 狛里の耳がぴんと立つ。
line = "狛里の耳がぴんと立つ。"

[[dialogue]]
speaker = "狛里"
# 「なるほどなのです！」
line = "「なるほどなのです！」"

[[dialogue]]
speaker = "カティア"
# 「な、何だガオ？」
line = "「な、何だガオ？」"

[[dialogue]]
speaker = "狛里"
# 「同じ犬系獣人の魔族さんなのですね！」
line = "「同じ犬系獣人の魔族さんなのですね！」"

[[dialogue]]
speaker = "カティア"
# 「そ、そうだけど……？」
line = "「そ、そうだけど……？」"

[[dialogue]]
speaker = "狛里"
# 「実は狛里、同じ獣人さんの匂いって気になっちゃうのです！」
line = "「実は狛里、同じ獣人さんの匂いって気になっちゃうのです！」"

[[dialogue]]
speaker = "カティア"
# 「ふぇ？？」
line = "「ふぇ？？」"

[[dialogue]]
speaker = "狛里"
# 「失礼するであります！」
line = "「失礼するであります！」"

[[dialogue]]
speaker = "unk"
# 狛里はずいっと顔を近づける。
line = "狛里はずいっと顔を近づける。"

[[dialogue]]
speaker = "カティア"
# 「わわっ！？　近い近い近い！？」
line = "「わわっ！？　近い近い近い！？」"

[[dialogue]]
speaker = "狛里"
# 「くんくん♪」
line = "「くんくん♪」"

[[dialogue]]
speaker = "狛里"
# 「――カティア先輩、お花みたいにいい匂いがするのです！」
line = "「――カティア先輩、お花みたいにいい匂いがするのです！」"

[[dialogue]]
speaker = "カティア"
# 「ひゃぁあぁ～！？　本当にどこの匂いを嗅いでるの！？」
line = "「ひゃぁあぁ～！？　本当にどこの匂いを嗅いでるの！？」"

[[dialogue]]
speaker = "狛里"
# 「同じ獣人さんだったので、つい気になっちゃったのです♪」
line = "「同じ獣人さんだったので、つい気になっちゃったのです♪」"

[[dialogue]]
speaker = "狛里"
# 「ちなみに、狛里は魔王様の匂いも好きなのです♪」
line = "「ちなみに、狛里は魔王様の匂いも好きなのです♪」"

[[dialogue]]
speaker = "狛里"
# 「くんくん、くんくんくん♪」
line = "「くんくん、くんくんくん♪」"

[[dialogue]]
speaker = "unk"
# 匂い嗅がれるのは恥ずかしいって！
line = "匂い嗅がれるのは恥ずかしいって！"

[[dialogue]]
speaker = "unk"
# こ、狛里……人前で全身密着して
line = "こ、狛里……人前で全身密着して"

[[dialogue]]
speaker = "カティア"
# 「ままま、魔王様相手に何やってるんですかぁ！？　そんなことして恥ずかしくないワン！？」
line = "「ままま、魔王様相手に何やってるんですかぁ！？　そんなことして恥ずかしくないワン！？」"

[[dialogue]]
speaker = "狛里"
# 「狛里は匂いを嗅ぐのが大好きなので、ついなのです♪　えへへっ♪」
line = "「狛里は匂いを嗅ぐのが大好きなので、ついなのです♪　えへへっ♪」"

[[dialogue]]
speaker = "カティア"
# 「理由になってないガオ！？」
line = "「理由になってないガオ！？」"

[[dialogue]]
speaker = "狛里"
# 「カティア先輩！」
line = "「カティア先輩！」"

[[dialogue]]
speaker = "unk"
# そう言うなり、狛里はカティアの両手をぎゅっと握る。
line = "そう言うなり、狛里はカティアの両手をぎゅっと握る。"

[[dialogue]]
speaker = "狛里"
# 「狛里、同じ獣人の魔族として、先輩と仲良くなりたいであります！」
line = "「狛里、同じ獣人の魔族として、先輩と仲良くなりたいであります！」"

[[dialogue]]
speaker = "unk"
# そう言って、狛里は繋いだ手をぶんぶんと上下に振る。
line = "そう言って、狛里は繋いだ手をぶんぶんと上下に振る。"

[[dialogue]]
speaker = "カティア"
# 「ちょっ。この子の距離感どうなってるんですか、魔王様ぁ！？」
line = "「ちょっ。この子の距離感どうなってるんですか、魔王様ぁ！？」"

[[dialogue]]
speaker = "狛里"
# 「くぅ～ん、ダメでありますか……？」
line = "「くぅ～ん、ダメでありますか……？」"

[[dialogue]]
speaker = "カティア"
# 「うぐっ……！　あまりにも純粋な瞳！」
line = "「うぐっ……！　あまりにも純粋な瞳！」"

[[dialogue]]
speaker = "カティア"
# 「でも！　そう簡単に仲良くなるわけにはいかないワン！　何故なら――」
line = "「でも！　そう簡単に仲良くなるわけにはいかないワン！　何故なら――」"

[[dialogue]]
speaker = "カティア"
# 「私と『キャラ被り』しているからっ！！」
line = "「私と『キャラ被り』しているからっ！！」"

[[dialogue]]
speaker = "狛里"
# 「キャラ被り……？」
line = "「キャラ被り……？」"

[[dialogue]]
speaker = "カティア"
# 「しかも、私はまだプリマステラになれていないのに、附属生で、転入したばかりですぐになってるし！」
line = "「しかも、私はまだプリマステラになれていないのに、附属生で、転入したばかりですぐになってるし！」"

[[dialogue]]
speaker = "カティア"
# 「魔王様ともあっという間に仲良くなってるし！」
line = "「魔王様ともあっという間に仲良くなってるし！」"

[[dialogue]]
speaker = "カティア"
# 「魔王様の第一のしもべとしてはズバリ、強敵と書いて『ライバル』なんだガオ！」
line = "「魔王様の第一のしもべとしてはズバリ、強敵と書いて『ライバル』なんだガオ！」"

[[dialogue]]
speaker = "狛里"
# 「ライバル……！」
line = "「ライバル……！」"

[[dialogue]]
speaker = "狛里"
# 「なるほどなのです！　つまり――」
line = "「なるほどなのです！　つまり――」"

[[dialogue]]
speaker = "狛里"
# 「一緒に頑張る、特別なお友達ということなのですね！」
line = "「一緒に頑張る、特別なお友達ということなのですね！」"

[[dialogue]]
speaker = "カティア"
# 「なんでそうなるワン！？」
line = "「なんでそうなるワン！？」"

[[dialogue]]
speaker = "狛里"
# 「カティア先輩と狛里は、同じ目標を追いかける者同士なのです♪」
line = "「カティア先輩と狛里は、同じ目標を追いかける者同士なのです♪」"

[[dialogue]]
speaker = "狛里"
# 「それなら、絶対に仲良しになれるということであります♪」
line = "「それなら、絶対に仲良しになれるということであります♪」"

[[dialogue]]
speaker = "カティア"
# 「解釈がポジティブすぎるっ！！！」
line = "「解釈がポジティブすぎるっ！！！」"

[[dialogue]]
speaker = "カティア"
# 「と、とにかく！　私だって必ずプリマステラになってみせるんだから、覚えてろよ～～！！」
line = "「と、とにかく！　私だって必ずプリマステラになってみせるんだから、覚えてろよ～～！！」"

[[dialogue]]
speaker = "unk"
# 数日後。
line = "数日後。"

[[dialogue]]
speaker = "狛里"
# 「カティア先輩～っ♪」
line = "「カティア先輩～っ♪」"

[[dialogue]]
speaker = "カティア"
# 「わわっ、狛里！？　ちょっ……！」
line = "「わわっ、狛里！？　ちょっ……！」"

[[dialogue]]
speaker = "unk"
# カフェテリアへ昼食しに来たカティアの姿を見つけ、嬉々として駆け寄って来る狛里。
line = "カフェテリアへ昼食しに来たカティアの姿を見つけ、嬉々として駆け寄って来る狛里。"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ♪　――くんくん、くんくん♪」
line = "「ばうわふっ♪　――くんくん、くんくん♪」"

[[dialogue]]
speaker = "カティア"
# 「きゃうっ！？　こ、こらっ！　勝手にくっ付いて、匂い嗅がないでよ！？」
line = "「きゃうっ！？　こ、こらっ！　勝手にくっ付いて、匂い嗅がないでよ！？」"

[[dialogue]]
speaker = "狛里"
# 「えへへへっ♪　狛里はカティア先輩のライバルでありますから♪」
line = "「えへへへっ♪　狛里はカティア先輩のライバルでありますから♪」"

[[dialogue]]
speaker = "カティア"
# 「本当にライバルの意味、わかってる！？」
line = "「本当にライバルの意味、わかってる！？」"

[[dialogue]]
speaker = "unk"
# こうして狛里は、持ち前の人懐っこさでカティアとあっという間に仲良く（？）なってしまうのであった。
line = "こうして狛里は、持ち前の人懐っこさでカティアとあっという間に仲良く（？）なってしまうのであった。"
