[[dialogue]]
speaker = "unk"
# 深淵書庫の力で魔界に降り立ったサランたち。
line = "深淵書庫の力で魔界に降り立ったサランたち。"

[[dialogue]]
speaker = "unk"
# その前に、モンスターの群れが立ちはだかる。
line = "その前に、モンスターの群れが立ちはだかる。"

[[dialogue]]
speaker = "モンスター"
# 「グガアァァァーーーーッ！！！」
line = "「グガアァァァーーーーッ！！！」"

[[dialogue]]
speaker = "モンスター"
# 「ギヤオオオッ！！」
line = "「ギヤオオオッ！！」"

[[dialogue]]
speaker = "カティア"
# 「うわぁ～～っ！！　モンスター思ったよりいっぱいいるーっ！？」
line = "「うわぁ～～っ！！　モンスター思ったよりいっぱいいるーっ！？」"

[[dialogue]]
speaker = "イクシリオン"
# 「カティアさん！？　どうしてここに！？」
line = "「カティアさん！？　どうしてここに！？」"

[[dialogue]]
speaker = "カティア"
# 「それは、そのぉ……」
line = "「それは、そのぉ……」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「どうせ図書館からコソコソついてきてたんでしょ。犬じゃなくてネズミみたいですね」
line = "「どうせ図書館からコソコソついてきてたんでしょ。犬じゃなくてネズミみたいですね」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「プリマステラでもないのに、本当になんでついてきたんですか？　足手まといって言葉知ってます？」
line = "「プリマステラでもないのに、本当になんでついてきたんですか？　足手まといって言葉知ってます？」"

[[dialogue]]
speaker = "イクシリオン"
# 「シャルレーヌさん、そんな言い方はよくありませんよ」
line = "「シャルレーヌさん、そんな言い方はよくありませんよ」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「いいえ、イクシリオン先輩は甘いです。命懸けの戦場で、弱い味方を庇う余裕なんてありません。サラン先輩からも言ってやってください。…………サラン先輩？」
line = "「いいえ、イクシリオン先輩は甘いです。命懸けの戦場で、弱い味方を庇う余裕なんてありません。サラン先輩からも言ってやってください。…………サラン先輩？」"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～？　モンスターたち、どこへ向かってるのかな～？　みんな、一直線に走ってるみたい～」
line = "「ぽよ～？　モンスターたち、どこへ向かってるのかな～？　みんな、一直線に走ってるみたい～」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「え、この方角は……？　──ッ！」
line = "「え、この方角は……？　──ッ！」"

[[dialogue]]
speaker = "カティア"
# 「あぁっ！　モンスターたち、たぶん町に向かってる……っ！」
line = "「あぁっ！　モンスターたち、たぶん町に向かってる……っ！」"

[[dialogue]]
speaker = "イクシリオン"
# 「そんな！　早く止めないと大惨事になります！」
line = "「そんな！　早く止めないと大惨事になります！」"

[[dialogue]]
speaker = "カティア"
# 「近くの町の戦士団に出撃してもらえれば、なんとか、なる……かな……？」
line = "「近くの町の戦士団に出撃してもらえれば、なんとか、なる……かな……？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「なりません。強力なモンスターの群れ相手では、田舎の戦士なんか手も足も出ません。足手まといが増えるだけです」
line = "「なりません。強力なモンスターの群れ相手では、田舎の戦士なんか手も足も出ません。足手まといが増えるだけです」"

[[dialogue]]
speaker = "カティア"
# 「だよねぇ……」
line = "「だよねぇ……」"

[[dialogue]]
speaker = "イクシリオン"
# 「では、やはり私たちでなんとかしないとですね。サランさん！」
line = "「では、やはり私たちでなんとかしないとですね。サランさん！」"

[[dialogue]]
speaker = "サラン"
# 「うん、サランはそのつもりだよ～」
line = "「うん、サランはそのつもりだよ～」"

[[dialogue]]
speaker = "イクシリオン"
# 「私とサランさんが前衛を務めます。シャルレーヌさんはサポートをお願いします！」
line = "「私とサランさんが前衛を務めます。シャルレーヌさんはサポートをお願いします！」"

[[dialogue]]
speaker = "サラン"
# 「わかった～」
line = "「わかった～」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「はい、かしこまりました」
line = "「はい、かしこまりました」"

[[dialogue]]
speaker = "カティア"
# 「イクシー！　私はどうすればいい？」
line = "「イクシー！　私はどうすればいい？」"

[[dialogue]]
speaker = "イクシリオン"
# 「カティアさんは……いったん隠れていてください。また後で指示を出します」
line = "「カティアさんは……いったん隠れていてください。また後で指示を出します」"

[[dialogue]]
speaker = "カティア"
# 「うん……分かった」
line = "「うん……分かった」"

[[dialogue]]
speaker = "unk"
# イクシリオンはプリマステラの中でも優秀な星騎士で、状況判断も早い。
line = "イクシリオンはプリマステラの中でも優秀な星騎士で、状況判断も早い。"

[[dialogue]]
speaker = "unk"
# そのことをカティアも理解しており、だから大人しく従った。
line = "そのことをカティアも理解しており、だから大人しく従った。"

[[dialogue]]
speaker = "サラン"
# 「じゃ、いこっか～」
line = "「じゃ、いこっか～」"

[[dialogue]]
speaker = "サラン"
# 「ホイッパースマッシュ～！」
line = "「ホイッパースマッシュ～！」"

[[dialogue]]
speaker = "モンスター"
# 「グガァッ！？」
line = "「グガァッ！？」"

[[dialogue]]
speaker = "unk"
# 魔力を秘めたメイスが先頭のモンスターを強かに打ち付ける。巨体が地面にのめり込み、衝撃で大地が揺れた。
line = "魔力を秘めたメイスが先頭のモンスターを強かに打ち付ける。巨体が地面にのめり込み、衝撃で大地が揺れた。"

[[dialogue]]
speaker = "サラン"
# 「そ～れ、もういっぱ～つ♪」
line = "「そ～れ、もういっぱ～つ♪」"

[[dialogue]]
speaker = "unk"
# モンスターが起き上がる前に追撃を加え、複数ある頭をまとめて叩き潰す。
line = "モンスターが起き上がる前に追撃を加え、複数ある頭をまとめて叩き潰す。"

[[dialogue]]
speaker = "unk"
# 普段の朗らかな雰囲気からは想像できないほどのパワーファイト。お菓子作りで培った体力が存分に発揮されていた。
line = "普段の朗らかな雰囲気からは想像できないほどのパワーファイト。お菓子作りで培った体力が存分に発揮されていた。"

[[dialogue]]
speaker = "イクシリオン"
# 「サラン先輩、いつになくパワフルで、ワイルドで、素敵です……<emoji=heart04>　私も負けていられません。はあぁっ！」
line = "「サラン先輩、いつになくパワフルで、ワイルドで、素敵です……<emoji=heart04>　私も負けていられません。はあぁっ！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「モンスターども、ディアーブルの香水に酔いしれなさい！」
line = "「モンスターども、ディアーブルの香水に酔いしれなさい！」"

[[dialogue]]
speaker = "unk"
# シャルレーヌが手榴弾のごとく香水瓶を投げると、混乱をもたらす香によって、街へ向かうモンスターの隊列を乱す。
line = "シャルレーヌが手榴弾のごとく香水瓶を投げると、混乱をもたらす香によって、街へ向かうモンスターの隊列を乱す。"

[[dialogue]]
speaker = "カティア"
# （やっぱりプリマステラは強いなぁ……かっこいいなぁ……）
line = "（やっぱりプリマステラは強いなぁ……かっこいいなぁ……）"

[[dialogue]]
speaker = "unk"
# モンスターの群れにも怯まず攻撃を仕掛ける星騎士たち。綺羅星のごとく輝く彼女たちは、まだプリマステラにもなれないカティアにとっても憧れの存在だ。
line = "モンスターの群れにも怯まず攻撃を仕掛ける星騎士たち。綺羅星のごとく輝く彼女たちは、まだプリマステラにもなれないカティアにとっても憧れの存在だ。"

[[dialogue]]
speaker = "サラン"
# 「さようなら～」
line = "「さようなら～」"

[[dialogue]]
speaker = "モンスター"
# 「ガァ……」
line = "「ガァ……」"

[[dialogue]]
speaker = "unk"
# 魔将の力を発揮し、サランがまずモンスターを倒した。
line = "魔将の力を発揮し、サランがまずモンスターを倒した。"

[[dialogue]]
speaker = "unk"
# このまま他のモンスターも……と皆が考えた瞬間──
line = "このまま他のモンスターも……と皆が考えた瞬間──"

[[dialogue]]
speaker = "モンスター"
# 「ガアァァーーーッ！！」
line = "「ガアァァーーーッ！！」"

[[dialogue]]
speaker = "unk"
# 多頭のモンスターの頭から一斉に、瘴気が噴出し始めた。
line = "多頭のモンスターの頭から一斉に、瘴気が噴出し始めた。"

[[dialogue]]
speaker = "unk"
# 大地や木々が瘴気に包まれるや否や、その形を変えていく。
line = "大地や木々が瘴気に包まれるや否や、その形を変えていく。"

[[dialogue]]
speaker = "unk"
# 瘴気に触れた大地からは見たこともない植物が生え、木々は新たなモンスターに変貌する。
line = "瘴気に触れた大地からは見たこともない植物が生え、木々は新たなモンスターに変貌する。"

[[dialogue]]
speaker = "イクシリオン"
# 「そんな……これではまるで、リクリエそのものです……」
line = "「そんな……これではまるで、リクリエそのものです……」"

[[dialogue]]
speaker = "サラン"
# 「これはよくないかも～……」
line = "「これはよくないかも～……」"

[[dialogue]]
speaker = "unk"
# 瘴気が吹きあがり、シャリオンの土地が塗り替えられていく。リクリエに染まっていく。
line = "瘴気が吹きあがり、シャリオンの土地が塗り替えられていく。リクリエに染まっていく。"

[[dialogue]]
speaker = "シャルレーヌ"
# 「くっ……！　瘴気に阻まれて香水が届かないっ！」
line = "「くっ……！　瘴気に阻まれて香水が届かないっ！」"

[[dialogue]]
speaker = "イクシリオン"
# 「こちらもダメですっ！　斬っても斬っても、瘴気が晴れません！」
line = "「こちらもダメですっ！　斬っても斬っても、瘴気が晴れません！」"

[[dialogue]]
speaker = "unk"
# 炎の斬撃が瘴気をわずかに焼くが、それだけだ。瘴気の霧は依然、大地を蝕もうとしている。
line = "炎の斬撃が瘴気をわずかに焼くが、それだけだ。瘴気の霧は依然、大地を蝕もうとしている。"

[[dialogue]]
speaker = "カティア"
# 「シャリオンが、シャリオンじゃなくなっていく……！　こんな土じゃ、何も植えられないよっ……！」
line = "「シャリオンが、シャリオンじゃなくなっていく……！　こんな土じゃ、何も植えられないよっ……！」"

[[dialogue]]
speaker = "カティア"
# 「うおおぉぉーーーーっ！！　くそ、くそぉっ！！」
line = "「うおおぉぉーーーーっ！！　くそ、くそぉっ！！」"

[[dialogue]]
speaker = "unk"
# カティアがモンスターに渾身の拳を叩き込む。けれど、モンスターがわずかに揺らぐだけで何も起きない。
line = "カティアがモンスターに渾身の拳を叩き込む。けれど、モンスターがわずかに揺らぐだけで何も起きない。"

[[dialogue]]
speaker = "モンスター"
# 「ガァッ！！」
line = "「ガァッ！！」"

[[dialogue]]
speaker = "カティア"
# 「ひっ……」
line = "「ひっ……」"

[[dialogue]]
speaker = "イクシリオン"
# 「カティアさんっ！！」
line = "「カティアさんっ！！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「このバカ……っ！」
line = "「このバカ……っ！」"

[[dialogue]]
speaker = "unk"
# カティアがモンスターにやられる間一髪のところを、シャルレーヌが咄嗟に助け出した。
line = "カティアがモンスターにやられる間一髪のところを、シャルレーヌが咄嗟に助け出した。"

[[dialogue]]
speaker = "カティア"
# 「はぁ、はぁ…………私、生きてる？」
line = "「はぁ、はぁ…………私、生きてる？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「生きてる？　じゃないわよ！　頭に小麦でも詰まってるの、この駄犬！」
line = "「生きてる？　じゃないわよ！　頭に小麦でも詰まってるの、この駄犬！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「今、戦えているのはサラン先輩だけ……私やイクシリオン先輩でさえお荷物になりかけてるのに、あんたなんか役に立つわけないでしょ！？　何考えてるのよ！！」
line = "「今、戦えているのはサラン先輩だけ……私やイクシリオン先輩でさえお荷物になりかけてるのに、あんたなんか役に立つわけないでしょ！？　何考えてるのよ！！」"

[[dialogue]]
speaker = "カティア"
# 「だって、好き勝手するモンスターが許せなくて……」
line = "「だって、好き勝手するモンスターが許せなくて……」"

[[dialogue]]
speaker = "カティア"
# 「この世界は、魔王様の領地なのに……」
line = "「この世界は、魔王様の領地なのに……」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「──は？」
line = "「──は？」"
