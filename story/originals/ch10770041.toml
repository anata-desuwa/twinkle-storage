[[dialogue]]
speaker = "unk"
# 第１話,風評被害だぴょん！！,P
line = "第１話,風評被害だぴょん！！,P"

[[dialogue]]
speaker = "unk"
# 『支配』のロストアイテム・シエスタとの騒動──事件解決の折、恋人であり婚約者でもある蘭美には、たくさん迷惑をかけてしまった。
line = "『支配』のロストアイテム・シエスタとの騒動──事件解決の折、恋人であり婚約者でもある蘭美には、たくさん迷惑をかけてしまった。"

[[dialogue]]
speaker = "unk"
# だから今日は、獅子奮迅の働きをしてくれた蘭美にお礼を言うため、星徒会室に招くことにした──
line = "だから今日は、獅子奮迅の働きをしてくれた蘭美にお礼を言うため、星徒会室に招くことにした──"

[[dialogue]]
speaker = "アナ"
# 「蘭美先輩。先日の一件、大変お世話になりました。こちら、私の目利きでチョイスした和菓子になります」
line = "「蘭美先輩。先日の一件、大変お世話になりました。こちら、私の目利きでチョイスした和菓子になります」"

[[dialogue]]
speaker = "蘭美"
# 「お礼を言われるほどのことではないわ！　それにシュティレやトリュファイナ様の協力があったからこそ勝てたのだし……」
line = "「お礼を言われるほどのことではないわ！　それにシュティレやトリュファイナ様の協力があったからこそ勝てたのだし……」"

[[dialogue]]
speaker = "マトイ"
# 「購買部の２人はお店番で忙しいみたいで。そっちは改めて時間を作るから、今日は蘭美先輩だけでもゆっくりしていってください」
line = "「購買部の２人はお店番で忙しいみたいで。そっちは改めて時間を作るから、今日は蘭美先輩だけでもゆっくりしていってください」"

[[dialogue]]
speaker = "蘭美"
# 「そういうことなら、ありがたく受け取るわ！　ん……流石はアナが選んだお茶請けね。とても上品な味……」
line = "「そういうことなら、ありがたく受け取るわ！　ん……流石はアナが選んだお茶請けね。とても上品な味……」"

[[dialogue]]
speaker = "アナ"
# 「九浄家メイド隊のメイド長をおもてなしするのですから、奮発しました。むふー」
line = "「九浄家メイド隊のメイド長をおもてなしするのですから、奮発しました。むふー」"

[[dialogue]]
speaker = "unk"
# まさかダッチと協力するとは思わなかった
line = "まさかダッチと協力するとは思わなかった"

[[dialogue]]
speaker = "蘭美"
# 「もう、本当に大変だったわ……」
line = "「もう、本当に大変だったわ……」"

[[dialogue]]
speaker = "蘭美"
# 「いちいちラパン地方の方言を出せってしつこいし、隙あらば舐めるようにバニーガール衣装を眺めてくるし……」
line = "「いちいちラパン地方の方言を出せってしつこいし、隙あらば舐めるようにバニーガール衣装を眺めてくるし……」"

[[dialogue]]
speaker = "unk"
# ……ちょっとダッチが羨ましい
line = "……ちょっとダッチが羨ましい"

[[dialogue]]
speaker = "蘭美"
# 「どういうことよ！？」
line = "「どういうことよ！？」"

[[dialogue]]
speaker = "アナ"
# 「蘭美先輩は先日の騒動以降、まったくと言っていいほどバニーガール衣装にならないですからね」
line = "「蘭美先輩は先日の騒動以降、まったくと言っていいほどバニーガール衣装にならないですからね」"

[[dialogue]]
speaker = "マトイ"
# 「恋人の立場の会長からすると、蘭美先輩の可愛い衣装を見たいって思ってるんじゃないかな？」
line = "「恋人の立場の会長からすると、蘭美先輩の可愛い衣装を見たいって思ってるんじゃないかな？」"

[[dialogue]]
speaker = "unk"
# 蘭美のバニーガール衣装、見たい！
line = "蘭美のバニーガール衣装、見たい！"

[[dialogue]]
speaker = "unk"
# その通り！！
line = "その通り！！"

[[dialogue]]
speaker = "蘭美"
# 「そう。会長の頼みなら、仕方ないわね──」
line = "「そう。会長の頼みなら、仕方ないわね──」"

[[dialogue]]
speaker = "蘭美"
# 「なんて言うと思った！？　お断りよ！！」
line = "「なんて言うと思った！？　お断りよ！！」"

[[dialogue]]
speaker = "unk"
# そんな──！？
line = "そんな──！？"

[[dialogue]]
speaker = "蘭美"
# 「バニー衣装なんて、必要がなかったら二度と着ないわ！　これはラパン出身のウサギの魔族としてのプライドよ！！」
line = "「バニー衣装なんて、必要がなかったら二度と着ないわ！　これはラパン出身のウサギの魔族としてのプライドよ！！」"

[[dialogue]]
speaker = "unk"
# でもラパン地方の伝統衣装じゃあ……
line = "でもラパン地方の伝統衣装じゃあ……"

[[dialogue]]
speaker = "蘭美"
# 「あぁあぁああっ！？　やっぱり会長も間違った情報を信じちゃってるじゃない！　この機会にちゃんと覚えなさいっ！」
line = "「あぁあぁああっ！？　やっぱり会長も間違った情報を信じちゃってるじゃない！　この機会にちゃんと覚えなさいっ！」"

[[dialogue]]
speaker = "アナ"
# 「我々も勘違いしていましたが、事実のようです。驚くべきことに、ラパン地方ではバニーガール衣装は着られないようです」
line = "「我々も勘違いしていましたが、事実のようです。驚くべきことに、ラパン地方ではバニーガール衣装は着られないようです」"

[[dialogue]]
speaker = "unk"
# そ、そうなのか……！？
line = "そ、そうなのか……！？"

[[dialogue]]
speaker = "蘭美"
# 「そうよ！　人間界で生まれた文化が、勝手に我が物顔で真実を塗りつぶしてるの！　風評被害なんだから！」
line = "「そうよ！　人間界で生まれた文化が、勝手に我が物顔で真実を塗りつぶしてるの！　風評被害なんだから！」"

[[dialogue]]
speaker = "蘭美"
# 「わかりやすく例えてあげるわ。日本にも、お寿司って文化があるでしょう？」
line = "「わかりやすく例えてあげるわ。日本にも、お寿司って文化があるでしょう？」"

[[dialogue]]
speaker = "蘭美"
# 「海外でわけのわからないアレンジがされてるお寿司を『これが日本の伝統料理だ』って勘違いしているヒトがいたら、どう思うかしら！？」
line = "「海外でわけのわからないアレンジがされてるお寿司を『これが日本の伝統料理だ』って勘違いしているヒトがいたら、どう思うかしら！？」"

[[dialogue]]
speaker = "マトイ"
# 「た、確かに訂正したくなるかも……！」
line = "「た、確かに訂正したくなるかも……！」"

[[dialogue]]
speaker = "蘭美"
# 「そうでしょう！　つまり私にバニーガールになれって言うのは、老舗の寿司屋にカリフォルニアロールを作れというのと同じことなのよ！！」
line = "「そうでしょう！　つまり私にバニーガールになれって言うのは、老舗の寿司屋にカリフォルニアロールを作れというのと同じことなのよ！！」"

[[dialogue]]
speaker = "アナ"
# 「な、なるほど。異文化交流は難しいですね……」
line = "「な、なるほど。異文化交流は難しいですね……」"

[[dialogue]]
speaker = "unk"
# そ、そんな…………
line = "そ、そんな…………"

[[dialogue]]
speaker = "unk"
# 蘭美のバニーガール、めちゃくちゃ可愛かったのに……それを求めるのは、蘭美からすると複雑なのか。
line = "蘭美のバニーガール、めちゃくちゃ可愛かったのに……それを求めるのは、蘭美からすると複雑なのか。"

[[dialogue]]
speaker = "unk"
# ちょっぴり……いや。かなり残念だ──
line = "ちょっぴり……いや。かなり残念だ──"

[[dialogue]]
speaker = "unk"
# ──後日。
line = "──後日。"

[[dialogue]]
speaker = "unk"
# はあぁあ……
line = "はあぁあ……"

[[dialogue]]
speaker = "ヘレナ"
# 「おや。まるで魂がこぼれ出そうな深いため息であるな、魔王よ？」
line = "「おや。まるで魂がこぼれ出そうな深いため息であるな、魔王よ？」"

[[dialogue]]
speaker = "ヘレナ"
# 「よいよい、みなまで言うな。魔王の背筋がぐんにゃり曲がっている理由、承知しているとも」
line = "「よいよい、みなまで言うな。魔王の背筋がぐんにゃり曲がっている理由、承知しているとも」"

[[dialogue]]
speaker = "ヘレナ"
# 「良い情報を教えてやろう。本日、九浄家のカジノで急な欠員が発生した」
line = "「良い情報を教えてやろう。本日、九浄家のカジノで急な欠員が発生した」"

[[dialogue]]
speaker = "ヘレナ"
# 「流星市国のＶＩＰを招く故、優秀な人員で補充せねばならぬ。私は蘭美を指名したぞ？」
line = "「流星市国のＶＩＰを招く故、優秀な人員で補充せねばならぬ。私は蘭美を指名したぞ？」"

[[dialogue]]
speaker = "ヘレナ"
# 「当然カジノとあらば、ドレスコードは守らなくてはならん──ふふふ♪」
line = "「当然カジノとあらば、ドレスコードは守らなくてはならん──ふふふ♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「今日だけは見られるぞ、蘭美の可憐な例の衣装をな！！」
line = "「今日だけは見られるぞ、蘭美の可憐な例の衣装をな！！」"

[[dialogue]]
speaker = "unk"
# ヘレナちゃん──ありがとう！！！
line = "ヘレナちゃん──ありがとう！！！"

[[dialogue]]
speaker = "ヘレナ"
# 「おや。あっという間に見えなくなってしまった。魔王め、よほど見たかったのだな。可愛いやつめ」
line = "「おや。あっという間に見えなくなってしまった。魔王め、よほど見たかったのだな。可愛いやつめ」"

[[dialogue]]
speaker = "蘭美"
# 「九浄家のカジノへ、ようこそいらっしゃいました！　どうぞごゆるりとお寛ぎくださいませ♪」
line = "「九浄家のカジノへ、ようこそいらっしゃいました！　どうぞごゆるりとお寛ぎくださいませ♪」"

[[dialogue]]
speaker = "蘭美"
# 「──はぁっ。当主様の無茶振りにも困ったものだわ！　まあ、市国の要人の接客となれば、私が出るのも道理ではあるけれど……」
line = "「──はぁっ。当主様の無茶振りにも困ったものだわ！　まあ、市国の要人の接客となれば、私が出るのも道理ではあるけれど……」"

[[dialogue]]
speaker = "unk"
# 蘭美！！！
line = "蘭美！！！"

[[dialogue]]
speaker = "蘭美"
# 「ぴょんっ！？　かかかっ、会長！？　どうしてここにいるぴょんっ！？」
line = "「ぴょんっ！？　かかかっ、会長！？　どうしてここにいるぴょんっ！？」"

[[dialogue]]
speaker = "蘭美"
# 「──っ！　当主様ね！　当主様が告げ口したんでしょうっ！　あぁもうっ……会長にだけは見られたくなかったのに！！」
line = "「──っ！　当主様ね！　当主様が告げ口したんでしょうっ！　あぁもうっ……会長にだけは見られたくなかったのに！！」"

[[dialogue]]
speaker = "unk"
# か、可愛い……可愛すぎる！！
line = "か、可愛い……可愛すぎる！！"

[[dialogue]]
speaker = "蘭美"
# 「そ、そんなに目をキラキラさせて、可愛いって言われても……別に嬉しくも何ともないんだからねっ！！」
line = "「そ、そんなに目をキラキラさせて、可愛いって言われても……別に嬉しくも何ともないんだからねっ！！」"

[[dialogue]]
speaker = "蘭美"
# 「も、もういいでしょう！？　私はお仕事中だから、会長はさっさと帰りなさい！」
line = "「も、もういいでしょう！？　私はお仕事中だから、会長はさっさと帰りなさい！」"

[[dialogue]]
speaker = "unk"
# 自分、写真いいっすか！？
line = "自分、写真いいっすか！？"

[[dialogue]]
speaker = "蘭美"
# 「だだだ、ダメに決まってるぴょんっ！　こんな格好してるところを保存されるだなんて……！」
line = "「だだだ、ダメに決まってるぴょんっ！　こんな格好してるところを保存されるだなんて……！」"

[[dialogue]]
speaker = "unk"
# 可愛いお嫁さんの写真が欲しいんだ！
line = "可愛いお嫁さんの写真が欲しいんだ！"

[[dialogue]]
speaker = "unk"
# お願い、１枚だけ……！
line = "お願い、１枚だけ……！"

[[dialogue]]
speaker = "蘭美"
# 「う、うぅうっ……！」
line = "「う、うぅうっ……！」"

[[dialogue]]
speaker = "蘭美"
# 「も、もう……今日だけよ！？　今日だけなんだから！！」
line = "「も、もう……今日だけよ！？　今日だけなんだから！！」"

[[dialogue]]
speaker = "蘭美"
# 「ちょ、ちょっと！　１枚だけって言ったじゃない！？　どうして連写してるの！」
line = "「ちょ、ちょっと！　１枚だけって言ったじゃない！？　どうして連写してるの！」"

[[dialogue]]
speaker = "蘭美"
# 「会長っ！　こら、もう～～～っ……！」
line = "「会長っ！　こら、もう～～～っ……！」"

[[dialogue]]
speaker = "unk"
# 恥じらいつつも、写真撮影に応じてくれた蘭美に甘えて、しっかり撮り貯めをした俺。
line = "恥じらいつつも、写真撮影に応じてくれた蘭美に甘えて、しっかり撮り貯めをした俺。"

[[dialogue]]
speaker = "unk"
# その日から、俺のＤＩＳＣの待ち受け画面はバニーガールの蘭美になるのだった──
line = "その日から、俺のＤＩＳＣの待ち受け画面はバニーガールの蘭美になるのだった──"
