[[dialogue]]
speaker = "リィベル"
# 「対象者『桜十路サラン』、適合罪科『暴食』。……魔本、貸出承認」
line = "「対象者『桜十路サラン』、適合罪科『暴食』。……魔本、貸出承認」"

[[dialogue]]
speaker = "unk"
# リィベルの宣告とともに、魔本がサランの頭上へと飛び立つ。
line = "リィベルの宣告とともに、魔本がサランの頭上へと飛び立つ。"

[[dialogue]]
speaker = "unk"
# するとページが開き、魔力がサランへと降り注いだ。
line = "するとページが開き、魔力がサランへと降り注いだ。"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～？　すごいすご～い。力が溢れてきちゃう～」
line = "「ぽよ～？　すごいすご～い。力が溢れてきちゃう～」"

[[dialogue]]
speaker = "サラン"
# 「ふわ～。体がなんだかぽかぽかするの～。これが魔将の力なのかな～」
line = "「ふわ～。体がなんだかぽかぽかするの～。これが魔将の力なのかな～」"

[[dialogue]]
speaker = "サラン"
# 「ふふっ、ふふふ～<emoji=heart04>」
line = "「ふふっ、ふふふ～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# こうしてサランは魔将への覚醒に成功した。
line = "こうしてサランは魔将への覚醒に成功した。"

[[dialogue]]
speaker = "unk"
# なぜ彼女が魔将に選ばれたのか。それは少し時を遡る──
line = "なぜ彼女が魔将に選ばれたのか。それは少し時を遡る──"

[[dialogue]]
speaker = "unk"
# 今日も新星学園の図書館は平和だった。
line = "今日も新星学園の図書館は平和だった。"

[[dialogue]]
speaker = "unk"
# 心地よい静寂が満ち、利用者は読書に勉強にと、それぞれの時間を過ごしている。
line = "心地よい静寂が満ち、利用者は読書に勉強にと、それぞれの時間を過ごしている。"

[[dialogue]]
speaker = "unk"
# だがその一方で、カウンターの裏では不穏なやりとりがあった。
line = "だがその一方で、カウンターの裏では不穏なやりとりがあった。"

[[dialogue]]
speaker = "リィベル"
# 「何かとても大切なことを忘れている……ような……」
line = "「何かとても大切なことを忘れている……ような……」"

[[dialogue]]
speaker = "ウィステリア"
# 「物忘れ？　深淵書庫の管理システムにもそんなことあるのね」
line = "「物忘れ？　深淵書庫の管理システムにもそんなことあるのね」"

[[dialogue]]
speaker = "リィベル"
# 「生身の肉体を得てしまった以上、仕方ないわ。この前も予約締切を忘れて……じゃなくて、嫌な予感がするわ。何か大きな見落としをしているような…………」
line = "「生身の肉体を得てしまった以上、仕方ないわ。この前も予約締切を忘れて……じゃなくて、嫌な予感がするわ。何か大きな見落としをしているような…………」"

[[dialogue]]
speaker = "ウィステリア"
# 「ふぅん。元凶の『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』を倒してリクリエも落ち着いたんだし、もう少し気楽に構えたら？」
line = "「ふぅん。元凶の『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』を倒してリクリエも落ち着いたんだし、もう少し気楽に構えたら？」"

[[dialogue]]
speaker = "リィベル"
# 「確かにリクリエの元凶たる『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』を倒し、世界の危機は回避された」
line = "「確かにリクリエの元凶たる『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』を倒し、世界の危機は回避された」"

[[dialogue]]
speaker = "リィベル"
# 「けれどモンスターがいる以上、リクリエは終わっていない。魔将は戦い続けるわ」
line = "「けれどモンスターがいる以上、リクリエは終わっていない。魔将は戦い続けるわ」"

[[dialogue]]
speaker = "リィベル"
# 「というか、あなたが呑気すぎるのよ。さすがは怠惰の魔将ね」
line = "「というか、あなたが呑気すぎるのよ。さすがは怠惰の魔将ね」"

[[dialogue]]
speaker = "unk"
# 竜翼の少女の名はリィベル・ビブリオテーク。
line = "竜翼の少女の名はリィベル・ビブリオテーク。"

[[dialogue]]
speaker = "unk"
# リクリエで滅ぼされた魔族の怨念を集めて作られた『深淵書庫』の管理システム──それが人格を得て実体化したものだ。
line = "リクリエで滅ぼされた魔族の怨念を集めて作られた『深淵書庫』の管理システム──それが人格を得て実体化したものだ。"

[[dialogue]]
speaker = "unk"
# 幾度も魔族を滅ぼしてきたリクリエを打倒し、魔本に秘められた無念を晴らすことこそ彼女の使命。
line = "幾度も魔族を滅ぼしてきたリクリエを打倒し、魔本に秘められた無念を晴らすことこそ彼女の使命。"

[[dialogue]]
speaker = "unk"
# 今は新星学園に所属し、図書委員として魔将の候補者を探している。
line = "今は新星学園に所属し、図書委員として魔将の候補者を探している。"

[[dialogue]]
speaker = "リィベル"
# 「これを見て」
line = "「これを見て」"

[[dialogue]]
speaker = "unk"
# リィベルが虚空に手をかざすと、３冊の魔本が現れた。
line = "リィベルが虚空に手をかざすと、３冊の魔本が現れた。"

[[dialogue]]
speaker = "unk"
# 魔本はそれぞれ禍々しい光を放っている。
line = "魔本はそれぞれ禍々しい光を放っている。"

[[dialogue]]
speaker = "ウィステリア"
# 「……呪いが活性化しているわね」
line = "「……呪いが活性化しているわね」"

[[dialogue]]
speaker = "リィベル"
# 「ええ。『暴食』『色欲』『強欲』の３つが暴走の兆しを見せている。早く適合者を探さないと、呪いが溢れだすわ」
line = "「ええ。『暴食』『色欲』『強欲』の３つが暴走の兆しを見せている。早く適合者を探さないと、呪いが溢れだすわ」"

[[dialogue]]
speaker = "unk"
# 莫大な深淵書庫の呪いを７つの大罪になぞらえて分割し、適合者に貸し出す『魔将システム』。深淵書庫の魔力を利用しながら、魔本の暴走を防ぐものだ。
line = "莫大な深淵書庫の呪いを７つの大罪になぞらえて分割し、適合者に貸し出す『魔将システム』。深淵書庫の魔力を利用しながら、魔本の暴走を防ぐものだ。"

[[dialogue]]
speaker = "unk"
# 大罪の魔本に適合し、呪いの器となる者を『魔将』と呼ぶ。
line = "大罪の魔本に適合し、呪いの器となる者を『魔将』と呼ぶ。"

[[dialogue]]
speaker = "ウィステリア"
# 「深淵書庫はこの新星学園の地下に存在している。呪いが溢れれば、学園はおろか、流星市国全域に危険が及ぶわ。それだけは避けないと」
line = "「深淵書庫はこの新星学園の地下に存在している。呪いが溢れれば、学園はおろか、流星市国全域に危険が及ぶわ。それだけは避けないと」"

[[dialogue]]
speaker = "リィベル"
# 「全てあなたが引き受けてくれればよかったのだけど」
line = "「全てあなたが引き受けてくれればよかったのだけど」"

[[dialogue]]
speaker = "ウィステリア"
# 「何度も言ってるでしょ、無理なものはむ～り。そんなことしたら廃人になっちゃうってば」
line = "「何度も言ってるでしょ、無理なものはむ～り。そんなことしたら廃人になっちゃうってば」"

[[dialogue]]
speaker = "ウィステリア"
# 「ところで紙屋敷さんは？　今日は当番の日だったでしょ。……まぁ、紙屋敷さんは当番じゃなくても毎日のようにいるけど」
line = "「ところで紙屋敷さんは？　今日は当番の日だったでしょ。……まぁ、紙屋敷さんは当番じゃなくても毎日のようにいるけど」"

[[dialogue]]
speaker = "リィベル"
# 「モネなら人を探しに出ているわ。なんでも、魔将の候補者に心当たりがあるらしいの」
line = "「モネなら人を探しに出ているわ。なんでも、魔将の候補者に心当たりがあるらしいの」"

[[dialogue]]
speaker = "ウィステリア"
# 「候補者？　カフェテリアで大食いの子でもスカウトしてくるのかしら……？」
line = "「候補者？　カフェテリアで大食いの子でもスカウトしてくるのかしら……？」"

[[dialogue]]
speaker = "リィベル"
# 「さぁ……」
line = "「さぁ……」"

[[dialogue]]
speaker = "カティア"
# （カウンターの中でウィステリアさんとリィベルが難しい話をしてる……気がする）
line = "（カウンターの中でウィステリアさんとリィベルが難しい話をしてる……気がする）"

[[dialogue]]
speaker = "カティア"
# （モネ先輩が魔将？　とかいうのになってプリマステラになれたし、私だって……！）
line = "（モネ先輩が魔将？　とかいうのになってプリマステラになれたし、私だって……！）"

[[dialogue]]
speaker = "カティア"
# （せっかく星騎士になれるって聞いて流星市国に来たのに、星力が全然伸びてないし……）
line = "（せっかく星騎士になれるって聞いて流星市国に来たのに、星力が全然伸びてないし……）"

[[dialogue]]
speaker = "カティア"
# （いくら星術の訓練しても強くならないし、当然プリマステラにもなれないし……）
line = "（いくら星術の訓練しても強くならないし、当然プリマステラにもなれないし……）"

[[dialogue]]
speaker = "カティア"
# （強い星騎士になって、ビッグな魔族になるって心に決めて故郷を出たのに、このまま弱いままは嫌だ）
line = "（強い星騎士になって、ビッグな魔族になるって心に決めて故郷を出たのに、このまま弱いままは嫌だ）"

[[dialogue]]
speaker = "カティア"
# （いい加減、私も強くなりたい！　どんな手を使ってでも強くなってやる！）
line = "（いい加減、私も強くなりたい！　どんな手を使ってでも強くなってやる！）"

[[dialogue]]
speaker = "カティア"
# （あの２人が魔将の秘密を知っているって噂だし、どうにか話を聞けないかな……？）
line = "（あの２人が魔将の秘密を知っているって噂だし、どうにか話を聞けないかな……？）"

[[dialogue]]
speaker = "モネ"
# 「ただいま戻りました～」
line = "「ただいま戻りました～」"

[[dialogue]]
speaker = "カティア"
# （わわっ、隠れなきゃっ）
line = "（わわっ、隠れなきゃっ）"

[[dialogue]]
speaker = "モネ"
# 「あれ？　今どなたかいました？」
line = "「あれ？　今どなたかいました？」"

[[dialogue]]
speaker = "リィベル"
# 「さぁ、気付かなかったけど」
line = "「さぁ、気付かなかったけど」"

[[dialogue]]
speaker = "ウィステリア"
# 「あら？　紙屋敷さんが連れてきたのって──」
line = "「あら？　紙屋敷さんが連れてきたのって──」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「初めまして……になるでしょうか。流星学園附属１年生、シャルレーヌ・ディアーブルと申します」
line = "「初めまして……になるでしょうか。流星学園附属１年生、シャルレーヌ・ディアーブルと申します」"
