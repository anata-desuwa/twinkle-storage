[[dialogue]]
speaker = "unk"
# 第１話,魔王としもべのご関係,P
line = "第１話,魔王としもべのご関係,P"

[[dialogue]]
speaker = "unk"
# 昼時のカフェテリアはいつも込み合っている。空いている席を探していると──
line = "昼時のカフェテリアはいつも込み合っている。空いている席を探していると──"

[[dialogue]]
speaker = "カティア"
# 「魔王様～、こっちこっちー！」
line = "「魔王様～、こっちこっちー！」"

[[dialogue]]
speaker = "unk"
# カティアに声をかけられた。イクシリオンとサランも一緒だ。
line = "カティアに声をかけられた。イクシリオンとサランも一緒だ。"

[[dialogue]]
speaker = "unk"
# 相席いいかな？
line = "相席いいかな？"

[[dialogue]]
speaker = "イクシリオン"
# 「はい、会長なら大歓迎ですよ」
line = "「はい、会長なら大歓迎ですよ」"

[[dialogue]]
speaker = "サラン"
# 「ど～ぞど～ぞ～」
line = "「ど～ぞど～ぞ～」"

[[dialogue]]
speaker = "unk"
# ２人のお許しも得たところで、カティアの隣に座る。
line = "２人のお許しも得たところで、カティアの隣に座る。"

[[dialogue]]
speaker = "カティア"
# 「新たに魔将になった３人でごはんしてたんですよ。いわゆる同期？　ってやつですワン」
line = "「新たに魔将になった３人でごはんしてたんですよ。いわゆる同期？　ってやつですワン」"

[[dialogue]]
speaker = "イクシリオン"
# 「カティアさんとは以前からお友達でしたけど、魔将になってサランさんとお話する機会が増えて、とても嬉しいです」
line = "「カティアさんとは以前からお友達でしたけど、魔将になってサランさんとお話する機会が増えて、とても嬉しいです」"

[[dialogue]]
speaker = "サラン"
# 「えへへ～、そう言ってくれるとサランも嬉しいな～。２人ともたくさん食べてくれるから大好き～♪」
line = "「えへへ～、そう言ってくれるとサランも嬉しいな～。２人ともたくさん食べてくれるから大好き～♪」"

[[dialogue]]
speaker = "カティア"
# 「サラン先輩、最近は昔の魔界料理の研究に凝ってて、何度か試作品を食べさせてもらったんですけど、それがもう本当に美味しいんです」
line = "「サラン先輩、最近は昔の魔界料理の研究に凝ってて、何度か試作品を食べさせてもらったんですけど、それがもう本当に美味しいんです」"

[[dialogue]]
speaker = "イクシリオン"
# 「この前食べさせていただいたケーキも絶品でしたね。不思議な香りで、食欲をそそるんですよ。あれは初めての衝撃でした」
line = "「この前食べさせていただいたケーキも絶品でしたね。不思議な香りで、食欲をそそるんですよ。あれは初めての衝撃でした」"

[[dialogue]]
speaker = "unk"
# （そんなに美味しいなら食べてみたかった……）
line = "（そんなに美味しいなら食べてみたかった……）"

[[dialogue]]
speaker = "サラン"
# 「完成したら、カフェテリアのメニューにも追加されるよ～。いつでも食べられるようになるから安心してね～」
line = "「完成したら、カフェテリアのメニューにも追加されるよ～。いつでも食べられるようになるから安心してね～」"

[[dialogue]]
speaker = "unk"
# どうやら顔に出ていたようだ。ちょっと恥ずかしい。
line = "どうやら顔に出ていたようだ。ちょっと恥ずかしい。"

[[dialogue]]
speaker = "イクシリオン"
# 「ところで、会長とカティアさんのおふたりが揃ったので聞いてみたいことがあるんですが、よろしいでしょうか？」
line = "「ところで、会長とカティアさんのおふたりが揃ったので聞いてみたいことがあるんですが、よろしいでしょうか？」"

[[dialogue]]
speaker = "カティア"
# 「うん。いいけど、なに？」
line = "「うん。いいけど、なに？」"

[[dialogue]]
speaker = "イクシリオン"
# 「カティアさんは魔王……つまり会長の配下だそうですが」
line = "「カティアさんは魔王……つまり会長の配下だそうですが」"

[[dialogue]]
speaker = "カティア"
# 「そうだよ。それがどうかした？」
line = "「そうだよ。それがどうかした？」"

[[dialogue]]
speaker = "イクシリオン"
# 「実際、男女としてはどこまでいっていらっしゃるんでしょうか？」
line = "「実際、男女としてはどこまでいっていらっしゃるんでしょうか？」"

[[dialogue]]
speaker = "カティア"
# 「ぶはっ！？　なに言ってるのイクシー！？」
line = "「ぶはっ！？　なに言ってるのイクシー！？」"

[[dialogue]]
speaker = "イクシリオン"
# 「え、違うんですか？　てっきりそういうご関係かと……」
line = "「え、違うんですか？　てっきりそういうご関係かと……」"

[[dialogue]]
speaker = "サラン"
# 「サランもそう思ってた～。会長ちゃんとカティアちゃん、お付き合いしてるんじゃないの～？」
line = "「サランもそう思ってた～。会長ちゃんとカティアちゃん、お付き合いしてるんじゃないの～？」"

[[dialogue]]
speaker = "カティア"
# 「サラン先輩まで！？　そういうのじゃないですよ！」
line = "「サラン先輩まで！？　そういうのじゃないですよ！」"

[[dialogue]]
speaker = "サラン"
# 「でもでも～、カティアちゃんは会長ちゃんが大好きなんだよね～？」
line = "「でもでも～、カティアちゃんは会長ちゃんが大好きなんだよね～？」"

[[dialogue]]
speaker = "カティア"
# 「それはもちろん……大好きですけど……でも、私が魔王様とお付き合いなんて畏れ多いですワン……」
line = "「それはもちろん……大好きですけど……でも、私が魔王様とお付き合いなんて畏れ多いですワン……」"

[[dialogue]]
speaker = "サラン"
# 「そうなの～？　じゃあ会長ちゃんは～？　カティアちゃんのこと大好き～？」
line = "「そうなの～？　じゃあ会長ちゃんは～？　カティアちゃんのこと大好き～？」"

[[dialogue]]
speaker = "unk"
# うん、大好き
line = "うん、大好き"

[[dialogue]]
speaker = "カティア"
# 「ふええぇっ！？　そうなんですか！？」
line = "「ふええぇっ！？　そうなんですか！？」"

[[dialogue]]
speaker = "unk"
# 当たり前だ。そうでなければこんなに傍にいない。
line = "当たり前だ。そうでなければこんなに傍にいない。"

[[dialogue]]
speaker = "サラン"
# 「だって～、カティアちゃん？」
line = "「だって～、カティアちゃん？」"

[[dialogue]]
speaker = "unk"
# カティアとははっきり恋人とは言ってないけど、なんだかんだずっと一緒にいる。気持ちは伝わっていると思ったけど、そうじゃなかったみたいだ。
line = "カティアとははっきり恋人とは言ってないけど、なんだかんだずっと一緒にいる。気持ちは伝わっていると思ったけど、そうじゃなかったみたいだ。"

[[dialogue]]
speaker = "カティア"
# 「えっと、えっと……私たち、両想いなんですよね……？」
line = "「えっと、えっと……私たち、両想いなんですよね……？」"

[[dialogue]]
speaker = "unk"
# そうみたい
line = "そうみたい"

[[dialogue]]
speaker = "カティア"
# 「じゃ、じゃあ……これからは、恋人兼配下として、今後ともよろしくお願いします…………ワン」
line = "「じゃ、じゃあ……これからは、恋人兼配下として、今後ともよろしくお願いします…………ワン」"

[[dialogue]]
speaker = "unk"
# こちらこそ、よろしく
line = "こちらこそ、よろしく"

[[dialogue]]
speaker = "イクシリオン"
# 「カティアさん、おめでとうございます！」
line = "「カティアさん、おめでとうございます！」"

[[dialogue]]
speaker = "サラン"
# 「ウェディングケーキは任せてね～。腕によりをかけて作るから～」
line = "「ウェディングケーキは任せてね～。腕によりをかけて作るから～」"

[[dialogue]]
speaker = "カティア"
# 「サラン先輩、気が早いですよ！？」
line = "「サラン先輩、気が早いですよ！？」"

[[dialogue]]
speaker = "イクシリオン"
# 「ハッ……恋人兼配下ということは、逆らえないのをいいことにエッチな命令をされたり、逆に身も心も屈服してエッチなおねだりしたり……っ！」
line = "「ハッ……恋人兼配下ということは、逆らえないのをいいことにエッチな命令をされたり、逆に身も心も屈服してエッチなおねだりしたり……っ！」"

[[dialogue]]
speaker = "カティア"
# 「……イクシー、キモい」
line = "「……イクシー、キモい」"

[[dialogue]]
speaker = "イクシリオン"
# 「すみません、大変失礼しましたぁ！」
line = "「すみません、大変失礼しましたぁ！」"

[[dialogue]]
speaker = "カティア"
# 「失礼どころじゃないって！　まったく……イクシーって本当にむっつりドスケベなんだって実感したよ……」
line = "「失礼どころじゃないって！　まったく……イクシーって本当にむっつりドスケベなんだって実感したよ……」"

[[dialogue]]
speaker = "イクシリオン"
# 「はい。それはもう」
line = "「はい。それはもう」"

[[dialogue]]
speaker = "カティア"
# 「なんでドヤ顔！？」
line = "「なんでドヤ顔！？」"

[[dialogue]]
speaker = "イクシリオン"
# 「嘘偽りない自分自身を晒すことでしか得られないものがあると、他でもないカティアさんから学びましたから！」
line = "「嘘偽りない自分自身を晒すことでしか得られないものがあると、他でもないカティアさんから学びましたから！」"

[[dialogue]]
speaker = "unk"
# 何かあったの……？
line = "何かあったの……？"

[[dialogue]]
speaker = "カティア"
# 「私まで変態に誤解されるから、その言い方やめて！　違うんですよ魔王様～！！」
line = "「私まで変態に誤解されるから、その言い方やめて！　違うんですよ魔王様～！！」"

[[dialogue]]
speaker = "サラン"
# 「カティアちゃんとイクシーちゃんはとっても仲良しだね～♪」
line = "「カティアちゃんとイクシーちゃんはとっても仲良しだね～♪」"

[[dialogue]]
speaker = "カティア"
# 「違わないけど違うんです～！　こんな変態と一緒にしないでくださ～い！」
line = "「違わないけど違うんです～！　こんな変態と一緒にしないでくださ～い！」"

[[dialogue]]
speaker = "イクシリオン"
# 「はぁ、はぁ……もっと言ってくださいぃ……」
line = "「はぁ、はぁ……もっと言ってくださいぃ……」"

[[dialogue]]
speaker = "カティア"
# 「もぉ～！　イクシーのバカ～！！」
line = "「もぉ～！　イクシーのバカ～！！」"

[[dialogue]]
speaker = "unk"
# 放課後、カティアと時間を合わせて下校する。前は寮に送ると理由を付けていたけど、今はただの習慣になっていた。
line = "放課後、カティアと時間を合わせて下校する。前は寮に送ると理由を付けていたけど、今はただの習慣になっていた。"

[[dialogue]]
speaker = "カティア"
# 「魔王様、えっと、その……」
line = "「魔王様、えっと、その……」"

[[dialogue]]
speaker = "unk"
# カティア、好きだよ
line = "カティア、好きだよ"

[[dialogue]]
speaker = "カティア"
# 「っ！」
line = "「っ！」"

[[dialogue]]
speaker = "unk"
# さっきは話の流れで少し適当になってしまったから、改めて口にする。
line = "さっきは話の流れで少し適当になってしまったから、改めて口にする。"

[[dialogue]]
speaker = "unk"
# 逆に、あんな流れでもないと気持ちを表せなかったかもしれないけど。
line = "逆に、あんな流れでもないと気持ちを表せなかったかもしれないけど。"

[[dialogue]]
speaker = "カティア"
# 「えへへ、私も好きですっ！」
line = "「えへへ、私も好きですっ！」"

[[dialogue]]
speaker = "unk"
# そう言って、俺の差し出した手を握るカティア。この温かい手を、一生忘れないと思う。
line = "そう言って、俺の差し出した手を握るカティア。この温かい手を、一生忘れないと思う。"
