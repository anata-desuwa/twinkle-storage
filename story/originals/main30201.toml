[[dialogue]]
speaker = "unk"
# 第１話,『ルヴィネの修行方針』,B
line = "第１話,『ルヴィネの修行方針』,B"

[[dialogue]]
speaker = "ルヴィネ"
# 「さて……次に私がすべきことは何かしら」
line = "「さて……次に私がすべきことは何かしら」"

[[dialogue]]
speaker = "unk"
# 端末でスケジュールを確認しながらルヴィネが呟く。
line = "端末でスケジュールを確認しながらルヴィネが呟く。"

[[dialogue]]
speaker = "ルヴィネ"
# 「女神として十全に役目を果たすため、人間界で学べることは徹底的に学んでおきたいわ」
line = "「女神として十全に役目を果たすため、人間界で学べることは徹底的に学んでおきたいわ」"

[[dialogue]]
speaker = "マグダレナ"
# 「ルヴィネ様……」
line = "「ルヴィネ様……」"

[[dialogue]]
speaker = "unk"
# ルヴィネの言葉にマグダレナがやんわりと声をかける。
line = "ルヴィネの言葉にマグダレナがやんわりと声をかける。"

[[dialogue]]
speaker = "unk"
# この日、ルヴィネの仕事を補佐するため、アルタイルの守護天使であるマグダレナがデネブに来ていた。
line = "この日、ルヴィネの仕事を補佐するため、アルタイルの守護天使であるマグダレナがデネブに来ていた。"

[[dialogue]]
speaker = "unk"
# 現在、デネブ側の守護天使たちは皆、コアで休眠状態となっている。
line = "現在、デネブ側の守護天使たちは皆、コアで休眠状態となっている。"

[[dialogue]]
speaker = "unk"
# そのためマグダレナら守護天使が平行世界の移動を行っても、問題は起こらないと確認されていた。
line = "そのためマグダレナら守護天使が平行世界の移動を行っても、問題は起こらないと確認されていた。"

[[dialogue]]
speaker = "マグダレナ"
# 「テルル様はルヴィネ様に、ヒトとして過ごす時間を設けました」
line = "「テルル様はルヴィネ様に、ヒトとして過ごす時間を設けました」"

[[dialogue]]
speaker = "マグダレナ"
# 「ですが、その『修業期間』とは言葉通りの意味では無いように思います」
line = "「ですが、その『修業期間』とは言葉通りの意味では無いように思います」"

[[dialogue]]
speaker = "マグダレナ"
# 「極星学園の皆様と、青春を謳歌して頂くこと──それこそが先代の本意なのですから、そう気負わないでください」
line = "「極星学園の皆様と、青春を謳歌して頂くこと──それこそが先代の本意なのですから、そう気負わないでください」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ええ、それは理解しているつもりよ。けれど、何かをしていないと落ち着かない性分なの」
line = "「ええ、それは理解しているつもりよ。けれど、何かをしていないと落ち着かない性分なの」"

[[dialogue]]
speaker = "ルヴィネ"
# 「根を詰めて修行をするつもりはないけれど、つい目標や目的が欲しいと思ってしまうのよ」
line = "「根を詰めて修行をするつもりはないけれど、つい目標や目的が欲しいと思ってしまうのよ」"

[[dialogue]]
speaker = "マグダレナ"
# 「であれば、『女神としての修行』や『女神としての責務』ではなく──」
line = "「であれば、『女神としての修行』や『女神としての責務』ではなく──」"

[[dialogue]]
speaker = "マグダレナ"
# 「『この世界に生きるひとりの天使として、色々なことに主観的に関わる、挑戦する』という方針で行動するのはいかがでしょう？」
line = "「『この世界に生きるひとりの天使として、色々なことに主観的に関わる、挑戦する』という方針で行動するのはいかがでしょう？」"

[[dialogue]]
speaker = "マグダレナ"
# 「先日のオオヒメと同じことです。実際に生きている人々と交わり、経験を重ねること。その過程で人々から何かを学ぶこと」
line = "「先日のオオヒメと同じことです。実際に生きている人々と交わり、経験を重ねること。その過程で人々から何かを学ぶこと」"

[[dialogue]]
speaker = "マグダレナ"
# 「テルル様がルヴィネ様に望まれた『修業』は、そういった事なのではないかと思うのです」
line = "「テルル様がルヴィネ様に望まれた『修業』は、そういった事なのではないかと思うのです」"

[[dialogue]]
speaker = "ルヴィネ"
# 「……確かに、先日、流星学園の附属校に体験入学してみて、学んだわ」
line = "「……確かに、先日、流星学園の附属校に体験入学してみて、学んだわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「関係の無い、第三者として校内を視察しただけでは、気付けなかっただろうと思うことも多かった」
line = "「関係の無い、第三者として校内を視察しただけでは、気付けなかっただろうと思うことも多かった」"

[[dialogue]]
speaker = "ルヴィネ"
# 「突然附属生にされて、小さな同級生がたくさん出来てしまって、どうしようかと思う瞬間もあったけれど……」
line = "「突然附属生にされて、小さな同級生がたくさん出来てしまって、どうしようかと思う瞬間もあったけれど……」"

[[dialogue]]
speaker = "ルヴィネ"
# 「主観的に関わる──その重要性は身に染みて理解したわ」
line = "「主観的に関わる──その重要性は身に染みて理解したわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「そうね、今後の私の行動方針としては、それを掲げるのがいいのかもしれないわね」
line = "「そうね、今後の私の行動方針としては、それを掲げるのがいいのかもしれないわね」"

[[dialogue]]
speaker = "マグダレナ"
# 「例えば、ですが……今なら丁度ハロウィンが近い時期です。まずはそれを体験してみてはいかがでしょう？」
line = "「例えば、ですが……今なら丁度ハロウィンが近い時期です。まずはそれを体験してみてはいかがでしょう？」"

[[dialogue]]
speaker = "マグダレナ"
# 「アルタイルにはハロウィンに詳しい方々がいます」
line = "「アルタイルにはハロウィンに詳しい方々がいます」"

[[dialogue]]
speaker = "マグダレナ"
# 「彼女たちにハロウィンの盛り上げ方を相談して、デネブのハロウィンもアルタイルに負けないよう盛り上げる、というのも良いかもしれません」
line = "「彼女たちにハロウィンの盛り上げ方を相談して、デネブのハロウィンもアルタイルに負けないよう盛り上げる、というのも良いかもしれません」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ふふ……いいわね、それ」
line = "「ふふ……いいわね、それ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「デネブにもハロウィンの習慣はあるけれど、お祭りとして大々的に盛り上げる、といったことは久しく行っていないわ」
line = "「デネブにもハロウィンの習慣はあるけれど、お祭りとして大々的に盛り上げる、といったことは久しく行っていないわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「今年からは極星学園星徒会として、改めてハロウィンが盛り上がるように頑張ってみようかしら」
line = "「今年からは極星学園星徒会として、改めてハロウィンが盛り上がるように頑張ってみようかしら」"

[[dialogue]]
speaker = "マグダレナ"
# 「きっと皆様も喜ぶでしょう」
line = "「きっと皆様も喜ぶでしょう」"

[[dialogue]]
speaker = "ルヴィネ"
# 「やりがいがありそうね」
line = "「やりがいがありそうね」"

[[dialogue]]
speaker = "マグダレナ"
# 「ではアルタイルの有識者に連絡を取り、ハロウィンの事前調査が行えるようにしておきますね」
line = "「ではアルタイルの有識者に連絡を取り、ハロウィンの事前調査が行えるようにしておきますね」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ええ、手配は任せるわ。よろしく頼むわね」
line = "「ええ、手配は任せるわ。よろしく頼むわね」"

[[dialogue]]
speaker = "unk"
# それから数日後、ルヴィネがアルタイルにやってきた。
line = "それから数日後、ルヴィネがアルタイルにやってきた。"

[[dialogue]]
speaker = "unk"
# 目的はハロウィンについて勉強するためだ。
line = "目的はハロウィンについて勉強するためだ。"

[[dialogue]]
speaker = "マグダレナ"
# 「こちらでしばらくお待ちください」
line = "「こちらでしばらくお待ちください」"

[[dialogue]]
speaker = "ルヴィネ"
# 「キャナンシー、と言ったかしら？　マグダレナの言うハロウィンの有識者というのは」
line = "「キャナンシー、と言ったかしら？　マグダレナの言うハロウィンの有識者というのは」"

[[dialogue]]
speaker = "マグダレナ"
# 「はい。流星学園と新星学園は毎回、共同でハロウィンパーティーを開催しているのですが──」
line = "「はい。流星学園と新星学園は毎回、共同でハロウィンパーティーを開催しているのですが──」"

[[dialogue]]
speaker = "マグダレナ"
# 「実行委員長として、そのパーティーを始めとしたハロウィン関連の行事を取り仕切っているのが<ruby=うりひめ>瓜姫</ruby>キャナンシーさまです」
line = "「実行委員長として、そのパーティーを始めとしたハロウィン関連の行事を取り仕切っているのが<ruby>瓜姫<rt>うりひめ</rt></ruby>キャナンシーさまです」"

[[dialogue]]
speaker = "マグダレナ"
# 「後はジャクリーヌさまからもお話も聞くことが出来るとのことでした」
line = "「後はジャクリーヌさまからもお話も聞くことが出来るとのことでした」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ジャクリーヌ？　それはどんなヒトなのかしら？」
line = "「ジャクリーヌ？　それはどんなヒトなのかしら？」"

[[dialogue]]
speaker = "マグダレナ"
# 「ハロウィンの化身、ジャック・オー・ランタンさまのご息女です。新星学園の１年に在籍していらっしゃいます」
line = "「ハロウィンの化身、ジャック・オー・ランタンさまのご息女です。新星学園の１年に在籍していらっしゃいます」"

[[dialogue]]
speaker = "ルヴィネ"
# 「そんなヒトまで、この学園にはいるのね」
line = "「そんなヒトまで、この学園にはいるのね」"

[[dialogue]]
speaker = "ルヴィネ"
# 「けれど思っていた以上にいろいろ聞くことが出来そうで、楽しみだわ」
line = "「けれど思っていた以上にいろいろ聞くことが出来そうで、楽しみだわ」"

[[dialogue]]
speaker = "キャナンシー"
# 「あっらぁ～、光栄だわぁ～♪　ハロウィンにそぉ～んな関心を持っていただけるなんてぇ～♪」
line = "「あっらぁ～、光栄だわぁ～♪　ハロウィンにそぉ～んな関心を持っていただけるなんてぇ～♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「……！？」
line = "「……！？」"

[[dialogue]]
speaker = "マグダレナ"
# 「ルヴィネ様、こちらがキャナンシーさまです」
line = "「ルヴィネ様、こちらがキャナンシーさまです」"

[[dialogue]]
speaker = "キャナンシー"
# 「お待たせしてしまいましたわぁ～！　私、ハロウィン実行委員会会長のキャナンシーよぉ～、よろしくねぇ～♪」
line = "「お待たせしてしまいましたわぁ～！　私、ハロウィン実行委員会会長のキャナンシーよぉ～、よろしくねぇ～♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「極星星徒会長ルヴィネよ。ハロウィンのいろはについて学ばせてもらうわ」
line = "「極星星徒会長ルヴィネよ。ハロウィンのいろはについて学ばせてもらうわ」"

[[dialogue]]
speaker = "キャナンシー"
# 「まかせてちょうだぁ～い♪　ハロウィンの素晴らしさについて、たぁ～っぷりお勉強していってもらうわぁ～♪」
line = "「まかせてちょうだぁ～い♪　ハロウィンの素晴らしさについて、たぁ～っぷりお勉強していってもらうわぁ～♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「よ、よろしく……」
line = "「よ、よろしく……」"

[[dialogue]]
speaker = "キャナンシー"
# 「ゆ～っくりお話しできるように、スゥイ～トなルームを借り切っているのよぉ～♪」
line = "「ゆ～っくりお話しできるように、スゥイ～トなルームを借り切っているのよぉ～♪」"

[[dialogue]]
speaker = "キャナンシー"
# 「さぁさぁ行きましょぉ～ん♪　ハロウィンの魅力、たぁ～っぷり教えちゃうんだからぁ～♪」
line = "「さぁさぁ行きましょぉ～ん♪　ハロウィンの魅力、たぁ～っぷり教えちゃうんだからぁ～♪」"

[[dialogue]]
speaker = "マグダレナ"
# 「ではキャナンシーさま。よろしくお願いします」
line = "「ではキャナンシーさま。よろしくお願いします」"

[[dialogue]]
speaker = "キャナンシー"
# 「まかせてぇ～♪　さ、参りましょ～っ♪」
line = "「まかせてぇ～♪　さ、参りましょ～っ♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ひゃ、わぁああああーーーっ！！！！」
line = "「ひゃ、わぁああああーーーっ！！！！」"

[[dialogue]]
speaker = "unk"
# こうしてキャナンシーによってルヴィネはさらわれ──
line = "こうしてキャナンシーによってルヴィネはさらわれ──"

[[dialogue]]
speaker = "unk"
# もとい、キャナンシーの用意したスイートルームへ案内され、ハロウィンの何たるかについて教え込まれるのだった。
line = "もとい、キャナンシーの用意したスイートルームへ案内され、ハロウィンの何たるかについて教え込まれるのだった。"
