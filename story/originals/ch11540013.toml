[[dialogue]]
speaker = "unk"
# 第３話,ダブルヘレナと大人の飲み会,P
line = "第３話,ダブルヘレナと大人の飲み会,P"

[[dialogue]]
speaker = "unk"
# その日、こちらの世界のヘレナちゃんの提案で、『大人の飲み会』が開かれることになった。
line = "その日、こちらの世界のヘレナちゃんの提案で、『大人の飲み会』が開かれることになった。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「わざわざ他の人たちにも声をかけてくれてありがとね、ヘレナちゃん♪」
line = "「わざわざ他の人たちにも声をかけてくれてありがとね、ヘレナちゃん♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「気にするな。せっかく飲み会をするのならば、賑やかな方が好みであろう？」
line = "「気にするな。せっかく飲み会をするのならば、賑やかな方が好みであろう？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「さっすが、異世界の私♪　わかってるわね～」
line = "「さっすが、異世界の私♪　わかってるわね～」"

[[dialogue]]
speaker = "ヘレナ"
# 「というわけで――今回は『酒飲み三銃士』を呼んでおいたぞ」
line = "「というわけで――今回は『酒飲み三銃士』を呼んでおいたぞ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「酒飲み三銃士？」
line = "「酒飲み三銃士？」"

[[dialogue]]
speaker = "マリオン"
# 「ふふっ♪　本日はお招き頂きましてありがとうございます、ヘレナ様♪」
line = "「ふふっ♪　本日はお招き頂きましてありがとうございます、ヘレナ様♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「まずは、自らの人形を作り出す能力によって、酔えば交代してリセットができるマリオン・ネイマール」
line = "「まずは、自らの人形を作り出す能力によって、酔えば交代してリセットができるマリオン・ネイマール」"

[[dialogue]]
speaker = "リコリンフィア"
# 「異世界のヘレナと酒が飲めるとは、面白いな。今日はよろしく頼む」
line = "「異世界のヘレナと酒が飲めるとは、面白いな。今日はよろしく頼む」"

[[dialogue]]
speaker = "ヘレナ"
# 「続いて、毒を操る星騎士で、体内のアルコールを自在に分解できるリコリンフィア」
line = "「続いて、毒を操る星騎士で、体内のアルコールを自在に分解できるリコリンフィア」"

[[dialogue]]
speaker = "トワ先生"
# 「ええっと……ヘレナ理事長？　『酒飲み三銃士』って呼び名、初めて聞いたんですけど……」
line = "「ええっと……ヘレナ理事長？　『酒飲み三銃士』って呼び名、初めて聞いたんですけど……」"

[[dialogue]]
speaker = "ヘレナ"
# 「そして、新星学園の教師で、どれだけ酔っても短時間で自動回復できる特殊体質の、トワちゃん先生だ」
line = "「そして、新星学園の教師で、どれだけ酔っても短時間で自動回復できる特殊体質の、トワちゃん先生だ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「わお♪　みんな可愛い子ばっかり♪」
line = "「わお♪　みんな可愛い子ばっかり♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「ちなみに３人共、実はこう見えて、お前より年上なのだぞ」
line = "「ちなみに３人共、実はこう見えて、お前より年上なのだぞ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「えっ！？　そうなの！？　こんなに可愛いのに！？」
line = "「えっ！？　そうなの！？　こんなに可愛いのに！？」"

[[dialogue]]
speaker = "マリオン"
# 「ふふっ♪　異世界のヘレナ様も、とてもお可愛らしいですよ<emoji=heart04>」
line = "「ふふっ♪　異世界のヘレナ様も、とてもお可愛らしいですよ<emoji=heart04>」"

[[dialogue]]
speaker = "トワ先生"
# 「いや～、可愛いって言われると照れるな～……えへへへ<emoji=heart04>」
line = "「いや～、可愛いって言われると照れるな～……えへへへ<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ごめんなさい！　先輩方相手にタメ口を使っちゃって、失礼しました～」
line = "「ごめんなさい！　先輩方相手にタメ口を使っちゃって、失礼しました～」"

[[dialogue]]
speaker = "リコリンフィア"
# 「いや、別に構わんさ。こちらの世界のヘレナと同じように接した方が、私としても楽だからな」
line = "「いや、別に構わんさ。こちらの世界のヘレナと同じように接した方が、私としても楽だからな」"

[[dialogue]]
speaker = "マリオン"
# 「ふふっ、私は普段からこんな喋り方ですが、ヘレナ様はどうぞ自然体で話されて下さい。その方がよりお可愛らしいでしょうから♪」
line = "「ふふっ、私は普段からこんな喋り方ですが、ヘレナ様はどうぞ自然体で話されて下さい。その方がよりお可愛らしいでしょうから♪」"

[[dialogue]]
speaker = "トワ先生"
# 「私にもあんまり気にしなくて大丈夫だよ～。これから一緒に仲良く、お酒飲むんだしね♪」
line = "「私にもあんまり気にしなくて大丈夫だよ～。これから一緒に仲良く、お酒飲むんだしね♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「先輩方、優しい～♪　じゃあお言葉に甘えて、今日はよろしくお願いしますね～♪」
line = "「先輩方、優しい～♪　じゃあお言葉に甘えて、今日はよろしくお願いしますね～♪」"

[[dialogue]]
speaker = "unk"
# そうして、大人の飲み会が始まって少し経つ頃には、ヘレナはすっかり３人と打ち解けていた。
line = "そうして、大人の飲み会が始まって少し経つ頃には、ヘレナはすっかり３人と打ち解けていた。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ぷはぁ～っ♪　みんな、お酒が強くてすごく楽しいわ～♪」
line = "「ぷはぁ～っ♪　みんな、お酒が強くてすごく楽しいわ～♪」"

[[dialogue]]
speaker = "リコリンフィア"
# 「どうやら、異世界のヘレナも、こっちのヘレナと同じく大した『酒豪』のようだな」
line = "「どうやら、異世界のヘレナも、こっちのヘレナと同じく大した『酒豪』のようだな」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむ。酒の好みは少々違っていたりするがな」
line = "「うむ。酒の好みは少々違っていたりするがな」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ、男の好みもね～。これも、ヘレナちゃんの言っていた『鏡映し』ってやつなのかしら？」
line = "「ふふっ、男の好みもね～。これも、ヘレナちゃんの言っていた『鏡映し』ってやつなのかしら？」"

[[dialogue]]
speaker = "マリオン"
# 「こちらの世界のヘレナ様は、私と同じで年下の可愛い子がお好みでしたね♪」
line = "「こちらの世界のヘレナ様は、私と同じで年下の可愛い子がお好みでしたね♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「え～、マリオンちゃんもそうなの～？　私は渋くてダンディーな年上のオジサマ派なんだけどな～。リコリンちゃんと、トワちゃんは？」
line = "「え～、マリオンちゃんもそうなの～？　私は渋くてダンディーな年上のオジサマ派なんだけどな～。リコリンちゃんと、トワちゃんは？」"

[[dialogue]]
speaker = "リコリンフィア"
# 「私はこれまであまり恋愛は考えたことがなかったが……最近は、年下もアリかと思い始めていてな。トワもそうだろう？」
line = "「私はこれまであまり恋愛は考えたことがなかったが……最近は、年下もアリかと思い始めていてな。トワもそうだろう？」"

[[dialogue]]
speaker = "トワ先生"
# 「えっ！？　いやいや、私は教師だからね！？　と、年下好きっていうのは色々と問題があるというか～」
line = "「えっ！？　いやいや、私は教師だからね！？　と、年下好きっていうのは色々と問題があるというか～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あらら、トワちゃん、反応でバレバレよ～？」
line = "「あらら、トワちゃん、反応でバレバレよ～？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「でもそっか～、年上好きは私だけかぁ～。残念～」
line = "「でもそっか～、年上好きは私だけかぁ～。残念～」"

[[dialogue]]
speaker = "ヘレナ"
# 「もう１人の私のそれは、私からすると『憧れ』のようにも思えるがな」
line = "「もう１人の私のそれは、私からすると『憧れ』のようにも思えるがな」"

[[dialogue]]
speaker = "トワ先生"
# 「憧れ……？」
line = "「憧れ……？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「実は私ね～、子供の頃に母から『魔王』の話を聞いて、ずっと憧れてたのよ～」
line = "「実は私ね～、子供の頃に母から『魔王』の話を聞いて、ずっと憧れてたのよ～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「でも、今の魔王は私より年下だし、その子の父親である先代魔王のオジサマは既婚者だし、『ないものねだり』の憧れって言われたら、その通りなのよね～」
line = "「でも、今の魔王は私より年下だし、その子の父親である先代魔王のオジサマは既婚者だし、『ないものねだり』の憧れって言われたら、その通りなのよね～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「かといって、昔からの『憧れ』を捨てられるほど、簡単には大人になれないんだけど～」
line = "「かといって、昔からの『憧れ』を捨てられるほど、簡単には大人になれないんだけど～」"

[[dialogue]]
speaker = "トワ先生"
# 「……わかる！　わかるよ、ヘレナちゃん！　私もまだ星騎士を続けたいし……！　け、結婚だって……女だったらやっぱりしたいよね！」
line = "「……わかる！　わかるよ、ヘレナちゃん！　私もまだ星騎士を続けたいし……！　け、結婚だって……女だったらやっぱりしたいよね！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「トワちゃん、わかってくれるの！？　ありがと～！　ぎゅ～っ<emoji=heart04>　なでなで～♪」
line = "「トワちゃん、わかってくれるの！？　ありがと～！　ぎゅ～っ<emoji=heart04>　なでなで～♪」"

[[dialogue]]
speaker = "トワ先生"
# 「ちょっ、ヘレナちゃん！？　年上だから、ハグはまだしも頭撫でるのは、ちょっと恥ずかしいよ～！？」
line = "「ちょっ、ヘレナちゃん！？　年上だから、ハグはまだしも頭撫でるのは、ちょっと恥ずかしいよ～！？」"

[[dialogue]]
speaker = "マリオン"
# 「ふむ……ヘレナ様、でしたら、少し考え方を変えてみるのはいかがでしょう？」
line = "「ふむ……ヘレナ様、でしたら、少し考え方を変えてみるのはいかがでしょう？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「？　マリオンちゃん、どういうこと？」
line = "「？　マリオンちゃん、どういうこと？」"

[[dialogue]]
speaker = "マリオン"
# 「憧れを待つのではなく、自分で作るのです」
line = "「憧れを待つのではなく、自分で作るのです」"

[[dialogue]]
speaker = "マリオン"
# 「つまり――理想の渋くてダンディーな男性を、自分の手で育てればよいのです」
line = "「つまり――理想の渋くてダンディーな男性を、自分の手で育てればよいのです」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「……！」
line = "「……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「なるほど。たとえば異世界の魔王を、今から自分好みに育てていけば、いずれは憧れのダンディーな魔王に成長するかもしれない――ということだな？」
line = "「なるほど。たとえば異世界の魔王を、今から自分好みに育てていけば、いずれは憧れのダンディーな魔王に成長するかもしれない――ということだな？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「その発想は、なかったわ……！」
line = "「その発想は、なかったわ……！」"

[[dialogue]]
speaker = "リコリンフィア"
# 「理想は運命の相手が現れることだろう。しかし、それは『憧れが叶うのを待つ』という受け身な考え方でもある」
line = "「理想は運命の相手が現れることだろう。しかし、それは『憧れが叶うのを待つ』という受け身な考え方でもある」"

[[dialogue]]
speaker = "リコリンフィア"
# 「だが、私たちはもう大人だ。憧れを叶えたいなら、自分から掴みに行かねばな」
line = "「だが、私たちはもう大人だ。憧れを叶えたいなら、自分から掴みに行かねばな」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「確かにね……うんっ♪　よかったわ、異世界に来て！　ありがとう、トワちゃん、マリオンちゃん、リコリンちゃん！　――ぎゅ～っ<emoji=heart04>」
line = "「確かにね……うんっ♪　よかったわ、異世界に来て！　ありがとう、トワちゃん、マリオンちゃん、リコリンちゃん！　――ぎゅ～っ<emoji=heart04>」"

[[dialogue]]
speaker = "トワ先生"
# 「ちょっ、ヘレナちゃん！　だから抱き着くのは、恥ずかしいってば～！」
line = "「ちょっ、ヘレナちゃん！　だから抱き着くのは、恥ずかしいってば～！」"

[[dialogue]]
speaker = "リコリンフィア"
# 「ふふっ……どうやらこちらのヘレナと同じで、酒が入ると誰彼構わず抱き着く癖があるようだな」
line = "「ふふっ……どうやらこちらのヘレナと同じで、酒が入ると誰彼構わず抱き着く癖があるようだな」"

[[dialogue]]
speaker = "マリオン"
# 「まあまあ、うふふっ♪　お可愛らしいですこと<emoji=heart04>　私はされるの、大歓迎ですよ♪」
line = "「まあまあ、うふふっ♪　お可愛らしいですこと<emoji=heart04>　私はされるの、大歓迎ですよ♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「ならば私も同じようにハグさせてもらおうか♪　ぎゅ～っ<emoji=heart04>」
line = "「ならば私も同じようにハグさせてもらおうか♪　ぎゅ～っ<emoji=heart04>」"

[[dialogue]]
speaker = "トワ先生"
# 「って、なんで私をサンドイッチするの～！？　リコとマリオンもいるでしょ～！？」
line = "「って、なんで私をサンドイッチするの～！？　リコとマリオンもいるでしょ～！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「だって私たちは、ほとんど双子みたいなものだし～♪　ね～？」
line = "「だって私たちは、ほとんど双子みたいなものだし～♪　ね～？」"

[[dialogue]]
speaker = "ヘレナ"
# 「ああ。プリティーでゴージャスな鏡映し故にな♪」
line = "「ああ。プリティーでゴージャスな鏡映し故にな♪」"

[[dialogue]]
speaker = "リコリンフィア"
# 「いいな～♪　トワちゃん、ヘレナお姉ちゃんたちに囲まれて～♪　リコリン、羨ましい～<emoji=heart04>」
line = "「いいな～♪　トワちゃん、ヘレナお姉ちゃんたちに囲まれて～♪　リコリン、羨ましい～<emoji=heart04>」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「って……えっ！？　リコリンちゃん、その制服と喋り方は何！？」
line = "「って……えっ！？　リコリンちゃん、その制服と喋り方は何！？」"

[[dialogue]]
speaker = "リコリンフィア"
# 「リコリンリン♪　これはリコリンの附属生モードだよ～♪　てへっ☆」
line = "「リコリンリン♪　これはリコリンの附属生モードだよ～♪　てへっ☆」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「きゃ～んっ♪　なにそれ、めっちゃ可愛い～っ<emoji=heart04>」
line = "「きゃ～んっ♪　なにそれ、めっちゃ可愛い～っ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# こうして――異世界のヘレナはそれからも、こちらの世界の大人メンバーたちと、賑やかな夜を楽しむのだった。
line = "こうして――異世界のヘレナはそれからも、こちらの世界の大人メンバーたちと、賑やかな夜を楽しむのだった。"
