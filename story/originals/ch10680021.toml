[[dialogue]]
speaker = "unk"
# 第１話,リア、お姉ちゃんになる,P
line = "第１話,リア、お姉ちゃんになる,P"

[[dialogue]]
speaker = "unk"
# リゾート結界の事件の解決後。
line = "リゾート結界の事件の解決後。"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースの一行は、元の世界へ戻れるようになるまでの数日間、流星市国に滞在することになった。
line = "流星クルセイダースの一行は、元の世界へ戻れるようになるまでの数日間、流星市国に滞在することになった。"

[[dialogue]]
speaker = "リア"
# 「ヘレナさん、九浄家に泊めて頂いて、ありがとうございます」
line = "「ヘレナさん、九浄家に泊めて頂いて、ありがとうございます」"

[[dialogue]]
speaker = "ヘレナ"
# 「なに、遠慮することはない。自分の家だと思ってくつろぐがよい」
line = "「なに、遠慮することはない。自分の家だと思ってくつろぐがよい」"

[[dialogue]]
speaker = "ヴィーナス"
# 「そうそう♪　世界は違っても同じ九浄家なんだから、親戚みたいなものよね♪」
line = "「そうそう♪　世界は違っても同じ九浄家なんだから、親戚みたいなものよね♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あら、それはいい考えね～♪　それなら私たち、血は直接繋がってないけど、『姉妹』みたいなものってことよね♪」
line = "「あら、それはいい考えね～♪　それなら私たち、血は直接繋がってないけど、『姉妹』みたいなものってことよね♪」"

[[dialogue]]
speaker = "リア"
# 「そういえば、こっちの世界のヘレナさんの年齢って……？」
line = "「そういえば、こっちの世界のヘレナさんの年齢って……？」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふっ……そこは秘密だ。だが、少なくとも異世界の私よりは年上であるぞ」
line = "「ふっ……そこは秘密だ。だが、少なくとも異世界の私よりは年上であるぞ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「なら、ヘレナちゃんが一番上のお姉さんで、私は２番目ね♪」
line = "「なら、ヘレナちゃんが一番上のお姉さんで、私は２番目ね♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「そっか♪　じゃあ私は、一番下の妹ってことね！」
line = "「そっか♪　じゃあ私は、一番下の妹ってことね！」"

[[dialogue]]
speaker = "リア"
# 「え？　ヴィーナスちゃんが、私の妹……？」
line = "「え？　ヴィーナスちゃんが、私の妹……？」"

[[dialogue]]
speaker = "unk"
# 驚いたように目を丸くするリア。
line = "驚いたように目を丸くするリア。"

[[dialogue]]
speaker = "ヴィーナス"
# 「うん♪　リアさんは３年生で、私は２年生でしょ？」
line = "「うん♪　リアさんは３年生で、私は２年生でしょ？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「前にリアさんと知り合った時は思いつかなかったけど……」
line = "「前にリアさんと知り合った時は思いつかなかったけど……」"

[[dialogue]]
speaker = "ヴィーナス"
# 「姉妹みたいなものだって思ったら、先輩よりも『リアお姉ちゃん』って呼ぶ方がしっくり来るわ♪」
line = "「姉妹みたいなものだって思ったら、先輩よりも『リアお姉ちゃん』って呼ぶ方がしっくり来るわ♪」"

[[dialogue]]
speaker = "リア"
# 「私が、お姉ちゃん……！？」
line = "「私が、お姉ちゃん……！？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「うんっ♪　これからリアさんのこと、そう呼んでもいい？」
line = "「うんっ♪　これからリアさんのこと、そう呼んでもいい？」"

[[dialogue]]
speaker = "リア"
# 「えっと……その……」
line = "「えっと……その……」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ♪　リアったら、すごく嬉しそうよ～♪」
line = "「ふふっ♪　リアったら、すごく嬉しそうよ～♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「えっ、そうなの？」
line = "「えっ、そうなの？」"

[[dialogue]]
speaker = "リア"
# 「う、うん……<emoji=heart04>　ちょっと照れるけど――」
line = "「う、うん……<emoji=heart04>　ちょっと照れるけど――」"

[[dialogue]]
speaker = "リア"
# 「ヴィーナスちゃんが妹だって思ったら……すごく嬉しいかも<emoji=heart04>」
line = "「ヴィーナスちゃんが妹だって思ったら……すごく嬉しいかも<emoji=heart04>」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ほんと？　私もお姉ちゃんが２人もできて、嬉しいわ！」
line = "「ほんと？　私もお姉ちゃんが２人もできて、嬉しいわ！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あら～♪　じゃあヴィーナスちゃん、私のこともお姉ちゃんって呼んで～♪」
line = "「あら～♪　じゃあヴィーナスちゃん、私のこともお姉ちゃんって呼んで～♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「もちろんいいわよ♪　ヘレナお姉ちゃん♪」
line = "「もちろんいいわよ♪　ヘレナお姉ちゃん♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あ～ん、可愛い～っ<emoji=heart04>　私も、もう１人妹ができたみたいで嬉しいわ～♪」
line = "「あ～ん、可愛い～っ<emoji=heart04>　私も、もう１人妹ができたみたいで嬉しいわ～♪」"

[[dialogue]]
speaker = "リア"
# 「び、ヴィーナスちゃん、あのね？　私も……その……」
line = "「び、ヴィーナスちゃん、あのね？　私も……その……」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ん？　どうしたの、リアお姉ちゃん？」
line = "「ん？　どうしたの、リアお姉ちゃん？」"

[[dialogue]]
speaker = "リア"
# 「はうぅっ！？<emoji=heart04><emoji=heart04>　妹って思ったら、ヴィーナスちゃんがすごく可愛く見えてきて……！」
line = "「はうぅっ！？<emoji=heart04><emoji=heart04>　妹って思ったら、ヴィーナスちゃんがすごく可愛く見えてきて……！」"

[[dialogue]]
speaker = "リア"
# 「ね、ねぇ……ヴィーナスちゃん。その……頭、撫でてもいい？」
line = "「ね、ねぇ……ヴィーナスちゃん。その……頭、撫でてもいい？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「え？　撫でてくれるの？　やった～♪」
line = "「え？　撫でてくれるの？　やった～♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「リアお姉ちゃん、撫でて～♪」
line = "「リアお姉ちゃん、撫でて～♪」"

[[dialogue]]
speaker = "リア"
# 「それじゃあ……ヴィーナスちゃん――よしよ～し<emoji=heart04>」
line = "「それじゃあ……ヴィーナスちゃん――よしよ～し<emoji=heart04>」"

[[dialogue]]
speaker = "ヴィーナス"
# 「えへへへぇ～<emoji=heart04>　お姉ちゃんに撫でてもらえるの、嬉しい♪」
line = "「えへへへぇ～<emoji=heart04>　お姉ちゃんに撫でてもらえるの、嬉しい♪」"

[[dialogue]]
speaker = "リア"
# 「～～っ<emoji=heart04>　い、妹ができると、こんな感じなんだね……♪」
line = "「～～っ<emoji=heart04>　い、妹ができると、こんな感じなんだね……♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ♪　私がついリアのおっぱいを揉んで構いたくなる気持ち、わかったでしょ～？」
line = "「ふふっ♪　私がついリアのおっぱいを揉んで構いたくなる気持ち、わかったでしょ～？」"

[[dialogue]]
speaker = "リア"
# 「う、うん<emoji=heart04>　すごく可愛くてちょっと――って、いやいや！　私はそこまでしないからね！？」
line = "「う、うん<emoji=heart04>　すごく可愛くてちょっと――って、いやいや！　私はそこまでしないからね！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「え～？　別に恥ずかしがらなくてもいいのに～♪　姉妹のコミュニケーションよ、コミュニケーション<emoji=heart04>　――えいっ<emoji=heart04>」
line = "「え～？　別に恥ずかしがらなくてもいいのに～♪　姉妹のコミュニケーションよ、コミュニケーション<emoji=heart04>　――えいっ<emoji=heart04>」"

[[dialogue]]
speaker = "リア"
# 「きゃあっ！？」
line = "「きゃあっ！？」"

[[dialogue]]
speaker = "unk"
# ヘレナはいつものように背後に回り込むと、リアの大きな胸を掴んで揉み始める。
line = "ヘレナはいつものように背後に回り込むと、リアの大きな胸を掴んで揉み始める。"

[[dialogue]]
speaker = "リア"
# 「んっ<emoji=heart04>　も～、お姉ちゃんってば～！　私の方が恥ずかしいよ～！」
line = "「んっ<emoji=heart04>　も～、お姉ちゃんってば～！　私の方が恥ずかしいよ～！」"

[[dialogue]]
speaker = "リア"
# 「ほら、ヴィーナスちゃんたちがこっちを見て――」
line = "「ほら、ヴィーナスちゃんたちがこっちを見て――」"

[[dialogue]]
speaker = "ヘレナ"
# 「ぷく～っ」
line = "「ぷく～っ」"

[[dialogue]]
speaker = "リア"
# 「って、ヘレナさんが、なんかむくれてる！？」
line = "「って、ヘレナさんが、なんかむくれてる！？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ヘレナちゃんがこんな顔するの、初めて見たわ！」
line = "「ヘレナちゃんがこんな顔するの、初めて見たわ！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あら……もしかして――」
line = "「あら……もしかして――」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ヘレナちゃん、私たちだけ盛り上がってたから……拗ねちゃった？」
line = "「ヘレナちゃん、私たちだけ盛り上がってたから……拗ねちゃった？」"

[[dialogue]]
speaker = "ヘレナ"
# 「……私だけ『姉』と呼ばれぬのは、なんだかイヤではないか」
line = "「……私だけ『姉』と呼ばれぬのは、なんだかイヤではないか」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あ～んっ<emoji=heart04>　なにそれ、可愛い～っ<emoji=heart04>　これが『姉萌え』ってやつかしら～♪　お姉ちゃん、よしよ～し<emoji=heart04>」
line = "「あ～んっ<emoji=heart04>　なにそれ、可愛い～っ<emoji=heart04>　これが『姉萌え』ってやつかしら～♪　お姉ちゃん、よしよ～し<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 異世界のヘレナは、こちらの世界のヘレナちゃんの頭を撫でる。
