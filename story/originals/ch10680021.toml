[[dialogue]]
speaker = "ヴィーナス"
# 「う～ん、でもヘレナちゃんは、私にとっては、もう１人のママって感じなのよね～」
line = "「う～ん、でもヘレナちゃんは、私にとっては、もう１人のママって感じなのよね～」"

[[dialogue]]
speaker = "リア"
# 「えっと……私の場合は、どっちも『ヘレナお姉ちゃん』になるので、なんと呼べばいいのかわからなくて……」
line = "「えっと……私の場合は、どっちも『ヘレナお姉ちゃん』になるので、なんと呼べばいいのかわからなくて……」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふむ……ヴィーナスはともかく、ならばリアよ」
line = "「ふむ……ヴィーナスはともかく、ならばリアよ」"

[[dialogue]]
speaker = "ヘレナ"
# 「私のことは『お姉ちゃん』ではなく、『姉さん』と呼び分けるがよい。……どうだ？」
line = "「私のことは『お姉ちゃん』ではなく、『姉さん』と呼び分けるがよい。……どうだ？」"

[[dialogue]]
speaker = "リア"
# 「じ、じゃあ…………ヘレナ姉さん♪」
line = "「じ、じゃあ…………ヘレナ姉さん♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「……うむ♪　ふふっ」
line = "「……うむ♪　ふふっ」"

[[dialogue]]
speaker = "リア"
# 「あ……」
line = "「あ……」"

[[dialogue]]
speaker = "unk"
# ヘレナは嬉しそうに微笑みながら、リアの頭にそっと手を置き、撫でる。
line = "ヘレナは嬉しそうに微笑みながら、リアの頭にそっと手を置き、撫でる。"

[[dialogue]]
speaker = "ヘレナ"
# 「リアよ。これからは私のことも、姉のように甘えてくれて構わないぞ♪」
line = "「リアよ。これからは私のことも、姉のように甘えてくれて構わないぞ♪」"

[[dialogue]]
speaker = "リア"
# 「ん……えへへ……<emoji=heart04>　うんっ、姉さん♪」
line = "「ん……えへへ……<emoji=heart04>　うんっ、姉さん♪」"

[[dialogue]]
speaker = "unk"
# こうして、リアたち４人は九浄家同士、世界を越えて仲良くなるのだった。
line = "こうして、リアたち４人は九浄家同士、世界を越えて仲良くなるのだった。"
