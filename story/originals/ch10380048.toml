# 「ぅ……うぅ……」
line = "「ぅ……うぅ……」"

[[dialogue]]
speaker = "イクシリオン"
# 「あら、言葉も出ないようですね。ちょっとやりすぎたかもしれません<emoji=heart04>」
line = "「あら、言葉も出ないようですね。ちょっとやりすぎたかもしれません<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 色欲の魔将の力は身を以て味わった通りで、俺は息も絶え絶えだ。恐るべき力と言う他ない。
line = "色欲の魔将の力は身を以て味わった通りで、俺は息も絶え絶えだ。恐るべき力と言う他ない。"

[[dialogue]]
speaker = "イクシリオン"
# 「本当は魔将の力で排卵することもできたのですが……それはまだ早いですからね。本当の孕ませエッチは楽しみにとっておきます<emoji=heart04>」
line = "「本当は魔将の力で排卵することもできたのですが……それはまだ早いですからね。本当の孕ませエッチは楽しみにとっておきます<emoji=heart04>」"

[[dialogue]]
speaker = "イクシリオン"
# 「ふふふ……このお腹に命を宿す時が待ち遠しいです<emoji=heart04>」
line = "「ふふふ……このお腹に命を宿す時が待ち遠しいです<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 下腹部の文様を光らせながら、イクシーが妖艶に笑む。
line = "下腹部の文様を光らせながら、イクシーが妖艶に笑む。"

[[dialogue]]
speaker = "イクシリオン"
# 「でもこれで終わりじゃないんですよ？」
line = "「でもこれで終わりじゃないんですよ？」"

[[dialogue]]
speaker = "クロト"
# 「え……？」
line = "「え……？」"

[[dialogue]]
speaker = "イクシリオン"
# 「力をもっと使いこなせるようになれば、分身も３人、４人……いえもっと増やせるようになると思います」
line = "「力をもっと使いこなせるようになれば、分身も３人、４人……いえもっと増やせるようになると思います」"

[[dialogue]]
speaker = "イクシリオン"
# 「その時は、もっとたくさんの私と色欲に溺れましょうね<emoji=heart04>」
line = "「その時は、もっとたくさんの私と色欲に溺れましょうね<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# イクシーは純粋に楽しんでいるんだろうけど、俺の身が持つ気がしない。
line = "イクシーは純粋に楽しんでいるんだろうけど、俺の身が持つ気がしない。"

[[dialogue]]
speaker = "unk"
# その未来を想像して、魔将の力を心底恐ろしく思うのだった──
line = "その未来を想像して、魔将の力を心底恐ろしく思うのだった──"
