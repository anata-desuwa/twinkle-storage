line = "──カンリ、シナケレバ。"

[[dialogue]]
speaker = "unk"
# ──セカイヲ、トワニ。セイチョウ、サセナケレバ。
line = "──セカイヲ、トワニ。セイチョウ、サセナケレバ。"

[[dialogue]]
speaker = "クロト"
# 「インフィニット・ディザスター────！！！！」
line = "「インフィニット・ディザスター────！！！！」"

[[dialogue]]
speaker = "unk"
# 「ガ────ギャ──────ギギギギイィィィィ！？」
line = "「ガ────ギャ──────ギギギギイィィィィ！？」"

[[dialogue]]
speaker = "unk"
# ──キンシ、ヒテイ、フカノウ──！！
line = "──キンシ、ヒテイ、フカノウ──！！"

[[dialogue]]
speaker = "クロト"
# 「砕けろぉぉぉおぉぉおおおおッ────！！！！」
line = "「砕けろぉぉぉおぉぉおおおおッ────！！！！」"

[[dialogue]]
speaker = "unk"
# ──カンゼン、フメツ、チョウエツ　コソ　ガ　カミ──！！！
line = "──カンゼン、フメツ、チョウエツ　コソ　ガ　カミ──！！！"

[[dialogue]]
speaker = "unk"
# 終焉世界ベガで、『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』は散った。
line = "終焉世界ベガで、『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』は散った。"

[[dialogue]]
speaker = "unk"
# だが──
line = "だが──"

[[dialogue]]
speaker = "unk"
# （……カミ　ハ　ケツマツ　ヲ　ヒテイスル）
line = "（……カミ　ハ　ケツマツ　ヲ　ヒテイスル）"

[[dialogue]]
speaker = "unk"
# （────ソウ、ダ。アノ、ゲンショウヲ、リヨウ──スレバ────）
line = "（────ソウ、ダ。アノ、ゲンショウヲ、リヨウ──スレバ────）"

[[dialogue]]
speaker = "unk"
# 平行世界に干渉するラクシス固有の権能を、『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』は最期まで己のモノとすることは叶わなかった。
line = "平行世界に干渉するラクシス固有の権能を、『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』は最期まで己のモノとすることは叶わなかった。"

[[dialogue]]
speaker = "unk"
# ラクシスの権能を元に作り出した、次元転送装置を用いずに平行世界へ干渉すると、意図せず時の流れが捻じ曲がってしまう。
line = "ラクシスの権能を元に作り出した、次元転送装置を用いずに平行世界へ干渉すると、意図せず時の流れが捻じ曲がってしまう。"

[[dialogue]]
speaker = "unk"
# そのことは、使徒であったアポロ、そしてジグを跳躍させた際にも確認していた事実。
line = "そのことは、使徒であったアポロ、そしてジグを跳躍させた際にも確認していた事実。"

[[dialogue]]
speaker = "unk"
# 意のままに操れない力ゆえに、今の今まで選択肢にすら入っていなかった、その現象。
line = "意のままに操れない力ゆえに、今の今まで選択肢にすら入っていなかった、その現象。"

[[dialogue]]
speaker = "unk"
# しかしもうそれに縋るしかない。不完全であっても、過去に干渉できる唯一の方法なのだから──
line = "しかしもうそれに縋るしかない。不完全であっても、過去に干渉できる唯一の方法なのだから──"

[[dialogue]]
speaker = "unk"
# （サイゴノ──シトヲ────アルタイル、ヘ──）
line = "（サイゴノ──シトヲ────アルタイル、ヘ──）"

[[dialogue]]
speaker = "unk"
# （チョウエツ、マキモドシ、クリカエス────）
line = "（チョウエツ、マキモドシ、クリカエス────）"

[[dialogue]]
speaker = "unk"
# <ruby=か>彼</ruby>の神は最期の力を振り絞り──１人の使徒を創造し、平行世界アルタイルへと飛ばした。
line = "<ruby>彼<rt>か</rt></ruby>の神は最期の力を振り絞り──１人の使徒を創造し、平行世界アルタイルへと飛ばした。"

[[dialogue]]
speaker = "unk"
# 宇宙規模のプログラムであった『神』が、初めて己以外の何者かに祈ったのだ。
line = "宇宙規模のプログラムであった『神』が、初めて己以外の何者かに祈ったのだ。"

[[dialogue]]
speaker = "unk"
# ──遡れるだけ、過去へ。
line = "──遡れるだけ、過去へ。"

[[dialogue]]
speaker = "unk"
# ──『神』の消滅の未来を覆せる地点まで、飛んでゆけ、と。
line = "──『神』の消滅の未来を覆せる地点まで、飛んでゆけ、と。"

[[dialogue]]
speaker = "ホロウ・ルヴィネ"
# 「…………承知いたしました、お父様」
line = "「…………承知いたしました、お父様」"

[[dialogue]]
speaker = "ホロウ・ルヴィネL"
# 「お父様の消滅する、忌むべき未来を否定するため──動きましょう」
line = "「お父様の消滅する、忌むべき未来を否定するため──動きましょう」"

[[dialogue]]
speaker = "unk"
# ──同刻。
line = "──同刻。"

[[dialogue]]
speaker = "unk"
# 新星学園の星徒会室にて──
line = "新星学園の星徒会室にて──"

[[dialogue]]
speaker = "ナターシャ"
# 「会長さんのオーダーは了解。ドタバタしてる天界から、強～い星騎士を引っ張って来ればＯＫだね？」
line = "「会長さんのオーダーは了解。ドタバタしてる天界から、強～い星騎士を引っ張って来ればＯＫだね？」"

[[dialogue]]
speaker = "クロト"
# 「ああ。メルエル、ナターシャ。頼んだ」
line = "「ああ。メルエル、ナターシャ。頼んだ」"

[[dialogue]]
speaker = "メルエル"
# 「任せて！」
line = "「任せて！」"

[[dialogue]]
speaker = "ナターシャ"
# 「できうる範囲で、頑張らせてもらうよ」
line = "「できうる範囲で、頑張らせてもらうよ」"

[[dialogue]]
speaker = "ホロウ・ルヴィネ"
# （…………そう。今はまだ、緋宮クロトたちはデネブへ乗り込んではいない。けれど──）
line = "（…………そう。今はまだ、緋宮クロトたちはデネブへ乗り込んではいない。けれど──）"

[[dialogue]]
speaker = "unk"
# 創造神による強引な過去跳躍は、この地点が最長だった。
line = "創造神による強引な過去跳躍は、この地点が最長だった。"

[[dialogue]]
speaker = "ホロウ・ルヴィネ"
# （……まだ間に合う。全てを覆す。過去を改変し、星騎士の勝利という未来を否定する──）
line = "（……まだ間に合う。全てを覆す。過去を改変し、星騎士の勝利という未来を否定する──）"

[[dialogue]]
speaker = "ホロウ・ルヴィネ"
# （お父様を堕落させるセイファートの剣。『<ruby=スター・リユニオン>星の再会</ruby>』。ディザスターハンドとの同化──全て、なかったことにしてみせる）
line = "（お父様を堕落させるセイファートの剣。『<ruby>星の再会<rt>スター・リユニオン</rt></ruby>』。ディザスターハンドとの同化──全て、なかったことにしてみせる）"

[[dialogue]]
speaker = "ホロウ・ルヴィネ"
# （そのためには、まず──）
line = "（そのためには、まず──）"

[[dialogue]]
speaker = "ホロウ・ルヴィネ"
# （魔王メルエルを、新しいリクリエの使徒に仕立てましょう）
line = "（魔王メルエルを、新しいリクリエの使徒に仕立てましょう）"
