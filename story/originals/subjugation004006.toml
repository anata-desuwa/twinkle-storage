[[dialogue]]
speaker = "ナターシャ"
# 「なんか、私ばかり語ってるのもズルいよね。ベアトは私のこと、どう思ってたのか話してよ」
line = "「なんか、私ばかり語ってるのもズルいよね。ベアトは私のこと、どう思ってたのか話してよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「えっ、私？」
line = "「えっ、私？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そりゃそうでしょ。私が先に話したんだから、ベアトの番」
line = "「そりゃそうでしょ。私が先に話したんだから、ベアトの番」"

[[dialogue]]
speaker = "ベアトリス"
# 「まぁそうなるよね……。うーんと、選管で初めて顔を合わせた時のイメージだとね……」
line = "「まぁそうなるよね……。うーんと、選管で初めて顔を合わせた時のイメージだとね……」"

[[dialogue]]
speaker = "ベアトリス"
# 「正直に言っちゃうと……最初はちょっと怖そうな人だなって思ったよ。ちょっとだけね」
line = "「正直に言っちゃうと……最初はちょっと怖そうな人だなって思ったよ。ちょっとだけね」"

[[dialogue]]
speaker = "ベアトリス"
# 「その後、聖庭園から差し向けられた暗殺者って聞いて……」
line = "「その後、聖庭園から差し向けられた暗殺者って聞いて……」"

[[dialogue]]
speaker = "ベアトリス"
# 「暗殺者なんてお仕事が本当にあることも、漫画みたいに暗殺者を差し向ける組織があることにも驚いたよ」
line = "「暗殺者なんてお仕事が本当にあることも、漫画みたいに暗殺者を差し向ける組織があることにも驚いたよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「でも……最初は梨緒ちゃんとも仲良くなかったのに、今じゃすっかり仲良しさんだもんニャ」
line = "「でも……最初は梨緒ちゃんとも仲良くなかったのに、今じゃすっかり仲良しさんだもんニャ」"

[[dialogue]]
speaker = "ナターシャ"
# 「え、別に今も梨緒と仲いいつもりなんてないんだけど」
line = "「え、別に今も梨緒と仲いいつもりなんてないんだけど」"

[[dialogue]]
speaker = "ベアトリス"
# 「え～、絶対仲良しだよ。ナターシャちゃん、梨緒ちゃんのサンドイッチよく取ってるし」
line = "「え～、絶対仲良しだよ。ナターシャちゃん、梨緒ちゃんのサンドイッチよく取ってるし」"

[[dialogue]]
speaker = "ナターシャ"
# 「いや、梨緒からしたら、たまったもんじゃないでしょ」
line = "「いや、梨緒からしたら、たまったもんじゃないでしょ」"

[[dialogue]]
speaker = "ベアトリス"
# 「梨緒ちゃん、最近はナターシャちゃんに取られるの見越して、多めに持ってきてるんだよ？　ほら、仲良しっ！」
line = "「梨緒ちゃん、最近はナターシャちゃんに取られるの見越して、多めに持ってきてるんだよ？　ほら、仲良しっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「そうなんだ。随分たくさん持ってきてるとは思ってたけど……ま、ベアトが言うなら仲いいってことでいいや」
line = "「そうなんだ。随分たくさん持ってきてるとは思ってたけど……ま、ベアトが言うなら仲いいってことでいいや」"

[[dialogue]]
speaker = "ベアトリス"
# 「うんっ、ナターシャちゃんと梨緒ちゃんは仲良しさんニャ」
line = "「うんっ、ナターシャちゃんと梨緒ちゃんは仲良しさんニャ」"

[[dialogue]]
speaker = "ナターシャ"
# 「話が梨緒の方に逸れたけど……最初は怖そうって思った、ってことは、今は怖くないんだ？　ベアトが私を怖くなくなったのっていつ？」
line = "「話が梨緒の方に逸れたけど……最初は怖そうって思った、ってことは、今は怖くないんだ？　ベアトが私を怖くなくなったのっていつ？」"

[[dialogue]]
speaker = "ベアトリス"
# 「う～～ん……『そんなに怖くない人だ！』ってなったのは……クイズ大会の時かニャ？」
line = "「う～～ん……『そんなに怖くない人だ！』ってなったのは……クイズ大会の時かニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「割とすぐじゃん」
line = "「割とすぐじゃん」"

[[dialogue]]
speaker = "ベアトリス"
# 「うん、すぐ。その後もいろんな相手と戦う中で、背中を任せられる頼りになる仲間だ──ってわかったの」
line = "「うん、すぐ。その後もいろんな相手と戦う中で、背中を任せられる頼りになる仲間だ──ってわかったの」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃん、いつも落ち着いてるし、危険なとこでは梨緒ちゃんを止めたり、助けたりしてくれるし」
line = "「ナターシャちゃん、いつも落ち着いてるし、危険なとこでは梨緒ちゃんを止めたり、助けたりしてくれるし」"

[[dialogue]]
speaker = "ナターシャ"
# 「いや、それは梨緒が危なっかしいだけだから」
line = "「いや、それは梨緒が危なっかしいだけだから」"

[[dialogue]]
speaker = "ナターシャ"
# 「ストッパーがいないと、あっさり全滅するからね。梨緒もアポロもベアトも頭に血が上ると突っ込みがちだし」
line = "「ストッパーがいないと、あっさり全滅するからね。梨緒もアポロもベアトも頭に血が上ると突っ込みがちだし」"

[[dialogue]]
speaker = "ベアトリス"
# 「あはは……そうかも……。私、いつも『落ち着きが足りない』って怒られてたから……」
line = "「あはは……そうかも……。私、いつも『落ち着きが足りない』って怒られてたから……」"

[[dialogue]]
speaker = "ナターシャ"
# 「怒られ続けてたなら、少しくらい改善する努力をしたら？」
line = "「怒られ続けてたなら、少しくらい改善する努力をしたら？」"

[[dialogue]]
speaker = "ナターシャ"
# 「いや、それができたら１人でデネブからアルタイルに渡ってくるなんて無茶しないか」
line = "「いや、それができたら１人でデネブからアルタイルに渡ってくるなんて無茶しないか」"

[[dialogue]]
speaker = "ベアトリス"
# 「あははは……今思い返しても、あれはほんとに無茶でした……」
line = "「あははは……今思い返しても、あれはほんとに無茶でした……」"

[[dialogue]]
speaker = "ベアトリス"
# 「だから、ナターシャちゃんは私にできないこと、なんでもできて凄い！　って思ってた。ううん、今も思ってる。カボチャのランタン作りも上手だしね」
line = "「だから、ナターシャちゃんは私にできないこと、なんでもできて凄い！　って思ってた。ううん、今も思ってる。カボチャのランタン作りも上手だしね」"

[[dialogue]]
speaker = "ナターシャ"
# 「ん、ありがと。梨緒やジグはともかく、ベアトに褒められると素直に嬉しい」
line = "「ん、ありがと。梨緒やジグはともかく、ベアトに褒められると素直に嬉しい」"

[[dialogue]]
speaker = "ベアトリス"
# 「えへへ、ナターシャちゃんと一緒にハロウィンの準備できて良かったニャ」
line = "「えへへ、ナターシャちゃんと一緒にハロウィンの準備できて良かったニャ」"

[[dialogue]]
speaker = "ベアトリス"
# 「私ね、ナターシャちゃんとハロウィンを楽しみたい。もっともっと仲良くなりたい」
line = "「私ね、ナターシャちゃんとハロウィンを楽しみたい。もっともっと仲良くなりたい」"

[[dialogue]]
speaker = "ベアトリス"
# 「だからナターシャちゃんに声をかけたんだ」
line = "「だからナターシャちゃんに声をかけたんだ」"

[[dialogue]]
speaker = "ナターシャ"
# 「……うん、知ってる」
line = "「……うん、知ってる」"

[[dialogue]]
speaker = "ナターシャ"
# 「ホント、ベアトってお人好しな上に物好きだよね」
line = "「ホント、ベアトってお人好しな上に物好きだよね」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃんだって、素直じゃない上に恥ずかしがり屋さんだよっ♪」
line = "「ナターシャちゃんだって、素直じゃない上に恥ずかしがり屋さんだよっ♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「はいはい、無駄話はもうおしまい。こっちのランタンはできあがったよ」
line = "「はいはい、無駄話はもうおしまい。こっちのランタンはできあがったよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「わ、早いっ。こっちももうすぐ終わるから、ちょっと待ってて～」
line = "「わ、早いっ。こっちももうすぐ終わるから、ちょっと待ってて～」"

[[dialogue]]
speaker = "ナターシャ"
# 「待ってて、じゃなくて手伝うよ。クモの巣じゃなければね」
line = "「待ってて、じゃなくて手伝うよ。クモの巣じゃなければね」"

[[dialogue]]
speaker = "ベアトリス"
# 「うんっ、ナターシャちゃん手伝ってっ」
line = "「うんっ、ナターシャちゃん手伝ってっ」"
