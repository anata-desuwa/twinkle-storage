[[dialogue]]
speaker = "unk"
# 第４話,カティアと見る世界,P
line = "第４話,カティアと見る世界,P"

[[dialogue]]
speaker = "モンスター"
# 「シャ～～クッ！！」
line = "「シャ～～クッ！！」"

[[dialogue]]
speaker = "unk"
# ある放課後、リィベルからモンスター出現の連絡を受け、カティア（と一緒にいた俺）は魔界に出撃した。
line = "ある放課後、リィベルからモンスター出現の連絡を受け、カティア（と一緒にいた俺）は魔界に出撃した。"

[[dialogue]]
speaker = "カティア"
# 「いっけ～！　バウバンキッシュマーチ！！」
line = "「いっけ～！　バウバンキッシュマーチ！！」"

[[dialogue]]
speaker = "犬の使い魔"
# 「バウバウバ～ウ！」
line = "「バウバウバ～ウ！」"

[[dialogue]]
speaker = "unk"
# 魔犬の群れがモンスターに殺到する。何度見ても圧巻の攻撃だ。かわいい。
line = "魔犬の群れがモンスターに殺到する。何度見ても圧巻の攻撃だ。かわいい。"

[[dialogue]]
speaker = "カティア"
# 「わーっはっは！　地獄の番犬の行進だベロス！　恐れおののけ！」
line = "「わーっはっは！　地獄の番犬の行進だベロス！　恐れおののけ！」"

[[dialogue]]
speaker = "モンスター"
# 「シャ～～！？」
line = "「シャ～～！？」"

[[dialogue]]
speaker = "unk"
# 犬に飲まれてモンスターが見えなくなった。機械型モンスターでも、魔将の手にかかればこんなものだ。俺は必要なかったかもしれない。
line = "犬に飲まれてモンスターが見えなくなった。機械型モンスターでも、魔将の手にかかればこんなものだ。俺は必要なかったかもしれない。"

[[dialogue]]
speaker = "モンスター"
# 「グオオオオォッ！」
line = "「グオオオオォッ！」"

[[dialogue]]
speaker = "unk"
# 危ない！
line = "危ない！"

[[dialogue]]
speaker = "カティア"
# 「わっ！」
line = "「わっ！」"

[[dialogue]]
speaker = "unk"
# カティアを抱きかかえて、攻撃をかわす。モンスターは一体だけじゃなかったようだ。
line = "カティアを抱きかかえて、攻撃をかわす。モンスターは一体だけじゃなかったようだ。"

[[dialogue]]
speaker = "カティア"
# 「魔王様、ありがとうございます……」
line = "「魔王様、ありがとうございます……」"

[[dialogue]]
speaker = "カティア"
# 「魔王様、見ててください！　あのモンスターも血祭りにあげてみせますガオ！！」
line = "「魔王様、見ててください！　あのモンスターも血祭りにあげてみせますガオ！！」"

[[dialogue]]
speaker = "カティア"
# 「魔犬たちよ、吠えろ！　地獄の底から轟け、ハウンドハウリングバースト！」
line = "「魔犬たちよ、吠えろ！　地獄の底から轟け、ハウンドハウリングバースト！」"

[[dialogue]]
speaker = "犬の使い魔"
# 「ワオーーーーン！！」
line = "「ワオーーーーン！！」"

[[dialogue]]
speaker = "モンスター"
# 「グギャァ……」
line = "「グギャァ……」"

[[dialogue]]
speaker = "unk"
# 魔力を帯びた咆哮がモンスターを粉砕し、巨体を跡形もなく消滅させた。以前とは段違いの攻撃力だ。
line = "魔力を帯びた咆哮がモンスターを粉砕し、巨体を跡形もなく消滅させた。以前とは段違いの攻撃力だ。"

[[dialogue]]
speaker = "カティア"
# 「ふっふ～♪　どうですか、魔王様。『強欲』の魔将の力は。これならすぐにプリマステラにもなれますよね？」
line = "「ふっふ～♪　どうですか、魔王様。『強欲』の魔将の力は。これならすぐにプリマステラにもなれますよね？」"

[[dialogue]]
speaker = "カティア"
# 「……え、どんなに強くても、隙だらけじゃプリマステラは難しい？　そんなぁ～～、魔王様、厳しいです～～！」
line = "「……え、どんなに強くても、隙だらけじゃプリマステラは難しい？　そんなぁ～～、魔王様、厳しいです～～！」"

[[dialogue]]
speaker = "unk"
# 今日は俺がいたからカバーできたけど、いつもできるとは限らない。プリマステラになれば１人で戦うことも増えるから、なおさらだ。
line = "今日は俺がいたからカバーできたけど、いつもできるとは限らない。プリマステラになれば１人で戦うことも増えるから、なおさらだ。"

[[dialogue]]
speaker = "カティア"
# 「強さも大事だけど、周りを見ることも大事……それは、はい、そうです……」
line = "「強さも大事だけど、周りを見ることも大事……それは、はい、そうです……」"

[[dialogue]]
speaker = "カティア"
# 「うぅ、ごめんなさい……魔王様は私を心配してくれてるのに、生意気言って……」
line = "「うぅ、ごめんなさい……魔王様は私を心配してくれてるのに、生意気言って……」"

[[dialogue]]
speaker = "unk"
# 分かってくれればいいんだ
line = "分かってくれればいいんだ"

[[dialogue]]
speaker = "unk"
# よしよし
line = "よしよし"

[[dialogue]]
speaker = "カティア"
# 「ふふ……魔王様の手、だいすき<emoji=heart04>　もっと撫でてください<emoji=heart04>」
line = "「ふふ……魔王様の手、だいすき<emoji=heart04>　もっと撫でてください<emoji=heart04>」"

[[dialogue]]
speaker = "カティア"
# 「撫で方、上手すぎですぅ……<emoji=heart04>　くぅ～ん<emoji=heart04>」
line = "「撫で方、上手すぎですぅ……<emoji=heart04>　くぅ～ん<emoji=heart04>」"

[[dialogue]]
speaker = "カティア"
# 「あ、ところで、これからどうします？　リィベルが回収してくれるまで時間かかると思いますけど」
line = "「あ、ところで、これからどうします？　リィベルが回収してくれるまで時間かかると思いますけど」"

[[dialogue]]
speaker = "unk"
# 深淵書庫の魔本の力では、流星市国へ帰るのは時間がかかるらしい。儀式の準備に数時間必要なのだとか。
line = "深淵書庫の魔本の力では、流星市国へ帰るのは時間がかかるらしい。儀式の準備に数時間必要なのだとか。"

[[dialogue]]
speaker = "カティア"
# 「もし他にやることなかったら、案内したいところがあるんですワン」
line = "「もし他にやることなかったら、案内したいところがあるんですワン」"

[[dialogue]]
speaker = "カティア"
# 「ここ、実家から割と近くて……あ、実家には帰りません。畑仕事を手伝わされるので。景色のいいところがあって、ぜひ見てほしいんです」
line = "「ここ、実家から割と近くて……あ、実家には帰りません。畑仕事を手伝わされるので。景色のいいところがあって、ぜひ見てほしいんです」"

[[dialogue]]
speaker = "カティア"
# 「星騎士ならひとっ飛び……あ、魔王様、ちょっと思い付いたことがあって……」
line = "「星騎士ならひとっ飛び……あ、魔王様、ちょっと思い付いたことがあって……」"

[[dialogue]]
speaker = "カティア"
# 「はい！　ほらほら、魔王様、私の背中に！」
line = "「はい！　ほらほら、魔王様、私の背中に！」"

[[dialogue]]
speaker = "unk"
# 言われるままに背負われてしまった。後輩の、女の子に。
line = "言われるままに背負われてしまった。後輩の、女の子に。"

[[dialogue]]
speaker = "カティア"
# 「今の私なら、飛んだ方が速いのか、走った方が速いのか、試してみたかったんです。じゃあ魔王様、しっかり掴まっててくださいね！」
line = "「今の私なら、飛んだ方が速いのか、走った方が速いのか、試してみたかったんです。じゃあ魔王様、しっかり掴まっててくださいね！」"

[[dialogue]]
speaker = "カティア"
# 「準備いいですか、魔王様？　じゃあ……よ～～い、ドン！」
line = "「準備いいですか、魔王様？　じゃあ……よ～～い、ドン！」"

[[dialogue]]
speaker = "カティア"
# 「魔王様、見てください！　これが私の見せたかった景色……魔王様、顔色が……大丈夫ですか？」
line = "「魔王様、見てください！　これが私の見せたかった景色……魔王様、顔色が……大丈夫ですか？」"

[[dialogue]]
speaker = "unk"
# ちょっと休憩させて……
line = "ちょっと休憩させて……"

[[dialogue]]
speaker = "unk"
# 魔将になったカティアは飛ぶより速くて、スリル満点だ。楽しめたのは最初の一瞬だけで、あとはカティアに掴まるのに必死だった。
line = "魔将になったカティアは飛ぶより速くて、スリル満点だ。楽しめたのは最初の一瞬だけで、あとはカティアに掴まるのに必死だった。"

[[dialogue]]
speaker = "カティア"
# 「ごめんなさい、魔王様……私の思い付きに巻き込んじゃって……」
line = "「ごめんなさい、魔王様……私の思い付きに巻き込んじゃって……」"

[[dialogue]]
speaker = "カティア"
# 「……私自身は怖くないのか、ですか？　いえ、風を切って走るの気持ちいいですワン！」
line = "「……私自身は怖くないのか、ですか？　いえ、風を切って走るの気持ちいいですワン！」"

[[dialogue]]
speaker = "カティア"
# 「風にも匂いがあって……流星市国はいろんな食べ物の匂いがして、故郷の風は草の匂いがして……どっちも大好きです」
line = "「風にも匂いがあって……流星市国はいろんな食べ物の匂いがして、故郷の風は草の匂いがして……どっちも大好きです」"

[[dialogue]]
speaker = "unk"
# 匂いまで感じる余裕はなかったけど、カティアの見ている世界を少しだけ垣間見れて嬉しい。
line = "匂いまで感じる余裕はなかったけど、カティアの見ている世界を少しだけ垣間見れて嬉しい。"

[[dialogue]]
speaker = "カティア"
# 「あ、落ち着いてきました？　じゃあ、見てください。これが私の見せたかったものです」
line = "「あ、落ち着いてきました？　じゃあ、見てください。これが私の見せたかったものです」"

[[dialogue]]
speaker = "unk"
# カティアに手を引かれて立ち上がる。今まで気付かなかったが、山の頂上まで来ていたみたいだ。
line = "カティアに手を引かれて立ち上がる。今まで気付かなかったが、山の頂上まで来ていたみたいだ。"

[[dialogue]]
speaker = "カティア"
# 「初めてここに来たのは、ひいおじいちゃんと一緒だったんです。いつしか一緒に登れなくなって……いつの間にか一人でも来るようになってました」
line = "「初めてここに来たのは、ひいおじいちゃんと一緒だったんです。いつしか一緒に登れなくなって……いつの間にか一人でも来るようになってました」"

[[dialogue]]
speaker = "カティア"
# 「私の足が速いのは、この山で鍛えられたお陰ですワン」
line = "「私の足が速いのは、この山で鍛えられたお陰ですワン」"

[[dialogue]]
speaker = "カティア"
# 「ここから見ると、世界ってこんなに大きいんだって感動しました。全部、全部、手に入れてやるぞって見るたびに思うんです」
line = "「ここから見ると、世界ってこんなに大きいんだって感動しました。全部、全部、手に入れてやるぞって見るたびに思うんです」"

[[dialogue]]
speaker = "カティア"
# 「モンスター退治のついでになっちゃいましたけど、魔王様と一緒にここに来られてよかったですガオ」
line = "「モンスター退治のついでになっちゃいましたけど、魔王様と一緒にここに来られてよかったですガオ」"

[[dialogue]]
speaker = "カティア"
# 「魔王様と一緒なら、世界征服だってカンタンですワン！」
line = "「魔王様と一緒なら、世界征服だってカンタンですワン！」"

[[dialogue]]
speaker = "カティア"
# 「ね、魔王様？」
line = "「ね、魔王様？」"

[[dialogue]]
speaker = "unk"
# 夕日に照らされたカティアの笑顔を見ていると、本当に世界征服できる気がしてくるから不思議だ。
line = "夕日に照らされたカティアの笑顔を見ていると、本当に世界征服できる気がしてくるから不思議だ。"

[[dialogue]]
speaker = "unk"
# 言葉で応えるよりも相応しい気がして、カティアの頭をそっと撫でてやる。
line = "言葉で応えるよりも相応しい気がして、カティアの頭をそっと撫でてやる。"

[[dialogue]]
speaker = "カティア"
# 「あ、撫でてくれるんですか？　わふ～<emoji=heart04>」
line = "「あ、撫でてくれるんですか？　わふ～<emoji=heart04>」"
