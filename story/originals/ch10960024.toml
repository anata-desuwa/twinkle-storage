[[dialogue]]
speaker = "unk"
# 第４話,君とふたりで,P
line = "第４話,君とふたりで,P"

[[dialogue]]
speaker = "イングリット"
# 「ようやく、２人きりになれたな……」
line = "「ようやく、２人きりになれたな……」"

[[dialogue]]
speaker = "イングリット"
# 「私と戦え、魔王。私たちが最後の２人だ」
line = "「私と戦え、魔王。私たちが最後の２人だ」"

[[dialogue]]
speaker = "unk"
# 一瞬ドギマギしてしまったが、イングリット相手にそう感じてしまった自分を殴りたくなる。
line = "一瞬ドギマギしてしまったが、イングリット相手にそう感じてしまった自分を殴りたくなる。"

[[dialogue]]
speaker = "イングリット"
# 「フッ、ようやくやる気になったようだな」
line = "「フッ、ようやくやる気になったようだな」"

[[dialogue]]
speaker = "unk"
# だがイングリットの熱い戦いぶりを見て、俺も火が点いてしまった。彼女と戦って、そして勝ちたい。
line = "だがイングリットの熱い戦いぶりを見て、俺も火が点いてしまった。彼女と戦って、そして勝ちたい。"

[[dialogue]]
speaker = "unk"
# 行くぞ、イングリット！
line = "行くぞ、イングリット！"

[[dialogue]]
speaker = "イングリット"
# 「ああ、来い！」
line = "「ああ、来い！」"

[[dialogue]]
speaker = "イングリット"
# 「いい踏み込みだ！　だが、甘い！」
line = "「いい踏み込みだ！　だが、甘い！」"

[[dialogue]]
speaker = "イングリット"
# 「ツインリッパー！」
line = "「ツインリッパー！」"

[[dialogue]]
speaker = "unk"
# 俺の拳を１本の剣で受け流した次の瞬間、もう１本が閃く。
line = "俺の拳を１本の剣で受け流した次の瞬間、もう１本が閃く。"

[[dialogue]]
speaker = "unk"
# それをかわせば、さらに防御を終えた最初の１本が襲ってくる。
line = "それをかわせば、さらに防御を終えた最初の１本が襲ってくる。"

[[dialogue]]
speaker = "unk"
# まさに攻防一体。見惚れるような技の冴えだ。
line = "まさに攻防一体。見惚れるような技の冴えだ。"

[[dialogue]]
speaker = "unk"
# 強いな、君は
line = "強いな、君は"

[[dialogue]]
speaker = "イングリット"
# 「当然だ。私は強い。そしてまだまだ強くなるぞ！」
line = "「当然だ。私は強い。そしてまだまだ強くなるぞ！」"

[[dialogue]]
speaker = "イングリット"
# 「そのために貴様も強くなれ、魔王！　私は強くなった貴様も越えてさらに強くなる！」
line = "「そのために貴様も強くなれ、魔王！　私は強くなった貴様も越えてさらに強くなる！」"

[[dialogue]]
speaker = "イングリット"
# 「さぁ、避けられるものなら避けてみろ！　ブレイドクロスシザー！」
line = "「さぁ、避けられるものなら避けてみろ！　ブレイドクロスシザー！」"

[[dialogue]]
speaker = "unk"
# 剣を交差させて突進するイングリットに対し、俺はあえて回避せず、拳に星力を溜めて防御の姿勢を取る。
line = "剣を交差させて突進するイングリットに対し、俺はあえて回避せず、拳に星力を溜めて防御の姿勢を取る。"

[[dialogue]]
speaker = "イングリット"
# 「っ！　受け止めただと！？」
line = "「っ！　受け止めただと！？」"

[[dialogue]]
speaker = "unk"
# イングリットが力を込めた瞬間、剣の下をくぐり、前のめりになった上半身にアッパーを叩き込む。
line = "イングリットが力を込めた瞬間、剣の下をくぐり、前のめりになった上半身にアッパーを叩き込む。"

[[dialogue]]
speaker = "イングリット"
# 「ぐっ、があぁっ！」
line = "「ぐっ、があぁっ！」"

[[dialogue]]
speaker = "イングリット"
# 「調子になるなよ！　ふん！」
line = "「調子になるなよ！　ふん！」"

[[dialogue]]
speaker = "unk"
# 剣を手放したイングリットが俺の腕を掴み、気が付けば俺は砂浜に投げられていた。
line = "剣を手放したイングリットが俺の腕を掴み、気が付けば俺は砂浜に投げられていた。"

[[dialogue]]
speaker = "イングリット"
# 「クハハ、無様だな魔王！　全身砂まみれでお似合いだぞ！」
line = "「クハハ、無様だな魔王！　全身砂まみれでお似合いだぞ！」"

[[dialogue]]
speaker = "イングリット"
# 「私は体術も修めている。懐に潜り込めば勝てると思ったのなら、迂闊だったな」
line = "「私は体術も修めている。懐に潜り込めば勝てると思ったのなら、迂闊だったな」"

[[dialogue]]
speaker = "イングリット"
# 「今度はこちらの番だ！　そらそらそら！」
line = "「今度はこちらの番だ！　そらそらそら！」"

[[dialogue]]
speaker = "イングリット"
# 「隙ありだ、ツインリッパー！」
line = "「隙ありだ、ツインリッパー！」"

[[dialogue]]
speaker = "unk"
# アビスインパクト！
line = "アビスインパクト！"

[[dialogue]]
speaker = "イングリット"
# 「クク、楽しいな、魔王！　いつまでもこうしていたいくらいだ！」
line = "「クク、楽しいな、魔王！　いつまでもこうしていたいくらいだ！」"

[[dialogue]]
speaker = "イングリット"
# 「なぁ、貴様もそう思うだろう？」
line = "「なぁ、貴様もそう思うだろう？」"

[[dialogue]]
speaker = "unk"
# これは世界を救ったり何かを守ったりする戦いじゃない。
line = "これは世界を救ったり何かを守ったりする戦いじゃない。"

[[dialogue]]
speaker = "unk"
# もう世界は救った後で、つまるところ意味のない戦いだ。それでも、いや、だからこそ──
line = "もう世界は救った後で、つまるところ意味のない戦いだ。それでも、いや、だからこそ──"

[[dialogue]]
speaker = "unk"
# ああ、楽しい
line = "ああ、楽しい"

[[dialogue]]
speaker = "unk"
# イングリットは世界のことも、これからのことも、何も考えちゃいない。でも時にはそれくらい馬鹿になってもいい。
line = "イングリットは世界のことも、これからのことも、何も考えちゃいない。でも時にはそれくらい馬鹿になってもいい。"

[[dialogue]]
speaker = "イングリット"
# 「だが、貴様もそろそろ限界のようだな。では、決着といこうか」
line = "「だが、貴様もそろそろ限界のようだな。では、決着といこうか」"

[[dialogue]]
speaker = "unk"
# どんなに苦しい時も、楽しい時も、永遠には続かない。
line = "どんなに苦しい時も、楽しい時も、永遠には続かない。"

[[dialogue]]
speaker = "unk"
# だから今を全力で戦う。それが生きるってことだと彼女は言う。
line = "だから今を全力で戦う。それが生きるってことだと彼女は言う。"

[[dialogue]]
speaker = "イングリット"
# 「我が必殺の太刀を受けてみろ、魔王！　──ザンブレイクセイバー！！」
line = "「我が必殺の太刀を受けてみろ、魔王！　──ザンブレイクセイバー！！」"

[[dialogue]]
speaker = "unk"
# ディマイズブレイカー！
line = "ディマイズブレイカー！"

[[dialogue]]
speaker = "unk"
# イングリットの戦いから受けた熱い気持ちを拳に込めて、今、解き放つ！
line = "イングリットの戦いから受けた熱い気持ちを拳に込めて、今、解き放つ！"

[[dialogue]]
speaker = "イングリット"
# 「ふぅ、さすがに疲れたな……体が動かん」
line = "「ふぅ、さすがに疲れたな……体が動かん」"

[[dialogue]]
speaker = "unk"
# 俺たちは最後の激突でともに意識を失い、勝負は引き分けとなった。２人して夜の砂浜に転がっている。
line = "俺たちは最後の激突でともに意識を失い、勝負は引き分けとなった。２人して夜の砂浜に転がっている。"

[[dialogue]]
speaker = "イングリット"
# 「次は私が勝つからな。覚えていろ」
line = "「次は私が勝つからな。覚えていろ」"

[[dialogue]]
speaker = "イングリット"
# 「やはりお前と戦うのは楽しいな。……よし、休憩したらもう一戦やるか」
line = "「やはりお前と戦うのは楽しいな。……よし、休憩したらもう一戦やるか」"

[[dialogue]]
speaker = "unk"
# やらない
line = "やらない"

[[dialogue]]
speaker = "イングリット"
# 「チッ、ケチケチ魔王め。さっきはあんなにイキイキと戦っていたではないか」
line = "「チッ、ケチケチ魔王め。さっきはあんなにイキイキと戦っていたではないか」"

[[dialogue]]
speaker = "イングリット"
# 「……だが、まあいい。今日は気分がいいから許してやろう」
line = "「……だが、まあいい。今日は気分がいいから許してやろう」"

[[dialogue]]
speaker = "イングリット"
# 「人はいつまでも戦士でいることはできない。子どもは大人になり、大人は老人になり、そして死ぬ」
line = "「人はいつまでも戦士でいることはできない。子どもは大人になり、大人は老人になり、そして死ぬ」"

[[dialogue]]
speaker = "イングリット"
# 「だから、私たち戦士は子どもを産み、技を伝えてきた。いずれ私もそうするだろう」
line = "「だから、私たち戦士は子どもを産み、技を伝えてきた。いずれ私もそうするだろう」"

[[dialogue]]
speaker = "イングリット"
# 「戦士であるうちに、私は最強へと至る。そのために貴様には何度でも付き合ってもらうからな」
line = "「戦士であるうちに、私は最強へと至る。そのために貴様には何度でも付き合ってもらうからな」"

[[dialogue]]
speaker = "unk"
# いつも通りの身勝手さが、今はちょっとだけ気持ちいい。俺も焼きが回ったかもしれない。
line = "いつも通りの身勝手さが、今はちょっとだけ気持ちいい。俺も焼きが回ったかもしれない。"

[[dialogue]]
speaker = "イングリット"
# 「ああ、そうだ。私とともにウリルに来る約束、忘れるなよ。貴様には責任を取ってもらうからな」
line = "「ああ、そうだ。私とともにウリルに来る約束、忘れるなよ。貴様には責任を取ってもらうからな」"

[[dialogue]]
speaker = "レイラ"
# 「えぇ～っ！？　魔王さんとイングリット、そういうご関係だったんですか！？」
line = "「えぇ～っ！？　魔王さんとイングリット、そういうご関係だったんですか！？」"

[[dialogue]]
speaker = "レイラ"
# 「実家にご挨拶！？　しかも責任って！？」
line = "「実家にご挨拶！？　しかも責任って！？」"

[[dialogue]]
speaker = "イングリット"
# 「言葉通りの意味だが。何か文句でもあるのか？」
line = "「言葉通りの意味だが。何か文句でもあるのか？」"

[[dialogue]]
speaker = "レイラ"
# 「文句なんてとんでもない！　おめでとう、イングリット！　魔王さんはこれからイングリットの事よろしくお願いしますね！　うぅ～！」
line = "「文句なんてとんでもない！　おめでとう、イングリット！　魔王さんはこれからイングリットの事よろしくお願いしますね！　うぅ～！」"

[[dialogue]]
speaker = "イングリット"
# 「なんだ？　急に泣き出して気持ちの悪い奴だ」
line = "「なんだ？　急に泣き出して気持ちの悪い奴だ」"

[[dialogue]]
speaker = "unk"
# ひどく誤解されてる気がする……
line = "ひどく誤解されてる気がする……"

[[dialogue]]
speaker = "unk"
# この日以降、イングリットと付き合っていると周囲に思われ、トラブルの尻拭いに駆り出されるようになってしまったのだった──
line = "この日以降、イングリットと付き合っていると周囲に思われ、トラブルの尻拭いに駆り出されるようになってしまったのだった──"
