[[dialogue]]
speaker = "unk"
# 第２話,シャリオン魔界事情その２,P
line = "第２話,シャリオン魔界事情その２,P"

[[dialogue]]
speaker = "カティア"
# 「ワンワワ～ン♪　目指せ世界征服～♪」
line = "「ワンワワ～ン♪　目指せ世界征服～♪」"

[[dialogue]]
speaker = "unk"
# 放課後はカティアと一緒に花壇の手入れだ。カティアと付き合うようになってから、日課になっていた。
line = "放課後はカティアと一緒に花壇の手入れだ。カティアと付き合うようになってから、日課になっていた。"

[[dialogue]]
speaker = "カティア"
# 「魔王様、いつもありがとうございます。でも星徒会の仕事はいいんですか？　お忙しいんじゃ……」
line = "「魔王様、いつもありがとうございます。でも星徒会の仕事はいいんですか？　お忙しいんじゃ……」"

[[dialogue]]
speaker = "カティア"
# 「……え、星徒会のみんなも応援してくれてるから大丈夫？　そ、そうなんですか……恐縮です」
line = "「……え、星徒会のみんなも応援してくれてるから大丈夫？　そ、そうなんですか……恐縮です」"

[[dialogue]]
speaker = "カティア"
# 「あ、見てください、ここ！　魔王様に選んでもらったお花が咲いてます！　立派な赤いお花ですワン」
line = "「あ、見てください、ここ！　魔王様に選んでもらったお花が咲いてます！　立派な赤いお花ですワン」"

[[dialogue]]
speaker = "カティア"
# 「ふふっ、かわいい……それにいい匂い……魔王様もかいでみてください」
line = "「ふふっ、かわいい……それにいい匂い……魔王様もかいでみてください」"

[[dialogue]]
speaker = "unk"
# カティアに促されて花壇の前にかがむと、少し甘く、瑞々しい香りがした。
line = "カティアに促されて花壇の前にかがむと、少し甘く、瑞々しい香りがした。"

[[dialogue]]
speaker = "カティア"
# 「あ……」
line = "「あ……」"

[[dialogue]]
speaker = "unk"
# カティアも同じようにかがんでいたから、自然と間近で目が合う。
line = "カティアも同じようにかがんでいたから、自然と間近で目が合う。"

[[dialogue]]
speaker = "カティア"
# 「えっと、えっと…………ワン」
line = "「えっと、えっと…………ワン」"

[[dialogue]]
speaker = "unk"
# お互いの好意を確かめ合ってからというもの、こんな風に照れるカティアが見れて嬉しい。
line = "お互いの好意を確かめ合ってからというもの、こんな風に照れるカティアが見れて嬉しい。"

[[dialogue]]
speaker = "カティア"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "unk"
# カティアも俺もかがんでいるから、花壇で作業していると思われるはず……甘い誘惑に抗えなくて、花に誘われる虫のように、そっとカティアの唇に近付く。
line = "カティアも俺もかがんでいるから、花壇で作業していると思われるはず……甘い誘惑に抗えなくて、花に誘われる虫のように、そっとカティアの唇に近付く。"

[[dialogue]]
speaker = "カティア"
# 「……ハッ！　この匂いは！」
line = "「……ハッ！　この匂いは！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ディア―ブル家がハルヴィーノ家に負けるはずないでしょう。その前に、人口流出で領地が消滅するのでは～？」
line = "「ディア―ブル家がハルヴィーノ家に負けるはずないでしょう。その前に、人口流出で領地が消滅するのでは～？」"

[[dialogue]]
speaker = "ジュリエッテ"
# 「んぎぎぎ……ハルヴィーノ家が斜陽なのは事実でございますが、詐称魔王のディアーブル家ごときに遅れはとりませんわ～！」
line = "「んぎぎぎ……ハルヴィーノ家が斜陽なのは事実でございますが、詐称魔王のディアーブル家ごときに遅れはとりませんわ～！」"

[[dialogue]]
speaker = "unk"
# 向こうから、貴族の２人組がやってきた。何やら言い争いをしているようだ。
line = "向こうから、貴族の２人組がやってきた。何やら言い争いをしているようだ。"

[[dialogue]]
speaker = "カティア"
# （シャルレーヌ様の甘い匂い、やっぱり苦手……）
line = "（シャルレーヌ様の甘い匂い、やっぱり苦手……）"

[[dialogue]]
speaker = "シャルレーヌ"
# 「あら、会長さんにカティア先輩、ごきげんよう。お見苦しいところをすみません。少し野良フェレットに噛まれてしまって」
line = "「あら、会長さんにカティア先輩、ごきげんよう。お見苦しいところをすみません。少し野良フェレットに噛まれてしまって」"

[[dialogue]]
speaker = "ジュリエッテ"
# 「誰が野良フェレットでございますか！？　シャルレーヌ様こそ、えぇっと、その……サキュバスですわ～！」
line = "「誰が野良フェレットでございますか！？　シャルレーヌ様こそ、えぇっと、その……サキュバスですわ～！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「それはただの事実ですよ？　嫌味くらいさらっと言ってくださいな」
line = "「それはただの事実ですよ？　嫌味くらいさらっと言ってくださいな」"

[[dialogue]]
speaker = "カティア"
# 「２人してどうしたんです？　いつものケンカですか？」
line = "「２人してどうしたんです？　いつものケンカですか？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「くふふ♪　ケンカだなんて、カティア先輩は冗談がお上手ですね。私とジュリエッテ様でケンカなんてあり得るわけないじゃないですか～♪」
line = "「くふふ♪　ケンカだなんて、カティア先輩は冗談がお上手ですね。私とジュリエッテ様でケンカなんてあり得るわけないじゃないですか～♪」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ただ、シャリオン地方の将来について意見を交わしていただけですよ～♪　まぁ、ハルヴィーノ領はいずれなくなるかもしれませんが……」
line = "「ただ、シャリオン地方の将来について意見を交わしていただけですよ～♪　まぁ、ハルヴィーノ領はいずれなくなるかもしれませんが……」"

[[dialogue]]
speaker = "ジュリエッテ"
# 「うぅ～、言わせておけばぁ……おのれシャルレーヌ様……」
line = "「うぅ～、言わせておけばぁ……おのれシャルレーヌ様……」"

[[dialogue]]
speaker = "カティア"
# （……魔王様。ハルヴィーノ家は先々代あたりでこけて、だんだん人が少なくなってるって話です。昔は十貴族領でも一番人口が多かったらしいですけど）
line = "（……魔王様。ハルヴィーノ家は先々代あたりでこけて、だんだん人が少なくなってるって話です。昔は十貴族領でも一番人口が多かったらしいですけど）"

[[dialogue]]
speaker = "カティア"
# （あと、リクリエが落ち着いたから、シャリオン地方では十貴族同士の勢力争いが表面化するかもってシャルレーヌ……様が言ってました）
line = "（あと、リクリエが落ち着いたから、シャリオン地方では十貴族同士の勢力争いが表面化するかもってシャルレーヌ……様が言ってました）"

[[dialogue]]
speaker = "シャルレーヌ"
# 「このままでは、勢力争い以前に、魔獣から領地を守れなくなってしまうのではありませんか～？　そうなれば、領民が隣接するディア―ブルに助けを求めるのは必然」
line = "「このままでは、勢力争い以前に、魔獣から領地を守れなくなってしまうのではありませんか～？　そうなれば、領民が隣接するディア―ブルに助けを求めるのは必然」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ハルヴィーノ家の没落まであとわずか。今のうちに実家に戻られて、財産を引き上げた方がいいと思いますよ～？　くふふ♪」
line = "「ハルヴィーノ家の没落まであとわずか。今のうちに実家に戻られて、財産を引き上げた方がいいと思いますよ～？　くふふ♪」"

[[dialogue]]
speaker = "ジュリエッテ"
# 「実家の没落はいい気味でございますが、それをシャルレーヌ様に言われるのはハラ立つでございますわ～！　この温室栽培サキュバスが～！」
line = "「実家の没落はいい気味でございますが、それをシャルレーヌ様に言われるのはハラ立つでございますわ～！　この温室栽培サキュバスが～！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ぬくぬく育った箱入り娘ですみませ～ん♪」
line = "「ぬくぬく育った箱入り娘ですみませ～ん♪」"

[[dialogue]]
speaker = "カティア"
# （魔界の貴族の仕事は、星力がある者を率いて戦士団を組織し、魔獣から領地を守ることです）
line = "（魔界の貴族の仕事は、星力がある者を率いて戦士団を組織し、魔獣から領地を守ることです）"

[[dialogue]]
speaker = "カティア"
# （だから貴族は代々星力を持っていて……星力に目覚めない貴族の立ち位置はめちゃくちゃ微妙です）
line = "（だから貴族は代々星力を持っていて……星力に目覚めない貴族の立ち位置はめちゃくちゃ微妙です）"

[[dialogue]]
speaker = "カティア"
# （だから、幼くして星力があったシャルレーヌ様は大事にされてて、星力がなかったジュリエッテ……様？　は冷たい扱いを受けていたんだと思います）
line = "（だから、幼くして星力があったシャルレーヌ様は大事にされてて、星力がなかったジュリエッテ……様？　は冷たい扱いを受けていたんだと思います）"

[[dialogue]]
speaker = "unk"
# 貴族だからといって、優雅な暮らしが約束されているわけでもないらしい。複雑な魔界事情だ。
line = "貴族だからといって、優雅な暮らしが約束されているわけでもないらしい。複雑な魔界事情だ。"

[[dialogue]]
speaker = "カティア"
# 「まぁ、庶民としては魔獣から守ってくれれば、どこの貴族でもいいんですけどね」
line = "「まぁ、庶民としては魔獣から守ってくれれば、どこの貴族でもいいんですけどね」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「む。せっかくヒントをあげているのに、何を言っているんです？　これはあなたにとってチャンスなんですよ、カティア先輩」
line = "「む。せっかくヒントをあげているのに、何を言っているんです？　これはあなたにとってチャンスなんですよ、カティア先輩」"

[[dialogue]]
speaker = "カティア"
# 「え……？」
line = "「え……？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「今のあなたなら、ハルヴィーノ戦士団よりも強い。領民の危機に駆け付けて活躍すれば、ハルヴィーノ領を乗っ取り、セルベラス領にすることだってできます」
line = "「今のあなたなら、ハルヴィーノ戦士団よりも強い。領民の危機に駆け付けて活躍すれば、ハルヴィーノ領を乗っ取り、セルベラス領にすることだってできます」"

[[dialogue]]
speaker = "ジュリエッテ"
# 「はあ！？　このワンコロがでございますか！？」
line = "「はあ！？　このワンコロがでございますか！？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「はい。ジュリエッテ様の数倍は強いですよ？　何せ魔将ですから」
line = "「はい。ジュリエッテ様の数倍は強いですよ？　何せ魔将ですから」"

[[dialogue]]
speaker = "unk"
# 魔将の力はノヴァフォームに匹敵する。コラプサーであっても直接戦闘に向かないジュリエッテよりは当然強い。
line = "魔将の力はノヴァフォームに匹敵する。コラプサーであっても直接戦闘に向かないジュリエッテよりは当然強い。"

[[dialogue]]
speaker = "カティア"
# 「シャルレーヌ様の言うことが本当だとしても、私はそんなことしません。ハルヴィーノ領がピンチなら、普通に助けに行くだけです」
line = "「シャルレーヌ様の言うことが本当だとしても、私はそんなことしません。ハルヴィーノ領がピンチなら、普通に助けに行くだけです」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「へぇ、強欲の魔将ともあろう者が、無欲なんですね。十貴族に成り上がる近道で、世界征服の足掛かりになるかもしれなくても？」
line = "「へぇ、強欲の魔将ともあろう者が、無欲なんですね。十貴族に成り上がる近道で、世界征服の足掛かりになるかもしれなくても？」"

[[dialogue]]
speaker = "カティア"
# 「はい。だって、私は魔王様の一番の配下で、星騎士だから。危ない目に遭っている人を助けるのが星騎士ですから！　ね、魔王様！」
line = "「はい。だって、私は魔王様の一番の配下で、星騎士だから。危ない目に遭っている人を助けるのが星騎士ですから！　ね、魔王様！」"

[[dialogue]]
speaker = "unk"
# ああ。もちろんだ
line = "ああ。もちろんだ"

[[dialogue]]
speaker = "カティア"
# 「魔王様が魔王様らしくあるだけで、世界がかしずく──それが私たちの世界征服だベロス！」
line = "「魔王様が魔王様らしくあるだけで、世界がかしずく──それが私たちの世界征服だベロス！」"

[[dialogue]]
speaker = "ジュリエッテ"
# （え……べろ？　何でございますの、今のクソダサ語尾は？）
line = "（え……べろ？　何でございますの、今のクソダサ語尾は？）"

[[dialogue]]
speaker = "シャルレーヌ"
# 「ふぅん……あくまでそういうスタンスなんですね。では、お手並み拝見といきましょうか」
line = "「ふぅん……あくまでそういうスタンスなんですね。では、お手並み拝見といきましょうか」"

[[dialogue]]
speaker = "ジュリエッテ"
# 「世界征服を目指すなら、あなたたちも私のライバルでございます。首をお洗いになられるとよろしいですわ！」
line = "「世界征服を目指すなら、あなたたちも私のライバルでございます。首をお洗いになられるとよろしいですわ！」"

[[dialogue]]
speaker = "カティア"
# 「いや、ジュリエッテ様にはもう勝ってるし」
line = "「いや、ジュリエッテ様にはもう勝ってるし」"

[[dialogue]]
speaker = "ジュリエッテ"
# 「むき～～！　ああ言えばこう言うワンコロですわ～！　くぅ～、今日のところはこれで失礼いたしますわ！」
line = "「むき～～！　ああ言えばこう言うワンコロですわ～！　くぅ～、今日のところはこれで失礼いたしますわ！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「くふふ♪　野良フェレットちゃん、しっぽ巻いて逃げちゃいましたね～♪」
line = "「くふふ♪　野良フェレットちゃん、しっぽ巻いて逃げちゃいましたね～♪」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「では、私も失礼いたします。おふたりの時間をお邪魔してすみません」
line = "「では、私も失礼いたします。おふたりの時間をお邪魔してすみません」"

[[dialogue]]
speaker = "unk"
# 優雅に一礼して、シャルレーヌも去っていった。
line = "優雅に一礼して、シャルレーヌも去っていった。"

[[dialogue]]
speaker = "unk"
# 何だったんだろう、今の……
line = "何だったんだろう、今の……"

[[dialogue]]
speaker = "カティア"
# 「さぁ……貴族って気まぐれなものですから……」
line = "「さぁ……貴族って気まぐれなものですから……」"

[[dialogue]]
speaker = "unk"
# どっと疲れた俺たちは、花の水やりを手早く終えて帰路に就いたのだった……
line = "どっと疲れた俺たちは、花の水やりを手早く終えて帰路に就いたのだった……"
