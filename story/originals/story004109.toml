[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「はぁ、はぁ、はぁ、はぁあ～～～～～～<emoji=heart04>」
line = "「はぁ、はぁ、はぁ、はぁあ～～～～～～<emoji=heart04>」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「力が湧いて、きます……。体が、疼いて……はぁ、あはぁっ<emoji=heart04>」
line = "「力が湧いて、きます……。体が、疼いて……はぁ、あはぁっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# イクシリオンは未知の感覚に戸惑っているのか、もじもじと太ももを擦り合わせる。
line = "イクシリオンは未知の感覚に戸惑っているのか、もじもじと太ももを擦り合わせる。"

[[dialogue]]
speaker = "カティア"
# （なんかこう……えっちな感じ……友達のえっちな顔とか見たくないんだけど！）
line = "（なんかこう……えっちな感じ……友達のえっちな顔とか見たくないんだけど！）"

[[dialogue]]
speaker = "サラン"
# 「イクシーちゃん、どうしたの～？」
line = "「イクシーちゃん、どうしたの～？」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「いえ、その……ムラムラ、もといムズムズしてしまって、抑えられないんです……あっ<emoji=heart04>」
line = "「いえ、その……ムラムラ、もといムズムズしてしまって、抑えられないんです……あっ<emoji=heart04>」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「体が……んんっ、特にお腹の……しきゅ……が熱くてぇ……<emoji=heart04>」
line = "「体が……んんっ、特にお腹の……しきゅ……が熱くてぇ……<emoji=heart04>」"

[[dialogue]]
speaker = "サラン"
# 「し……なんて～？」
line = "「し……なんて～？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「丹田！　おへその下って丹田って言うらしいですよイクシリオン先輩！」
line = "「丹田！　おへその下って丹田って言うらしいですよイクシリオン先輩！」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「そ、そうです！　丹田がすごく熱いんですぅ！」
line = "「そ、そうです！　丹田がすごく熱いんですぅ！」"

[[dialogue]]
speaker = "シャルレーヌ"
# （あっぶな……こいつ、戦闘中に直球のエロ発言かまそうとしたわよ。ていうか、なんで私がフォローしてるのよ！）
line = "（あっぶな……こいつ、戦闘中に直球のエロ発言かまそうとしたわよ。ていうか、なんで私がフォローしてるのよ！）"

[[dialogue]]
speaker = "unk"
# 魔将となったイクシリオンの下腹部には生物的な文様が刻まれ、妖しく光る。
line = "魔将となったイクシリオンの下腹部には生物的な文様が刻まれ、妖しく光る。"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「あぁ、感じます……<emoji=heart04>　私の星力と、魔本の魔力がここで交わって……あっ<emoji=heart04>　より大きな力が育っていますっ<emoji=heart04>」
line = "「あぁ、感じます……<emoji=heart04>　私の星力と、魔本の魔力がここで交わって……あっ<emoji=heart04>　より大きな力が育っていますっ<emoji=heart04>」"

[[dialogue]]
speaker = "モンスター"
# 「ガァアア！！」
line = "「ガァアア！！」"

[[dialogue]]
speaker = "unk"
# イクシリオンの異様さに様子をうかがっていたモンスターだったが、しびれを切らして襲いかかる。
line = "イクシリオンの異様さに様子をうかがっていたモンスターだったが、しびれを切らして襲いかかる。"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「──ラストクレイモア」
line = "「──ラストクレイモア」"

[[dialogue]]
speaker = "unk"
# 闇をまとった大剣が、瘴気ごとモンスターを切って捨てた。
line = "闇をまとった大剣が、瘴気ごとモンスターを切って捨てた。"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「はぁあ～～～～っ<emoji=heart04>　これが魔将の力……なんて気持ちいいんでしょう<emoji=heart04>」
line = "「はぁあ～～～～っ<emoji=heart04>　これが魔将の力……なんて気持ちいいんでしょう<emoji=heart04>」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「んん、もっと、もっと気持ちよくなりたいです……<emoji=heart04>」
line = "「んん、もっと、もっと気持ちよくなりたいです……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 自らの下腹部を撫でるイクシリオン。すると文様が輝きを増し、さらに力を高めていく。
line = "自らの下腹部を撫でるイクシリオン。すると文様が輝きを増し、さらに力を高めていく。"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「はぁあああっ！！　メガリビドーディヴァイダーーッ！！」
line = "「はぁあああっ！！　メガリビドーディヴァイダーーッ！！」"

[[dialogue]]
speaker = "unk"
# 魔力で編まれた刃が伸び、天にも届くような極大の剣と化し、モンスターをまとめて両断する。
line = "魔力で編まれた刃が伸び、天にも届くような極大の剣と化し、モンスターをまとめて両断する。"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「はぁあ～～～～～～っ<emoji=heart04>　ゾクゾクします～～っ<emoji=heart04>　もっと、もっとぉっ<emoji=heart04>」
line = "「はぁあ～～～～～～っ<emoji=heart04>　ゾクゾクします～～っ<emoji=heart04>　もっと、もっとぉっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 嗜虐的な笑みを浮かべ、剣を振るうイクシリオン。その快感を表すように、文様はますます煌めいていた。
line = "嗜虐的な笑みを浮かべ、剣を振るうイクシリオン。その快感を表すように、文様はますます煌めいていた。"

[[dialogue]]
speaker = "カティア"
# 「わーはっはっは！　どけどけモンスターども！　ここは私と魔王様の領地だぞー！　ワンワンアーミー突撃～！」
line = "「わーはっはっは！　どけどけモンスターども！　ここは私と魔王様の領地だぞー！　ワンワンアーミー突撃～！」"

[[dialogue]]
speaker = "unk"
# カティアは数に任せた攻撃でモンスターを蹂躙する。使い魔犬は倒されても種となり、また大地に新たな芽吹きを残していく。
line = "カティアは数に任せた攻撃でモンスターを蹂躙する。使い魔犬は倒されても種となり、また大地に新たな芽吹きを残していく。"

[[dialogue]]
speaker = "サラン"
# 「イクシーちゃんもカティアちゃんも楽しそう～♪　いいな～♪」
line = "「イクシーちゃんもカティアちゃんも楽しそう～♪　いいな～♪」"

[[dialogue]]
speaker = "サラン"
# 「じゃあ、サランも悪い子になっちゃおうかな～」
line = "「じゃあ、サランも悪い子になっちゃおうかな～」"

[[dialogue]]
speaker = "unk"
# そう言ってサランはモンスターの頭上に飛び、巨大な泡だて器を構えた。
line = "そう言ってサランはモンスターの頭上に飛び、巨大な泡だて器を構えた。"

[[dialogue]]
speaker = "サラン"
# 「サランは、誰かのためを思って作るお菓子が大好き～」
line = "「サランは、誰かのためを思って作るお菓子が大好き～」"

[[dialogue]]
speaker = "サラン"
# 「誰かがおいしいって言ってくれるのが嬉しいから、お菓子作りが大好きなんだ～」
line = "「誰かがおいしいって言ってくれるのが嬉しいから、お菓子作りが大好きなんだ～」"

[[dialogue]]
speaker = "サラン"
# 「でもね～。今日は誰かのためじゃなくて、サランのためだけに作るんだぁ～。今日はそんな気分なの～♪」
line = "「でもね～。今日は誰かのためじゃなくて、サランのためだけに作るんだぁ～。今日はそんな気分なの～♪」"

[[dialogue]]
speaker = "サラン"
# 「今日のサランは悪い子だから～♪　好き放題しちゃうよぉ～♪」
line = "「今日のサランは悪い子だから～♪　好き放題しちゃうよぉ～♪」"

[[dialogue]]
speaker = "unk"
# サランが泡だて器に魔力を集め、ふわりと虚空を泳がすと、綿菓子の雲が生まれた。
line = "サランが泡だて器に魔力を集め、ふわりと虚空を泳がすと、綿菓子の雲が生まれた。"

[[dialogue]]
speaker = "サラン"
# 「そ～れ～！　キルシュシュガーレイン！」
line = "「そ～れ～！　キルシュシュガーレイン！」"

[[dialogue]]
speaker = "unk"
# 空からシロップの雨が降り注ぎ、華やかな香りが辺り一面に漂う。
line = "空からシロップの雨が降り注ぎ、華やかな香りが辺り一面に漂う。"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「あ、甘くて美味しいですね。でもそれだけではないような……？」
line = "「あ、甘くて美味しいですね。でもそれだけではないような……？」"

[[dialogue]]
speaker = "unk"
# シロップは味方を癒す一方で、モンスターには毒となる。
line = "シロップは味方を癒す一方で、モンスターには毒となる。"

[[dialogue]]
speaker = "モンスター"
# 「ガ……？」
line = "「ガ……？」"

[[dialogue]]
speaker = "unk"
# 酔ったように足元がおぼつかなくなる異形たち。方向を見失い、お互いに激突する。
line = "酔ったように足元がおぼつかなくなる異形たち。方向を見失い、お互いに激突する。"

[[dialogue]]
speaker = "サラン"
# 「お次はあま～いクリーム召し上がれ～♪　グラトニースイートディザスタ～！」
line = "「お次はあま～いクリーム召し上がれ～♪　グラトニースイートディザスタ～！」"

[[dialogue]]
speaker = "unk"
# 泡だて器がくるくると踊ると、クリームの波が瞬く間に生まれ、甘い破滅がモンスターを飲み込んでいく。
line = "泡だて器がくるくると踊ると、クリームの波が瞬く間に生まれ、甘い破滅がモンスターを飲み込んでいく。"

[[dialogue]]
speaker = "モンスター"
# 「ガァ～～♪」
line = "「ガァ～～♪」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「モンスターが幸せそうな鳴き声を上げて消滅した……。こわ……」
line = "「モンスターが幸せそうな鳴き声を上げて消滅した……。こわ……」"

[[dialogue]]
speaker = "サラン"
# 「ん～、たのしい～♪　もっと甘めでもいいかな～。香りは……バラのリキュールを使ってみてもいいかも～」
line = "「ん～、たのしい～♪　もっと甘めでもいいかな～。香りは……バラのリキュールを使ってみてもいいかも～」"

[[dialogue]]
speaker = "unk"
# クリームをぺろりとひと舐めしながら、微笑むサラン。戦闘中だというのにまるで遊んでいるようだ。
line = "クリームをぺろりとひと舐めしながら、微笑むサラン。戦闘中だというのにまるで遊んでいるようだ。"

[[dialogue]]
speaker = "サラン"
# 「うん、できあがり～。サランのおすすめ、たっぷり召し上がれ～♪」
line = "「うん、できあがり～。サランのおすすめ、たっぷり召し上がれ～♪」"

[[dialogue]]
speaker = "unk"
# ホイッパーが宙を舞う度、様々な味わいクリームの波が生まれ、モンスターを丸呑みにしていく。
line = "ホイッパーが宙を舞う度、様々な味わいクリームの波が生まれ、モンスターを丸呑みにしていく。"

[[dialogue]]
speaker = "カティア"
# 「行け行けワンワンアーミー！　モンスターを倒して魔王様に褒めてもらうんだー！　手柄はみんな私のものだ！　わはははは！」
line = "「行け行けワンワンアーミー！　モンスターを倒して魔王様に褒めてもらうんだー！　手柄はみんな私のものだ！　わはははは！」"

[[dialogue]]
speaker = "unk"
# 使い魔犬の大群が領地を増やしながらモンスターを包囲、逃げ道を奪う。
line = "使い魔犬の大群が領地を増やしながらモンスターを包囲、逃げ道を奪う。"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「はぁ、はぁ……メガリビドーディヴァイダー！！　はぅああ～～～～<emoji=heart04>」
line = "「はぁ、はぁ……メガリビドーディヴァイダー！！　はぅああ～～～～<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 上空からはイクシリオンの大剣が襲い掛かり──
line = "上空からはイクシリオンの大剣が襲い掛かり──"

[[dialogue]]
speaker = "サラン"
# 「おかわりもあるから～残さず食べてね～♪　ふふ、ふふふ～♪」
line = "「おかわりもあるから～残さず食べてね～♪　ふふ、ふふふ～♪」"

[[dialogue]]
speaker = "unk"
# 残ったモンスターすら、サランのクリームに飲み込まれる。
line = "残ったモンスターすら、サランのクリームに飲み込まれる。"

[[dialogue]]
speaker = "シャルレーヌ"
# 「私、もう帰っていいですか……？」
line = "「私、もう帰っていいですか……？」"

[[dialogue]]
speaker = "unk"
# 我欲を開放した魔将たちによってモンスターが殲滅されていく様を、シャルレーヌは茫然と眺めるしかなかった。
line = "我欲を開放した魔将たちによってモンスターが殲滅されていく様を、シャルレーヌは茫然と眺めるしかなかった。"
