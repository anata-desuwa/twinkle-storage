[[dialogue]]
speaker = "ゴースト"
# 「キャッキャッ！　キャッキャッ！」
line = "「キャッキャッ！　キャッキャッ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「この教室だけじゃないね。隣も、廊下も……学園中にお化けがたくさん。捕まえても捕まえてもキリがないや」
line = "「この教室だけじゃないね。隣も、廊下も……学園中にお化けがたくさん。捕まえても捕まえてもキリがないや」"

[[dialogue]]
speaker = "ベアトリス"
# 「ミャーッ！？　チョークで壁に落書きしてる！　そんなところに書いたら怒られちゃうよー！」
line = "「ミャーッ！？　チョークで壁に落書きしてる！　そんなところに書いたら怒られちゃうよー！」"

[[dialogue]]
speaker = "ベアトリス"
# 「んー？　いろいろ描いてるけど、アレって何だろ？　大きなカボチャ？」
line = "「んー？　いろいろ描いてるけど、アレって何だろ？　大きなカボチャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ていうかジャクリーヌじゃない？　彼女、ゴーストに変身するらしいし」
line = "「ていうかジャクリーヌじゃない？　彼女、ゴーストに変身するらしいし」"

[[dialogue]]
speaker = "ベアトリス"
# 「あ、ホントだ。よく見るとかわいい──ってそうじゃない！」
line = "「あ、ホントだ。よく見るとかわいい──ってそうじゃない！」"

[[dialogue]]
speaker = "ベアトリス"
# 「とりあえず、やめさせなきゃ！　フニャーッ！　イタズラはやめニャさーい！」
line = "「とりあえず、やめさせなきゃ！　フニャーッ！　イタズラはやめニャさーい！」"

[[dialogue]]
speaker = "ナターシャ"
# 「その格好のベアトが怒っても迫力ないなー」
line = "「その格好のベアトが怒っても迫力ないなー」"

[[dialogue]]
speaker = "ゴースト"
# 「キャッキャッキャーーーッ！」
line = "「キャッキャッキャーーーッ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「わぷっ！　チョークの粉がー！　げほげほっ！」
line = "「わぷっ！　チョークの粉がー！　げほげほっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「煙幕みたいに真っ白だね。聞き分けの良くない子は嫌いだよ」
line = "「煙幕みたいに真っ白だね。聞き分けの良くない子は嫌いだよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「説得しようにも止めようにも数が多すぎてキリがないし……片っ端から消す？」
line = "「説得しようにも止めようにも数が多すぎてキリがないし……片っ端から消す？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ジャクリーヌさんのお友達だから、それはダメ～～～ッ！？」
line = "「ジャクリーヌさんのお友達だから、それはダメ～～～ッ！？」"

[[dialogue]]
speaker = "ゴースト"
# 「キャッキャッキャッ！　キヒヒヒヒッ！」
line = "「キャッキャッキャッ！　キヒヒヒヒッ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「あ、また増えてる。こうなったら、元凶を先に捕まえるしかないかな」
line = "「あ、また増えてる。こうなったら、元凶を先に捕まえるしかないかな」"

[[dialogue]]
speaker = "ベアトリス"
# 「元凶ってジャクリーヌさんのこと？」
line = "「元凶ってジャクリーヌさんのこと？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そうそう。あのお化けの扱いは、ジャクリーヌの専売特許だろうし」
line = "「そうそう。あのお化けの扱いは、ジャクリーヌの専売特許だろうし」"

[[dialogue]]
speaker = "ナターシャ"
# 「学園中が落書きだらけになる前に、もう一度ジャクリーヌを見つけて、問いただした方がよさそうだね」
line = "「学園中が落書きだらけになる前に、もう一度ジャクリーヌを見つけて、問いただした方がよさそうだね」"

[[dialogue]]
speaker = "ナターシャ"
# 「あ、見つけた」
line = "「あ、見つけた」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「ゆゆゆっ！？　ハレンチな格好の女たちが余に迫ってくるのっ！？」
line = "「ゆゆゆっ！？　ハレンチな格好の女たちが余に迫ってくるのっ！？」"

[[dialogue]]
speaker = "ベアトリス"
# 「誰のせいでいやらしい格好になったと思ってるんですかニャンッ！？」
line = "「誰のせいでいやらしい格好になったと思ってるんですかニャンッ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「このゴーストたちを操ってるのは、あなたなんでしょ？　大事になる前に引っ込めてよ」
line = "「このゴーストたちを操ってるのは、あなたなんでしょ？　大事になる前に引っ込めてよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「このままじゃお掃除が大変になっちゃうよ～」
line = "「このままじゃお掃除が大変になっちゃうよ～」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「ち、違うの！　ゴーストたちがヤンチャしてるのは、余のせいじゃないゆ！」
line = "「ち、違うの！　ゴーストたちがヤンチャしてるのは、余のせいじゃないゆ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「じゃ、誰のせい？」
line = "「じゃ、誰のせい？」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「あえて誰のせいかと問われたら、そこの猫娘のせいなの」
line = "「あえて誰のせいかと問われたら、そこの猫娘のせいなの」"

[[dialogue]]
speaker = "ベアトリス"
# 「ウニャーッ！？　私、何もしてないですよーっ！」
line = "「ウニャーッ！？　私、何もしてないですよーっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアトなわけないでしょ。ワケのわからないデタラメ言ってると──」
line = "「ベアトなわけないでしょ。ワケのわからないデタラメ言ってると──」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「デタラメではないの！　さっき猫娘からもらったミラクルＳＳＲお菓子によって、ハロウィンパワーがめいっぱいまで高まったゆ！」
line = "「デタラメではないの！　さっき猫娘からもらったミラクルＳＳＲお菓子によって、ハロウィンパワーがめいっぱいまで高まったゆ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ああ、あの虹色立方体？　そんなに凄いパワーがあったんだ」
line = "「ああ、あの虹色立方体？　そんなに凄いパワーがあったんだ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ええっ、あれただのお菓子だよ！？」
line = "「ええっ、あれただのお菓子だよ！？」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「別世界のブツはそれだけで凄いパワーを秘めてるゆ」
line = "「別世界のブツはそれだけで凄いパワーを秘めてるゆ」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「あまりに強烈なパワーのおかげで魔界の門がデッカく繋がり、ゴーストたちがたっぷり現れてしまったゆ」
line = "「あまりに強烈なパワーのおかげで魔界の門がデッカく繋がり、ゴーストたちがたっぷり現れてしまったゆ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ニャるほど～……そう言われちゃったら、私のせいなのかもしれないです……」
line = "「ニャるほど～……そう言われちゃったら、私のせいなのかもしれないです……」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアトが責任感じることはないよ。悪いのは門を通ってきたお化けたちなんだから」
line = "「ベアトが責任感じることはないよ。悪いのは門を通ってきたお化けたちなんだから」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「まーまー、慌てることはないゆ。このくらいのハプニング、ハロウィンではよくあることなの。日常チャメシ事ゆ」
line = "「まーまー、慌てることはないゆ。このくらいのハプニング、ハロウィンではよくあることなの。日常チャメシ事ゆ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ハプニングのベテランですね……慌てなくても平気ニャんですか？」
line = "「ハプニングのベテランですね……慌てなくても平気ニャんですか？」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「んゆ。今回は『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』が倒されて、リクリエが終わって、初めてのハロウィンゆ」
line = "「んゆ。今回は『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』が倒されて、リクリエが終わって、初めてのハロウィンゆ」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「だからゴーストたちも嬉しすぎてはしゃいでるだけなの。仕方ないことゆ。満足すればイタズラもやめるゆ」
line = "「だからゴーストたちも嬉しすぎてはしゃいでるだけなの。仕方ないことゆ。満足すればイタズラもやめるゆ」"

[[dialogue]]
speaker = "ベアトリス"
# 「う～ん、気持ちはわかるかな……私もテンション上がっちゃってますしっ」
line = "「う～ん、気持ちはわかるかな……私もテンション上がっちゃってますしっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「それならゴーストさんたちも一緒に楽しめるハロウィンパーティーにするっていうのはどうですか？」
line = "「それならゴーストさんたちも一緒に楽しめるハロウィンパーティーにするっていうのはどうですか？」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「どーゆーことゆ？」
line = "「どーゆーことゆ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「あー……イタズラより楽しいイベントがあれば、お化けたちも早めに満足してくれるかもってこと？」
line = "「あー……イタズラより楽しいイベントがあれば、お化けたちも早めに満足してくれるかもってこと？」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「それはナイスアイデアなの♪　み～んな、楽しいことに飢えてるゆ。もちろん余も含めてゆ」
line = "「それはナイスアイデアなの♪　み～んな、楽しいことに飢えてるゆ。もちろん余も含めてゆ」"

[[dialogue]]
speaker = "ベアトリス"
# 「参加する人……霊？　が増えれば、盛り上がること間違いなしだよ。ねっ♪」
line = "「参加する人……霊？　が増えれば、盛り上がること間違いなしだよ。ねっ♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「まあ……そうかな。そうかも。ベアトが言うなら、やらざるを得ないかな」
line = "「まあ……そうかな。そうかも。ベアトが言うなら、やらざるを得ないかな」"

[[dialogue]]
speaker = "ナターシャ"
# 「選管だけでパーティーするつもりだったけど……ま、パーティーってそういうものか」
line = "「選管だけでパーティーするつもりだったけど……ま、パーティーってそういうものか」"

[[dialogue]]
speaker = "ベアトリス"
# 「トラブルとハプニングとアクシデントはイベントにはつきものだよ。仕方ないよねっ」
line = "「トラブルとハプニングとアクシデントはイベントにはつきものだよ。仕方ないよねっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアトも騒動に巻き込まれるのに慣れてるよね。すっかりベテランだ」
line = "「ベアトも騒動に巻き込まれるのに慣れてるよね。すっかりベテランだ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ふふっ、伊達に世界を超えてないニャ♪」
line = "「ふふっ、伊達に世界を超えてないニャ♪」"
