speaker = "マグダレナ"
# 「《試練》のパテル。彼女は私たちの前にも滅多に姿を現しませんから、そもそも彼女を見つけること自体が大変です」
line = "「《試練》のパテル。彼女は私たちの前にも滅多に姿を現しませんから、そもそも彼女を見つけること自体が大変です」"

[[dialogue]]
speaker = "アルモタヘル"
# 「<ruby=よし>縦</ruby>んば奴を見つけることが出来たとしても、説得には骨が折れるであろうな」
line = "「<ruby>縦<rt>よし</rt></ruby>んば奴を見つけることが出来たとしても、説得には骨が折れるであろうな」"

[[dialogue]]
speaker = "オオヒメ"
# 「飄々としているようでいて、気難しい奴だからな……先日の会議の時も、捕まえるのにどれだけ苦労したことか」
line = "「飄々としているようでいて、気難しい奴だからな……先日の会議の時も、捕まえるのにどれだけ苦労したことか」"

[[dialogue]]
speaker = "ラクシャ"
# 「そうだね。でも大丈夫だよ。彼女の居場所にはちょっと心当たりがあるし、ボクからのお願いなら聞いてもらえそうなんだよね」
line = "「そうだね。でも大丈夫だよ。彼女の居場所にはちょっと心当たりがあるし、ボクからのお願いなら聞いてもらえそうなんだよね」"

[[dialogue]]
speaker = "オオヒメ"
# 「どういうことだ？」
line = "「どういうことだ？」"

[[dialogue]]
speaker = "ラクシャ"
# 「まあまあ、とりあえず彼女に会いに行こうよ。そこからは当たって砕けろって感じで♪」
line = "「まあまあ、とりあえず彼女に会いに行こうよ。そこからは当たって砕けろって感じで♪」"

[[dialogue]]
speaker = "unk"
# 自信たっぷりのラクシャに一抹の不安を感じながらも、守護天使たちは最後の１人であるパテルの元へと向かったのだった。
line = "自信たっぷりのラクシャに一抹の不安を感じながらも、守護天使たちは最後の１人であるパテルの元へと向かったのだった。"
