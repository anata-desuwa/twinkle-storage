[[dialogue]]
speaker = "unk"
# 第６話,リクリエの瘴気,B
line = "第６話,リクリエの瘴気,B"

[[dialogue]]
speaker = "メルエル"
# 「ぅ、あ、ああぁあああっ──！！！？？？」
line = "「ぅ、あ、ああぁあああっ──！！！？？？」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエルっ！？」
line = "「メルエルっ！？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「拒む必要はないわ。その瘴気は、２０００年前も貴女の先祖を導いたもの。身をゆだねて、私と共に来なさい」
line = "「拒む必要はないわ。その瘴気は、２０００年前も貴女の先祖を導いたもの。身をゆだねて、私と共に来なさい」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふざけるな──！！」
line = "「ふざけるな──！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「暗殺者如きの刃が届くわけがないわ」
line = "「暗殺者如きの刃が届くわけがないわ」"

[[dialogue]]
speaker = "ラストナンバー"
# 「特別に慈悲を与えてあげましょう。姫咲メルエルが使徒と成った暁には、貴女も連れて行ってあげてもいい」
line = "「特別に慈悲を与えてあげましょう。姫咲メルエルが使徒と成った暁には、貴女も連れて行ってあげてもいい」"

[[dialogue]]
speaker = "ラストナンバー"
# 「使徒となって世界を刷新する姫咲メルエルにも、手足となる従者はあって困らないでしょうし」
line = "「使徒となって世界を刷新する姫咲メルエルにも、手足となる従者はあって困らないでしょうし」"

[[dialogue]]
speaker = "ナターシャ"
# 「寝言は寝ていいなよ……正気を失ってからも、あの子に尽くせって！？　そんなの、願い下げ！！」
line = "「寝言は寝ていいなよ……正気を失ってからも、あの子に尽くせって！？　そんなの、願い下げ！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「そう。ならばここで死ぬしかないわね。可哀そうに」
line = "「そう。ならばここで死ぬしかないわね。可哀そうに」"

[[dialogue]]
speaker = "ナターシャ"
# 「舐めるなっ──！！」
line = "「舐めるなっ──！！」"

[[dialogue]]
speaker = "unk"
# 望まぬ暗殺者稼業ではあった。しかし聖庭園のエージェントとして、誰よりもナターシャは優秀だった。
line = "望まぬ暗殺者稼業ではあった。しかし聖庭園のエージェントとして、誰よりもナターシャは優秀だった。"

[[dialogue]]
speaker = "unk"
# だからこそ、姫の側近という地位を確立していたのに。
line = "だからこそ、姫の側近という地位を確立していたのに。"

[[dialogue]]
speaker = "ナターシャ"
# （強すぎるっ……私がやろうとしていることは全部筒抜け。フェイントも通じない、無理に攻めれば隙を突かれるっ──！）
line = "（強すぎるっ……私がやろうとしていることは全部筒抜け。フェイントも通じない、無理に攻めれば隙を突かれるっ──！）"

[[dialogue]]
speaker = "ナターシャ"
# （早くこいつを倒さないといけないのに！　急がないと──）
line = "（早くこいつを倒さないといけないのに！　急がないと──）"

[[dialogue]]
speaker = "ナターシャ"
# （メルエルが──帰ってこられなくなる！！）
line = "（メルエルが──帰ってこられなくなる！！）"

[[dialogue]]
speaker = "ラストナンバー"
# 「スピードだけは自信があるみたいね。でも──」
line = "「スピードだけは自信があるみたいね。でも──」"

[[dialogue]]
speaker = "unk"
# 霊力で形成された光の羽が、礫の嵐となってナターシャを襲う。
line = "霊力で形成された光の羽が、礫の嵐となってナターシャを襲う。"

[[dialogue]]
speaker = "ナターシャ"
# 「ぐっ──ぁあぁあっ──！！」
line = "「ぐっ──ぁあぁあっ──！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「暗殺者の足は止めた──次の相手は、少し本腰を入れないとね」
line = "「暗殺者の足は止めた──次の相手は、少し本腰を入れないとね」"

[[dialogue]]
speaker = "unk"
# ラストナンバーが呟いた、次の瞬間──
line = "ラストナンバーが呟いた、次の瞬間──"

[[dialogue]]
speaker = "unk"
# サンクチュアリの壁の一画が吹き飛び──
line = "サンクチュアリの壁の一画が吹き飛び──"

[[dialogue]]
speaker = "ケイティ"
# 「はぁああぁあああっ──！！！」
line = "「はぁああぁあああっ──！！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「──ケイティ姉さんっ！？」
line = "「──ケイティ姉さんっ！？」"

[[dialogue]]
speaker = "ケイティ"
# 「くっ……！　これも──受け止めますか！」
line = "「くっ……！　これも──受け止めますか！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「事前に星眼で予習しておかなければ、危ないところだったわね」
line = "「事前に星眼で予習しておかなければ、危ないところだったわね」"

[[dialogue]]
speaker = "ラストナンバー"
# 「貴女、虫も殺せないような顔をして、随分と荒っぽい。いいえ……戦闘の才能があるのね。流石は衛兵隊の隊長だわ」
line = "「貴女、虫も殺せないような顔をして、随分と荒っぽい。いいえ……戦闘の才能があるのね。流石は衛兵隊の隊長だわ」"

[[dialogue]]
speaker = "ケイティ"
# 「敵に褒められても嬉しくなんてありませんっ！」
line = "「敵に褒められても嬉しくなんてありませんっ！」"

[[dialogue]]
speaker = "ケイティ"
# 「ごめんなさいナターシャちゃん。遅くなって……あぁ。ひどいケガ……」
line = "「ごめんなさいナターシャちゃん。遅くなって……あぁ。ひどいケガ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「それ、ひとに言ってる場合？　姉さんだって……」
line = "「それ、ひとに言ってる場合？　姉さんだって……」"

[[dialogue]]
speaker = "unk"
# 使徒アポロを下して、ここまでたどり着いたのだろう。すでにケイティも満身創痍だった。
line = "使徒アポロを下して、ここまでたどり着いたのだろう。すでにケイティも満身創痍だった。"

[[dialogue]]
speaker = "ケイティ"
# 「──っ！？　メルエルちゃんを包む、あれは……！？」
line = "「──っ！？　メルエルちゃんを包む、あれは……！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「リクリエの瘴気っ……ヒトを狂わせて、使徒にしてしまう瘴気だよ──！」
line = "「リクリエの瘴気っ……ヒトを狂わせて、使徒にしてしまう瘴気だよ──！」"

[[dialogue]]
speaker = "ナターシャ"
# 「早くあいつを倒さないと、メルエルが！！」
line = "「早くあいつを倒さないと、メルエルが！！」"

[[dialogue]]
speaker = "ケイティ"
# 「……ええ！　ナターシャちゃんは援護をお願い！！」
line = "「……ええ！　ナターシャちゃんは援護をお願い！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「未来を選択する。ビジョンを確認し、最良の未来をつかみ取る──貴女たちの勝利は、万が一にもありえないわ」
line = "「未来を選択する。ビジョンを確認し、最良の未来をつかみ取る──貴女たちの勝利は、万が一にもありえないわ」"

[[dialogue]]
speaker = "メルエル"
# （これがっ……会長くんも苦しんでいたっていう、リクリエの、瘴気……！？）
line = "（これがっ……会長くんも苦しんでいたっていう、リクリエの、瘴気……！？）"

[[dialogue]]
speaker = "unk"
# 壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ──
line = "壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ壊セ──"

[[dialogue]]
speaker = "メルエル"
# （気味の悪い声が、鳴り響いて止まらない……！　苦しい……やめてっ！！）
line = "（気味の悪い声が、鳴り響いて止まらない……！　苦しい……やめてっ！！）"

[[dialogue]]
speaker = "unk"
# 滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ──
line = "滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ滅ボセ──"

[[dialogue]]
speaker = "メルエル"
# （私の意思が塗りつぶされていく……破滅を望んで、世界を壊さなきゃって……使命感みたいなものまで、芽生えてきてるっ！？）
line = "（私の意思が塗りつぶされていく……破滅を望んで、世界を壊さなきゃって……使命感みたいなものまで、芽生えてきてるっ！？）"

[[dialogue]]
speaker = "unk"
# この光景を、現実のものに──
line = "この光景を、現実のものに──"

[[dialogue]]
speaker = "メルエル"
# （だめっ……そんなこと、しちゃいけない！　望んでなんかいない……出ていってっ！！）
line = "（だめっ……そんなこと、しちゃいけない！　望んでなんかいない……出ていってっ！！）"

[[dialogue]]
speaker = "メルエル"
# （ここで私が堕ちてしまったら、未来が闇に包まれる……！　会長くんが描いた勝利の未来まで、なくなっちゃう……！！）
line = "（ここで私が堕ちてしまったら、未来が闇に包まれる……！　会長くんが描いた勝利の未来まで、なくなっちゃう……！！）"

[[dialogue]]
speaker = "メルエル"
# （私は、絶対に負けないっ……負けないんだからっ！！）
line = "（私は、絶対に負けないっ……負けないんだからっ！！）"

[[dialogue]]
speaker = "unk"
# まだ──抗うのか。
line = "まだ──抗うのか。"

[[dialogue]]
speaker = "unk"
# ならば──思い出させてやろう。
line = "ならば──思い出させてやろう。"

[[dialogue]]
speaker = "メルエル"
# （い、嫌……やめて──）
line = "（い、嫌……やめて──）"

[[dialogue]]
speaker = "unk"
# ２０００年前の、お前の先祖の、尊き行いを見せてやろう。
line = "２０００年前の、お前の先祖の、尊き行いを見せてやろう。"

[[dialogue]]
speaker = "unk"
# かつて天界の魔王が成しえなかった再創生を、今こそ。
line = "かつて天界の魔王が成しえなかった再創生を、今こそ。"

[[dialogue]]
speaker = "メルエル"
# （来ないで──！！）
line = "（来ないで──！！）"

[[dialogue]]
speaker = "unk"
# お前が為すのだ──
line = "お前が為すのだ──"

[[dialogue]]
speaker = "unk"
# 瘴気がさらに濃度を増し、メルエルの全身を包み、汚染していった──
line = "瘴気がさらに濃度を増し、メルエルの全身を包み、汚染していった──"
