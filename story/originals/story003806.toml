[[dialogue]]
speaker = "unk"
# ルネアの自動解析霊術が継続中である為、俺たちは海の家に宿泊した。
line = "ルネアの自動解析霊術が継続中である為、俺たちは海の家に宿泊した。"

[[dialogue]]
speaker = "unk"
# そうして、夜が明けた翌日。
line = "そうして、夜が明けた翌日。"

[[dialogue]]
speaker = "ロロット"
# 「異世会長さん、おはようなのです～♪」
line = "「異世会長さん、おはようなのです～♪」"

[[dialogue]]
speaker = "聖沙"
# 「もしかして朝練をしていたの？」
line = "「もしかして朝練をしていたの？」"

[[dialogue]]
speaker = "unk"
# 俺が海の家の外で格闘の型を反復練習していると、クルセイダースの４人がやってくる。
line = "俺が海の家の外で格闘の型を反復練習していると、クルセイダースの４人がやってくる。"

[[dialogue]]
speaker = "unk"
# 自力で戦えるようにね
line = "自力で戦えるようにね"

[[dialogue]]
speaker = "unk"
# 力が使えないからこそ
line = "力が使えないからこそ"

[[dialogue]]
speaker = "聖沙"
# 「……なるほど、そういうところも咲良クンにちょっと似てるわね」
line = "「……なるほど、そういうところも咲良クンにちょっと似てるわね」"

[[dialogue]]
speaker = "リア"
# 「確かに、影ながらコツコツと努力してる感じがね♪」
line = "「確かに、影ながらコツコツと努力してる感じがね♪」"

[[dialogue]]
speaker = "ナナカ"
# 「幼なじみのあたしでも、なんか親近感覚えるからね～」
line = "「幼なじみのあたしでも、なんか親近感覚えるからね～」"

[[dialogue]]
speaker = "unk"
# そういえば、みんなに聞きたかったんだ
line = "そういえば、みんなに聞きたかったんだ"

[[dialogue]]
speaker = "聖沙"
# 「え？　――咲良クンがどんな人か……？」
line = "「え？　――咲良クンがどんな人か……？」"

[[dialogue]]
speaker = "ナナカ"
# 「あ～、まぁ、こんなふうにあたしたちが言ってたら、そりゃ気になるか」
line = "「あ～、まぁ、こんなふうにあたしたちが言ってたら、そりゃ気になるか」"

[[dialogue]]
speaker = "リア"
# 「とにかくポジティブだよね～」
line = "「とにかくポジティブだよね～」"

[[dialogue]]
speaker = "ナナカ"
# 「家にお金が無くて、貧乏暮らしではあるんだけど、だからこそ何事も前向きに楽しめるっていうかね」
line = "「家にお金が無くて、貧乏暮らしではあるんだけど、だからこそ何事も前向きに楽しめるっていうかね」"

[[dialogue]]
speaker = "ロロット"
# 「とっても面白い人なのですよ～」
line = "「とっても面白い人なのですよ～」"

[[dialogue]]
speaker = "ナナカ"
# 「うん。会長よりもおバカなことを言うね～。あと、スケベなことも♪」
line = "「うん。会長よりもおバカなことを言うね～。あと、スケベなことも♪」"

[[dialogue]]
speaker = "聖沙"
# 「その癖、私よりも勉強の成績はいいのよ！」
line = "「その癖、私よりも勉強の成績はいいのよ！」"

[[dialogue]]
speaker = "リア"
# 「シンくん、学年１位を取るくらい、勉強ができるんだよ～」
line = "「シンくん、学年１位を取るくらい、勉強ができるんだよ～」"

[[dialogue]]
speaker = "ロロット"
# 「会長さんは、『キラキラな学園生活』を送りたいから、学年１位を取って、生徒会長さんになったのです！」
line = "「会長さんは、『キラキラな学園生活』を送りたいから、学年１位を取って、生徒会長さんになったのです！」"

[[dialogue]]
speaker = "聖沙"
# 「確かに努力家なのは認めるけど……でもそのうち、私は必ず勝ってみせるわ！」
line = "「確かに努力家なのは認めるけど……でもそのうち、私は必ず勝ってみせるわ！」"

[[dialogue]]
speaker = "unk"
# シンの好きなものとかってあるかな？
line = "シンの好きなものとかってあるかな？"

[[dialogue]]
speaker = "聖沙"
# 「咲良クンの好きなもの……？　う～ん、そうね――」
line = "「咲良クンの好きなもの……？　う～ん、そうね――」"

[[dialogue]]
speaker = "ロロット"
# 「『ビフテキ』なのです♪」
line = "「『ビフテキ』なのです♪」"

[[dialogue]]
speaker = "リア"
# 「あはは、そうそう、ビーフステーキもあったよね♪」
line = "「あはは、そうそう、ビーフステーキもあったよね♪」"

[[dialogue]]
speaker = "ナナカ"
# 「正確には、シンは何を食べても『うまいっ！』って言うんだけどね～」
line = "「正確には、シンは何を食べても『うまいっ！』って言うんだけどね～」"

[[dialogue]]
speaker = "聖沙"
# 「これまで食べたことがないっていうから、誕生日に私たちでビフテキを作ってあげたのよ」
line = "「これまで食べたことがないっていうから、誕生日に私たちでビフテキを作ってあげたのよ」"

[[dialogue]]
speaker = "ナナカ"
# 「そしたら、実際は違ってて、今までシンが頭の中で想像してたのは『トンテキ』――豚肉のステーキの方だったっていうね～」
line = "「そしたら、実際は違ってて、今までシンが頭の中で想像してたのは『トンテキ』――豚肉のステーキの方だったっていうね～」"

[[dialogue]]
speaker = "聖沙"
# 「全く……ふふっ♪　まあ、喜んで食べてくれたから、許してあげたけど♪」
line = "「全く……ふふっ♪　まあ、喜んで食べてくれたから、許してあげたけど♪」"

[[dialogue]]
speaker = "unk"
# そんな風にしばらく話した後、俺たちは海の家で朝食をすることになった。
line = "そんな風にしばらく話した後、俺たちは海の家で朝食をすることになった。"

[[dialogue]]
speaker = "ナナカ"
# 「はい、夕霧ナナカ特製、冷やし蕎麦、お待ち～♪」
line = "「はい、夕霧ナナカ特製、冷やし蕎麦、お待ち～♪」"

[[dialogue]]
speaker = "パッキー"
# 「おっ、待ってたぜ！」
line = "「おっ、待ってたぜ！」"

[[dialogue]]
speaker = "マトイ"
# 「わぁっ♪　美味しそ～♪」
line = "「わぁっ♪　美味しそ～♪」"

[[dialogue]]
speaker = "ロロット"
# 「いただきます、なのです～♪」
line = "「いただきます、なのです～♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「ほう、これは本当にすごいな。蕎麦作りの腕前だけなら、あの蛍火をも上回るかもしれん」
line = "「ほう、これは本当にすごいな。蕎麦作りの腕前だけなら、あの蛍火をも上回るかもしれん」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ♪　そうでしょ～？　ナナカちゃんは、うちの学園の『一芸入試』を、これで合格したんだから～♪」
line = "「ふふっ♪　そうでしょ～？　ナナカちゃんは、うちの学園の『一芸入試』を、これで合格したんだから～♪」"

[[dialogue]]
speaker = "unk"
# うまいっ！
line = "うまいっ！"

[[dialogue]]
speaker = "ナナカ"
# 「えへへ♪　まあ、まだまだ父親には敵わないんだけどね～」
line = "「えへへ♪　まあ、まだまだ父親には敵わないんだけどね～」"

[[dialogue]]
speaker = "unk"
# と……そこへ、ルネアがやって来る。
line = "と……そこへ、ルネアがやって来る。"

[[dialogue]]
speaker = "ルネア"
# 「みんな、自動解析が終わったわ」
line = "「みんな、自動解析が終わったわ」"

[[dialogue]]
speaker = "聖沙"
# 「本当！？　それでルネアさん、どうだったの？」
line = "「本当！？　それでルネアさん、どうだったの？」"

[[dialogue]]
speaker = "ルネア"
# 「やっぱりリゾート結界内に、何者かによって強力な封印術式がかけられているみたいね」
line = "「やっぱりリゾート結界内に、何者かによって強力な封印術式がかけられているみたいね」"

[[dialogue]]
speaker = "ルネア"
# 「そして、その術式には『リ・クリエ』の力の痕跡があったわ」
line = "「そして、その術式には『リ・クリエ』の力の痕跡があったわ」"

[[dialogue]]
speaker = "マトイ"
# 「あの、そちらの世界の『リ・クリエ』って、流星クルセイダースのみんなが止めたんじゃ……？」
line = "「あの、そちらの世界の『リ・クリエ』って、流星クルセイダースのみんなが止めたんじゃ……？」"

[[dialogue]]
speaker = "リア"
# 「そう。本来なら、もう起こることはないはずなのに……」
line = "「そう。本来なら、もう起こることはないはずなのに……」"

[[dialogue]]
speaker = "ルネア"
# 「それが何故、今ここでその力を感じるのか……」
line = "「それが何故、今ここでその力を感じるのか……」"

[[dialogue]]
speaker = "ルネア"
# 「それを確かめる為にも、リゾート結界に張られている封印術式の『核』を見つける必要があるわ」
line = "「それを確かめる為にも、リゾート結界に張られている封印術式の『核』を見つける必要があるわ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「核の場所は、もう判明しているのかしら？」
line = "「核の場所は、もう判明しているのかしら？」"

[[dialogue]]
speaker = "ルネア"
# 「ええ。私が追跡することができるわ」
line = "「ええ。私が追跡することができるわ」"

[[dialogue]]
speaker = "ルネア"
# 「朝食を食べ終わったら、みんなで向かいましょう」
line = "「朝食を食べ終わったら、みんなで向かいましょう」"

[[dialogue]]
speaker = "unk"
# そうして朝食後、ルネアに付いて行き、向かった場所には――
line = "そうして朝食後、ルネアに付いて行き、向かった場所には――"

[[dialogue]]
speaker = "魔族"
# 「……！　イ～」
line = "「……！　イ～」"

[[dialogue]]
speaker = "unk"
# １匹の魔族の姿があった。
line = "１匹の魔族の姿があった。"

[[dialogue]]
speaker = "ルネア"
# 「あれよ！　あの魔族が持っている、丸い宝玉！」
line = "「あれよ！　あの魔族が持っている、丸い宝玉！」"

[[dialogue]]
speaker = "リア"
# 「あの魔族は本物……？　それとも……？」
line = "「あの魔族は本物……？　それとも……？」"

[[dialogue]]
speaker = "聖沙"
# 「とりあえず捕まえてみるしかなさそうですね」
line = "「とりあえず捕まえてみるしかなさそうですね」"

[[dialogue]]
speaker = "魔族たち"
# 「イ～～！」
line = "「イ～～！」"

[[dialogue]]
speaker = "マトイ"
# 「宝玉から影が広がって、また魔族が沢山出てきた！」
line = "「宝玉から影が広がって、また魔族が沢山出てきた！」"

[[dialogue]]
speaker = "ナナカ"
# 「ビンゴみたいだね。――よ～し、気合い入れて行きますか！」
line = "「ビンゴみたいだね。――よ～し、気合い入れて行きますか！」"

[[dialogue]]
speaker = "ロロット"
# 「はい！　会長さんを早く目覚めさせる為にも、頑張りますよ～！」
line = "「はい！　会長さんを早く目覚めさせる為にも、頑張りますよ～！」"

[[dialogue]]
speaker = "unk"
# 俺たちは謎の宝玉を確保する為に、再び魔族たちとの戦闘を開始するのだった。
line = "俺たちは謎の宝玉を確保する為に、再び魔族たちとの戦闘を開始するのだった。"
