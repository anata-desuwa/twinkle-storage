[[dialogue]]
speaker = "unk"
# 翌朝、俺たちはリップルの用意してくれた朝食を平らげて行動を開始した。
line = "翌朝、俺たちはリップルの用意してくれた朝食を平らげて行動を開始した。"

[[dialogue]]
speaker = "コハルコ"
# 「うぅ……食べすぎちゃったかな。リゾート結界って何でも美味しいからつい……ただでさえ最近、運動不足なのにぃ……」
line = "「うぅ……食べすぎちゃったかな。リゾート結界って何でも美味しいからつい……ただでさえ最近、運動不足なのにぃ……」"

[[dialogue]]
speaker = "コハルコ"
# 「……あ、なんでもない、なんでもないから！　ただの独り言、気にしないで！」
line = "「……あ、なんでもない、なんでもないから！　ただの独り言、気にしないで！」"

[[dialogue]]
speaker = "コハルコ"
# 「さて、気を取り直して、マシンを探そう！」
line = "「さて、気を取り直して、マシンを探そう！」"

[[dialogue]]
speaker = "unk"
# コハルコさんがそうおっしゃるなら、本当に何でもないのだろう。聞かなかったことにして忘れよう。
line = "コハルコさんがそうおっしゃるなら、本当に何でもないのだろう。聞かなかったことにして忘れよう。"

[[dialogue]]
speaker = "コハルコ"
# 「まずはこれを見て」
line = "「まずはこれを見て」"

[[dialogue]]
speaker = "unk"
# コハルコさんのドルフィンドローンから光が投射され、地球儀のようなものを浮かび上がらせる。
line = "コハルコさんのドルフィンドローンから光が投射され、地球儀のようなものを浮かび上がらせる。"

[[dialogue]]
speaker = "コハルコ"
# 「これが現在のリゾート結界の地図だよ」
line = "「これが現在のリゾート結界の地図だよ」"

[[dialogue]]
speaker = "コハルコ"
# 「リゾート結界にある海の家を経度・緯度ともにゼロとして、調査を開始。調査済みポイントを塗り潰しながら、マシンの位置を特定する予定だよ」
line = "「リゾート結界にある海の家を経度・緯度ともにゼロとして、調査を開始。調査済みポイントを塗り潰しながら、マシンの位置を特定する予定だよ」"

[[dialogue]]
speaker = "unk"
# 実に計画的だ。これに比べると、昨日のシルヴィ先輩との調査は行き当たりばったりだった。
line = "実に計画的だ。これに比べると、昨日のシルヴィ先輩との調査は行き当たりばったりだった。"

[[dialogue]]
speaker = "コハルコ"
# 「質問はないかな？　なければ──作戦開始！」
line = "「質問はないかな？　なければ──作戦開始！」"

[[dialogue]]
speaker = "unk"
# 時計の針が１２時を回ったころ、ちょうどリゾート結界の半分を調査し終えた。コハルコさんのドローンが優秀で、俺はほとんど見ているだけだったけど。
line = "時計の針が１２時を回ったころ、ちょうどリゾート結界の半分を調査し終えた。コハルコさんのドローンが優秀で、俺はほとんど見ているだけだったけど。"

[[dialogue]]
speaker = "コハルコ"
# 「よし、この地点は調査完了。だいぶ絞れてきたね」
line = "「よし、この地点は調査完了。だいぶ絞れてきたね」"

[[dialogue]]
speaker = "unk"
# ドルフィンドローンが海面から飛び出し、コハルコさんの頭上を旋回する。空中、水中を問わず高い探索能力を誇るニクいやつだ。
line = "ドルフィンドローンが海面から飛び出し、コハルコさんの頭上を旋回する。空中、水中を問わず高い探索能力を誇るニクいやつだ。"

[[dialogue]]
speaker = "コハルコ"
# 「ちょっと休憩して、お昼にしよう。はい、お弁当。リップルさんから預かってきてるよ」
line = "「ちょっと休憩して、お昼にしよう。はい、お弁当。リップルさんから預かってきてるよ」"

[[dialogue]]
speaker = "コハルコ"
# 「中身はなんだろ……あ、ロコモコ丼だ。いい匂い」
line = "「中身はなんだろ……あ、ロコモコ丼だ。いい匂い」"

[[dialogue]]
speaker = "コハルコ"
# 「しかもホカホカ……どうやって……？」
line = "「しかもホカホカ……どうやって……？」"

[[dialogue]]
speaker = "コハルコ"
# 「そうか、弁当箱に時間を止める結界をかけてあるんだ。さすがリップルさん。私も魔法でマネできないか試してみようっと」
line = "「そうか、弁当箱に時間を止める結界をかけてあるんだ。さすがリップルさん。私も魔法でマネできないか試してみようっと」"

[[dialogue]]
speaker = "コハルコ"
# 「ん～～、美味しい！　濃いソースがごはんに合う！」
line = "「ん～～、美味しい！　濃いソースがごはんに合う！」"

[[dialogue]]
speaker = "コハルコ"
# 「会長さん、どうしたの？　私の顔になんかついてる？」
line = "「会長さん、どうしたの？　私の顔になんかついてる？」"

[[dialogue]]
speaker = "コハルコ"
# 「……学園を卒業したら、どうするつもりかって？　ああ、昨日、シルヴィとそんな話したんだ」
line = "「……学園を卒業したら、どうするつもりかって？　ああ、昨日、シルヴィとそんな話したんだ」"

[[dialogue]]
speaker = "コハルコ"
# 「う～～ん、私はどうもしないかな。新星学園のシステム担当は入学前から決まってたことだし、入学したのもたまたま星力の適性があったからだしね」
line = "「う～～ん、私はどうもしないかな。新星学園のシステム担当は入学前から決まってたことだし、入学したのもたまたま星力の適性があったからだしね」"

[[dialogue]]
speaker = "コハルコ"
# 「卒業したら、このままシステム担当をしながら家のパーツショップを手伝って、妹の面倒を見て…………うん、今とそんなに変わらないかな」
line = "「卒業したら、このままシステム担当をしながら家のパーツショップを手伝って、妹の面倒を見て…………うん、今とそんなに変わらないかな」"

[[dialogue]]
speaker = "コハルコ"
# 「私は３年生だから会長さんより一足先に卒業しちゃうけど、これまで通りシステム周りはやる予定だから安心して。新星学園のシステムは私が守るよ」
line = "「私は３年生だから会長さんより一足先に卒業しちゃうけど、これまで通りシステム周りはやる予定だから安心して。新星学園のシステムは私が守るよ」"

[[dialogue]]
speaker = "コハルコ"
# 「でも、サーシャやシルヴィを始め、３年のみんなが卒業しちゃうのは寂しいな……」
line = "「でも、サーシャやシルヴィを始め、３年のみんなが卒業しちゃうのは寂しいな……」"

[[dialogue]]
speaker = "コハルコ"
# 「ううん、まだ先の話だよね。寂しがる前に、今は目の前のことを考えよう」
line = "「ううん、まだ先の話だよね。寂しがる前に、今は目の前のことを考えよう」"

[[dialogue]]
speaker = "コハルコ"
# 「いつも朗らかなトリュファイナさんが、あんなに落ち込んでるの初めて見た……。マシンを見付けて、トリュファイナさんを早く安心させてあげなくちゃ」
line = "「いつも朗らかなトリュファイナさんが、あんなに落ち込んでるの初めて見た……。マシンを見付けて、トリュファイナさんを早く安心させてあげなくちゃ」"

[[dialogue]]
speaker = "モンスター"
# 「チキチキチー！！」
line = "「チキチキチー！！」"

[[dialogue]]
speaker = "コハルコ"
# 「もう、言った傍から！　迎撃するよ、会長さん！」
line = "「もう、言った傍から！　迎撃するよ、会長さん！」"

[[dialogue]]
speaker = "コハルコ"
# 「エコーノイズショット！」
line = "「エコーノイズショット！」"

[[dialogue]]
speaker = "コハルコ"
# 「会長さん、少し時間を稼いで。一網打尽にするよ」
line = "「会長さん、少し時間を稼いで。一網打尽にするよ」"

[[dialogue]]
speaker = "unk"
# 了解！
line = "了解！"

[[dialogue]]
speaker = "unk"
# 星力を纏った拳で迎撃すると、アツアツの油が飛び散り、辺りに香ばしい匂いが漂った。ＧＦＣのバイト時代を思い出す。
line = "星力を纏った拳で迎撃すると、アツアツの油が飛び散り、辺りに香ばしい匂いが漂った。ＧＦＣのバイト時代を思い出す。"

[[dialogue]]
speaker = "コハルコ"
# 「ハイドロジェット最大出力！　フロムアビスインパクト！」
line = "「ハイドロジェット最大出力！　フロムアビスインパクト！」"

[[dialogue]]
speaker = "unk"
# 水流で加速したドルフィンドローンがチキンを吹っ飛ばした。ドローンが空中で優雅に一回転する。
line = "水流で加速したドルフィンドローンがチキンを吹っ飛ばした。ドローンが空中で優雅に一回転する。"

[[dialogue]]
speaker = "コハルコ"
# 「よし、無力化成功──」
line = "「よし、無力化成功──」"

[[dialogue]]
speaker = "コハルコ"
# 「チキンがまた出たー！？」
line = "「チキンがまた出たー！？」"

[[dialogue]]
speaker = "コハルコ"
# 「もしかしなくても、出現頻度が少しずつ上がってる。てことは、マシンに近付いてるんだ。でもこの数は私たちだけじゃ厳しいかも……」
line = "「もしかしなくても、出現頻度が少しずつ上がってる。てことは、マシンに近付いてるんだ。でもこの数は私たちだけじゃ厳しいかも……」"

[[dialogue]]
speaker = "シルヴィ"
# 「助太刀するよ！」
line = "「助太刀するよ！」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩！
line = "シルヴィ先輩！"

[[dialogue]]
speaker = "リップル"
# 「ワタシもいまーす！」
line = "「ワタシもいまーす！」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしたちのアツアツチキンサーチによれば、マシンはこの近くだよ！」
line = "「あたしたちのアツアツチキンサーチによれば、マシンはこの近くだよ！」"

[[dialogue]]
speaker = "コハルコ"
# 「は？　アツアツチキンサーチ？」
line = "「は？　アツアツチキンサーチ？」"

[[dialogue]]
speaker = "シルヴィ"
# 「アツアツチキンサーチっていうのはね……」
line = "「アツアツチキンサーチっていうのはね……」"

[[dialogue]]
speaker = "シルヴィ"
# 「リップルちゃんにお願いがあるんだ」
line = "「リップルちゃんにお願いがあるんだ」"

[[dialogue]]
speaker = "リップル"
# 「オネガイですか？」
line = "「オネガイですか？」"

[[dialogue]]
speaker = "シルヴィ"
# 「うん。リップルちゃん、時間を止める結界を作れるって聞いたんだけど、本当？」
line = "「うん。リップルちゃん、時間を止める結界を作れるって聞いたんだけど、本当？」"

[[dialogue]]
speaker = "リップル"
# 「ハイ。デモ、夏パワーをタクサン消費するので、今は少しだけしかできマセン……」
line = "「ハイ。デモ、夏パワーをタクサン消費するので、今は少しだけしかできマセン……」"

[[dialogue]]
speaker = "シルヴィ"
# 「少しで大丈夫。モンスターを倒したら、戻ったチキンを食べずに結界に入れておくの。で、チキン同士を比べてみて、よりアツアツの方にマシンがいるって寸法だよ」
line = "「少しで大丈夫。モンスターを倒したら、戻ったチキンを食べずに結界に入れておくの。で、チキン同士を比べてみて、よりアツアツの方にマシンがいるって寸法だよ」"

[[dialogue]]
speaker = "シルヴィ"
# 「名付けて、アツアツチキンサーチ！」
line = "「名付けて、アツアツチキンサーチ！」"

[[dialogue]]
speaker = "リップル"
# 「オー、ナイスアイディアでーす！」
line = "「オー、ナイスアイディアでーす！」"

[[dialogue]]
speaker = "シルヴィ"
# 「というワケだよ！」
line = "「というワケだよ！」"

[[dialogue]]
speaker = "コハルコ"
# 「えぇ……それ、ほぼ直感では」
line = "「えぇ……それ、ほぼ直感では」"

[[dialogue]]
speaker = "シルヴィ"
# 「いいんだよ、見付かれば！　そのあたしの直感が告げてる！　チキンマシンは、そこだぁ！　てぇりゃあああっ！」
line = "「いいんだよ、見付かれば！　そのあたしの直感が告げてる！　チキンマシンは、そこだぁ！　てぇりゃあああっ！」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩の銛が、海面の岩塊に突き刺さった。岩塊は崩れ去り、四角いマシンが顔を出した。
line = "シルヴィ先輩の銛が、海面の岩塊に突き刺さった。岩塊は崩れ去り、四角いマシンが顔を出した。"

[[dialogue]]
speaker = "コハルコ"
# 「ウソ！？　ホントにあった！」
line = "「ウソ！？　ホントにあった！」"

[[dialogue]]
speaker = "シルヴィ"
# 「このまま破壊しちゃうよ！　そりゃあ！」
line = "「このまま破壊しちゃうよ！　そりゃあ！」"

[[dialogue]]
speaker = "unk"
# 再び銛が飛び、マシンを貫く。
line = "再び銛が飛び、マシンを貫く。"

[[dialogue]]
speaker = "unk"
# すると中から出てきたのは──
line = "すると中から出てきたのは──"

[[dialogue]]
speaker = "モンスター"
# 「ビガ！？」
line = "「ビガ！？」"

[[dialogue]]
speaker = "unk"
# 見覚えのある、機械型モンスターだった。
line = "見覚えのある、機械型モンスターだった。"
