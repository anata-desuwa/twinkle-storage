[[dialogue]]
speaker = "ベアトリス"
# 「ふぅ……飾り作りも順調に進んでるんじゃないかニャ？」
line = "「ふぅ……飾り作りも順調に進んでるんじゃないかニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「あ、梨緒からメッセージ来てた。ゴーストの捕獲もほとんど終わったって。アポロは鬼ごっこして遊んでたってさ」
line = "「あ、梨緒からメッセージ来てた。ゴーストの捕獲もほとんど終わったって。アポロは鬼ごっこして遊んでたってさ」"

[[dialogue]]
speaker = "ベアトリス"
# 「そっか、それなら一安心だね。えっと……」
line = "「そっか、それなら一安心だね。えっと……」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアト、何か私と話したいことがあるんだよね？　２人きりでさ」
line = "「ベアト、何か私と話したいことがあるんだよね？　２人きりでさ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ぎくっ！　ど、どうしてわかったのニャ？」
line = "「ぎくっ！　ど、どうしてわかったのニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアトがわかりやす過ぎるからだよ。ベアトが私を選んだ理由はそれでしょ？」
line = "「ベアトがわかりやす過ぎるからだよ。ベアトが私を選んだ理由はそれでしょ？」"

[[dialogue]]
speaker = "ベアトリス"
# 「う、うん……私、そんなにわかりやすいかニャァ……」
line = "「う、うん……私、そんなにわかりやすいかニャァ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「そんなにだよ。ちょうどいい機会だし、聞いてあげる。私は逃げも隠れもしないよ。虫以外の話ならね」
line = "「そんなにだよ。ちょうどいい機会だし、聞いてあげる。私は逃げも隠れもしないよ。虫以外の話ならね」"

[[dialogue]]
speaker = "ベアトリス"
# 「そ、そう？　それじゃ、えっと、ね。今だから聞いちゃうけど……」
line = "「そ、そう？　それじゃ、えっと、ね。今だから聞いちゃうけど……」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃんは選管に入った頃、私のこと、どう思ってたのかニャ……？」
line = "「ナターシャちゃんは選管に入った頃、私のこと、どう思ってたのかニャ……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアトのこと？　え、最初から怪しんでたよ」
line = "「ベアトのこと？　え、最初から怪しんでたよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ンニャ～～～～っ！？」
line = "「ンニャ～～～～っ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「だって何か隠してるオーラがひしひしと出てたし。何か私たちには話せないような秘密があるんだろうなって思ってた」
line = "「だって何か隠してるオーラがひしひしと出てたし。何か私たちには話せないような秘密があるんだろうなって思ってた」"

[[dialogue]]
speaker = "ベアトリス"
# 「そんなにバレバレだったのニャッ！？」
line = "「そんなにバレバレだったのニャッ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「顔とか態度にも出てたし、プロフィールの作り方も甘かったからね」
line = "「顔とか態度にも出てたし、プロフィールの作り方も甘かったからね」"

[[dialogue]]
speaker = "ナターシャ"
# 「魔界からの留学生なんて戸籍がないし、素性なんていくらでも隠せるから、潜り込むにはうってつけだし」
line = "「魔界からの留学生なんて戸籍がないし、素性なんていくらでも隠せるから、潜り込むにはうってつけだし」"

[[dialogue]]
speaker = "ナターシャ"
# 「わざわざ選管に入ったのも、何か企んでるのかと思ってたよ。星徒会を監視するにはちょうどいいポジションだからね」
line = "「わざわざ選管に入ったのも、何か企んでるのかと思ってたよ。星徒会を監視するにはちょうどいいポジションだからね」"

[[dialogue]]
speaker = "ベアトリス"
# 「そういうのじゃないよ～っ」
line = "「そういうのじゃないよ～っ」"

[[dialogue]]
speaker = "ナターシャ"
# 「だよね。至る所が隙だらけで、潜入工作のプロフェッショナルには見えなかった。わざと隙を見せつけて、油断を誘ってるのかと思ったくらいだよ」
line = "「だよね。至る所が隙だらけで、潜入工作のプロフェッショナルには見えなかった。わざと隙を見せつけて、油断を誘ってるのかと思ったくらいだよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ううん、考えすぎです……ただの素ですニャ……」
line = "「ううん、考えすぎです……ただの素ですニャ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「うん、それもすぐ気づいた。脅威にはならないと確信したから、ボロが出るまで泳がせてたの」
line = "「うん、それもすぐ気づいた。脅威にはならないと確信したから、ボロが出るまで泳がせてたの」"

[[dialogue]]
speaker = "ナターシャ"
# 「何かやらかそうとしても、いつでも後ろから刺せたし、消そうと思えば３０回はチャンスがあったからね」
line = "「何かやらかそうとしても、いつでも後ろから刺せたし、消そうと思えば３０回はチャンスがあったからね」"

[[dialogue]]
speaker = "ベアトリス"
# 「そんな風に思われてたの！？　というか私、３０回も死んでたの！？」
line = "「そんな風に思われてたの！？　というか私、３０回も死んでたの！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そうだよ。実際にはやらなかったんだから、優しい私に感謝してね」
line = "「そうだよ。実際にはやらなかったんだから、優しい私に感謝してね」"

[[dialogue]]
speaker = "ベアトリス"
# 「うん、ありがと──」
line = "「うん、ありがと──」"

[[dialogue]]
speaker = "ベアトリス"
# 「って、あれ？　今のってお礼言うところ……？」
line = "「って、あれ？　今のってお礼言うところ……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「選管の仲間としてやっていく内に、隠している素性はともかく、性格は裏表のない筋金入りのお人好しだってわかった」
line = "「選管の仲間としてやっていく内に、隠している素性はともかく、性格は裏表のない筋金入りのお人好しだってわかった」"

[[dialogue]]
speaker = "ナターシャ"
# 「早とちりで消さなくてよかった、って今では思ってるよ」
line = "「早とちりで消さなくてよかった、って今では思ってるよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃん……。えへへ、ありがとう♪」
line = "「ナターシャちゃん……。えへへ、ありがとう♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「お礼言うところでもないよ。お人好しすぎるのも、良し悪しだし」
line = "「お礼言うところでもないよ。お人好しすぎるのも、良し悪しだし」"

[[dialogue]]
speaker = "ナターシャ"
# 「少なくとも私はベアトみたいなお人好しにはなれないよ。人と接する時は、まず最初に疑ってかかるべきと教わってきたからね」
line = "「少なくとも私はベアトみたいなお人好しにはなれないよ。人と接する時は、まず最初に疑ってかかるべきと教わってきたからね」"

[[dialogue]]
speaker = "ナターシャ"
# 「でもベアトのお人好しには助けられてる。意地っ張りなくせにメンタルよわよわな梨緒の面倒を見てくれるのもありがたいし」
line = "「でもベアトのお人好しには助けられてる。意地っ張りなくせにメンタルよわよわな梨緒の面倒を見てくれるのもありがたいし」"

[[dialogue]]
speaker = "ナターシャ"
# 「アポロともなんだかんだうまくやってるし、今はベアトのこと、信頼も尊敬もしてるよ」
line = "「アポロともなんだかんだうまくやってるし、今はベアトのこと、信頼も尊敬もしてるよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「選管にいてくれないと困るから、定期的にこっちに来て、みんなの面倒見てあげてよ」
line = "「選管にいてくれないと困るから、定期的にこっちに来て、みんなの面倒見てあげてよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「あはは、ナターシャちゃんがそんなに褒めてくれるの初めてだね。嬉しいニャ」
line = "「あはは、ナターシャちゃんがそんなに褒めてくれるの初めてだね。嬉しいニャ」"

[[dialogue]]
speaker = "ベアトリス"
# 「でもね、私は優しいんじゃなくて、わがままニャだけだよ」
line = "「でもね、私は優しいんじゃなくて、わがままニャだけだよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「私はね、昔も、今も、自分が『そうしたいっ！　そうあってほしいっ！』って方向に突き進んでるだけ」
line = "「私はね、昔も、今も、自分が『そうしたいっ！　そうあってほしいっ！』って方向に突き進んでるだけ」"

[[dialogue]]
speaker = "ベアトリス"
# 「これってすっごくわがままじゃない？」
line = "「これってすっごくわがままじゃない？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふふっ」
line = "「ふふっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃん？」
line = "「ナターシャちゃん？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そう言って、いろいろ梨緒とかに世話焼いて、よその世界を守るために命かけてるじゃん」
line = "「そう言って、いろいろ梨緒とかに世話焼いて、よその世界を守るために命かけてるじゃん」"

[[dialogue]]
speaker = "ナターシャ"
# 「そういうのを『優しい』って言うんだよ」
line = "「そういうのを『優しい』って言うんだよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「そう……かな？」
line = "「そう……かな？」"

[[dialogue]]
speaker = "ベアトリス"
# 「でもそうだったら……嬉しいニャ♪」
line = "「でもそうだったら……嬉しいニャ♪」"
