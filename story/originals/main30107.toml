[[dialogue]]
speaker = "unk"
# 第７話,『歓迎の歌声』,B
line = "第７話,『歓迎の歌声』,B"

[[dialogue]]
speaker = "unk"
# 放課後、突発的に計画されたオオヒメの歓迎会が、学園近場のカラオケボックスで開催されることになった。
line = "放課後、突発的に計画されたオオヒメの歓迎会が、学園近場のカラオケボックスで開催されることになった。"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 『オオヒメ、転入おめでとーなのだーっ♪』
line = "『オオヒメ、転入おめでとーなのだーっ♪』"

[[dialogue]]
speaker = "３人"
# 「っ……！！？」
line = "「っ……！！？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「やかましいぞ！　急に大声で叫ぶな！」
line = "「やかましいぞ！　急に大声で叫ぶな！」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 『テンションが上がってついつい叫んでしまったのだ♪』
line = "『テンションが上がってついつい叫んでしまったのだ♪』"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「ワンドリンク制ですから飲み物を選んでください。それから食べたいものがあれば──」
line = "「ワンドリンク制ですから飲み物を選んでください。それから食べたいものがあれば──」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 『肉ーーーっ！』
line = "『肉ーーーっ！』"

[[dialogue]]
speaker = "３人"
# 「っ……！！？」
line = "「っ……！！？」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 『アルモたんは唐揚げがいいのだ！　山盛り唐揚げを頼むのだ！』
line = "『アルモたんは唐揚げがいいのだ！　山盛り唐揚げを頼むのだ！』"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 『お祝いするならやっぱりお肉が１番なのだ！　めでたいのだ！』
line = "『お祝いするならやっぱりお肉が１番なのだ！　めでたいのだ！』"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 『オオヒメ転入おめでとーなのだーっ♪』
line = "『オオヒメ転入おめでとーなのだーっ♪』"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「マイク没収です！！」
line = "「マイク没収です！！」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「あぅ……取られちゃったのだ……」
line = "「あぅ……取られちゃったのだ……」"

[[dialogue]]
speaker = "ナミエル"
# 「ヒメさんは何を飲まれますか？」
line = "「ヒメさんは何を飲まれますか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「お茶があれば……ふむふむ、では麦茶を貰おう」
line = "「お茶があれば……ふむふむ、では麦茶を貰おう」"

[[dialogue]]
speaker = "ナミエル"
# 「わかりました」
line = "「わかりました」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「リモコンの操作に慣れているようだが、カラオケにはよく来るのか？」
line = "「リモコンの操作に慣れているようだが、カラオケにはよく来るのか？」"

[[dialogue]]
speaker = "ナミエル"
# 「極まれに、ですね。フィオナお嬢様が流星星徒会の皆様と遊びに出かける時、私を誘ってくださることがあるんです」
line = "「極まれに、ですね。フィオナお嬢様が流星星徒会の皆様と遊びに出かける時、私を誘ってくださることがあるんです」"

[[dialogue]]
speaker = "ナミエル"
# 「積極的に歌うということは無いのですが、リモコンの操作はその時に覚えました」
line = "「積極的に歌うということは無いのですが、リモコンの操作はその時に覚えました」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「なるほどな。……しかし、本当に大丈夫だったのか？」
line = "「なるほどな。……しかし、本当に大丈夫だったのか？」"

[[dialogue]]
speaker = "ナミエル"
# 「何がですか？」
line = "「何がですか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「本当は今日もメイドの仕事があったのだろう？　私の歓迎会でそれを休ませてしまって」
line = "「本当は今日もメイドの仕事があったのだろう？　私の歓迎会でそれを休ませてしまって」"

[[dialogue]]
speaker = "ナミエル"
# 「問題ありません。メイド長のキリカさんには事情を説明し、許可を頂いていますから」
line = "「問題ありません。メイド長のキリカさんには事情を説明し、許可を頂いていますから」"

[[dialogue]]
speaker = "ナミエル"
# 「ヒメさんの歓迎会なのですから、余計な心配などせず楽しみましょう」
line = "「ヒメさんの歓迎会なのですから、余計な心配などせず楽しみましょう」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「うむ、そうだな」
line = "「うむ、そうだな」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「ふ～、熱唱したのだ……ん？　次の曲が入ってないのだ！　誰か入れるのだ！」
line = "「ふ～、熱唱したのだ……ん？　次の曲が入ってないのだ！　誰か入れるのだ！」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「そろそろ本日の主役、オオヒメが歌いますか～？」
line = "「そろそろ本日の主役、オオヒメが歌いますか～？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「む……しかし、まだ何を歌うか決まっていないのだが」
line = "「む……しかし、まだ何を歌うか決まっていないのだが」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「リモコンで曲を探すのは難しいと感じ、本を用意してもらったのだが……まさかこんなに曲があるとは」
line = "「リモコンで曲を探すのは難しいと感じ、本を用意してもらったのだが……まさかこんなに曲があるとは」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「しかも私が歌える曲と言ったら限られている。ジャンルで言うと童謡か演歌だが……」
line = "「しかも私が歌える曲と言ったら限られている。ジャンルで言うと童謡か演歌だが……」"

[[dialogue]]
speaker = "ナミエル"
# 「童謡、いいと思いますよ？」
line = "「童謡、いいと思いますよ？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「しかし、カラオケには流れがあると聞いた。せっかくの空気を、私の童謡で盛り下げてしまうわけにはいかないだろう？」
line = "「しかし、カラオケには流れがあると聞いた。せっかくの空気を、私の童謡で盛り下げてしまうわけにはいかないだろう？」"

[[dialogue]]
speaker = "ナミエル"
# 「大丈夫です。実は童謡は、歌ってみると案外盛り上がるものなんです」
line = "「大丈夫です。実は童謡は、歌ってみると案外盛り上がるものなんです」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「そうだぞ！　アルモたんも童謡は大好きなのだ！」
line = "「そうだぞ！　アルモたんも童謡は大好きなのだ！」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「参加者がみんな歌えることが多いですから。突然、全員の大熱唱が始まったりして楽しかったりするのですよね～」
line = "「参加者がみんな歌えることが多いですから。突然、全員の大熱唱が始まったりして楽しかったりするのですよね～」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「なるほど、そういうものなのか……」
line = "「なるほど、そういうものなのか……」"

[[dialogue]]
speaker = "ナミエル"
# 「最初ですし、私も一緒に歌いましょうか？」
line = "「最初ですし、私も一緒に歌いましょうか？」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「いいのか？　そうしてくれると、とても助かる」
line = "「いいのか？　そうしてくれると、とても助かる」"

[[dialogue]]
speaker = "ナミエル"
# 「ふふ、よろしくお願いします……」
line = "「ふふ、よろしくお願いします……」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「おお、デュエットなのだ！　いいぞ２人とも、どんどんやるのだ！」
line = "「おお、デュエットなのだ！　いいぞ２人とも、どんどんやるのだ！」"

[[dialogue]]
speaker = "ナミエル"
# 「それでは聞いてください、『どんぐりころころ』です」
line = "「それでは聞いてください、『どんぐりころころ』です」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 『どんぐり来たのだーっ！　オオヒメ、転入おめでとーっ♪』
line = "『どんぐり来たのだーっ！　オオヒメ、転入おめでとーっ♪』"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「没収です♪」
line = "「没収です♪」"

[[dialogue]]
speaker = "アルモタヘル（幼少）"
# 「あぅ……また持ってかれたのだ……」
line = "「あぅ……また持ってかれたのだ……」"

[[dialogue]]
speaker = "マグダレナ（幼少）"
# 「オオヒメ、マイクをどうぞ」
line = "「オオヒメ、マイクをどうぞ」"

[[dialogue]]
speaker = "オオヒメ（幼少）"
# 「うむ……ではいくぞ……」
line = "「うむ……ではいくぞ……」"

[[dialogue]]
speaker = "ナミエル"
# 「せーのっ……♪」
line = "「せーのっ……♪」"

[[dialogue]]
speaker = "unk"
# 和気藹々とした天使たちの歌声が、小さなカラオケボックス内に響く。
line = "和気藹々とした天使たちの歌声が、小さなカラオケボックス内に響く。"

[[dialogue]]
speaker = "unk"
# こうしてオオヒメの流星学園附属校生活、第１日目は無事に幕を閉じたのだった。
line = "こうしてオオヒメの流星学園附属校生活、第１日目は無事に幕を閉じたのだった。"
