[[dialogue]]
speaker = "unk"
# 第１話,路上での出会い,P
line = "第１話,路上での出会い,P"

[[dialogue]]
speaker = "unk"
# <ruby=ゼロス>『ＸＥＬＯＳ』</ruby>との決戦の後、世界はようやく平和を取り戻した。
line = "<ruby>『ＸＥＬＯＳ』<rt>ゼロス</rt></ruby>との決戦の後、世界はようやく平和を取り戻した。"

[[dialogue]]
speaker = "unk"
# 忙しい日々が続いていた俺と環にもようやく余裕が生まれ、今までの時間を取り戻そうとするかのようにデートを重ねていた。
line = "忙しい日々が続いていた俺と環にもようやく余裕が生まれ、今までの時間を取り戻そうとするかのようにデートを重ねていた。"

[[dialogue]]
speaker = "unk"
# その日の俺たちは特に決まった予定もなく、ただぶらぶらと歩いていただけだったのだが……
line = "その日の俺たちは特に決まった予定もなく、ただぶらぶらと歩いていただけだったのだが……"

[[dialogue]]
speaker = "ラクシャ"
# 「あれ？　人だかりが出来てるけど、何やってるんだろ？」
line = "「あれ？　人だかりが出来てるけど、何やってるんだろ？」"

[[dialogue]]
speaker = "ラクシャ"
# 「あー、路上ライブだ。こんだけ人が集まってるってことは上手いのかな？　ちょっと聞いていかない？」
line = "「あー、路上ライブだ。こんだけ人が集まってるってことは上手いのかな？　ちょっと聞いていかない？」"

[[dialogue]]
speaker = "ラクシャ"
# 「へぇ～、なんかパッと見た感じふつーな感じの女の子だけど、あの子が弾くんだね……」
line = "「へぇ～、なんかパッと見た感じふつーな感じの女の子だけど、あの子が弾くんだね……」"

[[dialogue]]
speaker = "ラクシャ"
# 「エレキギターの音とか聞くと、２人で働いてたライブハウスの事とか思い出しちゃわない？」
line = "「エレキギターの音とか聞くと、２人で働いてたライブハウスの事とか思い出しちゃわない？」"

[[dialogue]]
speaker = "unk"
# あとフェスね、フェス！
line = "あとフェスね、フェス！"

[[dialogue]]
speaker = "unk"
# すごく思い出してたよ
line = "すごく思い出してたよ"

[[dialogue]]
speaker = "ラクシャ"
# 「そうだね！　数あるバイトの中でもかなり大変なヤツだったけど、すごく面白かったバイトでもあるな～」
line = "「そうだね！　数あるバイトの中でもかなり大変なヤツだったけど、すごく面白かったバイトでもあるな～」"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、何だか懐かしくなってきたよ。また一緒にバイトするのも面白いかもね♪」
line = "「あはは、何だか懐かしくなってきたよ。また一緒にバイトするのも面白いかもね♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「あ、始まるみたい。ふふっ、ワクワクしてきたよー」
line = "「あ、始まるみたい。ふふっ、ワクワクしてきたよー」"

[[dialogue]]
speaker = "ラクシャ"
# 「っ……！　うわ……上手っ……！　すっごい速弾き……！！」
line = "「っ……！　うわ……上手っ……！　すっごい速弾き……！！」"

[[dialogue]]
speaker = "ラクシャ"
# 「それに演奏に没頭しちゃってる感じが、超カッコいいよね……弾き始める前とはまるで別人みたい……」
line = "「それに演奏に没頭しちゃってる感じが、超カッコいいよね……弾き始める前とはまるで別人みたい……」"

[[dialogue]]
speaker = "ラクシャ"
# 「ギターのことはよく分からないんだけど、これ、多分すごいんだよね？」
line = "「ギターのことはよく分からないんだけど、これ、多分すごいんだよね？」"

[[dialogue]]
speaker = "unk"
# プロなのかな？
line = "プロなのかな？"

[[dialogue]]
speaker = "ラクシャ"
# 「プロの人って路上ライブとかやるの？　でも、そうだって言われても驚かないよ」
line = "「プロの人って路上ライブとかやるの？　でも、そうだって言われても驚かないよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「ライブハウスでバイトしてた時もいろんなギターを聞いてきたけど、こんなにビビッと来たこと無かったかも」
line = "「ライブハウスでバイトしてた時もいろんなギターを聞いてきたけど、こんなにビビッと来たこと無かったかも」"

[[dialogue]]
speaker = "ラクシャ"
# 「カッコいいなぁ……ギターが弾けるって、こんなにカッコ良かったんだ……」
line = "「カッコいいなぁ……ギターが弾けるって、こんなにカッコ良かったんだ……」"

[[dialogue]]
speaker = "ラクシャ"
# 「時間を忘れて最後まで聞き入っちゃってたね」
line = "「時間を忘れて最後まで聞き入っちゃってたね」"

[[dialogue]]
speaker = "ラクシャ"
# 「うーん……でも欲を言えば、まだまだもっと聞いてたかったよ」
line = "「うーん……でも欲を言えば、まだまだもっと聞いてたかったよ」"

[[dialogue]]
speaker = "unk"
# もっと聞いてく？
line = "もっと聞いてく？"

[[dialogue]]
speaker = "unk"
# 時間が大丈夫なら
line = "時間が大丈夫なら"

[[dialogue]]
speaker = "ラクシャ"
# 「えっ？　あ、そうか！　あるよね、いっぱい聞けるところ！」
line = "「えっ？　あ、そうか！　あるよね、いっぱい聞けるところ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「店長さんにも久しぶりに挨拶したいし、行こう行こう♪」
line = "「店長さんにも久しぶりに挨拶したいし、行こう行こう♪」"

[[dialogue]]
speaker = "unk"
# 俺と環は場所を移動して、昔、一緒に働いていたライブハウスにやってきていた。
line = "俺と環は場所を移動して、昔、一緒に働いていたライブハウスにやってきていた。"

[[dialogue]]
speaker = "ラクシャ"
# 「お客さんとしてくると、また違った感じがするね～」
line = "「お客さんとしてくると、また違った感じがするね～」"

[[dialogue]]
speaker = "unk"
# 少し緊張気味に地下に続く階段を降りていき、重たい扉を押して中に入る。
line = "少し緊張気味に地下に続く階段を降りていき、重たい扉を押して中に入る。"

[[dialogue]]
speaker = "店長"
# 「いらっしゃい──って、あら？　環ちゃんじゃんか」
line = "「いらっしゃい──って、あら？　環ちゃんじゃんか」"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、ご無沙汰♪　今日はお客さんとして来たよ♪」
line = "「あはは、ご無沙汰♪　今日はお客さんとして来たよ♪」"

[[dialogue]]
speaker = "unk"
# ２人でお願いします
line = "２人でお願いします"

[[dialogue]]
speaker = "店長"
# 「あいよ。何だぁ？　２人でデートかぁ？」
line = "「あいよ。何だぁ？　２人でデートかぁ？」"

[[dialogue]]
speaker = "ラクシャ"
# 「うん、そんな感じ」
line = "「うん、そんな感じ」"

[[dialogue]]
speaker = "店長"
# 「やっぱ付き合ってたんじゃねーかよ」
line = "「やっぱ付き合ってたんじゃねーかよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「バイトしてた時は違うよ。その後学校で再会して、それから付き合うようになったんだから」
line = "「バイトしてた時は違うよ。その後学校で再会して、それから付き合うようになったんだから」"

[[dialogue]]
speaker = "店長"
# 「へぇ～、運命だねぇ～。ま、ゆっくり楽しんで行きなよ」
line = "「へぇ～、運命だねぇ～。ま、ゆっくり楽しんで行きなよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「うん、ありがと！」
line = "「うん、ありがと！」"

[[dialogue]]
speaker = "unk"
# このライブハウスは最大収容人数が２００人ほどの小さなハコだ。
line = "このライブハウスは最大収容人数が２００人ほどの小さなハコだ。"

[[dialogue]]
speaker = "unk"
# けれど知名度はそこそこにあるようで、今日も大勢の客が入っている。
line = "けれど知名度はそこそこにあるようで、今日も大勢の客が入っている。"

[[dialogue]]
speaker = "unk"
# 俺たちは後ろの方に陣取って、ライブを楽しむことにした。
line = "俺たちは後ろの方に陣取って、ライブを楽しむことにした。"

[[dialogue]]
speaker = "ラクシャ"
# 「盛り上がってるねー。最前列の人たちとか、曲に合わせて飛び跳ねてて楽しそうだよ」
line = "「盛り上がってるねー。最前列の人たちとか、曲に合わせて飛び跳ねてて楽しそうだよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「バイトしながら眺めてた風景だけど、興味を持ってみると結構違う風に感じられるんだね」
line = "「バイトしながら眺めてた風景だけど、興味を持ってみると結構違う風に感じられるんだね」"

[[dialogue]]
speaker = "ラクシャ"
# 「ギターソロもカッコイイと思ったけど、バンドを組んで演奏するのも迫力があっていいなぁ」
line = "「ギターソロもカッコイイと思ったけど、バンドを組んで演奏するのも迫力があっていいなぁ」"

[[dialogue]]
speaker = "unk"
# 自分でもやってみたくなった？
line = "自分でもやってみたくなった？"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、それは考えてもみなかったよ」
line = "「あはは、それは考えてもみなかったよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「さすがに無理じゃないかな～。ボク、楽器とかやったことないし。会長はどうなの？」
line = "「さすがに無理じゃないかな～。ボク、楽器とかやったことないし。会長はどうなの？」"

[[dialogue]]
speaker = "unk"
# そんな余裕も無かったし
line = "そんな余裕も無かったし"

[[dialogue]]
speaker = "unk"
# 俺もないな
line = "俺もないな"

[[dialogue]]
speaker = "ラクシャ"
# 「そうだよね～。でも、世界も平和になったことだし、それこそ何か始めてみてもいいかもねー」
line = "「そうだよね～。でも、世界も平和になったことだし、それこそ何か始めてみてもいいかもねー」"

[[dialogue]]
speaker = "unk"
# そんな話をしながら、俺と環は久しぶりのライブハウスで音楽を堪能したのだった。
line = "そんな話をしながら、俺と環は久しぶりのライブハウスで音楽を堪能したのだった。"
