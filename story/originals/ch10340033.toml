[[dialogue]]
speaker = "unk"
# 第３話,魔王軍四天王結成！？,P
line = "第３話,魔王軍四天王結成！？,P"

[[dialogue]]
speaker = "unk"
# カティアに呼ばれて、カフェテリアに行くと、なんだかよく分からない面子が揃っていた。
line = "カティアに呼ばれて、カフェテリアに行くと、なんだかよく分からない面子が揃っていた。"

[[dialogue]]
speaker = "マリーベル"
# 「何なの、この集まりは？」
line = "「何なの、この集まりは？」"

[[dialogue]]
speaker = "unk"
# まず、カティアの園芸仲間にして串料理の達人、マリーベル。
line = "まず、カティアの園芸仲間にして串料理の達人、マリーベル。"

[[dialogue]]
speaker = "レイラ"
# 「私も呼ばれただけで、何も聞いてなくて……」
line = "「私も呼ばれただけで、何も聞いてなくて……」"

[[dialogue]]
speaker = "unk"
# ブラックホールを守護星とする星騎士、コラプサーの首領、レイラ。
line = "ブラックホールを守護星とする星騎士、コラプサーの首領、レイラ。"

[[dialogue]]
speaker = "リィベル"
# 「私も知らないわ。呼び出した張本人もまだ来てないし」
line = "「私も知らないわ。呼び出した張本人もまだ来てないし」"

[[dialogue]]
speaker = "unk"
# 『深淵書庫』の管理者、リィベル。
line = "『深淵書庫』の管理者、リィベル。"

[[dialogue]]
speaker = "カティア"
# 「お待たせしました～。みなさんご足労ありがとうございまベロス～」
line = "「お待たせしました～。みなさんご足労ありがとうございまベロス～」"

[[dialogue]]
speaker = "unk"
# そこに、みんなを集めた張本人のカティアが現れる。
line = "そこに、みんなを集めた張本人のカティアが現れる。"

[[dialogue]]
speaker = "リィベル"
# 「どうして魔将フォームに変身しているの？」
line = "「どうして魔将フォームに変身しているの？」"

[[dialogue]]
speaker = "カティア"
# 「それはもちろん、これが私の一張羅だから！　形から入るのって大事でしょ？」
line = "「それはもちろん、これが私の一張羅だから！　形から入るのって大事でしょ？」"

[[dialogue]]
speaker = "リィベル"
# 「ふーん……で、今日は何の用なの？」
line = "「ふーん……で、今日は何の用なの？」"

[[dialogue]]
speaker = "カティア"
# 「ふっふっふ～♪　今日は今まで棚上げしていた『アレ』を決めたいと思って！」
line = "「ふっふっふ～♪　今日は今まで棚上げしていた『アレ』を決めたいと思って！」"

[[dialogue]]
speaker = "リィベル"
# 「『アレ』……？　どれ……？」
line = "「『アレ』……？　どれ……？」"

[[dialogue]]
speaker = "カティア"
# 「それはもちろん、魔王軍四天王です！」
line = "「それはもちろん、魔王軍四天王です！」"

[[dialogue]]
speaker = "マリーベル"
# 「はぁ……」
line = "「はぁ……」"

[[dialogue]]
speaker = "レイラ"
# 「……すみません、どなたかご説明をいただけますか？　魔王軍？　なんてあったんですか？」
line = "「……すみません、どなたかご説明をいただけますか？　魔王軍？　なんてあったんですか？」"

[[dialogue]]
speaker = "マリーベル"
# 「ないわよ、そんなもの。カティアさんが勝手に言い出しただけ。……まだ世界征服なんて言ってたのね」
line = "「ないわよ、そんなもの。カティアさんが勝手に言い出しただけ。……まだ世界征服なんて言ってたのね」"

[[dialogue]]
speaker = "カティア"
# 「まだ、どころか絶賛進行中です！　ね、リィベル？」
line = "「まだ、どころか絶賛進行中です！　ね、リィベル？」"

[[dialogue]]
speaker = "リィベル"
# 「なんで私に振るのよ」
line = "「なんで私に振るのよ」"

[[dialogue]]
speaker = "カティア"
# 「だって、世界征服の夢を語ったら、それでこそ魔族って言ってくれたし！」
line = "「だって、世界征服の夢を語ったら、それでこそ魔族って言ってくれたし！」"

[[dialogue]]
speaker = "マリーベル"
# 「あなた、そんなこと言ったの？　カティアさんは純粋なんだからちゃんとできないことはできないって言わないとダメよ」
line = "「あなた、そんなこと言ったの？　カティアさんは純粋なんだからちゃんとできないことはできないって言わないとダメよ」"

[[dialogue]]
speaker = "リィベル"
# 「え、なんで私が怒られてるの……？　確かに魔族らしいとは言ったけど、世界征服に協力するとまでは言ってないわ」
line = "「え、なんで私が怒られてるの……？　確かに魔族らしいとは言ったけど、世界征服に協力するとまでは言ってないわ」"

[[dialogue]]
speaker = "カティア"
# 「ええ～～～！？　リィベルには四天王の参謀やってほしかったのに～！　本たくさん読んでるから頭よさそうだし」
line = "「ええ～～～！？　リィベルには四天王の参謀やってほしかったのに～！　本たくさん読んでるから頭よさそうだし」"

[[dialogue]]
speaker = "リィベル"
# （……残念ながら、読書量と成績は比例しないわ。それなら苦労しないのに）
line = "（……残念ながら、読書量と成績は比例しないわ。それなら苦労しないのに）"

[[dialogue]]
speaker = "レイラ"
# 「四天王の中にも役割分担があるんですね。他にはどんな役割があるんですか？」
line = "「四天王の中にも役割分担があるんですね。他にはどんな役割があるんですか？」"

[[dialogue]]
speaker = "カティア"
# 「マリーベル先輩は魔王軍の切り込み隊長です！　魔犬の群れを率いて戦います！」
line = "「マリーベル先輩は魔王軍の切り込み隊長です！　魔犬の群れを率いて戦います！」"

[[dialogue]]
speaker = "マリーベル"
# 「魔犬？」
line = "「魔犬？」"

[[dialogue]]
speaker = "カティア"
# 「私の使い魔だよ。いけ、ワンワンアーミー！」
line = "「私の使い魔だよ。いけ、ワンワンアーミー！」"

[[dialogue]]
speaker = "unk"
# カティアが呼ぶと、子犬の使い魔が飛び出してくる。
line = "カティアが呼ぶと、子犬の使い魔が飛び出してくる。"

[[dialogue]]
speaker = "犬の使い魔"
# 「ワンワン！」
line = "「ワンワン！」"

[[dialogue]]
speaker = "マリーベル"
# 「かわいい……」
line = "「かわいい……」"

[[dialogue]]
speaker = "カティア"
# 「じゃあ、ひと株あげますよ！　いくらでも生えてくるので！」
line = "「じゃあ、ひと株あげますよ！　いくらでも生えてくるので！」"

[[dialogue]]
speaker = "マリーベル"
# 「は？　生えてくる？」
line = "「は？　生えてくる？」"

[[dialogue]]
speaker = "カティア"
# 「はい！　あ、でも、水をあげないとすぐ枯れちゃうので気を付けてください」
line = "「はい！　あ、でも、水をあげないとすぐ枯れちゃうので気を付けてください」"

[[dialogue]]
speaker = "マリーベル"
# 「枯れる！？　犬なのに！？」
line = "「枯れる！？　犬なのに！？」"

[[dialogue]]
speaker = "カティア"
# 「まぁ、野菜みたいなものなので……」
line = "「まぁ、野菜みたいなものなので……」"

[[dialogue]]
speaker = "レイラ"
# 「このワンちゃん、お野菜なんですか！？　食べたらどんなお味なんでしょう……」
line = "「このワンちゃん、お野菜なんですか！？　食べたらどんなお味なんでしょう……」"

[[dialogue]]
speaker = "リィベル"
# 「魔力で具現化したものだから食べても腹は膨らまないわよ。というか、調理した時点で消えると思うけど」
line = "「魔力で具現化したものだから食べても腹は膨らまないわよ。というか、調理した時点で消えると思うけど」"

[[dialogue]]
speaker = "マリーベル"
# 「そもそも食べようとしないで。コラプサーって変人しかいないのかしら……」
line = "「そもそも食べようとしないで。コラプサーって変人しかいないのかしら……」"

[[dialogue]]
speaker = "カティア"
# 「うぅ……蘇る思い出……」
line = "「うぅ……蘇る思い出……」"

[[dialogue]]
speaker = "unk"
# カティア、マリーベルとは一緒にコラプサーを撃退したこともある。
line = "カティア、マリーベルとは一緒にコラプサーを撃退したこともある。"

[[dialogue]]
speaker = "unk"
# 戦ったのは、戦闘狂のイングリットとコラプサー最弱のジュリエッテという極端なコンビだった。
line = "戦ったのは、戦闘狂のイングリットとコラプサー最弱のジュリエッテという極端なコンビだった。"

[[dialogue]]
speaker = "レイラ"
# 「その節は大変ご迷惑をおかけしました……」
line = "「その節は大変ご迷惑をおかけしました……」"

[[dialogue]]
speaker = "レイラ"
# 「ちなみに、私の四天王での役割は？　ブラックホールを活かした決戦兵器……あるいはハッキングによる情報工作……どっちも自信ありです」
line = "「ちなみに、私の四天王での役割は？　ブラックホールを活かした決戦兵器……あるいはハッキングによる情報工作……どっちも自信ありです」"

[[dialogue]]
speaker = "カティア"
# 「あ、考えてませんでした。なんか見た目が悪の幹部っぽいからそれだけで……。う～～ん…………大食い番長、とか？」
line = "「あ、考えてませんでした。なんか見た目が悪の幹部っぽいからそれだけで……。う～～ん…………大食い番長、とか？」"

[[dialogue]]
speaker = "レイラ"
# 「私ってそんなイメージなんですか！？　ていうか世界征服どこいっちゃいました！？」
line = "「私ってそんなイメージなんですか！？　ていうか世界征服どこいっちゃいました！？」"

[[dialogue]]
speaker = "リィベル"
# 「カティア、あなたはどうなの？　あなたは四天王で何を担っているのよ」
line = "「カティア、あなたはどうなの？　あなたは四天王で何を担っているのよ」"

[[dialogue]]
speaker = "カティア"
# 「私は四天王筆頭兼魔王様の恋人だベロス！　ふっふ～、すごいでしょっ！」
line = "「私は四天王筆頭兼魔王様の恋人だベロス！　ふっふ～、すごいでしょっ！」"

[[dialogue]]
speaker = "リィベル"
# 「ふぅん。あなたたち、付き合いだしたのね。おめでとう」
line = "「ふぅん。あなたたち、付き合いだしたのね。おめでとう」"

[[dialogue]]
speaker = "マリーベル"
# 「……そう。もしかして私たち、あなたたちのノロケに付き合わされたのかしら」
line = "「……そう。もしかして私たち、あなたたちのノロケに付き合わされたのかしら」"

[[dialogue]]
speaker = "カティア"
# 「え！？　そんなつもりじゃ……」
line = "「え！？　そんなつもりじゃ……」"

[[dialogue]]
speaker = "マリーベル"
# 「邪魔になっても悪いから、もう行くわ。蛍火さんと串バトルしてくる」
line = "「邪魔になっても悪いから、もう行くわ。蛍火さんと串バトルしてくる」"

[[dialogue]]
speaker = "レイラ"
# 「あの伝説のイベント、串バトルがついに復刻……！？　私も同行しますっ！」
line = "「あの伝説のイベント、串バトルがついに復刻……！？　私も同行しますっ！」"

[[dialogue]]
speaker = "リィベル"
# 「じゃあ私、串カツが食べたいわ。うずらの卵と豚玉ねぎをお願い」
line = "「じゃあ私、串カツが食べたいわ。うずらの卵と豚玉ねぎをお願い」"

[[dialogue]]
speaker = "カティア"
# 「魔王様～！　四天王が、四天王がバラバラになっちゃいました～！」
line = "「魔王様～！　四天王が、四天王がバラバラになっちゃいました～！」"

[[dialogue]]
speaker = "unk"
# おお、よしよし……
line = "おお、よしよし……"

[[dialogue]]
speaker = "unk"
# 凹むカティアの頭を撫でてやる。そんな日もあるさ。
line = "凹むカティアの頭を撫でてやる。そんな日もあるさ。"

[[dialogue]]
speaker = "カティア"
# 「うぅ、魔王様……カティアには魔王様だけですぅ……」
line = "「うぅ、魔王様……カティアには魔王様だけですぅ……」"

[[dialogue]]
speaker = "unk"
# 魔王軍四天王、結成ならず……そもそも魔王軍すら結成してないけど。
line = "魔王軍四天王、結成ならず……そもそも魔王軍すら結成してないけど。"
