[[dialogue]]
speaker = "unk"
# 第４話,『その名も、ＧｏｌｄｅｎＡｎｇｅｌｓ！』,B
line = "第４話,『その名も、ＧｏｌｄｅｎＡｎｇｅｌｓ！』,B"

[[dialogue]]
speaker = "unk"
# 一行が向かったのは流星市国から少し外れたところにある遊園地だった。
line = "一行が向かったのは流星市国から少し外れたところにある遊園地だった。"

[[dialogue]]
speaker = "セシア"
# 「本当にここにパテルが居るのかしら？」
line = "「本当にここにパテルが居るのかしら？」"

[[dialogue]]
speaker = "ラクシャ"
# 「多分ね。ここは彼女のお気に入りの場所だから」
line = "「多分ね。ここは彼女のお気に入りの場所だから」"

[[dialogue]]
speaker = "ラクシャ"
# 「ちょっと待ってね…………うん、居るみたいだ。ボクたちラッキーだよ♪」
line = "「ちょっと待ってね…………うん、居るみたいだ。ボクたちラッキーだよ♪」"

[[dialogue]]
speaker = "アルモタヘル"
# 「完全に気配を絶っているようだが、本当にここに居るのか？」
line = "「完全に気配を絶っているようだが、本当にここに居るのか？」"

[[dialogue]]
speaker = "マグダレナ"
# 「私にも何も感じられません……」
line = "「私にも何も感じられません……」"

[[dialogue]]
speaker = "ラクシャ"
# 「近くに居るよ。ねえ、隠れていないで姿を現してよ」
line = "「近くに居るよ。ねえ、隠れていないで姿を現してよ」"

[[dialogue]]
speaker = "パテル"
# 「はぁ、もう……本当に面倒な相手だよ、ラクシャは」
line = "「はぁ、もう……本当に面倒な相手だよ、ラクシャは」"

[[dialogue]]
speaker = "unk"
# ラクシャの呼びかけに応じて、パテルが姿を現す。
line = "ラクシャの呼びかけに応じて、パテルが姿を現す。"

[[dialogue]]
speaker = "セシア"
# 「本当に居たわ！」
line = "「本当に居たわ！」"

[[dialogue]]
speaker = "パテル"
# 「守護天使が勢ぞろいでゾロゾロと、何をしに来たのさ。どうせロクでもないことだと思うけど～」
line = "「守護天使が勢ぞろいでゾロゾロと、何をしに来たのさ。どうせロクでもないことだと思うけど～」"

[[dialogue]]
speaker = "ラクシャ"
# 「そんな嫌そうな顔をしないでよ。ちょっとだけキミに協力して欲しいってことがあるだけだから」
line = "「そんな嫌そうな顔をしないでよ。ちょっとだけキミに協力して欲しいってことがあるだけだから」"

[[dialogue]]
speaker = "パテル"
# 「ふーん……<ruby=あたし>守護天使</ruby>たちでバンドを組んで、ハロウィンパーティーで演奏かー」
line = "「ふーん……<ruby>守護天使<rt>あたし</rt></ruby>たちでバンドを組んで、ハロウィンパーティーで演奏かー」"

[[dialogue]]
speaker = "ラクシャ"
# 「ね、面白そうじゃない？　パテルも参加してよ」
line = "「ね、面白そうじゃない？　パテルも参加してよ」"

[[dialogue]]
speaker = "パテル"
# 「パス～」
line = "「パス～」"

[[dialogue]]
speaker = "ラクシャ"
# 「えー！」
line = "「えー！」"

[[dialogue]]
speaker = "パテル"
# 「ライブって、たくさんの人の前に姿を晒すことになるよね？　あたしは基本的に『現世には不干渉』なんだけど」
line = "「ライブって、たくさんの人の前に姿を晒すことになるよね？　あたしは基本的に『現世には不干渉』なんだけど」"

[[dialogue]]
speaker = "パテル"
# 「しかもあたしがぷりちーすぎてファンが増えちゃうかもしれないし。パテルちゃん的にはそういうのＮＧなんだよねー」
line = "「しかもあたしがぷりちーすぎてファンが増えちゃうかもしれないし。パテルちゃん的にはそういうのＮＧなんだよねー」"

[[dialogue]]
speaker = "パテル"
# 「六分の五柱まで揃ってるんだったら、もう十分、守護天使バンドって<ruby=うた>謳</ruby>ってもいいじゃん」
line = "「六分の五柱まで揃ってるんだったら、もう十分、守護天使バンドって<ruby>謳<rt>うた</rt></ruby>ってもいいじゃん」"

[[dialogue]]
speaker = "パテル"
# 「というわけで、みんなだけで頑張ってよ♪　じゃーねー」
line = "「というわけで、みんなだけで頑張ってよ♪　じゃーねー」"

[[dialogue]]
speaker = "ラクシャ"
# 「あのさ、絶対にダメかな？　今回はどうしても、キミに加わって欲しいんだけど」
line = "「あのさ、絶対にダメかな？　今回はどうしても、キミに加わって欲しいんだけど」"

[[dialogue]]
speaker = "パテル"
# 「何なに……ラクシャらしくなくて、ちょっと気持ち悪いんだけど」
line = "「何なに……ラクシャらしくなくて、ちょっと気持ち悪いんだけど」"

[[dialogue]]
speaker = "ラクシャ"
# 「そうかもね。ルヴィネさまが頑張ってるから、それに感化されちゃったのかもしれない……」
line = "「そうかもね。ルヴィネさまが頑張ってるから、それに感化されちゃったのかもしれない……」"

[[dialogue]]
speaker = "ラクシャ"
# 「ルヴィネさまもハロウィンに『主体的に参加する』ことで、お祭りの何たるかを学ぼうとしてるんだよ」
line = "「ルヴィネさまもハロウィンに『主体的に参加する』ことで、お祭りの何たるかを学ぼうとしてるんだよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「主であるルヴィネさまがあんなに一生懸命なのに、ボクたち守護天使が我関せずを決め込むのはちょっと申し訳ないかなーって」
line = "「主であるルヴィネさまがあんなに一生懸命なのに、ボクたち守護天使が我関せずを決め込むのはちょっと申し訳ないかなーって」"

[[dialogue]]
speaker = "ラクシャ"
# 「それにボクだって守護天使だ。人々の生きる活力になるのなら、出来る限りのことをしたいよ」
line = "「それにボクだって守護天使だ。人々の生きる活力になるのなら、出来る限りのことをしたいよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「だから……復興に励むデネブのみんなのために、ボクはライブがしたいんだ」
line = "「だから……復興に励むデネブのみんなのために、ボクはライブがしたいんだ」"

[[dialogue]]
speaker = "パテル"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "ラクシャ"
# 「どうかな、パテル？」
line = "「どうかな、パテル？」"

[[dialogue]]
speaker = "パテル"
# 「胡散臭い」
line = "「胡散臭い」"

[[dialogue]]
speaker = "ラクシャ"
# 「えー、酷いよー」
line = "「えー、酷いよー」"

[[dialogue]]
speaker = "パテル"
# 「ラクシャのことだし、口では立派なことを言いながら、実はただ面白がってるだけでした、とかありそーだし」
line = "「ラクシャのことだし、口では立派なことを言いながら、実はただ面白がってるだけでした、とかありそーだし」"

[[dialogue]]
speaker = "パテル"
# 「はぁ……でも、まあいいや。ラクシャがそこまで言うんだったら」
line = "「はぁ……でも、まあいいや。ラクシャがそこまで言うんだったら」"

[[dialogue]]
speaker = "オオヒメ"
# 「驚いたな、引き受けてくれるというのか！？」
line = "「驚いたな、引き受けてくれるというのか！？」"

[[dialogue]]
speaker = "パテル"
# 「義体に適合できなかった時に、ラクシャの権能で体を作ってもらったっていう借りもあるからね」
line = "「義体に適合できなかった時に、ラクシャの権能で体を作ってもらったっていう借りもあるからね」"

[[dialogue]]
speaker = "ラクシャ"
# 「それについては前にいろいろ手伝ってもらって清算したってことになってるんだけど……」
line = "「それについては前にいろいろ手伝ってもらって清算したってことになってるんだけど……」"

[[dialogue]]
speaker = "パテル"
# 「あたしは優しいから、今回限りのおまけってことにしといてあげるよ」
line = "「あたしは優しいから、今回限りのおまけってことにしといてあげるよ」"

[[dialogue]]
speaker = "パテル"
# 「みんなだけに任せると、とんでもない恥をかきそうだし、それは守護天使として見過ごせないからね」
line = "「みんなだけに任せると、とんでもない恥をかきそうだし、それは守護天使として見過ごせないからね」"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、助かるよ～！」
line = "「あはは、助かるよ～！」"

[[dialogue]]
speaker = "パテル"
# 「ああでも、１つだけ条件を出させてもらおうかな」
line = "「ああでも、１つだけ条件を出させてもらおうかな」"

[[dialogue]]
speaker = "ラクシャ"
# 「ん、何？」
line = "「ん、何？」"

[[dialogue]]
speaker = "パテル"
# 「あたしの担当する楽器は自分で選ばせてよ」
line = "「あたしの担当する楽器は自分で選ばせてよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「ふーん、やりたい楽器があるんだ。いいよ、その条件で」
line = "「ふーん、やりたい楽器があるんだ。いいよ、その条件で」"

[[dialogue]]
speaker = "マグダレナ"
# 「とうとう守護天使全員が揃いましたね」
line = "「とうとう守護天使全員が揃いましたね」"

[[dialogue]]
speaker = "ラクシャ"
# 「うん！　いよいよここから始まるよ、ボクたちの伝説が！」
line = "「うん！　いよいよここから始まるよ、ボクたちの伝説が！」"

[[dialogue]]
speaker = "パテル"
# 「バンド名は決まってるの？」
line = "「バンド名は決まってるの？」"

[[dialogue]]
speaker = "ラクシャ"
# 「もちろん！」
line = "「もちろん！」"

[[dialogue]]
speaker = "セシア"
# 「あら？　わたくしたち、まだ聞いてないのだけれど？」
line = "「あら？　わたくしたち、まだ聞いてないのだけれど？」"

[[dialogue]]
speaker = "オオヒメ"
# 「確かに聞いていないな」
line = "「確かに聞いていないな」"

[[dialogue]]
speaker = "ラクシャ"
# 「あれ、言ってなかったっけ？　それじゃ、ここで発表といこうかな♪」
line = "「あれ、言ってなかったっけ？　それじゃ、ここで発表といこうかな♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「コホン……守護天使バンド、その名も『<ruby=ゴールデン　エンジェルス>Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ</ruby>』、ここに結成だよっ！」
line = "「コホン……守護天使バンド、その名も『<ruby>Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ<rt>ゴールデン　エンジェルス</rt></ruby>』、ここに結成だよっ！」"

[[dialogue]]
speaker = "守護天使たち"
# 「微妙……」
line = "「微妙……」"
