[[dialogue]]
speaker = "unk"
# モンスターを全滅させた星騎士たちはリィベルによって回収され、現時点で覚醒した魔将が一堂に会する。
line = "モンスターを全滅させた星騎士たちはリィベルによって回収され、現時点で覚醒した魔将が一堂に会する。"

[[dialogue]]
speaker = "リィベル"
# 「ありがとう。あなたたちのおかげで魔族を守ることができたわ。……新たに目覚めた魔将については、暴走の傾向があるようだけど、それは今後の課題としましょう」
line = "「ありがとう。あなたたちのおかげで魔族を守ることができたわ。……新たに目覚めた魔将については、暴走の傾向があるようだけど、それは今後の課題としましょう」"

[[dialogue]]
speaker = "モネ（覚醒）"
# 「私とウィステリアさんがいない間に、大変なことになっていたんですね……」
line = "「私とウィステリアさんがいない間に、大変なことになっていたんですね……」"

[[dialogue]]
speaker = "ウィステリア（覚醒）"
# 「帰ってきたら魔将が増えてるとは思わなかったわ」
line = "「帰ってきたら魔将が増えてるとは思わなかったわ」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「私からもお礼を言わせてください。サラン先輩たちのおかげでディアーブルの民と土地を守ることができました。ありがとうございます」
line = "「私からもお礼を言わせてください。サラン先輩たちのおかげでディアーブルの民と土地を守ることができました。ありがとうございます」"

[[dialogue]]
speaker = "リィベル"
# 「今はゆっくり休んでちょうだい。シャリオンに向かったサランたちは特に疲れているでしょう」
line = "「今はゆっくり休んでちょうだい。シャリオンに向かったサランたちは特に疲れているでしょう」"

[[dialogue]]
speaker = "サラン"
# 「はーい。リィベルちゃんもおつかれさま～」
line = "「はーい。リィベルちゃんもおつかれさま～」"

[[dialogue]]
speaker = "サラン"
# 「ふぅ～～、あんまりよく覚えてないけど、楽しかった～♪　でも、お腹空いちゃった～」
line = "「ふぅ～～、あんまりよく覚えてないけど、楽しかった～♪　でも、お腹空いちゃった～」"

[[dialogue]]
speaker = "イクシリオン"
# 「私もです……空腹でもう、一歩も動けません……」
line = "「私もです……空腹でもう、一歩も動けません……」"

[[dialogue]]
speaker = "カティア"
# 「うぅ、ダッシュ１００本やったあとみたい……何か食べるものないですかぁ……」
line = "「うぅ、ダッシュ１００本やったあとみたい……何か食べるものないですかぁ……」"

[[dialogue]]
speaker = "モネ"
# 「書庫ですからね。さすがに飲食物はおいてませ……」
line = "「書庫ですからね。さすがに飲食物はおいてませ……」"

[[dialogue]]
speaker = "ウィステリア"
# 「え、なに今の揺れ？　またよくないことが起きたんじゃないでしょうね」
line = "「え、なに今の揺れ？　またよくないことが起きたんじゃないでしょうね」"

[[dialogue]]
speaker = "リィベル"
# 「新たな区画が出現したようね。ふむ……今のあなたたちに必要なものよ」
line = "「新たな区画が出現したようね。ふむ……今のあなたたちに必要なものよ」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「必要なもの……？　私、見てきますね。先輩方は座っていてください」
line = "「必要なもの……？　私、見てきますね。先輩方は座っていてください」"

[[dialogue]]
speaker = "unk"
# シャルレーヌは今までなかったはずのドアを開けて出ていくと、すぐまた戻ってくる。
line = "シャルレーヌは今までなかったはずのドアを開けて出ていくと、すぐまた戻ってくる。"

[[dialogue]]
speaker = "シャルレーヌ"
# 「一流レストランみたいな立派な厨房ができてます！　書庫なのに！」
line = "「一流レストランみたいな立派な厨房ができてます！　書庫なのに！」"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～！」
line = "「ぽよ～！」"

[[dialogue]]
speaker = "unk"
# 聞くや否や、疲れも空腹も押しのけて、サランが厨房に向かう。
line = "聞くや否や、疲れも空腹も押しのけて、サランが厨房に向かう。"

[[dialogue]]
speaker = "サラン"
# 「すご～い！　冷蔵庫に食材も入ってる～！　これならすぐに何か作れるよ～！」
line = "「すご～い！　冷蔵庫に食材も入ってる～！　これならすぐに何か作れるよ～！」"

[[dialogue]]
speaker = "カティア"
# 「やったぁ～！　お願いしまーす！」
line = "「やったぁ～！　お願いしまーす！」"

[[dialogue]]
speaker = "イクシリオン"
# 「私からもお願いします！」
line = "「私からもお願いします！」"

[[dialogue]]
speaker = "サラン"
# 「ふわっとりょ～かーい♪」
line = "「ふわっとりょ～かーい♪」"

[[dialogue]]
speaker = "ウィステリア"
# 「新しい区画は今までもあったけど、厨房なんてどうなってるのよ……」
line = "「新しい区画は今までもあったけど、厨房なんてどうなってるのよ……」"

[[dialogue]]
speaker = "リィベル"
# 「この書庫にとってあなたたち魔将は利用者よ。書庫の有り余る魔力を使えば、利用者の欲望を具現化することは容易いわ」
line = "「この書庫にとってあなたたち魔将は利用者よ。書庫の有り余る魔力を使えば、利用者の欲望を具現化することは容易いわ」"

[[dialogue]]
speaker = "ウィステリア"
# 「じゃあ、マッサージチェアを完備した部屋とかもできるの？」
line = "「じゃあ、マッサージチェアを完備した部屋とかもできるの？」"

[[dialogue]]
speaker = "リィベル"
# 「できるけどやらない。管理者権限で却下するわ」
line = "「できるけどやらない。管理者権限で却下するわ」"

[[dialogue]]
speaker = "ウィステリア"
# 「なんでよ！　いいでしょマッサージチェア！」
line = "「なんでよ！　いいでしょマッサージチェア！」"

[[dialogue]]
speaker = "モネ"
# 「あはは……」
line = "「あはは……」"

[[dialogue]]
speaker = "サラン"
# 「お待たせ～。暴食印のフルーツタルトだよ～」
line = "「お待たせ～。暴食印のフルーツタルトだよ～」"

[[dialogue]]
speaker = "イクシリオン"
# 「ありがとうございます！　とっても美味しそうです～！」
line = "「ありがとうございます！　とっても美味しそうです～！」"

[[dialogue]]
speaker = "モネ"
# 「見たことのない果物ですね……これはどちらから？」
line = "「見たことのない果物ですね……これはどちらから？」"

[[dialogue]]
speaker = "サラン"
# 「冷蔵庫にあったから使ってみたの～。魔本に書いてあったのと同じだから、魔界の果物かも～」
line = "「冷蔵庫にあったから使ってみたの～。魔本に書いてあったのと同じだから、魔界の果物かも～」"

[[dialogue]]
speaker = "カティア"
# 「ひいおじいちゃんから聞いたことありますっ！　魔界の秘境でしかとれない伝説の果物だって！」
line = "「ひいおじいちゃんから聞いたことありますっ！　魔界の秘境でしかとれない伝説の果物だって！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「私も見たことありませんね。少なくともシャリオンでは採れないものなのでしょうか」
line = "「私も見たことありませんね。少なくともシャリオンでは採れないものなのでしょうか」"

[[dialogue]]
speaker = "ウィステリア"
# 「え、そうなの？　うちの実家の裏山でぽこぽこ生ってたわよ？　見たら懐かしく感じちゃったわ」
line = "「え、そうなの？　うちの実家の裏山でぽこぽこ生ってたわよ？　見たら懐かしく感じちゃったわ」"

[[dialogue]]
speaker = "リィベル"
# 「じゃあウィステリアの実家が秘境なのね」
line = "「じゃあウィステリアの実家が秘境なのね」"

[[dialogue]]
speaker = "ウィステリア"
# 「秘境じゃないわ、ちょっと田舎なだけ！」
line = "「秘境じゃないわ、ちょっと田舎なだけ！」"

[[dialogue]]
speaker = "イクシリオン"
# 「では、いただきます！」
line = "「では、いただきます！」"

[[dialogue]]
speaker = "イクシリオン"
# 「むむっ！？　強い酸味に……ほのかな甘みと芳醇な果実の香り……味わったことがないスイーツですね。フォークが止まりません！」
line = "「むむっ！？　強い酸味に……ほのかな甘みと芳醇な果実の香り……味わったことがないスイーツですね。フォークが止まりません！」"

[[dialogue]]
speaker = "リィベル"
# 「私、甘いものはあんまり……」
line = "「私、甘いものはあんまり……」"

[[dialogue]]
speaker = "サラン"
# 「せっかくだから、ひと口だけでも食べて欲しいな～」
line = "「せっかくだから、ひと口だけでも食べて欲しいな～」"

[[dialogue]]
speaker = "リィベル"
# 「……じゃあ、少しだけ……ん！？　すっぱ！？　でも甘すぎなくて美味しいわ」
line = "「……じゃあ、少しだけ……ん！？　すっぱ！？　でも甘すぎなくて美味しいわ」"

[[dialogue]]
speaker = "サラン"
# 「よかった～♪　おかわり欲しいひと～？」
line = "「よかった～♪　おかわり欲しいひと～？」"

[[dialogue]]
speaker = "カティア"
# 「はーい！」
line = "「はーい！」"

[[dialogue]]
speaker = "イクシリオン"
# 「お願いします！」
line = "「お願いします！」"

[[dialogue]]
speaker = "unk"
# 当然、みんなが一斉に手を上げる。
line = "当然、みんなが一斉に手を上げる。"

[[dialogue]]
speaker = "リィベル"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "unk"
# ワンテンポ遅れてリィベルもおずおずと。
line = "ワンテンポ遅れてリィベルもおずおずと。"

[[dialogue]]
speaker = "サラン"
# 「えへへ～♪　じゃあちょっと待っててね～♪」
line = "「えへへ～♪　じゃあちょっと待っててね～♪」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「それにしても、カティア先輩に魔将の座を奪われるとは思いませんでした。しかも世界征服だなんて、子どもみたいなことを言い出して」
line = "「それにしても、カティア先輩に魔将の座を奪われるとは思いませんでした。しかも世界征服だなんて、子どもみたいなことを言い出して」"

[[dialogue]]
speaker = "カティア"
# 「子どもっぽくない！　世界征服は立派な野望だから！」
line = "「子どもっぽくない！　世界征服は立派な野望だから！」"

[[dialogue]]
speaker = "カティア"
# 「まずは魔将の力で活躍して、有名な星騎士になって……最終的には魔王様と世界を統べてみせるベロス！」
line = "「まずは魔将の力で活躍して、有名な星騎士になって……最終的には魔王様と世界を統べてみせるベロス！」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「え……？」
line = "「え……？」"

[[dialogue]]
speaker = "ウィステリア"
# 「今のなに……？」
line = "「今のなに……？」"

[[dialogue]]
speaker = "カティア"
# 「ゆくゆくは有名魔族になるので箔をつけようと思って！　ふっふっふ……我こそはシャリオン十一貴族初代、カティア・セルベラスだベロス！」
line = "「ゆくゆくは有名魔族になるので箔をつけようと思って！　ふっふっふ……我こそはシャリオン十一貴族初代、カティア・セルベラスだベロス！」"

[[dialogue]]
speaker = "ウィステリア"
# 「無理があるでしょそれは……」
line = "「無理があるでしょそれは……」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「勝手に貴族を名乗らないでもらえます～？」
line = "「勝手に貴族を名乗らないでもらえます～？」"

[[dialogue]]
speaker = "イクシリオン"
# 「お腹にものが入ると冷静になりますね……。みなさん、私がむっつりドスケベだということはどうか、ここだけの秘密でお願いします……」
line = "「お腹にものが入ると冷静になりますね……。みなさん、私がむっつりドスケベだということはどうか、ここだけの秘密でお願いします……」"

[[dialogue]]
speaker = "モネ"
# 「それはもちろん……あ、でも、魔将フォームに変身したら秘密も何もないのでは……？」
line = "「それはもちろん……あ、でも、魔将フォームに変身したら秘密も何もないのでは……？」"

[[dialogue]]
speaker = "イクシリオン"
# 「確かに～～！！　これからどうしましょう～！」
line = "「確かに～～！！　これからどうしましょう～！」"

[[dialogue]]
speaker = "リィベル"
# 「シャルレーヌ。あなたに聞いておくことがあるわ」
line = "「シャルレーヌ。あなたに聞いておくことがあるわ」"

[[dialogue]]
speaker = "リィベル"
# 「魔将はまだ『嫉妬』と『憤怒』の席が空いているけど、呪いが活性化したら声をかけた方がいいかしら？」
line = "「魔将はまだ『嫉妬』と『憤怒』の席が空いているけど、呪いが活性化したら声をかけた方がいいかしら？」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「えぇっと……」
line = "「えぇっと……」"

[[dialogue]]
speaker = "カティア"
# 「わーっはっはっは！　征服征服～！　ベロスベロス～！」
line = "「わーっはっはっは！　征服征服～！　ベロスベロス～！」"

[[dialogue]]
speaker = "イクシリオン（覚醒）"
# 「はぁ、はぁ、はぁ…………はわぁ～～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」
line = "「はぁ、はぁ、はぁ…………はわぁ～～～～～～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "サラン"
# 「ふふ、ふふふ～♪　そ～れ、生クリームたべほうだ～い♪」
line = "「ふふ、ふふふ～♪　そ～れ、生クリームたべほうだ～い♪」"

[[dialogue]]
speaker = "シャルレーヌ"
# 「いえ、結構です。他に相応しい方はいらっしゃると思いますので、辞退させていただきます」
line = "「いえ、結構です。他に相応しい方はいらっしゃると思いますので、辞退させていただきます」"

[[dialogue]]
speaker = "リィベル"
# 「そう……」
line = "「そう……」"

[[dialogue]]
speaker = "サラン"
# 「お待ちどうさま～。おかわり作ってきたよ～。いっぱいあるからたくさん食べてね～」
line = "「お待ちどうさま～。おかわり作ってきたよ～。いっぱいあるからたくさん食べてね～」"

[[dialogue]]
speaker = "カティア"
# 「ありがとうございまベロス！」
line = "「ありがとうございまベロス！」"

[[dialogue]]
speaker = "イクシリオン"
# 「んん～～！　すっぱくて美味しいです！」
line = "「んん～～！　すっぱくて美味しいです！」"

[[dialogue]]
speaker = "リィベル"
# 「ふっ……この深淵書庫が、こんなに賑やかになる日が来るなんてね」
line = "「ふっ……この深淵書庫が、こんなに賑やかになる日が来るなんてね」"

[[dialogue]]
speaker = "リィベル"
# （ああ……でも、胸騒ぎがする）
line = "（ああ……でも、胸騒ぎがする）"

[[dialogue]]
speaker = "リィベル"
# （新たに３人の魔将が覚醒し、魔界を守ることができた。なのにどうして不安が消えないの）
line = "（新たに３人の魔将が覚醒し、魔界を守ることができた。なのにどうして不安が消えないの）"

[[dialogue]]
speaker = "リィベル"
# （こんな日がずっと続けばいいのに……なんて、叶わぬ願いなんでしょうね）
line = "（こんな日がずっと続けばいいのに……なんて、叶わぬ願いなんでしょうね）"
