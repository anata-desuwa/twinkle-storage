# ペニスが栓になっていたのだろう。繋がりを解いた瞬間、ごぽごぽと精液がこぼれ出てくる。
line = "ペニスが栓になっていたのだろう。繋がりを解いた瞬間、ごぽごぽと精液がこぼれ出てくる。"

[[dialogue]]
speaker = "トリュファイナ"
# 「普段、よりも……ずうっと量が、多い気がいたします……<emoji=heart04><emoji=heart04>　魔王様……ウサギの私で、こ、興奮……していただけたのですね？」
line = "「普段、よりも……ずうっと量が、多い気がいたします……<emoji=heart04><emoji=heart04>　魔王様……ウサギの私で、こ、興奮……していただけたのですね？」"

[[dialogue]]
speaker = "クロト"
# 「……最高でした。その、すみません……途中、色々と調子に乗っちゃって……」
line = "「……最高でした。その、すみません……途中、色々と調子に乗っちゃって……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ふふふー……<emoji=heart04>　構いませんよ……はぁあ、はぁあ……<emoji=heart04>　恋人の私だけが聞ける、魔王様のわがままですから……<emoji=heart04>」
line = "「ふふふー……<emoji=heart04>　構いませんよ……はぁあ、はぁあ……<emoji=heart04>　恋人の私だけが聞ける、魔王様のわがままですから……<emoji=heart04>」"

[[dialogue]]
speaker = "トリュファイナ"
# 「魔王様……あの、よろしければ、もう一度……<emoji=heart04>」
line = "「魔王様……あの、よろしければ、もう一度……<emoji=heart04>」"

[[dialogue]]
speaker = "クロト"
# 「ちょ、ちょっと休ませてください……」
line = "「ちょ、ちょっと休ませてください……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ふふ～<emoji=heart04>　お疲れでしたら、魔法でお癒やしいたします……あ、それとも、こちらの方が、よいでしょうか……？」
line = "「ふふ～<emoji=heart04>　お疲れでしたら、魔法でお癒やしいたします……あ、それとも、こちらの方が、よいでしょうか……？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ぴょーん、ぴょん……<emoji=heart04>　えっちなウサギの魔女に、もっと精液、お恵みくださぁい<emoji=heart04>　ぴょんぴょん、ぴょーん……<emoji=heart04><emoji=heart04><emoji=heart04>」
line = "「ぴょーん、ぴょん……<emoji=heart04>　えっちなウサギの魔女に、もっと精液、お恵みくださぁい<emoji=heart04>　ぴょんぴょん、ぴょーん……<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 中出しされた精液をぽたぽた垂らしながら、トリュファイナさんはお尻をふりふり、俺を誘惑するのだった──
line = "中出しされた精液をぽたぽた垂らしながら、トリュファイナさんはお尻をふりふり、俺を誘惑するのだった──"
