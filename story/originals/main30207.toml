line = "「元々問題の無かったパテル、レミカ殿の指導で問題ないレベルまで達しているセシアはともかく、他の者はまだまだ話にならない……」"

[[dialogue]]
speaker = "オオヒメ"
# 「シルヴィ殿には評価してもらったが、私もまだまだ人前で演奏するに足る域に至っていないことは自分が一番よく分かっている……」
line = "「シルヴィ殿には評価してもらったが、私もまだまだ人前で演奏するに足る域に至っていないことは自分が一番よく分かっている……」"

[[dialogue]]
speaker = "オオヒメ"
# 「うぅぅ……また心配になってきてしまった。いっそ全てを忘れて引きこもってしまいたい……」
