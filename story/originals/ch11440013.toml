[[dialogue]]
speaker = "unk"
# 第３話,狛里の恋愛観,P
line = "第３話,狛里の恋愛観,P"

[[dialogue]]
speaker = "unk"
# とある昼休み、俺は大聖堂カフェテリアでヴィーナスと一緒に昼食を取っていた。
line = "とある昼休み、俺は大聖堂カフェテリアでヴィーナスと一緒に昼食を取っていた。"

[[dialogue]]
speaker = "ヴィーナス"
# 「うん！　特盛お子様ランチ、美味しいわね♪」
line = "「うん！　特盛お子様ランチ、美味しいわね♪」"

[[dialogue]]
speaker = "unk"
# ヴィーナスはそのお子様ランチ、好きだよな
line = "ヴィーナスはそのお子様ランチ、好きだよな"

[[dialogue]]
speaker = "ヴィーナス"
# 「えへへっ、だって美味しいんだもの♪」
line = "「えへへっ、だって美味しいんだもの♪」"

[[dialogue]]
speaker = "unk"
# そんな話をしていると――
line = "そんな話をしていると――"

[[dialogue]]
speaker = "狛里"
# 「魔王様～っ♪　ヴィーナスお嬢様～！」
line = "「魔王様～っ♪　ヴィーナスお嬢様～！」"

[[dialogue]]
speaker = "unk"
# 元気な声と共に、狛里が駆け寄ってきた。
line = "元気な声と共に、狛里が駆け寄ってきた。"

[[dialogue]]
speaker = "ヴィーナス"
# 「あら、狛里もお昼？」
line = "「あら、狛里もお昼？」"

[[dialogue]]
speaker = "狛里"
# 「はいなのです！　狛里も一緒に食べてもいいですか？」
line = "「はいなのです！　狛里も一緒に食べてもいいですか？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ええ、もちろんいいわよ！」
line = "「ええ、もちろんいいわよ！」"

[[dialogue]]
speaker = "狛里"
# 「ありがとうなのです！　魔王様、お隣失礼するであります♪」
line = "「ありがとうなのです！　魔王様、お隣失礼するであります♪」"

[[dialogue]]
speaker = "unk"
# 狛里は俺の隣へ座ってくる。
line = "狛里は俺の隣へ座ってくる。"

[[dialogue]]
speaker = "unk"
# 狛里はおにぎりか？
line = "狛里はおにぎりか？"

[[dialogue]]
speaker = "狛里"
# 「はいっ♪　狛里はおにぎり大好きなのです！」
line = "「はいっ♪　狛里はおにぎり大好きなのです！」"

[[dialogue]]
speaker = "unk"
# 手に持っているものだけではなく、運んできたお皿の上にもおにぎりが山積みになっている。
line = "手に持っているものだけではなく、運んできたお皿の上にもおにぎりが山積みになっている。"

[[dialogue]]
speaker = "unk"
# そして――
line = "そして――"

[[dialogue]]
speaker = "狛里"
# 「くんくん♪」
line = "「くんくん♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「あっ、また始まったわね」
line = "「あっ、また始まったわね」"

[[dialogue]]
speaker = "狛里"
# 「えへへへっ♪　やっぱり魔王様はいい匂いがするのです♪」
line = "「えへへへっ♪　やっぱり魔王様はいい匂いがするのです♪」"

[[dialogue]]
speaker = "ヴィーナス"
# 「狛里はあっという間にクロトに懐いたわね！」
line = "「狛里はあっという間にクロトに懐いたわね！」"

[[dialogue]]
speaker = "狛里"
# 「はいっ！」
line = "「はいっ！」"

[[dialogue]]
speaker = "unk"
# 狛里は俺の隣にぴったりとくっ付いたまま即答する。
line = "狛里は俺の隣にぴったりとくっ付いたまま即答する。"

[[dialogue]]
speaker = "狛里"
# 「魔王様は優しいですし、強いですし、いい匂いもするのです♪」
line = "「魔王様は優しいですし、強いですし、いい匂いもするのです♪」"

[[dialogue]]
speaker = "狛里"
# 「だから大好きなのであります♪」
line = "「だから大好きなのであります♪」"

[[dialogue]]
speaker = "unk"
# そ、そっか……
line = "そ、そっか……"

[[dialogue]]
speaker = "unk"
# まあ、狛里の場合、異性としての意味合いはないのだろうが、少し照れてしまう。
line = "まあ、狛里の場合、異性としての意味合いはないのだろうが、少し照れてしまう。"

[[dialogue]]
speaker = "ヴィーナス"
# 「う～～ん。それってつまり――」
line = "「う～～ん。それってつまり――」"

[[dialogue]]
speaker = "ヴィーナス"
# 「狛里はクロトのことを、異性として好きってこと？」
line = "「狛里はクロトのことを、異性として好きってこと？」"

[[dialogue]]
speaker = "unk"
# ちょっ！？　ヴィーナス、何を突然！？
line = "ちょっ！？　ヴィーナス、何を突然！？"

[[dialogue]]
speaker = "ヴィーナス"
# 「なによ、大切なことよ？　曖昧にしていても、嬉しいことは何にもないわ！」
line = "「なによ、大切なことよ？　曖昧にしていても、嬉しいことは何にもないわ！」"

[[dialogue]]
speaker = "狛里"
# 「魔王様を、異性として……？」
line = "「魔王様を、異性として……？」"

[[dialogue]]
speaker = "unk"
# 狛里はきょとんと首を傾げる。
line = "狛里はきょとんと首を傾げる。"

[[dialogue]]
speaker = "ヴィーナス"
# 「うん。女の子として、男の子のクロトが好きなのかって話よ！」
line = "「うん。女の子として、男の子のクロトが好きなのかって話よ！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「安心するだけじゃなくて、ドキドキもするとか。他の『好き』とはちょっと違う、特別な気持ちになるとか──」
line = "「安心するだけじゃなくて、ドキドキもするとか。他の『好き』とはちょっと違う、特別な気持ちになるとか──」"

[[dialogue]]
speaker = "ヴィーナス"
# 「あと、もっとも大事なのは……クロトの赤ちゃんを産みたいって思うかどうかよ！！」
line = "「あと、もっとも大事なのは……クロトの赤ちゃんを産みたいって思うかどうかよ！！」"

[[dialogue]]
speaker = "unk"
# あの！！？　ヴィーナスさんっ！？？
line = "あの！！？　ヴィーナスさんっ！？？"

[[dialogue]]
speaker = "ヴィーナス"
# 「大丈夫よ、安心してクロト……」
line = "「大丈夫よ、安心してクロト……」"

[[dialogue]]
speaker = "ヴィーナス"
# 「九浄家ではメイド隊の子相手に、性教育も行っているわ！　ヘレナちゃんが！！」
line = "「九浄家ではメイド隊の子相手に、性教育も行っているわ！　ヘレナちゃんが！！」"

[[dialogue]]
speaker = "unk"
# いや、確かに大切なことですけれどもっ！！！
line = "いや、確かに大切なことですけれどもっ！！！"

[[dialogue]]
speaker = "狛里"
# 「魔王様の、赤ちゃん……」
line = "「魔王様の、赤ちゃん……」"

[[dialogue]]
speaker = "unk"
# 狛里は少し考え込んだ後。
line = "狛里は少し考え込んだ後。"

[[dialogue]]
speaker = "狛里"
# 「なるほど！　狛里、わかったであります！」
line = "「なるほど！　狛里、わかったであります！」"

[[dialogue]]
speaker = "狛里"
# 「これが『恋』というものだったのですね！」
line = "「これが『恋』というものだったのですね！」"

[[dialogue]]
speaker = "unk"
# えっ！？
line = "えっ！？"

[[dialogue]]
speaker = "unk"
# 狛里は勢いよく立ち上がって、言う。
line = "狛里は勢いよく立ち上がって、言う。"

[[dialogue]]
speaker = "狛里"
# 「魔王様！」
line = "「魔王様！」"

[[dialogue]]
speaker = "狛里"
# 「狛里――魔王様のことが大好きなのです<emoji=heart04>」
line = "「狛里――魔王様のことが大好きなのです<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 一瞬で、カフェテリアが静まり返る。
line = "一瞬で、カフェテリアが静まり返る。"

[[dialogue]]
speaker = "ヴィーナス"
# 「狛里……あなた、なかなかやるわね！」
line = "「狛里……あなた、なかなかやるわね！」"

[[dialogue]]
speaker = "unk"
# ちょ、ちょっと待ってくれ！
line = "ちょ、ちょっと待ってくれ！"

[[dialogue]]
speaker = "狛里"
# 「？」
line = "「？」"

[[dialogue]]
speaker = "unk"
# 狛里は首を傾げて、不思議そうな顔をする。
line = "狛里は首を傾げて、不思議そうな顔をする。"

[[dialogue]]
speaker = "狛里"
# 「好きって、ちゃんと伝えた方がいいのですよね？」
line = "「好きって、ちゃんと伝えた方がいいのですよね？」"

[[dialogue]]
speaker = "unk"
# それはそうなんだけども……！
line = "それはそうなんだけども……！"

[[dialogue]]
speaker = "狛里"
# 「ばうわふ？」
line = "「ばうわふ？」"

[[dialogue]]
speaker = "unk"
# 狛里は本気で何が問題なのかわかっていない様子だった。
line = "狛里は本気で何が問題なのかわかっていない様子だった。"

[[dialogue]]
speaker = "unk"
# 翌朝。
line = "翌朝。"

[[dialogue]]
speaker = "狛里"
# 「――魔王様～！　おはようございますであります～！」
line = "「――魔王様～！　おはようございますであります～！」"

[[dialogue]]
speaker = "unk"
# 狛里は元気よく駆け寄ってくると、俺の腕へ抱き着いてきた。
line = "狛里は元気よく駆け寄ってくると、俺の腕へ抱き着いてきた。"

[[dialogue]]
speaker = "unk"
# な、なんで腕に！？
line = "な、なんで腕に！？"

[[dialogue]]
speaker = "狛里"
# 「好きな男の子には、こうしてスキンシップするものだと聞いたのです♪」
line = "「好きな男の子には、こうしてスキンシップするものだと聞いたのです♪」"

[[dialogue]]
speaker = "狛里"
# 「魔王様も、狛里がたくさんくっついたら、嬉しいのです？」
line = "「魔王様も、狛里がたくさんくっついたら、嬉しいのです？」"

[[dialogue]]
speaker = "unk"
# 匂いを嗅がれる以上に良くないのでは！？
line = "匂いを嗅がれる以上に良くないのでは！？"

[[dialogue]]
speaker = "unk"
# 嬉しくないと言ったら嘘になるけど……
line = "嬉しくないと言ったら嘘になるけど……"

[[dialogue]]
speaker = "狛里"
# 「ばうわふ？」
line = "「ばうわふ？」"

[[dialogue]]
speaker = "unk"
# その後も――
line = "その後も――"

[[dialogue]]
speaker = "狛里"
# 「魔王様～っ♪　大好きなのです～<emoji=heart04>　くんくん♪」
line = "「魔王様～っ♪　大好きなのです～<emoji=heart04>　くんくん♪」"

[[dialogue]]
speaker = "狛里"
# 「狛里のお腹、撫でてくださいなのです～♪　ああっ、服の上からじゃないのです！？　シャツの下まで手を入れて、ちゃんとなでなでしてくださいなのです～！」
line = "「狛里のお腹、撫でてくださいなのです～♪　ああっ、服の上からじゃないのです！？　シャツの下まで手を入れて、ちゃんとなでなでしてくださいなのです～！」"

[[dialogue]]
speaker = "狛里"
# 「えへへ♪　今日は褒めてもらえて嬉しいのですっ。魔王様のお顔、ぺろぺろしちゃうのですぅ<emoji=heart04>」
line = "「えへへ♪　今日は褒めてもらえて嬉しいのですっ。魔王様のお顔、ぺろぺろしちゃうのですぅ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ことあるごとに、俺へ甘えてくるようになってしまった。
line = "ことあるごとに、俺へ甘えてくるようになってしまった。"

[[dialogue]]
speaker = "unk"
# 数日後。
line = "数日後。"

[[dialogue]]
speaker = "蘭美"
# 「学園の風紀が乱れるからやめなさい！！！」
line = "「学園の風紀が乱れるからやめなさい！！！」"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ！？」
line = "「ばうわふっ！？」"

[[dialogue]]
speaker = "蘭美"
# 「だいたいね、いくらあなたの魔族の本能が強いからって、ヒトの恋人はそんな付き合い方はしないのよ！！」
line = "「だいたいね、いくらあなたの魔族の本能が強いからって、ヒトの恋人はそんな付き合い方はしないのよ！！」"

[[dialogue]]
speaker = "蘭美"
# 「人目をはばからず抱きついたり、相手の顔や手を舐めたり、仰向けに寝っ転がってお腹を見せて服従のポーズは取らないの！」
line = "「人目をはばからず抱きついたり、相手の顔や手を舐めたり、仰向けに寝っ転がってお腹を見せて服従のポーズは取らないの！」"

[[dialogue]]
speaker = "蘭美"
# 「それじゃあもうヒトじゃなくて、動物なんだから！　せめて付き合ってから、２人きりの部屋の中でやりなさい！！」
line = "「それじゃあもうヒトじゃなくて、動物なんだから！　せめて付き合ってから、２人きりの部屋の中でやりなさい！！」"

[[dialogue]]
speaker = "狛里"
# 「わかっているのです、蘭美メイド長！　だから狛里は、魔王様のツガイになりたいわけじゃないのです♪」
line = "「わかっているのです、蘭美メイド長！　だから狛里は、魔王様のツガイになりたいわけじゃないのです♪」"

[[dialogue]]
speaker = "狛里"
# 「狛里はただ、大好きな魔王様の『ペット』になりたいだけなのであります！！」
line = "「狛里はただ、大好きな魔王様の『ペット』になりたいだけなのであります！！」"

[[dialogue]]
speaker = "蘭美"
# 「うん、うん……うん！？」
line = "「うん、うん……うん！？」"

[[dialogue]]
speaker = "unk"
# どういうこと！？
line = "どういうこと！？"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ♪」
line = "「ばうわふっ♪」"

[[dialogue]]
speaker = "unk"
# またしても斜め上の方向に話が飛躍しつつも、狛里はひとり、笑顔で尻尾をぶんぶんと振るのであった。
line = "またしても斜め上の方向に話が飛躍しつつも、狛里はひとり、笑顔で尻尾をぶんぶんと振るのであった。"
