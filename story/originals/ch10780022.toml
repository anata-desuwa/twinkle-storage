[[dialogue]]
speaker = "unk"
# 第２話,購買部のバニー魔女,P
line = "第２話,購買部のバニー魔女,P"

[[dialogue]]
speaker = "unk"
# 『支配』のロストアイテム・シエスタの誘拐騒動が解決して、数日が経った。
line = "『支配』のロストアイテム・シエスタの誘拐騒動が解決して、数日が経った。"

[[dialogue]]
speaker = "unk"
# 俺はその日、恋人のトリュファイナさんに呼ばれて、購買部まで顔を出したのだが──
line = "俺はその日、恋人のトリュファイナさんに呼ばれて、購買部まで顔を出したのだが──"

[[dialogue]]
speaker = "トリュファイナ"
# 「お買い上げありがとうございます♪　ぴょん、ぴょんっ♪」
line = "「お買い上げありがとうございます♪　ぴょん、ぴょんっ♪」"

[[dialogue]]
speaker = "シュティレ"
# 「こちら、おつりと──看板娘のぴょんぴょんスマイルになります。ご査収ください。ぴょーん、ぴょん」
line = "「こちら、おつりと──看板娘のぴょんぴょんスマイルになります。ご査収ください。ぴょーん、ぴょん」"

[[dialogue]]
speaker = "unk"
# ──何事！？！？
line = "──何事！？！？"

[[dialogue]]
speaker = "トリュファイナ"
# 「あっ！　魔王様、いらっしゃいませ！　ぴょん、ぴょん♪」
line = "「あっ！　魔王様、いらっしゃいませ！　ぴょん、ぴょん♪」"

[[dialogue]]
speaker = "トリュファイナ"
# 「いかがでしょう、この衣装♪　先日の騒動の際は、あまりゆっくりお見せできなかったので……」
line = "「いかがでしょう、この衣装♪　先日の騒動の際は、あまりゆっくりお見せできなかったので……」"

[[dialogue]]
speaker = "unk"
# とっても可愛いです！
line = "とっても可愛いです！"

[[dialogue]]
speaker = "トリュファイナ"
# 「ありがとうございます、魔王様♪　あぁ、よかったです。普段の私とは雰囲気が違いますので、どう思われているのか不安で……」
line = "「ありがとうございます、魔王様♪　あぁ、よかったです。普段の私とは雰囲気が違いますので、どう思われているのか不安で……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「でも、気に入っていただけたのでしたら、こんなに嬉しいことはございません！　ぴょんぴょん、ぴょーんっ♪」
line = "「でも、気に入っていただけたのでしたら、こんなに嬉しいことはございません！　ぴょんぴょん、ぴょーんっ♪」"

[[dialogue]]
speaker = "unk"
# その恰好で店番を？
line = "その恰好で店番を？"

[[dialogue]]
speaker = "unk"
# よく似合ってますけれど……
line = "よく似合ってますけれど……"

[[dialogue]]
speaker = "シュティレ"
# 「マスターからのアイデアです。せっかく目を惹く衣装を手に入れたのだから、それで存分に客引きを、と」
line = "「マスターからのアイデアです。せっかく目を惹く衣装を手に入れたのだから、それで存分に客引きを、と」"

[[dialogue]]
speaker = "トリュファイナ"
# 「はい。どうやら人間界の皆様は、バニーがお好きなご様子で……」
line = "「はい。どうやら人間界の皆様は、バニーがお好きなご様子で……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「この衣装で接客をすると、いつも大繁盛なのです。ふふふっ<emoji=heart04>」
line = "「この衣装で接客をすると、いつも大繁盛なのです。ふふふっ<emoji=heart04>」"

[[dialogue]]
speaker = "トリュファイナ"
# 「魔王様。お買い得品がたくさんございますので、何か買っていってくださいませ！　ぴょーん、ぴょんっ♪」
line = "「魔王様。お買い得品がたくさんございますので、何か買っていってくださいませ！　ぴょーん、ぴょんっ♪」"

[[dialogue]]
speaker = "unk"
# ……今、いくら持ってたかな？
line = "……今、いくら持ってたかな？"

[[dialogue]]
speaker = "シュティレ"
# 「ふふ。マスターの目論見通りです。店員がバニーガールになることで、購買部の売上は過去最高を記録しております」
line = "「ふふ。マスターの目論見通りです。店員がバニーガールになることで、購買部の売上は過去最高を記録しております」"

[[dialogue]]
speaker = "シュティレ"
# 「この調子でがっぽり稼がせていただきましょう。錬金術の研究のためには、資金はいくらあっても困りませんので」
line = "「この調子でがっぽり稼がせていただきましょう。錬金術の研究のためには、資金はいくらあっても困りませんので」"

[[dialogue]]
speaker = "unk"
# もしネビュラの魔女たちにバレたら……
line = "もしネビュラの魔女たちにバレたら……"

[[dialogue]]
speaker = "unk"
# だけど心配にもなるな……
line = "だけど心配にもなるな……"

[[dialogue]]
speaker = "ウェンディ"
# 「あっ、会長さん。こんにちは！」
line = "「あっ、会長さん。こんにちは！」"

[[dialogue]]
speaker = "unk"
# げえっ！　ウェンディ！？！？
line = "げえっ！　ウェンディ！？！？"

[[dialogue]]
speaker = "シュティレ"
# 「む。噂をすれば、というやつですね」
line = "「む。噂をすれば、というやつですね」"

[[dialogue]]
speaker = "ウェンディ"
# 「星徒会室に顔を出そうかと思っていたのですが、こんなところで会えるだなんて……」
line = "「星徒会室に顔を出そうかと思っていたのですが、こんなところで会えるだなんて……」"

[[dialogue]]
speaker = "ウェンディ"
# 「もしよかったら、今後のことで少しお話できませんか？　飲み物くらいはごちそうしますので！　いつものコーヒーでいいですよね？」
line = "「もしよかったら、今後のことで少しお話できませんか？　飲み物くらいはごちそうしますので！　いつものコーヒーでいいですよね？」"

[[dialogue]]
speaker = "unk"
# あ、ちょ──ちょっと待って！？
line = "あ、ちょ──ちょっと待って！？"

[[dialogue]]
speaker = "ウェンディ"
# 「すみません、これください──」
line = "「すみません、これください──」"

[[dialogue]]
speaker = "トリュファイナ"
# 「まあ。ウェンディ様、ご無沙汰しております♪　ぴょん、ぴょんっ♪」
line = "「まあ。ウェンディ様、ご無沙汰しております♪　ぴょん、ぴょんっ♪」"

[[dialogue]]
speaker = "ウェンディ"
# 「……？　…………？？？？」
line = "「……？　…………？？？？」"

[[dialogue]]
speaker = "シュティレ"
# 「おお。ごしごしと目をこすっております」
line = "「おお。ごしごしと目をこすっております」"

[[dialogue]]
speaker = "トリュファイナ"
# 「コーヒーをお２つですね。お買い上げありがとうございます♪　ぴょんぴょん♪　ぴょーんっ♪」
line = "「コーヒーをお２つですね。お買い上げありがとうございます♪　ぴょんぴょん♪　ぴょーんっ♪」"

[[dialogue]]
speaker = "ウェンディ"
# 「はェエ──────！？！？！？」
line = "「はェエ──────！？！？！？」"

[[dialogue]]
speaker = "ウェンディ"
# 「バニー！？　バニーなんで！？！？　なんでやねーん！？！？！？」
line = "「バニー！？　バニーなんで！？！？　なんでやねーん！？！？！？」"

[[dialogue]]
speaker = "シュティレ"
# 「流石はツッコミの輪の一員。キレが違いますね」
line = "「流石はツッコミの輪の一員。キレが違いますね」"

[[dialogue]]
speaker = "トリュファイナ"
# 「私、今はこの格好で接客をしているのです。いかがでしょう。ウサギらしく振舞えているでしょうか♪　ぴょんぴょんっ♪」
line = "「私、今はこの格好で接客をしているのです。いかがでしょう。ウサギらしく振舞えているでしょうか♪　ぴょんぴょんっ♪」"

[[dialogue]]
speaker = "ウェンディ"
# 「会長さん！！　あなた、いくらトリュファイナ様が何でも素直に信じるからって！　光の魔女を何だと思ってるんですかっ！？！？」
line = "「会長さん！！　あなた、いくらトリュファイナ様が何でも素直に信じるからって！　光の魔女を何だと思ってるんですかっ！？！？」"

[[dialogue]]
speaker = "unk"
# 濡れ衣だ──！？
line = "濡れ衣だ──！？"

[[dialogue]]
speaker = "ウェンディ"
# 「新星学園に来たらいつもこう！！　絶対１つは長官に報告できないことが見つかるんです！！　もうヤダぁ！！！！」
line = "「新星学園に来たらいつもこう！！　絶対１つは長官に報告できないことが見つかるんです！！　もうヤダぁ！！！！」"

[[dialogue]]
speaker = "シュティレ"
# 「大変ですね、魔女様も。どうぞ、コーヒーでも飲んでリラックスしてください」
line = "「大変ですね、魔女様も。どうぞ、コーヒーでも飲んでリラックスしてください」"

[[dialogue]]
speaker = "ウェンディ"
# 「それ、私が買ったやつじゃないですか～～～っ！？！？」
line = "「それ、私が買ったやつじゃないですか～～～っ！？！？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「あ、あれれ……？　どうしてこんなにも取り乱して……私、ウサギの真似、何か間違っていたでしょうか……？」
line = "「あ、あれれ……？　どうしてこんなにも取り乱して……私、ウサギの真似、何か間違っていたでしょうか……？」"

[[dialogue]]
speaker = "unk"
# トリュファイナさんの可愛い接客姿を見れたのはよかったのだけれど……
line = "トリュファイナさんの可愛い接客姿を見れたのはよかったのだけれど……"

[[dialogue]]
speaker = "unk"
# 再びウェンディに、セドナさんには伝えられない秘密を抱えさせてしまうのだった──
line = "再びウェンディに、セドナさんには伝えられない秘密を抱えさせてしまうのだった──"
