line = "「お゛っ――んおおおぉ～～～んっ<emoji=heart04><emoji=heart04><emoji=heart04>　おち○ぽ様からまおーさまの子種、いっぱい出てますぅ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "狛里"
# 「あっ<emoji=heart04><emoji=heart04>　ふわあああぁ～～っ<emoji=heart04><emoji=heart04>　子宮にどぴゅどぴゅ熱いの注がれてぇ<emoji=heart04><emoji=heart04>　きもちぃくてしあわせですぅ～っ<emoji=heart04><emoji=heart04>」
line = "「あっ<emoji=heart04><emoji=heart04>　ふわあああぁ～～っ<emoji=heart04><emoji=heart04>　子宮にどぴゅどぴゅ熱いの注がれてぇ<emoji=heart04><emoji=heart04>　きもちぃくてしあわせですぅ～っ<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "狛里"
# 「はああぁっ<emoji=heart04><emoji=heart04>　わふぅん……<emoji=heart04>　すごい……<emoji=heart04>　魔王様のお射精、まだ中で続いてますぅ～……<emoji=heart04>」
line = "「はああぁっ<emoji=heart04><emoji=heart04>　わふぅん……<emoji=heart04>　すごい……<emoji=heart04>　魔王様のお射精、まだ中で続いてますぅ～……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# やがて、長く続いた射精も終わり――
line = "やがて、長く続いた射精も終わり――"

[[dialogue]]
speaker = "狛里"
# 「んっ……くぅ～ん<emoji=heart04>　はあぁ……ふうぅ……<emoji=heart04>」
line = "「んっ……くぅ～ん<emoji=heart04>　はあぁ……ふうぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# お互いの体から力が抜け、膣からペニスが抜けると、愛液と精液が混じり合った白濁となって溢れ出た。
line = "お互いの体から力が抜け、膣からペニスが抜けると、愛液と精液が混じり合った白濁となって溢れ出た。"

[[dialogue]]
speaker = "狛里"
# 「魔王様との交尾……すっごく気持ち良かったのですぅ<emoji=heart04>　んふうぅ……<emoji=heart04>」
line = "「魔王様との交尾……すっごく気持ち良かったのですぅ<emoji=heart04>　んふうぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "クロト"
# 「……狛里、少し落ち着いた？」
line = "「……狛里、少し落ち着いた？」"

[[dialogue]]
speaker = "狛里"
# 「はい……<emoji=heart04>」
line = "「はい……<emoji=heart04>」"

[[dialogue]]
speaker = "狛里"
# 「狛里……魔王様を上手く発情させることができたでしょうか？<emoji=heart04>」
line = "「狛里……魔王様を上手く発情させることができたでしょうか？<emoji=heart04>」"

[[dialogue]]
speaker = "クロト"
# 「ああ。俺もすごく気持ち良かったよ」
line = "「ああ。俺もすごく気持ち良かったよ」"

[[dialogue]]
speaker = "狛里"
# 「えへへっ……よかったのです<emoji=heart04>」
line = "「えへへっ……よかったのです<emoji=heart04>」"

[[dialogue]]
speaker = "狛里"
# 「んっ……わふうぅ～っ<emoji=heart04>　それにしても……くんくん<emoji=heart04>」
line = "「んっ……わふうぅ～っ<emoji=heart04>　それにしても……くんくん<emoji=heart04>」"

[[dialogue]]
speaker = "狛里"
# 「おち○ぽ様、狛里のお汁と子種ですごいエッチな匂いがするのですぅ<emoji=heart04>　はあぁっっ……<emoji=heart04><emoji=heart04>」
line = "「おち○ぽ様、狛里のお汁と子種ですごいエッチな匂いがするのですぅ<emoji=heart04>　はあぁっっ……<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "狛里"
# 「嗅いでたら、狛里のおま○こ、またウズウズしてきて……<emoji=heart04>　くぅ～ん<emoji=heart04><emoji=heart04>」
line = "「嗅いでたら、狛里のおま○こ、またウズウズしてきて……<emoji=heart04>　くぅ～ん<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "クロト"
# 「も、もしかしてまた……？」
line = "「も、もしかしてまた……？」"

[[dialogue]]
speaker = "狛里"
# 「はい、魔王様ぁ<emoji=heart04>　狛里、もっともっと交尾したいであります<emoji=heart04><emoji=heart04>」
line = "「はい、魔王様ぁ<emoji=heart04>　狛里、もっともっと交尾したいであります<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "クロト"
# 「なら、せめて場所を移して――」
line = "「なら、せめて場所を移して――」"

[[dialogue]]
speaker = "狛里"
# 「わふぅ～んっ<emoji=heart04><emoji=heart04>　魔王様、我慢できないのですぅ～っ<emoji=heart04>　ぺろぺろっ<emoji=heart04>　れろれろぉ～っ<emoji=heart04>」
line = "「わふぅ～んっ<emoji=heart04><emoji=heart04>　魔王様、我慢できないのですぅ～っ<emoji=heart04>　ぺろぺろっ<emoji=heart04>　れろれろぉ～っ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 堪らなそうに、狛里は俺の顔を舐めてくる。
line = "堪らなそうに、狛里は俺の顔を舐めてくる。"

[[dialogue]]
speaker = "クロト"
# 「待て待て！　このまま続けてると、本当に誰か星徒会室に来ちゃうかもしれないから！」
line = "「待て待て！　このまま続けてると、本当に誰か星徒会室に来ちゃうかもしれないから！」"

[[dialogue]]
speaker = "狛里"
# 「魔王様ぁ～<emoji=heart04><emoji=heart04>　ばうわ～～ふぅ<emoji=heart04><emoji=heart04>」
line = "「魔王様ぁ～<emoji=heart04><emoji=heart04>　ばうわ～～ふぅ<emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 結局その後、俺はもう１度狛里に襲われて、その場で精を搾り取られてしまうのであった――
line = "結局その後、俺はもう１度狛里に襲われて、その場で精を搾り取られてしまうのであった――"
