[[dialogue]]
speaker = "unk"
# トラブルの報せを受け、俺はリゾート結界に急行した。そこにいたのは……
line = "トラブルの報せを受け、俺はリゾート結界に急行した。そこにいたのは……"

[[dialogue]]
speaker = "チキン？"
# 「チキチキチー！」
line = "「チキチキチー！」"

[[dialogue]]
speaker = "unk"
# 大量のフライドチキンモンスター（？）と──
line = "大量のフライドチキンモンスター（？）と──"

[[dialogue]]
speaker = "シルヴィ"
# 「チキン食べ放題だー！」
line = "「チキン食べ放題だー！」"

[[dialogue]]
speaker = "コハルコ"
# 「もうなんなのこれー！？」
line = "「もうなんなのこれー！？」"

[[dialogue]]
speaker = "unk"
# 水着姿の先輩たちだった。
line = "水着姿の先輩たちだった。"

[[dialogue]]
speaker = "unk"
# 状況がよく分からないが、チキンから確かにモンスターの気配を感じる。
line = "状況がよく分からないが、チキンから確かにモンスターの気配を感じる。"

[[dialogue]]
speaker = "unk"
# ──ならやることはひとつ！
line = "──ならやることはひとつ！"

[[dialogue]]
speaker = "unk"
# サタニックグレイス！
line = "サタニックグレイス！"

[[dialogue]]
speaker = "シルヴィ"
# 「あ、会長くん！」
line = "「あ、会長くん！」"

[[dialogue]]
speaker = "シルヴィ"
# 「大変大変！　リゾート結界に来た途端、フライドチキン食べ放題が始まっちゃってさ！」
line = "「大変大変！　リゾート結界に来た途端、フライドチキン食べ放題が始まっちゃってさ！」"

[[dialogue]]
speaker = "コハルコ"
# 「シルヴィ、説明になってないから！」
line = "「シルヴィ、説明になってないから！」"

[[dialogue]]
speaker = "コハルコ"
# 「泳ぐれん……こほん、水着戦闘服の試運転で来てたんだけど、フライドチキンのモンスターに囲まれちゃって戦闘になったの」
line = "「泳ぐれん……こほん、水着戦闘服の試運転で来てたんだけど、フライドチキンのモンスターに囲まれちゃって戦闘になったの」"

[[dialogue]]
speaker = "コハルコ"
# 「しかもこのチキンモンスター、倒すと普通のフライドチキンになるみたい。自分でも何言ってるか分からないけど……」
line = "「しかもこのチキンモンスター、倒すと普通のフライドチキンになるみたい。自分でも何言ってるか分からないけど……」"

[[dialogue]]
speaker = "シルヴィ"
# 「購買のチキンと同じ味だったよ！　美味しかったです！」
line = "「購買のチキンと同じ味だったよ！　美味しかったです！」"

[[dialogue]]
speaker = "unk"
# うん、まったく分からない。
line = "うん、まったく分からない。"

[[dialogue]]
speaker = "コハルコ"
# 「とにかく敵を無力化しよう。２人は前衛へ、私は後ろからサポート！　オペレート開始します！」
line = "「とにかく敵を無力化しよう。２人は前衛へ、私は後ろからサポート！　オペレート開始します！」"

[[dialogue]]
speaker = "コハルコ"
# 「会長さんは正面から敵を引き付けてください。シルヴィはその間に側面から……いや、水中から攻撃して！」
line = "「会長さんは正面から敵を引き付けてください。シルヴィはその間に側面から……いや、水中から攻撃して！」"

[[dialogue]]
speaker = "シルヴィ"
# 「水中から？　なるほど、水着戦闘服ならではの戦い方だね！」
line = "「水中から？　なるほど、水着戦闘服ならではの戦い方だね！」"

[[dialogue]]
speaker = "シルヴィ"
# 「じゃあドボン！」
line = "「じゃあドボン！」"

[[dialogue]]
speaker = "unk"
# 作戦通り、俺は真っ向から仕掛ける。
line = "作戦通り、俺は真っ向から仕掛ける。"

[[dialogue]]
speaker = "unk"
# ディマイズブレイカー！
line = "ディマイズブレイカー！"

[[dialogue]]
speaker = "モンスター"
# 「チキチー！！」
line = "「チキチー！！」"

[[dialogue]]
speaker = "unk"
# チキンモンスターがアツアツの油で反撃してくる。咄嗟に回避するが、香ばしい匂いが鼻をかすめた。
line = "チキンモンスターがアツアツの油で反撃してくる。咄嗟に回避するが、香ばしい匂いが鼻をかすめた。"

[[dialogue]]
speaker = "モンスター"
# 「チキチッチー！」
line = "「チキチッチー！」"

[[dialogue]]
speaker = "unk"
# 作戦通り、モンスターは俺に狙いを定めたようだ。
line = "作戦通り、モンスターは俺に狙いを定めたようだ。"

[[dialogue]]
speaker = "シルヴィ"
# 「うおありゃあぁっ！　ストームスピアフィッシャーっ！！」
line = "「うおありゃあぁっ！　ストームスピアフィッシャーっ！！」"

[[dialogue]]
speaker = "unk"
# チキンの群れの真下から、竜巻をまとった銛が飛び出し、敵を一掃。その数だけチキンが降ってくる。
line = "チキンの群れの真下から、竜巻をまとった銛が飛び出し、敵を一掃。その数だけチキンが降ってくる。"

[[dialogue]]
speaker = "シルヴィ"
# 「獲ったどー！」
line = "「獲ったどー！」"

[[dialogue]]
speaker = "コハルコ"
# 「すごい！　銛をたくさん出して、落ちてくるフライドチキンを全部くし刺しにしちゃった……。シルヴィにこんな器用なこと出来たんだね」
line = "「すごい！　銛をたくさん出して、落ちてくるフライドチキンを全部くし刺しにしちゃった……。シルヴィにこんな器用なこと出来たんだね」"

[[dialogue]]
speaker = "シルヴィ"
# 「ふふっ、チキンのためなら不可能はないよ！」
line = "「ふふっ、チキンのためなら不可能はないよ！」"

[[dialogue]]
speaker = "コハルコ"
# 「その器用さを普段から発揮してほしかったなー。まぁ、これでとりあえずは収まったかな。会長さんも怪我はない？」
line = "「その器用さを普段から発揮してほしかったなー。まぁ、これでとりあえずは収まったかな。会長さんも怪我はない？」"

[[dialogue]]
speaker = "unk"
# 周囲を見渡しながら頷く。まだ現実に理解が追い付いていないけど。
line = "周囲を見渡しながら頷く。まだ現実に理解が追い付いていないけど。"

[[dialogue]]
speaker = "コハルコ"
# 「ならよかった。いったい、あれはなんだったんだろう……シルヴィはどう思う？」
line = "「ならよかった。いったい、あれはなんだったんだろう……シルヴィはどう思う？」"

[[dialogue]]
speaker = "シルヴィ"
# 「もぐもぐもぐもぐもぐ……え、美味しいよ？」
line = "「もぐもぐもぐもぐもぐ……え、美味しいよ？」"

[[dialogue]]
speaker = "コハルコ"
# 「また食べてる！？　この状況で、よく食べる気になれるね……」
line = "「また食べてる！？　この状況で、よく食べる気になれるね……」"

[[dialogue]]
speaker = "シルヴィ"
# 「フライドチキンはいつどこで食べても美味しいからね！　……あ、誰か来る」
line = "「フライドチキンはいつどこで食べても美味しいからね！　……あ、誰か来る」"

[[dialogue]]
speaker = "アニマ"
# 「やあ、諸君。迷惑をかけてしまったようダナ。特に会長は呼び出しに応じてくれて感謝ダ」
line = "「やあ、諸君。迷惑をかけてしまったようダナ。特に会長は呼び出しに応じてくれて感謝ダ」"

[[dialogue]]
speaker = "unk"
# リゾート結界に俺を呼んだのはアニマ先輩だった。トラブルとは、やはりチキンのことだろう。
line = "リゾート結界に俺を呼んだのはアニマ先輩だった。トラブルとは、やはりチキンのことだろう。"

[[dialogue]]
speaker = "シルヴィ"
# 「アニマっちだ。やっほー」
line = "「アニマっちだ。やっほー」"

[[dialogue]]
speaker = "コハルコ"
# 「さっき、フライドチキンのモンスターと戦ったんだけど、アニマさんは何か知ってる？」
line = "「さっき、フライドチキンのモンスターと戦ったんだけど、アニマさんは何か知ってる？」"

[[dialogue]]
speaker = "アニマ"
# 「ウム。アニマが来たのも、まさしくそれに関することダ。では話そう。チキンの真実を──」
line = "「ウム。アニマが来たのも、まさしくそれに関することダ。では話そう。チキンの真実を──」"

[[dialogue]]
speaker = "アニマ"
# 「そもそも、この事態はフライドチキンの需要拡大に端を発するのダ」
line = "「そもそも、この事態はフライドチキンの需要拡大に端を発するのダ」"

[[dialogue]]
speaker = "シルヴィ"
# 「フライドチキンとピリ辛チキンと旨塩チキンください！」
line = "「フライドチキンとピリ辛チキンと旨塩チキンください！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「はーい、ただいま！」
line = "「はーい、ただいま！」"

[[dialogue]]
speaker = "シノ"
# 「すみません。栄養マシマシチキン、ひとついただけますか？」
line = "「すみません。栄養マシマシチキン、ひとついただけますか？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「はい、ありがとうございます！」
line = "「はい、ありがとうございます！」"

[[dialogue]]
speaker = "ベアトリス"
# 「黒ごまガーリックチキンお願いします！」
line = "「黒ごまガーリックチキンお願いします！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「かしこまりました」
line = "「かしこまりました」"

[[dialogue]]
speaker = "レイラ"
# 「フライドチキンとブラックペッパーチキンと竜田揚げ、１ダースずつください」
line = "「フライドチキンとブラックペッパーチキンと竜田揚げ、１ダースずつください」"

[[dialogue]]
speaker = "トリュファイナ"
# 「はい、フライドチキンとブラックペッパーと、竜田揚げ、お１つずつ……えぇ！？　１ダースずつですか！？」
line = "「はい、フライドチキンとブラックペッパーと、竜田揚げ、お１つずつ……えぇ！？　１ダースずつですか！？」"

[[dialogue]]
speaker = "アニマ"
# 「このように、チキン系の商品は日に日に需要が高まっていてナ。トリュファイナも手伝ってくれているが、手が回っていないのダ」
line = "「このように、チキン系の商品は日に日に需要が高まっていてナ。トリュファイナも手伝ってくれているが、手が回っていないのダ」"

[[dialogue]]
speaker = "コハルコ"
# 「レイラは出禁にしてくれていいよ」
line = "「レイラは出禁にしてくれていいよ」"

[[dialogue]]
speaker = "アニマ"
# 「そこで、アニマはフライドチキンマシンを開発しタ。星力や魔力で稼動し、今までのフライヤーより高速でチキンを揚げられる優れものダ」
line = "「そこで、アニマはフライドチキンマシンを開発しタ。星力や魔力で稼動し、今までのフライヤーより高速でチキンを揚げられる優れものダ」"

[[dialogue]]
speaker = "シルヴィ"
# 「さすが天才アニマっち！　でも、なんとなく流れが分かったよ！」
line = "「さすが天才アニマっち！　でも、なんとなく流れが分かったよ！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「これがフライドチキンマシンなのですね、アニマ様」
line = "「これがフライドチキンマシンなのですね、アニマ様」"

[[dialogue]]
speaker = "アニマ"
# 「ウム。今まですまなかったナ。これで少しは楽になるはずダ」
line = "「ウム。今まですまなかったナ。これで少しは楽になるはずダ」"

[[dialogue]]
speaker = "トリュファイナ"
# 「いえ、謝らないでください。私もこのお店が好きでお手伝いしているのですから。でも、お客様をお待たせしなくて済むのはいいことです」
line = "「いえ、謝らないでください。私もこのお店が好きでお手伝いしているのですから。でも、お客様をお待たせしなくて済むのはいいことです」"

[[dialogue]]
speaker = "トリュファイナ"
# 「では、チキンの種をセットして、魔力を込めて……スイッチオン！」
line = "「では、チキンの種をセットして、魔力を込めて……スイッチオン！」"

[[dialogue]]
speaker = "モンスター"
# 「チキチキー！！」
line = "「チキチキー！！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「出てきたチキンがモンスターに！？」
line = "「出てきたチキンがモンスターに！？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ディアイルミナーレ！」
line = "「ディアイルミナーレ！」"

[[dialogue]]
speaker = "モンスター"
# 「チキチキチー！！」
line = "「チキチキチー！！」"

[[dialogue]]
speaker = "アニマ"
# 「くっ、モンスターを壁にしてマシンが逃げてしまっタ。追うゾ、トリュファイナ」
line = "「くっ、モンスターを壁にしてマシンが逃げてしまっタ。追うゾ、トリュファイナ」"

[[dialogue]]
speaker = "トリュファイナ"
# 「はい！」
line = "「はい！」"

[[dialogue]]
speaker = "アニマ"
# 「セットしたチキンの数には限りがアル。このまま追い続ければいつかは捕まえられるハズ…………ム、しまっタ」
line = "「セットしたチキンの数には限りがアル。このまま追い続ければいつかは捕まえられるハズ…………ム、しまっタ」"

[[dialogue]]
speaker = "アニマ"
# 「無尽蔵にチキンを補給できる場所がこの学園にはアル」
line = "「無尽蔵にチキンを補給できる場所がこの学園にはアル」"

[[dialogue]]
speaker = "トリュファイナ"
# 「アニマ様、それは……」
line = "「アニマ様、それは……」"

[[dialogue]]
speaker = "アニマ"
# 「リゾート結界ダ！」
line = "「リゾート結界ダ！」"

[[dialogue]]
speaker = "アニマ"
# 「というワケで、フライドチキンマシンはリゾート結界に侵入してしまっタ」
line = "「というワケで、フライドチキンマシンはリゾート結界に侵入してしまっタ」"

[[dialogue]]
speaker = "アニマ"
# 「みんなも知ってイルとは思うガ、リゾートの結界のリソースは、夏を楽しむ心から生まれる夏パワー。結界で提供される料理も夏パワーによって生み出されている」
line = "「みんなも知ってイルとは思うガ、リゾートの結界のリソースは、夏を楽しむ心から生まれる夏パワー。結界で提供される料理も夏パワーによって生み出されている」"

[[dialogue]]
speaker = "アニマ"
# 「マシンは原料となるチキンと、動力となるエネルギーの両方をリゾート結界から得ているようダ。このままでは、リゾート結界にチキンモンスターが溢れてしまウ」
line = "「マシンは原料となるチキンと、動力となるエネルギーの両方をリゾート結界から得ているようダ。このままでは、リゾート結界にチキンモンスターが溢れてしまウ」"

[[dialogue]]
speaker = "アニマ"
# 「そして夏パワーが尽きれば、結界は消え、チキンモンスターは外に解き放たれるだろウ」
line = "「そして夏パワーが尽きれば、結界は消え、チキンモンスターは外に解き放たれるだろウ」"

[[dialogue]]
speaker = "コハルコ"
# 「その前に、マシンを発見して破壊しないとね」
line = "「その前に、マシンを発見して破壊しないとね」"

[[dialogue]]
speaker = "シルヴィ"
# 「よし、あたしたちに任せて！　水着戦闘服の出番だよ！」
line = "「よし、あたしたちに任せて！　水着戦闘服の出番だよ！」"

[[dialogue]]
speaker = "unk"
# こうして、俺と先輩たちでフライドチキンマシンを捜索することになった。
line = "こうして、俺と先輩たちでフライドチキンマシンを捜索することになった。"
