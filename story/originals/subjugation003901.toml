[[dialogue]]
speaker = "unk"
# ある日の放課後。
line = "ある日の放課後。"

[[dialogue]]
speaker = "unk"
# 俺が星徒会室で書類仕事を片付けていると――
line = "俺が星徒会室で書類仕事を片付けていると――"

[[dialogue]]
speaker = "ヘレナ"
# 「失礼するぞ、魔王よ」
line = "「失礼するぞ、魔王よ」"

[[dialogue]]
speaker = "ヨミ"
# 「会長、お疲れ様です」
line = "「会長、お疲れ様です」"

[[dialogue]]
speaker = "unk"
# ２人共、今日はどうしたんですか？
line = "２人共、今日はどうしたんですか？"

[[dialogue]]
speaker = "unk"
# ヘレナちゃんにヨミヨミ
line = "ヘレナちゃんにヨミヨミ"

[[dialogue]]
speaker = "ヨミ"
# 「か、会長っ！　ヨミヨミ呼びは恥ずかしいですからぁ！」
line = "「か、会長っ！　ヨミヨミ呼びは恥ずかしいですからぁ！」"

[[dialogue]]
speaker = "ヘレナ"
# 「実はな。ヨミヨミの新しい人工戦闘服が完成したのだ」
line = "「実はな。ヨミヨミの新しい人工戦闘服が完成したのだ」"

[[dialogue]]
speaker = "ヨミ"
# 「ご当主様まで！　いつも言っているのに、もうっ……！」
line = "「ご当主様まで！　いつも言っているのに、もうっ……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふふっ。よいではないか。呼び捨てよりも、愛称の方が親しみも込めやすいというものだ」
line = "「ふふっ。よいではないか。呼び捨てよりも、愛称の方が親しみも込めやすいというものだ」"

[[dialogue]]
speaker = "ヨミ"
# 「そ、それはそうかもしれないですけどぉ～」
line = "「そ、それはそうかもしれないですけどぉ～」"

[[dialogue]]
speaker = "unk"
# それで、新しい戦闘服っていうのは？
line = "それで、新しい戦闘服っていうのは？"

[[dialogue]]
speaker = "ヘレナ"
# 「ふっふっふっ♪　アニマ、アナ、そしてトレジアンナに依頼して作らせた、最新式だぞ」
line = "「ふっふっふっ♪　アニマ、アナ、そしてトレジアンナに依頼して作らせた、最新式だぞ」"

[[dialogue]]
speaker = "ヘレナ"
# 「ヨミヨミ、見せてやるがよい」
line = "「ヨミヨミ、見せてやるがよい」"

[[dialogue]]
speaker = "ヨミ"
# 「はい。それでは――」
line = "「はい。それでは――」"

[[dialogue]]
speaker = "ヨミ"
# 「――これが、ご当主様に新しく作って頂いた『エクスノヴァフォーム』です！」
line = "「――これが、ご当主様に新しく作って頂いた『エクスノヴァフォーム』です！」"

[[dialogue]]
speaker = "ヘレナ"
# 「ネーゼマイン用に製作したものから更にアップデートした、ヨミ専用の『人工覚醒戦闘服』だ！」
line = "「ネーゼマイン用に製作したものから更にアップデートした、ヨミ専用の『人工覚醒戦闘服』だ！」"

[[dialogue]]
speaker = "ヘレナ"
# 「ヨミヨミは、初の人工戦闘服である『クリスマスフォーム』の運用において、多くの貴重なデータを与えてくれたからな」
line = "「ヨミヨミは、初の人工戦闘服である『クリスマスフォーム』の運用において、多くの貴重なデータを与えてくれたからな」"

[[dialogue]]
speaker = "ヘレナ"
# 「その実績を評価し、今回も引き続きデータ収集を頼むことにしたのだ」
line = "「その実績を評価し、今回も引き続きデータ収集を頼むことにしたのだ」"

[[dialogue]]
speaker = "ヨミ"
# 「頼まれたからには、爆裂頑張ります！」
line = "「頼まれたからには、爆裂頑張ります！」"

[[dialogue]]
speaker = "ヘレナ"
# 「今回も起動には、ネーゼマインの時と同じく『アルケインノヴァエクストリーム』が必要となる」
line = "「今回も起動には、ネーゼマインの時と同じく『アルケインノヴァエクストリーム』が必要となる」"

[[dialogue]]
speaker = "ヘレナ"
# 「魔王よ、頼めるか？」
line = "「魔王よ、頼めるか？」"

[[dialogue]]
speaker = "ヨミ"
# 「会長、よろしくお願いします！」
line = "「会長、よろしくお願いします！」"

[[dialogue]]
speaker = "unk"
# ――アルケインノヴァエクストリーム！
line = "――アルケインノヴァエクストリーム！"

[[dialogue]]
speaker = "unk"
# わかった。やってみよう
line = "わかった。やってみよう"

[[dialogue]]
speaker = "ヨミ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "ヨミ"
# 「……こや？」
line = "「……こや？」"

[[dialogue]]
speaker = "ヨミ"
# 「な、何も起きない……？」
line = "「な、何も起きない……？」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむ、ズバリ不発であるな」
line = "「うむ、ズバリ不発であるな」"

[[dialogue]]
speaker = "ヨミ"
# 「えっ」
line = "「えっ」"

[[dialogue]]
speaker = "ヘレナ"
# 「まあ、我が魂の囁きから、そうなる予感はしていた」
line = "「まあ、我が魂の囁きから、そうなる予感はしていた」"

[[dialogue]]
speaker = "ヨミ"
# 「えぇっ！？」
line = "「えぇっ！？」"

[[dialogue]]
speaker = "ヨミ"
# 「じゃあ私は、まだこの戦闘服を使えないってことですか！？」
line = "「じゃあ私は、まだこの戦闘服を使えないってことですか！？」"

[[dialogue]]
speaker = "ヨミ"
# 「ご当主様、なんで教えてくれなかったんですかぁ～！？」
line = "「ご当主様、なんで教えてくれなかったんですかぁ～！？」"

[[dialogue]]
speaker = "unk"
# 俺もまた、アルケインコード発動の兆しを示す『心の輝き』が見えなかったため、なんとなくそんな気はしていた。
line = "俺もまた、アルケインコード発動の兆しを示す『心の輝き』が見えなかったため、なんとなくそんな気はしていた。"

[[dialogue]]
speaker = "ヘレナ"
# 「現状、ノヴァフォーム覚醒に必要な要素は３つあると分析されている」
line = "「現状、ノヴァフォーム覚醒に必要な要素は３つあると分析されている」"

[[dialogue]]
speaker = "ヘレナ"
# 「『本人の類まれな才能』、『心理的ブレイクスルー』、そして『魔王との絆』だ」
line = "「『本人の類まれな才能』、『心理的ブレイクスルー』、そして『魔王との絆』だ」"

[[dialogue]]
speaker = "ヘレナ"
# 「ヨミヨミの場合、魔王との絆については問題なく達成しているだろう」
line = "「ヨミヨミの場合、魔王との絆については問題なく達成しているだろう」"

[[dialogue]]
speaker = "ヨミ"
# 「こ、こややっ」
line = "「こ、こややっ」"

[[dialogue]]
speaker = "unk"
# 照れたように尻尾を左右へ揺らしながら、ヨミはちらりとこちらへ視線を向けてくる。
line = "照れたように尻尾を左右へ揺らしながら、ヨミはちらりとこちらへ視線を向けてくる。"

[[dialogue]]
speaker = "ヘレナ"
# 「『才能』については、不足する部分を補い、さらなる高みへ押し上げることこそがエクスノヴァフォームの役割だ」
line = "「『才能』については、不足する部分を補い、さらなる高みへ押し上げることこそがエクスノヴァフォームの役割だ」"

[[dialogue]]
speaker = "ヘレナ"
# 「つまり、残る問題はあと１つ――」
line = "「つまり、残る問題はあと１つ――」"

[[dialogue]]
speaker = "ヘレナ"
# 「ヨミヨミには、アルケインコードによる覚醒に必要な『心理的ブレイクスルー』がまだ足りていないのである！」
line = "「ヨミヨミには、アルケインコードによる覚醒に必要な『心理的ブレイクスルー』がまだ足りていないのである！」"

[[dialogue]]
speaker = "ヨミ"
# 「……！」
line = "「……！」"

[[dialogue]]
speaker = "ヨミ"
# 「つまり、今の私に必要なのは精神的な成長……」
line = "「つまり、今の私に必要なのは精神的な成長……」"

[[dialogue]]
speaker = "ヘレナ"
# 「ああ。そのための秘策については、ちゃんと考えてある」
line = "「ああ。そのための秘策については、ちゃんと考えてある」"

[[dialogue]]
speaker = "ヘレナ"
# 「――と、その話は後にするとしよう」
line = "「――と、その話は後にするとしよう」"

[[dialogue]]
speaker = "ヘレナ"
# 「今日の用件はもう１つ。魔王に紹介したい者がいてな」
line = "「今日の用件はもう１つ。魔王に紹介したい者がいてな」"

[[dialogue]]
speaker = "unk"
# 紹介したい人……？
line = "紹介したい人……？"

[[dialogue]]
speaker = "ヨミ"
# 「そうでした！　本日は私の新しい戦闘服を見てもらうほかに――」
line = "「そうでした！　本日は私の新しい戦闘服を見てもらうほかに――」"

[[dialogue]]
speaker = "ヨミ"
# 「『九浄家メイド隊』に新しく加わる新人さんを紹介しに来たんです！」
line = "「『九浄家メイド隊』に新しく加わる新人さんを紹介しに来たんです！」"

[[dialogue]]
speaker = "ヘレナ"
# 「待たせたな。もう中に入って来てもよいぞ」
line = "「待たせたな。もう中に入って来てもよいぞ」"

[[dialogue]]
speaker = "unk"
# ヘレナちゃんが星徒会室の入口へ向かって声をかける。
line = "ヘレナちゃんが星徒会室の入口へ向かって声をかける。"

[[dialogue]]
speaker = "？？？"
# 「はいっ、失礼するのです♪」
line = "「はいっ、失礼するのです♪」"

[[dialogue]]
speaker = "？？？"
# 「魔王様、初めましてなのです！　ちょっと前に九浄家メイド隊に入れてもらって、附属校にも３年生として転入させてもらったであります♪」
line = "「魔王様、初めましてなのです！　ちょっと前に九浄家メイド隊に入れてもらって、附属校にも３年生として転入させてもらったであります♪」"

[[dialogue]]
speaker = "狛里"
# 「<ruby=こまり>狛里</ruby>の名前は、『<ruby=こまり>狛里</ruby>』なのです！　九浄家メイド隊の新人さんであります！　ばうわふっ♪」
line = "「<ruby>狛里<rt>こまり</rt></ruby>の名前は、『<ruby>狛里<rt>こまり</rt></ruby>』なのです！　九浄家メイド隊の新人さんであります！　ばうわふっ♪」"

[[dialogue]]
speaker = "unk"
# 犬耳と尻尾を揺らす獣人魔族の少女。
line = "犬耳と尻尾を揺らす獣人魔族の少女。"

[[dialogue]]
speaker = "unk"
# 彼女は人懐っこい明るい笑顔を浮かべて、挨拶するのだった。
line = "彼女は人懐っこい明るい笑顔を浮かべて、挨拶するのだった。"
