[[dialogue]]
speaker = "unk"
# 第３話,２人の個人練習,P
line = "第３話,２人の個人練習,P"

[[dialogue]]
speaker = "unk"
# ハロウィンまでお互い忙しくなる。だから２人で会える頻度は落ちてしまうかもしれない。
line = "ハロウィンまでお互い忙しくなる。だから２人で会える頻度は落ちてしまうかもしれない。"

[[dialogue]]
speaker = "unk"
# と、そんな風に覚悟していたのも束の間、環が俺の部屋に遊びに来ていた。
line = "と、そんな風に覚悟していたのも束の間、環が俺の部屋に遊びに来ていた。"

[[dialogue]]
speaker = "ラクシャ"
# 「だってずっと会長に会えないのは辛いからさ」
line = "「だってずっと会長に会えないのは辛いからさ」"

[[dialogue]]
speaker = "ラクシャ"
# 「そこで思いついたんだ。デート代わりに会長に練習に付き合ってもらえばいいって」
line = "「そこで思いついたんだ。デート代わりに会長に練習に付き合ってもらえばいいって」"

[[dialogue]]
speaker = "unk"
# 天才の発想だ
line = "天才の発想だ"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、もっと褒め称えたまえ～♪」
line = "「あはは、もっと褒め称えたまえ～♪」"

[[dialogue]]
speaker = "unk"
# ハロウィンに向けて仕事はあるものの、俺の方は全く時間が作れないほど忙しいというわけではない。
line = "ハロウィンに向けて仕事はあるものの、俺の方は全く時間が作れないほど忙しいというわけではない。"

[[dialogue]]
speaker = "unk"
# だから環の練習に付き合うというのは渡りに船だった。
line = "だから環の練習に付き合うというのは渡りに船だった。"

[[dialogue]]
speaker = "unk"
# 練習ってどんなことをするんだ？
line = "練習ってどんなことをするんだ？"

[[dialogue]]
speaker = "ラクシャ"
# 「ちゃんと練習用の教本もあるよ」
line = "「ちゃんと練習用の教本もあるよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「これはシルヴィさんのバンドのギターの人からもらった初心者用の本なんだ～」
line = "「これはシルヴィさんのバンドのギターの人からもらった初心者用の本なんだ～」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩もバンドマンだっけ？
line = "シルヴィ先輩もバンドマンだっけ？"

[[dialogue]]
speaker = "ラクシャ"
# 「うん。シルヴィさんはドラム担当だから、別に先生をつけてくれたんだ～」
line = "「うん。シルヴィさんはドラム担当だから、別に先生をつけてくれたんだ～」"

[[dialogue]]
speaker = "ラクシャ"
# 「ちなみにチューニングはここに来る前に済ませてきたよ。本当は毎回、弾く前にちゃんとチューニングしたほうがいいらしいんだけどね」
line = "「ちなみにチューニングはここに来る前に済ませてきたよ。本当は毎回、弾く前にちゃんとチューニングしたほうがいいらしいんだけどね」"

[[dialogue]]
speaker = "ラクシャ"
# 「えーと、なになに……？　まずは音を鳴らしてみましょう。１弦３フレットを押さえて弦を弾いてみてください」
line = "「えーと、なになに……？　まずは音を鳴らしてみましょう。１弦３フレットを押さえて弦を弾いてみてください」"

[[dialogue]]
speaker = "unk"
# フレットって何？
line = "フレットって何？"

[[dialogue]]
speaker = "ラクシャ"
# 「左手で押さえるところに入ってる、この線のことをフレットって言うんだって」
line = "「左手で押さえるところに入ってる、この線のことをフレットって言うんだって」"

[[dialogue]]
speaker = "ラクシャ"
# 「１弦３フレットっていうことは、１番下の弦の３フレット目の手前を押さえて……こう！」
line = "「１弦３フレットっていうことは、１番下の弦の３フレット目の手前を押さえて……こう！」"

[[dialogue]]
speaker = "unk"
# ポーン、と綺麗な音色を奏でる──ということはなく、ボフッと気の抜けた音が鳴る。
line = "ポーン、と綺麗な音色を奏でる──ということはなく、ボフッと気の抜けた音が鳴る。"

[[dialogue]]
speaker = "ラクシャ"
# 「ダメかー。上手く弾けてないと、今みたいな変な音がするみたいなんだよね」
line = "「ダメかー。上手く弾けてないと、今みたいな変な音がするみたいなんだよね」"

[[dialogue]]
speaker = "ラクシャ"
# 「ちゃんと弦を押さえられてないことが原因らしいんだけど……おかしいな～、しっかり押さえてるはずなのに」
line = "「ちゃんと弦を押さえられてないことが原因らしいんだけど……おかしいな～、しっかり押さえてるはずなのに」"

[[dialogue]]
speaker = "ラクシャ"
# 「そうだ、会長もちょっとやってみてよ」
line = "「そうだ、会長もちょっとやってみてよ」"

[[dialogue]]
speaker = "unk"
# 環からギターを受け取ると、同じように押さえて弦を弾いてみる。
line = "環からギターを受け取ると、同じように押さえて弦を弾いてみる。"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、すごいすごい！　ちゃんと音が鳴ったよ！」
line = "「あはは、すごいすごい！　ちゃんと音が鳴ったよ！」"

[[dialogue]]
speaker = "unk"
# でもなんか割れてて汚い音だったな
line = "でもなんか割れてて汚い音だったな"

[[dialogue]]
speaker = "ラクシャ"
# 「でも全然鳴らなかったボクよりすごいって！　ねえねえ、どうやったの？」
line = "「でも全然鳴らなかったボクよりすごいって！　ねえねえ、どうやったの？」"

[[dialogue]]
speaker = "unk"
# しっかり押さえた、としか……
line = "しっかり押さえた、としか……"

[[dialogue]]
speaker = "ラクシャ"
# 「けっこう力を入れて押さえなきゃだめなのかもね……指が痛くなっちゃいそー」
line = "「けっこう力を入れて押さえなきゃだめなのかもね……指が痛くなっちゃいそー」"

[[dialogue]]
speaker = "ラクシャ"
# 「でもやってみるよ！　ここで綺麗な音を鳴らせなきゃ話にならないもんね！　頑張るよっ！」
line = "「でもやってみるよ！　ここで綺麗な音を鳴らせなきゃ話にならないもんね！　頑張るよっ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「──音をちゃんと鳴らせるようになったら、次はコードを鳴らしてみましょう、だって！」
line = "「──音をちゃんと鳴らせるようになったら、次はコードを鳴らしてみましょう、だって！」"

[[dialogue]]
speaker = "ラクシャ"
# 「まずは中指で５弦２フレット、薬指で４弦２フレットを押さえ、全ての弦を鳴らしてみましょう」
line = "「まずは中指で５弦２フレット、薬指で４弦２フレットを押さえ、全ての弦を鳴らしてみましょう」"

[[dialogue]]
speaker = "ラクシャ"
# 「それがＥｍというコードになります。ふむふむ、じゃあちょっとやってみるね」
line = "「それがＥｍというコードになります。ふむふむ、じゃあちょっとやってみるね」"

[[dialogue]]
speaker = "unk"
# 左手で弦を押さえ、右手にピックを持って、６本の弦を一気に弾いていく。
line = "左手で弦を押さえ、右手にピックを持って、６本の弦を一気に弾いていく。"

[[dialogue]]
speaker = "ラクシャ"
# 「わ……あはは、予想はしてたけど酷いね～。全然鳴ってないや」
line = "「わ……あはは、予想はしてたけど酷いね～。全然鳴ってないや」"

[[dialogue]]
speaker = "ラクシャ"
# 「４弦と５弦以外の弦には触れないように。それから押さえていない弦も含めて全ての弦を弾くように……って、難しいよ！！」
line = "「４弦と５弦以外の弦には触れないように。それから押さえていない弦も含めて全ての弦を弾くように……って、難しいよ！！」"

[[dialogue]]
speaker = "ラクシャ"
# 「でもだんだん、ギターを弾いてる、って感じになってきたね！」
line = "「でもだんだん、ギターを弾いてる、って感じになってきたね！」"

[[dialogue]]
speaker = "ラクシャ"
# 「よーし、もう１回…………うーん、駄目かぁ～」
line = "「よーし、もう１回…………うーん、駄目かぁ～」"

[[dialogue]]
speaker = "unk"
# 指を立てる感じにしてみたら？
line = "指を立てる感じにしてみたら？"

[[dialogue]]
speaker = "unk"
# ６弦に触っちゃってるみたいだね
line = "６弦に触っちゃってるみたいだね"

[[dialogue]]
speaker = "ラクシャ"
# 「どんな感じだよ～。やって見せてよ～」
line = "「どんな感じだよ～。やって見せてよ～」"

[[dialogue]]
speaker = "ラクシャ"
# 「え～？　それじゃわかんないって～♪　ほら、もっと近くに寄って教えて～♪」
line = "「え～？　それじゃわかんないって～♪　ほら、もっと近くに寄って教えて～♪」"

[[dialogue]]
speaker = "unk"
# イタズラっぽい笑みを浮かべる環。
line = "イタズラっぽい笑みを浮かべる環。"

[[dialogue]]
speaker = "unk"
# 俺はひとつため息をついて環の後ろに回ると、二人羽織りのようにして弦を押さえてみせる。
line = "俺はひとつため息をついて環の後ろに回ると、二人羽織りのようにして弦を押さえてみせる。"

[[dialogue]]
speaker = "ラクシャ"
# 「うんうん、なるほどね。じゃ、弾いてみるからそのままくっついててね。せーの……じゃらーん♪」
line = "「うんうん、なるほどね。じゃ、弾いてみるからそのままくっついててね。せーの……じゃらーん♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「やった♪　いい感じにギターっぽい音が鳴ったね♪」
line = "「やった♪　いい感じにギターっぽい音が鳴ったね♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「教えてくれてありがと、会長♪」
line = "「教えてくれてありがと、会長♪」"

[[dialogue]]
speaker = "unk"
# わかっていても、間近でこんな笑顔を見せられたら心臓が跳ねてしまう。
line = "わかっていても、間近でこんな笑顔を見せられたら心臓が跳ねてしまう。"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、顔近すぎかな～♪」
line = "「あはは、顔近すぎかな～♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「でもこうやって密着して練習してるの、恋人って感じで良くない？」
line = "「でもこうやって密着して練習してるの、恋人って感じで良くない？」"

[[dialogue]]
speaker = "ラクシャ"
# 「これなら普通にやるより楽しく練習できそう♪　さ、次いこうか、次♪　ええと次は<ruby=エーマイナー>Ａｍ</ruby>で……」
line = "「これなら普通にやるより楽しく練習できそう♪　さ、次いこうか、次♪　ええと次は<ruby>Ａｍ<rt>エーマイナー</rt></ruby>で……」"

[[dialogue]]
speaker = "unk"
# そんな調子でギターの練習を続けた。
line = "そんな調子でギターの練習を続けた。"

[[dialogue]]
speaker = "unk"
# あまりに夢中になり過ぎたせいで、練習後は指がつりそうになるほど痛くなってしまった。
line = "あまりに夢中になり過ぎたせいで、練習後は指がつりそうになるほど痛くなってしまった。"

[[dialogue]]
speaker = "unk"
# それでも２人とも、充実した時間に満足感を得ることができたのだった。
line = "それでも２人とも、充実した時間に満足感を得ることができたのだった。"
