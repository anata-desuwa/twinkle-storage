[[dialogue]]
speaker = "unk"
# 第３話,新メニュー試食会,P
line = "第３話,新メニュー試食会,P"

[[dialogue]]
speaker = "unk"
# カフェテリアには、錚々たる顔ぶれが揃っていた。
line = "カフェテリアには、錚々たる顔ぶれが揃っていた。"

[[dialogue]]
speaker = "レイラ"
# 「ドーモ、百目騎レイラです」
line = "「ドーモ、百目騎レイラです」"

[[dialogue]]
speaker = "unk"
# 片やブラックホールの胃袋を持つコラプサーの首領、百目騎レイラ。
line = "片やブラックホールの胃袋を持つコラプサーの首領、百目騎レイラ。"

[[dialogue]]
speaker = "エルデリーゼ"
# 「お招きありがとうございます、サランお姉さま、蛍火様」
line = "「お招きありがとうございます、サランお姉さま、蛍火様」"

[[dialogue]]
speaker = "unk"
# 片や流星学園附属の大食姫、桜十路エルデリーゼ。
line = "片や流星学園附属の大食姫、桜十路エルデリーゼ。"

[[dialogue]]
speaker = "unk"
# 星騎士界の大食い２大巨頭が揃い踏みである。
line = "星騎士界の大食い２大巨頭が揃い踏みである。"

[[dialogue]]
speaker = "蛍火"
# 「師匠、ご足労いただきありがとうございます」
line = "「師匠、ご足労いただきありがとうございます」"

[[dialogue]]
speaker = "unk"
# 今日は何の集まり？
line = "今日は何の集まり？"

[[dialogue]]
speaker = "サラン"
# 「カフェテリアの新メニュー試食会だよ～」
line = "「カフェテリアの新メニュー試食会だよ～」"

[[dialogue]]
speaker = "unk"
# サランや蛍火の所属する給食委員会はカフェテリアの運営を担っている。新メニューの開発は委員会の主な仕事だ。
line = "サランや蛍火の所属する給食委員会はカフェテリアの運営を担っている。新メニューの開発は委員会の主な仕事だ。"

[[dialogue]]
speaker = "サラン"
# 「いつもおんなじメニューじゃ飽きちゃうでしょ～？　だから、定期的に新しいメニューを追加するの～」
line = "「いつもおんなじメニューじゃ飽きちゃうでしょ～？　だから、定期的に新しいメニューを追加するの～」"

[[dialogue]]
speaker = "蛍火"
# 「今のメニューも歴代の給食委員会によって作られたもの。こうした積み重ねが私たちの学園を作っているのです」
line = "「今のメニューも歴代の給食委員会によって作られたもの。こうした積み重ねが私たちの学園を作っているのです」"

[[dialogue]]
speaker = "レイラ"
# 「ふふっ、素敵ですね。……ひゅごっ」
line = "「ふふっ、素敵ですね。……ひゅごっ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「あの、そちらは……？　試食会前になぜおにぎりを食べているんですの？」
line = "「あの、そちらは……？　試食会前になぜおにぎりを食べているんですの？」"

[[dialogue]]
speaker = "レイラ"
# 「万全に試食会に臨むため、胃袋を温めています。……ひゅごっ」
line = "「万全に試食会に臨むため、胃袋を温めています。……ひゅごっ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「なるほど……空腹が長いと胃が収縮すると聞きますしね」
line = "「なるほど……空腹が長いと胃が収縮すると聞きますしね」"

[[dialogue]]
speaker = "unk"
# 空気を吸う音がすると同時に、拳大のおにぎりが一瞬で消え去る。コラプサーと秋葉原で戦った時はレイラがこんな人だとは思わなかった。
line = "空気を吸う音がすると同時に、拳大のおにぎりが一瞬で消え去る。コラプサーと秋葉原で戦った時はレイラがこんな人だとは思わなかった。"

[[dialogue]]
speaker = "サラン"
# 「ふふ～。レイラちゃん、相変わらずだね～。子どもの頃から変わらないな～」
line = "「ふふ～。レイラちゃん、相変わらずだね～。子どもの頃から変わらないな～」"

[[dialogue]]
speaker = "レイラ"
# 「子どもの頃ですか？　失礼ですが、どなたかとお間違えでは……？　そんなに昔にサランさんと会ったことありましたっけ？」
line = "「子どもの頃ですか？　失礼ですが、どなたかとお間違えでは……？　そんなに昔にサランさんと会ったことありましたっけ？」"

[[dialogue]]
speaker = "サラン"
# 「うん。サランが小さいころ、五名門のパーティーがあって～」
line = "「うん。サランが小さいころ、五名門のパーティーがあって～」"

[[dialogue]]
speaker = "蛍火"
# 「小さいサランさん、きっとすっごく可愛かったでしょうねぇ～<emoji=heart04>」
line = "「小さいサランさん、きっとすっごく可愛かったでしょうねぇ～<emoji=heart04>」"

[[dialogue]]
speaker = "エルデリーゼ"
# （蛍火様ってこんなお方だったのですね……）
line = "（蛍火様ってこんなお方だったのですね……）"

[[dialogue]]
speaker = "unk"
# 緊張しいの蛍火だが、サランにだけはこんな感じだ。知らない人から見たらもはや別人である。
line = "緊張しいの蛍火だが、サランにだけはこんな感じだ。知らない人から見たらもはや別人である。"

[[dialogue]]
speaker = "サラン"
# 「でね～、パーティーだから、いろんなご馳走があったんだけど～、サラン、人見知りで緊張しちゃって、ごはんがのどを通らなかったの～」
line = "「でね～、パーティーだから、いろんなご馳走があったんだけど～、サラン、人見知りで緊張しちゃって、ごはんがのどを通らなかったの～」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「サランお姉さまがですか！？　サランお姉さまにもそんな頃があったのですね……」
line = "「サランお姉さまがですか！？　サランお姉さまにもそんな頃があったのですね……」"

[[dialogue]]
speaker = "蛍火"
# 「その頃の写真とか残ってませんか！？」
line = "「その頃の写真とか残ってませんか！？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「蛍火様、やっぱり様子がおかしいですわ！？」
line = "「蛍火様、やっぱり様子がおかしいですわ！？」"

[[dialogue]]
speaker = "サラン"
# 「でも～、サランと同じぐらいで、たくさんご飯食べてる子がいて、すごいな～って思ったんだ～。きれいな銀髪の女の子だったから、レイラちゃんかな～って」
line = "「でも～、サランと同じぐらいで、たくさんご飯食べてる子がいて、すごいな～って思ったんだ～。きれいな銀髪の女の子だったから、レイラちゃんかな～って」"

[[dialogue]]
speaker = "サラン"
# 「堂々と美味しそうにごはん食べてて、かっこよかったな～」
line = "「堂々と美味しそうにごはん食べてて、かっこよかったな～」"

[[dialogue]]
speaker = "レイラ"
# 「あー、それは確かに私ですね。そんなところですれ違っていたとは……覚えていなくてすみません」
line = "「あー、それは確かに私ですね。そんなところですれ違っていたとは……覚えていなくてすみません」"

[[dialogue]]
speaker = "サラン"
# 「ううん、気にしないで～。サランが覚えてただけだから～」
line = "「ううん、気にしないで～。サランが覚えてただけだから～」"

[[dialogue]]
speaker = "サラン"
# 「それより、今日は協力ありがと～。お話できて嬉しいな～」
line = "「それより、今日は協力ありがと～。お話できて嬉しいな～」"

[[dialogue]]
speaker = "レイラ"
# 「いえ、こちらこそ。蛍火さんはじめ、給食委員会のみなさんにはお世話になっていますから」
line = "「いえ、こちらこそ。蛍火さんはじめ、給食委員会のみなさんにはお世話になっていますから」"

[[dialogue]]
speaker = "蛍火"
# 「フードロス削減は私たちにとっても永遠のテーマです。百目騎さんにはいつも感謝しています」
line = "「フードロス削減は私たちにとっても永遠のテーマです。百目騎さんにはいつも感謝しています」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「……どういうことですの？」
line = "「……どういうことですの？」"

[[dialogue]]
speaker = "サラン"
# 「レイラちゃんには、料理や食材の廃棄が出そうな時に消費に協力してもらっているの～。委員会のみんなで食べきるのは限界があるから～」
line = "「レイラちゃんには、料理や食材の廃棄が出そうな時に消費に協力してもらっているの～。委員会のみんなで食べきるのは限界があるから～」"

[[dialogue]]
speaker = "レイラ"
# 「名付けて、百目騎フードロスコンサルタント！」
line = "「名付けて、百目騎フードロスコンサルタント！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「は、はぁ……」
line = "「は、はぁ……」"

[[dialogue]]
speaker = "サラン"
# 「じゃあそろそろ、試食会はじめよっか～。まず始めは、魔界風焼きそば～」
line = "「じゃあそろそろ、試食会はじめよっか～。まず始めは、魔界風焼きそば～」"

[[dialogue]]
speaker = "サラン"
# 「魔界といっても、今の魔界じゃないよ～。魔本に書いてあったレシピなんだ～」
line = "「魔界といっても、今の魔界じゃないよ～。魔本に書いてあったレシピなんだ～」"

[[dialogue]]
speaker = "蛍火"
# 「そのままではかなり人を選ぶ味付けだったので、アレンジを加えています。香辛料の量を変えて３種類作ってみたので、食べ比べてみてください」
line = "「そのままではかなり人を選ぶ味付けだったので、アレンジを加えています。香辛料の量を変えて３種類作ってみたので、食べ比べてみてください」"

[[dialogue]]
speaker = "レイラ"
# 「ではまずＡから……ひゅごっ……あむあむ……う～～ん、後を引く辛さでお箸が止まりません！　シャキシャキ野菜の食感も楽しいです」
line = "「ではまずＡから……ひゅごっ……あむあむ……う～～ん、後を引く辛さでお箸が止まりません！　シャキシャキ野菜の食感も楽しいです」"

[[dialogue]]
speaker = "エルデリーゼ"
# （お箸は一瞬しか使ってらっしゃいませんけど……）
line = "（お箸は一瞬しか使ってらっしゃいませんけど……）"

[[dialogue]]
speaker = "エルデリーゼ"
# 「では私はＢを……んっ！　美味しいですけれど、とても辛いですわ！　これより辛くては、一部の人限定になってしまいますわ」
line = "「では私はＢを……んっ！　美味しいですけれど、とても辛いですわ！　これより辛くては、一部の人限定になってしまいますわ」"

[[dialogue]]
speaker = "サラン"
# 「だよね～。オリジナルに近いのはＣなんだけど、ちょっと辛すぎかな～？」
line = "「だよね～。オリジナルに近いのはＣなんだけど、ちょっと辛すぎかな～？」"

[[dialogue]]
speaker = "unk"
# と、自分でＣの焼きそばを食べるサラン。ちなみにサラン自身は激辛も平気だ。
line = "と、自分でＣの焼きそばを食べるサラン。ちなみにサラン自身は激辛も平気だ。"

[[dialogue]]
speaker = "蛍火"
# 「再現性を取るか、食べやすさを取るか、難しいところですね……」
line = "「再現性を取るか、食べやすさを取るか、難しいところですね……」"

[[dialogue]]
speaker = "unk"
# オプションで辛さを足すのはどうかな？
line = "オプションで辛さを足すのはどうかな？"

[[dialogue]]
speaker = "unk"
# 思い浮かんだのは、以前バイトしたことのあるカレー屋だ。辛さをオプションで変更することで、幅広いニーズに対応できる。
line = "思い浮かんだのは、以前バイトしたことのあるカレー屋だ。辛さをオプションで変更することで、幅広いニーズに対応できる。"

[[dialogue]]
speaker = "サラン"
# 「なるほど～。見たことあるかも～」
line = "「なるほど～。見たことあるかも～」"

[[dialogue]]
speaker = "蛍火"
# 「オペレーションには工夫が必要そうですが、よいですね。実現すれば他のメニューにも採用できそうです」
line = "「オペレーションには工夫が必要そうですが、よいですね。実現すれば他のメニューにも採用できそうです」"

[[dialogue]]
speaker = "サラン"
# 「じゃあそれで行こっか～。お次は魔界プリン～。まったりとろ～り幸せの味～♪」
line = "「じゃあそれで行こっか～。お次は魔界プリン～。まったりとろ～り幸せの味～♪」"

[[dialogue]]
speaker = "unk"
# 試食会を終え、俺はサランと一緒に帰路に就いた。
line = "試食会を終え、俺はサランと一緒に帰路に就いた。"

[[dialogue]]
speaker = "サラン"
# 「ごめんね～、会長ちゃん。おなか大丈夫～？」
line = "「ごめんね～、会長ちゃん。おなか大丈夫～？」"

[[dialogue]]
speaker = "unk"
# な、なんとか……
line = "な、なんとか……"

[[dialogue]]
speaker = "unk"
# 試食会に参加したはいいものの、レイラやエルゼほどには力になれなかった。単純に量が入らないし、腹が膨れても舌が鈍らないのは特別な資質だと思う。
line = "試食会に参加したはいいものの、レイラやエルゼほどには力になれなかった。単純に量が入らないし、腹が膨れても舌が鈍らないのは特別な資質だと思う。"

[[dialogue]]
speaker = "サラン"
# 「今日はね、サランたち給食委員会の活動を見てほしかったんだ～」
line = "「今日はね、サランたち給食委員会の活動を見てほしかったんだ～」"

[[dialogue]]
speaker = "サラン"
# 「学園のみんなにはいつも美味しいごはんを食べてほしいからね～。給食委員会みんなの願いだよ～」
line = "「学園のみんなにはいつも美味しいごはんを食べてほしいからね～。給食委員会みんなの願いだよ～」"

[[dialogue]]
speaker = "unk"
# 普段は見かけない、給食委員会の人たち。その努力は美味しいごはんに繋がっている。俺たちはこうして、支えられて、支え合って、暮らしているんだ。
line = "普段は見かけない、給食委員会の人たち。その努力は美味しいごはんに繋がっている。俺たちはこうして、支えられて、支え合って、暮らしているんだ。"

[[dialogue]]
speaker = "サラン"
# 「それにね、会長ちゃんに新しいメニューを早く食べてほしかったんだ～」
line = "「それにね、会長ちゃんに新しいメニューを早く食べてほしかったんだ～」"

[[dialogue]]
speaker = "サラン"
# 「魔本を読んでるとね、魔族のひとたちがごはんをどんなに楽しみにしてたのか伝わってくるの～」
line = "「魔本を読んでるとね、魔族のひとたちがごはんをどんなに楽しみにしてたのか伝わってくるの～」"

[[dialogue]]
speaker = "サラン"
# 「魔界って魔獣もいるし、暑かったり寒かったり、いろいろ大変なんだけど～、だからこそ、ごはんの喜びもひとしおなの～」
line = "「魔界って魔獣もいるし、暑かったり寒かったり、いろいろ大変なんだけど～、だからこそ、ごはんの喜びもひとしおなの～」"

[[dialogue]]
speaker = "サラン"
# 「遠い昔の魔族のひとたちが愛おしくって……会長ちゃんにも感じて欲しかったんだ～」
line = "「遠い昔の魔族のひとたちが愛おしくって……会長ちゃんにも感じて欲しかったんだ～」"

[[dialogue]]
speaker = "unk"
# 夜空を見上げるサランの瞳には、古き魔族たちの営みが映っているのかもしれない。
line = "夜空を見上げるサランの瞳には、古き魔族たちの営みが映っているのかもしれない。"

[[dialogue]]
speaker = "unk"
# 日々の営み、日々の食事……それを想うサランの横顔がすごく綺麗だった。
line = "日々の営み、日々の食事……それを想うサランの横顔がすごく綺麗だった。"

[[dialogue]]
speaker = "サラン"
# 「思い出したらおなかすいてきちゃった～。会長ちゃんのおうち行ってもい～い？　何か買って帰ろ～？」
line = "「思い出したらおなかすいてきちゃった～。会長ちゃんのおうち行ってもい～い？　何か買って帰ろ～？」"

[[dialogue]]
speaker = "unk"
# まだ食べるの、などと無粋なことは言わない。たくさん食べるサランは可愛いから。
line = "まだ食べるの、などと無粋なことは言わない。たくさん食べるサランは可愛いから。"
