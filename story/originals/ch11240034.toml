[[dialogue]]
speaker = "unk"
# 第４話,遊園地デート再び,P
line = "第４話,遊園地デート再び,P"

[[dialogue]]
speaker = "unk"
# ハロウィンも終わり、今度こそ俺にも環にも時間の余裕が出来た。
line = "ハロウィンも終わり、今度こそ俺にも環にも時間の余裕が出来た。"

[[dialogue]]
speaker = "unk"
# そこで休日に環を誘って、久しぶりにがっつり遊ぶことにした。
line = "そこで休日に環を誘って、久しぶりにがっつり遊ぶことにした。"

[[dialogue]]
speaker = "ラクシャ"
# 「デート！？　うん、行く！　行こう行こう！」
line = "「デート！？　うん、行く！　行こう行こう！」"

[[dialogue]]
speaker = "ラクシャ"
# 「会長と遊びに行くのずーっとおあずけにしてたし……いつにする？　ボクはいつでもいいよ？」
line = "「会長と遊びに行くのずーっとおあずけにしてたし……いつにする？　ボクはいつでもいいよ？」"

[[dialogue]]
speaker = "ラクシャ"
# 「やりたいこと、いっぱいたまってるんだよね～。映画も見たいし、ゲーセンにも行きたいし、ショッピングもしたいし、それから……」
line = "「やりたいこと、いっぱいたまってるんだよね～。映画も見たいし、ゲーセンにも行きたいし、ショッピングもしたいし、それから……」"

[[dialogue]]
speaker = "unk"
# デートに誘われた環は、待ってましたとばかりにテンションが上がる。
line = "デートに誘われた環は、待ってましたとばかりにテンションが上がる。"

[[dialogue]]
speaker = "unk"
# そして──
line = "そして──"

[[dialogue]]
speaker = "unk"
# 俺たちがデートの場所として選んだのは遊園地だった。
line = "俺たちがデートの場所として選んだのは遊園地だった。"

[[dialogue]]
speaker = "ラクシャ"
# 「ふーっ、なかなかヤバいフリーフォールだったねー」
line = "「ふーっ、なかなかヤバいフリーフォールだったねー」"

[[dialogue]]
speaker = "unk"
# ちょっと甘く見てた
line = "ちょっと甘く見てた"

[[dialogue]]
speaker = "unk"
# すごい速さだったな
line = "すごい速さだったな"

[[dialogue]]
speaker = "ラクシャ"
# 「だね～。空中とか高速の移動には慣れてるはずなのに、思わずヒェッてなっちゃったよ。会長もちょっと悲鳴出ちゃってたよね？」
line = "「だね～。空中とか高速の移動には慣れてるはずなのに、思わずヒェッてなっちゃったよ。会長もちょっと悲鳴出ちゃってたよね？」"

[[dialogue]]
speaker = "ラクシャ"
# 「あ、そうだ、『魔王も悲鳴をあげるフリーフォール』って売り文句にしたら箔がつかないかな？」
line = "「あ、そうだ、『魔王も悲鳴をあげるフリーフォール』って売り文句にしたら箔がつかないかな？」"

[[dialogue]]
speaker = "unk"
# それは俺が恥ずかしいよ……
line = "それは俺が恥ずかしいよ……"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、そっかー。けど、さすがはこの遊園地の新しい目玉アトラクションって謳ってるだけあるなー。怖かったけど面白かった！」
line = "「あはは、そっかー。けど、さすがはこの遊園地の新しい目玉アトラクションって謳ってるだけあるなー。怖かったけど面白かった！」"

[[dialogue]]
speaker = "ラクシャ"
# 「それじゃ次は何に乗る？　絶叫系が続いちゃうけどジェットコースター行っとく？」
line = "「それじゃ次は何に乗る？　絶叫系が続いちゃうけどジェットコースター行っとく？」"

[[dialogue]]
speaker = "ラクシャ"
# 「もちろん遊園地に来たからには目指すよね、全アトラクション制覇♪」
line = "「もちろん遊園地に来たからには目指すよね、全アトラクション制覇♪」"

[[dialogue]]
speaker = "unk"
# そう言って環は俺の手を掴むと、次の目当てのアトラクションに引っ張っていく。
line = "そう言って環は俺の手を掴むと、次の目当てのアトラクションに引っ張っていく。"

[[dialogue]]
speaker = "unk"
# 無邪気にはしゃぐ環はキラキラと輝くような笑顔を浮かべていて……
line = "無邪気にはしゃぐ環はキラキラと輝くような笑顔を浮かべていて……"

[[dialogue]]
speaker = "unk"
# そんな彼女が世界の摂理を司る守護天使の１人だと言っても、俄かには信じてもらえないだろうと思ってしまう。
line = "そんな彼女が世界の摂理を司る守護天使の１人だと言っても、俄かには信じてもらえないだろうと思ってしまう。"

[[dialogue]]
speaker = "unk"
# （環の笑顔、やっぱりいいな……）
line = "（環の笑顔、やっぱりいいな……）"

[[dialogue]]
speaker = "ラクシャ"
# 「ん、何かな？　ニコニコしながらボクのことを見つめちゃってー♪」
line = "「ん、何かな？　ニコニコしながらボクのことを見つめちゃってー♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「ひょっとしてボクの可愛さに見とれちゃってたりしたのかな？」
line = "「ひょっとしてボクの可愛さに見とれちゃってたりしたのかな？」"

[[dialogue]]
speaker = "unk"
# ああ、目が離せなかった
line = "ああ、目が離せなかった"

[[dialogue]]
speaker = "ラクシャ"
# 「ぅ……もうっ、どうしてそういう恥ずかしいことを、真顔で言うかなぁ……」
line = "「ぅ……もうっ、どうしてそういう恥ずかしいことを、真顔で言うかなぁ……」"

[[dialogue]]
speaker = "ラクシャ"
# 「会長のそういうド直球な言葉に弱いんだよねー。ほら、ボクってこう見えて結構乙女なところがあるからさ」
line = "「会長のそういうド直球な言葉に弱いんだよねー。ほら、ボクってこう見えて結構乙女なところがあるからさ」"

[[dialogue]]
speaker = "ラクシャ"
# 「結構ドキドキさせられてるんだよ？　それを自覚させたのも会長なんだからね？」
line = "「結構ドキドキさせられてるんだよ？　それを自覚させたのも会長なんだからね？」"

[[dialogue]]
speaker = "ラクシャ"
# 「告白してくれた時も、ボクの正体なんて関係ないって言って、『環は環だろ』って……ボクの１番欲しかった言葉をくれたりさ」
line = "「告白してくれた時も、ボクの正体なんて関係ないって言って、『環は環だろ』って……ボクの１番欲しかった言葉をくれたりさ」"

[[dialogue]]
speaker = "ラクシャ"
# 「ほら、例の事件の時の、『いつか迎えに来るよ、環』って言葉もかなりの破壊力だったし……」
line = "「ほら、例の事件の時の、『いつか迎えに来るよ、環』って言葉もかなりの破壊力だったし……」"

[[dialogue]]
speaker = "unk"
# あの時は、とんだ失礼を……
line = "あの時は、とんだ失礼を……"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、前も言ったけど、あの時のことはもういいってば」
line = "「あはは、前も言ったけど、あの時のことはもういいってば」"

[[dialogue]]
speaker = "ラクシャ"
# 「会長がボクのところに来れる状況じゃなかったってことはちゃんと分かってるし、埋め合わせもちゃんとしてくれたし♪」
line = "「会長がボクのところに来れる状況じゃなかったってことはちゃんと分かってるし、埋め合わせもちゃんとしてくれたし♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「そう言えば、その埋め合わせで遊びに来たのもこの遊園地だったよね～」
line = "「そう言えば、その埋め合わせで遊びに来たのもこの遊園地だったよね～」"

[[dialogue]]
speaker = "unk"
# ああ、そうだな
line = "ああ、そうだな"

[[dialogue]]
speaker = "ラクシャ"
# 「何だかもうずいぶん前のことみたいに感じちゃうよ。会長がボクに改めて告白してくれたのも、ここだったんだよね……」
line = "「何だかもうずいぶん前のことみたいに感じちゃうよ。会長がボクに改めて告白してくれたのも、ここだったんだよね……」"

[[dialogue]]
speaker = "ラクシャ"
# 「『真実を知っても俺の気持ちは変わらない』って言ってくれて……それでボクは、ボクの気持ちを……」
line = "「『真実を知っても俺の気持ちは変わらない』って言ってくれて……それでボクは、ボクの気持ちを……」"

[[dialogue]]
speaker = "ラクシャ"
# 「あーもうっ、思い返してたら顔が熱くなってきちゃったよ！」
line = "「あーもうっ、思い返してたら顔が熱くなってきちゃったよ！」"

[[dialogue]]
speaker = "unk"
# 環は手でパタパタと顔をあおぐ。
line = "環は手でパタパタと顔をあおぐ。"

[[dialogue]]
speaker = "unk"
# 珍しく恥ずかしがっている環のことも可愛いと思うし、俺の言葉がそんな風に響いてくれていることも嬉しい。
line = "珍しく恥ずかしがっている環のことも可愛いと思うし、俺の言葉がそんな風に響いてくれていることも嬉しい。"

[[dialogue]]
speaker = "unk"
# ──と思ったことをそのまま口に出して言ってしまうと、「またそんなコト言うんだ！」と叱られてしまいそうな気がする。
line = "──と思ったことをそのまま口に出して言ってしまうと、「またそんなコト言うんだ！」と叱られてしまいそうな気がする。"

[[dialogue]]
speaker = "ラクシャ"
# 「あー、やだやだ。こんな赤面しちゃってるところ、知り合いに見られたくないよ」
line = "「あー、やだやだ。こんな赤面しちゃってるところ、知り合いに見られたくないよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「っていうか、この遊園地にもしっかり知り合いがいるんだよね？」
line = "「っていうか、この遊園地にもしっかり知り合いがいるんだよね？」"

[[dialogue]]
speaker = "unk"
# この遊園地も俺たちの元バイト先であり、そしてその時の元バイト仲間が今は正社員として働いていることは前回のデートで分かっていた。
line = "この遊園地も俺たちの元バイト先であり、そしてその時の元バイト仲間が今は正社員として働いていることは前回のデートで分かっていた。"

[[dialogue]]
speaker = "unk"
# すぐ知り合いに出くわす
line = "すぐ知り合いに出くわす"

[[dialogue]]
speaker = "unk"
# 環は顔が広いからな
line = "環は顔が広いからな"

[[dialogue]]
speaker = "ラクシャ"
# 「それを言うなら会長だって同じじゃない？」
line = "「それを言うなら会長だって同じじゃない？」"

[[dialogue]]
speaker = "ラクシャ"
# 「そもそもデート先が元バイト先ってことが多いんだからさ、知り合いに遭遇する確率も高くなるに決まってるよね！」
line = "「そもそもデート先が元バイト先ってことが多いんだからさ、知り合いに遭遇する確率も高くなるに決まってるよね！」"

[[dialogue]]
speaker = "ラクシャ"
# 「ボクたちってデート中に知り合いに出くわすことが妙に多いかもって思ってたけど、よく考えたらそれって当たり前のことだったんだ」
line = "「ボクたちってデート中に知り合いに出くわすことが妙に多いかもって思ってたけど、よく考えたらそれって当たり前のことだったんだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「まあ、別に嫌なわけじゃないけど……ボクらのプライバシーはもうこの世のどこにもないんだーって思っちゃうよ……」
line = "「まあ、別に嫌なわけじゃないけど……ボクらのプライバシーはもうこの世のどこにもないんだーって思っちゃうよ……」"

[[dialogue]]
speaker = "unk"
# 周りに気を付けないとね
line = "周りに気を付けないとね"

[[dialogue]]
speaker = "unk"
# いい雰囲気になった時は
line = "いい雰囲気になった時は"

[[dialogue]]
speaker = "ラクシャ"
# 「うん、そうだね……それは注意が必要かも……」
line = "「うん、そうだね……それは注意が必要かも……」"

[[dialogue]]
speaker = "ラクシャ"
# 「会長も、不意打ちでボクをときめかせるよーなことは出来るだけ言わないよーに！」
line = "「会長も、不意打ちでボクをときめかせるよーなことは出来るだけ言わないよーに！」"

[[dialogue]]
speaker = "unk"
# 自重します……
line = "自重します……"

[[dialogue]]
speaker = "ラクシャ"
# 「あははっ、ウソウソ！　自重はしなくていいよ、むしろもっと聞かせて欲しいくらいなんだから！」
line = "「あははっ、ウソウソ！　自重はしなくていいよ、むしろもっと聞かせて欲しいくらいなんだから！」"

[[dialogue]]
speaker = "ラクシャ"
# 「いろいろ言ったけど……結局、嬉しいんだよ。だからこれからも、ボクの喜ぶ言葉、いっぱいちょーだい♪」
line = "「いろいろ言ったけど……結局、嬉しいんだよ。だからこれからも、ボクの喜ぶ言葉、いっぱいちょーだい♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「期待してるからね、会長っ<emoji=heart04>」
line = "「期待してるからね、会長っ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# なんだかハードルを上げられてしまった気もするが……。
line = "なんだかハードルを上げられてしまった気もするが……。"

[[dialogue]]
speaker = "unk"
# そのまま腕を組んで、悪戯っぽい笑みを浮かべる環は、間違いなく世界一可愛いなと心の中で呟く俺なのだった。
line = "そのまま腕を組んで、悪戯っぽい笑みを浮かべる環は、間違いなく世界一可愛いなと心の中で呟く俺なのだった。"
