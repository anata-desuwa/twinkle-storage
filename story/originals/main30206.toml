[[dialogue]]
speaker = "ラクシャ"
# 「……これはこれで、ちょっと楽しい──かな？」
line = "「……これはこれで、ちょっと楽しい──かな？」"

[[dialogue]]
speaker = "ラクシャ"
# 「…………うん」
