line = "「ぅぅ……困ったなぁ、どうしよう……」"

[[dialogue]]
speaker = "ラクシャ"
# 「なーんてね。安心してよ、実はその辺、ちゃーんと考えがあるから♪」
line = "「なーんてね。安心してよ、実はその辺、ちゃーんと考えがあるから♪」"

[[dialogue]]
speaker = "オオヒメ"
# 「もはや一寸ほどの信用も置けないのだが……」
line = "「もはや一寸ほどの信用も置けないのだが……」"

[[dialogue]]
speaker = "ラクシャ"
# 「って話してたら、ナイスタイミングで到着したみたいだね」
line = "「って話してたら、ナイスタイミングで到着したみたいだね」"

[[dialogue]]
speaker = "unk"
# メッセージの着信を知らせる通知音にＤＩＳＣを確認したラクシャは、トレーニングルームのドアを開けに行く。
line = "メッセージの着信を知らせる通知音にＤＩＳＣを確認したラクシャは、トレーニングルームのドアを開けに行く。"

[[dialogue]]
speaker = "unk"
# 入ってきたのは──
line = "入ってきたのは──"

[[dialogue]]
speaker = "シルヴィ"
# 「イエーイ♪　シルヴィ・グリムランドですっ！　環ちゃんに頼まれて先生しに来ました～♪」
line = "「イエーイ♪　シルヴィ・グリムランドですっ！　環ちゃんに頼まれて先生しに来ました～♪」"

[[dialogue]]
speaker = "unk"
# シルヴィ・グリムランド。
line = "シルヴィ・グリムランド。"

[[dialogue]]
speaker = "unk"
# 一時期、見習い星騎士の指導のため離れていたが、最近、新星学園に戻ってきた。
line = "一時期、見習い星騎士の指導のため離れていたが、最近、新星学園に戻ってきた。"

[[dialogue]]
speaker = "unk"
# 過去には新星星徒会の副会長を務めていたこともある星騎士だ。
line = "過去には新星星徒会の副会長を務めていたこともある星騎士だ。"

[[dialogue]]
speaker = "ラクシャ"
# 「シルヴィさん、来てくれてありがとー！」
line = "「シルヴィさん、来てくれてありがとー！」"

[[dialogue]]
speaker = "ラクシャ"
# 「なんと彼女はバンド経験者なんだ。さすがに素人だけでライブは無謀すぎるからさ、先生役をお願いしておいたんだよ」
line = "「なんと彼女はバンド経験者なんだ。さすがに素人だけでライブは無謀すぎるからさ、先生役をお願いしておいたんだよ」"

[[dialogue]]
speaker = "シルヴィ"
# 「バンド仲間も連れてきたよ～。あたしの専門はドラムだから、それ以外の楽器もちゃんと教えられるようにって」
line = "「バンド仲間も連れてきたよ～。あたしの専門はドラムだから、それ以外の楽器もちゃんと教えられるようにって」"

[[dialogue]]
speaker = "ラクシャ"
# 「至れり尽くせり感謝だよ～」
line = "「至れり尽くせり感謝だよ～」"

[[dialogue]]
speaker = "シルヴィ"
# 「それだけじゃないよ！　偶然この話を聞いて乗り気になってくれた人も連れて来ちゃったんだよねー」
line = "「それだけじゃないよ！　偶然この話を聞いて乗り気になってくれた人も連れて来ちゃったんだよねー」"

[[dialogue]]
speaker = "レミカ"
# 「みなさん、こんにちは」
line = "「みなさん、こんにちは」"

[[dialogue]]
speaker = "オオヒメ"
# 「レミカ殿！」
line = "「レミカ殿！」"

[[dialogue]]
speaker = "レミカ"
# 「シルヴィ先輩から話を聞いて面白そうだって思ったんだ。よかったら協力させてもらってもいいかな？」
line = "「シルヴィ先輩から話を聞いて面白そうだって思ったんだ。よかったら協力させてもらってもいいかな？」"

[[dialogue]]
speaker = "オオヒメ"
# 「我々にとっては有難いが……レミカ殿は芸能活動で忙しい身ではないか？」
line = "「我々にとっては有難いが……レミカ殿は芸能活動で忙しい身ではないか？」"

[[dialogue]]
speaker = "レミカ"
# 「うん……でも、どうしても協力したいんだ。『リクリエの被害から復興しようと頑張る人々を元気づけたい』って動機に心打たれちゃったから」
line = "「うん……でも、どうしても協力したいんだ。『リクリエの被害から復興しようと頑張る人々を元気づけたい』って動機に心打たれちゃったから」"

[[dialogue]]
speaker = "レミカ"
# 「楽器は専門じゃないけど、ボーカルの事だったら力になれると思うし、ダンスやパフォーマンスの事でも相談に乗れると思うよ？」
line = "「楽器は専門じゃないけど、ボーカルの事だったら力になれると思うし、ダンスやパフォーマンスの事でも相談に乗れると思うよ？」"

[[dialogue]]
speaker = "オオヒメ"
# 「心強い言葉、感謝する。レミカ殿！」
line = "「心強い言葉、感謝する。レミカ殿！」"

[[dialogue]]
speaker = "アルモタヘル"
# 「ふふ、気が付けば盤石の体勢が整っているではないか」
line = "「ふふ、気が付けば盤石の体勢が整っているではないか」"

[[dialogue]]
speaker = "セシア"
# 「これなら何とかなるんじゃないかしら？」
line = "「これなら何とかなるんじゃないかしら？」"

[[dialogue]]
speaker = "ラクシャ"
# 「みんなの<ruby=め>瞳</ruby>に光が<ruby=とも>灯</ruby>る、か……」
line = "「みんなの<ruby>瞳<rt>め</rt></ruby>に光が<ruby>灯<rt>とも</rt></ruby>る、か……」"

[[dialogue]]
speaker = "ラクシャ"
# 「よーし、それじゃさっそく練習開始だよっ♪」
line = "「よーし、それじゃさっそく練習開始だよっ♪」"

[[dialogue]]
speaker = "全員"
# 「おーっ！」
line = "「おーっ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「まさか、あたしのよく通ってたフライドチキンのお店……<ruby=ジーエフシー>ＧＦＣ</ruby>の店員さんが、守護天使様だったなんてね～」
line = "「まさか、あたしのよく通ってたフライドチキンのお店……<ruby>ＧＦＣ<rt>ジーエフシー</rt></ruby>の店員さんが、守護天使様だったなんてね～」"

[[dialogue]]
speaker = "シルヴィ"
# 「店員さんの相棒は後々、新星学園の星徒会長になる子で、しかも世界を救う魔王だったりするし……どうかしてるよね、あのお店！」
line = "「店員さんの相棒は後々、新星学園の星徒会長になる子で、しかも世界を救う魔王だったりするし……どうかしてるよね、あのお店！」"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは～、確かにとんでもない店かも」
line = "「あはは～、確かにとんでもない店かも」"

[[dialogue]]
speaker = "シルヴィ"
# 「でもどうして守護天使が正体を隠してバイトなんかしてたの？」
line = "「でもどうして守護天使が正体を隠してバイトなんかしてたの？」"

[[dialogue]]
speaker = "ラクシャ"
# 「それはまあ、いろいろ事情があってね～」
