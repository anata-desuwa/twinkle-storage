line = "「じゃあたしはこれからも、環ちゃんって呼ぶことにするね♪」"

[[dialogue]]
speaker = "シルヴィ"
# 「それにしてもビックリしたな～。見かけないなーって思ってたらいきなり連絡が来て、素人を集めてバンドを組みたいから助けて、なんて言われるんだもん」
line = "「それにしてもビックリしたな～。見かけないなーって思ってたらいきなり連絡が来て、素人を集めてバンドを組みたいから助けて、なんて言われるんだもん」"

[[dialogue]]
speaker = "ラクシャ"
# 「シルヴィさんと知り合いで本当に良かったよ～」
line = "「シルヴィさんと知り合いで本当に良かったよ～」"

[[dialogue]]
speaker = "シルヴィ"
# 「っていうか環ちゃん、この学園の子とほとんど知り合いなんでしょ？　顔の広さなら１番かもって聞いたよ？」
line = "「っていうか環ちゃん、この学園の子とほとんど知り合いなんでしょ？　顔の広さなら１番かもって聞いたよ？」"

[[dialogue]]
speaker = "ラクシャ"
# 「色んなところにフラフラ顔を出してたからね～。まさかこんな形で活きるとは思わなかったよ」
line = "「色んなところにフラフラ顔を出してたからね～。まさかこんな形で活きるとは思わなかったよ」"

[[dialogue]]
speaker = "ラクシャ"
