[[dialogue]]
speaker = "シルヴィ"
# 「っていうか環ちゃんも練習しなきゃだよ～」
line = "「っていうか環ちゃんも練習しなきゃだよ～」"

[[dialogue]]
speaker = "ラクシャ"
# 「もっちろん！　めっちゃするよー♪」
line = "「もっちろん！　めっちゃするよー♪」"

[[dialogue]]
speaker = "unk"
# シルヴィはマグダレナの隣について、リズムの刻み方を教える。
