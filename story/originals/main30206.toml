line = "「そもそも私たちは全員、楽器の扱い方すら知らない初心者ですからね……」"

[[dialogue]]
speaker = "オオヒメ"
# 「というかラクシャ、発案者のあなたもまったく弾けていないではないか！　どういうことなのだ！」
line = "「というかラクシャ、発案者のあなたもまったく弾けていないではないか！　どういうことなのだ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「そんなこと言われても、ボクだってみんなと同じ未経験者だし～」
line = "「そんなこと言われても、ボクだってみんなと同じ未経験者だし～」"

[[dialogue]]
speaker = "オオヒメ"
# 「だったらどうして、バンドを組もうなどと言い始めたのだ……」
line = "「だったらどうして、バンドを組もうなどと言い始めたのだ……」"

[[dialogue]]
speaker = "パテル"
# 「いや～、思ってた以上にひどい状態だね～。残念だけどもう諦めた方がいいんじゃない？」
line = "「いや～、思ってた以上にひどい状態だね～。残念だけどもう諦めた方がいいんじゃない？」"

[[dialogue]]
speaker = "ラクシャ"
# 「あれ？　でもパテルはちゃんと弾けてたよね？」
line = "「あれ？　でもパテルはちゃんと弾けてたよね？」"

[[dialogue]]
speaker = "オオヒメ"
# 「やはり経験者だったのか？」
line = "「やはり経験者だったのか？」"

[[dialogue]]
speaker = "パテル"
# 「ううん。本当に未経験者だよ。でもまあ、動画を見て何となくやってみたら出来ちゃった」
line = "「ううん。本当に未経験者だよ。でもまあ、動画を見て何となくやってみたら出来ちゃった」"

[[dialogue]]
speaker = "ラクシャ"
# 「て、天才っ！？」
line = "「て、天才っ！？」"

[[dialogue]]
speaker = "パテル"
# 「どうして勧誘した本人が驚いてるのかな……」
line = "「どうして勧誘した本人が驚いてるのかな……」"

[[dialogue]]
speaker = "アルモタヘル"
# 「しかし、このままではライブで演奏はおろか、まともに音を奏でる事すら出来そうにないが？」
line = "「しかし、このままではライブで演奏はおろか、まともに音を奏でる事すら出来そうにないが？」"

[[dialogue]]
speaker = "ラクシャ"
