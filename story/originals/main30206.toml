[[dialogue]]
speaker = "ラクシャ"
# 「今までの顔見知りには『市倉環』でお願いしたいかな～。敬語もいらないから♪」
line = "「今までの顔見知りには『市倉環』でお願いしたいかな～。敬語もいらないから♪」"

[[dialogue]]
speaker = "シルヴィ"
