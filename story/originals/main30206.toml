line = "「ぶっちゃけ、普通に考えたら無理だよね～。でも、やれるだけのことは全部やってみるよ」"

[[dialogue]]
speaker = "シルヴィ"
# 「バンドに興味を持ってくれたの、やっぱ嬉しかったからね。経験者としてはやっぱり力になりたいじゃない？」
line = "「バンドに興味を持ってくれたの、やっぱ嬉しかったからね。経験者としてはやっぱり力になりたいじゃない？」"

[[dialogue]]
speaker = "ラクシャ"
