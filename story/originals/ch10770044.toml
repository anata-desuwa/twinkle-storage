[[dialogue]]
speaker = "unk"
# 第４話,ご主人様の求めなら,P
line = "第４話,ご主人様の求めなら,P"

[[dialogue]]
speaker = "蘭美"
# 「今日の家デートのテーマは──癒しよ！！」
line = "「今日の家デートのテーマは──癒しよ！！」"

[[dialogue]]
speaker = "unk"
# また急だなぁ……
line = "また急だなぁ……"

[[dialogue]]
speaker = "蘭美"
# 「そんなことないわ！　私、以前から思っていたのよ。会長の日常は、あまりに忙しすぎるって！」
line = "「そんなことないわ！　私、以前から思っていたのよ。会長の日常は、あまりに忙しすぎるって！」"

[[dialogue]]
speaker = "蘭美"
# 「シエスタが誘拐事件を起こしたのだって、星徒会長である貴方の激務を心配したからでしょう？」
line = "「シエスタが誘拐事件を起こしたのだって、星徒会長である貴方の激務を心配したからでしょう？」"

[[dialogue]]
speaker = "蘭美"
# 「貴方の恋人として、婚約者として、専属メイドとして！　もう二度と、あんな事件は起こさせないわ！」
line = "「貴方の恋人として、婚約者として、専属メイドとして！　もう二度と、あんな事件は起こさせないわ！」"

[[dialogue]]
speaker = "蘭美"
# 「これからは、今まで以上に尽くして、尽くして、尽くしぬいて！　貴方を支えてあげるんだから！」
line = "「これからは、今まで以上に尽くして、尽くして、尽くしぬいて！　貴方を支えてあげるんだから！」"

[[dialogue]]
speaker = "unk"
# じゃあ今日１日、蘭美は……
line = "じゃあ今日１日、蘭美は……"

[[dialogue]]
speaker = "蘭美"
# 「ええ。貴方を全力で癒やしてあげる。リクエストだって何でも聞いてあげるわよ！」
line = "「ええ。貴方を全力で癒やしてあげる。リクエストだって何でも聞いてあげるわよ！」"

[[dialogue]]
speaker = "unk"
# だったら──
line = "だったら──"

[[dialogue]]
speaker = "蘭美"
# 「……私を膝上に乗せて、スキンシップがしたい？　ふふ、ずいぶんと控えめなおねだりなのね？」
line = "「……私を膝上に乗せて、スキンシップがしたい？　ふふ、ずいぶんと控えめなおねだりなのね？」"

[[dialogue]]
speaker = "蘭美"
# 「いいわ！　それじゃあ、ベッドに座りなさいっ♪」
line = "「いいわ！　それじゃあ、ベッドに座りなさいっ♪」"

[[dialogue]]
speaker = "蘭美"
# 「ん──しょっ。ふふ、貴方の太もも、すっかり私の特等席ね。でもいいのかしら？」
line = "「ん──しょっ。ふふ、貴方の太もも、すっかり私の特等席ね。でもいいのかしら？」"

[[dialogue]]
speaker = "蘭美"
# 「これ、疲れちゃわないかしら？　私が膝枕でもしてあげた方が、癒やされるような気がするのだけれど……」
line = "「これ、疲れちゃわないかしら？　私が膝枕でもしてあげた方が、癒やされるような気がするのだけれど……」"

[[dialogue]]
speaker = "unk"
# 膝枕だと、蘭美をぎゅってできないから
line = "膝枕だと、蘭美をぎゅってできないから"

[[dialogue]]
speaker = "蘭美"
# 「ぴゃっ！？　ん、んぅ……<emoji=heart04>　会長ったら、遠慮なく私のこと、ぎゅーってして……<emoji=heart04>」
line = "「ぴゃっ！？　ん、んぅ……<emoji=heart04>　会長ったら、遠慮なく私のこと、ぎゅーってして……<emoji=heart04>」"

[[dialogue]]
speaker = "蘭美"
# 「──ううん。痛くなんてないわ。あったかくて、安心する感じ……貴方も同じ気持ちなの？」
