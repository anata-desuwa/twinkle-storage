[[dialogue]]
speaker = "蘭美"
# 「ふふ、私をハグして癒やされるんだったら、好きなだけさせてあげるわ。もっと強くぎゅーってしていいわよ♪」
line = "「ふふ、私をハグして癒やされるんだったら、好きなだけさせてあげるわ。もっと強くぎゅーってしていいわよ♪」"

[[dialogue]]
