[[dialogue]]
speaker = "unk"
# 第４話,愛するあなたと未来の約束を,P
line = "第４話,愛するあなたと未来の約束を,P"

[[dialogue]]
speaker = "unk"
# 浅草での放課後デートを散々楽しんだその後──ミウを自宅まで送り届ける帰り道。
line = "浅草での放課後デートを散々楽しんだその後──ミウを自宅まで送り届ける帰り道。"

[[dialogue]]
speaker = "unk"
# 日は落ち、すっかり暗くなってしまった。
line = "日は落ち、すっかり暗くなってしまった。"

[[dialogue]]
speaker = "ミウ"
# 「デート、とっても楽しかったです。また会長さんとの想い出が増えちゃいましたね」
line = "「デート、とっても楽しかったです。また会長さんとの想い出が増えちゃいましたね」"

[[dialogue]]
speaker = "ミウ"
# 「まだまだ一緒にいたいですけど……門限もありますし、わがまま言っちゃダメですよね……」
line = "「まだまだ一緒にいたいですけど……門限もありますし、わがまま言っちゃダメですよね……」"

[[dialogue]]
speaker = "ミウ"
# 「明日も、明後日も、会長さんには会えますもんね……」
line = "「明日も、明後日も、会長さんには会えますもんね……」"

[[dialogue]]
speaker = "unk"
# 家が近づくにつれ、ミウのテンションとトーンは少しずつ下がっていく。
line = "家が近づくにつれ、ミウのテンションとトーンは少しずつ下がっていく。"

[[dialogue]]
speaker = "unk"
# しかし、反比例するように手を握る力は強まっていた。
line = "しかし、反比例するように手を握る力は強まっていた。"

[[dialogue]]
speaker = "ミウ"
# 「あ……着いちゃいました……」
line = "「あ……着いちゃいました……」"

[[dialogue]]
speaker = "ミウ"
# 「会長さんのお家は逆方向なのに、わざわざ送ってくれて、ありがとうございました」
line = "「会長さんのお家は逆方向なのに、わざわざ送ってくれて、ありがとうございました」"

[[dialogue]]
speaker = "unk"
# 夜道は危ないからね
line = "夜道は危ないからね"

[[dialogue]]
speaker = "ミウ"
# 「ふふ、忘れてませんか？　私はゴールデングースの社員ですよ？　不審者なんて逆にバーンとやっつけちゃいます」
line = "「ふふ、忘れてませんか？　私はゴールデングースの社員ですよ？　不審者なんて逆にバーンとやっつけちゃいます」"

[[dialogue]]
speaker = "ミウ"
# 「でも、少しでも会長さんと長く過ごせたのが嬉しいです。ちょっぴり遠回りした甲斐もありました」
line = "「でも、少しでも会長さんと長く過ごせたのが嬉しいです。ちょっぴり遠回りした甲斐もありました」"

[[dialogue]]
speaker = "unk"
# そのまま家の前で立ち話。ミウはなかなか家に入ろうとはしなかった。
line = "そのまま家の前で立ち話。ミウはなかなか家に入ろうとはしなかった。"

[[dialogue]]
speaker = "ミウ"
# 「あーあ……早く大人になりたいな……」
line = "「あーあ……早く大人になりたいな……」"

[[dialogue]]
speaker = "unk"
# どうして？
line = "どうして？"

[[dialogue]]
speaker = "ミウ"
# 「だって……大人になれば、会長さんと一緒に暮らせるようになるじゃないですか」
line = "「だって……大人になれば、会長さんと一緒に暮らせるようになるじゃないですか」"

[[dialogue]]
speaker = "ミウ"
# 「別れを惜しむこともなくなりますし、おはようからおやすみまで、会長さんの顔を見ながら過ごせますもんね」
line = "「別れを惜しむこともなくなりますし、おはようからおやすみまで、会長さんの顔を見ながら過ごせますもんね」"

[[dialogue]]
speaker = "ミウ"
# 「それってすごく楽しくて、幸せな毎日だと思うんです」
line = "「それってすごく楽しくて、幸せな毎日だと思うんです」"

[[dialogue]]
speaker = "ミウ"
# 「うぅ……いやです……さよならしたくないです……でも、会長さんを困らせたくもないんです……」
line = "「うぅ……いやです……さよならしたくないです……でも、会長さんを困らせたくもないんです……」"

[[dialogue]]
speaker = "ミウ"
# 「私、仕事とプライベートは切り離せるタイプだと思っていました。両親や、親友や、会長さんですら必要ならばプランに組み込めると思ってました」
line = "「私、仕事とプライベートは切り離せるタイプだと思っていました。両親や、親友や、会長さんですら必要ならばプランに組み込めると思ってました」"

[[dialogue]]
speaker = "ミウ"
# 「でも、今はもう無理です……私の心は会長さんに奪われちゃいました」
line = "「でも、今はもう無理です……私の心は会長さんに奪われちゃいました」"

[[dialogue]]
speaker = "ミウ"
# 「全てにおいて会長さんが最優先です。あなたのためなら、なんだってできるつもりです」
line = "「全てにおいて会長さんが最優先です。あなたのためなら、なんだってできるつもりです」"

[[dialogue]]
speaker = "ミウ"
# 「自分がこんなにも誰かに依存しちゃうタイプだなんて思ってもみませんでした」
line = "「自分がこんなにも誰かに依存しちゃうタイプだなんて思ってもみませんでした」"

[[dialogue]]
speaker = "ミウ"
# 「恋ってプランの枠に収まってくれなくて、未知数すぎて怖いものなんですね」
line = "「恋ってプランの枠に収まってくれなくて、未知数すぎて怖いものなんですね」"

[[dialogue]]
speaker = "ミウ"
# 「大好きです、会長さん。いくら口にしても、伝えきれなくて、言い足りないです」
line = "「大好きです、会長さん。いくら口にしても、伝えきれなくて、言い足りないです」"

[[dialogue]]
speaker = "unk"
# いつか、必ず一緒に暮らそうね
line = "いつか、必ず一緒に暮らそうね"

[[dialogue]]
speaker = "unk"
# 俺もミウが大好きだよ
line = "俺もミウが大好きだよ"

[[dialogue]]
speaker = "ミウ"
# 「はい<emoji=heart04>　約束です。でも、口約束だけで信用するほど、私はお子様じゃありませんよ？」
line = "「はい<emoji=heart04>　約束です。でも、口約束だけで信用するほど、私はお子様じゃありませんよ？」"

[[dialogue]]
speaker = "unk"
# それじゃ、約束代わりに──
line = "それじゃ、約束代わりに──"

[[dialogue]]
speaker = "ミウ"
# 「え……？　か、会長さん、何を……！？」
line = "「え……？　か、会長さん、何を……！？」"

[[dialogue]]
speaker = "ミウ"
# 「んぅ、ちゅっ、ちゅ……<emoji=heart04>　んぅ、ぷぁはっ……！」
line = "「んぅ、ちゅっ、ちゅ……<emoji=heart04>　んぅ、ぷぁはっ……！」"

[[dialogue]]
speaker = "ミウ"
# 「か、会長さんっ……！？　外で……しかも、家の前でキスするなんて……！」
line = "「か、会長さんっ……！？　外で……しかも、家の前でキスするなんて……！」"

[[dialogue]]
speaker = "unk"
# これもある意味、口約束かな
line = "これもある意味、口約束かな"

[[dialogue]]
speaker = "unk"
# 初めてじゃないでしょ？
line = "初めてじゃないでしょ？"

[[dialogue]]
speaker = "ミウ"
# 「そ、そ、そうですけどっ……！　いつもは誰もいない部屋とかで……外でしたなんて初めてですし……」
line = "「そ、そ、そうですけどっ……！　いつもは誰もいない部屋とかで……外でしたなんて初めてですし……」"

[[dialogue]]
speaker = "ミウ"
# 「誰かに……ウチの両親にでも見られてたら、どうするつもりなんですか……！？」
line = "「誰かに……ウチの両親にでも見られてたら、どうするつもりなんですか……！？」"

[[dialogue]]
speaker = "unk"
# 娘さんを僕に──
line = "娘さんを僕に──"

[[dialogue]]
speaker = "unk"
# ご挨拶する！
line = "ご挨拶する！"

[[dialogue]]
speaker = "ミウ"
# 「いくらなんでも、急展開すぎませんか！？」
line = "「いくらなんでも、急展開すぎませんか！？」"

[[dialogue]]
speaker = "ミウ"
# 「もう……会長さんの破天荒さは私のプランから外れてばかりです……思考が追いつきません。そのせいでプランがちっとも役に立たないです」
line = "「もう……会長さんの破天荒さは私のプランから外れてばかりです……思考が追いつきません。そのせいでプランがちっとも役に立たないです」"

[[dialogue]]
speaker = "ミウ"
# 「でも、想像できないからこそ、吊り橋効果みたいにドキドキさせられて……会長さんのことをどんどん好きになってしまうんでしょうね」
line = "「でも、想像できないからこそ、吊り橋効果みたいにドキドキさせられて……会長さんのことをどんどん好きになってしまうんでしょうね」"

[[dialogue]]
speaker = "unk"
# 可愛すぎて、キスを我慢できなかった
line = "可愛すぎて、キスを我慢できなかった"

[[dialogue]]
speaker = "unk"
# 俺もミウのプランにハメられっぱなしだよ
line = "俺もミウのプランにハメられっぱなしだよ"

[[dialogue]]
speaker = "ミウ"
# 「え……会長さん──私にメロメロなんですか？　ふふ、ふふふ<emoji=heart04>　なんだ、やられてるのは私だけじゃなかったんですね」
line = "「え……会長さん──私にメロメロなんですか？　ふふ、ふふふ<emoji=heart04>　なんだ、やられてるのは私だけじゃなかったんですね」"

[[dialogue]]
speaker = "ミウ"
# 「お互い様だなんて、私たち相性抜群かもですね」
line = "「お互い様だなんて、私たち相性抜群かもですね」"

[[dialogue]]
speaker = "ミウ"
# 「ふふ、会長さんにキスしてもらったおかげですかね？　お別れがちょっとだけ辛くなくなりました」
line = "「ふふ、会長さんにキスしてもらったおかげですかね？　お別れがちょっとだけ辛くなくなりました」"

[[dialogue]]
speaker = "ミウ"
# 「それでは、また明日。だぁい好きです、会長さん<emoji=heart04>」
line = "「それでは、また明日。だぁい好きです、会長さん<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 名残惜しいけど、ミウとはお別れだ。
line = "名残惜しいけど、ミウとはお別れだ。"

[[dialogue]]
speaker = "unk"
# さっきまで繋いでいた手を振りながら、次第に距離を取る。
line = "さっきまで繋いでいた手を振りながら、次第に距離を取る。"

[[dialogue]]
speaker = "unk"
# そのまま帰路につくが……互いの姿が見えなくなるまで、ずっと手を振り続けていたのだった。
line = "そのまま帰路につくが……互いの姿が見えなくなるまで、ずっと手を振り続けていたのだった。"
