[[dialogue]]
speaker = "unk"
# 合体チキンモンスターを倒したことで、合体していたチキンが雨のように降ってくる。
line = "合体チキンモンスターを倒したことで、合体していたチキンが雨のように降ってくる。"

[[dialogue]]
speaker = "シルヴィ"
# 「リップルちゃん、お願い！」
line = "「リップルちゃん、お願い！」"

[[dialogue]]
speaker = "リップル"
# 「イエーッス！！　保存結界！」
line = "「イエーッス！！　保存結界！」"

[[dialogue]]
speaker = "コハルコ"
# 「大きなビニール袋みたいな結界がチキンを包み込んじゃった……。リップルさんは相変わらずすごいや……」
line = "「大きなビニール袋みたいな結界がチキンを包み込んじゃった……。リップルさんは相変わらずすごいや……」"

[[dialogue]]
speaker = "リップル"
# 「イエイエ、それほどでもナイで－す！」
line = "「イエイエ、それほどでもナイで－す！」"

[[dialogue]]
speaker = "コハルコ"
# 「それほどでもあると思うけど……それより、この大量のチキンどうしようか？」
line = "「それほどでもあると思うけど……それより、この大量のチキンどうしようか？」"

[[dialogue]]
speaker = "シルヴィ"
# 「食べればいいんじゃない？　フライドチキンパーティーだっ！　う～ん、うまっ！」
line = "「食べればいいんじゃない？　フライドチキンパーティーだっ！　う～ん、うまっ！」"

[[dialogue]]
speaker = "コハルコ"
# 「もう食べてるし……はぁ、それしかないか。私たちだけじゃ食べきれないし、ヘルプ呼ぶね」
line = "「もう食べてるし……はぁ、それしかないか。私たちだけじゃ食べきれないし、ヘルプ呼ぶね」"

[[dialogue]]
speaker = "コハルコ"
# 「もしもし、私だけど……いや、詐欺じゃないって。手が空いてたら学園まで来て欲しいんだけど……近くまで来てる？　なら話が早いね。リゾート結界で待ってるから」
line = "「もしもし、私だけど……いや、詐欺じゃないって。手が空いてたら学園まで来て欲しいんだけど……近くまで来てる？　なら話が早いね。リゾート結界で待ってるから」"

[[dialogue]]
speaker = "コハルコ"
# 「１名追加で来れるって」
line = "「１名追加で来れるって」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしはもう呼んであるよ～」
line = "「あたしはもう呼んであるよ～」"

[[dialogue]]
speaker = "サーシャ"
# 「シルヴィ、お待たせ。フライドチキン狩りってどういうこと～？」
line = "「シルヴィ、お待たせ。フライドチキン狩りってどういうこと～？」"

[[dialogue]]
speaker = "シルヴィ"
# 「やっほー、サーシャ。ごめん、チキン狩りはもう終わって今は食べ放題やってるとこ」
line = "「やっほー、サーシャ。ごめん、チキン狩りはもう終わって今は食べ放題やってるとこ」"

[[dialogue]]
speaker = "サーシャ"
# 「はぁ……とりあえずフライドチキンは食べていいのね～？」
line = "「はぁ……とりあえずフライドチキンは食べていいのね～？」"

[[dialogue]]
speaker = "シルヴィ"
# 「そうそう、いっぱいあるからたくさん食べて！」
line = "「そうそう、いっぱいあるからたくさん食べて！」"

[[dialogue]]
speaker = "アニマ"
# 「やあ諸君、ご機嫌ヨウ。首尾は……聞くまでもないようダナ」
line = "「やあ諸君、ご機嫌ヨウ。首尾は……聞くまでもないようダナ」"

[[dialogue]]
speaker = "シュティレ"
# 「皆さん、お疲れさまでした。フライドチキンマシンの暴走を止めていただき、ありがとうございます」
line = "「皆さん、お疲れさまでした。フライドチキンマシンの暴走を止めていただき、ありがとうございます」"

[[dialogue]]
speaker = "アニマ"
# 「会長、暴走の原因は……フムフム……ベガから転移してきたモンスターがマシンに入り込んでいたのカ」
line = "「会長、暴走の原因は……フムフム……ベガから転移してきたモンスターがマシンに入り込んでいたのカ」"

[[dialogue]]
speaker = "アニマ"
# 「モンスターが出現する以上、モンスターかリクリエが関わっているハズだとは考えていたが、ナルホドそういうことだったのカ。対策も考えなくてはナ」
line = "「モンスターが出現する以上、モンスターかリクリエが関わっているハズだとは考えていたが、ナルホドそういうことだったのカ。対策も考えなくてはナ」"

[[dialogue]]
speaker = "シュティレ"
# 「まずはチキンを食べましょう、マスター。腹が減っては研究はできません」
line = "「まずはチキンを食べましょう、マスター。腹が減っては研究はできません」"

[[dialogue]]
speaker = "トリュファイナ"
# 「コハルコさ～ん！」
line = "「コハルコさ～ん！」"

[[dialogue]]
speaker = "コハルコ"
# 「おっと」
line = "「おっと」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ありがとうございます、コハルコさん！　私、なんてお礼を言ったらいいか……」
line = "「ありがとうございます、コハルコさん！　私、なんてお礼を言ったらいいか……」"

[[dialogue]]
speaker = "コハルコ"
# 「いえ……むしろ私が謝りたいくらいというか、セキュリティに穴を開けてしまったというか……」
line = "「いえ……むしろ私が謝りたいくらいというか、セキュリティに穴を開けてしまったというか……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「いいえ、コハルコさん。原因が何であれ、あなたは落ち込む私を励まして、問題を解決してくださいました」
line = "「いいえ、コハルコさん。原因が何であれ、あなたは落ち込む私を励まして、問題を解決してくださいました」"

[[dialogue]]
speaker = "トリュファイナ"
# 「あなたが私を救ってくださったことに何ひとつ変わりはないのです。だから、ありがとうございます」
line = "「あなたが私を救ってくださったことに何ひとつ変わりはないのです。だから、ありがとうございます」"

[[dialogue]]
speaker = "コハルコ"
# 「……はい。どういたしまして」
line = "「……はい。どういたしまして」"

[[dialogue]]
speaker = "コハルコ"
# （この人には敵わないなぁ。たぶんずっと）
line = "（この人には敵わないなぁ。たぶんずっと）"

[[dialogue]]
speaker = "トリュファイナ"
# 「コハルコさん、さすが『じゃすてぃすうぃざーど』ですね！」
line = "「コハルコさん、さすが『じゃすてぃすうぃざーど』ですね！」"

[[dialogue]]
speaker = "コハルコ"
# 「…………は？」
line = "「…………は？」"

[[dialogue]]
speaker = "コハルコ"
# 「トリュファイナさん、その……けったいな呼び名はどこから……？」
line = "「トリュファイナさん、その……けったいな呼び名はどこから……？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「え？　いつもチキンをたくさん買ってくださる方から……」
line = "「え？　いつもチキンをたくさん買ってくださる方から……」"

[[dialogue]]
speaker = "レイラ"
# 「コハルコさん、お疲れ様で～す」
line = "「コハルコさん、お疲れ様で～す」"

[[dialogue]]
speaker = "トリュファイナ"
# 「あ、こちらの方です！」
line = "「あ、こちらの方です！」"

[[dialogue]]
speaker = "コハルコ"
# 「やっぱりおまえかーー！！」
line = "「やっぱりおまえかーー！！」"

[[dialogue]]
speaker = "レイラ"
# 「え、なんですか！？　私はコハルコさんに呼ばれただけなのにー！？」
line = "「え、なんですか！？　私はコハルコさんに呼ばれただけなのにー！？」"

[[dialogue]]
speaker = "コハルコ"
# 「しれっとクソダサネームを広めるなー！！　ドルフィンドローン、ハイドロジェット逆噴射！！」
line = "「しれっとクソダサネームを広めるなー！！　ドルフィンドローン、ハイドロジェット逆噴射！！」"

[[dialogue]]
speaker = "レイラ"
# 「ほんぎゃー！！」
line = "「ほんぎゃー！！」"

[[dialogue]]
speaker = "サーシャ"
# 「ふふっ、なんだか賑やかね～」
line = "「ふふっ、なんだか賑やかね～」"

[[dialogue]]
speaker = "シルヴィ"
# 「コハルコがあんなに怒るの珍しいよねー。あははっ！」
line = "「コハルコがあんなに怒るの珍しいよねー。あははっ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「……楽しいね、サーシャ」
line = "「……楽しいね、サーシャ」"

[[dialogue]]
speaker = "サーシャ"
# 「ええ、そうね」
line = "「ええ、そうね」"

[[dialogue]]
speaker = "シルヴィ"
# 「卒業したら、こんなに楽しいのも終わりなのかな？」
line = "「卒業したら、こんなに楽しいのも終わりなのかな？」"

[[dialogue]]
speaker = "サーシャ"
# 「どうしたの？　妙に湿っぽいわね。でも、そうね……」
line = "「どうしたの？　妙に湿っぽいわね。でも、そうね……」"

[[dialogue]]
speaker = "サーシャ"
# 「卒業しても、何も終わりじゃないわ。一度道が分かれても、何度だって、また会えばいいのよ。だって私たちは──」
line = "「卒業しても、何も終わりじゃないわ。一度道が分かれても、何度だって、また会えばいいのよ。だって私たちは──」"

[[dialogue]]
speaker = "シルヴィ"
# 「離れていても、友達だもんね」
line = "「離れていても、友達だもんね」"

[[dialogue]]
speaker = "シルヴィ"
# 「あーあ、なんか考え事してたらお腹すいてきちゃった。フライドチキンおかわりー！」
line = "「あーあ、なんか考え事してたらお腹すいてきちゃった。フライドチキンおかわりー！」"

[[dialogue]]
speaker = "サーシャ"
# 「ふふっ、私ももうひとつもらおうかしら～」
line = "「ふふっ、私ももうひとつもらおうかしら～」"

[[dialogue]]
speaker = "リップル"
# 「ドリンクもありますよ～！　サイダー、コーラにオレンジジュース、ナンでもありま～す！」
line = "「ドリンクもありますよ～！　サイダー、コーラにオレンジジュース、ナンでもありま～す！」"

[[dialogue]]
speaker = "シルヴィ"
# 「じゃあ、あたしオレンジジュースで！」
line = "「じゃあ、あたしオレンジジュースで！」"

[[dialogue]]
speaker = "サーシャ"
# 「私はアイスコーヒーでお願い～」
line = "「私はアイスコーヒーでお願い～」"

[[dialogue]]
speaker = "リップル"
# 「ハ～イ、タダイマ！」
line = "「ハ～イ、タダイマ！」"

[[dialogue]]
speaker = "レイラ"
# 「あ、私はイチゴ練乳のかき氷でお願いします」
line = "「あ、私はイチゴ練乳のかき氷でお願いします」"

[[dialogue]]
speaker = "コハルコ"
# 「かき氷はドリンクじゃないって！」
line = "「かき氷はドリンクじゃないって！」"

[[dialogue]]
speaker = "レイラ"
# 「えぇ！？　かき氷はもともと液体なので飲み物ですよね！？」
line = "「えぇ！？　かき氷はもともと液体なので飲み物ですよね！？」"

[[dialogue]]
speaker = "コハルコ"
# 「さも当たり前みたいに言わないの。ほらレイラ、フライドチキン好きなだけ食べていいから」
line = "「さも当たり前みたいに言わないの。ほらレイラ、フライドチキン好きなだけ食べていいから」"

[[dialogue]]
speaker = "レイラ"
# 「いいんですか！？　ありがとうございます！　……ひゅごっ……ひゅごっ…………うめ……うめ……」
line = "「いいんですか！？　ありがとうございます！　……ひゅごっ……ひゅごっ…………うめ……うめ……」"

[[dialogue]]
speaker = "シルヴィ"
# 「すごい食べっぷり！　あたしも負けないよ！　……もぐもぐ……もぐ……」
line = "「すごい食べっぷり！　あたしも負けないよ！　……もぐもぐ……もぐ……」"

[[dialogue]]
speaker = "コハルコ"
# 「レイラと張り合ったら胃袋がいくつあっても足りないからやめときなって」
line = "「レイラと張り合ったら胃袋がいくつあっても足りないからやめときなって」"

[[dialogue]]
speaker = "シルヴィ"
# 「あ」
line = "「あ」"

[[dialogue]]
speaker = "コハルコ"
# 「どうしたの、突然」
line = "「どうしたの、突然」"

[[dialogue]]
speaker = "シルヴィ"
# 「フライドチキンで忘れてたけどさ…………」
line = "「フライドチキンで忘れてたけどさ…………」"

[[dialogue]]
speaker = "シルヴィ"
# 「コハルコ、泳げるようになった？　練習、途中だったよね」
line = "「コハルコ、泳げるようになった？　練習、途中だったよね」"

[[dialogue]]
speaker = "コハルコ"
# 「……………………………あ」
line = "「……………………………あ」"

[[dialogue]]
speaker = "コハルコ"
# 「忘れてた～～～～～～～～～～！！」
line = "「忘れてた～～～～～～～～～～！！」"

[[dialogue]]
speaker = "コハルコ"
# 「うぅ……どうせなら忘れたままでいたかった……」
line = "「うぅ……どうせなら忘れたままでいたかった……」"

[[dialogue]]
speaker = "コハルコ"
# 「フライドチキンはこりごり……しばらく見なくていいかな……」
line = "「フライドチキンはこりごり……しばらく見なくていいかな……」"

[[dialogue]]
speaker = "シルヴィ"
# 「えぇ？　こんなに美味しいのにね」
line = "「えぇ？　こんなに美味しいのにね」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしは何度でもウェルカムだよ！　あ、でも次があるなら、他の味も欲しいかな！　あははっ！」
line = "「あたしは何度でもウェルカムだよ！　あ、でも次があるなら、他の味も欲しいかな！　あははっ！」"

[[dialogue]]
speaker = "unk"
# フライドチキンを両手に、シルヴィ先輩はそう言って笑うのだった。
line = "フライドチキンを両手に、シルヴィ先輩はそう言って笑うのだった。"
