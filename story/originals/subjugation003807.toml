[[dialogue]]
speaker = "モンスター"
# 「ビガ！？」
line = "「ビガ！？」"

[[dialogue]]
speaker = "シルヴィ"
# 「マシンの中からなんか出てきた！？」
line = "「マシンの中からなんか出てきた！？」"

[[dialogue]]
speaker = "コハルコ"
# 「多分、あれがマシン暴走の原因。機械型モンスターがマシンに入り込んで、チキンをモンスター化させていたんだよ」
line = "「多分、あれがマシン暴走の原因。機械型モンスターがマシンに入り込んで、チキンをモンスター化させていたんだよ」"

[[dialogue]]
speaker = "シルヴィ"
# 「え、でも、あのモンスターどこから入ってきたの！？　モンスターが出たらアラーム鳴るよね？」
line = "「え、でも、あのモンスターどこから入ってきたの！？　モンスターが出たらアラーム鳴るよね？」"

[[dialogue]]
speaker = "コハルコ"
# 「すぐフライドチキンマシンの中に入り込んだから、検知システムに引っかからなかったんだと思う」
line = "「すぐフライドチキンマシンの中に入り込んだから、検知システムに引っかからなかったんだと思う」"

[[dialogue]]
speaker = "コハルコ"
# 「並行世界ベガから転移してきたのかもしれない。魔界でもそうやってモンスターが現れたってネビュラから報告があったはず……」
line = "「並行世界ベガから転移してきたのかもしれない。魔界でもそうやってモンスターが現れたってネビュラから報告があったはず……」"

[[dialogue]]
speaker = "シルヴィ"
# 「さすがコハルコ、詳しいね～」
line = "「さすがコハルコ、詳しいね～」"

[[dialogue]]
speaker = "コハルコ"
# 「だって、現行のシステム組んだの私だし」
line = "「だって、現行のシステム組んだの私だし」"

[[dialogue]]
speaker = "シルヴィ"
# 「そう言うと思った！」
line = "「そう言うと思った！」"

[[dialogue]]
speaker = "コハルコ"
# 「今回、一番悪いのはアニマさんでもトリュファイナさんでもなく私だ。この私がセキュリティの穴を見逃すなんて、不甲斐ない……」
line = "「今回、一番悪いのはアニマさんでもトリュファイナさんでもなく私だ。この私がセキュリティの穴を見逃すなんて、不甲斐ない……」"

[[dialogue]]
speaker = "シルヴィ"
# 「それは違うよ、コハルコ」
line = "「それは違うよ、コハルコ」"

[[dialogue]]
speaker = "コハルコ"
# 「シルヴィ……」
line = "「シルヴィ……」"

[[dialogue]]
speaker = "シルヴィ"
# 「悪いのはモンスターだよ。誰かのせいじゃない。それに、モンスターはみんなで倒すものでしょ。あたしたち星騎士みんなで！」
line = "「悪いのはモンスターだよ。誰かのせいじゃない。それに、モンスターはみんなで倒すものでしょ。あたしたち星騎士みんなで！」"

[[dialogue]]
speaker = "シルヴィ"
# 「ね、会長くん、リップルちゃん！」
line = "「ね、会長くん、リップルちゃん！」"

[[dialogue]]
speaker = "リップル"
# 「オフコ－ス！」
line = "「オフコ－ス！」"

[[dialogue]]
speaker = "unk"
# はい！
line = "はい！"

[[dialogue]]
speaker = "コハルコ"
# 「ありがとう、みんな。反省は後回しにして、今はモンスターを──あれ、なんか様子が……？」
line = "「ありがとう、みんな。反省は後回しにして、今はモンスターを──あれ、なんか様子が……？」"

[[dialogue]]
speaker = "モンスター"
# 「ビガー！！」
line = "「ビガー！！」"

[[dialogue]]
speaker = "モンスター"
# 「チキチキチー！！」
line = "「チキチキチー！！」"

[[dialogue]]
speaker = "シルヴィ"
# 「チキンが光ったーーー！！」
line = "「チキンが光ったーーー！！」"

[[dialogue]]
speaker = "コハルコ"
# 「なんで嬉しそうなの！？」
line = "「なんで嬉しそうなの！？」"

[[dialogue]]
speaker = "シルヴィ"
# 「いやだって！　こんな強そうなチキン見るの生まれて初めてだから、つい！」
line = "「いやだって！　こんな強そうなチキン見るの生まれて初めてだから、つい！」"

[[dialogue]]
speaker = "コハルコ"
# 「ついじゃない！　相手はモンスターなんだからね、分かってる？」
line = "「ついじゃない！　相手はモンスターなんだからね、分かってる？」"

[[dialogue]]
speaker = "シルヴィ"
# 「分かってる分かってる！」
line = "「分かってる分かってる！」"

[[dialogue]]
speaker = "コハルコ"
# （どんなピンチでも自然体なのはいいことなんだけど、緊張感がないようにも見えるよね。サーシャが星徒会に入れるの迷ったのも分かるなぁ……）
line = "（どんなピンチでも自然体なのはいいことなんだけど、緊張感がないようにも見えるよね。サーシャが星徒会に入れるの迷ったのも分かるなぁ……）"

[[dialogue]]
speaker = "シルヴィ"
# 「どったの？」
line = "「どったの？」"

[[dialogue]]
speaker = "コハルコ"
# 「ううん、なんでもない。シルヴィ、変わらないなと思って」
line = "「ううん、なんでもない。シルヴィ、変わらないなと思って」"

[[dialogue]]
speaker = "シルヴィ"
# 「んー？？？」
line = "「んー？？？」"

[[dialogue]]
speaker = "コハルコ"
# 「いいよ、シルヴィはそのままで。それより、カッコいいとこ見せてよね」
line = "「いいよ、シルヴィはそのままで。それより、カッコいいとこ見せてよね」"

[[dialogue]]
speaker = "シルヴィ"
# 「おっけー！　じゃあサポートよろしくね！」
line = "「おっけー！　じゃあサポートよろしくね！」"

[[dialogue]]
speaker = "コハルコ"
# 「うん、任せて。エフェクトランチャー起動──」
line = "「うん、任せて。エフェクトランチャー起動──」"

[[dialogue]]
speaker = "コハルコ"
# 「リングノーツプロジェクション！」
line = "「リングノーツプロジェクション！」"

[[dialogue]]
speaker = "unk"
# ドルフィンドローンから光輪が空中に投射され、色とりどりの光が空を彩る。
line = "ドルフィンドローンから光輪が空中に投射され、色とりどりの光が空を彩る。"

[[dialogue]]
speaker = "シルヴィ"
# 「よっしゃ、力湧いてきた！」
line = "「よっしゃ、力湧いてきた！」"

[[dialogue]]
speaker = "unk"
# 光の輪をくぐったシルヴィ先輩のまとう星力が増す。
line = "光の輪をくぐったシルヴィ先輩のまとう星力が増す。"

[[dialogue]]
speaker = "シルヴィ"
# 「いっけー！」
line = "「いっけー！」"

[[dialogue]]
speaker = "モンスター"
# 「チキー！」
line = "「チキー！」"

[[dialogue]]
speaker = "シルヴィ"
# 「あはっ！　簡単には倒せないかー！」
line = "「あはっ！　簡単には倒せないかー！」"

[[dialogue]]
speaker = "モンスター"
# 「チキチキ！」
line = "「チキチキ！」"

[[dialogue]]
speaker = "リップル"
# 「させませーん！」
line = "「させませーん！」"

[[dialogue]]
speaker = "unk"
# モンスターの攻撃を、リップルが生み出した波の障壁が遮った。
line = "モンスターの攻撃を、リップルが生み出した波の障壁が遮った。"

[[dialogue]]
speaker = "unk"
# ディマイズブレイカー！
line = "ディマイズブレイカー！"

[[dialogue]]
speaker = "モンスター"
# 「チキィ！」
line = "「チキィ！」"

[[dialogue]]
speaker = "unk"
# 俺が拳で穿ったのは、骨と肉の境目。<ruby=ガルスフライドチキン>ＧＦＣ</ruby>のバイト経験から、肉がきれいにはがれる場所を狙った。
line = "俺が拳で穿ったのは、骨と肉の境目。<ruby>ＧＦＣ<rt>ガルスフライドチキン</rt></ruby>のバイト経験から、肉がきれいにはがれる場所を狙った。"

[[dialogue]]
speaker = "シルヴィ"
# 「さっすが会長くん！　あたしも負けないよ！　はぁああああっ！！」
line = "「さっすが会長くん！　あたしも負けないよ！　はぁああああっ！！」"

[[dialogue]]
speaker = "モンスター"
# 「チキィッ！！」
line = "「チキィッ！！」"

[[dialogue]]
speaker = "シルヴィ"
# 「効いてる効いてるっ！」
line = "「効いてる効いてるっ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「また湧いてきた！？　そういうのもできるんだ！　コハルコ！」
line = "「また湧いてきた！？　そういうのもできるんだ！　コハルコ！」"

[[dialogue]]
speaker = "コハルコ"
# 「分かってる！　索敵開始！」
line = "「分かってる！　索敵開始！」"

[[dialogue]]
speaker = "コハルコ"
# 「……会長さん、５時の方向に３！　リップルさん、９時の方向に２！」
line = "「……会長さん、５時の方向に３！　リップルさん、９時の方向に２！」"

[[dialogue]]
speaker = "リップル"
# 「リョーカイ！　ハッピーライディング！」
line = "「リョーカイ！　ハッピーライディング！」"

[[dialogue]]
speaker = "unk"
# 四方八方からチキンモンスターが襲い掛かるが、コハルコさんの指示で的確に迎撃する。
line = "四方八方からチキンモンスターが襲い掛かるが、コハルコさんの指示で的確に迎撃する。"

[[dialogue]]
speaker = "unk"
# ドルフィンドローンの索敵とコハルコさんの情報処理が合わされば、敵ではない。
line = "ドルフィンドローンの索敵とコハルコさんの情報処理が合わされば、敵ではない。"

[[dialogue]]
speaker = "モンスター"
# 「チキィ……」
line = "「チキィ……」"

[[dialogue]]
speaker = "シルヴィ"
# 「そろそろ食べどきかな？　よーし、あたしに続いて、みんな！」
line = "「そろそろ食べどきかな？　よーし、あたしに続いて、みんな！」"

[[dialogue]]
speaker = "リップル"
# 「いきまーす！　リゾートオーシャン！」
line = "「いきまーす！　リゾートオーシャン！」"

[[dialogue]]
speaker = "コハルコ"
# 「ターゲットロック……エコーノイズショット！」
line = "「ターゲットロック……エコーノイズショット！」"

[[dialogue]]
speaker = "シルヴィ"
# 「チキン、いただきまぁす！！　ストームスピアフィッシャァーーーッ！！」
line = "「チキン、いただきまぁす！！　ストームスピアフィッシャァーーーッ！！」"

[[dialogue]]
speaker = "モンスター"
# 「チキーーーーーンッ！！」
line = "「チキーーーーーンッ！！」"

[[dialogue]]
speaker = "unk"
# 嵐をまとった銛がチキンを貫き、チキンモンスターは断末魔とともに消滅したのだった。
line = "嵐をまとった銛がチキンを貫き、チキンモンスターは断末魔とともに消滅したのだった。"
