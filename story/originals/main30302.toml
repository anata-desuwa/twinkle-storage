[[dialogue]]
speaker = "unk"
# 第２話,『自由気ママ』,B
line = "第２話,『自由気ママ』,B"

[[dialogue]]
speaker = "紅明"
# 「にしてもセッシー！　その衣装、抜群に似合ってるじゃん！　可愛いし、タダ者じゃない感もムンムンだぜ☆」
line = "「にしてもセッシー！　その衣装、抜群に似合ってるじゃん！　可愛いし、タダ者じゃない感もムンムンだぜ☆」"

[[dialogue]]
speaker = "unk"
# 紅明の言う通り、セシアの身にまとっている衣装は、普段の彼女のものとは少し違っていた。
line = "紅明の言う通り、セシアの身にまとっている衣装は、普段の彼女のものとは少し違っていた。"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ええ。これはルヴィネさまとの契約によって再び芽吹いた力なの」
line = "「ええ。これはルヴィネさまとの契約によって再び芽吹いた力なの」"

[[dialogue]]
speaker = "紅明"
# 「契約っていうと、前にセッシーが話してくれてたアレか～」
line = "「契約っていうと、前にセッシーが話してくれてたアレか～」"

[[dialogue]]
speaker = "紅明"
# 「新しい女神であるルヴィっちと契約することで、女神と守護天使の間の繋がりが強くなり、新たな力に目覚めることがある、って」
line = "「新しい女神であるルヴィっちと契約することで、女神と守護天使の間の繋がりが強くなり、新たな力に目覚めることがある、って」"

[[dialogue]]
speaker = "紅明"
# 「じゃあもしかして、この姿がセッシーが転生する前の……？」
line = "「じゃあもしかして、この姿がセッシーが転生する前の……？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そうよ。新たな契約によって、わたくしの前身──《万成》のアウクセシアが持っていた力の一部が蘇ったわ」
line = "「そうよ。新たな契約によって、わたくしの前身──《万成》のアウクセシアが持っていた力の一部が蘇ったわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そして、わたくしのこの衣装も、その力の影響を強く受けているの」
line = "「そして、わたくしのこの衣装も、その力の影響を強く受けているの」"

[[dialogue]]
speaker = "ルヴィネ"
# 「オオヒメにラクシャ、２人の時はあまり上手く行った手応えがなかったのだけれど……３人目にしてようやく、ってところかしら」
line = "「オオヒメにラクシャ、２人の時はあまり上手く行った手応えがなかったのだけれど……３人目にしてようやく、ってところかしら」"

[[dialogue]]
speaker = "unk"
# 守護天使とルヴィネの契約。
line = "守護天使とルヴィネの契約。"

[[dialogue]]
speaker = "unk"
# それはルヴィネが、先代女神であるテルルから譲り受けた守護天使たちと、互いの関係をより強固にするためのものであった。
line = "それはルヴィネが、先代女神であるテルルから譲り受けた守護天使たちと、互いの関係をより強固にするためのものであった。"

[[dialogue]]
speaker = "unk"
# 既に、オオヒメとラクシャは契約が完了している。しかし──
line = "既に、オオヒメとラクシャは契約が完了している。しかし──"

[[dialogue]]
speaker = "ルヴィネ"
# 「新しい契約によって世界の摂理に影響が出なかったことは、以前の２人から報告を受けているわ」
line = "「新しい契約によって世界の摂理に影響が出なかったことは、以前の２人から報告を受けているわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「けれど、契約後に起きる外見の変化についてはその限りではない。いいのかしら、あなたの姿もどのように変化してしまうか分からないのだけれど……」
line = "「けれど、契約後に起きる外見の変化についてはその限りではない。いいのかしら、あなたの姿もどのように変化してしまうか分からないのだけれど……」"

[[dialogue]]
speaker = "セシア"
# 「摂理に影響が出ないならば問題ないわ。契約後の姿についても、むしろ楽しみなほどよ」
line = "「摂理に影響が出ないならば問題ないわ。契約後の姿についても、むしろ楽しみなほどよ」"

[[dialogue]]
speaker = "セシア"
# 「わたくしは大丈夫。だから、さあルヴィネさま、契約を結び直しましょう」
line = "「わたくしは大丈夫。だから、さあルヴィネさま、契約を結び直しましょう」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ええ、分かったわ……セシア」
line = "「ええ、分かったわ……セシア」"

[[dialogue]]
speaker = "unk"
# 少し不安げな様子を残しながら、ルヴィネはセシアの前に手をかざした。
line = "少し不安げな様子を残しながら、ルヴィネはセシアの前に手をかざした。"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ルヴィネさまと新しい契約を結ぶことで、わたくしの奥底に『蓄積』されていたものが昇華されて、この姿が引き出されたようね」
line = "「ルヴィネさまと新しい契約を結ぶことで、わたくしの奥底に『蓄積』されていたものが昇華されて、この姿が引き出されたようね」"

[[dialogue]]
speaker = "ルヴィネ"
# 「欲を言えば、完全に元のアウクセシアの姿に戻してあげられれば良かったのだけれど……」
line = "「欲を言えば、完全に元のアウクセシアの姿に戻してあげられれば良かったのだけれど……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ルヴィネさまが気に病む必要はないわ。今のわたくしは、１度転生を果たした身であるし……」
line = "「ルヴィネさまが気に病む必要はないわ。今のわたくしは、１度転生を果たした身であるし……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「大切なことは姿かたちではないわ。その者の『個』を形作る、魂の煌き──ママへの愛の波動さえ忘れなければ、わたくしは十分だもの」
line = "「大切なことは姿かたちではないわ。その者の『個』を形作る、魂の煌き──ママへの愛の波動さえ忘れなければ、わたくしは十分だもの」"

[[dialogue]]
speaker = "ルヴィネ"
# 「そ、そんなものなのかしら……？」
line = "「そ、そんなものなのかしら……？」"

[[dialogue]]
speaker = "紅明"
# 「アタシ的には大きくなったセッシーの姿も見てみたいけど、でもやっぱり小さい方がセッシーって感じがしてしっくりくるぜ！」
line = "「アタシ的には大きくなったセッシーの姿も見てみたいけど、でもやっぱり小さい方がセッシーって感じがしてしっくりくるぜ！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「紅明ママーーーーっ<emoji=heart04><emoji=heart04><emoji=heart04>」
line = "「紅明ママーーーーっ<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ええっと紅明……もしかしてあなたもセシアのママ？　なのかしら？？」
line = "「ええっと紅明……もしかしてあなたもセシアのママ？　なのかしら？？」"

[[dialogue]]
speaker = "紅明"
# 「うっしっし♪　まあ、そんなトコロっしょ☆」
line = "「うっしっし♪　まあ、そんなトコロっしょ☆」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ルヴィネさま、紅明ママはただのママじゃないわ。紅明ママは最高のママの１人なの～<emoji=heart04>」
line = "「ルヴィネさま、紅明ママはただのママじゃないわ。紅明ママは最高のママの１人なの～<emoji=heart04>」"

[[dialogue]]
speaker = "ルヴィネ"
# 「そ、そう……」
line = "「そ、そう……」"

[[dialogue]]
speaker = "unk"
# と、そんな話をしていると星徒会室のドアがノックされた。
line = "と、そんな話をしていると星徒会室のドアがノックされた。"

[[dialogue]]
speaker = "シノ"
# 「失礼しますね、会長さん」
line = "「失礼しますね、会長さん」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「……！！？」
line = "「……！！？」"

[[dialogue]]
speaker = "unk"
# 入ってきたのは新星学園の学園長である十六夜シノだった。
line = "入ってきたのは新星学園の学園長である十六夜シノだった。"

[[dialogue]]
speaker = "シノ"
# 「もしかして、お待たせしてしまいましたか？」
line = "「もしかして、お待たせしてしまいましたか？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「いいえ、ちょうど先ほど魔王との話が終わったところよ」
line = "「いいえ、ちょうど先ほど魔王との話が終わったところよ」"

[[dialogue]]
speaker = "シノ"
# 「ふふ、どうやら良いタイミングだったようですね」
line = "「ふふ、どうやら良いタイミングだったようですね」"

[[dialogue]]
speaker = "シノ"
# 「聖庭園からの使節団の方々は既に会議室の方へお通ししています。さっそくですがご案内しますね」
line = "「聖庭園からの使節団の方々は既に会議室の方へお通ししています。さっそくですがご案内しますね」"

[[dialogue]]
speaker = "ルヴィネ"
# 「お願いするわ」
line = "「お願いするわ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "シノ"
# 「それから、紅明さんもルヴィネさんの会談に同行されていると聞いていますが……」
line = "「それから、紅明さんもルヴィネさんの会談に同行されていると聞いていますが……」"

[[dialogue]]
speaker = "紅明"
# 「お話の内容はわからないんで、会談自体には参加しないんですが、道案内とヒトの手配を任されてます☆」
line = "「お話の内容はわからないんで、会談自体には参加しないんですが、道案内とヒトの手配を任されてます☆」"

[[dialogue]]
speaker = "シノ"
# 「ありがとうございます。顔の広い紅明さんの協力、とても心強いです」
line = "「ありがとうございます。顔の広い紅明さんの協力、とても心強いです」"

[[dialogue]]
speaker = "紅明"
# 「アタシに任しといてください、シノ学園長☆　アタシの元気とコネクション、ルヴィっちにばっちり共有しちまうぜ！！」
line = "「アタシに任しといてください、シノ学園長☆　アタシの元気とコネクション、ルヴィっちにばっちり共有しちまうぜ！！」"

[[dialogue]]
speaker = "シノ"
# 「ふふ、確かに紅明さんのエネルギーはどんな時でも役に立ってしまうでしょうね」
line = "「ふふ、確かに紅明さんのエネルギーはどんな時でも役に立ってしまうでしょうね」"

[[dialogue]]
speaker = "シノ"
# 「それと……あら。あなたは確か、守護天使の──」
line = "「それと……あら。あなたは確か、守護天使の──」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「──ママ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」
line = "「──ママ～～～っ<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "シノ"
# 「はい！？」
line = "「はい！？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「わ～！　おだやかな表情、安心感を与える話し方……とってもそそられるママみよ～！」
line = "「わ～！　おだやかな表情、安心感を与える話し方……とってもそそられるママみよ～！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それにその、飛び込んでこいとばかりに膨らんだ大きなお胸……まさしくセシアの求めるママだわ～！」
line = "「それにその、飛び込んでこいとばかりに膨らんだ大きなお胸……まさしくセシアの求めるママだわ～！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「お願いママ～♪　セシアのこと抱っこして～！　それでいっぱい、よしよしして～っ<emoji=heart04>」
line = "「お願いママ～♪　セシアのこと抱っこして～！　それでいっぱい、よしよしして～っ<emoji=heart04>」"

[[dialogue]]
speaker = "シノ"
# （こ、これはどういうことでしょう……私が、ママ？？）
line = "（こ、これはどういうことでしょう……私が、ママ？？）"

[[dialogue]]
speaker = "シノ"
# （けれど、こんなに純真な目で私のことをママと呼んで……もしかしてセシアさんは私に甘えたい、ということなのでしょうか？）
line = "（けれど、こんなに純真な目で私のことをママと呼んで……もしかしてセシアさんは私に甘えたい、ということなのでしょうか？）"

[[dialogue]]
speaker = "シノ"
# 「……ありがとうございます、セシアさん。ですが私はあなたのママではなく──」
line = "「……ありがとうございます、セシアさん。ですが私はあなたのママではなく──」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「皆まで言わずともわかるわ。あなたは教育者の<ruby=かがみ>鑑</ruby>……その在り方には、生徒全員へ向けた大いなる博愛の精神を感じるもの」
line = "「皆まで言わずともわかるわ。あなたは教育者の<ruby>鑑<rt>かがみ</rt></ruby>……その在り方には、生徒全員へ向けた大いなる博愛の精神を感じるもの」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それもまた、わたくしの求める受容性。よって理想のママ、その形のひとつと言えるのよ！」
line = "「それもまた、わたくしの求める受容性。よって理想のママ、その形のひとつと言えるのよ！」"

[[dialogue]]
speaker = "紅明"
# 「うーん、始まっちゃったかあ」
line = "「うーん、始まっちゃったかあ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「シノママ～♪　セシアね、いっぱい甘えたいの～。その大きなお胸に飛び込ませてほしいの～♪」
line = "「シノママ～♪　セシアね、いっぱい甘えたいの～。その大きなお胸に飛び込ませてほしいの～♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「セシア、以前より疑問だったのだけれど……あなたはどうしてあちこちでママを作ろうとするの？」
line = "「セシア、以前より疑問だったのだけれど……あなたはどうしてあちこちでママを作ろうとするの？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「ママを求める気持ちに理由なんてないわ。人はみな、ママになってくれる人を自然に求めてしまうものなのよ？」
line = "「ママを求める気持ちに理由なんてないわ。人はみな、ママになってくれる人を自然に求めてしまうものなのよ？」"

[[dialogue]]
speaker = "紅明"
# 「まー、シノ学園長も嫌じゃなければ付き合ってください☆　セッシーはいつも心のママを求めてて、シノ学園長の中にそれを見出したみたいなんで♪」
line = "「まー、シノ学園長も嫌じゃなければ付き合ってください☆　セッシーはいつも心のママを求めてて、シノ学園長の中にそれを見出したみたいなんで♪」"

[[dialogue]]
speaker = "シノ"
# 「心のママ、ですか？　なるほど……」
line = "「心のママ、ですか？　なるほど……」"

[[dialogue]]
speaker = "シノ"
# （細かい事情はよくわかりませんが、こんなに純粋な気持ちで求めてくれるのならば、応えないわけにはいかないでしょう。これも教育者としての務め──）
line = "（細かい事情はよくわかりませんが、こんなに純粋な気持ちで求めてくれるのならば、応えないわけにはいかないでしょう。これも教育者としての務め──）"

[[dialogue]]
speaker = "シノ"
# 「ではセシアさん。私にできる範囲でよければ、ママだと思って甘えてください」
line = "「ではセシアさん。私にできる範囲でよければ、ママだと思って甘えてください」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「やったわ～♪　新しいママよ～♪　むぎゅ～♪」
line = "「やったわ～♪　新しいママよ～♪　むぎゅ～♪」"

[[dialogue]]
speaker = "シノ"
# 「えっと……これでいいのでしょうか？」
line = "「えっと……これでいいのでしょうか？」"

[[dialogue]]
speaker = "紅明"
# 「ばっちり☆　セッシーはもうシノ学園長のママみにすっかり魅了されちゃってるっしょ～♪」
line = "「ばっちり☆　セッシーはもうシノ学園長のママみにすっかり魅了されちゃってるっしょ～♪」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「シノママ～、セシアにいい子いい子して～♪　ママに会えて嬉しいの～♪」
line = "「シノママ～、セシアにいい子いい子して～♪　ママに会えて嬉しいの～♪」"

[[dialogue]]
speaker = "シノ"
# 「い、いい子いい子……？」
line = "「い、いい子いい子……？」"

[[dialogue]]
speaker = "シノ"
# 「学園長と言っても私、歳は学園の皆さんと変わりませんし……プライベートでは、その……結構ずぼらと言いますか……」
line = "「学園長と言っても私、歳は学園の皆さんと変わりませんし……プライベートでは、その……結構ずぼらと言いますか……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「あら、そうなのね？」
line = "「あら、そうなのね？」"

[[dialogue]]
speaker = "シノ"
# 「え、ええ。私、あまりママと呼ぶにふさわしくないかもしれませんよ……？」
line = "「え、ええ。私、あまりママと呼ぶにふさわしくないかもしれませんよ……？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そんなことないわ～<emoji=heart04>　ママが不安になっても、セシアが抱きしめてあげる～♪　ぎゅ～っ♪」
line = "「そんなことないわ～<emoji=heart04>　ママが不安になっても、セシアが抱きしめてあげる～♪　ぎゅ～っ♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「あの……私たちはいつまでこれを見せ続けられるのかしら？」
line = "「あの……私たちはいつまでこれを見せ続けられるのかしら？」"

[[dialogue]]
speaker = "シノ"
# 「あっ……す、すみません！」
line = "「あっ……す、すみません！」"

[[dialogue]]
speaker = "unk"
# ルヴィネに声をかけられて、シノがハッと我に返る。
line = "ルヴィネに声をかけられて、シノがハッと我に返る。"

[[dialogue]]
speaker = "紅明"
# 「セッシーも甘えるのはそこまでにしとくっしょ☆　会合のお供っていうお仕事の最中だかんね」
line = "「セッシーも甘えるのはそこまでにしとくっしょ☆　会合のお供っていうお仕事の最中だかんね」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「そうね、ママに迷惑をかけてはいけないわ。ごめんなさい、シノママ」
line = "「そうね、ママに迷惑をかけてはいけないわ。ごめんなさい、シノママ」"

[[dialogue]]
speaker = "シノ"
# 「ええ、大丈夫ですよ」
line = "「ええ、大丈夫ですよ」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「でも……ふふ！　こうなると大いに期待できるわね！」
line = "「でも……ふふ！　こうなると大いに期待できるわね！」"

[[dialogue]]
speaker = "紅明"
# 「期待って？」
line = "「期待って？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「新しいママとの出会いについてよ！」
line = "「新しいママとの出会いについてよ！」"

[[dialogue]]
speaker = "ルヴィネ"
# 「どういうこと……！？」
line = "「どういうこと……！？」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「デネブでの『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』との戦い。その後のベガでの決戦でも、たくさんの星騎士の人たちと一同に会する機会こそあったわ……」
line = "「デネブでの『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』との戦い。その後のベガでの決戦でも、たくさんの星騎士の人たちと一同に会する機会こそあったわ……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「けれどあの時は、ばたばたしていたもの。その場にいるみんなとゆっくり自己紹介なんてできなかったし……」
line = "「けれどあの時は、ばたばたしていたもの。その場にいるみんなとゆっくり自己紹介なんてできなかったし……」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「それに世界に迫る存亡の危機を前に、わたくし自身、ママを探す心の目を無意識に閉ざしていたみたい……！」
line = "「それに世界に迫る存亡の危機を前に、わたくし自身、ママを探す心の目を無意識に閉ざしていたみたい……！」"

[[dialogue]]
speaker = "ルヴィネ"
# 「…………？？？？」
line = "「…………？？？？」"

[[dialogue]]
speaker = "紅明"
# 「要はシリアスな空気を読んで、甘え上手なオギャりモードのセッシーをセーブしてたってことっしょ☆」
line = "「要はシリアスな空気を読んで、甘え上手なオギャりモードのセッシーをセーブしてたってことっしょ☆」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「その通りよ、紅明ママ！　だから今ここで再会するまで──シノママに溢れんばかりのママみがあることにも気づいていなかったの……！」
line = "「その通りよ、紅明ママ！　だから今ここで再会するまで──シノママに溢れんばかりのママみがあることにも気づいていなかったの……！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「これは嬉しい誤算というものね♪　平和そのものとなった今なら、あのときには気付けなかった、ママセンサーに引っかかる人がもっといるはずだわ！」
line = "「これは嬉しい誤算というものね♪　平和そのものとなった今なら、あのときには気付けなかった、ママセンサーに引っかかる人がもっといるはずだわ！」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「この調子なら──きっと学園を巡るうちに、たくさんの新しいママに出会えるはずよ♪」
line = "「この調子なら──きっと学園を巡るうちに、たくさんの新しいママに出会えるはずよ♪」"

[[dialogue]]
speaker = "紅明"
# 「セッシーはママ探しに余念がないねぇ☆」
line = "「セッシーはママ探しに余念がないねぇ☆」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「もちろんルヴィネさまの道案内や護衛が最優先ではあるけれど──お仕事の合間に、ママになってくれそうなヒトを探すの」
line = "「もちろんルヴィネさまの道案内や護衛が最優先ではあるけれど──お仕事の合間に、ママになってくれそうなヒトを探すの」"

[[dialogue]]
speaker = "セシア（覚醒）"
# 「これぞまさに、一石二鳥というものじゃないかしら。うふふふ♪」
line = "「これぞまさに、一石二鳥というものじゃないかしら。うふふふ♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「しっかり聞いても、やっぱりその理屈はよくわからないわ……？」
line = "「しっかり聞いても、やっぱりその理屈はよくわからないわ……？」"
