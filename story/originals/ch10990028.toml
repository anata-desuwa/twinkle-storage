speaker = "ミウ"
# 「まだまだし足りないですよぉ……えっちしたがってるおま○こ、放っておかれちゃうんですか？」
line = "「まだまだし足りないですよぉ……えっちしたがってるおま○こ、放っておかれちゃうんですか？」"

[[dialogue]]
speaker = "ミウ"
# 「たった１回で降参しちゃうなんて、このままだとずーっと私に負けっぱなしになっちゃいますよ？」
line = "「たった１回で降参しちゃうなんて、このままだとずーっと私に負けっぱなしになっちゃいますよ？」"

[[dialogue]]
speaker = "クロト"
# 「一旦、休憩してから──って、あれ！？」
line = "「一旦、休憩してから──って、あれ！？」"

[[dialogue]]
speaker = "unk"
# 体は疲れているはずなのに、ペニスはミウの煽りに負けるものかと立ち上がる。
line = "体は疲れているはずなのに、ペニスはミウの煽りに負けるものかと立ち上がる。"

[[dialogue]]
speaker = "ミウ"
# 「ふふ、会長さんのおち○ちん、まだカチカチのままじゃないですか<emoji=heart04>」
line = "「ふふ、会長さんのおち○ちん、まだカチカチのままじゃないですか<emoji=heart04>」"

[[dialogue]]
speaker = "ミウ"
# 「『おま○こに、もう１回出したいよー出したいよー』って言ってますね。かぁわいい<emoji=heart04>」
line = "「『おま○こに、もう１回出したいよー出したいよー』って言ってますね。かぁわいい<emoji=heart04>」"

[[dialogue]]
speaker = "クロト"
# 「い、いや、その……あれぇ……？」
line = "「い、いや、その……あれぇ……？」"

[[dialogue]]
speaker = "unk"
# ミウの言う通り、ペニスは痛いくらいに勃起している。ペニスだけは元気なのに、体はすっかり脱力していて動けない。
line = "ミウの言う通り、ペニスは痛いくらいに勃起している。ペニスだけは元気なのに、体はすっかり脱力していて動けない。"

[[dialogue]]
speaker = "ミウ"
# 「ふふ、お股開きっぱなしで逃げないってことはぁ……このまま愉しんじゃってもいいですよねー？」
line = "「ふふ、お股開きっぱなしで逃げないってことはぁ……このまま愉しんじゃってもいいですよねー？」"

[[dialogue]]
speaker = "クロト"
# 「よ、よくないっ！　動けないだけだからっ！」
line = "「よ、よくないっ！　動けないだけだからっ！」"

[[dialogue]]
speaker = "ミウ"
# 「私は会長さんの彼女なんですから、遠慮しなくていいんですよ。おち○ちんが満足するまで、何度でも<emoji=heart04>」
line = "「私は会長さんの彼女なんですから、遠慮しなくていいんですよ。おち○ちんが満足するまで、何度でも<emoji=heart04>」"

[[dialogue]]
speaker = "ミウ"
# 「おま○こ、まだまだ欲しがっちゃってますから……もっともっと私を愛してくださいね<emoji=heart04>」
line = "「おま○こ、まだまだ欲しがっちゃってますから……もっともっと私を愛してくださいね<emoji=heart04>」"
