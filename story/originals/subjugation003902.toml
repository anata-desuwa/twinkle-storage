line = "「――本当なのですか！？」"

[[dialogue]]
speaker = "狛里"
# 「わ～いっ！　ありがとうなのです♪」
line = "「わ～いっ！　ありがとうなのです♪」"

[[dialogue]]
speaker = "unk"
# 狛里は嬉しそうにぴょんぴょん飛び跳ねて、俺の手を取りぶんぶんと上下に振る。
line = "狛里は嬉しそうにぴょんぴょん飛び跳ねて、俺の手を取りぶんぶんと上下に振る。"

[[dialogue]]
speaker = "狛里"
# 「あっ♪　魔王様、模擬戦で汗をかいて、さっきよりもっといい匂いがするのです<emoji=heart04>　――くんくんくん♪」
line = "「あっ♪　魔王様、模擬戦で汗をかいて、さっきよりもっといい匂いがするのです<emoji=heart04>　――くんくんくん♪」"

[[dialogue]]
speaker = "狛里"
# 「っ！！　ぺろぺろぺろ～♪」
line = "「っ！！　ぺろぺろぺろ～♪」"

[[dialogue]]
speaker = "unk"
# 狛里ステイ！　ステイ！！
line = "狛里ステイ！　ステイ！！"

[[dialogue]]
speaker = "unk"
# ぐわぁーーーー！？
line = "ぐわぁーーーー！？"

[[dialogue]]
speaker = "unk"
# 額と頬を伝う汗を、目を輝かせて舌で舐め取ってきたぞ、この娘！？　距離感どうなってるんだ！？？
line = "額と頬を伝う汗を、目を輝かせて舌で舐め取ってきたぞ、この娘！？　距離感どうなってるんだ！？？"

[[dialogue]]
speaker = "ヨミ"
# 「こややや……！」
line = "「こややや……！」"

[[dialogue]]
speaker = "ヨミ"
# （か、会長の『生汗』をあんな近くでくんくんするなんて！）
line = "（か、会長の『生汗』をあんな近くでくんくんするなんて！）"

[[dialogue]]
speaker = "ヨミ"
# （なんて爆裂うらやまし――いえ、爆裂オープンなんですか！？）
line = "（なんて爆裂うらやまし――いえ、爆裂オープンなんですか！？）"

[[dialogue]]
speaker = "ヘレナ"
# 「ヨミヨミは見ているだけでよいのか？」
line = "「ヨミヨミは見ているだけでよいのか？」"

[[dialogue]]
speaker = "ヨミ"
