line = "「ご、ご当主様！？」"

[[dialogue]]
speaker = "ヘレナ"
# 「顔を赤くしながら、羨ましそうな目で見ていたぞ？」
line = "「顔を赤くしながら、羨ましそうな目で見ていたぞ？」"

[[dialogue]]
speaker = "ヨミ"
