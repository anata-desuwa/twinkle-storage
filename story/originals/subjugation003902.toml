# 「そ、そんな屈託のない笑顔で言われると……」
line = "「そ、そんな屈託のない笑顔で言われると……」"

[[dialogue]]
speaker = "unk"
# で、でも相手は選んだ方がいいかな……
line = "で、でも相手は選んだ方がいいかな……"

[[dialogue]]
speaker = "ヨミ"
# 「そ、そうですよね……」
line = "「そ、そうですよね……」"

[[dialogue]]
speaker = "狛里"
# 「ばうわふ？」
line = "「ばうわふ？」"

[[dialogue]]
speaker = "unk"
# 不思議そうに首を傾げる狛里。
line = "不思議そうに首を傾げる狛里。"

[[dialogue]]
speaker = "unk"
# そんな彼女を見ながら、俺たちは思わず苦笑いをしてしまうのだった。
line = "そんな彼女を見ながら、俺たちは思わず苦笑いをしてしまうのだった。"

[[dialogue]]
speaker = "unk"
# ――翌日。九浄家にて。
line = "――翌日。九浄家にて。"

[[dialogue]]
speaker = "ヨミ"
# 「――え？　私が狛里さんの『教育係』をですか？」
line = "「――え？　私が狛里さんの『教育係』をですか？」"

[[dialogue]]
speaker = "蘭美"
# 「ええ！　メイドの先輩として、新人の指導をお願いしたいと思っているの！」
line = "「ええ！　メイドの先輩として、新人の指導をお願いしたいと思っているの！」"

[[dialogue]]
speaker = "unk"
# 九浄家メイド隊のメイド長『蘭美』は、頷きながらそう宣言した。
line = "九浄家メイド隊のメイド長『蘭美』は、頷きながらそう宣言した。"

[[dialogue]]
speaker = "蘭美"
# 「当主様の言う『ヨミの成長を促す秘策』はズバリ、この教育係のことよ！」
line = "「当主様の言う『ヨミの成長を促す秘策』はズバリ、この教育係のことよ！」"

[[dialogue]]
speaker = "蘭美"
# 「ヒトにものを教えるのは、自分の成長にも繋がるわ！　どうかしら？」
line = "「ヒトにものを教えるのは、自分の成長にも繋がるわ！　どうかしら？」"

[[dialogue]]
speaker = "ヨミ"
# （後輩に仕事を教えるのは、これが初めて）
line = "（後輩に仕事を教えるのは、これが初めて）"

[[dialogue]]
speaker = "ヨミ"
# （私に務まるか、自信はないけど……）
line = "（私に務まるか、自信はないけど……）"

[[dialogue]]
speaker = "ヨミ"
# 「……わ、わかりました！」
line = "「……わ、わかりました！」"

[[dialogue]]
speaker = "ヨミ"
# 「その<ruby=クエスト>任務</ruby>、お引き受けします！」
line = "「その<ruby>任務<rt>クエスト</rt></ruby>、お引き受けします！」"

[[dialogue]]
speaker = "unk"
# ヨミは自身の成長の為にも、教育係という新たな役目へ挑戦することを決めるのだった。
line = "ヨミは自身の成長の為にも、教育係という新たな役目へ挑戦することを決めるのだった。"
