[[dialogue]]
speaker = "unk"
# 九浄家メイド隊の新人メイドだと紹介された獣人魔族の少女『<ruby=こまり>狛里</ruby>』。
line = "九浄家メイド隊の新人メイドだと紹介された獣人魔族の少女『<ruby>狛里<rt>こまり</rt></ruby>』。"

[[dialogue]]
speaker = "狛里"
# 「魔界の辺境から来た、まだまだ新人さんなのです。どうぞよろしくお願いするであります♪」
line = "「魔界の辺境から来た、まだまだ新人さんなのです。どうぞよろしくお願いするであります♪」"

[[dialogue]]
speaker = "unk"
# 張り切った様子で犬耳と尻尾を揺らす彼女と、俺は握手を交わす。
line = "張り切った様子で犬耳と尻尾を揺らす彼女と、俺は握手を交わす。"

[[dialogue]]
speaker = "unk"
# 『狛里』って呼んでもいいかな？
line = "『狛里』って呼んでもいいかな？"

[[dialogue]]
speaker = "unk"
# こちらこそよろしく
line = "こちらこそよろしく"

[[dialogue]]
speaker = "狛里"
# 「もちろんであります！　魔王様♪」
line = "「もちろんであります！　魔王様♪」"

[[dialogue]]
speaker = "狛里"
# 「え？　――様付けはしなくてもいい、でありますか？」
line = "「え？　――様付けはしなくてもいい、でありますか？」"

[[dialogue]]
speaker = "狛里"
# 「だめなのです！　狛里は後輩で、メイドなのです！　だから敬意を込めて、魔王様って呼びたいのであります♪」
line = "「だめなのです！　狛里は後輩で、メイドなのです！　だから敬意を込めて、魔王様って呼びたいのであります♪」"

[[dialogue]]
speaker = "unk"
# どうやら元気なだけではなく、真面目な性格でもあるらしい。
line = "どうやら元気なだけではなく、真面目な性格でもあるらしい。"

[[dialogue]]
speaker = "unk"
# そんなことを思った次の瞬間――
line = "そんなことを思った次の瞬間――"

[[dialogue]]
speaker = "狛里"
# 「魔王様、ちょっと失礼するのであります！」
line = "「魔王様、ちょっと失礼するのであります！」"

[[dialogue]]
speaker = "狛里"
# 「――くんくん、くんくんくん♪」
line = "「――くんくん、くんくんくん♪」"

[[dialogue]]
speaker = "unk"
# 狛里は自然な動作で近づいてくると、俺の首筋へ顔を寄せて、<b>匂いを嗅いだ</b>。
line = "狛里は自然な動作で近づいてくると、俺の首筋へ顔を寄せて、<b>匂いを嗅いだ</b>。"

[[dialogue]]
speaker = "unk"
# ！？　な、何！？
line = "！？　な、何！？"

[[dialogue]]
speaker = "狛里"
# 「ばうわ～ふっ<emoji=heart04>　やっぱりなのです！　魔王様の匂い、狛里、すっごく好きですぅ♪」
line = "「ばうわ～ふっ<emoji=heart04>　やっぱりなのです！　魔王様の匂い、狛里、すっごく好きですぅ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「こやっ！？　匂いが好きって……！」
line = "「こやっ！？　匂いが好きって……！」"

[[dialogue]]
speaker = "狛里"
# 「えへへっ♪　実は狛里、『匂いを嗅ぐ』のが大好きなのです♪」
line = "「えへへっ♪　実は狛里、『匂いを嗅ぐ』のが大好きなのです♪」"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ♪　魔王様は、安心できるみたいな、すっごくいい匂いがするのであります♪」
line = "「ばうわふっ♪　魔王様は、安心できるみたいな、すっごくいい匂いがするのであります♪」"

[[dialogue]]
speaker = "ヨミ"
# 「狛里さん、そ、それって……」
line = "「狛里さん、そ、それって……」"

[[dialogue]]
speaker = "ヘレナ"
# 「ふふっ。実は狛里は――『オープン匂いフェチ』なのだ」
line = "「ふふっ。実は狛里は――『オープン匂いフェチ』なのだ」"

[[dialogue]]
speaker = "ヨミ"
# 「えぇ～～っ！？」
line = "「えぇ～～っ！？」"

[[dialogue]]
speaker = "ヨミ"
# （ま、まさかの同じフェチ仲間！？　だけど、オープンって……！）
line = "（ま、まさかの同じフェチ仲間！？　だけど、オープンって……！）"

[[dialogue]]
speaker = "狛里"
# 「くんくん♪　くんくん♪」
line = "「くんくん♪　くんくん♪」"

[[dialogue]]
speaker = "unk"
# 狛里は嬉しそうに尻尾をパタパタさせながら、俺の周囲を回る。そしてあちこちに顔を近づけては、遠慮なく匂いを嗅いでくる。
line = "狛里は嬉しそうに尻尾をパタパタさせながら、俺の周囲を回る。そしてあちこちに顔を近づけては、遠慮なく匂いを嗅いでくる。"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ♪　こっちの方からもっといい匂いがするのですっ。ああっ、でもこっちの匂いも捨てがたいのです♪」
line = "「ばうわふっ♪　こっちの方からもっといい匂いがするのですっ。ああっ、でもこっちの匂いも捨てがたいのです♪」"

[[dialogue]]
speaker = "unk"
# まるで大型犬がじゃれついてくるのように、遠慮容赦なく鼻と体を密着させてくる。
line = "まるで大型犬がじゃれついてくるのように、遠慮容赦なく鼻と体を密着させてくる。"

[[dialogue]]
speaker = "unk"
# これが本当に犬なら可愛いものなのだが──
line = "これが本当に犬なら可愛いものなのだが──"

[[dialogue]]
speaker = "狛里"
# 「くんくん♪　くんくんくんっ♪」
line = "「くんくん♪　くんくんくんっ♪」"

[[dialogue]]
speaker = "unk"
# 発育のいい女の子に全身密着されながら匂いを嗅がれまくるのは、かなり恥ずかしいのだが！？
line = "発育のいい女の子に全身密着されながら匂いを嗅がれまくるのは、かなり恥ずかしいのだが！？"

[[dialogue]]
speaker = "ヘレナ"
# 「ふむ。魔王がだらしない顔をしておるな。ちなみに、これはまったく関係ない話なのだが……狛里は附属生でありながら、バストは脅威の９６センチだぞ♪」
line = "「ふむ。魔王がだらしない顔をしておるな。ちなみに、これはまったく関係ない話なのだが……狛里は附属生でありながら、バストは脅威の９６センチだぞ♪」"

[[dialogue]]
speaker = "unk"
# どうしてそれを今言ったんです！？
line = "どうしてそれを今言ったんです！？"

[[dialogue]]
speaker = "狛里"
# 「ばうわ～ふっ♪　魔王様の髪の毛の中、香ばしい匂いがするのです～♪」
line = "「ばうわ～ふっ♪　魔王様の髪の毛の中、香ばしい匂いがするのです～♪」"

[[dialogue]]
speaker = "unk"
# ついにはバックハグの形で抱きしめられてしまい、髪の毛の中に顔を突っ込まれて『魔王吸い』をされてしまう！！
line = "ついにはバックハグの形で抱きしめられてしまい、髪の毛の中に顔を突っ込まれて『魔王吸い』をされてしまう！！"

[[dialogue]]
speaker = "ヘレナ"
# 「いかんな、狛里が興奮して我を忘れている……ここまで魔王と相性がいいとは思わなかったぞ」
line = "「いかんな、狛里が興奮して我を忘れている……ここまで魔王と相性がいいとは思わなかったぞ」"

[[dialogue]]
speaker = "ヘレナ"
# 「狛里、ステイ！！」
line = "「狛里、ステイ！！」"

[[dialogue]]
speaker = "狛里"
# 「――ハッ！？」
line = "「――ハッ！？」"

[[dialogue]]
speaker = "狛里"
# 「ご、ごめんなさいなのですっ！　本当にいい匂いだから、つい……えへへっ♪」
line = "「ご、ごめんなさいなのですっ！　本当にいい匂いだから、つい……えへへっ♪」"

[[dialogue]]
speaker = "ヨミ"
# （あ、あんなに会長の匂いを堂々と……）
line = "（あ、あんなに会長の匂いを堂々と……）"

[[dialogue]]
speaker = "ヨミ"
# （爆裂うらやま――いえ！　爆裂オープン過ぎます！）
line = "（爆裂うらやま――いえ！　爆裂オープン過ぎます！）"

[[dialogue]]
speaker = "ヘレナ"
# 「狛里は数ヶ月前、魔界の辺境で九浄家のスカウトが見つけてきてな。先日の『大交流』の際に、人間界へ招き入れたのだ」
line = "「狛里は数ヶ月前、魔界の辺境で九浄家のスカウトが見つけてきてな。先日の『大交流』の際に、人間界へ招き入れたのだ」"

[[dialogue]]
speaker = "ヘレナ"
# 「『ＸＥＬＯＳ』討伐後、リクリエという現象はなくなり、直近の危険度はかなり下がったと言える」
line = "「『ＸＥＬＯＳ』討伐後、リクリエという現象はなくなり、直近の危険度はかなり下がったと言える」"

[[dialogue]]
speaker = "ヘレナ"
# 「しかしながら、残ったアステライトとモンスターには、今までにない兆候も見られる。未だ、予断は許さない状況だ」
line = "「しかしながら、残ったアステライトとモンスターには、今までにない兆候も見られる。未だ、予断は許さない状況だ」"

[[dialogue]]
speaker = "ヘレナ"
# 「そこで──次世代を担うエースの育成、というわけだ」
line = "「そこで──次世代を担うエースの育成、というわけだ」"

[[dialogue]]
speaker = "unk"
# ということは、強いんですね
line = "ということは、強いんですね"

[[dialogue]]
speaker = "ヘレナ"
# 「ああ。星騎士としての実力は私が保証しよう」
line = "「ああ。星騎士としての実力は私が保証しよう」"

[[dialogue]]
speaker = "ヘレナ"
# 「そこで、狛里にプリマステラの資格を与えるかどうか、魔王にはぜひ確かめて欲しいと思ってな」
line = "「そこで、狛里にプリマステラの資格を与えるかどうか、魔王にはぜひ確かめて欲しいと思ってな」"

[[dialogue]]
speaker = "unk"
# 狛里の実力を見せてもらう為、俺たちはアリーナへ移動し、『仮想結界システム』を起動した。
line = "狛里の実力を見せてもらう為、俺たちはアリーナへ移動し、『仮想結界システム』を起動した。"

[[dialogue]]
speaker = "狛里"
# 「それでは、狛里も準備するであります！」
line = "「それでは、狛里も準備するであります！」"

[[dialogue]]
speaker = "狛里"
# 「――変身！」
line = "「――変身！」"

[[dialogue]]
speaker = "狛里"
# 「これが狛里の戦闘服であります！」
line = "「これが狛里の戦闘服であります！」"

[[dialogue]]
speaker = "unk"
# すごく似合ってるよ
line = "すごく似合ってるよ"

[[dialogue]]
speaker = "狛里"
# 「えへへっ♪　ありがとうなのです！」
line = "「えへへっ♪　ありがとうなのです！」"

[[dialogue]]
speaker = "狛里"
# 「可愛い服で、狛里も大好きなのです♪」
line = "「可愛い服で、狛里も大好きなのです♪」"

[[dialogue]]
speaker = "狛里"
# 「では魔王様！　手合わせ、よろしくお願いするであります！」
line = "「では魔王様！　手合わせ、よろしくお願いするであります！」"

[[dialogue]]
speaker = "unk"
# 模擬戦が始まって――しばらく後。
line = "模擬戦が始まって――しばらく後。"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ！　さすがリクリエを打倒した魔王様……とってもお強いのですぅ」
line = "「ばうわふっ！　さすがリクリエを打倒した魔王様……とってもお強いのですぅ」"

[[dialogue]]
speaker = "unk"
# 狛里も、すごい強さだ
line = "狛里も、すごい強さだ"

[[dialogue]]
speaker = "unk"
# 今の俺は魔王の力を使わず、星力のみで戦っている。
line = "今の俺は魔王の力を使わず、星力のみで戦っている。"

[[dialogue]]
speaker = "unk"
# だが、その状態では一進一退。簡単には勝ち切れない程だった。
line = "だが、その状態では一進一退。簡単には勝ち切れない程だった。"

[[dialogue]]
speaker = "ヨミ"
# 「狛里さん、強いとは聞いていましたが、まさかここまでだなんて！」
line = "「狛里さん、強いとは聞いていましたが、まさかここまでだなんて！」"

[[dialogue]]
speaker = "ヨミ"
# （会長に接近戦で引けを取らない……それどころか、野生の獣のような凄まじい気迫を感じさせて……！）
line = "（会長に接近戦で引けを取らない……それどころか、野生の獣のような凄まじい気迫を感じさせて……！）"

[[dialogue]]
speaker = "ヨミ"
# （魔界にいた頃は、一体どんな生活を……？）
line = "（魔界にいた頃は、一体どんな生活を……？）"

[[dialogue]]
speaker = "ヘレナ"
# 「狛里は過酷な状況を乗り越え、魔界の辺境を救ってみせた『英雄』だからな」
line = "「狛里は過酷な状況を乗り越え、魔界の辺境を救ってみせた『英雄』だからな」"

[[dialogue]]
speaker = "ヨミ"
# 「英雄……？」
line = "「英雄……？」"

[[dialogue]]
speaker = "ヘレナ"
# 「――魔王よ。狛里の強さはもう十分に伝わっていると思うが、どうだ？」
line = "「――魔王よ。狛里の強さはもう十分に伝わっていると思うが、どうだ？」"

[[dialogue]]
speaker = "unk"
# そうですね。ここまでにしましょう
line = "そうですね。ここまでにしましょう"

[[dialogue]]
speaker = "狛里"
# 「えっ、もういいのですか？」
line = "「えっ、もういいのですか？」"

[[dialogue]]
speaker = "unk"
# 俺は頷き、プリマステラとしての十分な実力があることを伝える。
line = "俺は頷き、プリマステラとしての十分な実力があることを伝える。"

[[dialogue]]
speaker = "狛里"
