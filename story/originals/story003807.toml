[[dialogue]]
speaker = "unk"
# 俺たちは魔族の大群を退け、丸い宝玉を持った魔族をダウンさせることに成功した。
line = "俺たちは魔族の大群を退け、丸い宝玉を持った魔族をダウンさせることに成功した。"

[[dialogue]]
speaker = "魔族"
# 「い……イ～……」
line = "「い……イ～……」"

[[dialogue]]
speaker = "聖沙"
# 「よし、動きを止めたわ！」
line = "「よし、動きを止めたわ！」"

[[dialogue]]
speaker = "リア"
# 「ふぅ……これで終わりかな？」
line = "「ふぅ……これで終わりかな？」"

[[dialogue]]
speaker = "魔族"
# 「……イ～～」
line = "「……イ～～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「！　待って、何か様子がおかしいわ！」
line = "「！　待って、何か様子がおかしいわ！」"

[[dialogue]]
speaker = "ナナカ"
# 「宝玉が怪しく光って、目に見えるくらいすごい力が溢れ出してる……！」
line = "「宝玉が怪しく光って、目に見えるくらいすごい力が溢れ出してる……！」"

[[dialogue]]
speaker = "unk"
# なんてすさまじい力だ……！
line = "なんてすさまじい力だ……！"

[[dialogue]]
speaker = "unk"
# 鳥肌が立ち、思わず体が震える。
line = "鳥肌が立ち、思わず体が震える。"

[[dialogue]]
speaker = "unk"
# やがて、その力は魔族の体を黒い影で包み込み――
line = "やがて、その力は魔族の体を黒い影で包み込み――"

[[dialogue]]
speaker = "unk"
# やがて１つの禍々しい形を成す。
line = "やがて１つの禍々しい形を成す。"

[[dialogue]]
speaker = "？？？"
# 「……姿を偽るのは、どうやらここまでのようだな」
line = "「……姿を偽るのは、どうやらここまでのようだな」"

[[dialogue]]
speaker = "パッキー"
# 「……！　コイツは……！」
line = "「……！　コイツは……！」"

[[dialogue]]
speaker = "聖沙"
# 「あなた……何者……！？」
line = "「あなた……何者……！？」"

[[dialogue]]
speaker = "ロロット"
# 「もしかして……天使、なのですか……？」
line = "「もしかして……天使、なのですか……？」"

[[dialogue]]
speaker = "パッキー"
# 「コイツは――堕天使『ザタナーン』だ！」
line = "「コイツは――堕天使『ザタナーン』だ！」"

[[dialogue]]
speaker = "リア"
# 「パーちゃん、知ってるの……？」
line = "「パーちゃん、知ってるの……？」"

[[dialogue]]
speaker = "パッキー"
# 「ああ。ひと目見て、すぐに思い出したぜ……！」
line = "「ああ。ひと目見て、すぐに思い出したぜ……！」"

[[dialogue]]
speaker = "パッキー"
# 「俺がこの姿になる前――初代魔王ハーヴィス様と俺たちが戦った、堕天使衆『グリゴリ』の１人……！」
line = "「俺がこの姿になる前――初代魔王ハーヴィス様と俺たちが戦った、堕天使衆『グリゴリ』の１人……！」"

[[dialogue]]
speaker = "パッキー"
# 「いちばん最初にリ・クリエの力を使って、世界を滅ぼそうとした敵だぜ……！」
line = "「いちばん最初にリ・クリエの力を使って、世界を滅ぼそうとした敵だぜ……！」"

[[dialogue]]
speaker = "ザタナーン"
# 「……久しいな、大賢者パッキー。そして――創世の女神ルネア」
line = "「……久しいな、大賢者パッキー。そして――創世の女神ルネア」"

[[dialogue]]
speaker = "ルネア"
# 「なんであなたがここに……！？　グリゴリは、ハーヴィスたち初代クルセイダースが全員倒したはず……！」
line = "「なんであなたがここに……！？　グリゴリは、ハーヴィスたち初代クルセイダースが全員倒したはず……！」"

[[dialogue]]
speaker = "ザタナーン"
# 「……言ったはずだ。たとえ滅びても、神が存在し続ける限り、我らは必ず、再び現れると」
line = "「……言ったはずだ。たとえ滅びても、神が存在し続ける限り、我らは必ず、再び現れると」"

[[dialogue]]
speaker = "パッキー"
# 「もしかして、さっきの宝玉が何か関係あるのか……？」
line = "「もしかして、さっきの宝玉が何か関係あるのか……？」"

[[dialogue]]
speaker = "ザタナーン"
# 「その通り。我の核となっている『リ・クリエ<ruby=ぎょく>玉</ruby>』。我の魂と、リ・クリエの力が宿ったものだ」
line = "「その通り。我の核となっている『リ・クリエ<ruby>玉<rt>ぎょく</rt></ruby>』。我の魂と、リ・クリエの力が宿ったものだ」"

[[dialogue]]
speaker = "ザタナーン"
# 「かつて貴様らに敗れた際、こうして再び蘇れるように、事前に我の魂の一部を切り分け、封じておいたのだ」
line = "「かつて貴様らに敗れた際、こうして再び蘇れるように、事前に我の魂の一部を切り分け、封じておいたのだ」"

[[dialogue]]
speaker = "ルネア"
# 「でも、そこまでのリ・クリエの力をどうやって……！？」
line = "「でも、そこまでのリ・クリエの力をどうやって……！？」"

[[dialogue]]
speaker = "ザタナーン"
# 「年月をかけ、蓄えたのだ。このリ・クリエ玉は、リ・クリエの力を吸収し、蓄積することができる」
line = "「年月をかけ、蓄えたのだ。このリ・クリエ玉は、リ・クリエの力を吸収し、蓄積することができる」"

[[dialogue]]
speaker = "ザタナーン"
# 「我らはリ・クリエが再び必ず起こると予見し、その力を吸収して、復活できる装置として、これを作った」
line = "「我らはリ・クリエが再び必ず起こると予見し、その力を吸収して、復活できる装置として、これを作った」"

[[dialogue]]
speaker = "ザタナーン"
# 「そして先日、女神ルネアが２つに分かれ、破壊神イレアとしてリ・クリエを起こそうとした際――」
line = "「そして先日、女神ルネアが２つに分かれ、破壊神イレアとしてリ・クリエを起こそうとした際――」"

[[dialogue]]
speaker = "ザタナーン"
# 「魔王に敗れ、霧散しかけたリ・クリエの力を吸収することで、我はついに復活を果たしたのだ」
line = "「魔王に敗れ、霧散しかけたリ・クリエの力を吸収することで、我はついに復活を果たしたのだ」"

[[dialogue]]
speaker = "unk"
# 一体なんなんだ……！？
line = "一体なんなんだ……！？"

[[dialogue]]
speaker = "unk"
# 俺たちをここに閉じ込めた目的は
line = "俺たちをここに閉じ込めた目的は"

[[dialogue]]
speaker = "ザタナーン"
# 「……我らの目的は、変わらずただ１つ」
line = "「……我らの目的は、変わらずただ１つ」"

[[dialogue]]
speaker = "ザタナーン"
# 「世界と女神の――『再生』である」
line = "「世界と女神の――『再生』である」"

[[dialogue]]
speaker = "マトイ"
# 「再生……！？」
line = "「再生……！？」"

[[dialogue]]
speaker = "ザタナーン"
# 「……かつて天使・人間・魔族の三種族が争っていた際、女神ルネアはそれを止める為に世界を三つに分けた」
line = "「……かつて天使・人間・魔族の三種族が争っていた際、女神ルネアはそれを止める為に世界を三つに分けた」"

[[dialogue]]
speaker = "ザタナーン"
# 「しかし、そのことで女神でも制御できぬ、三界が１つの世界へと戻ろうとする『再生力』が生まれた。それこそがリ・クリエ」
line = "「しかし、そのことで女神でも制御できぬ、三界が１つの世界へと戻ろうとする『再生力』が生まれた。それこそがリ・クリエ」"

[[dialogue]]
speaker = "ザタナーン"
# 「その時、我らは『神は完璧ではない』と悟ったのだ」
line = "「その時、我らは『神は完璧ではない』と悟ったのだ」"

[[dialogue]]
speaker = "ザタナーン"
# 「そして、神が完璧な存在でないのなら、より完璧な存在になるように再生させる必要がある」
line = "「そして、神が完璧な存在でないのなら、より完璧な存在になるように再生させる必要がある」"

[[dialogue]]
speaker = "ザタナーン"
# 「故に――」
line = "「故に――」"

[[dialogue]]
speaker = "ザタナーン"
# 「我らはリ・クリエの力を使い、女神ルネアを１度完全消去し、新たな神へと作り直す」
line = "「我らはリ・クリエの力を使い、女神ルネアを１度完全消去し、新たな神へと作り直す」"

[[dialogue]]
speaker = "ルネア"
# 「っ……！」
line = "「っ……！」"

[[dialogue]]
speaker = "ヘレナ"
# 「そうか……だから、ルネアの女神の力を封じる為に、異世界側のリゾート結界へ転移させたのだな」
line = "「そうか……だから、ルネアの女神の力を封じる為に、異世界側のリゾート結界へ転移させたのだな」"

[[dialogue]]
speaker = "ザタナーン"
# 「いかにも」
line = "「いかにも」"

[[dialogue]]
speaker = "ザタナーン"
# 「リ・クリエの『抑止力』たる魔王の力か、異世界の魔王が引き寄せられたのは想定外であったが……」
line = "「リ・クリエの『抑止力』たる魔王の力か、異世界の魔王が引き寄せられたのは想定外であったが……」"

[[dialogue]]
speaker = "ザタナーン"
# 「しかし、その際の融合により、魔王が力を発揮できなくなっている今こそ、最大の好機」
line = "「しかし、その際の融合により、魔王が力を発揮できなくなっている今こそ、最大の好機」"

[[dialogue]]
speaker = "unk"
# それでも、ルネアの命は奪わせない！
line = "それでも、ルネアの命は奪わせない！"

[[dialogue]]
speaker = "リア"
# 「そうだよ！　ルネアちゃんは女神様でも、今は私たちにとって、大切な友達なんだから！」
line = "「そうだよ！　ルネアちゃんは女神様でも、今は私たちにとって、大切な友達なんだから！」"

[[dialogue]]
speaker = "ロロット"
# 「大切な友達を、絶対に奪わせません！」
line = "「大切な友達を、絶対に奪わせません！」"

[[dialogue]]
speaker = "聖沙"
# 「それにルネアさんは、間違っても、そこから成長したからこそ、今ここにいるのよ！」
line = "「それにルネアさんは、間違っても、そこから成長したからこそ、今ここにいるのよ！」"

[[dialogue]]
speaker = "聖沙"
# 「それが間違いだなんて、絶対に言わせないわ！」
line = "「それが間違いだなんて、絶対に言わせないわ！」"

[[dialogue]]
speaker = "ナナカ"
# 「そうさ！　ルネアはやっと長い苦しみから解放されて、ここからってところなんだから、邪魔なんてさせないよ！」
line = "「そうさ！　ルネアはやっと長い苦しみから解放されて、ここからってところなんだから、邪魔なんてさせないよ！」"

[[dialogue]]
speaker = "ルネア"
# 「みんな……！」
line = "「みんな……！」"

[[dialogue]]
speaker = "ザタナーン"
# 「下らぬ情など不要。再生は、完璧な神と世界を作り出す為の摂理である」
line = "「下らぬ情など不要。再生は、完璧な神と世界を作り出す為の摂理である」"

[[dialogue]]
speaker = "unk"
# ザタナーンが構え、空間が震える程の強大な力が発せられる。
line = "ザタナーンが構え、空間が震える程の強大な力が発せられる。"

[[dialogue]]
speaker = "聖沙"
# 「だったら……勝負よ！」
line = "「だったら……勝負よ！」"

[[dialogue]]
speaker = "リア"
# 「リ・クリエの力に、私たちは絶対負けたりしないんだから！」
line = "「リ・クリエの力に、私たちは絶対負けたりしないんだから！」"

[[dialogue]]
speaker = "unk"
# こうして、俺たちとザタナーンの戦いが始まるのだった。
line = "こうして、俺たちとザタナーンの戦いが始まるのだった。"
