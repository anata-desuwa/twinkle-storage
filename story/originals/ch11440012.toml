[[dialogue]]
speaker = "unk"
# 第２話,辺境の英雄,P
line = "第２話,辺境の英雄,P"

[[dialogue]]
speaker = "unk"
# 狛里がカティアと知り合ってから、少し経ったある日の放課後。
line = "狛里がカティアと知り合ってから、少し経ったある日の放課後。"

[[dialogue]]
speaker = "unk"
# 俺たちは『仮想結界』の中で、一緒に戦闘訓練を行うことになった。
line = "俺たちは『仮想結界』の中で、一緒に戦闘訓練を行うことになった。"

[[dialogue]]
speaker = "カティア"
# 「狛里、負けないワン！」
line = "「狛里、負けないワン！」"

[[dialogue]]
speaker = "狛里"
# 「はいっ、カティア先輩！　ライバル同士、仲良く勝負なのです♪」
line = "「はいっ、カティア先輩！　ライバル同士、仲良く勝負なのです♪」"

[[dialogue]]
speaker = "カティア"
# 「だから、ライバルの意味を間違ってるガオ！」
line = "「だから、ライバルの意味を間違ってるガオ！」"

[[dialogue]]
speaker = "unk"
# そんなやり取りをしながら、仮想モンスター相手の訓練が始まった。
line = "そんなやり取りをしながら、仮想モンスター相手の訓練が始まった。"

[[dialogue]]
speaker = "モンスター"
# 「グルルルル……！」
line = "「グルルルル……！」"

[[dialogue]]
speaker = "狛里"
# 「そこであります！」
line = "「そこであります！」"

[[dialogue]]
speaker = "unk"
# 狛里は一瞬で懐へ飛び込み、敵を撃破する。更に――
line = "狛里は一瞬で懐へ飛び込み、敵を撃破する。更に――"

[[dialogue]]
speaker = "モンスターたち"
# 「ガアアッ！」
line = "「ガアアッ！」"

[[dialogue]]
speaker = "狛里"
# 「後ろから３匹！」
line = "「後ろから３匹！」"

[[dialogue]]
speaker = "カティア"
# 「えっ！？」
line = "「えっ！？」"

[[dialogue]]
speaker = "unk"
# カティアが振り向くより早く、狛里は敵の気配を察知していた。
line = "カティアが振り向くより早く、狛里は敵の気配を察知していた。"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ！」
line = "「ばうわふっ！」"

[[dialogue]]
speaker = "unk"
# 狛里は３匹の攻撃を最小限の動きでかわしながら、一撃ずつ確実に仕留めていく。
line = "狛里は３匹の攻撃を最小限の動きでかわしながら、一撃ずつ確実に仕留めていく。"

[[dialogue]]
speaker = "カティア"
# 「す、すごい……！」
line = "「す、すごい……！」"

[[dialogue]]
speaker = "unk"
# 戦闘終了後。
line = "戦闘終了後。"

[[dialogue]]
speaker = "unk"
# 休憩中に、カティアは隣に座る狛里へ問いかけた。
line = "休憩中に、カティアは隣に座る狛里へ問いかけた。"

[[dialogue]]
speaker = "カティア"
# 「あのさ……狛里って、なんでそんなに強いの？」
line = "「あのさ……狛里って、なんでそんなに強いの？」"

[[dialogue]]
speaker = "狛里"
# 「え？」
line = "「え？」"

[[dialogue]]
speaker = "カティア"
# 「私もプリマステラを目指してるからわかるけど……」
line = "「私もプリマステラを目指してるからわかるけど……」"

[[dialogue]]
speaker = "カティア"
# 「狛里は転入してきたばかりなのに、明らかに戦い慣れてる動きだったから……」
line = "「狛里は転入してきたばかりなのに、明らかに戦い慣れてる動きだったから……」"

[[dialogue]]
speaker = "狛里"
# 「……実は狛里、１年くらい前に、たくさんの『敵』と戦ってたのです」
line = "「……実は狛里、１年くらい前に、たくさんの『敵』と戦ってたのです」"

[[dialogue]]
speaker = "カティア"
# 「たくさんの敵……？」
line = "「たくさんの敵……？」"

[[dialogue]]
speaker = "狛里"
# 「狛里の故郷は、魔界の辺境にある小さな村なのですが――」
line = "「狛里の故郷は、魔界の辺境にある小さな村なのですが――」"

[[dialogue]]
speaker = "狛里"
# 「１年前、村の近くにある大空洞で異変が起きて、まわりの魔物たちがいっせいに狂暴化して、村を襲うようになったのです」
line = "「１年前、村の近くにある大空洞で異変が起きて、まわりの魔物たちがいっせいに狂暴化して、村を襲うようになったのです」"

[[dialogue]]
speaker = "狛里"
# 「大空洞には、大昔に封印された魔獣の『白虎』が眠っていたそうで……」
line = "「大空洞には、大昔に封印された魔獣の『白虎』が眠っていたそうで……」"

[[dialogue]]
speaker = "狛里"
# 「その魔力を受けて、まわりの魔物たちが白虎の眷族になっちゃったのです」
line = "「その魔力を受けて、まわりの魔物たちが白虎の眷族になっちゃったのです」"

[[dialogue]]
speaker = "カティア"
# 「そんなことが……」
line = "「そんなことが……」"

[[dialogue]]
speaker = "狛里"
# 「狂暴化した魔物たちは、昼も夜も、ずっと村を襲ってきたのです」
line = "「狂暴化した魔物たちは、昼も夜も、ずっと村を襲ってきたのです」"

[[dialogue]]
speaker = "狛里"
# 「……村で唯一星力を使えて、戦えるのは狛里だけだったのであります」
line = "「……村で唯一星力を使えて、戦えるのは狛里だけだったのであります」"

[[dialogue]]
speaker = "狛里"
# 「だから狛里が村の門番になって、みんなを守ることになったのです」
line = "「だから狛里が村の門番になって、みんなを守ることになったのです」"

[[dialogue]]
speaker = "カティア"
# 「ひ、１人でっ！？」
line = "「ひ、１人でっ！？」"

[[dialogue]]
speaker = "狛里"
# 「といっても、たった１ヵ月の間だけであります」
line = "「といっても、たった１ヵ月の間だけであります」"

[[dialogue]]
speaker = "unk"
# 狛里は笑ってみせながら言う。
line = "狛里は笑ってみせながら言う。"

[[dialogue]]
speaker = "狛里"
# 「でも、あの時はいつ助けが来るかもわからなくて……」
line = "「でも、あの時はいつ助けが来るかもわからなくて……」"

[[dialogue]]
speaker = "狛里"
# 「狛里が頑張らないと、みんなが危ないって思って、とにかく必死だったのです」
line = "「狛里が頑張らないと、みんなが危ないって思って、とにかく必死だったのです」"

[[dialogue]]
speaker = "狛里"
# 「そのあと、近くの街から星騎士の人たちが助けに来てくれて、最後は白虎も倒すことができたのであります」
line = "「そのあと、近くの街から星騎士の人たちが助けに来てくれて、最後は白虎も倒すことができたのであります」"

[[dialogue]]
speaker = "unk"
# 『辺境の英雄』って呼ばれてると聞いた
line = "『辺境の英雄』って呼ばれてると聞いた"

[[dialogue]]
speaker = "unk"
# 狛里が白虎にトドメを刺して
line = "狛里が白虎にトドメを刺して"

[[dialogue]]
speaker = "unk"
# ヘレナちゃんから狛里を紹介してもらった後、その村で何があったのかについても、ある程度話は聞いていた。
line = "ヘレナちゃんから狛里を紹介してもらった後、その村で何があったのかについても、ある程度話は聞いていた。"

[[dialogue]]
speaker = "狛里"
# 「他の星騎士さんたちの力も借りましたし、たまたま狛里が最後にトドメを刺しただけなのですっ」
line = "「他の星騎士さんたちの力も借りましたし、たまたま狛里が最後にトドメを刺しただけなのですっ」"

[[dialogue]]
speaker = "狛里"
# 「でも、それがきっかけで九浄家の人にスカウトされて……」
line = "「でも、それがきっかけで九浄家の人にスカウトされて……」"

[[dialogue]]
speaker = "狛里"
# 「一緒に戦った星騎士さんたちや、村のみんなに背中を押されて、人間界へ来ることを決めたのです」
line = "「一緒に戦った星騎士さんたちや、村のみんなに背中を押されて、人間界へ来ることを決めたのです」"

[[dialogue]]
speaker = "カティア"
# 「そうだったんだ……」
line = "「そうだったんだ……」"

[[dialogue]]
speaker = "狛里"
# 「それで、狛里には目標があるのです！」
line = "「それで、狛里には目標があるのです！」"

[[dialogue]]
speaker = "カティア"
# 「目標？」
line = "「目標？」"

[[dialogue]]
speaker = "狛里"
# 「はいっ！」
line = "「はいっ！」"

[[dialogue]]
speaker = "unk"
# 狛里は力強く頷く。
line = "狛里は力強く頷く。"

[[dialogue]]
speaker = "狛里"
# 「１人で門番をやって、白虎との戦いでも生き残ることができて――」
line = "「１人で門番をやって、白虎との戦いでも生き残ることができて――」"

[[dialogue]]
speaker = "狛里"
# 「だからこそ狛里は、『幸せに生きたい』って強く思ったのです！」
line = "「だからこそ狛里は、『幸せに生きたい』って強く思ったのです！」"

[[dialogue]]
speaker = "狛里"
# 「村のみんなも、これからは狛里のやりたいことを見つけてほしいって言って、送り出してくれたのです」
line = "「村のみんなも、これからは狛里のやりたいことを見つけてほしいって言って、送り出してくれたのです」"

[[dialogue]]
speaker = "狛里"
# 「だから狛里は、人間界で自分の夢――」
line = "「だから狛里は、人間界で自分の夢――」"

[[dialogue]]
speaker = "狛里"
# 「幸せな生き方を見つけたいのであります！」
line = "「幸せな生き方を見つけたいのであります！」"

[[dialogue]]
speaker = "カティア"
# 「その……」
line = "「その……」"

[[dialogue]]
speaker = "カティア"
# 「そういうことなら、困った時は私が相談に乗ってあげてもいい……ワン」
line = "「そういうことなら、困った時は私が相談に乗ってあげてもいい……ワン」"

[[dialogue]]
speaker = "狛里"
# 「え？」
line = "「え？」"

[[dialogue]]
speaker = "unk"
# 狛里は目をぱちくりさせた後、耳をぴんと立てて。
line = "狛里は目をぱちくりさせた後、耳をぴんと立てて。"

[[dialogue]]
speaker = "狛里"
# 「カティア先輩、本当なのです！？」
line = "「カティア先輩、本当なのです！？」"

[[dialogue]]
speaker = "カティア"
# 「ら、ライバルだけど……私は１年先輩なんだから、それくらいしてあげてもいい……ガオ！」
line = "「ら、ライバルだけど……私は１年先輩なんだから、それくらいしてあげてもいい……ガオ！」"

[[dialogue]]
speaker = "狛里"
# 「う～っ！　カティア先輩～っ♪」
line = "「う～っ！　カティア先輩～っ♪」"

[[dialogue]]
speaker = "カティア"
# 「わっ！？」
line = "「わっ！？」"

[[dialogue]]
speaker = "unk"
# 狛里は勢いよく、カティアに抱きついた。
line = "狛里は勢いよく、カティアに抱きついた。"

[[dialogue]]
speaker = "狛里"
# 「ありがとうなのです～っ♪　ばうわ～ふっ♪」
line = "「ありがとうなのです～っ♪　ばうわ～ふっ♪」"

[[dialogue]]
speaker = "カティア"
# 「い、言っとくけど、ライバルなのは変わらないからね！？」
line = "「い、言っとくけど、ライバルなのは変わらないからね！？」"

[[dialogue]]
speaker = "カティア"
# 「今は狛里の方が強くても、魔王様の第一のしもべの座は譲らないガオ！」
line = "「今は狛里の方が強くても、魔王様の第一のしもべの座は譲らないガオ！」"

[[dialogue]]
speaker = "狛里"
# 「えへへへへへぇ<emoji=heart04>　くんくん♪」
line = "「えへへへへへぇ<emoji=heart04>　くんくん♪」"

[[dialogue]]
speaker = "カティア"
# 「って、どさくさに紛れて服の中まで顔を突っ込んで匂いを嗅ぐなぁ！？」
line = "「って、どさくさに紛れて服の中まで顔を突っ込んで匂いを嗅ぐなぁ！？」"

[[dialogue]]
speaker = "狛里"
# 「カティア先輩、大好きであります～♪」
line = "「カティア先輩、大好きであります～♪」"

[[dialogue]]
speaker = "カティア"
# 「なっ！？　なに言ってるの、本当に！？」
line = "「なっ！？　なに言ってるの、本当に！？」"

[[dialogue]]
speaker = "unk"
# カティアの顔が真っ赤になる。だが、今回は振りほどこうとはしなかった。
line = "カティアの顔が真っ赤になる。だが、今回は振りほどこうとはしなかった。"

[[dialogue]]
speaker = "unk"
# その様子を見ながら、俺は思わず笑ってしまう。
line = "その様子を見ながら、俺は思わず笑ってしまう。"

[[dialogue]]
speaker = "unk"
# 狛里、よかったな
line = "狛里、よかったな"

[[dialogue]]
speaker = "狛里"
# 「はいっ！」
line = "「はいっ！」"

[[dialogue]]
speaker = "狛里"
# 「これから、よろしくお願いするであります！　カティア先輩♪」
line = "「これから、よろしくお願いするであります！　カティア先輩♪」"

[[dialogue]]
speaker = "カティア"
# 「わ、わかったから！　訓練の続きをやるよ！」
line = "「わ、わかったから！　訓練の続きをやるよ！」"

[[dialogue]]
speaker = "カティア"
# 「私も負けないで、さっきのモンスターを倒してみせるんだからっ！」
line = "「私も負けないで、さっきのモンスターを倒してみせるんだからっ！」"

[[dialogue]]
speaker = "狛里"
# 「ばうわふっ♪　一緒にお手伝いするのです！」
line = "「ばうわふっ♪　一緒にお手伝いするのです！」"

[[dialogue]]
speaker = "カティア"
# 「それじゃ意味ないガオ！」
line = "「それじゃ意味ないガオ！」"

[[dialogue]]
speaker = "unk"
# どうやら２人は、本当に仲良くなれそうだ。
line = "どうやら２人は、本当に仲良くなれそうだ。"

[[dialogue]]
speaker = "unk"
# その日以来、狛里とカティアはよく一緒に戦闘訓練をするようになるのだった。
line = "その日以来、狛里とカティアはよく一緒に戦闘訓練をするようになるのだった。"
