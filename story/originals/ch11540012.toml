[[dialogue]]
speaker = "unk"
# 第２話,イタズラ好きなスーパーレディ,P
line = "第２話,イタズラ好きなスーパーレディ,P"

[[dialogue]]
speaker = "unk"
# その日、俺とヴィーナスとマトイの３人で星徒会室に着くと、机の上に見慣れないものが置いてあった。
line = "その日、俺とヴィーナスとマトイの３人で星徒会室に着くと、机の上に見慣れないものが置いてあった。"

[[dialogue]]
speaker = "マトイ"
# 「あれ？　これって……カセットテープレコーダー？」
line = "「あれ？　これって……カセットテープレコーダー？」"

[[dialogue]]
speaker = "unk"
# 本当だ。でも、なんでここに……？
line = "本当だ。でも、なんでここに……？"

[[dialogue]]
speaker = "ヴィーナス"
# 「ねぇ、マトイ。『かせっとてーぷ』って何？」
line = "「ねぇ、マトイ。『かせっとてーぷ』って何？」"

[[dialogue]]
speaker = "マトイ"
# 「え！？　カセットテープって、まだ普通に知られてるものなんじゃないの！？」
line = "「え！？　カセットテープって、まだ普通に知られてるものなんじゃないの！？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「？　私は今日、初めて知ったわ！」
line = "「？　私は今日、初めて知ったわ！」"

[[dialogue]]
speaker = "unk"
# と、その時。カチッという音と共に、レコーダーが動き出す。
line = "と、その時。カチッという音と共に、レコーダーが動き出す。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 『おはよう、星徒会の諸君！』
line = "『おはよう、星徒会の諸君！』"

[[dialogue]]
speaker = "マトイ"
# 「この声……異世界のヘレナさん？」
line = "「この声……異世界のヘレナさん？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 『今日は諸君に頼みたい任務がある。詳細は機密事項につき、直接会って伝える』
line = "『今日は諸君に頼みたい任務がある。詳細は機密事項につき、直接会って伝える』"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 『なお――このテープは自動的に爆発して消滅する』
line = "『なお――このテープは自動的に爆発して消滅する』"

[[dialogue]]
speaker = "マトイ"
# 「爆発！？」
line = "「爆発！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「どっか～ん♪」
line = "「どっか～ん♪」"

[[dialogue]]
speaker = "マトイ"
# 「きゃあぁっ！？」
line = "「きゃあぁっ！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ♪　いい反応ね、マトイちゃん。お姉さん、からかい甲斐があるわ～♪」
line = "「ふふっ♪　いい反応ね、マトイちゃん。お姉さん、からかい甲斐があるわ～♪」"

[[dialogue]]
speaker = "unk"
# ヘレナさん、いつの間に……！
line = "ヘレナさん、いつの間に……！"

[[dialogue]]
speaker = "ヴィーナス"
# 「ヘレナお姉ちゃん！」
line = "「ヘレナお姉ちゃん！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あら～、ヴィーナスちゃ～ん！　お姉ちゃんが遊びに来たわよ～♪　ぎゅ～っ<emoji=heart04>」
line = "「あら～、ヴィーナスちゃ～ん！　お姉ちゃんが遊びに来たわよ～♪　ぎゅ～っ<emoji=heart04>」"

[[dialogue]]
speaker = "ヴィーナス"
# 「んっ♪　えへへ～<emoji=heart04>　そんな撫でられたらくすぐったいわ♪」
line = "「んっ♪　えへへ～<emoji=heart04>　そんな撫でられたらくすぐったいわ♪」"

[[dialogue]]
speaker = "マトイ"
# 「なんか知らない間に、ヘレナさんとヴィーナスがめっちゃ仲良くなってる！？」
line = "「なんか知らない間に、ヘレナさんとヴィーナスがめっちゃ仲良くなってる！？」"

[[dialogue]]
speaker = "リア"
# 「あはは……こっちの世界の九浄家に泊まらせてもらってる間に、すっかり家族みたいになっちゃって～」
line = "「あはは……こっちの世界の九浄家に泊まらせてもらってる間に、すっかり家族みたいになっちゃって～」"

[[dialogue]]
speaker = "マトイ"
# 「リアさん！　一緒にいらっしゃったんですね」
line = "「リアさん！　一緒にいらっしゃったんですね」"

[[dialogue]]
speaker = "リア"
# 「マトイちゃん、会長くん、こんにちは～」
line = "「マトイちゃん、会長くん、こんにちは～」"

[[dialogue]]
speaker = "ヴィーナス"
# 「あっ！　リアお姉ちゃんも遊びに来てくれたのね♪」
line = "「あっ！　リアお姉ちゃんも遊びに来てくれたのね♪」"

[[dialogue]]
speaker = "リア"
# 「ヴィーナスちゃ～ん<emoji=heart04>　そうなの～、私も遊びに来ちゃった♪　お姉ちゃんも、頭をなでなで～<emoji=heart04>」
line = "「ヴィーナスちゃ～ん<emoji=heart04>　そうなの～、私も遊びに来ちゃった♪　お姉ちゃんも、頭をなでなで～<emoji=heart04>」"

[[dialogue]]
speaker = "ヴィーナス"
# 「えへへ～♪　リアお姉ちゃんにも撫でてもらえて、嬉しいわ♪」
line = "「えへへ～♪　リアお姉ちゃんにも撫でてもらえて、嬉しいわ♪」"

[[dialogue]]
speaker = "マトイ"
# 「なんかリアさんも、ヴィーナスに対しての態度が変わってる！？」
line = "「なんかリアさんも、ヴィーナスに対しての態度が変わってる！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ、実はね、リアったら――ヴィーナスちゃんを妹みたいだって改めて思ったら、急に可愛くて仕方なくなっちゃったみたいなのよ～♪」
line = "「ふふっ、実はね、リアったら――ヴィーナスちゃんを妹みたいだって改めて思ったら、急に可愛くて仕方なくなっちゃったみたいなのよ～♪」"

[[dialogue]]
speaker = "マトイ"
# 「九浄家で何があったのか、気になるんですけど……」
line = "「九浄家で何があったのか、気になるんですけど……」"

[[dialogue]]
speaker = "unk"
# 俺たちに頼みたい任務っていうのは？
line = "俺たちに頼みたい任務っていうのは？"

[[dialogue]]
speaker = "unk"
# それでヘレナさん
line = "それでヘレナさん"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ああ、それね♪　ほら、私は向こうの世界で流星学園の理事長をやってるって、この前話したでしょ？」
line = "「ああ、それね♪　ほら、私は向こうの世界で流星学園の理事長をやってるって、この前話したでしょ？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「だから、こっちの学園を見学して、いいところは積極的に取り入れたいって考えてるのよ」
line = "「だから、こっちの学園を見学して、いいところは積極的に取り入れたいって考えてるのよ」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「それで魔王ちゃんたちには、新星学園の星徒会の仕事を見せてもらえないかな～と思って♪」
line = "「それで魔王ちゃんたちには、新星学園の星徒会の仕事を見せてもらえないかな～と思って♪」"

[[dialogue]]
speaker = "unk"
# 俺たちはヘレナさんのお願いを承諾して、星徒会の業務を見せることになった。
line = "俺たちはヘレナさんのお願いを承諾して、星徒会の業務を見せることになった。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――なるほど。それなら、ここはこうした方が、もっと効率がよくなるんじゃないかしら？」
line = "「――なるほど。それなら、ここはこうした方が、もっと効率がよくなるんじゃないかしら？」"

[[dialogue]]
speaker = "unk"
# あっ、確かに……！　ありがとうございます
line = "あっ、確かに……！　ありがとうございます"

[[dialogue]]
speaker = "マトイ"
# 「あはは、なんだか、私たちの方が逆にアドバイスをもらっちゃってる感じだね」
line = "「あはは、なんだか、私たちの方が逆にアドバイスをもらっちゃってる感じだね」"

[[dialogue]]
speaker = "ヴィーナス"
# 「さすがヘレナお姉ちゃんね！　まあ、私には難しくて、よくわからないけど！」
line = "「さすがヘレナお姉ちゃんね！　まあ、私には難しくて、よくわからないけど！」"

[[dialogue]]
speaker = "リア"
# 「お姉ちゃんは元生徒会長で、なんでもこなせちゃう『スーパーレディー』だからね～」
line = "「お姉ちゃんは元生徒会長で、なんでもこなせちゃう『スーパーレディー』だからね～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「や～ね、なんでもできるわけじゃないわよ。経験があるから、コツがわかるってだけ」
line = "「や～ね、なんでもできるわけじゃないわよ。経験があるから、コツがわかるってだけ」"

[[dialogue]]
speaker = "マトイ"
# 「ヘレナさん、あの……もしよければなんですけど、後で戦闘訓練も見てもらえたりとかってできますか」
line = "「ヘレナさん、あの……もしよければなんですけど、後で戦闘訓練も見てもらえたりとかってできますか」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あら、私に？」
line = "「あら、私に？」"

[[dialogue]]
speaker = "unk"
# その後、星徒会の仕事がひと段落してから、俺たちはリゾート結界のプライベートビーチへと移動した。
line = "その後、星徒会の仕事がひと段落してから、俺たちはリゾート結界のプライベートビーチへと移動した。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「――私に訓練を頼んできたのは、マトイちゃんの巫女フォームが二刀流だからってわけね♪」
line = "「――私に訓練を頼んできたのは、マトイちゃんの巫女フォームが二刀流だからってわけね♪」"

[[dialogue]]
speaker = "マトイ"
# 「はい。この前のヘレナさん、すごい剣捌きだったので……」
line = "「はい。この前のヘレナさん、すごい剣捌きだったので……」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「よ～し、そういうことなら、さっそく刀を交えてみましょうか♪」
line = "「よ～し、そういうことなら、さっそく刀を交えてみましょうか♪」"

[[dialogue]]
speaker = "マトイ"
# 「よろしくお願いします！」
line = "「よろしくお願いします！」"

[[dialogue]]
speaker = "unk"
# そうして、ヘレナさんと実戦訓練を行うマトイだったが……。
line = "そうして、ヘレナさんと実戦訓練を行うマトイだったが……。"

[[dialogue]]
speaker = "マトイ"
# 「ま、参りました……！　ヘレナさん、やっぱりとんでもなく強い……！」
line = "「ま、参りました……！　ヘレナさん、やっぱりとんでもなく強い……！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あら、マトイちゃんこそ、二刀流で戦うようになってからそんなに経ってないのに、これだけ使いこなせたら大したものよ♪」
line = "「あら、マトイちゃんこそ、二刀流で戦うようになってからそんなに経ってないのに、これだけ使いこなせたら大したものよ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「さすが最前線で戦い続けてる星騎士ね～。私の方は、体の動きがまだ思考について来なくて、長く戦ってなかったブランクを感じちゃうわ」
line = "「さすが最前線で戦い続けてる星騎士ね～。私の方は、体の動きがまだ思考について来なくて、長く戦ってなかったブランクを感じちゃうわ」"

[[dialogue]]
speaker = "マトイ"
# 「え？　いやいや！　ブランク含めても、全然勝てる気がしませんでしたよ！？」
line = "「え？　いやいや！　ブランク含めても、全然勝てる気がしませんでしたよ！？」"

[[dialogue]]
speaker = "unk"
# 向こうの九浄家に伝わるものだったり？
line = "向こうの九浄家に伝わるものだったり？"

[[dialogue]]
speaker = "unk"
# 二刀流の剣技って
line = "二刀流の剣技って"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ん？　あははっ、そんなものないわよ～。私の二刀流剣術は、自分で作った我流よ。我流♪」
line = "「ん？　あははっ、そんなものないわよ～。私の二刀流剣術は、自分で作った我流よ。我流♪」"

[[dialogue]]
speaker = "マトイ"
# 「我流！？」
line = "「我流！？」"

[[dialogue]]
speaker = "リア"
# 「お姉ちゃんの二刀流は、好きな洋画に出てくる、刀使いのオジサマが使う剣技が元ネタなんだよ～」
line = "「お姉ちゃんの二刀流は、好きな洋画に出てくる、刀使いのオジサマが使う剣技が元ネタなんだよ～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そうなのよ～♪　映画自体はＢ級で、いかにも日本じゃなく海外で作られましたって感じのインチキ侍アクションなんだけど～」
line = "「そうなのよ～♪　映画自体はＢ級で、いかにも日本じゃなく海外で作られましたって感じのインチキ侍アクションなんだけど～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「でも、主人公のオジサマは、それはもう渋くて素敵でね？　銃を一切使わず、二刀流の日本刀で無双するのが、痺れるカッコよさなのよ～<emoji=heart04>」
line = "「でも、主人公のオジサマは、それはもう渋くて素敵でね？　銃を一切使わず、二刀流の日本刀で無双するのが、痺れるカッコよさなのよ～<emoji=heart04>」"

[[dialogue]]
speaker = "マトイ"
# 「映画の真似でこの強さ！？　やっぱり普通じゃない……！」
line = "「映画の真似でこの強さ！？　やっぱり普通じゃない……！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ヘレナお姉ちゃんは、まさにスーパーなレディーということね！」
line = "「ヘレナお姉ちゃんは、まさにスーパーなレディーということね！」"

[[dialogue]]
speaker = "リア"
# 「でも、意外と子供っぽいところもあるんだけどね～」
line = "「でも、意外と子供っぽいところもあるんだけどね～」"

[[dialogue]]
speaker = "リア"
# 「イタズラ好きだったり～、ネギが嫌いで、料理に入ってると、お父さんお母さんに見つからないように、こっそり私に食べてもらおうとしたり～」
line = "「イタズラ好きだったり～、ネギが嫌いで、料理に入ってると、お父さんお母さんに見つからないように、こっそり私に食べてもらおうとしたり～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「こら、リア～？　お姉ちゃんの弱点を人様に教えちゃうなんて、悪い子ね～」
line = "「こら、リア～？　お姉ちゃんの弱点を人様に教えちゃうなんて、悪い子ね～」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そんな悪い子にはお仕置きよ？　――えいっ<emoji=heart04>」
line = "「そんな悪い子にはお仕置きよ？　――えいっ<emoji=heart04>」"

[[dialogue]]
speaker = "リア"
# 「きゃあっ！？　ちょっと、お姉ちゃん！？」
line = "「きゃあっ！？　ちょっと、お姉ちゃん！？」"

[[dialogue]]
speaker = "unk"
# ヘレナさんはリア先輩の背後に回ると――なんと、その大きな胸を掴んで揉み始めた。
line = "ヘレナさんはリア先輩の背後に回ると――なんと、その大きな胸を掴んで揉み始めた。"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あら♪　リアったら、また少し大きくなったんじゃな～い？」
line = "「あら♪　リアったら、また少し大きくなったんじゃな～い？」"

[[dialogue]]
speaker = "リア"
# 「も、もうっ、そういうとこだよ、お姉ちゃん！　恥ずかしいから、触るのやめて～！」
line = "「も、もうっ、そういうとこだよ、お姉ちゃん！　恥ずかしいから、触るのやめて～！」"

[[dialogue]]
speaker = "マトイ"
# 「ちょっ、ヘレナさん！？　会長も見ているのに、またそんな……！」
line = "「ちょっ、ヘレナさん！？　会長も見ているのに、またそんな……！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ♪　これは姉妹のコミュニケーションよ、コミュニケーション<emoji=heart04>」
line = "「ふふっ♪　これは姉妹のコミュニケーションよ、コミュニケーション<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# お、俺は何も見てませんよ！？
line = "お、俺は何も見てませんよ！？"

[[dialogue]]
speaker = "マトイ"
# 「そう言いつつ、顔を覆う指の隙間がガッツリ開いてるけど！？」
line = "「そう言いつつ、顔を覆う指の隙間がガッツリ開いてるけど！？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「ふふっ、こっちの世界のヘレナちゃんに似て、面白いお姉ちゃんよね♪」
line = "「ふふっ、こっちの世界のヘレナちゃんに似て、面白いお姉ちゃんよね♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ヴィーナスちゃんも、お姉ちゃんとコミュニケーションどうかしら～？」
line = "「ヴィーナスちゃんも、お姉ちゃんとコミュニケーションどうかしら～？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「えっ、いいの！？　私もリアお姉ちゃんの胸を揉めばいいってことよね♪」
line = "「えっ、いいの！？　私もリアお姉ちゃんの胸を揉めばいいってことよね♪」"

[[dialogue]]
speaker = "リア"
# 「私を揉む方なの！？」
line = "「私を揉む方なの！？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ぷっ……あははははっ♪　その返しは思いつかなかったわ～」
line = "「ぷっ……あははははっ♪　その返しは思いつかなかったわ～」"

[[dialogue]]
speaker = "unk"
# ヘレナさんはヴィーナスの言葉がツボに入ったらしく、噴き出して楽しそうに笑うのだった。
line = "ヘレナさんはヴィーナスの言葉がツボに入ったらしく、噴き出して楽しそうに笑うのだった。"
