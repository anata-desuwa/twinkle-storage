[[dialogue]]
speaker = "ヨミ"
# 「こやっ！？　ふ、ふにゃあ～……<emoji=heart04>」
line = "「こやっ！？　ふ、ふにゃあ～……<emoji=heart04>」"

[[dialogue]]
speaker = "ミヤハル"
