# 「こやややややぁぁぁぁ～～っ！？」
line = "「こやややややぁぁぁぁ～～っ！？」"

[[dialogue]]
speaker = "ミヤハル"
# 「次の願望みたいやねぇ♪」
line = "「次の願望みたいやねぇ♪」"

[[dialogue]]
speaker = "クロト"
# 「くんくん」
line = "「くんくん」"

[[dialogue]]
