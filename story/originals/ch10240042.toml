[[dialogue]]
speaker = "unk"
# 第２話,ヨミとミヤハルと煩悩解放,P
line = "第２話,ヨミとミヤハルと煩悩解放,P"

[[dialogue]]
speaker = "unk"
# その日、ヨミは巫女の力を扱う星騎士――陰陽師の『<ruby=あべの>安倍野</ruby>ミヤハル』の元を訪れていた。
line = "その日、ヨミは巫女の力を扱う星騎士――陰陽師の『<ruby>安倍野<rt>あべの</rt></ruby>ミヤハル』の元を訪れていた。"

[[dialogue]]
speaker = "ヨミ"
# 「――ミヤハルさん、こんな感じなんですけど、どうでしょう？」
line = "「――ミヤハルさん、こんな感じなんですけど、どうでしょう？」"

[[dialogue]]
speaker = "ミヤハル"
# 「うんうん♪　ヨミはんの巫女舞、ほんま綺麗やわぁ<emoji=heart04>　見るたびに、どんどん上達しとるねぇ♪」
line = "「うんうん♪　ヨミはんの巫女舞、ほんま綺麗やわぁ<emoji=heart04>　見るたびに、どんどん上達しとるねぇ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「ありがとうございます♪　ミヤハルさんのご指導のおかげです」
line = "「ありがとうございます♪　ミヤハルさんのご指導のおかげです」"

[[dialogue]]
speaker = "ミヤハル"
# 「天ヶ崎の舞は、うちん家の巫女舞とはまた違う魅力があるわぁ♪」
line = "「天ヶ崎の舞は、うちん家の巫女舞とはまた違う魅力があるわぁ♪」"

[[dialogue]]
speaker = "unk"
# 最近、よくミヤハルの所に来てるんだって？
line = "最近、よくミヤハルの所に来てるんだって？"

[[dialogue]]
speaker = "ヨミ"
# 「はい。ミヤハルさんは巫女としても先輩ですし、ご指導頂いているんです」
line = "「はい。ミヤハルさんは巫女としても先輩ですし、ご指導頂いているんです」"

[[dialogue]]
speaker = "ミヤハル"
# 「うちは巫女の力を教えるんが家のお役目やけど、ヨミはんの巫女の力は別流派みたいなもんやからなぁ」
line = "「うちは巫女の力を教えるんが家のお役目やけど、ヨミはんの巫女の力は別流派みたいなもんやからなぁ」"

[[dialogue]]
speaker = "ミヤハル"
# 「うちもええ刺激をもろて、勉強させてもろうとるんよ♪」
line = "「うちもええ刺激をもろて、勉強させてもろうとるんよ♪」"

[[dialogue]]
speaker = "ミヤハル"
# 「ヨミはん、せっかくやし、今日は巫女舞以外も試してみよか？」
line = "「ヨミはん、せっかくやし、今日は巫女舞以外も試してみよか？」"

[[dialogue]]
speaker = "ヨミ"
# 「はい！　よろしくお願いします」
line = "「はい！　よろしくお願いします」"

[[dialogue]]
speaker = "ミヤハル"
# 「ただし、その『破邪の鈴』を使う時は気ぃ付けや」
line = "「ただし、その『破邪の鈴』を使う時は気ぃ付けや」"

[[dialogue]]
speaker = "ヨミ"
# 「え？」
line = "「え？」"

[[dialogue]]
speaker = "ミヤハル"
# 「この前から見とる限りやと、持ち主の願いや想いを増幅する性質がありそうなんよ」
line = "「この前から見とる限りやと、持ち主の願いや想いを増幅する性質がありそうなんよ」"

[[dialogue]]
speaker = "ミヤハル"
# 「うちの陰陽術に似とる気配がするわぁ」
line = "「うちの陰陽術に似とる気配がするわぁ」"

[[dialogue]]
speaker = "ヨミ"
# 「そうなんですか？　わかりました、気を付けますね」
line = "「そうなんですか？　わかりました、気を付けますね」"

[[dialogue]]
speaker = "unk"
# それからしばらくして。
line = "それからしばらくして。"

[[dialogue]]
speaker = "ヨミ"
# 「――よしっ、今日は爆裂絶好調です♪」
line = "「――よしっ、今日は爆裂絶好調です♪」"

[[dialogue]]
speaker = "unk"
# すごくいい感じだ！
line = "すごくいい感じだ！"

[[dialogue]]
speaker = "unk"
# ヨミのエクスノヴァフォーム
line = "ヨミのエクスノヴァフォーム"

[[dialogue]]
speaker = "ヨミ"
# 「！　えへへへっ♪」
line = "「！　えへへへっ♪」"

[[dialogue]]
speaker = "unk"
# 俺が褒めると嬉しそうに、ヨミの尻尾がぶんぶんと揺れる。
line = "俺が褒めると嬉しそうに、ヨミの尻尾がぶんぶんと揺れる。"

[[dialogue]]
speaker = "ヨミ"
# 「この調子で――破邪の鈴！」
line = "「この調子で――破邪の鈴！」"

[[dialogue]]
speaker = "unk"
# ふにゃあ～
line = "ふにゃあ～"

[[dialogue]]
speaker = "unk"
# 不意に、俺の意識が微睡むように揺らいだ。
line = "不意に、俺の意識が微睡むように揺らいだ。"

[[dialogue]]
speaker = "クロト"
# 「…………ヨミ」
line = "「…………ヨミ」"

[[dialogue]]
speaker = "ヨミ"
# 「はい？　会長、どうしました？」
line = "「はい？　会長、どうしました？」"

[[dialogue]]
speaker = "ミヤハル"
# 「あらぁ？　これは……」
line = "「あらぁ？　これは……」"

[[dialogue]]
speaker = "クロト"
# 「ヨミは、今日も頑張っていて偉いな」
line = "「ヨミは、今日も頑張っていて偉いな」"

[[dialogue]]
speaker = "クロト"
# 「真面目だし、努力家だし……」
line = "「真面目だし、努力家だし……」"

[[dialogue]]
speaker = "クロト"
# 「何より――可愛いし」
line = "「何より――可愛いし」"

[[dialogue]]
speaker = "ヨミ"
# 「こやっ！？　かかか、会長！？」
line = "「こやっ！？　かかか、会長！？」"

[[dialogue]]
speaker = "クロト"
# 「――さすが俺の好きになった女の子だ」
line = "「――さすが俺の好きになった女の子だ」"

[[dialogue]]
speaker = "ヨミ"
# 「こやぁ～っ！？」
line = "「こやぁ～っ！？」"

[[dialogue]]
speaker = "ミヤハル"
# 「どうやら……ボロン<emoji=heart04>　と出てしもうたみたいやねぇ<emoji=heart04>」
line = "「どうやら……ボロン<emoji=heart04>　と出てしもうたみたいやねぇ<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「ボロン！？　な、何がですか！？」
line = "「ボロン！？　な、何がですか！？」"

[[dialogue]]
speaker = "ミヤハル"
# 「それは――ヨミはんの『煩悩』や<emoji=heart04>」
line = "「それは――ヨミはんの『煩悩』や<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「煩悩ぉ！？」
line = "「煩悩ぉ！？」"

[[dialogue]]
speaker = "ミヤハル"
# 「会長はんがおかしゅうなったんは、おそらく破邪の鈴の力で――」
line = "「会長はんがおかしゅうなったんは、おそらく破邪の鈴の力で――」"

[[dialogue]]
speaker = "ミヤハル"
# 「ヨミはんが心の奥で願っとることを、演じさせてしもうとるんや<emoji=heart04>」
line = "「ヨミはんが心の奥で願っとることを、演じさせてしもうとるんや<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「そ、そんなこと――」
line = "「そ、そんなこと――」"

[[dialogue]]
speaker = "クロト"
# 「ヨミはもっと褒められるべきだ」
line = "「ヨミはもっと褒められるべきだ」"

[[dialogue]]
speaker = "ヨミ"
# 「～～～～っ！？」
line = "「～～～～っ！？」"

[[dialogue]]
speaker = "ミヤハル"
# 「あるみたいやねぇ♪」
line = "「あるみたいやねぇ♪」"

[[dialogue]]
speaker = "クロト"
# 「よしよし」
line = "「よしよし」"

[[dialogue]]
speaker = "unk"
