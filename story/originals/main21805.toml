[[dialogue]]
speaker = "unk"
# 第５話,ラスト・ナンバー,B
line = "第５話,ラスト・ナンバー,B"

[[dialogue]]
speaker = "unk"
# かつてナターシャがデネブの世界で相対した、テルルに代わる女神の幼体。
line = "かつてナターシャがデネブの世界で相対した、テルルに代わる女神の幼体。"

[[dialogue]]
speaker = "unk"
# それに瓜二つの少女が、そこにいた。
line = "それに瓜二つの少女が、そこにいた。"

[[dialogue]]
speaker = "ナターシャ"
# 「ルヴィネ……？」
line = "「ルヴィネ……？」"

[[dialogue]]
speaker = "メルエル"
# 「──！　あの子が、極星学園星徒会のリーダー！？」
line = "「──！　あの子が、極星学園星徒会のリーダー！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「……いや、違う。デネブで会った時と、雰囲気が……全然違う！！」
line = "「……いや、違う。デネブで会った時と、雰囲気が……全然違う！！」"

[[dialogue]]
speaker = "？？？"
# 「混乱しているようね、散乃ナターシャ。無理もないことだわ」
line = "「混乱しているようね、散乃ナターシャ。無理もないことだわ」"

[[dialogue]]
speaker = "？？？"
# 「……どうせ貴女たちは、緋宮クロトに私の存在を伝えることは叶わない。だから、冥土の土産に教えてあげましょう」
line = "「……どうせ貴女たちは、緋宮クロトに私の存在を伝えることは叶わない。だから、冥土の土産に教えてあげましょう」"

[[dialogue]]
speaker = "？？？"
# 「私はお父様の手によって製造された、新たなる女神──その、最後のルヴィネ」
line = "「私はお父様の手によって製造された、新たなる女神──その、最後のルヴィネ」"

[[dialogue]]
speaker = "ラストナンバー"
# 「そうね……『<ruby=ラストナンバー>最終個体</ruby>』とでも称するのが適切かしら？」
line = "「そうね……『<ruby>最終個体<rt>ラストナンバー</rt></ruby>』とでも称するのが適切かしら？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ラスト、ナンバー？　どういうこと……？」
line = "「ラスト、ナンバー？　どういうこと……？」"

[[dialogue]]
speaker = "unk"
# ルヴィネに代わる存在として、新たに製造された女神。それについての疑問ではない。
line = "ルヴィネに代わる存在として、新たに製造された女神。それについての疑問ではない。"

[[dialogue]]
speaker = "unk"
# なぜこのルヴィネは、<b>わざわざ最後の個体である</b>、と名乗るのか──？
line = "なぜこのルヴィネは、<b>わざわざ最後の個体である</b>、と名乗るのか──？"

[[dialogue]]
speaker = "ラストナンバー"
# 「姫咲メルエル。そして散乃ナターシャ。お前たちの戦いぶりは本当に見事だったわ」
line = "「姫咲メルエル。そして散乃ナターシャ。お前たちの戦いぶりは本当に見事だったわ」"

[[dialogue]]
speaker = "ラストナンバー"
# 「──『<ruby=スター・リユニオン>星の再会</ruby>』。あの作戦さえ成立しなければ、お父様は敗れなかった」
line = "「──『<ruby>星の再会<rt>スター・リユニオン</rt></ruby>』。あの作戦さえ成立しなければ、お父様は敗れなかった」"

[[dialogue]]
speaker = "メルエル"
# 「……っ！？　な、何を、言っているの！？」
line = "「……っ！？　な、何を、言っているの！？」"

[[dialogue]]
speaker = "unk"
# 天界から招致した増援を一堂に会する作戦のことを、メルエルたちは緋宮クロトから聞いていた。
line = "天界から招致した増援を一堂に会する作戦のことを、メルエルたちは緋宮クロトから聞いていた。"

[[dialogue]]
speaker = "unk"
# しかしそれはまだ──実現していない。
line = "しかしそれはまだ──実現していない。"

[[dialogue]]
speaker = "ナターシャ"
# 「まだ起こってもいない作戦を、体験してきたように語るんだね？」
line = "「まだ起こってもいない作戦を、体験してきたように語るんだね？」"

[[dialogue]]
speaker = "ナターシャ"
# 「お前……いったい、どこから来たの？」
line = "「お前……いったい、どこから来たの？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「私は遠くない未来で生まれた。緋宮クロトに追い詰められ、絶命を逃れられないお父様が遺した、最後の希望」
line = "「私は遠くない未来で生まれた。緋宮クロトに追い詰められ、絶命を逃れられないお父様が遺した、最後の希望」"

[[dialogue]]
speaker = "ラストナンバー"
# 「世界の再創生のため。創造神であるお父様が消滅する未来を書き換えるため──過去へ飛ばされた最終個体」
line = "「世界の再創生のため。創造神であるお父様が消滅する未来を書き換えるため──過去へ飛ばされた最終個体」"

[[dialogue]]
speaker = "ナターシャ"
# 「……やることなすこと滅茶苦茶になってきたね。いくらなんでも往生際が悪すぎない？」
line = "「……やることなすこと滅茶苦茶になってきたね。いくらなんでも往生際が悪すぎない？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「本当はもっと昔……魔王が<ruby=レナトゥス>封理再誕</ruby>から目覚めたあたりに飛べれば話は単純だった」
line = "「本当はもっと昔……魔王が<ruby>封理再誕<rt>レナトゥス</rt></ruby>から目覚めたあたりに飛べれば話は単純だった」"

[[dialogue]]
speaker = "ラストナンバー"
# 「けれど仕方がない。次元転送装置を用いずに平行世界に干渉すれば、時間の概念が曖昧になってしまう」
line = "「けれど仕方がない。次元転送装置を用いずに平行世界に干渉すれば、時間の概念が曖昧になってしまう」"

[[dialogue]]
speaker = "ラストナンバー"
# 「過去、あるいは未来へ方向を決め、到着地点もわからない時の旅を行うしか方法がなかった……」
line = "「過去、あるいは未来へ方向を決め、到着地点もわからない時の旅を行うしか方法がなかった……」"

[[dialogue]]
speaker = "メルエル"
# 「会長くんは……『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』に勝利する。その未来を変えるために、貴女はやってきた……？」
line = "「会長くんは……『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』に勝利する。その未来を変えるために、貴女はやってきた……？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「ええ。その通りよ。緋宮クロトは、お父様を弑するだけの力を備えた、最強の魔王だった」
line = "「ええ。その通りよ。緋宮クロトは、お父様を弑するだけの力を備えた、最強の魔王だった」"

[[dialogue]]
speaker = "ラストナンバー"
# 「けれど、この時間からなら巻き返せる。敗北のきっかけとなったのは『星の再会』……」
line = "「けれど、この時間からなら巻き返せる。敗北のきっかけとなったのは『星の再会』……」"

[[dialogue]]
speaker = "ラストナンバー"
# 「それによってネビュラの魔女が、デネブの土を踏んだことよ」
line = "「それによってネビュラの魔女が、デネブの土を踏んだことよ」"

[[dialogue]]
speaker = "ラストナンバー"
# 「リノという魔女が、ディザスターハンドと邂逅さえしなければ……お父様の勝ちは不動のものだった」
line = "「リノという魔女が、ディザスターハンドと邂逅さえしなければ……お父様の勝ちは不動のものだった」"

[[dialogue]]
speaker = "ラストナンバー"
# 「だから全てを覆す。魔王の描いた決戦の絵図を、書き換えてみせましょう」
line = "「だから全てを覆す。魔王の描いた決戦の絵図を、書き換えてみせましょう」"

[[dialogue]]
speaker = "ナターシャ"
# 「ネビュラだとか、ディザスターハンドがどうとか……そもそも未来から飛んできたとかさ、よくわかんないことばっかりだけど──」
line = "「ネビュラだとか、ディザスターハンドがどうとか……そもそも未来から飛んできたとかさ、よくわかんないことばっかりだけど──」"

[[dialogue]]
speaker = "ナターシャ"
# 「メルエル。やることは１つだよ」
line = "「メルエル。やることは１つだよ」"

[[dialogue]]
speaker = "メルエル"
# 「うん！　私たちの行動を邪魔するために、あの子はここに来た……ということは！」
line = "「うん！　私たちの行動を邪魔するために、あの子はここに来た……ということは！」"

[[dialogue]]
speaker = "メルエル"
# 「ここで負けることは、『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』に勝利する未来が否定されちゃうってこと……絶対に勝たなくちゃ！」
line = "「ここで負けることは、『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』に勝利する未来が否定されちゃうってこと……絶対に勝たなくちゃ！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「試すことそのものが不合理と判断するわ。最終個体である私は、ルヴィネシリーズの中でも最強の能力を持っている──」
line = "「試すことそのものが不合理と判断するわ。最終個体である私は、ルヴィネシリーズの中でも最強の能力を持っている──」"

[[dialogue]]
speaker = "メルエル"
# 「──ディヴォーテッド・スラスト！！」
line = "「──ディヴォーテッド・スラスト！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「体験しなければわからないかしら？」
line = "「体験しなければわからないかしら？」"

[[dialogue]]
speaker = "メルエル"
# 「きゃああぁああっ！？」
line = "「きゃああぁああっ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「今ッ──！！」
line = "「今ッ──！！」"

[[dialogue]]
speaker = "unk"
# 本来、従者であるナターシャは、吹き飛ばされるメルエルをサポートするのが普通だ。
line = "本来、従者であるナターシャは、吹き飛ばされるメルエルをサポートするのが普通だ。"

[[dialogue]]
speaker = "unk"
# だからこその奇襲だった。極限までメルエルの影に隠れ、一息にラストナンバーの首を取る──はずだった。
line = "だからこその奇襲だった。極限までメルエルの影に隠れ、一息にラストナンバーの首を取る──はずだった。"

[[dialogue]]
speaker = "ナターシャ"
# 「──っ！？」
line = "「──っ！？」"

[[dialogue]]
speaker = "unk"
# いつの間にか肉薄していたラストナンバーが、振りぬこうとしていたナターシャの得物の柄を掴んでいる。
line = "いつの間にか肉薄していたラストナンバーが、振りぬこうとしていたナターシャの得物の柄を掴んでいる。"

[[dialogue]]
speaker = "ナターシャ"
# （技が起こる前に──止められた！？）
line = "（技が起こる前に──止められた！？）"

[[dialogue]]
speaker = "ラストナンバー"
# 「とても楽ね──この『眼』があると」
line = "「とても楽ね──この『眼』があると」"

[[dialogue]]
speaker = "ナターシャ"
# 「『天機の星眼』っ！？」
line = "「『天機の星眼』っ！？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「あの『影』が持っていたような劣化品ではない。オリジナルと同等、いえそれ以上の性能を持つ眼を創ってもらったわ」
line = "「あの『影』が持っていたような劣化品ではない。オリジナルと同等、いえそれ以上の性能を持つ眼を創ってもらったわ」"

[[dialogue]]
speaker = "ラストナンバー"
# 「これでもう、アクシデントは起こらない。私はこの星眼を使って、お父様の消滅する未来を回避してみせる──」
line = "「これでもう、アクシデントは起こらない。私はこの星眼を使って、お父様の消滅する未来を回避してみせる──」"

[[dialogue]]
speaker = "ナターシャ"
# 「──つ、ぅ。ふざけないでよっ……無理ゲーにもほどがあるんだけど！」
line = "「──つ、ぅ。ふざけないでよっ……無理ゲーにもほどがあるんだけど！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「抵抗は無意味──その意味はわかったでしょう？　頼みの綱の魔王は、人間界にいる……天界の惨事には気付いていない」
line = "「抵抗は無意味──その意味はわかったでしょう？　頼みの綱の魔王は、人間界にいる……天界の惨事には気付いていない」"

[[dialogue]]
speaker = "ラストナンバー"
# 「お前たちは全滅する。天界からの増援は失敗し、『星の再会』は瓦解する。そうなればもう星騎士陣営の勝ちはあり得ない」
line = "「お前たちは全滅する。天界からの増援は失敗し、『星の再会』は瓦解する。そうなればもう星騎士陣営の勝ちはあり得ない」"

[[dialogue]]
speaker = "ラストナンバー"
# 「<ruby=私の出来損ない>白いルヴィネ</ruby>がアルタイルに侵攻する……そのタイミングで人間界を急襲し、すり潰す。未来はもう視えているわ」
line = "「<ruby>白いルヴィネ<rt>私の出来損ない</rt></ruby>がアルタイルに侵攻する……そのタイミングで人間界を急襲し、すり潰す。未来はもう視えているわ」"

[[dialogue]]
speaker = "メルエル"
# 「絶対にやらせないよ、そんなこと！　世界の未来のためにも、会長くんのためにも……！！」
line = "「絶対にやらせないよ、そんなこと！　世界の未来のためにも、会長くんのためにも……！！」"

[[dialogue]]
speaker = "ラストナンバー"
# 「従者からよく呑気だと言われているようだけれど、本当にその通りね。貴女、不思議に思わなかったの？」
line = "「従者からよく呑気だと言われているようだけれど、本当にその通りね。貴女、不思議に思わなかったの？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「やろうと思えばすぐに葬ることができる。私はそれだけの力を持っている」
line = "「やろうと思えばすぐに葬ることができる。私はそれだけの力を持っている」"

[[dialogue]]
speaker = "ラストナンバー"
# 「それなのにどうして……神殿最奥まで、侵入を許したと思う？」
line = "「それなのにどうして……神殿最奥まで、侵入を許したと思う？」"

[[dialogue]]
speaker = "メルエル"
# 「な、何を言ってるの……！？」
line = "「な、何を言ってるの……！？」"

[[dialogue]]
speaker = "ラストナンバー"
# 「姫咲メルエル。お前の先祖は２０００年前に、この過ちに満ちた世界を刷新しようとした」
line = "「姫咲メルエル。お前の先祖は２０００年前に、この過ちに満ちた世界を刷新しようとした」"

[[dialogue]]
speaker = "ラストナンバー"
# 「『太陽の壁画』に遺されるほどの働きを為した──それを私は評価しているのよ」
line = "「『太陽の壁画』に遺されるほどの働きを為した──それを私は評価しているのよ」"

[[dialogue]]
speaker = "unk"
# ラストナンバーの掌の中に、暗黒色の瘴気が形成され──渦巻き始める。
line = "ラストナンバーの掌の中に、暗黒色の瘴気が形成され──渦巻き始める。"

[[dialogue]]
speaker = "ラストナンバー"
# 「さあ──もう一度。目覚めなさい」
line = "「さあ──もう一度。目覚めなさい」"

[[dialogue]]
speaker = "ナターシャ"
# 「──メルエルっ！　避けて！！」
line = "「──メルエルっ！　避けて！！」"

[[dialogue]]
speaker = "メルエル"
# 「────きゃぁあぁあっ！？」
line = "「────きゃぁあぁあっ！？」"

[[dialogue]]
speaker = "unk"
# まるで意思を持っているかのように瘴気がメルエルに殺到し、包み込んでゆく──
line = "まるで意思を持っているかのように瘴気がメルエルに殺到し、包み込んでゆく──"

[[dialogue]]
speaker = "ラストナンバー"
# 「未来を変えるために、手駒はいくらあってもいい」
line = "「未来を変えるために、手駒はいくらあってもいい」"

[[dialogue]]
speaker = "ラストナンバー"
# 「姫咲メルエル。お前をリクリエの使徒として──再創生の手伝いをさせてあげましょう」
line = "「姫咲メルエル。お前をリクリエの使徒として──再創生の手伝いをさせてあげましょう」"
