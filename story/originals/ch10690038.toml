[[dialogue]]
speaker = "セシア"
# 「おま○こが──ぁっ、溶けそうなくらいっ、んぅぅっ、気持ちよくってぇっ……ぁっぁっ！　おかしく、なってしまうわっ<emoji=heart04>　んっ、んんぅぅっ……<emoji=heart04>」
