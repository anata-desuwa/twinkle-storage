[[dialogue]]
speaker = "unk"
# 第１話,シルヴィ先輩と海デート,P
line = "第１話,シルヴィ先輩と海デート,P"

[[dialogue]]
speaker = "unk"
# 今日はシルヴィ先輩のリクエストで海にやってきた。
line = "今日はシルヴィ先輩のリクエストで海にやってきた。"

[[dialogue]]
speaker = "シルヴィ"
# 「へー、これが本物の海かぁ……」
line = "「へー、これが本物の海かぁ……」"

[[dialogue]]
speaker = "シルヴィ"
# 「いや、もちろん見たことはあるんだけど、ちゃんと『海に来た』のは初めてかも。リゾート結界もよかったけど、本物も素敵だね」
line = "「いや、もちろん見たことはあるんだけど、ちゃんと『海に来た』のは初めてかも。リゾート結界もよかったけど、本物も素敵だね」"

[[dialogue]]
speaker = "シルヴィ"
# 「天界は海がないから、新鮮だよ。人間界で言うと、ウミナシケンってやつ？」
line = "「天界は海がないから、新鮮だよ。人間界で言うと、ウミナシケンってやつ？」"

[[dialogue]]
speaker = "シルヴィ"
# 「それにしても…………」
line = "「それにしても…………」"

[[dialogue]]
speaker = "シルヴィ"
# 「人が！　多い！！　あはははははっ！」
line = "「人が！　多い！！　あはははははっ！」"

[[dialogue]]
speaker = "unk"
# 当然、夏の海水浴場は人でごった返している。家族連れ、カップル、若者のグループ、そこら中に人が溢れていた。
line = "当然、夏の海水浴場は人でごった返している。家族連れ、カップル、若者のグループ、そこら中に人が溢れていた。"

[[dialogue]]
speaker = "シルヴィ"
# 「いやー、人間界ってホントに人多いよね。うちの田舎はお祭りのときでもこんなに混まないから、テンション上がっちゃう！」
line = "「いやー、人間界ってホントに人多いよね。うちの田舎はお祭りのときでもこんなに混まないから、テンション上がっちゃう！」"

[[dialogue]]
speaker = "unk"
# 先輩、手を
line = "先輩、手を"

[[dialogue]]
speaker = "シルヴィ"
# 「うん、ありがとう。はぐれたら大変だもんね」
line = "「うん、ありがとう。はぐれたら大変だもんね」"

[[dialogue]]
speaker = "シルヴィ"
# 「にぎにぎ……にぎにぎ……会長くんの手、汗ばんでるね。なんか緊張してる？　久々のデートだから？」
line = "「にぎにぎ……にぎにぎ……会長くんの手、汗ばんでるね。なんか緊張してる？　久々のデートだから？」"

[[dialogue]]
speaker = "シルヴィ"
# 「そ・れ・と・も～～……あたしの水着にドキドキしてるのかな？　会長くんのエッチ」
line = "「そ・れ・と・も～～……あたしの水着にドキドキしてるのかな？　会長くんのエッチ」"

[[dialogue]]
speaker = "unk"
# 頷くしかできない。それくらい、シルヴィ先輩の水着姿は刺激的だった。
line = "頷くしかできない。それくらい、シルヴィ先輩の水着姿は刺激的だった。"

[[dialogue]]
speaker = "シルヴィ"
# 「あははっ、照れちゃってかわいいっ。でもせっかくの水着なんだから、ちゃんと見て欲しいな。恋人なんだからじっくり見ていいんだよ」
line = "「あははっ、照れちゃってかわいいっ。でもせっかくの水着なんだから、ちゃんと見て欲しいな。恋人なんだからじっくり見ていいんだよ」"

[[dialogue]]
speaker = "シルヴィ"
# 「ほーら、見て見て」
line = "「ほーら、見て見て」"

[[dialogue]]
speaker = "シルヴィ"
# 「それに……まだ感想、聞いてないよ？」
line = "「それに……まだ感想、聞いてないよ？」"

[[dialogue]]
speaker = "unk"
# すごく似合ってます
line = "すごく似合ってます"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩の健康的な体を華やかな水着が彩っていて、本当に綺麗だ。
line = "シルヴィ先輩の健康的な体を華やかな水着が彩っていて、本当に綺麗だ。"

[[dialogue]]
speaker = "unk"
# だけど同時に、ボディラインがはっきりわかって目に毒でもある。
line = "だけど同時に、ボディラインがはっきりわかって目に毒でもある。"

[[dialogue]]
speaker = "シルヴィ"
# 「ふふっ、ありがとう。言わせたみたいになってごめんね。でもすごく嬉しいっ！」
line = "「ふふっ、ありがとう。言わせたみたいになってごめんね。でもすごく嬉しいっ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「さぁ、これからどうしよっか」
line = "「さぁ、これからどうしよっか」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩が俺の腕に抱き着いた。必然的に柔らかい感触が押し付けられる。
line = "シルヴィ先輩が俺の腕に抱き着いた。必然的に柔らかい感触が押し付けられる。"

[[dialogue]]
speaker = "シルヴィ"
# 「ん？　どーしたの？」
line = "「ん？　どーしたの？」"

[[dialogue]]
speaker = "シルヴィ"
# 「おっぱいが当たってる？　うん、わざと。こんなに人がいるんだもん。会長くんはあたしのだってアピールしとかなきゃ」
line = "「おっぱいが当たってる？　うん、わざと。こんなに人がいるんだもん。会長くんはあたしのだってアピールしとかなきゃ」"

[[dialogue]]
speaker = "シルヴィ"
# 「会長くんも、あたしからよそ見しちゃダメだからね？」
line = "「会長くんも、あたしからよそ見しちゃダメだからね？」"

[[dialogue]]
speaker = "unk"
# よそ見なんてしませんよ
line = "よそ見なんてしませんよ"

[[dialogue]]
speaker = "unk"
# そんなことできるわけがない。シルヴィ先輩しか視界にないから。
line = "そんなことできるわけがない。シルヴィ先輩しか視界にないから。"

[[dialogue]]
speaker = "シルヴィ"
# 「ふふっ、よろしい」
line = "「ふふっ、よろしい」"

[[dialogue]]
speaker = "シルヴィ"
# 「じゃあ、まずは泳ぎ──ちょっと待って！」
line = "「じゃあ、まずは泳ぎ──ちょっと待って！」"

[[dialogue]]
speaker = "シルヴィ"
# 「あっちの海の家、メガジャンボチキン売ってるって！　のぼりが立ってる！　行ってみようよ！」
line = "「あっちの海の家、メガジャンボチキン売ってるって！　のぼりが立ってる！　行ってみようよ！」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩が俺の手を引いて走る。
line = "シルヴィ先輩が俺の手を引いて走る。"

[[dialogue]]
speaker = "unk"
# 興味を持ったら一直線で、俺より年上だけど、こういうところは子どもみたいだ。
line = "興味を持ったら一直線で、俺より年上だけど、こういうところは子どもみたいだ。"

[[dialogue]]
speaker = "シルヴィ"
# 「ほら、着いた！」
line = "「ほら、着いた！」"

[[dialogue]]
speaker = "unk"
# 傍に立つのぼりには、でかでかと『メガジャンボチキン』と書いてあった。さっきいたところからは距離があったけど、よく見付けられたものだ。
line = "傍に立つのぼりには、でかでかと『メガジャンボチキン』と書いてあった。さっきいたところからは距離があったけど、よく見付けられたものだ。"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしを呼ぶチキンの声が聞こえたんだよ！　チキンあるところシルヴィあり、だからね！」
line = "「あたしを呼ぶチキンの声が聞こえたんだよ！　チキンあるところシルヴィあり、だからね！」"

[[dialogue]]
speaker = "シルヴィ"
# 「おじさーん！　メガジャンボチキンくださーい！」
line = "「おじさーん！　メガジャンボチキンくださーい！」"

[[dialogue]]
speaker = "おじさん"
# 「あ、ごめんね。メガジャンボチキンは１日１０食限定なんだ。なにせメガジャンボだからね」
line = "「あ、ごめんね。メガジャンボチキンは１日１０食限定なんだ。なにせメガジャンボだからね」"

[[dialogue]]
speaker = "シルヴィ"
# 「そんなー！　チキンの声は幻聴だった！？」
line = "「そんなー！　チキンの声は幻聴だった！？」"

[[dialogue]]
speaker = "おじさん"
# 「普通のフライドチキンならあるよ？」
line = "「普通のフライドチキンならあるよ？」"

[[dialogue]]
speaker = "シルヴィ"
# 「よかった、幻聴じゃなかった！　それふたつください！」
line = "「よかった、幻聴じゃなかった！　それふたつください！」"

[[dialogue]]
speaker = "おじさん"
# 「はいよ、毎度あり～」
line = "「はいよ、毎度あり～」"

[[dialogue]]
speaker = "unk"
# おじさんから受け取ったのは、文字通り普通のフライドチキンだった。フライドチキン以外の何物でもなかった。
line = "おじさんから受け取ったのは、文字通り普通のフライドチキンだった。フライドチキン以外の何物でもなかった。"

[[dialogue]]
speaker = "シルヴィ"
# 「はい、会長くんの分」
line = "「はい、会長くんの分」"

[[dialogue]]
speaker = "シルヴィ"
# 「いただきまーす。……もぐもぐ……もぐもぐ……あはっ、あはははっ！」
line = "「いただきまーす。……もぐもぐ……もぐもぐ……あはっ、あはははっ！」"

[[dialogue]]
speaker = "シルヴィ"
# 「ほんっとうに普通のフライドチキンだー！！　あははははっ！」
line = "「ほんっとうに普通のフライドチキンだー！！　あははははっ！」"

[[dialogue]]
speaker = "unk"
# 俺もひとかじり……うん、実にフライドチキン。
line = "俺もひとかじり……うん、実にフライドチキン。"

[[dialogue]]
speaker = "unk"
# 普通に美味しい。でも流星市国ならどこでも食べられるくらいの味だ。
line = "普通に美味しい。でも流星市国ならどこでも食べられるくらいの味だ。"

[[dialogue]]
speaker = "シルヴィ"
# 「せっかく海まで来たのに、結局いつもと同じことしてる！　あはははっ！　なんか可笑しいね」
line = "「せっかく海まで来たのに、結局いつもと同じことしてる！　あはははっ！　なんか可笑しいね」"

[[dialogue]]
speaker = "シルヴィ"
# 「会長くん、付き合ってくれてありがとう。振り回しちゃってごめんね」
line = "「会長くん、付き合ってくれてありがとう。振り回しちゃってごめんね」"

[[dialogue]]
speaker = "unk"
# 謝る必要なんてない。そんなシルヴィ先輩が好きだし、振り回されるのだって好きだ。
line = "謝る必要なんてない。そんなシルヴィ先輩が好きだし、振り回されるのだって好きだ。"

[[dialogue]]
speaker = "unk"
# むしろこれからも振り回されたいです
line = "むしろこれからも振り回されたいです"

[[dialogue]]
speaker = "シルヴィ"
# 「言ったな～？　じゃあこれからもどんどん振り回しちゃうから、覚悟してねっ」
line = "「言ったな～？　じゃあこれからもどんどん振り回しちゃうから、覚悟してねっ」"

[[dialogue]]
speaker = "シルヴィ"
# 「あ、そうだ。写真撮ろうよ、写真。今日一緒に海に来たこと、記録に残しておこう」
line = "「あ、そうだ。写真撮ろうよ、写真。今日一緒に海に来たこと、記録に残しておこう」"

[[dialogue]]
speaker = "シルヴィ"
# 「ほらほら、もっと寄って。見切れちゃうよ」
line = "「ほらほら、もっと寄って。見切れちゃうよ」"

[[dialogue]]
speaker = "unk"
# お互いに水着同士だから、体が密着すると、素肌と素肌が触れ合う。
line = "お互いに水着同士だから、体が密着すると、素肌と素肌が触れ合う。"

[[dialogue]]
speaker = "unk"
# なんとか平静を装いながら、なんとかＤＩＳＣの画面に収まった。
line = "なんとか平静を装いながら、なんとかＤＩＳＣの画面に収まった。"

[[dialogue]]
speaker = "シルヴィ"
# 「じゃあ撮るよ。はい、チーズ…………隙ありっ」
line = "「じゃあ撮るよ。はい、チーズ…………隙ありっ」"

[[dialogue]]
speaker = "シルヴィ"
# 「ちゅっ」
line = "「ちゅっ」"

[[dialogue]]
speaker = "unk"
# シャッターの瞬間、シルヴィ先輩が俺の頬にキスをした。突然の感触に戸惑ってしまう。
line = "シャッターの瞬間、シルヴィ先輩が俺の頬にキスをした。突然の感触に戸惑ってしまう。"

[[dialogue]]
speaker = "シルヴィ"
# 「あはっ、いい写真撮れたねっ！」
line = "「あはっ、いい写真撮れたねっ！」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩が見せてくれたＤＩＳＣには、驚いた顔の俺と、俺にキスするシルヴィ先輩の横顔が映っていた。
line = "シルヴィ先輩が見せてくれたＤＩＳＣには、驚いた顔の俺と、俺にキスするシルヴィ先輩の横顔が映っていた。"
