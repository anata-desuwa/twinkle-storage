# ふにゃっと笑ってくれるのが可愛い。
line = "ふにゃっと笑ってくれるのが可愛い。"

[[dialogue]]
speaker = "unk"
# けど、俺の欲望は底なしで、脈動を繰り返しては、こってり濃厚な白濁液をクーシェンに注ぎ続けている。
line = "けど、俺の欲望は底なしで、脈動を繰り返しては、こってり濃厚な白濁液をクーシェンに注ぎ続けている。"

[[dialogue]]
speaker = "クーシェン"
# 「んぅ～<emoji=heart04>　もー、ボクが可愛いからって、何回ドクドクするのぉ？」
line = "「んぅ～<emoji=heart04>　もー、ボクが可愛いからって、何回ドクドクするのぉ？」"

[[dialogue]]
speaker = "クーシェン"
# 「にーにーのせーしでおなかずっしり重いし……まあ、いつもこうだから、別にいいけどね<emoji=heart04>」
line = "「にーにーのせーしでおなかずっしり重いし……まあ、いつもこうだから、別にいいけどね<emoji=heart04>」"

[[dialogue]]
speaker = "クーシェン"
# 「何度もこんなエッチされちゃってるから、ボクも癖になっちゃった。にーにーのせーし、気持ちいいよ<emoji=heart04>」
line = "「何度もこんなエッチされちゃってるから、ボクも癖になっちゃった。にーにーのせーし、気持ちいいよ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# クーシェンは嬉しそうに俺の射精を最後まで受け止めてくれた。
line = "クーシェンは嬉しそうに俺の射精を最後まで受け止めてくれた。"

[[dialogue]]
speaker = "クーシェン"
# 「んうっ……どろぉ～～って出ちゃう……<emoji=heart04>」
line = "「んうっ……どろぉ～～って出ちゃう……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 射精を終えたペニスを抜き取ると、腹圧で押し出されたザーメンが大量に溢れ出た。
line = "射精を終えたペニスを抜き取ると、腹圧で押し出されたザーメンが大量に溢れ出た。"

[[dialogue]]
speaker = "クーシェン"
# 「またこぼしちゃった<emoji=heart04>　せっかくにーにーがいっぱい出してくれたのにごめんなさい」
line = "「またこぼしちゃった<emoji=heart04>　せっかくにーにーがいっぱい出してくれたのにごめんなさい」"

[[dialogue]]
speaker = "クーシェン"
# 「ボクが進化したら、これ全部受け止められるのかなぁ？」
line = "「ボクが進化したら、これ全部受け止められるのかなぁ？」"

[[dialogue]]
speaker = "クロト"
# 「うん、きっとね」
line = "「うん、きっとね」"

[[dialogue]]
speaker = "クーシェン"
# 「あ、でも……そのときはニンシンしちゃうね<emoji=heart04>　ねぇ、にーにー、どうする？」
line = "「あ、でも……そのときはニンシンしちゃうね<emoji=heart04>　ねぇ、にーにー、どうする？」"

[[dialogue]]
speaker = "クーシェン"
# 「ボクはね……にーにーのこと、好きだなって思うようになってから、そのこと考えてるよ」
line = "「ボクはね……にーにーのこと、好きだなって思うようになってから、そのこと考えてるよ」"

[[dialogue]]
speaker = "クーシェン"
# 「えへへへ<emoji=heart04>」
line = "「えへへへ<emoji=heart04>」"

[[dialogue]]
speaker = "クーシェン"
# 「いつかにーにーの赤ちゃん産んであげるね<emoji=heart04>」
line = "「いつかにーにーの赤ちゃん産んであげるね<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# そんなことを言われたら、射精直後だっていきり立つ。
line = "そんなことを言われたら、射精直後だっていきり立つ。"

[[dialogue]]
speaker = "unk"
# ザーメンまみれの肉棒はムクムクと膨らみ、上を向いてしまう。
line = "ザーメンまみれの肉棒はムクムクと膨らみ、上を向いてしまう。"

[[dialogue]]
speaker = "クーシェン"
# 「あれ？　にーにー？　もしかしてボク余計なこと言っちゃった？　おち○ちんこわいよ？」
line = "「あれ？　にーにー？　もしかしてボク余計なこと言っちゃった？　おち○ちんこわいよ？」"

[[dialogue]]
speaker = "クロト"
# 「大丈夫、１回じゃ終わらないのはいつものことだろ」
line = "「大丈夫、１回じゃ終わらないのはいつものことだろ」"

[[dialogue]]
speaker = "クーシェン"
# 「そ、そうだけど……ボク、まだニンシンしないよ？」
line = "「そ、そうだけど……ボク、まだニンシンしないよ？」"

[[dialogue]]
speaker = "クロト"
# 「だから、今から予行演習だ」
line = "「だから、今から予行演習だ」"

[[dialogue]]
speaker = "クーシェン"
# 「そ、そっか……にーにーがしたいなら……いいよ<emoji=heart04>　ボクもさっきせーし漏らしちゃったから、注いでもらう余裕できたし<emoji=heart04>」
line = "「そ、そっか……にーにーがしたいなら……いいよ<emoji=heart04>　ボクもさっきせーし漏らしちゃったから、注いでもらう余裕できたし<emoji=heart04>」"

[[dialogue]]
speaker = "クーシェン"
# 「だから、好きなだけボクに出してね<emoji=heart04>　にーにーのせーしは全部ボクのものだから<emoji=heart04>」
line = "「だから、好きなだけボクに出してね<emoji=heart04>　にーにーのせーしは全部ボクのものだから<emoji=heart04>」"

[[dialogue]]
speaker = "クーシェン"
# 「ボクはにーにー専用のメイドさんだよ<emoji=heart04>　おま○こだけじゃなく全身で頑張るから、いっぱい気持ちよくなって満足してね<emoji=heart04>」
line = "「ボクはにーにー専用のメイドさんだよ<emoji=heart04>　おま○こだけじゃなく全身で頑張るから、いっぱい気持ちよくなって満足してね<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# いつもの挑発的な言動とも違う、甘さ１００％の誘惑をぶつけられて、もう止まらない。
line = "いつもの挑発的な言動とも違う、甘さ１００％の誘惑をぶつけられて、もう止まらない。"

[[dialogue]]
speaker = "unk"
# こうして俺はまんまとクーシェンの思惑に乗っかり、時間を忘れて何度も愛し合うのだった。
line = "こうして俺はまんまとクーシェンの思惑に乗っかり、時間を忘れて何度も愛し合うのだった。"
