[[dialogue]]
speaker = "unk"
# ルネアの力によってリゾート結界が設置されてから少し経った、とある休日。
line = "ルネアの力によってリゾート結界が設置されてから少し経った、とある休日。"

[[dialogue]]
speaker = "unk"
# 僕――『<ruby=さくら>咲良</ruby>シン』は、リア先輩と一緒にデートへやって来ていた。
line = "僕――『<ruby>咲良<rt>さくら</rt></ruby>シン』は、リア先輩と一緒にデートへやって来ていた。"

[[dialogue]]
speaker = "シン"
# 「さ～て、リア先輩！　何して遊びましょうか？」
line = "「さ～て、リア先輩！　何して遊びましょうか？」"

[[dialogue]]
speaker = "リア"
# 「ん……はふぅ……<emoji=heart04>」
line = "「ん……はふぅ……<emoji=heart04>」"

[[dialogue]]
speaker = "シン"
# 「って、先輩……？　なんだか様子が……」
line = "「って、先輩……？　なんだか様子が……」"

[[dialogue]]
speaker = "リア"
# 「あのね……今日はリゾート結界を貸し切りで、私とシンくんの２人きりでしょ？」
line = "「あのね……今日はリゾート結界を貸し切りで、私とシンくんの２人きりでしょ？」"

[[dialogue]]
speaker = "リア"
# 「だから、『サリーちゃん』に……『魔界通販』でまた<b>アレ</b>をお願いしたの……」
line = "「だから、『サリーちゃん』に……『魔界通販』でまた<b>アレ</b>をお願いしたの……」"

[[dialogue]]
speaker = "シン"
# 「えっと……アレって……？」
line = "「えっと……アレって……？」"

[[dialogue]]
speaker = "unk"
# ちなみに『サリーちゃん』とは、流星クルセイダースの活動の中で仲良くなった、魔族の女の子である。
line = "ちなみに『サリーちゃん』とは、流星クルセイダースの活動の中で仲良くなった、魔族の女の子である。"

[[dialogue]]
speaker = "unk"
# 彼女は『魔界通販』という不思議な力（？）を使って、人間界にはない（ちょっと怪しい）アイテムを取り寄せることができるのだ。
line = "彼女は『魔界通販』という不思議な力（？）を使って、人間界にはない（ちょっと怪しい）アイテムを取り寄せることができるのだ。"

[[dialogue]]
speaker = "リア"
# 「ほら、前に言ってた……『赤まむし<ruby=アンドユー>＆ＹＯＵ</ruby>』っていう元気が出るドリンク……<emoji=heart04>」
