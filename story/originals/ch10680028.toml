# リア先輩は腰を前後に動かして、事後の白濁溢れる秘部をペニスに擦り付け始める。
line = "リア先輩は腰を前後に動かして、事後の白濁溢れる秘部をペニスに擦り付け始める。"

[[dialogue]]
speaker = "シン"
# 「り、リア先輩……？」
line = "「り、リア先輩……？」"

[[dialogue]]
speaker = "リア"
# 「ねぇ、シンくん、私……<emoji=heart04>　まだおま○こ熱いままで、収まらないの……<emoji=heart04>」
line = "「ねぇ、シンくん、私……<emoji=heart04>　まだおま○こ熱いままで、収まらないの……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 例の元気が出るドリンクの効果がまだ続いているのか――リア先輩の瞳には、ハートが浮かんでいるかのように未だ発情の色が濃く宿っていた。
line = "例の元気が出るドリンクの効果がまだ続いているのか――リア先輩の瞳には、ハートが浮かんでいるかのように未だ発情の色が濃く宿っていた。"

[[dialogue]]
speaker = "シン"
# 「う……そんなアソコを刺激されたらまた……！」
line = "「う……そんなアソコを刺激されたらまた……！」"

[[dialogue]]
speaker = "リア"
# 「ふふっ<emoji=heart04>　元気になってきたから……またできるよね？」
line = "「ふふっ<emoji=heart04>　元気になってきたから……またできるよね？」"

[[dialogue]]
speaker = "リア"
# 「もう１回、しよ<emoji=heart04>」
line = "「もう１回、しよ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# そうして僕はその日、リア先輩が満足するまで、何度も搾り取られてしまうのだった。
line = "そうして僕はその日、リア先輩が満足するまで、何度も搾り取られてしまうのだった。"
