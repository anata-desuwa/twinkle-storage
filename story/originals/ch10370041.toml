[[dialogue]]
speaker = "unk"
# 第１話,酔ってないよ～？,P
line = "第１話,酔ってないよ～？,P"

[[dialogue]]
speaker = "サラン"
# 「でね～、魔将になって、魔界で大暴れしてきたんだ～♪　よく覚えてないけど楽しかった～♪」
line = "「でね～、魔将になって、魔界で大暴れしてきたんだ～♪　よく覚えてないけど楽しかった～♪」"

[[dialogue]]
speaker = "サラン"
# 「新星学園の地下におっきな書庫があったなんてびっくりした～。魔将になったから、今は自由に出入りできるんだ～」
line = "「新星学園の地下におっきな書庫があったなんてびっくりした～。魔将になったから、今は自由に出入りできるんだ～」"

[[dialogue]]
speaker = "サラン"
# 「昔の魔界のレシピを研究してるから、会長ちゃんも楽しみにしててね～♪」
line = "「昔の魔界のレシピを研究してるから、会長ちゃんも楽しみにしててね～♪」"

[[dialogue]]
speaker = "unk"
# 新星学園の地下深くにある深淵書庫。そこには過去のリクリエで滅ぼされた魔族の怨念が収蔵されており、当時の状況も断片的に知ることができる。
line = "新星学園の地下深くにある深淵書庫。そこには過去のリクリエで滅ぼされた魔族の怨念が収蔵されており、当時の状況も断片的に知ることができる。"

[[dialogue]]
speaker = "unk"
# レシピもいいけど……
line = "レシピもいいけど……"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～？　あ、まだ会長ちゃんに魔将フォームを見てもらってなかったね～。そんなに楽しみなの～？」
line = "「ぽよ～？　あ、まだ会長ちゃんに魔将フォームを見てもらってなかったね～。そんなに楽しみなの～？」"

[[dialogue]]
speaker = "unk"
# 力強くうなずく。恋人の新たな装いが楽しみでないわけがない。
line = "力強くうなずく。恋人の新たな装いが楽しみでないわけがない。"

[[dialogue]]
speaker = "サラン"
# 「ふわ～、嬉しい～♪　じゃあ場所を変えるね～♪」
line = "「ふわ～、嬉しい～♪　じゃあ場所を変えるね～♪」"

[[dialogue]]
speaker = "サラン"
# 「ではでは～、へんし～ん♪」
line = "「ではでは～、へんし～ん♪」"

[[dialogue]]
speaker = "サラン"
# 「ふわ～♪　体がぽかぽかする～♪」
line = "「ふわ～♪　体がぽかぽかする～♪」"

[[dialogue]]
speaker = "unk"
# 魔将となったサランから大きな力を感じる。もともと優秀なプリマステラだったが、さらに強くなったのが佇まいから分かる。
line = "魔将となったサランから大きな力を感じる。もともと優秀なプリマステラだったが、さらに強くなったのが佇まいから分かる。"

[[dialogue]]
speaker = "unk"
# だが、それ以上に……
line = "だが、それ以上に……"

[[dialogue]]
speaker = "サラン"
# 「ぽよ～？　サランのお顔に何かついてる～？」
line = "「ぽよ～？　サランのお顔に何かついてる～？」"

[[dialogue]]
speaker = "unk"
# いや、何でもない……
line = "いや、何でもない……"

[[dialogue]]
speaker = "サラン"
# 「そぉ～？　ヘンな会長ちゃん～」
line = "「そぉ～？　ヘンな会長ちゃん～」"

[[dialogue]]
speaker = "unk"
# いつになく刺激的な恰好に思わず見入ってしまった。付き合っているとはいえ、勝手にジロジロ見るのはさすがによくない。
line = "いつになく刺激的な恰好に思わず見入ってしまった。付き合っているとはいえ、勝手にジロジロ見るのはさすがによくない。"

[[dialogue]]
speaker = "サラン"
# 「サランのおっぱい、見たいなら見たいって言えばいいのに～」
line = "「サランのおっぱい、見たいなら見たいって言えばいいのに～」"

[[dialogue]]
speaker = "unk"
# ぶはっ！？
line = "ぶはっ！？"

[[dialogue]]
speaker = "サラン"
# 「ちがうの～？　会長ちゃんはサランのおっぱい大好きでしょ～？」
line = "「ちがうの～？　会長ちゃんはサランのおっぱい大好きでしょ～？」"

[[dialogue]]
speaker = "サラン"
# 「……ふふっ、あははっ♪　冗談だよ～。会長ちゃんはおっぱいだけじゃなくてサランの全部が大好きだもんね～♪」
line = "「……ふふっ、あははっ♪　冗談だよ～。会長ちゃんはおっぱいだけじゃなくてサランの全部が大好きだもんね～♪」"

[[dialogue]]
speaker = "unk"
# 答えに窮していると、向こうが助け舟を出してくれた。……当然、大好きだけど。
line = "答えに窮していると、向こうが助け舟を出してくれた。……当然、大好きだけど。"

[[dialogue]]
speaker = "サラン"
# 「ふふ～、会長ちゃんの困ったお顔、可愛かったよ～♪」
line = "「ふふ～、会長ちゃんの困ったお顔、可愛かったよ～♪」"

[[dialogue]]
speaker = "unk"
# …………酔ってる？
line = "…………酔ってる？"

[[dialogue]]
speaker = "サラン"
# 「えぇ～、酔ってないよ～？」
line = "「えぇ～、酔ってないよ～？」"

[[dialogue]]
speaker = "unk"
# サランは本当に美味しいものを食べるとお酒を飲んだみたいに酩酊してしまう。
line = "サランは本当に美味しいものを食べるとお酒を飲んだみたいに酩酊してしまう。"

[[dialogue]]
speaker = "unk"
# それに似ているけど、まだ何も食べていないのでいつもよりタチが悪い。魔将の力のせいなのだろうか。
line = "それに似ているけど、まだ何も食べていないのでいつもよりタチが悪い。魔将の力のせいなのだろうか。"

[[dialogue]]
speaker = "サラン"
# 「それより～、サラン、うずうずしてきちゃった～<emoji=heart04>　会長ちゃん、サランと戦ってくれる～？」
line = "「それより～、サラン、うずうずしてきちゃった～<emoji=heart04>　会長ちゃん、サランと戦ってくれる～？」"

[[dialogue]]
speaker = "unk"
# わかった
line = "わかった"

[[dialogue]]
speaker = "サラン"
# 「ありがと～<emoji=heart04>　会長ちゃん大好き～<emoji=heart04>」
line = "「ありがと～<emoji=heart04>　会長ちゃん大好き～<emoji=heart04>」"

[[dialogue]]
speaker = "サラン"
# 「じゃあ、こっちからいくね～。ホイッパースマッシュ～！」
line = "「じゃあ、こっちからいくね～。ホイッパースマッシュ～！」"

[[dialogue]]
speaker = "unk"
# 長物と化した泡立て器から繰り出される、重い打撃。腕を交差して受け止めるが、床にめり込むんじゃないかと思うほどの衝撃だ。
line = "長物と化した泡立て器から繰り出される、重い打撃。腕を交差して受け止めるが、床にめり込むんじゃないかと思うほどの衝撃だ。"

[[dialogue]]
speaker = "サラン"
# 「そ～れ、キルシュシュガーレイン～♪」
line = "「そ～れ、キルシュシュガーレイン～♪」"

[[dialogue]]
speaker = "unk"
# サランが泡立て器を振るうと、綿菓子の雲が生まれ、甘いシロップの雨が降り注ぐ。
line = "サランが泡立て器を振るうと、綿菓子の雲が生まれ、甘いシロップの雨が降り注ぐ。"

[[dialogue]]
speaker = "サラン"
# 「ん～、いい香り～♪　サラン大好き～♪」
line = "「ん～、いい香り～♪　サラン大好き～♪」"

[[dialogue]]
speaker = "サラン"
# 「キルシュっていうのはね～、さくらんぼのことなんだよ～。キルシュヴァッサーっていうさくらんぼのお酒をそう呼ぶの～」
line = "「キルシュっていうのはね～、さくらんぼのことなんだよ～。キルシュヴァッサーっていうさくらんぼのお酒をそう呼ぶの～」"

[[dialogue]]
speaker = "サラン"
# 「いろんなお菓子に使われてるから、この香りだけでおなか空いちゃう～」
line = "「いろんなお菓子に使われてるから、この香りだけでおなか空いちゃう～」"

[[dialogue]]
speaker = "unk"
# シロップの雨には魔力が含まれていて、浴びれば感覚を鈍らせる。メルヘンな術に見えるが、強力な攻撃だ。
line = "シロップの雨には魔力が含まれていて、浴びれば感覚を鈍らせる。メルヘンな術に見えるが、強力な攻撃だ。"

[[dialogue]]
speaker = "サラン"
# 「おなか空いちゃったから～、クリーム出しちゃえ～♪　会長ちゃんも召し上がれ～♪」
line = "「おなか空いちゃったから～、クリーム出しちゃえ～♪　会長ちゃんも召し上がれ～♪」"

[[dialogue]]
speaker = "サラン"
# 「せーの、グラトニースイートディザスタ～♪」
line = "「せーの、グラトニースイートディザスタ～♪」"

[[dialogue]]
speaker = "unk"
# 白いクリームの波がトレーニングルームに氾濫し、視界が白で埋め尽くされた。
line = "白いクリームの波がトレーニングルームに氾濫し、視界が白で埋め尽くされた。"

[[dialogue]]
speaker = "unk"
# とてつもなく甘い！
line = "とてつもなく甘い！"

[[dialogue]]
speaker = "unk"
# 甘さを文字通りに全身に浴びてしまった。とろけるような多幸感が満ち、力が抜けていく。
line = "甘さを文字通りに全身に浴びてしまった。とろけるような多幸感が満ち、力が抜けていく。"

[[dialogue]]
speaker = "サラン"
# 「ふふふ～♪　どう、美味しかった～？」
line = "「ふふふ～♪　どう、美味しかった～？」"

[[dialogue]]
speaker = "unk"
# 蠱惑的な笑みを浮かべるサラン。いつもの無邪気なサランも可愛いけれど、新しい扉が開きそうだ。
line = "蠱惑的な笑みを浮かべるサラン。いつもの無邪気なサランも可愛いけれど、新しい扉が開きそうだ。"

[[dialogue]]
speaker = "サラン"
# 「ふふ、ふふふ～♪　つぎはどんなクリームにしようかにゃ～、こんぺーとーのいんせきもいいな～♪」
line = "「ふふ、ふふふ～♪　つぎはどんなクリームにしようかにゃ～、こんぺーとーのいんせきもいいな～♪」"

[[dialogue]]
speaker = "サラン"
# 「えへへ～、ふわふわ～♪　ぽよ～？　かいちょーちゃんがさんにんになっちゃった～？　おとくだね～♪　すっぱいかいちょーちゃんはどのこかな～？　あはは～♪」
line = "「えへへ～、ふわふわ～♪　ぽよ～？　かいちょーちゃんがさんにんになっちゃった～？　おとくだね～♪　すっぱいかいちょーちゃんはどのこかな～？　あはは～♪」"

[[dialogue]]
speaker = "サラン"
# 「ふわぁ～…………サラン、ねむたくなっちゃった～～。おやすみぃ～」
line = "「ふわぁ～…………サラン、ねむたくなっちゃった～～。おやすみぃ～」"

[[dialogue]]
speaker = "サラン"
# 「すぅ、すぅ…………」
line = "「すぅ、すぅ…………」"

[[dialogue]]
speaker = "unk"
# 酔った末に寝てしまった。魔将フォームは強力だが、制御に難があるみたいだ。
line = "酔った末に寝てしまった。魔将フォームは強力だが、制御に難があるみたいだ。"

[[dialogue]]
speaker = "サラン"
# 「……え？　サラン、魔将になって酔っぱらっちゃってたの～？」
line = "「……え？　サラン、魔将になって酔っぱらっちゃってたの～？」"

[[dialogue]]
speaker = "サラン"
# 「おっぱい……？　サラン、そんなこと言ってたの～？　うぅ～、恥ずかしいよ～」
line = "「おっぱい……？　サラン、そんなこと言ってたの～？　うぅ～、恥ずかしいよ～」"

[[dialogue]]
speaker = "unk"
# 刺激的だったり、恥ずかしがったり、今日はサランの珍しいところが見れて嬉しかった。
line = "刺激的だったり、恥ずかしがったり、今日はサランの珍しいところが見れて嬉しかった。"
