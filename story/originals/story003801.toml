[[dialogue]]
speaker = "unk"
# ――女神『ルネア』が管理する『ティンクル☆くるせいだーす』の世界。
line = "――女神『ルネア』が管理する『ティンクル☆くるせいだーす』の世界。"

[[dialogue]]
speaker = "unk"
# 今、『流星クルセイダース』こと『流星生徒会』の４人の前には、ルネアが新たに作り出した空間が広がっていた。
line = "今、『流星クルセイダース』こと『流星生徒会』の４人の前には、ルネアが新たに作り出した空間が広がっていた。"

[[dialogue]]
speaker = "ルネア"
# 「コホン――それでは宣言するわよ」
line = "「コホン――それでは宣言するわよ」"

[[dialogue]]
speaker = "ルネア"
# 「『ルネアリゾート結界』、海開きよ～♪」
line = "「『ルネアリゾート結界』、海開きよ～♪」"

[[dialogue]]
speaker = "４人"
# 「イェ～イっ♪」
line = "「イェ～イっ♪」"

[[dialogue]]
speaker = "ナナカ"
# 「いや～、でもまさか、まだ２月なのに夏の海を楽しめるなんてね～」
line = "「いや～、でもまさか、まだ２月なのに夏の海を楽しめるなんてね～」"

[[dialogue]]
speaker = "ロロット"
# 「私にとっては、夏の海は初めてなので、ワクワクなのです～♪」
line = "「私にとっては、夏の海は初めてなので、ワクワクなのです～♪」"

[[dialogue]]
speaker = "ルネア"
# 「ふふん♪　すごいでしょ～♪」
line = "「ふふん♪　すごいでしょ～♪」"

[[dialogue]]
speaker = "ルネア"
# 「この前、異世界へ行ってきた時に『リゾート結界』を見て気に入っちゃって♪　それを元に、こっちの世界で再現してみたのよ！」
line = "「この前、異世界へ行ってきた時に『リゾート結界』を見て気に入っちゃって♪　それを元に、こっちの世界で再現してみたのよ！」"

[[dialogue]]
speaker = "リア"
# 「あはは……さすが女神様、とんでもない力だね～」
line = "「あはは……さすが女神様、とんでもない力だね～」"

[[dialogue]]
speaker = "ルネア"
# 「それに、向こうの世界では、リゾート結界を作ったのがたった１人の天使だって聞いたから、女神として負けられないと思ったのよ！」
line = "「それに、向こうの世界では、リゾート結界を作ったのがたった１人の天使だって聞いたから、女神として負けられないと思ったのよ！」"

[[dialogue]]
speaker = "聖沙"
# 「ルネアさん、その勝負心わかるわ！」
line = "「ルネアさん、その勝負心わかるわ！」"

[[dialogue]]
speaker = "聖沙"
# 「それにしても、リアお姉様の水着姿、とっても素敵です<emoji=heart04>」
line = "「それにしても、リアお姉様の水着姿、とっても素敵です<emoji=heart04>」"

[[dialogue]]
speaker = "リア"
# 「えへへ<emoji=heart04>　聖沙ちゃん、ありがと～♪　聖沙ちゃんの水着もすっごく可愛くて素敵だよ<emoji=heart04>」
line = "「えへへ<emoji=heart04>　聖沙ちゃん、ありがと～♪　聖沙ちゃんの水着もすっごく可愛くて素敵だよ<emoji=heart04>」"

[[dialogue]]
speaker = "聖沙"
# 「あんっ<emoji=heart04>　お姉様に褒められて、熱さでダウンしちゃいそう<emoji=heart04>」
line = "「あんっ<emoji=heart04>　お姉様に褒められて、熱さでダウンしちゃいそう<emoji=heart04>」"

[[dialogue]]
speaker = "ナナカ"
# 「早い早い！　まだ海にも入ってないのに！」
line = "「早い早い！　まだ海にも入ってないのに！」"

[[dialogue]]
speaker = "ロロット"
# 「それより、早く海に入って遊びたいのです～♪」
line = "「それより、早く海に入って遊びたいのです～♪」"

[[dialogue]]
speaker = "ルネア"
# 「まだダメよ、ロロット。シンが来るまで待ちなさい！」
line = "「まだダメよ、ロロット。シンが来るまで待ちなさい！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「へぇ～、これが『リゾート結界』！　本当に夏の海みたいで、すごいじゃな～い♪」
line = "「へぇ～、これが『リゾート結界』！　本当に夏の海みたいで、すごいじゃな～い♪」"

[[dialogue]]
speaker = "リア"
# 「あっ、お姉ちゃん！」
line = "「あっ、お姉ちゃん！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「おはよう、生徒会の諸君！　流星学園の理事長として、視察に来たわよ～♪」
line = "「おはよう、生徒会の諸君！　流星学園の理事長として、視察に来たわよ～♪」"

[[dialogue]]
speaker = "unk"
# 彼女は、私立流星学園の理事長『九浄ヘレナ』。
line = "彼女は、私立流星学園の理事長『九浄ヘレナ』。"

[[dialogue]]
speaker = "unk"
# 学園を管理している『九浄家』の現当主で、九浄リアの実の姉でもある。
line = "学園を管理している『九浄家』の現当主で、九浄リアの実の姉でもある。"

[[dialogue]]
speaker = "ロロット"
# 「と言いつつ、理事長さんも海で遊びたいだけなのでは？」
line = "「と言いつつ、理事長さんも海で遊びたいだけなのでは？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ふふっ♪　ロロットちゃん、仕事を楽しめるように工夫するのが、賢い大人というものよ<emoji=heart04>」
line = "「ふふっ♪　ロロットちゃん、仕事を楽しめるように工夫するのが、賢い大人というものよ<emoji=heart04>」"

[[dialogue]]
speaker = "ロロット"
# 「なるほど、これが『<ruby=こざかな>小魚</ruby>が美味しい』ってやつですね～♪」
line = "「なるほど、これが『<ruby>小魚<rt>こざかな</rt></ruby>が美味しい』ってやつですね～♪」"

[[dialogue]]
speaker = "リア"
# 「えっと……『<ruby=こざか>小賢</ruby>しい』、かな……？」
line = "「えっと……『<ruby>小賢<rt>こざか</rt></ruby>しい』、かな……？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「あら？　そういえば、シンちゃんは？」
line = "「あら？　そういえば、シンちゃんは？」"

[[dialogue]]
speaker = "ナナカ"
# 「あっ、シンなら家に忘れ物をしたらしくて、パッキーと一緒に、ちょっと遅れて来るって言ってました」
line = "「あっ、シンなら家に忘れ物をしたらしくて、パッキーと一緒に、ちょっと遅れて来るって言ってました」"

[[dialogue]]
speaker = "ナナカ"
# 「でも、もうそろそろ来るとは思いますよ」
line = "「でも、もうそろそろ来るとは思いますよ」"

[[dialogue]]
speaker = "unk"
# ちなみに『シン』こと『咲良シン』は、流星生徒会の生徒会長であり、この世界において『魔王』の力を持つ少年である。
line = "ちなみに『シン』こと『咲良シン』は、流星生徒会の生徒会長であり、この世界において『魔王』の力を持つ少年である。"

[[dialogue]]
speaker = "聖沙"
# 「そういえば、エグザエルさんも見当たらないような……？」
line = "「そういえば、エグザエルさんも見当たらないような……？」"

[[dialogue]]
speaker = "ルネア"
# 「ああ、エグザエルなら、今日はキャリーケースごと、寮の部屋に放置してきたわ！」
line = "「ああ、エグザエルなら、今日はキャリーケースごと、寮の部屋に放置してきたわ！」"

[[dialogue]]
speaker = "ルネア"
# 「あの天使長ったら、隠れて色んな水着を用意して、私たちを勝手に着せ替えようと企んでいたんだもの！」
line = "「あの天使長ったら、隠れて色んな水着を用意して、私たちを勝手に着せ替えようと企んでいたんだもの！」"

[[dialogue]]
speaker = "ナナカ"
# 「あ～、なるほど……」
line = "「あ～、なるほど……」"

[[dialogue]]
speaker = "リア"
# 「あはは……ちょっと可哀想な気もするけど……」
line = "「あはは……ちょっと可哀想な気もするけど……」"

[[dialogue]]
speaker = "unk"
# ――と、その時だった。
line = "――と、その時だった。"

[[dialogue]]
speaker = "ロロット"
# 「おや？　これはなんでしょう？」
line = "「おや？　これはなんでしょう？」"

[[dialogue]]
speaker = "unk"
# ロロットがあるものに気づいて、ルネアの背後を指差した。
line = "ロロットがあるものに気づいて、ルネアの背後を指差した。"

[[dialogue]]
speaker = "ロロット"
# 「なんかそこに、小さな『穴』みたいなものが空いてませんか？」
line = "「なんかそこに、小さな『穴』みたいなものが空いてませんか？」"

[[dialogue]]
speaker = "ルネア"
# 「え？　穴……？」
line = "「え？　穴……？」"

[[dialogue]]
speaker = "unk"
# ルネアの背後の空間に、小さい穴が空いていた。
line = "ルネアの背後の空間に、小さい穴が空いていた。"

[[dialogue]]
speaker = "ナナカ"
# 「本当だ。生徒会室からリゾート結界に入る時にくぐった穴の、小さい版みたいな……」
line = "「本当だ。生徒会室からリゾート結界に入る時にくぐった穴の、小さい版みたいな……」"

[[dialogue]]
speaker = "ルネア"
# 「おかしいわね。ついさっきまで、そんなものなかったはずだけど……」
line = "「おかしいわね。ついさっきまで、そんなものなかったはずだけど……」"

[[dialogue]]
speaker = "リア"
# 「穴の向こうにも、同じ海が見えているみたい……？」
line = "「穴の向こうにも、同じ海が見えているみたい……？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「……嫌な予感がするわ。みんな、少し離れて――」
line = "「……嫌な予感がするわ。みんな、少し離れて――」"

[[dialogue]]
speaker = "unk"
# ヘレナが言いかけた、次の瞬間。
line = "ヘレナが言いかけた、次の瞬間。"

[[dialogue]]
speaker = "聖沙"
# 「きゃっ！？　急に穴が広がって、吸い込まれ――きゃあぁぁっ！？」
line = "「きゃっ！？　急に穴が広がって、吸い込まれ――きゃあぁぁっ！？」"

[[dialogue]]
speaker = "ロロット"
# 「わわっ！？　何が起こってるのですか！？　何も見えませ～ん！」
line = "「わわっ！？　何が起こってるのですか！？　何も見えませ～ん！」"

[[dialogue]]
speaker = "ナナカ"
# 「……あれ？　収まった？」
line = "「……あれ？　収まった？」"

[[dialogue]]
speaker = "リア"
# 「う、うん……みんな、大丈夫……？」
line = "「う、うん……みんな、大丈夫……？」"

[[dialogue]]
speaker = "ロロット"
# 「はい。トントロも特に割れたりはしてませんよ～」
line = "「はい。トントロも特に割れたりはしてませんよ～」"

[[dialogue]]
speaker = "聖沙"
# 「ここ、さっきと同じ場所よね……？　一体何が起きたの？」
line = "「ここ、さっきと同じ場所よね……？　一体何が起きたの？」"

[[dialogue]]
speaker = "ルネア"
# 「私にもわからないわ……リゾート結界は、ちゃんと問題なく再現できてたはずなのに……」
line = "「私にもわからないわ……リゾート結界は、ちゃんと問題なく再現できてたはずなのに……」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「さっきまであった空間の穴は消えているわね……。その他に、変わった様子はなさそうだけど……」
line = "「さっきまであった空間の穴は消えているわね……。その他に、変わった様子はなさそうだけど……」"

[[dialogue]]
speaker = "unk"
# と、そこへ小さな影が駆け寄ってくる。
line = "と、そこへ小さな影が駆け寄ってくる。"

[[dialogue]]
speaker = "パッキー"
# 「――お～いっ！　お前ら、大変だ～～っ！！」
line = "「――お～いっ！　お前ら、大変だ～～っ！！」"

[[dialogue]]
speaker = "ロロット"
# 「あっ！　パンダさんなのです！」
line = "「あっ！　パンダさんなのです！」"

[[dialogue]]
speaker = "パッキー"
# 「シン様が……！」
line = "「シン様が……！」"

[[dialogue]]
speaker = "ナナカ"
# 「えっ……！？」
line = "「えっ……！？」"

[[dialogue]]
speaker = "unk"
# ――目を覚ますと、そこには見知った４人の姿があった。
line = "――目を覚ますと、そこには見知った４人の姿があった。"

[[dialogue]]
speaker = "ナナカ"
# 「あっ、起きた！」
line = "「あっ、起きた！」"

[[dialogue]]
speaker = "リア"
# 「大丈夫？　気分はどう？」
line = "「大丈夫？　気分はどう？」"

[[dialogue]]
speaker = "unk"
# それに、リア先輩……？
line = "それに、リア先輩……？"

[[dialogue]]
speaker = "unk"
# あれ……ナナカ？
line = "あれ……ナナカ？"

[[dialogue]]
speaker = "ロロット"
# 「私とトントロもいますよ～」
line = "「私とトントロもいますよ～」"

[[dialogue]]
speaker = "聖沙"
# 「パッキーさんから聞いて、驚いたわ」
line = "「パッキーさんから聞いて、驚いたわ」"

[[dialogue]]
speaker = "unk"
# ロロットに、聖沙も……？
line = "ロロットに、聖沙も……？"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「はぁい♪　それじゃあ、私のことはわかるかしら？」
line = "「はぁい♪　それじゃあ、私のことはわかるかしら？」"

[[dialogue]]
speaker = "unk"
# えっと……あなたは？
line = "えっと……あなたは？"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「私は、リアの姉の『九浄ヘレナ』よ♪」
line = "「私は、リアの姉の『九浄ヘレナ』よ♪」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「初めまして――<b>異世界の魔王</b>ちゃん♪」
line = "「初めまして――<b>異世界の魔王</b>ちゃん♪」"

[[dialogue]]
speaker = "unk"
# そこで俺――緋宮クロトは、ハッと体を起こした。
line = "そこで俺――緋宮クロトは、ハッと体を起こした。"

[[dialogue]]
speaker = "unk"
# どうしてここに……！？
line = "どうしてここに……！？"

[[dialogue]]
speaker = "unk"
# 流星クルセイダースのみんなが
line = "流星クルセイダースのみんなが"

[[dialogue]]
speaker = "聖沙"
# 「それはこっちの台詞よ！　会長」
line = "「それはこっちの台詞よ！　会長」"

[[dialogue]]
speaker = "ナナカ"
# 「そうそう。パッキーが慌てて呼びに来てさ」
line = "「そうそう。パッキーが慌てて呼びに来てさ」"

[[dialogue]]
speaker = "リア"
# 「突然空間に穴が開いて吸い込まれたと思ったら、一緒にいたはずのシンくんが居なくなってて――」
line = "「突然空間に穴が開いて吸い込まれたと思ったら、一緒にいたはずのシンくんが居なくなってて――」"

[[dialogue]]
speaker = "リア"
# 「その代わりに、会長<b>くん</b>が倒れてたって」
line = "「その代わりに、会長<b>くん</b>が倒れてたって」"

[[dialogue]]
speaker = "パッキー"
# 「シン様だと思って起こそうとしたら、異世界の魔王様でビックリしたぜ！」
line = "「シン様だと思って起こそうとしたら、異世界の魔王様でビックリしたぜ！」"

[[dialogue]]
speaker = "ロロット"
# 「異世会長さんが、どうしてここにいるのですか？」
line = "「異世会長さんが、どうしてここにいるのですか？」"

[[dialogue]]
speaker = "リア"
# 「一体何があったのか、私たちに教えてくれないかな？」
line = "「一体何があったのか、私たちに教えてくれないかな？」"

[[dialogue]]
speaker = "unk"
# それが、俺にもよくわからなくて……
line = "それが、俺にもよくわからなくて……"

[[dialogue]]
speaker = "マトイ"
# 「――あっ、会長～！」
line = "「――あっ、会長～！」"

[[dialogue]]
speaker = "ロロット"
# 「あっ！　あれは……マトイさんなのです！　お～い♪」
line = "「あっ！　あれは……マトイさんなのです！　お～い♪」"

[[dialogue]]
speaker = "マトイ"
# 「えっ、ロロットちゃん！？　それに……流星クルセイダースのみんなも！？」
line = "「えっ、ロロットちゃん！？　それに……流星クルセイダースのみんなも！？」"

[[dialogue]]
speaker = "ルネア"
# 「マトイも来ていたのね」
line = "「マトイも来ていたのね」"

[[dialogue]]
speaker = "マトイ"
# 「ルネアさん！？　どうして異世界のみんながここに……！？」
line = "「ルネアさん！？　どうして異世界のみんながここに……！？」"

[[dialogue]]
speaker = "ルネア"
# 「私にもわからないわ。でも、何かの事故が起こって――」
line = "「私にもわからないわ。でも、何かの事故が起こって――」"

[[dialogue]]
speaker = "ルネア"
# 「どうやら、あなたたちの世界と私たちの世界が、また繋がってしまったみたいね」
line = "「どうやら、あなたたちの世界と私たちの世界が、また繋がってしまったみたいね」"

[[dialogue]]
speaker = "ルネア"
# 「マトイの他にも、誰か来ているのかしら？」
line = "「マトイの他にも、誰か来ているのかしら？」"

[[dialogue]]
speaker = "マトイ"
# 「はい。私ともう１人――」
line = "「はい。私ともう１人――」"

[[dialogue]]
speaker = "unk"
# マトイはそう言って、後ろを振り返る。
line = "マトイはそう言って、後ろを振り返る。"

[[dialogue]]
speaker = "ヘレナ"
# 「――マトイよ。他の者たちは見つかったのか？」
line = "「――マトイよ。他の者たちは見つかったのか？」"

[[dialogue]]
speaker = "ヘレナ"
# 「おや？　これは――」
line = "「おや？　これは――」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ん？　あなたは――」
line = "「ん？　あなたは――」"

[[dialogue]]
speaker = "ヘレナ"
# 「そなた……もしかして、異世界の『九浄ヘレナ』か？」
line = "「そなた……もしかして、異世界の『九浄ヘレナ』か？」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「そういうあなたも……『九浄ヘレナ』だったりする？」
line = "「そういうあなたも……『九浄ヘレナ』だったりする？」"

[[dialogue]]
speaker = "ヘレナ"
# 「……なるほど。そういうことか――」
line = "「……なるほど。そういうことか――」"

[[dialogue]]
speaker = "ヘレナ"
# 「初めましてであるな、異世界の私よ」
line = "「初めましてであるな、異世界の私よ」"

[[dialogue]]
speaker = "unk"
# こうして、２つの世界は再び、リゾート結界で交わることになるのだった。
line = "こうして、２つの世界は再び、リゾート結界で交わることになるのだった。"
