[[dialogue]]
speaker = "unk"
# ２人の見習いメイドが修行を始めて３日経った。
line = "２人の見習いメイドが修行を始めて３日経った。"

[[dialogue]]
speaker = "unk"
# たった３日、されど３日だ。物覚えの良し悪しもあるだろう。ただ、それとは別の理由で両者に明らかな差が生まれていた。
line = "たった３日、されど３日だ。物覚えの良し悪しもあるだろう。ただ、それとは別の理由で両者に明らかな差が生まれていた。"

[[dialogue]]
speaker = "クーシェン"
# 「ご主人様～<emoji=heart04>　焼きたてのホットケーキでございまぁーす<emoji=heart04>」
line = "「ご主人様～<emoji=heart04>　焼きたてのホットケーキでございまぁーす<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# おいしそうだね
line = "おいしそうだね"

[[dialogue]]
speaker = "unk"
# ありがとう！
line = "ありがとう！"

[[dialogue]]
speaker = "クーシェン"
# 「ボクが焼いたやつだから、よーく味わって食べてね<emoji=heart04>　モエモエキューンってやつ、やろうか？」
line = "「ボクが焼いたやつだから、よーく味わって食べてね<emoji=heart04>　モエモエキューンってやつ、やろうか？」"

[[dialogue]]
speaker = "マリオン"
# 「それは市井のメイド喫茶がすることです。星見家のメイドはそんなことしないんですよ」
line = "「それは市井のメイド喫茶がすることです。星見家のメイドはそんなことしないんですよ」"

[[dialogue]]
speaker = "クーシェン"
# 「えー、でもにーにーはそういうの好きそうじゃない？」
line = "「えー、でもにーにーはそういうの好きそうじゃない？」"

[[dialogue]]
speaker = "ナミエル"
# 「確かに。主人に合わせて行動を変えるのも大事なことなのです」
line = "「確かに。主人に合わせて行動を変えるのも大事なことなのです」"

[[dialogue]]
speaker = "クーシェン"
# 「でしょ～？　ってことで、にーにーいっくよ～～！」
line = "「でしょ～？　ってことで、にーにーいっくよ～～！」"

[[dialogue]]
speaker = "クーシェン"
# 「食らえ！　モエモエアタァァァーーーーック！！！」
line = "「食らえ！　モエモエアタァァァーーーーック！！！」"

[[dialogue]]
speaker = "unk"
# はちみつかけすぎ！
line = "はちみつかけすぎ！"

[[dialogue]]
speaker = "unk"
# ぎゃあ！
line = "ぎゃあ！"

[[dialogue]]
speaker = "クーシェン"
# 「ウキキ♪　はちみつびしゃがけ～♪」
line = "「ウキキ♪　はちみつびしゃがけ～♪」"

[[dialogue]]
speaker = "アポロ"
# 「よーし、あたしも負けてらんないな！　行くぞ、フィオナ！」
line = "「よーし、あたしも負けてらんないな！　行くぞ、フィオナ！」"

[[dialogue]]
speaker = "フィオナ"
# 「ひゃい！　あ、待って姉さん心の準備が……」
line = "「ひゃい！　あ、待って姉さん心の準備が……」"

[[dialogue]]
speaker = "アポロ"
# 「モエモエキューーーーン<emoji=heart04><emoji=heart04><emoji=heart04>」
line = "「モエモエキューーーーン<emoji=heart04><emoji=heart04><emoji=heart04>」"

[[dialogue]]
speaker = "フィオナ"
# 「……………………っっ」
line = "「……………………っっ」"

[[dialogue]]
speaker = "フィオナ"
# 「……さ、さすが姉さんですね、気を失いそうになるほどの破壊力でした」
line = "「……さ、さすが姉さんですね、気を失いそうになるほどの破壊力でした」"

[[dialogue]]
speaker = "アポロ"
# 「そうか？　じゃあもう１回……」
line = "「そうか？　じゃあもう１回……」"

[[dialogue]]
speaker = "キリカ"
# 「お待ち下さい、アポロ様。それ以上はいけません、可愛さの過剰摂取になってしまいます」
line = "「お待ち下さい、アポロ様。それ以上はいけません、可愛さの過剰摂取になってしまいます」"

[[dialogue]]
speaker = "unk"
# 交代するよ、フィオナ
line = "交代するよ、フィオナ"

[[dialogue]]
speaker = "フィオナ"
# 「ええ、よろしくお願いします、会長」
line = "「ええ、よろしくお願いします、会長」"

[[dialogue]]
speaker = "アポロ"
# 「おー、次は魔王だな？　あたしが紅茶を入れてやるから、楽しんでくれ！　かなり練習したから自信あるんだ」
line = "「おー、次は魔王だな？　あたしが紅茶を入れてやるから、楽しんでくれ！　かなり練習したから自信あるんだ」"

[[dialogue]]
speaker = "アポロ"
# 「そーっと……慎重に……うん、このくらいでいいかな……蒸らしの時間もカンペキだ！」
line = "「そーっと……慎重に……うん、このくらいでいいかな……蒸らしの時間もカンペキだ！」"

[[dialogue]]
speaker = "アポロ"
# 「どうぞ、ご主人様。あたしが心を込めていれた紅茶だぞ」
line = "「どうぞ、ご主人様。あたしが心を込めていれた紅茶だぞ」"

[[dialogue]]
speaker = "フィオナ"
# 「ああ、姉さんがあんなに立派になって……」
line = "「ああ、姉さんがあんなに立派になって……」"

[[dialogue]]
speaker = "キリカ"
# 「心を鬼にして厳しくご指導した甲斐がございました」
line = "「心を鬼にして厳しくご指導した甲斐がございました」"

[[dialogue]]
speaker = "unk"
# 上手に淹れられたね
line = "上手に淹れられたね"

[[dialogue]]
speaker = "unk"
# おいしいよ、アポロ
line = "おいしいよ、アポロ"

[[dialogue]]
speaker = "アポロ"
# 「星見家のメイドとして当然……なのですっ」
line = "「星見家のメイドとして当然……なのですっ」"

[[dialogue]]
speaker = "フェニエル"
# 「修行を始めてまだ３日なのに、凄くしっかりしてるなぁ……」
line = "「修行を始めてまだ３日なのに、凄くしっかりしてるなぁ……」"

[[dialogue]]
speaker = "ナミエル"
# 「やはり星見家のお嬢様という生まれの影響でしょうか」
line = "「やはり星見家のお嬢様という生まれの影響でしょうか」"

[[dialogue]]
speaker = "フェニエル"
# 「ううん、アポロ様だって最初は全然できなかったよ。でも凄く頑張って練習したから」
line = "「ううん、アポロ様だって最初は全然できなかったよ。でも凄く頑張って練習したから」"

[[dialogue]]
speaker = "クーシェン"
# 「むむ……お嬢様！　次はこっちの番だよ～！　アポロよりすごいとこ見せちゃうからね！」
line = "「むむ……お嬢様！　次はこっちの番だよ～！　アポロよりすごいとこ見せちゃうからね！」"

[[dialogue]]
speaker = "クーシェン"
# 「お茶くらい簡単だって。お茶っ葉入れて、お湯をドバァーーって……」
line = "「お茶くらい簡単だって。お茶っ葉入れて、お湯をドバァーーって……」"

[[dialogue]]
speaker = "アポロ"
# 「それ、教わったのと違うだろ」
line = "「それ、教わったのと違うだろ」"

[[dialogue]]
speaker = "クーシェン"
# 「口に入ればみんな同じだって！　そりゃそりゃ～～！！」
line = "「口に入ればみんな同じだって！　そりゃそりゃ～～！！」"

[[dialogue]]
speaker = "クーシェン"
# 「うおっ！？　あれ、なんか違うな～。どうなってるの？　めちゃ苦そうな臭いしてるし……」
line = "「うおっ！？　あれ、なんか違うな～。どうなってるの？　めちゃ苦そうな臭いしてるし……」"

[[dialogue]]
speaker = "キリカ"
# 「待ちなさい。そんな紅茶を提供させるわけにはいきません」
line = "「待ちなさい。そんな紅茶を提供させるわけにはいきません」"

[[dialogue]]
speaker = "クーシェン"
# 「な、なんでだよ～！」
line = "「な、なんでだよ～！」"

[[dialogue]]
speaker = "キリカ"
# 「全てが間違っています。修行が足りなかったようですね」
line = "「全てが間違っています。修行が足りなかったようですね」"

[[dialogue]]
speaker = "クーシェン"
# 「ボクはこういう細かいことするの、苦手だし……嫌いだから……」
line = "「ボクはこういう細かいことするの、苦手だし……嫌いだから……」"

[[dialogue]]
speaker = "クーシェン"
# 「やっぱメイドなんてボクには無理だよ～。バトルしてる方がずっとずっと楽しいのになぁ」
line = "「やっぱメイドなんてボクには無理だよ～。バトルしてる方がずっとずっと楽しいのになぁ」"
