[[dialogue]]
speaker = "unk"
# 星徒会長として夜の学園のパトロールをしていると──
line = "星徒会長として夜の学園のパトロールをしていると──"

[[dialogue]]
speaker = "ナターシャ"
# 「会長さん、ちょっと」
line = "「会長さん、ちょっと」"

[[dialogue]]
speaker = "unk"
# ナターシャに腕を引かれ、連れていかれた先は閉店後のカフェテリアだった。
line = "ナターシャに腕を引かれ、連れていかれた先は閉店後のカフェテリアだった。"

[[dialogue]]
speaker = "unk"
# 閉店後の店内には誰もおらず、俺とナターシャのふたりきり。
line = "閉店後の店内には誰もおらず、俺とナターシャのふたりきり。"

[[dialogue]]
speaker = "クロト"
# 「こんなところで何を……？」
line = "「こんなところで何を……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「場所はどこでもいいんだよ。手っ取り早く、ふたりきりになれるのがここだったってだけ」
line = "「場所はどこでもいいんだよ。手っ取り早く、ふたりきりになれるのがここだったってだけ」"

[[dialogue]]
speaker = "ナターシャ"
# 「何か言われたら、会長の権限で揉み消しておいて。私が消そうとすると、荒事になりかねないからね」
line = "「何か言われたら、会長の権限で揉み消しておいて。私が消そうとすると、荒事になりかねないからね」"

[[dialogue]]
speaker = "クロト"
# 「ナターシャが言うと物騒だなぁ……」
line = "「ナターシャが言うと物騒だなぁ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「最近、会長さんの熱視線がずーっと気になってるんだ。特に胸元」
line = "「最近、会長さんの熱視線がずーっと気になってるんだ。特に胸元」"

[[dialogue]]
speaker = "クロト"
# 「ギクッ」
line = "「ギクッ」"

[[dialogue]]
speaker = "unk"
# ついナターシャのおっぱいに目が吸い寄せられてしまう。ヴァンパイアに扮したハロウィンフォームのせいなのもあってか、魅了の術でもかかっているみたいに。
line = "ついナターシャのおっぱいに目が吸い寄せられてしまう。ヴァンパイアに扮したハロウィンフォームのせいなのもあってか、魅了の術でもかかっているみたいに。"

[[dialogue]]
speaker = "ナターシャ"
# 「どうしよっかな～……？　正直に言えば、このおっぱいで気持ち良くしてあげてもいいんだけどな～」
line = "「どうしよっかな～……？　正直に言えば、このおっぱいで気持ち良くしてあげてもいいんだけどな～」"

[[dialogue]]
speaker = "クロト"
# 「ごめんなさいナターシャのおっぱいが気になってチラチラ見てました。あとガン見してた時もありました」
line = "「ごめんなさいナターシャのおっぱいが気になってチラチラ見てました。あとガン見してた時もありました」"

[[dialogue]]
speaker = "unk"
# ナターシャの誘惑の前に、秒で陥落していた。
line = "ナターシャの誘惑の前に、秒で陥落していた。"

[[dialogue]]
speaker = "unk"
# いや、秒もかからなかった。それだけナターシャのおっぱいは魅力的だ。
line = "いや、秒もかからなかった。それだけナターシャのおっぱいは魅力的だ。"

[[dialogue]]
speaker = "ナターシャ"
# 「そうなんだ～。何度も抱いてるんだし、私の体なんてそろそろ見飽きてもいい頃なのにね？」
line = "「そうなんだ～。何度も抱いてるんだし、私の体なんてそろそろ見飽きてもいい頃なのにね？」"

[[dialogue]]
speaker = "クロト"
# 「見飽きるなんてありえないよ。むしろますます目が離せなくなる」
line = "「見飽きるなんてありえないよ。むしろますます目が離せなくなる」"

[[dialogue]]
speaker = "ナターシャ"
# 「へぇ、嬉しいこと言ってくれるじゃん」
line = "「へぇ、嬉しいこと言ってくれるじゃん」"

[[dialogue]]
speaker = "ナターシャ"
# 「それじゃ約束通り、私のおっぱいで気持ち良くしてあげる<emoji=heart04>」
line = "「それじゃ約束通り、私のおっぱいで気持ち良くしてあげる<emoji=heart04>」"

[[dialogue]]
speaker = "ナターシャ"
# 「はぁ。なんで私、あなたみたいな男に体を許しちゃったのかなー」
line = "「はぁ。なんで私、あなたみたいな男に体を許しちゃったのかなー」"

[[dialogue]]
speaker = "unk"
# ナターシャは言葉とは裏腹にいたずらっぽい笑みを浮かべながら、俺の脚の間に潜り込む。
line = "ナターシャは言葉とは裏腹にいたずらっぽい笑みを浮かべながら、俺の脚の間に潜り込む。"

[[dialogue]]
speaker = "unk"
# そのあまりに大きなおっぱいを見ただけで──いや、とっくの前に俺のペニスは激しく怒張していた。
line = "そのあまりに大きなおっぱいを見ただけで──いや、とっくの前に俺のペニスは激しく怒張していた。"

[[dialogue]]
speaker = "ナターシャ"
# 「見かけによらず、会長さんのおち○ちん、すっごく大きいよね。何回見ても慣れないな」
line = "「見かけによらず、会長さんのおち○ちん、すっごく大きいよね。何回見ても慣れないな」"

[[dialogue]]
speaker = "クロト"
# 「俺だって同じだよ。ナターシャのおっぱい、すっごく大きいし、何回見たって飽きない」
line = "「俺だって同じだよ。ナターシャのおっぱい、すっごく大きいし、何回見たって飽きない」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふーん。それで会長さんは、私のおっぱいに、おち○ちんを挟んでほしかったってわけ？」
line = "「ふーん。それで会長さんは、私のおっぱいに、おち○ちんを挟んでほしかったってわけ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「これ、パイズリっていうんだよね？　おち○ちん気持ちよくなりたいなら、セックスの方がいいんじゃないの？」
line = "「これ、パイズリっていうんだよね？　おち○ちん気持ちよくなりたいなら、セックスの方がいいんじゃないの？」"

[[dialogue]]
speaker = "クロト"
# 「セックスはセックスで良いものだし、パイズリはパイズリで良いものなんだ。いつも同じ物ばかり食べてると、たまには違う物が食べたくなるだろ？」
line = "「セックスはセックスで良いものだし、パイズリはパイズリで良いものなんだ。いつも同じ物ばかり食べてると、たまには違う物が食べたくなるだろ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「え、私は別に飲むゼリーでいいし」
line = "「え、私は別に飲むゼリーでいいし」"

[[dialogue]]
speaker = "unk"
# 食にこだわりのないナターシャへのたとえ話としては不適切だった。
line = "食にこだわりのないナターシャへのたとえ話としては不適切だった。"

[[dialogue]]
speaker = "ナターシャ"
# 「こんなので本当に気持ちよくできるのかな。パイズリなんて初めてするから、上手くできなくても怒らないでよ？」
line = "「こんなので本当に気持ちよくできるのかな。パイズリなんて初めてするから、上手くできなくても怒らないでよ？」"

[[dialogue]]
speaker = "クロト"
# 「いいから、早く！　早くお願い！」
line = "「いいから、早く！　早くお願い！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふふ、会長さんっていつもは落ち着いてるのに、エッチなことになると余裕なくなりがちだよね。ふーっ<emoji=heart04>」
line = "「ふふ、会長さんっていつもは落ち着いてるのに、エッチなことになると余裕なくなりがちだよね。ふーっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ナターシャに涼やかな息を吹きかけられ、ペニスがビクッと跳ねる。
line = "ナターシャに涼やかな息を吹きかけられ、ペニスがビクッと跳ねる。"

[[dialogue]]
speaker = "ナターシャ"
# 「ふふ、いい反応。おち○ちん、精液出したくって出したくって、プルプル震えちゃってる。このまま生殺しじゃ可哀想」
line = "「ふふ、いい反応。おち○ちん、精液出したくって出したくって、プルプル震えちゃってる。このまま生殺しじゃ可哀想」"

[[dialogue]]
speaker = "ナターシャ"
# 「しょうがないから、お待ちかねのー……おっぱいで包んで、ムニュムニュ扱いてあげる。えいっ<emoji=heart04>」
line = "「しょうがないから、お待ちかねのー……おっぱいで包んで、ムニュムニュ扱いてあげる。えいっ<emoji=heart04>」"

[[dialogue]]
speaker = "ナターシャ"
# 「ん、はっ……うわー、おち○ちんの先っぽから、とろとろのおつゆあふれちゃってる……<emoji=heart04>」
line = "「ん、はっ……うわー、おち○ちんの先っぽから、とろとろのおつゆあふれちゃってる……<emoji=heart04>」"

[[dialogue]]
speaker = "ナターシャ"
# 「はぁ、あっ……ほらほら、おち○ちん、きもちよくな～れ、きもちよくな～れ<emoji=heart04>　んあっ、はぁっ……<emoji=heart04>」
line = "「はぁ、あっ……ほらほら、おち○ちん、きもちよくな～れ、きもちよくな～れ<emoji=heart04>　んあっ、はぁっ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ペニスに押し付けられて形を変え、柔らかく弾む爆乳を拝んでいるだけで、うっかり出てしまいそうだ。
line = "ペニスに押し付けられて形を変え、柔らかく弾む爆乳を拝んでいるだけで、うっかり出てしまいそうだ。"

[[dialogue]]
speaker = "ナターシャ"
# 「ん、うまく滑ってくれないね……おち○ちん、汗ばんでてベトベトだからかな？」
line = "「ん、うまく滑ってくれないね……おち○ちん、汗ばんでてベトベトだからかな？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そっか、ツバをかければ……もご、もご、もご……ちゅぷぁ……こうやっへ垂らしへぇ……んぷぁあぁ……<emoji=heart04>」
line = "「そっか、ツバをかければ……もご、もご、もご……ちゅぷぁ……こうやっへ垂らしへぇ……んぷぁあぁ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# ナターシャが口の中に溜めた、温くてぬるぬるのローションのような唾液が、亀頭に降りかかる。
line = "ナターシャが口の中に溜めた、温くてぬるぬるのローションのような唾液が、亀頭に降りかかる。"

[[dialogue]]
speaker = "ナターシャ"
# 「トロットロのヌルッヌルになったでしょ。これで、も～っときもちよくなれるんじゃない？　ほらほらほら」
line = "「トロットロのヌルッヌルになったでしょ。これで、も～っときもちよくなれるんじゃない？　ほらほらほら」"

[[dialogue]]
speaker = "クロト"
# 「っく！？　ぅあ、あっ、それ、ヤバッ……！」
line = "「っく！？　ぅあ、あっ、それ、ヤバッ……！」"

[[dialogue]]
speaker = "unk"
# ナターシャの爆乳の間で、汗と唾液と我慢汁がねちゃねちゃと音を立てて混ざり合い、温かなぬめりと甘い摩擦を送り付けてくる。
line = "ナターシャの爆乳の間で、汗と唾液と我慢汁がねちゃねちゃと音を立てて混ざり合い、温かなぬめりと甘い摩擦を送り付けてくる。"

[[dialogue]]
speaker = "ナターシャ"
# 「会長さんのおち○ちんアツアツだね。熱を感じてたら、私もちょっと気持ちよくなってきちゃった」
line = "「会長さんのおち○ちんアツアツだね。熱を感じてたら、私もちょっと気持ちよくなってきちゃった」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふぅ、んっ……はぁ、はっ……イキたくなったら、我慢しないでいいからね……精液ビュービュー出しちゃえ」
line = "「ふぅ、んっ……はぁ、はっ……イキたくなったら、我慢しないでいいからね……精液ビュービュー出しちゃえ」"

[[dialogue]]
speaker = "クロト"
# 「くっ……すぐに出すのは、もったいないって……ナターシャのパイズリ、ずっと味わってたい……！」
line = "「くっ……すぐに出すのは、もったいないって……ナターシャのパイズリ、ずっと味わってたい……！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふーん。最後までしてあげるけど、イキたがりなおち○ちんは、どれだけ我慢できるかな？」
line = "「ふーん。最後までしてあげるけど、イキたがりなおち○ちんは、どれだけ我慢できるかな？」"

[[dialogue]]
speaker = "unk"
# 俺の目を射貫くようにジッと見つめ、あまりに大きな胸をぽよんぽよんと揺らす。
line = "俺の目を射貫くようにジッと見つめ、あまりに大きな胸をぽよんぽよんと揺らす。"

[[dialogue]]
speaker = "unk"
# 吸血鬼のごとく、見る者を魅了するその瞳から逃れられない。捕食者と、搾り取られる獲物の関係だ。
line = "吸血鬼のごとく、見る者を魅了するその瞳から逃れられない。捕食者と、搾り取られる獲物の関係だ。"

[[dialogue]]
speaker = "ナターシャ"
# 「んっ……ふぁ……あはっ、おち○ちん、きもちよさそ。すぐにでもイッちゃいそうだね」
line = "「んっ……ふぁ……あはっ、おち○ちん、きもちよさそ。すぐにでもイッちゃいそうだね」"

[[dialogue]]
speaker = "ナターシャ"
# 「今の会長さん、だらしない顔で、隙だらけだもん。情けな～い♪　はっ……私じゃなきゃ、百年の恋だって、冷めちゃうよ」
line = "「今の会長さん、だらしない顔で、隙だらけだもん。情けな～い♪　はっ……私じゃなきゃ、百年の恋だって、冷めちゃうよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふっ、んっ……今の会長さんに襲い掛かったら、簡単に殺せちゃうね。おち○ちん丸出しで死んだら……っ……かっこ悪いよ」
line = "「ふっ、んっ……今の会長さんに襲い掛かったら、簡単に殺せちゃうね。おち○ちん丸出しで死んだら……っ……かっこ悪いよ」"

[[dialogue]]
speaker = "クロト"
# 「くっ……気持ちいいまま死ねるなら、それはそれで幸せかも……」
line = "「くっ……気持ちいいまま死ねるなら、それはそれで幸せかも……」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふふ、余裕ぶっちゃって。私がいきなり斬りかかったりしないって、わかってるからでしょ」
line = "「ふふ、余裕ぶっちゃって。私がいきなり斬りかかったりしないって、わかってるからでしょ」"

[[dialogue]]
speaker = "unk"
# ナターシャにその気があるならば、俺を殺せる機会なんて両手両指でも数えきれないほどあった。
line = "ナターシャにその気があるならば、俺を殺せる機会なんて両手両指でも数えきれないほどあった。"

[[dialogue]]
speaker = "unk"
# 最初の頃はハニートラップなのかもと警戒していたけれど、今では安心して愛し合っているし、彼女を信じている。
line = "最初の頃はハニートラップなのかもと警戒していたけれど、今では安心して愛し合っているし、彼女を信じている。"

[[dialogue]]
speaker = "ナターシャ"
# 「はぁ、んっ……信じてくれてるなら、もっと気持ちよくしてあげたくなっちゃうな。ふっ……会長さんはさ、おち○ちんの先っぽら辺のー、ここがいいんでしょ～？」
line = "「はぁ、んっ……信じてくれてるなら、もっと気持ちよくしてあげたくなっちゃうな。ふっ……会長さんはさ、おち○ちんの先っぽら辺のー、ここがいいんでしょ～？」"

[[dialogue]]
speaker = "unk"
# ナターシャが器用に両胸を使い、出っ張ったカリ首をくすぐる。
line = "ナターシャが器用に両胸を使い、出っ張ったカリ首をくすぐる。"

[[dialogue]]
speaker = "クロト"
# 「……っ！？　本当にパイズリ初めてなのか……？」
line = "「……っ！？　本当にパイズリ初めてなのか……？」"

[[dialogue]]
speaker = "ナターシャ"
# 「当たり前でしょ。会長さん以外の男に、体を許してないんだからさ」
line = "「当たり前でしょ。会長さん以外の男に、体を許してないんだからさ」"

[[dialogue]]
speaker = "unk"
# 指で扱くよりも繊細な動きで、ナターシャのおっぱいは的確に裏筋やカリ裏を擦り上げる。
line = "指で扱くよりも繊細な動きで、ナターシャのおっぱいは的確に裏筋やカリ裏を擦り上げる。"

[[dialogue]]
speaker = "ナターシャ"
# 「はぁ、んっ……私、器用だからねー。自分の体すら上手く使えないようじゃ、暗殺者失格だし……会長さんの弱点なんて、すっかりお見通し<emoji=heart04>」
line = "「はぁ、んっ……私、器用だからねー。自分の体すら上手く使えないようじゃ、暗殺者失格だし……会長さんの弱点なんて、すっかりお見通し<emoji=heart04>」"

[[dialogue]]
speaker = "ナターシャ"
# 「そろそろ激しくした方がいいよね？　んっ、はぁ……おち○ちんってだんだん激しくしてかないと、最後までイケないんだもんね？」
line = "「そろそろ激しくした方がいいよね？　んっ、はぁ……おち○ちんってだんだん激しくしてかないと、最後までイケないんだもんね？」"

[[dialogue]]
speaker = "unk"
# 何度も体を重ねて弱点を知り尽くしているナターシャは、おっぱいの動きに緩急をつけ、左右の動きをズラしたりしつつ、激しく上下に揺らす。
line = "何度も体を重ねて弱点を知り尽くしているナターシャは、おっぱいの動きに緩急をつけ、左右の動きをズラしたりしつつ、激しく上下に揺らす。"

[[dialogue]]
speaker = "ナターシャ"
# 「んぅ、ふっ……はぁ、はふぅ……おち○ちん、おっぱいの間でびくんびくんしてるぅ……ねちょねちょって、エッチな音ぉ……」
line = "「んぅ、ふっ……はぁ、はふぅ……おち○ちん、おっぱいの間でびくんびくんしてるぅ……ねちょねちょって、エッチな音ぉ……」"

[[dialogue]]
speaker = "ナターシャ"
# 「はぁ、はぁっ……こんな音聞かされてたら、私もきもちよくなっちゃう……ほら、乳首も擦れて、ビンビンになってるでしょ……？」
line = "「はぁ、はぁっ……こんな音聞かされてたら、私もきもちよくなっちゃう……ほら、乳首も擦れて、ビンビンになってるでしょ……？」"

[[dialogue]]
speaker = "unk"
# おっぱいは激しく上下に跳ねまわり、ぱんっぱんっと肉を打ち付ける音が響く。
line = "おっぱいは激しく上下に跳ねまわり、ぱんっぱんっと肉を打ち付ける音が響く。"

[[dialogue]]
speaker = "ナターシャ"
# 「はあぁ……おち○ちんから、エッチでクッサぁい匂いが、ぷんぷんしてるしぃ……はっ、はふっ、はっ、はっ、はぅぅんっ……<emoji=heart04>」
line = "「はあぁ……おち○ちんから、エッチでクッサぁい匂いが、ぷんぷんしてるしぃ……はっ、はふっ、はっ、はっ、はぅぅんっ……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 長く愉しもうと耐えていたのに、ナターシャの快感に溶ける顔があまりにいやらしくて、急速に射精感が昇ってくる。
line = "長く愉しもうと耐えていたのに、ナターシャの快感に溶ける顔があまりにいやらしくて、急速に射精感が昇ってくる。"

[[dialogue]]
speaker = "クロト"
# 「はぁ、はっ……うぅっ……イキそうだから、少し緩めてっ……！」
line = "「はぁ、はっ……うぅっ……イキそうだから、少し緩めてっ……！」"

[[dialogue]]
speaker = "ナターシャ"
