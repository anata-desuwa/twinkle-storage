[[dialogue]]
speaker = "ジグ"
# 「梨緒は右から、アポロは左から。円を描くように囲い込んで、退路を塞いでね」
line = "「梨緒は右から、アポロは左から。円を描くように囲い込んで、退路を塞いでね」"

[[dialogue]]
speaker = "梨緒"
# 「よし、行くぞ、アポロ」
line = "「よし、行くぞ、アポロ」"

[[dialogue]]
speaker = "アポロ"
# 「おとなしくしてりゃ痛くしないからなっ！　うりゃりゃりゃりゃーーーっ！」
line = "「おとなしくしてりゃ痛くしないからなっ！　うりゃりゃりゃりゃーーーっ！」"

[[dialogue]]
speaker = "ゴースト"
# 「キャー！　キャーキャーーーッ！？」
line = "「キャー！　キャーキャーーーッ！？」"

[[dialogue]]
speaker = "ジグ"
# 「大声を発して威嚇し、一点に追い詰める。追い込み漁というやつだね。３人がかりなら学園内のゴーストをかき集めるのも容易い」
line = "「大声を発して威嚇し、一点に追い詰める。追い込み漁というやつだね。３人がかりなら学園内のゴーストをかき集めるのも容易い」"

[[dialogue]]
speaker = "梨緒"
# 「３人がかりというが、君は動いてないだろう！」
line = "「３人がかりというが、君は動いてないだろう！」"

[[dialogue]]
speaker = "ジグ"
# 「いやいや、指揮は大事だよ？　特に私のはね。ほら、あとは梨緒がそこに網を張れば、文字通り一網打尽だ」
line = "「いやいや、指揮は大事だよ？　特に私のはね。ほら、あとは梨緒がそこに網を張れば、文字通り一網打尽だ」"

[[dialogue]]
speaker = "unk"
# 梨緒はジグの指示通りに星術の網を放ち、ゴーストの群れを捕獲する。
line = "梨緒はジグの指示通りに星術の網を放ち、ゴーストの群れを捕獲する。"

[[dialogue]]
speaker = "ゴースト"
# 「キャキャキャーーーッ！？！！？」
line = "「キャキャキャーーーッ！？！！？」"

[[dialogue]]
speaker = "梨緒"
# 「ぐっ……確かに指示は的確だった。悔しいが、こればかりは認めざるを得ないな……」
line = "「ぐっ……確かに指示は的確だった。悔しいが、こればかりは認めざるを得ないな……」"

[[dialogue]]
speaker = "アポロ"
# 「さすがはジグ、あっという間に片付いちまったな！　ちょっと暴れ足りないくらいだぜ！」
line = "「さすがはジグ、あっという間に片付いちまったな！　ちょっと暴れ足りないくらいだぜ！」"

[[dialogue]]
speaker = "ジグ"
# 「はは、ゴーストたちの代わりにアポロが暴れたら本末転倒だよ」
line = "「はは、ゴーストたちの代わりにアポロが暴れたら本末転倒だよ」"

[[dialogue]]
speaker = "梨緒"
# 「ここは片付いたし、次はアリーナに移動しよう。私たちが頑張っている間に、ベアトとナターシャが準備を進めてくれているはずだ」
line = "「ここは片付いたし、次はアリーナに移動しよう。私たちが頑張っている間に、ベアトとナターシャが準備を進めてくれているはずだ」"

[[dialogue]]
speaker = "アポロ"
# 「チマチマした飾りつけより、こっちの鬼ごっこの方があたし向きだな！　次行くぞ、次ーっ！」
line = "「チマチマした飾りつけより、こっちの鬼ごっこの方があたし向きだな！　次行くぞ、次ーっ！」"

[[dialogue]]
speaker = "unk"
# ゴーストの捕獲は梨緒たちに任せ、ベアトリスとナターシャはハロウィンパーティーの飾り作りに勤しんでいた。
line = "ゴーストの捕獲は梨緒たちに任せ、ベアトリスとナターシャはハロウィンパーティーの飾り作りに勤しんでいた。"

[[dialogue]]
speaker = "ベアトリス"
# 「ゴーストを捕まえるの、梨緒ちゃんたちに任せちゃって大丈夫かニャ？」
line = "「ゴーストを捕まえるの、梨緒ちゃんたちに任せちゃって大丈夫かニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ジグがいれば万が一にも失敗しないし、アポロも梨緒が止めてくれるでしょ」
line = "「ジグがいれば万が一にも失敗しないし、アポロも梨緒が止めてくれるでしょ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ふふ、ナターシャちゃん、みんなのことよくわかってるねっ」
line = "「ふふ、ナターシャちゃん、みんなのことよくわかってるねっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ま、選管の一員としての付き合いも長くなってきたし、ある程度はね」
line = "「ま、選管の一員としての付き合いも長くなってきたし、ある程度はね」"

[[dialogue]]
speaker = "ベアトリス"
# 「じゃあゴーストさんたちが楽しくなれるように、私たちは飾り付けを進めよっ」
line = "「じゃあゴーストさんたちが楽しくなれるように、私たちは飾り付けを進めよっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「やっぱりカボチャのランタンは必要だよね。んっしょ、んっしょ」
line = "「やっぱりカボチャのランタンは必要だよね。んっしょ、んっしょ」"

[[dialogue]]
speaker = "ナターシャ"
# 「あー……ベアトのそれ、ランタン彫ってるつもりだったんだ」
line = "「あー……ベアトのそれ、ランタン彫ってるつもりだったんだ」"

[[dialogue]]
speaker = "ベアトリス"
# 「そうだよっ！？　何作ってると思ってたニャンーっ！？」
line = "「そうだよっ！？　何作ってると思ってたニャンーっ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ランタンには全然見えなかったから、てっきりデネブ仕込みの前衛芸術作品なのかなって」
line = "「ランタンには全然見えなかったから、てっきりデネブ仕込みの前衛芸術作品なのかなって」"

[[dialogue]]
speaker = "ベアトリス"
# 「うっ……確かに不格好だとは思うけど……」
line = "「うっ……確かに不格好だとは思うけど……」"

[[dialogue]]
speaker = "ナターシャ"
# 「ちょっと貸して。ランタンにするんなら、先にこっちから彫らないと──」
line = "「ちょっと貸して。ランタンにするんなら、先にこっちから彫らないと──」"

[[dialogue]]
speaker = "ナターシャ"
# 「ほら、それっぽくなったでしょ」
line = "「ほら、それっぽくなったでしょ」"

[[dialogue]]
speaker = "ベアトリス"
# 「すっご～いっ！　ナターシャちゃん、ランタン作りやったことあるのニャ？」
line = "「すっご～いっ！　ナターシャちゃん、ランタン作りやったことあるのニャ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「や、初めてだけど。手先は器用な方だし、刃物の扱いも得意だからね」
line = "「や、初めてだけど。手先は器用な方だし、刃物の扱いも得意だからね」"

[[dialogue]]
speaker = "ナターシャ"
# 「ちょいちょいちょいっと……はい、できた」
line = "「ちょいちょいちょいっと……はい、できた」"

[[dialogue]]
speaker = "ベアトリス"
# 「わ、わ、あっという間！　私、ぶきっちょだから羨ましいよ～っ」
line = "「わ、わ、あっという間！　私、ぶきっちょだから羨ましいよ～っ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ランタン作りはナターシャちゃんに任せて、他ので貢献した方が良さそうかニャ」
line = "「ランタン作りはナターシャちゃんに任せて、他ので貢献した方が良さそうかニャ」"

[[dialogue]]
speaker = "ベアトリス"
# 「う～ん、ハロウィンっぽい飾りつけといえば……そうだ。折り紙を折って、この線に合わせて、チョキチョキチョキ……っと」
line = "「う～ん、ハロウィンっぽい飾りつけといえば……そうだ。折り紙を折って、この線に合わせて、チョキチョキチョキ……っと」"

[[dialogue]]
speaker = "ナターシャ"
# 「何作ってるの？　切り絵？」
line = "「何作ってるの？　切り絵？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ふふ、この切れ込みを入れた折り紙を広げると──じゃーんっ！　クモの巣の完成～！」
line = "「ふふ、この切れ込みを入れた折り紙を広げると──じゃーんっ！　クモの巣の完成～！」"

[[dialogue]]
speaker = "ナターシャ"
# 「ひぃいっ！？　く、く、クモ、禁止っ！　巣でもダメ！」
line = "「ひぃいっ！？　く、く、クモ、禁止っ！　巣でもダメ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「クモは害虫を食べてくれるんだよ？」
line = "「クモは害虫を食べてくれるんだよ？」"

[[dialogue]]
speaker = "ナターシャ"
# 「そういう問題じゃないの！　何考えてるかわからないのも、ウジャウジャいるのも、本能で動いてて理屈が通じないのもダメ！」
line = "「そういう問題じゃないの！　何考えてるかわからないのも、ウジャウジャいるのも、本能で動いてて理屈が通じないのもダメ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「クモの巣だけでもダメニャの？」
line = "「クモの巣だけでもダメニャの？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ダメダメムリムリムリ！　暗い所でいきなり顔に絡んだ時の不快感ったらないし！」
line = "「ダメダメムリムリムリ！　暗い所でいきなり顔に絡んだ時の不快感ったらないし！」"

[[dialogue]]
speaker = "ナターシャ"
# 「アレに他の虫も絡みついてたのかと思うと……あーダメ、もーダメ、想像しただけで鳥肌立つ！」
line = "「アレに他の虫も絡みついてたのかと思うと……あーダメ、もーダメ、想像しただけで鳥肌立つ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「わ、本当だ。ナターシャちゃんの腕、ブツブツにニャってる～」
line = "「わ、本当だ。ナターシャちゃんの腕、ブツブツにニャってる～」"

[[dialogue]]
speaker = "ナターシャ"
# 「逆にベアトはどうして平気なの？　大抵の女の子って虫が嫌いなものでしょ」
line = "「逆にベアトはどうして平気なの？　大抵の女の子って虫が嫌いなものでしょ」"

[[dialogue]]
speaker = "ベアトリス"
# 「虫なんて故郷の洞窟にいくらでもいたからね。外で見られない面白い虫もいて……」
line = "「虫なんて故郷の洞窟にいくらでもいたからね。外で見られない面白い虫もいて……」"

[[dialogue]]
speaker = "ナターシャ"
# 「やめやめやめやめ！　だから、そういうのもダメなんだって～～っ！」
line = "「やめやめやめやめ！　だから、そういうのもダメなんだって～～っ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「どうして平気なのか答えただけなのに～……」
line = "「どうして平気なのか答えただけなのに～……」"

[[dialogue]]
speaker = "ベアトリス"
# 「だけど、いつもクールで落ち着いてるのに、取り乱しちゃうナターシャちゃん、ちょっと可愛いかもニャ」
line = "「だけど、いつもクールで落ち着いてるのに、取り乱しちゃうナターシャちゃん、ちょっと可愛いかもニャ」"

[[dialogue]]
speaker = "ナターシャ"
# 「こっちは笑いごとじゃないの。なんか鳥肌通り越して体痒くなってきたよ。蕁麻疹出そう」
line = "「こっちは笑いごとじゃないの。なんか鳥肌通り越して体痒くなってきたよ。蕁麻疹出そう」"

[[dialogue]]
speaker = "ベアトリス"
# 「ナターシャちゃんが倒れちゃったら困るよっ。……仕方ないから、クモの巣はこっそり作ろうっと」
line = "「ナターシャちゃんが倒れちゃったら困るよっ。……仕方ないから、クモの巣はこっそり作ろうっと」"

[[dialogue]]
speaker = "ナターシャ"
# 「ベアト……斬るよ？」
line = "「ベアト……斬るよ？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ごめんごめん、冗談だってば～っ」
line = "「ごめんごめん、冗談だってば～っ」"
