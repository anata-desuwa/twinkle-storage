[[dialogue]]
speaker = "unk"
# 第４話,白紙の予定表,P
line = "第４話,白紙の予定表,P"

[[dialogue]]
speaker = "シルヴィ"
# 「む～～～～～～」
line = "「む～～～～～～」"

[[dialogue]]
speaker = "unk"
# 放課後、一緒に帰ろうとシルヴィ先輩を迎えに行くと、難しい顔で何やら唸っていた。手にはプリントを持っている。
line = "放課後、一緒に帰ろうとシルヴィ先輩を迎えに行くと、難しい顔で何やら唸っていた。手にはプリントを持っている。"

[[dialogue]]
speaker = "unk"
# どうしたんですか？
line = "どうしたんですか？"

[[dialogue]]
speaker = "シルヴィ"
# 「あ、会長くん！　見てよコレ」
line = "「あ、会長くん！　見てよコレ」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩がにらめっこしていたプリントには『進路希望調査』と書いてある。
line = "シルヴィ先輩がにらめっこしていたプリントには『進路希望調査』と書いてある。"

[[dialogue]]
speaker = "シルヴィ"
# 「ゼロなんとかも倒して、リクリエも落ち着いたけどさ。今度は先のことも考えないとなんだよねぇ……」
line = "「ゼロなんとかも倒して、リクリエも落ち着いたけどさ。今度は先のことも考えないとなんだよねぇ……」"

[[dialogue]]
speaker = "シルヴィ"
# 「最初は学園を卒業したら、天界に帰るつもりだったけど、今は迷ってるんだ。帰ったら、ＧＦＣもボスチキンも購買のチキンもないし」
line = "「最初は学園を卒業したら、天界に帰るつもりだったけど、今は迷ってるんだ。帰ったら、ＧＦＣもボスチキンも購買のチキンもないし」"

[[dialogue]]
speaker = "シルヴィ"
# 「それに何より──」
line = "「それに何より──」"

[[dialogue]]
speaker = "シルヴィ"
# 「君がいないからね」
line = "「君がいないからね」"

[[dialogue]]
speaker = "シルヴィ"
# 「んふふっ、照れてる？　つんつん……へへへ、ほっぺた柔らか～い。おやおや～、顔が赤くなってきたぞ～？」
line = "「んふふっ、照れてる？　つんつん……へへへ、ほっぺた柔らか～い。おやおや～、顔が赤くなってきたぞ～？」"

[[dialogue]]
speaker = "シルヴィ"
# 「ごめんごめん、可愛くってつい。あ、でも、男の子に可愛いって言うのはよくないかな？」
line = "「ごめんごめん、可愛くってつい。あ、でも、男の子に可愛いって言うのはよくないかな？」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩ならいいです
line = "シルヴィ先輩ならいいです"

[[dialogue]]
speaker = "シルヴィ"
# 「ありがと。ふふっ、彼女だけの特権だね」
line = "「ありがと。ふふっ、彼女だけの特権だね」"

[[dialogue]]
speaker = "シルヴィ"
# 「真面目な話、君とは離れたくない。でも故郷に帰りたい自分もいて…………どうしようかなって」
line = "「真面目な話、君とは離れたくない。でも故郷に帰りたい自分もいて…………どうしようかなって」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩が俺を故郷と同じくらい大事に思ってくれている。
line = "シルヴィ先輩が俺を故郷と同じくらい大事に思ってくれている。"

[[dialogue]]
speaker = "unk"
# それは嬉しいけど、悩ませているのは申し訳なく感じる。
line = "それは嬉しいけど、悩ませているのは申し訳なく感じる。"

[[dialogue]]
speaker = "シルヴィ"
# 「遠距離恋愛もしたくないし……会長くんの周りには、魅力的な女の子いっぱいいるもん。君が浮気するとは思わないけど、やっぱり不安になっちゃうよ」
line = "「遠距離恋愛もしたくないし……会長くんの周りには、魅力的な女の子いっぱいいるもん。君が浮気するとは思わないけど、やっぱり不安になっちゃうよ」"

[[dialogue]]
speaker = "unk"
# 浮気なんてしません
line = "浮気なんてしません"

[[dialogue]]
speaker = "シルヴィ"
# 「会長くん……」
line = "「会長くん……」"

[[dialogue]]
speaker = "unk"
# 俺の気持ちを伝えたくて、シルヴィ先輩の目をじっと見る。
line = "俺の気持ちを伝えたくて、シルヴィ先輩の目をじっと見る。"

[[dialogue]]
speaker = "unk"
# やがて先輩は目を閉じて……
line = "やがて先輩は目を閉じて……"

[[dialogue]]
speaker = "シルヴィ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "unk"
# 誘われるように、唇に近付く──
line = "誘われるように、唇に近付く──"

[[dialogue]]
speaker = "マハムート"
# 「なにやってるのよ、あなたたち」
line = "「なにやってるのよ、あなたたち」"

[[dialogue]]
speaker = "シルヴィ"
# 「きゃ～～～～～～っ！？」
line = "「きゃ～～～～～～っ！？」"

[[dialogue]]
speaker = "マハムート"
# 「放課後とはいえ、現役の星徒会長と元星徒会役員が学園内で乳繰り合うとはいい度胸ね。選管にでも報告しておこうかしら？」
line = "「放課後とはいえ、現役の星徒会長と元星徒会役員が学園内で乳繰り合うとはいい度胸ね。選管にでも報告しておこうかしら？」"

[[dialogue]]
speaker = "シルヴィ"
# 「マム！？　どうしてここに！？」
line = "「マム！？　どうしてここに！？」"

[[dialogue]]
speaker = "マハムート"
# 「どうしても何も、忘れ物を取りに来ただけよ。それより、進路希望で悩むなんてあなたらしくないというか、意外ね」
line = "「どうしても何も、忘れ物を取りに来ただけよ。それより、進路希望で悩むなんてあなたらしくないというか、意外ね」"

[[dialogue]]
speaker = "シルヴィ"
# 「え、聞こえてた？」
line = "「え、聞こえてた？」"

[[dialogue]]
speaker = "マハムート"
# 「盗み聞きするつもりはなかったけれどね」
line = "「盗み聞きするつもりはなかったけれどね」"

[[dialogue]]
speaker = "マハムート"
# 「あなた、星徒会に入る時は即断即決だったらしいじゃない。そのあなたがこんなに悩む姿を見るとは思わなかったわ」
line = "「あなた、星徒会に入る時は即断即決だったらしいじゃない。そのあなたがこんなに悩む姿を見るとは思わなかったわ」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしだって悩むときは悩みますー！　……ちなみに、マムは進路希望、なんて書いた？」
line = "「あたしだって悩むときは悩みますー！　……ちなみに、マムは進路希望、なんて書いた？」"

[[dialogue]]
speaker = "マハムート"
# 「実家に帰って妃竜院家を継ぐって書いたわ。当たり前でしょ」
line = "「実家に帰って妃竜院家を継ぐって書いたわ。当たり前でしょ」"

[[dialogue]]
speaker = "シルヴィ"
# 「そりゃそうだー！　マム、魔界の貴族だった！」
line = "「そりゃそうだー！　マム、魔界の貴族だった！」"

[[dialogue]]
speaker = "シルヴィ"
# 「……ねぇ、マムに恋人がいたらどうする？」
line = "「……ねぇ、マムに恋人がいたらどうする？」"

[[dialogue]]
speaker = "マハムート"
# 「当然、連れて帰るわ」
line = "「当然、連れて帰るわ」"

[[dialogue]]
speaker = "シルヴィ"
# 「即答！？」
line = "「即答！？」"

[[dialogue]]
speaker = "マハムート"
# 「私の恋人なら私の在り方を理解しているはずよ。あなたはそうじゃないの？」
line = "「私の恋人なら私の在り方を理解しているはずよ。あなたはそうじゃないの？」"

[[dialogue]]
speaker = "シルヴィ"
# 「それは……う～ん、分かんない。一緒についてきてほしい気持ちもあるけど、うちの田舎、ホントに何もないし…………」
line = "「それは……う～ん、分かんない。一緒についてきてほしい気持ちもあるけど、うちの田舎、ホントに何もないし…………」"

[[dialogue]]
speaker = "マハムート"
# 「あなたにも遠慮とかあったのね。ますます意外だわ」
line = "「あなたにも遠慮とかあったのね。ますます意外だわ」"

[[dialogue]]
speaker = "マハムート"
# 「まぁいいわ。あなたがそんなに悩むなら、すぐに答えなんて出ないでしょう。これで気分転換でもしてきなさい」
line = "「まぁいいわ。あなたがそんなに悩むなら、すぐに答えなんて出ないでしょう。これで気分転換でもしてきなさい」"

[[dialogue]]
speaker = "unk"
# そう言って、マムがくれたのはナイトプールのチケットだった。
line = "そう言って、マムがくれたのはナイトプールのチケットだった。"

[[dialogue]]
speaker = "マハムート"
# 「もらいものだけど、私は使わないからあなたたちにあげるわ」
line = "「もらいものだけど、私は使わないからあなたたちにあげるわ」"

[[dialogue]]
speaker = "シルヴィ"
# 「え、ありがとう！　えぇっと……畏怖！」
line = "「え、ありがとう！　えぇっと……畏怖！」"

[[dialogue]]
speaker = "マハムート"
# 「いや、それ、挨拶じゃないから。……あなたには卒業までに畏怖の意味を教えたかったけど、無理そうね。じゃあ私はこれで失礼するわ」
line = "「いや、それ、挨拶じゃないから。……あなたには卒業までに畏怖の意味を教えたかったけど、無理そうね。じゃあ私はこれで失礼するわ」"

[[dialogue]]
speaker = "シルヴィ"
# 「あ、マム、忘れ物は？」
line = "「あ、マム、忘れ物は？」"

[[dialogue]]
speaker = "マハムート"
# 「それは会長に何とかしてもらうわ。頼んだわよ？」
line = "「それは会長に何とかしてもらうわ。頼んだわよ？」"

[[dialogue]]
speaker = "unk"
# 俺に目配せして、マムは帰ってしまった。どうやらシルヴィ先輩を心配して戻ってきてくれたようだ。
line = "俺に目配せして、マムは帰ってしまった。どうやらシルヴィ先輩を心配して戻ってきてくれたようだ。"

[[dialogue]]
speaker = "シルヴィ"
# 「チケット、もらっちゃったね。せっかくだから、早速、使っちゃう……？」
line = "「チケット、もらっちゃったね。せっかくだから、早速、使っちゃう……？」"

[[dialogue]]
speaker = "シルヴィ"
# 「へ～、ナイトプールってこんな感じなんだね」
line = "「へ～、ナイトプールってこんな感じなんだね」"

[[dialogue]]
speaker = "unk"
# ムーディーな照明に照らされ、昼間とは打って変わった雰囲気を纏うプール。非日常的な空間だ。
line = "ムーディーな照明に照らされ、昼間とは打って変わった雰囲気を纏うプール。非日常的な空間だ。"

[[dialogue]]
speaker = "シルヴィ"
# 「なんていうか…………ちょっとエッチ？」
line = "「なんていうか…………ちょっとエッチ？」"

[[dialogue]]
speaker = "unk"
# 言い方！
line = "言い方！"

[[dialogue]]
speaker = "シルヴィ"
# 「えぇ～、だってさ、外でプールなのに、夜だから暗くて寝室みたいじゃん」
line = "「えぇ～、だってさ、外でプールなのに、夜だから暗くて寝室みたいじゃん」"

[[dialogue]]
speaker = "シルヴィ"
# 「でも、不思議と落ち着くかも。うん、けっこう好き～」
line = "「でも、不思議と落ち着くかも。うん、けっこう好き～」"

[[dialogue]]
speaker = "シルヴィ"
# 「空気がじめっとして……じゃなくて、しっとりしてるっていうか……ああもう、上手く説明できないや。会長くん、こっち来て！」
line = "「空気がじめっとして……じゃなくて、しっとりしてるっていうか……ああもう、上手く説明できないや。会長くん、こっち来て！」"

[[dialogue]]
speaker = "シルヴィ"
# 「ああ、ごめん！　勢い余って落ちちゃった！」
line = "「ああ、ごめん！　勢い余って落ちちゃった！」"

[[dialogue]]
speaker = "unk"
# 水の中で密着する。シルヴィ先輩の体が触れ合って、体温が伝わってくる。
line = "水の中で密着する。シルヴィ先輩の体が触れ合って、体温が伝わってくる。"

[[dialogue]]
speaker = "シルヴィ"
# 「ごめんついでに、このままぎゅってしてて…………うん、ありがと」
line = "「ごめんついでに、このままぎゅってしてて…………うん、ありがと」"

[[dialogue]]
speaker = "シルヴィ"
# 「会長くんを近くに感じるって言いたかったんだけど……物理的にゼロ距離だね……あはは…………」
line = "「会長くんを近くに感じるって言いたかったんだけど……物理的にゼロ距離だね……あはは…………」"

[[dialogue]]
speaker = "シルヴィ"
# 「……このまま聞いて」
line = "「……このまま聞いて」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしは星騎士になるために流星市国に来た」
line = "「あたしは星騎士になるために流星市国に来た」"

[[dialogue]]
speaker = "シルヴィ"
# 「ここで、みんなと出会って、いろんな楽しいこと、いろんなチキンやから揚げにも出会って…………君にも出会えた」
line = "「ここで、みんなと出会って、いろんな楽しいこと、いろんなチキンやから揚げにも出会って…………君にも出会えた」"

[[dialogue]]
speaker = "シルヴィ"
# 「みんなみんな、あたしの大好きな一部なんだ。だからこの街を離れたくないけど、故郷もやっぱりあたしの一部だから、帰りたい気持ちも本当なんだ」
line = "「みんなみんな、あたしの大好きな一部なんだ。だからこの街を離れたくないけど、故郷もやっぱりあたしの一部だから、帰りたい気持ちも本当なんだ」"

[[dialogue]]
speaker = "シルヴィ"
# 「会長くんにも同じように、やりたいこととかあると思う。一緒に生きていきたいけど、できるかどうかは分かんない」
line = "「会長くんにも同じように、やりたいこととかあると思う。一緒に生きていきたいけど、できるかどうかは分かんない」"

[[dialogue]]
speaker = "シルヴィ"
# 「だから、今はまだ答えは出さないよ。君と少しづつ答え合わせできたらいいな…………ダメかな？」
line = "「だから、今はまだ答えは出さないよ。君と少しづつ答え合わせできたらいいな…………ダメかな？」"

[[dialogue]]
speaker = "unk"
# 一緒に納得いく答えを見付けましょう
line = "一緒に納得いく答えを見付けましょう"

[[dialogue]]
speaker = "シルヴィ"
# 「うん、ありがとう。会長くんならそう言ってくれるって思ってた」
line = "「うん、ありがとう。会長くんならそう言ってくれるって思ってた」"

[[dialogue]]
speaker = "シルヴィ"
# 「……んふふっ、言いたいこと全部言えた気がする。来てよかったね」
line = "「……んふふっ、言いたいこと全部言えた気がする。来てよかったね」"

[[dialogue]]
speaker = "シルヴィ"
# 「今日はこのままゆったりして…………むむっ、チキンの匂い！」
line = "「今日はこのままゆったりして…………むむっ、チキンの匂い！」"

[[dialogue]]
speaker = "unk"
# このプールではフードメニューにも力を入れている。美味しいフライドチキンにも出会えるかもしれない。
line = "このプールではフードメニューにも力を入れている。美味しいフライドチキンにも出会えるかもしれない。"

[[dialogue]]
speaker = "シルヴィ"
# 「チキーン！　どこだー！！」
line = "「チキーン！　どこだー！！」"

[[dialogue]]
speaker = "unk"
# シルヴィ先輩に手を引かれ、プールサイドをどたどた駆けまわる夜だった。
line = "シルヴィ先輩に手を引かれ、プールサイドをどたどた駆けまわる夜だった。"
