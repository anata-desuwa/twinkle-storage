[[dialogue]]
speaker = "unk"
# 第３話,ミウの放課後デートプラン,P
line = "第３話,ミウの放課後デートプラン,P"

[[dialogue]]
speaker = "ミウ"
# 「教室に迎えに来るなら、来るって連絡してくれれば、途中で抜けてきましたのに……」
line = "「教室に迎えに来るなら、来るって連絡してくれれば、途中で抜けてきましたのに……」"

[[dialogue]]
speaker = "unk"
# メールしたと思うんだけど？
line = "メールしたと思うんだけど？"

[[dialogue]]
speaker = "ミウ"
# 「えっ……？　あ、本当だ……見逃しちゃってました。話に夢中になってて、気づかなかったんですね。ごめんなさい」
line = "「えっ……？　あ、本当だ……見逃しちゃってました。話に夢中になってて、気づかなかったんですね。ごめんなさい」"

[[dialogue]]
speaker = "unk"
# 俺に関する話だったみたいだけど
line = "俺に関する話だったみたいだけど"

[[dialogue]]
speaker = "unk"
# どんな話してたの？
line = "どんな話してたの？"

[[dialogue]]
speaker = "ミウ"
# 「そ、それはー……ガールズトークを聞き出そうだなんて、会長さんはデリカシーが足りてません！」
line = "「そ、それはー……ガールズトークを聞き出そうだなんて、会長さんはデリカシーが足りてません！」"

[[dialogue]]
speaker = "ミウ"
# 「あ、私、ちょっと着替えてきますね」
line = "「あ、私、ちょっと着替えてきますね」"

[[dialogue]]
speaker = "ミウ"
# 「せっかくの放課後デートですし、いつもと違う私も見てほしいですからね」
line = "「せっかくの放課後デートですし、いつもと違う私も見てほしいですからね」"

[[dialogue]]
speaker = "ミウ"
# 「じゃーん♪　チーパオフォームに変身してきました♪」
line = "「じゃーん♪　チーパオフォームに変身してきました♪」"

[[dialogue]]
speaker = "ミウ"
# 「どうですか、会長さん。この衣装、ヒマワリちゃんとお揃いなんですよ？　似合ってますか？」
line = "「どうですか、会長さん。この衣装、ヒマワリちゃんとお揃いなんですよ？　似合ってますか？」"

[[dialogue]]
speaker = "unk"
# とっても似合ってるよ
line = "とっても似合ってるよ"

[[dialogue]]
speaker = "unk"
# すっごく可愛いね
line = "すっごく可愛いね"

[[dialogue]]
speaker = "ミウ"
# 「ふふ、聞きたい言葉が聞けたので満足です。さ、会長さん、浅草デートを楽しみましょう♪」
line = "「ふふ、聞きたい言葉が聞けたので満足です。さ、会長さん、浅草デートを楽しみましょう♪」"

[[dialogue]]
speaker = "unk"
# 絡みつくように腕を組み、浅草の町を練り歩く。
line = "絡みつくように腕を組み、浅草の町を練り歩く。"

[[dialogue]]
speaker = "ミウ"
# 「わっ、ジャンボ黒豚肉まんだそうですよ！　この格好なら肉まんは食べなきゃですよね」
line = "「わっ、ジャンボ黒豚肉まんだそうですよ！　この格好なら肉まんは食べなきゃですよね」"

[[dialogue]]
speaker = "ミウ"
# 「蒸かしたてでアッツアツです。いただきまーす。はむっ」
line = "「蒸かしたてでアッツアツです。いただきまーす。はむっ」"

[[dialogue]]
speaker = "ミウ"
# 「ん～～～～っ<emoji=heart04>　ジューシーな肉汁がじゅわぁって溢れてきます<emoji=heart04>　美味しいです～～っ<emoji=heart04>」
line = "「ん～～～～っ<emoji=heart04>　ジューシーな肉汁がじゅわぁって溢れてきます<emoji=heart04>　美味しいです～～っ<emoji=heart04>」"

[[dialogue]]
speaker = "ミウ"
# 「会長さんも食べてください。わけっこしましょう。こんなに大きなの、私ひとりじゃ食べきれませんから。晩ご飯、食べられなくなっちゃいます」
line = "「会長さんも食べてください。わけっこしましょう。こんなに大きなの、私ひとりじゃ食べきれませんから。晩ご飯、食べられなくなっちゃいます」"

[[dialogue]]
speaker = "ミウ"
# 「参考までにー、私がかじったのは……ここですよ<emoji=heart04>　間接キスになっちゃいますけど<emoji=heart04>」
line = "「参考までにー、私がかじったのは……ここですよ<emoji=heart04>　間接キスになっちゃいますけど<emoji=heart04>」"

[[dialogue]]
speaker = "ミウ"
# 「──って、躊躇なく食べちゃうんですか！？」
line = "「──って、躊躇なく食べちゃうんですか！？」"

[[dialogue]]
speaker = "unk"
# ちょっとミウの味がする
line = "ちょっとミウの味がする"

[[dialogue]]
speaker = "unk"
# 肉汁がジューシーで美味い！
line = "肉汁がジューシーで美味い！"

[[dialogue]]
speaker = "ミウ"
# 「へ、変なこと言わないでくださいっ！　うぅ、やりこめるつもりが、私の方がやられちゃいました……」
line = "「へ、変なこと言わないでくださいっ！　うぅ、やりこめるつもりが、私の方がやられちゃいました……」"

[[dialogue]]
speaker = "ミウ"
# 「きゃ～～～っ<emoji=heart04>　あのパンダちゃんのぬいぐるみ大きすぎないですか！？　私と同じくらいありますよ」
line = "「きゃ～～～っ<emoji=heart04>　あのパンダちゃんのぬいぐるみ大きすぎないですか！？　私と同じくらいありますよ」"

[[dialogue]]
speaker = "ミウ"
# 「あれを抱いて寝たら、幸せな夢が見られそうです……いいなぁ……♪」
line = "「あれを抱いて寝たら、幸せな夢が見られそうです……いいなぁ……♪」"

[[dialogue]]
speaker = "unk"
# プレゼントしようか？
line = "プレゼントしようか？"

[[dialogue]]
speaker = "ミウ"
# 「ええっ！？　い、いいです、いいですよ！　あんなに大きいぬいぐるみ、お小遣いで買えるレベルじゃないですよ」
line = "「ええっ！？　い、いいです、いいですよ！　あんなに大きいぬいぐるみ、お小遣いで買えるレベルじゃないですよ」"

[[dialogue]]
speaker = "unk"
# 思ってたより１桁高かった……
line = "思ってたより１桁高かった……"

[[dialogue]]
speaker = "unk"
# 確かに……
line = "確かに……"

[[dialogue]]
speaker = "ミウ"
# 「あはは、ですよね。ヒマワリちゃんに言ったら、あっさり買ってくれちゃいそうなのが怖いんですけどね」
line = "「あはは、ですよね。ヒマワリちゃんに言ったら、あっさり買ってくれちゃいそうなのが怖いんですけどね」"

[[dialogue]]
speaker = "ミウ"
# 「デートって楽しいですね。友達と教室で話すのとも、ヒマワリちゃんと遊ぶのとも、任務を解決するのともまた違った楽しさで……」
line = "「デートって楽しいですね。友達と教室で話すのとも、ヒマワリちゃんと遊ぶのとも、任務を解決するのともまた違った楽しさで……」"

[[dialogue]]
speaker = "ミウ"
# 「ドキドキしっぱなしなのに、気持ちはすごく楽なんです。いつもと違う自分になれている気がします」
line = "「ドキドキしっぱなしなのに、気持ちはすごく楽なんです。いつもと違う自分になれている気がします」"

[[dialogue]]
speaker = "ミウ"
# 「ふふ、今の私を知ってるのは、会長さんだけなんですよ」
line = "「ふふ、今の私を知ってるのは、会長さんだけなんですよ」"

[[dialogue]]
speaker = "ミウ"
# 「親友のヒマワリちゃんにも見せたことのない……自分でも知らなかった私です」
line = "「親友のヒマワリちゃんにも見せたことのない……自分でも知らなかった私です」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃんは私のこと、なんでもできる完璧な子って思ってたみたいなんですよね」
line = "「ヒマワリちゃんは私のこと、なんでもできる完璧な子って思ってたみたいなんですよね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「えー！？　ミウもパニクっちゃうことってあるんだー！？」
line = "「えー！？　ミウもパニクっちゃうことってあるんだー！？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「でも、なんか可愛いー！　やっぱりミウも恋する女の子なんだねー！」
line = "「でも、なんか可愛いー！　やっぱりミウも恋する女の子なんだねー！」"

[[dialogue]]
speaker = "ミウ"
# 「こんなことを言えるのは、会長さんだけ。いつもと違う私でいられるのは、会長さんの前でだけ」
line = "「こんなことを言えるのは、会長さんだけ。いつもと違う私でいられるのは、会長さんの前でだけ」"

[[dialogue]]
speaker = "ミウ"
# 「だから、これからもずっと……私の特別な人でいてくださいね」
line = "「だから、これからもずっと……私の特別な人でいてくださいね」"

[[dialogue]]
speaker = "unk"
# 喜んで
line = "喜んで"

[[dialogue]]
speaker = "ミウ"
# 「あ……そろそろ暗くなってきちゃいましたね。会長さんとのデートの時間が、いつまでも続けばいいのに……」
line = "「あ……そろそろ暗くなってきちゃいましたね。会長さんとのデートの時間が、いつまでも続けばいいのに……」"

[[dialogue]]
speaker = "ミウ"
# 「どうしても終わりって訪れちゃうんですよね。残念です」
line = "「どうしても終わりって訪れちゃうんですよね。残念です」"

[[dialogue]]
speaker = "unk"
# 放課後デートの時間は終わりを告げようとしていた。
line = "放課後デートの時間は終わりを告げようとしていた。"
