line = "「大丈夫ですよー。ビギナーランクなら、みんなデビューしたばっかりだから怖くない怖くなーい」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ＣＰＵと対人だと全然別物ですし。こればっかりは経験しないと覚えられないですし。多少の痛みはつきものですから！」
line = "「ＣＰＵと対人だと全然別物ですし。こればっかりは経験しないと覚えられないですし。多少の痛みはつきものですから！」"

[[dialogue]]
