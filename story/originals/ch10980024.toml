line = "「よしよし。会長さんは悪くないですよ。相手と運が悪かっただけ……んー？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あー、ちょっと見てくださいよー。このゲーム、やられた後は自分を倒したプレイヤーの視点にできるんですけど……この人、素人じゃなさそう」
line = "「あー、ちょっと見てくださいよー。このゲーム、やられた後は自分を倒したプレイヤーの視点にできるんですけど……この人、素人じゃなさそう」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ほら、ここのショートカットとか初めてだったら絶対気づくわけないし、エイムもめちゃ上手いし」
line = "「ほら、ここのショートカットとか初めてだったら絶対気づくわけないし、エイムもめちゃ上手いし」"

[[dialogue]]
speaker = "ヒマワリ"
# 「中級プレイヤーの初心者狩りっぽいなー……結構いるんですよねー、そういう悪趣味なプレイするヤツ」
line = "「中級プレイヤーの初心者狩りっぽいなー……結構いるんですよねー、そういう悪趣味なプレイするヤツ」"

[[dialogue]]
speaker = "unk"
# 結局、俺を倒したプレイヤーは、そのまま１位になった。
line = "結局、俺を倒したプレイヤーは、そのまま１位になった。"

[[dialogue]]
speaker = "ヒマワリ"
# 「こんにゃろー、あたしの彼氏にいい度胸だー！　名前覚えたし、次に会ったらボッコボコに──って、連戦してんじゃん！　調子乗ってんなー！」
line = "「こんにゃろー、あたしの彼氏にいい度胸だー！　名前覚えたし、次に会ったらボッコボコに──って、連戦してんじゃん！　調子乗ってんなー！」"

