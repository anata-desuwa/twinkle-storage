[[dialogue]]
speaker = "unk"
# 有能すぎるオペレーターの的確な指示を受けながら、俺は着々と対戦相手を仕留め、順位を上げていく。
line = "有能すぎるオペレーターの的確な指示を受けながら、俺は着々と対戦相手を仕留め、順位を上げていく。"

[[dialogue]]
speaker = "ヒマワリ"
# 「！？　上から来るよ、気をつけて！」
line = "「！？　上から来るよ、気をつけて！」"

[[dialogue]]
speaker = "unk"
# ヒマワリが警告した次の瞬間、俺のキャラは地面に倒れ伏した。
