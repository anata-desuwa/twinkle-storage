line = "「他のプレイヤーはガン無視でやったります！　素人さんに手を出したらアイツと同じになっちゃうから狙いはアイツだけでね！」"

[[dialogue]]
speaker = "unk"
# 周りを飛び交う銃弾の雨あられをかいくぐり、ヒマワリは俺を倒したプレイヤーと対敵する。
