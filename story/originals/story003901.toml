[[dialogue]]
speaker = "unk"
# ある日のこと、秘密結社ゴールデングースに２人の来客があった。
line = "ある日のこと、秘密結社ゴールデングースに２人の来客があった。"

[[dialogue]]
speaker = "ミウ"
# 「いらっしゃいませ。早速ですが、今回はどういったご依頼でしょうか？」
line = "「いらっしゃいませ。早速ですが、今回はどういったご依頼でしょうか？」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「えぇっと……君たちがゴールデングースの構成員なのかね……？」
line = "「えぇっと……君たちがゴールデングースの構成員なのかね……？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「はいっ！　秘密結社ゴールデングースの鈴野ヒマワリっていいます！」
line = "「はいっ！　秘密結社ゴールデングースの鈴野ヒマワリっていいます！」"

[[dialogue]]
speaker = "ミウ"
# 「同じく秘密結社ゴールデングースの構成員、深沢ミウと申します。よろしくお願いします」
line = "「同じく秘密結社ゴールデングースの構成員、深沢ミウと申します。よろしくお願いします」"

[[dialogue]]
speaker = "依頼人Ｂ"
# 「……もっと上役はいないのか？　話をするにしても、キミらのような……」
line = "「……もっと上役はいないのか？　話をするにしても、キミらのような……」"

[[dialogue]]
speaker = "ミウ"
# 「申し訳ありません。社長のセナリィがあいにく留守にしておりますので」
line = "「申し訳ありません。社長のセナリィがあいにく留守にしておりますので」"

[[dialogue]]
speaker = "ヒマワリ"
# 「だけど心配はいらないですよ？　こう見えてもお仕事の経験はいっぱい積んでますし、それにミウは大人顔負けに頭がいいから！」
line = "「だけど心配はいらないですよ？　こう見えてもお仕事の経験はいっぱい積んでますし、それにミウは大人顔負けに頭がいいから！」"

[[dialogue]]
speaker = "ミウ"
# 「僭越ながら作戦立案を担当させて頂いています」
line = "「僭越ながら作戦立案を担当させて頂いています」"

[[dialogue]]
speaker = "依頼人Ｂ"
# 「そ、そうなのか……」
line = "「そ、そうなのか……」"

[[dialogue]]
speaker = "ミウ"
# 「ご不満のようですね？　でしたら、アポイントを取っていただいて、再度社長のいらっしゃる時にお越し頂ければ──」
line = "「ご不満のようですね？　でしたら、アポイントを取っていただいて、再度社長のいらっしゃる時にお越し頂ければ──」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「いや、急を要する案件だ。問題なく依頼を果たしてくれるならそれでいい」
line = "「いや、急を要する案件だ。問題なく依頼を果たしてくれるならそれでいい」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「実は君たちに調査して欲しいことがあるのだ。あまり大きな声では言えないのだが……五名門の九浄家を知っているだろうか？」
line = "「実は君たちに調査して欲しいことがあるのだ。あまり大きな声では言えないのだが……五名門の九浄家を知っているだろうか？」"

[[dialogue]]
speaker = "ミウ"
# 「はい、それはもちろん」
line = "「はい、それはもちろん」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「その九浄家にだな、黒い噂があるのだ。それについて調査して欲しい」
line = "「その九浄家にだな、黒い噂があるのだ。それについて調査して欲しい」"

[[dialogue]]
speaker = "ヒマワリ"
# 「黒い噂、ですか？」
line = "「黒い噂、ですか？」"

[[dialogue]]
speaker = "依頼人Ｂ"
# 「そうだ。キミらは知っているか？　人工的に製造された星騎士の戦闘服があるという話を」
line = "「そうだ。キミらは知っているか？　人工的に製造された星騎士の戦闘服があるという話を」"

[[dialogue]]
speaker = "ミウ"
# 「ええ、存じております。私たちも流星学園附属校に通う星騎士ですから」
line = "「ええ、存じております。私たちも流星学園附属校に通う星騎士ですから」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「そうでしたか。ならば話は早い」
line = "「そうでしたか。ならば話は早い」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「実はこの度、九浄家で新たに人工戦闘服が開発された、という情報を入手したのだ」
line = "「実はこの度、九浄家で新たに人工戦闘服が開発された、という情報を入手したのだ」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「しかし、その新たな戦闘服が問題で──非常に危険なものであるらしい」
line = "「しかし、その新たな戦闘服が問題で──非常に危険なものであるらしい」"

[[dialogue]]
speaker = "ミウ"
# 「そうなんですか？　その情報、どこから入手したものなのでしょう？」
line = "「そうなんですか？　その情報、どこから入手したものなのでしょう？」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「それは言えない。が、信頼できる筋からの情報だとは言っておく」
line = "「それは言えない。が、信頼できる筋からの情報だとは言っておく」"

[[dialogue]]
speaker = "ヒマワリ"
# 「本当なのかな～。危険って、どういう風に危険なんだろ？」
line = "「本当なのかな～。危険って、どういう風に危険なんだろ？」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「問題はそこだ」
line = "「問題はそこだ」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「現在、人工戦闘服の製作技術は九浄家によって秘匿されており、外部の者ではそれを知ることが出来ない状態になっている」
line = "「現在、人工戦闘服の製作技術は九浄家によって秘匿されており、外部の者ではそれを知ることが出来ない状態になっている」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「つまり具体的にその戦闘服が『なぜ危険で、どれほど危険なものなのか？』ということについて知る術がない、ということだ」
line = "「つまり具体的にその戦闘服が『なぜ危険で、どれほど危険なものなのか？』ということについて知る術がない、ということだ」"

[[dialogue]]
speaker = "ミウ"
# 「なるほど……」
line = "「なるほど……」"

[[dialogue]]
speaker = "依頼人Ｂ"
# 「キミらだって仕組みの全く分からないものを身に着けて戦うのは、怖いと思わないか？」
line = "「キミらだって仕組みの全く分からないものを身に着けて戦うのは、怖いと思わないか？」"

[[dialogue]]
speaker = "依頼人Ｂ"
# 「我々はそれを明らかにしたいと思っているんだ。現場で戦う星騎士たちのために」
line = "「我々はそれを明らかにしたいと思っているんだ。現場で戦う星騎士たちのために」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あたしたちのこと心配してくれているんですね」
line = "「あたしたちのこと心配してくれているんですね」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「うむ。だがそれだけではない。加えて別な懸念もある。──人工戦闘服の技術を独占することで、九浄家が力を持ちすぎてしまうということだ」
line = "「うむ。だがそれだけではない。加えて別な懸念もある。──人工戦闘服の技術を独占することで、九浄家が力を持ちすぎてしまうということだ」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「現在、流星市国は五名門の間でバランスが取れているが、九浄家の力が伸びすぎることでその平穏が脅かされるという可能性は十分に考えられる」
line = "「現在、流星市国は五名門の間でバランスが取れているが、九浄家の力が伸びすぎることでその平穏が脅かされるという可能性は十分に考えられる」"

[[dialogue]]
speaker = "ミウ"
# 「九浄家の御当主、ヘレナさんは聡明な方です。その辺りは細心の注意を払っているように思いますが」
line = "「九浄家の御当主、ヘレナさんは聡明な方です。その辺りは細心の注意を払っているように思いますが」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「そうかもしれない。が、我々の話しているのは可能性の問題だ」
line = "「そうかもしれない。が、我々の話しているのは可能性の問題だ」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「その懸念を払うためにも、人工戦闘服の技術は明らかにすべきなのだ。しかし正面からかけ合ったとして、九浄家がその情報を開示するとは思えない」
line = "「その懸念を払うためにも、人工戦闘服の技術は明らかにすべきなのだ。しかし正面からかけ合ったとして、九浄家がその情報を開示するとは思えない」"

[[dialogue]]
speaker = "ミウ"
# 「なるほど……お話は分かりました」
line = "「なるほど……お話は分かりました」"

[[dialogue]]
speaker = "ミウ"
# 「依頼の内容としては『九浄家が隠匿している人工戦闘服の情報』と『新たに作られた人工戦闘服』について調査して欲しいということですね？」
line = "「依頼の内容としては『九浄家が隠匿している人工戦闘服の情報』と『新たに作られた人工戦闘服』について調査して欲しいということですね？」"

[[dialogue]]
speaker = "依頼人Ａ"
# 「その通りだ。話が早くて助かるな。どうだろう、お願いできるかね？」
line = "「その通りだ。話が早くて助かるな。どうだろう、お願いできるかね？」"

[[dialogue]]
speaker = "ミウ"
# 「わかりました、お引き受けいたします。では依頼手続きの書類をご用意いたしますね──」
line = "「わかりました、お引き受けいたします。では依頼手続きの書類をご用意いたしますね──」"

[[dialogue]]
speaker = "ヒマワリ"
# 「うーん……」
line = "「うーん……」"

[[dialogue]]
speaker = "ミウ"
# 「どうしたの、ヒマワリちゃん？」
line = "「どうしたの、ヒマワリちゃん？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「依頼、受けちゃったけど良かったのかなぁ？」
line = "「依頼、受けちゃったけど良かったのかなぁ？」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃんはあの２人、怪しいって思う？」
line = "「ヒマワリちゃんはあの２人、怪しいって思う？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ちょっと思う。見た目で判断しちゃいけないとは思うんだけど、あからさまに悪人面だったし……」
line = "「ちょっと思う。見た目で判断しちゃいけないとは思うんだけど、あからさまに悪人面だったし……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「そもそもヘレナさんがそんな危ない人工戦闘服を安易に誰かに与えるとは思わないんだよね」
line = "「そもそもヘレナさんがそんな危ない人工戦闘服を安易に誰かに与えるとは思わないんだよね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ほら、社長の<ruby=エンプレス>女帝</ruby>フォームの時も、丁寧な試験運用がされたでしょ？」
line = "「ほら、社長の<ruby>女帝<rt>エンプレス</rt></ruby>フォームの時も、丁寧な試験運用がされたでしょ？」"

[[dialogue]]
speaker = "unk"
# 秘密結社ゴールデングースの社長のセナリィのまとう特殊な人工戦闘服、女帝フォーム。
line = "秘密結社ゴールデングースの社長のセナリィのまとう特殊な人工戦闘服、女帝フォーム。"

[[dialogue]]
speaker = "unk"
# 膨大な体力と星力の消費と引き換えに、機械化モンスターすら一撃で屠るほどの絶大な力を持っている。
line = "膨大な体力と星力の消費と引き換えに、機械化モンスターすら一撃で屠るほどの絶大な力を持っている。"

[[dialogue]]
speaker = "unk"
# しかし、同時に消耗も非常に大きいというハイリスクハイリターンな戦闘フォームである。
line = "しかし、同時に消耗も非常に大きいというハイリスクハイリターンな戦闘フォームである。"

[[dialogue]]
speaker = "unk"
# ヒマワリとミウがゴールデングースへの入社を希望した時、セナリィが九浄家から受けていた依頼がその女帝フォームの試験運用だった。
line = "ヒマワリとミウがゴールデングースへの入社を希望した時、セナリィが九浄家から受けていた依頼がその女帝フォームの試験運用だった。"

[[dialogue]]
speaker = "ヒマワリ"
# 「ヘレナさんならそのへん、ちゃーんと検証するんじゃないかな？」
line = "「ヘレナさんならそのへん、ちゃーんと検証するんじゃないかな？」"

[[dialogue]]
speaker = "ミウ"
# 「そうだね、私もそう思う」
line = "「そうだね、私もそう思う」"

[[dialogue]]
speaker = "ヒマワリ"
# 「え？　だったらどうしてこの依頼、受けちゃったの？」
line = "「え？　だったらどうしてこの依頼、受けちゃったの？」"

[[dialogue]]
speaker = "ミウ"
# 「人工戦闘服の製作技術の一切が秘匿されてるっていうのは、おじさんたちの言う通りなんだよね」
line = "「人工戦闘服の製作技術の一切が秘匿されてるっていうのは、おじさんたちの言う通りなんだよね」"

[[dialogue]]
speaker = "ミウ"
# 「ヘレナさんは信用できる人だと思うけど、全てを九浄家に委ねてるっていう状態は確かに健全とは言えないと思う」
line = "「ヘレナさんは信用できる人だと思うけど、全てを九浄家に委ねてるっていう状態は確かに健全とは言えないと思う」"

[[dialogue]]
speaker = "ミウ"
# 「それに、どうやって次から次へと強力な人工戦闘服を作り出してるのか、気になるところではあるから……」
line = "「それに、どうやって次から次へと強力な人工戦闘服を作り出してるのか、気になるところではあるから……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「もしかしてミウも人工戦闘服の秘密、知りたくなっちゃってるんじゃない？」
line = "「もしかしてミウも人工戦闘服の秘密、知りたくなっちゃってるんじゃない？」"

[[dialogue]]
speaker = "ミウ"
# 「うん、まあ、ちょっとね」
line = "「うん、まあ、ちょっとね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「よーし、じゃあ頑張って調査しちゃおう！　どういう作戦でいく？」
line = "「よーし、じゃあ頑張って調査しちゃおう！　どういう作戦でいく？」"

[[dialogue]]
speaker = "ミウ"
# 「そうだね。今回は九浄家に潜入捜査ってことになると思うから……」
line = "「そうだね。今回は九浄家に潜入捜査ってことになると思うから……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「えへへ、面白くなってきたー♪」
line = "「えへへ、面白くなってきたー♪」"
