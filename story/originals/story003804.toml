[[dialogue]]
speaker = "ヘレナ（原作）"
# 「ああいう渋いオジサマって憧れるわよね～！」
line = "「ああいう渋いオジサマって憧れるわよね～！」"

[[dialogue]]
speaker = "マトイ"
# 「へ、ヘレナさん、近い！　距離が近いです！」
line = "「へ、ヘレナさん、近い！　距離が近いです！」"

[[dialogue]]
speaker = "ヘレナ（原作）"
# 「え～？　女の子同士なんだから、別にいいじゃな～い<emoji=heart04>」
line = "「え～？　女の子同士なんだから、別にいいじゃな～い<emoji=heart04>」"

[[dialogue]]
speaker = "マトイ"
# （う……ヘレナさん、すごい美人だから、くっ付かれるとなんかドキドキする……！）
line = "（う……ヘレナさん、すごい美人だから、くっ付かれるとなんかドキドキする……！）"

[[dialogue]]
speaker = "ヘレナ"
# 「異世界の私も、どうやら『絡み酒』のようであるな。ふふっ♪」
line = "「異世界の私も、どうやら『絡み酒』のようであるな。ふふっ♪」"

[[dialogue]]
speaker = "ヘレナ"
# 「魔王よ、ちゃんと肉を食べているか？　よければヘレナちゃんが焼いてやるぞ♪」
line = "「魔王よ、ちゃんと肉を食べているか？　よければヘレナちゃんが焼いてやるぞ♪」"

[[dialogue]]
speaker = "unk"
# こ、こっちのヘレナちゃんも近い……！
line = "こ、こっちのヘレナちゃんも近い……！"

[[dialogue]]
speaker = "ナナカ"
# 「もしかして、年下好きってそういうこと……！？」
line = "「もしかして、年下好きってそういうこと……！？」"

[[dialogue]]
speaker = "ロロット"
# 「あっ、このお肉、もう焼けてますね！　いただきなのです～♪」
line = "「あっ、このお肉、もう焼けてますね！　いただきなのです～♪」"

[[dialogue]]
speaker = "魔族"
# 「イ～♪」
line = "「イ～♪」"

[[dialogue]]
speaker = "ロロット"
# 「って、あ～！？　お肉が取られました～！？」
line = "「って、あ～！？　お肉が取られました～！？」"

[[dialogue]]
speaker = "魔族"
# 「もぐもぐ♪」
line = "「もぐもぐ♪」"

[[dialogue]]
speaker = "聖沙"
# 「魔族！？　どうしてここに！？」
line = "「魔族！？　どうしてここに！？」"

[[dialogue]]
speaker = "ナナカ"
# 「！　足元！　なんか周りに黒い影が広がってない！？」
line = "「！　足元！　なんか周りに黒い影が広がってない！？」"

[[dialogue]]
speaker = "魔族たち"
# 「イ～～！」
line = "「イ～～！」"

[[dialogue]]
speaker = "リア"
# 「影から沢山魔族が湧いて来てる……！？」
line = "「影から沢山魔族が湧いて来てる……！？」"

[[dialogue]]
speaker = "マトイ"
# 「すごい数……！　これ、バーベキューのお肉じゃなくて、私たちを狙ってきてませんか……！？」
line = "「すごい数……！　これ、バーベキューのお肉じゃなくて、私たちを狙ってきてませんか……！？」"

[[dialogue]]
speaker = "ルネア"
# 「この魔族たちは、一体……？」
line = "「この魔族たちは、一体……？」"

[[dialogue]]
speaker = "リア"
# 「とりあえずここは――」
line = "「とりあえずここは――」"

[[dialogue]]
speaker = "リア"
# 「みんな、変身だよ！」
line = "「みんな、変身だよ！」"

[[dialogue]]
speaker = "聖沙"
# 「はい！　リア先輩！」
line = "「はい！　リア先輩！」"

[[dialogue]]
speaker = "ナナカ"
# 「新しい力の試し時だね！」
line = "「新しい力の試し時だね！」"

[[dialogue]]
speaker = "ロロット"
# 「行きますよ～！」
line = "「行きますよ～！」"

[[dialogue]]
speaker = "リア"
# 「――主に付き従い、楽園に降臨せよ燦然たる陽光の天使、トロピカルミエル！」
line = "「――主に付き従い、楽園に降臨せよ燦然たる陽光の天使、トロピカルミエル！」"

[[dialogue]]
speaker = "聖沙"
# 「――主と共に在り、天楼の稲光を以って引き穿て夏雷の天使、サマーエクラエル！」
line = "「――主と共に在り、天楼の稲光を以って引き穿て夏雷の天使、サマーエクラエル！」"

[[dialogue]]
speaker = "ナナカ"
# 「――主へ託せ、秘められし乙女の煌姿を解き放つは灼海の天使、シーヴァルカネル！」
line = "「――主へ託せ、秘められし乙女の煌姿を解き放つは灼海の天使、シーヴァルカネル！」"

[[dialogue]]
speaker = "ロロット"
# 「――主が召さるるは、透き通る海風に抱かれし碧涼の天使、リゾートスリセル！」
line = "「――主が召さるるは、透き通る海風に抱かれし碧涼の天使、リゾートスリセル！」"

[[dialogue]]
speaker = "ロロット"
# 「変身完了なのです♪」
line = "「変身完了なのです♪」"

[[dialogue]]
speaker = "ナナカ"
# 「流星クルセイダース、水着フォームで見参、ってね♪」
line = "「流星クルセイダース、水着フォームで見参、ってね♪」"

[[dialogue]]
speaker = "unk"
# ４人共、いつの間に……！？
line = "４人共、いつの間に……！？"

[[dialogue]]
speaker = "リア"
# 「実はルネアちゃんが、リゾート結界を作る時に、いつでも水着に変身できて便利だからって、一緒に水着フォームも作ってくれたんだ」
line = "「実はルネアちゃんが、リゾート結界を作る時に、いつでも水着に変身できて便利だからって、一緒に水着フォームも作ってくれたんだ」"

[[dialogue]]
speaker = "聖沙"
# 「さあ――いざ尋常に、勝負よ！」
line = "「さあ――いざ尋常に、勝負よ！」"

[[dialogue]]
speaker = "unk"
# 水着フォームへ変身した流星クルセイダースの４人と共に、俺たちは魔族との戦闘を開始するのだった。
line = "水着フォームへ変身した流星クルセイダースの４人と共に、俺たちは魔族との戦闘を開始するのだった。"
