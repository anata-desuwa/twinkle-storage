line = "「アニマ先輩によると、ウェディングフォームには、ジューンブライドの季節になると普段より大胆になってしまう副次効果があるらしくて……<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「だから今は、その……あの時みたいに振る舞おうとすると、つい恥ずかしくなってしまって……<emoji=heart04>」
