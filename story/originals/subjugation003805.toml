line = "「野菜もドーン！！　たくさんありますからドンドン食べてくださーい！」"

[[dialogue]]
speaker = "シルヴィ"
# 「やった！　ありがとう、リップルちゃん！　フライドチキンもいいけど、浜辺にはバーベキューだよね！」
