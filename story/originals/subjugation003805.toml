[[dialogue]]
speaker = "unk"
# 散発的にフライドチキンモンスターとの戦闘はあったものの、フライドチキンマシンを発見できないまま日没を迎えてしまった。
line = "散発的にフライドチキンモンスターとの戦闘はあったものの、フライドチキンマシンを発見できないまま日没を迎えてしまった。"

[[dialogue]]
speaker = "リップル"
# 「カイチョー、シルヴィさん、お疲れサマーです！」
line = "「カイチョー、シルヴィさん、お疲れサマーです！」"

[[dialogue]]
speaker = "unk"
# 海の家まで戻ると、リップルたちも合流していた。
line = "海の家まで戻ると、リップルたちも合流していた。"

[[dialogue]]
speaker = "コハルコ"
# 「今日の捜索はここまでにしようか。急いてはことをし損じるっていうしね」
line = "「今日の捜索はここまでにしようか。急いてはことをし損じるっていうしね」"

[[dialogue]]
speaker = "シルヴィ"
# 「あたしはまだまだ動けるけど……うん、そうだね。夜の海で探し物は危ないもんね」
line = "「あたしはまだまだ動けるけど……うん、そうだね。夜の海で探し物は危ないもんね」"

[[dialogue]]
speaker = "unk"
# 俺も先輩たちと同意見だ。いくら手練れの星騎士でも、敵がどこにいるか分からない以上、飛び込むわけにはいかない。
line = "俺も先輩たちと同意見だ。いくら手練れの星騎士でも、敵がどこにいるか分からない以上、飛び込むわけにはいかない。"

[[dialogue]]
speaker = "アニマ"
# 「３人とも、巻き込んでスマナイ。今日は休んでくれたまエ。後は我々、購買部でなんとかするサ」
line = "「３人とも、巻き込んでスマナイ。今日は休んでくれたまエ。後は我々、購買部でなんとかするサ」"

[[dialogue]]
speaker = "トリュファイナ"
# 「うぅ……私のせいでご迷惑をお掛けしてしまい、申し訳ありませんでした」
line = "「うぅ……私のせいでご迷惑をお掛けしてしまい、申し訳ありませんでした」"

[[dialogue]]
speaker = "コハルコ"
# 「謝らないでください。トリュファイナさんのせいじゃないですよ」
line = "「謝らないでください。トリュファイナさんのせいじゃないですよ」"

[[dialogue]]
speaker = "トリュファイナ"
# 「でも、私がチキンをたくさん揚げられていれば、マシンが生まれることもなかったはず……ごめんなさい……」
line = "「でも、私がチキンをたくさん揚げられていれば、マシンが生まれることもなかったはず……ごめんなさい……」"

[[dialogue]]
speaker = "コハルコ"
# 「トリュファイナさん、言ってくれましたよね？　『独りで絶望しないで』『泣いて喚いてでも助けを求めて』って」
line = "「トリュファイナさん、言ってくれましたよね？　『独りで絶望しないで』『泣いて喚いてでも助けを求めて』って」"

[[dialogue]]
speaker = "コハルコ"
# 「私はその言葉に救われました。だから、同じことを言います」
line = "「私はその言葉に救われました。だから、同じことを言います」"

[[dialogue]]
speaker = "コハルコ"
# 「ひとりで抱え込まないで、私たちを頼ってください」
line = "「ひとりで抱え込まないで、私たちを頼ってください」"

[[dialogue]]
speaker = "コハルコ"
# 「私とトリュファイナさんは……姉妹みたいなものなんでしょう？　他人じゃないんだから、もっと気安く頼ってよ、お姉ちゃん」
line = "「私とトリュファイナさんは……姉妹みたいなものなんでしょう？　他人じゃないんだから、もっと気安く頼ってよ、お姉ちゃん」"

[[dialogue]]
speaker = "トリュファイナ"
# 「コハルコさん……ありがとうございます……」
line = "「コハルコさん……ありがとうございます……」"

[[dialogue]]
speaker = "アニマ"
# 「トリュファイナ、そろそろ義体の活動限界ダ。今日はムリをしたから、しっかりメンテしないとナ」
line = "「トリュファイナ、そろそろ義体の活動限界ダ。今日はムリをしたから、しっかりメンテしないとナ」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ありがとうございます、アニマ様。それでは、失礼いたします。コハルコさん、会長様、シルヴィ様」
line = "「ありがとうございます、アニマ様。それでは、失礼いたします。コハルコさん、会長様、シルヴィ様」"

[[dialogue]]
speaker = "シルヴィ"
# 「お疲れさまでした～」
line = "「お疲れさまでした～」"

[[dialogue]]
speaker = "アニマ"
# 「さらばダ、諸君。まタ会おウ」
line = "「さらばダ、諸君。まタ会おウ」"

[[dialogue]]
speaker = "コハルコ"
# 「シルヴィ、トリュファイナさんと知り合いだったの？」
line = "「シルヴィ、トリュファイナさんと知り合いだったの？」"

[[dialogue]]
speaker = "シルヴィ"
# 「うん。あたし、購買は常連だからね。コハルコこそ、フライドチキンのお姉さんと仲良しなんだ。どういう関係？」
line = "「うん。あたし、購買は常連だからね。コハルコこそ、フライドチキンのお姉さんと仲良しなんだ。どういう関係？」"

[[dialogue]]
speaker = "コハルコ"
# 「うーん、親戚のお姉さん、かな？　というか、シルヴィにとってはフライドチキンのお姉さんなんだ、トリュファイナさん……」
line = "「うーん、親戚のお姉さん、かな？　というか、シルヴィにとってはフライドチキンのお姉さんなんだ、トリュファイナさん……」"

[[dialogue]]
speaker = "コハルコ"
# 「よし、決めた。今日はここに泊まっていくよ。何かあったらすぐに対処できるようにしておきたいし」
line = "「よし、決めた。今日はここに泊まっていくよ。何かあったらすぐに対処できるようにしておきたいし」"

[[dialogue]]
speaker = "リップル"
# 「いいんデスか？　ワタシとしては助かりますけど……」
line = "「いいんデスか？　ワタシとしては助かりますけど……」"

[[dialogue]]
speaker = "コハルコ"
# 「うん。明日から週末だしお休みだから大丈夫。トリュファイナさんにカッコつけちゃったし、片足つっこんだまま終わりにはしたくないから」
line = "「うん。明日から週末だしお休みだから大丈夫。トリュファイナさんにカッコつけちゃったし、片足つっこんだまま終わりにはしたくないから」"

[[dialogue]]
speaker = "シルヴィ"
# 「はいはーい！　じゃああたしも泊まる！　海のコテージでお泊まりとか絶対楽しいよ！」
line = "「はいはーい！　じゃああたしも泊まる！　海のコテージでお泊まりとか絶対楽しいよ！」"

[[dialogue]]
speaker = "unk"
# じゃあ俺も
line = "じゃあ俺も"

[[dialogue]]
speaker = "リップル"
# 「ワカりました！　ありがとうございま～す！　お礼にい～っぱいオモテナシしますね♪」
line = "「ワカりました！　ありがとうございま～す！　お礼にい～っぱいオモテナシしますね♪」"

[[dialogue]]
speaker = "unk"
# 晩ごはんはシルヴィ先輩のたっての希望で、浜辺でバーベキューになった。
line = "晩ごはんはシルヴィ先輩のたっての希望で、浜辺でバーベキューになった。"

[[dialogue]]
speaker = "unk"
# 準備の間、それぞれ家や寮に電話だ。
