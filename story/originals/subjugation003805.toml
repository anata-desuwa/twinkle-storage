line = "「正直でよろしい。やっぱり、闇雲に探してもダメだね。リップルさん、リゾート結界の地図って用意できる？」"

[[dialogue]]
speaker = "リップル"
# 「ワカリましたー！　最近いろいろイジってよくわかんなくなってたのでアタラしいの作りまーす！」
