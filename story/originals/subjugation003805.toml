[[dialogue]]
speaker = "unk"
# 山盛りの肉と野菜を平らげた俺たちは、明日に備えてコテージで休むのだった。
line = "山盛りの肉と野菜を平らげた俺たちは、明日に備えてコテージで休むのだった。"
