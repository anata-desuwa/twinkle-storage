[[dialogue]]
speaker = "シルヴィ"
# 「何回かチキンと戦っただけで、マシンの手掛かりもなかったよ。どこをどう探したのかもよく分かんないし、ほぼ遊んでました。以上」
line = "「何回かチキンと戦っただけで、マシンの手掛かりもなかったよ。どこをどう探したのかもよく分かんないし、ほぼ遊んでました。以上」"

[[dialogue]]
speaker = "コハルコ"
