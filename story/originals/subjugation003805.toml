[[dialogue]]
speaker = "コハルコ"
# 「もしもし、お母さん？　今日、友達とお泊りになったから、晩ごはんは要らないよ」
line = "「もしもし、お母さん？　今日、友達とお泊りになったから、晩ごはんは要らないよ」"

[[dialogue]]
speaker = "コハルコ"
# 「あ、ナツコ？　宿題ちゃんとやった？　えらい、さすがお姉ちゃんだね。トウコに替われる？　うん、お願い」
line = "「あ、ナツコ？　宿題ちゃんとやった？　えらい、さすがお姉ちゃんだね。トウコに替われる？　うん、お願い」"

[[dialogue]]
speaker = "コハルコ"
# 「……トウコ、そんなに寂しがらないで大丈夫。明日にはちゃんと帰るから安心して。その間、お母さんとお父さんをお願いね」
line = "「……トウコ、そんなに寂しがらないで大丈夫。明日にはちゃんと帰るから安心して。その間、お母さんとお父さんをお願いね」"

[[dialogue]]
speaker = "シルヴィ"
# 「サーシャ、あたしとリップルちゃんの外泊届出しといて！　マムにはあたしから後で言っとく」
line = "「サーシャ、あたしとリップルちゃんの外泊届出しといて！　マムにはあたしから後で言っとく」"

[[dialogue]]
speaker = "シルヴィ"
