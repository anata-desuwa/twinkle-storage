[[dialogue]]
speaker = "unk"
# 第１話,ヨミとエクスノヴァフォーム,P
line = "第１話,ヨミとエクスノヴァフォーム,P"

[[dialogue]]
speaker = "unk"
# ある日の放課後。
line = "ある日の放課後。"

[[dialogue]]
speaker = "unk"
# 俺はアリーナで、ヨミの訓練に付き合っていた。
line = "俺はアリーナで、ヨミの訓練に付き合っていた。"

[[dialogue]]
speaker = "ヨミ"
# 「――ふぅ……これが天ヶ崎に伝わる『巫女舞』です。いかがでしょうか？」
line = "「――ふぅ……これが天ヶ崎に伝わる『巫女舞』です。いかがでしょうか？」"

[[dialogue]]
speaker = "unk"
# すごい！　綺麗だ！
line = "すごい！　綺麗だ！"

[[dialogue]]
speaker = "ヨミ"
# 「ありがとうございます♪　えへへ、やっと会長に、ちゃんと踊る姿をお見せできました」
line = "「ありがとうございます♪　えへへ、やっと会長に、ちゃんと踊る姿をお見せできました」"

[[dialogue]]
speaker = "ヨミ"
# 「昔からリズム感が壊滅的で、まともに踊ることすらできなかった私ですが……」
line = "「昔からリズム感が壊滅的で、まともに踊ることすらできなかった私ですが……」"

[[dialogue]]
speaker = "ヨミ"
# 「この『エクスノヴァフォーム』のおかげで、巫女の星騎士として新しい１歩を踏み出せそうです♪」
line = "「この『エクスノヴァフォーム』のおかげで、巫女の星騎士として新しい１歩を踏み出せそうです♪」"

[[dialogue]]
speaker = "アニマ"
# 「フヒ♪　素晴らしい舞だったゾ、ヨミ」
line = "「フヒ♪　素晴らしい舞だったゾ、ヨミ」"

[[dialogue]]
speaker = "アニマ"
# 「『リズム感補正機能』が役に立っているようで何よりダ♪」
line = "「『リズム感補正機能』が役に立っているようで何よりダ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「はい！　アニマ先輩のおかげです。本当にありがとうございます♪」
line = "「はい！　アニマ先輩のおかげです。本当にありがとうございます♪」"

[[dialogue]]
speaker = "unk"
# ヨミの『エクスノヴァフォーム』は、ヘレナちゃんがデザインし、アニマ先輩が開発した最新の『人工覚醒戦闘服』だ。
line = "ヨミの『エクスノヴァフォーム』は、ヘレナちゃんがデザインし、アニマ先輩が開発した最新の『人工覚醒戦闘服』だ。"

[[dialogue]]
speaker = "unk"
# エクスノヴァフォームの強みは、さながらヒトが眼鏡を用いるように、着用者の能力を人工的な外付けの機能によって補助できることにある。
line = "エクスノヴァフォームの強みは、さながらヒトが眼鏡を用いるように、着用者の能力を人工的な外付けの機能によって補助できることにある。"

[[dialogue]]
speaker = "unk"
# そうして今回、ヨミ専用に搭載されたのが『リズム感補正機能』というわけだ。
line = "そうして今回、ヨミ専用に搭載されたのが『リズム感補正機能』というわけだ。"

[[dialogue]]
speaker = "アニマ"
# 「フヒヒ♪　心の友のためだからナ♪」
line = "「フヒヒ♪　心の友のためだからナ♪」"

[[dialogue]]
speaker = "unk"
# リズム感の特訓をしたことがあったよね
line = "リズム感の特訓をしたことがあったよね"

[[dialogue]]
speaker = "unk"
# そういえば前に
line = "そういえば前に"

[[dialogue]]
speaker = "アニマ"
# 「ああ。ヨミのリズム感改善の為に作った薬、『リズムワカール』の実験ダナ」
line = "「ああ。ヨミのリズム感改善の為に作った薬、『リズムワカール』の実験ダナ」"

[[dialogue]]
speaker = "アニマ"
# 「実はあれ以降も、ヨミには定期的にリズムワカールを飲んでもらっていたんダ」
line = "「実はあれ以降も、ヨミには定期的にリズムワカールを飲んでもらっていたんダ」"

[[dialogue]]
speaker = "アニマ"
# 「その実験データを積み重ねた結果、今回の補正機能が完成したというわけダ」
line = "「その実験データを積み重ねた結果、今回の補正機能が完成したというわけダ」"

[[dialogue]]
speaker = "アニマ"
# 「ヨミがアニマの実験を信じて付き合い続けてくれたこと、むしろアニマの方が感謝しているヨ」
line = "「ヨミがアニマの実験を信じて付き合い続けてくれたこと、むしろアニマの方が感謝しているヨ」"

[[dialogue]]
speaker = "ヨミ"
# 「いえ……私も、どうしても巫女舞を踊れるようになりたかったので……♪」
line = "「いえ……私も、どうしても巫女舞を踊れるようになりたかったので……♪」"

[[dialogue]]
speaker = "アニマ"
# 「ところでヨミ。『リズム感の真理』については説明できるようになったのカ？」
line = "「ところでヨミ。『リズム感の真理』については説明できるようになったのカ？」"

[[dialogue]]
speaker = "ヨミ"
# 「え？」
line = "「え？」"

[[dialogue]]
speaker = "アニマ"
# 「ほら、宇宙が見えると言っていたアレだヨ」
line = "「ほら、宇宙が見えると言っていたアレだヨ」"

[[dialogue]]
speaker = "ヨミ"
# 「そ、それは……」
line = "「そ、それは……」"

[[dialogue]]
speaker = "ヨミ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "ヨミ"
# 「……爆裂にズキューンと来て」
line = "「……爆裂にズキューンと来て」"

[[dialogue]]
speaker = "ヨミ"
# 「グワァァァッとして――」
line = "「グワァァァッとして――」"

[[dialogue]]
speaker = "ヨミ"
# 「バリバリーンとブワァァァッですっ……！」
line = "「バリバリーンとブワァァァッですっ……！」"

[[dialogue]]
speaker = "unk"
# 全く成長していない……！
line = "全く成長していない……！"

[[dialogue]]
speaker = "アニマ"
# 「フヒ♪　まだまだ解明には時間がかかりそうダナ」
line = "「フヒ♪　まだまだ解明には時間がかかりそうダナ」"

[[dialogue]]
speaker = "ヨミ"
# 「こやぁっ！？　でも本当に、そうとしか表現できないんです……！」
line = "「こやぁっ！？　でも本当に、そうとしか表現できないんです……！」"

[[dialogue]]
speaker = "アニマ"
# 「まあ理論を理解できなくても、本人が感覚的に扱えているなら、現状は十分ダロウ」
line = "「まあ理論を理解できなくても、本人が感覚的に扱えているなら、現状は十分ダロウ」"

[[dialogue]]
speaker = "アニマ"
# 「現にヨミは、こうしてちゃんと舞えているわけだからナ」
line = "「現にヨミは、こうしてちゃんと舞えているわけだからナ」"

[[dialogue]]
speaker = "アニマ"
# 「今後も研究を続ければ、その感覚が体に染み付いて、いずれエクスノヴァフォームに頼らず踊れるようになるかもしれナイ」
line = "「今後も研究を続ければ、その感覚が体に染み付いて、いずれエクスノヴァフォームに頼らず踊れるようになるかもしれナイ」"

[[dialogue]]
speaker = "ヨミ"
# 「はい。――私１人では手が届かなかった場所に、ご当主様やアニマ先輩、それに会長が連れて来てくれました」
line = "「はい。――私１人では手が届かなかった場所に、ご当主様やアニマ先輩、それに会長が連れて来てくれました」"

[[dialogue]]
speaker = "ヨミ"
# 「だから私も、この力でみなさんのお役に立てるように、これからも爆裂頑張ります！」
line = "「だから私も、この力でみなさんのお役に立てるように、これからも爆裂頑張ります！」"

[[dialogue]]
speaker = "アニマ"
# 「フヒ♪　いい心意気ダ♪」
line = "「フヒ♪　いい心意気ダ♪」"

[[dialogue]]
speaker = "アニマ"
# 「ちなみにヨミ。リズム感補正機能の他に、もうひとつヨミ専用の機能を搭載しておいたゾ」
line = "「ちなみにヨミ。リズム感補正機能の他に、もうひとつヨミ専用の機能を搭載しておいたゾ」"

[[dialogue]]
speaker = "ヨミ"
# 「えっ、そうなんですか？」
line = "「えっ、そうなんですか？」"

[[dialogue]]
speaker = "アニマ"
# 「ズバリ――『指向性嗅覚強化機能』ダ♪」
line = "「ズバリ――『指向性嗅覚強化機能』ダ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「指向性……？」
line = "「指向性……？」"

[[dialogue]]
speaker = "アニマ"
# 「戦闘中の状況把握能力向上を目的として、特定の匂いだけを選択し、強く感知できる機能ダ」
line = "「戦闘中の状況把握能力向上を目的として、特定の匂いだけを選択し、強く感知できる機能ダ」"

[[dialogue]]
speaker = "アニマ"
# 「弱点を補うだけではつまらないからナ。ヨミの強みも更に伸ばしてやろうと思ったんダ♪」
line = "「弱点を補うだけではつまらないからナ。ヨミの強みも更に伸ばしてやろうと思ったんダ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「な、なるほど……？　言われてみれば……」
line = "「な、なるほど……？　言われてみれば……」"

[[dialogue]]
speaker = "ヨミ"
# （意識すると、『会長の匂い』がすごく近くに感じられて……）
line = "（意識すると、『会長の匂い』がすごく近くに感じられて……）"

[[dialogue]]
speaker = "ヨミ"
# 「……くんくん<emoji=heart04>」
line = "「……くんくん<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# （！　こ、これは……爆裂すごいです……！）
line = "（！　こ、これは……爆裂すごいです……！）"

[[dialogue]]
speaker = "ヨミ"
# （これなら周りを気にしなくても、会長の匂いを好きなだけ嗅ぐことができます……<emoji=heart04>）
line = "（これなら周りを気にしなくても、会長の匂いを好きなだけ嗅ぐことができます……<emoji=heart04>）"

[[dialogue]]
speaker = "ヨミ"
# 「すううぅ……！　はああぁ～……<emoji=heart04>」
line = "「すううぅ……！　はああぁ～……<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# （ああ、こうしていると……会長に抱き締めてもらっている時みたいに……安心して……幸せで……<emoji=heart04>）
line = "（ああ、こうしていると……会長に抱き締めてもらっている時みたいに……安心して……幸せで……<emoji=heart04>）"

[[dialogue]]
speaker = "ヨミ"
# 「こやぁ～……<emoji=heart04>」
line = "「こやぁ～……<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# だ、大丈夫かヨミ……？
line = "だ、大丈夫かヨミ……？"

[[dialogue]]
speaker = "ヨミ"
# 「はい<emoji=heart04>　大丈夫です……<emoji=heart04>」
line = "「はい<emoji=heart04>　大丈夫です……<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「ただ少し……くんくん<emoji=heart04>」
line = "「ただ少し……くんくん<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「会長の匂いに包まれているだけで……<emoji=heart04>」
line = "「会長の匂いに包まれているだけで……<emoji=heart04>」"

[[dialogue]]
speaker = "ヨミ"
# 「えへへへぇ……<emoji=heart04>」
line = "「えへへへぇ……<emoji=heart04>」"

[[dialogue]]
speaker = "アニマ"
# 「フム。ヨミはどうやら会長の匂いを強く感じ取って、陶酔状態に入っているようダ。嗅覚強化の副作用だナ」
line = "「フム。ヨミはどうやら会長の匂いを強く感じ取って、陶酔状態に入っているようダ。嗅覚強化の副作用だナ」"

[[dialogue]]
speaker = "ヨミ"
# 「副作用じゃありませんよ<emoji=heart04>　元からです<emoji=heart04>」
line = "「副作用じゃありませんよ<emoji=heart04>　元からです<emoji=heart04>」"

[[dialogue]]
speaker = "アニマ"
# 「ホウ」
line = "「ホウ」"

[[dialogue]]
speaker = "ヨミ"
# 「……ハッ！？」
line = "「……ハッ！？」"

[[dialogue]]
speaker = "ヨミ"
# 「い、今のはなしですっ！　忘れてください！」
line = "「い、今のはなしですっ！　忘れてください！」"

[[dialogue]]
speaker = "アニマ"
# 「フヒ♪　それはできない相談ダ。実験記録はしっかり残さないとナ♪」
line = "「フヒ♪　それはできない相談ダ。実験記録はしっかり残さないとナ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「こやぁぁぁっ！？　ち、違うんです！」
line = "「こやぁぁぁっ！？　ち、違うんです！」"

[[dialogue]]
speaker = "アニマ"
# 「会長の匂いは好きじゃないのカ？」
line = "「会長の匂いは好きじゃないのカ？」"

[[dialogue]]
speaker = "ヨミ"
# 「違わないですけど……違うんですっ！」
line = "「違わないですけど……違うんですっ！」"

[[dialogue]]
speaker = "アニマ"
# 「フヒヒッ♪　アハハハッ♪」
line = "「フヒヒッ♪　アハハハッ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「笑わないでくださいっ！　会長もです！」
line = "「笑わないでくださいっ！　会長もです！」"

[[dialogue]]
speaker = "unk"
# いや、ごめん。可愛くてつい……♪
line = "いや、ごめん。可愛くてつい……♪"

[[dialogue]]
speaker = "ヨミ"
# 「～～～～っ！？」
line = "「～～～～っ！？」"

[[dialogue]]
speaker = "ヨミ"
# 「うぅぅ～……穴があったら入りたいです……！」
line = "「うぅぅ～……穴があったら入りたいです……！」"

[[dialogue]]
speaker = "アニマ"
# 「つまり結論としては――」
line = "「つまり結論としては――」"

[[dialogue]]
speaker = "アニマ"
# 「リズム感補正機能に加え、指向性嗅覚強化機能も問題なく成功ということダナ♪」
line = "「リズム感補正機能に加え、指向性嗅覚強化機能も問題なく成功ということダナ♪」"

[[dialogue]]
speaker = "ヨミ"
# 「成功しなくていい部分まで成功してます～っ！」
line = "「成功しなくていい部分まで成功してます～っ！」"

[[dialogue]]
speaker = "アニマ"
# 「では次は、モフモフ強化機能も試してみるカ？」
line = "「では次は、モフモフ強化機能も試してみるカ？」"

[[dialogue]]
speaker = "ヨミ"
# 「モフモフ強化って何ですか！？　絶対に嫌ですっ！」
line = "「モフモフ強化って何ですか！？　絶対に嫌ですっ！」"

[[dialogue]]
speaker = "アニマ"
# 「フヒヒ♪」
line = "「フヒヒ♪」"

[[dialogue]]
speaker = "unk"
# アニマ先輩、その機能について詳しく！！
line = "アニマ先輩、その機能について詳しく！！"

[[dialogue]]
speaker = "ヨミ"
# 「会長まで興味を持たないでください～っ！？」
line = "「会長まで興味を持たないでください～っ！？」"

[[dialogue]]
speaker = "unk"
# こうして今日も、アニマ先輩の発明に振り回されながらも――
line = "こうして今日も、アニマ先輩の発明に振り回されながらも――"

[[dialogue]]
speaker = "unk"
# ヨミは少しずつ、星騎士として前に進んでいくのだった。
line = "ヨミは少しずつ、星騎士として前に進んでいくのだった。"
