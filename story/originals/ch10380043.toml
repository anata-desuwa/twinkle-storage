[[dialogue]]
speaker = "unk"
# 第３話,ラブコメ漫画談義,P
line = "第３話,ラブコメ漫画談義,P"

[[dialogue]]
speaker = "unk"
# カフェテリアに、イクシーと俺、リィベルが揃った。このメンバーで何をするのかというと──
line = "カフェテリアに、イクシーと俺、リィベルが揃った。このメンバーで何をするのかというと──"

[[dialogue]]
speaker = "イクシリオン"
# 「はい、どうぞ。私のおすすめです」
line = "「はい、どうぞ。私のおすすめです」"

[[dialogue]]
speaker = "リィベル"
# 「ありがとう。私はこれよ」
line = "「ありがとう。私はこれよ」"

[[dialogue]]
speaker = "unk"
# じゃあ、俺からはこれ
line = "じゃあ、俺からはこれ"

[[dialogue]]
speaker = "unk"
# 俺たちは定期的におすすめの漫画を貸し合うようになっていた。
line = "俺たちは定期的におすすめの漫画を貸し合うようになっていた。"

[[dialogue]]
speaker = "unk"
# もともと俺は漫画を読むのが趣味だし、イクシーも偏りはあるけど漫画は好きだ。
line = "もともと俺は漫画を読むのが趣味だし、イクシーも偏りはあるけど漫画は好きだ。"

[[dialogue]]
speaker = "unk"
# リィベルが漫画に興味を持ったところに俺たちが漫画を貸したのがきっかけで、この流れができたのだった。
line = "リィベルが漫画に興味を持ったところに俺たちが漫画を貸したのがきっかけで、この流れができたのだった。"

[[dialogue]]
speaker = "リィベル"
# 「貸してもらっておいてなんだけど、イクシリオンの好みの偏りがすごいわね」
line = "「貸してもらっておいてなんだけど、イクシリオンの好みの偏りがすごいわね」"

[[dialogue]]
speaker = "リィベル"
# 「この前は主人公がエッチなトラブルに巻き込まれるラブコメで、その前のは主人公がエッチなトラブルに巻き込まれるラブコメだったわよね」
line = "「この前は主人公がエッチなトラブルに巻き込まれるラブコメで、その前のは主人公がエッチなトラブルに巻き込まれるラブコメだったわよね」"

[[dialogue]]
speaker = "リィベル"
# 「そして今回は……やっぱり主人公がエッチなトラブルに巻き込まれるラブコメなのね」
line = "「そして今回は……やっぱり主人公がエッチなトラブルに巻き込まれるラブコメなのね」"

[[dialogue]]
speaker = "イクシリオン"
# 「うぅ、偏っててすみません……。ですが、おすすめなのは本当です。みんな面白いんですよ！」
line = "「うぅ、偏っててすみません……。ですが、おすすめなのは本当です。みんな面白いんですよ！」"

[[dialogue]]
speaker = "リィベル"
# 「別に責めてないわ。あなたのおすすめ、ちゃんと面白いし」
line = "「別に責めてないわ。あなたのおすすめ、ちゃんと面白いし」"

[[dialogue]]
speaker = "イクシリオン"
# 「リィベルさんのおすすめは……不器用な２人の恋模様を描いた作品ですね。確か最近、アニメ化もしていましたよね？」
line = "「リィベルさんのおすすめは……不器用な２人の恋模様を描いた作品ですね。確か最近、アニメ化もしていましたよね？」"

[[dialogue]]
speaker = "リィベル"
# 「ええ。私もアニメから入って原作にドハマりしたわ。有名な作品だから、もう読んでるかもしれないけど……」
line = "「ええ。私もアニメから入って原作にドハマりしたわ。有名な作品だから、もう読んでるかもしれないけど……」"

[[dialogue]]
speaker = "イクシリオン"
# 「いえ、気になってはいたんですけど、まだ読めてなかったので、ちょうどよかったです。ありがとうございます」
line = "「いえ、気になってはいたんですけど、まだ読めてなかったので、ちょうどよかったです。ありがとうございます」"

[[dialogue]]
speaker = "リィベル"
# 「ふっ。ならよかったわ」
line = "「ふっ。ならよかったわ」"

[[dialogue]]
speaker = "イクシリオン"
# 「ではまたお会いしましょう。感想、聞かせてくださいね」
line = "「ではまたお会いしましょう。感想、聞かせてくださいね」"

[[dialogue]]
speaker = "unk"
# 数日後。俺たちは再びカフェテリアに集った。
line = "数日後。俺たちは再びカフェテリアに集った。"

[[dialogue]]
speaker = "イクシリオン"
# 「リィベルさんのおすすめ、本当によかったです。お互いを想い合う２人の気持ちに胸がきゅんとしてしまいました。アニメもチェックしてみようと思います」
line = "「リィベルさんのおすすめ、本当によかったです。お互いを想い合う２人の気持ちに胸がきゅんとしてしまいました。アニメもチェックしてみようと思います」"

[[dialogue]]
speaker = "リィベル"
# 「でしょう。キャストも合ってるからぜひ観てみて」
line = "「でしょう。キャストも合ってるからぜひ観てみて」"

[[dialogue]]
speaker = "リィベル"
# 「あなたのおすすめも面白かったわ。エッチなトラブルは多かったけど……いや、本当にエッチなトラブルばっかりなんだけど……それでも、だからこそ面白いのかしら」
line = "「あなたのおすすめも面白かったわ。エッチなトラブルは多かったけど……いや、本当にエッチなトラブルばっかりなんだけど……それでも、だからこそ面白いのかしら」"

[[dialogue]]
speaker = "イクシリオン"
# 「ええ、そうなんです！　主人公の男の子は特別な力を持っていて、それを目的に多くのヒロインが彼を誘惑するのですが、主人公は振り向きもしません」
line = "「ええ、そうなんです！　主人公の男の子は特別な力を持っていて、それを目的に多くのヒロインが彼を誘惑するのですが、主人公は振り向きもしません」"

[[dialogue]]
speaker = "イクシリオン"
# 「彼は自分の力で大切な人を失っていて、力の怖さを知っているから、力を目的にした関係の虚しさを誰よりも理解しているんです」
line = "「彼は自分の力で大切な人を失っていて、力の怖さを知っているから、力を目的にした関係の虚しさを誰よりも理解しているんです」"

[[dialogue]]
speaker = "リィベル"
# 「自分を誘惑してくるヒロインたちにも幸せになって欲しくて、打算による誘惑を振り払うのよね。本心では動じてるのに。硬派とはこのことね」
line = "「自分を誘惑してくるヒロインたちにも幸せになって欲しくて、打算による誘惑を振り払うのよね。本心では動じてるのに。硬派とはこのことね」"

[[dialogue]]
speaker = "イクシリオン"
# 「そうですそうです！　その優しさがいつしかヒロインに伝わって、彼女たちも気付かないうちに主人公に惹かれてしまうんです……でも主人公はそれに気付かないんですよねぇ」
line = "「そうですそうです！　その優しさがいつしかヒロインに伝わって、彼女たちも気付かないうちに主人公に惹かれてしまうんです……でも主人公はそれに気付かないんですよねぇ」"

[[dialogue]]
speaker = "リィベル"
# 「そういう意味では８巻は秀逸だったわね」
line = "「そういう意味では８巻は秀逸だったわね」"

[[dialogue]]
speaker = "イクシリオン"
# 「あ、あのシーンですね？　初登場時は主人公に裸を見られても動じなかったヒロインが、好意を自覚してからは、裸を見られるのが恥ずかしくってつい隠してしまうんですよね」
line = "「あ、あのシーンですね？　初登場時は主人公に裸を見られても動じなかったヒロインが、好意を自覚してからは、裸を見られるのが恥ずかしくってつい隠してしまうんですよね」"

[[dialogue]]
speaker = "イクシリオン"
# 「今まで恥じらいの表情を見せなかったヒロインが、ついに見せる羞恥……とっってもエッチでした～<emoji=heart04>　思い出しただけでよだれが止まりません！」
line = "「今まで恥じらいの表情を見せなかったヒロインが、ついに見せる羞恥……とっってもエッチでした～<emoji=heart04>　思い出しただけでよだれが止まりません！」"

[[dialogue]]
speaker = "リィベル"
# 「まぁ、かなりセンシティブなシーンだったわね。でも、今までと違うリアクションで関係性の変化を見せるのは感心したわ」
line = "「まぁ、かなりセンシティブなシーンだったわね。でも、今までと違うリアクションで関係性の変化を見せるのは感心したわ」"

[[dialogue]]
speaker = "イクシリオン"
# 「肝心の主人公には好意が伝わらないのが残念です……」
line = "「肝心の主人公には好意が伝わらないのが残念です……」"

[[dialogue]]
speaker = "リィベル"
# 「まぁね。ラブコメの主人公は鈍感じゃないと身がもたないから仕方ないわ」
line = "「まぁね。ラブコメの主人公は鈍感じゃないと身がもたないから仕方ないわ」"

[[dialogue]]
speaker = "イクシリオン"
# 「この主人公、自分は幸せになっちゃいけないと思っているのが不憫で……なんとか幸せになって欲しいです」
line = "「この主人公、自分は幸せになっちゃいけないと思っているのが不憫で……なんとか幸せになって欲しいです」"

[[dialogue]]
speaker = "リィベル"
# 「明るい作風とは裏腹に、けっこう闇が深いのよね。作者の癖なんでしょうね」
line = "「明るい作風とは裏腹に、けっこう闇が深いのよね。作者の癖なんでしょうね」"

[[dialogue]]
speaker = "unk"
# この作者の前作は登場人物をいじめ抜く作風で評判だったから、それが今作にも活きているようだ。
line = "この作者の前作は登場人物をいじめ抜く作風で評判だったから、それが今作にも活きているようだ。"

[[dialogue]]
speaker = "イクシリオン"
# 「エッチなシーン盛りだくさんなんですけど、それだけじゃなくて、いつの間にかヒロインや主人公の幸せを願っているんですよね。本当に素敵な漫画です」
line = "「エッチなシーン盛りだくさんなんですけど、それだけじゃなくて、いつの間にかヒロインや主人公の幸せを願っているんですよね。本当に素敵な漫画です」"

[[dialogue]]
speaker = "unk"
# イクシーが漫画を気に入ってくれて嬉しくなる。漫画好きとして鼻が高い。
line = "イクシーが漫画を気に入ってくれて嬉しくなる。漫画好きとして鼻が高い。"

[[dialogue]]
speaker = "リィベル"
# 「なんで魔王がにやけてるのよ」
line = "「なんで魔王がにやけてるのよ」"

[[dialogue]]
speaker = "unk"
# この漫画をイクシーに勧めたの俺だから
line = "この漫画をイクシーに勧めたの俺だから"

[[dialogue]]
speaker = "リィベル"
# 「そうなの。面白いのは認めるけど、よく彼女にこんなスケベ漫画を勧めたわね。さすが魔王、と言っておくわ」
line = "「そうなの。面白いのは認めるけど、よく彼女にこんなスケベ漫画を勧めたわね。さすが魔王、と言っておくわ」"

[[dialogue]]
speaker = "？？？"
# 「興味深いお話をされていますね。私も混ぜていただけますか？」
line = "「興味深いお話をされていますね。私も混ぜていただけますか？」"

[[dialogue]]
speaker = "イクシリオン"
# 「あなたは──」
line = "「あなたは──」"

[[dialogue]]
speaker = "ウルスラ"
# 「私は流星学園３年生のウルスラ・バレンタインと申します。購買部をお手伝いしていますから、お会いしたこともあるかもしれませんが」
line = "「私は流星学園３年生のウルスラ・バレンタインと申します。購買部をお手伝いしていますから、お会いしたこともあるかもしれませんが」"

[[dialogue]]
speaker = "ウルスラ"
# 「盗み聞きするつもりはなかったのですが、つい耳に入ってしまって……そのラブコメ漫画、私にもご教授お願いできませんか？」
line = "「盗み聞きするつもりはなかったのですが、つい耳に入ってしまって……そのラブコメ漫画、私にもご教授お願いできませんか？」"

[[dialogue]]
speaker = "イクシリオン"
# 「もちろんです！　まずは一巻をどうぞ！」
line = "「もちろんです！　まずは一巻をどうぞ！」"

[[dialogue]]
speaker = "ウルスラ"
# 「では、失礼して……むむ、なんてハレンチな…………え、この主人公、お乳にもお尻にも興味を示さないなんて！？」
line = "「では、失礼して……むむ、なんてハレンチな…………え、この主人公、お乳にもお尻にも興味を示さないなんて！？」"

[[dialogue]]
speaker = "イクシリオン"
# 「最初はそうお思いでしょう。ささ、読み進めてください」
line = "「最初はそうお思いでしょう。ささ、読み進めてください」"

[[dialogue]]
speaker = "ウルスラ"
# 「はぁ……？　え、あとの回想で主人公も動揺してるの分かるじゃないですか！？　でも鋼の理性で何でもないふりを……ハードボイルドですね」
line = "「はぁ……？　え、あとの回想で主人公も動揺してるの分かるじゃないですか！？　でも鋼の理性で何でもないふりを……ハードボイルドですね」"

[[dialogue]]
speaker = "ウルスラ"
# 「この主人公の方、深い傷を抱えていらっしゃるんですね……でも、だからこそ、ヒロインたちに慈愛を以て接しておられる……」
line = "「この主人公の方、深い傷を抱えていらっしゃるんですね……でも、だからこそ、ヒロインたちに慈愛を以て接しておられる……」"

[[dialogue]]
speaker = "ウルスラ"
# 「それじゃダメなんですよ、慈愛では！　慈愛と愛は別物です！　うぅ、もどかしい……今すぐこの中に入って仲を進展させたいぃ……」
line = "「それじゃダメなんですよ、慈愛では！　慈愛と愛は別物です！　うぅ、もどかしい……今すぐこの中に入って仲を進展させたいぃ……」"

[[dialogue]]
speaker = "イクシリオン"
# 「その気持ち、痛いほど分かります」
line = "「その気持ち、痛いほど分かります」"

[[dialogue]]
speaker = "リィベル"
# 「激しく同意するわ」
line = "「激しく同意するわ」"

[[dialogue]]
speaker = "ウルスラ"
# 「それにしても不思議な作品ですね。最初はハレンチさに驚きましたけど、いつの間にか気にならなく……いえ、ないと物足りなくなってしまいます」
line = "「それにしても不思議な作品ですね。最初はハレンチさに驚きましたけど、いつの間にか気にならなく……いえ、ないと物足りなくなってしまいます」"

[[dialogue]]
speaker = "イクシリオン"
# 「ええ、ストーリーももちろんですが、画も素晴らしいんです！　私が一番好きなのは５巻の、ヒロインたちがあられもない姿で集結するシーンで……」
line = "「ええ、ストーリーももちろんですが、画も素晴らしいんです！　私が一番好きなのは５巻の、ヒロインたちがあられもない姿で集結するシーンで……」"

[[dialogue]]
speaker = "？？？"
# 「ねぇ、ちょっと」
line = "「ねぇ、ちょっと」"

[[dialogue]]
speaker = "イクシリオン"
# 「え？　ミ、ミアさん！？　どうしてここに！？」
line = "「え？　ミ、ミアさん！？　どうしてここに！？」"

[[dialogue]]
speaker = "ミア"
# 「どうしても何も、カフェテリアで猥談してる学生がいるって風紀委員に通報があったんだけど……まさかイクシーさんたちだったなんて思わなかったわ」
line = "「どうしても何も、カフェテリアで猥談してる学生がいるって風紀委員に通報があったんだけど……まさかイクシーさんたちだったなんて思わなかったわ」"

[[dialogue]]
speaker = "イクシリオン"
# 「いえ、私たちは漫画について語り合っていただけで、エッチな話をしていたわけでは……」
line = "「いえ、私たちは漫画について語り合っていただけで、エッチな話をしていたわけでは……」"

[[dialogue]]
speaker = "ミア"
# 「どうせエッチな漫画なんでしょっ！　分かってるわよ！　全員、これから生徒指導室で反省文よ！」
line = "「どうせエッチな漫画なんでしょっ！　分かってるわよ！　全員、これから生徒指導室で反省文よ！」"

[[dialogue]]
speaker = "unk"
# 語り合いに熱くなりすぎ、俺たちはそろって連行されてしまった。
line = "語り合いに熱くなりすぎ、俺たちはそろって連行されてしまった。"

[[dialogue]]
speaker = "ウルスラ"
# 「これもまた、愛の代償ですね」
line = "「これもまた、愛の代償ですね」"

[[dialogue]]
speaker = "リィベル"
# 「なんで私まで……」
line = "「なんで私まで……」"

[[dialogue]]
speaker = "イクシリオン"
# 「本当にごめんなさ～い！」
line = "「本当にごめんなさ～い！」"
