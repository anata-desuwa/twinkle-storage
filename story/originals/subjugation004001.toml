[[dialogue]]
speaker = "unk"
# 流星市国がハロウィンの色に染まる少し前の出来事。
line = "流星市国がハロウィンの色に染まる少し前の出来事。"

[[dialogue]]
speaker = "ベアトリス"
# 「みんな、久しぶり～っ♪」
line = "「みんな、久しぶり～っ♪」"

[[dialogue]]
speaker = "アポロ"
# 「おっ、ベアト～！　元気だったか！？」
line = "「おっ、ベアト～！　元気だったか！？」"

[[dialogue]]
speaker = "ベアトリス"
# 「うん、すっごく元気！　みんなはどう？」
line = "「うん、すっごく元気！　みんなはどう？」"

[[dialogue]]
speaker = "ナターシャ"
# 「私たちは特に変わらずって感じ。まぁ元気と言えば元気かな。ベアトはルヴィネについてきたの？」
line = "「私たちは特に変わらずって感じ。まぁ元気と言えば元気かな。ベアトはルヴィネについてきたの？」"

[[dialogue]]
speaker = "ベアトリス"
# 「そうだよ～♪」
line = "「そうだよ～♪」"

[[dialogue]]
speaker = "unk"
# ベアトリスは、アルタイルとの交流のためにやってきたルヴィネに同行してきた。
line = "ベアトリスは、アルタイルとの交流のためにやってきたルヴィネに同行してきた。"

[[dialogue]]
speaker = "unk"
# 平行世界の同一人物は同じ世界に存在できないため、アルタイルのベアトリスは今デネブに滞在している。
line = "平行世界の同一人物は同じ世界に存在できないため、アルタイルのベアトリスは今デネブに滞在している。"

[[dialogue]]
speaker = "梨緒"
# 「しばらくぶりだな。……お帰り、ベアト」
line = "「しばらくぶりだな。……お帰り、ベアト」"

[[dialogue]]
speaker = "ベアトリス"
# 「……ただいま、梨緒ちゃん」
line = "「……ただいま、梨緒ちゃん」"

[[dialogue]]
speaker = "ベアトリス"
# 「えへへ、お帰りって言ってもらえるの嬉しいな～」
line = "「えへへ、お帰りって言ってもらえるの嬉しいな～」"

[[dialogue]]
speaker = "梨緒"
# 「言っただろう、ここは君の第二の故郷だと。時間の許す限り羽を伸ばすといい」
line = "「言っただろう、ここは君の第二の故郷だと。時間の許す限り羽を伸ばすといい」"

[[dialogue]]
speaker = "ベアトリス"
# 「うん、ありがとう！」
line = "「うん、ありがとう！」"

[[dialogue]]
speaker = "ベアトリス"
# 「ところでさ、アルタイルもそろそろハロウィンの時期だよねっ？」
line = "「ところでさ、アルタイルもそろそろハロウィンの時期だよねっ？」"

[[dialogue]]
speaker = "ベアトリス"
# 「せっかくだし、選挙管理委員会のみんなで一緒にハロウィンパーティーできないかな？」
line = "「せっかくだし、選挙管理委員会のみんなで一緒にハロウィンパーティーできないかな？」"

[[dialogue]]
speaker = "アポロ"
# 「みんなでハロウィンパーティー！？　いいな、最高じゃないか！　天才だな！」
line = "「みんなでハロウィンパーティー！？　いいな、最高じゃないか！　天才だな！」"

[[dialogue]]
speaker = "ナターシャ"
# 「お、アポロ食いつきいいね」
line = "「お、アポロ食いつきいいね」"

[[dialogue]]
speaker = "アポロ"
# 「なんたって、ハロウィンならお菓子をどんなに食べ過ぎても怒られないからな！」
line = "「なんたって、ハロウィンならお菓子をどんなに食べ過ぎても怒られないからな！」"

[[dialogue]]
speaker = "梨緒"
# 「あまり度を越すようなら、流石に止めるぞ。だがパーティーを開く件については歓迎だ」
line = "「あまり度を越すようなら、流石に止めるぞ。だがパーティーを開く件については歓迎だ」"

[[dialogue]]
speaker = "ベアトリス"
# 「やった♪　楽しいパーティーにしようねっ！」
line = "「やった♪　楽しいパーティーにしようねっ！」"

[[dialogue]]
speaker = "ジグ"
# 「ふむ。確かにそれはいい考えだね」
line = "「ふむ。確かにそれはいい考えだね」"

[[dialogue]]
speaker = "ベアトリス"
# 「あ、ジグさん。お久しぶりです」
line = "「あ、ジグさん。お久しぶりです」"

[[dialogue]]
speaker = "ジグ"
# 「うん、久しぶり。息災なようで何よりだ」
line = "「うん、久しぶり。息災なようで何よりだ」"

[[dialogue]]
speaker = "ジグ"
# 「で、大々的にパーティーをするのはいいんだけど、そうなると事前準備が大変そうだね？　そこはどうするんだい？」
line = "「で、大々的にパーティーをするのはいいんだけど、そうなると事前準備が大変そうだね？　そこはどうするんだい？」"

[[dialogue]]
speaker = "ベアトリス"
# 「それは言い出しっぺの私が責任もって請け負います！」
line = "「それは言い出しっぺの私が責任もって請け負います！」"

[[dialogue]]
speaker = "梨緒"
# 「それは助かるが……さすがにベアト１人では心許ない気がするな」
line = "「それは助かるが……さすがにベアト１人では心許ない気がするな」"

[[dialogue]]
speaker = "ベアトリス"
# 「それなら……ナターシャちゃん、一緒にやろっ」
line = "「それなら……ナターシャちゃん、一緒にやろっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「え、私？」
line = "「え、私？」"

[[dialogue]]
speaker = "ナターシャ"
# 「まぁいいけど、適任かどうかはわからないよ？　暗殺者流のハロウィンになるかも」
line = "「まぁいいけど、適任かどうかはわからないよ？　暗殺者流のハロウィンになるかも」"

[[dialogue]]
speaker = "ベアトリス"
# 「あはは、それもハロウィンっぽいかも！」
line = "「あはは、それもハロウィンっぽいかも！」"

[[dialogue]]
speaker = "ジグ"
# 「それじゃ２人にお任せしようかな。うん、異議なし」
line = "「それじゃ２人にお任せしようかな。うん、異議なし」"

[[dialogue]]
speaker = "梨緒"
# 「待て、ジグ。面倒だからって、手っ取り早くベアトたちに押し付けたわけじゃないだろうな？」
line = "「待て、ジグ。面倒だからって、手っ取り早くベアトたちに押し付けたわけじゃないだろうな？」"

[[dialogue]]
speaker = "ジグ"
# 「ははは、そんなはずないだろう」
line = "「ははは、そんなはずないだろう」"

[[dialogue]]
speaker = "梨緒"
# 「笑って誤魔化そうとしてるな！？」
line = "「笑って誤魔化そうとしてるな！？」"

[[dialogue]]
speaker = "梨緒"
# 「まぁ確かに、２人が引き受けてくれるならありがたいのは間違いないが……」
line = "「まぁ確かに、２人が引き受けてくれるならありがたいのは間違いないが……」"

[[dialogue]]
speaker = "アポロ"
# 「あたしは問題なーし！　じゃ、ベアトとナターシャがハロウィンパーティー盛り上げ部隊だな！」
line = "「あたしは問題なーし！　じゃ、ベアトとナターシャがハロウィンパーティー盛り上げ部隊だな！」"

[[dialogue]]
speaker = "ナターシャ"
# 「まぁ、ほどほどに楽しみにしててよ」
line = "「まぁ、ほどほどに楽しみにしててよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ハロウィン盛り上げ部隊がんばりま～すっ！」
line = "「ハロウィン盛り上げ部隊がんばりま～すっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「パーティーっていっても何すればいいのかよくわからないし、準備はベアト主導でお願いするよ。私はあくまでサポートってことで」
line = "「パーティーっていっても何すればいいのかよくわからないし、準備はベアト主導でお願いするよ。私はあくまでサポートってことで」"

[[dialogue]]
speaker = "ベアトリス"
# 「任せてっ！　今までに見たことも聞いたこともないような最高のハロウィンパーティーにしようねっ！」
line = "「任せてっ！　今までに見たことも聞いたこともないような最高のハロウィンパーティーにしようねっ！」"

[[dialogue]]
speaker = "ナターシャ"
# 「あんまり張り切り過ぎても、空回りするよ？　そこんとこ、ベアトなら心当たりあるでしょ」
line = "「あんまり張り切り過ぎても、空回りするよ？　そこんとこ、ベアトなら心当たりあるでしょ」"

[[dialogue]]
speaker = "ベアトリス"
# 「う……確かに……。さすがナターシャちゃん、私のことわかってる……」
line = "「う……確かに……。さすがナターシャちゃん、私のことわかってる……」"

[[dialogue]]
speaker = "ナターシャ"
# 「とりあえずどこから手を付けよっか？　ハロウィンパーティーなら……お菓子とか、飾り付けとか？」
line = "「とりあえずどこから手を付けよっか？　ハロウィンパーティーなら……お菓子とか、飾り付けとか？」"

[[dialogue]]
speaker = "ベアトリス"
# 「それも大事だけど、ハロウィンパーティーといえば、何よりも忘れちゃいけないのは仮装だよねっ」
line = "「それも大事だけど、ハロウィンパーティーといえば、何よりも忘れちゃいけないのは仮装だよねっ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ああ、そうだね。仮装がないと始まらないや。そうと決まれば──」
line = "「ああ、そうだね。仮装がないと始まらないや。そうと決まれば──」"

[[dialogue]]
speaker = "ベアトリス"
# 「うん、行こう！」
line = "「うん、行こう！」"

[[dialogue]]
speaker = "unk"
# ベアトリスとナターシャは、新星学園内で『ある人物』を探した。
line = "ベアトリスとナターシャは、新星学園内で『ある人物』を探した。"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「ゆっゆっゆ～、ゆゆゆのゆ～♪」
line = "「ゆっゆっゆ～、ゆゆゆのゆ～♪」"

[[dialogue]]
speaker = "ナターシャ"
# 「いたいた。やっぱり目立つね」
line = "「いたいた。やっぱり目立つね」"

[[dialogue]]
speaker = "ベアトリス"
# 「ハロウィンの申し子、ジャクリーヌさーん！」
line = "「ハロウィンの申し子、ジャクリーヌさーん！」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「んゆ？　余を称える声が聞こえたゆ？　なんか用なの？」
line = "「んゆ？　余を称える声が聞こえたゆ？　なんか用なの？」"

[[dialogue]]
speaker = "ベアトリス"
# 「はいっ、かいつまんで説明すると、これこれこういうことでして──」
line = "「はいっ、かいつまんで説明すると、これこれこういうことでして──」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「ふむふむ、ハロウィンで盛り上がるのは余が最も望むところなの。ハロウィンの極意を教えてあげるのも、やぶさかではないゆ」
line = "「ふむふむ、ハロウィンで盛り上がるのは余が最も望むところなの。ハロウィンの極意を教えてあげるのも、やぶさかではないゆ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ありがとうございます、とっても助かります！」
line = "「ありがとうございます、とっても助かります！」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「ただし！　ハロウィンはタダというわけにはいかない催しなの！」
line = "「ただし！　ハロウィンはタダというわけにはいかない催しなの！」"

[[dialogue]]
speaker = "ナターシャ"
# 「え、お金取るの？」
line = "「え、お金取るの？」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「お金ではないゆ！　ギブ・アンド・テイク・アンド・トリック・オア・トリート！　教えてほしくば、お菓子をよこすゆ！」
line = "「お金ではないゆ！　ギブ・アンド・テイク・アンド・トリック・オア・トリート！　教えてほしくば、お菓子をよこすゆ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「渡さないと、どうなるんですか？」
line = "「渡さないと、どうなるんですか？」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「もちろんイタズラしちゃうの。それがハロウィンの厳しくも楽しい掟ゆ」
line = "「もちろんイタズラしちゃうの。それがハロウィンの厳しくも楽しい掟ゆ」"

[[dialogue]]
speaker = "ベアトリス"
# 「イタズラは困っちゃいますね……。それなら……ジャジャーン！」
line = "「イタズラは困っちゃいますね……。それなら……ジャジャーン！」"

[[dialogue]]
speaker = "ナターシャ"
# 「なに？　その虹色の立方体は」
line = "「なに？　その虹色の立方体は」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「んゆゆゆっ！？　このゲーミングブロックはなんだゆ？　これがお菓子ゆ！？」
line = "「んゆゆゆっ！？　このゲーミングブロックはなんだゆ？　これがお菓子ゆ！？」"

[[dialogue]]
speaker = "ベアトリス"
# 「デネブでも販売が開始したばかりの、最新のお菓子なんです。もちろんアルタイルには存在しないものですよ」
line = "「デネブでも販売が開始したばかりの、最新のお菓子なんです。もちろんアルタイルには存在しないものですよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ハロウィンの時期だからちょうどいいと思って、お土産に持ってきたんです」
line = "「ハロウィンの時期だからちょうどいいと思って、お土産に持ってきたんです」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「ゆっゆ～っ！　こんなの、見たことも聞いたことも食べたこともないゆ！　こんなミラクルＳＳＲなお菓子があるなら、最初っから言えなの！」
line = "「ゆっゆ～っ！　こんなの、見たことも聞いたことも食べたこともないゆ！　こんなミラクルＳＳＲなお菓子があるなら、最初っから言えなの！」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「さっそくいただくゆ！　あ～ん♪」
line = "「さっそくいただくゆ！　あ～ん♪」"

[[dialogue]]
speaker = "ジャクリーヌ"
# 「ゆゆゆ～～っ！！　大・満・足ゆーーーーっっ！！！」
line = "「ゆゆゆ～～っ！！　大・満・足ゆーーーーっっ！！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「うわ、眩し！？」
line = "「うわ、眩し！？」"

[[dialogue]]
speaker = "ベアトリス"
# 「うぅ、目が開けられない……何が起きてるの？」
line = "「うぅ、目が開けられない……何が起きてるの？」"

[[dialogue]]
speaker = "ナターシャ"
# 「ふぅ、さっきのでまだ目がシパシパする……ベアトは無事……？」
line = "「ふぅ、さっきのでまだ目がシパシパする……ベアトは無事……？」"

[[dialogue]]
speaker = "ベアトリス"
# 「なんとか～……あれ？　ナターシャちゃん、その服って──」
line = "「なんとか～……あれ？　ナターシャちゃん、その服って──」"

[[dialogue]]
speaker = "ナターシャ"
# 「ん？　私の服がどうしたって──あ、ベアトに猫耳が生えてるよ」
line = "「ん？　私の服がどうしたって──あ、ベアトに猫耳が生えてるよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「耳！？　本当だ、なんかついてる！？　あ、これ、ネコミミのカチューシャだ」
line = "「耳！？　本当だ、なんかついてる！？　あ、これ、ネコミミのカチューシャだ」"

[[dialogue]]
speaker = "ナターシャ"
# 「ていうか、私たち──」
line = "「ていうか、私たち──」"

[[dialogue]]
speaker = "２人"
# 「変身しちゃってるーーーーっ！？」
line = "「変身しちゃってるーーーーっ！？」"
