[[dialogue]]
speaker = "unk"
# 第３話,光速ラビットイーツ,P
line = "第３話,光速ラビットイーツ,P"

[[dialogue]]
speaker = "蘭美"
# 「購買部のお手伝い……ですか？　当主様」
line = "「購買部のお手伝い……ですか？　当主様」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむ。何やらキャンペーンを銘打っており、それが大当たりしているらしいのだ」
line = "「うむ。何やらキャンペーンを銘打っており、それが大当たりしているらしいのだ」"

[[dialogue]]
speaker = "ヘレナ"
# 「盛況なのは結構だが、人手が足りず困っているとの報せが入ってな」
line = "「盛況なのは結構だが、人手が足りず困っているとの報せが入ってな」"

[[dialogue]]
speaker = "蘭美"
# 「なるほど！　購買部の方々には、会長救出作戦の折、多大な助力をいただきました……その恩返しということですね！」
line = "「なるほど！　購買部の方々には、会長救出作戦の折、多大な助力をいただきました……その恩返しということですね！」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむ。行ってもらえるか、蘭美よ？」
line = "「うむ。行ってもらえるか、蘭美よ？」"

[[dialogue]]
speaker = "蘭美"
# 「問題ありません！　人手不足であれば、スピードに自信のある私が向かうのが適任でしょう。光速で向かいます！」
line = "「問題ありません！　人手不足であれば、スピードに自信のある私が向かうのが適任でしょう。光速で向かいます！」"

[[dialogue]]
speaker = "ヘレナ"
# 「うむうむ♪　励むのだぞ、蘭美！」
line = "「うむうむ♪　励むのだぞ、蘭美！」"

[[dialogue]]
speaker = "蘭美"
# 「九浄家メイド隊、メイド長の羽宮蘭美、現場に到着よ！」
line = "「九浄家メイド隊、メイド長の羽宮蘭美、現場に到着よ！」"

[[dialogue]]
speaker = "蘭美"
# 「シュティレ！　トリュファイナ様！　なんでも人手が足りないとか──」
line = "「シュティレ！　トリュファイナ様！　なんでも人手が足りないとか──」"

[[dialogue]]
speaker = "シュティレ"
# 「頼りになる応援の到着、感謝の極み」
line = "「頼りになる応援の到着、感謝の極み」"

[[dialogue]]
speaker = "トリュファイナ"
# 「ああっ、蘭美様！　お待ちしておりました！！」
line = "「ああっ、蘭美様！　お待ちしておりました！！」"

[[dialogue]]
speaker = "蘭美"
# 「…………帰っていいかしら？」
line = "「…………帰っていいかしら？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「そ、そんなご無体な……！　私たちではとても回しきれないのです、お手伝いください！」
line = "「そ、そんなご無体な……！　私たちではとても回しきれないのです、お手伝いください！」"

[[dialogue]]
speaker = "蘭美"
# 「嫌な予感しかしないわ！！　でも、とりあえず詳しく話を聞かせなさい？」
line = "「嫌な予感しかしないわ！！　でも、とりあえず詳しく話を聞かせなさい？」"

[[dialogue]]
speaker = "シュティレ"
# 「はい。現在購買部では、光の魔女様の揚げたてフライドチキン、激安セールを実施中です」
line = "「はい。現在購買部では、光の魔女様の揚げたてフライドチキン、激安セールを実施中です」"

[[dialogue]]
speaker = "シュティレ"
# 「さらに学園内であれば、どこでもすぐに熱々チキンをデリバリーすると約束しておりまして……」
line = "「さらに学園内であれば、どこでもすぐに熱々チキンをデリバリーすると約束しておりまして……」"

[[dialogue]]
speaker = "トリュファイナ"
# 「予想をはるかに超える注文が来てしまい、デリバリーが間に合わないのです！」
line = "「予想をはるかに超える注文が来てしまい、デリバリーが間に合わないのです！」"

[[dialogue]]
speaker = "蘭美"
# 「それでスピード自慢の私に、ということなのね……まあ、配達するだけなら問題なさそうね！」
line = "「それでスピード自慢の私に、ということなのね……まあ、配達するだけなら問題なさそうね！」"

[[dialogue]]
speaker = "蘭美"
# （そもそも当主様からの命令だし、断ることはできないわ……！）
line = "（そもそも当主様からの命令だし、断ることはできないわ……！）"

[[dialogue]]
speaker = "蘭美"
# 「承知したわ！　光速で配達してあげるから、チキンを渡しなさい！」
line = "「承知したわ！　光速で配達してあげるから、チキンを渡しなさい！」"

[[dialogue]]
speaker = "シュティレ"
# 「……その格好のまま配達するおつもりですか？」
line = "「……その格好のまま配達するおつもりですか？」"

[[dialogue]]
speaker = "トリュファイナ"
# 「申し訳ございませんが、お着替えをお願いしてもいいでしょうか？　バニーガールが配達する、というのがセールの主旨でして……」
line = "「申し訳ございませんが、お着替えをお願いしてもいいでしょうか？　バニーガールが配達する、というのがセールの主旨でして……」"

[[dialogue]]
speaker = "蘭美"
# 「なんでそんなおかしなこだわりを付けてるぴょん！？」
line = "「なんでそんなおかしなこだわりを付けてるぴょん！？」"

[[dialogue]]
speaker = "シュティレ"
# 「マスターのアイデアです。せっかく人目を惹くバニー衣装を手に入れたのだから、それをしっかり取り入れて大稼ぎだ、と」
line = "「マスターのアイデアです。せっかく人目を惹くバニー衣装を手に入れたのだから、それをしっかり取り入れて大稼ぎだ、と」"

[[dialogue]]
speaker = "蘭美"
# 「…………何てひどいセールなの」
line = "「…………何てひどいセールなの」"

[[dialogue]]
speaker = "トリュファイナ"
# 「配達する際は、語尾に『ぴょん♪』を付けるご挨拶も、必ずお願いいたします……！」
line = "「配達する際は、語尾に『ぴょん♪』を付けるご挨拶も、必ずお願いいたします……！」"

[[dialogue]]
speaker = "蘭美"
# 「くぅうう……！　いいわ、やるわ！　一度請け負った以上は、やり遂げてみせるんだからっ！！」
line = "「くぅうう……！　いいわ、やるわ！　一度請け負った以上は、やり遂げてみせるんだからっ！！」"

[[dialogue]]
speaker = "unk"
# そうして、蘭美は学園中を駆け回る──
line = "そうして、蘭美は学園中を駆け回る──"

[[dialogue]]
speaker = "蘭美"
# 「お待たせいたしましたっ♪　購買部からチキンのデリバリーだぴょんっ♪　ぴょーん、ぴょんっ♪」
line = "「お待たせいたしましたっ♪　購買部からチキンのデリバリーだぴょんっ♪　ぴょーん、ぴょんっ♪」"

[[dialogue]]
speaker = "新星学園の生徒１"
# 「ほ、本当に来たっ！　美少女バニーが宅配してくれた……！　購買部、すげぇ！！」
line = "「ほ、本当に来たっ！　美少女バニーが宅配してくれた……！　購買部、すげぇ！！」"

[[dialogue]]
speaker = "新星学園の生徒２"
# 「あ、あの！　セールっていつまでっすか！？」
line = "「あ、あの！　セールっていつまでっすか！？」"

[[dialogue]]
speaker = "蘭美"
# 「今週末までの限定セールだぴょんっ♪　ご贔屓くださいぴょんっ♪」
line = "「今週末までの限定セールだぴょんっ♪　ご贔屓くださいぴょんっ♪」"

[[dialogue]]
speaker = "新星学園の生徒１"
# 「俺、今日から毎日チキン食うわ」
line = "「俺、今日から毎日チキン食うわ」"

[[dialogue]]
speaker = "新星学園の生徒２"
# 「お、俺も！！　小遣い全部使う！！」
line = "「お、俺も！！　小遣い全部使う！！」"

[[dialogue]]
speaker = "蘭美"
# （うぅうぅぅう！！！　つ、次よ、次っ……！！）
line = "（うぅうぅぅう！！！　つ、次よ、次っ……！！）"

[[dialogue]]
speaker = "unk"
# そうして蘭美は、新星学園だけでなく、流星学園の方にも迅速に宅配を行い、行く先々でしっかりぴょんぴょんし──
line = "そうして蘭美は、新星学園だけでなく、流星学園の方にも迅速に宅配を行い、行く先々でしっかりぴょんぴょんし──"

[[dialogue]]
speaker = "シュティレ"
# 「流石は光速メイドスター……高機動試験型ギガンドムにも勝るスピード。感服いたしました」
line = "「流石は光速メイドスター……高機動試験型ギガンドムにも勝るスピード。感服いたしました」"

[[dialogue]]
speaker = "蘭美"
# 「ぜぇ、ぜぇ……！」
line = "「ぜぇ、ぜぇ……！」"

[[dialogue]]
speaker = "トリュファイナ"
# 「流石にお疲れが見えているようですね……」
line = "「流石にお疲れが見えているようですね……」"

[[dialogue]]
speaker = "蘭美"
# 「ロストアイテムとの戦闘の方がはるかに楽だわ……つ、次の配達は？」
line = "「ロストアイテムとの戦闘の方がはるかに楽だわ……つ、次の配達は？」"

[[dialogue]]
speaker = "シュティレ"
# 「次が本日のラストです。お願いいたします」
line = "「次が本日のラストです。お願いいたします」"

[[dialogue]]
speaker = "蘭美"
# 「…………え、ここって──」
line = "「…………え、ここって──」"

[[dialogue]]
speaker = "ヘレナ"
# 「なんでも今、購買部でフライドチキンのセールをしておるようだぞ、魔王♪」
line = "「なんでも今、購買部でフライドチキンのセールをしておるようだぞ、魔王♪」"

[[dialogue]]
speaker = "unk"
# お買い得なのはありがたいですね
line = "お買い得なのはありがたいですね"

[[dialogue]]
speaker = "ヘレナ"
# 「うむうむ♪　ＤＩＳＣからタップ１つでデリバリーしてくれるらしい。どうだ、１つ頼んでみぬか？　ご馳走してやろう」
line = "「うむうむ♪　ＤＩＳＣからタップ１つでデリバリーしてくれるらしい。どうだ、１つ頼んでみぬか？　ご馳走してやろう」"

[[dialogue]]
speaker = "unk"
# いいんですか！　ありがとうございます
line = "いいんですか！　ありがとうございます"

[[dialogue]]
speaker = "ヘレナ"
# 「うむ。では──注文、と」
line = "「うむ。では──注文、と」"

[[dialogue]]
speaker = "ヘレナ"
# 「さて、後は待つだけ……」
line = "「さて、後は待つだけ……」"

[[dialogue]]
speaker = "unk"
# ──はっや！？！？！？
line = "──はっや！？！？！？"

[[dialogue]]
speaker = "ヘレナ"
# 「凄まじいスピードであるな、流石だ！」
line = "「凄まじいスピードであるな、流石だ！」"

[[dialogue]]
speaker = "unk"
# どうぞ～
line = "どうぞ～"

[[dialogue]]
speaker = "蘭美"
# 「ぴょ、ぴょーんぴょんっ<emoji=heart04>　お仕事がんばってる会長に、フライドチキンのデリバリーだぴょーんっ<emoji=heart04>」
line = "「ぴょ、ぴょーんぴょんっ<emoji=heart04>　お仕事がんばってる会長に、フライドチキンのデリバリーだぴょーんっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# 蘭美！？　えっ、なんでバニー！？！？
line = "蘭美！？　えっ、なんでバニー！？！？"

[[dialogue]]
speaker = "蘭美"
# 「はぁ！？　言うに事欠いて、何よそのリアクション！？　貴方が頼んだんでしょう！　えっち！！！！」
line = "「はぁ！？　言うに事欠いて、何よそのリアクション！？　貴方が頼んだんでしょう！　えっち！！！！」"

[[dialogue]]
speaker = "unk"
# ええぇぇええ！？
line = "ええぇぇええ！？"

[[dialogue]]
speaker = "蘭美"
# 「あのね会長！　いくら私のバニー衣装が見たいからって、こういう無駄遣いはやめなさい！」
line = "「あのね会長！　いくら私のバニー衣装が見たいからって、こういう無駄遣いはやめなさい！」"

[[dialogue]]
speaker = "蘭美"
# 「そ、そもそもお金なんて払わなくても、会長の頼みだったらやってあげるのに……！！」
line = "「そ、そもそもお金なんて払わなくても、会長の頼みだったらやってあげるのに……！！」"

[[dialogue]]
speaker = "unk"
# あれ──いない！？！？
line = "あれ──いない！？！？"

[[dialogue]]
speaker = "unk"
# いや、これはヘレナちゃんが──
line = "いや、これはヘレナちゃんが──"

[[dialogue]]
speaker = "蘭美"
# 「どうして当主様が出てくるのよ……！　そこに直りなさい、お説教よ！！」
line = "「どうして当主様が出てくるのよ……！　そこに直りなさい、お説教よ！！」"

[[dialogue]]
speaker = "蘭美"
# 「将来のお嫁さんとして──夫の無駄遣いは見過ごせないぴょんっ！！」
line = "「将来のお嫁さんとして──夫の無駄遣いは見過ごせないぴょんっ！！」"

[[dialogue]]
speaker = "unk"
# その後、なんとか蘭美の誤解は解けた（当主様ならそういうイタズラをしそうだ、と納得してもらえた）。
line = "その後、なんとか蘭美の誤解は解けた（当主様ならそういうイタズラをしそうだ、と納得してもらえた）。"

[[dialogue]]
speaker = "unk"
# しかし……そうか。蘭美がバニーガールでデリバリーしてくれるのか。明日も頼んじゃおうかな──
line = "しかし……そうか。蘭美がバニーガールでデリバリーしてくれるのか。明日も頼んじゃおうかな──"

[[dialogue]]
speaker = "蘭美"
# 「……まだお説教が足りないかしら？」
line = "「……まだお説教が足りないかしら？」"

[[dialogue]]
speaker = "unk"
# ちらと浮かんだだけの思考すら見透かされる──俺のお嫁さんの観察眼はすごいなあと思うのだった……
line = "ちらと浮かんだだけの思考すら見透かされる──俺のお嫁さんの観察眼はすごいなあと思うのだった……"
