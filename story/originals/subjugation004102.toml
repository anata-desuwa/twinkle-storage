[[dialogue]]
speaker = "unk"
# クーシェンとアポロのメイド修行が始まった。
line = "クーシェンとアポロのメイド修行が始まった。"

[[dialogue]]
speaker = "マリオン"
# 「さあ２人とも、ビシバシ行きますからね！」
line = "「さあ２人とも、ビシバシ行きますからね！」"

[[dialogue]]
speaker = "アポロ"
# 「よろしくお願いします！」
line = "「よろしくお願いします！」"

[[dialogue]]
speaker = "クーシェン"
# 「…………えー？」
line = "「…………えー？」"

[[dialogue]]
speaker = "マリオン"
# 「アポロ様はよいお返事ですね。ですがクーシェン様、あなたは……」
line = "「アポロ様はよいお返事ですね。ですがクーシェン様、あなたは……」"

[[dialogue]]
speaker = "アポロ"
# 「返事は大事だぞ。メイドじゃなくてもぜったい必要なんだ」
line = "「返事は大事だぞ。メイドじゃなくてもぜったい必要なんだ」"

[[dialogue]]
speaker = "クーシェン"
# 「わ、わかってるって。よろしくお願いしまーすっ」
line = "「わ、わかってるって。よろしくお願いしまーすっ」"

[[dialogue]]
speaker = "マリオン"
# 「いいでしょう。ではさっそく修行を始めます」
line = "「いいでしょう。ではさっそく修行を始めます」"

[[dialogue]]
speaker = "アポロ"
# 「いよいよだな！　楽しみだぞ～！」
line = "「いよいよだな！　楽しみだぞ～！」"

[[dialogue]]
speaker = "クーシェン"
# 「さっそくでごめん、１つ質問なんだけどさ……」
line = "「さっそくでごめん、１つ質問なんだけどさ……」"

[[dialogue]]
speaker = "クーシェン"
# 「どうしてお嬢様がここにいるの？」
line = "「どうしてお嬢様がここにいるの？」"

[[dialogue]]
speaker = "フィオナ"
# 「いてはまずかったかしら？」
line = "「いてはまずかったかしら？」"

[[dialogue]]
speaker = "キリカ"
# 「アポロ様を見守りたいお気持ちはわかりますが、２人の修行の邪魔になりますから」
line = "「アポロ様を見守りたいお気持ちはわかりますが、２人の修行の邪魔になりますから」"

[[dialogue]]
speaker = "フィオナ"
# 「決して邪魔はしないわ。黙って見ているだけだから……」
line = "「決して邪魔はしないわ。黙って見ているだけだから……」"

[[dialogue]]
speaker = "キリカ"
# 「フィオナお嬢様」
line = "「フィオナお嬢様」"

[[dialogue]]
speaker = "マリオン"
# 「すみません、見習いメイドもやりづらくなっちゃいますので」
line = "「すみません、見習いメイドもやりづらくなっちゃいますので」"

[[dialogue]]
speaker = "フィオナ"
# 「ううっ、わかったわ。今日のところは引き下がります」
line = "「ううっ、わかったわ。今日のところは引き下がります」"

[[dialogue]]
speaker = "キリカ"
# 「マリオンさん、後はよろしく頼みます」
line = "「マリオンさん、後はよろしく頼みます」"

[[dialogue]]
speaker = "unk"
# 明日も来るのかな？
line = "明日も来るのかな？"

[[dialogue]]
speaker = "unk"
# 今日のところはって言ってたけど
line = "今日のところはって言ってたけど"

[[dialogue]]
speaker = "マリオン"
# 「大丈夫ですよ、キリカさんがしっかり釘を刺してくれると思いますから♪」
line = "「大丈夫ですよ、キリカさんがしっかり釘を刺してくれると思いますから♪」"

[[dialogue]]
speaker = "クーシェン"
# 「にしてもあのお嬢様、ほんとにアポロのこと大好きなんだな～」
line = "「にしてもあのお嬢様、ほんとにアポロのこと大好きなんだな～」"

[[dialogue]]
speaker = "アポロ"
# 「本人はそういうの出さないように気をつけてるみたいだけどな」
line = "「本人はそういうの出さないように気をつけてるみたいだけどな」"

[[dialogue]]
speaker = "マリオン"
# 「残念ながら、ダダ漏れなんですよね～」
line = "「残念ながら、ダダ漏れなんですよね～」"

[[dialogue]]
speaker = "クーシェン"
# 「ふーん。それで、お嬢様の方は解決したけどさー……にーにーはなんでここにいるの？　おかしくない？」
line = "「ふーん。それで、お嬢様の方は解決したけどさー……にーにーはなんでここにいるの？　おかしくない？」"

[[dialogue]]
speaker = "アポロ"
# 「もしかして、魔王も一緒にメイド修行するのか！？」
line = "「もしかして、魔王も一緒にメイド修行するのか！？」"

[[dialogue]]
speaker = "マリオン"
# 「あら、それもありですね♪」
line = "「あら、それもありですね♪」"

[[dialogue]]
speaker = "マリオン"
# 「ふふふ、会長様ならきっと可憐なメイドになるはず……いえいえ、これは忘れて下さい♪」
line = "「ふふふ、会長様ならきっと可憐なメイドになるはず……いえいえ、これは忘れて下さい♪」"

[[dialogue]]
speaker = "マリオン"
# 「今回、会長様にはフィオナお嬢様の代理をお願いしています。ご主人様役が必要になった際に、参加して頂きますね」
line = "「今回、会長様にはフィオナお嬢様の代理をお願いしています。ご主人様役が必要になった際に、参加して頂きますね」"

[[dialogue]]
speaker = "unk"
# ご主人様として協力させてもらうよ
line = "ご主人様として協力させてもらうよ"

[[dialogue]]
speaker = "unk"
# メイド修行はしないけど
line = "メイド修行はしないけど"

[[dialogue]]
speaker = "クーシェン"
# 「にーにーがご主人様やるんだ！　それは面白くなりそうだね～！」
line = "「にーにーがご主人様やるんだ！　それは面白くなりそうだね～！」"

[[dialogue]]
speaker = "アポロ"
# 「よろしくな、魔王！」
line = "「よろしくな、魔王！」"

[[dialogue]]
speaker = "フェニエル"
# 「星見家メイド隊のフェニエルです」
line = "「星見家メイド隊のフェニエルです」"

[[dialogue]]
speaker = "ナミエル"
# 「同じく、ナミエルです」
line = "「同じく、ナミエルです」"

[[dialogue]]
speaker = "マリオン"
# 「まずはこの２人に新人メイドの仕事を指導してもらいますね」
line = "「まずはこの２人に新人メイドの仕事を指導してもらいますね」"

[[dialogue]]
speaker = "アポロ"
# 「よろしくお願いします！」
line = "「よろしくお願いします！」"

[[dialogue]]
speaker = "クーシェン"
# 「ウキキ♪　よろしく～」
line = "「ウキキ♪　よろしく～」"

[[dialogue]]
speaker = "ナミエル"
# 「……調子が軽いですね。もしかして私たち舐められていませんか？」
line = "「……調子が軽いですね。もしかして私たち舐められていませんか？」"

[[dialogue]]
speaker = "フェニエル"
# 「わ、私たちはマリオンさんと比べたらぺーぺーですから」
line = "「わ、私たちはマリオンさんと比べたらぺーぺーですから」"

[[dialogue]]
speaker = "ナミエル"
# 「それはそうですが……いえ、ここは先輩としてビシッと指導させてもらいましょう」
line = "「それはそうですが……いえ、ここは先輩としてビシッと指導させてもらいましょう」"

[[dialogue]]
speaker = "unk"
# なんでも手伝うよ
line = "なんでも手伝うよ"

[[dialogue]]
speaker = "unk"
# 俺はなにをすればいい？
line = "俺はなにをすればいい？"

[[dialogue]]
speaker = "マリオン"
# 「あ、ご主人様は今不要ですので……そうですね、数々のアルバイトを渡り歩いてきたという会長様の美技を見せて頂きましょうか」
line = "「あ、ご主人様は今不要ですので……そうですね、数々のアルバイトを渡り歩いてきたという会長様の美技を見せて頂きましょうか」"

[[dialogue]]
speaker = "アポロ"
# 「魔王が何を見せてくれるんだ？」
line = "「魔王が何を見せてくれるんだ？」"

[[dialogue]]
speaker = "ナミエル"
# 「新人メイドの仕事と言えばこれ、シルバー磨きです」
line = "「新人メイドの仕事と言えばこれ、シルバー磨きです」"

[[dialogue]]
speaker = "クーシェン"
# 「なんだそれ？　面白いのか？」
line = "「なんだそれ？　面白いのか？」"

[[dialogue]]
speaker = "フェニエル"
# 「面白くは……ないかもです。ナイフやフォークなどの食器を磨く地味～なお仕事ですから」
line = "「面白くは……ないかもです。ナイフやフォークなどの食器を磨く地味～なお仕事ですから」"

[[dialogue]]
speaker = "クーシェン"
# 「へー。そんなの機械に任せちゃえばいいんじゃないの？」
line = "「へー。そんなの機械に任せちゃえばいいんじゃないの？」"

[[dialogue]]
speaker = "フェニエル"
# 「人の手で丁寧に磨くことで、より美しい食器になるんですよ」
line = "「人の手で丁寧に磨くことで、より美しい食器になるんですよ」"

[[dialogue]]
speaker = "unk"
# 違いを見せてあげる
line = "違いを見せてあげる"

[[dialogue]]
speaker = "unk"
# ちょっと見てて
line = "ちょっと見てて"

[[dialogue]]
speaker = "ナミエル"
# 「なっ！　とても手慣れた動きですね」
line = "「なっ！　とても手慣れた動きですね」"

[[dialogue]]
speaker = "フェニエル"
# 「さすが会長さんだぁ、なまらすんごいべ……」
line = "「さすが会長さんだぁ、なまらすんごいべ……」"

[[dialogue]]
speaker = "クーシェン"
# 「すごぉ……にーにーってば、そういうのもできたんだね……」
line = "「すごぉ……にーにーってば、そういうのもできたんだね……」"

[[dialogue]]
speaker = "アポロ"
# 「よーし、あたしもやるぞ～！　魔王みたいにやればいいんだよなっ」
line = "「よーし、あたしもやるぞ～！　魔王みたいにやればいいんだよなっ」"

[[dialogue]]
speaker = "アポロ"
# 「うおおおおおおお～～～～っ！！　超高速みがき～～～っ！！」
line = "「うおおおおおおお～～～～っ！！　超高速みがき～～～っ！！」"

[[dialogue]]
speaker = "フェニエル"
# 「あ、あの、そんなに強くこすらなくても大丈夫ですから」
line = "「あ、あの、そんなに強くこすらなくても大丈夫ですから」"

[[dialogue]]
speaker = "アポロ"
# 「え？　そうなのか？」
line = "「え？　そうなのか？」"

[[dialogue]]
speaker = "マリオン"
# 「ふふっ、会長様を見て下さい。スピードはありますが、それ以上に丁寧で繊細ですから」
line = "「ふふっ、会長様を見て下さい。スピードはありますが、それ以上に丁寧で繊細ですから」"

[[dialogue]]
speaker = "unk"
# 速度を出すのは慣れてからだよ
line = "速度を出すのは慣れてからだよ"

[[dialogue]]
speaker = "unk"
# 最初は丁寧にね
line = "最初は丁寧にね"

[[dialogue]]
speaker = "アポロ"
# 「なるほどな……ほら、クーシェンもやってみようぜ！」
line = "「なるほどな……ほら、クーシェンもやってみようぜ！」"

[[dialogue]]
speaker = "クーシェン"
# 「別にいいけどさ……ふきふきふき……」
line = "「別にいいけどさ……ふきふきふき……」"

[[dialogue]]
speaker = "アポロ"
# 「おおー、あたしよりなんかエレガントな感じがする！」
line = "「おおー、あたしよりなんかエレガントな感じがする！」"

[[dialogue]]
speaker = "クーシェン"
# 「そんなことないって。こんなの皿洗うのと一緒だよ」
line = "「そんなことないって。こんなの皿洗うのと一緒だよ」"

[[dialogue]]
speaker = "アポロ"
# 「あたしはお皿なんて洗ったことなくて……お手伝いをもっとしないとダメだよな」
line = "「あたしはお皿なんて洗ったことなくて……お手伝いをもっとしないとダメだよな」"

[[dialogue]]
speaker = "クーシェン"
# 「今それをやるんじゃないの？」
line = "「今それをやるんじゃないの？」"

[[dialogue]]
speaker = "アポロ"
# 「それもそーだなっ！　あたしもフィオナがビックリするくらいすごいメイドになるぞ～！！」
line = "「それもそーだなっ！　あたしもフィオナがビックリするくらいすごいメイドになるぞ～！！」"

[[dialogue]]
speaker = "クーシェン"
# 「……こんなのつまんないな～、ボクは強くなる修行がしたいのにさぁ」
line = "「……こんなのつまんないな～、ボクは強くなる修行がしたいのにさぁ」"

[[dialogue]]
speaker = "unk"
# ２人の見習いメイドには温度差があったが、それでも修行は平等に行われていくのだった。
line = "２人の見習いメイドには温度差があったが、それでも修行は平等に行われていくのだった。"
