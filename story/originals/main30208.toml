[[dialogue]]
speaker = "unk"
# 第８話,『ライブ！』,B
line = "第８話,『ライブ！』,B"

[[dialogue]]
speaker = "unk"
# そして、いよいよ本番。ハロウィンの日がやってくる。
line = "そして、いよいよ本番。ハロウィンの日がやってくる。"

[[dialogue]]
speaker = "unk"
# <ruby=パラレルゲート>平行世界門</ruby>を通ってデネブへ。
line = "<ruby>平行世界門<rt>パラレルゲート</rt></ruby>を通ってデネブへ。"

[[dialogue]]
speaker = "unk"
# ハロウィンの飾り付けが行われた極星学園星徒会室には、守護天使たちの演奏をひと目見ようと大勢の人が詰めかけていた。
line = "ハロウィンの飾り付けが行われた極星学園星徒会室には、守護天使たちの演奏をひと目見ようと大勢の人が詰めかけていた。"

[[dialogue]]
speaker = "オオヒメ"
# 「思っていたよりも……大勢の人が集まってくれたのだな……」
line = "「思っていたよりも……大勢の人が集まってくれたのだな……」"

[[dialogue]]
speaker = "パテル"
# 「あれ～、もしかして緊張してるの～？」
line = "「あれ～、もしかして緊張してるの～？」"

[[dialogue]]
speaker = "オオヒメ"
# 「馬鹿な……私は守護天使だぞ？　緊張などするものか！」
line = "「馬鹿な……私は守護天使だぞ？　緊張などするものか！」"

[[dialogue]]
speaker = "オオヒメ"
# 「だが、私たちの演奏で満足してもらえなかったら、と思うと……不安に思う気持ちは、ある……」
line = "「だが、私たちの演奏で満足してもらえなかったら、と思うと……不安に思う気持ちは、ある……」"

[[dialogue]]
speaker = "ラクシャ"
# 「オオヒメ、肩の力を抜いて。そういうネガティブなことは、一旦ぜーんぶ忘れてさ。思いっきり楽しんでいこう」
line = "「オオヒメ、肩の力を抜いて。そういうネガティブなことは、一旦ぜーんぶ忘れてさ。思いっきり楽しんでいこう」"

[[dialogue]]
speaker = "ラクシャ"
# 「せっかくルヴィネさまが企画してくれたハロウィンパーティーなんだから、ボクたちも楽しまなきゃもったいないよ」
line = "「せっかくルヴィネさまが企画してくれたハロウィンパーティーなんだから、ボクたちも楽しまなきゃもったいないよ」"

[[dialogue]]
speaker = "アルモタヘル"
# 「ふむ。ラクシャよ。随分と余裕があるように見えるが、レミカとの特訓に手応えを感じているからか？」
line = "「ふむ。ラクシャよ。随分と余裕があるように見えるが、レミカとの特訓に手応えを感じているからか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「うーん、どうだろうね。正直に言うとあまり自信はないんだけど……でもみんながくれたボクの役目だからね」
line = "「うーん、どうだろうね。正直に言うとあまり自信はないんだけど……でもみんながくれたボクの役目だからね」"

[[dialogue]]
speaker = "ラクシャ"
# 「全力で『体験』し尽くしてみせるよ。さて……そろそろ時間だね」
line = "「全力で『体験』し尽くしてみせるよ。さて……そろそろ時間だね」"

[[dialogue]]
speaker = "セシア"
# 「こういう時は皆で円陣を組むものではないかしら？」
line = "「こういう時は皆で円陣を組むものではないかしら？」"

[[dialogue]]
speaker = "パテル"
# 「えー。やめようよ、そういうこっぱずかしいの……」
line = "「えー。やめようよ、そういうこっぱずかしいの……」"

[[dialogue]]
speaker = "ラクシャ"
# 「それはどっちかっていうとアイドルとかのステージかな？　ボクたちはロックバンドだから、こんな感じじゃない？」
line = "「それはどっちかっていうとアイドルとかのステージかな？　ボクたちはロックバンドだから、こんな感じじゃない？」"

[[dialogue]]
speaker = "unk"
# ラクシャが拳を握り、突き出す。
line = "ラクシャが拳を握り、突き出す。"

[[dialogue]]
speaker = "unk"
# 他の皆もそれに倣い、互いに拳と拳を軽く打ち合わせる。
line = "他の皆もそれに倣い、互いに拳と拳を軽く打ち合わせる。"

[[dialogue]]
speaker = "ラクシャ"
# 「よし、それじゃ行くよ！　『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』のファーストライブ、幕開けだ！」
line = "「よし、それじゃ行くよ！　『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』のファーストライブ、幕開けだ！」"

[[dialogue]]
speaker = "unk"
# ライブが始まる。
line = "ライブが始まる。"

[[dialogue]]
speaker = "unk"
# 始まってしまえば──後は夢中で楽しむのみ。
line = "始まってしまえば──後は夢中で楽しむのみ。"

[[dialogue]]
speaker = "unk"
# 守護天使たちの演奏は、シルヴィやレミカたちの協力で飛躍的に上達した。
line = "守護天使たちの演奏は、シルヴィやレミカたちの協力で飛躍的に上達した。"

[[dialogue]]
speaker = "unk"
# けれど、やはり所詮は付け焼刃。粗も見えれば失敗もあった。
line = "けれど、やはり所詮は付け焼刃。粗も見えれば失敗もあった。"

[[dialogue]]
speaker = "unk"
# それでも会場に集まった人たちは、些細なことなど気にならぬほど守護天使たちのライブを楽しんでいる。
line = "それでも会場に集まった人たちは、些細なことなど気にならぬほど守護天使たちのライブを楽しんでいる。"

[[dialogue]]
speaker = "unk"
# そして、ラクシャも──
line = "そして、ラクシャも──"

[[dialogue]]
speaker = "ラクシャ"
# （派手に、大げさに、滑稽に、大胆に、けれど繊細に、凛々しく、精一杯格好をつけて……）
line = "（派手に、大げさに、滑稽に、大胆に、けれど繊細に、凛々しく、精一杯格好をつけて……）"

[[dialogue]]
speaker = "ラクシャ"
# （ステージの端から端まで使って……視線を誘導して……サイコーの演奏を繰り広げるみんなを引き立てて……）
line = "（ステージの端から端まで使って……視線を誘導して……サイコーの演奏を繰り広げるみんなを引き立てて……）"

[[dialogue]]
speaker = "ラクシャ"
# （思いっきり楽しんでもらえるように……そしてボクも……今、この瞬間を楽しめるように……）
line = "（思いっきり楽しんでもらえるように……そしてボクも……今、この瞬間を楽しめるように……）"

[[dialogue]]
speaker = "unk"
# 観客の皆は、守護天使たちの演奏も、ラクシャのパフォーマンスも笑顔で楽しんでいる。
line = "観客の皆は、守護天使たちの演奏も、ラクシャのパフォーマンスも笑顔で楽しんでいる。"

[[dialogue]]
speaker = "ラクシャ"
# （あはは……なんだろ、これ……超、楽しいかも……！）
line = "（あはは……なんだろ、これ……超、楽しいかも……！）"

[[dialogue]]
speaker = "unk"
# １曲目が終わる。
line = "１曲目が終わる。"

[[dialogue]]
speaker = "unk"
# ラクシャはセシアからマイクを受け取ると、ステージの最前面に歩み出た。
line = "ラクシャはセシアからマイクを受け取ると、ステージの最前面に歩み出た。"

[[dialogue]]
speaker = "ラクシャ"
# 「みなさーん！　ハロウィン、楽しんでますかーっ！」
line = "「みなさーん！　ハロウィン、楽しんでますかーっ！」"

[[dialogue]]
speaker = "unk"
# 喝采が起こる。
line = "喝采が起こる。"

[[dialogue]]
speaker = "ラクシャ"
# 「ハロウィンパーティーに天から舞い降りた守護天使、『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』でーす！」
line = "「ハロウィンパーティーに天から舞い降りた守護天使、『Ｇｏｌｄｅｎ　Ａｎｇｅｌｓ』でーす！」"

[[dialogue]]
speaker = "unk"
# また、喝采が起こる。
line = "また、喝采が起こる。"

[[dialogue]]
speaker = "ラクシャ"
# 「今日はね、リクリエからの復興を頑張ってるみんなに元気を届けようと思って、こうしてライブとかしてみたんですけど……」
line = "「今日はね、リクリエからの復興を頑張ってるみんなに元気を届けようと思って、こうしてライブとかしてみたんですけど……」"

[[dialogue]]
speaker = "ラクシャ"
# 「みんな、楽しんでくれたかなーっ？」
line = "「みんな、楽しんでくれたかなーっ？」"

[[dialogue]]
speaker = "unk"
# ひと際大きな、喝采が起こる。
line = "ひと際大きな、喝采が起こる。"

[[dialogue]]
speaker = "ラクシャ"
# 「そっかそっか。楽しんでくれたならよかったよ」
line = "「そっかそっか。楽しんでくれたならよかったよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「だって、バンドを組んでライブしよう、なんてバカなことを言い始めたのはボクなんだけど、実はこれ思いついたのってけっこー最近のことなんだよね」
line = "「だって、バンドを組んでライブしよう、なんてバカなことを言い始めたのはボクなんだけど、実はこれ思いついたのってけっこー最近のことなんだよね」"

[[dialogue]]
speaker = "ラクシャ"
# 「おまけに全員、楽器なんて弾いたことがない未経験者。ちゃんとみんなを楽しませることが出来るパフォーマンスになってるか心配だったんだけど……」
line = "「おまけに全員、楽器なんて弾いたことがない未経験者。ちゃんとみんなを楽しませることが出来るパフォーマンスになってるか心配だったんだけど……」"

[[dialogue]]
speaker = "ラクシャ"
# 「楽しんでもらえたんだね、そっかそっか……ん～っ……」
line = "「楽しんでもらえたんだね、そっかそっか……ん～っ……」"

[[dialogue]]
speaker = "ラクシャ"
# 「ボクもすっごく楽しかったーーーーっ！！！」
line = "「ボクもすっごく楽しかったーーーーっ！！！」"

[[dialogue]]
speaker = "unk"
# 割れんばかりの、喝采が起こる。
line = "割れんばかりの、喝采が起こる。"

[[dialogue]]
speaker = "ラクシャ"
# 「ホントはもっとみんなと一緒に盛り上がりたいんだけど……ごめんね、２曲しか用意できなかったから、ライブは次の曲で終わりなんだ」
line = "「ホントはもっとみんなと一緒に盛り上がりたいんだけど……ごめんね、２曲しか用意できなかったから、ライブは次の曲で終わりなんだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「せっかく守護天使が集まったバンドだし、最後の曲に行く前にこの思いつきに付き合ってくれたメンバーを紹介させてよ！」
line = "「せっかく守護天使が集まったバンドだし、最後の曲に行く前にこの思いつきに付き合ってくれたメンバーを紹介させてよ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「まずは……ギターのオオヒメ！」
line = "「まずは……ギターのオオヒメ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「オオヒメはね、簡単に言うと超真面目で努力家かな」
line = "「オオヒメはね、簡単に言うと超真面目で努力家かな」"

[[dialogue]]
speaker = "ラクシャ"
# 「今回の練習でもいっちばん真面目だったね～。おかげであっという間にギターも弾けるようになっちゃったんだ」
line = "「今回の練習でもいっちばん真面目だったね～。おかげであっという間にギターも弾けるようになっちゃったんだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「世話焼きなところもあって、ちょっと口うるさいなーって思うこともあるけど……でも、居ないと困るみんなのまとめ役って感じだね」
line = "「世話焼きなところもあって、ちょっと口うるさいなーって思うこともあるけど……でも、居ないと困るみんなのまとめ役って感じだね」"

[[dialogue]]
speaker = "ラクシャ"
# 「あと、ド天然でからかうといい音が鳴るから、みんなも弄ってあげてねーっ！」
line = "「あと、ド天然でからかうといい音が鳴るから、みんなも弄ってあげてねーっ！」"

[[dialogue]]
speaker = "オオヒメ"
# 「なんだとっ！？」
line = "「なんだとっ！？」"

[[dialogue]]
speaker = "ラクシャ"
# 「さて、次はベースのアルモタヘル！」
line = "「さて、次はベースのアルモタヘル！」"

[[dialogue]]
speaker = "ラクシャ"
# 「どう？　見た目、ちょっといかつくて怖い感じするよね？」
line = "「どう？　見た目、ちょっといかつくて怖い感じするよね？」"

[[dialogue]]
speaker = "ラクシャ"
# 「でも実は全然だよ。話してみたら、超面白いから。見かけたら声をかけてみてよ。主に出没するのは……ご飯が食べられるところかな？」
line = "「でも実は全然だよ。話してみたら、超面白いから。見かけたら声をかけてみてよ。主に出没するのは……ご飯が食べられるところかな？」"

[[dialogue]]
speaker = "ラクシャ"
# 「お肉が大好きでさ。いっつも肉のことばっかり考えてるんだよ。練習の時もお腹がすいて倒れちゃってさ、何を言うかと思ったら『肉が食べたい』ってさ」
line = "「お肉が大好きでさ。いっつも肉のことばっかり考えてるんだよ。練習の時もお腹がすいて倒れちゃってさ、何を言うかと思ったら『肉が食べたい』ってさ」"

[[dialogue]]
speaker = "ラクシャ"
# 「ね、面白いでしょう？　このライブの打ち上げは焼肉ってことになってるんだけど、もう頭の中はそのことでいっぱいじゃないかな？」
line = "「ね、面白いでしょう？　このライブの打ち上げは焼肉ってことになってるんだけど、もう頭の中はそのことでいっぱいじゃないかな？」"

[[dialogue]]
speaker = "アルモタヘル"
# 「肉が美味い店の情報を知っていれば、遠慮はいらん、我に申すがよい！」
line = "「肉が美味い店の情報を知っていれば、遠慮はいらん、我に申すがよい！」"

[[dialogue]]
speaker = "ラクシャ"
# 「えーっと次は誰にしようかな……じゃあ、ドラムのマグダレナ！」
line = "「えーっと次は誰にしようかな……じゃあ、ドラムのマグダレナ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「マグダレナはねー。見た通り、そのまんまのお姉さんって感じかな？」
line = "「マグダレナはねー。見た通り、そのまんまのお姉さんって感じかな？」"

[[dialogue]]
speaker = "ラクシャ"
# 「オオヒメとはちょっと方向性の違う世話焼きでね～。ボクはよくわかんないんだけど、母性？　とか、そんな感じっぽいよ」
line = "「オオヒメとはちょっと方向性の違う世話焼きでね～。ボクはよくわかんないんだけど、母性？　とか、そんな感じっぽいよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「けど、そろそろ人間界にも慣れてきて、ちょっとずつだらしないところが見え始めてるかな～。そうそう、この間なんかもね～……」
line = "「けど、そろそろ人間界にも慣れてきて、ちょっとずつだらしないところが見え始めてるかな～。そうそう、この間なんかもね～……」"

[[dialogue]]
speaker = "マグダレナ"
# 「ラクシャ？　親しみを持たれるのは良いことですが、守護天使としての威厳も大切ですよ？」
line = "「ラクシャ？　親しみを持たれるのは良いことですが、守護天使としての威厳も大切ですよ？」"

[[dialogue]]
speaker = "ラクシャ"
# 「はーい、叱られたのでやめときまーす」
line = "「はーい、叱られたのでやめときまーす」"

[[dialogue]]
speaker = "ラクシャ"
# 「あ……！　こら、気配を消そうとしない！　そこのキーボード担当のパテル！」
line = "「あ……！　こら、気配を消そうとしない！　そこのキーボード担当のパテル！」"

[[dialogue]]
speaker = "ラクシャ"
# 「ポリシーらしいんだけどね、あんまり人前に出たがらないんだよ。ほらほら、もうステージに出ちゃったんだから、あきらめてご挨拶しときなよ」
line = "「ポリシーらしいんだけどね、あんまり人前に出たがらないんだよ。ほらほら、もうステージに出ちゃったんだから、あきらめてご挨拶しときなよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「ああ、そうそう。パテルはね、超イタズラ好きだから要注意ね」
line = "「ああ、そうそう。パテルはね、超イタズラ好きだから要注意ね」"

[[dialogue]]
speaker = "ラクシャ"
# 「特に今日はハロウィンだから、なにかイタズラしてやろうって企んでるんじゃないかな？」
line = "「特に今日はハロウィンだから、なにかイタズラしてやろうって企んでるんじゃないかな？」"

[[dialogue]]
speaker = "ラクシャ"
# 「イタズラがしたいだけだから、お菓子をあげても許してもらえないだろうし……あんまりデネブのみんなに迷惑をかけないようにね」
line = "「イタズラがしたいだけだから、お菓子をあげても許してもらえないだろうし……あんまりデネブのみんなに迷惑をかけないようにね」"

[[dialogue]]
speaker = "パテル"
# 「あたしは善良な一般市民にイタズラなんてしないよ～だ！　もう、勝手なこと言わないでよね！」
line = "「あたしは善良な一般市民にイタズラなんてしないよ～だ！　もう、勝手なこと言わないでよね！」"

[[dialogue]]
speaker = "ラクシャ"
# 「そして最後のメンバーは、さっき可愛い声でロックな歌を聴かせてくれたボーカル、セシア！」
line = "「そして最後のメンバーは、さっき可愛い声でロックな歌を聴かせてくれたボーカル、セシア！」"

[[dialogue]]
speaker = "ラクシャ"
# 「セシアは見た目に反してかなりのしっかり者なんだけど、ちょーっと困った性癖をもってるんだよね」
line = "「セシアは見た目に反してかなりのしっかり者なんだけど、ちょーっと困った性癖をもってるんだよね」"

[[dialogue]]
speaker = "ラクシャ"
# 「母性を感じる人を見かけると、すーぐ甘えにいってママにしちゃうんだよ。実は１番の要注意人物かもしれないな～、みんなも気を付けて」
line = "「母性を感じる人を見かけると、すーぐ甘えにいってママにしちゃうんだよ。実は１番の要注意人物かもしれないな～、みんなも気を付けて」"

[[dialogue]]
speaker = "セシア"
# 「わたくしの新しいママになってくれるヒトがいるなら、いつでも歓迎するわ♪」
line = "「わたくしの新しいママになってくれるヒトがいるなら、いつでも歓迎するわ♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「とまあ、守護天使って実はこんな変わり者集団だったりするんだけど……ちょっとはボクたちのこと、知ってもらえたかな？」
line = "「とまあ、守護天使って実はこんな変わり者集団だったりするんだけど……ちょっとはボクたちのこと、知ってもらえたかな？」"

[[dialogue]]
speaker = "ラクシャ"
# 「うんうん、それじゃメンバー紹介はこのくらいにして……そろそろ行こうかなっ！」
line = "「うんうん、それじゃメンバー紹介はこのくらいにして……そろそろ行こうかなっ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「最後まで楽しんで行ってくださいねーっ！　以上、ギター担当、《円環》のラクシャでしたーっ♪」
line = "「最後まで楽しんで行ってくださいねーっ！　以上、ギター担当、《円環》のラクシャでしたーっ♪」"

[[dialogue]]
