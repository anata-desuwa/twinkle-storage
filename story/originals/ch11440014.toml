[[dialogue]]
speaker = "unk"
# 第４話,恋人とペット,P
line = "第４話,恋人とペット,P"

[[dialogue]]
speaker = "unk"
# 狛里が『魔王様のペットになりたい』と言い出した翌日。
line = "狛里が『魔王様のペットになりたい』と言い出した翌日。"

[[dialogue]]
speaker = "unk"
# 九浄家では、俺と蘭美とヴィーナスの３人で話し合いが行われていた。
line = "九浄家では、俺と蘭美とヴィーナスの３人で話し合いが行われていた。"

[[dialogue]]
speaker = "蘭美"
# 「――というわけで、狛里の件について、少し話をしておきましょう」
line = "「――というわけで、狛里の件について、少し話をしておきましょう」"

[[dialogue]]
speaker = "ヴィーナス"
# 「まさか告白の次が『ペットになりたい』だなんて、面白いわね！　狛里らしいわ♪」
line = "「まさか告白の次が『ペットになりたい』だなんて、面白いわね！　狛里らしいわ♪」"

[[dialogue]]
speaker = "unk"
# 笑いごとじゃないぞ……
line = "笑いごとじゃないぞ……"

[[dialogue]]
speaker = "蘭美"
# 「狛里らしいで済ませられる問題でもないわよ、ヴィーナスお嬢様」
line = "「狛里らしいで済ませられる問題でもないわよ、ヴィーナスお嬢様」"

[[dialogue]]
speaker = "蘭美"
# 「学園の風紀だけじゃなく、九浄家のメイドとしても、色々と問題があるわ！」
line = "「学園の風紀だけじゃなく、九浄家のメイドとしても、色々と問題があるわ！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「でもこれって、学園とか九浄家とかじゃなくて、クロトと狛里の２人の話でしょう？」
line = "「でもこれって、学園とか九浄家とかじゃなくて、クロトと狛里の２人の話でしょう？」"

[[dialogue]]
speaker = "ヴィーナス"
# 「クロトは結局、狛里のことをどう思ってるのかしら？」
line = "「クロトは結局、狛里のことをどう思ってるのかしら？」"

[[dialogue]]
speaker = "unk"
# 問いかけられ、俺は少し考える。
line = "問いかけられ、俺は少し考える。"

[[dialogue]]
speaker = "unk"
# 今まで、誰かを恋愛対象として意識したことはなかった。けれど――
line = "今まで、誰かを恋愛対象として意識したことはなかった。けれど――"

[[dialogue]]
speaker = "unk"
# 狛里のストレートな告白には、胸を打たれた。
line = "狛里のストレートな告白には、胸を打たれた。"

[[dialogue]]
speaker = "unk"
# あの告白で、狛里を意識するようになった
line = "あの告白で、狛里を意識するようになった"

[[dialogue]]
speaker = "unk"
# チョロいと言われるかもしれないが……
line = "チョロいと言われるかもしれないが……"

[[dialogue]]
speaker = "ヴィーナス"
# 「いいんじゃないかしら？　誰かを好きになるのは、理屈じゃないもの♪」
line = "「いいんじゃないかしら？　誰かを好きになるのは、理屈じゃないもの♪」"

[[dialogue]]
speaker = "蘭美"
# 「会長がそう思っているなら、ちゃんと本人へ伝えるべきよ！」
line = "「会長がそう思っているなら、ちゃんと本人へ伝えるべきよ！」"

[[dialogue]]
speaker = "蘭美"
# 「ペットではなく――恋人になりましょう、ってね！」
line = "「ペットではなく――恋人になりましょう、ってね！」"

[[dialogue]]
speaker = "ヴィーナス"
# 「クロト、頑張ってきなさい！」
line = "「クロト、頑張ってきなさい！」"

[[dialogue]]
speaker = "unk"
# 俺は２人に頷いてみせた。
line = "俺は２人に頷いてみせた。"

[[dialogue]]
speaker = "unk"
# その日の放課後。
line = "その日の放課後。"

[[dialogue]]
speaker = "unk"
# 俺は狛里と話す為に、空き教室へ呼び出していた。
line = "俺は狛里と話す為に、空き教室へ呼び出していた。"

[[dialogue]]
speaker = "狛里"
# 「魔王様～っ♪」
line = "「魔王様～っ♪」"

[[dialogue]]
speaker = "狛里"
# 「呼び出しなんて珍しいのです！」
line = "「呼び出しなんて珍しいのです！」"

[[dialogue]]
speaker = "狛里"
# 「もしかして、狛里をペットにするって決めてくれたのです！？」
line = "「もしかして、狛里をペットにするって決めてくれたのです！？」"

[[dialogue]]
speaker = "unk"
# 聞いてくれ
line = "聞いてくれ"

[[dialogue]]
speaker = "unk"
# いや、そうじゃない。
line = "いや、そうじゃない。"

[[dialogue]]
speaker = "狛里"
# 「はいなのです！」
line = "「はいなのです！」"

[[dialogue]]
speaker = "unk"
# 狛里はぴしっと背筋を伸ばす。しかし尻尾は、期待でぶんぶん揺れていた。
line = "狛里はぴしっと背筋を伸ばす。しかし尻尾は、期待でぶんぶん揺れていた。"

[[dialogue]]
speaker = "unk"
# 俺も狛里のことが好きだ
line = "俺も狛里のことが好きだ"

[[dialogue]]
speaker = "狛里"
# 「はいっ♪」
line = "「はいっ♪」"

[[dialogue]]
speaker = "unk"
# だから――俺と恋人になってほしい
line = "だから――俺と恋人になってほしい"

[[dialogue]]
speaker = "狛里"
# 「……！　狛里も魔王様のこと、大好きなのですっ♪」
line = "「……！　狛里も魔王様のこと、大好きなのですっ♪」"

[[dialogue]]
speaker = "狛里"
# 「だから、とっても嬉しいのであります！」
line = "「だから、とっても嬉しいのであります！」"

[[dialogue]]
speaker = "unk"
# そう言って満面の笑みを浮かべる。
line = "そう言って満面の笑みを浮かべる。"

[[dialogue]]
speaker = "unk"
# その笑顔を見ているだけで、告白して良かったと思えた。
line = "その笑顔を見ているだけで、告白して良かったと思えた。"

[[dialogue]]
speaker = "unk"
# しかし――
line = "しかし――"

[[dialogue]]
speaker = "狛里"
# 「つまり……狛里は魔王様のペットにしてもらえるのでありますねっ♪」
line = "「つまり……狛里は魔王様のペットにしてもらえるのでありますねっ♪」"

[[dialogue]]
speaker = "unk"
# いや、なんでっ！？
line = "いや、なんでっ！？"

[[dialogue]]
speaker = "狛里"
# 「だって、好き好き同士だから、ずっと一緒にいるのですよね？」
line = "「だって、好き好き同士だから、ずっと一緒にいるのですよね？」"

[[dialogue]]
speaker = "狛里"
# 「ということは、ご主人様とペットみたいなものなのです♪」
line = "「ということは、ご主人様とペットみたいなものなのです♪」"

[[dialogue]]
speaker = "unk"
# ち、ちょっと違うかな……
line = "ち、ちょっと違うかな……"

[[dialogue]]
speaker = "狛里"
# 「そうなのですか？　ふぅ～む……」
line = "「そうなのですか？　ふぅ～む……」"

[[dialogue]]
speaker = "unk"
# 狛里は真剣な顔で悩み始める。そして――
line = "狛里は真剣な顔で悩み始める。そして――"

[[dialogue]]
speaker = "狛里"
# 「つまり恋人とは……」
line = "「つまり恋人とは……」"

[[dialogue]]
speaker = "狛里"
# 「少し偉いペット……ってことなのです？」
line = "「少し偉いペット……ってことなのです？」"

[[dialogue]]
speaker = "unk"
# 全然違うよ！？
line = "全然違うよ！？"

[[dialogue]]
speaker = "狛里"
# 「難しいであります～～っ！」
line = "「難しいであります～～っ！」"

[[dialogue]]
speaker = "unk"
# しばらく説明を続けた結果。
line = "しばらく説明を続けた結果。"

[[dialogue]]
speaker = "unk"
# 理解したかどうかは怪しいが、とりあえず……。
line = "理解したかどうかは怪しいが、とりあえず……。"

[[dialogue]]
speaker = "狛里"
# 「わかったのです！」
line = "「わかったのです！」"

[[dialogue]]
speaker = "狛里"
# 「魔王様と一緒に遊びに行くのが『でーと』！」
line = "「魔王様と一緒に遊びに行くのが『でーと』！」"

[[dialogue]]
speaker = "狛里"
# 「でーとをする人たちが恋人！　ということでありますね！」
line = "「でーとをする人たちが恋人！　ということでありますね！」"

[[dialogue]]
speaker = "unk"
# だ、だいたいそんな感じかな……
line = "だ、だいたいそんな感じかな……"

[[dialogue]]
speaker = "狛里"
# 「なるほどなのです！」
line = "「なるほどなのです！」"

[[dialogue]]
speaker = "狛里"
# 「それで――」
line = "「それで――」"

[[dialogue]]
speaker = "狛里"
# 「恋人というのは、どういう主従関係なのです？」
line = "「恋人というのは、どういう主従関係なのです？」"

[[dialogue]]
speaker = "unk"
# またそこに戻るの！？
line = "またそこに戻るの！？"

[[dialogue]]
speaker = "狛里"
# 「ばうわふ？」
line = "「ばうわふ？」"

[[dialogue]]
speaker = "unk"
# 首を傾げる狛里。
line = "首を傾げる狛里。"

[[dialogue]]
speaker = "unk"
# それでも――そんな狛里を見ていると、可愛いと思ってしまう自分がいる。
line = "それでも――そんな狛里を見ていると、可愛いと思ってしまう自分がいる。"

[[dialogue]]
speaker = "unk"
# とりあえず、今度一緒にデートに行こう
line = "とりあえず、今度一緒にデートに行こう"

[[dialogue]]
speaker = "unk"
# ……まあ、少しずつでいいか
line = "……まあ、少しずつでいいか"

[[dialogue]]
speaker = "狛里"
# 「！　はいっ♪」
line = "「！　はいっ♪」"

[[dialogue]]
speaker = "狛里"
# 「魔王様と２人でお出かけ、とっても楽しみなのです♪」
line = "「魔王様と２人でお出かけ、とっても楽しみなのです♪」"

[[dialogue]]
speaker = "unk"
# そう言って、狛里は俺の腕にぎゅっと抱きついてくる。
line = "そう言って、狛里は俺の腕にぎゅっと抱きついてくる。"

[[dialogue]]
speaker = "狛里"
# 「えへへへっ♪」
line = "「えへへへっ♪」"

[[dialogue]]
speaker = "狛里"
# 「魔王様、あったかくていい匂いがするのです♪　くんくん♪」
line = "「魔王様、あったかくていい匂いがするのです♪　くんくん♪」"

[[dialogue]]
speaker = "unk"
# 恋人とは何か。多分まだ、狛里はよく理解していない。
line = "恋人とは何か。多分まだ、狛里はよく理解していない。"

[[dialogue]]
speaker = "unk"
# けれど――これから一緒に過ごしていけば、少しずつ分かっていくだろう。
line = "けれど――これから一緒に過ごしていけば、少しずつ分かっていくだろう。"

[[dialogue]]
speaker = "unk"
# そんな期待を胸に抱きながら、俺たちは今度のデートの予定について話し合うのだった。
line = "そんな期待を胸に抱きながら、俺たちは今度のデートの予定について話し合うのだった。"
