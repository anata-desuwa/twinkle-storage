[[dialogue]]
speaker = "unk"
# 第４話,君と海とこれからと,P
line = "第４話,君と海とこれからと,P"

[[dialogue]]
speaker = "コハルコ"
# 「ナツコ、トウコ。あんまり遠くまで行っちゃダメだからね」
line = "「ナツコ、トウコ。あんまり遠くまで行っちゃダメだからね」"

[[dialogue]]
speaker = "ナツコ"
# 「はーい！」
line = "「はーい！」"

[[dialogue]]
speaker = "トウコ"
# 「うん」
line = "「うん」"

[[dialogue]]
speaker = "コハルコ"
# 「会長さんも、２人のこと見ててくれる？」
line = "「会長さんも、２人のこと見ててくれる？」"

[[dialogue]]
speaker = "unk"
# もちろん
line = "もちろん"

[[dialogue]]
speaker = "コハルコ"
# 「ありがとう。なんかごめんね」
line = "「ありがとう。なんかごめんね」"

[[dialogue]]
speaker = "unk"
# ２人とも俺にとっても大切な妹だから
line = "２人とも俺にとっても大切な妹だから"

[[dialogue]]
speaker = "コハルコ"
# 「……うん、そう言ってくれると本当に嬉しい。ありがとう」
line = "「……うん、そう言ってくれると本当に嬉しい。ありがとう」"

[[dialogue]]
speaker = "unk"
# 今日は朝比奈家の海水浴に男手としてついてきた。家族水入らずにお邪魔かとも思ったけど、コハルコと一緒にいられるのはやっぱり嬉しい。
line = "今日は朝比奈家の海水浴に男手としてついてきた。家族水入らずにお邪魔かとも思ったけど、コハルコと一緒にいられるのはやっぱり嬉しい。"

[[dialogue]]
speaker = "コハルコ父"
# 「緋宮くんが来てくれてよかったよ。バーベキューをしようと思ったんだけど、僕たちだけじゃ心許なくてね」
line = "「緋宮くんが来てくれてよかったよ。バーベキューをしようと思ったんだけど、僕たちだけじゃ心許なくてね」"

[[dialogue]]
speaker = "コハルコ母"
# 「お手伝いありがとうね。その代わりといってはなんだけど、お肉たくさん食べて」
line = "「お手伝いありがとうね。その代わりといってはなんだけど、お肉たくさん食べて」"

[[dialogue]]
speaker = "ナツコ"
# 「ごちそうさま！」
line = "「ごちそうさま！」"

[[dialogue]]
speaker = "トウコ"
# 「ごちそうさまでした」
line = "「ごちそうさまでした」"

[[dialogue]]
speaker = "コハルコ"
# 「はい、お粗末様でした」
line = "「はい、お粗末様でした」"

[[dialogue]]
speaker = "コハルコ"
# 「会長さん、ありがとう。おかげでバーベキュー大成功だね。ちゃんとお肉食べられた？」
line = "「会長さん、ありがとう。おかげでバーベキュー大成功だね。ちゃんとお肉食べられた？」"

[[dialogue]]
speaker = "unk"
# お腹いっぱいです……
line = "お腹いっぱいです……"

[[dialogue]]
speaker = "コハルコ"
# 「あー、なんかごめんね、お父さんもお母さんも張り切っちゃって……」
line = "「あー、なんかごめんね、お父さんもお母さんも張り切っちゃって……」"

[[dialogue]]
speaker = "コハルコ"
# 「２人とも、会長さんには感謝してるんだ」
line = "「２人とも、会長さんには感謝してるんだ」"

[[dialogue]]
speaker = "コハルコ"
# 「コラプサーのときは私を助けてくれたし、妹たちとも仲良くしてくれるし。今日だって一緒にバーベキュー来てくれたしね」
line = "「コラプサーのときは私を助けてくれたし、妹たちとも仲良くしてくれるし。今日だって一緒にバーベキュー来てくれたしね」"

[[dialogue]]
speaker = "コハルコ父"
# 「片付けは僕らがやるから、コハルコと緋宮くんは遊んでおいで」
line = "「片付けは僕らがやるから、コハルコと緋宮くんは遊んでおいで」"

[[dialogue]]
speaker = "コハルコ母"
# 「ナツコ、トウコ。お父さんのお手伝いしようか」
line = "「ナツコ、トウコ。お父さんのお手伝いしようか」"

[[dialogue]]
speaker = "ナツコ"
# 「はーい！」
line = "「はーい！」"

[[dialogue]]
speaker = "トウコ"
# 「お姉ちゃん、会長さん、いってらっしゃい」
line = "「お姉ちゃん、会長さん、いってらっしゃい」"

[[dialogue]]
speaker = "コハルコ"
# 「じゃ、お願いしようかな。会長さん、行こ行こ」
line = "「じゃ、お願いしようかな。会長さん、行こ行こ」"

[[dialogue]]
speaker = "unk"
# コハルコに手を引かれ、夏の海に繰り出す。
line = "コハルコに手を引かれ、夏の海に繰り出す。"

[[dialogue]]
speaker = "コハルコ"
# 「そぉれ！」
line = "「そぉれ！」"

[[dialogue]]
speaker = "unk"
# お返しだっ！
line = "お返しだっ！"

[[dialogue]]
speaker = "コハルコ"
# 「あはははっ、しょっぱ！」
line = "「あはははっ、しょっぱ！」"

[[dialogue]]
speaker = "コハルコ"
# 「んー、ちゅっ<emoji=heart04>」
line = "「んー、ちゅっ<emoji=heart04>」"

[[dialogue]]
speaker = "コハルコ"
# 「ふふっ、会長さんの唇もしょっぱい」
line = "「ふふっ、会長さんの唇もしょっぱい」"

[[dialogue]]
speaker = "コハルコ"
# 「海で彼氏と遊んでるなんて、学園に入る前の私が知ったらびっくりするだろうな。彼氏ができるのも、海に行くのも、想像もしてなかった」
line = "「海で彼氏と遊んでるなんて、学園に入る前の私が知ったらびっくりするだろうな。彼氏ができるのも、海に行くのも、想像もしてなかった」"

[[dialogue]]
speaker = "コハルコ"
# 「今日だって、浜辺でバーベキューなんて、会長さんがいなかったらできなかっただろうしね。妹たちにも夏の思い出を作ってあげられてよかった」
line = "「今日だって、浜辺でバーベキューなんて、会長さんがいなかったらできなかっただろうしね。妹たちにも夏の思い出を作ってあげられてよかった」"

[[dialogue]]
speaker = "コハルコ"
# 「いつもありがとう。会長さんがいるから、私の世界が広がってる気がする」
line = "「いつもありがとう。会長さんがいるから、私の世界が広がってる気がする」"

[[dialogue]]
speaker = "コハルコ"
# 「……え、泳げると世界がもっと広がる？」
line = "「……え、泳げると世界がもっと広がる？」"

[[dialogue]]
speaker = "コハルコ"
# 「そ、それはおいおいね……そのうち……いつかきっと……将来的に……」
line = "「そ、それはおいおいね……そのうち……いつかきっと……将来的に……」"

[[dialogue]]
speaker = "コハルコ"
# 「あ、将来といえば……」
line = "「あ、将来といえば……」"

[[dialogue]]
speaker = "コハルコ"
# 「……この前、話したこと覚えてる？　学園を卒業したらって」
line = "「……この前、話したこと覚えてる？　学園を卒業したらって」"

[[dialogue]]
speaker = "コハルコ"
# 「私は家族が大好き。生まれ育った秋葉原も大好き。卒業後も今と変わらず学園で働きながら、家族を支えていけたらなって思ってる」
line = "「私は家族が大好き。生まれ育った秋葉原も大好き。卒業後も今と変わらず学園で働きながら、家族を支えていけたらなって思ってる」"

[[dialogue]]
speaker = "コハルコ"
# 「会長さんはどう？　卒業後のことって考えてる？」
line = "「会長さんはどう？　卒業後のことって考えてる？」"

[[dialogue]]
speaker = "unk"
# 今までリクリエとの戦いで精いっぱいで、その先のことなんて考える余裕はなかった。
line = "今までリクリエとの戦いで精いっぱいで、その先のことなんて考える余裕はなかった。"

[[dialogue]]
speaker = "unk"
# でも今は……いや、そろそろ考えないといけないのかもしれない。
line = "でも今は……いや、そろそろ考えないといけないのかもしれない。"

[[dialogue]]
speaker = "コハルコ"
# 「もし、卒業後のこと決めてないんだったら……秋葉原の小さいお店なんだけど、どうかな？」
line = "「もし、卒業後のこと決めてないんだったら……秋葉原の小さいお店なんだけど、どうかな？」"

[[dialogue]]
speaker = "コハルコ"
# 「…………言ってみただけ、言ってみただけだから！　会長さんにも将来やりたいこととかあると思うし」
line = "「…………言ってみただけ、言ってみただけだから！　会長さんにも将来やりたいこととかあると思うし」"

[[dialogue]]
speaker = "コハルコ"
# 「でも、少しだけでも考えてくれたら嬉しいな。うちの家族も喜ぶよ」
line = "「でも、少しだけでも考えてくれたら嬉しいな。うちの家族も喜ぶよ」"

[[dialogue]]
speaker = "unk"
# それがどんな形になるかはまだ分からないけど、これからもコハルコと一緒に生きていける道を選びたい。
line = "それがどんな形になるかはまだ分からないけど、これからもコハルコと一緒に生きていける道を選びたい。"

[[dialogue]]
speaker = "unk"
# 分かった。考えとく
line = "分かった。考えとく"

[[dialogue]]
speaker = "コハルコ"
# 「うん、ありがとう。私も君とこれからも一緒にいたい…………ううん、これからも一緒にいようね」
line = "「うん、ありがとう。私も君とこれからも一緒にいたい…………ううん、これからも一緒にいようね」"

[[dialogue]]
speaker = "コハルコ"
# 「大人になっても、おじいちゃんおばあちゃんになっても、ずっとずっと、一緒だよ」
line = "「大人になっても、おじいちゃんおばあちゃんになっても、ずっとずっと、一緒だよ」"
