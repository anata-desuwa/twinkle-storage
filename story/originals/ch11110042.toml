[[dialogue]]
speaker = "unk"
# 第２話,世界間交流はニンニクの香り,P
line = "第２話,世界間交流はニンニクの香り,P"

[[dialogue]]
speaker = "unk"
# 平行世界間交流の代表として、新星学園星徒会会長の俺は、ゲートを通ってデネブを訪れた。
line = "平行世界間交流の代表として、新星学園星徒会会長の俺は、ゲートを通ってデネブを訪れた。"

[[dialogue]]
speaker = "ベアトリス"
# 「ようこそ、会長さん。我らがデネブへ！」
line = "「ようこそ、会長さん。我らがデネブへ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「今日１日、私がツアーコンダクターとして、デネブをご案内しますねっ」
line = "「今日１日、私がツアーコンダクターとして、デネブをご案内しますねっ」"

[[dialogue]]
speaker = "unk"
# よろしく！
line = "よろしく！"

[[dialogue]]
speaker = "ベアトリス"
# 「まぁ、デネブでも流星市国であることは変わらないんですけどね。気候や環境がまったく別物だったら、大変なことになりますし」
line = "「まぁ、デネブでも流星市国であることは変わらないんですけどね。気候や環境がまったく別物だったら、大変なことになりますし」"

[[dialogue]]
speaker = "ベアトリス"
# 「もしアルタイルの流星市国が、ニンニクすらないような魔境だったら、力が出なくて死活問題でしたよ～っ」
line = "「もしアルタイルの流星市国が、ニンニクすらないような魔境だったら、力が出なくて死活問題でしたよ～っ」"

[[dialogue]]
speaker = "unk"
# さすがにニンニクはあるかな……
line = "さすがにニンニクはあるかな……"

[[dialogue]]
speaker = "ベアトリス"
# 「あはは、それは心配しすぎでしたね。杞憂でした」
line = "「あはは、それは心配しすぎでしたね。杞憂でした」"

[[dialogue]]
speaker = "unk"
# デネブとアルタイルでニンニクに違いはあった？
line = "デネブとアルタイルでニンニクに違いはあった？"

[[dialogue]]
speaker = "ベアトリス"
# 「あまり変わらないですね。どっちのニンニクも美味しくて、調理方法もほとんど同じでした」
line = "「あまり変わらないですね。どっちのニンニクも美味しくて、調理方法もほとんど同じでした」"

[[dialogue]]
speaker = "ベアトリス"
# 「あっ、あそこの角のお店、ニンニクと唐辛子どっさりのペペロンチーノが絶品なんですよっ！」
line = "「あっ、あそこの角のお店、ニンニクと唐辛子どっさりのペペロンチーノが絶品なんですよっ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「パスタ１皿にニンニクをまるまる１個使ってて、ごろごろ入ってて……じゅるり」
line = "「パスタ１皿にニンニクをまるまる１個使ってて、ごろごろ入ってて……じゅるり」"

[[dialogue]]
speaker = "ベアトリス"
# 「……あっ」
line = "「……あっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「か、会長さん、そろそろお腹も空いてきた頃じゃないですか……なーんて……」
line = "「か、会長さん、そろそろお腹も空いてきた頃じゃないですか……なーんて……」"

[[dialogue]]
speaker = "unk"
# 匂いに釣られちゃった
line = "匂いに釣られちゃった"

[[dialogue]]
speaker = "unk"
# もう、お腹ぺこぺこだよ
line = "もう、お腹ぺこぺこだよ"

[[dialogue]]
speaker = "ベアトリス"
# 「ですよねっ！　でしたら、私が知ってる中で一番美味しいニンニク料理のお店にご案内しますねっ」
line = "「ですよねっ！　でしたら、私が知ってる中で一番美味しいニンニク料理のお店にご案内しますねっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「じゃんっ！　こちらのお店です！」
line = "「じゃんっ！　こちらのお店です！」"

[[dialogue]]
speaker = "ベアトリス"
# 「名物はなんと言っても、シュクメルリ！　世界で一番ニンニクを美味しく食べる料理なんて言われてるんですよっ」
line = "「名物はなんと言っても、シュクメルリ！　世界で一番ニンニクを美味しく食べる料理なんて言われてるんですよっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「ただでさえ世界一美味しい食材のニンニクを更に美味しくするんですから、絶品に決まってますよねっ！」
line = "「ただでさえ世界一美味しい食材のニンニクを更に美味しくするんですから、絶品に決まってますよねっ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「遠慮せずになんでも頼んでくださいねっ。今日は私の奢りですからっ」
line = "「遠慮せずになんでも頼んでくださいねっ。今日は私の奢りですからっ」"

[[dialogue]]
speaker = "unk"
# もう空腹が限界で、ベアトがオススメするお店に入った。
line = "もう空腹が限界で、ベアトがオススメするお店に入った。"

[[dialogue]]
speaker = "unk"
# テーブルの上に並んだのは、ニンニクとベーコンのアヒージョに、ニンニクの丸揚げ、ニンニクを利かせた唐揚げに、ニンニクと砂肝の塩炒め。
line = "テーブルの上に並んだのは、ニンニクとベーコンのアヒージョに、ニンニクの丸揚げ、ニンニクを利かせた唐揚げに、ニンニクと砂肝の塩炒め。"

[[dialogue]]
speaker = "ベアトリス"
# 「ん～～～っ<emoji=heart04>　コリコリの歯触りがたまりませんっ<emoji=heart04>」
line = "「ん～～～っ<emoji=heart04>　コリコリの歯触りがたまりませんっ<emoji=heart04>」"

[[dialogue]]
speaker = "unk"
# トドメにガーリックステーキにガーリックライス。オードブルからメインディッシュまでニンニクのフルコースだった。
line = "トドメにガーリックステーキにガーリックライス。オードブルからメインディッシュまでニンニクのフルコースだった。"

[[dialogue]]
speaker = "ベアトリス"
# 「どうですか、会長さん。デネブのニンニク料理は舌に合いました？」
line = "「どうですか、会長さん。デネブのニンニク料理は舌に合いました？」"

[[dialogue]]
speaker = "unk"
# み　な　ぎ　っ　て　き　た　ぜ　！
line = "み　な　ぎ　っ　て　き　た　ぜ　！"

[[dialogue]]
speaker = "unk"
# スタミナ満点！
line = "スタミナ満点！"

[[dialogue]]
speaker = "ベアトリス"
# 「えへへ、私も会長さんの食べっぷりを見てて、元気になりましたっ」
line = "「えへへ、私も会長さんの食べっぷりを見てて、元気になりましたっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「こっちの世界のお料理も気に入ってもらえたなら、とっても嬉しいですっ♪」
line = "「こっちの世界のお料理も気に入ってもらえたなら、とっても嬉しいですっ♪」"

[[dialogue]]
speaker = "ベアトリス"
# 「ふう、お腹いっぱいです。頼みすぎちゃったかと思いましたけど完食しましたねっ」
line = "「ふう、お腹いっぱいです。頼みすぎちゃったかと思いましたけど完食しましたねっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「会長さんも私に負けないくらいの食べっぷりでした。見ていて気持ちよかったです。満足してもらえて良かった♪」
line = "「会長さんも私に負けないくらいの食べっぷりでした。見ていて気持ちよかったです。満足してもらえて良かった♪」"

[[dialogue]]
speaker = "ベアトリス"
# 「次にアルタイルに行ったら、会長さんのオススメのお店に連れてってくださいねっ」
line = "「次にアルタイルに行ったら、会長さんのオススメのお店に連れてってくださいねっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「──って、あれ！？　これじゃデートの催促みたい！？」
line = "「──って、あれ！？　これじゃデートの催促みたい！？」"

[[dialogue]]
speaker = "ベアトリス"
# 「でも、おかしくないよね？　自然な流れだよね？」
line = "「でも、おかしくないよね？　自然な流れだよね？」"

[[dialogue]]
speaker = "チナ"
# 「おっ、ベアトに……魔王じゃないか。そういや、アルタイルとの交流で来てたんだっけ」
line = "「おっ、ベアトに……魔王じゃないか。そういや、アルタイルとの交流で来てたんだっけ」"

[[dialogue]]
speaker = "チナ"
# 「んぅっ……！？　今日もニンニクくさいな……いや、いつもの倍以上だな！？　この漂ってくる匂いは魔王からもか？」
line = "「んぅっ……！？　今日もニンニクくさいな……いや、いつもの倍以上だな！？　この漂ってくる匂いは魔王からもか？」"

[[dialogue]]
speaker = "ベアトリス"
# 「あ、やっぱり匂っちゃった？　自分の匂いってあんまりわからなくて……」
line = "「あ、やっぱり匂っちゃった？　自分の匂いってあんまりわからなくて……」"

[[dialogue]]
speaker = "チナ"
# 「『やっぱり匂っちゃった？』じゃないっ！　ベアト、デネブに来てくれたゲストをニンニク料理の店に連れて行ったのかっ！？」
line = "「『やっぱり匂っちゃった？』じゃないっ！　ベアト、デネブに来てくれたゲストをニンニク料理の店に連れて行ったのかっ！？」"

[[dialogue]]
speaker = "unk"
# どれも美味しかったよ！
line = "どれも美味しかったよ！"

[[dialogue]]
speaker = "チナ"
# 「そ、そうか……？　まあ、魔王がベアトのおもてなしに満足してるなら、アタシが余計な口を挟むこともないか……」
line = "「そ、そうか……？　まあ、魔王がベアトのおもてなしに満足してるなら、アタシが余計な口を挟むこともないか……」"

[[dialogue]]
speaker = "チナ"
# 「なんだか距離が近い気もするし、案外２人とも似た者同士なのか……？　文字通り、くさい仲ってやつ……？」
line = "「なんだか距離が近い気もするし、案外２人とも似た者同士なのか……？　文字通り、くさい仲ってやつ……？」"

[[dialogue]]
speaker = "ベアトリス"
# 「チナちゃんも一緒に会長さんのおもてなしする？」
line = "「チナちゃんも一緒に会長さんのおもてなしする？」"

[[dialogue]]
speaker = "チナ"
# 「いやいいよ。匂いがキツすぎて鼻がおかしくなりそうだし、２人の邪魔をするのも悪いしな」
line = "「いやいいよ。匂いがキツすぎて鼻がおかしくなりそうだし、２人の邪魔をするのも悪いしな」"

[[dialogue]]
speaker = "ベアトリス"
# 「じゃ、邪魔って、そんなことないよっ！？」
line = "「じゃ、邪魔って、そんなことないよっ！？」"

[[dialogue]]
speaker = "チナ"
# 「ベアトと末永く仲良くしてやってくれよな、魔王！　ベアトを泣かしたら許さないぞ！」
line = "「ベアトと末永く仲良くしてやってくれよな、魔王！　ベアトを泣かしたら許さないぞ！」"

[[dialogue]]
speaker = "ベアトリス"
# 「チナちゃんっ！？　どの立場からの台詞～っ！？」
line = "「チナちゃんっ！？　どの立場からの台詞～っ！？」"

[[dialogue]]
speaker = "ベアトリス"
# （おもてなしっていうよりは、デ、デートっぽいかなとは思ってたけどっ！　ますます意識させるようなこと言わないで～っ！）
line = "（おもてなしっていうよりは、デ、デートっぽいかなとは思ってたけどっ！　ますます意識させるようなこと言わないで～っ！）"

[[dialogue]]
speaker = "unk"
# 楽しい平行世界間交流のおもてなしも、終わりの時間が来てしまった。
line = "楽しい平行世界間交流のおもてなしも、終わりの時間が来てしまった。"

[[dialogue]]
speaker = "ベアトリス"
# 「それじゃ、またこっちに遊びに来てくださいねっ。私も近い内にお邪魔しますからっ」
line = "「それじゃ、またこっちに遊びに来てくださいねっ。私も近い内にお邪魔しますからっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「またお会いしましょうね、会長さんっ」
line = "「またお会いしましょうね、会長さんっ」"

[[dialogue]]
speaker = "unk"
# 平行世界間交流を終えた俺は、名残惜しそうなベアトリスに見送られ──
line = "平行世界間交流を終えた俺は、名残惜しそうなベアトリスに見送られ──"

[[dialogue]]
speaker = "unk"
# アルタイルへと帰還し、そのまま我が家へと帰宅する。
line = "アルタイルへと帰還し、そのまま我が家へと帰宅する。"

[[dialogue]]
speaker = "unk"
# ただいまっ！
line = "ただいまっ！"

[[dialogue]]
speaker = "リノ"
# 「お帰りなさい、クロト。あっちはどう──って、ニンニクくさーっ！？　向こうで何食べてきたの！？」
line = "「お帰りなさい、クロト。あっちはどう──って、ニンニクくさーっ！？　向こうで何食べてきたの！？」"

[[dialogue]]
speaker = "unk"
# ニンニクの強烈な匂いは、世界の壁をも超越したのであった。
line = "ニンニクの強烈な匂いは、世界の壁をも超越したのであった。"
