[[dialogue]]
speaker = "unk"
# 第４話,深く暗い洞の中でも,P
line = "第４話,深く暗い洞の中でも,P"

[[dialogue]]
speaker = "ベアトリス"
# 「こんばんは、会長さんっ。おひとりで居残り作業ですか？」
line = "「こんばんは、会長さんっ。おひとりで居残り作業ですか？」"

[[dialogue]]
speaker = "unk"
# 仕上げに悩んでいた書類に着手していると、どこからともなく、ハロウィン衣裳に身を包んだベアトリスが現れた。
line = "仕上げに悩んでいた書類に着手していると、どこからともなく、ハロウィン衣裳に身を包んだベアトリスが現れた。"

[[dialogue]]
speaker = "ベアトリス"
# 「ふふ、吸血鬼は神出鬼没ですから。そして、今の私は吸血鬼でありながら、使い魔猫ちゃんなのです」
line = "「ふふ、吸血鬼は神出鬼没ですから。そして、今の私は吸血鬼でありながら、使い魔猫ちゃんなのです」"

[[dialogue]]
speaker = "ベアトリス"
# 「ほら、アニマルセラピーってあるじゃないですか？」
line = "「ほら、アニマルセラピーってあるじゃないですか？」"

[[dialogue]]
speaker = "ベアトリス"
# 「ペットをナデナデしたり、モフモフしたり、匂いを吸うと癒されるって言いますし……頑張ってる会長さんを癒してあげちゃいますニャンっ♪」
line = "「ペットをナデナデしたり、モフモフしたり、匂いを吸うと癒されるって言いますし……頑張ってる会長さんを癒してあげちゃいますニャンっ♪」"

[[dialogue]]
speaker = "unk"
# くんかくんかしていいのっ？
line = "くんかくんかしていいのっ？"

[[dialogue]]
speaker = "unk"
# なでたり、もふったりっ！
line = "なでたり、もふったりっ！"

[[dialogue]]
speaker = "ベアトリス"
# 「思ってたより限界だったニャンっ！？」
line = "「思ってたより限界だったニャンっ！？」"

[[dialogue]]
speaker = "ベアトリス"
# 「えっと……あまり激しくしなければ、ＯＫです。優しくしてくださいニャン♪」
line = "「えっと……あまり激しくしなければ、ＯＫです。優しくしてくださいニャン♪」"

[[dialogue]]
speaker = "ベアトリス"
# 「ニャフン♪　会長さんのナデナデ気持ちいいです……もう少し強めでも大丈夫ですよ」
line = "「ニャフン♪　会長さんのナデナデ気持ちいいです……もう少し強めでも大丈夫ですよ」"

[[dialogue]]
speaker = "ベアトリス"
# 「はぅ、んんっ……にゃふぅ……<emoji=heart04>　私の髪、どうです……さらさら、ですか……？　ありがとうございます、えへへ……<emoji=heart04>」
line = "「はぅ、んんっ……にゃふぅ……<emoji=heart04>　私の髪、どうです……さらさら、ですか……？　ありがとうございます、えへへ……<emoji=heart04>」"

[[dialogue]]
speaker = "ベアトリス"
# 「んっ、ふぁぁ……つけ耳につけ尻尾なのに、触られてるとなんだかゾクゾクしちゃいますね……<emoji=heart04>」
line = "「んっ、ふぁぁ……つけ耳につけ尻尾なのに、触られてるとなんだかゾクゾクしちゃいますね……<emoji=heart04>」"

[[dialogue]]
speaker = "ベアトリス"
# 「あれ……？　会長さん、もうナデナデは満足しちゃったんですか……？」
line = "「あれ……？　会長さん、もうナデナデは満足しちゃったんですか……？」"

[[dialogue]]
speaker = "unk"
# 残りを一気に片づけるね！
line = "残りを一気に片づけるね！"

[[dialogue]]
speaker = "unk"
# 充分癒されたから！
line = "充分癒されたから！"

[[dialogue]]
speaker = "ベアトリス"
# 「そ、そうですよね。お仕事の邪魔しちゃったら、本末転倒ですもんねっ」
line = "「そ、そうですよね。お仕事の邪魔しちゃったら、本末転倒ですもんねっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「でもでも、私はイタズラ猫ちゃんなので～……会長さんのお膝に乗っちゃいますニャン♪」
line = "「でもでも、私はイタズラ猫ちゃんなので～……会長さんのお膝に乗っちゃいますニャン♪」"

[[dialogue]]
speaker = "unk"
# 俺が座っている更にその上にベアトのお尻が乗っかり、幸せな重みがかかる。
line = "俺が座っている更にその上にベアトのお尻が乗っかり、幸せな重みがかかる。"

[[dialogue]]
speaker = "ベアトリス"
# 「会長さんとくっつくの嬉しいニャン♪　でもお仕事の邪魔になっちゃいますかニャ？」
line = "「会長さんとくっつくの嬉しいニャン♪　でもお仕事の邪魔になっちゃいますかニャ？」"

[[dialogue]]
speaker = "ベアトリス"
# 「……大丈夫？　じゃあ、お膝の上から応援してあげますね。がんばれがんばれ、会長さんっ♪　ニャンニャンニャンっ♪」
line = "「……大丈夫？　じゃあ、お膝の上から応援してあげますね。がんばれがんばれ、会長さんっ♪　ニャンニャンニャンっ♪」"

[[dialogue]]
speaker = "unk"
# ベアトリスからの応援バフを受けながら、書類の残りを片づけ、ようやく仕事がひと段落した。
line = "ベアトリスからの応援バフを受けながら、書類の残りを片づけ、ようやく仕事がひと段落した。"

[[dialogue]]
speaker = "ベアトリス"
# 「お疲れさまでした～。ところで会長さん、どんなお仕事をされて──あっ、もしかして、作ってた書類って私が見ちゃマズいヤツでした……？」
line = "「お疲れさまでした～。ところで会長さん、どんなお仕事をされて──あっ、もしかして、作ってた書類って私が見ちゃマズいヤツでした……？」"

[[dialogue]]
speaker = "ベアトリス"
# 「……え、これ、デネブに関する報告書？　むしろ見てほしい？」
line = "「……え、これ、デネブに関する報告書？　むしろ見てほしい？」"

[[dialogue]]
speaker = "ベアトリス"
# 「そうですか、それじゃちょっとだけ拝見して～……ふむふむ、ふむふむ」
line = "「そうですか、それじゃちょっとだけ拝見して～……ふむふむ、ふむふむ」"

[[dialogue]]
speaker = "ベアトリス"
# 「──って、これ、デネブの良いところしか書いてないじゃないですか！」
line = "「──って、これ、デネブの良いところしか書いてないじゃないですか！」"

[[dialogue]]
speaker = "ベアトリス"
# 「ちょっと贔屓しすぎかも……？　だけど私のいる世界を褒めてもらえて、とっても嬉しいですっ」
line = "「ちょっと贔屓しすぎかも……？　だけど私のいる世界を褒めてもらえて、とっても嬉しいですっ」"

[[dialogue]]
speaker = "ベアトリス"
# 「これからも交流して、お互いの世界を分かり合って、好きになれるといいですよねっ」
line = "「これからも交流して、お互いの世界を分かり合って、好きになれるといいですよねっ」"

[[dialogue]]
speaker = "unk"
# 俺はベアトともっと分かり合いたい
line = "俺はベアトともっと分かり合いたい"

[[dialogue]]
speaker = "unk"
# もちろん、世界同士もだけれど
line = "もちろん、世界同士もだけれど"

[[dialogue]]
speaker = "ベアトリス"
# 「え……？　それって──」
line = "「え……？　それって──」"

[[dialogue]]
speaker = "unk"
# ベアト、俺の恋人になってくれないか
line = "ベアト、俺の恋人になってくれないか"

[[dialogue]]
speaker = "unk"
# 戦いが終わった後だから、やっと言えるよ
line = "戦いが終わった後だから、やっと言えるよ"

[[dialogue]]
speaker = "ベアトリス"
# 「え、え、ええっ……！？」
line = "「え、え、ええっ……！？」"

[[dialogue]]
speaker = "ベアトリス"
# 「か、会長さんの気持ちは、とっても嬉しいですっ。私にはもったいないくらい、ありがたいです」
line = "「か、会長さんの気持ちは、とっても嬉しいですっ。私にはもったいないくらい、ありがたいです」"

[[dialogue]]
speaker = "ベアトリス"
# 「でも、私はいつまでも光の当たる世界にはいられないんです」
line = "「でも、私はいつまでも光の当たる世界にはいられないんです」"

[[dialogue]]
speaker = "ベアトリス"
# 「いずれは暗い洞窟に帰らないといけないから……」
line = "「いずれは暗い洞窟に帰らないといけないから……」"

[[dialogue]]
speaker = "ベアトリス"
# 「本当に、本当に嬉しいですけど、会長さんの告白を受けるわけにはいかないんです。ごめんなさ──」
line = "「本当に、本当に嬉しいですけど、会長さんの告白を受けるわけにはいかないんです。ごめんなさ──」"

[[dialogue]]
speaker = "unk"
# 洞窟でも２人一緒なら寂しくないよ？
line = "洞窟でも２人一緒なら寂しくないよ？"

[[dialogue]]
speaker = "unk"
# 俺もついていくよ
line = "俺もついていくよ"

[[dialogue]]
speaker = "ベアトリス"
# 「でも、それでも、私、長生きなんですよ？　会長さんがお爺ちゃんになっても、私はずっとこの姿のままなんですよ？」
line = "「でも、それでも、私、長生きなんですよ？　会長さんがお爺ちゃんになっても、私はずっとこの姿のままなんですよ？」"

[[dialogue]]
speaker = "ベアトリス"
# 「それにずっとデネブとアルタイルが行き来できるとは限りません。もしかしたら会長さんが、アルタイルに帰れなくなるかも……」
line = "「それにずっとデネブとアルタイルが行き来できるとは限りません。もしかしたら会長さんが、アルタイルに帰れなくなるかも……」"

[[dialogue]]
speaker = "ベアトリス"
# 「それでも……いいんですか？」
line = "「それでも……いいんですか？」"

[[dialogue]]
speaker = "unk"
# 一生、君の傍にいさせてください
line = "一生、君の傍にいさせてください"

[[dialogue]]
speaker = "unk"
# それでも──
line = "それでも──"

[[dialogue]]
speaker = "ベアトリス"
# 「……！」
line = "「……！」"

[[dialogue]]
speaker = "ベアトリス"
# 「えへへ……そこまで言われたら、もう断れませんね」
line = "「えへへ……そこまで言われたら、もう断れませんね」"

[[dialogue]]
speaker = "ベアトリス"
# 「私からもお願いします。これからも、ずっとずっと、私と一緒にいてくださいね！」
line = "「私からもお願いします。これからも、ずっとずっと、私と一緒にいてくださいね！」"

[[dialogue]]
speaker = "unk"
# 俺はこの愛おしい吸血鬼に、この身が朽ちるまで愛を捧げることを誓った──
line = "俺はこの愛おしい吸血鬼に、この身が朽ちるまで愛を捧げることを誓った──"
