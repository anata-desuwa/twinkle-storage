[[dialogue]]
speaker = "unk"
# 第２話,エルデリーゼとゴールデングース,P
line = "第２話,エルデリーゼとゴールデングース,P"

[[dialogue]]
speaker = "unk"
# ある日のランチタイム。
line = "ある日のランチタイム。"

[[dialogue]]
speaker = "unk"
# ゴールデングースのヒマワリとミウ、そして、俺とエルゼの４人でカフェテリアのテーブルを囲っていた。
line = "ゴールデングースのヒマワリとミウ、そして、俺とエルゼの４人でカフェテリアのテーブルを囲っていた。"

[[dialogue]]
speaker = "unk"
# この前のお仕事で知り合ったんだっけ？
line = "この前のお仕事で知り合ったんだっけ？"

[[dialogue]]
speaker = "unk"
# 珍しい組み合わせだけど
line = "珍しい組み合わせだけど"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ヒマワリ様もミウ様も同じ流星学園附属校生なのですけど、学年とクラスが違いましたので今まで交流はありませんでしたの」
line = "「ヒマワリ様もミウ様も同じ流星学園附属校生なのですけど、学年とクラスが違いましたので今まで交流はありませんでしたの」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「けれど、先日の事件を機にすっかり仲良くなりましたわ♪」
line = "「けれど、先日の事件を機にすっかり仲良くなりましたわ♪」"

[[dialogue]]
speaker = "ミウ"
# 「その節はご迷惑をおかけしてしまい、申し訳ありませんでした」
line = "「その節はご迷惑をおかけしてしまい、申し訳ありませんでした」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「お気になさらないでくださいな。私の方こそ事情も知らないのに首を突っ込んでしまいましたわ」
line = "「お気になさらないでくださいな。私の方こそ事情も知らないのに首を突っ込んでしまいましたわ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「結果オーライってことで！　いろいろあったけど、エルゼ先輩と仲良くなれて良かったー！」
line = "「結果オーライってことで！　いろいろあったけど、エルゼ先輩と仲良くなれて良かったー！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「今後もより一層、交流を深めて参りましょうね」
line = "「今後もより一層、交流を深めて参りましょうね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「できましたら、私も一友人として接していただければと思いますの」
line = "「できましたら、私も一友人として接していただければと思いますの」"

[[dialogue]]
speaker = "ヒマワリ"
# 「それは、つまり……お嬢様扱いはしないで欲しいってこと？」
line = "「それは、つまり……お嬢様扱いはしないで欲しいってこと？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「その通りですわ。私は桜十路の血筋に生まれたというだけ。私自身は偉くもなんともありませんの」
line = "「その通りですわ。私は桜十路の血筋に生まれたというだけ。私自身は偉くもなんともありませんの」"

[[dialogue]]
speaker = "ミウ"
# 「五名門のお嬢様相手となると、どうしても恐縮してしまいますけど、エルデリーゼ先輩がそうおっしゃるのでしたら」
line = "「五名門のお嬢様相手となると、どうしても恐縮してしまいますけど、エルデリーゼ先輩がそうおっしゃるのでしたら」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ふふっ、ありがとうございます♪」
line = "「ふふっ、ありがとうございます♪」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「では早速なのですが、友人としてお伺いしてもよろしいかしら？　ヒマワリ様とミウ様はあの事務所でお仕事をされてるのですわよね？」
line = "「では早速なのですが、友人としてお伺いしてもよろしいかしら？　ヒマワリ様とミウ様はあの事務所でお仕事をされてるのですわよね？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「ふっふっふー、その通りです。あたしたちこそ泣く子も黙る秘密結社ゴールデングース！」
line = "「ふっふっふー、その通りです。あたしたちこそ泣く子も黙る秘密結社ゴールデングース！」"

[[dialogue]]
speaker = "ミウ"
# 「本当はあまり名乗らないように社長から言われてるんですけどね」
line = "「本当はあまり名乗らないように社長から言われてるんですけどね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「先日の九浄家での一件もなのですけど……とても危険なお仕事なのでしょう？」
line = "「先日の九浄家での一件もなのですけど……とても危険なお仕事なのでしょう？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「そうだね。ゴールデングースのお仕事はいつだって危険と背中合わせ、なんたってアウトローだからね！」
line = "「そうだね。ゴールデングースのお仕事はいつだって危険と背中合わせ、なんたってアウトローだからね！」"

[[dialogue]]
speaker = "ミウ"
# 「私たちのアウトローぶりは、エルデリーゼ先輩にはちょっと刺激が強すぎるかもしれません」
line = "「私たちのアウトローぶりは、エルデリーゼ先輩にはちょっと刺激が強すぎるかもしれません」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あー、確かにねー。ミウのアレとかは、ちょっとアレかもしれないねー」
line = "「あー、確かにねー。ミウのアレとかは、ちょっとアレかもしれないねー」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「アレとはなんですの？　とても気になりますわ！」
line = "「アレとはなんですの？　とても気になりますわ！」"

[[dialogue]]
speaker = "ミウ"
# 「品行方正なエルデリーゼ先輩にお教えするのはちょっと──」
line = "「品行方正なエルデリーゼ先輩にお教えするのはちょっと──」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ふふ、期待を裏切ってしまうようで申し訳ないのですけど、私、皆様が思われているほど良い子でもありませんのよ」
line = "「ふふ、期待を裏切ってしまうようで申し訳ないのですけど、私、皆様が思われているほど良い子でもありませんのよ」"

[[dialogue]]
speaker = "unk"
# 実はちょっぴり悪い子なんだ
line = "実はちょっぴり悪い子なんだ"

[[dialogue]]
speaker = "unk"
# こう見えてエルゼはね
line = "こう見えてエルゼはね"

[[dialogue]]
speaker = "ヒマワリ"
# 「え、そうなの！？」
line = "「え、そうなの！？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「夜中にお家を抜け出して、お散歩を楽しんでますの。ね、会長様」
line = "「夜中にお家を抜け出して、お散歩を楽しんでますの。ね、会長様」"

[[dialogue]]
speaker = "ミウ"
# 「ちょっぴり意外でしたね。てっきりエルデリーゼ先輩は箱入りのお嬢様で、門限も厳守しているんだとばかり」
line = "「ちょっぴり意外でしたね。てっきりエルデリーゼ先輩は箱入りのお嬢様で、門限も厳守しているんだとばかり」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「私だって多感なお年頃の女の子ですわ。ちょっぴり悪いことだってしたくなりますのよ」
line = "「私だって多感なお年頃の女の子ですわ。ちょっぴり悪いことだってしたくなりますのよ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「えー、それじゃーさ。今度あたしたちの任務にこっそりついてきてみますー？」
line = "「えー、それじゃーさ。今度あたしたちの任務にこっそりついてきてみますー？」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「いいんですの！？」
line = "「いいんですの！？」"

[[dialogue]]
speaker = "ミウ"
# 「ヒマワリちゃん、それはさすがにセナリィ社長に話を通してからにしようよ。この前叱られたばかりでしょ？」
line = "「ヒマワリちゃん、それはさすがにセナリィ社長に話を通してからにしようよ。この前叱られたばかりでしょ？」"

[[dialogue]]
speaker = "ヒマワリ"
# 「あ、そっか。いきなり連れてくのは危ないしね。でも、セナリィ社長ってなんだかんだ優しいとこあるし、話せばわかってくれそう」
line = "「あ、そっか。いきなり連れてくのは危ないしね。でも、セナリィ社長ってなんだかんだ優しいとこあるし、話せばわかってくれそう」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ええと……セナリィ様というのは、少しだけお見かけしましたけども、おふたりの上役なのですわよね？」
line = "「ええと……セナリィ様というのは、少しだけお見かけしましたけども、おふたりの上役なのですわよね？」"

[[dialogue]]
speaker = "ミウ"
# 「ええ、そうです。裏の世界で名を馳せているバンデッド・セナリィ、その人です」
line = "「ええ、そうです。裏の世界で名を馳せているバンデッド・セナリィ、その人です」"

[[dialogue]]
speaker = "ヒマワリ"
# 「セナリィ社長もヘレナさんから特別な戦闘服を譲り受けた、選ばれし者の１人なんですよ」
line = "「セナリィ社長もヘレナさんから特別な戦闘服を譲り受けた、選ばれし者の１人なんですよ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「まあ！　つまり、私とも戦闘服仲間ですのね」
line = "「まあ！　つまり、私とも戦闘服仲間ですのね」"

[[dialogue]]
speaker = "ミウ"
# 「そういうことになりますね。セナリィ社長の素晴らしさ、そして、偉大さを語り始めたら、昼休みでは全然足りないんですけども……」
line = "「そういうことになりますね。セナリィ社長の素晴らしさ、そして、偉大さを語り始めたら、昼休みでは全然足りないんですけども……」"

[[dialogue]]
speaker = "ヒマワリ"
# 「セナリィ社長は優しくって、格好良くって、ナイスバディで最強で無敵なオトナの女性なんですよー！　あたしの理想！　目指すべき終着駅なんです！」
line = "「セナリィ社長は優しくって、格好良くって、ナイスバディで最強で無敵なオトナの女性なんですよー！　あたしの理想！　目指すべき終着駅なんです！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「そうなんですのね！　あの御方がそんなに素晴らしい人物だったなんて、大変興味深いですわ」
line = "「そうなんですのね！　あの御方がそんなに素晴らしい人物だったなんて、大変興味深いですわ」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「よろしければお時間の許す限り、お話を伺ってもよろしいでしょうか？」
line = "「よろしければお時間の許す限り、お話を伺ってもよろしいでしょうか？」"

[[dialogue]]
speaker = "ミウ"
# 「もちろんですよ。では、私とヒマワリちゃんがセナリィ社長に出会った時の話なんですけど──」
line = "「もちろんですよ。では、私とヒマワリちゃんがセナリィ社長に出会った時の話なんですけど──」"

[[dialogue]]
speaker = "unk"
# （セナリィも大変だなぁ……）
line = "（セナリィも大変だなぁ……）"

[[dialogue]]
speaker = "unk"
# ２人の愛が重い……
line = "２人の愛が重い……"

[[dialogue]]
speaker = "セナリィ"
# 「ふぁ……ふぇ……ふぃ……ふぇーっくしゅんっっっ！！！」
line = "「ふぁ……ふぇ……ふぃ……ふぇーっくしゅんっっっ！！！」"

[[dialogue]]
speaker = "セナリィ"
# 「イヤですわね……変なくしゃみ。ヒマワリとミウにはとても見せられない変顔になってましたわ」
line = "「イヤですわね……変なくしゃみ。ヒマワリとミウにはとても見せられない変顔になってましたわ」"

[[dialogue]]
speaker = "セナリィ"
# 「あの子たち、また何処かで私の噂でもしてるのかしら。悪い気はしないけど……重すぎる期待に応えるのも大変ですわね」
line = "「あの子たち、また何処かで私の噂でもしてるのかしら。悪い気はしないけど……重すぎる期待に応えるのも大変ですわね」"

[[dialogue]]
speaker = "ヒマワリ"
# 「月の光に照らされて、颯爽と現れたセナリィ社長っ！　狙いを定めた銃弾は、モンスターを射貫いて──！」
line = "「月の光に照らされて、颯爽と現れたセナリィ社長っ！　狙いを定めた銃弾は、モンスターを射貫いて──！」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「まあ！　それでそれで？　それからどうなりましたの！？」
line = "「まあ！　それでそれで？　それからどうなりましたの！？」"

[[dialogue]]
speaker = "ミウ"
# 「あ、ヒマワリちゃん、エルデリーゼ先輩、そろそろ時間だよ。語り足りないだろうけど、ここでストップ」
line = "「あ、ヒマワリちゃん、エルデリーゼ先輩、そろそろ時間だよ。語り足りないだろうけど、ここでストップ」"

[[dialogue]]
speaker = "ヒマワリ"
# 「えー、ここからがいいところだったのにー。ざんねーん」
line = "「えー、ここからがいいところだったのにー。ざんねーん」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「次はセナリィ様も交えて、ティーパーティーを致しましょう」
line = "「次はセナリィ様も交えて、ティーパーティーを致しましょう」"

[[dialogue]]
speaker = "ミウ"
# 「ぜひぜひ。セナリィ社長にも伝えておきますね」
line = "「ぜひぜひ。セナリィ社長にも伝えておきますね」"

[[dialogue]]
speaker = "エルデリーゼ"
# 「ふふ、楽しみですわ♪」
line = "「ふふ、楽しみですわ♪」"

[[dialogue]]
speaker = "unk"
# 附属校生たちの仲は深まり、エルゼはまた少し悪い子の道を歩んでしまうのだった。
line = "附属校生たちの仲は深まり、エルゼはまた少し悪い子の道を歩んでしまうのだった。"
