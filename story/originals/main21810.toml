[[dialogue]]
speaker = "unk"
# 第１０話,アフタートーク,B
line = "第１０話,アフタートーク,B"

[[dialogue]]
speaker = "unk"
# ベガ世界における『<ruby=ゼロス>ＸＥＬＯＳ</ruby>』との決戦から、少しして。
line = "ベガ世界における『<ruby>ＸＥＬＯＳ<rt>ゼロス</rt></ruby>』との決戦から、少しして。"

[[dialogue]]
speaker = "unk"
# その日、俺はメルエルから天界で起こった出来事の一部始終を聞くことになったのだが──
line = "その日、俺はメルエルから天界で起こった出来事の一部始終を聞くことになったのだが──"

[[dialogue]]
speaker = "クロト"
# 「……天界で大変なことが起きたとは聞いていたけど、そんなことがあっただなんて」
line = "「……天界で大変なことが起きたとは聞いていたけど、そんなことがあっただなんて」"

[[dialogue]]
speaker = "メルエル"
# 「うん。ごめんね、報せるのが遅くなっちゃって……」
line = "「うん。ごめんね、報せるのが遅くなっちゃって……」"

[[dialogue]]
speaker = "クロト"
# 「謝るのはこっちの方だ。よくラストナンバーを退けてくれた」
line = "「謝るのはこっちの方だ。よくラストナンバーを退けてくれた」"

[[dialogue]]
speaker = "クロト"
# 「まさか最終決戦の前に、世界の危機が一度迫っていただなんて……想像もしてなかったから」
line = "「まさか最終決戦の前に、世界の危機が一度迫っていただなんて……想像もしてなかったから」"

[[dialogue]]
speaker = "クロト"
# 「それにしても大変だったんじゃないか？　メルエルが魔王因子を全て捨てちゃっただなんて……」
line = "「それにしても大変だったんじゃないか？　メルエルが魔王因子を全て捨てちゃっただなんて……」"

[[dialogue]]
speaker = "メルエル"
# 「そ、そうだね～……ナターシャちゃんのお母さんは寝込んじゃったとか、なんとか……」
line = "「そ、そうだね～……ナターシャちゃんのお母さんは寝込んじゃったとか、なんとか……」"

[[dialogue]]
speaker = "unk"
# そりゃそうだろう。２０００年以上前から続けてきた一族のお役目が、いきなりなくなってしまったんだから。
line = "そりゃそうだろう。２０００年以上前から続けてきた一族のお役目が、いきなりなくなってしまったんだから。"

[[dialogue]]
speaker = "クロト"
# 「でも……そうなるとナターシャの役目はどうなるんだ？　まさか天界に帰っちゃったりとか──」
line = "「でも……そうなるとナターシャの役目はどうなるんだ？　まさか天界に帰っちゃったりとか──」"

[[dialogue]]
speaker = "メルエル"
# 「あ、そのことなんだけど……」
line = "「あ、そのことなんだけど……」"

[[dialogue]]
speaker = "ナターシャ"
# 「お邪魔しまーす。会長さん、選管からの連絡事項が──」
line = "「お邪魔しまーす。会長さん、選管からの連絡事項が──」"

[[dialogue]]
speaker = "メルエル"
# 「あっ！　ナターシャちゃん！！」
line = "「あっ！　ナターシャちゃん！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「げっ、メルエル。失礼しましたー」
line = "「げっ、メルエル。失礼しましたー」"

[[dialogue]]
speaker = "メルエル"
# 「も～っ！　どうしてそういうこと言うのー！？　一緒にお話しようよ～っ！」
line = "「も～っ！　どうしてそういうこと言うのー！？　一緒にお話しようよ～っ！」"

[[dialogue]]
speaker = "unk"
# ナターシャは「はぁぁ～～」と、これ見よがしに大きなため息をつきながら、俺に選管の書類を渡してくる。
line = "ナターシャは「はぁぁ～～」と、これ見よがしに大きなため息をつきながら、俺に選管の書類を渡してくる。"

[[dialogue]]
speaker = "クロト"
# 「ありがとう、ナターシャ。あとで梨緒に返事しておくよ。ところで──」
line = "「ありがとう、ナターシャ。あとで梨緒に返事しておくよ。ところで──」"

[[dialogue]]
speaker = "ナターシャ"
# 「ん？」
line = "「ん？」"

[[dialogue]]
speaker = "クロト"
# 「メルエルから天界で起こったことを色々聞いてたんだが……君はこれからどうなるんだ？」
line = "「メルエルから天界で起こったことを色々聞いてたんだが……君はこれからどうなるんだ？」"

[[dialogue]]
speaker = "クロト"
# 「まさか別の仕事のために、天界に戻ったりとか……」
line = "「まさか別の仕事のために、天界に戻ったりとか……」"

[[dialogue]]
speaker = "ナターシャ"
# 「何、もしかして戻ってほしいの？」
line = "「何、もしかして戻ってほしいの？」"

[[dialogue]]
speaker = "クロト"
# 「……そうなったら寂しいから、確認したいなって」
line = "「……そうなったら寂しいから、確認したいなって」"

[[dialogue]]
speaker = "ナターシャ"
# 「確かに聖庭園のエージェントとして、お姫様を守る役目はなくなったよ。お姫様が軽率に、その立場を捨てちゃったからね」
line = "「確かに聖庭園のエージェントとして、お姫様を守る役目はなくなったよ。お姫様が軽率に、その立場を捨てちゃったからね」"

[[dialogue]]
speaker = "メルエル"
# 「だって余計なしがらみなしで、ナターシャちゃんと一緒にいたかったんだもん……」
line = "「だって余計なしがらみなしで、ナターシャちゃんと一緒にいたかったんだもん……」"

[[dialogue]]
speaker = "ナターシャ"
# 「……はぁ。ほんっと能天気だよね。ともかく天界の魔王の血統はもういない。だけどうちの母さん、強情でさ」
line = "「……はぁ。ほんっと能天気だよね。ともかく天界の魔王の血統はもういない。だけどうちの母さん、強情でさ」"

[[dialogue]]
speaker = "ナターシャ"
# 「『姫が魔王でなくなったとしても、リガルタ様の娘なのだから守りなさい』ってうるさいんだよね」
line = "「『姫が魔王でなくなったとしても、リガルタ様の娘なのだから守りなさい』ってうるさいんだよね」"

[[dialogue]]
speaker = "ナターシャ"
# 「聞いてやる義理もないけど、人間界にいた方が私も気が楽だし──ってわけで、もうしばらくこっちにいることにしたよ」
line = "「聞いてやる義理もないけど、人間界にいた方が私も気が楽だし──ってわけで、もうしばらくこっちにいることにしたよ」"

[[dialogue]]
speaker = "ナターシャ"
# 「少なくとも、メルエルが卒業するまでは、新星学園に通うつもり」
line = "「少なくとも、メルエルが卒業するまでは、新星学園に通うつもり」"

[[dialogue]]
speaker = "クロト"
# 「そうか……よかった。それじゃあこれからもよろしく、ナターシャ」
line = "「そうか……よかった。それじゃあこれからもよろしく、ナターシャ」"

[[dialogue]]
speaker = "ナターシャ"
# 「こちらこそ。ってわけでさ、会長さん。メルエルの手綱、ちゃんと握っておいてよ」
line = "「こちらこそ。ってわけでさ、会長さん。メルエルの手綱、ちゃんと握っておいてよ」"

[[dialogue]]
speaker = "メルエル"
# 「どういうことぉ！？」
line = "「どういうことぉ！？」"

[[dialogue]]
speaker = "ナターシャ"
# 「もー朝も昼も夜も、ナターシャちゃんナターシャちゃんってやかましいんだよね。人目も気にせずベタベタしてくるし……」
line = "「もー朝も昼も夜も、ナターシャちゃんナターシャちゃんってやかましいんだよね。人目も気にせずベタベタしてくるし……」"

[[dialogue]]
speaker = "メルエル"
# 「だって少し前まで、喧嘩で距離が開いてたし……！　反動が来ちゃうのも仕方ないよぉ！！」
line = "「だって少し前まで、喧嘩で距離が開いてたし……！　反動が来ちゃうのも仕方ないよぉ！！」"

[[dialogue]]
speaker = "ナターシャ"
# 「仕方なくない。ベタベタする人付き合い、好きじゃないって言ってるじゃん」
line = "「仕方なくない。ベタベタする人付き合い、好きじゃないって言ってるじゃん」"

[[dialogue]]
speaker = "ナターシャ"
# 「それじゃ──会長さん。またね」
line = "「それじゃ──会長さん。またね」"

[[dialogue]]
speaker = "メルエル"
# 「あ～っ！　待ってよぉ、ナターシャちゃん！！」
line = "「あ～っ！　待ってよぉ、ナターシャちゃん！！」"

[[dialogue]]
speaker = "メルエル"
# 「ちょうど放課後だし、一緒にこの前の猫カフェでも行こっ。ね？」
line = "「ちょうど放課後だし、一緒にこの前の猫カフェでも行こっ。ね？」"

[[dialogue]]
speaker = "ナターシャ"
# 「また？　あんまり気乗りしないなぁ」
line = "「また？　あんまり気乗りしないなぁ」"

[[dialogue]]
speaker = "メルエル"
# 「え～、でも猫ちゃんを抱っこしてる時のナターシャちゃん、嬉しそうだったよ？　証拠の写真もあるし！」
line = "「え～、でも猫ちゃんを抱っこしてる時のナターシャちゃん、嬉しそうだったよ？　証拠の写真もあるし！」"

[[dialogue]]
speaker = "ナターシャ"
# 「そうやってパシャパシャ勝手に撮ってくるお気楽天使がいるから気乗りしないって言ってるの──」
line = "「そうやってパシャパシャ勝手に撮ってくるお気楽天使がいるから気乗りしないって言ってるの──」"

[[dialogue]]
speaker = "unk"
# メルエルは相変わらず底抜けに明るい笑顔を浮かべていて。
line = "メルエルは相変わらず底抜けに明るい笑顔を浮かべていて。"

[[dialogue]]
speaker = "unk"
# ナターシャもなんだかんだで、まんざらでもない微笑みを返している──
line = "ナターシャもなんだかんだで、まんざらでもない微笑みを返している──"

[[dialogue]]
speaker = "unk"
# そのまま２人は、星徒会室を出て行って──俺だけが残される。
line = "そのまま２人は、星徒会室を出て行って──俺だけが残される。"

[[dialogue]]
speaker = "クロト"
# 「……仲直りできたみたいで、何よりだな」
line = "「……仲直りできたみたいで、何よりだな」"

[[dialogue]]
speaker = "unk"
# リガルタ老の血を引く者から、魔王因子は完全に失われた。そのことがきっかけで、今後も何かトラブルが起きるかもしれないけれど。
line = "リガルタ老の血を引く者から、魔王因子は完全に失われた。そのことがきっかけで、今後も何かトラブルが起きるかもしれないけれど。"

[[dialogue]]
speaker = "unk"
# 世界のために戦ってくれた頼もしい天使の戦友たちのためならば、俺も協力は惜しまない。
line = "世界のために戦ってくれた頼もしい天使の戦友たちのためならば、俺も協力は惜しまない。"

[[dialogue]]
speaker = "クロト"
# 「さて──仕事、片付けるかな」
line = "「さて──仕事、片付けるかな」"

[[dialogue]]
speaker = "unk"
# うららかで平和な午後の星徒会室で、俺はナターシャから渡された書類に目を通すのだった──
line = "うららかで平和な午後の星徒会室で、俺はナターシャから渡された書類に目を通すのだった──"
