[[dialogue]]
speaker = "unk"
# 第２話,『ラクシャの提案』,B
line = "第２話,『ラクシャの提案』,B"

[[dialogue]]
speaker = "unk"
# それからしばらくして、デネブに<ruby=ラクシャ>市倉環</ruby>がやって来た、ある日のこと──
line = "それからしばらくして、デネブに<ruby>市倉環<rt>ラクシャ</rt></ruby>がやって来た、ある日のこと──"

[[dialogue]]
speaker = "ラクシャ"
# 「ルヴィネさま、何だか、忙しいみたいだね～」
line = "「ルヴィネさま、何だか、忙しいみたいだね～」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ええ、ここ最近はアルタイルに通い詰めて、ハロウィンについて学ばせてもらっているわ」
line = "「ええ、ここ最近はアルタイルに通い詰めて、ハロウィンについて学ばせてもらっているわ」"

[[dialogue]]
speaker = "ラクシャ"
# 「ハロウィン？　なんでまたハロウィンのことなんて勉強し始めたの？」
line = "「ハロウィン？　なんでまたハロウィンのことなんて勉強し始めたの？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「マグダレナに勧められたのよ」
line = "「マグダレナに勧められたのよ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「女神の修行として、この世界の色々なことに主観的に関わってみてはどうか、って」
line = "「女神の修行として、この世界の色々なことに主観的に関わってみてはどうか、って」"

[[dialogue]]
speaker = "ルヴィネ"
# 「それで、もうそろそろハロウィンの時期だから、まずはそれを体験してみてはどうかってね」
line = "「それで、もうそろそろハロウィンの時期だから、まずはそれを体験してみてはどうかってね」"

[[dialogue]]
speaker = "ルヴィネ"
# 「せっかくハロウィンを体験するのなら、デネブでもアルタイルのように大きなハロウィンパーティーを開きたいと思っているのよ」
line = "「せっかくハロウィンを体験するのなら、デネブでもアルタイルのように大きなハロウィンパーティーを開きたいと思っているのよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「言われてみると、デネブの復興は進んでるけど、そういうお祭りごとはご無沙汰になってる感じだねー」
line = "「言われてみると、デネブの復興は進んでるけど、そういうお祭りごとはご無沙汰になってる感じだねー」"

[[dialogue]]
speaker = "ラクシャ"
# 「世界の脅威も無くなったし、デネブでもハロウィンパーティーを、っていうのはいい考えだって思いますよ♪」
line = "「世界の脅威も無くなったし、デネブでもハロウィンパーティーを、っていうのはいい考えだって思いますよ♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「極星星徒会のみんなにも話してみたのだけれど、きっと喜んでくれるだろうって賛成してくれたわ」
line = "「極星星徒会のみんなにも話してみたのだけれど、きっと喜んでくれるだろうって賛成してくれたわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「だから、そのパーティーのためにアルタイルのハロウィン有識者に様々なことを教えてもらっているのよ」
line = "「だから、そのパーティーのためにアルタイルのハロウィン有識者に様々なことを教えてもらっているのよ」"

[[dialogue]]
speaker = "ラクシャ"
# 「ハロウィンの有識者……っていうと、あのキャラの濃い実行委員長のことかな？」
line = "「ハロウィンの有識者……っていうと、あのキャラの濃い実行委員長のことかな？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「キャナンシーね。ちょっと疲れるヒトではあるけれど、ハロウィンに対する知識と熱意は本物だわ」
line = "「キャナンシーね。ちょっと疲れるヒトではあるけれど、ハロウィンに対する知識と熱意は本物だわ」"

[[dialogue]]
speaker = "ルヴィネ"
# 「今日もこれから彼女のところに行って勉強するところだったの」
line = "「今日もこれから彼女のところに行って勉強するところだったの」"

[[dialogue]]
speaker = "ラクシャ"
# 「あー、そうだったんだ。これはちょっと間が悪かったかな～？」
line = "「あー、そうだったんだ。これはちょっと間が悪かったかな～？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「どうかしたの？」
line = "「どうかしたの？」"

[[dialogue]]
speaker = "ラクシャ"
# 「えっと、ほら。ルヴィネさまと守護天使たちとの間で、契約を結び直そうって話があったじゃないですか」
line = "「えっと、ほら。ルヴィネさまと守護天使たちとの間で、契約を結び直そうって話があったじゃないですか」"

[[dialogue]]
speaker = "unk"
# 正確には、先代の女神であるテルルから譲り受けた段階で、ルヴィネと守護天使たちの間に主従関係は成立していた。
line = "正確には、先代の女神であるテルルから譲り受けた段階で、ルヴィネと守護天使たちの間に主従関係は成立していた。"

[[dialogue]]
speaker = "unk"
# しかし、両者の関係をより強固なものにするために、改めて契約を行うということになっていたのだ。
line = "しかし、両者の関係をより強固なものにするために、改めて契約を行うということになっていたのだ。"

[[dialogue]]
speaker = "ラクシャ"
# 「<ruby=ゼロス>『ＸＥＬＯＳ』</ruby>との戦いで受けたダメージが深かったんで契約を先送りにさせてもらってたんだけど──」
line = "「<ruby>『ＸＥＬＯＳ』<rt>ゼロス</rt></ruby>との戦いで受けたダメージが深かったんで契約を先送りにさせてもらってたんだけど──」"

[[dialogue]]
speaker = "ラクシャ"
# 「それもだいぶ回復してきたんで、そろそろパスの繋ぎ直しをお願いしようかなーって」
line = "「それもだいぶ回復してきたんで、そろそろパスの繋ぎ直しをお願いしようかなーって」"

[[dialogue]]
speaker = "ルヴィネ"
# 「その件についてなのだけれど……オオヒメとの契約の時に想定外のことが起きてしまったの。だから今は、全員に対して再契約は保留しているわ」
line = "「その件についてなのだけれど……オオヒメとの契約の時に想定外のことが起きてしまったの。だから今は、全員に対して再契約は保留しているわ」"

[[dialogue]]
speaker = "ラクシャ"
# 「あれから特に、世界の摂理への影響は出ていないみたいだけど？」
line = "「あれから特に、世界の摂理への影響は出ていないみたいだけど？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「オオヒメからもそう聞いているわ。けれど、少し慎重になってしまっていて……」
line = "「オオヒメからもそう聞いているわ。けれど、少し慎重になってしまっていて……」"

[[dialogue]]
speaker = "ラクシャ"
# 「だったら、ボクでもう一度試してみようよ！」
line = "「だったら、ボクでもう一度試してみようよ！」"

[[dialogue]]
speaker = "ルヴィネ"
# 「…………いいのかしら？」
line = "「…………いいのかしら？」"

[[dialogue]]
speaker = "ラクシャ"
# 「大丈夫じゃないかなー。少しずつでも試して行かないことには何も分からないことだし、それに契約することで新たな力が目覚めるかもしれないんでしょ？」
line = "「大丈夫じゃないかなー。少しずつでも試して行かないことには何も分からないことだし、それに契約することで新たな力が目覚めるかもしれないんでしょ？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ええ、そうね……」
line = "「ええ、そうね……」"

[[dialogue]]
speaker = "ルヴィネ"
# 「わかったわ。では、今から契約しましょう」
line = "「わかったわ。では、今から契約しましょう」"

[[dialogue]]
speaker = "unk"
# ルヴィネがラクシャの前に手をかざす。
line = "ルヴィネがラクシャの前に手をかざす。"

[[dialogue]]
speaker = "unk"
# その手のひらが仄かな光を発し、ラクシャの身体を包み込んで──
line = "その手のひらが仄かな光を発し、ラクシャの身体を包み込んで──"

[[dialogue]]
speaker = "ルヴィネ"
# 「終わったわ。…………って、ええっ！？」
line = "「終わったわ。…………って、ええっ！？」"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、ルヴィネさま。この格好ってもしかして……」
line = "「あはは、ルヴィネさま。この格好ってもしかして……」"

[[dialogue]]
speaker = "ルヴィネ"
# 「最近、ずっとハロウィン漬け……だったからかしら……」
line = "「最近、ずっとハロウィン漬け……だったからかしら……」"

[[dialogue]]
speaker = "ラクシャ"
# 「あー、やっぱそれが影響しちゃったんだ？」
line = "「あー、やっぱそれが影響しちゃったんだ？」"

[[dialogue]]
speaker = "ルヴィネ"
# 「オオヒメの時も契約の影響で、元の姿に変化が起きてしまったのだけれど……」
line = "「オオヒメの時も契約の影響で、元の姿に変化が起きてしまったのだけれど……」"

[[dialogue]]
speaker = "ルヴィネ"
# 「守護天使に相応しい姿であるならまだしも、こんな浮かれた格好にしてしまうなんて……ごめんなさい、ラクシャ」
line = "「守護天使に相応しい姿であるならまだしも、こんな浮かれた格好にしてしまうなんて……ごめんなさい、ラクシャ」"

[[dialogue]]
speaker = "ラクシャ"
# 「いやいや、ぜーんぜんオッケーだよ、これ！　超ロックな感じでカッコイイしね♪」
line = "「いやいや、ぜーんぜんオッケーだよ、これ！　超ロックな感じでカッコイイしね♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「思い出しちゃうなー。ライブハウスやら音楽フェスなんかでバイトしてた時のこと……その時にステージで暴れてた演者さんの衣装みたいだ」
line = "「思い出しちゃうなー。ライブハウスやら音楽フェスなんかでバイトしてた時のこと……その時にステージで暴れてた演者さんの衣装みたいだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「あ、そうだ、いいこと思いついたかも！　ルヴィネさまはハロウィンのことを勉強して、デネブでもパーティーを開こうとしてるんだよね？」
line = "「あ、そうだ、いいこと思いついたかも！　ルヴィネさまはハロウィンのことを勉強して、デネブでもパーティーを開こうとしてるんだよね？」"

[[dialogue]]
speaker = "ラクシャ"
# 「だったらボクもそのパーティーに参加させてよ♪」
line = "「だったらボクもそのパーティーに参加させてよ♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「えっ？　あなたが？」
line = "「えっ？　あなたが？」"

[[dialogue]]
speaker = "ラクシャ"
# 「ほら、ルヴィネさまだけじゃなくて、<ruby=ボクたち>守護天使</ruby>がこういった行事に参加することも、意味があると思うんだよね」
line = "「ほら、ルヴィネさまだけじゃなくて、<ruby>守護天使<rt>ボクたち</rt></ruby>がこういった行事に参加することも、意味があると思うんだよね」"

[[dialogue]]
speaker = "ラクシャ"
# 「せっかくこんなにロックでハロウィンな格好になれたんだし、守護天使のみんなでバンドでもやってみようかなって♪」
line = "「せっかくこんなにロックでハロウィンな格好になれたんだし、守護天使のみんなでバンドでもやってみようかなって♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ラクシャ……」
line = "「ラクシャ……」"

[[dialogue]]
speaker = "ラクシャ"
# 「だからボクたちに、ルヴィネさまの企画したパーティーで演奏させてよ♪」
line = "「だからボクたちに、ルヴィネさまの企画したパーティーで演奏させてよ♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「音楽は人を元気にしてくれるからね。きっとパーティーも盛り上がって、復興に励むデネブのみんなも大喜びだよ♪」
line = "「音楽は人を元気にしてくれるからね。きっとパーティーも盛り上がって、復興に励むデネブのみんなも大喜びだよ♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「……そうね。じゃあお願いするわ」
line = "「……そうね。じゃあお願いするわ」"

[[dialogue]]
speaker = "ラクシャ"
# 「よーし、そうと決まったら準備を始めないと。それじゃルヴィネさま、ありがとうございましたー♪」
line = "「よーし、そうと決まったら準備を始めないと。それじゃルヴィネさま、ありがとうございましたー♪」"

[[dialogue]]
speaker = "ルヴィネ"
# 「ぁ……」
line = "「ぁ……」"

[[dialogue]]
speaker = "ルヴィネ"
# 「また、気を遣ってもらっちゃったかしら……」
line = "「また、気を遣ってもらっちゃったかしら……」"

[[dialogue]]
speaker = "unk"
# 自嘲気味に微笑みながらも、素晴らしい部下を残してくれた先代の女神テルルに感謝の呟きを漏らす。
line = "自嘲気味に微笑みながらも、素晴らしい部下を残してくれた先代の女神テルルに感謝の呟きを漏らす。"

[[dialogue]]
speaker = "unk"
# しかし──
line = "しかし──"

[[dialogue]]
speaker = "ルヴィネ"
# 「でも、守護天使たちのバンドって……あの子たち、ちゃんとできるのかしら？」
line = "「でも、守護天使たちのバンドって……あの子たち、ちゃんとできるのかしら？」"

[[dialogue]]
speaker = "ラクシャ"
# 「あ、いたいた発見！　おーい、マグダレナ！」
line = "「あ、いたいた発見！　おーい、マグダレナ！」"

[[dialogue]]
speaker = "マグダレナ"
# 「ラクシャではありませんか。あなたもデネブに来ていたのですか？」
line = "「ラクシャではありませんか。あなたもデネブに来ていたのですか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「うん。ルヴィネさまに再契約してもらいにね。今、それが終わったところだよ」
line = "「うん。ルヴィネさまに再契約してもらいにね。今、それが終わったところだよ」"

[[dialogue]]
speaker = "マグダレナ"
# 「再契約を？　それで、何事もなく無事に契約できましたか？」
line = "「再契約を？　それで、何事もなく無事に契約できましたか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「そうだね！　予想外のことは起きたけど、摂理の管理も能力についても問題なし♪　契約したことで、新しい力も発現したしね」
line = "「そうだね！　予想外のことは起きたけど、摂理の管理も能力についても問題なし♪　契約したことで、新しい力も発現したしね」"

[[dialogue]]
speaker = "ラクシャ"
# 「ちょっとそれを見てもらおうかと思って♪　それじゃ行くよ～」
line = "「ちょっとそれを見てもらおうかと思って♪　それじゃ行くよ～」"

[[dialogue]]
speaker = "ラクシャ"
# 「じゃーん。これがルヴィネさまとの契約で発現した、ボクの新しい姿だよ！」
line = "「じゃーん。これがルヴィネさまとの契約で発現した、ボクの新しい姿だよ！」"

[[dialogue]]
speaker = "マグダレナ"
# 「あら、これは……どことなくハロウィン風味のようですね？」
line = "「あら、これは……どことなくハロウィン風味のようですね？」"

[[dialogue]]
speaker = "ラクシャ"
# 「そうなんだよ。マグダレナがルヴィネさまに勧めたんだよね？　ハロウィンを『体験』してみたらどうか、って」
line = "「そうなんだよ。マグダレナがルヴィネさまに勧めたんだよね？　ハロウィンを『体験』してみたらどうか、って」"

[[dialogue]]
speaker = "ラクシャ"
# 「ルヴィネさまは今、ハロウィンについての勉強の真っ最中でさ、どうやらその事で頭がいっぱいになってたみたいなんだ」
line = "「ルヴィネさまは今、ハロウィンについての勉強の真っ最中でさ、どうやらその事で頭がいっぱいになってたみたいなんだ」"

[[dialogue]]
speaker = "ラクシャ"
# 「それでこんな感じになっちゃった、ってわけ♪　ボクはこの格好、すごくいいと思うんだけどどうかな？」
line = "「それでこんな感じになっちゃった、ってわけ♪　ボクはこの格好、すごくいいと思うんだけどどうかな？」"

[[dialogue]]
speaker = "マグダレナ"
# 「ええ。ラクシャにとてもよく似合っていると思います」
line = "「ええ。ラクシャにとてもよく似合っていると思います」"

[[dialogue]]
speaker = "ラクシャ"
# 「あはは、ありがと。それでね、マグダレナにも協力してもらいたいことがあるんだけど」
line = "「あはは、ありがと。それでね、マグダレナにも協力してもらいたいことがあるんだけど」"

[[dialogue]]
speaker = "マグダレナ"
# 「協力ですか？　なんでしょう、私が力になれることであれば良いのですが……」
line = "「協力ですか？　なんでしょう、私が力になれることであれば良いのですが……」"

[[dialogue]]
speaker = "ラクシャ"
# 「ボクと一緒にバンドをやろう！」
line = "「ボクと一緒にバンドをやろう！」"

[[dialogue]]
speaker = "マグダレナ"
# 「…………」
line = "「…………」"

[[dialogue]]
speaker = "ラクシャ"
# 「ルヴィネさまがデネブでも、ハロウィンパーティーをやろうとしてるってことは知ってるよね？」
line = "「ルヴィネさまがデネブでも、ハロウィンパーティーをやろうとしてるってことは知ってるよね？」"

[[dialogue]]
speaker = "マグダレナ"
# 「ええ」
line = "「ええ」"

[[dialogue]]
speaker = "ラクシャ"
# 「ボクたち守護天使も、そのお手伝いが出来たらいいなって思わない？」
line = "「ボクたち守護天使も、そのお手伝いが出来たらいいなって思わない？」"

[[dialogue]]
speaker = "マグダレナ"
# 「それは、そうですね」
line = "「それは、そうですね」"

[[dialogue]]
speaker = "ラクシャ"
# 「だよね？　だからボクたちでバンドを組んで、デネブのハロウィンパーティーでライブをやろうよ♪」
line = "「だよね？　だからボクたちでバンドを組んで、デネブのハロウィンパーティーでライブをやろうよ♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「ボクは過去にライブハウスやフェスのスタッフのバイトをしてたから知ってるんだけど──」
line = "「ボクは過去にライブハウスやフェスのスタッフのバイトをしてたから知ってるんだけど──」"

[[dialogue]]
speaker = "ラクシャ"
# 「ライブってすっごい盛り上がるんだよ？　演奏者もお客さんもみんなで一体になってさ！　声を上げて、手を振って、ジャンプしてさ！」
line = "「ライブってすっごい盛り上がるんだよ？　演奏者もお客さんもみんなで一体になってさ！　声を上げて、手を振って、ジャンプしてさ！」"

[[dialogue]]
speaker = "ラクシャ"
# 「そのエネルギーっていったらとんでもない爆発力なんだから」
line = "「そのエネルギーっていったらとんでもない爆発力なんだから」"

[[dialogue]]
speaker = "ラクシャ"
# 「デネブのみんなに元気を出してもらうには、これはもうライブをするしかないって思うんだよ」
line = "「デネブのみんなに元気を出してもらうには、これはもうライブをするしかないって思うんだよ」"

[[dialogue]]
speaker = "マグダレナ"
# 「なるほど。それで私たちでバンドを組もうと……」
line = "「なるほど。それで私たちでバンドを組もうと……」"

[[dialogue]]
speaker = "ラクシャ"
# 「いい考えでしょ？」
line = "「いい考えでしょ？」"

[[dialogue]]
speaker = "マグダレナ"
# 「ええ。いささか突飛にも思える提案でしたので戸惑ってしまいましたが……良い考えだと思います」
line = "「ええ。いささか突飛にも思える提案でしたので戸惑ってしまいましたが……良い考えだと思います」"

[[dialogue]]
speaker = "マグダレナ"
# 「それなら私たちもルヴィネ様と一緒に、ハロウィンを『体験』することができますから」
line = "「それなら私たちもルヴィネ様と一緒に、ハロウィンを『体験』することができますから」"

[[dialogue]]
speaker = "マグダレナ"
# 「けれど……私は楽器を演奏した経験がありません。他の皆も同じではないでしょうか？」
line = "「けれど……私は楽器を演奏した経験がありません。他の皆も同じではないでしょうか？」"

[[dialogue]]
speaker = "ラクシャ"
# 「弾けないなら弾けるようになるまで練習すればいいんだよ！　大丈夫、その辺はちゃーんと考えてあるから♪」
line = "「弾けないなら弾けるようになるまで練習すればいいんだよ！　大丈夫、その辺はちゃーんと考えてあるから♪」"

[[dialogue]]
speaker = "マグダレナ"
# 「そうですか。では私もあなたの計画に協力させてもらいます」
line = "「そうですか。では私もあなたの計画に協力させてもらいます」"

[[dialogue]]
speaker = "ラクシャ"
# 「やったぁ、ありがとう♪　まずは１人目確保っ♪」
line = "「やったぁ、ありがとう♪　まずは１人目確保っ♪」"

[[dialogue]]
speaker = "ラクシャ"
# 「よーし、この調子で他のみんなも誘っていこう！　一緒に来てよ、マグダレナ！　ほら、レッツゴー♪」
line = "「よーし、この調子で他のみんなも誘っていこう！　一緒に来てよ、マグダレナ！　ほら、レッツゴー♪」"

[[dialogue]]
speaker = "マグダレナ"
# 「えぇえ……わ、わかりました……」
line = "「えぇえ……わ、わかりました……」"
