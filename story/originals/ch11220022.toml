[[dialogue]]
speaker = "アポロ"
# 「実際そうだぞ？　あたしの目から見てもクーシェンは、メイド修行をする前と後じゃ比べものにならないくらい強くなってる」
line = "「実際そうだぞ？　あたしの目から見てもクーシェンは、メイド修行をする前と後じゃ比べものにならないくらい強くなってる」"

[[dialogue]]
speaker = "プリムラ"
