line = "「模擬戦じゃからな、我は全然本気を出していなかったのじゃ！」"

[[dialogue]]
speaker = "クーシェン"
# 「ウキキ！　それでも勝ちは勝ちだよ～♪」
line = "「ウキキ！　それでも勝ちは勝ちだよ～♪」"

[[dialogue]]
speaker = "プリムラ"
# 「リベンジじゃ！　次は油断せぬからな！　覚悟しておくが良いぞ！」
