# 「クーシェンとプリムラがよく手合わせをしてるのは知ってたからな。模擬戦の相手としてちょうどいいと思ったんだ」
line = "「クーシェンとプリムラがよく手合わせをしてるのは知ってたからな。模擬戦の相手としてちょうどいいと思ったんだ」"

[[dialogue]]
speaker = "クーシェン"
