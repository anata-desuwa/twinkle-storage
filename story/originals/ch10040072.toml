[[dialogue]]
speaker = "unk"
# 第２話,修行ジャンキー,P
line = "第２話,修行ジャンキー,P"

[[dialogue]]
speaker = "unk"
# アポロとクーシェンのメイド修行は始まったが、そう簡単には行かなかった。
line = "アポロとクーシェンのメイド修行は始まったが、そう簡単には行かなかった。"

[[dialogue]]
speaker = "アポロ"
# 「うう～、これどうなってるんだよ……難しすぎるぞ」
line = "「うう～、これどうなってるんだよ……難しすぎるぞ」"

[[dialogue]]
speaker = "クーシェン"
# 「やめだやめだー！　ボクはこういうちまちましたの向いてないんだよ！」
line = "「やめだやめだー！　ボクはこういうちまちましたの向いてないんだよ！」"

[[dialogue]]
speaker = "クーシェン"
# 「ねえ、適当にごまかして終わりにしちゃおうよ」
line = "「ねえ、適当にごまかして終わりにしちゃおうよ」"

[[dialogue]]
speaker = "アポロ"
# 「いーや、ダメだ！　あたしはそんな悪の誘惑には乗らないぞ！　ちゃんと修行してパワーアップするんだ！」
line = "「いーや、ダメだ！　あたしはそんな悪の誘惑には乗らないぞ！　ちゃんと修行してパワーアップするんだ！」"

[[dialogue]]
speaker = "アポロ"
# 「ナミエル！　ちょっとコツ教えてくれ！」
line = "「ナミエル！　ちょっとコツ教えてくれ！」"

[[dialogue]]
speaker = "ナミエル"
# 「指導ですね？　了解しました。フニさまもこちらに来て下さい」
line = "「指導ですね？　了解しました。フニさまもこちらに来て下さい」"

[[dialogue]]
speaker = "フェニエル"
# 「あ、はいっ。お掃除のコツですよね。まず、ホウキの持ち方はこう。隅からなぞるようにすうーっと動かして下さい」
line = "「あ、はいっ。お掃除のコツですよね。まず、ホウキの持ち方はこう。隅からなぞるようにすうーっと動かして下さい」"

[[dialogue]]
speaker = "アポロ"
# 「こうか？　おおー、ゴミがきれいに集まったぞ」
line = "「こうか？　おおー、ゴミがきれいに集まったぞ」"

[[dialogue]]
speaker = "ナミエル"
# 「普段から清掃に務めていますので、汚れやゴミは見えづらいかもしれません。ですが、何もなくても掃き清めて下さい」
line = "「普段から清掃に務めていますので、汚れやゴミは見えづらいかもしれません。ですが、何もなくても掃き清めて下さい」"

[[dialogue]]
speaker = "アポロ"
# 「何もないのに掃除するのか？」
line = "「何もないのに掃除するのか？」"

[[dialogue]]
speaker = "ナミエル"
# 「何もないのではありません、何もないように見えるだけです」
line = "「何もないのではありません、何もないように見えるだけです」"

[[dialogue]]
speaker = "フェニエル"
# 「よーく目をこらさないと見えないホコリがありますからね。それを放置していると、どんどん積もっていずれ大きな汚れになっちゃいます」
line = "「よーく目をこらさないと見えないホコリがありますからね。それを放置していると、どんどん積もっていずれ大きな汚れになっちゃいます」"

[[dialogue]]
speaker = "アポロ"
# 「なるほどなー。修行とおんなじだ。すぐに結果は見えなくても、ちゃんと続けないと成長しないもんな」
line = "「なるほどなー。修行とおんなじだ。すぐに結果は見えなくても、ちゃんと続けないと成長しないもんな」"

[[dialogue]]
speaker = "ナミエル"
# 「メイドには地道な努力が欠かせません。それはメイドに限らず、全ての事象に当てはまることなのです」
line = "「メイドには地道な努力が欠かせません。それはメイドに限らず、全ての事象に当てはまることなのです」"

[[dialogue]]
speaker = "アポロ"
# 「そっか！　すごいな、ナミエルは！　教えてくれてありがとう！」
line = "「そっか！　すごいな、ナミエルは！　教えてくれてありがとう！」"

[[dialogue]]
speaker = "ナミエル"
# 「い、いえ……メイド隊の先輩方に教わったことを話しただけですから」
line = "「い、いえ……メイド隊の先輩方に教わったことを話しただけですから」"

[[dialogue]]
speaker = "フェニエル"
# 「私もナミエルちゃんも、可愛い後輩が出来て嬉しいんですよ。私たちが先輩から教わったことを、いっぱいお伝えしますからね」
line = "「私もナミエルちゃんも、可愛い後輩が出来て嬉しいんですよ。私たちが先輩から教わったことを、いっぱいお伝えしますからね」"

[[dialogue]]
speaker = "アポロ"
# 「おう！　じゃなくて、はい、先輩！　よろしくお願いします！」
line = "「おう！　じゃなくて、はい、先輩！　よろしくお願いします！」"

[[dialogue]]
speaker = "ナミエル"
# 「はい……こちらこそよろしくお願いします」
line = "「はい……こちらこそよろしくお願いします」"

[[dialogue]]
speaker = "クーシェン"
# 「ねえ、アポロたちっていつもあんな感じなの？」
line = "「ねえ、アポロたちっていつもあんな感じなの？」"

[[dialogue]]
speaker = "アポロ"
# 「あんな感じって、どんな感じだ？」
line = "「あんな感じって、どんな感じだ？」"

[[dialogue]]
speaker = "クーシェン"
# 「メイドと仲よさそうじゃん。アポロは星見家のお嬢様なんだろ？　もっとえらそうにしてるのかと思ってた」
line = "「メイドと仲よさそうじゃん。アポロは星見家のお嬢様なんだろ？　もっとえらそうにしてるのかと思ってた」"

[[dialogue]]
speaker = "アポロ"
# 「別にえらくないから、えらそうになんてしないぞ。もちろん今はメイド修行で、あたしは後輩だからな」
line = "「別にえらくないから、えらそうになんてしないぞ。もちろん今はメイド修行で、あたしは後輩だからな」"

[[dialogue]]
speaker = "クーシェン"
# 「後輩だったら、逆にちょっと馴れ馴れしくない？」
line = "「後輩だったら、逆にちょっと馴れ馴れしくない？」"

[[dialogue]]
speaker = "アポロ"
# 「そ、そうか？　でも、普段もだいたいあんな感じだぞ。みんないいやつだし、しゃべってると楽しいんだ」
line = "「そ、そうか？　でも、普段もだいたいあんな感じだぞ。みんないいやつだし、しゃべってると楽しいんだ」"

[[dialogue]]
speaker = "クーシェン"
# 「ふーん、メイド長なんかは強そうだけど、あいつらよわそーなのにねー」
line = "「ふーん、メイド長なんかは強そうだけど、あいつらよわそーなのにねー」"

[[dialogue]]
speaker = "アポロ"
# 「そう見えるかもしんないけど、弱くないぞ」
line = "「そう見えるかもしんないけど、弱くないぞ」"

[[dialogue]]
speaker = "クーシェン"
# 「そうなのか！？」
line = "「そうなのか！？」"

[[dialogue]]
speaker = "アポロ"
# 「弱かったらうちのメイドになれないし。舐めてると痛い目見るから気をつけろよ」
line = "「弱かったらうちのメイドになれないし。舐めてると痛い目見るから気をつけろよ」"

[[dialogue]]
speaker = "クーシェン"
# 「へー、逆に楽しみになってきちゃった。つまんない家事だけじゃなくて、戦闘訓練もあるんだよね？」
line = "「へー、逆に楽しみになってきちゃった。つまんない家事だけじゃなくて、戦闘訓練もあるんだよね？」"

[[dialogue]]
speaker = "アポロ"
# 「クーシェンにとってはご褒美みたいなもんだな。それを期待して、家事の方も頑張れよ！」
line = "「クーシェンにとってはご褒美みたいなもんだな。それを期待して、家事の方も頑張れよ！」"

[[dialogue]]
speaker = "クーシェン"
# 「ええー、そっちは勘弁して欲しいんだけど」
line = "「ええー、そっちは勘弁して欲しいんだけど」"

[[dialogue]]
speaker = "アポロ"
# 「楽しいだけじゃ修行にならないしな！　あたしもおしとやかなのはちょっと苦手だ。でも、修行だから頑張るぞ」
line = "「楽しいだけじゃ修行にならないしな！　あたしもおしとやかなのはちょっと苦手だ。でも、修行だから頑張るぞ」"

[[dialogue]]
speaker = "アポロ"
# 「おーい、こっち掃き終わったから、確認してくれー」
line = "「おーい、こっち掃き終わったから、確認してくれー」"

[[dialogue]]
speaker = "ナミエル"
# 「わかりました……ふむふむ」
line = "「わかりました……ふむふむ」"

[[dialogue]]
speaker = "クーシェン"
# 「うわ、いじわるなしゅーとめみたいな厳しいチェックだ」
line = "「うわ、いじわるなしゅーとめみたいな厳しいチェックだ」"

[[dialogue]]
speaker = "ナミエル"
# 「姑レベルでは困ります。我らメイドが求めるのはもっと高い基準ですから、厳しいのは当然です」
line = "「姑レベルでは困ります。我らメイドが求めるのはもっと高い基準ですから、厳しいのは当然です」"

[[dialogue]]
speaker = "フェニエル"
# 「あ、あんまり厳しくしすぎなくても……」
line = "「あ、あんまり厳しくしすぎなくても……」"

[[dialogue]]
speaker = "ナミエル"
# 「……お２人は、どちらがいいですか？」
line = "「……お２人は、どちらがいいですか？」"

[[dialogue]]
speaker = "クーシェン"
# 「ボクは厳しくないほーがいいな～、なんて」
line = "「ボクは厳しくないほーがいいな～、なんて」"

[[dialogue]]
speaker = "アポロ"
# 「あたしだって厳しいやつがいいぞ！　ナミエルたちが受けた修行くらいのを頼む！」
line = "「あたしだって厳しいやつがいいぞ！　ナミエルたちが受けた修行くらいのを頼む！」"

[[dialogue]]
speaker = "ナミエル"
# 「わかりました。では激ヤバ超難易度コースで行きます」
line = "「わかりました。では激ヤバ超難易度コースで行きます」"

[[dialogue]]
speaker = "クーシェン"
# 「ちょ！　待って待って、コース名がヤバくない！？　やっぱりボクはゆるふわコースで頼むよ～！」
line = "「ちょ！　待って待って、コース名がヤバくない！？　やっぱりボクはゆるふわコースで頼むよ～！」"

[[dialogue]]
speaker = "アポロ"
# 「厳しい方が楽しいぞ？」
line = "「厳しい方が楽しいぞ？」"

[[dialogue]]
speaker = "クーシェン"
# 「そりゃふつーの修行だったら楽しいかもだけどさ！　メイド修行の激ヤバコースなんて楽しくないって！」
line = "「そりゃふつーの修行だったら楽しいかもだけどさ！　メイド修行の激ヤバコースなんて楽しくないって！」"

[[dialogue]]
speaker = "アポロ"
# 「今はそうでも、きっとすぐ楽しくなるはずだぞ！」
line = "「今はそうでも、きっとすぐ楽しくなるはずだぞ！」"

[[dialogue]]
speaker = "ナミエル"
# 「ですね。すぐ慣れます」
line = "「ですね。すぐ慣れます」"

[[dialogue]]
speaker = "フェニエル"
# 「な、慣れるけど……慣れるまでしんどかったなぁ」
line = "「な、慣れるけど……慣れるまでしんどかったなぁ」"

[[dialogue]]
speaker = "アポロ"
# 「あたしと一緒に頑張ったらすぐだし、ちょっとの辛抱だぞ、クーシェン」
line = "「あたしと一緒に頑張ったらすぐだし、ちょっとの辛抱だぞ、クーシェン」"

[[dialogue]]
speaker = "クーシェン"
# 「うう、修行ジャンキーめぇ……」
line = "「うう、修行ジャンキーめぇ……」"

[[dialogue]]
speaker = "unk"
# クーシェンのボヤキもまるで聞こえないように、意気揚々と修行に励むアポロだった。
line = "クーシェンのボヤキもまるで聞こえないように、意気揚々と修行に励むアポロだった。"
